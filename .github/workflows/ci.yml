name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache: false
      - run: go vet ./...
        working-directory: backend
      - run: go test -race ./...
        working-directory: backend

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run verify:web
      - run: npm run verify:pages
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results-linux
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

  windows-data-and-types:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Fetch comparison base
        shell: pwsh
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          if ($env:PR_BASE_SHA) {
            git fetch --no-tags --depth=1 origin $env:PR_BASE_REF
            git fetch --no-tags --depth=1 origin $env:PR_BASE_SHA
          } elseif ($env:PUSH_BASE_SHA -and $env:PUSH_BASE_SHA -notmatch '^0+$') {
            git fetch --no-tags --depth=1 origin $env:PUSH_BASE_SHA
          }
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run scripts/archive-determinism.test.mjs
      - name: Validate only changed data files
        shell: pwsh
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          $base = if ($env:PR_BASE_SHA) { $env:PR_BASE_SHA } else { $env:PUSH_BASE_SHA }
          npm run data:validate:increment -- $base $env:HEAD_SHA
      - run: npm run typecheck
