name: Deploy to GitHub Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: pages-main
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Read current published data boundary
        run: node scripts/fetch-release-history.mjs --base https://dajiaohuang.github.io/evo/data/ --out public/data --keep 1 --max-bytes 419430400
      - name: Build the verified deployment revision
        run: npm run build
        env:
          DEPLOYMENT_COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
          VITE_PAGES_PREVIEW: 'true'
      - run: npm run pages:budget
      - run: npm run pages:smoke:preview
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5
