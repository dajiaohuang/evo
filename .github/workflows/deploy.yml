name: Deploy introduction to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'pages/**'
      - 'config/site.json'
      - 'scripts/build-pages.mjs'
      - 'scripts/check-static-pages.mjs'
      - 'scripts/retire-pages-worker.js'
      - 'public/favicon.svg'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: pages-main
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            pages
            config
            scripts/build-pages.mjs
            scripts/check-static-pages.mjs
            scripts/retire-pages-worker.js
            public/favicon.svg
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Build the verified deployment revision
        run: node scripts/build-pages.mjs
      - run: node scripts/check-static-pages.mjs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist-pages
      - id: deployment
        uses: actions/deploy-pages@v5
