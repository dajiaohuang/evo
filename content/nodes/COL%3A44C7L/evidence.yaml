        claims:
          - text: Cormous geophyte, 20-90 cm. Leaves 1-3, linear, channelled and trailing. Flowers deep yellow. Capsules oblong to ellipsoid, exserted from spathes.
            textZh: Moraea lewisiae (Goldblatt) Goldblatt 的 SANBI 物种条目记载了植株、叶片和花部形态。
            sourceIds:
              - sanbi_13878_0
            locator: Strelitzia 29; archive Morphology row 7435, source 13878.0
            placeTimeScope: Regional species account published 2012; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
          - text: The flowers of Moraea lewisiae are typical of sect. Hexaglottis in the yellow tepals with short erect claws and it is distinguished mainly by the capsules either cylindric but triangular to 3-lobed in section and 11-20 mm long or ovoid-ellipsoid and round in section, 8-15 mm long, and usually with a short beak up to 1 mm long. The tepal limbs bear yellow nectar guides at their bases dotted with fine, green to black spots. Taller M. longifolia has paler yellow tepals of similar size but lacking spotted nectar guides and the flowers have none or little scent and slightly shorter style branches, and characteristic obovoid, club-shaped capsules with obviously truncate apex and larger seeds.
            textZh: SANBI 条目提供了 Moraea lewisiae (Goldblatt) Goldblatt 的鉴别特征。
            sourceIds:
