          scope: A 2016 in situ clipping experiment and nearby naturally grazed areas in one tropical Thalassia testudinum meadow at Little Cayman, Cayman Islands. The simulated clipping treatment represents green-turtle grazing effects on the meadow; it is not an experiment on turtle populations. Results concern measured ecosystem metabolism and do not directly inventory sediment carbon stocks or establish species-wide effects.
          attribution: Johnson RA, Gulick AG, Bolten AB, Bjorndal KA (2017). Blue carbon stores in tropical seagrass meadows maintained under green turtle grazing. Scientific Reports 7, 13545. https://doi.org/10.1038/s41598-017-13142-4. Claims paraphrased.
    facets:
      morphology:
        status: not-assessed
        claims: []
        gaps:
          - The selected nesting-abundance result does not document diagnostic morphology or species-level anatomical variation.
      lifeHistory:
        status: partially-supported
        claims:
          - text: Rapid nesting surveys at Rose Atoll National Wildlife Refuge in American Samoa from 2012 through 2019 recorded 218 total female green turtles, with a minimum of 138 unique nesting females confirmed by permanent tags. The authors treat 138 as a minimum because annual surveys averaged 7.6 days and limited survey time could miss nesters. This describes the nesting population at this rookery during those eight seasons, not the species globally.
            textZh: 2012 至 2019 年间，在美属萨摩亚玫瑰环礁国家野生动物保护区开展的快速筑巢调查记录了 218 只雌性绿海龟；永久标记至少确认其中有 138 只不同的筑巢雌龟。作者将 138 只视为最低数量，因为每年平均调查 7.6 天，有限的调查时间可能漏掉部分筑巢个体。该结果描述的是这八个繁殖季中该筑巢地的种群，不代表全球物种数量。
            originalLanguage: en
            sourceIds:
              - murakawa2024roseatollgreen-turtle
            locator: Abstract; §2.2.1–2.2.2 for rapid survey effort and tagging; §4 Discussion for the minimum count and detection limitations.
            placeTimeScope: Rose Atoll National Wildlife Refuge, American Samoa; nesting seasons from 2012 through 2019; free-living nesting females.
            lifeStatus: Wild nesting females at one rookery; captive, domesticated, and fossil evidence was not assessed.
        gaps:
          - An eight-season rapid-survey minimum at one rookery does not establish the full reproductive life history, lifetime fecundity, population trend, or species-wide nesting abundance.
      ecology:
        status: partially-supported
        claims:
          - text: At a Thalassia testudinum meadow in Little Cayman, experimentally clipped plots used to simulate green-turtle grazing had mean net ecosystem production (NEP) 79% lower than unclipped reference plots (24.7 versus 119.5 mmol C m−2 d−1); the 12-week mean remained positive, although clipped plots were slightly heterotrophic (NEP < 0) on weeks one and nine when overcast sampling days lowered gross primary production. Nearby areas continuously grazed by juvenile green turtles for at least a year had NEP 92% lower than adjacent ungrazed areas on average. The production-to-respiration ratio did not differ significantly among treatments (ANOVA, p = 0.16). These measurements describe one meadow; they do not directly quantify sediment carbon stocks or establish a population-wide effect.
            textZh: 在开曼群岛小开曼岛一处 Thalassia testudinum 海草床中，为模拟绿海龟取食而实验性剪除海草的样地，其平均净生态系统生产力（NEP）比未剪除对照低 79%（24.7 对 119.5 mmol C m−2 d−1）；12 周的平均 NEP 仍为正值，但第 1 周和第 9 周阴天测量时，因总初级生产力较低，剪除样地曾略呈异养（NEP < 0）。附近由幼年绿海龟连续取食至少一年维持的区域，其 NEP 平均比相邻未取食区域低 92%。不同处理间的生产/呼吸比没有显著差异（方差分析，p = 0.16）。这些测量只描述一处海草床；研究没有直接量化沉积物碳储量，也不能证明整个物种或种群的普遍效应。
            originalLanguage: en
            sourceIds:
              - johnson2017greenturtlegrazingcarbon
            locator: Abstract; Results, Table 1, the overcast-day exceptions in weeks one and nine, and naturally grazed areas; Discussion.
            placeTimeScope: Little Cayman, Cayman Islands, in 2016, at a tropical Thalassia testudinum meadow. Five clipped and five reference plots were measured weekly during a 12-week experiment. Nearby areas had been naturally and continuously grazed by juvenile green turtles for at least one year. Results are specific to this meadow, experimental period, and comparison; they are not a range-wide estimate.
            lifeStatus: Wild green turtles maintained the nearby natural grazing areas; experimental clipping simulated grazing in seagrass plots and was not itself a turtle-population experiment.
        gaps:
          - The selected claim is a rookery-specific nesting count and does not establish diet, habitat relationships, or ecological interactions.
          - One 2016 meadow study does not establish global or population-wide effects, responses in other seagrass species or sites, or long-term changes in sediment carbon stocks.
          - The experimentally clipped plots simulate grazing; the natural-grazing comparison is local to Little Cayman and does not establish a general dose-response across turtle populations.
          - The study does not establish green turtle diet composition, full habitat use, distribution, demographic trends, or conservation status.
      evolution:
        status: not-assessed
        claims: []
        gaps:
          - The selected study does not analyze phylogeny or evolutionary history.
      distribution:
        status: not-assessed
        claims: []
        gaps:
          - One nesting site does not establish the species' global or regional distribution.
      fossil:
        status: not-assessed
        claims: []
        gaps:
          - The selected study does not assess fossil occurrences or geological age.
      conservation:
        status: not-assessed
        claims: []
        gaps:
          - The selected local nesting count is not a species-wide or population-unit conservation assessment.
