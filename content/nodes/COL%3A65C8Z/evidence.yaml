        usage:
          title: Aeschynomene sensitiva Sw., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: "Herbs to 4 m tall; stems glabrous to glabrate below, fruiting branches glabrous to moderately hispidulous with glandular trichomes. Leaves 2-10 cm long, 10-40 foliolate, petiole and rachis hispidulous; leaflets oblong, obtuse to truncate, 4-15 mm long, 1.5-3.0 mm wide, the costae central, the nerves inconspicuous, mi- nutely punctate adaxially; stipules appendiculate below the point of attachment, caducous, 5-20 mm long, 1.5-5.0 mm wide, subentire, acute to acuminate above, truncate below, erose. Inflorescence racemose, axillary, 4-8 flowered; peduncles and pedicels subglabrous to densely hispidulous; bracts stipuliform, entire to ciliate-laciniate; bracteoles ovate, subacute, 1.5-5.0 mm long, 1-2 mm wide, en- tire to ciliate. Flowers yellow, 5-6 mm long; calyx 2-4 mm long, usually ciliate, vexillar lobe emarginate or subdenticulate, the cardinal lobe obscurely 3-dentate, standard 6-8 mm long, the claw 1.5-2.0 mm long, the blade suborbiculate, 4.5- 6.0 mm wide, ciliate, sometimes retuse, wings and keel subequal to the standard, the claws 0.5-1.0 mm long, blades 3.5-7.0 mm long, 2.5-3.5 mm wide; stamens 5-7 mm long. Fruit a loment, 5-8 (rarely -10) articulate, stipe 4-8 mm long, glabrous, articles 5-7 mm long, 4-7 mm wide, glabrous to sparsely hispid, smooth to verrucose, the upper margin of loment entire, the lower crenate to subentire; seeds 3-4 mm long, 2.5-3.0 mm wide, brown. Chromosomes: n = 10."
          originalLanguage: en
          sourceField: general
