        claims:
          - text: Acaulescent, cormous geophyte, 2-5 cm. Leaves ovate to lanceolate, prostrate, margins undulate. Flowers pink to purple, often with yellow centre, tepals cupped, style exceeding anthers, stigmas lobed.
            textZh: Moraea versicolor (Salisb. ex Klatt) Goldblatt 的 SANBI 物种条目记载了植株、叶片和花部形态。
            sourceIds:
