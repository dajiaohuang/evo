            locator: Strelitzia 29; archive Morphology row 7421, source 13878.0
            placeTimeScope: Regional species account published 2012; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
          - text: Moraea versicolor has pink to purple flowers with tepals forming a cup in the lower half, usually with a yellow centre but populations with a blue to violet centre occur locally. The leaves are usually somewhat glaucous and widely channelled and often somewhat twisted, with undulate margins. The filaments are free and diverging in the upper 1.0-1.5 mm and united in the lower part, usually forming a bottle-shaped column wider in the lower half but populations with a cylindric filament column occur in the Breede River Valley. The style divides above the anthers, often exceeding them by 3-4 mm. Moraea variabilis has similarly coloured flowers but glossy, channelled leaves with straight margins, and filaments united entirely or rarely free distally for less than 1 mm, with the style dividing just above the anther tips. The species is variable for chromosome number and most populations have a diploid number of 2n = 16 but plants from the northern Cape Peninsula and from the Tulbagh Valley have 2n = 14.
            textZh: SANBI 条目提供了 Moraea versicolor (Salisb. ex Klatt) Goldblatt 的鉴别特征。
