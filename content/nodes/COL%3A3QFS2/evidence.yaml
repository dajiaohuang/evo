        claims:
          - text: Records are all from stony ground, and at the Keisie River Gorge near Montagu hot springs plants grew on steep, rocky, south-facing slopes. Plants are rooted in shallow sandy soil, often growing in clumps of Restionaceae. All known localities for I. simulans are in virtually undisturbed montane vegetation.
