    facets:
      morphology:
        status: partially-supported
        claims:
          - text: "Plants 40-100 cm high, stems usually simple, rarely with a single branch, sheathed basally by membranous cataphylls. Corm ± 10 mm diam., tunics of fine, netted fibres. Leaves 2(3), lower 1(2) with narrowly sword shaped to linear blade with single prominent vein, ± 1/2 as long as stem, 1.5-6.5 mm wide, margins thickened and slightly raised, hyaline when dry; upper leaf sheathing lower 1/2 of stem, free and unifacial distally. Spike erect, fairly lax, weakly flexuose or straight, 4-8-flowered; bracts membranous, translucent, purple at tips, ± 4 mm long, outer usually with 3 prominent veins and 3-toothed, inner 2-veined and forked at apex. Flowers ± nodding with tepals held vertically, zygomorphic with stamens unilateral, bright pink (rarely pale pink), white at tepal bases, unscented; perianth tube filiform, ± 4.5 mm long, tightly clasping style; tepals spreading, ovate-elliptic, (10-)12-14 x 5-6 mm, inner whorl slightly larger than outer. Stamens unilateral, filaments inserted at mouth of tube, filiform, ± 2.5 mm long, white, anthers oblong, 2.0-2.5 mm long, yellow, horizontal or slightly pendent, thecae acute and slightly recurved at base, dehiscing incompletely from base by narrow slits. Style dividing opposite lower 1/3 of filaments, branches ± 1.3 mm long, white, tubular, falcate, stigmatic apically. Flowering time: mid-Aug.-mid-Oct."
            textZh: Ixia simulans Goldblatt & J.C.Manning 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_15933_0
            locator: "SANBI/WFO archive Morphology row 85219; source identifier 15933.0; cited publication: Goldblatt, P; Manning, JC. 2012. Systematics of the southern African genus Ixia (Iridaceae): 4. Revision of sect. Dichone. Bothalia 42(2): 87 - 110. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: "Ixia simulans is a surprising novelty given that the western Langeberg has been botanized for over two centuries and intensely so in the past 50 years. The flowers closely resemble those of I. scillaris in general appearance and have unilateral, horizontal to slightly pendent anthers that dehisce incompletely by narrow slits near the base. I. simulans differs from I. scillaris most conspicuously in its single, or rarely two, long, basal leaves with ± linear blades 1.0-4.5 mm wide, spikes of only 4-8 flowers, relatively short floral bracts ± 4 mm long and the spreading, subequal tepals, those of the inner whorl being slightly shorter than the outer. The tepals are inclined and all held in the same plane whereas those of I. scillaris are always held vertically and the lowermost tepal is weakly to strongly recurved and held apart from the other five tepals. The range of Ixia simulans and I. scillaris complement one another: I. scillaris extends from the Cape Peninsula and Somerset West in the south through the Olifants River Valley, Cedarberg-Pakhuis Mtn complex to the Bokkeveld Mtns, and locally well to the north in the Spektakel Mtns west of Springbok whereas I. simulans occurs well to the east of this line in the western Langeberg. There seems to be no threat to the species: a conservation status of Least Concern (LC) seems appropriate."
