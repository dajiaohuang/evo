        metadataVariant: 0
        usage:
          title: Psychotria olgae Dwyer & M.V.Hayden, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Trees or shrubs to 8 m tall, the branchlets terete, ultimately subplane, smooth, glabrous, usually the nodes turgid, well spaced below the tips, crowded termi- nally. Leaves strongly ascending, obovate elliptic, oblong rotund, subrotund or elliptic, 4.5-11.0 cm long, 1.5-5.0 cm wide, rounded, obtuse to deltoid at the apex, cuneate at the base, the costa prominulous above, prominulous to promi- nent beneath proximally, the lateral veins 5-8, arcuate, 0.8-1.5 cm apart, eva- nescent above, prominulous beneath, thickly coriaceous, lustrous, glabrous, oc- casionally drying yellow, the margins conspicuously revolute; petioles absent or to 1.5 cm long, lignose, glabrous; stipules often persistent, ffree, broadly cup shaped 0.2-1.5 cm long, much wider than long, usually with 2 mammiform bulges at each side, coriaceous, glabrous, fimbriate ciliate within. Inflorescences ter- minal, glabrous, to 11 cm long, to 5 cm wide, cymose paniculate, the peduncle to 4.5 cm long, stiff, the branches disposed as 4-5 pairs, the cymules few flow- ered, terminal; bracts and bracteoles ovate subulate, ca. 2.5 mm long. Flowers sessile or short pedicellate; hypanthium 1.3 mm long, the calycine cup short with 1-2 minute glands at the junction of the lobes, the lobes 5, triangular, ca. 0.5 mm long, the calyx spread at anthesis; corolla white, to 5 mm long, the tube short, somewhat expanded basally, puberulent or glabrous outside, densely barbate within above the middle, the lobes 5, narrowly oblong, 2-4 mm long, cucullate; stamens 5, the anthers narrowly oblong, 2.5-3.0 mm long, the filaments short, 1 mm long; style thickly cylindrical to linear, 4-11 mm long, the stigmas small. Fruits obovate oblong, 1-2 cm long, 1 cm wide, obtuse at the apex, acute basally, carnose, red, 10-12-ribbed.
