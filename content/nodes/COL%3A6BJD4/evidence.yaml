        usage:
          title: Crotalaria retusa L., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Herb, usually less than 1 m tall, stem striate, strigulose. Leaves unifoliolate, oblanceolate, the apex rounded or mucronulate, the base cuneate, 3.5-9.7 cm long, 1.4-3.6 cm broad, the margins entire, above glabrous, beneath puberulent with loosely appressed trichomes, the veins 7-12 on each side of the midvein; petiole 2-3.5 mm long; stipules frequently absent at flowering time, when present narrowly angular ovate and less than 2.5 mm long. Inflorescenses terminal ra- cemes, bearing 14-20 flowers, bracts narrowly triangular, to 2.5 mm long; per- sistent, pedicels 5-9 mm long; bracteoles narrowly triangular, 0.5-1.0 mm long, puberulent, located at mid-pedicel. Flowers yellow, 17-24 mm long, the calyx 12-14 mm long, the tube truncate, the lobes 1.2-1.8 times as long as the tube, strigulose; corolla yellow, occasionally with purple veins, 17-24 mm long, the standard 14-18 mm long, 17-25 mm broad, retuse, the wings 13-15 mm long, the claws 3-4 mm long, oblong lanceolate, oblique, the keel 16-18 mm long, the twisted beak not prolonged; stamens dimorphic, the long anthers 2.8-3.1 mm long, the short anthers 0.8-1.0 mm long; style with a pubescent stigma, genicu- late, 11-12 mm long. Legume inflated, 3.0-3.8 cm long, glabrous, dark brown to black; seeds ca. 23, tan to brown, oblique cordiform, to 4.5 mm long.
          originalLanguage: en
          sourceField: general
