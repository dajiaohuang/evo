        usage:
          title: Drymonia conchocalyx Hanst., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Epiphytic shrubs or lianas; stems 1-3 m long, purplish toward the apex or green, glabrous, the nodes sometimes swollen. Leaves often unequal or one of a pair falling early; blades elongate elliptic or oblong, 9-32 cm long, 4-10 cm wide, coriaceous, the apex acuminate, the base rounded, acute, or oblique, entire, both sides green, glabrous; petiole to 3 cm long, purplish or green, glabrous. Inflo- rescences in the upper leaf axils, 1 or 2 per axil; peduncles and bracts lacking; pedicels 2-4 cm long, reddish, glabrous. Flowers showy, the calyx oblique, ir- regular, the anterior lobes larger, 1.0-3.0 cm long, all connate at the base for 1.0- 1.5 cm, ovate or oblong, yellow to purple, glabrous, entire; corolla whitish to purplish, with darker spots or with apparent yellow lines, drying purplish, the tube oblique in the calyx, spurred or saccate at the base, broader toward the limb, not contracted above, to 7 cm long, glabrous, the limb pink to purple, lobes toothed; filaments adnate to corolla tube at the base, flattened, glabrous, the anthers oblong, ca. 6.5 cm long; disc gland 1, thick, glabrous; ovary strigillose, the style glabrous, ca. 4 cm long, the stigma stomatomorphic. Capsule yellow to purplish, surrounded by the persistent calyx; seeds not seen.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 6258
