          originalSourceText: Slender vine; stems twining, pubescent with appressed white hairs, glabres- cent. Leaves pinnate with 5-13 pairs of leaflets; leaflets oblong to ovate, mostly 9-15 mm long, 5-7 mm wide, apically rounded or truncate and mucronulate, sometimes acute, basally obtuse, rounded or truncate; petiolules 0.5-1 mm long; petioles shorter than the width of a leaflet; rachis mostly 7-10 cm long, sparingly pubescent with ascending hairs; stipels minute, following the rachis; stipules sub- ulate, 1-2 mm long. Inflorescences leafless pseudoracemes; peduncles stouter than the petioles and often stouter than the stems, 6-10 cm long, bearing ca. 4 pairs of minute bracts along the length; rachis strongly angled, somewhat con- gested, 3-6 cm long, the flowers 1-15 per node, pedicels 1-2 mm long, glabrous except for the apical swelling. Flowers white or pinkish, ca. 1 cm long, calyx cupular, ca. 2 mm long with low teeth, sparingly short pubescent; standard ob- ovate, 8-9 mm long, the wing petals upcurved, ca. 6 mm long, stamens not exserted. Legume oblong, somewhat oblique, ca. 2.5 cm long, 1.5 cm wide,
