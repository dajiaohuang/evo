        usage:
          title: Pristimera nervosa (Miers) A.C.Sm., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Liana or small tree, the branchlets elongate, subterete or distally subquad- rangular. Leaves with the petiole 8-15 mm. long, the blade elliptic or broadly ovate-elliptic, obtuse or acute and decurrent at the base, obtusely acuminate at the apex, undulate or crenate at the margins, 7-20 cm. long and 3-9 cm. broad, papy- raceous or chartaceous, the costa strongly elevated above, prominent beneath. Inrflorescences 2.5-7 cm. long, the distal nodes contracted at the base and appearing articulate, the bracts and bractlets conspicuous. Flowers 1.7-3.5 mm. in diam., the pedicel slender, less than 1. mm. long; sepals ovate-deltoid or suborbicular, erosulous or conspicuously dentate at the margins, 0.5-0.7 mm. long and 0.7-1.3 mm. broad, submembranous or papyraceous; petals suberect, elliptic-oblong, entire, 1.2-1.8 mm. long and 1-1.3 mm. broad, thin-carnose; disc pentagonous, about 0.1-0.3 mm. thick; stamens suberect, the filaments deltoid-liguliform, conspicuously broadened toward the base, 0.3-0.5 mm. long, the anthers about 0.2 mm. long and 0.3 mm. broad; ovary with 4-8 ovules per cell, the style about 0.1-0.2 mm. long, carnose. Fruit un- known.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 6443
