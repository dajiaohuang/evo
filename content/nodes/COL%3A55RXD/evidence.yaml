        usage:
          title: Tetrapterys tysonii Cuatrec. & Croat, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Liana, stems slender, subsericeous when young, sparsely appressed pubes- cent to glabrate in age, lacking lenticels; trichomes metacentric, sessile. Leaves moderately thick, oblong-elliptic, gradually to abruptly acuminate, usually obtuse at the base, sometimes acute or subrounded, 6.5-18.5 cm long, 2.6-7.0 cm wide, drying yellowish green, glabrous on upper surface, sparsely appressed-pubescent on lower surface, denser on the veins, major veins 4 or 5 pairs, prominently ascending, the upper surface semiglossy, the reticulate venation prominulous on drying, the lower surface almost matte on drying, the reticulate venation less conspicuous than on the upper surface; petioles canaliculate, 1.0-1.5 cm long, appressed-pubescent; stipules thick, narrowly triangular, persistent, appressed pubescent, ca. 2 mm long. Panicles terminal, less than 15 cm long; bracteoles 0.8-2.0 cm long, ovate-elliptic, glabrous above except along the midrib, densely- appressed pubescent on the lower surface; peduncles 5 mm long; pedicels 3 mm long; peduncles and pedicels densely appressed pubescent, completely obscuring the surface, both subtended by narrowly deltoid bractlets ca. 1 mm long, these sparsely appressed pubescent on the outer surface. Most flower parts not seen; anthers oblong, ca. 1.3 mm long; ovary densely pubescent, the trichomes meta- centric, whitish, both sessile and weakly stalked, obscuring the surface; styles glabrous, 2.4 mm long, truncate at the apex, the medial style bilaterally sym- metrical, the two lateral styles unilaterally flared at the apex. Samaras brown, sparsely appressed pubescent, densely so on the seminiferous area, the wings moderately thin, weakly viscidulous upon magnification, the superior wing ob- long, rounded at the apex, 3.5-3.8 cm long, 7-11 mm wide, not at all confluent with the inferior wing, the latter to 12 mm long and 5 mm wide; dorsal crest to 6 mm long, rounded to truncate at the apex, appendages lacking between the dorsal and lateral wings; body 8-9 mm broad, densely tomentose.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 7208
