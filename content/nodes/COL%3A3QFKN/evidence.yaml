    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, 20-45 cm. Leaves linear, very narrow. Flowers white to blue or mauve, tube funnel-shaped, filaments exserted.
            textZh: Ixia capillaris L.f. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 7109; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Distinguished by the narrow, linear leaves up to 2 mm wide, corm tunics of fine, netted fibres and a main spike with 1 to 3 flowers. Branchlets when present are very short and 1- or 2-flowered. The pale blue or occasionally creamy yellow flowers have a perianth tube ± 5 mm long, enclosed by the translucent floral bracts, 6-8 mm long, the flowers, excluding the ovary, are ± 20 mm long. The plants typically have a prominent dark brown cataphyll, a feature more prominent in the northern populations of the species and the upper leaf sheathes the stem for ± half its length. The type material is readily matched by plants from the Western Cape mountains, long known by the name, that have filaments exserted 1-2 mm and anthers held in a column 4.0-4.5 mm long and a style dividing opposite the upper third of the anthers into short branches 1-2 mm long. Ixia capillaris is most likely to be confused with I. exiliflora, specimens of which were often included in the past as that species. Whereas I. capillaris has flowers with a perianth tube 4-7, rarely 8 mm long, and tepals about twice as long as the tube, I. exiliflora has a perianth tube 8-10 mm long, and tepals about as long as the tube. The bases of the anthers of I. exiliflora are included in the tube but those of I. capillaris have anthers that are normally exserted 1-2 mm, or rarely barely exserted on included filaments.
            textZh: SANBI 条目提供了 Ixia capillaris L.f. 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 95086; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
