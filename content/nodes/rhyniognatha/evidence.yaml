  claims:
    - subjectId: taxon:rhyniognatha
      claimKind: scientific
      claimType: fossil-range
      statement: Rhyniognatha hirsti is bounded here by isolated head fragment NHMUK PI IN 38234 from the Rhynie Chert, Aberdeenshire, Scotland; its insect versus myriapod affinity remains unresolved, so this is not a global range.
      confidence: contested
      confidenceRationale: Contested confidence records the published conflict between an insect or possible pterygote interpretation and a later three-dimensional reanalysis favouring a myriapod, possibly centipede. The claim is limited to specimen-level disagreement and does not promote either affinity or the display envelope into a global biological boundary.
      referenceLinks:
        - referenceId: engel-grimaldi-2004-rhyniognatha
          relation: supports
          pages: 627–630
          figure: Figures 1–2
          quoteLocator: Rhynie Chert NHMUK PI IN 38234 head fragment
        - referenceId: haug-haug-2017-rhyniognatha
          relation: contradicts
          pages: e3402
          figure: Figures 1–7
          quoteLocator: NHMUK PI IN 38234 re-documentation and affinity reassessment
  claim-rationales.zh:
    - 置信度为有争议：早期论文把标本解释为昆虫或可能的有翅类，后续三维复核则更支持多足类、可能是蜈蚣；本条只记录标本级分歧，不把任一归属或显示包络提升为全球生物边界。
  claim-statements.zh:
    - Rhyniognatha hirsti 在此由来自苏格兰阿伯丁郡莱尼燧石的孤立头部碎片 NHMUK PI IN 38234 约束；其昆虫或多足类亲缘仍未解决，因此这不是全球延限。
