    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Grass-like plants up to 50 cm long. Roots unknown. Rhizome unknown. Leaves semiterete to narrowly linear, up to 50 cm long, 1-2 mm broad, glabrous; leaf-bases persisting as hard, long fibres. Inflorescence simple, flowers aggregated near the apex; scape erect, straight, up to 50 cm long, with some empty bracts below raceme; bracts small; pedicels short ca. 5 mm long, ascending to erect. Flower with perianth segments ca. 5 mm long; filaments papillate (nearly smooth in one flower); ovary with 2pendulous, collateral ovules in each loculus. Capsule (immature) globose, erect.
            textZh: Trachyandra esterhuysenae Oberm. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_3805_0
            locator: "SANBI/WFO archive Morphology row 85280; source identifier 3805.0; cited publication: Obermeyer, AA. 1962. A revision of the South African species of Anthericum, Chlorophytum and Trachyandra. Bothalia 7(4): 669 - 767. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: The 2 pendulous collateral ovules show affinity to Bulbinella, which it does resemble superficially. In Bulbinella however, the perianth is star-shaped and persistent whereas our species has a typical Trachyandra perianth, for in fading the segments fuse above the ovary, and it then drops off, where the pressure of the expanding capsule tears it apart. The species resembles T. tabularis but this species has a branched inflorescence and 6 ovules per cell to mention but a few differences.
            textZh: SANBI 条目提供了 Trachyandra esterhuysenae Oberm. 的鉴别特征。
