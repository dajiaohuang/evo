    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Like Q. mammillaris but mat-forming and rooting on branches, stems 20-30 mm diam., with fewer teeth and sometimes mottled with purple, flowers in dense clusters of up to 30, with larger papillae around mouth of tube, lobes parallel-sided or widening slightly to incurved tips.
            sourceIds:
              - sanbi_14722_0
            locator: "SANBI/WFO archive Morphology row 34087; source 14722.0; publication: Bruyns, PV. 2013. Apocynaceae. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 248 - 264. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: This species has stout, often quite attractively mottled stems which form substantial clumps up to 0.5 m in diameter. The tubercles are also stout and tipped with a hard and often quite sharp tooth. Their somewhat disorganised arrangement on the stems makes it easily separable from Q. arenicola. However, it is not so readily distinguished vegetatively from Q. armata, and the plants can look very similar. One very large plant of Q. multiflora seen south-east of Calvinia had longer stems than usual and looked similar to Q. mammillaris. Here only the more spreading habit and the roots that were produced on a few of the side-branches suggested its real identity, which was confirmed once flowers appeared. In Q. multiflora the flowers are produced in dense clusters of up to 30 per inflorescence towards the tips of the stems. Most of the flowers in a cluster open more or less simultaneously. From the point of view of the colour of the inside, these flowers are similar to most of the larger-flowered species. They have the typically dark, often purple-black lobes and whitish tube with a few dark spots mainly near the mouth which are found in most of them. They also emit an unpleasant odour. Very occasionally the dark colour of the lobes is speckled with yellow but usually their dark colour only begins to break up towards the mouth of the tube. The outside is smooth and often rather shiny but the inside is velvety and covered, or rather ‘encrusted’, around the mouth of the tube with a growth of quite large papillae. From all the similar species Q. multiflora is easily distinguished by the shape of the corolla lobes, which are either parallel-sided or widen gradually to a broader, abruptly acute, incurved tip. This shape in the lobes can usually be detected in the buds which, instead of narrowing from the base of the lobes towards the apex, are somewhat club-shaped. The corona is usually purplish towards the tips of the lobes and white lower down. The outer lobes are each bifid into small, deltoid, erect teeth and these, together with the similarly shaped dorsal ridge on the inner lobes, form a cup-like structure. The inner lobes are quite long. Initially they are pressed to the anthers, after which they rise in the centre into a slender column which nearly reaches the mouth of the tube.
