        status: partially-supported
        claims:
          - text: Root parasite with scale-like leaves, bracteoles obtuse. Flowers crimson or pink, hooded, densely hairy, tube subcylindrical, stamens included.
            sourceIds:
              - sanbi_14369_0
            locator: "SANBI/WFO archive Morphology row 6074; source 14369.0; publication: Manning, JC; Goldblatt, P. 2012. Orobanchaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 630 - 633. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Excellent ink may be made from this plant; the farmers in the Queenstown district call it ' Ink-plant' (Boioker). Sometimes the calyx-lobes are connate two and three together for some distance so as to make the calyx sub-bilabiate. The hairs of the pubescence are moniliform, as is the case in other species of the genus. There is in the British Museum a coloured drawing made by Masson at the Cape of Good Hope in 1775.
