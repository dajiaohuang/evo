    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Tufted perennial herb forming small mats, main stems decumbent, rooting, flowering stems erect, 100-150 mm long, simple, densely leafy near base, becoming distantly so then bracteate near tips. Leaves mostly 25-40 x 4-7 mm, half the length petiolar, blade elliptic-lanceolate, often conduplicate and falcate, tip acute, base narrowed to a broad flat clasping petiole, both surfaces grey woolly-felted. Heads homogamous, cylindric, 3-4 x 1.5-2 mm, many closely congested and felted together into a flat-topped glomerule 15-20 mm across at the stem tip. Involucral bracts in 3-4 series, graded, loosely imbricate, about equalling flowers, pellucid, pale golden brown, tips very obtuse, concave, not radiating. Receptacle shortly honeycombed. Flowers 4-6, yellow. Achenes 0.75 mm long, with myxogenic duplex hairs. Pappus bristles many, equalling corolla, upper part subplumose, yellow, bases cohering strongly by patent cilia.
            sourceIds:
