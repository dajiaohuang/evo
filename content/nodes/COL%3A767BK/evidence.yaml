    facets:
      morphology:
        status: partially-supported
        claims:
          - text: "Plants 5-19 cm tall. Corm ovoid, 10-13 mm diam., covered with mostly fine, brown, fibrous tunics; fibres densely reticulate, fused to basal disc, not extended into a neck; roots spreading from near corm base. Cataphylls persisting as a papery or leathery, brown, slender neck up to 20 mm long. Leaves 3-7, sheathing up to 30 mm from base, suberect to spreading, linear, 20-190 x 1.0-1.5(-3.0) mm, shallowly carinate, pale green; epidermis large-celled, margin entire; apex turning black when cut. Inflorescences 1 or 2 in flower at a time, 2-flowered, rarely 1 remaining rudimentary, shorter than or as long as leaves; scape 20-90 x ca. 1 mm, somewhat compressed laterally, greenish red; bracts 2, clasping pedicels at base, narrowly lanceolate, 10-16 x 2-3 mm, thin-textured, greenish red, with narrow, translucent edges, occasionally 1 bract shorter and much narrower. Flowers pedicellate, stellate, yellow, backed with pale green, midrib occasionally reddish brown, unscented; pedicels suberect, terete, 56-80 x 1 mm, remaining suberect when fruiting, reddish green; tepals 6, lanceolate to narrowly elliptical, 5.5-8.5 mm long, outer 2-4 mm wide, mucronate, inner 1.5-2.0 mm wide. Stamens 6, unequal, outer nearly half as long as inner, suberect to slightly spreading, yellow; filaments inserted on ovary rim, outer 1-2 mm long, slightly shorter than anthers, inner 1.5-3.5 mm long, as long as or longer than anthers; anthers somewhat oblong, latrorse, 1.2-2.5 mm long, basal lobes up to 0.2 mm long, apex shallowly notched; pollen yellow. Ovary obconical, 2-4 x 1.7-2.0 mm, 3-locular; style 1.0-1.2 mm long; stigma branches suberect, oblong, often unequal, 1.7-4.0 x 0.5-1.0 mm, slightly shorter than stamens, yellow, densely papillose. Capsules obconical, ca. 4.5 x 3.5 mm, dehiscence circumscissile. Seeds ovoid, ca. 0.5 x 0.4 mm, dark brown to matt black, epidermal cells densely colliculate, in ca. 35 longitudinal rows, anticlinal walls isodiametric, outer periclinal walls almost entirely convex and finely pitted. Flowering period: (June-)August-October(-November)."
            textZh: Pauridia maryae Snijman 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_15172_0
            locator: "SANBI/WFO archive Morphology row 60902; source identifier 15172.0; cited publication: Snijman, DA. 2014. A taxonomic revision of the genus Pauridia (Hypoxidaceae) in southern Africa. Phytotaxa 182(1): 1 - 114. [All rights reserved]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Until now most collections of Pauridia maryae have been identified as P. flaccida. Unlike P. flaccida, P. maryae has leaves enclosed by smooth brown, papery or leathery sheaths proximally and a corm in which the tips of the soft fibres remain short. In contrast to the broadly sagittate stigma branches of P. flaccida, those of P. maryae are oblong and shorter (2.0-3.5 mm versus 2.5-5.5(-6.5) mm long). In addition, the outer filaments are consistently shorter than the inner ones by 0.5-1.5 mm, rather than equally long or rarely up to 0.5 mm shorter as in P. flaccida. The distinctly biseriate stamens also suggest an alliance with P. aemulans which differs in having a solitary-flowered inflorescence with a short, linear bract (1.5-7.5 mm long), unlike the two-flowered inflorescence in P. maryae with longer, narrowly lanceolate bracts (10-16 mm long). The small habit and generally soft appearance of most specimens of Pauridia maryae may lead to confusion with the similar looking P. trifurcillata. Nel himself mistakenly cited a specimen of P. maryae under P. trifurcillata, namely Burchell 5495 (K!). P. trifurcillata, however, flowers in autumn and is distinguished by its unique style in which the downturned basal lobes appear as three prominent extensions protruding between the stamen filaments. Moreover, only the bases and rounded apices of the style branches are stigmatic.
