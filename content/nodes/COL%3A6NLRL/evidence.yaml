    facets:
      morphology:
        status: partially-supported
        claims:
          - text: "Plants many-stemmed. Leaves usually in four ranks, arcuate-spreading to strongly recurved, dull green, 0.5-1.1 m long, 15-35(-40) mm broad, deeply keeled and broadly V-shaped in cross section; margin and keel distinctly to sparsely serrulate, rarely almost smooth. Scape overtopping spreading leaves, stout, 0.6-1.4 m tall. Raceme very dense, globose when in full flower, 80-110 x 50-80 mm; apex conical in young stage with buds erect and enclosed in overlapping imbricate bracts; variable in colour with buds brilliant flame-red to orange-yellow or greenish, and open flowers orange-red to yellow-green. Bracts oblong to obovate, obtuse to rounded, 7-11 mm long, usually brownish, minutely serrulate to almost entire. Pedicels 1 mm long, elongating to 3-4 mm in fruiting stage. Perianth subcylindrical, 35-42 mm long; lobes ovate, 2.5 mm long, slightly spreading at anthesis. Stamens slightly exserted at anthesis, later withdrawn. Fruit ovoid-triquetrous, erect, 8-10 mm long. Flowering time: winter and early spring, from June to September, but flowering specimens have been recorded, especially in cultivation, as early as March and as late as November."
            textZh: Kniphofia rooperi (T.Moore) Lem. 的 SANBI 物种条目记录了形态特征。
