            locator: "SANBI/WFO archive Morphology row 48664; source identifier 6616.0; cited publication: Codd, LEW. 2005. Asphodelaceae (First part): Kniphofia, Fl. S. Africa 5(1,2): 1 - 94. South African National Biodiversity Institute, Pretoria. [http://www.biodiversitylibrary.org/item/209560#page/3/mode/1up]. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: These small, depauperate plants may be confused with K. littoralis and K. drepanophylla. It is considered that the type of K. longicollis Baker is probably a small specimen of K. rooperi; although the bracts are not an exact match of K. rooperi, they come nearer to that species than to K. littoralis. The plant illustrated in Curtis's Botanical Magazine t. 7623 (Baker 1898a) as K. longicollis is not that species but is probably a form of K. praecox. It is also doubtful if the plant figured as K. rooperi in Curtis's Botanical Magazine t. 6116 (Hooker 1874) is correctly named. The raceme is too elongate for K. rooperi and it appears to be a form of K. linearifolia.
