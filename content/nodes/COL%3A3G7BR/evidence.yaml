    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Twiggy shrublet c. 230-600 mm tall, lower branches often decumbent and sometimes rooting, basal parts up to c. 3.5 mm in diam., stems glabrous except for 2 narrow longitudinal ciliate ridges between the nodes, the hairs patent or somewhat curved and retrorse, eglandular, obtuse, up to 0.25 mm long; very leafy. Leaves usually opposite and decussate, rarely subopposite, 6-36 x 2.5-14 mm, elliptic gradually narrowed below into a very short petiolar part, bases connate and decurrent on the stem in narrow ridges, margins finely callose-toothed, blade thick-textured, glandular-punctate, minutely glandular-puberulous as well on the upper surface, lower surface either glabrous or nearly so except for cilia on lower margins, some gland-tipped, most eglandular. Flowers solitary in upper leaf axils forming crowded terminal heads sometimes further arranged in corymbose panicles, becoming oblong in fruit, c. 20-40 mm long. Bracts leaf-like, indumentum as on leaves, lowermost c. 8-13 x 3-7 mm, adnate to pedicel and up to halfway up calyx tube. Pedicels up to 1 mm long. Calyx bilabiate, tube c.1.3-1.5 mm long, anticous lobe 1.5-2.25 x 1.4-2 mm, anticous lip split 1-2 mm, 3 posticous lobes about half the width of the anticous ones, all hyaline, delicately keeled, ciliate on margins. Corolla tube 7-13 mm long, cylindric below and there c.0.8-1.5 mm in diam., abruptly campanulate above, 2-4 mm across mouth, limb c. 6-14 mm across lateral lobes, posticous lobes 2-4 x 2-4 mm, anticous lobe 3-5 x 1.75-4 mm, all lobes subrotund, white inside with an orange patch at base of posticous lip running down back of inflated part of tube, heavily bearded all round mouth, each lobe with a blue-purple patch outside fading to brown. Stamens 4, anthers 1-2 mm long, posticous pair in throat, anticous pair shortly exserted. Stigma exserted. Capsules c. 6 x 3-3.5 mm, c. 9-16 seeds in each loculus. Seeds c. 1-1.25 x 0.75 mm, obscurely angled or flattened, irregularly wrinkled on one face, creamy-coloured or pallid amber. Flowering between May and October, principally in August.
