        claims:
          - text: Loosely tufted annual 300-1200 mm tall. Leaf blade to 15-40 x 7-25 mm, expanded, loosely hairy or glabrous. Inflorescence 100-350 mm long, dense, often drooping; included or exserted from uppermost leaf; spikelets clustered in upper parts of branches. Spikelet 4-6 mm long, ovate to ovate-oblong, glabrous; glumes separated by internode; lower glume 1/2-3/4 as long as spikelet, 5-7-nerved, nerves prominent; upper glume 11-15-nerved; lower floret sterile, lemma 9-13-nerved, palea reduced; upper floret smooth or striate, glossy, white, yellow, red, brown or black when mature, persistent or deciduous.
