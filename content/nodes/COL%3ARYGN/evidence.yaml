        usage:
          title: Cayaponia macrocalyx Harms, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Monoecious vines; stems glabrous. Leaves simple, suborbicular, deeply 3-lobate, the apex acuminate, the base cordate, the margin remotely and minutely denticulate, chartaceous, the upper surface minutely white pustulate, otherwise glabrous, sessile glands present near the base; petiole 3-5 cm long, slender, glabrous; tendrils simple or 2-branched. Staminate flowers solitary in the axils of the leaves; calyx urceolate, ca. 2-4 cm in diameter, glabrous, the lobes acuminate, 1-3 mm long; corolla greenish yellow, the inner surface yellowish orange, the lobes broadly lanceolate to ovate, ca. 3 cm long, both the surfaces pubescent; filaments slender, the anthers complicate, forming an irregular oblong head; nectaries pouchlike on the hypanthium wall near base, cuplike nectary disc present at the base of the hypanthium. Pistillate flowers disposed as in the staminate flowers; calyx and corolla as in the staminate flowers; styles ca. 2 cm long, the ovary globose, ca. 2 cm long, glabrate. Fruits purplish green, globose, 4-6 cm in diameter, glabrous; seeds 3, ovoid, basally tricornuate, 2.0-2.5 cm long, 1.5-1.7 cm wide, light brown.
          originalLanguage: en
          sourceField: general
