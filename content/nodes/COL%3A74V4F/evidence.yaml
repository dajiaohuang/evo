          title: Ormosia macrocalyx Ducke, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: "Tree to ca. 40 m; young stems finely pubescent, glabrate. Leaves 7-11-fo- liolate; rachis 15-40 cm long; petiole 4-10 cm long, conspicuously swollen at the base; petiolules pulvinate, 5-8 mm long; leaflets ovate to ovate-oblong, 6-15 cm long, 4-10 cm wide, glabrous, the apex obtuse to short acuminate, rounded to subcordate basally. Inflorescence terminal, paniculate, to 30 cm long, greyish to yellowish pubescent, the bracts linear, 3-10 mm long, ca. 1 mm wide, the brac- teoles subulate, 1.0-1.5 mm long. Flowers purplish, 18-25 mm long; calyx 8-15 mm long, grayish pubescent, 5-lobed, the teeth 3-5 mm long; petals ca. 2 mm long; standard minutely biappendiculate basally. Fruit dehiscent, coriaceous, cir- cular to oblong, flattened, to ca. 10 cm long, ca. 3 cm wide, 1-4-seeded, the lateral margins straight or submolliform, glabrous; seeds red, ovoid, ca. 1 cm long, ca. 10 mm broad, ca. 8 mm thick, the hilum elliptic. Chromosomes: n = 8."
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 5098
          archiveSourceId: B65251A9-DE14-40F7-B1F3-DEC74B3EA379
