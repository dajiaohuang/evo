    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Like B. ecklonii but tepals narrow, leaf tips almost obtuse, flowers dark purple with narrow white streaks on lower tepals, and broad style branches.
            textZh: Babiana latifolia L.Bolus 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 6732; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: "Differs from B. ecklonii in its unusual style branches conspicuously enlarged at the tips, purple flower colour with narrow white nectar guides on the lower lateral tepals, blue-black anthers, and obtuse apiculate tepal tips. Flowers of B. ecklonii are violet with broad white to pale yellow nectar guides, the anthers are pale violet, and the tepals are narrow and acute. The style divides opposite the anther apices in B. latifolia and the style branches are ± 4 mm long with the tips unusually broad and undulate. In B. ecklonii the point of division of the style and length of style branches is variable, in different individuals, dividing variously below the anthers and ± 2 mm long, or opposite the middle or close to the anther apices and up to 4 mm long, but in both cases the style branches are slender, widening gradually toward the tips. Vegetatively the two also differ: in B. latifolia the leaf and stem pubescence is velvety but in B. ecklonii the pubescence is longer and sparser, and the erect stem is largely sheathed by the leaf bases, whereas the stem of B. latifolia arches outward and is free of the leaf bases for at least half its length."
            textZh: SANBI 条目提供了 Babiana latifolia L.Bolus 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 94967; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
