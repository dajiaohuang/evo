  claims:
    - subjectId: taxon:cetacea
      claimKind: scientific
      claimType: taxonomy
      statement: A systematic synthesis recognizes Cetacea from a sequence of separately sampled Eocene fossils and living lineages, but explicitly combines paleontological, anatomical, stratigraphic and molecular evidence rather than documenting one continuous population or exact origination event.
      confidence: medium
      confidenceRationale: The claim states the evidentiary architecture of the review and refuses to turn its approximate oldest record into a universal origin date.
      referenceLinks:
        - relation: supports
          referenceId: uhen-2010-whale-origins
          pages: 189–219
          quoteLocator: Abstract; Introduction; fossil history synthesis
    - subjectId: taxon:cetacea
      claimKind: scientific
      claimType: fossil-range
      statement: Cetacea is displayed at 53–0 Ma only as a review-bounded fossil-to-living navigation envelope, not an exact cetacean origination date. The interval is a source-bounded sample window, not a global FAD, LAD, divergence date, continuous occupancy claim or direct-ancestor assertion.
      confidence: medium
      confidenceRationale: Cetacea uses Uhen, M.D. (2010) because the cited pages and locator expose the sampled taxon, specimen or living sequence set. Confidence is medium and applies only to Eocene fossil samples through living Cetacea synthesized by Uhen; broader endpoints remain unclaimed.
      referenceLinks:
        - relation: supports
          referenceId: uhen-2010-whale-origins
          pages: 189–219
          quoteLocator: Abstract; Introduction; fossil history synthesis
        - relation: contextualizes
          referenceId: ics-2026-06
          pages: International Chronostratigraphic Chart v2026/06
          figure: Global chronostratigraphic scale
          quoteLocator: Numerical boundaries for named geological stages used to bound the source sample
  claim-rationales.zh:
    - 主张陈述综述的证据结构，并拒绝把其近似最早记录转化为普适起源日期。
    - Cetacea 采用 Uhen, M.D.（2010）的论文，因为所引页码与定位符直接标示了研究采样的类群、标本或现生序列集合。中等置信度仅适用于 Eocene fossil samples through living Cetacea synthesized by Uhen；更宽泛端点保持未声明。
  claim-statements.zh:
    - 系统综述依据彼此独立取样的始新世化石与现生谱系识别鲸目，但明确综合古生物学、解剖学、地层学和分子证据，而非记录一个连续种群或精确起源事件。
    - Cetacea 仅以 53–0 Ma 展示为综述限定的化石至现生导航包络，而非鲸类精确起源日期。该区间是来源限定的样本窗口，不是全球首现、末现、分化日期、连续占据或直接祖先断言。
  ranges:
    - entityId: cetacea
      rangeKind: global-composite
      taxonomicConcept: Cetacea — source-bounded sample window
      geographicScope: Eocene fossil samples through living Cetacea synthesized by Uhen
      olderMa: 53
      youngerMa: 0
      status: available
      uncertainty:
        olderMa: null
        youngerMa: 0
        note: This display is limited to a review-bounded fossil-to-living navigation envelope, not an exact cetacean origination date; numerical stage conversions follow ICS v2026/06 where applicable.
      evidenceBasis: The Origin(s) of Whales directly anchors the sampled window; the display does not extrapolate it into a global taxon duration.
      confidence: medium
      claimIds:
        - claim:taxon:cetacea:source-bounded-range-rc49
      referenceLocators:
        - referenceId: uhen-2010-whale-origins
          locator: 189–219; Abstract; Introduction; fossil history synthesis
        - referenceId: ics-2026-06
          locator: International Chronostratigraphic Chart v2026/06; numerical stage boundaries
      evidenceLevel: literature-synthesized
