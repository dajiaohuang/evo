      morphology:
        status: partially-supported
        claims:
          - text: Perennial herb with 1 or a few leaf rosettes clustered on the crown of a woody stock, flowering stems 1 or occasionally 2 lateral to the new rosette, up to 150 mm tall, loosely greyish-white woolly, closely leafy. Radical leaves up to 60 x 25 mm, but commonly ±35 x 25 mm, obovate, thickly and loosely greyish-white woolly; cauline leaves oblanceolate, up to 30 x 7 mm, decreasing in size upwards, woolly. Heads heterogamous, campanulate, ±20 mm long, double that across the radiating bracts, solitary. Involucral bracts in ±11 series, graded, loosely imbricate, much exceeding flowers, acute, glossy white, crimson at base inside. Receptacle shortly honeycombed. Flowers 172-224, 19-26 female, 153-199 homogamous. Achenes ±1.5 mm long, glabrous. Pappus bristles many, equalling corolla, tips barbellate, bases with patent cilia scarcely cohering.
            sourceIds:
