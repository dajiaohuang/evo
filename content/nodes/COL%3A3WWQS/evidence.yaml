        claims:
          - text: "Tree, 6-18 m high. Leaves in whorls of 3; lamina ovate to obovate, 65-140 x 20-65 mm, glossy above, paler below, stiffly coriaceous, glabrescent, base very shortly attenuate, apex acute to obtuse, tip rounded, ± mucronate, margins weakly undulate, entire to spinose; midrib prominent below; petioles 6-18 mm long. Inflorescence: rachis 85-250 mm long with flowers in regular, sessile or shortly pedicellate pairs. Tepals 5-10 mm long, cream-coloured. Filaments up to 7 mm long. Anthers 0.7-2.2 mm long. Ovary up to 2 mm long; style up to 11 mm long, tip swollen, functioning as pollen presenter. Fruit a globose follicle, 30-40 x 20-45 mm; pericarp leathery, up to 6 mm thick."
            sourceIds:
