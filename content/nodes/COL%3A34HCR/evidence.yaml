          - text: Humile compactum, ad 5 cm. altum; partes herbaceae velutinae ob papillas pat elites minutas capillaceas; rami subftexuosi, in genere lignosi robustique, cuticula pallida, ad 4 mm. diam.; ramuli floriferi erecti, dense 8-12-foliati; folia adscendentia, ovata vel late ovata, prope basin angustata quasi late petiolata, apiculata carinata, supra plana, sat crassa, pallide viridia, ad 1.7 cm. longa, ad 9 mm. lata, vagina 1 mm. longa; flores solitarii diurni, 1.4 cm. diam., peduneulo tereti, ad 5 mm. longo; receptaculum crateriforme, ad 6 mm. diam.; sepala 5 vel rarius 4, inaequilonga, exteriora carinata, interiors externe basi subgibbosa, 5-7 mm. longa; petala 2-seriata, sepala vix superantia, infeme vix angustata, obtusa alba, ad 7 mm. longa, ad 1 mm. lata vel parum ultra; staminodia pallide rosea, ad 4 mm. longa; stamina conico-conferta, filamentis roseis, ad 3.5 mm. longis, interioribus supeme papillatis, polline luteo; glandulae subapproximatae; ovarium medio subcylindrico-elevatum per 1.5 mm., lobis contiguis; stigmata 5 vel rarius 4, anguste subulata, acuminata, 2 mm. longa; capsula expansa 8 mm. diam., g-eneris.
