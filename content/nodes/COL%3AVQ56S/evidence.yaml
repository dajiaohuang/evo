    facets:
      morphology:
        status: partially-supported
        claims:
          - text: The type strain ES5-4T is described as Gram-positive, motile, aerobic and rod-shaped. The authors also report milky, circular, moist, smooth colonies after three days on TSA at 28 °C.
            originalLanguage: en
            sourceIds:
              - paper
            locator: Species description, section ‘Description of Paenibacillus hubeiensis sp. nov.’; type strain ES5-4T
            placeTimeScope: The cultured type strain and the conditions stated in the species description.
            lifeStatus: Wild isolate; evidence is restricted to the named cultured type strain and the paper-reported observations.
        gaps:
          - This is a bounded type-strain description, not a survey of morphology across populations, developmental states or environmental conditions.
      lifeHistory:
        status: not-assessed
        claims: []
        gaps:
          - The cited taxonomic treatment is not a life-history study. Reproductive, developmental, behavioral and lifespan claims were not assessed.
      ecology:
        status: partially-supported
        claims:
          - text: The type strain was isolated from the rhizosphere of Galinsoga parviflora in a selenium-rich ore area of Enshi, Hubei Province, China. The paper reports laboratory tolerance of selenite up to 5000 mg/L; that assay result is not evidence of a field threshold or ecological function.
            originalLanguage: en
            sourceIds:
              - paper
            locator: Abstract; species description and strain isolation account
            placeTimeScope: One cultured type strain and the paper's stated collection context; the selenite value is an in-vitro assay result.
            lifeStatus: Wild isolate; evidence is restricted to the named cultured type strain and the paper-reported observations.
        gaps:
          - No population ecology, interaction network, abundance, field exposure distribution or complete habitat survey was assessed.
      evolution:
        status: partially-supported
        claims:
          - text: The authors place ES5-4T within Paenibacillus using 16S rRNA and a bac120 phylogenomic tree, and report ANI and dDDH values below their stated species-level cutoffs against close type strains. This records the authors' taxonomic evidence, not a comprehensive or independently reviewed species-tree conclusion.
            originalLanguage: en
            sourceIds:
              - paper
            locator: Abstract; phylogenetic and genomic comparison sections; bac120 tree and ANI/dDDH results
            placeTimeScope: The strains, markers, genome comparisons and methods analyzed in this 2025 paper.
            lifeStatus: Wild isolate; evidence is restricted to the named cultured type strain and the paper-reported observations.
        gaps:
          - Alternative taxon sampling, later revisions, gene-tree discordance and independent phylogenomic review were not assessed.
      distribution:
        status: partially-supported
        claims:
          - text: The paper reports the type strain from the Galinsoga parviflora rhizosphere in the selenium-rich ore area of Enshi, Hubei Province, China.
            originalLanguage: en
            sourceIds:
              - paper
            locator: Abstract; strain isolation account
            placeTimeScope: The reported type-strain collection locality only; this is not a global range claim.
            lifeStatus: Wild isolate; evidence is restricted to the named cultured type strain and the paper-reported observations.
        gaps:
          - No additional localities, native or introduced range, georeferenced boundary or sampling completeness were established.
      fossil:
        status: not-assessed
        claims: []
        gaps:
          - No paleontological or fossil database search was conducted; no fossil-presence or fossil-absence conclusion is made.
      conservation:
        status: not-assessed
        claims: []
        gaps:
          - No conservation assessment or current formal Red List record was assessed.
