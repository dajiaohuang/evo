    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, up to 70 mm tall, stem reaching shortly above ground. Leaves sword-shaped, strongly pleated, sheaths minutely hairy, blades smooth. Flowers 2 or 3 in a compact spike, white with red nectar guides, perianth tube ± 22 mm long, cylindrical, tepals outspread, ovary smooth, bracts smooth, with inner forked apically. Late Sept.-early Oct.
            textZh: Babiana lapeirousioides Goldblatt & J.C.Manning 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_14562_0
            locator: "SANBI/WFO archive Morphology row 33032; source identifier 14562.0; cited publication: Goldblatt, P; Manning, JC. 2013. Iridaceae. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 94 - 124. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Readily recognised by the white flowers with red V-shaped markings on the lower tepals, a straight, nearly cylindric perianth tube 22-40 mm long, and long, narrow leaves with sharp, pungent tips. The flowers are typical of those adapted for pollination by long-proboscid flies. When not in flower the stiff, sharply pungent leaves of B. lapeirousioides are easily confused with young plants of blue-flowered B. dregei, which grows in similar habitats in granite outcrops at higher elevations in the Kamiesberg.
            textZh: SANBI 条目提供了 Babiana lapeirousioides Goldblatt & J.C.Manning 的鉴别特征。
