  claims:
    - subjectId: taxon:filicopsida
      claimKind: scientific
      claimType: topology
      statement: A four-gene supermatrix resolves many sampled fern relationships while retaining poorly supported branches; the result describes an extant-heavy sample, not a complete Filicopsida history or fossil range.
      confidence: medium
      confidenceRationale: Broad taxon sampling supports a useful fern topology, but missing sequence data and sparse extinct sampling preclude stronger historical claims.
      referenceLinks:
        - referenceId: lehtonen-2011-fern-tree
          relation: supports
          pages: e24851
          quoteLocator: Methods; Figures 1–3; Supporting Information matrices
    - subjectId: taxon:filicopsida
      claimKind: scientific
      claimType: fossil-range
      statement: "Filicopsida has no supported scalar range here: the historical class concept is not aligned with a single crown or total group, and the review questions Devonian fern assignments while recognizing firmer Lower Carboniferous filicalean evidence; the former 360–0 Ma display is withheld."
      confidence: low
      confidenceRationale: Galtier and Scott (1985) explicitly separates questionable Devonian assignments from firmer Lower Carboniferous filicalean evidence, while Lehtonen (2011) is primarily topological. Low confidence records the unresolved taxonomic boundary.
      referenceLinks:
        - relation: supports
          referenceId: galtier-scott-1985-early-ferns
          pages: 86:289–301
          figure: Two early-diversification diagrams
          quoteLocator: Synopsis and opening discussion
        - relation: contextualizes
          referenceId: lehtonen-2011-fern-tree
          pages: Article e24851
          figure: Figures 1–3
          quoteLocator: Extant-heavy fern topology
  claim-rationales.zh:
    - 较广的类群取样支持有用的蕨类拓扑，但缺失序列数据和稀少的灭绝类群取样限制了更强的历史结论。
    - Galtier 与 Scott（1985）明确区分可疑的泥盆纪归属与更可靠的早石炭世真蕨证据，而 Lehtonen（2011）主要提供拓扑。低置信度记录尚未解决的分类边界。
  claim-statements.zh:
    - 四基因超级矩阵解析了许多取样蕨类关系，同时保留若干低支持分支；该结果描述的是偏重现生类群的样本，不是完整的真蕨类历史或化石范围。
    - Filicopsida 在此不发布单一范围：这一历史纲级概念未与单一冠群或总群对齐，综述质疑泥盆纪蕨类归属而认可更可靠的早石炭世真蕨证据；旧有 360–0 Ma 展示被暂缓。
