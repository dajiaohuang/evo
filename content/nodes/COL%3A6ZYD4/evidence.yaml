    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Bulbous geophyte, 5-15(-27) cm. Leaves 4-6, spreading, filiform. Flowers 1-4, small, erect, funnel-shaped, white to pink, scape wiry, spirally twisted below, persisting after fruiting.
            textZh: Strumaria spiralis (L'Hér.) W.T.Aiton 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13845_0
            locator: "SANBI/WFO archive Morphology row 8823; source identifier 13845.0; cited publication: Snijman, DA. 2012. Amaryllidaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 53 - 62. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: The species is distinguished by the funnel-shaped flowers, a perigone tube to which the filaments are decurrent and inner stamens which are adnate to the somewhat stout style for approximately 1 mm. The seeds are comma-shaped in outline due to the presence of a short curved hook. Other species of Strumaria also have stamens which are adnate to the style, but never only the inner whorl.
            textZh: SANBI 条目提供了 Strumaria spiralis (L'Hér.) W.T.Aiton 的鉴别特征。
