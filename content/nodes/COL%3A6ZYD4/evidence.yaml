        claims:
          - text: "The species occupy a range of habitats: flats, slopes or rock crevices; either in loam, sand or limestone; but always in areas that remain seasonally moist in winter. The associated vegetation varies from fynbos, renosterbos to marginal succulent veld of the Little Karoo. The populations are localised, either small when confined to rocky sites or forming extensive patches on open flats."
