    facets:
      morphology:
        status: partially-supported
        claims:
          - text: The treatment describes source-named Hyphessobrycon peugeoti with an elongated, filamentous dorsal fin in mature males and red coloration in life, contrasted with golden H. loweae. Its diagnosis reports five horizontal scale rows from dorsal-fin origin to lateral line and 21-24 branched anal-fin rays (mode 22), compared with six to seven rows and 17-21 rays (mode 20) in H. loweae. These are comparative diagnosis and examined-material values, not estimates across all populations.
            originalLanguage: en
            sourceIds:
              - ingenito_lima_buckup_2013
              - plazi_hyphessobrycon_archive
            locator: "Plazi description-extension row 4 (diagnosis), row 5 (description); treatment https://treatment.plazi.org/id/03D2C41AD054FFBBFC77FE36FBF4F1CB; Ingenito, Leonardo F. S., Lima, Flávio C. T., Buckup, Paulo A. (2013): A new species of Hyphessobrycon Durbin (Characiformes: Characidae) from the rio Juruena basin, Central Brazil, with notes on H. loweae Costa & Géry. Neotropical Ichthyology 11 (1): 33-44. DOI 10.1590/S1679-62252013000100004; article pp. 34-37; archive SHA-256 5a0fd2206af2b824dd67882f2fee9ac1cd4f7f1713fa831cbf3e7f35aad87d84. Source spelling Hyphessobrycon peugeoti and synonym usage KVD6K resolve to accepted 3NRZH; this is not an additional accepted species."
            placeTimeScope: Diagnosis and description in the 2013 treatment, pp. 34-37, Plazi rows 4-5. The fin and live-color comparison concerns mature males / reported live coloration; Table 1 morphometrics use 24 specimens, while individual meristic counts have character-specific counts.
            lifeStatus: The morphology summarizes type and examined specimens in the cited treatment; it does not establish variation across all populations or life stages.
        gaps:
          - Only comparative diagnoses and selected meristic / specimen description data from one taxonomic article are represented; population-wide variation, additional life stages, and unreported characters remain unassessed.
      lifeHistory:
        status: not-assessed
        claims: []
        gaps:
          - The cited specimen collection dates and early-dry-season collection note do not establish a full reproductive calendar, development, lifespan, or complete life cycle.
      ecology:
        status: partially-supported
        claims:
          - text: "The authors report specimens collected in shallow areas under one metre deep in the early dry season, but the recorded sites differ: the type locality was a swampy, deforested roadside area beside preserved forest; MNRJ 29609 came from below a recently breached dam; the single MNRJ 29503 specimen came from a clear, sandy-bottom flowing stream with sparse aquatic vegetation; and named paratypes came from a flooded area beside the rio Juruena. These collection settings do not define a uniform species-wide niche."
            originalLanguage: en
            sourceIds:
              - ingenito_lima_buckup_2013
              - plazi_hyphessobrycon_archive
            locator: "Plazi description-extension row 6 (biology_ecology); treatment https://treatment.plazi.org/id/03D2C41AD054FFBBFC77FE36FBF4F1CB; Ingenito, Leonardo F. S., Lima, Flávio C. T., Buckup, Paulo A. (2013): A new species of Hyphessobrycon Durbin (Characiformes: Characidae) from the rio Juruena basin, Central Brazil, with notes on H. loweae Costa & Géry. Neotropical Ichthyology 11 (1): 33-44. DOI 10.1590/S1679-62252013000100004; article pp. 34, 37; archive SHA-256 5a0fd2206af2b824dd67882f2fee9ac1cd4f7f1713fa831cbf3e7f35aad87d84. Source spelling Hyphessobrycon peugeoti and synonym usage KVD6K resolve to accepted 3NRZH; this is not an additional accepted species."
            placeTimeScope: Habitat and ecological notes in the 2013 treatment, p. 37, Plazi row 6; associated examined-material dates are listed on p. 34. The Fazenda São Nicolau type-locality material includes 5-6 May 2006 collections; ZUEC 6362 is dated 25-26 July 1997. Sites and dates refer to reported lots only; the article describes the species distribution as tributaries of the middle rio Juruena, upper rio Tapajós basin, Mato Grosso, Brazil.
            lifeStatus: The claim reports wild collection localities and field observations in the taxonomic treatment. It does not infer habitat preference, seasonal use beyond the cited collections, or conditions at unreported sites.
        gaps:
          - Evidence is limited to the article's named locality and collection-site observations. Habitat preference, environmental tolerances, interactions, sampling completeness, and unsampled populations remain unassessed.
