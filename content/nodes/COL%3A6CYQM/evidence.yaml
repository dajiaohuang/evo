      ecology:
        status: partially-supported
        claims:
          - text: D. klugei is a newly described species and, although not inconspicuous in its rocky habitat of short, sour grassland and forbs, easily overlooked. Occurring in small, scattered colonies of four to 10 individuals on mountain slopes in the mistbelt with good drainage and reliable rainfall. Associated taxa include Rabdosiella calycina, Erica drakensbergensis, Watsonia wilmsii, and the grasses Diheteropogon filifolius, Rendlia altera and Alloteropsis semialata. No fragrance detected.
