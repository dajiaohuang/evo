            locator: "SANBI/WFO archive Morphology row 84119; source identifier 8917.0; cited publication: McMurtry, DM; Grobler, L; Grobler, J; Burns, S. 2008. Field guide to the orchids of northern South Africa and Swaziland. Umdaus Press, Pretoria. [All rights reserved]"
