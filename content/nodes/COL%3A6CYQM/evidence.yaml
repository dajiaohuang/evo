    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Slender terrestrial, (200-)260(-320) mm tall. Leaves cauline, spreading, up to 90 mm long, upper surface texture matt, blade applanate apically, grading into floral bracts; bracts dry back from apex, longer than the ovaries. Inflorescence laxly 12-26-flowered. Flowers white, partially suffused pale to deep pink. Lateral sepals 8 mm long, spreading, lime- yellow, irregularly blotched vivid red-purple. Petals white, sparsely speckled and blotched red-purple. Lip 8 mm long, white, smudged raspberry red basally and randomly blotched vivid red-purple apically. Spur 9-11 mm long, decurved from ± middle, slightly dorsiventrally flattened at base becoming terete, apex rounded.
            textZh: Disa klugei McMurtry 的 SANBI 物种条目记录了形态特征。
            sourceIds:
