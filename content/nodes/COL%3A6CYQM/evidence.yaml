            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: "The rather similar flower colours of D. klugei and D. vigilans may cause confusion, but they are easily separated. D. klugei is undoubtedly closely allied to D. patula var. transvaalensis, but various characters in combination separate them. D. klugei, flower colour: white & lime-yellow, blotched red-purple; leaves: spreading applanate, soft; spur 9-11 mm long, decurved; plant: ± 260 mm tall, rare, restricted distribution. D. patula var. transvaalensis, flower colour: shades of pink, dotted lilac; leaves: spreading conduplicate, firm; spur 9-12 mm long, straight; ± 410 mm tall, common, widespread."
