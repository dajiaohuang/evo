  claims:
    - subjectId: taxon:enaliarctos
      claimKind: scientific
      claimType: fossil-range
      statement: The Enaliarctos profile is anchored by the virtually complete Enaliarctos mealsi skeleton LACM 4321 from the Jewett Sand at an explicitly approximate age of 23 Ma; its swimming and terrestrial capabilities are comparative models, not a global genus range or direct pinniped ancestor claim.
      confidence: medium
      confidenceRationale: The named skeleton and formation are direct; locomotor reconstruction remains inferential and is excluded from the temporal bound.
      referenceLinks:
        - relation: supports
          referenceId: berta-ray-1990-enaliarctos
          pages: 141–157
          figure: Figures 1–8
          quoteLocator: Skeletal description; locality; limb proportions
        - relation: supports
          referenceId: berta-ray-wyss-1989-enaliarctos
          pages: 60–62
          quoteLocator: "Abstract: nearly complete skeleton from California rocks, approximately 23 million years old"
    - subjectId: taxon:enaliarctos
      claimKind: scientific
      claimType: taxonomy
      statement: Berta and Ray describe LACM 4321 as Enaliarctos mealsi and test pinniped relationships from its skeletal anatomy; their sampled topology is not a direct-ancestor assertion or a universal pinniped phylogeny.
      confidence: medium
      confidenceRationale: The named skeleton and the study's comparative analysis are explicit, whereas the broader phylogenetic interpretation remains model- and taxon-sample-dependent.
      referenceLinks:
        - relation: supports
          referenceId: berta-ray-1990-enaliarctos
          pages: 141–157
          figure: Figures 1–8; Tables 1–6
          quoteLocator: Skeletal description; systematic comparison; locomotor capabilities
    - subjectId: taxon:enaliarctos
      claimKind: scientific
      claimType: biogeography
      statement: The profiled Enaliarctos mealsi skeleton comes from the Pyramid Hill Sandstone Member of the Jewett Sand in central California; this occurrence does not establish a genus-wide Pacific distribution or pinniped dispersal route.
      confidence: high
      confidenceRationale: The member and central-California occurrence are directly reported for LACM 4321; the claim does not extend one locality into an inferred distribution.
      referenceLinks:
        - relation: supports
          referenceId: berta-ray-1990-enaliarctos
          pages: 141–157
          figure: Figure 1
          quoteLocator: Locality and geological setting; Pyramid Hill Sandstone Member of the Jewett Sand
    - subjectId: taxon:enaliarctos
      claimKind: scientific
      claimType: morphology
      statement: LACM 4321 preserves a virtually complete skeleton, including lumbar vertebrae and flipper-like limbs with developed bony processes and muscle-attachment areas documented in the anatomical description.
      confidence: high
      confidenceRationale: The preserved skeletal elements and comparative descriptions are directly documented for the named specimen; functional consequences are kept separate.
      referenceLinks:
        - relation: supports
          referenceId: berta-ray-1990-enaliarctos
          pages: 141–157
          figure: Figures 1–8; Tables 1–6
          quoteLocator: Skeletal description; vertebral column; forelimb and hindlimb morphology
    - subjectId: taxon:enaliarctos
      claimKind: scientific
      claimType: ecology
      statement: Comparative axial and limb morphology is used to infer aquatic and terrestrial locomotor capability for LACM 4321, but the study does not directly observe diet, habitual habitat, swimming strokes or a feeding guild.
      confidence: medium
      confidenceRationale: The skeletal measurements support a bounded functional comparison, while behaviour and ecology are not directly preserved and remain unassigned.
      referenceLinks:
        - relation: supports
          referenceId: berta-ray-1990-enaliarctos
          pages: 141–157
          figure: Figures 4–8; Tables 3–6
          quoteLocator: Locomotor capabilities; limb proportions; vertebral-column comparison
  claim-rationales.zh:
    - 具名骨架与地层属于直接证据；运动复原仍属推断，不进入时间边界。
    - 具名骨架和研究的比较分析均有明确记录，但更宽泛的系统发育解释仍取决于模型与类群取样。
    - LACM 4321 的地层段与加利福尼亚中部出现记录均有直接报告；本主张不把单一产地外推为推断分布。
    - 所保存的骨骼构件及其比较性描述直接记录于具名标本；功能后果另行保留。
    - 骨骼测量支持有界的功能比较，但行为与生态并未直接保存，因此保持未赋值。
  claim-statements.zh:
    - Enaliarctos 档案由 Jewett Sand 的近乎完整 Enaliarctos mealsi 骨架 LACM 4321 锚定，其年龄明确仅为约 2300 万年前；游泳与陆地能力属于比较模型，不是全球属级范围或鳍足类直接祖先主张。
    - Berta 与 Ray 将 LACM 4321 描述为 Enaliarctos mealsi，并以其骨骼解剖检验鳍足类关系；该研究的取样拓扑不是直系祖先断言，也不是普遍的鳍足类系统树。
    - 档案中的 Enaliarctos mealsi 骨架来自加利福尼亚中部 Jewett Sand 的 Pyramid Hill Sandstone Member；这一出现记录不能确立属级的太平洋分布或鳍足类扩散路线。
    - LACM 4321 保存了一具近乎完整的骨架，包括腰椎以及在解剖描述中记录的、具有发达骨突和肌肉附着区的鳍状肢。
    - 研究以轴骨和肢骨的比较形态推断 LACM 4321 的水生与陆生运动能力，但并未直接观察食性、习性栖息地、游泳动作或摄食功能群。
