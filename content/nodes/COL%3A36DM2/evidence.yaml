        claims:
          - text: Finely leafy, single-stemmed, aromatic shrublet to 40 cm. Leaves linear, mucronate. Flowers in dense, terminal racemes, small, petals emarginate, disc much pitted.
            sourceIds:
              - sanbi_14402_0
            locator: "SANBI/WFO archive Morphology row 11416; source 14402.0; publication: Manning, JC; Goldblatt, P. 2012. Rutaceae: Diosma L. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 718 - 719. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Diosma parvula is recognised as distinct being a glabrous shrub, regenerating only from seed after fires; with very slender branchlets, eciliate leaves; flowers 2.5 mm in diam., pedicellate with petals retuse and having a very small fruit. It is most like Diosma hirsuta which however coppices after fires, has flowers 4-5 mm in diameter and much larger fruits.
