        claims:
          - text: Like M. fugax but plants smaller, stem slender, leaves 2, usually ± filiform, flowers small, blue, violet, or white, opening early afternoon.
            textZh: Moraea filicaulis Baker 的 SANBI 物种条目记载了植株、叶片和花部形态。
            sourceIds:
              - sanbi_13878_0
            locator: Strelitzia 29; archive Morphology row 7425, source 13878.0
            placeTimeScope: Regional species account published 2012; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
          - text: Closely resembling Moraea fugax in general appearance except smaller in all features, M. filicaulis has a slender, almost filiform stem ± 1 mm in diam., and one or more often two subequal or unequal, filiform, narrowly channelled leaves inserted at the first above ground internode. The flowers are usually white, but occasionally pink or blue-mauve or even violet, and have outer tepals mostly 20-35 mm long (occasionally longer) and inner tepals 18-30 mm long. Flowers of M. fugax have outer tepals mostly 30-45 mm long and inner tepals 25-35 mm long. The inner rhipidial spathes, a useful measure of plant size, are 20-35(-40) mm long in M. filicaulis but 40-65 mm long in M. fugax. Moraea filicaulis has been treated as a subspecies of M. fugax and an important reason for recognising it as a separate species is that it sometimes co-occurs with typical M. fugax but always showing slightly different habitat preferences.
            textZh: SANBI 条目提供了 Moraea filicaulis Baker 的鉴别特征。
            sourceIds:
