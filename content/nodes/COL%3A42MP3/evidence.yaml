          publishedAt: undated
          originalSourceText: Tall shrub or tree to 15 m. tall, the younger stems, petioles, lower leaf-surface, panicle, and hypanthia thinly but completely canescent with stellate hairs; younger stems strongly flattened and two-edged; petioles stout, 2-6 cm. long; leaf-blades firm, broadly elliptic, up to 25 cm. long, about half as wide, abruptly short- acuminate, entire or denticulate, obtuse to -rounded at base, 5-nerved, glabrous above; panicle widely branched, 1-2 dm. long; flowers sessile, 5-merous; hypan- thium obconic, about 2 mm. long; calyx almost truncate, the obscure lobes 0.2 mm. long; petals inequilateral, obovate-oblong, 3 mm. long; connective of the larger stamens prolonged at base into two small lateral lobes, that of the smaller stamens unlobed at base or with a minute dorsal lobe only; terminal pore large, as wide as the anther; stigma capitate.
