    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Annual herb, stems 150-450 mm tall, solitary or up to c. 12 loosely tufted from base, usually simple, sometimes with a pair of branches low down, puberulous, hairs to 0.25 mm, balloon-tipped, glandular-puberulous as well, either nude or remotely leafy in lower part. Leaves in 2-4 pairs near base of each stem, often crowded, sometimes straggling to halfway up stem, bases connate, blade 25-90 x 7-30 mm, narrowly to broadly elliptic or oblanceolate tapering to a petiolar part 5-20 mm long (less than 1/4 length of blade), margins usually finely to coarsely serrate, occasionally subentire, both surfaces glandular-puberulous. Flowers many in simple terminal racemes, crowded at first, often distant in fruit. Bracts (lowermost) 2.5-4 x 0.5-1 mm, lanceolate, acute. Pedicels (lowermost) 3-6 mm long, shorter upwards. Calyx obscurely bilabiate, tube 0.4-0.75 mm long, anticous lobes 2.5-5 x 0.6-1 mm, anticous lip split 2-4 mm, posticous lobes 2.4-4.2 x 0.6-0.7 mm, posticous lip split 2.5-4.2 mm, all lobes oblong-lanceolate, puberulous all over outside and margins, both glandular and balloon-tipped hairs to 0.25 mm long. Corolla tube 7-10 x 1.2-1.6 mm in throat, cylindric, expanded in ± upper third, limb distinctly bilabiate, 7.5-10 mm across lateral lobes, posticous lobes 3-4 x 2-2.5 mm, anticous lobe 3-4.5 x 1.4-2.5 mm, all ± elliptic, margins usually revolute, white or creamy-white to dull yellow, orange/yellow around mouth and in throat, tube puberulous, hairs to c. 0.1 mm, balloon-tipped, very occasional gland-tipped hairs as well, ± sessile glistening glands on backs of lobes, inside a longitudinal posticous band of clavate hairs plus 4 lesser bands, posticous hairs often dark. Stamens 4, anticous anthers 0.5-0.8 mm long, tips just visible in mouth, posticous anthers 1.4-1.8 mm long, included, posticous filaments bearded, hairs dark. Stigma 5-6.5 mm long, shortly exserted or just included. Style 0.6-1.7 mm long. Ovary 1.5-2 x 0.8-1.4 mm. Capsules c. 4.5-6 x 3-4 mm. Seeds c. 0.7 x 0.4 mm, pallid. Flowering mainly between May and October.
            sourceIds:
              - sanbi_15191_0
            locator: "SANBI/WFO archive Morphology row 60941; source 15191.0; publication: Vollesen, KB. 2013. 126. Acanthaceae (Part 1), Fl. Zambes. 8(5): 1 - 184. Royal Botanic Gardens, Kew, London. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Manulea bellidifolia is an annual and may be recognized by its woody taproot crowned with several loosely arranged stems with leaves mostly crowded near the base, simple racemes, and distinctly balloon-tipped hairs on the corolla tube and also on the calyx and stems but there mixed with gland-tipped hairs. These characters (except that of the raceme) help to distinguish it from its ally M. plurirosulata. The annual habit, loosely arranged leaves and simple racemes at once distinguish it from M. crassifolia.
