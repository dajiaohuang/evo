    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Caulescent succulent to 20 cm. Leaves light green, not pungent, smooth and finely striate. Flowers in lax racemes, erect, white with yellow tepals, midribs pale green, outer tepals sometimes slightly inflated below.
            textZh: Astroloba herrei Uitewaal 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13852_0
            locator: "SANBI/WFO archive Morphology row 9036; source identifier 13852.0; cited publication: Meyer, NL; Smith, GF. 2012. Asphodelaceae: Astroloba Uitewaal. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 71 - 71. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: This is a very remarkable species, differing from all other Astrolobas in the very glaucous leaves (especially the younger leaves being distinctly covered with a waxy layer), in the many conspicuous darker lines on the backs of the leaves and in the ovoid flowers on very long pedicels.
            textZh: SANBI 条目提供了 Astroloba herrei Uitewaal 的鉴别特征。
