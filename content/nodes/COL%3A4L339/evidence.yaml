      morphology:
        status: partially-supported
        claims:
          - text: Glandular-hairy annual to 20 cm. Leaves sometimes coarsely toothed. Flowers in small, terminal clusters, white or cream-coloured with orange patch below upper lobes, flushed purple on back, salver-shaped, tube hairy, 8-25 mm long.
            sourceIds:
              - sanbi_14442_0
            locator: "SANBI/WFO archive Morphology row 5894; source 14442.0; publication: Manning, JC; Goldblatt, P. 2012. Scrophulariaceae: Polycarena Benth. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 752 - 752. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: "It is a small annual herb, well branched from the base, with long narrow leaves and 1-7-flowered heads that soon become lax, the flowers small (corolla tube up to 10 mm long, pubescent, limb 5-8 mm in diam.). Collector's notes are meagre, merely a cryptic 'white' and 'cream' on two sheets, but all the material has dried with both corolla tube and lobes self-coloured (apart from the usual orange patch in the throat). Measurements and other information in square brackets refer to a plant that has been included in a broad circumscription of P. gilioides. This plant ranges from about Piquetberg north to the Giftberg south west of Klawer (3118DC). It has mostly larger flowers (corolla tube 9-25 mm long, limb mostly 7-11 mm across the lateral lobes). Again, there is no precise information about the colour of the corolla: four collectors have merely recorded 'white', 'cream', 'pink', 'purple'. But in many instances, the backs of the corolla lobes or the corolla tube, sometimes both, have dried with a purplish flush. These plants may have been influenced by P. gracilis, here sympatric with P. gilioides sens, lat.: P. gracilis normally has a purple flush on the outside of the corolla. In the vicinity of Sauer, Hopefield, Ysterfontein and Darling, the influence may have come from P. lilacina."
