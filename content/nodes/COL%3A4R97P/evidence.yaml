    facets:
      morphology:
        status: partially-supported
        claims:
          - text: "The SANBI e-Flora morphology field describes Radinosiphon lomatensis (N.E.Br.) N.E.Br.: plants 300–750 mm high, with naked basal stolons, 6–9 mostly basal leaves, and an inclined 2–10-flowered spike; the pale to deep pink flowers have dark-pink median streaks and a (25–)30–45 mm perianth tube."
            textZh: SANBI e-Flora 形态字段记载 Radinosiphon lomatensis (N.E.Br.) N.E.Br.：株高 300–750 mm，具裸露的基部匍匐枝；叶 6–9 枚，多基生；倾斜花穗有 2–10 朵浅至深粉色花，具深粉色中线条纹，花被管长 (25–)30–45 mm。
            sourceIds:
              - sanbi-archive
            locator: SANBI e-Flora source 18638.0, morphology row 98856
            placeTimeScope: SANBI e-Flora source 18638.0, southern African species-description fields; no global or current-population inference.
            lifeStatus: Wild regional-flora evidence; cultivation is not covered by the cited claim.
          - text: "The diagnostic field records: Distinguished from Radinosiphon leptostachya by its larger flowers, with longer perianth tube, (25-)30-45 mm long, broader tepals, the uppermost 12-15 x 3-7 mm, slightly longer filaments 6-7 mm long, and anthers 5-6 mm long. Plants of R. lomatensis reproduce vegetatively by slender, naked stolons quite different from the thick, scaly rhizomes developed in R. leptostachya. The species is evidently outcrossing, producing larger capsules with up to 8 seeds per locule, unlike autogamous R. leptostachya, which produces small capsules, 4-6 mm long, containing just 1 or 2 seeds (rarely up to 5 in tropical Africa) per locule."
            textZh: 档案诊断字段记载：Distinguished from Radinosiphon leptostachya by its larger flowers, with longer perianth tube, (25-)30-45 mm long, broader tepals, the uppermost 12-15 x 3-7 mm, slightly longer filaments 6-7 mm long, and anthers 5-6 mm long. Plants of R. lomatensis reproduce vegetatively by slender, naked stolons quite different from the thick, scaly rhizomes developed in R. leptostachya. The species is evidently outcrossing, producing larger capsules with up to 8 seeds per locule, unlike autogamous R. leptostachya, which produces small capsules, 4-6 mm long, containing just 1 or 2 seeds (rarely up to 5 in tropical Africa) per locule.
            sourceIds:
              - sanbi-archive
            locator: SANBI e-Flora source 18638.0, diagnostic row 95109
            placeTimeScope: SANBI e-Flora source 18638.0, southern African species-description fields; no global or current-population inference.
            lifeStatus: Wild regional-flora evidence; cultivation is not covered by the cited claim.
