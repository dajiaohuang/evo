            locator: "SANBI/WFO archive Morphology row 32903; source identifier 14533.0; cited publication: Klopper, RR; Smith, GF. 2013. Asphodelaceae: Aloe. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 45 - 48. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Differences between this species on the one hand and A. perfoliata and A. arenicola on the other are dealt with under those species. The leaves of A. meyeri are erect to spreading, unlike those of A. dabenorisana, which are reflexed, and are smaller than those of that species. The inflorescence is smaller and the bracts are 3-nerved, not 1-nerved.
            textZh: SANBI 条目提供了 Aloe meyeri van Jaarsv. 的鉴别特征。
