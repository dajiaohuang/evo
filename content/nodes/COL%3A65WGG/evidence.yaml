    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Pendulous, with stem up to 1 m long, branching from base or forming off-shoots along length of stem. Leaves blue-green, up to 300 mm long, erectly spreading, dry leaves soon dropping, margins with small, white teeth. Flowers in unbranched, capitate, upcurved panicles, reddish orange with green tips.
            textZh: Aloe meyeri van Jaarsv. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
