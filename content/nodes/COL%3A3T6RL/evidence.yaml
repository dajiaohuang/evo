          - title
          - url
          - scope
        metadataVariant: 0
        usage:
          scope:
            zh: 2011 年秘鲁东北部 Quebrada Blanco 两群比较，一群可进入十年生次生林、另一群只用原生林；猎物捕获结论受地点、季节和两群样本限制。
            en: "A 2011 comparison of two groups at Quebrada Blanco in northeastern Peru: one had access to ten-year-old secondary forest and one used primary forest; prey-capture findings are limited to those groups, site and season."
