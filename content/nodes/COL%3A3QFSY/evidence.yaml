        claims:
          - text: Cormous geophyte, 20-40 cm. Leaves 2, lowermost lanceolate, with 3 prominent veins, upper leaf entirely sheathing. Flowers pink, pale in throat, tube filiform, anthers oblong, style branches recurved.
            textZh: Ixia trinervata (Baker) G.J.Lewis 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 7135; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: I. trinervata is readily recognized by the presence of just one foliage leaf, the blade narrowly sword-shaped and with three ± equally conspicuous veins and unthickened margins. A second leaf is largely to entirely sheathing, although relatively broad. The flowers are an intense, bright mauve pink or red-magenta. This species is considered most closely related to usually pale pink-flowered I. stricta, which blooms later in the season, at which time its 3-5 leaves are usually dry. Both species favour clay or clay loam soils. The new I. bifolia recalls I. trinervata in its single foliage leaf, but the leaf blade is much narrower than in I. trinervata, with a single main vein embedded in the leathery-succulent leaf tissue. When dry the leaf margins appear particularly thickened, unlike those of I. trinervata. The flowers of I. bifolia are slightly smaller than those of I. trinervata and have unusual, almost straight, deep pink style branches in marked contrast to the pale pink, falcate style branches of I. trinervata. Agreement with Raimondo et al.’s (2009) estimate of near threatened status (NT) for I. trinervata.
            textZh: SANBI 条目提供了 Ixia trinervata (Baker) G.J.Lewis 的鉴别特征。
            sourceIds:
              - sanbi_15933_0
            locator: "SANBI/WFO archive Diagnostic row 84447; source identifier 15933.0; cited publication: Goldblatt, P; Manning, JC. 2012. Systematics of the southern African genus Ixia (Iridaceae): 4. Revision of sect. Dichone. Bothalia 42(2): 87 - 110. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Readily recognised by the presence of just one foliage leaf, the blade narrowly sword-shaped, mostly 6-10 mm wide, with three ± equally conspicuous veins and unthickened margins. A second leaf is largely to entirely sheathing, although relatively broad. The flowers are an intense, rose-pink also described as red-magenta. Related I. bifolia recalls I. trinervata in its single foliage leaf, but the leaf blade is much narrower, usually only 3-5 mm wide, with a single main vein embedded in the leathery, almost succulent leaf tissue. When dry the leaf margins appear moderately thickened, unlike those of I. trinervata. The flowers of I. bifolia are slightly smaller than those of I. trinervata and have unusual, almost straight, deep pink style branches in marked contrast to the pale pink, falcate style branches of I. trinervata.
            textZh: SANBI 条目提供了 Ixia trinervata (Baker) G.J.Lewis 的鉴别特征。
