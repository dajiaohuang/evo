          originalSourceText: surface sparsely puberulous and glandular punctate, the veins prominently trinervate from base; petioles slender, to 2.0 cm long. Inflorescence a lax panicle with loosely cymose branches, the ultimate branches to 12 mm long, slender, puberulous. Heads ca. 4 mm high with ca. 25 florets; involucral bracts ca. 25, subimbricate, unequal, in 2-3 series, mostly bicostate, narrowly acute with narrow scarious margins, the outer bracts with long attenuate tips; corolla usually lavender, ca. 2 mm long, with short hairs on lobes; style branches usually slender. Achenes narrowly oblong with nearly equal constrictions above and below, black when mature, ribs black, scabrid above and on the ribs; pappus of ca. 25 slender scarcely contiguous bristles. Chromosome number n= 10.
