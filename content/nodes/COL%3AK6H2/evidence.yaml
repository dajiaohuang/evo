    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Stemless, cormous geophyte, mostly 80-150 mm tall, stem occasionally branched at ground level. Leaves lanceolate, hairy, in a basal tuft. Flowers 2-4 in a compact spike, bilabiate, white or flushed pale mauve with pale yellow markings, intensely fragrant, perianth tube elongate cylindrical, 45-65 mm long, ovary smooth, bracts hairy, inner forked apically. Mainly Sept.-Oct.
            textZh: Babiana virginea Goldblatt 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_14562_0
            locator: "SANBI/WFO archive Morphology row 33044; source identifier 14562.0; cited publication: Goldblatt, P; Manning, JC. 2013. Iridaceae. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 94 - 124. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: An acaulescent species, Babiana virginea has densely hairy, lanceolate leaves exceeding the typically white but sometimes pale mauve flowers. The flowers are large, with a tube up to 65 mm long and dorsal tepal 35-40 mm long, and have a strong, clove-like fragrance suggesting moth pollination. Babiana virginea is perhaps most closely related to the widespread, blue-flowered B. sambucina, also acaulescent, and can be distinguished from that species by the leaf vestiture, usually almost smooth or sparsely scabrid. The lowermost outer floral bract in B. sambucina is produced upward as a small leaf, a feature sometimes weakly developed in B. virginea.
            textZh: SANBI 条目提供了 Babiana virginea Goldblatt 的鉴别特征。
