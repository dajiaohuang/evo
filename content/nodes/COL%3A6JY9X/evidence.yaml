        claims:
          - text: Acaulescent succulent to 90 cm. Leaves in a rosette or distichous, triangular, often channelled, smooth to tuberculate, margins toothed. Flowers in an inclined raceme, nodding, pink and green, barely inflated below.
            textZh: Gasteria carinata (Mill.) Duval 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13855_0
            locator: "SANBI/WFO archive Morphology row 9070; source identifier 13855.0; cited publication: Manning, JC; Goldblatt, P. 2012. Asphodelaceae: Gasteria Duval. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 74 - 75. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: "Gasteria carinata is the most variable species in the genus, and it is difficult to define clearly as populations vary continuously. Except for the variety retusa, however, it is the only species that occurs south of the Langeberg and therefore cannot be confiised with any other. G. carinata can be recognized by the following characteristics: plants acaulescent with triangular to triangular-lanceolate, tuberculate or smooth (rarely asperulous) leaves which are rosulate or spirally arranged (rarely distichous). Juvenile and adult leaves always have a similar texture. The plants are prolific from the base to form small groups. In floral characters the species is also variable, especially in size. It closely resembles G. nitida, G. ellaphieae and G. vlokii, but these flower in December and January (bright red-pink). G. vlokii has patent, falcate leaves with an asperulous leaf epidermis. G. nitida has a branched inflorescence (perianth with yellowish apices) and juvenile leaves that change from tuberculate to smooth in the adult stage. G. ellaphieae has short, triangular, recurved and tuberculate leaves. G. carinata also resembles G. disticha and G. brachyphylla (which occur north of the Langeberg), but it can be distinguished from those by its smaller stature and different leaf shape and texture. G. brachyphylla and G. disticha are larger, usually with broad (40-80 mm), lorate, smooth or asperulous leaves which remain distichous. Three varieties of G. carinata are recognized, based on leaf shape, phyllotaxy and epidermis texture."
            textZh: SANBI 条目提供了 Gasteria carinata (Mill.) Duval 的鉴别特征。
            sourceIds:
              - sanbi_8534_0
            locator: "SANBI/WFO archive Diagnostic row 78231; source identifier 8534.0; cited publication: Van Jaarsveld, EJ. 1994. Gasterias of South Africa: a new revision of a major succulent group. Fernwood Press, Cape Town. [All rights reserved]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
