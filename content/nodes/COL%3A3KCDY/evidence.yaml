          publishedAt: undated
          originalSourceText: Herbs, prostrate, the stems 0.5 m long or longer, glabrous, succulent, some- times glaucous on the younger parts. Leaves alternate or somewhat fasciculate, oblanceolate, lanceolate, or spatulate, obtuse, entire, the bases attenuate, to 4 cm long and 1 cm wide, glabrous, succulent, somewhat glaucous; petioles indistinct. Inflorescences + spikes, unilateral, mostly terminal, ca 2-5 cm long, the bracts absent. Flowers sessile, + actinomorphic; calyx of 5 sepals, slightly connate basally, elongate-deltoid, ca 1.2-1.5 mm long; corolla salverform, white, the tube somewhat saccate, ca 1.2 mm long, each lobe ca 0.8 mm long; stamens 5, + sessile, the anthers ca 0.6-0.7 mm long; ovary 4-lobed, the disk obscure, the style absent, the stigma conical, annular-pubescent at the widened base. Fruit 4-lobed, separating into 4 nutlets at maturity, the nutlets glabrous, wedge-shaped, ca 1.6- 1.7 mm long.
          originalLanguage: en
          sourceField: general
