    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Perennial herb, geophyte, 0.5-1.1 m high; corm depressed-globose, tunics firm-papery to coriaceous; stem straight, erect, occasionally branched, pubescent. Leaves 5-7, ensiform to linear, sheaths villous to pubescent, 3-16 mm wide, margins, midribs and secondary veins thickened and hyaline. Bracts pale green, villous to pubescent or smooth, apex membranous, often twisted. Inflorescence a 12-20(-40)-flowered spike, distichous, erect; flowers greenish to cream-coloured, pale lilac or dull red; tepals sometimes minutely dotted; perianth tube obliquely funnel-shaped, widening or recurving outward near apex; tepals unequal, dorsal longest and hooded over stamens. Stamens exserted, yellow; pollen whitish. Ovary narrowly oblong; style arching over stamens. Flowering time Feb.-Apr. Capsule obovoid to oblong, apex 3-lobed, auriculate above.
            textZh: Gladiolus sericeovillosus Hook.f. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_18505_0
            locator: "SANBI/WFO archive Morphology row 90995; source identifier 18505.0; cited publication: Bredenkamp, CL; Magwaza, ZL. 2019. Iridaceae. In: CL Bredenkamp (ed.), A Flora of the Eastern Cape Province, Strelitzia 41(3): 1821 - 1882. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Recognised by the markedly two-ranked spikes of rather dull coloured, often greenish flowers with inflated, pleated bracts. The narrow, fibrous leaves often form a distinct pseudostem, the blades arising well above the ground, with strongly thickened midrib, margins and one or more pairs of other veins. Plants flower in the late summer and autumn.
