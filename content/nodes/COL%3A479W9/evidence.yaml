        claims:
          - text: Small shrub, up to 500 mm tall. Bracts obovate, acuminate. Flowers in dense strobilate axillary spikes; with small white hairs. Flowers white.
            sourceIds:
              - sanbi_11118_0
            locator: "SANBI/WFO archive Morphology row 2848; source 11118.0; publication: Herman, PPJ; Retief, E. 1997. Plants of the northern provinces of South Africa: Keys and diagnostic characters. Strelitzia 6: 1 - 681. National Botanical Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: The variation in this species is difficult to analyse satisfactorily. In the Zambezi valley, from where the type of the specific name comes, plants are uniformly vigorous perennial herbs or subshrubs with large leaves with a very characteristic shape which we have described as subpandurate (with a narrow truncate base and concave lower margins. Similar plants (var. africanus) also seem to occur in the Limpopo valley, but here they intergrade completely with plants of a quite different facies which are low branching perennial herbs to subshrubs with small elliptic leaves (var. limpopoensis). The subpandurate leaf shape is found also in plants of east-central Tanzania, which we therefore also refer to var. africanus. Here, however, it is difficult to make a confident distinction from plants from further west and north in Tanzania which have a low-growing inter-twining habit and usually elliptic and auriculate leaves (var. masaicus). These in turn are difficult to key out from var. limpopoensis, though the more branching habit and smaller non-auriculate and non-apiculate leaves of the latter usually enable a distinction to be made at a glance. Finally plants from the Ruaha National Park, although similar in facies to the nearby var. masaicus, have a very characteristic bract shape with a broad lateral veinless flange and we keep them as a fourth variety (var. ruahae). The lack of clear-cut exclusive distribution patterns, and the presence of many intermediates where taxa meet, argue for varietal rank rather than subspecies, despite the fact that the extremes of variation have a very different facies which might well suggest different species.
            textZh: SANBI 条目提供了该种的鉴别特征。
