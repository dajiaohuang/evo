    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Shrublet, 0.15-0.9 m tall. Leaves at branch tips and crowded on short-shoots, spathulate-cuneate and apically 3-9-toothed or -lobed, (5-)10-40 mm long, densely grey-velvety. Flowerheads solitary in upper axils on peduncles (20-)50-250 mm long; involucre cup-shaped, (5-)8-15 mm diam., bracts 8-16, connate basally only. Cypselas densely white-woolly, mucilaginous when wet.
            sourceIds:
