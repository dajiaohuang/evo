            locator: "SANBI/WFO archive Morphology row 34220; source 14754.0; publication: Manning, JC. 2013. Asteraceae: Euryops. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 288 - 290. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: E. dregeanus is a distinct and easily recognized species, although the leaf-shape is variable to a certain extent. The leaves are normally more or less spathulate or flabelliform, distinctly narrowed to the base, and with a dilated, apically toothed or shortly lobed lamina. More deeply cleft leaves with thickened linear lobes are rare, occurring only in the north-eastern inland localities (Kenhardt and Gordonia Divisions). The most characteristic feature is the dense canescent tomentuni of the leaves and young branches. In this character the species differs from the allied E. mucosus.
            textZh: SANBI 条目提供了该种的鉴别特征。
