  claims:
    - subjectId: event:jaekelopterus-giant-chelicera
      claimKind: scientific
      claimType: morphology
      statement: The Willwerath Jaekelopterus rhenaniae fixed ramus preserves 36.4 cm; its complete length was estimated at 45.5 cm. The approximately 2.5-metre body length is a separate estimate based on related pterygotid proportions, with possible positive claw allometry remaining a source of uncertainty.
      confidence: medium
      confidenceRationale: Claw dimensions are direct and reproducible; whole-body gigantism depends on extrapolation from related taxa and scaling assumptions.
      referenceLinks:
        - referenceId: braddy-2008-jaekelopterus
          relation: supports
          pages: 106–109
          figure: Figures 1–2
          quoteLocator: Willwerath chelicera; Body-length scaling; Assumptions
  claim-rationales.zh:
    - 螯肢尺寸直接且可复核；整身巨型化依赖近亲外推和尺度假设。
  claim-statements.zh:
    - Willwerath 出土的 Jaekelopterus rhenaniae 螯肢固定支保存长 36.4 厘米，完整长度估算为 45.5 厘米。约 2.5 米体长是另据近缘翼肢鲎比例作出的估算，螯肢可能存在的正异速生长仍是不确定性来源。
