        usage:
          title: Clusia lineata (Benth.) Planch. & Triana, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrub or tree to 12 m tall, sometimes epiphytic; twigs drying smooth, yellow- ish. Leaves elliptical, mostly broadest at the middle, mostly 10-20 cm long, 5-10 cm wide, apically acuminate, basally acute, the costa prominent drying only slightly elevated on each side, evanescent about 3/4 way up, the lateral veins ascending; sometimes in 2 series, straight or slightly wavy, arcuate near the margin, terminating at an angle into a submarginal vein ca. 1-2 mm from the margin, the minor venation slightly elevated above, inconspicuous, mostly drying green; petiole distinct, slender, 1-2.5 cm long. Inflorescences terminal, few-flow- ered dichasial cymes; peduncle straight or curved, 1-3 cm long, relatively slender, ca. 3 mm thick, basal bracts not evident; nodes somewhat expanded, bracteoles ca. 2 mm long, drying slightly reddish brown. Flowers with the basal bracts clasping, rotund, the margin thin, reddish brown, sepals 4, rotund, the outer pair ca. 7 mm long, keeled, the inner pair shorter; petals 4, decussate, in staminate flowers (Planchon & Triana) the stamens ca. 24 or many, arranged in 2 series or indefinitely coherent, the anthers 2-3-4-locular, longitudinally dehiscent; pistil- late flowers not seen. Fruit turbinate ca. 2 cm long, the styles conical, the stigmas appearing subsessile.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 3310
