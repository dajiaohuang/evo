          - text: It grows in mountainous habitats at altitudes varying between 800-1000 m which receive an annual rainfall of 150 to 250 mm, mainly as thunder storms; it grows in rocky places, under low scrub or near large stones. H. bolusii grows in a firm hard soil with pH 7.
