    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants acaulescent with leaves in a basal rosette 50-80 mm diam., proliferous from the base and forming small clusters. Leaves 40 to 50, the young erect, incurved, the old ascending, ± spreading, about 25-40 mm long, 6-12 mm broad, up to 6 mm thick, ovate lanceolate, pale green; upper surface flat to little concave, smooth, the pellucid part about 20 mm long, about 12 pellucid or green longitudinal lines visible only in the pellucid area; lower surface rounded, the pellucid area longer than that of the upper surface, lineate with about 10 distinct pellucid or green longitudinal lines, smooth; keel 1, in the upper third of the leaf, with about 4 mm long cartilaginous, deltoid to cuspidate teeth; margins acute, with a single row of 7 mm long white translucent bristles; end-awn up to 26 mm long, toothed, persistent. Inflorescence up to 520 mm tall; peduncle simple, terete, about 3 mm diam., up to 400 mm long, bracteate; sterile bracts membranous, ovate to acuminate, about 5 mm long, erect, keeled; raceme up to 170 mm long, lax, with about 30 spirally arranged flowers and buds, 4 to 5 open simultaneously; floral brads membranous, 5-6 mm long, deltoid acute, keeled with reddish-brown veins, clasping the pedicels, (longer than the pedicels); pedicels 3 mm long, 1-1.5 mm diam., green, erect; perianth white with green or brown keels to the segments, up to 15 mm long, compressed at base, funnel-shaped; tube more or less 4 mm across, constricted to 3 mm above; segments free to the base, limb 2 lipped; posterior segments not spreading, erect or little recurved, white with brown or reddish-brown veins, exterior part strongly recurved, spreading, white with light brown, or green veins; stamens 6 of two lengths, up to 8 and 9 mm long, inserted within the perianth tube; ovary 5-6 mm long, 2 mm diam., green; style 1.5 mm long, white, curved, capitate.
