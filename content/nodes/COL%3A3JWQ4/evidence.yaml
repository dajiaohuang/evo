          - text: Its nearest affinity is with H. setata but it differs from that species by the pellucid or semi-pellucid leaves with fine pellucid bristles on the margins and keel, which give one the impression that the plant is shrouded in white bristles. During its resting period the bristles fold together to resemble a ball of cotton-wool.
