        claims:
          - text: Annual to 90 cm. Leaves linear-lanceolate, margins undulate. Spikelets in a verticillate panicle, spikelets green, sometimes with purple, glumes shorter than spikelet, sterile lemmas smooth to corrugate, glabrous, tapering into a straight awn, the second slightly constricted at base.
