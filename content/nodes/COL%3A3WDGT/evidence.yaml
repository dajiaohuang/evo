        usage:
          title: Luehea speciosa Willd., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Tree, medium-sized, sometimes shrub, 5-18(-20) m. high, deciduous, the trunk attaining 50 cm. in diam., the crown spreading, the branchlets ferruginous-puber- ulous. Leaves thick-petiolate, the petiole 1-1.2 cm. long, densely arachnoid, the blade elliptic, sometimes narrowly elliptic, rounded to more or less cordate and slightly asymmetric at the base, acuminate at the apex, 10-18 cm. long and 4.3-11 cm. wide, subcoriaceous, the margins coarsely serrate, green and sparsely scabrous above, whitish or grayish and loosely arachnoid beneath, 3-palminerved, the nervation prominent beneath. Inflorescences in axillary or terminal panicles. Flowers ca. 3.2 cm. long, the pedicel terete, 1.5-3.5 cm. long, shortly tomentellous; bractlets 9(-10), free, narrowly oblong-lanceolate, acute, 1.8-2 cm. long and 0.35-0.4 cm. wide, fleshy, shortly tomentellous on both sides, deciduous; sepals free, oblong-lanceolate, acute, ca. 2.9 cm. long and 0.75-0.9 cm. wvide, fleshy, shortly tomentellous without, glabrous within; petals obovate, rounded, 3.1-3.2 cm. long and 1.1-1.3 cm. wide, glabrous except the inner villous base; stamens shortly 5-adelphous, hirsute on the lower part, the staminodes ca. 10 mm. long and connate at the base; anthers ca. 1 mm. long; ovary sessile, oblong-ovoid, slightly 5-sulcate, ca. 0.6 cm. long and 0.4 cm. in diam., densely sericeous; style ca. 1.5 cm. long, more or less tomentellous on the lower part; stigma capitate. Capsule hard-ligneous, oblong, more or less 5-angled, rounded at the base, obtuse at the apex, 3-3.5 cm. long and 1.2-1.6 cm. in diam., tomentose; seeds ellipsoid, flattened, ca. 4-5 mm. long and 2-2.5 mm. in diam., the wing ca. 5 mm. long and 4 mm. wide.
          originalLanguage: en
          sourceField: general
