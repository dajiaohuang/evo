        claims:
          - text: Rhizomatous geophyte to 1 m. Leaves linear, flat. Flowers in a long, slender raceme, cream-coloured.
            textZh: Bulbinella elata P.L.Perry 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13854_0
            locator: "SANBI/WFO archive Morphology row 8983; source identifier 13854.0; cited publication: Manning, JC; Goldblatt, P. 2012. Asphodelaceae: Bulbinella Kunth. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 73 - 74. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Although this taxon is closely related to Bulbinella latifolia and B. nutans and plants on herbarium sheets are not always easy to separate from some larger specimens of the former, there are sufficiently good characters in living plants to make a distinct species. Among these are the flat, spreading, coriaceous, non canaliculate leaf blades, which are thinner and more delicate when pressed than those of B. latifolia. The long narrow inflorescence and the small globose capsules are clearly different from the more conical inflorescence and larger ovoid capsules of B. latifolia and B. nutans. In nature, B. elata normally flowers earlier in the season than the forms of B. latifolia and B. nutans.
            textZh: SANBI 条目提供了 Bulbinella elata P.L.Perry 的鉴别特征。
            sourceIds:
              - sanbi_5933_0
            locator: "SANBI/WFO archive Diagnostic row 84520; source identifier 5933.0; cited publication: Perry, PL. 1999. Bulbinella in South Africa. Strelitzia 8: 1 - 78. National Botanical Institute, Pretoria. [CC BY]"
