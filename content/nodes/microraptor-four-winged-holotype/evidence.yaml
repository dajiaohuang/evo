    - 具名关节标本上的羽毛位置是直接证据；中等置信度把保存表面与气动用途、运动行为及取样系统树分开。
  claim-statements.zh:
    - 正模 IVPP V13352 保存附着于前肢、后肢和尾部的长正羽；这些表面记录四翼型解剖，而飞行路线、气动表现和系统位置仍属推断。
