      claimKind: scientific
      claimType: morphology
      statement: Holotype IVPP V13352 preserves long pennaceous feathers attached to forelimbs, hindlimbs and tail; these surfaces document a four-winged anatomical configuration, while flight path, aerodynamic performance and phylogenetic position remain inferred.
      confidence: medium
      confidenceRationale: Feather placement on a named articulated specimen is direct evidence. Medium confidence separates the preserved surfaces from aerodynamic use, locomotor behaviour and a sampled tree.
