    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants to 80 mm tall; fusiform roots 1 to several, to 40 x 8 mm; leaves 1 (-2), basal, sheathing, narrowly ovate, acute, to 80 x 15 mm. Inflorescences glabrous, 1-15-flowered, to 40 x 20 mm, densely racemose; bracts less than half as long as the ovaries, narrowly lanceolate, acute to rounded. Flowers white, lip spotted pink. Sepals unequal; median broadly elliptic, galeate, margins recurved, 3-4.5 x 3.5 mm; laterals spreading, lanceolate, 4-5.5 x 2.5 mm. Petals erect, narrowly lanceolate, obtuse, 4 x 1.5 mm. Lip broadly obovate, patent, 3-lobed, 6-9 x 6-9 mm; midlobe square to oblong, sometimes obscurely 3-lobed; side lobes quadrate-rhomboid, 2-3 mm long; spur cylindrical, parallel to the ovary, 3-4 x 1 mm. Gynostemium 1.5 mm tall; rostellum basally fused to the lip.
