          publishedAt: undated
          originalSourceText: except for a few appressed trichomes along the midvein; petiole lacking or short and thick, 0.4-1 cm long, appressed puberulous. Inflorescence cauliflorous, open- ly paniculate, to 25 cm long, appressed puberulous, the flowers subsessile on the ultimate third or fourth order branches. Flowers with the sepal suborbicular, the apex rounded, ciliate, otherwise glabrous, 1 mm long and wide; outer petals broadly ovate, erose but not ciliate, ca. 1.5 mm long, ca. 2 mm wide, the interior petals narrow; fertile stamens 2, with linear filaments ca. 1 mm long, the anther thecae orbicular, ca. 0.2 mm long; ovary ovoid, glabrous, the apex contracted into the base of the style, the stigma briefly 2-lobed. Fruit obovoid-globose, 1.5- 2 cm long and wide, glabrous.
          originalLanguage: en
