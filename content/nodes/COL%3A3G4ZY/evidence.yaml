        claims:
          - text: Cormous geophyte, 40-60 cm, tunics papery. Leaves reduced. Flowers large, funnel-shaped, red with white streaks on lower tepals.
            textZh: Gladiolus stefaniae Oberm. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 7231; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Distinguished from Gladiolus cardinalis and G. sempervirens with similar, large red flowers by the upright habit, mottled cataphylls and reduced leaves with the blades shorter than the sheaths or lacking. Typical populations from the Langeberg are bright scarlet but those from the Potberg are carmine. The latter form especially resembles G. carmineus from coastal scrub between Pringle Bay and Cape Infanta and has been identified as that species in the past, but G. carmineus has smaller, more cupped flowers with perianth tube ± 30 mm long, dorsal tepal ± 35 mm long, and filaments 21-26 mm long.
            textZh: SANBI 条目提供了 Gladiolus stefaniae Oberm. 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 94504; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
