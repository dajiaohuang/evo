            locator: "SANBI/WFO archive Morphology row 964; source 11118.0; publication: Herman, PPJ; Retief, E. 1997. Plants of the northern provinces of South Africa: Keys and diagnostic characters. Strelitzia 6: 1 - 681. National Botanical Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Ochna natalitia and O. arborea are often difficult to distinguish in the herbarium when the specimens consist of sterile branchlets only and offer no information on bark, etc. Galls are found only in O. natalitia. Young twigs of this species are fawn coloured. Mature leaves from forest trees of both species are usually indistinguishable for both become narrowly oblong with coarse marginal teeth, possess spreading lateral veins and a dense reticulation. More often the lamina of O. natalitia is narrowly oblong whereas that of O. arborea is ovate and lighter coloured.
