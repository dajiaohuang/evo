        claims:
          - text: Understorey forest tree or shrub, 0.5-2.0 m or up to 6 m high. Leaves shortly petiolate, leaf base obtuse. Flowers in many- to few-flowered racemes. Carpels 6-12, usually about 8. Flowers yellow.
            sourceIds:
