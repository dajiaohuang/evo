    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Perennial herb, 0.15-0.76 m high. Stems well branched, glabrous or rarely pilose, moderate leafy. Leaves shortly petiolate; blade ovate to sublanceolate, 12-80 x 2.5-45.0 mm, apex acute, apiculate, base 5-veined, margins serrate or incised. Flowers in few- to many-flowered, terminal racemes, up to 100 mm long, sometimes lax or reduced to a single, axillary flower; spur conical or conical-prolonged, 6.4-8.5 mm long; corolla upper lip 4-lobed, lobes 5.0-6.4 mm, apices rounded, pale pink to white; Oct.-Apr. Fruit an oblong capsule, 8.5-12.5 x 6.4-8.5 mm, apex subtruncate, base unequal and rounded to scarcely narrowed, valves obtusely angled, slightly horned.
            sourceIds:
