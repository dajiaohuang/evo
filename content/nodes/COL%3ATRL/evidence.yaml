  claim-statements.zh:
    - 三叶虫纲根节点保留取整后的 5.21–2.52 亿年前采样包络：约 5.21 亿年前代表广布的早期记录，重新研究的长兴期材料证明其延续到二叠纪最晚期；两个端点都不是精确的全球首现或末现。
