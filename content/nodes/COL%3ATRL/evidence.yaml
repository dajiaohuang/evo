      statement: "The Trilobita root display retains a rounded 521–252 Ma sampled envelope: approximately 521 Ma marks the widespread early record, and revised Changhsingian material documents survival into the latest Permian; neither endpoint is an exact global FAD or LAD."
      confidence: medium
      confidenceRationale: Early-trilobite phylogenetic and stratigraphic analyses support the older sampled boundary, while revised Lopingian specimens support a latest-Permian record. Preservation, correlation and taxonomy prevent either rounded atlas endpoint from becoming an exact origination or extinction instant.
      referenceLinks:
        - referenceId: holmes-budd-2022-early-trilobites
          relation: supports
          pages: 7:1177
          figure: Figures 1–4; Supplementary analyses
          quoteLocator: Approximately 521 Ma widespread appearance; phylogenetic clock and cryptic-interval tests
        - referenceId: mychko-2025-latest-trilobites
          relation: supports
          pages: 28.2:a22
          figure: Figures 1–7; distribution overview
          quoteLocator: Revision of Changhsingian North Caucasus material and global Lopingian occurrence review
  claim-rationales.zh:
