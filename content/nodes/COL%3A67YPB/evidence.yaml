        claims:
          - text: Subcaulescent, cormous geophyte to 12 cm. Leaves lanceolate, hairy, often exceeding stem. Flower several in an inclined spike, yellow, fragrant with tube to 14 mm long, inner bracts divided to base, ovary hairy.
            textZh: Babiana odorata L.Bolus 的 SANBI 物种条目记录了形态特征。
            sourceIds:
