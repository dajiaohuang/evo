            locator: "SANBI/WFO archive Morphology row 6708; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: The attractive Babiana odorata is a common species of the loamy clay or granitic soils of the Swartland north of Cape Town and is a pleasant sight in lightly disturbed renosterveld in early spring around Malmesbury and Moorreesburg. Plants have short, velvety stems or are almost stemless, the flowers then borne close to ground level. The flowers may be pale creamy yellow with bright yellow lower tepals or rarely flushed pale mauve, but are always intensely fragrant, with a spicy to pleasant violet odour, the scent varying with ambient temperature and age of the flowers, which each last three days. Babiana odorata is most easily confused with the vegetatively similar B. patula, which occurs in similar habitats to the east, in the Breede River Valley and across the low hills of the southern Cape. Most readily distinguished by the ovary smooth or lightly hairy on the ribs vs. densely hairy in B. fragrans, B. patula has dull yellowish or white or more often pale mauve to blue or dull purple flowers with yellow markings and a particularly strong fragrance, often of violet or freesia.
            textZh: SANBI 条目提供了 Babiana odorata L.Bolus 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 94969; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
