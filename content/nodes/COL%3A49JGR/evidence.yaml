        claims:
          - text: Erect to spreading annual to 30 cm. Leaves pinnatisect to bipinnatisect. Flower heads radiate, solitary on thick peduncles, yellow with white rays.
            sourceIds:
              - sanbi_14187_0
            locator: "SANBI/WFO archive Morphology row 11373; source 14187.0; publication: Manning, JC; Goldblatt, P. 2012. Asteraceae: Oncosiphon Källersjö. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 401 - 401. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Oncosiphon africanus is the only radiate species in the genus, furthermore the cypselas have a very prominent pappus, almost half the length of the corolla tube. All other species have discoid capitula with the pappus inconspicuous to small and less than a quarter the length of the corolla tube. The species can be confused with another white, radiate annual occurring in sandy areas along the West Coast of southern Africa, Foveolina tenella (DC.) Källersjö, but that species has a spongy pappus, fewer ray florets, and distinctive cypselas with 3-ribs and two lateral rows of cavities on the adaxial surface.
            textZh: SANBI 条目提供了该种的鉴别特征。
