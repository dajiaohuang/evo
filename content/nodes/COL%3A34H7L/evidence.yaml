        claims:
          - text: Rami culti 7 visi, 11.5-29 cm. longi, internodiis 1.9-4 cm. longis, 2-3 mm. diam.; ramuli laterales 3.6-13.5 cm. longi, ultimi florentes interdum congesti, ca. 1.5-3 cm. longi; partes herbaceae glabrae levissimae politaeque, laete, vel interdum subglauce, virides; folia erecta vel ascendentia vel patentia vel e medio recurva supra, manu explanata, lineare lanceolata, acuminata, interdum apiculata, vel breviora obtusa vel subobtusa, 2-5 cm. longa, 7-11 mm. lata, ca. 4 mm. diam.; pedunculi teretes, 5-7 mm., fructiferi ad 9 mm., longi; receptaculum globose obconicum, 4 mm. longum, 5-6 mm. diam.; sepala 5, exteriora linearia, acuta vel subobtusa, 8-10 mm. longa, basi 2 mm. lata, interiora acuta vel acuminata, late marginata, ad 3 mm. longa, basi ca. ad 2.5 mm. lata; petala 2-seriata (interiora pauca), e bene supra medium inferne conspicue angustata, obtusa alba, ad 9 mm. longa, ad 1.5 mm. lata; staminodia superne recurva, ad 7.5 mm. longa; stamina ca. 4-seriata, intima parum supra medium papillata, 4-5 mm. longa, antheris pollineque luteis; glandulae crenulatae approximatae; ovarii lobi obtusi, vix compressi, glandulas fere attingentes, ad 1-5 mm. elevati.; stigamata inferne subulata, inconspicue papillata, 2 mm. longa cum cauda 1 mm. longa vel parum ultra.
