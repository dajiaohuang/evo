        usage:
          title: Guettarda macrosperma Donn.Sm., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Trees to 6 m tall, much branched, the twiglets terete, glabrous to pubescent, the nodes moderately well spaced, the lenticels minute, often inconspicuous. Leaves often crowded toward the apex of the twiglets, elliptic oblong, oblong rotund or occasionally pyriform, 12-20 cm long, 6-13 cm wide, deltoid to obtuse at the apex, acuminate, the acumen short, the apex of the blade often eroded, basally obtuse to widely cuneate, occasionally acute at the base, the costa prom- inent beneath, the lateral veins ca. 12, prominent, rigid, often light in color and contrasting with the rest of the blade, at first angular ascending then arcuate toward the margin, the ultimate veinlets vaguely lineolate, stiffly chartaceous, often brittle when dry, concolorous, glabrous or pubescent on the costa and the veins above, beneath with the hairs short, white, strigose, the vein axils often shortly barbate; petioles to 4 cm long, 0.10-0.25 cm wide, stiff, often curved, glabrous to pubescent; stipules deciduous, not seen. Inflorescences axillary, the peduncles to 1.5 cm long, to 1.5 mm wide, stiff, the pubescence minute, green, velutinous. Flowers not seen. Fruits sessile, compressed rotund, ca. 2 cm wide, the pubescence minute, velutinous, yellow green or green when dry, delicately ribbed, the ribs disposed as faint and scarcely elevated lines, fruit wall thin; seeds 5-7, in a hard, white, pinkish or molasses-colored pulp.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 11690
          archiveSourceId: D1C63AA5-4DD2-47D9-A5D0-E40FB8C877BC
