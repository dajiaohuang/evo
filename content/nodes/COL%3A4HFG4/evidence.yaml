        usage:
          title: Physalis ignota Britton, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Erect herb to 1 m tall, stems stout, evenly covered with short, curved, simple, several-celled greyish hairs. Leaves to 12 cm long, broadly ovate or elliptic, apically acute or acuminate, basally rounded or narrowed, mostly oblique, the margin entire or sinuate, rarely toothed, evenly puberulent on the lamina, the major veins puberulent to villous; petioles ?/2 to as long as the leaves, slender, villous above. Pedicels densely vestite, 3-7 mm long. Flowers with the calyx 5-8 mm long, 3-6 mm wide at base of the lobes, villous, sometimes viscid, the lobes ovate-lanceolate to narrowly lanceolate and attenuate; corolla unmarked, 6-10 mm long; anthers yellow or blue, 2-2.5 mm long. Fruits congested on stout pedicels 7-15 mm long, finely vestite with short erect hairs; fruiting calyx 2.5-5 cm long, coriaceous, strongly 5-angled, evenly puberulent with minute hairs; berry 10-16 mm long.
          originalLanguage: en
