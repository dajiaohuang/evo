    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Mat-forming perennial, rhizomatous (rhizome long and much-branched), up to 430 mm tall. Leaf blades 40-120 mm long, up to 3 mm wide, cauline leaves usually much longer than basal leaves, leaf tips tapering to a fine point. Spikelets 1-2 mm long. Panicle dichotomously branched, axils without hairs; spikelets solitary on branchlet tips.
