        usage:
          title: Hoffmannia davidsoniae Standl., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Herbs to 1.5 m tall, the stems terete, smooth, glabrous, usually drying tan, the internodes to 9 cm long. Leaves oblong rotund, 8-17 cm long, 4-12 cm wide, rounded and acuminate at the apex, the acumen 0.5-1.8 cm long, basally rounded or tapering widely, abruptly cuneate, the costa prominulous to subplane above, prominent beneath, the lateral veins 12-15, widely arcuate, prominulous, 0.5-1.2 cm apart, thinly and stiffly succulent, lustrous, brown, white puberulent to gla- brous above, minutely puberulent on veins beneath; petioles 2-7 cm long; stipules not seen. Inflorescences cymose, mostly subtended by roots, the peduncles elon- gate, strongly ascending, 5-10 cm long, 0.1-0.2 cm wide, rubescent, glabrous, terminated by 3-4, usually radially disposed and spreading branches, the cymules ascending, each branch 7-17-flowered. Flowers with the pedicels stiff, glabrous, to 5 mm long, ca. 0.3 mm wide; buds obviously acute at the apex; hypanthium strongly 6-8-ribbed, emerald green to red in living state, to 3 mm long, the ca- lycine lobes flaring, deltoid, 0.3-0.5 mm long; corolla to 6 mm long, the lobes 4, much longer than the tube, glabrous; anthers 4, oblong, to 3.8 mm long, the connective not produced at apex or base, the filaments to 0.6 mm long; ovary 2-loculate, the style 4 mm long, the stigmas 2, clavate oblong, ca. 1.1 mm wide, each somewhat uncinate. Fruits oblong to 3.5 mm long, truncate, the persistent calycine teeth scarcely measurable, glabrous, delicately costate.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 11200
          archiveSourceId: 24223A84-E28E-4BED-B931-185D9DA9B6EB
