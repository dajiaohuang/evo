    facets:
      morphology:
        status: partially-supported
        claims:
          - text: "Semi-succulent, erect, decumbent or scandent herb, 0.1-0.5 m tall. Stems purple to dark green, sparsely branched, densely strigose; trichomes purple; capitate glands red or colourless, sessile. Leaves semisucculent, obovate, 30-65 x 10-30 mm, dark green; midrib densely strigose, rubro-punctate, colourless glands near midrib and margins; apex round to notched; base cuneate; margin rubro-strigose, serrate in upper two thirds, teeth in 6 or 7 pairs; petiole purple, 8-12 mm long. Synflorescence terminal, 100-170 mm long, paniculate to secund; cymes 3- flowered; verticels often alternately 3- and 6-flowered; rhachis rubro-strigose; lower bracts persistent, elliptical, 8-12 x 4-6 mm, upper bracts lanceolate, 3-4 x 0.5-1.0 mm, rubro-punctate above, rubro-strigose and rubro-punctate below; margins entire, rubro-ciliate: pedicels purple, 4-5 mm long. Calyx green to purple, sparsely rubro-strigose and rubro-punctate; upper sepal ovate, 4.0-4.5 x 2.5-3.0 mm; lower sepals fused, 5 mm long, lobes lanceolate, 3 mm long; tube 2-3 mm long. Corolla 25-30 mm long; tube laterally compressed, 10-12 x 3.5-4.0 mm, white with dense erect glandular trichomes; upper lip 4- lobed, obtrullate 9-10 x 11-12 mm, white with 2 deep magenta central nectar guides, sparsely glandular-strigose outside, lateral auricles 4 mm long; lower lip navicular, 4 mm long, dark pink, sparsely glandular. Stamens 4; filaments free, 2-3 mm long, adnate to corolla throat. Style white, filiform, 13 mm long; stigma purple, shortly bifid, upper lobe 1.0-1.5 mm long, lower lobe 0.5 mm long. Nutlets glabrous."
