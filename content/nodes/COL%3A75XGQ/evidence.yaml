        usage:
          title: Pectis multiflosculosa (DC.) Sch.Bip., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Stout, prostrate, semisucculent, perennial, seashore herb; stems terete or weakly angled, usually purplish, creeping, rooting at the nodes, giving rise to short, densely leafy, floriferous lateral branches, glabrous or puberulent in lines. Leaves linear to oblanceolate, 2-3 cm long, 1-5 mm wide, obtuse to acute, mucronate, ciliate below with 4-7 pairs of long bristles, marginally puberulent to scaberulous, otherwise glabrous, punctate on the undersurface with submarginal rows of circular oil glands and sometimes with additional scattered glands. Inflorescence of solitary terminal heads; peduncles 1-3 cm long, leafy-bracted. Heads radiate; involucre campanulate, 10-12 mm high, 7-10 mm broad, the bracts 5-8, oblong to obovate, acute, strongly imbricate, indurate and gibbous at the base, longitudinally striate, marginally ciliolate, otherwise glabrous, inconspic- uously punctate with scattered slender oil glands; ray florets 5-8, the corollas yellow, 10-12 mm long, glabrous, the tube ca. 3 mm long, the ligule elliptic, strongly nerved; disc florets 20-40, the corollas yellow, 7-8 mm long, bilabiate, sparsely glandular-puberulent below, the anthers 2.5 mm long, the appendage short, emarginate. Achenes narrowly clavate, dark brown to black, 8 mm long, glabrous; carpopodium short and blunt; pappus a crown of low scales, or some of the scales prolonged into slender scabrid bristles 3-7 mm long. Chromosome number n = 36
          originalLanguage: en
          sourceField: general
