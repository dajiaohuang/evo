    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Densely leafy shrub to over 2 m. Leaves soft, mostly entire and linear, tapering below, with distinct midvein, 10-40 mm long. Flower heads radiate, on short, filiform peduncles in terminal umbels, with cup-shaped involucres, yellow.
            sourceIds:
              - sanbi_14144_0
            locator: "SANBI/WFO archive Morphology row 10398; source 14144.0; publication: Manning, JC; Goldblatt, P. 2012. Asteraceae: Euryops (Cass.) Cass. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 372 - 375. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: E. linearis resembles in habit the narrow-leaved species of sect. Angustifoliae (e.g., E. tenuissimus, rehmannii, linifolius, brevipapposus, etc.). The terminal and umbellately disposed peduncles immediately distinguish the species from that section, however. Further characteristics are the flat leaves and the much connate involucres. None of the other members of sect. Chrysops can be said to be very closely allied to E. linearis, but E. inops perhaps comes closest.
