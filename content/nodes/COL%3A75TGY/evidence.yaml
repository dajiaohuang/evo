        usage:
          title: Paullinia costaricensis Radlk., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Tendrilled lianas; stems terete, usually densely villous; wood simple. Leaves biternate, 5-11 cm long; petiole without wings, densely villous, 1-3 cm long; rachis narrowly winged, sometimes slightly broader above the middle, 1.5-2.5 mm wide; leaflets elliptic-lanceolate or rhombic, acute or rounded and apiculate at the apex, attenuate to rounded at the base, 1.5-8 cm long, 1-4 cm wide, mem- branous, glabrous or nearly so on the upper surface, usually pubescent on the raised major veins, sparsely or densely villous beneath or almost glabrous ex- cept on the major veins, densely barbulate in the vein axils, prominently lobate- crenate, the teeth often glandular; stipules minute. Thyrses narrow, solitary in the leaf axils or clustered at the apex of stem, 10-15 cm long, densely puberulous; bracteoles minute. Flowers white; sepals ovate-elliptic, densely long-tomentose outside, glabrate inside, 2-3 mm long, 2-2.5 mm wide; petals oblong, 2-3 mm long, the scale on the inside of the petal 2/3 as long as the petal, crest short, sub- orbicular, emarginate, the deflexed appendage long-barbate; stamens with fila- ments flattened, sericeous, the anthers glabrous. Capsules long-stipitate, 3-locular, subglobose, puberulent, red, ca. 1 cm wide, prominently beaked, the stipe 4-5 mm long; seeds 1-3, globose, glabrous, black, shiny, 5-7 mm long, the aril white, covering the lower 1/3 of the seed.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 12509
