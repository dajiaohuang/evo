    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Tufted annual, up to 0.5 m tall. Leaves linear; ligule a fringe of hairs. Inflorescence a panicle, lowest branches not whorled. Spikelets densely crowded, up to 5 x 2-4.5 mm, many-flowered, pallid, green to purplish, rhachilla fragile, breaking from apex downwards, awnless; glumes subequal; lateral nerves of lemma with small glandular dots; anthers 1-1.2 mm long. Feb.-May and Jul.-Nov.
            textZh: Eragrostis brizantha Nees 的 SANBI 物种条目记录了形态特征。
            sourceIds:
