            locator: "SANBI/WFO archive Morphology row 33462; source identifier 14585.0; cited publication: Fish, L. 2013. Poaceae: Eragrostis. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 140 - 141. South African National Biodiversity Institute, Pretoria. [CC BY]"
