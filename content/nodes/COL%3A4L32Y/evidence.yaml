    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Delicate annual, 20-100 mm tall, stem filiform, glandular-pubescent only at base. Leaves in a basal rosette of 4, ovate to elliptic, entire or toothed, only a few in upper parts. Flowers in loose racemes, corolla tube 1.5-2 mm long, glabrous, upper lobes orange, lower lobes white, stamens 2 or 4.
            sourceIds:
              - sanbi_14775_0
            locator: "SANBI/WFO archive Morphology row 35565; source 14775.0; publication: Snijman, DA. 2013. Scrophulariaceae: Polycarena. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 472 - 473. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: "Polycarena comptonii is easily distinguished from P. fillformis by its basal rosette of four glabrous leaves, its glabrous (not glandular-pubescent) bracts, and much smaller flowers (corolla tube 1.5-2 mm long versus 2.6-3.6 mm, limb up to 2.4 mm across versus 4-5.5 mm) with the two posticous lobes coloured bright orange, this clearly visible in dried material, whereas in P. fillformis the whole limb is white, though there may be a pale yellow patch in the throat (no collector notes this). The very dark and comparatively large anthers are a conspicuous feature of P. fillformis, whereas in P. comptonil the anthers are minute and pale yellow. The sheet of P. comptonil mixed with P. tenella (Compton 13373) is instructive: the plants are all tiny with mostly simple stems; those of P. comptonii have a basal rosette of broad leaves and often only one very narrow cauline leaf; those of P. tenella have no basal rosette but there are a few pairs of relatively broad cauline leaves. Furthermore, the flowers of P. comptonil are nearly sessile whereas those of P. tenella are on relatively long filiform pedicels. Close examination of the flowers reveals the bilabiate limb of P. comptonil with orange and white obtuse lobes while the limb of P. tenella is regular, the lobes very acute and white."
