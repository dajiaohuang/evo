        claims:
          - text: Decumbent to bushy shrub, branches 0.4-0.7 m long; densely, coarsely stellate-hairy. Leaves petiolate, cuneate at base, ovate-oblong, serrate. Stipules leaf-like. Inflorescences 1- or 2-flowered; peduncles ± 20 mm long; pedicels filiform, densely coarsely stellate-tomentose. Flowers 8 mm long, mauve-streaked. Calyx widely campanulate, 5-lobed to beyond middle, lobes attenuate. Petals 1.5x as long as calyx. Flowering time Feb.?.
