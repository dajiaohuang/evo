    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Stems one to few, annual (chamaephyte), erect at first, lengthening and scrambling with age, glabrous, slender. Rhizome typical; roots cylindrical. Spines present at base of stem, reflexed, up to 10 mm long, brittle, minute or absent above. Branches at right angles to stem, often with the young tips drooping in spring, the axils bare (without cladode fascicles); branchlets at right angles to branches, short at first when flowering, lengthening to ±40-60 mm and often branching; the cladode fascicles overlapping. Cladodes small, variable in length, ±5 mm long, apiculate, soft. Flowers 1-4, exserted, and often apical, amongst cladode fascicles, tepals ±3 mm long, white; stalk ±4 mm long in fruit. Stamens much shorter than tepals; filaments wide and flat. Ovary with 4 ovules in each locule; obovoid, attenuate below, dark; style and stigmas short. Berry ±5 mm in diameter.
