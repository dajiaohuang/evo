  claims:
    - subjectId: taxon:edmontosaurus
      claimKind: scientific
      claimType: morphology
      statement: In Campione and Evans's skull sample, the long, low skulls historically assigned to Anatotitan copei fall within or close to Edmontosaurus annectens variation; the authors explain these proportions through size-related allometry and individual variation, with crushing potentially accentuating skull shape.
      confidence: medium
      confidenceRationale: The measured skull proportions support the study's interpretation, but ontogenetic explanation and preservation effects are inferential and remain limited to the sampled skulls.
      referenceLinks:
        - referenceId: campione-evans-2011-edmontosaur-taxonomy
          relation: supports
          figure: Figures 4–5
          quoteLocator: Discussion of the three longest skulls assigned to Anatotitan copei, allometric scaling and dorsoventral crushing
    - subjectId: taxon:edmontosaurus
      claimKind: scientific
      claimType: taxonomy
      statement: Edmontosaurus is bounded by Campione and Evans’s cranial growth and variation sample, which supports a reduced latest-Cretaceous North American species set; the morphometric result does not assign every hadrosaurid skull or define exact genus endpoints.
      confidence: medium
      confidenceRationale: The study measures a broad skull sample and tests ontogenetic variation, but species delimitation remains interpretation of continuous growth data.
      referenceLinks:
        - referenceId: campione-evans-2011-edmontosaur-taxonomy
          relation: supports
          pages: 1–12
          figure: Figures 2, 4 and 7; Tables 1–3
          quoteLocator: Specimen sample; geometric morphometrics; growth results; taxonomic implications
    - subjectId: taxon:edmontosaurus
      claimKind: scientific
      claimType: fossil-range
      statement: Edmontosaurus is displayed at 73–66 Ma only as the stratigraphic envelope of the sampled skulls, not an independently established global genus duration. The interval is a source-bounded sample window, not a global FAD, LAD, divergence date, continuous occupancy claim or direct-ancestor assertion.
      confidence: medium
      confidenceRationale: Edmontosaurus uses Campione, N.E.; Evans, D.C. (2011) because the cited pages and locator expose the sampled taxon, specimen or living sequence set. Confidence is medium and applies only to Latest Cretaceous North American edmontosaur cranial sample; broader endpoints remain unclaimed.
      referenceLinks:
        - relation: supports
          referenceId: campione-evans-2011-edmontosaur-taxonomy
          pages: 1–12
          figure: Figures 2, 4 and 7; Tables 1–3
          quoteLocator: Specimen sample; geometric morphometrics; growth results; taxonomic implications
        - relation: contextualizes
          referenceId: ics-2026-06
          pages: International Chronostratigraphic Chart v2026/06
          figure: Global chronostratigraphic scale
          quoteLocator: Numerical boundaries for named geological stages used to bound the source sample
  claim-rationales.zh:
    - 头骨比例测量支持研究提出的解释，但个体发育解释和保存效应属于推断，且仅限于所采样的头骨。
    - 研究测量广泛头骨样本并检验个体发育变异，但物种划分仍是对连续生长数据的解释。
    - Edmontosaurus 采用 Campione, N.E.; Evans, D.C.（2011）的论文，因为所引页码与定位符直接标示了研究采样的类群、标本或现生序列集合。中等置信度仅适用于 Latest Cretaceous North American edmontosaur cranial sample；更宽泛端点保持未声明。
  claim-statements.zh:
    - 在 Campione 与 Evans 的头骨样本中，历史上归为 Anatotitan copei 的长而低的头骨处于或接近 Edmontosaurus annectens 的变异范围；作者以随大小变化的异速生长和个体差异解释这些比例，并指出压扁可能使头骨形态更加突出。
    - 埃德蒙顿龙由 Campione 与 Evans 的头骨生长和变异样本限定，该研究支持较少的北美最晚白垩世物种集合；形态测量结果不归类每个鸭嘴龙科头骨，也不定义精确属级端点。
    - Edmontosaurus 仅以 73–66 Ma 展示为所采样头骨的地层包络，而非独立建立的全球属级延续期。该区间是来源限定的样本窗口，不是全球首现、末现、分化日期、连续占据或直接祖先断言。
