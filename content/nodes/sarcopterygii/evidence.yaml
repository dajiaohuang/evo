      statement: The Sarcopterygii navigation envelope uses the articulated Ludlow Guiyu oneiros specimen at approximately 419 Ma as its evidence-linked older anchor and living sarcopterygians at 0 Ma as its younger edge; the fossil is neither a direct ancestor nor proof of an exact global first appearance.
