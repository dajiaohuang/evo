    facets:
      morphology:
        status: partially-supported
        claims:
          - text: "Geophyte, up to 1 m high, solitary or in small clumps. Leaves with blade pleated. Flowers: in a spike held horizontally, straight to slightly zigzagging; perianth hooded, funnel-shaped, 70-90 mm long, red-orange; Jan., Feb."
            textZh: Crocosmia pearsei Oberm. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_16273_0
            locator: "SANBI/WFO archive Morphology row 71053; source identifier 16273.0; cited publication: Retief, E; Meyer, NL. 2017. Iridaceae. In: E Retief & NL Meyer (eds), Plants of the Free State: Inventory and identification guide, Strelitzia 38: 934 - 956. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Recognised by the slender stem seldom reaching 1 m in height, often unbranched or at most with 1 or 2 short branches, unlike the strongly branched C. paniculata with which it may be confused. The spikes in both species are strongly flexuose, with the flowers borne in two opposed rows, facing away from one another. The flowers of C. pearsei are larger, some 60-70 mm long, with a perianth tube 40-45 mm long and a dorsal tepal ± 20 mm long, whereas typical C. paniculata has flowers with a perianth tube 33-40 mm long and a dorsal tepal 14-18 mm long. The two species occupy quite different habitats, C. paniculata being a plant of wet sites, growing in deep, rich soils at moderate elevations, unlike the high-altitude, well-drained basalt slopes and cliffs favoured by C. pearsei.
            textZh: SANBI 条目提供了 Crocosmia pearsei Oberm. 的鉴别特征。
