        claims:
          - text: Acaulescent, cormous geophyte, 3-8 cm, corm rounded. Leaves falcate, glaucous. Flowers long-tubed, pink to reddish.
            textZh: Hesperantha humilis Baker 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 6676; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Readily recognised by the ± acaulescent habit and 1- to 3-flowered spike of deep pink flowers with an elongate perianth tube up to 24 mm long. The flowers are relatively large with tepals 17-25 mm long, the open flower thus up to 50 mm diam. As in other species of the genus with a similarly coloured perianth, the flowers are open during the day and close in the mid- to late afternoon.
            textZh: SANBI 条目提供了 Hesperantha humilis Baker 的鉴别特征。
            sourceIds:
