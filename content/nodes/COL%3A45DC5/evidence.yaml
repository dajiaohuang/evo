        usage:
          title: Myroxylon balsamum (L.) Harms, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Tree to 40 m tall, d.b.h. ca. 1 m; bark smooth, with abundant lenticels. Leaves usually imparipinnate, 5-10 foliolate; rachis and petiolules pubescent, terete; rachis 5-15 cm long; leaflets alternate, lanceolate to elliptic, acute to acuminate, obtuse at the base, 3-11 cm long, 1.8-4.0 cm wide. Inflorescence racemose, axillary, to 20 cm long, closely cinereous tomentose; pedicels 1.0-1.5 cm long. Flowers oblique on the pedicel; calyx campanulate, 1.5-4.5(-6.0) mm long, finely ribbed, the lobes ca. 1.5 mm long; the standard orbicular, ca. 9 mm in diameter, cordate basally, the claw ca. 1 mm long; wings elliptic to narrowly spatulate, ca. 1 cm long, ca. 4 mm wide, the claw 2 mm long; keel subelliptic, ca. 8.5 mm long, ca. 3 mm wide, the claw ca. 1.5 mm long; ovary short stipitate for ca. 2 mm, villosulose; style subulate. Fruit a samara, narrowly obovate, to 11 cm long, glabrous, stipitate, ca. 1 cm long; wing to 8,cm long, 1-2 cm wide, the seminif- erous area turgid at the apex of the fruit, obliquely oblong, 2-3 cm wide, ca. 1 cm thick.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 4713
