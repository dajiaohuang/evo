  claims:
    - subjectId: taxon:pycnogonida
      claimKind: scientific
      claimType: topology
      statement: Phylogenomic integration across 89 sea-spider species and all living families supports a sampled topology for Pycnogonida. The result concerns sampled living relationships and does not directly date the fossil origin or global first appearance of sea spiders.
      confidence: medium
      confidenceRationale: Confidence is medium because the cited primary study directly supports the bounded topology statement at the supplied locator. The confidence does not extend beyond the result concerns sampled living relationships and does not directly date the fossil origin or global first appearance of sea spiders.
      referenceLinks:
        - relation: supports
          referenceId: ballesteros-2020-pycnogonida-phylogenomics
          pages: 686–701
          figure: Figures 3 and 5; supplementary matrices
          quoteLocator: Taxon sampling; phylogenomic analyses; diversification discussion
    - subjectId: taxon:pycnogonida
      claimType: fossil-range
      claimKind: scientific
      statement: The 500–0 Ma pycnogonid display is a contested total-group fossil-to-living navigation envelope because Cambropycnogon is only possibly a pycnogonid and is not a secure crown first appearance.
      confidence: contested
      confidenceRationale: The original systematic account supports the Cambrian candidate, whereas the later fossil synthesis explicitly retains uncertainty over its assignment.
      referenceLinks:
        - referenceId: waloszek-dunlop-2002-cambropycnogon
          relation: supports
          pages: 421–446
          figure: Text-figures 1–2
          quoteLocator: Abstract and systematic account proposing Cambropycnogon as the oldest pycnogonid/chelicerate record
        - referenceId: sabroux-2024-pycnogonid-fossils
          relation: supports
          pages: Article e17766
          figure: Table 1
          quoteLocator: Cambropycnogon classified as possibly Pycnogonida rather than a secure crown record
  claim-rationales.zh:
    - 置信度为中：所引主研究在给定页码、图版或章节定位器处直接支持这一受限的拓扑表述；置信度不外推到文中明确排除的全群起源、全球首现、直接祖先或精确端点。
    - 原始系统学研究支持寒武纪候选记录，后续化石综述则明确保留其归属不确定性。
  claim-statements.zh:
    - 覆盖 89 个海蜘蛛物种和全部现生科的系统基因组整合，为皆足纲提供了抽样拓扑。该结果只涉及所抽样现生类群的关系，不能直接给出海蜘蛛的化石起源或全球首现时间。
    - 500–0 Ma 的海蜘蛛显示是有争议的总群化石至现生导航包络，因为 Cambropycnogon 仅可能属于海蜘蛛，并非可靠的冠群首现。
