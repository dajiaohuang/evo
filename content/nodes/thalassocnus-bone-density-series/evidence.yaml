  claims:
    - subjectId: event:thalassocnus-bone-density-series
      claimKind: scientific
      claimType: ecology
      statement: CT slices and thin sections across five stratigraphically successive Thalassocnus species show increasing rib and limb-bone compactness over roughly four million years, supporting progressive aquatic adaptation; hydrostatic control and marine grazing remain functional interpretations rather than observed behaviour.
      confidence: medium
      confidenceRationale: Measured compactness and named specimens support the temporal pattern, but sample gaps, phylogenetic ordering and analogy with living aquatic tetrapods bound the ecological inference.
      referenceLinks:
        - referenceId: amson-2014-thalassocnus-bone-density
          relation: supports
          pages: "20140192"
          figure: Figures 1–4; Figures S1–S2; Tables S3–S7
          quoteLocator: Material and methods; Bone compactness results; Discussion
  claim-rationales.zh:
    - 实测致密度与具名标本支持时间趋势，但样本缺口、系统顺序以及与现生水生四足类的类比限制生态推断。
  claim-statements.zh:
    - 跨越五个地层上相继出现的 Thalassocnus 物种的 CT 切片与薄片显示，肋骨和肢骨致密度在约四百万年内增加，支持逐步水生适应；静水调节和海生植食仍是功能解释而非观察到的行为。
