            locator: "SANBI/WFO archive Morphology row 34721; source 14678.0; publication: Snijman, DA. 2013. Ebenaceae. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 369 - 370. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: A very distinct species with tetramerous flowers and relatively small, leathery, inconspicuously nerved leaves with undulate margins. Only two other South African species have tetramerous flowers, one of which, D. glandulifera, shows very little resemblance to D. acocksii. In D. glandulifera the calyx lobes are much accrescent and exceed the fruits in length, and the young parts are covered with glands. The second species, D. ramulosa, only occasionally has tetramerous flowers but there is a certain similarity in the leaves and fruits which suggests an affinity with D. acocksii. The climatic preferences of D. ramulosa and D. acocksii are very similar, but D. acocksii has a much more limited distribution in the arid areas near the Orange River in the northern Cape Province and north of the river in South West Africa.
            textZh: SANBI 条目提供了该种的鉴别特征。
