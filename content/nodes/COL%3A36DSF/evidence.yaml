        claims:
          - text: Rigid, branched, dioecious shrub or small tree, up to 5 m tall. Leaves ± obovate-elliptic, leathery, glossy green above, sparsely bristled beneath, margin rolled under, often ± wavy. Flowers solitary, creamy white. Fruit an ovoid berry.
            sourceIds:
