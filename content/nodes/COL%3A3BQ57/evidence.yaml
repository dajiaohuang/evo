        claims:
          - text: Perennial, evergreen tree, up to 6 m high; dense, rounded, bushy, branching near ground level, bark smooth grey-brown. Leaves light green; adult leaves 70-90 mm long, more tapering than juvenile leaves. Flowers greenish yellow with long-exserted stamens, in large, fused clusters, buds capped with elongated, curved, finger-like lids, 50 mm long. Flowering time June-Jan. Fruit a greyish brown capsule, fused into a wooden mass, up to 50 x 80 mm.
