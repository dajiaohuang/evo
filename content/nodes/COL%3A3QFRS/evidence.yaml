        claims:
          - text: Cormous geophyte, 25-50 cm. Leaves (3)4-7 in 2-ranked fan, sword-shaped to falcate, margins sometimes undulate. Flowers pale or deep pink or white, tube filiform, anthers oblong, unilateral and drooping.
            textZh: Ixia scillaris L. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 7171; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: "The most common and widespread species of sect. Dichone, Ixia scillaris is recognized primarily by the nodding flower with vertically oriented tepals with unilateral, slightly pendent and often relatively long anthers, combined with a fan of 3-7 basal leaves, (3)6-20 mm wide. Related I. erubescens has narrow, ± falcate leaves, 2-4(-6) mm wide, with closely crisped margins, and is a smaller plant with smaller flowers, the tepals 8-11 x 4-6 mm and anthers 2.0-2.5 mm long vs. tepals mostly 10-15 x 5-9 mm and anthers 3-4 mm long in I. scillaris. Apparently closely allied Ixia simulans, with half to fully nodding flowers and unilateral stamens with pendent anthers, has a single basal, ± linear foliage leaf and a second leaf sheathing the stem for most of its length. Ixia tenuis from the Piketberg is a particularly slender species with small corms with finely fibrous tunics, just three, narrow, soft-textured leaves and relatively small flowers with dark magenta tepals. I. tenuis grows in a habitat unique for species allied to I. scillaris, seeps on sandstone rocks, growing in moss in soils less than 10 mm deep. Variation: Typical Ixia scillaris from Darling and Tulbagh to the Cape Peninsula has (4)5-7 relatively narrow leaves, mostly 5-8 mm wide, with 3-5 secondary veins conspicuous only when dry, mostly branched stems (rarely with up to 7 branches), and moderately dense spikes with flowers spaced 8-12 mm apart. The flowers are relatively small, with tepals 8-10 x 4-5 mm and ± symmetrically arranged, although the lowermost tepal is held slightly apart and recurved, and anthers 2.0-2.8 mm long. In contrast, plants from the Olifants River Valley and low elevations in the Cedarberg ranging into the Bokkeveld and Spektakel Mtns are always taller, with 2-4, broader leaves mostly 15-20 mm wide, usually with at least two conspicuous secondary veins in addition to the main vein, stems simple or with 1(2) branches, and lax spikes with flowers distantly spaced, 15-25 mm apart. The flowers are larger, with tepals 14-16 x 5-9 mm, the upper tepals overlapping and separated from the three lower tepals, and anthers 3.2-4.0 mm long. A third set of divergent populations occurs on the Gifberg-Matsikamma Mtn complex. These consist of unusually small plants, seldom exceeding 150 mm in height, with small flowers (tepals ± 8 x ± 4 mm, anthers ± 2 mm long), thus like those of the southern populations of Ixia scillaris but with just three leaves (rarely two in depauperate individuals), recalling the northern populations, at least in leaf number, although the leaves are shorter and narrower. The taxonomic solution to the variation in Ixia scillaris is to recognize the three sets of populations as separate subspecies, those of the larger-flowered, northern populations as subsp. latifolia and the Gifberg-Matsikamma populations as subsp. toximontana."
