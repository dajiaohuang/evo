        usage:
          title: Palicourea guianensis Aubl., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrubs or trees, 4(-7) m in height, the branchlets terete, ultimately angular, smooth, glabrous, usually drying black, often constricted below the nodes, mostly 6-8 cm apart. Leaves oblong, often widely so, occasionally ovate oblong or elliptic, rarely oblong rotund, 9.5-32.0 cm long, 4-17 cm wide, deltoid to occa- sionally obtuse or acute at the apex, often acuminate, the acumen mostly 1-2 cm long, often falcate, the base cuneate, acute, obtuse or rounded, often slightly inequilateral, the costa prominulous above, prominulous to prominent beneath, to 2.2 mm wide proximally, the lateral veins (11-)15-18, widely arcuate, the intermediate veins, if present, 1-2(-3) short, soon branching, subparallel to the laterals, the intervenal areas smooth, occasionally minutely punctate beneath; petioles 1.5-3.0 cm long, glabrous; stipules connate, to 10 mm long, the sheath short, glabrous, each part 2-lobed, the lobes oblong, often closely applied to the stem, usually 3-4 times the length of the sheath. Inflorescences terminal, usually solitary, rarely 2-3, paniculate, glabrous or occasionally puberulent, oblong, elon- gate dome shaped, hemispherical or triangular in outline, 15-22 cm long, 5-9 cm wide; peduncles erect, stiff, 8-14 cm long, angular, often lignose, 0.2-0.3 cm wide, the branches numerous and stout. Flowers pedicellate; hypanthium ca. 1 mm long, the calyx obsolete, the cup acetabuliform, scarcely measurable, the teeth scarcely measurable; corolla yellow, the tube cylindrical, somewhat con- stricted below the middle, expanded basally, 1-2 cm long, stiffly petaloid, pu- berulent outside, occasionally the hairs granulose, glabrous within, the lobes 5, triangular, often somewhat unequal in length, to 2 mm long, acute; stamens 5, the anthers oblong, 3-5 mm long, the filaments plane, glabrous, shorter than the anthers, attached near the middle of the tube; style slender, often as long as the tube, the stigmatic area to 6.5 mm long, the stigmas oblong, to 5 mm long, the ovarian disc compressed rotund, to 0.75 mm long. Fruits ovoid, to 5 mm long, conspicuously costate, glabrous, drying black, the persistent calycine cup and ovarian disc ca. 1 mm long.
