        claims:
          - text: Acaulescent succulent to 60 cm. Leaves in a rosette, lanceolate to triangular, surfaces rough, margins toothed. Flowers in an inclined raceme, nodding, reddish and green, hardly inflated below.
            textZh: Gasteria vlokii van Jaarsv. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13855_0
            locator: "SANBI/WFO archive Morphology row 9066; source identifier 13855.0; cited publication: Manning, JC; Goldblatt, P. 2012. Asphodelaceae: Gasteria Duval. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 74 - 75. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Gasteria vlokii can be confused with the very variable G. carinata. It differs from that species by its patent falcate leaves with asperulous epidermis, its flowering time (January and February), as well as its bright reddish pink, larger perianth (29-33 mm long). G. carinata has erectly spreading smooth or tuberculate leaves which are not falcate, it flowers in spring, the perianth measures 18-25 mm in length, and the two species are geographically isolated. The asperulous leaf surface of G. vlokii is similar to that of G. disticha, but here the resemblance ends, as G. disticha has distichous leaves and a shorter perianth. G. vlokii is also related to G. nitida and G. ellaphieae (sister species); these flower in December and January, have a bright reddish pink perianth and linear-obclavate, succulent roots. For differences between these three species, see G. nitida.
            textZh: SANBI 条目提供了 Gasteria vlokii van Jaarsv. 的鉴别特征。
            sourceIds:
              - sanbi_8534_0
            locator: "SANBI/WFO archive Diagnostic row 78227; source identifier 8534.0; cited publication: Van Jaarsveld, EJ. 1994. Gasterias of South Africa: a new revision of a major succulent group. Fernwood Press, Cape Town. [All rights reserved]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
