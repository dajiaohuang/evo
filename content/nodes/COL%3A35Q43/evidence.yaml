    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Perennial herb, up to 500 mm high. Umbels up to 2 in each axil. Tertiary bracts elliptic or obovate, (8-) 9-11(-12) mm broad, without windows. Corolla tube longer than 7 mm and lip in lower position longer than 11 mm. Flowers white or light lilac.
            sourceIds:
