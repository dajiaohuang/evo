            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Corolla 20-27 mm long including 10-16 mm long lip held in upper position; bracteoles 7-10.5 mm long, pale green with pale hyaline margin; larger cymule bract of each pair elliptic or somewhat obovate; cymules held in ± lax umbels; plants never sericeous.
