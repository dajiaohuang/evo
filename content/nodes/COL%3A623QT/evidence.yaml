  claims:
    - subjectId: taxon:fabaceae
      claimKind: scientific
      claimType: taxonomy
      statement: A taxonomically broad legume phylogeny supports six subfamilies and replaces the traditional broad Caesalpinioideae arrangement; this is a sampled classification, not a Fabaceae origin date.
      confidence: high
      confidenceRationale: Family-wide sampling and explicit classification criteria strongly support the revision, while taxonomic ranks remain hypotheses rather than chronology.
      referenceLinks:
        - referenceId: lpwg-2017-legume-classification
          relation: supports
          pages: 44–77
          quoteLocator: Figures 1–2; subfamily diagnoses and classification
    - subjectId: taxon:fabaceae
      claimKind: scientific
      claimType: biogeography
      statement: The fossil legume record represented here is the 65.35 Ma Corral Bluffs fruit and leaflets in Colorado, United States; it does not establish a geographic origin or continuous global distribution of Fabaceae.
      confidence: high
      confidenceRationale: The primary stratigraphic synthesis directly locates and dates the fossil material. The claim remains confined to that record rather than inferring family-wide history.
      referenceLinks:
        - referenceId: lyson-2019-corral-bluffs-recovery
          relation: supports
          pages: 366:977–983
          figure: Figure 3J–K
          quoteLocator: Corral Bluffs fossil occurrence and supplementary stratigraphy
    - subjectId: taxon:fabaceae
      claimKind: scientific
      claimType: ecology
      statement: The Corral Bluffs fruit and leaflets support a bounded plant fossil record, but they do not directly establish habitat, diet, physiology or one ecological guild for Fabaceae.
      confidence: low
      confidenceRationale: The cited fossil material is diagnostic for the family record but was not an ecological experiment or a family-wide habitat survey.
      referenceLinks:
        - referenceId: lyson-2019-corral-bluffs-recovery
          relation: supports
          pages: 366:977–983
          quoteLocator: Corral Bluffs fossil inventory and stratigraphic context
    - subjectId: taxon:fabaceae
      claimKind: scientific
      claimType: morphology
      statement: A 65.35 Ma Corral Bluffs fruit and leaflets are assigned to Fabaceae; these structures demonstrate a bounded family-level fossil record rather than a subfamily assignment or universal legume morphology.
      confidence: medium
      confidenceRationale: The fossil material and age are directly documented, while its subfamily placement and broader ancestral morphology remain unresolved.
      referenceLinks:
        - referenceId: lyson-2019-corral-bluffs-recovery
          relation: supports
          pages: 366:977–983
          figure: Figure 3J–K
          quoteLocator: Fossil fruit and leaflets
        - referenceId: koenen-2021-legume-origin
          relation: contextualizes
          pages: 70:508–526
          figure: Figure 5; Supplementary Table S3
          quoteLocator: Oldest unequivocal legume fossil and divergence-time limitations
    - subjectId: taxon:fabaceae
      claimKind: scientific
      claimType: fossil-range
      statement: "Fabaceae is displayed at 65.35–0 Ma only as a Corral-Bluffs-fossil-to-living navigation anthology: the dated fruit and leaflets support family presence but not an exact crown origin, subfamily assignment, direct ancestry or continuous global occupancy."
      confidence: medium
      confidenceRationale: Lyson et al. (2019) directly documents the 65.35 Ma Corral Bluffs fruit and leaflets, and Koenen et al. (2021) explicitly treats it as the oldest unequivocal legume fossil. Medium confidence keeps family presence separate from modelled crown timing.
      referenceLinks:
        - relation: supports
          referenceId: lyson-2019-corral-bluffs-recovery
          pages: 366:977–983
          figure: Figure 3J–K
          quoteLocator: 65.35 Ma legume fruit and leaflets; supplementary stratigraphy
        - relation: contextualizes
          referenceId: koenen-2021-legume-origin
          pages: 70:508–526
          figure: Figure 5; Supplementary Table S3
          quoteLocator: Introduction and oldest unequivocal legume fossil; divergence-time limitations
  claim-rationales.zh:
    - 科级广泛取样和明确分类标准强力支持修订，但分类等级仍是假说而非年代记录。
    - Lyson 等（2019）直接记录 65.35 Ma 的科罗尔布拉夫斯果实与小叶，Koenen 等（2021）明确把它视为最老的无争议豆科化石。中等置信度把科级存在与模型化冠群年代严格分开。
    - 科罗尔布拉夫斯的化石材料及 65.35 Ma 地层背景有直接记录；本声明只对应这一地点，不推断豆科起源或持续全球分布。
    - 果实和小叶可支持受限的植物化石记录，但并不能直接确定豆科的生境、营养、生理或单一生态位。
    - 科罗尔布拉夫斯果实与小叶及其年代有直接记录；亚科位置和更广泛祖先形态仍未解决，因此不把它们外推为全科性状。
  claim-statements.zh:
    - Corral Bluffs 的果实和小叶支持有限范围的植物化石记录，但不能直接确定豆科的生境、食性、生理或单一生态功能群。
    - Corral Bluffs 的 65.35 Ma 果实和小叶被归入豆科；这些结构提供有限范围的科级化石记录，而非亚科归属或豆科通用形态的证据。
    - 此处代表的豆科化石记录是美国科罗拉多州 Corral Bluffs 的 65.35 Ma 果实和小叶；它不能确定豆科的地理起源或连续的全球分布。
    - 广泛取样的豆科系统树支持六个亚科并取代传统广义苏木亚科安排；这是取样分类方案，并非豆科起源年代。
    - Fabaceae 的 65.35–0 Ma 仅作为“科罗尔布拉夫斯化石—现生类群”导航汇编：有测年约束的果实和小叶支持科级存在，但不能确立精确冠群起源、亚科归属、直接祖先或连续全球占据。
