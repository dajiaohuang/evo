    facets:
      morphology:
        status: partially-supported
        claims:
          - text: "Perennial herb, up to 1 m high. Leaves alternate; blade linear, narrowly elliptic to elliptic or narrowly obovate, up to 60 x 20 mm, apex acute or obtuse, mucronate, base cuneate, margins entire, silky silvery on both surfaces, concolorous; petiole 1-2 mm long. Heads discoid, few to many in terminal, corymbose panicles. Involucral bracts generally narrowly ovate, apex attenuate to a long-acuminate bristle tip or acute and bristle-tipped. Flowers: disc florets only, violet; Nov.-Apr. Fruit with cypsela turbinate to subcylindric, densely hairy. Pappus: outer of short, linear scales; inner of barbellate bristles."
            sourceIds:
              - sanbi_16098_0
            locator: "SANBI/WFO archive Morphology row 71849; source 16098.0; publication: Herman, PPJ; Retief, E; Meyer, NL. 2017. Asteraceae. In: E Retief & NL Meyer (eds), Plants of the Free State: Inventory and identification guide, Strelitzia 38: 249 - 413. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Hilliardiella aristata is the only species in the genus with a densely silvery-silky indumentum on both surfaces of the leaves, rarely slightly thinner on the upper surface, the blades mostly linear-oblanceolate to narrowly elliptic but rarely ovate or almost sub-orbicular in some specimens from Swaziland. The involucral bracts are distinctive, mostly narrowly lanceolate and long-attenuate-conduplicate or smoothly acute, with a conspicuously bristle-like apex. Both H. elaeagnoides and H. capensis have more or less discolorous leaves with the upper surface thinly silky and the lower surface densely silvery-silky, and the inner involucral bracts more or less abruptly contracted to an apiculate tip. Intermediates among all three species are known, however, and introgression seems likely where they co-occur.
