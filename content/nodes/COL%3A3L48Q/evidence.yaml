    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Perennial herb, geophyte, 0.15-0.35 m high; corm turbinate, tunics concentric, often truncate, lacerate; stem simple, erect, straight. Leaves 4, obtuse to subacute, lowermost basal, others inserted on stem. Bracts green, often reddish at apex. Inflorescence a 1-6-flowered spike, straight or slightly flexuose; perianth tube dilated in throat; tepals subequal, elliptic, obtuse to subacute, bright magenta-pink. Stamens exserted; filaments 8-14 mm long; anthers 8-13 mm long. Flowering time Feb.-Apr. Capsule oblong, 15 x 4-5 mm.
            textZh: Hesperantha grandiflora G.J.Lewis 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_18505_0
            locator: "SANBI/WFO archive Morphology row 91000; source identifier 18505.0; cited publication: Bredenkamp, CL; Magwaza, ZL. 2019. Iridaceae. In: CL Bredenkamp (ed.), A Flora of the Eastern Cape Province, Strelitzia 41(3): 1821 - 1882. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: One of several long-tubed and pink-flowered species of Hesperantha in eastern southern Africa, H. grandiflora stands out in its zygomorphic, nodding flowers with the perianth tube, usually 40-55 mm long, curved outward near the apex and about 1.5x as long as the tepals, which are oriented ± vertically, while the stamens are unilateral and declinate, arching downward to lie above the lowermost tepal. The anthers are dark purple to red-brown, only rarely encountered in the genus. Hesperantha stenosiphon, with a similarly long perianth tube but much smaller tepals, also has dark anthers, as does short-tubed H. hutchingsiae, but both have radially symmetric flowers.
            textZh: SANBI 条目提供了 Hesperantha grandiflora G.J.Lewis 的鉴别特征。
