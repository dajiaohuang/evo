    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, 1.5-2 m tall, forming large clumps, stems 2-4-branched. Leaves sword-shaped, plane with prominent midrib. Flowers many in a spreading to horizontal spike, scarlet, trumpet-shaped, perianth tube elongate, narrow below, wide above, dorsal tepal largest, horizontal. Mainly Nov.
            textZh: Crocosmia fucata (Lindl.) M.P.de Vos 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_14562_0
            locator: "SANBI/WFO archive Morphology row 33068; source identifier 14562.0; cited publication: Goldblatt, P; Manning, JC. 2013. Iridaceae. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 94 - 124. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Crocosmia fucata is a tall plant with fairly narrow, plane leaves, and a flowering stem usually with 2 to 4 branches diverging at a wide angle from the main axis and a strongly arching spike. The flowers are predominantly scarlet with the lower 3 tepals each with a narrow red median streak and the tube yellow in the underside and in the throat. The long-tubed flowers are similar to those of species like C. paniculata and C. pearsei, with a narrow cylindric lower portion and a wider, also cylindric upper part but both of these species have strongly pleated leaves. In detail, the flowers can be seen to be somewhat different from those of C. paniculata, which has the outer whorl of tepals noticeably smaller than the inner three, and a slight but unmistakable pouch where the lower part of the perianth tube expands into the wider upper portion.
