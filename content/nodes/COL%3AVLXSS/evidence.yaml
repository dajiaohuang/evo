        usage:
          title: Myrciaria floribunda (H.West ex Willd.) O.Berg, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrubs or small trees 2-10 m. high. Trunk 3-25 cm. in diameter, covered with a tight smooth light-brown exfoliating bark that is practically indistinguish- able from that of its common associate Calycolpus (cf. I. M. Johnston, loc. cit. 1949). Twigs densely foliate, the internodes 1-2 cm. long, at first puberulous, soon glabrate. Leaves elliptic- to lanceolate-oblong or lanceolate, long-acuminate to caudate at the apex, acute at the base, 2-5 (-7) cm. long and 1.0-2.5 cm. wide, chartaceous, at first pubescent on the margin and midrib, soon glabrate, the midrib flat above, prominent beneath, the lateral nerves numerous, delicately prominulous to nearly obsolete on both sides, the marginal nerve 0.5-1.0 mm. within the margin; petiole slender, 2-5 mm. long. Flowers glomerate, 2-5 together. Receptacle glabrous, about 1.5 mm. long, at last circumscissile above the ovary. Sepals 4, imbricate, about 1 mm. long, deciduous with the receptacle. Petals obovate, fimbriate, slightly longer than the sepals. Ovary glabrous outside. Berry globose, 8-15 mm. in diameter, 1-seeded, edible. Embryo homogeneous; radicle broadly adnate.
          originalLanguage: en
          sourceField: general
