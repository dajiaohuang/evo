    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Erect, succulent shrub, up to 200 mm tall, 250 mm diam. Leaves only shortly fused to opposite ones at bases, trigonous, with a marked apical tooth and fine teeth on keel, green often with a red tinge, surface rough. Flowers solitary, magenta. Fruit 7- or 8-locular.
            sourceIds:
              - sanbi_14694_0
            locator: "SANBI/WFO archive Morphology row 33879; source 14694.0; publication: Klak, C. 2013. Aizoaceae: Octopoma. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 219 - 219. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Schlechteranthus subglobosus is a distinct species and, although it shares a globose leaf shape with S. parvus, the leaf pairs are only fused for a third of the length with a very prominent mucro (fused for aquarter of the length with obscure mucro in S. parvus) and the flowers are solitary (flowers in cymose inflorescence in S. parvus). The leaves of S. subglobosus are regularly spaced along the branch, which is similar to S. inclusus, while the rest of the species in the subgenus have the leaves crowdedtowards the tips. In S. subglobosus, however, the leaves are positioned at regular intervals along the branch with the internodes visible between the leaves, while in S. inclusus the leaves are tightly packed and decussate, with no visible internodes. Schlechteranthus subglobosus can further be distinguished from the other species in the subgenusby its bright green leaves with a rough surface and very prominent mucro as a result of the fatly trigonous leaf shape, while the leaves in the remaining species are triquetrous green to dark green leaves, with a slightly velvety to velvety leaf surface and a prominent mucro (obscure in S. parvus) in the rest of the subgenus).
