    - 正模 ULBRA-PVT280 在晚三叠世组合中保存后弯具锯齿牙与纤细骨架；所引矩阵将肉食性映射到蜥脚形类根部附近，但食性重建与该标本都不能证明它是植食性蜥脚类的直系祖先。
