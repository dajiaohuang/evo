    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Much-branched, short-stemmed grass aloe 300-400 mm tall, forming dense tufts; roots fusiform. Leaves ±51 cm a rosette, linear, 70-375 x 2-10 mm, D-shaped in section, margins dentate. Inflorescence a simple capitate raceme; peduncle 250-350 mm long, with sterile bracts; bracts ovate-deltoid, ±15 x 3-4 mm, 3-5-nerved. Flowers lemon-yellow, 13-18 mm long; pedicels 13-20 mm long; all segments free to base. Anthers exserted 2-4 mm. Ovary 2-4 x 1.5-2 mm, green; style exserted up to 7 mm.
