          originalSourceText: Shrubs or trees, to 20 m tall, the branchlets straight or flexuous, glabrous, scarcely or moderately swollen at the nodes, the latter well spaced. Leaves el- liptic oblong, 8-18 cm long, 2.5-7.5 cm wide, distinctly acuminate at the apex, the acumen to 1.5 cm long, often falcate or somewhat hooklike, usually ultimately obtuse, attenuate or widely cuneate at the base, the costa prominulous above, subprominent beneath, the lateral veins 9-11, uniting to form a submarginal un- dulate vein to 0.8 cm from the margin, thin coriaceous to stiffly papyraceous, usually drying green or grey green; petioles to 1.2 cm long; stipules linear lan- ceolate, to 1.2 cm long, acute. Flowers not seen. Fruits plump, oblong. rotund, to 1.5 cm long, to 1 cm wide, rounded at the apex and the base, drying black brown or dull olive, glabrous, the calycine scar scarcely elevated, ringlike, to 2 mm in diam.
