        status: not-assessed
        claims: []
        gaps:
          - The study does not assess a complete life cycle, reproductive history, or lifetime production.
          - The source habit field is preserved as the flora’s original plant life-form value; it is not evidence of a life-history or reproductive cycle.
      ecology:
        status: partially-supported
        claims:
          - text: At the NOMAFSI Mai Son Research Centre in Son La Province, northwestern Vietnam (780 m elevation), a shaded agroforestry field trial compared five cultivated Coffea arabica genotypes under rain-fed control and rainfall-reduction treatments for two successive production years. The rainfall-reduction treatment lowered soil water content by 14% over those years, and yields under that treatment were 16–75% lower than controls across the tested genotypes. These results are bounded to this site, treatment, period, and set of five genotypes.
            textZh: 在越南西北部山罗省 NOMAFSI Mai Son 研究中心（海拔 780 米），一项遮荫农林复合田间试验对五个栽培阿拉比卡咖啡基因型进行了两年雨养对照与减雨处理比较。减雨处理使这两个连续生产年度的土壤含水量降低 14%，五个受测基因型在该处理下的产量比对照低 16–75%。这些结果仅适用于该试验地点、处理、时间段和五个受测基因型。
            originalLanguage: en
            sourceIds:
              - sarzynski2024coffea-drought
            locator: Abstract for treatment duration, 14% soil-water reduction, and 16–75% yield comparison; §2.2 for site, elevation, agroforestry design, and rainfall-reduction treatment; Results for genotype comparisons.
            placeTimeScope: NOMAFSI Mai Son Research Centre, Son La Province, northwestern Vietnam, 780 m; shaded agroforestry field trial initiated in 2018; rainfall-reduction production observations span two successive years through 2022.
            lifeStatus: Cultivated fruit-bearing coffee trees in a managed field trial; wild populations were not studied.
        gaps:
          - A rainfall manipulation at one agroforestry research site in five cultivated genotypes does not establish wild coffee ecology or responses across Arabica populations, farms, climates, and management systems.
      evolution:
        status: not-assessed
        claims: []
        gaps:
          - The study does not analyze phylogeny or evolutionary history.
