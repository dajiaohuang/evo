        claims:
          - text: Perennial herb, tufted, up to 0.9 m high. Leaf blades 7.0-14.4 mm wide, V-shaped. Culm scapose, 3-angled, 2.8-4.8 mm in diam. Inflorescence a compound anthela of 7-13 spreading spikes, spikes shortly cylindrical or bullet-shaped, 10-15 x 8-12 mm. Subtending bracts 7-13, leaf-like. Spikelets densely crowded, ± compressed, narrowly elliptical, 2.6-5.2 mm long, 1-3-flowered. Glumes imbricate, ovate when flattened, 2.6-4.0 mm long, spaced 0.9-1.4 mm apart, keel non-excurrent. Flowering time Oct.-Feb. Nutlet narrowly obovate to narrowly elliptical, 1.8-2.3 x 0.6-0.8 mm, 3-angled, dark brown, surface puncticulate or minutely reticulate.
