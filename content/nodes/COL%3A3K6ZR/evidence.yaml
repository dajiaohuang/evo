    facets:
      morphology:
        status: partially-supported
        claims:
          - text: A mat-forming perennial herb, main branches stoloniferous, slender (±1.5 mm diam.), nude, rooting, producing numerous erect dwarf shoots with closely rosetted leaves, flowering stems terminal to each rosette, solitary, erect, 50-120 mm high, simple or very rarely forked, closely leafy. Leaves stiff, erect, up to 35 mm long, ±1 mm broad, linear, apex obtuse, base broadened, clasping, margins strongly revolute, both surfaces enveloped in silvery, sericeous, closely felted indumentum. Heads homogamous, cylindric, 4-5 x 1.5 mm, many felted together in small corymbose clusters, these congested, but not felted, in a terminal cymose-corymbose cluster 15-20 mm across. Involucral bracts in ±2-3 series, subequal, loosely imbricate, outer brownish, inner tipped bright canary-yellow, about equalling flowers, not radiating, translucent. Receptacle smooth. Flowers 4-6, yellow. Achenes ±1 mm long, obscurely 5-ribbed, glabrous. Pappus bristles ±5, slender, tips shortly plumose, bases nude, not cohering. Flowers in March and April, sometimes as late as July.
            sourceIds:
