  claims:
    - subjectId: event:holostei-genomic-support
      claimKind: scientific
      claimType: topology
      statement: A 25-vertebrate phylogenomic matrix, bowfin transcriptomic evidence and conserved-synteny comparisons support living gars plus bowfin as Holostei, sister to Teleostei, while the spotted-gar genome supplies a lineage that diverged before teleost genome duplication rather than evidence of morphological stasis.
      confidence: medium
      confidenceRationale: Independent sequence and synteny evidence support the extant Holostei topology and the gar genome's pre-duplication position. Medium confidence keeps the inference scoped to the sampled genomes and transcriptomes, including one 90× gar assembly, and excludes fossil age, morphological stasis and deterministic diversity claims.
      referenceLinks:
        - relation: supports
          referenceId: braasch-2016-spotted-gar-genome
          pages: 427–437
          figure: Figures 1b and 2e–f; Supplementary Figure 6
          quoteLocator: Genome assembly and annotation; phylogeny and synteny results
  claim-rationales.zh:
    - 相互独立的序列与共线性证据支持现生全骨鱼拓扑，并支持雀鳝基因组位于真骨鱼复制事件之前。中等置信度把推断限定在所取样的基因组和转录组，包括单个 90× 雀鳝组装，同时排除化石年代、形态停滞和多样性决定论。
  claim-statements.zh:
    - 覆盖 25 种脊椎动物的系统基因组矩阵、弓鳍鱼转录组证据与保守共线性比较支持现生雀鳝类与弓鳍鱼组成全骨鱼类，并与真骨鱼类互为姐妹群；斑点雀鳝基因组代表真骨鱼基因组复制前分出的谱系，而不是形态停滞的证据。
