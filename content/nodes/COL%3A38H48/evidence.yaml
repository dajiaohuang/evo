    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Perennial and rarely annual 800-1 500 mm high; hydrophyte; rhizomatous and stoloniferous. Leaf blade 100-450 x 4-15 mm; ligule a fringe of hairs, often absent in upper leaves. Inflorescence open, 80-250 mm long, ovate to narrowly lanceolate, of spike-like racemes; raceme 20-80 mm long, not neatly 4-rowed, branches clearly secund. Spikelet 4-6 x 1.0-1.8 mm, narrowly ovate; glumes and lower lemma minutely hispid on surface, nerves with long, rigid, sometimes tubercle-based hairs; lower floret male or sterile; lower lemma with awn (1-)3-20(-50) mm long; upper lemma 3-5 mm long; anther 1.8-2.9 mm long.
