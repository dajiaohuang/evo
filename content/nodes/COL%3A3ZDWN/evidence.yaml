    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Herb, up to 0.9 m high, much-branched. Epicalyx bracts lanceolate. Mature flower stalk as long as or longer than petiole, 10-40 mm long, 1-3-flowered. Flowers yellow.
            sourceIds:
              - sanbi_11118_0
            locator: "SANBI/WFO archive Morphology row 2730; source 11118.0; publication: Herman, PPJ; Retief, E. 1997. Plants of the northern provinces of South Africa: Keys and diagnostic characters. Strelitzia 6: 1 - 681. National Botanical Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: In the Transvaal this species is very common between Potgietersrus and Pietersburg. The form which occurs here agrees with the description of M. albicans, but no grounds can be found for separating it from M. burchellii in spite of the disjunct distribution and the difference in habitat. In the Transvaal it grows on a heavy gravelly loam soil which is very different from the loose sand in which it is found in the north-western Cape. It may be noted that the type locality of M. albicans is given as Pilgrims Rest. The Rev. William Greenstock, who collected the original specimen, spent some time with Edward Button at Eersteling Mine, between Potgietersrus and Pietersburg, before proceeding to Pilgrims Rest. The plant has not been found at Pilgrims Rest again and it is considered that Greenstock collected this specimen in the neighbourhood of Eersteling. Several similar cases are known where species based on Greenstock specimens have been attributed to Pilgrims Rest, but subsequent investigation has shown that they were without doubt collected in the Eersteling area. In the Flora Capensis under M. burchellii Miss Owen’s specimen is cited as coming from ‘Zooloo Country’; this is probably another case of the several instances where Miss Owen’s specimens, collected after she had left Zululand (that is, after the Dingaan massacre), were labelled as from Zululand, whereas they probably were from the Kuruman or Zeerust Districts. Regarding another citation in the Flora Capensis, namely Zeyher from the ‘Aapies River’, it is doubtful whether this locality is correctly cited, since this species has not been found near Pretoria. Although none of the syntypes of M. dinteri has been seen, the description best fits the specimens in this taxon.
            textZh: SANBI 条目提供了该种的鉴别特征。
            sourceIds:
              - sanbi_9351_0
            locator: "SANBI/WFO archive Diagnostic row 66069; source 9351.0; publication: Verdoorn, IC. 1981. Revision of Melhania in southern Africa. Bothalia 13(3 & 4): 263 - 273. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
