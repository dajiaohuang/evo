    facets:
      morphology:
        status: partially-supported
        claims:
          - text: During the 15 October–15 December 2015 capture-release period on Cayo Santiago, Puerto Rico, researchers measured 125 free-ranging adult males aged six years or older and 21 female relatives. In pedigree models that combined male and female data, body mass, crown-rump length, canine length, and upper abdominal skinfold thickness met the authors' heritability threshold (h² ≥ 0.1); the testis-volume estimate was below that threshold. The authors caution that heritability intervals were wide. These measurements describe a managed island population and selected traits, not morphological variation across the full species range.
            textZh: 在波多黎各圣地亚哥岛，研究者于 2015 年 10 月 15 日至 12 月 15 日的捕捉—释放期测量了 125 只年龄至少六岁的自由活动成年雄性恒河猴，以及 21 只与雄性样本有亲缘关系的雌性。在合并雌雄数据的谱系模型中，体重、头臀长、犬齿长度和上腹部皮褶厚度达到作者采用的遗传率阈值（h² ≥ 0.1）；睾丸体积估计值低于该阈值。作者提醒遗传率区间较宽。这些测量描述的是管理型岛屿种群和所选性状，不代表整个物种分布区内的形态变异。
            sourceIds:
              - kimock2019
            locator: Abstract; Methods—Field site and subjects, Morphometric data collection, and Genetic parentage information; Results—Trait heritability; Discussion on confidence intervals.
            placeTimeScope: Cayo Santiago, Puerto Rico; morphometric capture-release sample collected 2015-10-15 to 2015-12-15. The island population descended from animals introduced from India in 1938; this claim concerns the later managed island population.
            lifeStatus: Free-ranging rhesus macaques in a managed island population; not a captive laboratory sample or a native-range population sample.
            originalLanguage: en
        gaps:
          - The study measured selected traits in one managed island population and does not characterize female morphology, full ontogenetic change, or variation across native-range and other populations. Heritability intervals were wide.
      lifeHistory:
        status: partially-supported
        gaps:
          - The result is limited to high-ranking males, one provisioned island population, one mating season, and paternity records for offspring surviving to yearling sampling; it does not establish species-wide reproductive aging or lifetime fecundity.
        claims:
          - text: Among 21 high-ranking adult male rhesus macaques aged 7–21 years in nine groups at the provisioned, semi-free-ranging Cayo Santiago population, age predicted the number of offspring recorded for the 2013 mating-season study, with older males siring fewer offspring. Paternity sampling occurred at the yearling stage; infants that died before sampling were not assigned to sires, so the result is limited to offspring counted by the study protocol.
            textZh: 在波多黎各圣地亚哥岛一个有补饲的半自由活动群体中，研究了来自 9 个群体、年龄为 7–21 岁的 21 只高等级成年雄性恒河猴。年龄可预测 2013 年交配季研究记录的后代数量，年龄较大的雄性记录到的后代较少。亲子鉴定样本在幼体达到一岁时采集；采样前死亡的幼体无法归属父亲，因此结论仅适用于该研究流程记录到的后代。
            sourceIds:
              - sobral2024reproduction
            locator: Abstract; Methods, Study animals and offspring-paternity calculations; Results, Effect of androgen and color ornamentation on mating and reproductive output; Discussion.
            placeTimeScope: Cayo Santiago, Puerto Rico; 21 high-ranking adult males from nine social groups; behavioral and biological data for the 2013 mating season, February–July 2013.
            lifeStatus: Semi-free-ranging rhesus macaques in a managed island population provisioned with food and water; this is not an unprovisioned wild population or a species-wide demographic estimate.
            originalLanguage: en
      ecology:
        status: partially-supported
        claims:
          - text: In one free-ranging troop of 64 rhesus macaques in the buffer zone of Buxa Tiger Reserve, West Bengal, India, observed from October 2013 to September 2014, fruit comprised 70.8% of the diet in the study-defined non-provisioning period (May–September) and 28.8% in the provisioning period (October–April). Mean daily range was 4.72 km and 2.58 km for those periods, respectively. These are seasonal observations of one troop and do not isolate provisioning from every seasonal influence or describe the species as a whole.
            textZh: 在印度西孟加拉邦布克萨虎保护区缓冲区一个由 64 只恒河猴组成的自由活动群体中，研究于 2013 年 10 月至 2014 年 9 月进行观察。按研究定义，5–9 月为无投喂期、10–4 月为投喂期；水果分别占这两个时期饮食的 70.8% 和 28.8%，平均日活动距离分别为 4.72 千米和 2.58 千米。这是对单一群体的季节性观察，无法排除所有季节影响，也不能代表整个物种。
            sourceIds:
              - sengupta2015
            locator: Methods, Study Area and Study Troop; Results, Fruit availability, degree of provisioning and degree of frugivory and Sites of seed deposition; Table 3.
            placeTimeScope: Damanpur Block in the buffer zone of Buxa Tiger Reserve, West Bengal, India; one troop observed October 2013–September 2014. The article defines May–September as non-provisioning and October–April as provisioning.
            lifeStatus: One free-ranging troop exposed to seasonal tourist and local food provisioning; no captive animals were studied.
            originalLanguage: en
        gaps:
          - The study covers one troop and one annual cycle; broader populations, geographic variation, and causal effects independent of season remain unassessed.
      evolution:
        status: partially-supported
        claims:
          - text: Liu et al. analyzed 81 geo-referenced wild Chinese rhesus macaques from five subspecies and 17 locations. Their population analyses resolved five genetic lineages across mainland China and Hainan and reported evidence of recent gene flow; these results describe the Chinese sample and study models.
            textZh: Liu 等人分析了来自中国 17 个地点、代表 5 个亚种的 81 只具有地理定位信息的野生恒河猴。群体分析识别出分布于中国大陆和海南的 5 个遗传谱系，并报告近期基因流动证据；这些结果限于该研究样本和模型。
            sourceIds:
              - liu2018
            locator: Abstract; Results and Discussion, “Genetic diversity, phylogeny, and population structure”; Figure 1.
            placeTimeScope: Wild-born rhesus macaques sampled at 17 locations in China; the paper's population structure and gene-flow inferences are analysis-specific.
            lifeStatus: Wild-born animals; captive reference populations appear only as separately identified context.
            originalLanguage: en
          - text: Using pedigree and reproductive records from the Cayo Santiago population, the authors tested whether male morphometric traits predicted average annual offspring production, a proxy rather than lifetime reproductive success. They found no definitive evidence of directional, stabilizing, disruptive, or correlational selection on the measured traits. The analysis therefore does not establish that these traits are never selected; the authors note limits in the proxy and alternative selection mechanisms.
            textZh: 研究者使用圣地亚哥岛种群的谱系和繁殖记录，检验雄性形态测量性状能否预测年均后代产量；该指标是替代量，并非终生繁殖成功。研究未发现测量性状存在明确的定向、稳定化、分裂或相关选择证据。因此，该分析不能证明这些性状从不受选择；作者指出了替代指标的限制以及其他可能的选择机制。
            sourceIds:
              - kimock2019
            locator: Methods—Genetic parentage information and Statistical analyses; Results—Selection on traits; Discussion on selection gradients and limits of reproductive-success measures.
            placeTimeScope: Cayo Santiago, Puerto Rico; morphometric data collected in October–December 2015 and evaluated against pedigree-linked reproductive records. Annual offspring count was used as a proxy; lifetime reproductive success was unavailable for most subjects.
            lifeStatus: Managed free-ranging island population; results do not estimate selection across the native range or all rhesus macaque populations.
            originalLanguage: en
        gaps:
          - One island-population study using average annual offspring production does not resolve lifetime fitness, all forms of selection, or species-wide evolutionary history.
      distribution:
        status: partially-supported
        claims:
          - text: The genomic survey included wild Chinese rhesus macaques from 17 locations on mainland China and Hainan. These sample locations document the study's geographic coverage and do not delimit the species' current global range.
            textZh: 该基因组调查纳入了中国大陆和海南 17 个地点的野生恒河猴。这些采样地点仅说明研究的地理覆盖范围，并未界定该物种当前的全球分布。
            sourceIds:
              - liu2018
            locator: Abstract; Results and Discussion, “Genetic diversity, phylogeny, and population structure”; Figure 1 and Supplementary Table S1.
            placeTimeScope: Seventeen study locations in China; sampling describes the survey, not the full geographic distribution.
            lifeStatus: Geo-referenced wild-born samples.
            originalLanguage: en
        gaps:
          - No complete current or historical range inventory was conducted.
      fossil:
        status: not-assessed
        gaps:
          - The selected study does not review the fossil record.
      conservation:
        status: partially-supported
        claims:
          - text: On an 11-km NH-7 segment through the Kanha–Pench corridor beside Pench Tiger Reserve in Madhya Pradesh, India, roadkill monitoring recorded 54 Macaca mulatta deaths from August 2009 to July 2010 (27 in summer, 19 in winter and 8 during monsoon). Within this single study, seasonal roadkill counts were positively correlated with traffic intensity, and the highest roadkill hotspot overlapped a location with frequent roadside feeding. These observations do not estimate a population-level mortality rate, establish causation, or describe present-day or range-wide conservation status.
            textZh: 在印度中央邦、毗邻奔奇虎保护区并穿越 Kanha–Pench 廊道的 NH-7 一段 11 公里路段，研究人员于 2009 年 8 月至 2010 年 7 月的路杀监测中记录了 54 只恒河猴死亡（夏季 27 只、冬季 19 只、季风期 8 只）。在这项单点研究中，季节路杀数量与交通强度呈正相关，最高路杀热点与频繁路边投喂地点重合。这些观察不能估算种群死亡率、证明因果关系，也不代表现今或全分布区的保育状况。
            sourceIds:
              - pragatheesh2011
            locator: Abstract; Methods, Roadkill data collection; Results, Roadkills
            placeTimeScope: One 11-km NH-7 segment between Kurai and Gandatola along the eastern boundary of Pench Tiger Reserve and through the Kanha–Pench corridor, Madhya Pradesh, India; roadkill monitoring from August 2009 to July 2010, twice daily in early morning and late evening. Seasonal counts were 27 in summer, 19 in winter and 8 during monsoon.
            lifeStatus: Free-ranging macaques occupying roadside habitat in the study area; this is not a captive cohort or a range-wide population sample.
            originalLanguage: en
        gaps:
          - A single road segment and one year of roadside carcass monitoring do not establish a population-level mortality rate, population impact, present-day mortality or a range-wide threat trend; no detection or carcass-persistence correction is reported.
          - The study does not assign a formal conservation category. Correlation with traffic intensity and overlap with roadside-feeding hotspots are observational associations and do not establish a causal mechanism.
