  catalogue-dossier:
    scientificName: Macaca mulatta (Zimmermann, 1780)
    rank: species
    sourceDatasetId: "2144"
    identity:
      method: Exact accepted COL26.8 species usage 3WWNQ verified against ChecklistBank dataset 316115 search and taxon endpoints; verbatim name, authorship, species rank, accepted status, sourceDatasetId 2144, and Primates parent classification were checked. The complete accepted parent path through Primates was verified from the immutable COL26.8 hierarchy archive.
      scope: COL26.8 usage 3WWNQ only. Existing evidence concerns wild Chinese genomic samples, one free-ranging troop in Buxa Tiger Reserve, India, and high-ranking males in a provisioned, semi-free-ranging Cayo Santiago cohort observed in 2013. New morphology and selection claims concern a separate managed free-ranging Cayo Santiago capture-release cohort measured in 2015. These distinct study scopes do not support species-wide generalization. A new conservation source concerns road mortality on one 11-km NH-7 segment in Madhya Pradesh during 2009–2010; it does not establish a species-wide mortality rate or conservation category.
      parentChain:
        - id: 5HYC
          name: Macaca
          authorship: Lacépède, 1799
          rank: genus
          status: accepted
        - id: L4C
          name: Papionini
          authorship: null
          rank: tribe
          status: accepted
        - id: JB3
          name: Cercopithecinae
          authorship: Gray, 1821
          rank: subfamily
          status: accepted
