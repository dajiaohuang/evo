        usage:
          title: Phyllanthus acuminatus Vahl, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrub or small tree, 2-8 m high, sparsely branching; monoecious; branches of current year producing 3-6 deciduous branchlets; scale-leaves inconspicuous, pale, less than 2 mm long. Deciduous branchlets bipinnatiform (except for first of the season); primary axis 2-5 dm long, ca 2-3 mm broad, wing-angled, dor- sally rough or hirsutulous, with ca 8-20 ultimate axes, each 5-20 cm long, with mostly 7-20 leaves. Leaves membranous to chartaceous; petioles adaxially rough- ened or hirsutulous, 1.5-3 mm long; stipules triangular, blunt, those on primary axis up to 1.3 mm long (somewhat smaller on ultimate axes), persistent, often reflexed; blades ovate or elliptic, lucid and scabridulous above, smooth beneath (except along veins), ca 2-4.5 cm long, 1-2.5 ca broad, abruptly and bluntly cuspidate-acuminate at the tip, usually obtuse at base. Cymules bisexual, on ulti- mate axes, with 5-20 staminate and a single pistillate flower. Staminate flowers with pedicels capillary, 3-4.5 mm long; calyx-lobes 6, biseriate, the outer narrowly oblong, ca 0.9-1 mm long, 0.4-0.6 mm broad, the inner rotund, ca 0.9-1.2 mm long and broad; disc segments 3, reniform, massive; stamens 3, the filaments con- nate into a short column 0.1-0.3 mm high, the anthers triangular-ovate, apiculate, dehiscing horizontally; pollen grains globose, with 3 short diorate colpi, pilate. Pistillate flowers with pedicels 5-12 mm long, slender, often angled, scabridulous at least below; calyx-lobes 6, biseriate, with narrow whitish margins, the outer elliptic, 1.1-1.4 mm long, 0.5-0.9 mm wide, the inner broadly ovate, 1.5-1.7 mm long, 1-1.3 wide; disc cupuliform, massive, 3-lobed; ovary ablate, smooth, deeply sulcate, the styles free, flattened, spreading, 0.4-0.6 mm long, divided 1/4 to l2 their length. Capsules 4.5-5 mm in diam, conspicuously veiny, the columella mas- sive, ca 2 mm long; seeds plano-convex, ca 2.5-2.8 mm long, reddish-brown, smooth with epidermis foveolate, sometimes with a rudimentary caruncle.
