          - text: Among female mountain gorillas identified as Gorilla beringei beringei, mean age at first parturition was 10.1 ± 1.7 years (n = 56) in the Virungas and 10.5 ± 1.3 years (n = 10) in Bwindi; the pairwise comparison was not statistically significant (p = 0.55). This result does not demonstrate equivalence between the two populations and does not cover Grauer's gorilla or every G. beringei population.
            textZh: 在被鉴定为山地大猩猩 Gorilla beringei beringei 的雌性样本中，Virunga 的初次产仔平均年龄为 10.1 ± 1.7 岁（n = 56），Bwindi 为 10.5 ± 1.3 岁（n = 10）；两地的配对比较未达到统计显著（p = 0.55）。该结果不能证明两个种群等同，也不涵盖格劳尔大猩猩或 G. beringei 的所有种群。
