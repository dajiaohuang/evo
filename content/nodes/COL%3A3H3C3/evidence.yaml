      conservation:
        status: partially-supported
        gaps:
          - The genetic evidence and recommendation do not provide a current formal conservation category, present-day abundance, range-wide population trend, or outcome of later protection actions.
        claims:
          - text: Among historical Grauer’s gorilla samples, unique mitochondrial haplotypes were concentrated in peripheral locations outside the distribution considered current by the 2018 paper. The paper describes the southern Baraka Sibatwa forest and northern populations around Lubero and Butembo as extinct at that time and reports eight unique haplotypes across those two peripheral regions. The authors recommend preserving remaining peripheral populations and habitat connectivity to maintain genetic diversity; this is a study-specific genetic inference and recommendation, not a current formal status or abundance assessment.
            textZh: 在格劳尔大猩猩历史样本中，特有线粒体单倍型主要集中于 2018 年论文所认定的当时分布范围之外的外围地点。论文称最南端的 Baraka Sibatwa 森林和最北端 Lubero—Butembo 一带种群在当时已灭绝，并报告这两个外围地区合计有 8 种独特单倍型。作者建议保护仍存续的外围种群并改善栖息地连通性，以维持遗传多样性；这是针对该研究的遗传推论和建议，并非当前正式保育等级或数量评估。
