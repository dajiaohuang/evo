          scope: Comparative study of complete mitochondrial genomes from Grauer’s gorillas (Gorilla beringei graueri) and mountain gorillas (G. b. beringei), using historical museum specimens and modern samples. The Grauer’s dataset included 68 historical individuals collected 1910–1980 (median 1950) and 29 unique modern individuals; newly collected modern fecal samples were obtained in 2014 from Nkuba in Walikale territory and the high-altitude sector of Kahuzi-Biega National Park, Democratic Republic of the Congo. The authors acknowledge ICCN and the Dian Fossey Gorilla Fund for permission and logistical support for DRC research; no permit number or standalone ethics approval is stated in the article. Claims are limited to mitochondrial markers, the study samples, and its models; the authors declare no competing interests.
