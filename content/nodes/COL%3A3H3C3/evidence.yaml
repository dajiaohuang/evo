            placeTimeScope: Virunga Massif/Volcanoes National Park, Rwanda (demographic records September 1967–December 2017; first-parturition subset n = 56) and Bwindi Impenetrable National Park, Uganda (records April 1993–May 2020; subset n = 10). Article published in 2023.
