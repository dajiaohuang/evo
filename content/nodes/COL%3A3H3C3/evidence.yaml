      ecology:
        status: partially-supported
        claims:
          - text: "The comparative behavioral study included mountain gorilla groups from two sites: three groups at Karisoke Research Center in Volcanoes National Park, Rwanda, followed regularly for 2006–2008, with six additional groups observed after group fissions and new group formations through 2014; one group in Bwindi Impenetrable National Park, Uganda, was observed for 13 years. The authors report the nearest points of the two populations as about 30 km apart and study groups about 45 km apart, with cultivated and developed land between them. These study records do not estimate species-wide behavioral frequencies or establish social learning as the cause of variation."
            sourceIds:
              - robbins2016
            locator: Methods, Study Sites, mountain gorilla populations paragraph; Fig. 1 caption; Discussion, paragraphs on observational inference and further research.
            placeTimeScope: Habituated wild groups at Karisoke/Volcanoes National Park, Rwanda, and Bwindi Impenetrable National Park, Uganda; Rwanda observations began 2006–2008 with additional groups followed through 2014, while Bwindi group observation duration was 13 years (the paper does not state exact calendar endpoints for that duration).
            lifeStatus: Wild, free-ranging, habituated mountain gorilla groups; no captive or domesticated individuals included.
            originalLanguage: en
        gaps:
          - Evidence is restricted to behavioral field observations at two mountain gorilla study areas and does not inventory diet, habitat use, species-wide interactions or all populations.
          - The study discusses potential cultural variants; it does not demonstrate that social learning caused them.
      evolution:
        status: partially-supported
        gaps:
          - This is one complete-mitochondrial-genome study with finite historical and modern samples; it does not establish nuclear-genome change, genome-wide selection, or a complete evolutionary history across all Gorilla beringei populations.
        claims:
          - text: In the assembled complete-mitochondrial-genome dataset, Grauer’s gorillas had 20 haplotypes in historical samples and 11 in modern samples, with significantly lower modern haplotype and nucleotide diversity (P = 0.0169 and 0.0062); the difference was not explained by sample-size imbalance. Historical samples came from 68 individuals collected in 1910–1980 (median 1950), compared with 29 unique modern individuals. The authors interpreted the temporal loss as attributable to peripheral-population extirpation rather than a diversity decrease within the currently sampled range. This is mitochondrial evidence for the study’s samples and model, not a nuclear-genome or all-population result.
            textZh: 在本研究汇总的完整线粒体基因组数据中，格劳尔大猩猩历史样本和现代样本分别记录到 20 与 11 种单倍型，现代样本的单倍型与核苷酸多样性显著较低（P = 0.0169 与 0.0062）；样本量不均衡不能解释这一差异。历史样本来自 68 个体，采集于 1910–1980 年（中位数 1950 年）；现代样本为 29 个不重复个体。作者将时间差异解释为外围种群局部灭绝所致，而不是当前采样范围内多样性下降。这是针对研究样本和模型的线粒体证据，并非核基因组或全部种群的结论。
            sourceIds:
              - vanderValk2018mtDNA
            locator: Methods, Sample collection and Mitochondrial genome analyses; Results, Temporal changes in genetic diversity; Figure 2; Tables S4–S5; Discussion.
            placeTimeScope: Grauer’s gorilla historical museum samples collected 1910–1980 (median 1950) compared with 29 unique modern mitochondrial-genome individuals; the new modern fecal collection occurred in 2014 at Nkuba and Kahuzi-Biega in the DRC, combined with previously published genomes.
            lifeStatus: Historical museum specimens and modern fecal samples from free-ranging groups; the article does not assign a living/captive status to every historical specimen. No captive population is used as the Grauer’s temporal comparison.
            originalLanguage: en
      distribution:
        status: partially-supported
        claims:
          - text: The paper documents study populations at Bwindi Impenetrable National Park in Uganda and Volcanoes National Park in Rwanda, but the study-site records do not constitute a complete range assessment.
            sourceIds:
