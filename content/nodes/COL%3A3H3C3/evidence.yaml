            locator: Methods, Study Sites, mountain gorilla populations paragraph; Fig. 1 caption.
            placeTimeScope: "Two field-study locations only: Bwindi Impenetrable National Park, Uganda, and Volcanoes National Park/Karisoke, Rwanda; observation periods reported in the study-sites methods, spanning 2006 through 2014 at Karisoke and a 13-year observation duration at Bwindi."
            lifeStatus: Wild, free-ranging mountain gorillas in study groups; these observations do not document all native or other occurrence areas.
            originalLanguage: en
          - text: Historical Grauer’s gorilla museum samples in this study included sites inside and outside the range the authors estimated as current in 2018; modern fecal sampling in 2014 was limited to Nkuba and the high-altitude sector of Kahuzi-Biega National Park. The paper describes former peripheral populations around Baraka Sibatwa and Lubero–Butembo as extinct by 2018, while noting that the exact geographic origins of many previously published sequences were uncertain. These temporal study localities and interpretations do not constitute a complete current range inventory.
            textZh: 本研究中的格劳尔大猩猩历史博物馆样本涵盖论文作者在 2018 年估计的现今分布范围内外地点；2014 年现代粪便采样仅来自 Nkuba 和卡胡兹—比埃加国家公园高海拔区域。论文称 Baraka Sibatwa 与 Lubero—Butembo 周边的外围种群截至 2018 年已灭绝，同时指出许多既有发表序列的确切地理来源不确定。这些跨时期研究地点与解释并不构成当前完整分布区名录。
            sourceIds:
