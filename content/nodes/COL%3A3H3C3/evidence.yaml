            placeTimeScope: Historical museum localities and 2014 modern fecal samples from Nkuba and Kahuzi-Biega National Park, Democratic Republic of the Congo; distribution statements are those made by the 2018 study.
            lifeStatus: Historical museum specimens and non-invasive fecal samples from free-ranging populations; published sequence provenance is sometimes uncertain.
