            locator: Results, Geographic distribution of genetic diversity within Grauer’s gorilla; Figure 3; Discussion, Extirpation of peripheral populations is the main cause for the loss of genetic diversity; Conclusions.
            placeTimeScope: Historical Grauer’s gorilla samples and the distribution interpreted by the authors in 2018; peripheral sites include Baraka Sibatwa forest and areas around Lubero and Butembo in the DRC.
