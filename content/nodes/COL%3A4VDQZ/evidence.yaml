    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Small erect to spreading dome-shaped shrublet to 150 mm tall. Branches to 4 mm thick; upper branches brown; leaves crowded towards tips of branches, old leaves not remaining on the branches. Leaves triquetrous, globose to subglobose in outline, 2.0-4.0 x 1.5-2.0 mm, leaf pairs fused for 3/4 of the length; mucro obscure; slightly velvety; yellow-green. Flowers in compound cymose inflorescences; central primary axis to 4 mm long, equal proportionally to capsule length, bracteoles caducous; spines present, arranged in compound cyme, secondary axes with spines arranged in simple cyme; spines derived from aborted axillary buds and less frequently from old pedicels; spines branching at ± 45°, sharp, elevated above terminal leaf pair; filamentous staminodes many, forming a complete series around the stamens. Fruit 7- to 8-locular; top convex, base funnel-shaped, ± 3.9 x 4.7 mm; closing rodlet conspicuous; valve wings absent.
            sourceIds:
              - sanbi_17947_0
            locator: "SANBI/WFO archive Morphology row 104846; source 17947.0; publication: Powell, RF; Klak, C; Boatwright, JS; Magee, AR. 2017. A taxonomic revision of Schlechteranthus subgenus Microphyllus (Ruschieae; Aizoaceae). Syst. Bot. 42(4): 943 - 963. [DOI 10.1600/036364417X696429]. [All rights reserved]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Schlechteranthus parvus is the smallest among the spiny species in subgenus Microphyllus and only reaches 150 mm in height. It is most similar to S. stylosus as they share small leaves with a high degree of fusion and the same spine arrangement, with spines derived from aborted axillary buds. However, S. stylosus is a much larger shrub and reaches 400 mm in height.
