        usage:
          title: Pleonotoma variabilis (Jacq.) Miers, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Liana to at least 3 cm in diameter, bark fibrous; stem with 4 phloem arms in cross section, extreme center hollow; branchlets acutely tetragonal with the angles ribbed, brown to green with ribs usually blackish, the nodes without interpetiolar glandular fields, a linear ridge connecting opposite petioles; pesudo- stipules narrow, 3-5 mm long and 1 mm wide, often deciduous. Leaves 3- ternate or 2-ternate with a tendril or tendril scar; leaflets elliptic to elliptic- ovate, acute to acuminate, widely cuneate to asymmetrically truncate, 2.1-16 cm long and 0.8-9.5 cm wide, secondary veins 5-7 on a side, with scattered lepidote scales, slightly puberulous along the veins above, beneath usually with simple trichomes in the axils of lateral nerves and sometimes along the main veins, greenish when dry; tendril trifid, 2-14 cm long to branching, the 3 arms 0.1-2.1 cm long; petiole, petiolules, and subpetiolules all strongly angled, lepidote to puberulous, the terminal subpetiolule 0.3-4.8 cm long, laterals 0.2-2.2 cm long, the terminal petiolule 2.5-6.5 cm long, lateral 1.2-6.5 cm long, the petiole 2.1-6.7 cm long. Inflorescence a short, long-pedicelled raceme, usually terminal, the pedicels and peduncle mostly glabrous, somewhat simple- pubescent at the nodes. Flowers with the calyx cupular, more or less truncate, 5-9 mm long and 5-8 mm wide, mostly glabrous, more or less ciliate, sometimes with scattered lepidote scales and with glands in the upper third; corolla white or cream with light yellow tube, tubular-infundibuliform, 6.4-10.2 cm long and 1.3-2.7 cm wide at the mouth, the tube 4.5-7.0 cm long, the lobes 1.4-2.2 cm long, tube glabrous outside, the lobes glandular-lepidote and puberulous with plate-shaped glands outside at the base, tube glabrous within except for long simple multicelled trichomes at and below the level of stamen insertion, in bud long-pointed, conspicuously pubescent at the tip; stamens didynamous, the anther thecae divaricate, ca. 5 mm long, the longer filaments 2.6-2.8 cm long, shorter filaments 1.7-1.9 cm long, the staminode 4-5 mm long, inserted 1.9-2.1 cm from the base of the corolla tube; pistil 4.3-5.5 cm long, the ovary linear-oblong, 4 mm long and 1.5 mm wide, lepidote, the ovules 2-seriate in each locule; disc annular-pulvinate, 1.5-2 mm long and 3-4 mm wide. Capsule linear to linear-oblong, acute, somewhat compressed, 15-30 cm long and 1.7-2.7 cm wide, 3-7 mm thick, lepidote, slightly and irregularly warty-tuberculate with shallow projections, drying dark; seeds 1.1-1.5 cm long and 3.0-5.0 cm wide, the wings membranaceous, brown, poorly demarcated from the seed body.
