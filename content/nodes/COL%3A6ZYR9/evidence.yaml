    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Bulbous geophyte, 180-280 mm tall. Leaves 2-4, usually dry at flowering, oblong, erect, spreading apart like a fan, smooth. Flowers in a drooping cluster, narrowly tubular below with pale lemon to cream-coloured, deeply-channelled, recurved tepals above, stamens exserted. ?May.
            textZh: Strumaria luteoloba Snijman 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_14528_0
            locator: "SANBI/WFO archive Morphology row 32853; source identifier 14528.0; cited publication: Snijman, DA. 2013. Amaryllidaceae. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 33 - 42. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: The erect, fan-shaped leaf arrangement and dorsifixed anthers of S. luteoloba are sufficiently distinctive to place the species in subgenus Strumaria, but unlike most species in the subgenus, the filaments of S. luteoloba are not proximally fused into a tube. Like S. phonolithica the new species has narrow, closely imbricate tepals. However, S. luteoloba is easily recognized by the tepals being deeply channelled and sharply reflexed from ± halfway along their length, and by the outer tepal whorl reflexing 2-4 mm below the inner whorl so that the perigone has a distinctive biseriate appearance. The flower colour is also unique in the genus. The perigone is pinkish red near the base and pale lemon- to cream-coloured in the distal half. S. gemmata Ker Gawl., belonging to subgenus Gemmaria, is the only other species with lemon- or cream-coloured flowers but these are stellate and concolorous.
            textZh: SANBI 条目提供了 Strumaria luteoloba Snijman 的鉴别特征。
