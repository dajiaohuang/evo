        usage:
          title: Columnea zebrina Raymond, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Suffrutescent herbs or shrubs, epiphytic; stems 5-7 mm in diam., transparent appressed pilose when young. Leaves of a pair strongly unequal; larger blade in a pair oblanceolate, 13.5-11.8 cm long and 4.3-3.5 cm wide, the apex acute, oblique at the base, subentire, above green, glabrous, below green and suffused claret near the tip, sericeous, the hairs transparent to reddish, 5-7 celled, more numerous especially on the veins, redder near the leaf margins, also few 2-3 celled transparent appressed hairs; petioles 3 mm long; smaller leaves not seen. Flowers several to each axil; bracts lanceolate, 5-8 mm long, pale brown sericeous; pedicels 12-13 mm long, pale brown sericeous; calyx lobes ovate, 1.2-2.2 cm long, acute, serrulate and 1-2 toothed, the teeth to 1 mm long, greenish yellow, sometimes with reddish tips; corollas yellow or reddish with dark red stripes down the centers of the lobes and continuing to the base of the corolla tube, funnelform but strongly zygomorphic, ca. 5.8 cm long, ca. 4 mm in diam. above the base, becoming ca. 10 mm in diam. at the throat, reddish pilose outside, the lobed portion of the corolla ca. 2.5 cm long, the lobes strongly unequal, the posterior pair connate, truncate at the apex, ca. 1.1 cm long, the anterior lobe 1.5-2.0 cm long, spreading; filaments yellow, pilose, the anthers exserted, ca. 2 mm long and 1 mm wide; ovary sericeous, the style glandular pilose, yellow, the stigma bibbed. Fruits white. Chromosomes 2n = 18 (Lee, 1967).
          originalLanguage: en
          sourceField: general
