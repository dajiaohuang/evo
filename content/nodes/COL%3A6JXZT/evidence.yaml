          - text: Gasteria excelsa is a variable but distinct species. The very large, spreading much-branched panicles, 1-1.9 m tall and up to 2.4 m in diameter, distinguish this from any other species. The perianth is light pink and gasteriform for two thirds of its length. Plants of this species are also recognized by their very large acaulescent, often solitary, rosettes of triangular-lanceolate leaves with sharp, serrulate margins; these leaf margins are unique in the genus. G. excelsa is closely related to G. pulchra, which has a somewhat similar acaulescent rosette and tuberculate juvenile leaves, as well as a paniculate inflorescence. The latter, however, is immediately distinguished from G. excelsa by its narrowly triangular leaves and reddish pink perianth. G. pulchra also differs in that it flowers in spring. G. excelsa is also related to G. nitida, which differs by its branched, erect to erectly spreading racemose inflorescence, the bright reddish pink perianth and the entire leaves. G. excelsa may also be confused with very large, robust forms of G. bicolor, G. croucheri and G. acinacifolia, but G. bicolor always has a short leafy stem and flowers from July to October, while G. acinacifolia and G. croucheri have flat-topped panicles and a differently shaped, larger perianth, indistinctly gasteriform basally for half its length.
