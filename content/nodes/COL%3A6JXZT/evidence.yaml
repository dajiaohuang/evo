      ecology:
        status: partially-supported
        claims:
          - text: It occurs from near sea-level to an altitude of 1400 m. The habitat consists of evergreen coastal forest and forested river valleys. G. excelsa is generally confined to shady undergrowth. It grows in well-drained soils derived from shales and mudstones, as well as on quartzitic sandstone, and on dolerite. Precipitation ranging between 600 and 1000 mm annually occurs in summer and winter, with winters tending to be dry in the north-east. Among the veld types in which this species occurs are valley bushveld, coastal forest and thornveld.
