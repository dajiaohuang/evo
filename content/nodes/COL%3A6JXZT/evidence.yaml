      morphology:
        status: partially-supported
        claims:
          - text: "Plants acaulescent, robust, decumbent to erect, solitary, 300-600 mm tall, 600-750 mm in diameter. Roots succulent, up to 3 mm in diameter. Leaves in a dense rosette, 100-400 mm long, 100-180 mm broad at the base, triangular to triangular-lanceolate, erectly spreading to somewhat recurved, brittle; new plants proliferate from leaf fragments; adaxial surface canaliculate, dark green; abaxial surface somewhat convex with a distinct excentric keel; both surfaces dark green with indistinct white spots arranged in transverse bands, which (rarely) may be barely visible, rarely striate; epidermis smooth; margin often very sharp, white, semi-translucent, cartilaginous, serrulate; apex acute or obtuse, mucronate. Juvenile leaves distichous, densely white-spotted, patent, lorate, tuberculate; tubercles domed, rarely conical, lower surface rarely somewhat asperulous; apex obtuse, mucronate. Inflorescence a very large spreading panicle, 1-3 per plant, 1-1.9 x 1.5-2.4 m; scape up to 34 mm in diameter at the base, branched 550-750 mm from the base; side branches erectly spreading rarely horizontally spreading bearing 30 to 100 flowers (500 to 2700 per plant); bracts 15-20(-25) mm long and 15-25(-30) mm broad at the base; floral bracts 7-8 mm long and 2 mm broad at the base; pedicels 7-8 mm long. Perianth 22-26 mm long stipitate for 2-3 mm, gasteriform basally for more than half of its length, thence constricted to a tube 5 mm in diameter; the gasteriform portion narrow-elliptic, light pink to rarely white, 6-7 mm in diameter at its widest point; apices erect, becoming slightly erectly spreading, white with pale green median stripes, obtuse; margin of inner segments free, canaliculate for the length of the gasteriform portion. Stamens 20-22 mm long anthers oblong, 2 mm long. Ovary 7 mm long, 2.5 mm in diameter, style 10-14 mm long included, exceeding anthers after anthesis: stigma becoming capitate after anthesis. Capsule 17-20 mm long, 8-12 mm broad. Seeds 4-5 mm long and 2-3 mm wide. Flowering time November to February."
