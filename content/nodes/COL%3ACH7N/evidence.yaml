        usage:
          title: Amaranthus viridis L., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Rather delicate glabrous annuals to as much as I m. high, the branches ascend- ing. Leaves glabrous, entire to minutely crenulate, deltoid- to rhombic-ovate, apically emarginate to rounded and mucronate, basally truncate to subacute, 1.5-6 cm. long, 1-4 cm. broad, the petioles 0.5-4 cm. long. Inflorescences of thyrses racemosely disposed, the terminal and axillary thyrses cylindric, mostly less than 7 mm. broad. Flowers polygamo-monoecious or monoecious; bracts 'and bracteoles subequal, lanceolate to ovate, ca. 1 mm. long; sepals 3, linear-oblong to pbovate, rounded, mucronate, 1-1.5 mm. long, the midrib dark green, the margins scariose; stamens 3, discrete, 1-1.5 mm. long; ovary compressed-globose; style 1, minute, stigmata 3, longer than the style. Fruit an indehiscent, strongly rugose utricle, 1-1.5 mm. long, 1-1.5 broad; seeds cochleate-orbiculate, dark red to black, dull, minutely pebbled, 1-1.2 mm. broad.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 364
