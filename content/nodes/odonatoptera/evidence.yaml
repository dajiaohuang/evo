    - subjectId: taxon:odonatoptera
      claimKind: scientific
      claimType: topology
      statement: A transcriptomic tree combined with fossil calibrations supplies one evidence route through living Odonata and selected fossil odonatopterans. This navigation group joins a study-bounded route; its inferred node ages are not Odonatoptera's global FAD or a direct ancestor sequence.
      confidence: medium
      confidenceRationale: Confidence is medium because the cited primary study directly supports the bounded topology statement at the supplied locator. The confidence does not extend beyond this navigation group joins a study-bounded route; its inferred node ages are not Odonatoptera's global FAD or a direct ancestor sequence.
      referenceLinks:
        - relation: supports
          referenceId: kohli-2021-odonata-transcriptomics
          pages: "103324"
          figure: Figures 1–5; supplementary calibrations
          quoteLocator: Transcriptome sampling; fossil calibrations; divergence-time analyses
    - subjectId: taxon:odonatoptera
      claimType: fossil-range
      claimKind: scientific
      statement: The 325–0 Ma Odonatoptera display is a reviewed oldest-fossil-to-living navigation envelope beginning with Serpukhovian records at 325–324 Ma.
      confidence: medium
      confidenceRationale: The systematic review directly identifies the oldest superorder record and separately distinguishes it from the later appearance of modern Odonata.
      referenceLinks:
        - referenceId: sutherland-2025-odonatoptera-classification
          relation: supports
          pages: Article 5
          figure: Odonatoptera classification synthesis
          quoteLocator: Paleontological Record and Odonatoptera Classification sections, oldest record at 325–324 Ma
  claim-rationales.zh:
    - 置信度为中：所引主研究在给定页码、图版或章节定位器处直接支持这一受限的拓扑表述；置信度不外推到文中明确排除的全群起源、全球首现、直接祖先或精确端点。
    - 系统综述直接标识超目级最老记录，并将其与更晚出现的现代蜻蜓目区分。
  claim-statements.zh:
    - 转录组树结合化石校准，形成一条穿过现生蜻蜓目与部分化石蜻蜓总群的证据路线。这一导航组只连接研究限定的路线；其推断节点年龄不是蜻蜓总群的全球首现，也不是直接祖先序列。
    - 325–0 Ma 的 Odonatoptera 显示是经综述的最早化石至现生导航包络，起点为 325–324 Ma 的 Serpukhovian 记录。
