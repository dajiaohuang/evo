  claims:
    - subjectId: event:riograndia-brasilodon-jaw-joint-homoplasy
      claimKind: scientific
      claimType: morphology
      statement: In a 26-specimen μCT sample, Riograndia preserves dentary–squamosal contact whereas nine Brasilodon specimens do not, supporting homoplastic acquisition of the contact rather than a single progressive ancestor-to-descendant jaw-joint sequence.
      confidence: medium
      confidenceRationale: The named multi-specimen CT sample, segmented models and phylogenetic matrices are archived. Medium confidence limits the claim to sampled anatomy, distinguishes contact from a fully formed mammaliaform joint and avoids assigning crown status or direct ancestry.
      referenceLinks:
        - referenceId: rawson-2024-cynodont-jaw-joint
          relation: supports
          pages: 381–388
          figure: Figures 2–4
          quoteLocator: Results; Evolution of the mammalian jaw joint; Methods
        - referenceId: rawson-2024-cynodont-jaw-joint-data
          relation: supports
          quoteLocator: Dataset record; specimen STL models, videos and phylogenetic matrices
  claim-rationales.zh:
    - 具名的多标本 CT 样本、分割模型和系统矩阵均已归档。中等置信度把结论限定于已取样解剖，区分简单接触与完整哺乳形类关节，并避免赋予冠群资格或直接祖先身份。
  claim-statements.zh:
    - 在 26 件标本的 μCT 样本中，Riograndia 保存齿骨—鳞骨接触，而 9 件 Brasilodon 标本没有；这支持该接触的趋同获得，而非单一渐进的祖先到后代颌关节序列。
