          originalSourceText: Small or medium-sized tree, the branchlets and inflorescences conspicuously rufous, densely short-hirsute with straight, slender, multicellular tawny hairs 0.5-0.7 mm. long; branchlets 2-4 mm. in diameter below the inflorescence, the hairs persistent. Leaves hairy like the stems but less densely, the upper surface glabrate in age except the; midrib, the lower surface densely hairy on the principal veins and uniformly but sparsely so on the anastomosing veinlets, where the hairs are often about 3 times as long as the distance between them; hairs of the leaves with enlarged papillose bases; leaf-blades thick and subcoriaceous, oblong or elliptic, acute and gradually short-acuminate at apex, rather abruptly rounded or obtuse at base, 3-6 cm. wide, 6-15 cm. long, often 2-2.7 times as long as wide; lateral veins 8-12 pairs, arcuate, slightly impressed above, raised beneath, the small veinlets finely reticulate and often raised on the upper surface, making it rough to the touch; glands abundant on the lower surface, usually concentrated near base and apex of the blade, elliptic or circular, 0.2-0.5 mm. across, with raised rim and depressed center; petioles very stout, 2-4 mm. long and about 2 mm. thick, their surfaces concealed by the hairs; stipules subpersistent, hirsute, subulate, appressed, 6-9 mm. long. Flowers many, white or purplish-white, in very narrow spike-like leafless panicles 10-20 cm. long and 2-4 cm. thick, the lateral branches of the spike often about 1.5 cm. long, ascending, cymosely 1- or few-flowered; bracts of the cymes round or oval, 1-1.5 mm. long, heavily beset with large glands, these varying from depressed spots 0.3 mm. across to peltate glands 1 mm. across on stalks 1 mm. long, the larger glands often very numerous and conspicuous in the spikes after the abortion of most of the flowers; bracts subtending the lateral cymes (i. e. those of the main axis) eglandular or nearly so, hirsute, subulate, about 5 mm. long; pe