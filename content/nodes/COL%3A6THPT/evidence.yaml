        usage:
          title: Pachyrhizus erosus (L.) Urb., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Herbaceous vines; stems pilose, often drying hollow; rootstock tuberous. Leaves pinnate trifoliolate, the leaflets ovate to broadly ovate, the terminal leaflet broadest and often 3-7 lobed, the sinuses and lobes acute or rounded, mucronate, the lateral leaflets oblique, often less lobed or entire, basally deltoid, 3-veined from the base, drying slightly discolorous, glabrate or densely soft tomentose; petiolules 4-5 mm long, stout, pilose; petioles and rachis slender, drying angled, pubescent; stipels 1-2 mm long, acicular, sericeous, basally extended into definite ribs on the rachis; stipules minute, caducous. Inflorescences axillary pseudora- cemes, mostly 12-20 cm long, the flowers congested near the apex, the peduncle mostly longer and stouter than the petioles, the bracteoles resembling the stipels, subtending and much shorter than the calyx; pedicels ca. 2 per node, slender, ca. 5 mm long. Flowers blue, calyx 5-8 mm long, tubular, 2-lipped, the upper 2 teeth mostly connate, the lower 3 acute or acuminate, shorter than the tube, subequal or the lowermost longest and acuminate; standard ca. 15 mm long, suborbicular, emarginate, the wings and the keel about as long as the standard, sometimes ciliolate. Legume oblong, ca. 10 cm long, 1.5-2 cm wide, compressed, appressed strigose.
          originalLanguage: en
          sourceField: general
