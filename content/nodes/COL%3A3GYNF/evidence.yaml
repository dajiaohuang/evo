          originalSourceText: Herbaceous vines; stems slender, densely soft pubescent when young, pilose in lines when older. Leaves ovate to elliptic, apically acuminate, basally cordate, strigose on both surfaces, 4-8 cm long and 2-4 cm wide; petioles sparsely strigose, mostly 2-4 cm long. Inflorescences umbelliform racemes, 10-15-flowered; pe- duncles puberulent, 2-3 cm long; pedicels sparsely pilose, 1.5-2.5 cm long. Flowers with the calyx sparsely strigose outside, glabrous within, the lobes lanceolate, 5-7 mm long and 2-2.5 mm wide; corolla rotate, 2.5-3 cm in diameter, green, glabrous throughout except for the annulus, the lobes lanceolate-ovate, 8-12 mm long and 4-7 mm wide, the faucal annulus a prominent thin ridge, ca. 0.5 mm high, annular, densely long ciliate; anther appendages fleshy, ca. 2.5 mm wide, with prominent lateral lobes which are usually twisted ribbon-like to project out from the anther ca. 0.8 mm, the entire surface densely and minutely papillate; the corona thin, fleshy, 5-lobed, lobes basically subquadrate but the
