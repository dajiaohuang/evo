        claims:
          - text: Cormous geophyte, 30-50 cm, tunics woody. Leaves linear with thickened margins and midribs. Flowers tubular, tepals subequal, red to orange.
            textZh: Gladiolus watsonius Thunb. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 7249; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Distinguished from allied species in the series with similar flowers by the linear leaves, mostly 4-6 mm wide, with the main vein and margins heavily thickened, the blade thus with four longitudinal grooves. Gladiolus teretifolius from the Overberg has narrow, terete leaves 1-2 mm wide, and G. quadrangularis from inland near Ceres has centric blades x-shaped in section and softer corm tunics.
            textZh: SANBI 条目提供了 Gladiolus watsonius Thunb. 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 94613; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
