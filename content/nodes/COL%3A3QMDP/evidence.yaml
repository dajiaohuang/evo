    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Climber. Leaves unifoliolate; acarodomatia, if present, in axils of basal or lower veins; petioles articulate in upper portion. Calyx lobes much shorter than calyx tube, very shallow or up to 1.5 mm long, then thickened and conduplicate, apiculate. Flowers white.
            sourceIds:
