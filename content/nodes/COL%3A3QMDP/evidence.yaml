            locator: "SANBI/WFO archive Morphology row 2478; source 11118.0; publication: Herman, PPJ; Retief, E. 1997. Plants of the northern provinces of South Africa: Keys and diagnostic characters. Strelitzia 6: 1 - 681. National Botanical Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: In this species the calyx is almost truncate or shortly lobed. When present the lobes are rather thick and conduplicate and usually have a recurved apicule but are not produced into an erect subulate apical portion. Among the simple leaved species in South Africa, J. streptopus has calyx-lobes intermediate between those of J. breviflorum and those which are produced into long subulate lobes as, for instance, in J. multipartitum.
