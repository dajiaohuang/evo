        claims:
          - text: Cormous geophyte to 35 cm, tunics papery. Leaf blades reduced, sword-shaped. Flowers funnel-shaped, deep pink with white streaks on lower tepals.
            textZh: Gladiolus carmineus C.H.Wright 的 SANBI 物种条目记录了形态特征。
            sourceIds:
