            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: an autumn-flowering species recognised by the reduced foliage and moderately large, funnel-shaped, carmine flowers with perianth tube 30-35 mm long. It has been confused with vegetatively similar Gladiolus stefaniae on the Potberg, but that species has larger, usually red flowers with perianth tube 35-45 mm long, dorsal tepal 53-58 mm long and filaments 30-42 mm long.
