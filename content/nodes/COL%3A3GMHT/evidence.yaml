            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: This very striking Gnidia is clearly related to G. orbiculata C. H. Wright and to the widely distributed G. oppositifolia L., having the broad glabrous opposite leaves, the four dark fleshy “petals” with inrolled margins and the yellow hirsute calyx of those species. It is, however, conspicuously distinct in its exceptionally large leaves and the large size of its flowers.
