        claims:
          - text: Large-leaved, resprouting shrub to 1 m. Leaves opposite, broadly ovate to orbicular; involucral leaves slightly smaller. Flowers 6-15 at branch tips, yellow, hypanthium minutely hairy, ribbed, petaloid floral scales 4, fleshy.
            sourceIds:
