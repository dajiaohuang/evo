  claim-statements.zh:
    - 一项覆盖 15 个现生与化石河马科类群、使用 37 个性状的综述与支序分析修订了若干历史归类，同时保留河马科为研究焦点；所得成员关系是取样分类假说，不是完整化石延续范围。
