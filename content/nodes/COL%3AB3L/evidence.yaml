      statement: A review and 37-character cladistic analysis of 15 living and fossil hippopotamid taxa revises several historical assignments while retaining Hippopotamidae as the study’s focal family; the resulting membership is a sampled taxonomic hypothesis, not a complete fossil duration.
      confidence: medium
      confidenceRationale: The systematic review provides a family-wide morphology audit and explicit cladistic sample. Its revisions and limited taxon set are retained.
      referenceLinks:
        - relation: supports
          referenceId: boisserie-2005-hippopotamidae
          pages: 1–26
          quoteLocator: Taxonomic review; cladistic analysis; discussion of revised family membership
