  claims:
    - subjectId: taxon:callithrix_jacchus
      claimKind: scientific
      claimType: ecology
      statement: In one captive Wisconsin colony, offspring of 24 experienced common-marmoset fathers classified as responsive to infant distress calls had higher survival past one month (p = 0.002; 62 offspring) and greater mean weights at weeks 28 and 30; this study-level association does not establish a species-wide causal effect or wild behavior.
      confidence: medium
      confidenceRationale: The paper directly reports the comparison and outcomes for its captive colony, but father responsiveness was not randomly assigned and the sample does not represent wild populations or the full species.
      referenceLinks:
        - referenceId: ziegler-sosa-colman-2017-common-marmoset-fathering
          relation: supports
          figure: Figure 1; Table 1
          quoteLocator: Methods, Subjects and Experiment 1; Results, Experiment 1; Figure 1 caption
    - subjectId: taxon:callithrix_jacchus
      claimKind: scientific
      claimType: taxonomy
      statement: COL26.8 dataset 316115 records accepted species usage 697NS as Callithrix jacchus (Linnaeus, 1758), within the Callithrix classification path. This statement records checklist identity only.
      confidence: medium
      confidenceRationale: The pinned COL26.8 source explicitly records accepted usage 697NS and its classification path. The claim reproduces checklist identity and does not use it as an evolutionary hypothesis.
      referenceLinks:
        - referenceId: col-2026-checklistbank-316115
          relation: supports
          pages: Accepted species usage 697NS; classification path only
    - subjectId: taxon:callithrix_jacchus
      claimKind: scientific
      claimType: biogeography
      statement: A presence-only occurrence synthesis for Brazil described northeastern coastal and inland records of Callithrix jacchus as native and records from São Paulo, Paraná, Rio de Janeiro and Minas Gerais as introduction areas. This bounded compilation does not establish exhaustive range limits or absence elsewhere; modeled suitability is separate from observed presence.
      confidence: medium
      confidenceRationale: The article describes a bounded presence-only occurrence compilation and keeps modeled suitability separate from records. Native and introduction labels follow the authors and do not define complete range limits.
      referenceLinks:
        - referenceId: benavides-2022-common-marmoset-rabies-brazil
          relation: supports
          quoteLocator: Results, ‘Occurrence of C. jacchus’; Fig. 4 and its caption; Abstract for the distinction between observed occurrence and model-predicted suitable habitat.
    - subjectId: taxon:callithrix_jacchus
      claimKind: scientific
      claimType: ecology
      statement: Brazilian Ministry of Health passive surveillance reported 67 rabies outbreaks affecting Callithrix jacchus (91 cases) in 41 municipalities from January 2008 through October 2020. These are reported surveillance counts, not a census of infection prevalence, abundance or population trend across the species range.
      confidence: high
      confidenceRationale: The authors report official passive-surveillance totals and municipality counts. These values describe reported outbreaks through October 2020, not infection prevalence, abundance or a range-wide population trend.
      referenceLinks:
        - referenceId: benavides-2022-common-marmoset-rabies-brazil
          relation: supports
          quoteLocator: Abstract; Results, rabies surveillance and outbreak expansion; Fig. 3 and accompanying text.
    - subjectId: taxon:callithrix_jacchus
      claimKind: scientific
      claimType: divergence-time
      statement: A Callithrix mitogenomic study combining 49 newly sequenced marmoset mitogenomes with published sequences estimated that Callithrix jacchus and the Callithrix penicillata Caatinga clade were the most recently diverged sampled sister lineages, at about 0.51 Ma. This is a mitochondrial-lineage estimate under the study sampling and model, not a nuclear species-tree date or definitive species-origin date.
      confidence: medium
      confidenceRationale: The paper estimates divergence between sampled mitochondrial lineages under a stated sampling design and model. This cannot establish a nuclear species-tree date or a definitive species-origin date.
      referenceLinks:
        - referenceId: malukiewicz-2021-callithrix-mitogenomic-phylogeny
          relation: supports
          quoteLocator: Abstract; Results, ‘Phylogenetic trees and divergence times of Callithrix mitochondrial clades’; Fig. 2 and Table 2.
  claim-rationales.zh:
    - 论文直接报告了圈养群体内的组间比较和结局；但父亲的回应类型并非随机分配，样本也不代表野外种群或整个物种。
    - 固定版 COL26.8 明确记录了接受用名 697NS 及其分类路径。本主张仅复述清单身份，不把分类路径解释为演化假说。
    - 论文给出有界的仅含出现记录汇编，并将模型适宜性与实际记录分开。原生区和引入区标签沿用作者表述，不等同于完整分布边界。
    - 论文报告官方被动监测的疫情总数和市镇数量。本主张仅描述截至 2020 年 10 月的报告记录，不推断全分布区流行率、数量或种群趋势。
    - 论文按其取样设计与模型估计受采样线粒体谱系的分化时间。这不能确立核基因组物种树日期或确定的物种起源时间。
  claim-statements.zh:
    - 在威斯康星一处圈养群体的研究中，被归类为会回应幼崽求救叫声的 24 位普通狨父亲，其 62 只幼崽中一个月后存活率更高（p = 0.002），第 28 和 30 周的平均体重也更高；这是一项研究层面的关联，不能证明物种整体因果效应或野外行为。
    - COL26.8 数据集 316115 将用名 697NS 记录为 Callithrix jacchus（Linnaeus, 1758）接受种，并置于 Callithrix 分类路径中。此陈述仅记录清单身份。
    - 巴西一项仅含出现记录的汇编将东北部沿海与内陆的 Callithrix jacchus 记录描述为原生区域，将圣保罗、巴拉那、里约热内卢和米纳斯吉拉斯的记录描述为引入区域。该有限记录集不能确立完整分布边界或证明其他地区不存在；模型适宜性与实际出现记录分开处理。
    - 巴西卫生部被动监测在 2008 年 1 月至 2020 年 10 月间报告 41 个市镇发生影响 Callithrix jacchus 的 67 起狂犬病疫情（91 例）。这些是报告的监测数量，不是对全物种分布区感染率、数量或种群趋势的普查。
    - 一项柽柳猴属线粒体基因组研究结合 49 个新测狨猴线粒体基因组与已发表序列，估计 Callithrix jacchus 与 Callithrix penicillata 的卡廷加支系是该研究样本中最近分化的一对姐妹谱系，时间约为 0.51 Ma。这是受该研究样本与模型限制的线粒体谱系估计，不是核基因组物种树定年或确定的物种起源日期。
