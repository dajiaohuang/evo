    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants 70-100 mm high. Corm globose, 15-20 mm diam.; tunics forming dense, fibrous mass, dark grey-brown, usually accumulating in a collar around base. Stem simple or 1- or 2-branched, bearing sheathing leaves 15-20 mm long, sometimes overlapping. Foliage leaves 2, middle green, basal, ± linear, channelled, loosely twisted, ± trailing distally, 50-80 mm long, ± 3 mm wide opened flat, margins hyaline when dry, margins undulate, rarely partly crisped. Rhipidial spathes with broad, dry, transparent margins, inner 25-30 mm long, outer ± 2/3 as long. Flowers fugaceous, mostly white, sometimes pale blue, outer tepal limbs with large pale yellow nectar guides edged distally with purple marks at bases, odourless or faintly scented of vanilla; outer tepals 25-30 mm long, limbs ± 22 x 10 mm, claws ascending, ± 12 mm long, inner ± 28 x 6 mm. Filaments ± 8 mm long, united below in smooth, cylindric column ± 3 mm long; anthers ± 6 mm long, pale mauve; pollen white. Ovary narrowly ellipsoid, ± 6 mm long, included; style ± 4 mm long, branches diverging, ± 10 mm long, crests broadly wedge-shaped, 10-12 x 3.5 mm. Capsules and seeds unknown.
            textZh: Moraea geminifolia Goldblatt & J.C.Manning 的 SANBI 物种条目记载了植株、叶片和花部形态。
            sourceIds:
              - sanbi_18638_0
            locator: Strelitzia 42; archive Morphology row 97808, source 18638.0
            placeTimeScope: Regional species account published 2020; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
          - text: Immediately recognised by the two foliage leaves inserted below ground, more-or-less equal in size and with undulate margins, Moraea geminifolia is otherwise unremarkable in the M. saxicola complex. The white or pale blue-mauve flowers broadly resemble those of M. saxicola, although smaller in all features, with outer tepals 25-30 mm long and claws half to 2/3 as long as the limbs. The filaments are ± 8 mm long and anthers ± 6 mm long. In M. saxicola the outer tepals are 34-45 mm long with claws about as long as the limbs, the filaments are 12-14 mm long, and anthers 6-9 mm long. Moraea geminifolia and M. saxicola are ecologically separated, growing adjacent to one anther just a few metres apart but on different soils.
            textZh: SANBI 条目提供了 Moraea geminifolia Goldblatt & J.C.Manning 的鉴别特征。
