        usage:
          title: Columnea tenuis Klotzsch ex Oerst., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Suffrutescent herbs or small shrubs, terrestrial and epiphytic; stems 1.5-3 mm in diam., strigose when young. Leaves of a pair equal, ovate lanceolate, 1.5-3.3 cm long and 4-10 mm wide, the apex long acuminate, more or less oblique or rounded at the base, entire, succulent, above green, glabrous, paler green or reddish beneath, strigose, the hairs transparent, or brownish on the veins only, 4-7 celled, the veins more or less red, also 2-3 celled white adpressed hairs; petioles absent or to 2 mm long. Flowers solitary; bracts linear, 2-7 mm long; pedicels 6-12 mm long, reddish strigose; calyx lobes ovate lanceolate, 1.1-1.7 cm long, long acuminate, entire to 3 toothed, teeth to 1 mm long, green with red streaks or red, strigose; corolla scarlet or orange with or without yellow areas at the base of the tube or from sinuses of anterior lip, funnelform but strongly zygomorphic, 6.0-7.1 cm long, ca. 4 mm in diam. above base, becoming ca. 11 mm in diam. at the throat, the outside red pilose, the lobed portion of the corolla 3.2-3.7 cm long, the lobes strongly unequal, the posterior pair connate, truncate at the apex, 2.0-2.4 cm long, the anterior lobe 1.6-1.9 cm long, reflexed; filaments reddish, glabrous, the anthers exserted; ovary sericeous, the style reddish, pilose glandular, the stigma bibbed. Fruit globose, 1.0 cm in diam., 1.4 cm long, white.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 6232
