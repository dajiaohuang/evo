          - text: A slender, rather delicate plant, Hesperantha debilis is recognised by the small corms 4-5 mm diam., soft-textured, linear leaves 1-2 mm wide, and a slender, branched stem bearing one or two flowers per branch. The white flowers have a short, straight perianth tube 4-5 mm long, and spreading tepals 12-14 mm long, thus more than twice as long as the tube.
