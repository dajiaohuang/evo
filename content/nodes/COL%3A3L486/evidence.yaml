      morphology:
        status: partially-supported
        claims:
          - text: Plants 100-150 mm high. Corm ovoid, 4-5 mm diam.; tunics woody, concentric. Stem smooth, slender, usually branched at uppermost node, sometimes at next node below. Leaves 4, lower 2 basal, linear, third partly sheathing, free in upper half, uppermost largely sheathing, 15-20 mm long, inserted in upper 1/3 of stem, blades 1-2 mm wide, margins and midrib lightly thickened. Spike 1- or 2-flowered; bracts 8-11 mm long, green or flushed purplish, margins and apices membranous. Flowers ?crepuscular, rotate, white, outer tepals flushed red outside, scent unknown; perianth tube cylindric, expanded near apex, 4-6 mm long; tepals subequal, elliptic, spreading, 12-14 x ± 5 mm. Filaments 2.5-3.0 mm long; anthers ± 5 mm long, ?yellow; pollen ?yellow. Style branches ± 10 mm long, spreading, exceeding anthers by up to 2 mm in closed flower. Capsules globose, ± 3 mm long. Seeds unknown.
