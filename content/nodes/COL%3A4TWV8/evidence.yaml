    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Robust, erect perennial, hydrophyte and rhizomatous (rhizome creeping and branched, culms usually spongy at base), 500-1500 mm tall. Leaf blades 100-350 mm long, 2-10 mm wide, leaf sheaths papery with prominent cross-veins. Spikelets 1.7-2.5 mm long. Panicle spikelike, 100-300 mm long, 4-7 mm wide, dense; spikelets laterally compressed; lower glume ± half the length of upper glume.
            textZh: Sacciolepis typhura (Stapf) Stapf 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_11118_0
            locator: "SANBI/WFO archive Morphology row 3361; source identifier 11118.0; cited publication: Herman, PPJ; Retief, E. 1997. Plants of the northern provinces of South Africa: Keys and diagnostic characters. Strelitzia 6: 1 - 681. National Botanical Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Sometimes spikelets proliferate - appearing to have many florets - but are composed of disorganised sterile scales. Similar to S. chevalieri, which has harder culms and narrower, 1-2 mm wide, leaves, but the variation is continuous and intermediates are common. The two species may be habitat forms of the same species.
            textZh: SANBI 条目提供了 Sacciolepis typhura (Stapf) Stapf 的鉴别特征。
