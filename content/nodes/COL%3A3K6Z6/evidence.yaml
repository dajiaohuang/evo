    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Mat-forming dwarf shrub ±100-450 mm high, often 1 m or more across, branches very short, congested, densely leafy, the leaves appearing rosetted from above, flowering stems terminal, erect, up to 200 mm long, greyish-white woolly, leafy throughout. Leaves up to 25(-50) x 8(-10) mm, smaller and more distant below the inflorescences, obovate, lingulate or subspathulate, apex very obtuse, base broad, half-clasping, both surfaces thickly greyish-white woolly, distinctly striped from the 3-5 parallel nerves. Heads heterogamous, hemispherical, 4-5 mm long, 5-8 mm across the radiating bracts, bases woolly, many in a compact terminal corymbose panicle. Involucral bracts in 6-7 series, graded, loosely imbricate, inner slightly exceeding flowers, tips minutely radiating, glossy, bright canary-yellow. Receptacle honeycombed. Flowers 53-133, 12-26 female, 34-112 homogamous. Achenes 0.75 mm, with myxogenic duplex hairs. Pappus bristles many, tips barbellate or subplumose, bases with patent cilia, cohering or not.
            sourceIds:
