          - text: The large, ovoid fruits, 12-15 x 8-10 mm, carried erect on stout, arcuate pedicels up to 5 mm long, distinguish K. littoralis from related species. In the absence of fruits there may sometimes be difficulty in separating it in the herbarium from K. drepanophyll, K. baurii and from depauperate specimens of K. rooperi.
