    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants several-stemmed. Leaves erect (when growing in dense grass) to strongly recurved (when in an exposed place or after grass has been burnt in winter), soft in texture, 150-700 x 10-25 mm, dull to glaucous-green, V-shaped in cross section, usually folded along midrib (especially in dried specimens with recurved leaves); margin and keel smooth or minutely serrulate towards apex. Scape overtopping spreading leaves, 250-650 mm long. Raceme globose to shortly cylindrical, dense, 50-90 x 50-55 mm; buds spreading to pendulous, red to dull red; flowers pendulous, pale yellow-green. Bracts ovate to ovate-oblong, 5-8 mm long, acute to obtuse, white, chartaceous; margin entire. Pedicels 1-2 mm, elongating in fruit up to 5 mm. Perianth subcylindrical, slightly arcuate, 28-34 mm long; lobes broadly ovate, 2 mm long, not spreading. Stamens reaching throat or slightly exserted at anthesis, later exserted by 3-5 mm. Fruit ovoid, erect, 12-15 x 8-10 mm, acute at apex.
            textZh: Kniphofia littoralis Codd 的 SANBI 物种条目记录了形态特征。
