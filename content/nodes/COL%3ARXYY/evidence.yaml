        usage:
          title: Cavendishia chiriquiensis A.C.Sm., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Weakly erect, epiphytic shrub to 3 m tall, the stem base ca. 3 cm in diameter; mature branches terete, smooth to minutely striate, glabrous, tan, grayish red or reddish brown; immature branches and the twigs of the new growth terete to bluntly angled, smooth or striate, glabrous, tan, infrequently with caducous, globular glands on the recent growth. Leaves elliptic, 4.5-8 cm long, 1.5-3.5 cm wide, basally cuneate or sometimes attenuate, apically caudate acuminate, the acumen 1.5-2(-2.5) cm long, averaging 1/4-1/3 of the total leaf length, brownish to grayish green or tan when dry, glabrous or slightly puberulous at the base of the midrib when young, glabrescent; 3-5-plinerved, the midrib, the lateral nerves, and the veinlets impressed to slightly elevated and conspicuous above, all the veins raised beneath but usually only the midrib conspicuous, newly un- folding leaves often densely provided with caducous, globular glands on the upper surface and reddish glandular fimbriate beneath; petioles terete to sub- terete, sometimes flattened adaxially, rugose, 4-8 mm long, 1-1.5 mm in diam- eter, densely white puberulous when young becoming glabrate, tan to reddish brown. Inflorescence viscid, 6-9(-11)-flowered, the rachis complanate, bluntly angled, sometimes flexuous, smooth or minutely striate, glabrous, 1.5-4.5 cm long, ca. 1 mm in diameter at the base, pale green suffused with red when fresh but drying brick red, infrequently with a few scattered globular glands; floral bracts glabrous, slightly ribbed, smooth, rugose or muricate, oblong to oblanceo- late, basally narrowed and truncate, apically acute or rounded, 15-25 mm long, 5-9 mm broad, red, each margin with 11-12, sessile, globular glands to 0.5 mm in diameter, these often caducous; pedicels terete to angled, swollen at both ends, minutely striate, glabrous, 4-7 mm long, 0.5-1 mm in diameter, pale green when fresh but drying brick red, provided with few scattered globular glands and cilia, especially distally; bracteoles linear to linear lanceolate, 1-2(-4) mm long, ca. 0.5 mm broad, with a hastate, callose thickened, apical gland which breaks off easily, a few globular glands at the margin. Flowers with the calyx gla- brous, 3.5-4.5 mm long, pink at anthesis, the tube cylindric, smooth or rugose, 1.5-2(-2.5) mm long, 2-3.5 mm wide, basally slightly expanded, the expansion most noticeable in the early fruit, with numerous, scattered, globular glands not obscuring the surface of the tube, the limb campanulate to erect-spreading, rugose, ribbed, 1.5-2.5 mm long, with a few scattered glands similar to those of the tube, the lobes triangular, obtuse, 0.5-1 mm long, ca. 0.5 mm wide, erect after anthesis, completely or only marginally callose thickened but appearing almost completely callose thickened because of small size of the lobes, the lobes often breaking off with age, the sinuses broadly rounded or flat; corolla 16-24 mm long, 4-4.5 mm in diameter, reddish purple at the very base, purple above, the distal 1/3 short pilose, the lobes triangular, obtuse, ca. 2 mm long; sta- mens 14.5-21 mm long, the filaments densely short pilose or glabrate, alternately 3 mm and 5-7.5 mm long, white, the anthers including tubules alternately 9.5- 16.5 mm and 13-20 mm long, purplish orange, the thecae 3-6.5 mm long; style 17-23 mm long. Berry not seen.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 4134
