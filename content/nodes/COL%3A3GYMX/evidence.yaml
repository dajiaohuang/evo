          originalSourceText: Herbaceous vines; stems glabrous to hirsute. Leaves ovate to elliptic, apically acuminate, basally cordate, glabrous to sparsely pubescent, 5-11 cm long and 2-5 cm wide; petioles sparsely hirsute, 3-6 cm long. Inflorescences contracted racemose, mostly 1-5-flowered; peduncles pilose, 1-3 cm long; pedicels glabrate, mostly 2-4 cm long. Flowers with the calyx divided nearly to the base, the lobes nearly linear to lanceolate, 3-6 mm long and 1.5-2.5 mm wide, glabrous inside and out; corolla rotate, green, 2.5-4 cm in diameter, the lobes lanceolate-ovate,
