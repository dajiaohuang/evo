    facets:
      morphology:
        status: partially-supported
        claims:
          - text: "Cormous geophyte, up to 300 mm high. Leaves with blade linear, scabrid-pubescent, midrib prominent. Flowers: 1-3; stamens erect; filaments 3-6 mm long; anthers 3-9 mm long, yellow to whitish; style branches suberect, shorter than anthers; perianth with segments 14-18 x 3.5 mm, dull salmon-pink, pale yellow-green inside tube; Feb., Mar."
            textZh: Hesperantha pubinervia Hilliard & B.L.Burtt 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_16273_0
            locator: "SANBI/WFO archive Morphology row 71836; source identifier 16273.0; cited publication: Retief, E; Meyer, NL. 2017. Iridaceae. In: E Retief & NL Meyer (eds), Plants of the Free State: Inventory and identification guide, Strelitzia 38: 934 - 956. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Poorly known, Hesperantha pubinervia is readily recognised by the ± linear basal leaves scabrid-hairy on the margins and veins, and the relatively long-tubed flowers of an unusual dull salmon-pink colour. The perianth tube, 20-25 mm long, is unusually slender and completely occluded by the style. The flowers do not produce nectar and are evidently pollinated through deceit, offering no reward to its pollinator, a long-proboscis fly. Hesperantha pubinervia is also somewhat unusual in having relatively short, ascending style branches ± 6 mm long, rather than spreading over the tepals as in most species of the genus. The distinctively coloured flowers contrast markedly with the deep pink to magenta flowers of sympatric and co-blooming H. baurii and H. scopulosa, and with the pale pink flowers of H. brevistyla and H. leucantha.
            textZh: SANBI 条目提供了 Hesperantha pubinervia Hilliard & B.L.Burtt 的鉴别特征。
            sourceIds:
