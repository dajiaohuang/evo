        usage:
          title: Thibaudia costaricensis Hoerold, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Usually epiphytic shrubs; branches elongate to 2 m long; branchlets terete, cinereous, glabrous. Leaves chartaceous or thin coriaceous, oblong or lanceolate oblong, to elliptic, (10-)12-24 cm long, (1.7-)3.5-5(-7.5) cm wide, basally cuneate, apically caudate acuminate, marginally entire and slightly revolute, superficially glabrous or with inconspicuous glandular strigillose trichomes on both the sur- faces, 5-plinerved, the secondary nerves originating near the base, the midvein impressed above and prominently raised beneath, the veinlets reticulate and slightly raised on both the surfaces; petioles glabrous, 2-3(-4) mm long. In- florescences axillary or cauliflorous, numerous, racemose, or paniculate, 15-30- flowered, the rachis slender, 2-5 cm long, laxly and sparsely puberulous or gla- brous; pedicel reddish or pinkish, subterete, glabrous or puberulous, distally slightly swollen, 10-16 mm long; bract minute, deciduous, 1-1.5 mm long; bracteoles 2, submedial, deciduous 0.8-1.2 mm long with a sharply delineated disarticulation groove at the base of the flower. Flowers with the hypanthium rugose, sparsely puberulous or glabrous, pinkish to roseate, ca. 2 mm long, 2.5 mm in diameter, campanulate, the calyx limb 1-2 mm long including the lobes, erect or spreading, the lobes acute, 0.5-1 mm long, sometimes cartilaginous; corolla tube 9-10 mm long, cylindric, white, 3-3.5 mm in diameter, slightly contracted at the base and at the throat, the lobes 1-1.5 mm long; stamens 10, ca. 7 mm long, equal or almost so; filaments brown, membranous, firmly con- nate into a glabrous tube 2-3 mm long; anther sacs smooth to slightly granular, ca. 2 mm long, the tubules wide, flexible, completely free ca. 3 mm long opening introrsely by elongate, oval clefts about 1/2 as long as the tubule; stigma broadly peltate, ca. 1 mm in diameter, the style exserted 1-2 mm at maturity.
          originalLanguage: en
          sourceField: general
