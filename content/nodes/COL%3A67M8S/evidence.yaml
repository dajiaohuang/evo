        usage:
          title: Aphelandra tonduzii Leonard, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Herbs to 10 cm high; stems terete, pilose. Leaves elliptic to 24.5 cm long and 5 cm wide, pilose on both the surfaces, more densely so on the costa and the veins, apically acuminate, basally attenuate, the margins entire; petioles to 5.5 cm long, mostly 2-3 cm long, pilose. Inflorescences of loose axiliary spikes to 15.5 cm long, ca. 0.5 cm wide, the rachis subquadrangular, hirsute with numerous glandular hairs; peduncle subquadrangular, pilose; bracts lanceolate slightly keeled, to 7.5 mm long, 1.5 mm wide, puberulous with occasional glandular hairs, the margins ciliolate, occasionally with a pair of minute, marginal teeth, the bracts not imbricate at anthesis; bracteoles subulate, ca. 4.5 mm long, 0.6 mm wide, puberulous with occasional glandular hairs. Flowers with the calyx seg- ments to 5 mm long, the posterior segment lanceolate, 1 mm wide, other segments subulate, 0.5 mm wide, all striate nerved, puberulous toward the tip; corolla white in bud, becoming purplish with age, bilabiate, the tube to 8 mm long, 1 mm wide at base, 1.5 mm wide at mouth, glabrous outside, puberulous within, the two lobes of the upper lip obovate, 2.5 mm long, 1 mm wide, the apex retuse, the middle lobe of the lower lip rhomboid obovate, 5 mm long, 5 mm wide, the apex retuse, the lateral lobes obovate, 4 mm long, 3 mm wide, apically retuse, minutely puberulous inside; stamens included, the filaments sparingly puberulous, the anthers bearing a tuft of hairs at the apex. Capsules clavate, ca. 8 mm long, 3 mm broad at widest point, glabrous; seeds 4, obovate, flattened, 3 mm long, 2.5 mm wide, 1 mm thick, the surface hispidulous.
          originalLanguage: en
          sourceField: general
