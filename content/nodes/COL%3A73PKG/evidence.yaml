    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous herb, up to 0.75 m high. Filaments 13-15 mm long. Outer tepals 25-30 mm long. Inner tepals tricuspidate, divided into 3 subequal, slender lobes. Reverse of large outer tepals scabrid to pubescent. Flowers white, speckled green to brown on inner tepals and claws and nectar guides of outer tepals.
            textZh: Moraea pubiflora N.E.Br. 的 SANBI 物种条目记载了植株、叶片和花部形态。
            sourceIds:
              - sanbi_11118_0
            locator: Strelitzia 6; archive Morphology row 2795, source 11118.0
            placeTimeScope: Regional species account published 1997; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
          - text: Up to 600 mm tall, Moraea pubiflora is a fairly robust species of sect. Vieusseuxia and most easily distinguished by inner tepals divided into 3 subequal slender, spreading, brown-speckled lobes, the outer two expanded at the tips and obtuse, and the inner slender with a ± acute apex and curving upward distally. The outer tepal limbs are typically white but the claws, inner tepals and style branches and crests are densely dotted with dark brown on a pale yellow to greenish background. A particularly unusual feature of the species is the scabrid to velvety surface of the outside of the outer tepals. Similar in flower structure, although smooth or papillate on the outside of the outer tepals, M. brevistyla has similarly coloured but much smaller flowers, the outer tepals 18-20 mm long and the filaments just 5-7 mm long compared with outer tepals 25-30 mm long and filaments 13-15 mm long in M. pubiflora.
            textZh: SANBI 条目提供了 Moraea pubiflora N.E.Br. 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: Strelitzia 42; archive Diagnostic row 94258, source 18638.0
