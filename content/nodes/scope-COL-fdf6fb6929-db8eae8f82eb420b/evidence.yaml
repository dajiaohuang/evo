    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Across 12 macaque species (711 museum specimens), Grunstra et al. reported a weak interspecific latitudinal gradient in overall craniodental size and listed M. radiata among the near-equatorial examples tending smaller (Discussion §4, opening paragraph). Table 1 lists 79 M. radiata specimens (46 male, 33 female) from South and West India. The sample includes subadults and was preferably wild-caught or wild-shot, but occasionally included captive or unprovenanced specimens (§2.1; Table 1). This is a cross-species comparison and does not establish within-species geographic variation, diagnostic characters, current body size, or an exclusively wild sample.
            textZh: 在涵盖12种猕猴、711件博物馆标本的比较中，Grunstra 等报告总体颅齿大小存在较弱的种间纬度梯度，并将 M. radiata 列为近赤道一侧倾向较小的示例（讨论§4首段）。表1列出79件印度猕猴标本（雄46、雌33），来源标注为印度南部和西部。样本包含亚成体，研究优先使用野外捕获或猎获标本，但也偶尔纳入圈养或来源地不明的标本（§2.1；表1）。这是一项种间比较，不能据此推断该种内部的地理变异、诊断特征、当前体型，也不能说样本全部来自野外。
            sourceIds:
              - grunstra2018
            locator: Methods §2.1; Table 1, Macaca radiata row; Discussion §4, opening paragraph.
            placeTimeScope: Museum specimens labelled South and West India in Table 1; specimen collection years are not reported. The result is from an interspecific analysis published in 2018, not a current field survey.
            lifeStatus: Museum material was preferably wild-caught or wild-shot, but the authors occasionally included captive or unprovenanced specimens; the claim does not describe a purely wild sample or a current population.
            originalLanguage: en
        gaps:
          - This single cross-species museum comparison does not establish within-species morphological variation, geographic or sex-linked variation, diagnostic characters, developmental patterns, or species-wide specimen coverage; a systematic morphology literature search remains incomplete.
      lifeHistory:
        status: not-assessed
        gaps:
          - Reproduction, growth, survival and longevity evidence remain unassessed.
      ecology:
        status: partially-supported
        claims:
          - text: Along the surveyed roadsides connecting Mysore, India, reported total counts fell from 889 bonnet macaques in 2003 to 407 in 2015 (46% of the earlier count). The January–February 2015 resurvey covered 464 km, and roadside strips were defined within 15 m from the road centre on each side. These local roadside counts are not a species-wide abundance estimate or a causal test.
            sourceIds:
              - erinjery2017
            locator: Methods §2.6 Roadside survey; Results §3.5.1 Population dynamics.
            placeTimeScope: Roadside populations along major roads connecting Mysore, southern India; counts compared for 2003 and 2015. The 2015 resurvey took place in January–February and covered 464 km.
            lifeStatus: Free-ranging roadside groups in the species' native range; the sample is local and habitat-specific, not range-wide.
            originalLanguage: en
          - text: In the Parambikulam landscape of Kerala, the study detected 54 bonnet macaque groups in 33 of 64 sampled grid cells. A single-season occupancy model estimated mean cell occupancy at 0.51 ± 0.08 (SE) and detection probability at 0.25 ± 0.05 (SE). These are modelled results for one forest survey, not species-wide forest occupancy or abundance.
            sourceIds:
              - erinjery2017
            locator: Methods §§2.3–2.4; Results §3.2 Occupancy modelling of bonnet macaques in forest areas.
            placeTimeScope: Parambikulam landscape, Kerala, India; 64 sampled grid cells in the study's single-season forest occupancy survey.
            lifeStatus: Free-ranging groups in one forest survey; site occupancy and detectability are modelled locally and are not a range-wide estimate.
            originalLanguage: en
          - text: In its temple/tourist-site comparison and historical site records, the 2017 study reported bonnet macaques at about 31% of assessed locations, reappearance after translocation in about 20% of cases, and elimination or disappearance at more than 48%. The comparison draws on surveys and site histories from southern India; it is not current range-wide occupancy or abundance.
            sourceIds:
              - erinjery2017
            locator: Methods §2.5 Survey of temple sites/tourist spots; Results §3.4.
            placeTimeScope: Temple/tourist locations in southern India; prior Karnataka comparison from 2001–2004 and resurvey period November 2009–September 2015, as described by the paper.
            lifeStatus: Free-ranging groups at human-use sites; the finding is a historical site-status summary rather than a contemporary range-wide survey.
            originalLanguage: en
        gaps:
          - Evidence remains limited to one 2017 study and local survey frames; broader habitat, seasonal and population variation, range-wide ecology and causal mechanisms remain unassessed.
      evolution:
        status: partially-supported
        claims:
          - text: In a 2018 phylogeographic analysis of 82 fecal-derived Macaca radiata mitochondrial D-loop sequences sampled across 16 southern Indian locations, sampled wet-zone and dry-zone individuals did not form separate mtDNA clades, haplotypes showed no geographic clustering, and isolation by distance was weak and not significant (r = 0.298, p = 0.09). This single mitochondrial-marker result does not represent nuclear or genome-wide variation; the authors' proposed human-mediated translocation explanation is a hypothesis, not a demonstrated cause.
            textZh: 在一项 2018 年的系统地理研究中，研究者分析了来自印度南部 16 个地点的 82 份冠猕猴粪便样本衍生线粒体 D-loop 序列；样本中的湿区和旱区个体没有形成分开的 mtDNA 支系，单倍型未见地理聚集，隔离随距离关系较弱且不显著（r = 0.298，p = 0.09）。这项单一线粒体标记研究不能代表核基因组或全基因组变异；作者提出的人为转移解释仍是假说，研究并未证明其因果。
            sourceIds:
              - dixit2018
            locator: Materials and methods—Samples and Host molecular data using fecal samples; Results—Phylogenetic analysis of host and Host haplotype network and IBD model; Discussion—Phylogeography of M. radiata. Publisher HTML lines 187–188, 233–239, 327–333, 357–361.
            placeTimeScope: Eighty-two host mtDNA D-loop sequences from 16 sampled southern Indian locations; fecal collection took place in 2014–15, and the article was published in 2018. This sample does not establish full range limits or current population structure across every population.
            lifeStatus: The paper describes its fecal samples as evidence from wild primate populations. Separate captive blood/tissue samples discussed elsewhere in the article are excluded from this claim.
            originalLanguage: en
        gaps:
          - Evolutionary evidence remains limited to one mitochondrial D-loop study of 82 fecal-derived sequences from 16 locations. Nuclear/genome-wide population structure, broader geographic and temporal sampling, other evolutionary processes, and a systematic literature search remain unassessed.
      distribution:
        status: not-assessed
        gaps:
          - A local set of roadside survey routes is not a current or historical species-range inventory.
      fossil:
        status: not-assessed
        gaps:
          - No fossil search or occurrence assessment was completed for this record.
      conservation:
        status: partially-supported
        claims:
          - text: For the surveyed southern Indian landscapes, the authors proposed selected vegetated hillocks and temple/tourist locations as possible conservation reserves, based partly on local roadside persistence at Chamundi Hill and declines on other monitored roads. This is a 2017 study recommendation, not a statutory designation, current threat category or range-wide recovery plan.
            sourceIds:
              - erinjery2017
            locator: Results §3.5.1; Discussion, conservation recommendation for hillocks and selected temple/tourist locations.
            placeTimeScope: Mysore-connected roadsides and selected southern Indian human-use sites discussed in the 2017 article; recommendation is based on local monitoring, with Chamundi Hill persistence reported over about 25 years.
            lifeStatus: Free-ranging populations in human-modified southern Indian settings; no formal taxon-wide status assessment is implied.
            originalLanguage: en
        gaps:
          - Current formal conservation category, contemporary range-wide population trend and independently reviewed recovery actions remain unassessed.
