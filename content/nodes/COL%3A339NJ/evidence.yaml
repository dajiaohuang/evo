    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Perennial, stoloniferous (stolons stout and woody, plants otherwise fairly soft), up to 0.6 m high. Leaf blades 50-160 mm long, 2-6 mm wide. Spikelets 2-3 mm long. Spikes usually slender, flexuous and spreading; lemma very densely, silky pubescent, keel not winged.
            textZh: Cynodon nlemfuensis Vanderyst 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_11118_0
            locator: "SANBI/WFO archive Morphology row 1531; source identifier 11118.0; cited publication: Herman, PPJ; Retief, E. 1997. Plants of the northern provinces of South Africa: Keys and diagnostic characters. Strelitzia 6: 1 - 681. National Botanical Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Very similar to C. dactylon, which has rhizomes, and C. aethiopicus, which is larger, more robust and has lemma keel glabrous or with a few scattered hairs. Some specimens have previously been wrongly identified as C. plectostachyus (K.Schum.) Pilg., originally from Kenya and Tanzania but now widely distributed in central Africa, that has tiny glumes scarcely more than 1/5 as long as the spikelet.
            textZh: SANBI 条目提供了 Cynodon nlemfuensis Vanderyst 的鉴别特征。
