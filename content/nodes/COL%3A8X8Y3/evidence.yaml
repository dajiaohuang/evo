        claims:
          - text: Acaulescent succulent, forming clumps to 25 cm diam. Leaves erect to 10 cm, blue-green with white tubercles. Flowers white with pinkish tips.
            textZh: Tulista minor (Aiton) Gideon F.Sm. & Molteno 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13856_0
            locator: "SANBI/WFO archive Morphology row 9091; source identifier 13856.0; cited publication: Bayer, B. 2012. Asphodelaceae: Haworthia Duval. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 75 - 77. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: A bright and attractive Haworthia of the sect. Margaritiferae, and nearest to Haworthia rugosa (Salm) Baker. Distinct by the prominent white, shining tubercles arranged in more or less regular lengthwise rows on the narrow, tapering leaves.
            textZh: SANBI 条目提供了 Tulista minor (Aiton) Gideon F.Sm. & Molteno 的鉴别特征。
            sourceIds:
              - sanbi_15960_0
            locator: "SANBI/WFO archive Diagnostic row 64168; source identifier 15960.0; cited publication: Brown, JR. 1946. Notes on Haworthias. Desert Pl. Life 8: 117 - 119. [All rights reserved]"
