          - text: H. minima is a distinctive species with its blue-green leaves covered with large pure white tubercles. It is readily separated from H. pumila. H. minima is closely related to H. pumila, but it appears to be satisfactorily separated at specific level, by its consistently smaller stature, soft leaves and smaller tubercles.
