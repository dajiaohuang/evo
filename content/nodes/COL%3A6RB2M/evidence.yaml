        claims:
          - text: "Perennial; 0.8 m high; tufted. Leaf blades up to 360 x 1.5 mm; rigid; erect; do not break off. Flowers: panicle contracted; shortly branched; up to 180 mm long; spikelets up to 20 mm long; including awns; 3-5-flowered; glumes 11-18 mm long; 1-nerved; lemmas 10-16 mm long; including 5-7 mm long lobes free from central awn; lemma backs glabrous with only margins fringed with short hairs from base to middle; fringe terminating in marginal tuft of white hairs; central awn 13-18 mm long; geniculate close to base; twisted basally; apical portion much longer than base and protruding from spikelets for some length."
