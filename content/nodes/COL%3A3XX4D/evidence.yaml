      morphology:
        status: partially-supported
        claims:
          - text: Annual or ?short-lived perennial, ± 65-280 mm tall. Leaves basal, oblanceolate to broadly elliptic, tapering below, entire or serrulate, glandular-puberulous. Flowers in capitate racemes, almost regular, corolla tube 6.8-7 mm long, lobes oblong-elliptic, blunt at apex, entire, white with yellow to orange around mouth and inside upper half of tube.
            sourceIds:
