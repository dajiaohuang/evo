            locator: "SANBI/WFO archive Morphology row 35511; source 14769.0; publication: Snijman, DA. 2013. Scrophulariaceae: Manulea. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 465 - 467. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: The shape of the corolla tube, the almost regular limb, the great disparity in size of the anthers and the deep inclusion of the posticous pair, as well as the very short style and stigma, all indicate close relationship with M. altissima, especially with subsp. glabricaulis, but M. androsacea is at once distinguished by the round (not laterally compressed) corolla mouth and longitudinal band of clavate hairs in the throat. In herbaria, it is often misidentified as M. corymbosa [= M. benthamiana] and M. bellidifolia, both of which are easily distinguished by the very long and often shortly exserted stigma.
