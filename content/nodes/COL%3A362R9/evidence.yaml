    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Perennial herb, 0.7-1.0 m high; stem erect. Leaves pale green, linear, distichous; central vein usually double. Spathe herbaceous, apex obtuse or emarginate, margins free to base. Bracts folded, amplexicaul, margins scarious. Inflorescence ± as long as leaves; perianth saucer-shaped, yellow; outer segments broadly obovate, sometimes with dark brown nectar guides or with dotted tepal claws; outer tepals speckled orange, bearded. Stamens inserted, appressed against petaloid style crest; filaments 6 mm long; anthers 4-8 mm long. Ovary ± 10 mm long; style 2 mm long. Flowering time Aug.-May. Capsule up to 25 mm long, globose-truncate, dehiscent only in upper half.
            textZh: Dietes bicolor (Steud.) Sweet ex Klatt 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_18505_0
            locator: "SANBI/WFO archive Morphology row 90732; source identifier 18505.0; cited publication: Bredenkamp, CL; Magwaza, ZL. 2019. Iridaceae. In: CL Bredenkamp (ed.), A Flora of the Eastern Cape Province, Strelitzia 41(3): 1821 - 1882. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Taxonomically isolated, Dietes bicolor is distinguished by the dichotomously branched flowering stem and pale yellow to white flowers, the outer tepal limbs usually bearing dark brown nectar guides at the bases. The tepal limbs are rounded, with the inner tepals overlapping the outer. Dietes bicolor is the only polyploid species of the genus and is more closely related to the Lord Howe Island species, D. robinsoniana, than to any of the other African species. Both share a similar dichotomous branching pattern.
            textZh: SANBI 条目提供了 Dietes bicolor (Steud.) Sweet ex Klatt 的鉴别特征。
