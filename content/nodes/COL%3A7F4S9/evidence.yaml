        usage:
          title: Utricularia jamesoniana Oliv., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Perennial epiphytic herbs; trap-bearing filiform stolons radiating from the base of the inflorescence, several swollen near the point of origin into fusiform tubers to 6 mm long and 2-3 mm thick. Photosynthetic organs leaflike, 2-3 from the inflorescence base, obovate-spatulate to elliptic, 1-2 cm (total length); lamina 2-4 mm wide, multinerved, membranous;. pseudopetiole shorter than the lamina. Traps globose, stalked, ca. 0.7 mm long, the mouth basal, the upper lip with 2 subulate recurved appendages. Inflorescences 2-10 cm long, 1-3-flowered; bracts narrowly elliptic, 4-7 mm long, the bracteoles similar or narrower, the sterile scales on the peduncle usually only one, subulate, smaller than the bracts; pedicels erect, 5-10 mm long. Flowers with the calyx lobes subequal, broadly ovate, basally truncate or subcordate, the apex rounded, 4-12 mm long; corolla 10-20 mm long, white, more or less tinged with violet, lavender, or lilac and sometimes marked with yellow on the palate, the outer surface, especially the margins of the lobes and apical half of the spur, densely stipitate-glandular, the upper lip ? orbicular, + 4-crenate, slightly longer and wider than the upper calyx lobe, the apex rounded or emarginate, the lower lip a little longer, + deeply 3-lobed, the palate scarcely prominent, the spur 2-4 times as long as the lower lip, narrowly conical in its basal half, subulate and curved or abruptly bent upwards in its apical half. Capsules ovoid, ca. 4 mm long; seeds numerous, narrowly cylindrical, ca. 0.3 mm long.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 6877
