    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Acaulescent, cormous geophyte to 6 cm, unbranched. Leaves ovate, held at right angles to sheaths, nearly plane, smooth, margins crisped. Flowers 2-6 in a short, decumbent spike, bilabiate, creamy green flushed with mauve, with cream-coloured nectar guides, perianth tube 22-25 mm long, dorsal tepal ± 30 mm long, inner bract forked apically, ovary smooth.
            textZh: Babiana cinnamomea J.C.Manning & Goldblatt 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 6727; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: A dwarf species, Babiana cinnamomea has distinctive, broadly ovate leaves with undulate and crisped margins unique in the genus, and the floral bracts are unusual in being largely dry, thinly papery in texture, and pale straw in colour with minute light brown flecks over the surface. Even in full bloom B. cinnamomea is inconspicuous, for the pale bluish green to pale yellow flowers are borne close to the ground and are easily overlooked. The flowers have a particularly strong, sweet, spicy scent, reminiscent of cinnamon and clove, produced during the day and at night, a feature more noticeable than the drab flower colour and suggesting moth pollination. Like many other species of Babiana with highly modified leaves, the juvenile foliage is very different. Seedlings and plants with immature corms have slender, linear leaves that bear a few long soft hairs.
            textZh: SANBI 条目提供了 Babiana cinnamomea J.C.Manning & Goldblatt 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 94912; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
