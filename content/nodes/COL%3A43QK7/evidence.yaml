        usage:
          title: Mitracarpus hirtus (L.) DC., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Herbs to 0.5 m tall, the stems simple or branched basally, angular, glabrescent to villose, the hairs white, weak. Leaves lanceolate or oblong, 5(-6) cm long, to 1.5 cm wide, deltoid to acute at the apex, attenuate acute at the base, the costa prominulous above, subprominent beneath, the lateral veins 3-4, often evanes- cent, arcuate, strongly ascending, chartaceous, usually concolorous, glabrous to pubescent above, the hairs short, stiff, scabridulous; petioles short or absent; stipules connate, adnate to petiole, each part crescentic or hemispherical, to 4 mm long, the terminal margin with 8-10 subulate setas as long as or slightly longer than the sheath. Inflorescences terminal and axillary, the flowers in sub- rotund heads, to 0.7 cm in diam., burrlike because of the persistent, stiff calycine lobes and bracteoles; bracteoles numerous, subulate or linear triangular, erect, shorter than the capsule. Flowers very small; hypanthium short, the calycine lobes 4, unequal, lanceolate or subulate, to 1.5 mm long, pellucid, thickly and scarious marginate, the margin with well spaced, subulate hairs, with several oblong glands aggregated below the middle; corolla white, the tube cylindrical, often turgid, ca. 1.8 mm long, the lobes 4, ca. 0.6 mm long, pubescent marginally; stamens 4, the anthers oblong rotund, ca. 0.45 mm long, glandular apiculate, sessile or attached near the mouth; stigmas 2, minute, often exserted. Fruit a circumscissile capsule, ca. 1 mm long (exclusive of persistent calyx), dehiscing uniformly to expose the seeds, the cap hairy, the seeds quadrangular, brown, pitted.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 11861
