          - text: This species is very closely allied to M. angolensis DC. and could perhaps have been treated as a geographical subspecies of M. angolensis. However, before effecting such a reduction, it would be desirable to examine a wide range of material of M. angolensis from Angola. M. schinzii differs from M. angolensis in the leaves which are yellowish green, coriaceous and usually puberulous instead of green, softly chartaceous and glabrous, and in the receptacle which is infundibular or cylindric instead of consistently cylindric and is shorter and generally puberulous. The distinguishing features of M. schinzii are consistent with the arid habitat it occupies. Both species have the same distinctive rather long-coronate, unequally laciniate disc, a type not found in other species of Maerua in southern Africa.
