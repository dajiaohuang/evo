    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, 8-15 cm, tunics woody, imbricate, stem velvety. Leaves narrowly sword-shaped, margins and midribs thickened. Flowers small, cream-coloured, bright red on reverse, tepals spreading.
            textZh: Geissorhiza erubescens Goldblatt 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 6773; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: A small-flowered species of sect. Ciliatae, Geissorhiza erubescens is recognised by the unusual collar of fibres around the stem base (at least in older individuals), strongly winged leaf margins, and relatively small flowers with tepals 8-12 mm long and equal stamens. The flowers are creamy white with the outer tepals bright red on the outside and the stem is ciliate-pubescent, less so in the upper half. It may be most closely allied to the smooth-stemmed southwestern Cape G. inflexa, or larger-flowered G. leipoldtii or G. nutans, the latter with unequal stamens and somewhat larger white flowers with tepals 14-16 mm long without the deep red markings on the reverse of the outer tepals characteristic of G. erubescens.
            textZh: SANBI 条目提供了 Geissorhiza erubescens Goldblatt 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 94743; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
