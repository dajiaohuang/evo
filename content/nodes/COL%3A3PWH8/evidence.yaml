    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Large, glabrous, perennial liana. Roots tuberous. Stems twining, rarely prostrate, hollow, becoming woody. Leaves ovate-cordate to orbicular in outline, 60-200 x 60-150 mm, base cordate or truncate, entire to shallowly lobed or palmately dissected beyond the middle; lobes 3-9, lanceolate to ovate, entire, apex acuminate to obtuse; petiole smooth or muriculate, 30-110 mm long. Peduncles terete to angular, cymosely branched near apex, few- to many-flowered, 25-200 mm long; pedicels 9-25 mm long. Sepals equal or outer ones shorter, all suborbicular or outer ones narrower, obtuse, markedly convex, coriaceous, 6-12 mm long. Corolla funnel-shaped with spreading limb, 50-60 mm long, 60-70 mm wide, tube narrow below and then widening, reddish purple or mauve with darker centre. Capsule globose or ovoid, 12-14 mm long. Seeds black, 5-7 mm long, with ±7 mm long whitish silky hairs.
            sourceIds:
              - sanbi_5962_0
            locator: "SANBI/WFO archive Morphology row 49748; source 5962.0; publication: Meeuse, ADJ; Welman, WG. 2000. Convolvulaceae, Fl. S. Africa 28(1): 1 - 138. National Botanical Institute, Pretoria. [http://www.biodiversitylibrary.org/item/209568#page/1/mode/1up]. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Vines; stems woody below, herbaceous nearer the tips, glabrous. Leaves orbicular in outline, palmately lobed with (3-)5-7(-9) lobes, rarely entire, 5-8 cm long, cordate or truncate basally, the lobes ovate, acuminate apically, gla- brous or with scattered trichomes. Flowers in few- to many-flowered cymose inflorescences; sepals orbicular or elliptic, 6-12 mm long, markedly convex and clasping the corolla, subcoriaceous, glabrous; corollas reddish-purple to rose pink, 4-6 cm long. Fruits capsular, ovoid, 1.2-1.4 cm long, glabrous; seeds black, comose.
            originalLanguage: en
            sourceIds:
              - flora_panama_3pwh8_general_3643
            locator: "Flora of Panama general field; imported row 3643; sourceIds 3C9B7C72-2B5E-45C7-A8EF-D5243CAE8CEF; reference rows 4461; citations: 3C9B7C72-2B5E-45C7-A8EF-D5243CAE8CEF: Ipomoea mauritiana Jacq., Flora of Panama (WFO),Tropicos.org, 2013 Accessed February 2018. (reference row 4461)."
            placeTimeScope: Morphological description in the Flora of Panama source version retrieved 2026-09-08; no population sampling frame or observation date is specified in this text. The source is a historical regional flora record, not a current or global account.
            lifeStatus: The text does not identify the described plant material as wild, cultivated, domesticated, or escaped; no life status is inferred.
