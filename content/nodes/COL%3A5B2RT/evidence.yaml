        usage:
          title: Verbena litoralis Kunth, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Quick-growing erect or suberect perennial herbs, 0.2-2 m high, sometimes large and robust, woody-based, fastigiately few- to many-branched above, glabrous and shiny or sparingly strigillose; stems to 12 mm thick, tetragonal or subtetragonal in cross-section, the internodes deeply sulcate above the insertion of the leaves and faintly many-sulcate between, scabridulous on the angles when young, green, slightly contracted at the nodes. Leaves with the blades lanceolate to oblong or oblanceolate, 3-10 cm long and 1-1.5 cm wide, acute apically, tapering into a short petiole basally or sessile to subsessile, acuminate and somewhat clasping basally, scabridulous throughout or scabrous and somewhat rugose only above, the upper 2/3 more or less sharply and coarsely serrate with commonly 3-5 some- what mucronate teeth per side, sparsely strigillose ,on both surfaces, the venation impressed above and prominent beneath. Inflorescences terminal spikes, several to many, pedunculate, cymose or corymbose-paniculate, slender or filiform, pilo- sulous, at first congested and about 4 mm in diameter, dense or interrupted, later loosely flowered and elongate, in fruit becoming 2-8 cm long, the fruits usually not contiguous; bractlets ovate-lanceolate, marcescent, rigid, acuminate or sub- ulate, 1-3 mm long, usually subequaling or somewhat shorter than the calyx, abruptly upcurved, glabrate. Flowers with the calyx often purple, 2-2.5 mm long, pubescent or finely strigillose, the rim subtruncate, the 5 teeth equal, minute, subulate; corolla ca. 3 mm long, various shades of blue, violet, or purple, puberu- lent, the tube greenish toward the base, variable in length, always somewhat longer than the calyx, the limb inconspicuous, 2.5-3 mm wide, puberulent on the inner surface, the lobes subequal, obtuse, glabrous; anthers greenish-yellow; ovary almost 1 mm long, green, glabrous, the style ca. 1 mm long. Fruits with the nutlets trigonous, dark-stramineous, linear-oblong, 1-1.9 mm long, glabrous, striate, some- what reticulate, the commissural face about as long as the nutlet, muricate- scabrous.
