        status: partially-supported
        claims:
          - text: "Restricted to the north banks of two rivers on the subtropical coast of Transkei: the Mtentu and the Msikaba, from their mouths, which are some 10 km apart, to about 5 km inland. Both localities are characterized by steep, forest-covered cliffs, composed of Natal Group sandstone. Found sporadically from the water's edge to the top of the cliffs."
