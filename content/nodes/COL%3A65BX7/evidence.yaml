        usage:
          title: Aeschynomene rudis Benth., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrubby herb, 1-2 m tall, sparsely hispid. Leaves 4-10 cm long, 30-40 fo- liolate, petiole and rachis hispidulous; leaflets oblong, rounded to truncate; slight- ly asymmetrical basally, 8-10 mm long, 2-3 mm wide, glabrous, the costae cen- tral, entire, micropunctate adaxially; stipules 7-15 mm long, 2-3 mm wide, the upper portion acute, the lower 2-3 mm long, rounded, entire. Inflorescence ra- cemose, few flowered, axillary; peduncles and pedicels hispidulous; bracts sub- ovate, acute, 3-4 mm long, 1.5-2.0 mm wide, ciliate; bracteoles ovate-oblong, acute, 2-3 mm long, ca. 1 mm wide, ciliate. Flowers yellow, (8-)10-15 mm long; calyx 5-8 mm long; the standard ca. 14 mm long, the claw 2 mm long, the blade orbiculate, ca. 12 mm in diameter, retuse; the wings ca. 10 mm long, the claw ca. 1 mm long, the blade ca. 9 mm long, 5-6 mm wide; the keel petals ca. 10 mm long, 3 mm wide; stamens ca. 12 mm long. Fruit 6-10 articulate, the upper edge essentially entire, the lower edge crenate to subentire, the stipe glabrous, 3-6 mm long, the articles 4-6 mm in diameter, moderately hispid, usually muricate or verrucose at the center; seeds ca. 3 mm long, 2 mm wide, black.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 5439
