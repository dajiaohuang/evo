        claims:
          - text: Annual, up to 300 mm tall. Leaves elliptic-lanceolate, slightly toothed. Flowers in lax racemes, calyx lobes ovate, glandular pubescent, corolla up to 26 mm long, upper lip white or pale yellow, lower lip yellow to orange-yellow, palate with 2 orange glabrous bosses, spur ± 12 mm long, projecting downwards or deflected forward, ± straight, acute, exceeding lower lip, glandular pubescent. Capsule broadly ovate, ± 9 x 8 mm, glandular pubescent.
