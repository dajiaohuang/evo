        claims:
          - text: Tuberous geophyte to 35 cm, with thickened roots and small tubers. Leaves linear, cauline leaves longer. Flowers many in a lax raceme, greenish yellow, not resupinate, lateral sepals 11-12 mm long, lip anchor-shaped, appendage absent, rostellum arms horn-like, projecting, 7-8 mm long.
