        usage:
          title: Aeschynomene ciliata Vogel, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Herb 1.0-2.5 m tall; stems hispid with yellow glandular trichomes. Leaves 10-15 cm long, 30-40 foliolate, petiole and rachis hispid; leaflets oblong with rounded to retuse apices, cordate and slightly asymmetrical basally, 10-15(-30) mm long, 3-5(-8) mm wide, glabrous, costae central, serrulate-ciliate, micro- punctate adaxially; stipules appendiculate below the point of attachment, upper portion acute, lower rounded, 1-2 cm long, serrulate-ciliate, caducous. Inflores- cence racemose, axillary, 5-many flowered; peduncles and pedicels hispid; bracts ovate-subcordate, 4-6 mm long, 2-3 mm wide; bracteoles lanceolate-ovate, acute, ciliate, 3-4 mm long, 1-2 mm wide. Flowers yellow, 8-10 mm long; calyx bila- biate, the upper lip trifid, the lower lip bifid, 5-7 mm long; the standard orbiculate, 5-8 mm in diameter, the claw ca. 2 mm long, serrulate-ciliate, emarginate, wings ca. 8 mm long, the claw 3 mm long, the blade ca. 5 mm long, 4 mm wide, ciliate, keel petals entire, the claws ca. 1.5 mm long, the blades 5-8 mm long, ca. 3 mm wide; stamens ca. 8 mm long. Fruit usually 8-10 articulate, stipe 5-10 mm long, hispid, the margins entire, articles ca. 4 mm long, 6 mm wide; seeds 3-4 mm long, ca. 2 mm wide, dark brown.
          originalLanguage: en
          sourceField: general
