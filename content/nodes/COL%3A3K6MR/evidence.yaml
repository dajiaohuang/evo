        claims:
          - text: Stout biennial herb, stem up to ±1 m high, simple below the inflorescence branches, glandular pubescent, sometimes cobwebby as well, leafy throughout. Radical leaves up to 150 x 40 mm, oval-oblong, slightly narrowed to the base, glandular above, woolly or cobwebby below; cauline leaves up to ±90 x 30 mm, diminishing in size upwards, oblong-lanceolate to lanceolate, apex acute to acuminate, base broad, cordate-clasping, shortly decurrent in lower leaves, both surfaces glandular-pubescent. Heads heterogamous, depressed-globose, ±20-25 mm across the radiating involucral bracts, many in a large, spreading leafy corymbose panicle. Involucral bracts in ±10 series, slightly graded, imbricate, much exceeding flowers, acute, glossy, white sometimes tipped crimson or flushed pink, radiating. Receptacle nearly smooth. Flowers ±362-745, 26-110 female, 336-635 homogamous. Achenes 0.75-1 mm long, barrel-shaped, glabrous. Pappus bristles many, equalling corolla, tips subplumose, bases with patent cilia, not cohering.
