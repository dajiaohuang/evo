  claims:
    - subjectId: taxon:ankylosaurus_magniventris
      claimKind: scientific
      claimType: taxonomy
      statement: Ankylosaurus is bounded here by Carpenter’s redescription of referred Upper Cretaceous western North American material; the revised diagnosis does not make every isolated ankylosaurid remain part of the genus or define exact global endpoints.
      confidence: high
      confidenceRationale: "The study directly compares the type and referred specimens and states a revised diagnosis and distribution. High confidence is restricted to accepted material. Ankylosaurus magniventris: For the species-level page, this assessment applies to the named species and its cited diagnosis; it does not imply a broader genus sample."
      referenceLinks:
        - referenceId: carpenter-2004-ankylosaurus-redescription
          relation: supports
          pages: 961–986
          figure: Figures 1–19; Tables 1–3
          quoteLocator: Holotype and referred material; revised diagnosis; stratigraphic and geographic occurrence
    - subjectId: taxon:ankylosaurus_magniventris
      claimType: biogeography
      claimKind: scientific
      statement: This profile is geographically limited to the type and referred Upper Cretaceous Western Interior material from the Hell Creek, Lance and Scollard formations in Montana, Wyoming and Alberta; it does not claim a complete genus range.
      confidence: high
      confidenceRationale: "The redescription lists the sampled material and formations directly; a complete geographic range cannot be inferred from that bounded sample. Ankylosaurus magniventris: For the species-level page, this assessment covers the cited occurrence or localities only and does not estimate a complete range."
      referenceLinks:
        - referenceId: carpenter-2004-ankylosaurus-redescription
          relation: supports
          pages: 961–986
          figure: Figures 1–19; Tables 1–3
          quoteLocator: Holotype and referred material; stratigraphic and geographic occurrence
    - subjectId: taxon:ankylosaurus_magniventris
      claimType: morphology
      claimKind: scientific
      statement: Carpenter's redescription documents a long, low skull with prominent cranial horns, a large cervical half-ring and a large, low tail club in the type and referred Ankylosaurus material; the claim is limited to those specimens.
      confidence: high
      confidenceRationale: "These are specimen-based anatomical observations illustrated and tabulated in the redescription, without extending them to every isolated ankylosaurid remain. Ankylosaurus magniventris: For the species-level page, this assessment covers the characters observed in the cited specimens; unsampled variation remains outside it."
      referenceLinks:
        - referenceId: carpenter-2004-ankylosaurus-redescription
          relation: supports
          pages: 961–986
          figure: Figures 1–19; Tables 1–3
          quoteLocator: Redescription and revised diagnosis; armor and tail-club description
    - subjectId: taxon:ankylosaurus_magniventris
      claimType: ecology
      claimKind: scientific
      statement: Carpenter's anatomical redescription does not directly establish diet, habitat preference, locomotion, body size or ecological guild for Ankylosaurus; those profile fields are explicitly withheld.
      confidence: high
      confidenceRationale: "The primary evidence is a taxonomic and anatomical redescription, not direct observation or testing of the listed ecological attributes. Ankylosaurus magniventris: For the species-level page, this assessment covers only ecological inferences tied to the cited specimens; unmeasured fields remain unassigned."
      referenceLinks:
        - referenceId: carpenter-2004-ankylosaurus-redescription
          relation: supports
          pages: 961–986
          figure: Figures 1–19; Tables 1–3
          quoteLocator: Scope of redescription, revised diagnosis and specimen inventory
  claim-rationales.zh:
    - 研究直接比较模式与归入标本，并给出修订诊断和分布。高置信度仅限被接受材料。 Ankylosaurus magniventris：本种级页面的判断仅适用于所引材料中的该种及其描述，不表示存在更广泛的属级样本。
    - 重描述直接列出了采样材料和地层；完整地理范围不能由该受限样本推断。 Ankylosaurus magniventris：本种级页面的判断仅覆盖所引化石记录或地点，不据此估算完整分布。
    - 这些是论文插图和表格所记录的标本解剖观察，不能外推至每一件孤立的甲龙类遗骸。 Ankylosaurus magniventris：本种级页面的判断仅覆盖所引标本中观察到的性状；未取样的种内变异不在此结论内。
    - 一手证据是分类和解剖重描述，而不是对所列生态属性的直接观察或检验。 Ankylosaurus magniventris：本种级页面的判断仅覆盖与所引标本相关的生态推断；未测量字段继续保持未指定。
  claim-statements.zh:
    - Carpenter 的重新描述在 Ankylosaurus 模式及归入材料中记录了低长的头骨、突出的颅角、大型颈部半环甲和大型低矮尾锤；该陈述仅适用于这些标本。
    - 本档案的地理范围仅限于蒙大拿州、怀俄明州和阿尔伯塔省 Hell Creek、Lance 及 Scollard 组的上白垩统北美西部内陆模式及归入材料，不代表该属完整的分布范围。
    - Carpenter 的解剖学重新描述未直接确定 Ankylosaurus 的食性、生境偏好、运动方式、体型或生态功能类群；本档案明确暂不填写这些字段。
    - 甲龙属在此由 Carpenter 对北美西部上白垩统归入材料的再描述限定；修订诊断不把每件孤立甲龙科遗骸都纳入该属，也不定义精确全球端点。
