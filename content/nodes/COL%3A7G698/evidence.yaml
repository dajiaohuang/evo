          - text: Distinguished from other species with similar dry, clasping bracts and pink, funnel-shaped flowers with included filaments, by the relatively few-flowered spike with non-overlapping bracts 10-16 mm long, and small flowers with tepals 15-18 mm long and anthers 5-6 mm long.
