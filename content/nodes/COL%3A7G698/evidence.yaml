        claims:
          - text: Cormous herb, up to 0.6 m high. Anthers 5-6 mm long. Spike 2-10-flowered. Bracts dry and brown, 10-16 mm long, nonoverlapping. Habit slender. Tepals lanceolate, distinctly apiculate, 15-18 x 6-8 mm. Flowers pink to purple.
