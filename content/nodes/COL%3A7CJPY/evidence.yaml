        usage:
          title: Tovomita stylosa Hemsl., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Glabrous, monoecious, small tree to 8 m tall, apparently lacking milky sap; stems slender. Leaves ovate or elliptical, mostly 10-15 cm long, 3-5 cm wide, membranaceous, apically short acuminate, basally obtuse or acuminate, the costa prominent, narrow, often impressed above, elevated beneath, lateral veins 8-11, arcuate, not anastomosing or forming a continuous submarginal vein, minor ve- nation slightly elevated on both sides, consisting of 1-2 intermediate lateral veins and one or more strongly ascending, somewhat irregular veins pinnate from the major lateral veins, a reticulum of smaller veins also present; petiole slender with narrow wings forming a ventral channel. Inflorescence terminal, a short panicle or fascicle of short cymose panicles, often subtended by a small lead, the peduncle slender, drying strongly angled, to 4 cm long; bracteoles narrow, cucullate, ca. 1 mm long; pedicels 5-10 mm long. Flower buds narrowly cylindrical, to 10 mm long, 3 mm wide, the pistillate buds slightly shorter and broader, often falcate; calyx ca. 8 mm long, connate tips splitting lengthwise to form 2 narrowly oblong, often reflexed sepals, corolla greenish, the petals 4, connate in bud, narrowly oblong, the margins thin, slightly inrolled; stamens numerous (ca. 47), ca. 6-9 mm long, free, the anther lobes ca. 0.5 mm long. Fruit pyriform, stipitate, ca. 25 mm long, 5-8 mm wide, surmounted by the conspicuous slender styles 4-6 mm long, drying sulcate, dark brown with lighter, warty spots, the valves red inside; seeds 4, narrowly ovoid, smooth, tipped with an orange or red aril.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 3365
