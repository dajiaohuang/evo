    facets:
      morphology:
        status: partially-supported
        claims:
          - text: A very small prostrate herb in patches 3-5 cm across. Leaves alternate, crowded at the branch tips but not in dense tufts, obovate-spatulate, 1-2 mm long, obtuse, slightly narrowed to the base, rather thick, concave above, with a narrow white border. Flowers in groups of 3 or more in the axils of the crowded terminal leaves, with no common peduncle. Pedicels 2-5 mm long. Perianth 1-1.5 mm long, the segments incurved, obtuse, smooth on the back. Stamens on a minute disc. Ovary 3-chambered; style short. Seeds dark brown, finely punctulate, without ridges.
