          title: Hymenaea courbaril L., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Tree to 30 m. tall, with smooth bark, the trunk to 2 m. in diameter, the wood hard and reasonably durable, the branchlets glabrous. Leaves glabrous; petiole about 1-2 cm. long, moderately thick, rugose when dry; stipules caducous; leaflets 2, narrowly oblong to elliptic-lanceolate, 4-10 cm. long, 2-5 cm. wide, obliquely asymmetric, the outer portion broadly rounded basally and without, the inner por- tion narrow and only slightly rounded, apically short-acuminate, subsessile, coriaceous, punctate, dull below, shiny above, with midvein very prominent below. Inflorescence articulate, several-flowered, the pedicels puberulent, the bracts caducous. Flowers whitish, gross, the receptacular portion (of calyx) about 8 mm. long; calyx-lobes ovate to oblong, about 15 mm. long, densely puberulent, verrucose, coriaceous, easily caducous; petals elliptic, up to 2 cm. long, mem- branaceous; stamens about 3 cm. long; anthers elliptic, versatile, bilocular; ovary elliptic, oblong or obovate, compressed, glandular, dark; style up to 2.5 cm. long, glandular. Legume oblong, turgid-compressed, 5-15 cm. long, few-seeded.
          originalLanguage: en
          sourceField: general
