          originalSourceText: forming an undulate submarginal vein, the intervenal areas patulous reticulate, distinctly bullate above, rigidly membranous, discolorous, dark red and glabrous above, puberulous beneath; petioles slender, stipules free, persistent only at the apex of twigs, oblong, to 2 cm long, with 2 slender erect processes 3 or more mm long, the body petaloid, apparently split lengthwise near the base or middle at maturity; venose, glabrous, red when dry; raphides numerous, minute. Inflores- cences cymose paniculate, to 12 cm long, to 4 cm wide, the peduncle slender, to 5 cm long, to 0.15 cm wide, delicately winged, usually terminated by 2-3 branch- es, 1.0-1.6 cm long, unequal, spreading, each with 2-3 secondary branches, the cymes 2-3-flowered, bracteoles narrowly oblong, to 4 mm long. Flowers not seen except for the persistent calyx. Fruits sessile, oblong rotund, to 6 mm long, to 5 mm wide, obtusely costate, glabrous, drying red, the persistent calyx cup 0.7 mm long, the lobes triangular oblong, to 1 mm long, glabrous.
