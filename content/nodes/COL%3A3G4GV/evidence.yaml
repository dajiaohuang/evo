          - text: Among the three species with basally spurred anthers, Gladiolus appendiculatus is recognised by its short-tubed, white or pale pink flowers with perianth tube ± 15 mm long. The species includes two distinct forms. Taller plants, more than 450 mm tall, with narrow leaves 2.5-8.0 mm wide reaching to the middle of the spike and with up to 25 flowers per spike, are known from Eswatini and near Lydenburg in Mpumalanga. Shorter plants with broader leaves 8-12 mm wide not reaching the base of the spike and with 5 to 12 flowers per spike have been recorded from Pilgrim’s Rest and Barberton to Wakkerstroom and Vryheid. Intermediates occur near Lydenburg and Barberton.
