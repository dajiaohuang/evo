  claims:
    - subjectId: taxon:serpentes
      claimKind: scientific
      claimType: topology
      statement: The Serpentes route is supported by a combined genomic, phenomic and fossil analysis of sampled snakes; reconstructed early ecology and ancestral states are model results, not observed ancestors or exact clade-origin dates.
      confidence: medium
      confidenceRationale: Multiple evidence classes are analyzed together and sensitivity tests are reported. Medium confidence separates the sampled topology from ancestral-state and chronology inference.
      referenceLinks:
        - referenceId: hsiang-2015-snake-origins
          relation: supports
          pages: 1–22
          figure: Figures 1–6; Additional files 1–12
          quoteLocator: Taxon sampling and matrices; phylogenetic results; ancestral-state reconstructions; Discussion
    - subjectId: taxon:serpentes
      claimKind: scientific
      claimType: divergence-time
      statement: Combined tip dating inferred Pan-Serpentes near 128.5 Ma and crown snakes about 20 Myr later; the displayed 128.5 Ma–present route is model-dependent and not a fossil FAD.
      confidence: medium
      confidenceRationale: "Pan-Serpentes tip-dating model: the cited primary study or systematic review directly supports the stated sample, calibration or withholding boundary at the supplied locator. Confidence is medium and does not extend to a global FAD, LAD, direct ancestor or unsampled interval."
      referenceLinks:
        - relation: supports
          referenceId: hsiang-2015-snake-origins
          pages: 1–22
          figure: Figures 1–6; Additional files 1–12
          quoteLocator: "Tip dating: Pan-Serpentes ~128.5 Ma and crown snakes ~110.3 Ma"
  claim-rationales.zh:
    - 研究联合分析多类证据并报告敏感性检验。中等置信度把取样拓扑与祖先状态及年代推断分开。
    - Pan-Serpentes tip-dating model：所引一手研究或高质量系统综述在给定页码、图表或章节处直接支持此处的样本、校准或暂缓边界。置信度为中等。该置信度不外推至全球首现、全球末现、直接祖先或未采样区间。
  claim-statements.zh:
    - 蛇类路线由取样蛇类的基因组、表型和化石联合分析支持；重建的早期生态与祖先状态属于模型结果，不是被观察到的祖先或精确支系起源日期。
    - 综合末端定年把泛蛇类估计在约 1.285 亿年前，而蛇类冠群约晚 2000 万年；所显示的 1.285 亿年前至今路线依赖模型，不是化石首现。
