          - text: Diagnosed by the ± X-shaped lower leaf with heavily thickened and raised margins and midrib, and the pink, funnel-shaped flowers with subactinomorphic perianth with a very short tube, 8-12 mm long and short filaments ± 7 mm long scarcely exserted from the tube.
