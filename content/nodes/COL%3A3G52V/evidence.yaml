    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants 250-450 mm high. Corm globose, ± 10 mm diam.; tunics of fine to wiry fibres. Stem erect, unbranched, usually flexed outward just above sheathing part of second leaf. Leaves 3, lowermost markedly longest, sheathing lower 1/3 of stem, reaching to ± upper 1/3 of stem, 60-120 mm long, X-shaped in section with main vein raised and margins thickened, thus with 4 broad longitudinal grooves or furrows, remaining leaves without blades, second leaf sheathing stem for 80-150 mm, third leaf inserted near stem apex. Spike inclined, 2- to 4-flowered; bracts soft-textured, dull green, 20-30 mm long, inner shorter. Flowers subactinomorphic, with unilateral stamens and style, bright pink to pale rose, whitish in throat, lower 3 tepals feathered or streaked with fine red lines or spots at base, apparently unscented; perianth tube obliquely funnel-shaped, 8-12 mm long; tepals subequal, lanceolate, dorsal slightly larger, 20-25 x 10-13 mm, inclined over stamens, upper laterals suberect, slightly shorter than dorsal, lower 3 tepals 19-23 x 10 mm. Filaments ± 7 mm long, included or exserted up to 1 mm from tube; anthers 8-10 mm long, yellow; pollen yellow. Style arching over stamens, dividing opposite upper 1/4 of anthers, branches ± 3.5 mm long. Capsules and seeds unknown.
