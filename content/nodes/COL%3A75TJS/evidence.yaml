        usage:
          title: Paullinia stipularis Benth. ex Radlk., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Lianas; stems 4- or 5-costate, viscidulous, the ribs conspicuously hirsute- villous, the sulcae glabrous; wood simple. Leaves pinnately 5-foliolate, 15-25 cm long; petioles 3-13 cm long, without wings, narrowly canaliculate on the upper surface, hirsute especially above; rachis narrowly winged, hispid on the margins and on the raised medial rib, the wing broadest toward the apex; leaflets narrowly ovate to oblong-elliptic or obovate-elliptic, sharply acute to abruptly acuminate at the apex, attenuate to rounded at the base, 4-13 cm long, 2-7 cm wide, sharply serrate and glandular-toothed mostly in the outer half, sometimes to the lower fourth, sparsely hispid on both surfaces, the pubescence denser on the upper mid- rib, the reticulate venation prominulous beneath; stipules ovate to oblong- lanceolate, 7-10 mm long, conspicuously hispidulous outside, glabrate within, prominently ciliate. Inflorescences paniculate, terminal or upper axillary; rachis and pedicels rufous-tomentose; bracteoles lanceolate-triangular, 2.5-4 mm long, glabrous inside, densely stiff appressed-pubescent outside; pedicels slender, to ca. 2 mm long, articulate about midway. Flowers cream-colored; buds ca. 1.5 mm long, globose; outer sepals densely appressed-pubescent, rounded, the inner ones glabrous; petals obovate, the scales with the crest obcordate, the deflexed appendage ciliate; staminate flowers with the filaments glabrous, the pistil sharply 3-angled, hispidulous on the angles. Capsules ellipsoid, 3-angular, ca. 1.5 cm long, orange (fide Duke 14491), sparsely hispidulous outside, wooly tomentose inside; seeds not seen.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 12544
