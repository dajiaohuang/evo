        claims:
          - text: Like P. comosa but bract helmet-shaped and brownish, and flowers pale yellow turning red to brown after pollen release.
            sourceIds:
              - sanbi_14460_0
            locator: "SANBI/WFO archive Morphology row 10233; source 14460.0; publication: Bredenkamp, CL. 2012. Thymelaeaceae: Passerina L. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 776 - 777. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Passerina esterhuyseniae is easily distinguished from P. comosa by its helmet-shaped bracts, which are widely obovate in outline. The concolorous, brownish bracts are thinly chartaceous and smooth in texture, the lamina extends into a membranous rim or membranous wings and the main vein elongates forming a subacute to acute apex. The flowers are membranous and yellowish during pollination and red to brown after shedding of the pollen.
