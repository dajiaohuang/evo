          - text: Although nearest allied to A. ferox Mill. (non Berger) in general appearance, A. candelabrum is nevertheless specifically distinct, and differs well in many characters. Compared with A. ferox, A. candelabrum differs in having larger rosettes, larger and longer spreading to recurved deeply channelled leaves, a more divaricately branched inflorescence, comparatively longer racemes, with the terminal raceme usually longer and standing out higher than the lateral ones. The flowers are also different, especially the inner segment apices which are clear white, whereas in A. ferox they are mostly deep brown. No matter what flower colour variations may occur in A. candelabrum, the white inner segment apices always give the mouth a white appearance.
            textZh: SANBI 条目提供了 Aloe candelabrum A.Berger 的鉴别特征。
            sourceIds:
              - sanbi_13236_0
            locator: "SANBI/WFO archive Diagnostic row 78115; source identifier 13236.0; cited publication: Reynolds, GW. 1974. Aloes of South Africa, 3rd ed. A.A. Balkema, Cape Town. [All rights reserved]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Aloe candelabrum is characterised by its tall [2-4(-8)m high], erect, unbranched stem covered in a `beard' of persistent, dried leaves, with a terminal rosette of long (ca. 100 x 15 cm), spreading to often recurved, deeply channelled leaves that sometimes bear a few scattered spines on the lower surface, especially at the tip of the keel. The reddish to reddish-brown marginal teeth are pungent and ca. 3 mm long. The candelabrum-like inflorescence is 5- to 12- branched with erect, very dense, cylindrical, slightly acuminate racemes 50-80 cm long, with the terminal raceme sometimes slightly longer than the lateral ones. Flowers are scarlet, sometimes rose-pink, orange-red to orange, and ca. 32 mm long, always with white inner segment tips. Very rarely they [flowers] are white. The closest relative of Aloe candelabrum is Aloe ferox. It is similarly distinguished by a tall [2-3(-5)m] erect, unbranched stem with persistent dried leaves and a terminal rosette. The leaves of Aloe ferox are typically erect to erectly spreading (rarely up to 100 cm), with marginal teeth of ca. 6 mm long and both surfaces either smooth or with irregularly scattered, pungent spines. The lower surface bears a few spines in the median line near the apex. The candelabrum-like inflorescence is 5- to 8-branched, generally with all racemes of approximately equal length, although one may be prominently taller. Flowers are mostly scarlet to orange, rarely white, and ca. 33 mm long with the inner segments tips brown to deep brown, or at least more intensely coloured than the rest of the corolla. The inner tepal apices typically do not flare. Whereas the inner segment tips of A. candelabrum tepals flare and are the same colour to the margin (in some herbarium specimens the white margins are still clearly evident), in A. ferox the inner tepal tips barely spread and are distinctly dark. It is only in old herbarium specimens presenting flowers dried very dark (with colour deepening perhaps heightened by pretreatment with a petroleum product) that this character is indistinct. In Aloe candelabrum the teeth on the leaf margins are quite short and stout, about 3 mm long, and spaced 15-20 mm apart, while in A. ferox the teeth are generally larger and more prominent, up 6 mm long, and often more closely spaced at 10-20 mm distant.
