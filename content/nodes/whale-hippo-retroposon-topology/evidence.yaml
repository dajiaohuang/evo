    - subjectId: event:whale-hippo-retroposon-topology
      claimKind: scientific
      claimType: topology
      statement: Retroposon presence-and-absence data from sampled living cetartiodactyls support Hippopotamidae as the extant sister group of Cetacea; this topology is not a fossil age, a direct ancestor or a nomenclatural catalogue decision.
      confidence: high
      confidenceRationale: Multiple independent insertion loci support the same sampled topology with an explicit character matrix. High confidence is limited to that extant relationship and does not date the split or place every fossil taxon.
