        claims:
          - text: Plants aphyllous; stems to 40 x 3 mm; roots numerous, branching, twisted, to 350 x 1-2 mm; scale-leaves acuminate, to 5 mm long. Inflorescences erect to pendulous, 50-150 mm long, peduncle very slender; bracts papery, ovate, acute, 1 mm long, as long as pedicels. Flowers minute, not twisted, 1.5 mm in diameter, white. Sepals and petals subequal, convex, slightly connate at the base, obovate, obtuse, 1-1.5 x 0.4-0.8 mm, petals slightly smaller than sepals. Lip rounded to semi-orbicular, 0.6-1.1 x 0.4-0.8 mm; spur globose, 0.6-1 mm in diameter. Gynostemium 0.2-0.5 mm long. Capsules ellipsoid to oblong, 3.5-5 x 3 mm.
