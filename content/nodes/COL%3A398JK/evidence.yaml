        claims:
          - text: Tufted annual 230-400 mm high; culm slender, often branching at the lower nodes. Leaf blade 50-350 x 2.5-6.0 mm; ligule a sparsely fringed membrane. Inflorescence subdigitate; racemes 1-14, 20-120 x 3.0-5.5 mm, slender. Spikelet 4-5 x 2-3 mm, 4-9-flowered; lower glume lanceolate to narrowly lanceolate-oblong, acute,1-nerved; upper glume 1.8-2.9 mm long, acute; lemma 2.1-3.6 mm long, lanceolate, apex acute to subacute, keel scabrid; palea keels scabrid along the wings; anther 0.6-1.1 mm long; caryopsis elliptic or lanceolate-elliptic, obliquely striate and with fine close lines perpendicular to the striae.
