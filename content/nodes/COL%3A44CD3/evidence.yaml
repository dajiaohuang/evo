    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants medium to large, 200-300 mm high. Corm globose, 20-35 mm diam.; tunics of hard, dark medium-textured to coarse fibres. Stem several-branched, with green to partly to completely dry, attenuate sheathing leaves at upper nodes 30-50 mm long. Foliage leaves 3 to 6, lanceolate to linear, channelled to ± flat, as long or longer than stem, falcate, usually trailing distally, 8-30 mm wide, margins often thickened, hyaline. Rhipidial spathes green or turning brown and dry above, long attenuate, with broad, translucent margins, inner mostly 40-60 mm long, outer almost as long, margins free nearly to base. Flowers fugaceous, blue-violet, outer tepal limbs with yellow to orange nectar guides at bases, reflexed up to ± 40º; outer tepals mostly 45-60 x 18-25 mm, claws ± 22 mm long, inner 35-50 x 9-12 mm, evidently ± erect. Filaments 10-15 mm long, united in lower 2/3; anthers 8-9 mm long. Ovary ± cylindric, mostly 15-20 mm long, sometimes veined red, usually included; style branches ± 12 mm long, crests up to 15 mm long. Capsules narrowly obovoid, 16-20 mm long, nodding when mature. Seeds angular, ± 2 mm long.
            textZh: Moraea venenata Dinter 的 SANBI 物种条目记载了植株、叶片和花部形态。
            sourceIds:
              - sanbi_18638_0
            locator: Strelitzia 42; archive Morphology row 97838, source 18638.0
            placeTimeScope: Regional species account published 2020; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
          - text: Moraea venenata has the several leaves, a branched stem, and blue-violet flowers much like those of M. polystachya, but is a more robust species, although often not as tall. The flowers have outer tepals 40-60 mm long with the claws 22-30 mm long, and as far as known the inner tepals are erect. The widest of the several leaves are up to 30 mm wide near the middle [vs. 6-12(-20) mm in M. polystachya] and the outer spathes are up to 60 mm long and the inner about half as long but with unusually broad, translucent margins, free almost to the base, an unusual feature among the southern African members of the genus.
            textZh: SANBI 条目提供了 Moraea venenata Dinter 的鉴别特征。
