    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, up to 90 mm tall, stem simple or 1-branched, hairy. Leaves 20-30 mm long, blade wedge-shaped, abruptly truncate, held obliquely to leaf sheaths, lightly pleated, silky hairy. Flowers 3-5 in a decumbent spike, maroon with cream margins, lower tepals pale yellow, maroon in midline, perianth tube funnel-shaped, ± 24 mm long, ovary smooth, bracts green, silky hairy, inner forked apically.
            textZh: Babiana lanata Goldblatt & J.C.Manning 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_14562_0
            locator: "SANBI/WFO archive Morphology row 33026; source identifier 14562.0; cited publication: Goldblatt, P; Manning, JC. 2013. Iridaceae. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 94 - 124. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: With relatively small flowers, although with a relatively long perianth tube, ± 24 mm long, Babiana lanata has a dorsal tepal ± 17 mm long and the lower tepals only slightly smaller. The upper three tepals are pale yellow or maroon with yellow edges, an unusual colour for the genus, while the lower tepals are pale creamy yellow with a pale maroon central streak. The most striking feature of the species is the leaf, the blade abruptly truncate, widest about the middle and the apex serrated, with the surface covered with long silky hairs as are the spike axis and bracts. The truncate leaf blades recall those of B. flabellifolia and its immediate allies but B. lanata is probably not immediately related to this group of species, which always has fairly large, blue to mauve or purple flowers, less conspicuous vestiture, and leaves more obviously truncate, usually widest at the apex. The long silky pubescence and leaf blades set obliquely to the sheaths recall B. rubella, also from coastal Namaqualand, but that species is readily distinguished by its magenta-pink perianth, hooded dorsal tepal and acute leaf tips.
            textZh: SANBI 条目提供了 Babiana lanata Goldblatt & J.C.Manning 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
