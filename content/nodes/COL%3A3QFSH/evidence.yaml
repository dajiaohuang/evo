        claims:
          - text: Cormous geophyte, 35-55 cm. Leaves sword-shaped, often dry at flowering. Flowers pale to deep pink, tube filiform, anthers oblong.
            textZh: Ixia stricta (Eckl. ex Klatt) G.J.Lewis 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 7133; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: While not particularly distinctive in its radially symmetric flowers with short, erect stamens, Ixia stricta is identified in ser. Dichone by a combination of the rotate flowers and a basal fan of (3)4 or 5 sword-shaped leaves, the blades with a prominent main vein and thickened margins. The sweetly scented flowers have a filiform tube about half as long as the tepals and a particularly short style ± 1 mm long. Blooming late in the season, in November and December, the leaves are often dry or partly so, a feature unusual in the genus. Raimondo et al. (2009) suggest a conservation status of (LC), least concern, but (NT), near threatened, is suggested to be more appropriate.
            textZh: SANBI 条目提供了 Ixia stricta (Eckl. ex Klatt) G.J.Lewis 的鉴别特征。
            sourceIds:
              - sanbi_15933_0
            locator: "SANBI/WFO archive Diagnostic row 84452; source identifier 15933.0; cited publication: Goldblatt, P; Manning, JC. 2012. Systematics of the southern African genus Ixia (Iridaceae): 4. Revision of sect. Dichone. Bothalia 42(2): 87 - 110. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Typically flowering late in the year, in November and December, the foliage of Ixia stricta is often more-or-less dry at flowering. Not particularly distinctive, the pink flowers are radially symmetric and have short, erect stamens. It is identified in ser. Dichone by a combination of the rotate flowers and a basal fan of (3)4 or 5 sword-shaped leaves with a prominent main vein and thickened margins. The sweetly scented flowers have a filiform tube about half as long as the tepals and particularly short style branches ± 1.5 mm long.
            textZh: SANBI 条目提供了 Ixia stricta (Eckl. ex Klatt) G.J.Lewis 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 95101; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
