        usage:
          title: Callicarpa acuminata Kunth, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: 11.5 cm wide, entire or subentire to sharply serrate, except basally, apically acute or acuminate and often narrowed to an elongate acumen, basally acute or acu- minate, often somewhat narrowed into the petiole, dark-green above, much lighter beneath, more or less stellate-furfuraceous above, especially along the midrib and larger veins, and more or less glabrescent, densely stellate-tomentose and glandu- lar-punctate or furfuraceous-floccose beneath; petioles stout, 6-28 mm long, very densely floccose-tomentose. Inflorescences solitary, opposite, cymes chiefly in the uppermost axils, often laxly corymbose and greatly branched, usually long- pedunculate, 2.5-20 cm long and 3-17 cm wide, usually many-flowered, frequently densely so, sometimes bracteate, bracteolate; peduncles stout, 1.5-6.5 cm long, densely floccose or furfuraceous with flavescent or canescent tomentum; pedicels slender, 1-3 mm long, densely canescent-tomentose; bracts (if present) sub- foliaceous, oblong, to 3.5 cm long and 1 cm wide, stellate-tomentose; bractlets linear, often numerous, 5-10 mm long, densely canescent-tomentose; prophylls setaceous. Flowers slightly fragrant, calyx small and thin-textured, 1.1-1.5 mm long and wide, often 4-angled and 4-costate, granulose-pulverulent, truncate or subtruncate, often very slightly 4-dentate or irregularly erose; corolla white or greenish-white, infundibular, the tube 1.6-2.6 mm long, the limb 4-parted, the lobes short, ovate-lingulate, 0.8-0.9 mm long and 0.9-1 mm wide, apically bluntly obtuse, sometimes slightly crimped or bilobed; stamens 4, inserted at the base of the corolla-tube, long-exserted, the filaments 3.1-7.6 mm long, the anthers oblong; pistil absent or long-exserted, the style 4.2-7 mm long, ampliate into the stigma, the stigma depressed-capitate, ca. 0.9 mm wide; ovary depressed-globose, ca. 0.6 mm long and wide, 4-sulcate, glabrous. Fruit dark-purple or almost black, sub- globose, 3-4.5 mm long and wide, glabrous, drying wrinkled, 4-seeded, whitish- lavender to yellow or red when immature; fruiting-calyx small, shallowly patel- liform, 2-3 mm wide, glabrate, truncate and entire.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 13686
