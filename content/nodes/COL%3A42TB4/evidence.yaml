    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Perennial (growing in compact mats), densely tufted (with most leaves basal), up to 430 mm tall. Leaf blades 10-80 mm long. Basal sheaths splitting into fibres. Spikelets 2.5-4.0 mm long. Spikes 20-150 (-250) mm long, rarely wider than 1 mm; anthers 0.5-1.2 mm long. Caryopsis 1.5 mm long.
