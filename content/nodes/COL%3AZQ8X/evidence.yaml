        usage:
          title: Croton hirtus L'Hér., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Annual herb becoming mostly 1-4 dm high; monoecious; stems conspicuously retrorsely stellate-hispid (hairs ca 1.5-2.5 mm long). Leaves membranous; petioles of leaves on main stem stellate-hispidulous, ca 3-25 mm long; stipules greenish, subulate, subentire, sparsely stellate, ca (1.5-)2.5-4.5 mm long, the glands at apex of petiole 2, distinctly stalked, 0.5-1.2 mm long, 0.1-0.3 mm broad across the flattened head; blades elliptic to more commonly ovate, 2-6.5 cm long, 1.5-5 cm broad (or smaller in depauperate specimens), bright green and rather sparsely strigose-hispid above, minutely glandular-punctate beneath, stellate with 6-10- radiate hairs (radii spreading, hairs ca 0.3-0.8 mm across), the veins at base of larger leaves 5, with ca 3-6 additional veins on each side, the base cuneate, the margins of larger leaves coarsely crenate-duplicidentate, with ca 10-15 major teeth on each side, the apex acute or obtuse. Inflorescences terminal, (the branching pat- tern of well-developed plants ? dichasial), bisexual, (0.5-)1-2.5 cm long, usually nearly sessile and subtended by reduced leaves, with mainly 5-12 proximal solitary 9 flowers and 4-7 solitary distal d flowers; bracts greenish, linear-lanceolate to subulate, glandular-capitate, with 4 or more slender-stalked ellipsoid glands at base (representing bifid stipules), 2-5 mm long (or reduced distally). Staminate flowers with stellate-pubescent pedicels 0.5-1 mm long; calyx-lobes 5, elliptic, hispidulous-stellate, ca 1-1.5 mm long; receptacle glabrous or nearly so; stamens 11, the filaments 0.8-1.1 mm long, glabrous, the anthers elliptic, 0.4-0.5 mm long. Pistillate flowers subsessile, the stout stellate-pubescent pedicels becoming 0.5-1.5 mm long in fruit; calyx-lobes usually 4 (the 5th rudimentary or obsolete), linear to oblanceolate, distinctly unequal, the two larger 1.5-2.5 mm long and 0.4-1.1 mm broad, the two smaller 0.8-1.9 mm long and 0.2-0.3 mm broad (becoming somewhat larger in fruit); disc 5-angled, adnate to the base of the calyx-lobes; petals ellipsoidal, 0.2-0.3 mm long; ovary densely stellate-hispidulous, the styles connate at base or nearly free, ? erect, bifid or bipartite, 1.7-2.5 mm long, the style-branches slender, hispidulous, 1.5-1.8 mm long. Capsules subglobose, stellate- hispidulous, ca 3.5 mm diam, the columella slender, ca 2.8 mm long; seeds com- pressed, blackish-brown, smooth (minutely foveolate-reticulate), minutely beaked, 2.6-3.1 mm long, 1.8-2.3 mm broad, the caruncle broadly ovate, 0.4-0.6 mm long, 0.7-1.6 mm broad.
