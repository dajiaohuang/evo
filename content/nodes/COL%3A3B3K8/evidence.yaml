    facets:
      morphology:
        status: partially-supported
        claims:
          - text: "Rigid, erect, many-stemmed shrubs, 0.3-1.3 m high. Old stems displaying anomalous secondary growth, dark grey to brown-grey; young shoots rigid, firm, chestnut-brown, sparsely felty hairy, glabrescent, densely leafy. Leaves opposite, but sometimes alternate on flowering shoots, linear, 4-14(-24) x 0.4-0.6 mm, entire, adaxially flattened, concave towards base, abaxially convex, keeled towards apex, pale green to yellow-green, greenish shiny white, glandular, glands in cavities on leaf surface, smooth, apex acute, base semi-amplexicaul; opposite leaves basally connate; young leaves sparsely felty, glabrescent. Capitula heterogamous radiate, in umbellate racemes, terminal on dolichoblasts or on brachyblasts, 3-4 mm long; peduncles as long as or shorter than subtending leaves, rarely longer, (3-)4-7(-10) mm long, felty to glabrous. Involucral bracts 5(rarely 4), 3.2 x 2.2 mm, central triangular to spathulate part green, herbaceous with broad, membranous margin, keeled to slightly flattened, sparsely felty to glabrous, central part containing cavities with glands. Paleae: those of marginal florets connate into cylindrical sheath, 4 mm long, thickly coriaceous, abaxially lanate, hairs septate; those of disc florets lanceolate, 4 x 1.3-1 x 0.3 mm, membranous, margins fringed, abaxially densely lanate. Ray florets 2 or 3, female, 3.5-5.5 mm long; lamina cuneate, 3- or4-lobed, 3.5-5.5 mm long, white, sometimes with red-purple tinge. Style branched; branches flattened, linear, up to 1.8 mm long, apex acute. Ovary oblong, slightly flattened, long-lanate. Seed oblong, 2-3 mm long. Disc florets usually 13-22, functionally male with sterile ovary, 3.0-4.5 mm long; corolla red-purple, trumpet-shaped, 5-lobed. Style not branched, apex globose, with sweeping hairs. Stamens 5, slightly exserted at maturity. Receptacle after anthesis with dense, white, long-pilose indumentum between involucral bracts and connate marginal paleae. Flowering time: closely correlated with rainfall, occurring from January to almost October, with peaks in January to April in summer-rainfall area and July to September in winter-rainfall area."
