          - text: Although E. tenuifolius is closely related to E. punctulatus, the two species can be separated by their leaf size, peduncle length, the length of the subtending leaves of the peduncles and their distribution. A further distinguishing character is the fact that E. punctulatus is hardly browsed in contrast to E. tenuifolius, which is heavily browsed.
