        claims:
          - text: Perennial to 40 cm. Leaves linear, rolled. Spikelets distichous in a spike-like panicle, straw-coloured and green, glumes 1-3-nerved, lemmas 10-15 mm long, fringed on margins, with a basal tuft of white hairs on each side, awns 10-16 mm long, geniculate.
