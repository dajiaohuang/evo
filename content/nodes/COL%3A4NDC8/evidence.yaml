    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Small, in low cushions or patches. Stems procumbent, 2-20 cm long, much branched. Leaves crowded at the branch tips and some along the stem. Leaves 2-3.5 mm long, about 1 mm wide, elliptical-oblong, not or very slightly narrowed to the base, shortly mucronate at the tip, usually with a white membranous margin in the upper half. Inflorescence erect, 0.5-2 cm high, unbranched, with 1-3 nodes with rather crowded flowers. Bracts flat, longer than the pedicels. Pedicels as long as or shorter than the perianth. Perianth 1-2 mm long, the lobes obtuse, cucullate. Stamens inserted outside a cup-like disc. Stigmas short, 3, on a short style.
            sourceIds:
              - sanbi_2759_0
            locator: "SANBI/WFO archive Morphology row 67713; source 2759.0; publication: Adamson, RS. 1959. The South African Species of Aizoaceae: VIII. Psammotropha. J. S. African Bot. 25: 51 - 68. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Much smaller than P. mucronata or P. obovata, with very small leaves which are not narrowed to the base. The older leaves are often yellow-brown. The inflorescences may be formed in large numbers.
