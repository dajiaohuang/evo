        usage:
          title: Stemodia peduncularis Benth., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Erect, sprawling or scrambling herb or subshrub to 1.5 m long, the stems slender, prominently angled, pubescent with weak short whitish hairs, the angles ciliate, ultimately stramineous near the base, spreading by stolons and sometimes rooting at the lower nodes. Leaves opposite, frequently with a short axillary shoot bearing 1-2 pairs of juvenile leaves to 1/2 as long as the expanded leaves, ovate, mostly 2-4 cm long, 1.5-2.5 cm wide, apically obtuse, basally truncate or cuneate, the margins conspicuously serrate with numerous blunt teeth, the venation pin- nate with ca. 4 lateral veins on each side, these furcating near the margin and running into the teeth, the minor venation obscure above, drying reticulate beneath, pubescent above with numerous scattered short whitish weak, slightly appressed hairs, beneath with fewer but slightly longer hairs and numerous globular or depressed globular, amber, yellow or black glands; petioles slender but slightly winged upwards, 'A-1/2 as long as the leaves, mostly copiously pubes- cent. Inflorescences 1-3 flowers fasciculate in the leaf axils, sometimes geminate, the peduncle slender, puberulent to tomentose, becoming glandular upwards, ebracteate, the pedicels to 20 mm long, 1/2 to as long as the subtending leaf. Flowers with the calyx 5-lobed to near the base, the lobes narrowly deltoid to subulate, subequal, ca. 5 mm long, pubescent and glandular dorsally, basally cucullate, the tips slightly differentiated; corolla 12-18 mm long, tubular, white, sometimes pinkish in part, red veined, drying dull orange, conspicuously nervate, 2-lipped, the upper lip 2-lobed, the lobes rotund, densely bearded just above the throat with stout hairs, and sometimes with a few glands outside, the lower lip 3-lobed, the lobes ca. 2 mm long, narrowly obtuse, the middle lobe narrower, the tube pilose outside especially near the top, the inside bearded on the upper side about 1/2 way up the tube and long pilose at the base; stamens 4 in 2 pairs, the anterior pair alike, the filaments inserted about 1/3 way up the tube, glabrous, ca. 2 mm free, the anther thecae oblong, ca. 0.7 mm long parallel, separated by the enlarged, discoid connective, the posterior pair of filaments subequal, inserted ca. 2 mm from the bottom of the tube, glabrous, 5-6 mm free, the anthers situated at the throat, the thecae unlike, unequal, smaller than those of the anterior pair, sepa- rated by a smaller enlarged connective; ovary smooth, glabrous, eglandular, narrowly conical, compressed, septally sulcate, the style straight, smooth, glabrous, the stigma obtuse, compressed, flanked by 2 small lateral projections, the stigmatic area terminal. Fruit ovoid, ca. 7 mm long, dehiscent septicidally and loculicidally part way down, at first dark ?purple, ultimately stramineous; seeds not seen.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 12871
          archiveSourceId: CA5FC7C1-0A06-4485-A857-CBF7525685A4
