        claims:
          - text: Perennial herb. Stems scandent to 6 m, glabrous. Leaf-lamina 4-14 x 4-15 cm, broadly ovate in outline, cordate, asperulous or ± scabrid-punctate above, setulose on veins beneath, otherwise glabrous, deeply palmately 5-lobed, lobes elliptic or narrowly elliptic, ± sinuate-serrate, denticulate, acuminate, obtuse to acute, apiculate, the central largest. Petiole 2-8 cm long, coarsely spiculate. Probracts c. 3 mm long, spathulate, male flowers 2-8, usually co-axillary with 1-4 female flowers; pedicels 5-15 mm long. Receptacle-tube c. 4 mm long, lobes up to 2 mm long, triangular-dentiform. Corolla white to greenish-yellow, the lobes 6-9 x 2.5-5 mm female flowers 1-5, usually co-axillary with up to 8 male flowers; pedicel 1-5 mm long; ovary 4-5 x 2-3.5 mm shortly ellipsoid. Fruits 1.5-2.5 x 1.5-2.5 cm, solitary or in clusters of 2-5, subglobose, bright red with silvery white longitudinal stripes or markings; fruit-stalks 1-5 mm long. Seeds 5-6 x 2.5-3 x 4-4.5 mm.
