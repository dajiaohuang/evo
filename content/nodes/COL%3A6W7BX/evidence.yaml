          originalSourceText: Apparently trees of moderate size, the young branches stout and hollow, densely rubiginous-papillate interspersed-hispid to glabrate. Leaves at maturity deeply 7- to 9-lobed about two-thirds or more to the petiole, deeply amplectant-cordate at the base, about 25-35 cm. long and broad, the median lobe strongly contracted at the base, scaberulous above, paler and densely arachnoid-vilosulose beneath, the petiole about 15-25 cm. long, densely rubiginous-papillate sparsely interspersed- hispidulous; stipules oblong, 8-10 cm. long, densely rubiginous-pulverulent interspersed hispid. Peduncles paired at the nodes, the peduncle somewhat shorter than the subtending petiole, rubiginous-papillate sparsely interspersed-hispidulous. Staminate flowers unknown. Fruits compressed-ovoid, about 1.5 cm. long and 1 cm. broad, densely rubiginous-papillate interspersed-hispidulous.
