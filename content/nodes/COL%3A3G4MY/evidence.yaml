    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants 350-600 mm high, erect or trailing. Corm globose, 20-28 mm diam.; tunics softly cartilaginous becoming coarsely fibrous. Stem usually inclined, occasionally ± erect, flexed outward above, unbranched. Leaves usually 5, lower 4 basal and reaching to between middle and apex of spike, lanceolate, 7-14 mm wide, main vein moderately thickened and hyaline, a pair of secondary veins also somewhat thickened, margins hardly thickened, uppermost leaf much shorter, narrowly channelled for almost entire length. Spike lightly flexuose, 4- to 7-flowered; bracts firm-textured, green or flushed dull purple, outer with a light median fold, 60-70 mm long, inner shorter and lightly 2-keeled, notched apically. Flowers dark carmine-red, somewhat urn-shaped, lower tepals each with narrow longitudinal, median white streak outlined with dark red, ventral part of upper part of tube whitish streaked with red, unscented; perianth tube gradually flared from base, slightly sigmoid in profile, 35-45 mm long; tepals obovate, ± cupped above, outer whorl subequal and slightly larger than inner, dorsal and lower laterals 30-38 x 18-20 mm, upper laterals and lower median 30-42 x 25 mm. Filaments 27-30 mm long, exserted 14-15 mm from tube; anthers ± 10 mm long, dark purple; pollen pale lilac. Style arching over stamens, dividing shortly beyond anther apices, branches ± 4.5 mm long. Capsules oblong, 16-20 mm long. Seeds oblong, 6-7 x 2.0-2.5 mm, wing developed only at ends.
