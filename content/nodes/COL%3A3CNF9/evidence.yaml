        usage:
          title: Euphorbia cotinifolia L., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Tree, head strongly branched, to 10 m, branches terete, articulate, glabrous. Leaves ternate (rarely alternate at some nodes); stipules obsolete; petiole 2-6 cm long, slender; blade ovate, 4-6 X 3-5 cm, green, glabrous or with scattered short hairs, the base rounded, sometimes obscurely peltate, the margin entire, the apex truncate to emarginate. Cyathia in terminal cymes, often forming showy panicles with up to 30 on each of 6-12 laterals at the tip of a branch, campanulate, ca 3 mm diam, the lobes broad, fimbriate and often white at their apices; glands 5(4), brown, the appendages larger than glands, white. Fruit not seen from Panamanian material; a Mexican collection (Pringle 6069 MO) has capsules broadly ovoid, to 6 mm diam, sparsely pubescent; seed ovoid, ca 2.5 mm long, somewhat angled, the surface deeply pitted with pits ? in rows and occasionally also warted, ecar- unculate.
          originalLanguage: en
          sourceField: general
