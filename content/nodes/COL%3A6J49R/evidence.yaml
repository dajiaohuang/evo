        claims:
          - text: "Perennial herb, 0.67-0.90 m high. Leaves stiff, ± succulent, 1/4-1/2 culm length; blades 2.7-4.2 mm wide, slightly incurved. Culm scapose, slightly flattened, ± 1.8 mm in diam. Inflorescence variable, up to 60 x 52 mm, a compound anthela of 1 central head with ± 8 branches, each bearing > 1 heads, often contracted to a group of heads; spikelets many, dense. Subtending bracts 2-5, 3 well-developed, leaf-like. Spikelets ovate becoming elliptic-oblong to oblong, 3-8 x 1.2-2.5 mm. Glumes: fertile oblong, 1.6-2.4 x 1.2-1.7 mm, keel terminating subapically. Style branches 3. Flowering time Apr. Nutlet obovate, 0.60-0.85 x 0.5-0.7 mm, 3-angled, dark brown to ± black, surface reticulate to smooth."
