        usage:
          title: Sida glabra Mill., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Herb or suffrutex, the stem erect or ascending or sprawling, up to 1.2 m long, the branches slender, rather sparsely and finely stellate-puberulus to glabrescent. Leaves slender-petiolate, the petiole up to 4 cm long, flattened and hirsute on the adaxial side, rounded and nearly glabrous on the abaxial side, the stipules linear- subulate, 3-4 mm long, hirsute, persistent; blade broadly ovate, cordate at the base, acuminate at the apex, coarsely crenate-serrate at the margin, up to 3.2 cm long and 2.6 cm wide, thin, nearly concolorous, 5(-7)-palminerved, with both surfaces more or less sparsely strigose-pubescent, and with the venation prominulous. Flow- ers axillary, solitary, the pedicel capillaceous, obscurely articulated above the middle or inarticulated, 1.5-2.5 cm long, up to 4.5 cm long in fruit, finely stellate-puberulus especially above; calyx campanulate, subplicate-5-angulate, ca 5-5.5 mm long, thin, 10-ribbed, puberulus on the veins and ciliate at the margin, very moderately accrescent, the lobes deltoid, from the base long-acuminate, ca 2.5-3 mm long and broad at the base; petals ca 6-7 mm long, yellow. Mericarps 5, trigonous, narrow, ca 4 mm long (awns included), apically 2-aristate, the awns ca 1-1.5 mm long, very minutely antrorsely pilosulose as is the dorsal upper part, thin-walled, dorsally and laterally finely reticulate, dehiscent apically.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 7344
