          originalSourceText: Shrubs or small trees with peculiar pale brown bark that scales off in thin sheets; young twigs 4-angular, pubescent. Leaves elliptical to oblong, rounded, obtuse or apiculate at the apex, rounded or obtuse at the base, 4-12 cm. long and 3.5-4.5 cm. broad, chartaceous, glabrescent on both sides, the midrib impressed above and prominent beneath, the lateral nerves 12-16 on each side, impressed above and prominent beneath, parallel and arcuate-anastomosing near the margin; petiole 3-4 mm. long. Peduncles axillary, 1- to 3-flowered, pubescent. Flower buds pubescent, constricted under the calyx, 1.0-1.5 cm. long. Calyx closed in the bud, ellipsoid, irregularly 4- to 5-fid at anthesis, its segments about 1 cm. long, sericeous inside. Petals 1.5-2.0 cm. long. Anthers linear-oblong. Ovary 3- to 5-celled; placenta 2-lamellate; ovules in a triple row at each side of the placenta, turned in all direc- tions. Berry pear-shaped or globose, 3-6 cm. in diameter, glabrate.
          originalLanguage: en
          sourceField: general
