    facets:
      morphology:
        status: partially-supported
        claims:
          - text: A small shrub 20-30 cm [as '8-12 in.'] high; branches elongated, terete, canous pubescent, becoming glabrous with age; twigs opposite; bark brown, smooth. Leaves opposite, slightly connate at the base, linear or lanceolate-linear, subobtuse or subacute, 1-nerved beneath, canous-tomentellous. Heads 34-flowered, terminal, sessile, solitary, 0'91 cm long, about 5 mm in diameter, oblong. Involucral bracts about 4-seriate, more or less ovate, subacute, with a distinct midrib, greenish, with a band of short canous indumentum up the middle. Receptacle flat, honeycombed, fimbriated. Corolla 0.9-1.1 cm long, tubular, 5-angled below; lobes 2.75-3 mm long, lanceolate, subacute. Stamens inserted f down the corolla-tube; filaments 3-5 mm long, filiform; anthers 4 mm long, linear, lanceolate and acute at the apex. Style 9 mm long, terete; style-branches 3-3.5 mm long, linear, becoming lanceolate-ovate near the apex, papillous on the broadened portion. Achenes 3 mm long, obovate-oblong, villous from the base. Pappus reddish-brown, 1 cm long.
            sourceIds:
