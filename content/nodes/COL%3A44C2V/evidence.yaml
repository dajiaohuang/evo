    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, 15-30 cm. Leaf solitary, linear, narrowly channelled. Flowers white, speckled with blue, inner tepals absent.
            textZh: Moraea barnardii L.Bolus 的 SANBI 物种条目记载了植株、叶片和花部形态。
            sourceIds:
              - sanbi_13878_0
            locator: Strelitzia 29; archive Morphology row 6910, source 13878.0
            placeTimeScope: Regional species account published 2012; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
          - text: A slender species standing up to 300 mm tall, Moraea barnardii is immediately distinguished by the white flowers faintly blue-veined on the underside, with broad, spreading to laxly reflexed outer tepal limbs with undulate margins and nectar guides consisting of a ring of dark blue edged with radiating blue lines. Flowers lack inner tepals and have short filaments 8-9 mm long, united in the lower third, dark blue anthers and red pollen. Plants are usually unbranched. The immediate relationships of M. barnardii are with the Caledon Swartberg endemic M. longiaristata and the several differences between then are discussed under that species.
            textZh: SANBI 条目提供了 Moraea barnardii L.Bolus 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: Strelitzia 42; archive Diagnostic row 94245, source 18638.0
            placeTimeScope: Regional species account published 2020; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
        gaps:
