  claims:
    - subjectId: taxon:carnufex
      claimKind: scientific
      claimType: fossil-range
      statement: Carnufex is anchored by partial, immature holotype NCSM 21558 from the Carnian Pekin Formation of North Carolina; that one individual does not define the genus-wide first or last appearance.
      confidence: high
      confidenceRationale: The specimen number, formation and age are directly reported. High confidence is intentionally specimen-local and does not depend on predator reconstruction.
      referenceLinks:
        - referenceId: zanno-2015-carnufex
          relation: supports
          pages: 5:9276
          figure: Figures 1–2
          quoteLocator: Systematic palaeontology—Holotype and locality; Results
    - subjectId: taxon:carnufex
      claimType: taxonomy
      claimKind: scientific
      statement: Zanno et al. named Carnufex carolinensis from holotype NCSM 21558 and recovered it at the base of Crocodylomorpha in an unresolved polytomy in their 79-taxon, 413-character analysis; this is a sampled topology, not direct ancestry.
      confidence: medium
      confidenceRationale: The name, type material and matrix result are explicit in the primary study. Confidence remains medium because the basal placement is analysis-dependent and the holotype is skeletally immature and incomplete.
      referenceLinks:
        - referenceId: zanno-2015-carnufex
          relation: supports
          pages: Article 9276
          figure: Figure 2a; Supplementary Figure S9
          quoteLocator: Systematic palaeontology; Holotype; comprehensive 79-taxon, 413-character phylogenetic analysis
    - subjectId: taxon:carnufex
      claimType: biogeography
      claimKind: scientific
      statement: The Carnufex type and referred material are recorded from the approximately 231 Ma Pekin Formation in Chatham County, North Carolina; this single formation sample does not establish a genus-wide distribution or absence elsewhere.
      confidence: high
      confidenceRationale: The locality, formation and age are directly reported for the named material. High confidence is limited to that occurrence and does not infer a complete geographic range.
      referenceLinks:
        - referenceId: zanno-2015-carnufex
          relation: supports
          pages: Article 9276
          figure: Figures 1–2
          quoteLocator: Systematic palaeontology—Locality and horizon; Discussion of the Pekin Formation assemblage
    - subjectId: taxon:carnufex
      claimType: morphology
      claimKind: scientific
      statement: NCSM 21558 preserves partial cranial and postcranial material, including a reconstructed slender, ornamented skull longer than 50 cm and elongate, serrated, slightly recurved premaxillary teeth; these observations are limited to the immature holotype.
      confidence: high
      confidenceRationale: The preserved elements, three-dimensional reconstruction and tooth morphology are described and figured directly. High confidence does not extend the reconstruction to unknown individuals or ontogenetic stages.
      referenceLinks:
        - referenceId: zanno-2015-carnufex
          relation: supports
          pages: Article 9276
          figure: Figure 1; Supplementary Figure S9
          quoteLocator: Holotype; Diagnosis; cranial description; three-dimensional skull reconstruction
    - subjectId: taxon:carnufex
      claimType: ecology
      claimKind: scientific
      statement: The study interprets Carnufex as an approximately 3 m terrestrial faunivore and top-tier predator in the sampled Pekin Formation assemblage using serrated teeth, reconstructed skull length and an immature femur-length estimate of 354–441 mm; feeding, locomotion and guild are not direct behavioural observations.
      confidence: medium
      confidenceRationale: Dentition and preserved anatomy are specimen observations, whereas total length, femur proxy and predator-guild assignment are reconstructions bounded to the study and assemblage.
      referenceLinks:
        - referenceId: zanno-2015-carnufex
          relation: supports
          pages: Article 9276
          figure: Figure 2b–d; Supplementary Table S2
          quoteLocator: Diagnosis; body-size estimates; Pekin Formation predator-guild discussion
  claim-rationales.zh:
    - 标本号、地层与年代均有直接报告。高置信度刻意限于标本与地点，不依赖捕食者重建。
    - 命名、模式材料与矩阵结果均由一手研究明确报告。由于正模骨骼未成熟且不完整、基部位置依赖分析，置信度保留为中等。
    - 论文直接报告具名材料的地点、地层组与年代。高置信度只适用于该出现记录，不推断完整地理范围。
    - 保存骨骼、三维复原和牙齿形态均有直接描述与图示。高置信度不把正模复原外推到未知个体或发育阶段。
    - 牙列和保存解剖属于标本观察；全长、股骨代理值和捕食者功能群归属则是限定于该研究及动物群的复原。
  claim-statements.zh:
    - Carnufex 由北卡罗来纳州卡尼期佩金组的部分、未成熟正模 NCSM 21558 锚定；该单一个体不定义属级首现或末现。
