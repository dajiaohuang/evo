    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, 15-20 cm. Leaves 1 or 2, linear, channelled. Flowers tiny, yellow, style branches reduced, concealed by anthers, crests vestigial.
            textZh: Moraea vlokii Goldblatt 的 SANBI 物种条目记载了植株、叶片和花部形态。
            sourceIds:
              - sanbi_13878_0
            locator: Strelitzia 29; archive Morphology row 7376, source 13878.0
            placeTimeScope: Regional species account published 2012; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
          - text: Closely resembling the common and widespread Moraea gawleri in all vegetative features, notably the strongly vertically ribbed corm tunics, and short rhipidial spathes with the outer much shorter than the inner, M. vlokii usually has a single foliage leaf (occasionally a second much shorter one), always with straight margins, and pale yellow flowers with short tepal claws less than one quarter as long as the limbs, and vestigial style branches shorter than and concealed by the anthers and lacking crests. By contrast, M. gawleri has tepal claws only slightly shorter than the limbs and style branches with prominent, petaloid crests. Both species have broadly obovoid to almost globose capsules. Flowers open in early morning and collapse at ± 13:00, whereas those of M. gawleri open in mid- to late morning and last through late afternoon.
            textZh: SANBI 条目提供了 Moraea vlokii Goldblatt 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: Strelitzia 42; archive Diagnostic row 95262, source 18638.0
            placeTimeScope: Regional species account published 2020; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
