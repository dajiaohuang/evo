          - text: Distinct in subg. Visciramosae in having more than two leaves and acute rhipidial spathes, features it shares with M. striata and M. vespertina but it differs from these species in the buff-coloured to brown perianth with spreading claws forming a wide cup, the subequal tepals all bearing nectar guides, and the relatively short style branches and crests.
