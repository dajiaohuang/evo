  claims:
    - subjectId: event:eritherium-holotype-proboscidean
      claimKind: scientific
      claimType: topology
      statement: Eritherium azzouzorum is represented by a 15-specimen hypodigm including holotype skull MNHN PM69 from the lower bone bed of Sidi Chennane; dental and cranial characters support a stem-proboscidean placement, while body mass and exact phylogenetic position are comparative estimates.
      confidence: medium
      confidenceRationale: The holotype, hypodigm, locality and teeth are directly described. Proboscidean affinity, relationships and 3–8 kg mass use a character matrix and dental allometry.
      referenceLinks:
        - referenceId: gheerbrant-2009-eritherium
          relation: supports
          pages: 10717–10721
          figure: Figures 1–3; Table S1
          quoteLocator: Systematic palaeontology; Holotype and hypodigm; Phylogenetic analysis
  claim-rationales.zh:
    - 正模、组合、产地与牙齿有直接描述；长鼻目亲缘、关系和 3–8 千克体重依赖性状矩阵与牙齿异速生长。
  claim-statements.zh:
    - Eritherium azzouzorum 由 15 件标本组成的组合代表，包括来自 Sidi Chennane 下部骨层的正模头骨 MNHN PM69；牙齿与颅骨性状支持长鼻目干群位置，而体重和精确系统位置是比较估算。
