    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Acaulescent, cormous geophyte, 10-15 mm, with stems reaching ground level. Leaves firm, linear, erect, softly hairy. Flowers several in short, erect spikes, actinomorphic, purple with a red centre and margins often white below, tube elongate, anthers erect, inner bracts forked apically, ovary smooth.
            textZh: Babiana radiata Goldblatt & J.C.Manning 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 6737; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Recognised by the radially symmetric flower with a pink-purple perianth, the tepals forming a shallow bowl, and short style with the branches extending between the lower parts of the anthers. The stem is subterranean, only the spike is held above ground, and the linear leaves are 2-4(-7) mm wide, usually bearing fine long hairs. The large soft, pale green floral bracts, the inner of which is forked apically, and smooth ovary place the species in sect. Teretifolieae, where it may be most closely related to the widespread B. sambucina. That species has broader, noticeably pleated leaves, usually shortly hairy to scabrid leaves and zygomorphic flowers, usually blue to violet with the lower lateral tepals boldly marked in the centre with white blotches outlined in darker blue or rarely red-purple. The radially symmetric flower of B. radiata is an independent development in the section.
            textZh: SANBI 条目提供了 Babiana radiata Goldblatt & J.C.Manning 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 94924; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
