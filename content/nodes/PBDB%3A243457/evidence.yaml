  claims:
    - subjectId: taxon:strudiella
      claimType: taxonomy
      claimKind: scientific
      statement: Strudiella devonica was originally described as a Late Devonian insect, but a later primary re-investigation rejected that identification; its placement is retained as a contested arthropod interpretation.
      confidence: contested
      confidenceRationale: The named specimen and original diagnosis are directly documented, while an independent re-examination disputes the insect characters; the atlas does not force either interpretation beyond the cited material.
      referenceLinks:
        - referenceId: garrouste-2012-strudiella
          relation: supports
          pages: 82–85
          figure: Figures 1–4
          quoteLocator: Diagnosis, systematic description and phylogenetic interpretation
        - referenceId: hornschemeyer-2013-strudiella
          relation: supports
          pages: E3–E4; Figure 1
          figure: Figure 1
          quoteLocator: Re-investigation rejecting the insect interpretation
    - subjectId: taxon:strudiella
      claimType: biogeography
      claimKind: scientific
      statement: The profiled Strudiella specimen comes from Upper Devonian freshwater sediments at the Strud locality in Belgium; this records one deposit and not a complete geographic distribution.
      confidence: high
      confidenceRationale: Both primary papers identify the Strud locality and its Upper Devonian freshwater setting. High confidence is limited to the named specimen and deposit, without inferring absence elsewhere.
      referenceLinks:
        - referenceId: garrouste-2012-strudiella
          relation: supports
          pages: 82–85
          figure: Figures 1–2
          quoteLocator: Strud locality, Upper Devonian freshwater sediments and specimen provenance
        - referenceId: hornschemeyer-2013-strudiella
          relation: supports
          pages: E3–E4; Figure 1
          figure: Figure 1
          quoteLocator: Re-investigation of the Strud specimen and its locality context
    - subjectId: taxon:strudiella
      claimType: ecology
      claimKind: scientific
      statement: The original reconstruction inferred a terrestrial, probably omnivorous arthropod from the Strud mandible interpretation, but neither feeding behaviour nor a population-wide ecological guild is directly observed.
      confidence: contested
      confidenceRationale: The omnivorous orthopteroid-mandible and terrestrial interpretations occur in the original study, while the later re-examination disputes the key insect identification; ecological language therefore remains conditional.
      referenceLinks:
        - referenceId: garrouste-2012-strudiella
          relation: supports
          pages: 82–85
          figure: Figures 2–4
          quoteLocator: Terrestrial interpretation and orthopteroid mandible discussion
        - referenceId: hornschemeyer-2013-strudiella
          relation: supports
          pages: E3–E4; Figure 1
          figure: Figure 1
          quoteLocator: Caution over ecological interpretation of the re-examined arthropod
    - subjectId: taxon:strudiella
      claimType: morphology
      claimKind: scientific
      statement: The nearly complete Strudiella specimen preserves a segmented body, antennae and legs; the proposed dicondylic mandibles and pterygote features are disputed after re-examination.
      confidence: contested
      confidenceRationale: Gross body preservation is documented in the primary description, but the diagnostic head structures that supported an insect assignment are the subject of a direct critical re-analysis.
      referenceLinks:
        - referenceId: garrouste-2012-strudiella
          relation: supports
          pages: 82–85
          figure: Figures 1–3
          quoteLocator: Specimen habitus, appendages and head description
        - referenceId: hornschemeyer-2013-strudiella
          relation: supports
          pages: E3–E4; Figure 1
          figure: Figure 1
          quoteLocator: Critical re-examination of proposed insect characters
    - subjectId: taxon:strudiella
      claimType: fossil-range
      claimKind: scientific
      statement: The approximately 365 Ma display point is the Strud specimen's Late Devonian deposit age, not a global Strudiella range, insect FAD or arthropod lineage origin date.
      confidence: medium
      confidenceRationale: The primary description places the specimen in the Late Devonian at about 365 Ma, but one disputed specimen cannot establish genus-wide or insect-wide temporal endpoints.
      referenceLinks:
        - referenceId: garrouste-2012-strudiella
          relation: supports
          pages: 82–85
          figure: Figures 1–2
          quoteLocator: Late Devonian age and Strud specimen context
        - referenceId: hornschemeyer-2013-strudiella
          relation: supports
          pages: E3–E4; Figure 1
          figure: Figure 1
          quoteLocator: Re-investigation of the Late Devonian Strud specimen
  claim-rationales.zh:
    - 同一具名标本的原始昆虫诊断与后续再研究的否定结论均有一手文献支持，因此保留争议分类，不外推为可靠昆虫校准。
    - 两项一手研究均明确指出 Strud 地点与上泥盆世淡水沉积背景；高置信度仅适用于该标本与沉积地点。
    - 陆生和可能杂食的解释依赖原始颚部鉴定，而关键昆虫鉴定已被再研究质疑，因此生态字段保持条件性。
    - 近乎完整躯体、触角和足可由图版直接核对，但支持昆虫归属的头部性状在一手再研究中存在明确争议。
    - 约 365 Ma 数值仅转换晚泥盆世 Strud 沉积背景；单一且归属有争议的标本不能给出全球延限或节肢动物谱系起源。
  claim-statements.zh:
    - Strudiella devonica 最初被描述为晚泥盆世昆虫，但后续一手再研究否定了这一鉴定；其位置保留为有争议的节肢动物解释。
    - 档案中的 Strudiella 标本来自比利时 Strud 地点的上泥盆世淡水沉积物；这只记录一个沉积地点，不是完整地理分布。
    - 原始复原根据 Strud 颚部解释推断其为陆生、可能杂食的节肢动物，但摄食行为和种群层面的生态功能群均未被直接观察。
    - 近乎完整的 Strudiella 标本保存了分节躯体、触角和足；所提出的双髁颚与有翅类特征在再研究后存在争议。
    - 约 365 Ma 的显示点是 Strud 标本的晚泥盆世沉积年龄，不是 Strudiella 的全球延限、昆虫首现或节肢动物谱系起源时间。
