        claims:
          - text: Dwarf, acaulescent, glabrous geophyte, up to 40 mm tall. Bulb tunics papery, pale brown. Leaves few, with rigid petioles, abruptly swollen at apex and base, leaflets 7-13, linear, channelled, ± falcate towards tip, greyish green. Flower 1 per peduncle, pale rose, with yellowish tube, base of each petal with 2 red swellings on margin.
