        usage:
          title: Ruellia paniculata L., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Herbs or suffrutescent plants to 1 m tall; stems erect, ascending or pro- cumbent and rooting at the nodes, subquadrangular, younger stems glandular puberulous, older portions glabrous. Leaves ovate to elliptic, 3-10(17) cm long, 1.5-4 ( 6.5) cm wide, apically obtuse to acute, basally abruptly attenu- uate, puberulous to glandular pubescent above, puberulous to hispidulous be- neath, the cystoliths prominent on both the surfaces; margins undulate to cre- nate; petioles 0.5-4 cm long, pubescence that of the stern. Inflorescences axillary, dichotomously branched, divergent or ascending, the branches glandular pu- berulous; bracts leaflike, glandular puberulous; floral bracts linear elliptic, 4-8 mm long, 1-2 mm wide, glandular puberulent. Flowers with the calyx 1-1.5 cm long, glandular puberulent, the segments linear subulate, unequal; corolla blue, finely puberulous, 3-4 cm long, the lobes oval, 6-7 mm long, 5 mm broad, the limb 1-1.5 cm across; stamens slightly exserted. Capsule cylindric, 10-13 mm long, 2 mm in diameter, erect, apically attenuate, glabrous to sparingly puberu- lous toward the tip; seeds 8, flat, ovoid, 2 mm long, 1.5 mm wide, rimmed with mucilaginous hairs when wet.
