    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Spiny dwarf shrub, up to 1 m tall, rhizomatous, with raised round glands on culms, sheaths and leaves; culm nodes and sheath mouth woolly. Leaves mainly cauline, pungent when reduced; ligule a fringe of hairs. Inflorescence a narrow panicle, branches adpressed to main axis. Spikelets 12-15 mm long (excluding awns), 1-flowered; glumes unequal, long acuminate; lemma 3-awned, only central awn plumose, with articulation between apex of lemma and base of column.
