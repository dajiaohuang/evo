  claims:
    - subjectId: taxon:arthrodira
      claimKind: scientific
      claimType: topology
      statement: New Dunkleosteus species and an explicit Eubrachythoraci matrix provide a documented sample nested within Arthrodira. The eubrachythoracid sample neither resolves all arthrodires nor sets the order's exact global first or last appearance.
      confidence: medium
      confidenceRationale: Confidence is medium because the cited primary study directly supports the bounded topology statement at the supplied locator. The confidence does not extend beyond the eubrachythoracid sample neither resolves all arthrodires nor sets the order's exact global first or last appearance.
      referenceLinks:
        - relation: supports
          referenceId: carr-hlavin-2010-eubrachythoraci
          pages: 195–222
          figure: Figures 1–13; cladistic matrix
          quoteLocator: Systematic palaeontology; character analysis; Eubrachythoraci topology
    - subjectId: taxon:arthrodira
      claimKind: scientific
      claimType: fossil-range
      statement: Named Dunkleosteus material from the Upper Devonian formations provides a 372.15–358.86 Ma Famennian study-sample window inside Arthrodira; it does not delimit the order globally.
      confidence: medium
      confidenceRationale: "Famennian eubrachythoracid sample within Arthrodira: the cited primary study or systematic review directly supports the stated sample, calibration or withholding boundary at the supplied locator. Confidence is medium and does not extend to a global FAD, LAD, direct ancestor or unsampled interval."
      referenceLinks:
        - relation: supports
          referenceId: carr-hlavin-2010-eubrachythoraci
          pages: 195–222
          figure: Figures 1–13; systematic palaeontology and matrix
          quoteLocator: Formation ages, named Dunkleosteus material and Eubrachythoraci analysis
  claim-rationales.zh:
    - 置信度为中：所引主研究在给定页码、图版或章节定位器处直接支持这一受限的拓扑表述；置信度不外推到文中明确排除的全群起源、全球首现、直接祖先或精确端点。
    - Famennian eubrachythoracid sample within Arthrodira：所引一手研究或高质量系统综述在给定页码、图表或章节处直接支持此处的样本、校准或暂缓边界。置信度为中等。该置信度不外推至全球首现、全球末现、直接祖先或未采样区间。
  claim-statements.zh:
    - 新的邓氏鱼物种与明确的真胸甲鱼矩阵，提供了节甲鱼目内部的一个有据样本。真胸甲鱼样本既未解决全部节甲鱼关系，也未确定该目精确的全球首末出现。
    - 来自上泥盆统地层的具名邓氏鱼材料，为节甲鱼目内部提供 3.7215–3.5886 亿年前的法门期研究样本窗口；它不限定整个目的全球延限。
