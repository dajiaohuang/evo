    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Shrub, decumbent to erect, copiously branched, to 25 cm high and 40 cm in diameter, roots not tuberous. Stems slightly lignified. Leaves flattened, triangular, with large epidermal bladder cells, decussate and shortly connate at the base, becoming alternate in the inflorescences, persistent. Flowers in few-flowered dichasia, bright pink, ca. 2 cm in diameter, calyx 5-lobed, filamentous staminodes numerous, calyx lobes as well as corolla parts and stamens connate into a short tube, stamens and stigmas not concealed, nectaries consisting of 5 shell-shaped depressions, ovaries half-inferior, placentation axile. Fruits hygrochastic capsules, opening repeatedly by means of expanding keels, 5-locular, with valve wings inflexed over the valves. Seeds D-shaped, black, without crest.
            sourceIds:
              - sanbi_5516_0
            locator: "SANBI/WFO archive Morphology row 93613; source 5516.0; publication: Gerbaulet, M; Struck, M. 1996. Three new species of Phyllolobus (Mesembryanthemoideae) from the arid parts of South Africa. Haseltonia 4: 24 - 27. [All rights reserved]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: It is allied to the yellow-flowered Sphalmanthus melanospermus Dinter & Schwantes, from which it differs most obviously in having more flattened, triangular (not narrowly ovate) leaves and bright pink flowers.
