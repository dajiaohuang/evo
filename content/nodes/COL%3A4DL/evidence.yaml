      claimType: topology
      statement: A species-level supertree assembled from 188 source trees recovers Feliformia among extant Carnivora and resolves its sampled families, while several internal relationships differ from earlier trees; it does not supply a fossil first appearance.
      confidence: medium
      confidenceRationale: The study gives explicit tree and gene sampling and discusses conflicting source relationships. Scope is limited to extant species.
      referenceLinks:
        - relation: supports
          referenceId: nyakatura-2012-carnivora-supertree
          pages: Article 12
          figure: Figure 2
          quoteLocator: Family-level relationships; Feliformia results
  claim-rationales.zh:
    - 研究明确给出树和基因取样，并讨论相互冲突的来源关系；范围仅限现生物种。
  claim-statements.zh:
    - 一棵由 188 棵来源树组装的物种级超级树在现生食肉目中恢复猫型亚目并解析其取样科，但若干内部关系不同于早期树；它不提供化石首现。
