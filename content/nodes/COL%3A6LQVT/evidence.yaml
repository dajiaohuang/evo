    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Bulbous geophyte, 70-170 mm tall. Leaves 2, dry at flowering, spreading, narrowly strap-shaped, slightly channelled, smooth or with short, outspread hairs on both surfaces or under surface. Flowers stellate, pink with a white or darker pink centre, in a dense, widely spreading head, stamens consistently shorter than tepals.
            textZh: Hessea pilosula D.Müll.-Doblies & U.Müll.-Doblies 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_14528_0
            locator: "SANBI/WFO archive Morphology row 32844; source identifier 14528.0; cited publication: Snijman, DA. 2013. Amaryllidaceae. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 33 - 42. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Hessea pilosula is distinguished vegetatively by the deep-seated bulb with a long, slender neck; narrow (1-5 mm) leaves, which are usually more or less pilose; short stamens (less than 3 mm shorter than tepals); and short to absent perigone tube (less than 1 mm). The most closely allied species is H. incana, the only other species with shortly pilose leaves. Hessea pilosula is vegetatively and florally less robust than H. incana and flowers one to two months earlier. For detailed differences between the two species refer to H. incana.
            textZh: SANBI 条目提供了 Hessea pilosula D.Müll.-Doblies & U.Müll.-Doblies 的鉴别特征。
