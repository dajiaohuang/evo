        claims:
          - text: Like N. tenuifolium but larger shrub or small tree up to 5 m, leaves discolorous, silvery and glaucous below, leaflet lobes broader and more congested. Fruit elliptic, > 5.5 mm long.
            sourceIds:
              - sanbi_14097_0
            locator: "SANBI/WFO archive Morphology row 9303; source 14097.0; publication: Magee, AR; Manning, JC; van Wyk, B-E; Tilney, PM. 2012. Apiaceae: Notobubon Magee. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 329 - 330. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Notobubon gummiferum differs most obviously from N. sonderi in that it is a large shrub or small tree reaching a height of up to 5 m (N. sonderi is a small decumbent shrub of less than 1 m in height). Furthermore it has a shortly pedunculate inflorescence, very large and multiradiate primary umbel (usually 25-41 rays) and often broader ultimate leaflet segment lobes. It differs from N. tenuifolium in the larger, elliptic fruit (5.5-8.5 mm long), discolorous leaves (adaxial surface dark green, abaxial surface silvery and glaucous) with the lobes of the ultimate leaflet segments broader and more congested.
