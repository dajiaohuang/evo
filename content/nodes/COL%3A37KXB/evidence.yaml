    facets:
      morphology:
        status: partially-supported
        claims:
          - text: "Tufted perennial with surculose base; cataphylls dark brown with pale nerves, 6-10 mm long. Culms 340-750 x 1.6-3.0 mm, coarse, terete at base but becoming triangular towards inflorescence, scabrid along angles. Leaves: sheath pale, membranaceous, up to 40-90 mm long, rim ciliate; blade 200-550 x 1.0-1.5 mm, stiff and wiry, sabrid on the margins. Inflorescence pseudolateral, congested into one or rarely two heads of 7-18 mm wide; bracts 2-4, main bract erect, 80-125 x 0.6-1.5 mm, other bracts spreading. Spikelets 12-50, 3.0-5.0 x 1.6-3.0 mm, brown; glumes 2.6-3.2 mm long, elliptic, dark chestnut brown, with many pale nerves, midrib excurrent as a slightly scabrid mucro 0.2-0.5 mm long. Perianth bristles 6, sparsely and antrorsely scabrid. Anthers 1.5-2.3 mm long. Nutlets 1.3-1.7 x 0.8-0.9 mm, triangular, elliptic, pale brown, surface smooth"
