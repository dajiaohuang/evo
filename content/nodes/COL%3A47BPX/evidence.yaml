      ecology:
        status: partially-supported
        claims:
          - text: All collections of N. vlokii are from sandy or loamy soils derived from sandstone. Most collections indicate seepages (although one is from well-drained soils), some even indicate permanently wet habitats. It seems that the species might need some seepage. It is sometimes locally dominant or at least common.
