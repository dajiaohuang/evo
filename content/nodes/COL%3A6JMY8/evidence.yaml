        usage:
          title: Freziera candicans Tul., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Tree, sometimes shrub, 5-18 m high, the trunk to 35 cm in diam, the branchlets densely appressed-sericeous when young. Leaves long-petiolate, the petiole to 1.8 cm long, markedly canaliculate above, glabrous above, appressed-sericeous beneath; blade narrowly ovate to ovate or narrowly elliptic to elliptic, long-attenuate to acute and narrowly decurrent at the base, + long-acuminate at the apex, to; 13 cm long and 5.5 cm wide, rigid-chartaceous, discolor, the margins entire to subserrulate, glabrous above, densely lustrous-appressed-sericeous beneath, the midvein promi- nent beneath, the lateral veins numerous and prominulous on both surfaces. Flowers axillary, in fascicles of 3-7, polygamous, the pedicels to 8 mm long, ap- pressed-sericeous, the bracteoles sepaloid, subcircular, ca 2-3 mm long, sericeous; sepals concave, subcircular to broadly ovate, acute, to 5 mm long, sericeous out- side; petals white or yellowish-white, broadly-ovate, rounded to ? cuneate, to 8 mm long and 5 mm wide, glabrous; stamens unequal in length, the filaments to 2.5 mm long, the anthers ca 1 mm long, minutely mucronulate at the apex; ovary ovoid, glabrous, 3-5-celled, the stigmas 3-5, spreading. Fruits globose, to 7 mm in diam, dark brown, 3-5-celled, many-seeded.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 13444
