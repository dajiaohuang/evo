        usage:
          title: Solanum rovirosanum Donn.Sm., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrub or small tree to 7 m tall; twigs stout, glabrous or minutely puberulent. Leaves large, ovate or elliptic, to 30 cm long, narrowed at each end, glabrous above, beneath glabrous or minutely puberulent, the midvein prominent; petiole stout, 1-5 cm long; minor leaves not evident. Inflorescence terminal or axillary, a once or twice branched cyme of secund, elongating, flexuous racemes which bear conspicuous pedicel scars, the pedicels filiform, 6-9 mm long, becoming thicker and slightly longer in fruit. Flowers small, the calyx 1-2 mm long, campanulate, splitting about halfway down into mucronulate lobes, glabrous and mostly drying russet; corolla white, drying orange-brown, ca. 6 mm long, deeply lobed, the lobes lanceolate; filaments united into a tube ca. 1 mm long, glabrous, each filament flattened but not narrowed apically, adnate to the full breadth of the anther base, but not extended over the dorsal surface of the anther, the anthers stout, dorsally flattened, 3-4 mm long, opening by large terminal pores which are tardily confluent with longitudinal slits; ovary elliptical with a few small hairs on top, the style pubescent, the stigma placed 1.5 mm beyond the anther tips. Fruit globose, to 10 mm across (immature), flattening in the press.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 13340
          archiveSourceId: 46B38201-497D-4CF2-908D-4C9287E392B9
