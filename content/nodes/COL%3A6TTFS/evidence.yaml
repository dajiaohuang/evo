        usage:
          title: Paullinia glomerulosa Radlk., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Tendrilled lianas; stems terete, glabrous; tendrils forked; wood simple. Leaves ternate-pinnate, 10-25 cm long, usually with 11(-15) leaflets (the lower set of pinnae biternate), glabrous except for the upper side of the petiole, rachis and midrib, as well as the lower midrib and major veins; petioles 1-6.5 cm long, mar- gined or narrowly winged, margins wider upwards; leaflets lanceolate, acuminate, acute to attenuate at the base, subsessile, 1.5-10 cm long, 1-3 cm wide, ciliate, both surfaces often with granular punctations, entire or serrate-dentate in the up- per half; stipules linear-lanceolate, to 1 cm long; foliage of young plants gray green. Thyrses aggregated, glomerate, less than 2 cm long, in leaf axils or on leaf- less stems, these often near the ground; pedicels ca. 4 mm long. Flowers white, ca. 3 mm long; sepals glabrous, orbicular to obovate and petaloid, to 3 mm long, spreading; petals narrowly obovate, ca. 3 mm long, sparsely granular-puberulent, the scales broader than the petals, ca. half as long, glabrous except for the villous margin, those of the anterior petals with simple orange crests, the deflexed ap- pendage densely pubescent on the truncate lower margin only; anterior disc glands glabrous, ca. 1 mm long, ca. twice as long as broad; stamens with the filaments glabrous, somewhat flattened, united in the lower half; styles 3, short. Capsules suborbicular, sessile, glabrate, 1-1.5 cm long, reddish, with 3 narrow wings to 4 mm wide; seeds solitary, black, shiny, ca. 7 mm long, sparsely and softly pubes- cent with short trichomes, subtended by a white fleshy aril.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 12527
