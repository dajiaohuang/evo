        usage:
          title: Vismia macrophylla Kunth, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Tree or rarely shrub, 2-25 (-43) In tall; bark grayish-rufous, flaking; sap orange (? to yellow); branches densely to sparsely ferrugineous-tomentose, grayish in age, with appressed-stellate to dendroid hairs, glabrescent. Leaves with petiole 10-25 mm long, ferrugineous-tomentose; lamina 10.0-40.0 cm long, 6.0-16.3 cm wide, narrowly oblong to lanceolate or ovate, the apex shortly acuminate to apiculate, the base deeply cordate to almost rounded, coriaceous, lustrous or dull above, greenish beneath, the lateral veins 12-31, red, uniting in submarginal loops, often with 1-2 short intermediate lateral veins, and with coiispicuous reticulate venation beneath, the glandular dots dense, sometimes obscured by the indumentum, the indumentum of dense to sparse stellate to dendroid ferrugineous hairs, especially on the veins, not obscuring the finely papillose epidermis. In- florescences terminal, many flowered, pyramidal, 5-6(-7) -noded, with reduced leaves at the lowermost 1(2) nodes, without axillary accessory branches; rachis and pedicels shortly to floccosely ferrugineous to dark brown tomentose, glabres- cent or not; buds cylindric to obovoid. Flowers heterostylous; sepals 5-6 mm long, free to near the base, the outermost ca. 3 mm wide, oblong or elliptic- oblong, rounded, the exposed surfaces densely whitish-papillose, densely to sparsely ferrugineous- to dark-brown-pubescent with stellate-dendroid hairs, the inner margins fimbriate, with broad glandular lines or streaks and submarginal dots, erect in fruit; petals white or greenish white to cream, 10-13 mm long, 2.0-2.5 mm wide, ca. 2 times as long as the sepals, narrowly oblong-lanceolate, recurved near the apex, distally glandular-punctate, internally whitish-villous; stamen fascicles free, persistent, with ca. 25 stamens, proximally whitish-villous, as long as the sepals (dolichostyly) or petals (brachystyly); staminodial fascicles persistent, ca. 2 mm long, liguliform, distally pilose; ovary ca. 2.5 mm long, pentagonal-subglobose, distally glandular-punctate, glabrous, with the styles equaling the sepals (brachystyly) or petals (dolichostyly), the stigmas broadly capitate to recurved-bifid. Fruits green to olive brown or reddish, 12-14 mm long, 11-13 mm wide, broadly ovoid-subglobose to globose, glabrous; seeds dark reddish brown, 2.5-3.5 mm long.
          originalLanguage: en
          sourceField: general
