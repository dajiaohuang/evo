    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Glandular-hairy annual to 37 cm. Leaves ovate-oblanceolate, often seemingly fascicled below. Flowers in crowded heads rapidly elongating into spikes, blue or mauve with yellow patch at base of upper lobes.
            sourceIds:
              - sanbi_14441_0
            locator: "SANBI/WFO archive Morphology row 5916; source 14441.0; publication: Manning, JC; Goldblatt, P. 2012. Scrophulariaceae: Phyllopodium Benth. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 750 - 752. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Phyllopodium multifolium and P. elegans grow together on the Potteberg, where the obvious difference in flower colour (mauve in P. multifolium, white in P. elegans) has induced collectors to take both. In this locality (and also further east, at Silver River) P. multifolium tends to have much broader basal leaves than P. elegans (up to 12 mm broad, seldom exceeding 3 mm in P. elegans). There are also differences in indumentum, P. multifolium being more glandular than P. elegans and this often shows up well on the bracts; the corolla limb of P. multifolium tends to be larger than that of P. elegans (4.5-7 mm across versus 4-5 mm), reflected in the size of the lobes (e.g. anticous lobe 2-3.2 mm long in P. multifolium, 1.75-2 mm in P. elegans).Both species are readily mistaken for Selago, especially `S. heterophylla E. Mey.' of Rolfe's account in Flora Capensis 5(1), but they are of course easily distinguished by their ovaries, multiovulate in Phyllopodium resulting in a many-seeded capsule, biovulate in Selago, which produces two 1-seeded cocci.
            textZh: SANBI 条目提供了该种的鉴别特征。
            sourceIds:
              - sanbi_8611_0
            locator: "SANBI/WFO archive Diagnostic row 57321; source 8611.0; publication: Hilliard, OM. 1994. Manuleae, The: a tribe of Scrophulariaceae. Edinburgh University Press, Edinburgh. [All rights reserved]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
