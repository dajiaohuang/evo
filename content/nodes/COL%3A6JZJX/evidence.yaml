        usage:
          title: Gaultheria gracilis Small, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrubs 0.4-1.0 m tall, epiphytic or terrestrial; branches terete with brown, grayish or blackish, often fissured bark; branchlets terete, usually moderately to densely strigose with slender, antrorsely appressed, sharply pointed, often hya- line trichomes mostly 0.5-2.5 mm long, occasionally moderately to densely barbate with slender, strongly ascendent to divergently spreading, sharply pointed, golden brown to dark brown trichomes 1-4 (-5) mm long, rarely glabrate. Leaf blades coriaceous, elliptic to lance elliptic, mostly (3-)4-6(-8.5) cm long, (1-) 1.5-2.5(-3.4) cm wide, basally cuneate to rounded, apically acuminate to acute, minutely and indistinctly serrulate, the serrations often tipped by a slender, appressed bristle 1.0-2.2 mm long, above with sparce to plentiful ap- pressed, slender trichomes (0.5-)1.0-2.0 mm long, these often deciduous, their often reddish bases appearing as punctate glands, beneath usually more ob- viously and densely appressed setose, the slender, golden to reddish brown trichomes (1-)2-3 mm long; venation pinnate, the lateral veins strongly arching towards the apex, the connecting veins forming a conspicuously elevated reticulate pattern, usually less conspicuously so above; petiole subterete or somewhat flattened and grooved adaxially, warty or papillate, drying somewhat wrinkled, short pubescent or glabrate, often strigillose with trichomes 1.0-2.5 mm long, mostly 4-6 mm long, 1.0-1.5 mm in diameter. Inflorescence a raceme arising from the axils of the upper leaves; rachis irregularly ridged and grooved or terete, typically moderately to densely puberulent with soft, white trichomes, (2-)3-7 (-8) cm long, ca. 1 mm in diameter; floral bracts persistent, membranous to papyriferous, broadly elliptic to spatulate, somewhat cucculate, usually strongly divergent from the rachis, mostly 3-10(-14) mm long, 2-6 mm wide, markedly striate, ciliate and occasionally distally glandular fimbriate, thinly microscopically puberulous on both the surfaces or glabrous, white or greenish white to roseate; pedicels terete, finely striate, usually strongly divergent, but moderately to densely fine puberulous, 5-10(12) mm long, 0.4-0.6 mm in diameter; bracteoles 2, more or less alternate and borne variably in the median half of the pedicel, usually strongly divergent, papyraceous, linear to narrowly oblong, 2.0-4.5 mm long, 0.5-1.0 mm wide, minutely ciliate, creamy or greenish white to roseate. Flowers with the calyx sharply demarcated from the pedicel by a groove, the tube smooth, shallowly campanulate, 1.4-2.0 mm long, 2.2-3.5 mm in diameter, broadly rounded basally, the lobes 5, erect, ovate to deltoid, apically acute to acuminate, mostly 2.0-3.0 mm long, basally 1.8-2.5 mm wide, ciliate, the sinuses acute; corolla urceolate to conical, 4-8 mm long, about 3.0-4.0 mm in diameter just above the base, tapering above to 1.8-2.2 mm in diameter just below lobes, greenish, white to deeply roseate; moderately to sparsely beset with hyaline to golden tawny, strigillose trichomes 0.2-0.6 mm long, the lobes oblong to triangu- lar, 1.0-1.5 mm long, slightly spreading to somewhat reflexed at maturity; sta- mens 10, the filaments distinct, finely papillate, 1.5-2.2 mm long, white, the thecae finely granular, 1.0-1.2 mm long, dehiscing by an introrse terminal cleft, each anther sac terminated by 2 extrorsely deflexed awns ca. 0.5 mm long; stigma truncate, the style persistent, glabrous, 2.5-4 mm long, the ovary 5-celled, sub- globose, usually glabrous. Fruit a 5-celled capsule 2.5-4 mm high, 3.5-5 mm in diameter.
          originalLanguage: en
          sourceField: general
