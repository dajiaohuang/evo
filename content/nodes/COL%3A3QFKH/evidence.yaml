    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants 200-500 mm high. Corm 7-10 mm diam.; tunics of medium-textured fibres, bearing short to long stolons up to 12 mm long, each with terminal cormlet. Stem simple or 1- or 2(3)-branched, branches subtended by ± dry, translucent brown, acute to attenuate bracts and prophylls 1.5-4.0 mm long. Leaves 3, lower 2 ascending to falcate, up to 4 mm wide, uppermost leaf mostly entirely sheathing stem. Main spike 3- to 5-flowered, lateral spikes 2- or 3(-5)-flowered; bracts membranous, dark translucent brown, 6-11 mm long, outer 3-veined and 3-toothed, inner 2-veined and 2-toothed, ± as long as outer. Flowers pale pink or white, pale yellow in tube, tepals sometimes flushed pink or light purple outside, scented faintly of fresh coriander; perianth tube funnel-shaped, 5-7 mm long; tepals ascending below, spreading above, ovate, 10-15 x 5-8 mm Filaments 6-8 mm long, exserted ± 3.5 mm from mouth of tube; anthers 4-5 mm long. Style dividing opposite middle 1/3 of anthers, branches 1.5-2.0 mm long.
            textZh: Ixia brunneobractea G.J.Lewis 的 SANBI 物种条目记录了形态特征。
            sourceIds:
