            locator: "SANBI/WFO archive Morphology row 98236; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Immediately recognised by its unusually dark floral bracts, which although membranous and semi-translucent, are a glossy dark chestnut-brown. The pale pink or white flowers have a funnel-shaped perianth tube 5-7 mm long and spreading tepals 10-15 mm long. An unusual feature of the species is the production of stolons from the base of the corm, each bearing a small cormlet. The production of cormlets on stolons is relatively rare in Ixia; the only other species of sect. Morphixia that have stolons, I. oxalidiflora and I. sobolifera, both allied to I. rapunculoides, appear to have evolved this capacity independently and both favour heavier soils of clay or clay loam.
