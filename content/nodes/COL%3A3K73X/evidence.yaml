    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Perennial herb up to ±1 m high, stem from a creeping woody stock, crown brown silky-woolly, sparingly branched low down, slender, woody, brittle, often zigzag, thinly greyish white-woolly, leafy throughout. Leaves up to 100 x 20(-30) mm, smaller upwards, oblanceolate or oblong-elliptic, lanceolate upwards, apex more or less acute, base broad, cordate-clasping, both surfaces greyish-white woolly, often drying fulvous, sometimes glabrescent, wool then clinging to the three prominent nerves. Heads homogamous, narrowly campanulate, ±6 x 3 mm, many in tight corymbose clusters corymbosely arranged. Involucral bracts in ±6 series, graded, closely imbricate, woolly, inner acute, glossy, lemon-yellow, about equalling flowers, not radiating. Receptacle with fimbrils about equalling ovaries. Flowers 8-15. Achenes 1 mm, faintly ribbed, glabrous. Pappus bristles many, about equalling corolla, scabrid, bases cohering by patent cilia.
