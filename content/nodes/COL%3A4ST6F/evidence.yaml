    facets:
      morphology:
        status: partially-supported
        claims:
          - text: "Perennial herb, 0.27-1.21 m high, long-rhizomatous. Leaf blades 2.5-3.5 mm wide. Culm nodose, 3-angled, 1.8 mm in diam. Inflorescence an anthela, heads 8-15 mm in diam., with many crowded spikelets. Subtending bracts 3, lowermost erect, leaf-like. Spikelets lanceolate, 4-5 mm long, ± 3-flowered, lower 1 or 2 flowers bisexual, upper 1 or 2 flowers male. Glumes: fertile lanceolate, 4-5 mm long, keel non-excurrent or excurrent into very short awn. Perianth of 6 antrorsely scabrid light brown bristles longer than nutlet, persistent on nutlet after dispersal. Flowering time Dec., Jan. Nutlet obovate, excluding style base 2 mm long, biconvex, brown, shoulders antrorsely scabrid, crowned with persistent, whitish, scabrid style base, surface very finely rugose."
