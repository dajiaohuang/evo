            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
          - text: Distinguished in sect. Gynandriris by the relatively large flower, the outer tepals 23-30 mm long and style crests 8-12 mm long, M. australis otherwise closely resembles the widespread M. setifolia. The latter, an autogamous, weedy species has smaller flowers with outer tepals 12-18 mm long and style crests 4-7 mm long.
