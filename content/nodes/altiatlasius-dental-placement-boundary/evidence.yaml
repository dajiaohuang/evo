  claims:
    - subjectId: event:altiatlasius-dental-placement-boundary
      claimKind: scientific
      claimType: taxonomy
      statement: Altiatlasius is directly represented by a small Thanetian isolated-tooth hypodigm including holotype THR 141; tooth-locus assignments and its position near or outside crown Primates remain disputed.
      confidence: low
      confidenceRationale: "Low confidence applies to broad placement, not to the existence of the dental specimens: the sample is small, isolated and internally heterogeneous, and subsequent analyses have tested incompatible positions."
      referenceLinks:
        - referenceId: sige-1990-altiatlasius
          relation: supports
          pages: 31–56
          figure: Plate 1
          quoteLocator: Systematic description and comparisons of the isolated dental hypodigm
        - referenceId: hooker-1999-toliapinidae
          relation: contextualizes
          pages: 377–407
          figure: Cladistic analysis and systematic comparisons
          quoteLocator: Abstract and cladistic analysis recovering Altiatlasius within Toliapinidae
  claim-rationales.zh:
    - 低置信度针对广义系统位置而非牙齿标本本身；样本少、彼此孤立且内部不均一，后续分析也检验了互不相容的位置。
  claim-statements.zh:
    - Altiatlasius 的直接材料是一组很小的赞尼特期孤立牙齿标本，包括正模 THR 141；牙位归属及其位于灵长目冠群附近还是之外仍有争议。
