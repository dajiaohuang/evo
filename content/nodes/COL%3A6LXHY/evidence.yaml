    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Slender, tuberous geophyte to 50 cm, scape thinly hairy. Leaves 2, basal, ovate. Flowers many in a dense raceme, dimorphic, upper flowers with much longer petals and lip lobes, sepals green, petals and lip cream-coloured, petals with 5-10 filiform lobes, lip spurred and divided into 5-13 filiform lobes.
