    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Twiggy shrub to 1 m. Leaves oblong, erect or spreading, often recurved at tips, often gummy above. Flower heads radiate, few in dense, terminal umbels, with glandular-hairy florets, yellow.
            sourceIds:
              - sanbi_14184_0
            locator: "SANBI/WFO archive Morphology row 10738; source 14184.0; publication: Manning, JC; Goldblatt, P. 2012. Asteraceae: Oedera L. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 399 - 400. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: This species is closely allied to R. squarrosa and they are liable to be mixed up. R. genistifolia has typically spreading, linear, smaller leaves and urceolate-cyathiform, smaller, uniformly light yellowish brown involucres than R. squarrosa. Specimens with wider and somewhat irregularly bent leaves may be very similar to specimens of R. squarrosa with spreading leaves. They can be distinguished in the less slender achenes with longer pappus, more than 1/5 of the length of the achene, usually 1/3-1/2. Lastly, achenes of ray-florets are always ± densely pilose, never glabrous as they often, but not always are in R. squarrosa. R. viscosa is another closely related species. R. genistifolia, however, never has the thick, very glutinous leaves of R. viscosa and the capitula are usually smaller than in the latter species. This species varies considerably in leaf size and shape. The variation does not seem to be correlated with variation in other vegetative and floral characters. It is only possible to point out some general tendencies in leaf variation and geographical distribution.
            textZh: SANBI 条目提供了该种的鉴别特征。
            sourceIds:
