        usage:
          title: Rudgea amplexicaulis Dwyer, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Scandent shrubs to 1.5 m tall, the branches terete, moderately slender, smooth, glabrous, the nodes well spaced, scarcely turgid. Leaves sessile, nar- rowly obovate oblong, 5-15 cm long, 2-4 cm wide, acute to deltoid at the apex, truncate at the base, at times vaguely auriculate and amplexicaul, the costa prom- inulous on both sides, the lateral veins arcuate, the undulate submarginal vein only to 3 mm from the margin, about 2 smaller veins between 2 lateral veins, arising at right angles from the costa and soon branching, the intervenal areas patulous reticulate, chartaceous, scarcely discolorous, glabrous; stipules decid- uous, connate, cup shaped, to 1.5 mm long, scarious, scarcely swollen, glabrous with a few oblong glands, ca. 0.5 mm long. Inflorescences terminal, few flowered, glabrous, cymose paniculate, to 4 cm long, ca. 0.8 mm wide, the branches dis- posed as 2 well spaced, opposite pairs, each bearing one 3-flowered cymule; bracts patulous, ovate subulate, to 1.3 mm long. Flowers with the pedicels to 3 mm long; hypanthium oblong, ca. 2 mm long, glabrous, black when dry, the calycine cup ca. 1 mm long, the lobes triangular, to 0.35 mm long, acute, glabrous; corolla white, the tube narrowly cylindrical, scarcely attenuate basally, glabrous outside, the lobes 5, oblong, 5-6 mm long, minutely apiculate and vaguely cu- cullate. Fruits not seen.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 12242
