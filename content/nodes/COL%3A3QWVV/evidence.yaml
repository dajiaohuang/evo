            locator: "SANBI/WFO archive Morphology row 50366; source 15390.0; publication: Immelman, KL. 1995. 2. Siphonoglossa. In: OA Leistner (ed.), Fl. S. Africa 30(3): 6 - 10. National Botanical Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: The very long flowers and the length of the lower lip relative to the tube distinguish this species from S. leptantha subsp. leptantha. The flowers are most similar to those of S. linifolia which, however, is quite different vegetatively, as well as in habitat and distribution.
