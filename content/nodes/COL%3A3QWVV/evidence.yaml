    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Perennial herb. Branches ribbed, swollen at nodes. Leaves with hairs along veins of undersurface and on margin, lanceolate to ovate, 33-44 x 15-20 mm, apex drawn out into a long blunt tip, base cuneate; petiole hirsute, slender, 6-17 mm long. Inflorescence of axillary cymes. Bracts similar to leaves but smaller. Calyx hirsute, lobes narrowly lanceolate, acuminate. Corolla 34-45 mm long (tube and upper lip), purple or yellow-green; lower lip 0.5-0.6 times as long as tube. Stamens with thecae elongate, narrow, inserted at different heights, both shortly mucronate. Pollen 2-colporate, with 3 rows of raised areoles. Stigma bilobed. Capsule not seen.
            sourceIds:
