        claims:
          - text: Acaulescent geophyte. Leaves trifoliolate, glaucous, leaflets oblong, obliquely peltate, petioles and peduncles glandular-hairy. Flowers violet-pink, with a white centre and dark eye.
            sourceIds:
              - sanbi_14370_0
            locator: "SANBI/WFO archive Morphology row 7698; source 14370.0; publication: Bayer, B. 2012. Oxalidaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 633 - 640. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: This new species of Oxalis is remarkable in the genus on account of the colour of its corolla and the distinctive shape of its leaves. The corolla tube is wine-red with a white ring in the throat, the rest of the corolla being violet- pink. The glaucous leaflets are unusual for being obliquely peltate with the petiolule attached abaxially to the lamina. The leaflets are subparallel next to each other and not spreading. They are semiconduplicate in a broad V-shape with the basal portion above the petiole often partially funnel-shaped. O. oculifera falls within the Section Latifoliolatae. Within the section this species is probably most closely allied to O. petiolulata Bol. f. The bulbs in O. oculifera are quite different from those in O. petiolulata. In the former the bulb is small and ovoid, the tunics spliding with diagonal slits like an inverted V, whereas in the latter they are narrowly ovoid and attenuate with longitudinally splitting tunics. The leaflets in the new species are very distinctive. They are subparallel, adpressed and partially conduplicate. The glaucous-grey colour of the leaves is very striking in the living material. This is produced by numerous translucent, shortly papillate cells on the upper surface. The remarkable feature is the position of the point of attachment of the leaflet to the petiolule. In O. petiolulata the petiolule is attached at the base of the lamina. In O. oculifera the petiole is attached about one quarter of the way along the undersurface of the lamina which is thus semipeltate. In some leaflets the two sides of the basal portion of the lamina are a little more adnate producing a slightly funnelshaped base to the leaflet.
            textZh: SANBI 条目提供了该种的鉴别特征。
