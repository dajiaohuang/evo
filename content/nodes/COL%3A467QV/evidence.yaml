      morphology:
        status: partially-supported
        claims:
          - text: Like N. diffusa but more robust, to 1 m, leaves ovate, sharply toothed, calyx glabrous, flowers ± 9.2-12.0 mm long, upper lip white with lilac reverse, lower lip white with raised, white or greyish yellow palate, palate pubescent, spurs ± 3.4-4.1 mm long, basal half lavender to purple, distal half greenish yellow.
            sourceIds:
              - sanbi_14438_0
            locator: "SANBI/WFO archive Morphology row 6242; source 14438.0; publication: Steiner, KE. 2012. Scrophulariaceae: Nemesia Vent. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 748 - 750. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Nemesia elata is recognized by its small flowers that are white with a violet to purplish reverse, with one or more faint greyish blue lines at the base of the upper lip and a densely pubescent white or very pale yellow palate. Although N. elata is perennial, it does not have a strong root system and may occasionally die back to the ground if conditions become too dry. It can be distinguished from N. fourcadei by its perennial habit, the absence of a narrow invagination of the corolla tube near the spur opening, and the presence of violet to purple on the lower half of the spur. It can resemble N. melissifolia Benth. in fruit, because of the development of long internodes and the quasifasciculate capsules of robust specimens. However, that species is a bushy annual that has flowers with longer, narrower, acute spurs mostly 58 mm long, and a corolla tube with two bosses inside near the spur opening. N. elata is also similar to N. diffusa Benth. but that species is less robust, has a glandular-pubescent calyx, and more prominent blue-purple lines that extend more than halfway into the corolla lobes on both front and back.
            textZh: SANBI 条目提供了该种的鉴别特征。
