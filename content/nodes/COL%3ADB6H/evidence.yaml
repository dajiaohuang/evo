          title: Anacardium occidentale L., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Tree to 8(-10) m. Leaves ? aggregated toward the apex of the branchlets, the petioles 5-20 mm long; blades broadly oblong-ovate to somewhat obovate, obtuse to rounded or slightly emarginate at the apex, cuneate to obtuse or rounded at the base, glabrous, 6-15.5 cm long, 3.5-9 cm broad, with prominulous reticulation on both surfaces. Panicles 7-16.5 cm long, with gray pubescence; bracts usually at least sparsely puberulent, -those subtending the lower primary branches of the panicle oblanceolate or oblong and foliaceous (though much reduced in size), those subtending the distal branches and flowers or flower-groups ovate and resembling the calyx-lobes. Flowers with pedicels 0.5-7 mm long; calyx-segments lanceolate to lance-ovate, 2.5-5 mm long, 1-2.3 mm broad, moderately grayish-appressed- puberulent dorsally; petals linear to linear-lanceolate or narrowly linear-elliptic, 6-13 mm long, 1-2 mm broad, greenish-yellow with red streaks at anthesis, turning dark red with age; stamens 10, 1 much longer than the others and extending well beyond the point at which the petals become recurved, the filaments glabrous; ovary 0.2-0.5 mm long. Hypocarp red or yellow at maturity, to 10 cm long and 5 cm broad, ? obovate. Nut gray, 2-3.2 cm long, 1-2 cm broad.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 460
