    facets:
      morphology:
        status: partially-supported
        claims:
          - text: "Annual herb, stems 60-500 mm tall, up to c. 8 mm diam. at base, erect, simple at first, soon branched from the base and above, glandular-pubescent, hairs up to 0.5-1.8 mm long, some up to 0.1 mm diam. at base, very coarse scattered glands as well, c. 0.2-0.4 mm long, head 0.2-0.3 mm in diam., light brown. Leaves opposite at base, soon alternate upwards, up to c. 25-50 x 10-20 mm, blade narrowly ovate, apex acute, base cuneate tapering into a petiolar part, margins coarsely serrate, teeth mostly entire, both surfaces glandular-pubescent, hairs up to 0.4-1.8 mm long, longest on petiolar part, scattered small glistening glands as well, mostly on lower surface. Flowers solitary in leaf axils almost from base of plant. Pedicels up to 13-55 mm long, glandular-pubescent, hairs up to 0.25-1 mm long, some short coarse glands as well, heads c. 0.2 mm across. Calyx tube 0.2-0.3 mm long, lobes 4.5-6.5 x 0.7-1 mm, elongating somewhat in fruit, narrowly oblong, subacute, glandular-pubescent, hairs up to c. 0.15-0.6 mm long. Corolla tube 12.6-20 x 2.2-3 mm in throat, cylindric, abruptly expanded near apex, mouth laterally compressed, limb nearly regular, c. 12-17 mm across lateral lobes, posticous lobes 4-8 x 3.4-7 mm, anticous lobe 4-7 x 3.4-6 mm, all lobes obovate to cuneate, apex ± truncate or slightly emarginate, glandular-puberulous outside, hairs mostly less than 0.1 mm long, broad band of clavate hairs in throat extending very briefly onto base of anticous lip, lobes white, throat orange or golden yellow, the colour radiating into 3 points at base of each lobe, each point tipped with a dark violet streak. Stamens: posticous filaments 1-2 mm long, anthers 1-1.5 mm long, anticous filaments 0.4-0.8 mm, anthers 0.6-0.8 mm, all filaments minutely puberulous. Stigma 0.6-1.5 mm long. Style 9.5-14.5 mm. Ovary 2.5-3.8 x 1-1.8 mm. Capsules 5.5-10 x 3.2-5 mm, glandular-puberulous. Seeds c. 0.6-0.8 x 0.3-0.4 mm."
            sourceIds:
