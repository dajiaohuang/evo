          - text: "Jamesbrittenia megadenia derives its trivial name from the relatively huge glands that dot the pedicels and stems: under a lens they look like miniature mushrooms. Although this whole group of species is notable for coarse glandular hairs, those of J. megadenia are outstanding and at once distinguish the species from its allies; J. glutinosa may have hairs almost as gross, but it is easily distinguished by its greatly reduced anticous anthers. Jamesbrittenia aridicola differs not only in its lack of huge glands but also in its decidedly notched corolla lobes."
