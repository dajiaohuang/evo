    facets:
      morphology:
        status: partially-supported
        claims:
          - text: The report describes the Laysan albatross as a medium-sized species weighing about 3.2 kg, with reported lengths of 79–81 cm and wingspans of 195–203 cm; it notes males average about 10% heavier than females. It describes a dark sooty-brown upper surface, white head and underparts, pinkish-orange bill with a grey tip, and individual variation in the black-and-white underwing pattern.
            originalLanguage: en
            sourceIds:
              - usgs2009
            locator: Species’ Descriptions, Laysan albatross entry (report text gives Harrison 1985 as the measurement source)
            placeTimeScope: Description compiled in a 2009 North Pacific status assessment; measurement and sex-comparison sampling details are not supplied in this entry, and the report cites Harrison 1985.
            lifeStatus: Species-level account of wild birds; age-specific pattern differences are summarized but not comprehensively sampled here.
        gaps:
          - Measurement protocol and sample sizes, full sex and age variation, population variation, and diagnostic limits have not been assessed.
      lifeHistory:
        status: partially-supported
        claims:
          - text: The report characterizes both assessed albatross species as long-lived seabirds with deferred maturity, low fecundity, and high adult survival, and says these traits make populations sensitive to small increases in adult mortality.
            originalLanguage: en
            sourceIds:
              - usgs2009
            locator: Executive Summary, first paragraph
            placeTimeScope: General life-history characterization in a 2009 regional assessment of North Pacific populations; no quantified species-specific age or reproductive schedule is stated in this passage.
            lifeStatus: Wild population context; captive life history not covered.
        gaps:
          - Age at first breeding, annual cycle, pair behavior, egg and chick development, breeding success variation, and species-specific rates need source-level review.
      ecology:
        status: partially-supported
        claims:
          - text: The report describes Laysan albatrosses as open-ocean birds that come to land to breed, and identifies bycatch in commercial fisheries as a major anthropogenic source of post-fledging mortality in the assessment period.
            originalLanguage: en
            sourceIds:
              - usgs2009
            locator: Executive Summary, first and second paragraphs; Geographic Distribution, Breeding Colonies
            placeTimeScope: North Pacific population evidence synthesized in 2009, with status analyses ending in 2005; threat descriptions are historical to the source's review period and are not asserted as current rates.
            lifeStatus: Wild birds and breeding populations; the source distinguishes at-sea and colony threats.
        gaps:
          - Diet, foraging behavior, prey and competitor interactions, habitat requirements by life stage, and study-specific sampling conditions have not been reviewed comprehensively.
      evolution:
        status: not-assessed
        gaps:
          - No species-level phylogenetic or comparative evolutionary study was assessed.
      distribution:
        status: partially-supported
        claims:
          - text: The report states that more than 99% of the world's Laysan albatrosses nested in the Northwestern Hawaiian Islands in its assessment and lists the core breeding sites there; it also describes the species as foraging throughout the North Pacific and nesting on oceanic islands from Mexico to Japan.
            originalLanguage: en
            sourceIds:
              - usgs2009
            locator: Executive Summary, first paragraph; Geographic Distribution, Breeding Colonies
            placeTimeScope: A 2009 synthesis with island occurrence and population evidence through 2005; the stated proportion and range are source-era summaries, not a present-day global atlas.
            lifeStatus: Wild breeding and foraging range; introduced or captive occurrences are not addressed.
        gaps:
          - Dated locality records, current range, nonbreeding distribution, geographic precision, native or introduced status outside breeding sites, and unsampled areas need review.
      fossil:
        status: not-assessed
        gaps:
          - No bounded fossil-record search was conducted.
      conservation:
        status: not-assessed
        gaps:
          - Historical legal or threat discussion in the report does not establish a current conservation assessment; no current qualifying assessment was reviewed.
