    facets:
      morphology:
        status: partially-supported
        claims:
          - text: "Cormous herb, up to 2 m high; plants solitary, in small tufts, or in extensive colonies. Flowers: bracts 5-8 mm broad, veins crowded, tip of each bract reaching at least to base of second bract above it; anthers 5-8 mm long; perianth with segments up to 15 x 6.5 mm, bright pink, sometimes white; Nov.-Feb."
            textZh: Dierama cooperi N.E.Br. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_16273_0
            locator: "SANBI/WFO archive Morphology row 68684; source identifier 16273.0; cited publication: Retief, E; Meyer, NL. 2017. Iridaceae. In: E Retief & NL Meyer (eds), Plants of the Free State: Inventory and identification guide, Strelitzia 38: 934 - 956. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: A solitary-stemmed or tufted species with pendulous spikes of relatively small, often bright pink flowers, the perianth 16-23 mm long with a tube 5.0-7.5 mm long and characteristic bracts with ± 6 secondary veins each side of the main vein and well-developed intermediate veins, the veins all parallel and so close together that the base of the bract appears almost solid. The primary spike has 8 to 13 flowers. Dierama robustum has the bract veins further apart and mostly paler, slightly larger flowers, the tepals 17-26 x 7-12 mm and the tube 7-12 mm long. The two species probably hybridise in northern Lesotho and neighbouring Free State.
            textZh: SANBI 条目提供了 Dierama cooperi N.E.Br. 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 94758; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
