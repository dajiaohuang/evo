        claims:
          - text: Erect, tufted shrub-like perennial to 800 mm high, glaucous; rhizomes short, strong; culm hard, brittle, much branched, nodes thickened and swollen, often bulbous. Leaf blade to 100 x to 6 mm. Inflorescence open, sparsely branched, primary branches with long naked bases bearing spikelets crowded towards the apex. Spikelet 2.5-3.0 mm long, often flushed purple; lower glume broadly ovate, up to 1/2 the length of spikelet; upper glume 7-9-nerved; lower floret male or sterile; lemma 9-nerved, palea well developed; upper lemma pale-yellow to brown, shiny.
