          - text: It climbs over shrubs and trees in open to dense, moist to drier mountain side, hill or riverine forest and in savanna. As far as habitat is concerned it is found in the coastal flats as well as the inland valleys, plateaux and mountains on soils that vary from black clay to greyish sands.
