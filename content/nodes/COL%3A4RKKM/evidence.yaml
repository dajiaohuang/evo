    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Perennial or annual climber with one to few main stems. Tuber up to 0.3 m diameter, spindle-shaped. Aerial stems perennial or may die back at the end of growing season, up to 2 m long, velutinous, interpetiolar ridges often dentate, branching lateral. Leaves spreading, petiolate; petiole 1-15 mm long; blade 30-110 x 5-15 mm, obovate, narrowly obovate or ovate, above velutinous to glabrous, beneath velutinous, margin usually undulate, secondary veins patent to divaricate and 13-18 to a side, apex acute, obtuse or truncate-mucronate, base cuneate to obtuse. Inflorescences sub-terminal, panicle of monochasia, each monochasium 3-5-flowered, velutinous, peduncles 5-20 mm long, pedicels 2-6 mm long; bracts 2-3 mm long, narrowly ovate. Sepals 2-4 x 1-2 mm, ovate, outside velutinous, acute to obtuse, apex acute. Corolla with outside velutinous; tube 2-3 mm long, campanulate; lobes reflexed, 5-7 x 2-3 mm, oblong-ovate to ovate, insides yellow-green with reddish to purple triangular spot at base, apex obtuse to acute. Corona white, coronal feet free, tri-partite; central lobe 4-10 mm long, filiform with dilated base, apex tortuose, papillose; lateral lobes 2-3 mm long, corniculate. Stamens from inner base of coronal feet; filaments ±2 mm long, filiform; anthers ±2 mm long, ovate, white, full length slits, apex acute. Ovaries ±1 mm long; style ±1.5 mm long, terete; style-head ovoid, ±1.5 mm long, obtuse; translators ±2.1 mm long, spoon elliptic. Gynostegium in corolla mouth. Follicles paired, pendulous, seldom solitary, 50-100 x ±10 mm, cylindrical-ovoid, puber- ulous. Seeds 6-7 x 2 mm long, obliquely ovate, coma 10-20 mm long. In South Africa the species flowers from October to February, but flowering specimens were collected even in June. However, in Kenya it flowers around March.
