    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants viscid, rank smelling, 20-130 cm; stems ±pilose and stipitate-glandular. Leaf blades linear to lance-linear, 1-3(-7) cm x 1-3(-10) mm, margins entire or denticulate, apices acute, faces pilosulous to hirtellous and minutely stipitate-glandular. Phyllaries 1-8 mm. Ray florets (6-)10-12(-16); corolla laminae 2-5(-7) mm. Disc florets 9-14+; corollas 3-4 mm. Cypselae 1.5-2.0 mm; pappi 3-4(-5) mm.
