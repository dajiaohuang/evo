            locator: "SANBI/WFO archive Morphology row 50548; source 9724.0; publication: Killick, DJB. 1976. Flacourtiaceae (including Samydaceae), Fl. S. Africa 22: 53 - 92. BRI, Dept. Agric. & Tech. Services, Pretoria. [CC BY]"
