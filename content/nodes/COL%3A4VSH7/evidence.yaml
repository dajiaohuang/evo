    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Tree up to 13 m high, 23 cm d.b.h., spines on young plants and coppice shoots. Branchlets glabrous, puberulous at apex. Leaf-blade rhombic-elliptic (coppice shoot leaves ovate), 2-3 cm long, 1-1.7 cm wide, apex acuminate, base cuneate (wedge-shaped), margin distantly serrate-crenate, teeth callose, midrib prominent below, lateral veins 5-6 pairs, subimmersed, coriaceous, glabrous; petiole 2-4 mm long, red, thickish. Flowers solitary in leaf axils, sessile, bracteolate at base, (4)5-merous. Sepals narrowly elliptic to broadly ovate, slightly concave, 2-2.5 mm long, 1-2 mm wide. Petals not seen. Disc annular, of orange-coloured, fleshy lobes, 0.5 mm long, glabrous. Stamens 15-25; filaments 2.5-3 mm long, glabrous; anthers oblong, 0.5 mm long, sometimes with short black bristles. Ovary ellipsoid to ovoid, 2-3 mm long, 2 mm wide, glabrous; ovules 3; style 2.5-3 mm long, glabrous; stigma bilobed with each lobe faintly bilobed. Fruit not seen.
            sourceIds:
