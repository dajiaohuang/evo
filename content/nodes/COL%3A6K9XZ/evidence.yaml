    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants acaulescent, decumbent to erect, 15-40 mm high, prolific from the base to form small dense groups up to 80 mm in diameter, rarely solitary. Roots succulent, up to 4 mm in diameter. Leaves distichous, 25-55 mm long and 20-23 mm broad at the base, lorate, erectly spreading often becoming patent or recurved (the apices incurved during the dry season); adaxial surface plane or convex; abaxial surface convex; epidermis with dense white cartilaginous tubercles; tubercles very dense, domed to spherical and confluent, forming a dense reticulation; margin crenulate, becoming continuous towards apex; apex obtuse, truncate or retuse, mucronate. Juvenile leaves lorate, tuberculate and slightly asperulous. Inflorescence racemose, 80-350 mm tall, erectly spreading occasionally with a pair of side branches, bearing 15 to 25 flowers; scape 3-4 mm in diameter at the base, reddish pink; bracts 5 mm long, 1 mm broad at the base; pedicel 5 mm long. Perianth 14-16 mm long, stipitate for 1 mm, gasteriform basally for two-thirds of its length, thence abruptly constricted to a tube 3-4 mm wide; gasteriform portion red-pink, 6-7.5 mm in diameter; tube white with green striations, 5 mm long; segments free for 5 mm at apex, greenish white with dark green median striations, apices erectly spreading, obtuse; inner perianth segments canaliculate for the length of the gasteriform portion. Stamens included; anthers oblong 1.5 mm long. Ovary 4 mm long, 1.75 mm in diameter; style 5 mm long; stigma capitate, included. Capsule 14-17(-20) mm long. Seeds oblong 4 mm long, 3 mm wide. Flowering time September to October.
