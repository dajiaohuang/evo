          - text: Gasteria baylissiana is a beautiful, slow-growing dwarf species, characterized by its densely tuberculate, lorate, erectly spreading leaves and its reddish pink, much inflated gasteriform perianth. It is prolific from the base and forms small dense groups, but new plants will also proliferate from leaf fragments lying on the ground. The leaf apex is obtuse or retuse. The plants are variable in tubercle density as well as leaf size. Plants in light shade or sunny situations have short compact leaves, but those in dense shade develop longer, linear, lorate leaves. The tubercles on the leaves are cartilaginous, white and translucent and very dense in plants occurring in sunny situations. Apart from the phenotypic plasticity, plants also exhibit some genetic variation. In 1977 Rauh reported a more vigorous form with elongated leaves of up to 100 mm long producing up to three inflorescences a season. In cultivation plants soon adapt to the availability of light. In floral characteristics G. baylissiana closely resembles G. bicolor var. liliputana which occurs on the same mountain chain, but the leaves of the latter are smooth, usually linear, lanceolate, and spirally arranged. Superficially G. baylissiana also resembles G. nitida var. armstrongii and small forms of G. carinata var. verrucosa, but the latter two species are distinguished by their much larger, differently shaped perianths.
