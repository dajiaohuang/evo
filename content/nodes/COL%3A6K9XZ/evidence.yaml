      ecology:
        status: partially-supported
        claims:
          - text: The plants are confined to an upper eastern slope at an altitude of 750-800 m, growing on quartzitic sandstone. The rocky krantz where the plants are found is densely overgrown with subtropical thicket, but the habitat also contains elements of other veld types. The plants occur singly or in small dense groups, wedged into the vertical rocky crevices, as well as on a steep hill in dense shade below the rock face. They share the habitat with other succulents, for the soil is rich in humus and well drained.
