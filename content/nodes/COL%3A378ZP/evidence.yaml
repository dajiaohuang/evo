            locator: "SANBI/WFO archive Morphology row 1763; source 11118.0; publication: Herman, PPJ; Retief, E. 1997. Plants of the northern provinces of South Africa: Keys and diagnostic characters. Strelitzia 6: 1 - 681. National Botanical Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: This species closely resembles D. burgessiae and the areas of distribution of the two species overlap in part, but D. pulchra is restricted to the cooler regions with higher rainfall in the eastern Transvaal and Swaziland. D. burgessiae is widespread, from the Natal coast through Swaziland and the eastern Transvaal to the tropics. A few intermediate or hybrid specimens were seen from localities in which the areas of distribution overlap.
