        claims:
          - text: Shrub, up to 4 m high. Leaves distinctly discolorous, lower surface metallic-grey with short dense indumentum of fine hairs giving it a felted appearance. Petals 12-20 mm long. Flowers white with red centre, turning light cinnamon-rufous with age.
            sourceIds:
