          title: Piper taboganum C.DC., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: A shrub, mostly 1-3 m. tall; upper internodes rather short and slender, soft- villous, crisp-pubescent, or subhispid, more or less canescent; leaves rhombic- subobovate, elliptic, or less commonly lance-elliptic, mostly 4-6 cm. wide X 10-15 cm. long, or occasional leaves up to 9 X 22 cm., apex acuminate, narrowed down- ward to the inequilaterally rounded base, one side commonly 2-5 mm. shorter, the longer side obtuse or cordulate, pinnately nerved from below the middle, the nerves 5-6 or sometimes 7 on each side, often slightly rugescent near the margin or toward the base, crisp-hirtellous or subhispid above with the midrib densely so, somewhat scabrous from the persistent hair bases, soft-pubescent beneath, the nerves usually densely so, the hairs appressed, drying rather thin, translucent; petiole 5-10 or occasionally up to 20 plus 2-5 mm. long, densely hairy, vaginate commonly to the middle or above, the groove smooth or hairy within; spikes scarcely 1 cm. long when young and more or less bristly from the suberect bract hairs, becoming 3-4 mm. thick X 4-10 cm. long, commonly apiculate; peduncle mostly 5-10 or oc- casionally up to 20-25 mm. long, pubescent; bracts rounded or triangular-sub- peltate, marginally fringed, the hairs rather stiff, those on the dorsal margin usually longer and suberect in young spikes; fruit oblong-subtrigonous, glabrate or slightly papillate when young; stigmas small, sessile.
