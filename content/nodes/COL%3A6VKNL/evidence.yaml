          originalSourceText: A glabrous, nodose shrub; upper internodes relatively short and slender; leaves lance- or ovate-elliptic, apex moderately acuminate, base subequilateral, the margin equal at the petiole or with one side commonly 1-5 mm. shorter, acute or occasion- ally with the longer side subcordulate, 4-7 cm. wide X 10-14 cm. long, pinnately nerved from below the middle, the nerves 3-5 on each side, with fine, cross- connecting-anastomosing nervules, glandular-dotted beneath, drying rather papery, translucent; petiole 10-25 plus 1-5 mm. long, vaginate to the blade; spikes up to 4 mm. thick X 9 mm. long, mucronate; peduncle 5-8 mm. long; bracts concave- inflexed, glabrous; ovary glabrous, stigmas sessile.
