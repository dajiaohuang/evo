    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, 45-90 mm tall, with up to 5 short branchlets. Leaves 3, lower 2 linear, with thickened margins, upper leaf sheathing stem. Flowers mostly 2-4 per spike, facing to side, white suffused with palest blue, tube widely funnel-shaped, up to 5 mm long, tepals spreading; anthers well exserted from tube.
            textZh: Ixia linearifolia Goldblatt & J.C.Manning 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_14562_0
            locator: "SANBI/WFO archive Morphology row 33264; source identifier 14562.0; cited publication: Goldblatt, P; Manning, JC. 2013. Iridaceae. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 94 - 124. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: The short perianth tube, ± 5 mm long, flowers with outspread tepals and exserted filaments with prominently displayed anthers, and the several short lateral branchlets closely resemble Ixia marginifolia, but the leaves of I. linearifolia are quite unlike the short, broad, falcate leaves of that species. Instead the leaves are linear and about half as long as the stems, the latter mostly 45-90 mm high. The pale white flowers have a faint blue cast and the tepals have pale green marks at their bases. Unlike I. marginifolia the leaf margins are not prominently thickened and hyaline but instead are raised forming slightly fleshy, ridge-like wings without hyaline edges. The flowers of I. linearifolia are slightly larger than those of I. marginifolia with tepals 15-16 x 6.5-7.5 mm compared with (7-)10-13 x 5.5-8.0 mm.
            textZh: SANBI 条目提供了 Ixia linearifolia Goldblatt & J.C.Manning 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 95066; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
