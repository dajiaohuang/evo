    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Slender, tuberous geophyte, up to 260 mm tall, scape glabrous. Leaves 2, basal, ovate, glabrous. Flowers many in a dense raceme, sepals green, petals and lip greenish white, petals trilobed, lip with 5 lobes and spur up to 11 mm long.
            textZh: Holothrix filicornis Immelman & Schelpe 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_14565_0
            locator: "SANBI/WFO archive Morphology row 33414; source identifier 14565.0; cited publication: Kurzweil, H. 2013. Orchidaceae. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 125 - 128. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: This species together with the montane Holothrix scopularia is unusual among the southern African species of Holothrix in having divided petals together with an ebracteate scape. The petals in these two species are always trilobed instead of having a variable number of lobes as is the case with the other species having divided petals. The very long spur, the less strongly secund spike and the different distribution and habitat however easily distinguish H. filicornis from H. scopularia.
            textZh: SANBI 条目提供了 Holothrix filicornis Immelman & Schelpe 的鉴别特征。
            sourceIds:
