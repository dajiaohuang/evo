    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte to 12 cm, tunics woody, imbricate, stem sparsely short-hairy. Leaves ± plane, margins and central vein narrowly winged. Flowers in a 1-3-flowered spike, zygomorphic, blue-mauve, upper tepals purple at base, stamens unilateral, declinate, filaments unequal.
            textZh: Geissorhiza reclinata Goldblatt & J.C.Manning 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 6838; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: The dark brown, overlapping corm tunics and unequal filaments place Geissorhiza reclinata in subg. Geissorhiza, where it was initially compared with the Cape mountain species G. pseudinaequalis and G. scopulosa of sect. Monticolae partly because of the zygomorphic flowers with unilateral, declinate stamens and style and the upper tepals with dark markings near the base. However, it has pollen grains with specialised apertures known only in sect. Ciliatae, where it may be allied to G. heterostyla subsp. heterostyla, also with zygomorphic flowers. The sparsely short-hairy stems and leaves with the margins and central vein winged with ciliate wing edges likewise are consistent with G. heterostyla and other species of sect. Ciliatae. Unusual in subg. Geissorhiza, the basal leaves are prostrate and the stamens are unusually long, the two long filaments 10-12 mm long. The relatively large flowers have a perianth tube ± 2 mm long and tepals 14-16 mm long.
            textZh: SANBI 条目提供了 Geissorhiza reclinata Goldblatt & J.C.Manning 的鉴别特征。
