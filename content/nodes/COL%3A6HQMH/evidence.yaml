    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, 70-200 mm tall, unbranched or with a few short branches. Leaves overlapping in a tight fan, the sheaths enclosing the stem, blades oblong, obtuse, shorter than the sheaths. Flowers pale to greenish yellow with darker margins, faintly sweet-scented, tepals attenuate and coiled, claws slender, forming a narrow cup, nectaries basal, anther lobes divergent. Capsule beaked.
            textZh: Ferraria brevifolia G.J.Lewis 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_14562_0
            locator: "SANBI/WFO archive Morphology row 33074; source identifier 14562.0; cited publication: Goldblatt, P; Manning, JC. 2013. Iridaceae. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 94 - 124. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Distinctive in Ferraria, the leaves of F. brevifolia form a tight, 2-ranked fan, with elongate sheaths 40-80 mm long, much exceeding the short, ovate, obtuse blades, 7-15 mm long. The blades, usually less than half as long as the sheaths, have relatively thick margins and oblique, acute or apiculate, hooked tips. The pale yellow flowers are virtually identical to those of F. macrochlamys, with a narrow floral cup, ± 12 mm deep, and tepal limbs, 22-28 mm long, with crisped, light brown or rarely reddish brown margins. The flowers produce a faint, slightly sweet scent. They can be distinguished from those of F. macrochlamys, if at all, by their somewhat longer outer tepals with long, tapering loosely coiled tips.
            textZh: SANBI 条目提供了 Ferraria brevifolia G.J.Lewis 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 95238; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
