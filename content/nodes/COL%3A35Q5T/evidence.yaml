        usage:
          title: Dicliptera iopus Lindau, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: to sparingly strigose on both surfaces, the margins entire, the petioles variable to 7 cm long, glabrous to sparingly puberulous. Inflorescences in axillary cymes, each cyme subtended by 2 elliptic to ovate-oblong bracts, to ca. 3 cm long, 1 cm wide, apically acute, basally acute, glabrous to sparingly pilosulous; bracts 2, unequal, subtending each flower, both linear oblong, fused at the base, the longer bract 10-16 mm long, 4 mm wide at the base, the shorter bract to 12 mm long, 4 mm wide, both bracts apically acute, keeled, sparingly puberulous on both surfaces; bractlets 4, the outer pair oblanceolate, to 8 mm long, 2 mm wide, pu- berulous toward the tip, the inner pair smaller, 3.5 mm long, 0.5 mm wide; peduncles to ca. 6.5 cm long, subhexangular, puberulous along the ridges, the pedicels (2)3(4), the middle one longest, to ca. 4 mm long, sparingly puberulous; usually 3 per cyme. Flowers with the calyx 5-merous, coalesced for 1/2 of its length, to 7 mm long, the lobes linear, ca. 3.5 mm long, subtomentose; corolla lavender, inflated at about the middle of the tube, bilabiate, the tube to 4 cm long, 2.5 mm wide at the base, 8 mm wide at the mouth, glandular puberulous both inside and out, the upper lip entire, acute, ca. 9 mm long, 5 mm wide, the lower lip ca. 11 mm long, 8 mm broad at the base with 3 small, suborbiculate lobes at its apex, ca. 0.5 mm long; stamens exserted, the filaments flattened, pilose, the anther cells equal; style exserted, glabrous. Capsule clavate, ca. 15 mm long, apiculate, densely glandular puberulous; seeds 2 per capsule, flattened, suborbicular, ca. 3 mm in diameter.
