  claims:
    - subjectId: event:megachirella-ct-stem-squamate
      claimKind: scientific
      claimType: topology
      statement: CT anatomy of the only known Megachirella specimen PZO 628 was scored in a combined morphology–molecule analysis that recovered it on the squamate stem; the same model's divergence estimates are not fossil observations or crown-Squamata FADs.
      confidence: medium
      confidenceRationale: The named skeleton, archived CT data and matrices make the analysis reproducible, while compression, a one-specimen sample, character scoring, molecular partitions and clock priors constrain broader interpretation.
      referenceLinks:
        - referenceId: simoes-2018-megachirella
          relation: supports
          pages: 706–709
          figure: Figures 1–2; Extended Data Figures 1–8
          quoteLocator: pp. 706–709, Figs. 1–2 and Extended Data Figs. 1–8; CT description, Combined-evidence analyses and Divergence-time estimates
  claim-rationales.zh:
    - 具名骨骼、存档 CT 数据和矩阵使分析可复现；压扁保存、单标本样本、性状评分、分子分区与时钟先验限制了更广泛解释。
  claim-statements.zh:
    - 唯一已知 Megachirella 标本 PZO 628 的 CT 解剖被编码进形态—分子联合分析，并被恢复到有鳞类干群；同一模型给出的分化估计并非化石观察，也不是有鳞类冠群首现。
