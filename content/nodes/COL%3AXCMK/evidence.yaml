        usage:
          title: Columnea hirta Klotzsch & Hanst., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Suffrutescent, epiphytic herbs; stems 2.5 mm in diam., red hirsute. Leaves of a pair subequal, oblong, 3-4 cm long and 13-17 mm wide, the apex obtuse, rounded at the base, remotely serrate, above green, densely pilose, the hairs transparent, 4-5 celled, below green, densely pilose, the hairs transparent, 4-7 celled, also 2-3 celled transparent adpressed hairs; petioles 4-5 mm long. Flowers 1-2 in each axil; bracts linear, ca. 4 mm long; pedicels 6-7 mm long, transparent to reddish hirsute; calyx lobes lanceolate, 12-15 mm long, acuminate, green, transparent hirsute, 2-3 toothed, the teeth to 1 mm long; corolla orange scarlet, funnelform but strongly zygomorphic, 7.0-8.2 cm long, ca. 4 mm in diam. above the base, becoming 12 mm in diam. at the throat, externally red pilose, the lobed portion of the corolla ca. 2.9 cm long, the lobes strongly unequal, the posterior pair connate, truncate and cusped at the apex, ca. 1.8 cm long, the anterior lobe ca. 1.5 cm long, spreading; filaments red, minutely pilose above; ovary hirsute, the style yellow, minutely pilose glandular above, the stigma stomatomorphic. Fruits not seen. Chromosomes nri 9 (Eberle, 1956).
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 6161
