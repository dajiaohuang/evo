    facets:
      morphology:
        status: partially-supported
        claims:
          - text: In the same wild Mariarano sample, captured M. ravelobensis were weighed and age-classified; adults were defined using body mass of at least 41 g together with other morphometric parameters. A logistic model estimated a 390-m depth of edge influence for local body-mass variation, but the overall edge-versus-interior body-mass difference was not significant; the female-only contrast was a statistical trend (p=0.052), with no corresponding male trend. This local response does not establish a species-wide body-mass range, diagnostic morphology, or sexual dimorphism.
            sourceIds:
              - andriatsitohaina2020
            locator: Methods §Data collection (individual weighing and adult classification); Results §Effects of edge habitats on M. ravelobensis abundance and body mass (DEI 390 m and nonsignificant overall comparison); Fig. 5b and Table S3 (female-only p=0.052 trend); Discussion §Edge effects on M. ravelobensis.
            placeTimeScope: Wild captured animals at Mariarano Classified Forest, northwestern Madagascar, sampled on four 1-km forest-edge transects in June-July 2017 and mid-May-mid-August 2018. The paper reports a local modeled response and does not estimate a range-wide body-mass distribution.
            lifeStatus: Wild, free-ranging field captures. The study did not measure captive, domesticated, or fossil animals.
            originalLanguage: en
        gaps:
          - Only body mass and an adult-classification threshold are reported for a local wild sample. The study does not establish a species-wide body-mass range, diagnostic morphology, ontogenetic pattern, or sexual dimorphism; overall edge-interior body-mass differences were nonsignificant.
      lifeHistory:
        status: not-assessed
        claims: []
        gaps:
          - No life-history search was performed; reproduction, development, survival, and behavior remain unassessed.
      ecology:
        status: partially-supported
        claims:
          - text: At Mariarano Classified Forest, four 1-km transects perpendicular to forest edges were sampled in 2017-2018 with 2,424 trap-nights, yielding 226 captured M. ravelobensis. A logistic model estimated a 340-m depth of edge influence for capture-based local abundance, but the overall edge-versus-interior abundance difference was not significant; the male-only difference was a statistical trend (p=0.082), and the female comparison was not significant (p=0.843). Within these transects, abundance was negatively associated with measured densities of large trees, small trees, and saplings. These results describe one local sample and do not establish a causal edge effect, total population size, or a species-wide pattern.
            sourceIds:
              - andriatsitohaina2020
            locator: Abstract; Methods §§Study site and period and Data collection (four transects, 2,424 trap-nights, and abundance as unique captures per 100 m); Results §Effects of edge habitats on M. ravelobensis abundance and body mass (DEI 340 m and nonsignificant overall comparison); Results §Relationship between edge effects in vegetation and M. ravelobensis abundance and body mass (Fig. 6a-c and Table S4); Discussion §Edge effects on M. ravelobensis.
            placeTimeScope: Mariarano Classified Forest, near Mariarano village, about 80 km northeast of Mahajanga, northwestern Madagascar (15°24′S, 46°44′E; 20-90 m elevation). Transect C1 was sampled in June-July 2017; C2-C4 were sampled from mid-May to mid-August 2018. Four 1-km transects bordered different road, savannah, and agricultural matrices.
            lifeStatus: Wild, free-ranging field captures. Captured animals were handled briefly and released at dusk at their capture locations; no captive, domesticated, or fossil population is represented.
            originalLanguage: en
        gaps:
          - The evidence is limited to one forest and four transects with different matrix types. Overall edge-interior abundance differences were nonsignificant, and the authors discuss the small transect sample and moderate, spatially variable responses.
          - Trap captures per 100 m are a local abundance index, not an estimate of population density or total population size. Vegetation associations are observational and do not establish causal effects or a general species-wide response.
      evolution:
        status: not-assessed
        claims: []
        gaps:
          - No phylogenetic or comparative evolutionary search was performed.
      distribution:
        status: not-assessed
        claims: []
        gaps:
          - The study locality is not treated as a species range; no distribution search was performed.
      fossil:
        status: not-assessed
        claims: []
        gaps:
          - No fossil or paleontological search was performed; no fossil presence or absence is claimed.
      conservation:
        status: not-assessed
        claims: []
        gaps:
          - The article title uses “vulnerable,” but no current formal conservation assessment was verified; no current threat category is asserted.
