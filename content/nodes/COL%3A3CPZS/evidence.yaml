          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Herb, stem not articulate, much branched, scandent to 1 m. Leaves alter- nate at base, opposite above; stipules obsolete; petiole to 1.5 cm long, slender; blade broadly truncate-ovate to subcordate, ca 1 X 1 cm on main stems, much smaller on laterals, thin, sparsely long pubescent on each surface, the base truncate or short-acuminate, the margin entire, the apex obtuse. Cyathia terminal on branched laterals, campanulate, ca .75 mm diam; glands usually 4, the appendages larger than gland, deeply 3-4-parted. Capsule ovoid, to 1.5 mm diam, long pubescent; seed ovoid, 1 mm long, angular, surface deeply pitted, ecarunculate.
