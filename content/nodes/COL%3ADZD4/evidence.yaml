        status: partially-supported
        claims:
          - text: A genomic SSR survey analyzed 96 young-leaf samples from ten wild Angiopteris fokiensis populations in Guangdong Province using 15 markers. In the reported Mantel test, genetic distance was not significantly associated with geographic distance (r = -0.1287, p = 0.4033). This is a result for the sampled populations and markers, not evidence that isolation by distance is absent throughout the species.
            sourceIds:
              - zhou2025angiopteris
            locator: Methods §2.1 (PMC lines 157-159) for the 96 samples and ten populations; Figure 4 caption (line 263) for the 15-marker panel; Results §3.6 (lines 270-272) for the Mantel test.
            placeTimeScope: Ten wild populations in Guangdong Province, China; the paper does not report the field sampling dates. The Mantel result applies to the sampled populations and marker panel only.
            lifeStatus: Young leaves sampled from wild populations; cultivated plants, other regions, and fossils were not assessed.
            originalLanguage: en
        gaps:
          - The survey covers ten populations in one Chinese province and does not establish genetic structure throughout the species range.
          - The Mantel test did not detect a significant association in this sample; this is not proof of no geographic genetic structure, particularly given the authors' discussion of statistical power.
          - Morphology, life history, ecology, distribution, fossils, conservation, systematic search, remain unassessed.
      distribution:
        status: not-assessed
      fossil:
