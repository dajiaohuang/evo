        usage:
          title: Columnea silvarum C.V.Morton, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Suffrutescent herbs or shrubs, epiphytic; stems ca. 1 In long, 4-6 mm in diam., densely red hirsute. Leaves of a pair unequal; larger blade oblong, 9.5-18.0 cm long and 3.7-5.6 cm wide, the apex abruptly acuminate, strongly oblique at the base, serrulate, above green, pilose, the hairs transparent and reddish, 3-6 celled, below green, hirsute, transparent but reddish near leaf margins, 5-7 celled, more numerous especially on the veins, also 2-3 celled appressed hairs; petioles 1-5 mm long; smaller leaves lanceolate, 1.0-1.4 cm long and 2-4 mm wide, acuminate at the apex, oblique at the base, green. Flowers in clusters of 2-5; bracts 5-9 mm long, entire, acuminate, red hirsute; pedicels 2.0-2.7 cm long, red hirsute; calyx lobes linear, 2.6-3.1 cm long, long acuminate, 2-4 toothed, the teeth 2 mm long, green or reddish, red hirsute; corollas yellow with red spots between the sinuses of the lobes, funnelform but a little swollen, 3.9-4.8 cm long, ca. 4 mm in diam. above the base, becoming ca. 10 mm in diam., externally pilose with transparent hairs, internally glabrous, the lobes subequal, spreading, 6-8 mm long; filaments glabrous, the anthers slightly exserted; style yellow, glabrous, the stigma stomatomorphic. Fruits 9 mm long and 6 mm in diam., green when immature.
          originalLanguage: en
          sourceField: general
