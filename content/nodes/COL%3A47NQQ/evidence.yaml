      ecology:
        status: partially-supported
        claims:
          - text: A 2021 survey of the Cao Vit-Trung Khanh transboundary forest block combined vocal fingerprinting, field observations, and long-term monitoring records to estimate 74 individuals in 11 identified family groups of Nomascus nasutus. The authors attributed a 38% difference from an older estimate mainly to duplicate group counts in the earlier triangulation survey and reported no evidence of population decline. This is a site-specific estimate that excludes an unknown number of solitary dispersers and is not a census of the species across its former range.
            sourceIds:
              - wearn2024caovitgibbon
            locator: Table 2 caption (2021 September-October acoustic sampling and exclusion of solitary dispersers); Results, Population size estimation (Par32, 11 groups and 74 individuals); Discussion (Par34, 38% difference and no evidence of decline); limitations on solitary dispersers (Par39).
            placeTimeScope: Cao Vit Gibbon Species and Habitat Conservation Area, Vietnam, and Bangliang Nature Reserve, China, within the Cao Vit-Trung Khanh forest block; acoustic data collected September-October 2021 at 29 listening points, interpreted alongside field observations and longer-term monitoring.
            lifeStatus: Free-ranging wild gibbons in protected transboundary forest; the estimate is based on identified family groups and does not include an unknown number of solitary dispersers.
            originalLanguage: en
        gaps:
          - The estimate covers the single known transboundary remnant forest block and omits an unknown number of solitary dispersers.
          - A 2021 estimate and comparison with older methods do not establish abundance across former range or long-term global trend.
          - Morphology, life history, other ecology, evolution, distribution beyond this survey block, fossils, conservation status beyond the cited study, systematic search, remain unassessed.
      evolution:
        status: not-assessed
      distribution:
        status: not-assessed
      fossil:
        status: not-assessed
      conservation:
        status: not-assessed
