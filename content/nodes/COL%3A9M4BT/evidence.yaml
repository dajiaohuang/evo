    facets:
      morphology:
        status: partially-supported
        claims:
          - text: In laboratory observations of Physcomitrium patens sporophyte epidermis, when two early guard mother cells formed adjacently, one had the potential to undergo an asymmetric spacing division that produced an epidermal spacer cell between the formerly adjacent cells. The illustrated division was followed over approximately two hours.
            sourceIds:
              - caine2020
            locator: Results, ‘Stomatal Patterning and GMC Spacing Divisions,’ paragraphs 1–2; Figure 5 legend; the abstract summarizes the same conditional observation.
            placeTimeScope: Laboratory study published in 2020; sterile-cultured Physcomitrium patens wild-type strains Gransden 2004, Gransden D12, and Villersexel were used in the study. The Figure 5 cell sequence spans approximately two hours; no field locality or collection date is reported for that sequence.
            lifeStatus: Experimental sporophyte tissue from laboratory-grown wild-type moss strains; this is not an in-situ population observation, a domestication result, or fossil evidence.
            originalLanguage: en
        gaps:
          - The observation supports a conditional developmental possibility, not the frequency or prevalence of spacing divisions across strains, populations, or growth environments.
          - The authors could not track the dissected live samples for longer, and the later fate or renewed identity of the spacer cell remains unclear.
          - Life history, ecology, evolution, geographic distribution, fossils, conservation, systematic evidence search, remain unassessed.
