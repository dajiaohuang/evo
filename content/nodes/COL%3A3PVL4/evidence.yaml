          originalSourceText: Vines; stems mostly slender, herbaceous, smooth but becoming papillate with age, glabrous. Leaves oblong-ovate, broadly ovate to sagittate, 3-7 cm long and 2-7 cm wide, basally cordate to sagittate, apically acute to acuminate, glabrous or at least glabrescent. Inflorescences cymose to subcorymbose, 1- to several- flowered, glabrous. Flowers white with a purple to lavender throat; sepals un- equal, the outermost orbicular to oval, the inner oblong to ovate, 1-10 mm long, glabrous; corollas narrowly funnelform, 6-7 cm long. Fruits ovoid, shortly apicu- late, to 10 mm in diameter; seeds comose with light colored trichomes.
