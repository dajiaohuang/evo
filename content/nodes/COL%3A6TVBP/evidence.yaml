    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Slender, delicate, cormous geophyte to 30 cm, corm tunics soft, brown. Leaves 2-6, suberect, narrow, thin-textured. Flowers 2(3), stellate, small, yellow or white, tepals usually 4, ± reflexed, ovary beaked, filaments adnate to thickened style, stigma branches dark red, bracts 2(3).
            textZh: Pauridia pusilla (Snijman) Snijman & Kocyan 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13877_0
            locator: "SANBI/WFO archive Morphology row 7543; source identifier 13877.0; cited publication: Snijman, DA. 2012. Hypoxidaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 115 - 119. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: "Pauridia pusilla bears a striking resemblance to P. nana in that both are shade-loving plants with delicate, narrow, pale green leaves and small flowers, but several unusual floral characters make the plants of P. pusilla unmistakable. The filaments are fused to the style forming a gynostemium, the anther connectives and stigma branches are reddish and the ovary is topped by a short beak, 0.5-1.0 mm long. Other species having flowers with a gynostemium are P. maximiliani and the more distantly related and well- known P. minuta and P. longituba. P. maximiliani is similar to P. pusilla in having all the filaments adnate to the style, whereas in P. minuta and P. longituba the inner whorl of fertile stamens is inserted in the perigone throat and only the outer whorl of `pseudostigmatic staminodes', as described by Burtt, is fused to the style, thereby suggesting the independent origin of these structures within Pauridia. Variation: Flower colour in Pauridia pusilla varies to some extent throughout its range, although the dark colouring of the anther connectives and stigmatic branches remains constant. The populations on the Matsikamma Mountain and Gifberg invariably have yellow tepals, whereas those in the northern Cederberg have white or cream tepals. Variation in the number of floral parts is also known. Both tetramerous and hexamerous flowers are frequently found within the same population and occasionally on the same plant. Only very rarely have pentamerous flowers been noted. This condition is not unique to the genus, however, and is also known within Hypoxis and Empodium."
