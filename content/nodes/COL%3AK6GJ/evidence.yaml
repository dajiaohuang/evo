        claims:
          - text: Like B. brachystachys but sheaths not woolly, filaments exserted 9.5 mm (vs. ± 5.5 mm), style branches ± 6 mm long, held above anthers (vs. ± 3 mm and tangled in anthers), and tepals linear, channelled, dorsal tepal ± 30 x 4 mm long.
            textZh: Babiana teretifolia Goldblatt & J.C.Manning 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_14562_0
            locator: "SANBI/WFO archive Morphology row 33034; source identifier 14562.0; cited publication: Goldblatt, P; Manning, JC. 2013. Iridaceae. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 94 - 124. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: "In its subterete leaves and crowded, decumbent spikes of extremely long-tubed flowers, Babiana teretifolia superficially appears to be merely a variant of B. brachystachys, a species centred in coastal Namaqualand and extending south to near Lambert’s Bay in Western Cape. The flowers, however, differ in several respects, especially in the remarkably narrow, channelled, spreading and twisted tepals, with the dorsal tepal hardly differentiated from the remaining five. The dorsal tepal is ± 30 × 4 mm and the remaining tepals ± 26 × 2.5 mm, whereas typical B. brachystachys has oblong-lanceolate, ± plane tepals, the dorsal tepal 20-24 × 6-8 mm and the lower three tepals 15-18 × 4-6 mm. These differences extend to the stamens: in B. teretifolia the filaments are ± 12 mm long and exserted ± 9.5 mm from the tube and the anthers are 5.5-6.0 mm long and white, as is the pollen, whereas B. brachystachys has filaments 4-5 mm long, exserted 1-3 mm, and anthers 4-5 mm long and usually pale violet to purple when fresh, as is the pollen, but occasionally white. In addition, the style of B. teretifolia divides opposite the anther tips so that the style branches, ± 5 mm long, arch above the anthers and can readily be seen to be notched at the tips. In B. brachystachys the style divides opposite the upper third of the anthers and the style branches are only ± 2.5 mm long. Added to the floral differences are the sparsely hairy leaf sheaths and flowers spaced ± 1.5 mm apart, in contrast with the woolly leaf sheaths and flowers set 3-6 mm apart in most populations of B. brachystachys. The extraordinarily long, linear and twisted tepals, compared to the more conventional oblong-lanceolate tepals of B. brachystachys, mark B. teretifolia as a specialised, geographic segregate of its already highly specialised sister species."
