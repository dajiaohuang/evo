    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, up to 150 mm tall, branches crowded at base. Leaves several, linear, channelled, twisted above, inserted at base. Flowers enclosed in green obtuse spathes, yellow with darker yellow nectar guides, tepal limbs lightly reflexed, filaments united in lower half, pollen red, style branches broad, crests prominent. Late Aug.-Sept.
            textZh: Moraea margaretae Goldblatt 的 SANBI 物种条目记载了植株、叶片和花部形态。
            sourceIds:
              - sanbi_14562_0
            locator: Strelitzia 30; archive Morphology row 33333, source 14562.0
            placeTimeScope: Regional species account published 2013; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
          - text: Moraea margaretae has the brown, ± woody corm tunics, leathery rhipidial spathes with brown tips and flowers with finely brown-veined yellow tepals characteristic of subg. Umbellatae, and is distinguished in the subgenus by its habit and flowers with well-developed style branches and prominent style crests. The leaves and branches (when present) are crowded close to ground level and the aerial stem and branches comprise a single internode. The species is tetraploid, 2n = 40 (two populations counted), one of the few exclusively polyploid species known in Moraea. Moraea margaretae seems to be most closely related to M. orthrosantha of central Namaqualand but this species has aerial stems of three or four internodes, with two or three branches at the aerial nodes. The flowers of the two are similar in size and colour but those of M. margaretae have shorter filaments ± 5 mm long vs. filaments 8-9 mm long in M. orthrosantha. Both species have red anthers and pollen. Hybrids between M. margaretae and M. intermedia occur at a site west of Springbok.
            textZh: SANBI 条目提供了 Moraea margaretae Goldblatt 的鉴别特征。
