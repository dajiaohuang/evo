        usage:
          title: Pavonia paniculata Cav., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Herb, suffrutex or shrub, 1-3 m high, the stem usually freely branched above, glandular-pilose and hirsute with long, simple or sometimes stellate hairs. Leaves rather long-petiolate, the petiole slender, up to 10 cm long, glandular-pilose and hirsute, the stipules narrowly ovate; blade ovate to broadly ovate, sometimes more or less deltoid or 3-lobed, truncate-subcordate to cordate at the base, acute to long- acuminate at the apex, crenate-serrate at the margin, up to 12 cm long and 10 cm wide, somewhat discolorous and scabrous, 7- to 9-palminerved, rather sparsely pu- berulus with stellate or simple hairs above, appressed-stellate-pubescent and with the main veins prominent beneath. Flowers numerous, solitary in the leaf axils, usually forming paniculiform inflorescences by reduction of the uppermost leaves, or the flowers subcorymbosely clustered at the end of the branchlets, the pedicel short or elongate, articulated above the middle, up to 3 cm long, glandular-pilose and hirsute; epicalyx of 6-12 bractlets, these distinct, linear-filiform, acute, 7-10 mm long and ca 0.5-0.8 mm wide, glandular-pilose and hirsute-hispid; calyx cupuliform, lobed to about or to slightly below the middle, 5-6 mm long, sparsely glandular- pilose and hirsute-hispid, the lobes deltoid, acute; petals cuneate-obovate, shortly unguiculate, rounded at the apex, 10-15 mm long, yellow; staminal tube about 1/2 as long as the corolla, antheriferous throughout; style longer than the staminal tube, the stigmas capitellate and fimbrillate. Mericarps triquetrous-obovoid, obtuse and muticous or sometimes short-mucronulate at the apex, 3-4 mm long, cartilagi- nous, foveolate-rugose, very minutely tuberculate; seeds trigonous-reniform, ca 2.5 mm long, minutely puberulus.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 7329
