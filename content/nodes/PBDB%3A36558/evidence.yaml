  claim-statements.zh:
    - Ichthyosaurus 是早侏罗世鱼龙属，来自萨默塞特赫唐期的材料支持可诊断物种与显式系统发育检验。
    - 该属 2.00 亿至 1.90 亿年前的范围仍是旧版全球综合值；有主张关联的萨默塞特记录仅限 2.014 亿至 1.995 亿年前赫唐期。
    - 档案重点标本来自英格兰萨默塞特赫唐期地层；这一地区样本不是全球分布图。
    - 萨默塞特 Ichthyosaurus 物种依据头骨与头后骨骼性状组合诊断，并在系统矩阵中检验。
    - 一件普通鱼龙（Ichthyosaurus communis）标本保存了可能的鱼类食道内容物，而包含该种的比较椎骨解剖支持尾鳍推进；两类样本都不能确定整个属统一的食性、栖息地或运动性能范围。
