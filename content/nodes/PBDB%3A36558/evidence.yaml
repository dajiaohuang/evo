    - subjectId: taxon:ichthyosaurus
      claimKind: scientific
      claimType: taxonomy
      statement: Ichthyosaurus is a Lower Jurassic ichthyosaur genus whose Hettangian Somerset material supports diagnosable species and explicit phylogenetic tests.
      confidence: high
      confidenceRationale: The profile separates directly documented specimens and explicit analyses from global range, behaviour and ancestry inferences; confidence is bounded by the cited primary study and its stated sample. This rationale is specific to ichthyosaurus:taxonomy.
      referenceLinks:
        - referenceId: lomax-massare-2017-ichthyosaurus
          relation: supports
          pages: 1–20
          figure: Figures 1–10
          quoteLocator: taxonomy
