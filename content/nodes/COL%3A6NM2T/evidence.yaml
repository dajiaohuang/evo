    facets:
      morphology:
        status: partially-supported
        claims:
          - text: "Plants caulescent, several-stemmed, often gregarious; stems simple or sparsely branched up to 600 mm tall, crowned with large rosette of leaves. Leaves erect or bending over towards apex, glaucous, outer leaves 450-700 x 25-50 mm (inner leaves much smaller), V-shaped in cross section, drying with a purplish tinge towards chartaceous base; margin and keel distinctly and finely serrulate. Scape 300-600 mm long, overtopping or subequal to leaves. Raceme oblong to subcylindrical, 90-300 x 5-6 mm, very dense; buds coral-pink to flame-coloured; flowers pale greenish yellow to creamy yellow. Pedicels 3-5 mm long. Bracts linear-oblong to linear, acute to acuminate, 7-11 mm long, chartaceous, drying with purplish tinge; margin entire to finely denticulate towards apex. Perianth subcylindrical, 22-24 x 1.5 mm above ovary, widening to 3.5 mm near the middle; lobes 2 mm long, not or slightly spreading. Stamens markedly exserted by 8-13 mm at anthesis. Fruit ovoid-triquetrous, erect, 5 mm long. Flowering time: January to March, though flowering specimens have been collected in KwaZulu-Natal in late November and December."
