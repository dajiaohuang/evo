          - text: "Shrub or tree, up to 20 m high; deciduous. Stems often with lower branches spiny. Leaves simple, petiolate; blade broadly elliptic, up to 90 mm long; apex acute, base rounded, margins serrate, glossy. Flowers: in umbel-like racemes or corymbs; calyx with tube turbinate or globose, accrescent; petals 5, broadly oblong or obovate, white; Sep., Oct. Fruit a pome, ± turbinate, up to ± 10 mm long, mesocarp fleshy-juicy with grit cells; seeds black or brownish black."
