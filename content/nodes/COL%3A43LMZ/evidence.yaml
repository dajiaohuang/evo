    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Stems 12-36 cm tall, long-pilose. Leaves opposite, few-paired, those at flowering nodes mostly small and inconspicuous; internode below inflorescence 3.5-10 cm long. Leaf-lamina 15-37 x 2-14 mm, linear to linear-ovate with truncate base, long-pilose; petiole 1-5 mm long. Flowers 6-8 in a terminal umbel and sometimes also in fascicles at 1 or 2 nodes below; pedicels up to 8 mm long. Calyx segments 3.5-4 x 1-2 mm, dorsally densely patent-pilose, ventrally glabrous except for a few hairs near the tip. Corolla lobes 5-6 x 3 mm, convex and reflexed at anthesis, green; dorsal surface patent-pilose. Corona 4-4.5 mm high, each lobe comprising a quadrate round-shouldered base prolonged into a slender erect process slightly inflexed at the tip; ventral face of lobe bearing one simple or bifid appendage, or two separate appendages, held horizontally over the gynostegium; base of corona white, erect processes purplish black or greenish brown. Anther appendages 0.7-1.2 mm long, undulate; corpusculum 0.2-0.28 mm long; pollinium 0.55-0.6 mm long. Gynostegium white. Mature fruit unknown, young fruit densely white-lanate, without bristles.
