          originalSourceText: Clambering, woody vine; twigs grayish-ferrugineous with appressed, short- stalked, dendritic and stellate hairs. Leaves somewhat coriaceous or mem- This content downloaded from 192.104.39.2 on Tue, 14 May 2013 16:07:58 PMAll use subject to JSTOR Terms and Conditions634 ANNALS OF THE MISSOURI BOTANICAL GARDEN [VOL. 60 branaceous, broadly elliptical to 8 cm long, obtuse at each end, the margins some- times slightly revolute, soon glabrate above, evenly and softly pubescent be- neath with stalked stellae, rarely glabrate, veins mostly 3 on each side of the mid- vein; petioles mostly 5-20 mm long, often reddish tomentose. Inflorescence solitary or a few-flowered fascicle, the pedicels slender becoming woody, glabrate to fine tomentose, 2-3 cm long, not much longer in fruit. Flowers in- conspicuous, the calyx ca. 10 mm across, sparingly pubescent with small stellate or sub-simple hairs, glabrescent, the 10 teeth only slightly unequal, thickened and obtuse; the corolla greenish white, 15-18 mm long, the interplicae thickened, with short, simple or stellate hairs outside; stamens unequal, one anther 5.5 mm long, the 4 others 2.3 mm long and tightly coherent, with a few short sub-stellate or simple hairs inside; the ovary subglobose-conical, 3 x 2.5 mm, glabrous, the style 9.5 mm long, slightly exserted, glabrous. Fruit juicy, globose, ca., 20 mm across, the calyx teeth becoming stout, woody, pyramidal, the cup drying re- flexed from the fruit; seeds compressed discoid, 4-5 mm across with a distinct, thickened margin.
          originalLanguage: en
          sourceField: general
