    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Acaulescent, cormous geophyte 8-15 mm. Leaves abruptly truncate at widest point, loosely pleated, smooth or sparsely hairy. Flowers several in dense spikes at ground level, pale to deep blue, the lower lateral tepals with white spear-shaped markings, tube elongate, inner bracts forked apically, ovary smooth.
            textZh: Babiana cuneata J.C.Manning & Goldblatt 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 6722; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Among the species with truncate foliage, Babiana cuneata is distinguished by the elongate perianth tube, 40-60 mm long, more-or-less equal, ascending tepals 26-30(-40) mm long, and a pale blue to violet, fragrant or apparently odourless flower. The stamens are openly displayed, with filaments 15-18 mm long and exserted 9-10 mm. The point of division of the style varies. In the type population the style branches opposite the base of the anthers but in plants to the south, below the Roggeveld Escarpment, it reaches the anther apices before branching. Flowering occurs from early August to late September. Babiana flabellifolia has, in contrast, strongly scented bilabiate flowers with an arched dorsal tepal more-or-less concealing the stamens, a perianth tube 18-36 mm long, and often dry, submembranous, or occasionally green, leafy bracts. In specimens where it is possible to see floral details, the style divides opposite the anther apices. Flowering in B. flabellifolia occurs from late June through July, rarely in early August in seasons when the rains are late or conditions are particularly cold. The flowers of B. cuneata closely resemble those of B. sambucina, which is widespread across the dry interior of the Cape Floral Region, but absent from the Roggeveld. Plants at the southern end of the range, in the Klein Roggeveld south of Komsberg Pass, have unusually large flowers with the dorsal tepal ± 40 mm long, the anthers 9-11 mm long, and the style is also unusual in dividing opposite the anther apices rather than opposite their bases. Plants also seem unusual in the blue-grey colour of the leaves, often 20-30 mm wide, likewise exceptional for the species. At present, however, there appears no reason to recognise these as a separate taxon.
            textZh: SANBI 条目提供了 Babiana cuneata J.C.Manning & Goldblatt 的鉴别特征。
