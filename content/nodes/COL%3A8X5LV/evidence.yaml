            locator: "SANBI/WFO archive Morphology row 104819; source identifier 17737.0; cited publication: Elliott, TL; Muasya, AM. 2018. A taxonomic revision of Schoenus compar - Schoenus pictus and allies (Cyperaceae, tribe Schoeneae) with three new species described from South Africa. S. African J. Bot. 114: 303 - 315. [https://doi.org/10.1016/j.sajb.2017.11.020]. [All rights reserved]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: The spikelets and nutlets tend to be longer in S. megacarpus compared to other species in this group. Schoenus megacarpus is most similar in morphology to S. compar; however, it lacks the viscous culms and inflorescences of S. compar. In addition, the base of its culms are often reddish, as opposed to the ivory culms of S. compar. Furthermore, whereas the primary inflorescence bracts of S. megacarpus are expanded proximally and have membranaceous extensions, those of S. compar are firm and tend to lack such extensions.
