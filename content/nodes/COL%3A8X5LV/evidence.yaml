    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Caespitose, phyllopodic perennial graminoid with flat leaves. Not Viscous. Culms terete, (203-)425-510(-712) x 0.3-1.2(-2.3) mm. Leaves basal, 2-5, flat, firm, not channelled, (24-)146-185(-215) x 0.2-0.7(-1.2) mm, up to or exceeding half of culm length, apices rounded, margins serrate. Sheaths open, papery, often reddish-purple, but can be almost entirely ivory in colour, not viscous. Ligule membranaceous,(2.2-)4.3-7.4(-10.5) mm. Inflorescence a compact spike-like panicle,(14.5-)23.0-39.5(-54.5) x 5-10(-14) mm, not viscous, proximal rachis length (2.5-)6.5-13.0(-23.0) mm. Proximal primary inflorescence bracts sometimes envelope entire spikes, lower two to three notably expanded at base with membranaceous extensions on edges, longitudinal veins evident, lowest 31-75(-100) mm long, flat, apices rounded. Spikes few,2-5, 7.0-17.0(-23.0) mm long. Spikelets (5.2-)8.8-11.2(-13.2) x (0.6-)1.7-2.3(-3.5) mm, with pedicels, 2-5 spikelets/spike. Rachilla(0.4-)1.4-2.3(-6.4) mm long. Glumes 4-7 per spikelet, proximal glume(2.2-)2.9-5.7(-12.6) mm long, subproximal glume (2.9-)3.8-9.5(-13.1) mm long, thick, firm, more or less 2-ranked, reddish-brown, with or without a narrow scarious margin, upper glumes longer in length, apices acute or acuminate. Mucros sometimes present, proximal mucro(0-)0.2-0.6(-1.2) mm long, subproximal mucro (0-)0.1-0.4(-0.9)mm long. Stamens (2-)3 per spikelet, anthers 4.0-5.6 mm long. Stigmas(2-)3 branched. Perianth bristles 3, shorter than glumes. Nutlet relatively large for clade, 3.2-6.2(-7.3) x 1.2-2.4(-3.1) mm. Nutlet beak 1.0-2.7(-3.4) mm long.
            textZh: Schoenus megacarpus T.L.Elliott & Muasya 的 SANBI 物种条目记录了形态特征。
