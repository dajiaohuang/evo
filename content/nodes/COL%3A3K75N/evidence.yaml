    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Soft-wooded shrub up to 2 m tall and as much across, branches white-felted, leafy. Leaves on white-felted petioles up to 70 mm long, blade up to ±130 x 110 mm, broadly ovate or subrotund, apex obtuse, base cordate, upper surface cobwebby, glabrescent, lower white-felted, digitately nerved. Heads homogamous, campanulate, ±3 x 2 mm, in small clusters arranged in very large divaricate panicles terminating the branchlets. Involucral bracts in 4-5 series, graded, imbricate, outer pale brown, woolly, inner with opaque white obtuse tips equalling the flowers, minutely radiating. Receptacle conical, minutely tuberculate. Flowers 16-24. Achenes 0.5-0.75 mm long, with duplex hairs. Pappus bristles many, slightly exceeding corolla, tips barbellate, bases cohering lightly by patent cilia.
            sourceIds:
