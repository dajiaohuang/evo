  claims:
    - subjectId: taxon:ophiuroidea
      claimKind: scientific
      claimType: fossil-range
      statement: A class-level ophiuran occurrence represented by Stenaster from the Wah Wah Formation is Floian in age; the atlas therefore uses the Floian base only as a stage ceiling for the Ophiuroidea body-fossil record.
      confidence: medium
      confidenceRationale: The systematic study reports clear class-level assignment, and PBDB occurrence 1541278 resolves the specimen to a Floian collection. The 477.1 Ma endpoint is the current stage ceiling rather than a point-dated first appearance.
      referenceLinks:
        - relation: supports
          referenceId: blake-2016-early-asterozoa
          pages: 161–181
          quoteLocator: "Abstract; Systematic palaeontology: Stenaster sp."
        - relation: contextualizes
