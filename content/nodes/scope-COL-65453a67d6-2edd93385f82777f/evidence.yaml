      claimKind: scientific
      claimType: taxonomy
      statement: The cited systematic study reports Stenaster as class-level ophiuran material; the profile uses that bounded assignment without claiming a complete ophiuran topology or direct ancestry.
      confidence: medium
      confidenceRationale: The source provides a clear class-level systematic treatment, whereas deeper relationships and whole-class membership are beyond its sampled material.
