      statement: The cited Stenaster record is from the Floian Wah Wah Formation of Utah, United States; it is a source-bounded occurrence rather than a global ophiuran distribution or origin claim.
      confidence: medium
      confidenceRationale: The systematic source and independently resolved PBDB occurrence identify a formation and stage, but neither is a complete geographic census.
      referenceLinks:
