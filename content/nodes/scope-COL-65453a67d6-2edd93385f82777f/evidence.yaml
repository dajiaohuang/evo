      statement: The Stenaster systematic record does not establish class-wide diet, habitat preference, locomotor performance, body-size distribution or guild for Ophiuroidea; only source-bounded marine formation context is retained.
      confidence: high
      confidenceRationale: The statement preserves the ecological boundary of a systematic fossil study and avoids substituting living brittle-star ecology for the described occurrence.
