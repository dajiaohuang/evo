          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Yellow, with a brownish tint, moderately tall shrub hanging from trees. Branches ancipital and 2-keeled, especially toward the tips. Cataphylls a nearly basal pair followed by 2-3 additional ones, rather pointed. Leaves lanceolate, not rarely somewhat ovate, acuminate, under lens rugose, the nerves wanting, the margins callose-thickened and conspicuously undulate, 7-12 cm. long, 2-4 cm. wide; petioles 3-8 mm. in length, canaliculate above. Spikes many times clustered, 2-5 cm. long, with 5-9 moderate joints; peduncle none or up to 8 mm. long; joints mostly 10-flowered in 2 ranks, 2-5 mm. long. Fruits round-ovoid, smooth, 3 mm. in diameter, the tepals slightly parted.
          originalLanguage: en
          sourceField: general
