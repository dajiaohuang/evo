    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Erect, tufted perennial, up to 600 mm high; sometimes decumbent to procumbent. Leaf blade 200 x 2.5 mm, long, slender, expanded or folded, glabrous abaxially, mostly glabrous adaxially but sparsely pilose basally. Inflorescence (50)100-140 mm long, delicate; primary branches flexible, spreading or drooping, secondary branches and pedicels short, dense; spikelets adpressed. Spikelet 2.2-2.4 mm long, often purplish, glabrous; lower glume to 1/2 the spikelet length, membranous; lower floret male, lemma 5-nerved, palea coriaceous, well developed and longer than the lemma; upper floret bisexual, lemma pale, papillose; anther 0.5-1.0 mm long.
