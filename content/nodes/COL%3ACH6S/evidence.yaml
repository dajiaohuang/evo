        usage:
          title: Amaranthus spinosus L., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Rather coarse, mostly glabrous armed annuals to 2 m. high, usually with erect branches. Leaves glabrous or pubescent below, narrowly rhombic-ovate, apically rounded to acute, basally acute to cuneate, 1-12 cm. long, 0.5-5 cm. broad; petioles 0.5-8 cm. long, with 2 thorns in their axils. Inflorescences of terminal and axillary thyrses racemosely disposed, the lower axillary thyrses globose and up to 15 mm. broad. Flowers polygamo-monoecious or monoecious, the bracts and bracteoles rather variable, lanceolate to acicular, 1-5 mm. long, often resembling the thorns, some conspicuously longer than the flowers; sepals 5, lanceolate to oblong, 1-2.5 mm. long, the midribs dark-green, the margins scariose; stamens discrete, 1-2 mm. long; ovary ovoid; styles 3, conical; stigmata 3, fimbrillate. Fruit a slightly rugose compressed ovoid utricle, irregularly to regularly circum- scissile, 1.5-2.5 mm. long; seeds cochleate-orbiculate, reddish brown to black, minutely reticulate, 0.7-1.0 mm. broad.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 360
