        claims:
          - text: Cormous geophyte, 12-18 cm, corm rounded. Leaves sword-shaped. Flowers large, cup-shaped, yellow usually marked with dark brown.
            textZh: Hesperantha vaginata (Sweet) Goldblatt 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 6689; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Immediately recognised by the large yellow, cup-shaped flowers, in most populations strikingly marked with large brown markings on the tepals. Occasional populations are known with uniformly yellow flowers (matching the type of H. stanfordiae) or with both marked and unmarked flowers. The perianth tube is relatively short, 5-8 mm long, but the tepals, 30-35 x 12-17 mm, are among the largest in the genus. The tepals unfold in the early afternoon after 14:30 on warm sunny days and close about three hours later. Closely related H. karooica also has bright yellow flowers but never with contrasting markings, and the tepals are considerably smaller, ± 20 x 9-10 mm. Usually a smaller plant, H. karooica seldom exceeds 80 mm unless growing through bush, and has narrower leaves 3-4 mm wide vs. 7-10 mm in H. vaginata.
            textZh: SANBI 条目提供了 Hesperantha vaginata (Sweet) Goldblatt 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 94833; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
