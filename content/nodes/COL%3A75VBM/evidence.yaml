    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Slender, cormous geophyte to 35 cm, corm tunics softly fibrous, pale brown. Leaves 2-6, suberect, narrow, thin-textured. Flowers 2, stellate, small, white, occasionally flushed pink, pale green beneath, narrowed to a short solid neck above ovary, tepals ± reflexed, bracts 2, lanceolate, pale green.
            textZh: Pauridia nana (Snijman) Snijman & Kocyan 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13877_0
            locator: "SANBI/WFO archive Morphology row 7542; source identifier 13877.0; cited publication: Snijman, DA. 2012. Hypoxidaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 115 - 119. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: As the epithet suggests, Pauridia nana is a slender plant of delicate habit, with narrow (1.5-5.0 mm wide), pale green leaves. With tepals only 4-7(-10) mm long, the flowers are small, mostly white or rarely creamy white, backed with pale green in the outer whorl, and sometimes flushed with pink. Its affinities lie primarily with P. pusilla which is similar in size and habit, but easily distinguished by staminal filaments that are adnate to the style and by dark red anthers and stigma. When first described , P. nana was also thought to be allied to P. scullyi, but the unilocular ovary of this species now suggests otherwise. The short apical ovary beak of P. nana rather suggests affinities with P. alba, P. aquatica and P. umbraticola, all of which have naked corms, or at most a loose tuft of fibres from the apex in P. alba. Of these, only P. umbraticola, which is endemic to the mountains adjacent to the Olifants River Valley, has delicate, thin-textured leaves like P. nana, but the flowers are yellow and slightly larger than in P. nana (tepals 7-12 mm versus 4-7(-10) mm long), as are the filaments (outer 2.5-3.0 mm and inner 3.0-3.5 mm long versus outer 0.7-1.0 mm and inner 1.0-1.5 mm long) and the stigma branches (3.0-4.5 mm versus 1.2-3.0 mm long).
