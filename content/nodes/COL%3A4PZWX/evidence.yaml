    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Shrub or dwarf shrub, up to 1 m tall. Leaves opposite, free from each other at base, small, linear or subspathulate-linear, obtuse, densely white-scabrid to papillose. Flowerheads terminal, solitary, acute before opening then oblong-cylindrical; outer involucral bracts oblong-oblanceolate, scaly-membranous and glabrous; disc florets yellow. Cypselas densely glandular-hairy, mixed with scattered short hairs; pappus straw-coloured.
            sourceIds:
              - sanbi_14820_0
            locator: "SANBI/WFO archive Morphology row 34369; source 14820.0; publication: Herman, PPJ. 2013. Asteraceae: Pteronia. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 317 - 321. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Pteronia quadrifaria was treated by Merxmüller as a synonym of Pteronia lucilioides DC., based mainly on the papillate leaves of the Dinter 6190 specimen. He argued that the growth form of P. lucilioides is very variable in Namibia and that Dinter 6190 represents a densely branched, small, shrubby form. Around Aus, however, P. lucilioides is a tall, virgate shrub and the stunted dwarf shrub forms are found mostly nearer to the coast. Based on recent flowering and fruiting collections the differences between the two species were confirmed, such as the apex of the budding capitula that is constricted to truncate in P. quadrifaria and sharply acute in P. lucilioides. Furthermore the densely imbricate, decussate leaf arrangement of P. quadrifaria clearly differs from the opposite leaves of P. lucilioides, and the undulate, reflexed phyllaries of the former differ from the smooth, straight phyllaries of the latter. P. quadrifaria can also be clearly distinguished from P. lucilioides by the maroon-purple pappus (straw-coloured in the latter). Reviewing all presented evidence we conclude that this merits the resurrection of P. quadrifaria as a distinct entity. Pteronia quadrifaria is similar to P. mucronata in its leaves with ciliate margins and truncate phyllaries, but differs in its decussate-imbricate leaf arrangement, its phyllary apex not being mucronate but undulate-reflexed, and the conspicuous maroon-purple pappus.
            textZh: SANBI 条目提供了该种的鉴别特征。
            sourceIds:
              - sanbi_13744_0
            locator: "SANBI/WFO archive Diagnostic row 46763; source 13744.0; publication: Kolberg, HH; Van Slageren, MWSJM. 2014. A synopsis of the genus Pteronia in Namibia including the resurrection of Pteronia quadrifaria. Kew Bull. 69(1): 9488. [DOI 10.1007/S12225-014-9488-Y]. [All rights reserved]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
