    facets:
      morphology:
        status: partially-supported
        claims:
          - text: A rhizomatous perennial herb, stems sparingly branched from the base, often decumbent and rooting there, then erect to c. 5O cm, glabrous or nearly so, leafy. Leaves up to 9 x 2(-3) cm, decreasing in size upwards, variable in shape, often spathulate or elliptic, apex acute or obtuse, base narrowed, petiole-like, often half-clasping, margins entire or irregularly serrate, glabrous or nearly so, thick-textured. Heads many, c. 3 mm across, in compact clusters corymbosely arranged, yellow. Involucral bracts more or less biseriate, shorter than the flowers, glabrous with a median resinous keel. Achenes not seen. Pappus bristles scabrid, numerous.
            sourceIds:
