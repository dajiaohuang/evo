    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Glabrous perennial or sometimes annual herb. Stems many from a woody base, thick, semisuc-culent, terete or striate, hollow or spongy, rooting at nodes, trailing on mud or floating on water, up to 3 m long, sometimes hairy at nodes. Leaves very variable, ovate to triangular or linear, 30-150 x 10-90 mm, apex acute to obtuse, base truncate, cordate to hastate and auriculate, margin entire or dentate; petiole thick, 30-250 mm long. Peduncles axillary, 10-140 mm long, cymosely 1- to few-flowered; pedicels 20-65 mm long; bracts narrow, acute, 1.5-2 mm long. Sepals coriaceous with thin, pale margins, sometimes verrucose, subequal, ovate-oblong to ovate-elliptic, obtuse or acute, 6-12 mm long. Corolla funnel-shaped, purple, pink or white, often with a purple eye, rarely entirely white, 25-75 mm long, limb 45-50 mm in diameter, narrow tube somewhat constricted at place of insertion of filaments. Capsule ovoid, 8-10 mm long. Seeds densely pubescent.
            sourceIds:
              - sanbi_5962_0
            locator: "SANBI/WFO archive Morphology row 49728; source 5962.0; publication: Meeuse, ADJ; Welman, WG. 2000. Convolvulaceae, Fl. S. Africa 28(1): 1 - 138. National Botanical Institute, Pretoria. [http://www.biodiversitylibrary.org/item/209568#page/1/mode/1up]. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Vines; stems hollow, rooting at the nodes, procumbent on wet ground or floating on water, glabrate. Leaves mostly hastate, the terminal lobe narrowly triangular or lanceolate, the basal lobes smaller and spreading or almost absent, 4-12 cm long, apically acute or obtuse, glabrescent. Flowers solitary or in few-flowered cymnes, the inflorescence glabrous; sepals ovate-oblong, subequal, 7 mm long, obtuse or subacute, mucronulate, glabrous; corolla white or purple, 4-5 cm long, funnelform. Fruits capsular, ovoid to globose, 8-10 mm long; seeds densely soft-pilose or glabrous.
            originalLanguage: en
            sourceIds:
              - flora_panama_3pvld_general_3510
            locator: "Flora of Panama general field; imported row 3510; sourceIds 14692CF5-6965-46F9-B978-131B434C6304; reference rows 4327; citations: 14692CF5-6965-46F9-B978-131B434C6304: Ipomoea aquatica Forssk., Flora of Panama (WFO),Tropicos.org, 2013 Accessed February 2018. (reference row 4327)."
            placeTimeScope: Morphological description in the Flora of Panama source version retrieved 2026-09-08; no population sampling frame or observation date is specified in this text. The source is a historical regional flora record, not a current or global account.
            lifeStatus: The text does not identify the described plant material as wild, cultivated, domesticated, or escaped; no life status is inferred.
