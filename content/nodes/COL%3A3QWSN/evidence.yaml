        usage:
          title: Justicia metallica Lindau, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Herb to 50 cm tall; stem ascending, rooting at the lower nodes, quadrangular when younger, the angles rounded, pilosulous in 2 lines, mixed with glandular hairs toward the apex, purplish. Leaves ovate, 3-9 cm long, 1.5-4 cm wide, apically acuminate to short acuminate, basally sparingly attenuate to rounded, glabrous to sparingly strigose along the midrib and the costa, the cystoliths prominent on both the surfaces, greenish above, shiny metallic blue beneath, the margins entire, undulate or crenate; petioles short, 3-8 mm long, strigose above. Inflorescences of lax, terminal or axillary, spicate panicles, the spikes to ca. 9 cm long, the first internode ca. 1 cm long, the peduncles and the rachises glandular puberulous, purplish; bracts and bracteoles linear subulate, to 1.5 mm long, 0.25 mm wide, glandular puberulous; pedicels secund. Flowers with the calyx 4-merous, the segments subulate, to 5 mm long, ca. 0.5 mm wide at the base, glandular puberulous; corollas pink to purplish, to 14 mm long, sparingly glandular puberulous, the tube cylindrical to 9 mm long, 2 mm wide, the upper lip erect, to 4.5 mm long, 2 mm wide, apically minutely bidentate, the lower lip spreading, to 5.5 mm long, the lobes to 2 mm long, the middle lobe 2 mm wide, the lateral lobes 1.5 mm wide, all apically rounded; stamens exserted to just below the tip of the upper lip, the anther cells superposed, ca. 1 mm long, the lower cell spurred. Capsules clavate, to 8 mm long, 1.5 mm wide, sparingly puberulous; seeds reddish brown, subtriangular, ca. 1 mm wide, roughened.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 50
