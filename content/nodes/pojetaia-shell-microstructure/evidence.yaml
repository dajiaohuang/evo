  claims:
    - subjectId: event:pojetaia-shell-microstructure
      claimKind: scientific
      claimType: morphology
      statement: New Pojetaia shell sections preserve a laminar inner microstructure comparable to foliated aragonite; the study does not identify undisputed Cambrian nacre and instead tests independent later origins of nacre across molluscan classes.
      confidence: medium
      confidenceRationale: Shell fabrics are imaged and compared directly, while mineral identity, precursor relationships and repeated origins of nacre are comparative inferences affected by preservation.
      referenceLinks:
        - referenceId: vendrasco-et-al-2011-pojetaia
          relation: supports
          pages: 825–850
          figure: Figures 1–12; Tables 1–2
          quoteLocator: Pojetaia material; shell microstructure; discussion of foliated aragonite and nacre
  claim-rationales.zh:
    - 壳体微结构由切片和图像直接记录；矿物身份、前体关系及珍珠层多次起源仍受保存和比较限制。
  claim-statements.zh:
    - 新的 Pojetaia 贝壳切片保存了可与叶片状文石相比的层状内微结构；该研究没有认定存在无争议的寒武纪珍珠层，而是检验珍珠层在各软体动物纲中后来独立起源的可能性。
