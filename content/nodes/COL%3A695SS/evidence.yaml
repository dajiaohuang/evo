        usage:
          title: Burmeistera morii Wilbur, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Epiphytic suffrutescent herbs ca. 50 cm tall; stems glabrate. Principal leaves with blades elliptic, (5-) 8-10.5 cm long, (2.0-) 3.0-4.2 cm wide, mostly 2.5-3 times as long as wide, apically acute to acuminate, basally cunneate, marginally repand- denticulate with ca. 3 to 5 inconspicuous callosities per cm, glabrous above and beneath, with strongly arching, conspicuous secondary veins rejoining just within the margins; petioles 1.0-1.5 cm long, glabrous. Flowers ca. 2.8 cm long; pedicels solitary in the upper leaf axils, spreading to strongly ascendant, glabrous, ebracte- olate, 4-6 cm long but elongating in fruit to at least 9 cm; hypanthium at anthesis shortly turbinate, glabrous, basally acute and with divergent sides, 3-6 mm long, 3-4 mm in diameter at its summit; calyx lobes oblong, obtuse, entire, glabrous, 3-4 mm long; corolla glabrous to inconspicuously spiculate, green, the tube 12-14 mm long, 1.5-2 mm in diameter, the lobes falcate, narrowly oblong, acute, the 2 upper lobes 10-12 mm long, the 2 lateral lobes 6-8 mm long, the lowermost lobe 3-4 mm long; filament tube slightly exserted, 20-22 mm long, glabrous, the anthers 2.5-5 mm long, externally puberulous, the 2 shorter anthers with a thin, apical fringe of trichomes. Berries pinkish, noninflated, subglobose, ca. 7 mm high, 8 mm in diameter at the apex.
          originalLanguage: en
          sourceField: general
