        claims:
          - text: Cormous geophyte, 15-45 cm. Leaves 2-4, linear, channelled., stems much branched. Flowers blue, occasionally yellow.
            textZh: Moraea bipartita L.Bolus 的 SANBI 物种条目记载了植株、叶片和花部形态。
            sourceIds:
              - sanbi_13878_0
            locator: Strelitzia 29; archive Morphology row 6912, source 13878.0
            placeTimeScope: Regional species account published 2012; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
          - text: Distinguished by the two or more foliage leaves, the blades linear, channelled and up to 6 mm wide, and the relatively small, Moraea-type flower with well-developed, broad style branches and prominent, erect crests. The stems have several branches in mature plants in seasons of adequate rainfall and the flowers are usually blue to blue-mauve with yellow nectar guides only on the outer tepal limbs, the outer tepals 16-30 mm long and the inner 14-25 mm long. Plants from the Perdebont Valley in the southern Little Karoo near the northern end of Robinson Pass have pale yellow flowers otherwise exactly like those of blue-flowered plants. This is a striking exception not only for M. bipartita but for the entire sect. Polyanthes. Closely related Moraea polyanthos is virtually identical vegetatively to M. bipartita but has subequal tepals, the limbs of both whorls spreading horizontally and bearing small white to yellow nectar guides, and the style branches, ± as wide as the anthers, lack crests. The filaments of M. polyanthos are united in a slender column whereas those of M. bipartita are free in the upper third. Hybrids between M. bipartita and M. polyanthos have been recorded where the two species co-occur, and plants with a range of flowers intermediate between the two indicate introgression among the hybrids. Moraea polystachya has flowers of similar form to those of M. bipartita, thus with broad style branches and crests, but plants are larger as are the flowers, the outer tepals 36-55 mm long. The ovary is often veined dark red in M. polystachya but is uniformly green in M. bipartita.
            textZh: SANBI 条目提供了 Moraea bipartita L.Bolus 的鉴别特征。
