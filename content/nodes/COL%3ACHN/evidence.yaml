  claims:
    - subjectId: taxon:echinodermata
      claimKind: scientific
      claimType: fossil-range
      statement: Articulated echinoderm faunas with at least four markedly differentiated body plans are documented by about 510 Ma; this is an articulated-fauna datum, not the origin time of Echinodermata.
      confidence: high
      confidenceRationale: Direct articulated body fossils and their stratigraphic correlation support the approximately 510 Ma datum. The wording deliberately excludes older isolated stereom and model-based lineage-origin estimates.
      referenceLinks:
        - relation: supports
          referenceId: smith-2013-oldest-echinoderms
          pages: 1, 5
          figure: Figure 3
          quoteLocator: Abstract; Discussion, paragraphs describing the 515–510 Ma articulated faunas
    - subjectId: taxon:echinodermata
      claimKind: scientific
      claimType: morphology
      statement: Diagnostic isolated stereom ossicles occur in the Delgadella anabara Zone of Cambrian Series 2, Stage 3, approximately 520–525 Ma on the source's 2013 calibration; they are skeletal microfossils, not articulated echinoderm bodies.
      confidence: high
      confidenceRationale: The occurrence of isolated stereom is direct fossil evidence, while its use as a latest bound on skeleton acquisition is an inference. The published numeric calibration predates the atlas's current formal Stage 3 boundaries and is retained only as source-reported approximation.
      referenceLinks:
        - relation: supports
          referenceId: smith-2013-oldest-echinoderms
          pages: 5–6
          figure: Figure 3
          quoteLocator: Discussion, stereom first-occurrence and skeleton-acquisition paragraphs
    - subjectId: taxon:echinodermata
      claimKind: scientific
      claimType: taxonomy
      statement: Yanjiahella biscarpa is a Fortunian deuterostome whose proposed placement as a stem echinoderm is contested because no unambiguous echinoderm synapomorphy or stereom is preserved; it is not used here to set the Echinodermata range.
      confidence: contested
      confidenceRationale: The original analysis recovered Yanjiahella as a stem echinoderm, but a published reanalysis found no unique echinoderm synapomorphy, no stereom and unstable affinities. The approximately 540 Ma assignment therefore cannot anchor a reliable class-level fossil endpoint.
      referenceLinks:
        - relation: supports
          referenceId: topper-2019-yanjiahella
          figure: Figure 3; Supplementary Figures 6–9
          quoteLocator: "Abstract; Results: Morphological characteristics and Phylogenetic significance"
        - relation: contradicts
          referenceId: zamora-2020-yanjiahella
          figure: Figure 2a–d
          quoteLocator: Opening Matters Arising text and Methods phylogenetic reanalysis
    - subjectId: taxon:echinodermata
      claimKind: scientific
      claimType: taxonomy
      statement: Echinodermata is profiled as a phylum while Yanjiahella’s proposed stem placement remains contested and is not used as direct ancestry.
      confidence: medium
      confidenceRationale: The taxonomy field is bounded to Echinodermata, the named sample or scoped clade analysis and the cited primary-study locator; interpretation is not generalized to direct ancestry or unsampled species.
      referenceLinks:
