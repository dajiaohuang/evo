    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Rhizomatous perennial, 15-35 cm, forming small tufts, stems dichotomously branched, flattened, slender. Leaves sword-shaped, soft. Flowers blue, spathes translucent with dark keels, margins rusty, closely and shallowly fringed. Capsules short, 3-winged.
            textZh: Aristea recisa Weim. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 6620; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Broadly similar to the more common and widespread Aristea africana, A. recisa shares with that species distinctive dry-papery, prominently fringed spathes and floral bracts. The two might easily be confused but the bracts of A. recisa are rusty brown along the margins, the leaves are often broader, up to 5 mm wide, and soft-textured, and the flowering stems are usually held well above the leaves, whereas the stems in A. africana are usually (but not invariably) not much longer than the leaves. The critical distinction between the two species lies in the spathes and bracts, which in A. recisa are fringed for less than a third of their length, whereas in A. africana they are fringed for half their length or more, as well as usually being uniformly coloured.
            textZh: SANBI 条目提供了 Aristea recisa Weim. 的鉴别特征。
            sourceIds:
