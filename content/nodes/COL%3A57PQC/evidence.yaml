    facets:
      morphology:
        status: partially-supported
        claims:
          - text: "Grasslike plants 10-50 cm high. Roots many, wiry, fairly stout. Rhizome vertical. Leaves variable in size, filiform to linear, 5-50 cm long, 1-25 mm wide; lamina flat or rolled, tapering to the apex, below gradually dilated into a tubular, membranous base, mouth fimbriate; glabrous or pubescent with long straight hairs sometimes intermixed with short curly hairs; nerves in basal part of leaf sometimes persistent as fibres (if sclerenchymatous because of dry conditions). Inflorescence a simple raceme, usually many-flowered; several young racemes usually present near the base of the plant; scape arcuate near the base, protruding outside the leaf-rosette, 6-40 cm long; bracts small, narrow, cuspidate, margin fimbriate or smooth; pedicels 8-15mm long, ascending, sometimes recurved in fruit. Flower with perianth segments ca. 1 cm long, typical: stamens typical; ovary turbinate, with ca. 8 ovules per cell, the lower usually aborting. Capsule globose 5 mm in diam. glabrous, constricted at the base. Seeds grey, smooth."
