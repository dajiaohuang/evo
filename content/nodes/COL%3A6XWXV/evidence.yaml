        usage:
          title: Schizolobium parahyba (Vell.) S.F.Blake, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: A tall, buttressed tree to 25 m. or more, the branchlets subglabrous. Leaves very large, twice-pinnate, multifoliolate; petiole stout, 1 dm. or more long, evi- dently eglandular, glabrous or somewhat viscid, slightly flattened or sulcate above; secondary petioles similar, about 1 cm. long, callous basally; rachis several dm. long, eglandular, flattened and margined above, the pinnae (several to many) arising opposite in pairs on the upper side; stipules apparently small, caducous; leaflets several to many pairs on each pinna, oblong or linear-oblong, 1.5-3 cm. long, 4-7 mm. wide, rounded apically and basally, dark and puberulent to glabrous above, lighter and appressed-pubescent below, subcoriaceous, the midvein very prominent, the lateral veins obscure; ultimate petiolules about 1 mm. long. In- florescence multiflorate, as described for the genus; bracts lanceolate, scarcely 2 mm. long; pedicels up to 1 cm. long in age, articulate above the middle. Flowers attractive, yellow; calyx-tube turbinate, 2-3 mm. long, dark and usually tomentu- lose without; calyx-lobes ovate-elliptic, about 6 mm. long and 3 mm. wide, puberu- lent; petals obovate-spatulate, almost 2 cm. long and usually 4-6 mm. wide, sub- glabrous, obscurely veined; stamens 10, as described for the genus, about as long as the petals, the filaments broader and scurfy basally, the anthers broadly elliptic, about 2 mm. long; ovary subfalcate, about 5 mm. long and 2 mm. broad, hispid- tomentose with dark hairs, few-ovulate. Legume obovate-spatulate, narrowed baseward, about 10 cm. long and 2.5-5 cm. wide, glabrous, bearing the solitary seed apically; seed flattened-ovoid, up to 2 cm. long.
          originalLanguage: en
          sourceField: general
