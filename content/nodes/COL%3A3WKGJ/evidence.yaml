        claims:
          - text: Much-branched shrub, 3-4 m high; branches glaucous, purplish, with decurrent ridges from the cupular nodes; leaves sessile in fascicles of 5-10, linear, 9-25 mm long, 1-3 mm broad, acute, rather fleshy; flowers solitary on very short peduncles, 4-merous; calyx 3 mm long, shortly and unequally 4-toothed; teeth ciliate; corolla 6-8 mm long, tubular; lobes 4, oblong, ciliate, about 2 mm long; stamens unequal, inserted a little above the corolla-base, 1 slightly exserted, 2 reaching the throat, the 4th included; filaments hirsute at the base; ovary ovoid, adnate to the red fleshy disk; style exserted; stigma capitate.
            sourceIds:
