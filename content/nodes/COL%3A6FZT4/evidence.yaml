    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Weak perennial, tufted (erect), up to 1 m high. Leaf blades up to 600 mm long, up to 3 mm wide. Culms not densely compacted at base and easily separated into individual culms; basal sheaths glabrous; leaf blades tapering to a filiform tip. Spikelets 2-4 mm long, up to 1.2 mm wide. Inflorescence 100-300 mm long, effuse, much-branched, branches and spikelets spreading, shortest pedicel of spikelet pair as long as or longer than spikelet; spikelets with rhachilla persistent in lower portion, usually fragile in upper portion, lemmas and/or paleas breaking up from base upwards; glumes translucent, smooth or scaberulous around apex and along keel, half to two-thirds the length of lemmas directly above in intact spikelet; lemma light greenish to green-grey, strongly keeled along entire length; palea margins meeting or overlapping along entire length or at least at apex, keels a thin line or apparently palea only folded; anthers 3.0,6-1.0 mm long. Caryopsis lanceolate.
