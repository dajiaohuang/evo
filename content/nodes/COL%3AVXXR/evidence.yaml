          title: Clematis dioica L., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Dioecious or polygamous lignescent vines climbing by means of foliar tendrils, the branches reddish-brown, striate, often pilose. Leaves opposite, with three (or more in var. brasiliana) leaflets, glabrate or pilose below, falcate-ovate, en- tire or with 1 or 2 apiculate teeth, apically acute to long-acuminate, basally rounded to subcordate, 2-8 cm. long, 1.5-5.0 cm. broad, with 3-5 nerves arising near the base, the petiolules 1.0-2.5 cm. long, the petioles to 8 cm. long, glabrous or pilose, the rhachis often coiling. Staminate flowers in axillary and terminal simple or compound dichasial cymes, the pedicels 10-30 mm. long, all branches subtended by progressively reduced bracts, glabrous or pubescent; sepals 4, oblong-obovate, 3-nerved, apically obtuse, marginally involute, 7-11 mm. long, 3.5-5 mm. broad; stamens numerous, the outer longer and perhaps infertile, the anthers basifixed, 2-celled, 0.7-1.0 mm. long, longitudinally dehiscent; filaments flattened; pistillodes plumose when present. Carpellate inflorescences similar to the staminate, the sepals 4, 3-nerved, early-caducous, 6-11 mm. long, 3-5 mm. broad; carpels numerous, ovary 1-2 mm. long, arcuate-ellipsoid, pubescent, the plumose styles 5-10 mm. long. Mature achenes compressed-ellipsoid, flanged, 2.5-4.0 mm. long, 1.0-2.5 mm. broad, reddish-brown, the elongate plumose styles with hairs to 5 mm. long.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 11016
          archiveSourceId: C120A39B-CB71-4CCD-AEF0-6247CF323036
