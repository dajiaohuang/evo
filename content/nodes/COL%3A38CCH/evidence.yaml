        claims:
          - text: Shrubs to 50 cm high, mostly taller than broad, internodes white, papillate; leaves densely placed, trigonous to crescent-shaped with convex sides, keeled or nearly globose, 10-30 mm long, 5-6 mm broad, 5-6 mm thick, grey, epidermis with long papillae, wax platelets absent on tips terminal and subterminal cymes, the mostly 3-flowered inflorescences spreading in three dimensions), rarely in 2-dimensional candelabra, stout, calyx lobes 5, with 25-30 purple petals with a lighter coloured base, 8-15 pale pink filamentous staminodes and 70-80 stamens; fruits with valve wings much broader than expanding keels, tapering to base and tips, covering membranes with distinct, big closing rodlets, closing body hook-shaped, locules 5(-6).
            sourceIds:
