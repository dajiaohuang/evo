        claims:
          - text: Diffuse, prostrate, mat-forming subshrub, main stems bare, gnarled, up to ±5 mm diam., ultimate branches very slender (±1 mm diam.), stoloniferous, leafy, producing dwarf side shoots with closely rosetted leaves. Rosette leaves up to 10 x 5 mm, obovate; cauline leaves ±6 x 3 mm, imbricate, subspathulate, conduplicate, tips slightly recurved, all silvery sericeous. Heads homogamous, campanulate, ±15 mm long, 20 mm across the fully radiating bracts, sessile, solitary at the tips of the dwarf shoots. Involucral bracts in ±8 series, graded, closely imbricate, outer glossy crimson overlaid brown, much shorter and broader than inner, inner much exceeding flowers, white streaked crimson particularly below, opaque. Receptacle smooth. Flowers ±50-91, yellow. Achenes 1.75 mm long, ellipsoid, with myxogenic duplex hairs. Pappus bristles many, equalling corolla, scabrid, bases with patent cilia scarcely cohering.
            sourceIds:
