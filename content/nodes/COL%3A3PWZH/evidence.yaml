          originalSourceText: Vines; stems herbaceous and covered with scattered fleshy trichome-like structures, these often drying black. Leaves suborbicular to ovate in outline, deeply 3-7-lobed, 10-20 cm long, cordate basally, the lobes ovate to lanceolate, acuminate. Flowers solitary or in 3-12-flowered cymose clusters, covered with fleshy trichomes; sepals oblong, 10-14 mm long, obtuse, subcoriaceous, covered with fleshy trichomes; corollas pink to lavender, salverform, the tube 5-6 cm long, the limb campanulate to subrotate. Fruits capsular, subglobose to depressed- globose, 1.5-2 cm in diameter; seeds co-mose.
