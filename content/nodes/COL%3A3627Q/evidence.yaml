            locator: "SANBI/WFO archive Morphology row 1665; source identifier 11118.0; cited publication: Herman, PPJ; Retief, E. 1997. Plants of the northern provinces of South Africa: Keys and diagnostic characters. Strelitzia 6: 1 - 681. National Botanical Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: A dainty species 300-750 mm tall with leaves 1-4 mm wide and short, dense spikes of small, mauve to magenta flowers, the perianth 13-18(-20) mm long. The short bracts, (10-)14-16 mm long, are lightly to densely flecked but always with whitish margins. Dierama floriferum differs in its clumped habit and more numerous coflorescences (mostly 4 to 9 vs. 2 or 3).
            textZh: SANBI 条目提供了 Dierama medium N.E.Br. 的鉴别特征。
