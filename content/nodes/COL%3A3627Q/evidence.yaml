    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous herb, up to 0.75 m high. Terminal spike 4-10-flowered. Coflorescences mostly 2 or 3. Bracts 4-6 mm broad, tip of each reaching to or well above base of second bract above it. Flowers very pale mauve to magenta-pink.
            textZh: Dierama medium N.E.Br. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
