    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Succulent herb, up to 3 m high. Stems leafless below but with lax apical tuft of leaves. Inflorescence 250-400 mm long, sublax to subdense. Pedicels 2-6 mm long. Perianth up to 20 mm long. Flowers lemon-yellow to scarlet.
            textZh: Aloiampelos tenuior (Haw.) Klopper & Gideon F.Sm. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
