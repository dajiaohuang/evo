            locator: "SANBI/WFO archive Morphology row 188; source identifier 11118.0; cited publication: Herman, PPJ; Retief, E. 1997. Plants of the northern provinces of South Africa: Keys and diagnostic characters. Strelitzia 6: 1 - 681. National Botanical Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Aloe tenuior has a large, subtuberous to subwoody rootstock. This species differs from A. ciliaris in that the leaf bases are not at all auriculate, and the anthers and style are long-exserted. The flowers of A. tenuior are somewhat smaller than those of A. ciliaris. In A. striatula the racemes are dense, and the flowers are decurved and about twice as long as those of A. tenuior.
            textZh: SANBI 条目提供了 Aloiampelos tenuior (Haw.) Klopper & Gideon F.Sm. 的鉴别特征。
