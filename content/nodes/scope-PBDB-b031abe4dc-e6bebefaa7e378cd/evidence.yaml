  claim-rationales.zh:
    - 陡山沱三管状化石的分类字段只陈述所引研究与导航范围；不会把矩阵位置、数据库映射或样本相似性改写为直系祖先。
    - 陡山沱三管状化石的地理字段限于具名样本或明确模型范围，不外推为全球分布、起源中心或完整扩散路径。
    - 陡山沱三管状化石的生态字段区分保存事实与功能推断；未被直接记录的饮食、行为、栖息地偏好和性能均保留不确定性。
    - 陡山沱三管状化石的形态字段限于主研究列明的标本、样本或分析，并连接到精确页码、图版或补充材料。
    - 陡山沱三管状化石的年代范围是有界的标本、地层或模型投影，不作为全球首现、末现、分化时间或连续谱系时长。
  claim-statements.zh:
    - Eocyathispongia qiania 以一件磷酸盐化标本为代表，被解释为具有海绵级组织；本档案不将该解释等同于冠群多孔动物归属或直系祖先关系。
    - 本档案的化石记录限于贵州陡山沱组的瓮安生物群，不能据此确立全球分布。
    - 固着悬浮摄食方式是根据所提出的海绵级体制推断的；食物、泵水活动及生境偏好并未被直接观察。
    - 正模标本保存了毫米级多细胞身体，具有三根管、漏斗状开口及类似出水孔的开口；这些结构通过扫描电子显微镜和断层成像呈现。
    - 图集中的 609–600 Ma 包络是一件标本的组级地层背景，并非 Eocyathispongia 或多孔动物的全球首现、末现或谱系延续时长。
