            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: A recently discovered species evidently closely allied to Tritoniopsis parviflora but distinguished from it by the creamy white flowers with the apices and outer surface of the tepals flushed dark brownish pink. The tepals are linear, the dorsal 2.0-2.5 mm wide and the upper laterals ± 1.5 mm wide, and the filaments are relatively long, 15-16 mm long.
