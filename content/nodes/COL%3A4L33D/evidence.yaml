    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Glandular-hairy annual to 23 cm. Leaves narrow and coarsely toothed. Flowers in lax racemes, white to cream-coloured with orange patch at base of upper lobes, salver-shaped, tube glabrous, 8-25 mm long.
            sourceIds:
              - sanbi_14442_0
            locator: "SANBI/WFO archive Morphology row 5895; source 14442.0; publication: Manning, JC; Goldblatt, P. 2012. Scrophulariaceae: Polycarena Benth. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 752 - 752. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: It can be confused with P. gilioides sens, strict., from which it may be distinguished by its glabrous (not pubescent) corolla tube, which is 8-12(-25) mm long (versus 7.5-10 mm) with limb 7-13.5 mm across (versus 5-8 mm), and both tube and limb often flushed purple outside (not so in P. gilioides). There is some difference too in the arrangement of the flowers, the raceme being very lax in P. gracilis, congested in P. gilioides and elongating only slightly in fruit. P. gracilis and P. gilioides may interact where their areas overlap, but the lax inflorescence and particularly the glabrous corolla tube of P. gracilis are good distinguishing characters.The relationship of P. gracilis possibly lies with P. aemulans, which has lax racemes and corolla tube and limb flushed purple outside, but P. gracilis may be distinguished by its relatively narrower upper leaves (6-30 x 0.25-1.5(-2) mm, linear or narrowly oblanceolate, versus 6-15 x 1-3 mm, spathulate), calyx 4-6 mm long (versus 2.5-4 mm), corolla tube glabrous (not pubescent), limb 7-13.5 mm across (versus 3-9 mm), stamens always 4 (not often reduced to 2 or 3).
            textZh: SANBI 条目提供了该种的鉴别特征。
            sourceIds:
              - sanbi_8611_0
            locator: "SANBI/WFO archive Diagnostic row 57347; source 8611.0; publication: Hilliard, OM. 1994. Manuleae, The: a tribe of Scrophulariaceae. Edinburgh University Press, Edinburgh. [All rights reserved]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
