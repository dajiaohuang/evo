    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, 6-20 cm, branching mostly near base. Leaves sword-shaped, crowded at base, sheathing the stem. Flowers dull yellow, yellow-green or brown, with banded or speckled markings and darker margins, often putrid-smelling, claws broad, forming a wide cup, nectaries usually basal, dark-coloured, anther lobes diverging, capsules beaked.
            textZh: Ferraria variabilis Goldblatt & J.C.Manning 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 7491; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Distinguished by its fairly low, tufted habit, rarely exceeding 200 mm in height, with the relatively few branches crowded near the base, combined with fairly large flowers with broad tepal claws forming a deep, relatively wide bowl in which nectar accumulates in a pool. The spreading tepal limbs vary considerably in colour and marking. In the north of its range, in Namaqualand and southern Namibia, flowers have light brown tepal limbs with a dark purple longitudinal band toward the base and light brown margins, while the claws are pale greenish cream-coloured with a narrow darker band running down the midline. The nectaries in the northern populations are fairly large and green or less often purple-black. In the western and southern Karoo and the southern Cape, populations have greenish yellow or pale to middle brown tepal limbs, usually darker in the midline, and with small or medium-sized spots in the lower 1/3 or when brown then often with spots irregularly scattered across the limb and the margins sometimes slightly darker coloured. The claws are pale, usually with a darker streak in the midline and have a small dark nectary at the base or on the inner tepals, shortly above the base. Perianth colour can vary as much within a population as across the entire southern Cape and western Karoo. Ferraria variabilis is heteroploid, the northern populations are diploid, 2n = 20, whereas the southern are tetraploid, 2n = 40, this based on several counts across its range. A notable variant from the Olifants River Valley and adjacent mountains has leaves broader and more succulent than found elsewhere, up to 20-22 mm wide (versus typically 4-12 mm for most other populations), and the rest of the plant is also larger, thus the outer spathes are 50-70 mm long and the inner may reach 85 mm. Plants form circular mats in stony ground, which suggests spreading by vegetative means. Populations from the Tanqua Basin and nearby hills stand out in having the nectaries located in prominent pouches in the middle of the tepal claws, rather than at the bases of the claw. The anthers in these populations and some others from nearby have the anther thecae held ± parallel, although joined together only at the tips, as they are in plants from other parts of the range, which have widely diverging anther thecae.
