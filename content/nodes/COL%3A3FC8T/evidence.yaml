        usage:
          title: Gasteranthus delphinioides (Seem.) Wiehler, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Terrestrial herbs or low shrubs; stems erect with few branches, terete, pilose toward the apex, glabrescent below. Leaves nearly equal in a pair, lanceolate to ovate or elliptic, 7-16 cm long, 4.2-10.0 cm wide, subcoriaceous, the apex acute, the base cuneate, or acute, subentire to serrulate, above dark green, glabrous, below lighter green, with darker strigillose veins; petiole thick, 1.0-2.5 cm long, strigose. Inflorescences axillary but appearing terminal by reduction of the stem apex, shorter than the leaves; peduncles 2-7 cm long, sparsely pilose; pedicels ca. 1 cm long. Flowers showy, one to a few per in- florescence; calyx lobes nearly free, unequal, the anterior and the lateral lobes broadly ovate, to 1.5 cm long, ca. 1 cm wide at base, the posterior lobe deflexed by the corolla spur and longer, serrulate to entire, membranous to subcoriaceous, sparsely pilose; corolla white, yellow or pinkish, with reddish streaks or spots or orange yellow inside, horizontal in the calyx tube with a conspicuously curved acute spur ca. 2 cm long, campanulate, ventricose, 3.5-7.0 cm long, the limb bilabiate with the lower lobe exceeding the upper lobes, sparsely pilose, the lobes short and recurved; stamens held well within the corolla tube, ca. 1.5 cm long, the anthers coherent by their apices; stigma bibbed. Fruit and seeds not seen.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 6315
          archiveSourceId: C9291B00-C886-4637-9CB0-4D887044CDE2
