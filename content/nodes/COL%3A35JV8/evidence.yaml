        claims:
          - text: A pairwise-distance phylogeny and principal-component analysis of 21 historical and modern Sumatran rhinoceros genomes recovered three main population groups associated with Sumatra, the Malay Peninsula, and Borneo. The tree and clustering analyses also distinguished northeastern and southwestern lineages within Sumatra. The Malay Peninsula samples grouped together, contrasting with an earlier mitogenome result. These findings describe the sampled populations; they do not establish a species-level ancestry tree or formal conservation units.
            textZh: 研究者对 21 份历史及现代苏门答腊犀基因组进行成对遗传距离系统发育分析和主成分分析，得到分别与苏门答腊、马来半岛和婆罗洲相关的三个主要种群群组。系统发育树和聚类分析还区分出苏门答腊岛东北部与西南部谱系。马来半岛样本归为同一群，与较早的线粒体基因组研究结果不同。这些发现描述的是本研究取样所见的种群结构，不代表物种级祖先关系树或正式保育单元。
            originalLanguage: en
