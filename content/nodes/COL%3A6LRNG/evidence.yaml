        claims:
          - text: Cormous geophyte, 80-250 mm tall, corm ovoid, tunics overlapping. Leaves sword-shaped. Flowers 1-3 per spike, purple with dark central markings, tepals spreading, shorter than elongate perianth tube, open in the day and unscented.
