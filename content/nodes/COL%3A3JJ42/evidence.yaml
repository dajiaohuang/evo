        claims:
          - text: Succulent shrub, up to 60 mm tall, compact when young, later developing decumbent to creeping long shoots. Leaves in pairs of dissimilar size and shape, adpressed or spreading in wet conditions, trigonous, up to 15 mm long, 4 mm thick, glaucous, with small apical teeth. Flowers solitary, ± 25 mm diam., on pedicels up to 25 mm long, petals pink, longitudinally striped. Fruit 5-locular, valve wings broad, without closing bodies.
