    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants 500-650 mm high. Corm ± globose, ± 12 mm diam. with tunics of medium-textured, mostly vertical fibres. Stem simple or with 1 short, filiform branch subtended by scale-like, translucent, acute bract and prophylls 2-3 mm long. Leaves 3 or 4, all with expanded blades, ± 2/3 as long as stem, linear, 1.5-5.0 mm wide; margins and main vein moderately thickened, pale, hyaline, raised when dry. Spike 8- to 11-flowered, branches when present fewer-flowered; bracts membranous, translucent, 5.5-7.0 mm long, outer several veined, with only central vein or 3 veins prominent, 1- or 3-toothed with central tooth largest, inner 2-veined, 2-keeled and acutely 2-toothed. Flowers upright, rotate, pink, tepals white in lower 1/3, unscented; perianth tube ± 5 mm long, filiform; tepals united basally for ± 1 mm, obovate, 14-16 x 7 mm, spreading ± horizontally. Filaments erect, ± 3.5 mm long, white, ± 4 mm long; anthers suberect, ovoid, connective expanded, visible on abaxial surface; pollen yellow. Style dividing opposite lower 1/3 to middle of anthers, branches ± 3.5 mm long, yellow.
            textZh: Ixia roseoalba Goldblatt & J.C.Manning 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Morphology row 98816; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: With a filiform perianth tube and filaments inserted at the tube mouth, Ixia roseoalba is distinguished in sect. Ixia by the relatively small, pale pink flowers, the tube ± 5 mm long and tepals ± 16 x 7 mm. Unusual for the section, the flowers have a white centre. The filaments and anthers are pale yellow and the style divides opposite the lower third to middle of the anthers. More important, the anthers are unusual in having the connective expanded and visible as a narrow line between the thecae on the outer (abaxial) surface, rendering the thecae almost latrorse. The bracts, typical of sect. Ixia, are translucent and the outer, with several veins, the central one most prominent and reaching the margin, is 3-toothed with the central tooth largest or all three teeth subequal. The long style dividing opposite the lower third to middle of the anthers recalls I. patens but this species, often more slender but with larger, pink or red flowers usually sometimes more darkly pigmented in the centre, has tepals ± 20 x 10 mm and conventional linear anthers without visible connective.
            textZh: SANBI 条目提供了 Ixia roseoalba Goldblatt & J.C.Manning 的鉴别特征。
