    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Erect, much-branched herbs 4-15 cm high. Leaves 0.6-1.4 cm long, 3-4 mm broad, ovate-lanceolate or narrowly elliptic, acute, the lower ones reduced and often scale-like. Inflorescence many-flowered, dense or sub-dense; bracts well-developed. lanceolate to linear lanceolate. Calyx with a tube 6.5-9 mm long; lobes 5, each 2.5-3.5 mm long, lanceolate or ovate-lanceolate to ovate, acute or acuminate, often mucronate, keeled. Corolla yellow; tube 7-11 mm long; lobes 4.5-8 mm long, 3-5 mm broad, obovate, obovate-orbicular, or ovate, rounded, sometimes apiculate. Filaments very short, inserted immediately to 0.75 mm below the corolla-sinuses; anthers 1.75-2 mm long, each with a small stipitate apical gland. Style and stigma 5.5-7.5 mm long with a fairly large stigmatic swelling below the middle; stigma 2-lobed, the lobes broad.
            sourceIds:
              - sanbi_9228_0
            locator: "SANBI/WFO archive Morphology row 50316; source 9228.0; publication: Marais, W; Verdoorn, IC. 1963. Gentianaceae, Fl. S. Africa 26: 171 - 243. Dept. Agric. and Technical Services, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
