  claims:
    - subjectId: event:myxozoan-genome-reduction
      claimKind: scientific
      claimType: topology
      statement: Genome and transcriptome assemblies place sampled Myxozoa as cnidarians sister to Polypodium and associate their microscopic parasitic body plans with extreme genome and gene-content reduction.
      confidence: high
      confidenceRationale: Multiple assemblies and a 51,940-amino-acid matrix support placement and reduction; results remain limited to sampled parasites and comparative gene annotations.
      referenceLinks:
        - referenceId: chang-2015-myxozoa
          relation: supports
          pages: 14912–14917
          figure: Figures 1–4; Supplementary Figures; genomic assemblies
          quoteLocator: 77-taxon phylogeny, genome-size estimates and gene-category comparisons
  claim-rationales.zh:
    - 多份组装和 51,940 氨基酸矩阵支持其位置与缩减；结论仍限于取样寄生物和比较基因注释。
  claim-statements.zh:
    - 基因组和转录组组装把所取样的黏体动物置于刺胞动物内、与 Polypodium 互为姐妹群，并将其微型寄生体制与基因组及基因内容的极端缩减联系起来。
