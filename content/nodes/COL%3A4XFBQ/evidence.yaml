        usage:
          title: Simira maxonii (Standl.) Steyerm., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Trees to 20 m tall forming a spreading crown, the twiglets ultimately 4-angled, usually turning red on exposure to air, glabrous, the nodes with subrotund scars, drying red. Leaves oblong rotund, 12.5-32.0(-60.0) cm long, 10-26(-40) cm wide, widely cuneate at the apex, acuminate, the acumen 2.0-3.5 cm long (probably longer in larger leaves), tapering obtusely toward the base and often slightly auriculate, the costa immersed above, prominent beneath, often conspicuously lenticellate, the lateral veins 16-20, at first strict, finally arcuate near margin, the secondary veins irregularly pinnatiform, thinly coriaceous or stiffly papyraceous, deep red brown above, often reddish beneath, glabrous above, glabrescent to densely white villose beneath; petioles absent or to 0.5 cm long; stipules not seen. Inflorescences terminal, solitary, paniculate, to 10 cm long; peduncle, if present, 1-3 cm long, the branches few, radiate from the tip of the twiglet or disposed in 2 pairs along the rachis, the branches opposite, to 2.5 cm long, drying red, the hairs stiff and short, a large bract located at the base. Flowers with pedicels 3 mm long; hypanthium to 8 mm long, pubescent, the calycine lobes 5, longer than the cup, compressed oblong, wider than long, the margin ciliolate, the cup with a number of glands within, these oblong, 0.1-0.2 mm long, brown; corolla yellow green turning orange, funnelform, to 8 mm long, minutely puberulent outside, villosulose at point of filament attachment, coriaceous to thickly carnose, the lobes oblong rotund or ovate oblong, to 2.5 mm long, obtuse; stamens 4, the anthers slightly or conspicuously exserted, oblong, 2.3-3.0 mm long, obtuse, the filaments 3-5 mm long, pubescent, carnose, each dilated at the point of attach- ment; ovarian disc doughnut shaped, ca. 1 mm long, the style to 10 mm long, somewhat thickened, pubescent, the stigmatic lobes oblong rotund or ovate ro- tund, to 2.5 mm long, obtuse. Fruits subsessile, rotund or oblong, ca. 6 cm in diam., the walls thick and lignose, not ribbed; seeds to 2.5 cm long, broadly winged.
