    - 成像与标本输入明确，但分割、复原、体积假设和多件个体组合决定运动推断。
  claim-statements.zh:
    - 由孵化幼体、一龄 PVL 4587 与成年鼠龙样本建立的数字模型显示估计质心前移，并支持个体发育中的二足到四足姿态变化；该姿态来自多件个体组合的模型，并非保存下来的步态或演化阶段。
