        claims:
          - text: Like M. crassifolia but leaves gland-dotted on midrib and margins only.
            sourceIds:
              - sanbi_14405_0
            locator: "SANBI/WFO archive Morphology row 11022; source 14405.0; publication: Manning, JC; Goldblatt, P. 2012. Rutaceae: Macrostylis Bartl. & H.L.Wendl. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 721 - 721. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: The ripe seeds are ejected in the normal way by a catapult mechanism. As far as can be seen regeneration takes place only from seed. The leaves, when crushed, are almost without any smell. This species has been placed in the genus Macrostylis Bartl. & Wendl. because each one of the following characters, which it possesses, helps to exclude it from some other genus in the Diosmeae. (1) Heads multiflorous, up to 6. (2) Petals villous, mostly down the midrib. (3) Staminodes vestigial. (4) Anthers with a minute apical gland. (5) Disc encloses the ovary. (6) Stigma capitellate, larger than usual in the genus. (7) Style & filament long, exceeding the petals. (8) Style & filament glabrous. (9) Ovary 3-carpellate. (10) Fruit with fairly short horns, 2 mm long, which is unusual in the genus. Macrostylis cauliflora is recognised as distinct on account of being a pseudo-cauliflorous shrub with leaves gland-dotted only on the midrib and margins, with leaves, petals, style and filaments all smaller than usual and with the stigma rather larger than usual. It is, in appearance, most like Macrostylis crassifolia Sond. but differs in that the leaves of Macrostylis crassifolia are gland-dotted all over, not only on the midrib and margins. The name is an allusion to the habit of this plant of bearing the flowers below the leafy branchlets.
            textZh: SANBI 条目提供了该种的鉴别特征。
