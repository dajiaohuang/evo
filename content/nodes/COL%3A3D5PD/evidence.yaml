        claims:
          - text: Dwarf, closely leafy, ericoid shrublet to 25 cm. Leaves ascending, closely imbricate, 2-5 mm long. Flower heads radiate, yellow, solitary, clustered at branch tips, bracts free.
            sourceIds:
              - sanbi_14144_0
            locator: "SANBI/WFO archive Morphology row 10402; source 14144.0; publication: Manning, JC; Goldblatt, P. 2012. Asteraceae: Euryops (Cass.) Cass. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 372 - 375. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: On account of the free involucral bracts E. muirii was transferred by Compton to his genus Lysichlamys, which however must be sunk in Euryops. The small and imbricated, somewhat curved leaves together with the small capitula give this species a quite characteristic appearance. From the other small-leaved species, e.g. E. candollei, it is distinguished by the free involucral bracts and the pubescent achenes.
