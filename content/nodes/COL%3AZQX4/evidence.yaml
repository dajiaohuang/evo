        usage:
          title: Croton pungens Jacq., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrub or tree 1-5(-20?) m high; monoecious; young twigs with hispidulously stellate-tomentose indumentum. Leaves thinly chartaceous; petioles hispidulous- tomentose, (1-)2-6 cm long, the glands at apex of petiole 2-4, patelliform, dis- tinctly stalked, 0.4-0.8 mm across (stalk ca 0.7-1.5 mm long); stipules linear to subulate, 1.5-4 mm long, sparsely stellate; blades ovate, ca 5-15 cm long, 2-10 cm broad, greenish above and rather sparsely pubescent with scattered oligoradiate stellate or short-stalked dendritic hairs, whitish-tomentose beneath with multiradi- ate dendritic hairs (ca 0.4-0.8 mm across), 5-7-nerved at base, with 3-6 additional veins on either side, the veinlet reticulum rather prominent beneath, the base usually cordate, the margins entire to finely denticulate, the apex abruptly acumi- nate. Inflorescences terminal (sometimes pseudoaxillary), bisexual or sometimes staminate, racemiform, (3-)10-22 cm long; bisexual inflorescences with 1-15 proximal hermaphriditic cymules, distal cymules male; bracts lanceolate, acute to, acuminate, tomentose, ca 1-3 mm long, each subtending several flowers. Staminate flowers with hispidulous-tomentose pedicels 3-8 mm long; calyx-lobes 5, triangular, stel- late-tomentose, 2.2-2.5 mm long, 1.1-1.5 mm broad; receptacle densely villose; petals obovate, 2.3-2.9 mm long, 1-1.3 mm broad, glabrous except for the minutely ciliate margins; stamens 27-43, the filaments 2.5-3 mm long, glabrous and +- papil- lose, the anthers elliptic, 0.7-1 mm long. Pistillate flowers subsessile, the stout pedicels even in fruit only 1-2 mm long; calyx-segments 5, ? unequal, oblong to linear-lanceolate, valvate, 2.5-3.7 mm long, 0.7-1.6 mm broad, stellate-tomentose on both faces; disc obscure; petals (staminodia?) antheriform, callose, swollen, ca 0.3-0.4 mm long; ovary closely tomentose with tawny stellate hairs, the styles free, bifid, copiously stellate-pubescent, ca 4-4.5 mm long, divided more than l/2 way to the base. Capsules obovoid, ca 6.5-7.5 mm long, yellowish, closely stellate- scurfy, the columella slender, apically 3-pronged, ca 5.5-6 mm long; seeds plump, dull to blackish brown, rugose-costate, 5.1-5.7 mm long, 3.6-4.1 mm broad, the caruncle ovate, ca 1.5 mm wide.
          originalLanguage: en
          sourceField: general
