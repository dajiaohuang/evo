          title: Boerhavia erecta L., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Annual herbs; stems erect or ascending, 2-8 dm. tall, rather slender, glabrous or essentially so. Leaves opposite or subopposite, often unequal at the nodes, petiolate; blade rather irregularly ovate-rhombic, obtuse to rounded, or infrequently acute, at the apex, broadly obtuse to rounded at the base, undulate or sinuate, 2-9 cm. long, 1-4 cm. broad, glabrous or essentially so, yellowish green above, paler and more or less conspicuously bracteate, glabrous or essentially so. Flowers in pedunculate 2- to 3-flowered dichasia, distinctly pedicellate, the perianth tube 1.0-1.5 mm. long, about 0.5 mm. broad, herbaceous, glabrous, the perianth limb campanulate, about 0.5-0.7 mm. long, white or pink; stamens 2-3, slightly exserted. Anthocarps obpyramidal, truncate, glabrous, 3-4 mm. long, 1.0-1.5 mm. broad, borne upon accrescent pedicels of about equal length.
