    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Perennial herb, geophyte, 0.6-1.5 m high; corm tunics brown, coarsely reticulate; stem inclined below, simple. Leaves lanceolate to linear, 10-18 mm wide, margins and midrib thickened. Bracts strongly imbricate, dry and brownish, apiculate to attenuate, inner apically forked. Inflorescence a dense spike; flowers pink, rarely white, with dark pink streak in lower midline of each tepal, nearly bilabiate; tepals broadly lanceolate, apiculate; upper 3 ascending; lower horizontal. Stamens unilateral, included, arcuate to horizontal below upper tepal; filaments 10-12 mm long; anthers 9-11 mm long, unilateral, pale to whitish. Ovary oblong; style arching over filaments. Flowering time Jan.-Dec. Capsule narrowly ovoid.
            textZh: Watsonia densiflora Baker 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_18505_0
            locator: "SANBI/WFO archive Morphology row 91095; source identifier 18505.0; cited publication: Bredenkamp, CL; Magwaza, ZL. 2019. Iridaceae. In: CL Bredenkamp (ed.), A Flora of the Eastern Cape Province, Strelitzia 41(3): 1821 - 1882. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Distinguished from other species with dense spikes of moderate-sized, pink, funnel-shaped flowers and coarse, dry, brown, overlapping bracts by its densely clumped habit, with the stems inclined at the base and then sharply erect below the spike. The bracts are greenish straw-coloured with noticeably darker brown margins and pale venation. Watsonia canaliculata has similar pale bracts but is a solitary-growing species with erect stems and channelled leaves; W. pulchra has dark brown bracts and broad leaves, (10-)15-30 mm wide with heavily thickened margins; and W. lepida is a shorter, solitary-growing species, with the lowermost leaves dry and broken at flowering, and uniformly dark brown bracts.
            textZh: SANBI 条目提供了 Watsonia densiflora Baker 的鉴别特征。
