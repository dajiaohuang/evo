          - text: "Aloe craibii Gideon F.Sm., is unique through a combination of leaf and vegetative characters. Its flowers are small, consistently yellow and zygomorphic, and densely arranged in an inflorescence of which the shape can best be described as transitional between cylindrical and flat-topped (or head-shaped). Among the grass aloe species with such head-shaped, or almost head-shaped inflorescences and small yellow flowers, the flowers of A. craibii are more distinctly upturned (zygomorphic). Although this character is therefore not unique to A. craibii, it is very well developed in the new species. A number of grass aloe species have similar small, yellow flowers, particularly A. dominella Reynolds, some forms of A. ecklonis Salm-Dyck, A. hlangapies Groenew., A. integra Reynolds and A. krausii Baker. Two grass aloes mainly from KwaZulu-Natal Province (A. krausii Schonland: leaves strongly acuminate, sparsely, especially basally, spotted on lower surface; A. linearifolia A.Berger: leaves very narrowly linear, copiously basally spotted on lower surface), both of which have small, yellow flowers, need not concern us here as their leaf morphologies alone separate them easily from A. craibii. Furthermore, in both cases their geographical distribution ranges (A. krausii: mainly between Pietermaritzburg and Durban; A. linearifolia: mainly the KwaZulu-Natal south coast) represent a disjunction of several hundred kilometres from the locality where A. craibii was collected. The flowers of A. dominella are not as pronouncedly upturned as those of A. craibii in that they are more tubular and the plants carry their flowers in densely capitate racemes. A. ecklonis is a much more robust plant in all respects, with broad, flat leaves. The flowers of A. hlangapies, a species name often treated as a synonym of A. ecklonis, are much larger and orange, the inflorescence is very flat-topped and the leaves are much broader. The leaves of A. integra, perhaps the closest relative of A. craibii, are broader, their margins are smooth or only slightly ciliate, and the inflorescence is taller and somewhat conical to pyramid-shaped. A. krausii, another species often included in A. ecklonis, has spotted leaves and very flat-topped racemes and larger flowers."
