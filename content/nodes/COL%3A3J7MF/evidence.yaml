            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Haemanthus canaliculatus is a very distinctive member of the genus. It is the only species with succulent, narrowly ligulate (5-27 mm across), canaliculate leaves with red barring near the base. The inflorescence is closest in appearance to that of H. sanguineus but has a very spreading umbel with 5-7 narrow acuminate spathe valves. The bulb is made up of loose, fleshy tunics with oblique, truncate margins.
            textZh: SANBI 条目提供了 Haemanthus canaliculatus Levyns 的鉴别特征。
