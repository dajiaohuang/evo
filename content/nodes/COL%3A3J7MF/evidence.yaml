        status: partially-supported
        claims:
          - text: Bulbous geophyte to 20 cm. Leaves 2, dry at flowering, narrowly strap-shaped, suberect to recurved, spreading, glabrous, channelled, basally speckled with red beneath. Flowers slightly spreading, scarlet (rarely pink), bracts 5-7, acute, scarlet (rarely pink), somewhat leathery.
            textZh: Haemanthus canaliculatus Levyns 的 SANBI 物种条目记录了形态特征。
