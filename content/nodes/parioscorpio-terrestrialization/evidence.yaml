  claims:
    - subjectId: event:parioscorpio-terrestrialization
      claimKind: scientific
      claimType: ecology
      statement: Wendruff et al. (2020) interpreted Parioscorpio venator specimens UWGM 2162 and UWGM 2163 as scorpions and compared medial structures with a pulmonary-cardiovascular system. This claim records that study's terrestrialization hypothesis, not established scorpion anatomy, physiology or habitat.
      confidence: contested
      confidenceRationale: The original study's interpretation is documented, but subsequent redescription rejected scorpion identification. Preserved structures do not establish the proposed pulmonary-cardiovascular homologies or terrestrial habitat.
