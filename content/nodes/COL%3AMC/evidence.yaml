  claims:
    - subjectId: taxon:malacostraca
      claimKind: scientific
      claimType: topology
      statement: A morphology-based character matrix tests relationships among sampled malacostracan orders. The resulting topology is an analytical hypothesis and neither dates Malacostraca nor samples every fossil lineage.
      confidence: medium
      confidenceRationale: Confidence is medium because the cited primary study directly supports the bounded topology statement at the supplied locator. The confidence does not extend beyond the resulting topology is an analytical hypothesis and neither dates Malacostraca nor samples every fossil lineage.
      referenceLinks:
        - relation: supports
          referenceId: richter-scholtz-2001-malacostraca
          pages: 113–136
          figure: Figures 1–11; character matrix
          quoteLocator: Characters and taxa; cladistic analysis; discussion
    - subjectId: taxon:malacostraca
      claimType: fossil-range
      claimKind: scientific
      statement: The 500–0 Ma Malacostraca display uses the reviewed phyllocarid fossil minimum and must not be interpreted as a crown-Malacostraca divergence date.
      confidence: medium
      confidenceRationale: A systematic archaeostracan study and an explicit fossil-calibration table independently support the approximately 500 Ma phyllocarid bound while leaving crown placement distinct.
      referenceLinks:
        - referenceId: collette-hagadorn-2010-archaeostraca
          relation: supports
          pages: 795–820
          figure: Arenosicaris systematic account
          quoteLocator: Discussion of the earliest Middle–Late Cambrian Phyllocarida
        - referenceId: van-der-wal-2017-malacostracan-calibrations
          relation: supports
          pages: Article e3844
          figure: Table 1
          quoteLocator: Fossil calibrations identify phyllocarids as the oldest malacostracans at at least 500 Ma
  claim-rationales.zh:
    - 置信度为中：所引主研究在给定页码、图版或章节定位器处直接支持这一受限的拓扑表述；置信度不外推到文中明确排除的全群起源、全球首现、直接祖先或精确端点。
    - 叶虾类系统研究与明确化石校准表独立支持约 500 Ma 边界，同时将冠群位置作为不同问题。
  claim-statements.zh:
    - 基于形态性状的矩阵检验了所抽样软甲纲各目之间的关系。所得拓扑是一项分析假说，既未给软甲纲定年，也未覆盖全部化石谱系。
    - 500–0 Ma 的软甲纲显示采用经综述的叶虾类化石最低界，不得解释为软甲纲冠群分化日期。
