    facets:
      morphology:
        status: partially-supported
        claims:
          - text: "Annual herb, 0.15-0.38 m high. Stems branched from base or simple, few above, somewhat pilose in upper parts, shining pallid. Leaves sessile to subsessile; blade ovate or narrowly ovate, 6-43 x 1-17 mm, apex obtuse or rounded, base subtruncate, margins entire to dentate. Flowers: in many-flowered, lax, corymbose or oblong racemes, 25-128 mm long, shortly pilose; bracts distinctly denticulate; spur ± 5 mm long, extended conical, straight; corolla upper lobes oblong and rounded at apex, lower lip bilobed, 5.0-6.4 mm long, mouth closed, palate shortly haired, white, sometimes with purple streaks on upper lip; mostly Aug.-Dec. Fruit an obovate-oblong capsule, 8.5-9.6 mm long, base obliquely ovoid, widely notched not horned, valves obliquely truncate."
