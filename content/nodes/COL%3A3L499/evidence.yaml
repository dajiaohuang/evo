    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants 90-160 mm high. Corm bell-shaped with flat, sometimes oblique base, 10-15 mm diam.; tunics dark brown, inner layers ± woody, outer layers becoming soft and broken, margins minutely serrated. Stem unbranched, glabrous. Leaves 3(4), lower 2 leaves usually prostrate (suberect in deeply shaded sites), fleshy, flaccid, obtuse, 50-70 x 4-5 mm, with main vein raised, margins pale, slightly thickened, third leaf sheathing lower 1/3 of stem, slightly inflated, fourth leaf (when present) on upper part of stem, bract-like and entirely sheathing. Spike mostly 2- or 3(5)-flowered, outer bract 8-9 mm long, green flushed red distally, inner slightly shorter to ± as long, partly membranous with 2 green keels, notched apically. Flowers crepuscular, white, outer and sometimes inner tepals red to brown outside, rose-scented; perianth tube narrowly cylindric, slightly wider near apex, ± 5 mm long; tepals subequal, elliptic, ± 10 x 4 mm. Filaments ± 0.5 mm long; anthers ± 4 mm long, erect, pale yellow; pollen white. Style branches ± 2.5 mm long, arching upward, reaching to the lower 1/3 to slightly below middle of anthers in closed flower. Capsules and seeds unknown.
            textZh: Hesperantha laxifolia Goldblatt & J.C.Manning 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Morphology row 98658; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: With white, crepuscular flowers typical of the genus, Hesperantha laxifolia is distinguished by its small flowers, with tepals ± 10 mm long and a particularly short perianth tube only half as long. Also unusual, the short stamens have filaments only about 0.5 mm long and anthers ± 4 mm long. The style divides just below the mouth of the tube into ascending style branches only 2.5 mm long, likewise unusually small for the genus and reaching only between the lower third and below the middle of the anthers in the closed flower. The two basal leaves are slightly succulent and spreading to ± prostrate, although the leaves may be ascending to suberect in deep shade. The flowers are crepuscular, opening at ± 18:00 and closing again between 21:00 and 21:30. The bell-shaped corms with the tunic margins finely toothed are typical of sect. Hesperantha, but within the section the relationships of H. laxifolia are uncertain. Hesperantha montigena also has prostrate leaves but much larger flowers with a perianth tube 12-15 mm long and tepals 14-16 mm long, thus ± as long as the tube, and the corms are asymmetric, placing it in sect. Concentricae.
