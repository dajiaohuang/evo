        claims:
          - text: Compact, dwarf succulent, with up to 40 branches but mostly fewer, 2 or 3 leaf-pairs to a branch. Leaves trigonous, narrowing gradually from base to tip, 20-50 x 5-12 mm. Flowers in cymes of 1-3, with bracts and bracteoles, outer spreading petals at most as long as calyx lobes, petals merging into filamentous staminodes, stiff, white, later yellowish. Fruit 5-locular, with broad valve wings and no closing body, 6-8 mm diam.
