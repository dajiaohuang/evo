    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Decumbent suffrutex, branches up to 0.45 m long; gland-dotted, coarsely hairy with white, stipitate, stellate hairs, cobwebby at growing points. Leaves petiolate, oblong, finely serrate with marginal, stipitate, stellate hairs. Stipules leaf-like, clasping, ovate. Inflorescences 2-flowered; peduncles ± 30 mm long; pedicels filiform, gland-dotted, coarsely hairy with sessile, stellate hairs. Flowers 13 mm long, yellow, becoming orange. Calyx campanulate, 5-lobed to less than middle, lobes attenuate; gland-dotted interspersed with white, sessile, stellate hairs, stipitate stellate hairs on venation, simple hairs on margins. Petals twice as long as calyx. Flowering time July-May.
            sourceIds:
