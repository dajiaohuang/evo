    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, 80-150 mm tall, branching at base, corm tunics brown, margins scalloped. Leaves sword-shaped, ribbed, occasionally lightly hairy. Flowers several in a short to long spike, cherry red with cream and dark red markings on the lower tepals, perianth tube elongate-cylindrical, bracts keeled, curved upward at the tip.
            textZh: Lapeirousia silenoides (Jacq.) Ker Gawl. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_14562_0
            locator: "SANBI/WFO archive Morphology row 33276; source identifier 14562.0; cited publication: Goldblatt, P; Manning, JC. 2013. Iridaceae. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 94 - 124. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: The bright magenta to cerise flower with darker colour in the centres of the lower tepals and cream-coloured streaks or blotches on the lower tepal bases instantly identify Lapeirousia silenoides over most of its range. To the south, in the Vanrhynsdorp and Clanwilliam districts, L. pyramidalis may be similarly coloured, though more often purple to violet, but the two species can be separated by their different bracts, narrow to fairly broad and acute with an upturned apex in L. silenoides but broad and often retuse with the apex curving downward in L. pyramidalis.
            textZh: SANBI 条目提供了 Lapeirousia silenoides (Jacq.) Ker Gawl. 的鉴别特征。
