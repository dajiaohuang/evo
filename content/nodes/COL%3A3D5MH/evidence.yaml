    facets:
      morphology:
        status: partially-supported
        claims:
          - text: A copiously branched shrub or shrublet, 0.1-1 m or sometimes up to 1.5 m high, forming dense and rounded bushy clumps -1 m wide; branches erect or ascending, basally often prostrate and sometimes rooting at nodes, glabrous in all parts, except for a lax arachnose tomentum at the peduncle-bases. Leaves imbricated, erect and appressed or ± spreading, oblong-lanceolate from a flat and dilated base, entire, 2-5 mm long, semi-terete, 1 mm wide or more near the base, tapering to c. 0.5 mm near the apex, flat on the adaxial side, convex and keeled and with a thick midrib on the abaxial side, obtuse-acute, apiculate with an inflexed, often white point. Leaf-base ± half-clasping with sparsely ciliate margins. Peduncles lateral in the leaf-axils and with 2 lateral ± reduced or well-developed leaves and a tuft of wool at the base, erect or sub-erect, 2-25 mm long, 0.2-0.5 mm wide, terete. Involucre campanulate, 2-4 mm high, 2-5 mm wide. Involucral bracts (6-)8(-10), uniseriate, connate to c. 2/3, distinctly 3-nerved; the free lobes deltoid-narrowly triangular, c. 1 mm long, subobtuse-acute, with fimbrillate-ciliate margins and tips. Receptacle flat or somewhat convex, alveolate. Ray-florets 5-8, yellow. Tube 0.7-1.5 mm long, cylindrical. Lamina oblong or elliptic-oblong, 2-6 mm long, 1-3 mm wide, 4(-7)-nerved. Style terete with swollen base; style branches c. 0.5 mm long, obtuse-truncate. Disc-florets c. 13-25. Corolla 2.0-3.5 mm long. Tube 0.6-1.3 mm long, cylindrical. Limb campanulate, 1.4-2.5 mm long; lobes deltoid-narrowly ovate, 0.5-0.8 mm long. Anthers 1-1.5 mm long incl. the ovate subacute appendage. Style terete with swollen base, sterile; stylophore short; style branches 0.2-0.4 mm long or sometimes shorter, without stigmatic swellings, tips somewhat convex or conical. Pappus bristles numerous, 1.5-2.5 mm long, erect, white. Achenes elliptic-oblong-narrowly oblong-obovate, 2-3 mm long, 0.7-1.5 mm wide, subterete, light brown, glabrous, with 5-10 ribs.
