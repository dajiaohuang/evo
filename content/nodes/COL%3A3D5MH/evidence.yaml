        claims:
          - text: It grows in mountain grassveld, on slopes and in rocky places, at altitudes between 1500 and almost 3000 m s.m. The species shows a preference for bare patches and sometimes grows on roadsides and in eroded places. It possibly acts as a pioneer plant on bare soil, where the branches easily root and the shrubs may grow quite wide and dense.
