    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, 120-200 mm tall, sometimes with 1 or 2 short branchlets. Leaves linear to falcate, rigid, up to 4 mm wide. Flowers 6-10 in a 2-ranked spike, deep pink, perianth tube filiform, 3-5 mm long, tepals spreading, 9-14 mm long, stamens unilateral, fully exserted.
            textZh: Ixia curvata G.J.Lewis 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_14562_0
            locator: "SANBI/WFO archive Morphology row 33252; source identifier 14562.0; cited publication: Goldblatt, P; Manning, JC. 2013. Iridaceae. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 94 - 124. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Relatively low growing, Ixia curvata is a small plant, seldom exceeding 200 mm in height (although taller plants are known) and has nodding, pink flowers with tepals held vertically with stamens borne horizontally. Like other members of ser. Euanthera, the anthers split completely. The four or five leaves are typically falcate and leathery rather than fibrotic. Its immediate relationships remain uncertain. Other species of the series have upright flowers with tepals spreading horizontally. The plants are notable in the thick collar of fibres around the base and chestnut-brown cataphylls. Raimondo et al. (2009) regarded the conservation status as of Least Concern (LC) noting the relatively modest range of the species.
            textZh: SANBI 条目提供了 Ixia curvata G.J.Lewis 的鉴别特征。
            sourceIds:
