            locator: "SANBI/WFO archive Diagnostic row 84446; source identifier 15933.0; cited publication: Goldblatt, P; Manning, JC. 2012. Systematics of the southern African genus Ixia (Iridaceae): 4. Revision of sect. Dichone. Bothalia 42(2): 87 - 110. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Relatively low growing, Ixia curvata is a small plant, seldom exceeding 200 mm (although taller plants are known) and has nodding, pink flowers with vertically oriented tepals with horizontal stamens. Like other members of ser. Euanthera, the anthers split completely. The four or five leaves are typically falcate and leathery rather than fibrous. Other species of the series have upright flowers with tepals spreading horizontally. The plants are notable for the thick collar of fibres around the base and chestnut-brown cataphylls.
