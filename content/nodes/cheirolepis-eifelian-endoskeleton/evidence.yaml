  claims:
    - subjectId: event:cheirolepis-eifelian-endoskeleton
      claimKind: scientific
      claimType: morphology
      statement: CT-scanned Cheirolepis trailli specimens from late Eifelian Achanarras Limestone preserve a mosaic of early ray-fin characters, including an imperforate propterygium and hyomandibular shaft plus peg-and-socket scales; the specimens neither define the global actinopterygian first appearance nor represent a demonstrated direct ancestor.
      confidence: medium
      confidenceRationale: Named museum specimens, scan methods and the relevant structures are directly described and illustrated. Medium confidence preserves deformation and incomplete mineralization, the study's 2012-timescale numerical conversion, and the distinction between a sampled stem taxon and the origin or first appearance of Actinopterygii.
      referenceLinks:
        - relation: supports
          referenceId: giles-2015-cheirolepis-endoskeleton
          pages: 849–870
          figure: Figures 2–4 and 9–11
          quoteLocator: Material and methods; anatomical descriptions; Discussion
  claim-rationales.zh:
    - 具名馆藏标本、扫描方法与相关结构均有直接描述和图示。中等置信度保留了压扁变形与矿化不完整、研究采用 2012 年时间标尺的数值换算，并区分已取样干群分类单元与辐鳍鱼起源或首现。
  claim-statements.zh:
    - 艾菲尔期晚期 Achanarras 石灰岩的 Cheirolepis trailli CT 标本保存了早期辐鳍鱼性状的镶嵌组合，包括无孔的前鳍骨与舌颌骨干以及榫槽式关节鳞片；这些标本既不能定义全球辐鳍鱼首现，也不是已经证明的直接祖先。
