        claims:
          - text: Shrublet to 25 cm. Leaves small, ascending and imbricate, subterete, glabrous, gland-dotted, acute, margins scabridulous. Flower heads radiate, solitary, large, yellow with blue to mauve rays.
            sourceIds:
              - sanbi_14145_0
            locator: "SANBI/WFO archive Morphology row 10458; source 14145.0; publication: Manning, JC; Goldblatt, P. 2012. Asteraceae: Felicia Cass. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 375 - 378. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Die Pflanzen von Witteberg haben stärker behaarte Achänen, während die Individuen vom Ostende des Areals die Haare mehr auf den Achänenrand und die Basis beschränkt haben. Die starke Ausbildung der Harzgefässe, die lang seidige Behaarung der Achänen und der Habitus weisen auf recht nahe Beziehungen zur filifolia-Gruppe hin. In diesem Zusammenhang ist auch das manchmal zu beobachtende Auftreten knotiger Ansätze zur Bildung kurzer Pappusschuppen bemerkenswert. Das weitgehende Fehlen der Blattachselbehaarung isoliert die Art jedoch etwas von diesem Sippenkomplex. Die vorliegende Sippe wurde lange Zeit mit F. venusta S.Moore verwechselt, einer habituell etwas ähnlichen Sippe, von der nur spärliches Typusmaterial vorliegt. F. oleosa unterscheidet sich von dieser Sippe durch die immer behaarten Achänen, die deutlichen Harz- oder Ölgefässe in den Blättern, die weniger dicht dem Stengel anliegen und gröber bewimpert sind, die kurz gezähnten Pappusborsten und die schmal lanzettlichen, ölstriemigen Hüllschuppen.
            textZh: SANBI 条目提供了该种的鉴别特征。
            sourceIds:
              - sanbi_3197_0
            locator: "SANBI/WFO archive Diagnostic row 76925; source 3197.0; publication: Grau, HRJ. 1973. Revision der gattung Felicia (Asteraceae). Mitt. Bot. Staatssamml. München 9: 195 - 705. [All rights reserved]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
