          originalSourceText: on the petioles forming flanges up to 5 mm. wide. Inflorescences of axillary and terminal capreolate racemes or panicles, the rhachises glabrate to densely pubescent. Flowers pedicellate, the glabrous to densely pubescent pedicels mostly articulated below the middle; tepals pink to purplish, cordate, in fruit 8-25 mm. long, 4-20 mm. broad, glabrous to closely pubescent without, rarely stipitate-glandular within; stamens 8, connate about half their length to form a filament tube, often with 1 tooth intercalated between the free portions of adjacent filaments; ovary tri- gonous; styles 3, arcuate; stigmata peltate. Achenes bluntly triquetrous, usually included, about 1 cm. long.
