    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, 10-30 cm. Leaves 2-8, spreading, V-shaped in t/s, usually toothed. Flower 1, stellate, yellow, white or occasionally pinkish, centre often iridescent, spots occasionally non-iridescent, striped beneath, filaments short, bract 1, leaf-like, sheathing.
            textZh: Pauridia capensis (L.) Snijman & Kocyan 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13877_0
            locator: "SANBI/WFO archive Morphology row 7530; source identifier 13877.0; cited publication: Snijman, DA. 2012. Hypoxidaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 115 - 119. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Large-flowered specimens of P. capensis with immaculate tepals cannot be confused with P. canaliculata, which consistently has a contrasting central eye. However, the ease of separating specimens of P. capensis with dark blotches at the tepal base often depends on how well the plants have been pressed and annotated. The distinguishing blotches in the flowers of P. canaliculata are uniform in size and glaucous grey, contrasting strongly with the otherwise orange or deep yellow tepals. In comparison, the floral spots in P. capensis are never glaucous, despite great variation in their size, shape and colouring. Although Garside emphasized leaf shape as a means to separate the species, the leaves of some forms of P. capensis are sometimes so narrow that it is difficult to determine whether these are carinate, rather than canaliculate as described for P. canaliculata. Nevertheless, the obviously different seeds, ellipsoid in P. capensis and J-shaped in P. canaliculata, immediately distinguish the two species.
            textZh: SANBI 条目提供了 Pauridia capensis (L.) Snijman & Kocyan 的鉴别特征。
            sourceIds:
              - sanbi_15172_0
            locator: "SANBI/WFO archive Diagnostic row 58381; source identifier 15172.0; cited publication: Snijman, DA. 2014. A taxonomic revision of the genus Pauridia (Hypoxidaceae) in southern Africa. Phytotaxa 182(1): 1 - 114. [All rights reserved]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
