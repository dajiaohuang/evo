  claims:
    - subjectId: event:enaliarctos-skeleton-swimming-model
      claimKind: scientific
      claimType: morphology
      statement: LACM 4321 preserves enough cranial and postcranial anatomy to test locomotor capability in a stem pinniped; inferred swimming strokes and terrestrial performance remain comparative functional models.
      confidence: medium
      confidenceRationale: Enaliarctos skeleton and swimming model uses explicit named specimens or disclosed datasets, but placement, function or ecology depends on a sampled matrix or comparative model and is kept separate from observation.
