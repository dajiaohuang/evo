          figure: Figures 1–8; Tables 1–6
          quoteLocator: Skeletal description; Limb proportions; Locomotor interpretation
  claim-rationales.zh:
    - “始海豹骨架与游泳模型”的具名标本或已公开数据集是明确的，但位置、功能或生态依赖采样矩阵或比较模型，且已与直接观察分开。
  claim-statements.zh:
    - LACM 4321 保存了足以检验一件鳍足类干群运动能力的颅骨和躯后骨骼解剖；推断的游泳划水方式与陆地活动能力仍属比较功能模型。
