    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Gnarled shrub branching close to ground or small crooked tree up to 3 m high. Bark dark and rough; branches blackish, rough, prominently striate, branchlets glabrous, chestnut brown. Leaves trifoliolate, petiolate; petiole dull yellow, semiterete, deeply canaliculate above, (11-)23(-30) mm long; leaflets sessile, coriaceous, glutinous, concolorous, dark green above slightly paler below, hypostomatous; lamina elliptic, obovate to widely obovate, base cuneate, apex retuse, rounded, obtuse to rarely acute, mucronulate; margin entire, slightly revolute; venation semi-craspedodromous, midrib prominent below, impressed above, secondaries slightly prominent above and below, tertiaries prominently reticulate above, impressed below; terminal leaflets (21-)37(-70) x (11-)21(-35) mm, lateral leaflets (12-)27(-39) x (10-)17(-25) mm. Panicles relatively short, up to 60 mm long, axillary within the dense foliage, terminal partially exserted. Flowers not seen, vide Engler (1883) relatively large, calyx lobes 1 mm long, corolla lobes 2 mm long. Drupe oblate, obloid, glabrous, shiny, light to dark brown, 4.3 x 3.0 to 8.0 x 7.5 mm. Flowers and fruit following in succession from January to July.
            sourceIds:
              - sanbi_9808_0
            locator: "SANBI/WFO archive Morphology row 48212; source 9808.0; publication: Moffett, RO. 1993. Rhus, Fl. S. Africa 19(3,1): 1 - 123. National Botanical Institute, Pretoria. [http://www.biodiversitylibrary.org/item/209553#page/1/mode/1up]. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: The gnarled dark stems and branches, coprosma-like leaflets and large fruit make this species easily recognizable. Through its habit and venation, it is probably related to the more northern R. tumulicola. R. krebsiana is unusual in being summer deciduous with the new glossy foliage.
