        claims:
          - text: A sprawling, slender, sparsely white-woolly shrublet to 20 cm, with twisted leaves 3–14 mm long, sometimes densely woolly; discoid heads are few in terminal clusters, with three flowers and slightly spreading inner petaloid bracts, whitish or cream-coloured.
