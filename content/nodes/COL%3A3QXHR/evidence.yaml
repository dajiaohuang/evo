        usage:
          title: Justicia urophylla (Lindau) D.N.Gibson, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrub to 2 m tall; stems subterete, glabrous to sparingly puberulous in 2 lines. Leaves ovate elliptic, to 17 cm long, 6.5 cm wide, apically acuminate, basally attenuate, glabrous, the cystoliths dense, plainly visible on both the surfaces, the margins entire to undulate; petioles 1-2 cm long, pubescent as on the stem. Inflorescences in one to several dense spikes to 6 cm long, ca. 6 cm wide, the peduncles to 2 cm long, puberulous in 2 lines, the rachis glabrous to puberulous; bracts linear subulate, to 7 mm long, ca. 1 mm wide at the base, puberulous, ciliolate, the bracteoles triangular, ca. 1 mm long, 0.5 mm wide at base, puberulous. Flowers imbedded in the rachis, the calyx segments 5, equal, subulate, to 3 mm long, 1 mm wide at base, puberulous; corolla white, to 4.0 cm long, puberulous, the tube slightly funnelform, 2 mm wide at the base, slightly narrower above the ovary, 3 mm wide at the mouth, the lips to 16 mm long, the upper lip erect, apically bidentate, the lower lip 3-lobed, each lobe 1 cm long, the middle lobe 4 mm wide, the lateral lobes 3 mm wide, all apically rounded; anther cells superposed, spurred connective ca. 1 mm long, the filaments gla- brous. Capsules clavate, to 16 mm long, 4 mm wide, glabrous; seeds orbicular, flattened, light brown, ca. 3 mm in diameter, glabrous.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 229
          archiveSourceId: 3BDAA25E-70E8-485E-9A49-EC6D4B2AF045
