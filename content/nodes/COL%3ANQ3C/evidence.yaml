    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants perennial, rising from a chain of ovoid, vegetatively produced tubers 8-12 x 10-12 mm, with up to 7 horizontal incremental growth lines on each tuber; roots ca. 6 spreading from half way up the tubers, cylindrical ca. 15-40 x 1.2 mm. Leaves 3-4, light transparent green, in a rosette, erect to suberect, emerging from papyraceous sheathing bract remains from old leaves, lanceolate, terete to subterete, acute with a shallow adaxial channel towards the base, 30-60 x 3-7mm, margins finely toothed towards base. Peduncle up to 220 x 1.5 mm, inflorescence laxly 8-10 flowered; pedicel bract deltoid acuminate, greenish 3 x 2 mm; pedicel 10 x 1.8 mm. Flowers with all tepals reflexed and all filaments in a tight bunch projecting forwards; outer whorl ovate with narrowed obtuse apex, 7 x 2 mm, inner whorl more broadly ovate than outer, with pinched obtuse apex, 7 x 3 mm, all tepals light yellow with green mid-vein. Filaments greenish yellow, 7 x 0.5 mm with a flat adaxial surface, outer with centrally placed spreading hairs, inner with spreading hairs covering most of the filament, anthers ca. 0.8 mm, light yellow, hairs narrowly clavate to bulbous apically, 1-2 mm long. Ovary light green, ovoid, ca. 1.3 mm long; style ca. 5.5 x 0.5 mm; stigma minute, rugulose, silver white; capsule and seed not seen.
