        usage:
          title: Columnea oerstediana Klotzsch ex Oerst., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Suffrutescent herbs, epiphytic; stems 1.5-3 mm in diam., strigose when young. Leaves of a pair equal, elliptic ovate, 1.2-1.6 cm long and 7-10 mm wide, the apex obtuse to acute, rounded at the base, entire, succulent, above green, glabrous, below paler green, sparsely strigose, the hairs transparent, 3-5 celled especially numerous on the veins, also 2-3 celled white or transparent hairs; petioles 1 mm long. Flowers solitary; bracts ca. 5 mm long; pedicels ca. 10 mm long, strigose; calyx lobes ovate, 10-15 mm long, long acuminate, 2-3 toothed, the teeth to 1 mm long, green or tinged red, strigose; corolla scarlet or red with yellow areas running from sinuses of the anterior lobe to the base of the tube, funnelform, but strongly zygomorphic, ca. 6.7 cm long, ca. 4 mm in diam. above the base, becoming ca. 9 mm in diam. at the throat, the outside red pilose, the lobed portion of the corolla 3.1-3.6 cm long, the lobes strongly unequal, the posterior pair connate, truncate at the apex, ca. 1.8 cm long, the anterior lobe ca. 1.5 cm long, reflexed; filaments reddish or yellow, glabrous, the anthers exserted; ovary sericeous, the style yellow, pilose glandular, the stigma bibbed. Fruits not seen. Chromosomes 2n 18 (Fussell, 1958).
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 6063
