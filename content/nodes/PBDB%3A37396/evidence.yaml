        sectionEvidence:
          - sectionOrdinal: 0
            topic: fossil
            heading:
              en: A latest Oligocene mold is not an assigned paradoxus specimen
              zh: 晚渐新世印模不是已归属 paradoxus 的标本
            referenceId: ref-e2e04022-53dd-4a54-a9de-957c7d568588
            sourceKey: primary-fossil-pmc4589347-chelotriton-genus
            locator: PMC4589347 XML sec008 paragraph 0; sec009 paragraph 2; sec020 paragraph 0
            locatorPrecision: manually-recorded-section-and-paragraph-label
            evidenceSummary:
              en: MB.Am.45.1 is a natural dorsal mold of a skull, anterior trunk and right forelimb from lignite at Orsberg near Erpel, Rhineland-Palatinate, Germany. No original bone or counterpart survives. An older plaster cast was abraded; the 2015 description used a new silicone cast, MB.Am.45.3. Mammal stratigraphy places the deposit in the latest Oligocene, and the sediments are interpreted as lacustrine. The authors retained Chelotriton sp., explicitly declining either to assign a known species or name a new one. These locality and preservation facts do not provide a species origination date or justify relabelling the specimen paradoxus.
              zh: MB.Am.45.1 是头骨、躯干前部和右前肢背面的天然印模，来自德国 Rhineland-Palatinate、Erpel 附近 Orsberg 褐煤。原骨及对板均未保留。旧石膏翻模磨蚀，2015 年描述使用新硅胶翻模 MB.Am.45.3。哺乳动物地层学将沉积置于晚渐新世末期，沉积环境解释为湖泊。作者保留 Chelotriton sp.，明确既不归已知种，也不命名新种。这些地点及保存事实不提供物种起源日期，也不支持将标本重标 paradoxus。
            scope:
              en: Published specimen or comparative scope only; database concept equivalence, species-wide biology and full phylogenetic placement are not independently certified.
              zh: 仅限出版标本或比较范围；数据库概念等同性、全物种生物学及完整系统位置未经独立认证。
          - sectionOrdinal: 1
            topic: morphology
            heading:
              en: A very broad skull has precisely defined measurements
              zh: 极宽头骨具有明确测量定义
            referenceId: ref-e2e04022-53dd-4a54-a9de-957c7d568588
            sourceKey: primary-fossil-pmc4589347-chelotriton-genus
            locator: PMC4589347 XML sec011 paragraph 0
            locatorPrecision: manually-recorded-section-and-paragraph-label
            evidenceSummary:
              en: The cast’s skull measures 18 mm along the midline, from premaxillary tip to the posterior parietal margin, and 35 mm wide as the minimum distance between lateral quadratojugal–quadrate edges. The reported width-to-length ratio is 1.94. Interorbital width is reconstructed at approximately 14 mm because the left opening outline is incomplete; its ratio to skull length is therefore approximate. The jaw joints project unusually far behind the occiput. These are specimen-specific preserved or reconstructed dimensions, not adult snout–vent length, body mass or a whole-genus size range.
              zh: 翻模头骨中线长十八毫米，定义为前颌骨尖至顶骨后缘；宽三十五毫米，为两侧方轭骨—方骨外缘最短距离。报告宽长比 1.94。因左侧开口轮廓不全，眶间宽重建约十四毫米，与头骨长之比也属近似。颌关节异常向后突出于枕部。这些是该标本保存或重建尺寸，不是成年吻肛长、体重或全属体型范围。
            scope:
              en: Published specimen or comparative scope only; database concept equivalence, species-wide biology and full phylogenetic placement are not independently certified.
              zh: 仅限出版标本或比较范围；数据库概念等同性、全物种生物学及完整系统位置未经独立认证。
          - sectionOrdinal: 2
            topic: morphology
            heading:
              en: Surface sculpture and uncertain bone identities retain preservation limits
              zh: 表面雕纹及未定骨骼身份保留保存限制
            referenceId: ref-e2e04022-53dd-4a54-a9de-957c7d568588
            sourceKey: primary-fossil-pmc4589347-chelotriton-genus
            locator: PMC4589347 XML sec012 paragraphs 0–2, 7, 9; sec020 paragraphs 1, 8
            locatorPrecision: manually-recorded-section-and-paragraph-label
            evidenceSummary:
              en: Most exposed dermal bones have tubercular sculpture, while the maxillary region has stronger pit-and-ridge or honeycomb-like relief. A small bone near the nostril has competing septomaxillary, process and vomer interpretations that the natural mold cannot resolve. No exposed teeth on the premaxilla or maxilla means those surfaces do not reveal teeth, not proof of toothlessness. Sediment, cracks and crushing obscure sutures and parts of the jaw region. The frontal’s proportions are described differently in the descriptive and comparison paragraphs, so they are not standardized into one unambiguous diagnostic ratio.
              zh: 多数暴露皮骨有瘤状雕纹，颌骨区则有较强凹窝与嵴或蜂窝样浮纹。鼻孔附近小骨有隔颌骨、突起及犁骨等竞争解释，天然印模不能解决。前颌骨及上颌骨没有暴露牙齿，指表面不显示牙齿，不证明无齿。沉积物、裂缝和挤压遮蔽骨缝及部分颌区。额骨比例在描述与比较段落记载不同，不能标准化为一个无歧义鉴别比值。
            scope:
              en: Published specimen or comparative scope only; database concept equivalence, species-wide biology and full phylogenetic placement are not independently certified.
              zh: 仅限出版标本或比较范围；数据库概念等同性、全物种生物学及完整系统位置未经独立认证。
          - sectionOrdinal: 3
            topic: morphology
            heading:
              en: Ribs and forelimb are an incomplete anatomical sample
              zh: 肋骨及前肢是部分解剖样本
            referenceId: ref-e2e04022-53dd-4a54-a9de-957c7d568588
            sourceKey: primary-fossil-pmc4589347-chelotriton-genus
            locator: PMC4589347 XML sec014 paragraphs 0–3
            locatorPrecision: manually-recorded-section-and-paragraph-label
            evidenceSummary:
              en: At least eight rib pairs are preserved, with missing proximal portions and some displacement. Several left ribs expose three or more processes, one at least five; a single process on some right ribs reflects exposure direction rather than a reliable side difference. The right humerus measures 12 mm, ulna 8 mm and radius approximately 7 mm. At least two wrist elements are ossified, but matrix obscures others. Four metacarpals survive; the uncertain phalangeal formula is not certified as a complete digit count. The terminal digit crest appears real, while its apparent serration might be a casting artifact.
              zh: 至少保存八对肋骨，近端缺失且部分移位。若干左肋显示三个以上突起，一根至少五个；部分右肋只见一突可能源于暴露方向，不能可靠确定左右差异。右肱骨十二毫米、尺骨八毫米、桡骨约七毫米。至少两块腕骨骨化，其余被基质遮蔽。四块掌骨保留，不确定指骨式不能认证完整指骨计数。末端指骨嵴似真实，其表观锯齿可能是翻模伪影。
            scope:
              en: Published specimen or comparative scope only; database concept equivalence, species-wide biology and full phylogenetic placement are not independently certified.
              zh: 仅限出版标本或比较范围；数据库概念等同性、全物种生物学及完整系统位置未经独立认证。
          - sectionOrdinal: 4
            topic: development
            heading:
              en: Adult-like ossification and larval-like throat elements form a mosaic
              zh: 成年样骨化与幼体样咽部骨骼形成镶嵌
            referenceId: ref-e2e04022-53dd-4a54-a9de-957c7d568588
            sourceKey: primary-fossil-pmc4589347-chelotriton-genus
            locator: PMC4589347 XML sec013 paragraphs 2–4; sec019 paragraphs 0–6
            locatorPrecision: manually-recorded-section-and-paragraph-label
            evidenceSummary:
              en: The authors interpret heavy skull ossification, broad arches and posterior jaw joints as peramorphic features, extending developmental trends seen in living salamanders. Rod-like elements behind the skull are interpreted as retained ossified branchial-arch components, a paedomorphic condition. This is a mosaic inference from one fossil, not an observed growth series or a measured maturation age. The unidentified nostril bone contributes only conditionally to the peramorphosis argument. Superficial similarity to much older temnospondyls does not mean the specimen is ancestral to them or that ancient skull bones have demonstrably reappeared.
              zh: 作者把头骨高度骨化、宽弓及后移颌关节解释为延伸现生蝾螈发育趋势的过成体性状。头骨后棒状结构解释为保留并骨化的鳃弓部分，为幼态保持状态。这是由一个化石推断的镶嵌，不是观察生长序列或测量成熟年龄。鼻孔未定小骨只能有条件参与过成体论证。与更早离片椎类的表面相似，不意味着本标本是它们祖先，也不证明古老头骨骨骼重新出现。
            scope:
              en: Published specimen or comparative scope only; database concept equivalence, species-wide biology and full phylogenetic placement are not independently certified.
              zh: 仅限出版标本或比较范围；数据库概念等同性、全物种生物学及完整系统位置未经独立认证。
          - sectionOrdinal: 5
            topic: ecology
            heading:
              en: An aquatic interpretation is separate from species identity
              zh: 水生解释与物种身份分开
            referenceId: ref-e2e04022-53dd-4a54-a9de-957c7d568588
            sourceKey: primary-fossil-pmc4589347-chelotriton-genus
            locator: PMC4589347 XML sec019 paragraphs 4, 6; sec020 paragraphs 8–10
            locatorPrecision: manually-recorded-section-and-paragraph-label
            evidenceSummary:
              en: The retained larval-type hyobranchial apparatus supports a primarily aquatic interpretation for MB.Am.45, alongside lacustrine deposition. It does not preserve a diet, reproductive event, skin defence mechanism or seasonal activity schedule. The paper contrasts this with a terrestrial interpretation proposed for pliocenicus vertebral articulations, while stressing poor overlap of comparable material. Taxonomic revision and better specimens are required before assigning the mixed developmental anatomy to an accepted species. Broader late-Oligocene cooling explanations are cited context, not an independently tested climate response of this individual.
              zh: 保留幼体型舌鳃装置及湖相沉积支持 MB.Am.45 主要水生的解释，但没有保存食性、繁殖事件、皮肤防御机制或季节活动日程。论文与依据 pliocenicus 椎骨关节提出的陆生解释对照，同时强调可比较材料重叠很差。把镶嵌发育解剖归于接受种前，需要分类修订及更好标本。晚渐新世降温的更广解释属引述背景，不是独立测试本个体气候反应。
            scope:
              en: Published specimen or comparative scope only; database concept equivalence, species-wide biology and full phylogenetic placement are not independently certified.
              zh: 仅限出版标本或比较范围；数据库概念等同性、全物种生物学及完整系统位置未经独立认证。
      - doi: 10.1111/joa.13201
        referenceId: ref-0cf2133a-2367-40e4-a3dc-d9ca8347d1d0
        sourceKey: primary-fossil-pmc7369190-chelotriton-genus
        sourceFile: data/sources/snapshots/amphibia-primary-corpus-2026-10-02/PMC7369190/article.xml
        sourceConcept: 2020 Enspel and Randeck Chelotriton samples, species association tentative
        evidenceRead: Materials/methods, landmark and geometric analysis, lateral/dorsal results, raw XML fossil morphology and phylogeny/ecology/shape results, morphology/phylogeny discussion and raw ecology discussion read; Table1 counts/footnotes; eight tentative Chelotriton fossils, taphonomic/estimation bounds, no independent scans/landmark or original cited ecological studies examined
        contemporaryConceptEquivalence: not-independently-certified
        rightsBoundary:
          license: CC BY 4.0
          licenseUrl: https://creativecommons.org/licenses/by/4.0/
          attribution: Own factual synthesis and Chinese translation of the original study; no figures reproduced.
        sectionEvidence:
          - sectionOrdinal: 0
            topic: fossil
            heading:
              en: Eight skulls were compared with taphonomic reconstruction limits
              zh: 八个头骨比较保留埋藏重建限制
            referenceId: ref-0cf2133a-2367-40e4-a3dc-d9ca8347d1d0
            sourceKey: primary-fossil-pmc7369190-chelotriton-genus
            locator: PMC7369190 section 0 paragraph 0; section 1 paragraph 1; section 2 paragraph 0; XML joa13201-tbl-0001 Chelotriton rows
            locatorPrecision: manually-recorded-section-and-paragraph-label
            evidenceSummary:
              en: The 2020 study included seven Chelotriton fossils from Enspel and one from Randeck Maar, Germany. It cites Enspel deposits at 24.8–24.6 million years and Randeck at 17–15 million years; these are locality age estimates, not species origin or extinction dates. Flattening prevented adequate three-dimensional shape comparison, so dorsal two-dimensional images were used. Enspel crania underwent specimen-specific algorithmic symmetrization; the apparently symmetric Randeck sample did not. Across the fossil landmark dataset, 105 of 672 positions were missing and estimated, with two specimens accounting for 50 and 44. The reconstructed shapes are analytical approximations, not undeformed original anatomy.
              zh: 2020 年研究含德国 Enspel 七个 Chelotriton 化石和 Randeck Maar 一个。引述 Enspel 沉积距今 24.8–24.6 百万年，Randeck 为十七至十五百万年；这是地点年代估计，不是物种起源或灭绝。压扁使充分三维形状比较不可行，故使用背面二维图像。Enspel 头骨按各标本进行算法对称化，表观对称的 Randeck 样本未处理。化石标志点数据 672 个位置中 105 个缺失并估计，两标本分别占五十、四十四。重建形状是分析近似，不是未变形原解剖。
            scope:
              en: Published specimen or comparative scope only; database concept equivalence, species-wide biology and full phylogenetic placement are not independently certified.
              zh: 仅限出版标本或比较范围；数据库概念等同性、全物种生物学及完整系统位置未经独立认证。
          - sectionOrdinal: 1
            topic: morphology
            heading:
              en: Different deposits occupy different shape regions without resolving species
              zh: 不同地点形状位置不同但未解决种界
            referenceId: ref-0cf2133a-2367-40e4-a3dc-d9ca8347d1d0
            sourceKey: primary-fossil-pmc7369190-chelotriton-genus
            locator: PMC7369190 XML joa13201-sec-0008 paragraphs 0–1; joa13201-sec-0009 paragraph 1; section 5 paragraph 3
            locatorPrecision: manually-recorded-section-and-paragraph-label
            evidenceSummary:
              en: Enspel and Randeck skulls occupied different regions of the analysed morphospace. Enspel was closer to Yaotriton and Echinotriton in the authors’ comparisons, while Randeck lay between the Tylototriton and Pleurodeles regions on the displayed axes. Morphological similarity does not itself establish a direct ancestor or a definitive sister lineage. The lone Randeck specimen was excluded from post-hoc species comparisons because of sample size. The paper proposes different fossil species as an explanation but retains tentative paradoxus assignments and emphasizes further revision. Centroid size compares landmark configurations, not measured adult body length or mass.
              zh: Enspel 与 Randeck 头骨在分析形态空间占不同区域。作者比较中 Enspel 更近 Yaotriton、Echinotriton，展示轴上 Randeck 处于 Tylototriton 与 Pleurodeles 区域之间。形态相似本身不建立直接祖先或确定姐妹支系。Randeck 单标本因样本量排除于事后种级比较。论文提出不同化石种为解释，但保留暂定 paradoxus 归属，并强调继续修订。质心大小比较标志点配置，不是实测成年体长或体重。
            scope:
              en: Published specimen or comparative scope only; database concept equivalence, species-wide biology and full phylogenetic placement are not independently certified.
              zh: 仅限出版标本或比较范围；数据库概念等同性、全物种生物学及完整系统位置未经独立认证。
          - sectionOrdinal: 2
            topic: ecology
            heading:
              en: Climate and terrestrial-life suggestions remain comparative hypotheses
              zh: 气候及陆生建议仍是比较假说
            referenceId: ref-0cf2133a-2367-40e4-a3dc-d9ca8347d1d0
            sourceKey: primary-fossil-pmc7369190-chelotriton-genus
            locator: PMC7369190 XML joa13201-sec-0012 paragraphs 2–3; section 5 paragraph 3
            locatorPrecision: manually-recorded-section-and-paragraph-label
            evidenceSummary:
              en: The article cites palaeoclimate estimates of approximately 24 °C mean annual temperature for Randeck and 15–17 °C for Enspel. These locality-level reconstructions are not this animal’s preferred temperature, body temperature or physiological tolerance. No cranial adaptation to the tested biome categories was detected, which does not show that climate had no biological effect. Resemblance to living land-mating and land-egg-laying newts motivates a more terrestrial interpretation for some Chelotriton material; no fossil courtship or egg deposition was directly observed. This concerns different samples from the separately described aquatic MB.Am.45, whose unresolved species identity is retained.
              zh: 文章引述 Randeck 年均古温约二十四摄氏度、Enspel 十五至十七摄氏度。这些地点重建不是该动物偏好温度、体温或生理耐受。对所测生物群系类别未检出头骨适应，不证明气候没有生物效应。与现生陆地交配及陆地产卵蝾螈相似，促成部分 Chelotriton 更陆生的解释；没有直接观察化石求偶或产卵。这涉及不同于另述水生 MB.Am.45 的样本，后者未解决种级身份继续保留。
            scope:
              en: Published specimen or comparative scope only; database concept equivalence, species-wide biology and full phylogenetic placement are not independently certified.
              zh: 仅限出版标本或比较范围；数据库概念等同性、全物种生物学及完整系统位置未经独立认证。
