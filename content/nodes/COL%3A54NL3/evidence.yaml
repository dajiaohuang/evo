        usage:
          title: Tanaecium jaroba Sw., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Liana; branchlets terete, the nodes without pseudostipules, interpetiolar glandular fields mostly lacking or inconspicuous, if present relatively small. Leaves 3-foliolate or 2-foliolate with a tendril or tendril scar; leaflets elliptic, acute or rounded, truncate or rounded at the base, 8-10 cm long and 4-6 cm wide, pinnately veined with 5-7 lateral veins on a side, drying grayish-green, the veins beneath beige, glabrous except for a few long trichomes at the extreme base of the midvein above or puberulous with simple trichomes along the veins beneath; tendril simple; petiole 5-6 cm long, petiolules 1-3 cm long, grooved on the upper surface, pubescent with scattered long trichomes along the groove, otherwise lepidote. Inflorescence a terminal raceme on a short lateral branch; pedicels 1.3-2.4 cm long. Flowers with the calyx cupular, sub- truncate or minutely 5-denticulate, more or less ciliate, glandular-spotted but mostly glabrous with some plate-shaped glands on the apical part; corolla white, elongate-tubular, expanded apically, 18-20 cm long and 1.2-1.7 cm wide at the mouth, the tube 14-17 cm long, the lobes 2-2.8 cm long; densely glandu- lar-puberulous outside, less densely glandular-lepidote and glandular-puberulous on the lobes, more or less ciliate, tube mostly glabrous inside; stamens didyna- mous, the anthers half-exserted, the thecae 5-6 mm long, the longer filaments ca. 2.8 cm long, shorter filaments ca. 1.5 cm long, the staminode 5 mm long, inserted 11-17 cm above the base of the corolla tube; pistil 16-17 cm long, the ovary oblong, tetragonal, 1.5-2 mm long and ca. 1 mm wide, ovules ca. 6-seriate in each locule; disc cupular-pulvinate, 1.5-2 mm long and 2 mm wide. Capsule elliptic-oblong, 14-22 cm long and 6-11 cm wide, 6-8 cm thick (Elias 1306 (US), Dugand & Jaramillo 3500A (US), both from Colombia), brown with paler lenticellate flecks, glabrous or with a few lepidote scales, the valves woody, convex; seeds angular, woody, wingless but with a sharp edge on 3 sides 2.5-3.3 cm long and 3.0-3.2 cm wide, the hilum terminal and at right angles to the seed body.
