          title: Hippomane mancinella L., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Tree to 10 m, much branched forming a rounded crown, the bark gray or red, often lichen covered. Leaves on slender petioles 3-5 cm long; blades ovate to elliptic, 5-10 cm long, 4-6 cm wide just below middle, somewhat shiny above with veins slightly raised particularly on drying, the base rounded to subcordate, the margin crenulate with 8-12 shallow teeth, the apex short-acuminate. Inflorescences to 10 cm long, stout, 1-2 y flowers at base. Staminate calyx ca 1 mm long, the lobes broadly ovate. Pistillate calyx ca 3 mm long, ovate and somewhat acuminate. Fruit globose, to 3.5 cm diam, smooth; seed dark, ca 6 mm long.
          originalLanguage: en
          sourceField: general
