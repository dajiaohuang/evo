        claims:
          - text: Glandular-hairy, short-lived perennial to 75 cm, stems ridged. Leaves coarsely toothed. Flowers in moderately dense racemes, tube inflated above, lobes rounded, dull yellow to red.
            sourceIds:
              - sanbi_14436_0
            locator: "SANBI/WFO archive Morphology row 6044; source 14436.0; publication: Manning, JC; Goldblatt, P. 2012. Scrophulariaceae: Manulea L. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 745 - 747. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: "Hiern (in Fl. Cap. 4(2): 235, 1904) reduced M. juncea to synonymy under M. cephalotes, but that species can at once be distinguished by its short dense thyrse, quite different in aspect from the slender racemes of M. juncea, which differs further in its much longer corolla tube and glandular-puberulous capsules. The last two characters distinguish M. juncea from its close ally, M. multlsplcata. Manulea juncea is one of a close-knit group of species with alternate decurrent leaves, which character sets them apart from all their congeners including those that share the peculiar characters of minute clavate hairs on the upper surface of the corolla lobes and minute glandular hairs on the inside of the corolla tube below the insertion of the posticous filaments."
