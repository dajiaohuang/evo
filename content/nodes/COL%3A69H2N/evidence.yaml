        usage:
          title: Cavendishia atroviolacea Luteyn, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Epiphytic shrub 1-3 m tall, stem base to 2.5 cm in diameter; mature branches terete to subterete, smooth or minutely striate, glabrous, 6-7 mm in diameter, often red dorsally and green ventrally when fresh; bark brown, but drying yellowish, grayish, or reddish brown, the immature branches and twigs of the new growth subterete to bluntly angled, minutely striate, glabrous, reddish brown when dry. Leaves lanceolate to lance elliptic, rarely oblanceolate or ovate, (3-) 8-12(-18) cm long and 1-4(-6) cm broad, basally rounded, obtuse, cuneate or rarely subtruncate, apically acuminate, olive tan or silvery green when dry, glabrous or rarely with a few hairs at the base of the midrib on the upper sur- face; (3-) 5 ( -7) -plinerved, veins impressed above or rarely veinlets and the outer pair of lateral veins raised, the midrib raised and prominent beneath, the lateral veins raised, prominent to obscure beneath, the veinlets slightly raised, usually obscure beneath; petioles terete or often flattened adaxially, rugose, (4-) 6-15 mm long, (0.7-) 1-1.5 (-2.5) mm in diameter, glabrous, green suffused with maroon, drying reddish brown. Inflorescence (7-) 11-16 (-20) flowered, cylindric to fusiform in bud, rachis long tapering, cylindric, bluntly angled, minutely striate, viscid, glabrous, 3-6 (-9) cm long, 2-5 mm in diameter, pink to pinkish white when fresh; floral bracts rarely translucent when dry, glabrous, smooth or reddish papillate abaxially, oblong to oblanceolate, rarely obovate or somewhat spatulate, basally narrowed and truncate, apically rounded to acute, (2-)2.5-4(-5) cm long, 1-2 cm broad, deep violet or maroonish purple, often ap- pearing black; pedicels swollen distally, striate or ribbed, glabrous, (6-)9-13(-16) mm long, 0.7-(-1.5) mm in diameter, pink to pinkish white when fresh; bracteoles lanceolate to linear lanceolate, rarely ovate, 2-4(-5.5) mm long, 0.6-1(-2) mm broad, basally slightly auriculate, apically acuminate and glandularly callose thickened in the distal third, purplish pink when fresh. Flowers with the calyx glabrous, (6-)7-11(-13.5) mm long, the tube cylindric, coarsely ribbed, (2-) 2.5-4(-5.5) mm long, basally (2.5-)3-6(-6.5) mm in diameter, basally enlarged and deeply lobed, the lobes straight or flaring outward and extending well be- low the basal articulation, pinkish red to purplish at anthesis turning pale green post anthesis, the limb cylindric or somewhat spreading, weakly ribbed or mi- nutely papillate, (3.5-)5-8 mm long including the lobes, pinkish red, the lobes triangular, 1-2(-2.5) mm long, and 2-2.5 mm broad, erect after anthesis, glan- dular callose thickened without, dark reddish purple or green; sinus obtuse to broadly rounded; corolla slightly constricted basally, narrowed to the throat, sometimes translucent when dry, (25-) 30-38 (-45) mm long, 5-8 mm in diameter, pilose with short, white trichomes, the tube whitish purple at the constricted base, purple to dark purple above, the limb and the lobes pale purple, the lobes oblong, obtuse, 1.5-2 mm long, strongly reflexed at anthesis; stamens 24-39 mm long, the filaments glabrate or moderately pilose distally, alternately 3.5-6 mm and 7.5-14.5 mm long, white, the anthers including tubules alternately 16.5-27.5 mm and 22.5-35.5 mm long, orange, the thecae 6-13.5 mm long; style 35-46 mm long. Berry not seen.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 4132
          archiveSourceId: B285E3CC-77C1-493C-8481-8267C3A8C0AE
