        sectionEvidence:
          - sectionOrdinal: 0
            topic: morphology
            heading:
              en: Honeycomb-like sculpture distinguishes the cited robustus material
              zh: 蜂窝样雕纹区别所引 robustus 材料
            referenceId: ref-e2e04022-53dd-4a54-a9de-957c7d568588
            sourceKey: primary-fossil-pmc4589347-robustus
            locator: PMC4589347 XML sec011 paragraph 0; sec014 paragraph 1; sec020 paragraph 10
            locatorPrecision: manually-recorded-section-and-paragraph-label
            evidenceSummary:
              en: The paper describes robustus as having honeycomb-like sculpture across bones exposed to the skin, contrasting with predominantly pustular relief in most other Chelotriton material. Its vertebral spine tables are cited as wide plates with pits and very fine pustules. MB.Am.45 combines mostly pustular surfaces with a more honeycomb-like maxillary region; that mixture is not a robustus identification. These are literature-based comparative features, not a new population sample or measurements of skin itself. The authors leave the developmental significance of the sculpture differences uncertain.
              zh: 论文描述 robustus 与皮肤接触骨面为蜂窝样雕纹，与多数其他 Chelotriton 主要瘤状浮纹对照。其椎骨神经棘顶板引述为带凹窝及细小瘤点的宽板。MB.Am.45 结合多数瘤状骨面及较蜂窝样颌骨区，不是 robustus 鉴定。这些是文献比较特征，不是新种群样本或皮肤本身测量。作者保留雕纹差异发育意义不确定。
            scope:
              en: Published specimen or comparative scope only; database concept equivalence, species-wide biology and full phylogenetic placement are not independently certified.
              zh: 仅限出版标本或比较范围；数据库概念等同性、全物种生物学及完整系统位置未经独立认证。
          - sectionOrdinal: 1
            topic: development
            heading:
              en: Ossified wrists are a cited comparison, not a growth curve
              zh: 骨化腕部是引述比较而非生长曲线
            referenceId: ref-e2e04022-53dd-4a54-a9de-957c7d568588
            sourceKey: primary-fossil-pmc4589347-robustus
            locator: PMC4589347 XML sec014 paragraph 3; sec020 paragraphs 8, 10
            locatorPrecision: manually-recorded-section-and-paragraph-label
            evidenceSummary:
              en: Robustus is among the taxa cited as having ossified wrist elements, alongside other fossil and living newts. The observation does not determine an age at ossification, developmental rate or complete digit formula for the species. Its relatively small honeycomb-sculptured vertebrae are contrasted with larger pustular vertebrae assigned paradoxus, but body-size differences cannot alone resolve ontogeny or species boundaries. MB.Am.45’s humerus, ulna and radius lengths remain with that unassigned specimen rather than being copied to robustus.
              zh: robustus 与其他化石及现生蝾螈一起，被引述有骨化腕部；该观察不确定骨化年龄、发育速率或本种完整指骨式。其较小蜂窝雕纹椎骨与较大、归 paradoxus 的瘤状椎骨对照，但体型差异本身不能解决个体发育或种界。MB.Am.45 的肱骨、尺骨、桡骨长度保留在未归种标本，不能复制给 robustus。
            scope:
              en: Published specimen or comparative scope only; database concept equivalence, species-wide biology and full phylogenetic placement are not independently certified.
              zh: 仅限出版标本或比较范围；数据库概念等同性、全物种生物学及完整系统位置未经独立认证。
