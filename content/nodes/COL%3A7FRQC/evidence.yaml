          title: Viola guatemalensis W.Becker, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Herb, acaulescent, stoloniferous, the stolons slender, elongated, up to 20 cm long or more. Leaves with the petioles very slender, up to 10 cm long, glabrous, the stipules ? elliptic, acute, fimbrillate, up to 1 cm long, membranous, glabrous, greenish-white; blade subcircular or circular-reniform, deeply cordate at the base, short-pointed at the apex, crenulate-serrulate at the margins, up to 3.8 cm long and wide, membranous, sparsely appressed-hyaline-puberulous on both sides. Flowers with the pedicels filiform, up to 14 cm long, the bracteoles triangular, acute, 5-6 mm long and 2.2-2.8 mm wide; sepals ovate, acute, 4.5-5.5 mm long and 1.8-2.2 mm wide, the basal auricles rounded and ca 1 mm long; anterior petal obovate, broadly rounded at the apex, 13 mm long (spur included) and 6 mm wide, the spur small, scarcely 2 mm long; lateral and upper petals oblong-obovate, unguiculate, rounded at the apex, 11.5-13 mm long and 4.5-5 mm wide; anthers ca 1.8-2 mm long, the connective appendages very broadly oblong-ovate, irregularly truncate at the apex, ca 1.5 mm long and wide; ovary ellipsoid, ca 2 mm long; style ca 2 mm long, slightly geniculate above the base, clavate towards the apex, the apex depressed-capitate, marginate and with a small beak abaxially. Capsule ellipsoid, ca 6-6.5 mm long.
          originalLanguage: en
          sourceField: general
