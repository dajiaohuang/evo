        claims:
          - text: Like M. ciliata but leaves borne on stems held well above ground, cataphylls forming a fibrous collar around base, flowers pale yellow or translucent white with tepal margins and reverse coppery red.
            textZh: Moraea longipes Goldblatt & J.C.Manning 的 SANBI 物种条目记载了植株、叶片和花部形态。
            sourceIds:
              - sanbi_14562_0
            locator: Strelitzia 30; archive Morphology row 33332, source 14562.0
            placeTimeScope: Regional species account published 2013; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
          - text: Flowering in mid-winter in May and June, Moraea longipes has the general aspect of M. ciliata and M. tricolor except that the stem is not subterranean at flowering but extends up to 180 mm above ground. Like most species of subg. Acaules the ovary is retracted to the base of the inflorescence spathes after flowering. The flowers are most like those of M. ciliata but have slightly broader style crests, triangular with the base 2.5-3.0 mm wide (± linear in M. ciliata) and the filaments are united basally for ± 1.5 mm, about one fifth of their length, as are those of most other species of subg. Acaules. The anthers of M. longipes are the longest in the subgenus, 7.5-9.0 mm long (5-8 mm in M. ciliata) and are held above the nectar guides on filaments as long as the tepal claws. A notable feature of M. longipes is the collar of fibres around the underground part of the stem, uncommon but not unique in the subgenus. The species flowers early in the season, May to early July, and grows in places where M. ciliata has been found in bloom six to eight weeks later. Flower colour in M. longipes is either pale, watery yellow or translucent white, then with the edges of the outer tepal limbs and the inner tepal limbs a pale coppery pink colour and with the tepals flushed the same colour outside.
            textZh: SANBI 条目提供了 Moraea longipes Goldblatt & J.C.Manning 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: Strelitzia 42; archive Diagnostic row 94164, source 18638.0
