    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Dwarf almost acaulescent, cormous geophyte, 3-5 cm. Leaf solitary, linear-lanceolate, shallowly channelled. Flowers small, blue-mauve, style crests short.
            textZh: Moraea nubigena Goldblatt 的 SANBI 物种条目记载了植株、叶片和花部形态。
            sourceIds:
              - sanbi_13878_0
            locator: Strelitzia 29; archive Morphology row 7357, source 13878.0
            placeTimeScope: Regional species account published 2012; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
          - text: Immediately recognised by its low stature, no more than 50 mm high when in bloom, an unbranched stem, solitary foliage leaf, and blue, fugaceous flowers. The flower itself is unexceptional and helps little in understanding its relationships. The species was originally assigned to sect. Polyanthes (now subg. Polyanthes), but its chromosome number 2n = 20 is inconsistent with that placement. Molecular study places M. nubigena in an isolated position but embedded among species with the same chromosome number. It is provisionally placed in sect. Polyphyllae of subg. Moraea, where it is notable for being the only blue-flowered species of the subgenus.
            textZh: SANBI 条目提供了 Moraea nubigena Goldblatt 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: Strelitzia 42; archive Diagnostic row 95267, source 18638.0
            placeTimeScope: Regional species account published 2020; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
        gaps:
