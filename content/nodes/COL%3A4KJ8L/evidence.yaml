          title: Plumbago auriculata Lam., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Subshrubs to 2 m, sub-scandent. Leaves ovate-elliptic to spatulate, narrowed to the obtuse apex, gradually attentuate basally into a short petiole, 3-6(-9) cm long and 1-2 (-3) cm wide, glabrous, copiously calciferous-glandular below, the petioles auriculate basally, the auricles adnate to the stem, reniform or occasion- ally as long as wide, 3-6 mm wide and 2-3 mm long; the main stem leaves commonly with smaller leaves fasciculate in the axils. Inflorescences densely- flowered racemes, 2-6 cm long, the rachis pubescent, the bracts and bracteoles puberulent, the bracts lanceolate, 5-7(-9) mm long. Flowers with pedicels ca. 1 mm long; calyx 1-1.3 cm long and 1-2' mm wide, puberulent, the teeth triangular, ca. 1 mm long, the ribs with stalked glands along the distal 1/? to 2/3; corolla showy, usually azure, occasionally white, the tube 2.7-4 cm long, the limb 2-2.5(-2.9) cm in diameter, the lobes broadly spatulate. Capsules slenderly elongate-ovoid, pentagonal, ca. 8 mm long, the apex obtuse; seed nearly filling the capsule, slightly 5-angled, grooved along one side, the funicular end acute and distinctly 5-angled, the base truncate, 6-7 mm long, black.
