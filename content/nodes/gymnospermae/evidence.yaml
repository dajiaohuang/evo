  claims:
    - subjectId: taxon:gymnospermae
      claimKind: scientific
      claimType: fossil-range
      statement: The Gymnospermae atlas root uses a rounded 365–0 Ma total-seed-plant navigation envelope, anchored by Famennian cupulate seeds and living gymnosperm families; it is not the fossil first appearance or crown age of extant Gymnospermae.
      confidence: medium
      confidenceRationale: Famennian cupule systems with lagenostomalean-type seeds are direct fossil evidence, whereas mapping extinct seed plants to the living gymnosperm crown is topology-dependent. The endpoint is intentionally labelled as a total-seed-plant navigation surrogate.
      referenceLinks:
        - referenceId: gillespie-1981-earliest-seeds
          relation: supports
          pages: 462–464
          figure: Figure 1
          quoteLocator: Famennian age control; three-dimensional morphology and histology of cupule systems and seeds
        - referenceId: ran-2018-gymnosperm-phylogenomics
          relation: contextualizes
          pages: 20181012, pp. 1–9
          figure: Figures 1–2
          quoteLocator: Sampling of all 13 living gymnosperm families and extant-lineage topology
  claim-rationales.zh:
    - 法门期杯状结构中的种子属于直接化石证据，而灭绝种子植物与现生裸子植物冠群的对应取决于拓扑；端点明确标为总群种子植物导航替代值。
  claim-statements.zh:
    - 裸子植物图集根节点采用取整后的 3.65 亿年前至今总群种子植物导航包络，以法门期杯状种子和现生裸子植物各科为锚点；它不是现生裸子植物的化石首现或冠群年龄。
