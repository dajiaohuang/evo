        usage:
          title: Columnea rubra C.V.Morton, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Suffrutescent herbs or small shrubs, epiphytic; stems to 0.75 m tall, 5-9 mm in diam., reddish appressed pilose when young. Leaves of a pair unequal, the larger leaf narrowly oblong to oblanceolate, 12.6-14.5 cm long and 2.9-3.8 cm wide, the apex acute, rounded at the base, subentire, above green, glabrous, pink to claret colored beneath, strigose, the hairs brown or red, 4-7 celled, also 2-3 celled white appressed hairs; petioles 3-5 mm long, the smaller leaves ca. 1.0 cm long, soon deciduous, acuminate, green above, red beneath. Flowers several in each axil; bracts linear, 4-5 mm long, red, strigose; pedicels 7-11 mm long, red, strigose; calyx lobes lanceolate, 1.4-1.7(2.5) cm long, acuminate, 4-6 toothed, the teeth less than 1 mm long, green or red, the corollas yellow or with maroon to black stripes, funnelform but strongly zygomorphic, 4.5-6.0 cm long, ca. 2 mm in diam. above the base, becoming ca. 7 mm in diam. at the throat, outside pilose tomentose, the lobed portion of the corolla ca. 2.3 cm long, the lobes strongly unequal, the posterior pair connate, apiculate at the apex, ca. 1.3 cm long, the anterior lobe 1.5 cm long, reflexed, the filaments yellow, glabrous, the anthers exserted; ovary sericeous, the style glandular pilose, yellow, the stigma stomatomorphic. Fruits not seen.
          originalLanguage: en
          sourceField: general
