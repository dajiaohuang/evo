    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Like H. guttata but annular area dull, inside cream, with small, maroon spots, tube 4-5 mm long, inner corona lobes nearly equalling anthers, tapering to bristly acute apex.
            sourceIds:
              - sanbi_14722_0
            locator: "SANBI/WFO archive Morphology row 30909; source 14722.0; publication: Bruyns, PV. 2013. Apocynaceae. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 248 - 264. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: The plant in H. humilis forms a very dense clump of 4-angled stems, which are usually short and squat and often broader than tall. The flowers in this species are very pretty. On the inside the lobes are finely spotted with red on a cream background with the spots increasing in size and coalescing on the annulus to become plain red towards the mouth of the tube. The annulus is never as shiny and the colours are generally not as bold as in H. zebrina. As mentioned above, the inside of the lobes is covered with fine papillae whose apical cell is swollen into a shortly acute, top-like structure which is usually maroon. These papillae are mainly concentrated on the cream parts of the lobes, with the red blotches mostly free of them. They usually disappear towards the bases of the lobes. As in H. zebrina, the corolla in H. humilis is strongly reflexed just below the bases of the lobes. This often accentuates the annulus so that it stands out well above the lobes as a thick, inflated ring. If the flower is dissected, it is found that the corolla reaches a maximum of about twice as thick in this annulus as it is below it and so the main cause of the prominence of the annulus is the manner in which the corolla is reflexed around the mouth of the tube. This annulus is very variable in its prominence and in some flowers it is almost absent. In such cases the flower begins to resemble that of some forms of H. thuretii. This is especially similar to what is found in plants that were described as H. scabra var. ecornuta from Biesiespoort near Victoria West. In these plants there is a fairly prominent annulus around the mouth of the tube and the flower is fairly boldly spotted with red. More similar to H. thuretii is the presence in these flowers of papillae with tiny apical bristles around the mouth of the tube. There is, therefore, some evidence to suggest that H. humilis and H. thuretii intergrade and this deserves further investigation.
            textZh: SANBI 条目提供了该种的鉴别特征。
