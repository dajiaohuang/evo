        metadataVariant: 0
        usage:
          title: Leucocarpus perfoliatus (Kunth) Benth., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Coarse, erect herbs or shrubs to 2.5 m tall, glabrate; stems stout, drying strongly angled, hollow, if puberulent soon glabrescent. Leaves opposite, appear- ing connate perfoliate but actually not so, lanceolate, to 20 cm long, ca. 3 cm wide, apically acute, basally narrowed and auriculate with an indistinct petiolar region, the margin serrate with numerous prominent but fine teeth, sometimes ciliolate, the midvein prominent, plane or impressed above, elevated beneath, lateral veins numerous, arcuate ascending, drying reticulate beneath, glabrate or with some short scattered hairs, copiously glandular dotted beneath on emerging; petiolar area broadly winged, mostly edentate. Inflorescences numerous short, several flowered contracted cymes to 4 cm long and 4 cm broad, the peduncles mostly 1-2 cm long, drying compressed, ciliolate, the bracts narrowly deltoid or lanceolate, costate, ca. 4 mm long, situated at the base of the pedicels and the peduncle branches. Flowers with the calyx 7-8 mm long, tubular campanu- late, 5-lobed, the lobes 3-4 mm long, acute to linear, outcurving, extending down- wards as prominent calyx costas, glabrous, the calyx tube enervate; corolla white, drying yellow, tubular to campanulate, ca. 1.5 mm long, glabrous outside or with minute glandular trichomes near the top of the tube, exserted ca. 10 mm from
          originalLanguage: en
