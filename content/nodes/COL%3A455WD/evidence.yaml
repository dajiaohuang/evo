    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Stem glabrous, purplish-black when dry; leaves elliptic, attenuate below into a pseudo-petiole 76 mm [as '3 in.'] long, sheathing at the base and ciliate along the margin; blade scabrid with bulbous-based hairs above and near the apex beneath, elsewhere glabrous; cymes pseudo-terminal; peduncle, rhachis and outside of calyx hirsute; calyx-lobes 1.5 mm [as '3/4 lin.'] long, linear, 3-nerved; corolla blue; tube 2.1 mm [as '1 lin.'] long, scaly in the throat; lobes elliptic-oblong; anthers oblong, inserted near the mouth of the corolla-tube; style about as long as the corolla-tube; nutlets lenticular, smooth.
            sourceIds:
