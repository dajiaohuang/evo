    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Bis auf die Fäden kahl. Rhizom zylindrisch, etwa 1 cm dick, seine Länge unbekannt. Blattreste zu wenigen stehen-bleibend, braun oder bräunlich, nur etwa 1 cm lang. Blätter etwa 20, lineal, am Grund nur unbedeutend erweitert, spitz, mit winzigem Spitzchen, flach, wahrscheinlich aufsteigend-ausgebreitet, mit ungefähr 5-6 Nerven, 30-40 cm lang, 5-6 mm breit, in den untersten 1 1/2 cm auf jeder Seite mit einem farblosen, 4-7 mm breiten Hautflügel. Schaft 20-40 cm lang, wahrscheinlich teret, aufrecht oder aufsteigend, kräftig. Traube 40-50 cm lang, zylindrisch, mit äu?erst zahlreichen Blüten; untere Internodien 1-3 cm lang. Stielchen fast waagerehbt, später nach oben oder unten gebogen, die unteren 15 mm lang. Brakteen lanzettlich, am Grund verbreitert, häutig, farblos, mit braunem Mittelstreif, die unteren 3-4 mm lang. Perianth wei?, 8 mm lang; Segmente etwa länglich, getrocknet hellgelb, mit schmalem braunem Streif. Fäden getrocknet rotbraun, 4 mm lang. in der unteren Hälfte und an der Spitze kahl; Haare zahlreich, lang, flach, getrocknet rotbraun, an der Spitze dunkler und kier keulig verdickt, abs'tehend. Ovar rund, 2 mm lang. Griffel aufrecbt, mit verdickter Narbe, 3 mm lang. Beutel gelb, länglich, stumpf, 1 mm lang.
