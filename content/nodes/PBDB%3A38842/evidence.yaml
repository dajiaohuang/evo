  claims:
    - subjectId: taxon:ceratopsia
      claimKind: scientific
      claimType: topology
      statement: Ceratopsia is represented by a sampled morphology matrix in which the Aquilops holotype is placed among early neoceratopsians; that placement and its biogeographic implications do not identify a direct ancestor or a clade-wide first appearance.
      confidence: medium
      confidenceRationale: The skull and matrix are direct primary evidence, but topology and dispersal are analytical interpretations. Medium confidence keeps the navigation claim at that level.
      referenceLinks:
        - referenceId: farke-2014-aquilops-ceratopsia
          relation: supports
          pages: 9(12):e112055
          figure: Figures 1–7; Data S1
          quoteLocator: Holotype and locality; phylogenetic analysis; biogeographic discussion
    - subjectId: taxon:ceratopsia
      claimKind: scientific
      claimType: fossil-range
      statement: Ceratopsia is displayed at 113–100.5 Ma only as the Early Cretaceous Aquilops sample interval, not the origin or total duration of Ceratopsia. The interval is a source-bounded sample window, not a global FAD, LAD, divergence date, continuous occupancy claim or direct-ancestor assertion.
      confidence: medium
      confidenceRationale: Ceratopsia uses Farke, A.A.; Maxwell, W.D.; Cifelli, R.L.; Wedel, M.J. (2014) because the cited pages and locator expose the sampled taxon, specimen or living sequence set. Confidence is medium and applies only to Cloverly Formation Aquilops holotype interval, Montana, USA; broader endpoints remain unclaimed.
      referenceLinks:
        - relation: supports
          referenceId: farke-2014-aquilops-ceratopsia
          pages: 9(12):e112055
          figure: Figures 1–7; Data S1
          quoteLocator: Holotype and locality; phylogenetic analysis; biogeographic discussion
        - relation: contextualizes
          referenceId: ics-2026-06
          pages: International Chronostratigraphic Chart v2026/06
          figure: Global chronostratigraphic scale
          quoteLocator: Numerical boundaries for named geological stages used to bound the source sample
  claim-rationales.zh:
    - 头骨和矩阵是直接主研究证据，但拓扑与扩散属于分析解释；中等置信度将导航主张限制在该层级。
    - Ceratopsia 采用 Farke, A.A.; Maxwell, W.D.; Cifelli, R.L.; Wedel, M.J.（2014）的论文，因为所引页码与定位符直接标示了研究采样的类群、标本或现生序列集合。中等置信度仅适用于 Cloverly Formation Aquilops holotype interval, Montana, USA；更宽泛端点保持未声明。
  claim-statements.zh:
    - 角龙类由一个取样形态矩阵表示，其中 Aquilops 正模被置于早期新角龙类；该位置及其生物地理含义不识别直接祖先或全支系首现。
    - Ceratopsia 仅以 113–100.5 Ma 展示为早白垩世 Aquilops 样本区间，而非角龙类起源或完整延续期。该区间是来源限定的样本窗口，不是全球首现、末现、分化日期、连续占据或直接祖先断言。
