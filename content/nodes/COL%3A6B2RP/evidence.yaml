        usage:
          title: Corchorus hirtus L., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Herb, usually erect or sometimes spreading, the stem attaining 40-60 cm. or even more in height, sometimes somewhat woody below, branched or not, sparsely to densely hirsute, the hairs usually simple. Leaves short-petiolate, the petiole 3-5 mm. long, densely hirsute, the stipules linear-lanceolate, curved, acuminate, longer than the petioles, ca. 5-7 mm. long, hirsute; blade lanceolate to oblong-lanceolate or more or less ovate, acute at the apex, 1.5-4.3 cm. long and 0.7-2 cm. wide, herbaceous, the margins serrate-crcnate. hirsute on both sides, 3-palminervecl. Flowers oppositifolious (or sometimes axillary?), solitary or sometimes geminate, the pedicel longer than the petiole, ca. 4-10 mm. long, densely long-hirsute; sepals 5, linear, long-acuminate, 7.5-10 mm. long and 1-1.2 mm. wide, long-hirsute without, glabrous within; petals 5, spatulate, rounded, 7.5-9 mm. long and 2.5-3.5 mm. wide, yellow, glabrous; stamens numerous, the filaments free to more or less long-connate, ca. 7 mm. long, the anthers more or less reniform, ca. 0.5 mm. long; ovary narrowly oblong, compressed, ca. 2-2.5 mm. long and 0.5 mm. in diam., densely long-sericeous, 2-celled; style filiform, ca. 4 mm. long, glabrous; stigma peltate, subbilobulate, the lobes densely papillate. Capsule erect, linear, com- pressed contrary to the partition, caudate-acuminate at the apex, ca. 3 cm. long and 0.25 cm. in diam., 2-celled, the valves chartaceous and more or less densely long-hirsute; seeds numerous, polygonal, ca. 1 mm. long, the testa black.
          originalLanguage: en
          sourceField: general
