        usage:
          title: Paullinia tenuifolia Standl. ex J.F.Macbr., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Lianas; stems several-angled to terete when young, weakly viscidulous, sparsely bispidulous on the angles, terete to weakly 3- or 4-sulcate in age; wood simple. Leaves pinnately 5-foliolate, 10-20(-27) cm long, thin, almost glabrous; petioles without wings, 2-5 cm long, canaliculate above, nearly glabrous except along the upper margins; rachis margined with a medial ridge, the margins and ridge scabridulous; leaflets lanceolate-elliptic, ovate-lanceolate to narrowly- elliptic, narrowly long-acuminate at the apex, attenuate to obtuse or acute at the base, (2.2-)4-15 cm long, 0.7-5(-6.4) cm wide, crenate-serrate in the outer 3/4 with weakly glandular teeth, sparsely ciliate, the upper surface glabrous except hispidulous on the sharply raised upper midrib, the lower surface glabrous except for occasional stiff trichomes on the major veins and barbulate vein axils, the major lateral veins 6-10 pairs, mostly extending to or near the margin; stipules nearly linear, to 7 mm long, glabrous except for the sparsely ciliate margins. In- florescences of usually several (rarely 1) elongate thyrses borne at leafless nodes, branched from so near the base as to appear fasciculate, the branches to 11 cm long; rachises slender, short-villous to puberulent, viscidulous; pedicels and calyces puberulent. Flowers white, crowded on the rachis; outer sepals to 1.5 mm long, ciliate; petals oblong-elliptic, ca. 3 mm long, glabrous, the anterior scales with the basal part rounded, ca. 1.3 mm long, prominently ciliate on the margin, the crest oblong-linear, as long as the basal part, the lateral scales also with a single slender crest; disc glands 4, equal, ovoid or semicircular, whitish, puberulent on the inner edge; bisexual flowers with the stamens ca. 1.5 mm long, the filaments flattened, puberulous throughout, the pistil 2.3 mm long, the ovary ovoid to rounded, bluntly trigonous, sparsely hispidulous and glandular, 0.6 mm long, the style ca. 3 times as long as the ovary, 3-branched in the upper fourth, glabrous except for the stigmatic papillae. Fruits obovoid, rounded to weakly emarginate at the apex, obtusely tapered to a sessile base, 12-15 mm long, to ca. 8 mm wide, 1-locular, inconspicuously and faintly short-puberulent, glandular, red; seed 1, globose, densely puberulent, borne upon a thick white aril.
