        usage:
          title: Napeanthus apodemus Donn.Sm., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Delicate terrestrial herbs; stems rarely over 2 cm tall, 3-5 mm in diam., terete, green to brown, pilose, glabrescent, unbranched. Leaves in a flat rosette, narrowly oblanceolate, elliptic, or obovate, usually somewhat falcate, 2.7-10.8 cm long, 1.2-4.2 cm wide, the apex rounded to acute, the base decurrent into the petiole, cuneate, or rounded, subentire to dentate or serrate, toothed espe- cially toward the apex, the upper surface dark green, rarely bullate, sparsely pilose near the base, but glabrous toward the apex, the lower surface lighter green with stomatal groups appearing as whitish dots in dried specimens, pilose along the veins; petioles when present flattened, to 4 mm long, 1-2 mm wide, green, pilose. Inflorescences axillary, shorter or longer than the leaves, racemose to paniculate; peduncles long persistent, slender, terete to quadrangular, 1.7-3.6 cm long, green, pilose to glabrescent, the bracts leaflike, clasping the bases of the pedicels, linear, 3-5 mm long, ca. 1 mm wide, green, pilose at least on the midvein beneath; pedicels often numerous 1-3 cm long, green, sparsely pilose. Flowers one to many; sepals joined at the base into a short tube, green to reddish, pilose at the base and along the prominent longitudinal veins above, the lobes 5, narrowly triangular or lanceolate, to 4 mm long, less than 1 mm wide to 3 mm wide, enlarging in fruit, the apex acute, the margin entire but pubescent; corolla caducous, usually white, rarely pale lavender or pink, glabrous, 4-6 mm long, rotate, the tube of 5 united petals, 1-2 mm long, the limb nearly regular, the lobes ovate, entire (?); stamens 4, inserted on the base of the corolla tube, the filaments 1-3 mm long, glabrous, the anthers orbiculate, ca. 1 mm broad, not coherent, locules divergent, yellow, the staminode ca. 1 mm long or less; ovary ovoid, ca. 1 mm long, yellow green, glabrous, the style curved, 2-3 mm long, glabrous, the stigma obscurely bibbed. Fruit a dry capsule surrounded by the persistent calyx, globose, 2-3 mm in diam.; seeds dark brown, shiny, fusiform, ca. 0.5 mm long, striate.
