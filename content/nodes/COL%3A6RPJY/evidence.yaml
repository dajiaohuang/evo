    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, up to 1 m tall, branching above. Leaf 1, clasping the stem below, channelled and trailing above. Flowers enclosed in green spathes, yellow, nodding, with tepals reflexed, filaments united in a thickened column, anthers diverging, exceeding the style branches.
            textZh: Moraea reflexa Goldblatt 的 SANBI 物种条目记载了植株、叶片和花部形态。
            sourceIds:
              - sanbi_14562_0
            locator: Strelitzia 30; archive Morphology row 33320, source 14562.0
            placeTimeScope: Regional species account published 2013; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
          - text: Distinguished among the yellow-flowered species of subg. Homeria by the solitary, broad, glaucous leaf, the lower portion clasping the stem, and the half to fully pendent flowers with reflexed tepal limbs. The tips of the tepal claws clasp the thickened filament column but are slightly bowed toward the bases, which contain nectar. The style branches are relatively well developed and bear broad stigmatic lobes and straight linear crests. Moraea reflexa may be confused with superficially similar M. marlothii, a taller, more robust species that occurs widely across the western Karoo, but the tepals in that species, either yellow or pink, spread horizontally or are sometimes half reflexed, the filament column is usually narrow and cylindric or only slightly thickened below, and the ovary is long and slender and curved outward, whereas the shorter ovary of M. reflexa is straight, top-shaped and widest near the apex. Although the flowers of M. marlothii are comparable in size to those of M. reflexa, it has much larger anthers 8-11 mm long compared with anthers ± 6 mm long in M. reflexa.
            textZh: SANBI 条目提供了 Moraea reflexa Goldblatt 的鉴别特征。
