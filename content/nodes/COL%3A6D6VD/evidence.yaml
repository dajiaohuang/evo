    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants 100-750 mm high, solitary or up to 15 stems tufted together. Corm 10-17 mm diam. Stem with lowermost internode (when present) 25-100 mm long. Foliage leaves 3 or 4, borne on a separate shoot and often not fully developed at flowering, ± 150-330 x 0.75-2.50 mm; sheathing cauline leaves 3 or 4. Spikes ± pendulous or suberect, terminal 1- to 8-flowered, laterals lacking or up to 5, pendulous, each 1- to 5-flowered; bracts obovate to lanceolate, acute, 8-15 x 4-6 mm, up to ± 2 internodes long or shorter, lightly flecked orange-red at base and along midline or all over, midline often ± solidly brown, secondary veins 3 or 4 each side of main vein. Flowers bell-shaped with tepals suberect and flaring distally, pale mauve; perianth tube 6-8 mm long; tepals 11-13 x 4.0-5.5 mm. Anthers 4.5-6.0 mm long. Stigmas held 5-8 mm below top of perianth.
            textZh: Dierama nixonianum Hilliard 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Morphology row 98529; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: A small, early-flowering species with foliage leaves produced on a separate shoot alongside the flowering stem and often not fully formed at flowering, rather closed flowers with tepals only twice as long as the perianth tube, and short bracts, 8-15 mm long. Dierama trichorhizum has a similar habit, with the current season’s foliage leaves on a shoot alongside the flowering stem, but with a characteristic long internode between the corm and the lowest cauline leaf on the flowering stem, cormlets in the lowest leaf axil, and widely funnel-shaped flowers with spreading tepals three times as long as the perianth tube.
            textZh: SANBI 条目提供了 Dierama nixonianum Hilliard 的鉴别特征。
