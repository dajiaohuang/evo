    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Stems 20-35 cm tall, long-pilose. Leaves crowded or scattered and irregularly inserted on lower, non-flowering part of stem, verticillate at flowering nodes with internodes up to 20 mm long; leaves at flowering nodes not reduced in size. Leaf-lamina 25-47 x 2-9 mm, linear to triangular with truncate base, subsessile, long-pilose. Flowers in fascicles of 3-9 at distal nodes; pedicels up to 12 mm long. Calyx segments 4-4.5 x 1-1.5 mm, dorsally densely pilose, ventrally glabrous or pilose at apex. Corolla lobes 4-5 x 2-3 mm, convex and reflexed at anthesis, green; dorsal surface very sparsely to densely patent-pilose at apex. Corona 1-1.5 mm high, the lobes of simple form, ± compressed-ovoid with two shallow concavities on the ventral face, one on either side of the connection between corona and stamina column; corona green with white tip. Anther appendages 0.8 mm long, ± flat; corpusculum 0.33-0.43 mm long, with slight to well-developed flanges; pollinium 0.63-0.75 mm long. Gynostegium greenish-cream. Mature fruit c. 5 cm long, with bristles c. 2 mm long, densely whitish lanate. Seeds 2 mm long; coma white, c. 20 mm long.
