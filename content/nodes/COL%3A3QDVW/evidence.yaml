            locator: "SANBI/WFO archive Morphology row 8904; source 14094.0; publication: Magee, AR; Manning, JC; van Wyk, B-E; Tilney, PM. 2012. Apiaceae: Itasina Raf. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 328 - 328. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: It is interesting that the seedling leaves as well as the upper (mature) leaves are invariably simple. This character enables the plant to be easily identified (once it has been spotted). The single species is exceptionally variable, especially in overall size, leaf size and calyx shape. It is the only African species that has spiny calyx lobes although this character occurs only sporadically.
