    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Tufted perennial to 45 cm. Leaves usually dead at flowering, radical, linear to filiform, sometimes subspathulate. Flowers in compound umbels on branched peduncles, white. Fruit narrowly elliptic, ribbed, sepals sometimes slender and spinescent, vittae present, rib oil ducts inconspicuous.
            sourceIds:
