    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Like Q. mammillaris but mat-forming and rooting on branches, stems 20-30 mm diam., with fewer and blunter teeth and mottled with purple, flowers often brown to yellowish.
            sourceIds:
              - sanbi_14722_0
            locator: "SANBI/WFO archive Morphology row 30942; source 14722.0; publication: Bruyns, PV. 2013. Apocynaceae. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 248 - 264. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: The two species Q. arenicola and Q. armata are rather similar. Both have a clump-forming habit with the side-stems rooting readily at their bases, which is an unusual feature among these more robust, relatively large-flowered taxa. In Q. arenicola, which has a more easterly distribution on the edge of the winter-rainfall region and the western margin of the Great Karoo, the ascending to spreading tubercles on the stems are arranged fairly exactly into four neat tiers, the stems are uniformly grey- to purple-green and the leaf-rudiment may be subtended by a pair of stipular denticles surrounded by a few ‘hairs’. The flowers are borne on peduncular patches at more or less any height on the stems but with a preponderance towards the base.
            textZh: SANBI 条目提供了该种的鉴别特征。
            sourceIds:
