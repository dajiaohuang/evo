        usage:
          title: Serjania grandis Seem., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Tendrilled lianas, red-tomentose on most parts; stems subterete, with many prominent ribs; wood composite with an irregular number of peripheral bundles, these usually small, paired or solitary, terete or flattened. Leaves trifoliolate; petioles 1.5-12 cm long; leaflets ovate to obovate or subrhombic, rounded to ob- tuse at the apex, rounded to attenuate at the base, 3.5-14 cm long, 2.5-8 cm wide, crenate-dentate, membranous, densely tomentose-pilose especially on the veins. Inflorescences axillary thyrses or congested terminal panicles, red-tomentose; bracteoles deltoid, 1.5-3.5 mm long; pedicels ca. 6 mm long, articulate near the middle. Flowers ca. 7 mm long; sepals ovate to obovate, short-tomentose, 4-5 mm long; petals broadly obovate-attenuate, 5-6 mm long, glandular inside, the scales of the anterior petals ca. 4 mm long, the crest orange, shortly trilobed or subemarginate, ca. 1 mm long, the deflexed appendage narrowly deltoid, about as long as the crest, glabrous except along the silky long-pubescent margin; bi- sexual flowers with stamens ca. 2 mm long, the filaments densely silky-white pubescent in the lower half with the trichomes extending to the anthers, the anthers ca. 0.7 mm long, the ovary densely villous, ca. 3 mm long, the style ca. 2.5 mm long, 3-branched to about the middle; staminate flowers not known. Fruits ovate-cordate, 2-3.5 cm long, the seed-bearing part trigonous with the apex retuse and the surface villous-tomentose, the wings thin, villous, scarcely or not at all constricted below the seed-bearing part.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 12701
