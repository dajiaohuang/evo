    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Dwarf, cormous geophyte, 2-5 cm, corm flat-bottomed, broadest at base, tunics hard. Leaves 2 or 3, spreading, narrow, channelled, firm. Flowers 2(3), stellate, white with green reverse, often sweetly scented, anthers sagittate, with connective broader than pollen sacs, bracts 2(3), narrowly linear, spreading.
            textZh: Pauridia pygmaea Snijman & Kocyan 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13877_0
            locator: "SANBI/WFO archive Morphology row 7536; source identifier 13877.0; cited publication: Snijman, DA. 2012. Hypoxidaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 115 - 119. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: In addition to its dwarf habit, Pauridia pygmaea is most easily recognized by the broadly conical corm, which has a hard, conspicuously broad, flat base that forms a narrow rim around the circumference. Apart from green on the tepals' backs and often a yellow spot on the anthers, the flowers are mostly entirely white and often sweetly scented. Although not always evident in the dried state, the anthers are sagittate, each with a broad connective, often exceeding the thecae in width, which tapers upwards to a notched apex. Such broad anthers are often found in species of Hypoxis, but in Paurida they are unique to P. pygmaea. Because of the uniquely shaped corm and anthers, Nel placed P. pygmaea (as Ianthe minuta) in a somewhat isolated position within the genus. The species, however, appears to be closely allied to the recently described P. etesionamibensis with which it shares a characteristically raised, broad apical dome. As discussed under that species, the distribution pattern of P. etesionamibensis and P. pygmaea, confined to the Gariep centre and Western Cape respectively, is adisjunction often repeated by sister species in several other families-Amaryllidaceae, Asphodelaceae, Iridaceae and Tecophilaeaceae.
            textZh: SANBI 条目提供了 Pauridia pygmaea Snijman & Kocyan 的鉴别特征。
