          title: Gouania hypoglauca Standl., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Lianas, climbing by tendrils located near the bases of the inflorescences, the younger stems pubescent, the trichomes brown or white with brown tips. Leaves ovate to elliptic, acute, remotely crenate, the teeth glandular-tipped, obtuse to slightly rounded basally, to 6 cm long and 3 cm wide, sparsely pubescent above, densely white-tomentose beneath, tending to be 3-nerved at the base; petioles ca. 0.5-1 cm long, brown-pubescent, the stipules small, caducous. Inflorescences thyrses, with the flowers in sessile or subsessile glomerules, the individual spike-like branches to 23 cm long. Flowers bisexual, subsessile; bract single, subtending a glomerule, narrowly deltoid, to 1.5 mm long, caducous, densely brown-pubescent; floral tube subcampanulate, pubescent; calyx-lobes deltoid, ca. 0.8-1 mm long, pubescent; petals ovate, ca. 0.6 mm long, the stalk ca. 0.2 mm long; anthers ca. 0.2 mm long; nectariferous disc pubescent, distinctly bilobed between the stamens; style 3-furcate. Fruit unknown.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 11043
