          title: Miconia prasina (Sw.) DC., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrub or small tree, reported to 10 m. tall, the younger branches, lower leaf- surface, panicle, and hypanthia very minutely and sparsely stellate-furfuraceous; petioles 5-20 mm. long; leaf-blades firm in texture, oblong or lanceolate, com- monly 1-2 dm. long and a third to two-fifths as wide, acuminate, entire or somewhat undulate, acuminate or acute at base and often decurrent on the petiole, usually completely glabrous above, 3- to 5-pli-nerved; panicle pyramidal, up to 15 cm. long; flowers sessile or nearly so, tending to be crowded toward the ends of the branches; hypanthium narrowly campanulate, 2-2.5 mm. long; calyx-tube prolonged about 0.5 mm.; calyx-lobes triangular, acute or obtuse, 0.2-0.4 mm. long; petals white, obovate, 2.5-3 mm. long; stamens somewhat dimorphic; anthers linear, 3-3.5 or 2.5-3 mm. long, the connective prolonged at base below the thecae into two deflexed lateral lobes; style slightly dilated upward to the truncate stigma.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 7572
