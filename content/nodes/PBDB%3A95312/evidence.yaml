  claims:
    - subjectId: taxon:lepidosauria
      claimKind: scientific
      claimType: fossil-range
      statement: The Lepidosauria navigation envelope uses the approximately 240 Ma Megachirella specimen and its tested stem-squamate placement as the older evidence anchor and living lepidosaurs at 0 Ma as the younger edge; this does not make Megachirella a direct ancestor or establish a global lepidosaur first appearance or divergence time.
      confidence: medium
      confidenceRationale: The only known specimen has archived CT data and was tested in combined morphology–molecule analyses, but compression, character scoring and model settings constrain the placement. Medium confidence applies to the evidence-linked display anchor rather than a universal clade boundary.
      referenceLinks:
        - referenceId: simoes-2018-megachirella
          relation: supports
          pages: 706–709
          figure: Figures 1–2; Extended Data Figures 1–8
          quoteLocator: Geological age and specimen description; CT anatomy; combined-evidence analyses
    - subjectId: taxon:lepidosauria
      claimType: taxonomy
      claimKind: scientific
      statement: The cited analyses place Megachirella on the squamate stem, Taytalura as an early-diverging stem lepidosauromorph, and Bellairsia on the squamate stem; these placements are sampled analytical results and do not resolve every lepidosaur relationship.
      confidence: medium
      confidenceRationale: Each primary study reports an explicit matrix-based placement supported by imaged anatomy. Medium confidence preserves sensitivity to character scoring, taxon sampling and model constraints.
      referenceLinks:
        - referenceId: simoes-2018-megachirella
          relation: supports
          pages: 706–709
          figure: Figures 1–2; Extended Data Figures 1–8
          quoteLocator: Combined-evidence analyses and stem-squamate placement
        - referenceId: martinez-2021-taytalura
          relation: supports
          pages: 235–238
          figure: Figures 1–2; Extended Data Figures 1–10
          quoteLocator: Phylogenetic analyses and early-diverging stem lepidosauromorph placement
        - referenceId: talanda-2022-bellairsia
          relation: supports
          pages: 99–104
          figure: Figures 1–4; Extended Data Figures 1–8
          quoteLocator: Synchrotron anatomy and Bayesian stem-squamate analyses
    - subjectId: taxon:lepidosauria
      claimType: biogeography
      claimKind: scientific
      statement: The profile's named lepidosaur samples come from the Middle Triassic Italian Alps (Megachirella), Late Triassic Ischigualasto Formation of Argentina (Taytalura), and the Middle Jurassic Kilmaluag Formation of Skye, Scotland (Bellairsia specimen NMS G.2022.1.1); these occurrences do not establish a global lepidosaur distribution.
      confidence: high
      confidenceRationale: Locality and geological context are stated in the respective primary studies. High confidence is limited to the named specimens and formations, with no inference about unsampled areas.
      referenceLinks:
        - referenceId: simoes-2018-megachirella
          relation: supports
          pages: 706–709
          figure: Figure 1; geological context
          quoteLocator: Italian Alps specimen PZO 628 and Middle Triassic horizon
        - referenceId: martinez-2021-taytalura
          relation: supports
          pages: 235–238
          figure: Figure 1; Extended Data Figure 1
          quoteLocator: Ischigualasto Formation, Argentina; holotype PVSJ 698
        - referenceId: talanda-2022-bellairsia
          relation: supports
          pages: 99–104
          figure: Figure 1; Extended Data Figures 1–2
          quoteLocator: Kilmaluag Formation, Skye, Scotland; NMS G.2022.1.1 (Extended Data Fig. 1). Kirtlington elements are separate fragmentary referred comparison material in Extended Data Fig. 4.
    - subjectId: taxon:lepidosauria
      claimType: morphology
      claimKind: scientific
      statement: "High-resolution imaging exposes complementary early lepidosaur anatomy: Megachirella contributes cranial, wrist and shoulder characters, Taytalura preserves a three-dimensionally exposed CT-resolved skull, and Bellairsia provides synchrotron-resolved stem-lizard anatomy."
      confidence: medium
      confidenceRationale: The specimens and imaging observations are directly reported, while comparative character scoring and their evolutionary interpretation depend on each study's matrix and reconstruction.
      referenceLinks:
        - referenceId: simoes-2018-megachirella
          relation: supports
          pages: 706–709
          figure: Figures 1–2; Extended Data Figures 1–8
          quoteLocator: CT anatomy of the skull, wrist and shoulder
        - referenceId: martinez-2021-taytalura
          relation: supports
          pages: 235–238
          figure: Figures 1–2; Extended Data Figures 2–7
          quoteLocator: Three-dimensional skull preservation and CT anatomy
        - referenceId: talanda-2022-bellairsia
          relation: supports
          pages: 99–104
          figure: Figures 1–4; Extended Data Figures 1–8
          quoteLocator: ESRF ID19 synchrotron tomography and stem-lizard anatomical description
    - subjectId: taxon:lepidosauria
      claimType: ecology
      claimKind: scientific
      statement: The cited Megachirella, Taytalura and Bellairsia studies provide locality, anatomy and phylogenetic analyses but do not establish a single Lepidosauria diet, habitat, locomotor mode, body-size distribution or ecological guild; those fields remain explicitly unassigned here.
      confidence: medium
      confidenceRationale: The primary evidence is anatomical and analytical, not direct observation of extinct behaviour. The profile separates specimen context from unsupported taxon-wide ecological inference.
      referenceLinks:
        - referenceId: simoes-2018-megachirella
          relation: supports
          pages: 706–709
          figure: Figures 1–2; Extended Data Figures 1–8
          quoteLocator: CT anatomy and combined-evidence analysis; no taxon-wide ecology result
        - referenceId: martinez-2021-taytalura
          relation: contextualizes
          pages: 235–238
          figure: Figures 1–2; Extended Data Figures 1–10
          quoteLocator: Skull description and phylogenetic analyses
        - referenceId: talanda-2022-bellairsia
          relation: contextualizes
          pages: 99–104
          figure: Figures 1–4; Extended Data Figures 1–8
          quoteLocator: Synchrotron anatomy and stem-squamate analyses
  claim-rationales.zh:
    - 唯一已知标本具有存档 CT 数据并在形态—分子联合分析中受检验，但压扁保存、性状编码和模型设置约束其位置；中等置信度适用于有证据连接的显示锚点，而不是普遍类群边界。
    - 三项研究都给出基于矩阵的归置并有成像解剖支持；中等置信度保留性状编码、取样和模型设置的敏感性。
    - 各研究直接说明具名标本的地点和地质背景；高置信度仅限这些化石样本，不推断未取样地区。
    - 成像观察直接支持标本和解剖记录，但比较性状评分及其演化解释仍依赖各研究的矩阵和复原。
    - 一手证据是解剖和分析结果而非灭绝动物的行为观察，因此不为鳞龙类臆测统一食性、生境、运动、体型分布或生态位。
  claim-statements.zh:
    - 所引分析将 Megachirella 置于有鳞类干群，将 Taytalura 视为早期分化的干群鳞龙形类，并将 Bellairsia 置于有鳞类干群；这些定位是基于采样的分析结果，并未解析所有鳞龙类的亲缘关系。
    - 本档案所列鳞龙类样本分别来自意大利阿尔卑斯山区的中三叠统（Megachirella）、阿根廷晚三叠世 Ischigualasto 组（Taytalura），以及苏格兰斯凯岛中侏罗世 Kilmaluag 组（Bellairsia 标本 NMS G.2022.1.1）；这些产出记录不能确定鳞龙类的全球分布。
    - 高分辨率成像揭示了互补的早期鳞龙类解剖信息：Megachirella 提供头骨、腕部和肩部性状，Taytalura 保留可经 CT 解析并以三维呈现的头骨，Bellairsia 则提供经同步辐射成像解析的干群蜥蜴解剖结构。
    - 所引 Megachirella、Taytalura 和 Bellairsia 研究提供产地、解剖及系统发育分析，但不能确定鳞龙类统一的食性、生境、运动方式、体型分布或生态功能类群；这些字段在此明确暂不赋值。
    - 鳞龙类导航范围以约 2.40 亿年前 Megachirella 标本及其经检验的有鳞类干群位置作为老端证据锚点，以 0 Ma 的现生鳞龙类作为年轻端；这不把 Megachirella 视为直系祖先，也不建立鳞龙类的全球首现或分化时间。
