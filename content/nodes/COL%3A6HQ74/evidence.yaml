        metadataVariant: 0
        usage:
          title: Faramea pauciflora Dwyer, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Trees to 4 m tall, the branchlets angular, twisted, somewhat smooth, the nodes well spaced. Leaves elliptic oblong, 15-19 cm long, 6-7.5 cm wide, rounded or obtuse at the apex, the acumen slender, to 1.5 cm long, ultimately obtuse, cuneate or acute at the base, the costa somewhat prominulous above, subprominent be- neath, the lateral veins 14-17, arcuate, prominulous, forming an undulate mar- ginal vein, rigidly papyraceous, somewhat discolorous, minutely puberulent on the veins and the costa; petioles to 1.5 cm long, ca. 0.13 cm wide, black when dry, minutely puberulent; stipules free, ovate triangular, to 1.5 cm long, 0.4-0.6 cm wide at the base, subcoriaceous, glabrescent, minutely rugulose, the apex drawn into a short bristle. Inflorescences axillary, the flowers 3 per cyme, or the flowers solitary; peduncle to 4 cm long, to 0.15 cm wide, black, glabrous; bracts and bracteoles not seen, perhaps regularly absent; pedicels perpendicular to the axis of the inflorescence or sharply ascending, to 4 cm long, ca. 0.1 cm wide, glabrous. Flowers with hypanthium similar to the pedicel but slightly expanded, glabrous, to 2.5 mm wide, the calycine cup cylindrical, to 1.2 cm long, to 0.5 cm wide, conspicuously truncate, the lobes 4, subulate, to 8 mm long, with 2 longer than the others, acute; corolla white, aromatic, the tube to 3 cm long, ca. 0.25 cm wide in the middle, expanded toward the apex, stiffly petaloid, glabrous on both sides, the lobes 4, these erect, narrowly subulate, to 1.3 cm long, to 0.35 cm wide, glabrous; stamens 5, sessile, narrowly oblong, ca. 8 mm long, obtuse at the apex, sagittate at base, inserted above the middle of the corolla tube; style not seen. Fruits not seen.
          originalLanguage: en
          sourceField: general
