    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Bulbous geophyte, 6-40 cm. Leaves 2, dry at flowering, spreading, tongue-shaped, fleshy, usually speckled beneath, margin often rolled back and ciliate. Flowers in a compact head, scarlet, bracts 6-9(-13), scarlet, stiff and fleshy.
            textZh: Haemanthus coccineus L. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13845_0
            locator: "SANBI/WFO archive Morphology row 8784; source identifier 13845.0; cited publication: Snijman, DA. 2012. Amaryllidaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 53 - 62. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: The leaves are narrowly to broadly lingulate to elliptical, (25-)80-150(-210) mm wide, usually more or less barred with red or dark green on the abaxial surface. The blades are mostly recurved but sometimes can be prostrate. The inflorescence is distinguished by stiff, red spathe valves, mostly 6 to 23 cm number, which either stand erect and closely surround the flowers or sometimes spread slightly apart. The peduncle is usually more or less spotted or streaked but may occasionally be unmarked. The umbel is dense and the perianth segments are erect to slightly spreading. Specimens from the west are more fleshy and succulent in both vegetative and floral parts, while populations from the east usually have thinner leaves and spathe valves which sometimes give the umbel a more lax appearance. In addition, populations in the west flower mostly near the end of March and are strictly hysteranthous, whereas populations east of Oudtshoorn flower earlier, in February, and sometimes have the leaves emergent with the inflorescences. It is noteworthy that these differences have been maintained in most of the bulbs grown under uniform conditions at Kirstenbosch.
            textZh: SANBI 条目提供了 Haemanthus coccineus L. 的鉴别特征。
