          originalSourceText: slender but broadening upwards, glabrate, articulating at or just above the base, the bract deltoid, minute, often appressed to the pedicel. Flowers purple, the calyx ca. 1.8 mm long, the teeth ventrally conduplicate, the dorsal surface enated to form narrow wings which run from the base of the cup to the tips, the sinuses acute in flower, nonmembranaceous, running down to 6-8 mm from the calyx base, in fruit forming a membranous sleeve, the cup not distinct from the wings; corolla white, tubular, ca. 18 mm long, ca. 3 mm thick, the lobes rotund, short, with a short, spreading limb; stamens not seen; style (Gentry) 18 mm long, the ovary globose. Fruit mostly enveloped by the calyx sleeve, the tip perhaps exserted.
