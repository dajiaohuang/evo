    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Nearly stemless, cormous geophyte, 80-140 mm tall. Leaves narrowly sword-shaped, velvety, exceeding the flowers. Flowers 2-5 in a short, decumbent spike, bilabiate, blue with white nectar guides, spicy scented, perianth tube 18-20 mm long, dorsal tepal 45-55 mm long, ovary smooth, bracts green, velvety, inner forked apically. Late July-Sept.
            textZh: Babiana grandiflora Goldblatt & J.C.Manning 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_14562_0
            locator: "SANBI/WFO archive Morphology row 33048; source identifier 14562.0; cited publication: Goldblatt, P; Manning, JC. 2013. Iridaceae. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 94 - 124. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Currently included in sect. Teretifolieae, which comprises species with apically forked inner bracts, often a more-or-less underground flowering stem and a smooth ovary, Babiana grandiflora is distinctive mainly in its large flower, the perianth tube 18-20 mm long and dorsal tepal 45-55 mm long. The flowers have a strong odour of violets mixed with a spicy acrid odour, a common scent in the genus. Despite the large flowers, the stamens are disproportionately short, with the filaments ± 10 mm long, so that the anthers are held within the floral cup and largely hidden from view inside the funnel-shaped perianth. It may be most closely allied to the Western Cape coastal species, B. nana, but is easily distinguished from that species by the narrow, erect leaves with short, velvety pubescence and the mostly unbranched spikes borne at ground level and bearing 2 to 5 flowers. Babiana grandiflora has in the past been confused with the widespread B. ambigua of deep sands in coastal and inland sites in Western Cape, and although B. grandiflora resembles that species superficially, B. ambigua has inner bracts divided to the base, somewhat smaller flowers with the dorsal tepal 28-40 mm long and longer filaments 13-16 mm.
            textZh: SANBI 条目提供了 Babiana grandiflora Goldblatt & J.C.Manning 的鉴别特征。
            sourceIds:
