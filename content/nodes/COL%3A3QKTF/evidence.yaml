    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Glandular-hairy shrublet to 60 cm. Leaves sparsely toothed. Flowers axillary tending to racemose, tube inflated above, purple to blue, rarely white to pink.
            sourceIds:
              - sanbi_14433_0
            locator: "SANBI/WFO archive Morphology row 6026; source 14433.0; publication: Manning, JC; Goldblatt, P. 2012. Scrophulariaceae: Jamesbrittenia Kuntze. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 743 - 744. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: The characteristic features of J. tenuifolia are its leaves, elliptic or spathulate in outline, at least the primary leaves mostly with a pair of large teeth near the apex (occasionally two or even three pairs), its shortish pedicels, mostly up to 5-10 mm long but sometimes reaching 15 mm, a tendency for the flowers to run up into leafy racemes, and the purple-blue corolla limb. It is often confused with J. argentea (as Sutera pedunculala), which is distinguished by its flowers scattered all along the branches (thus giving the plant a different aspect), the pedicels often longer than those of J. tenuifolia, and the corolla limb is white. Confusion with J. aspalathoides is also common, but in J. aspalathoides the leaves are often smaller (rarely more than 3 mm long), oblong or narrowly spathulate and mostly entire; the flowers tend to be scattered along the branches.
            textZh: SANBI 条目提供了该种的鉴别特征。
            sourceIds:
              - sanbi_15191_0
            locator: "SANBI/WFO archive Diagnostic row 58472; source 15191.0; publication: Vollesen, KB. 2013. 126. Acanthaceae (Part 1), Fl. Zambes. 8(5): 1 - 184. Royal Botanic Gardens, Kew, London. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
