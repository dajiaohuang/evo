        usage:
          title: Heterocondylus vitalbae (DC.) R.M.King & H.Rob., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Scandent woody herbs or shrubs to 6 m tall with few branches; stems finely striate, terete, sparsely puberulous. Leaves and branches of inflorescence opposite; blades coriaceous, elliptic-ovate to ovate-lanceolate, to 12 cm long and 7 cm wide, the base rounded to slightly cuneate, the margins serrate, the apex sharply acute to slightly acuminate, glabrate with slight pubescence on veins, the veins prominently trinervate from base; petioles to 1.5 cm long. Inflorescence a loose panicle to 15 cm wide and 25 cm high, the ultimate branches mostly 1-2 cm long, densely puberulous. Heads ca. 1.2 cm high with 60-65 florets; involucral bracts ca. 20, subimbricate, subequal, the outer bracts ovate to oblong, apically acute, 5-8 mm long, the outer surface 4-8 costate, puberulous, the inner bracts mostly lanceolate, to 1 cm long, slightly deciduous, the apex narrowly acute, sometimes pink, the outer surface mostly glabrous; receptacle slightly convex; corolla white to pink or purple, ca. 8 mm long, narrowly funnelform, the tube narrow below, the lobes ca. 0.5 mm long, glabrous; style base glabrous. Achenes ca. 3.5 mm long, fusiform, 4-5 ribbed, ribs with short bristles; carpopodium short and broad with distinct upper rim, stipitate; pappus of ca. 20 scabrous deciduous bristles, ca. 7 mm long, the tips slightly enlarged.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 1861
