    - 该主张绑定具名标本或明确数据集及一手来源定位；置信度仅适用于所述样本、方法与边界，不外推为全球首次出现、直接祖先或完整类群覆盖。
  claim-statements.zh:
    - 正模 PKUP V0601 与归入标本 PKUP V0602–V0606 保存牛津期蝾螈总科成员及被解释为幼态持续的幼体结构；157 ± 3 Ma 锆石年龄来自上覆岩层，系统位置依赖取样。
