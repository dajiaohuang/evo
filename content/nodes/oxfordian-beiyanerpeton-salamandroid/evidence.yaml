    - subjectId: event:oxfordian-beiyanerpeton-salamandroid
      claimKind: scientific
      claimType: topology
      statement: Holotype PKUP V0601 and referred specimens PKUP V0602–V0606 preserve an Oxfordian salamandroid with larval structures interpreted as neoteny; the 157 ± 3 Ma zircon date is from overlying rock and the placement is sample-dependent.
      confidence: medium
      confidenceRationale: Articulated specimens and an explicit phylogenetic analysis support the dossier; medium confidence preserves the indirect age constraint and inferred developmental state.
