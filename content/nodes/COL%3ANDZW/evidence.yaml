          originalSourceText: Trees to about 30 m. tall, the young branches slender, grayish brown, glabrous or essentially so. Leaves oval to oblong-elliptic, obtuse to shortly subcuspidate- acuminate at the tip, broadly obtuse to rounded at the base, 5-15 cm. long, 2-6 cm. broad, with about 12-18 pairs of slender veins, firmly membranaceous, glabrous, the petioles about 5-7 mm. long; stipules almost fully amplexicaul, about 5 mm. long. Inflorescences subglobose, monoecious or dioecious, 3-6 mm. in diameter at anthesis, the peduncle slender, about as long as the heads or somewhat shorter. Staminate flowers with a very indefinite vestigial perianth; stamen 1, the anther circular,
