        claims:
          - text: Decumbent shrublet or short-lived, woody perennial to 20 cm. Leaves bipinnatisect with broad lobes. Flower heads discoid, few in dense, terminal corymbs, yellow.
            sourceIds:
              - sanbi_14187_0
            locator: "SANBI/WFO archive Morphology row 11377; source 14187.0; publication: Manning, JC; Goldblatt, P. 2012. Asteraceae: Oncosiphon Källersjö. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 401 - 401. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Oncosiphon sabulosus shares the perennial habit, blunt leaf lobes and decurrent involucral bracts with O. schlechteri. It is distinguished by the pinnatifid to pinnisect leaves which are oblong to obovate in outline (leaves apically 3- to 5-fid or sometimes simple and spatulate to linear in outline in O. schlechteri), glabrous peduncles and stems (cobwebbed in O. schlechteri) and round to cordate involucre base with only some involucral bract decurrent on the peduncle (involucre base cuneate with several involucral bracts decurrent in O. schlechteri).
            textZh: SANBI 条目提供了该种的鉴别特征。
