            locator: "SANBI/WFO archive Morphology row 62452; source identifier 15566.0; cited publication: Mashau, AC; Fish, L. 2015. Sporobolus R.Br. In: L Fish, AC Mashau, MJ Moeaha & MT Nembudani (eds), Identification guide to the southern Africa grasses. An identification manual with keys, descriptions and distributions, Strelitzia 36: 635 - 656. South African National Biodiversity Institute, Pretoria. [CC BY]"
