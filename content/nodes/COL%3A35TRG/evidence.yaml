          title: Dicraspidia donnell-smithii Standl., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrub or small tree 3-10 m. high, the bark smooth, the branches whitish- tomentose and long-hirsute. Leaves rather short-petiolate, the petiole terete, 1-1.5 cm. long, whitish-tomentose and long-hirsute, the stipules unequal, one filiform and 1-1.2 cm. long, the other foliaceous, peltate, very short and eccentricaly stipitate, suborbicular, up to 4.5 cm. in diam., sparsely pilose above and whitish-tomentose beneath; blade oblong to oblong-subobovate, somewhat asymmetric and slightly cordate at the base, acuminate at the apex, 10-20 cm. long and 3-8 cm. wide, membranous, the margins very irregularly dentate, the teeth acute to more or less blunt, the upper surface dark green arid sparsely pilose, the lower surface whitish- tomentose, 5- to 7-palminerved, the nervation prominent beneath. Flowers long- pedicellate, the pedicel slender, 4.5-5 cm. long, tomentose and long-hirsute; receptacle ca. 0.8 cm. in diam., tornentellous and long-hirsute; sepals triangular- acuminate, 1-1.6 cm. long (without apical appendages) and 0.5-0.7 cm. wide at the base, tomentose and hirsute outside, densely sericeous inside, each margin provided with 4-5 filiform appendages ca. 0.7-1 cm. long, the apical appendage ca. 1-1.2 cm. long; petals obovate, irregularly and bluntly dentate, 3-4 cm. long and up to 2.8-3.5 cm. wide, thin-membranous, bright yellow, glabrous; stamens with unequal filaments, ca. 0.3-0.7 cm. long, glabrous, the anthers oblong, ca. 1.2- 1.5 mm. long; ovary densely villous-arachnoid at the apex, the style thick, enlarged at the base, ca. 0.8 cm. long and 0.25 cm. broad at the base, arachnoid on the lower part, the stigma 5-dentate. Fruit baccate, transversely elliptic, ca. 1 cm. long and 1.5-1.8 cm. broad, hirsute-arachnoid; seeds ca. 0.4-0.5 mm. long.
