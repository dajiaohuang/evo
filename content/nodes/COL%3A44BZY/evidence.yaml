    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, 20-40 cm. Leaf solitary, linear, channelled. Flowers purple, inner tepals oblanceolate sometimes 3-lobed.
            textZh: Moraea algoensis Goldblatt 的 SANBI 物种条目记载了植株、叶片和花部形态。
            sourceIds:
              - sanbi_13878_0
            locator: Strelitzia 29; archive Morphology row 6903, source 13878.0
            placeTimeScope: Regional species account published 2012; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
          - text: With relatively small, blue to violet flowers and orange-red pollen, Moraea algoensis is distinguished primarily by the characteristic inner tepals, often dark violet to brown, with a broad, relatively short limb, sometimes entire or 3-lobed with a long, incurved central lobe. The filaments are united in the lower 2/3 in a slender, smooth column, arching outward distally, and bearing pale blue anthers with bright orange pollen. Flowers of some populations may be confused with M. unguiculata, but that species rarely has blue flowers and more strongly reflexed outer tepal limbs, the inner tepals darkly speckled on a yellow to white background, and a consistently trilobed inner tepal limb with the longer, narrow central cusp coiled inward. Bright red to orange pollen is not known in M. unguiculata.
            textZh: SANBI 条目提供了 Moraea algoensis Goldblatt 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: Strelitzia 42; archive Diagnostic row 94243, source 18638.0
            placeTimeScope: Regional species account published 2020; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
