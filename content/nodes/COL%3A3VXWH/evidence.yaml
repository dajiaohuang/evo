        usage:
          title: Lonchocarpus monofoliaris Schery, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Tree 5-13 m. high. Leaves 1-foliolate; petioles 8-9 mm. long; leaflets oblong- to oval-elliptic, 14-18 cm. long, 5.5-8 cm. wide, acute to subobtuse at the base, cau- date to a narrow blunt apex, subcoriaceous, glabrous, with about 12 prominent arcuate lateral veins beneath; petiolules 2-3 mm. long. Flowers with the calyx very shallowly cupulate to salverform, very shallowly dentate (except for the prominent lowermost tooth), 1.5 mm. long, strigillose; petals lilac to violet-blue; vexillum orbicular, subauriculate at the base, retuse and inflexed at the apex, 8-9.5 mm. long, sericeous without; wing petals narrowly oblong, subfalcate, conspicuously auriculate, the claw 3 mm. long, the blade 7 mm. long, with a broad, sericeous, median band without. Legumes stipitate, thin, compressed, broadly oblique-elliptic, 5-7 cm. long and 2.5-3 cm. wide (when 1-seeded), to oblong, 7-8.5 cm. long and 2.5 cm. wide (when 2-seeded), generally abruptly attentuate at both ends, subcoriaceous, pale green, glabrous or very sparsely strigose, prominently veined, the upper margin somewhat thickened and distinctly concave above the seeds.
          originalLanguage: en
          sourceField: general
