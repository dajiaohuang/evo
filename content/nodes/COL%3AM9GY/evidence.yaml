          originalSourceText: Shrub or small tree, 2-6 m. high, the branches finely appressed-pubescent; leaves alternate (those of the adjacent nodes similar or nearly so though quite unequal), finely serrulate or sometimes subentire, subcoriaceous, finely appressed- hispidulous above, usually appressed sericeo-pubescent on the nerves and veins beneath and puberulent in the areoles, the larger leaves oblong-lanceolate or elliptic- lanceolate 4-16 cm. long, 1.5-4.5 cm. wide, attenuate-acuminate, the petioles 1-2.5 cm. long, the smaller leaves similar though sometimes ovate, subsessile, and merely acute; plants dioecious, rarely monoecious, the clusters generally unisexual; staminate perianth 4-lobed; pistillate perianth attenuate at base, narrowly margined.
