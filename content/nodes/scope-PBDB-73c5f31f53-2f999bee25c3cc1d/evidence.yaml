  claim-rationales.zh:
    - 澄江螯肢干群检验标本的分类字段只陈述所引研究与导航范围；不会把矩阵位置、数据库映射或样本相似性改写为直系祖先。
    - 澄江螯肢干群检验标本的地理字段限于具名样本或明确模型范围，不外推为全球分布、起源中心或完整扩散路径。
    - 澄江螯肢干群检验标本的生态字段区分保存事实与功能推断；未被直接记录的饮食、行为、栖息地偏好和性能均保留不确定性。
    - 澄江螯肢干群检验标本的形态字段限于主研究列明的标本、样本或分析，并连接到精确页码、图版或补充材料。
    - 澄江螯肢干群检验标本的年代范围是有界的标本、地层或模型投影，不作为全球首现、末现、分化时间或连续谱系时长。
  claim-statements.zh:
    - 所引形态矩阵将 Urokodia aequalis 恢复在螯肢类干群中较接近冠群的位置；导航位置不表示直系祖先关系。
    - 本档案限于云南澄江材料，不能据此确立 Urokodia 的全球分布。
    - 附肢形态允许提出有边界的摄食和运动假说，但食物、运动性能及惯常行为并未保存。
    - 显微 CT 揭示了钳状的短大附肢和相互重叠的外叶瓣，并支持头部由七节构成的解释。
    - 519–518 Ma 包络是澄江样本区间，并非干群螯肢类的起源年代或该物种的全球延续时长。
