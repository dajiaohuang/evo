    facets:
      morphology:
        status: not-assessed
      lifeHistory:
        status: not-assessed
      ecology:
        status: partially-supported
        claims:
          - text: In an urban Prague sample of Eurasian magpies, ambient noise level did not significantly predict alert distance, while higher noise was associated with a lower adjusted flight-initiation-distance-to-alert-distance ratio. This is a bounded association in the study sample and is consistent with a slower escape response after threat detection; it does not show that noise caused the behavior.
            sourceIds:
              - abouzeid2024
            locator: Abstract; Methods §§2.1–2.2; Results, models of alert distance and adjusted flight-initiation-distance/alert-distance ratio.
            placeTimeScope: Public green spaces in Prague, Czech Republic, during one breeding season; the publication's analyzed sample was 167 birds (138 adults and 29 juveniles) at 11 sites after excluding single-observation sites. Exact calendar dates are not stated in the audited study record.
            lifeStatus: Free-living urban magpies observed while ground-foraging; researchers approached birds to measure alert and flight-initiation distances. No captive subjects were used.
            originalLanguage: en
        gaps:
          - The field association does not establish a causal effect of noise and may be affected by uncontrolled differences among sites or individuals.
          - A single city and breeding-season sample does not characterize rural populations, other seasons, population trends, survival, or reproductive effects.
          - Morphology, life history, evolution, complete distribution, fossils, and conservation remain unassessed; systematic search are incomplete.
      evolution:
        status: not-assessed
      distribution:
        status: not-assessed
      fossil:
        status: not-assessed
      conservation:
        status: not-assessed
