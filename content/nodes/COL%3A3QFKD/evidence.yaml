    facets:
      morphology:
        status: partially-supported
        claims:
          - text: "Plants mostly 160-300 mm high, stem unbranched, with short scale ± 1 mm long, inserted 12-30 mm below base of spike, sheathed basally by dry, brown cataphylls. Corm 10-12 mm diam., tunics of fine, soft to firm fibres extending upward as collar, bearing cormlets at base. Leaves 2, lower 1 with long sheath, ± lanceolate, blade 60-80 x (3-)5-8 mm, reaching up to middle of stem, leathery-succulent, main vein not raised when alive (visible as a pale line when held to light), slightly raised when dry, margins thickened, hyaline, transparent when alive, when dry raised above mesophyll and yellow, upper leaf largely sheathing, sometimes with short free blade similar to basal but 2-3 mm wide. Spike mostly 4-7-flowered, ± straight; bracts translucent pink with purple veins, 5-6 mm long, outer with 3 main veins terminating in acute teeth and 1 or 2 secondary veins along margins, inner 2-veined and acutely 2-toothed. Flowers rotate, upright, deep pink, darker toward tepal bases, rose-scented; perianth tube filiform, 5-6 mm long; tepals obovate, 12-14 x 5-7 mm. Stamens symmetrically arranged; filaments filiform, inserted at mouth of narrow part of tube, ± 1.5 mm long, deep pink (drying purple); anthers suborbicular, 2.0-2.5 mm long, yellow, thecae obtuse basally, dehiscing completely or almost so by narrow slits. Style dividing at base of filaments, style branches 3.8-4.0 mm long, deep pink (drying purple), ± straight, extending outward below anthers, expanded and bilobed at tips. Capsules globose, ± 4 mm diam. Flowering time: mostly late Aug. to mid-Nov. but Dec. and early Jan. in the Caledon Swartberg."
            textZh: Ixia bifolia Goldblatt & J.C.Manning 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_15933_0
            locator: "SANBI/WFO archive Morphology row 85209; source identifier 15933.0; cited publication: Goldblatt, P; Manning, JC. 2012. Systematics of the southern African genus Ixia (Iridaceae): 4. Revision of sect. Dichone. Bothalia 42(2): 87 - 110. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Ixia bifolia seems at first to belong in the I. micrandra-confusa complex, which also has very slender stems and small flowers but it stands out in the very short, leathery-succulent foliage leaf blade, up to 80 mm long and 5-7 mm wide. The leaf has a single, prominent vein and moderately thickened margins. The flowers seem most like those of I. confusa but the short, deep pink filaments ± 1.5 mm long and similarly deep pink, straight style branches ± 4 mm long (both drying purple) are quite different from I. confusa, which has white filaments 1.3-2.5 mm long and white, strongly falcate style branches 1-2 mm long. We suspect that I. bifolia may be more closely allied to I. trinervata, which has slightly larger flowers on longer spikes but also a single foliage leaf, this relatively broad and always with three prominent veins and margins not thickened. I. bifolia shares with other members of the I. micrandra complex the finely fibrous corm tunics that extend upward around the stem base. Stems are almost always unbranched and have an odd feature, a small, nearly microscopic, translucent scale and prophyll, ± 1 mm long, inserted 12-30 mm below the base of the spike. Stems of I. confusa may be branched and are normally taller than in I. bifolia but also have a translucent stem scale in populations from the Swartberg and sometimes elsewhere across its range. I. confusa has 3 or 4 linear leaves, usually ± 2 mm, but occasionally to 4 mm wide. With its narrow range and just two known populations, one small and near a major road, we suggest a conservation status of (VU), Vulnerable.
