    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Slender, erect perennial, 300-500 mm tall, from a woody base. Leaves mostly basal, ± oblong, coarsely and unevenly lobed, but never to midrib, appressed stellate-pubescent to glabrescent. Flowers in a much-branched inflorescence, 1 or paired in erect, terminal, leafless cymes, yellow to orange-red.
            sourceIds:
              - sanbi_14904_0
            locator: "SANBI/WFO archive Morphology row 35060; source 14904.0; publication: Snijman, DA. 2013. Malvaceae. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 416 - 420. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Closely related to H. paucifolia and differs mainly in the shape and lobing of the leaf and size of the flowers. In H. macra the flowers are small, the majority up to 6 mm long on dried specimens, whereas in H. paucifolia they are up to 10 mm long. The leaves in H. macra are more or less oblong, from narrowly to broadly so, and coarsely and unevenly lobed, rarely deeply lobed but not to the midrib, whereas in H. paucifolia the leaves are ovate and the lobing is usually to the midrib so that most of the lower leaves are palmatisect. Both these species are characterized by being fairly small, 30-50 cm tall, with several stems from a woody base and with leaves mostly basal and an inflorescence of practically leafless,' glabrous, racemose or paniculate cymes. The styles which cohere and persist, appear subclavate and this probably accounts for the unpublished specific name H. rhopalostylys. The name “macra”, the “Meagre Hermannia” was chosen instead when the species was published in 1919.
            textZh: SANBI 条目提供了该种的鉴别特征。
            sourceIds:
              - sanbi_815_0
            locator: "SANBI/WFO archive Diagnostic row 73190; source 815.0; publication: Verdoorn, IC. 1980. Revision of Hermannia subgenus Hermannia in southern Africa. Bothalia 13(1&2): 1 - 63. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
