        usage:
          title: Gonzalagunia rosea Standl., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Trees, small, to 5 m tall, or shrubs, the branchlets terete, stiff or flexuous, densely pubescent. Leaves oblong, ovate oblong or elliptic, 7-22 cm long, 2-8 cm wide, deltoid at the apex, often with an acumen to 1.5 cm long, basally cuneate or rounded, the costa prominulous above and beneath, the lateral veins 8-13, prominulous, arcuate, papyraceous, the hairs moderately dense, strigose or spreading, often farinose above (bases of deciduous hairs), usually densely golden villose beneath; petioles 0.5-2.0 cm long, 0.1-0.2 cm wide, pubescent; stipules oblong triangular or triangular, 8-10 mm long, acuminate, the acumen often 4 times the length of the body, keeled, golden pubescent. Inflorescences terminal, spiciform, 15-35 cm long, often nodding, to 5 cm wide, pubescent; peduncles to 4 cm long, to 0.18 cm wide, the cymules well spaced; bracts small. Flowers with the hypanthium obovoid, ca. 3 mm long, ca. 1.4 mm wide, villosulose, the ca- lycine cup ca. 1 mm long, petaloid, the teeth 4-5, triangular, ca. 0.6 mm long, with 2-4 subrotund glands at the junction of the lobes; corolla pink, the tube slender, ca. 8 mm long, ca. 1.6 mm wide in the middle, densely pubescent outside, densely appressed and white villose within, carnose, the lobes 5, 2 mm long, thick, the margins infolded, densely villose adaxially; stamens 4, the anthers oblong, ca. 2.5 mm long, ca. 0.25 mm wide, the filaments short, inserted 2/3 way up the tube; stigmas 4, unequal, subfalcately digitiform, 0.6-1.0 mm long, the style filamentous, ca. 9 mm long, the ovary 4-celled, thick-walled, the ovules numerous, rubescent. Fruits 4-coccous, 2-3 mm in diam., glabrate.
          originalLanguage: en
          sourceField: general
