    facets:
      morphology:
        status: partially-supported
        claims:
          - text: "Cormous geophyte, up to 0.2 m high. Stem erect, simple or with 1 or 2 branches. Leaves several, with blade linear-ensiform, (50-)100-180 mm long, acute. Flowers: in horizontal 2-5-flowered spikes; spikes 50-65 mm long; bracts 7-10(-12) mm long, dry-membranous, brown-veined, rust-tipped; inner bract ± 1 mm longer, acute; perianth with tube 36-44 mm long, curved towards apex of narrow basal part, inner segments 12-15 x 8-9 mm, ovate; outer segments up to 7 mm wide, white to cream-coloured with yellow markings on lower segments, purple lines in throat; Aug.-Oct."
            textZh: Freesia andersoniae L.Bolus 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_16273_0
            locator: "SANBI/WFO archive Morphology row 71611; source identifier 16273.0; cited publication: Retief, E; Meyer, NL. 2017. Iridaceae. In: E Retief & NL Meyer (eds), Plants of the Free State: Inventory and identification guide, Strelitzia 38: 934 - 956. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Freesia andersoniae has an erect, almost smooth stem and thin-textured, membranous or papery bracts, and large, fragrant white flowers, 50-60 mm long, marked with characteristic purple chevrons in the tepal sinuses.
            textZh: SANBI 条目提供了 Freesia andersoniae L.Bolus 的鉴别特征。
