        claims:
          - text: Branchlets, leaves, and panicles yellowish-tomentose; leaves petiolate; leaflets sessile, obovate-oblong or oblong, obtuse, mucronulate, wedge-shaped, reticulated and sub-glabrous above; panicles many-flowered, terminal, a little longer than the leaves. The whole plant is covered with a pale, golden down. Branches terete, striate branchlets angulate. Petiole 6 - 9 lines long, furrowed above. Leaflets with a prominent middle nerve on both sides; terminal inches long, 6 - 9 lines wide, the lateral ones smaller. Panicle compound; branches somewhat patent, the ultimate pedicels very short. Flowers imperfect in our specimens.
