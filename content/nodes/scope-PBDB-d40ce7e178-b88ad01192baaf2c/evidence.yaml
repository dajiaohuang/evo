  claim-rationales.zh:
    - 查恩伍德分叉水螅体化石的分类字段只陈述所引研究与导航范围；不会把矩阵位置、数据库映射或样本相似性改写为直系祖先。
    - 查恩伍德分叉水螅体化石的地理字段限于具名样本或明确模型范围，不外推为全球分布、起源中心或完整扩散路径。
    - 查恩伍德分叉水螅体化石的生态字段区分保存事实与功能推断；未被直接记录的饮食、行为、栖息地偏好和性能均保留不确定性。
    - 查恩伍德分叉水螅体化石的形态字段限于主研究列明的标本、样本或分析，并连接到精确页码、图版或补充材料。
    - 查恩伍德分叉水螅体化石的年代范围是有界的标本、地层或模型投影，不作为全球首现、末现、分化时间或连续谱系时长。
  claim-statements.zh:
    - 一项形态分析将 Auroralumina 置于冠群刺胞动物内部；本档案保留其假说性质，不据此提出祖先关系。
    - 本档案代表查恩伍德森林的一处含化石表面，不据此推断埃迪卡拉纪刺胞动物的全球分布。
    - 具触手的水螅体支持固着摄食的解释，但猎物、群体生理及生境偏好仍未被直接观察。
    - BGS GSM 105875 保存了两个呈分叉结构的水螅体样管、刚性有机骨骼，以及开口周围的触手印痕。
    - 562–557 Ma 区间是一件标本受限的 Bradgate 组地层背景，并非刺胞动物冠群年代或该类群的全球延限。
