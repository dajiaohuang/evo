        usage:
          title: Trattinnickia aspera (Standl.) Swart, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Trees, 15-50 m high, bark fragrant. Leaves scabrous, to perhaps 1.5 m long; petioles striate, canaliculate above, 8-29 cm long; leaflets 7-11(-19), ovate or ovate-lanceolate to oblong or elliptic, laterals slightly inequilateral, narrowly to broadly acuminate, cuneate to cordate basally, the margins repand to sinuous, chartaceous to coriaceous, scabridulous on.-both surfaces, sparingly hispidulous below, the veins more so, the lateral veins prominent below, 10-31 cm long and 4-12.5 cm wide, the middle pairs largest; petiolules hispidulous, the laterals 3-7 mm long, the terminals 29-46 mm long. Inflorescences axillary panicles, the peduncles and branchlets angled, striate, and sparsely hispidulous, 12-20 cm long in fruit. Flowers with the pedicels angled, hispidulous, 4-13 mm long in fruit, the androecium and gynoecium unknown. Fruits rhomboid, ridged, gla- brous, acute apically, green to greenish-brown, 9-12 mm long and 8-11 mm in diameter; pyrenes 2, separated by a thin line of mesocarp, 1-seeded.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 2833
