            locator: "SANBI/WFO archive Diagnostic row 104863; source 17947.0; publication: Powell, RF; Klak, C; Boatwright, JS; Magee, AR. 2017. A taxonomic revision of Schlechteranthus subgenus Microphyllus (Ruschieae; Aizoaceae). Syst. Bot. 42(4): 943 - 963. [DOI 10.1600/036364417X696429]. [All rights reserved]"
