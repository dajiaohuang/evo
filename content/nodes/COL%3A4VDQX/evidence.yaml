    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Succulent shrub, up to 100 mm tall, with stem internodes not visible. Leaves arranged in four distinct rows, boat-shaped, opposite pairs basally fused into a sheath for ± 3 mm, free parts 6-9 x 4-5 mm, 4-5 mm thick. Flowers solitary, bracteoles almost enclosing the stalk, highly connate, petals pinkish magenta. Fruit 7- or 8-locular, closing bodies oval, valve wings absent.
            sourceIds:
              - sanbi_14694_0
            locator: "SANBI/WFO archive Morphology row 33877; source 14694.0; publication: Klak, C. 2013. Aizoaceae: Octopoma. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 219 - 219. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: This species is easily distinguished by the decussate leaves stacked along the branch and the old blackened leaves that remain on the branch. However, it may be confused with S. tetrasepalus, which shares a compact habit and leaf pairs with a high degree of fusion. Schlechteranthus inclusus is, however, further distinguished by the short central primary axis which is equal in length to the length of the capsule, and the cup-shaped bracteoles (primary axis at least one and a half times longer than capsule, leaves crowded towards the tip of the branches, with old leaves falling off, and bracteoles not cup-shaped in S. tetrasepalus).
            textZh: SANBI 条目提供了该种的鉴别特征。
            sourceIds:
