          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Slender climbing vine; stems villous with ascending yellowish hairs, glabres- cent. Leaves pinnate trifoliolate, the leaflets ovate or elliptical, mostly 2-4 cm long, 1.3-2 cm wide, obtuse at both ends, mucronate, the costa prominent above with ca. 4 arcuate veins on each side, glabrate above, appressed pilose beneath; petiolules 1-1.5 mm long, drying dark, pubescent; rachis to 9 mm long; petiole often longer than the terminal leaflet; stipels to 1 mm long pilose, caducous; stipules pilose. Inflorescences axillary fascicles of 2-5 flowers; pedicels ca. 5 mm long, puberulent; bracteoles 1-2 mm long, subulate, pubescent. Flowers white, pink or purplish, calyx ca. 5 mm long, villous hispid with coarse hairs, divided about halfway, the teeth acuminate subulate; corolla pilose outside, the standard emarginate, about twice as long as the calyx. Fruit linear oblong, 2-3 cm long, ca. 3 mm wide, nearly straight, compressed, falsely septate between the seeds, the beak 1-2 mm long, nearly straight; seeds plump, rectangular, dull greenish, 3 mm long, the hilum circular, located on one edge.
          originalLanguage: en
          sourceField: general
