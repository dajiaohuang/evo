    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Tree, up to 4 m high. Leaflets dull, brownish olive-green, secondary venation dark and immersed in lamina. Drupes never verrucose.
            sourceIds:
              - sanbi_11118_0
            locator: "SANBI/WFO archive Morphology row 3298; source 11118.0; publication: Herman, PPJ; Retief, E. 1997. Plants of the northern provinces of South Africa: Keys and diagnostic characters. Strelitzia 6: 1 - 681. National Botanical Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: The typical morph (morph 1) is sometimes confused with R. lucida forma lucida. That species, however, has 2 or 3 lateral veins per cm and a globoid drupe. Morph 2 has slightly shorter leaflets and a more open divaricate habit. Morph 3 has narrower leaflets and slightly smaller drupes. It is somewhat similar to R. fastigata but the venation is clearly different. Morph 4 has shorter and wider leaflets with emarginate, rounded or occasionally crenulate apices. The leaflets are usually laccate. Morph 5 has wider leaflets, secondary veins slightly more prominent above and leaflets subcoriaceous. Morph 6 has widely obovate, coriaceous leaflets up to 30 mm wide, usually glutinous when young, often undulate. It forms large shrubs or small trees up to 7 m high. Leaves of R. pallens are often similar to those of the next species, R. undulata.
