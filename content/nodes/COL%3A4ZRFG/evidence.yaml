          title: Stellaria irazuensis Donn.Sm., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Herbaceous, mostly glabrous, much branching perennials, prostrate or spread- ing. Leaves glabrous, ovate to deltoid, apically attenuate, basally cordate, 10-20 mm. long, 5-15 mm. broad, the scantily villous petioles 5-15 mm. long. Flowers several in dichotomously branching cymes 10-25 cm. long, with minute bracts at the major dichotomies, the glandular-villous pedicels 5-10 mm. long. Sepals 4, narrowly ovate to elliptic, obtuse to acute, glabrous or glabrate, 1.5-2.5 mm. long; petals 4, deeply 2-cleft, the segments linear, 1.5-3.0 mm. long; stamens 4-6 (-8), the flattened filaments 1.5-2.5 mm. long; ovary sessile, ellipsoid; styles usually 2, ca. 1 mm. long, the 4-6 ovules campylotropous on basal placentae. Capsule flattened, ellipsoid, ca. 2 mm. long, the 2 valves emarginate; seeds 6 or less, ca. 1 mm. broad, cochleate, dark reddish brown, tuberculate.
          originalLanguage: en
          sourceField: general
