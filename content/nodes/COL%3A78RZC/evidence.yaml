          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Lianas, rarely shrub-like, glabrous. Leaves mostly oblong, sometimes oblong- obovate or lanceolate, mucronate, basally obtuse, to 10 cm long and 5 cm wide, glabrous, somewhat coriaceous; petioles 1-1.5(-2) cm long, mostly without glands in the axils. Inflorescences cymose, dichasial, reduced, 1-3(-4-5)- flowered, axillary to subterminal, the peduncles ca. 2-8 cm long, the bracts apparently absent. Flowers with the pedicels 5-17(-25) mm long; bracteoles minute, scarious; calyx-lobes ovate-oblong, 5-9 mm long; corolla white, some- times with a pinkish limb, the throat yellow, the tube proper ca. 15-20 mm
