    - subjectId: taxon:mysticeti
      claimKind: scientific
      claimType: topology
      statement: Mysticeti is treated as the baleen-whale branch of sampled Neoceti, with toothed stem forms and later baleen-bearing lineages documenting a mosaic rather than an instantaneous transformation or one direct ancestor.
      confidence: medium
      confidenceRationale: The systematic review integrates multiple fossil taxa and character transitions. The wording avoids equating a stem sample with the whole crown.
      referenceLinks:
        - relation: supports
          referenceId: uhen-2010-whale-origins
          pages: 212–219
          quoteLocator: Modern whales; Mysticeti fossil and anatomical synthesis
    - subjectId: taxon:mysticeti
      claimKind: scientific
      claimType: fossil-range
      statement: mysticeti is displayed at 34–0 Ma only as the review's sampled stem-to-living mysticete envelope, not an exact clade origin. The interval is a source-bounded sample window, not a global FAD, LAD, divergence date, continuous occupancy claim or direct-ancestor assertion.
      confidence: medium
      confidenceRationale: mysticeti uses Uhen, M.D. (2010) because the cited pages and locator expose the sampled taxon, specimen or living sequence set. Confidence is medium and applies only to Oligocene fossil evidence through living Mysticeti synthesized by Uhen; broader endpoints remain unclaimed.
      referenceLinks:
        - relation: supports
          referenceId: uhen-2010-whale-origins
          pages: 212–219
          quoteLocator: Modern whales; Mysticeti fossil and anatomical synthesis
        - relation: contextualizes
          referenceId: ics-2026-06
