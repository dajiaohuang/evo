          originalSourceText: Vine, herbaceous to suffrutescent, stems angular to terete, pubescent. Leaves trifoliolate, ovate to ovate rhomboid, 1.0-3.5 cm long, 1.0-2.3 cm wide, apically acute, basally obtuse, strigulose above, hirsutulose, gland dotted beneath, viscid on both surfaces; terminal petiolule ca. 1.0 cm long, the lateral petiolules obsolete or to 1.0 mm long; petiole ca. 1.3 cm long, viscid; stipels caducous; stipules lanceolate ca. 0.5 cm long. Inflorescence equal to or exceeding the leaves, ca. 2.0 cm long; peduncle ca. 1.0 cm long; bracts lanceolate 2.0-3.0 mm long, ca- ducous; pedicels ca. 0.4 cm long. Flowers with the calyx not exceeding the corolla, viscid, puberulent, ca. 0.4 cm long, the lobes 2.0-3.0 mm long, the upper lobes partially united; corolla purplish, to 6.5 mm long, the standard obovate, auriculate, gland dotted, ca. 5.0 mm long, ca. 3.5 mm wide, the claw ca. 1.0 mm long, the wings oblong, ca. 4.5 mm long, ca. 1.5 mm wide, the claw ca. 1.5 mm long, the keel falcate, ca. 4.5 mm long, ca. 2.0 mm wide, the claw ca. 2.0 mm long; stamens 4.5 mm long. Fruits oblong ovate, strigose, gland dotted, viscid, ca. 1.5 cm long, 0.6 cm wide, the beak ca. 3.0 mm long; seeds ovoid, ca. 4.0 mm long, hilum linear, 1.0-2.0 mm long.
