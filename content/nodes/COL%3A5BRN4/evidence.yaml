        usage:
          title: Voyria truncata (Standl.) Standl. & Steyerm., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Herb to 18 cm high; the stem erect, stout, simple to few-branched, glabrous. Scales dull red, thin-cartilaginous (when dry), the opposite scales connate for 1/2-2/3 their length at the base, the cauline scales broadly to very broadly ovate, obtuse to rounded apically, 3-5 mm long, minutely ciliolate along the margins, the upper cauline scales somewhat shorter to somewhat longer than the inter- nodes, the lower scales much shorter than the internodes. Flowers solitary, 5- merous, the pedicels thick, 4-9 mm long; calyx campanulate, 4.5-6 mm long, the lobes broadly ovate, obtuse apically, 1-3 mm long, minutely ciliolate along the margins; corolla pale yellow, cream-colored, bright pink, or purplish-laven- der, to 5.5 cm long, the tube cylindric, scarcely dilated at the throat, 3-4 cm long, inconspicuously puberulous without towards the apex, the lobes spread- ing, ovate, obtuse apically, 7-15 mm long, inconspicuously ciliolate along the margins, inconspicuously puberulous within especially towards the base; stamens inserted in the upper half of the corolla tube, ca. 3-7 mm below the throat, the filaments short, 0.5-1 mm long, the anthers coherent, broadly oblong to sub- globose, exappendiculate, to 1.3 mm long; gynoecium to 3.6 cm long, the ovary sessile, oblong, truncate apically, to 8-9 mm long, glabrous, eglandular, the style filiform, to 2.7 mm long, the stigma capitate-peltate, the margins sinuate. Capsule to 1.5 cm long and 5 mm in diameter; seeds wingless.
          originalLanguage: en
          sourceField: general
