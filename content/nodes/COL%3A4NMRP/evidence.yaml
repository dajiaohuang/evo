        usage:
          title: Pseuderanthemum standleyi Leonard, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Herbs to 40 cm tall; stems terete, puberulous along 2 lines. Leaves ovate lanceolate, to 8 cm long, 3 cm wide, apically acuminate, basally attenuate, gla- brous to sparingly strigose above, puberulous beneath mostly at the costa and the veins, the cystoliths dense, moderately prominent on both the surfaces, the margins undulate; petioles short, 1-3 mm long, puberulous. Inflorescences in terminal spicate panicles and in axillary spikes, the spikes lax to 9 cm long, the rachises glandular puberulous; bracts and bracteoles subulate, to ca. 3 mm long, 0.5 mm wide basally, glandular puberulous; pedicels mostly borne singly or in clusters of 2, alternate on the rachis. Flowers with the calyx 5-merous, segments narrowly subulate, to 5 mm long, 0.5 mm wide, glandular puberulous; corolla purplish, sparingly and minutely puberulous, the tube ca. 15 mm long, 1 mm in diameter, lobes of the limb elliptic, ca. 7 mm long, 3.5 mm wide, apically obtuse; stamens included, the staminodes slightly longer than the filaments. Cap- sules ca. 15 mm long, 2.5 mm wide, 2 mm thick, glabrous; seeds 4, oblique, flat- tened, 3 mm long, 2 mm wide, roughened.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 257
