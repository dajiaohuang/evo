        usage:
          title: Physalis cordata Mill., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Erect or sprawling short-lived herb to 80 cm tall; stems glabrate with some minute, antrorsely curved hairs often present. Leaves to 8 cm long, broadly ovate or elliptic, apically acuminate, basally rounded or truncate, the margins shallowly toothed, glabrate with some puberulence along the veins; petioles slender, 3-9 cm long, mostly shorter than the leaves; minor leaves present. Pedicels slender, minutely puberulent, about as long as the flowering calyx. Flowers with the calyx 3-6 mm long, 2-3 mm in diameter at the base of the lobes, the mouth of the tube sometimes contracted, glabrous except on the angles, the lobes narrowly deltoid, slightly longer than the tube, soon after flowering becoming 2-3 times as long as the tube; corolla with a contrasting pubescent eye, 5-10 mm long; filaments pubescent, the anthers bluish, 1.8-3 mm long. Fruits on slender pedicels not exceeding the calyx; fruiting calyx 5-angled, 25-30 (-45) mm long, glabrous, the lobes not exceeding 10 mm long; berry globose, 7-15 mm across.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 13166
