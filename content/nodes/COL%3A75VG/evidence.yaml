        metadataVariant: 0
        usage:
          scope:
            en: Examines winter 2009 diet and stable isotopes at Bird Island, South Georgia, during unusually warm conditions. Stomach contents were obtained from 55 birds; 43 samples with food residue informed diet comparisons. Findings are one colony-season result, not a general species diet or mortality cause.
            zh: 研究南乔治亚岛 Bird Island 在 2009 年异常偏暖冬季的食性与稳定同位素。共取得 55 只个体的胃含物，其中 43 份含有可分析食物残留并用于食性比较。结论仅适用于一个繁殖地和一个季节，不代表普遍食谱，也未确定死亡原因。
          license: CC BY 4.0
          licenseEvidenceLocator: Article copyright and licence statement specifies Creative Commons Attribution 4.0 International.
          licenseAppliesTo: Article text; no figures or third-party materials are reused.
          licenseUrl: https://creativecommons.org/licenses/by/4.0/
          licenseAssessment: item-level-verified
          attribution: Xavier, J. C. et al. (2017), Sexual and individual foraging segregation in Gentoo penguins Pygoscelis papua from the Southern Ocean during an abnormal winter, https://doi.org/10.1371/journal.pone.0174850
      - id: chinstrapGlobal2020
