        claims:
          - text: Climbing herb; stems pubescent; tendrils present. Leaves 3-5-foliolate; petioles 3.5(5) cm long, pubescent; leaflet-lamina up to 10 x 6 cm, elliptic to obovate or rarely broadly obovate, apex obtuse or acute, margin crenate or serrate-crenate, base cuneate, sparsely pubescent or glabrescent above, grey-tomentose below; petiolule of central leaflet up to 1 cm long, petiolules of lateral leaflets 0-2.5 mm long; stipules up to c. 7 mm long, ovate-falcate, densely pubescent outside. Cymes on short side-branches, lax, trichotomous; peduncle up to 7 cm long, densely grey-pubescent; pedicels up to 3.5 mm long, grey-tomentose or densely pubescent; bracts and bracteoles c. 2 mm long, subulate, pubescent. Flower-bud c. 3 mm long, oblong-cylindric, ± constricted near the middle, densely pubescent. Calyx 0.5 mm long, subentire, densely pubescent. Petals yellowish. Ovary pubescent; style up to 3 mm long, apex minutely 2-fid. Fruit (immature) c. 6 x 5 mm, densely pubescent.
