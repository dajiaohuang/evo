  claims:
    - subjectId: taxon:shenacanthus
      claimType: taxonomy
      claimKind: scientific
      statement: Shenacanthus vermiformis is known from the sole near-complete holotype IVPP V300000 and was placed within total-group Chondrichthyes, with exact stem position analysis-sensitive.
      confidence: medium
      confidenceRationale: "Shenacanthus vermiformis: Named material and a published systematic or phylogenetic treatment support this bounded identification. Confidence remains medium because the profile does not turn a sampled placement into direct ancestry or universal consensus."
