    - subjectId: taxon:shenacanthus
      claimType: biogeography
      claimKind: scientific
      statement: IVPP V300000 comes from the Telychian Huixingshao Formation at Yongdong, Xiushan, Chongqing, China; no wider distribution is inferred.
      confidence: medium
      confidenceRationale: "Shenacanthus vermiformis: The primary study reports the named locality and horizon directly. Confidence is medium because one study sample cannot establish absence, endemism or a global geographic range."
      referenceLinks:
        - referenceId: zhu-2022-chongqing-gnathostomes
          relation: supports
          pages: 954–958, especially 956–958
          figure: Figures 1a and 3; Extended Data Figure 8
          quoteLocator: Systematic palaeontology and description of Shenacanthus; phylogenetic analyses
    - subjectId: taxon:shenacanthus
      claimType: ecology
      claimKind: scientific
      statement: The body is aquatic in form, but the sole fossil does not directly establish diet, habitat preference, swimming performance or feeding guild.
      confidence: medium
      confidenceRationale: "Shenacanthus vermiformis: The evidence boundary is explicit: depositional or anatomical context is retained while unsupported behaviour and niche claims are withheld. Medium confidence applies to that bounded negative statement, not to a reconstructed ecology."
      referenceLinks:
        - referenceId: zhu-2022-chongqing-gnathostomes
          relation: supports
          pages: 954–958, especially 956–958
          figure: Figures 1a and 3; Extended Data Figure 8
          quoteLocator: Systematic palaeontology and description of Shenacanthus; phylogenetic analyses
    - subjectId: taxon:shenacanthus
      claimType: morphology
      claimKind: scientific
      statement: IVPP V300000 combines minute scales and a chondrichthyan-like posterior branchial region with unexpectedly large thoracic armour plates.
      confidence: medium
      confidenceRationale: "Shenacanthus vermiformis: The cited figures and descriptions directly document the named anatomical observations. Confidence is medium rather than universal because preservation and specimen sampling limit character completeness and variation."
      referenceLinks:
