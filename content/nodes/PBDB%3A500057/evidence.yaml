  claim-rationales.zh:
    - Shenacanthus vermiformis：具名材料和已发表的系统或系统发育处理支持这一有限鉴定。置信度保持中等，因为画像不会把取样位置转化为直接祖先或普遍共识。
    - Shenacanthus vermiformis：一手研究直接报告了具名地点与层位。置信度为中等，因为单一研究样本不能确定缺失、特有性或全球地理范围。
    - Shenacanthus vermiformis：证据边界是明确的：保留沉积或解剖背景，同时不填补无依据的行为与生态位。中等置信度针对这一有限的否定性陈述，而非重建生态。
    - Shenacanthus vermiformis：所引图件与描述直接记录了具名解剖观察。由于保存与标本取样限制了性状完整性和变异，置信度为中等而非普遍结论。
    - Shenacanthus vermiformis：一手来源与具体定位符支持显示的样本区间。置信度为中等，因为该包络明确限定于标本或地点，而非全球首现或末现。
  claim-statements.zh:
    - Shenacanthus vermiformis 仅由近完整正模 IVPP V300000 所知，在分析中归入软骨鱼总群，具体干群位置受分析影响。
    - IVPP V300000 来自中国重庆秀山永东特列奇期 Huixingshao 组；不据此推断更广分布。
    - 躯体呈水生形态，但单件化石不能直接确定食性、栖息地偏好、游泳性能或取食行会。
    - IVPP V300000 将微小鳞片和软骨鱼式后鳃区与异常大型胸甲板组合在同一躯体中。
    - 显示的约 436 Ma 时间点代表 Huixingshao 组正模，并非软骨鱼总群或冠群的全球首现。
