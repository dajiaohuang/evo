    - subjectId: taxon:parioscorpio
      claimKind: scientific
      claimType: fossil-range
      statement: Parioscorpio venator is documented from the Silurian Waukesha Lagerstatte in Wisconsin, including holotype UWGM 2162 and paratype UWGM 2163. Its 2021 redescription rejected the scorpion interpretation while leaving exact arthropod affinities unresolved; this occurrence does not date scorpion origins.
      confidence: medium
      confidenceRationale: The named fossils establish a local occurrence. The original scorpion interpretation was rejected in a subsequent redescription; exact arthropod placement remains unresolved, so the occurrence is not a scorpion-origin calibration.
      referenceLinks:
        - referenceId: wendruff-2020-parioscorpio
          relation: supports
          pages: "14"
          figure: Figures 1–4; Supplementary Figures
          quoteLocator: UWGM 2162 and 2163; specimen locality and original description
        - referenceId: anderson-2021-parioscorpio-reassessment
          relation: supports
          quoteLocator: Redescription and phylogenetic conclusions; alternative character codings archived with the study
