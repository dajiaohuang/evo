  claim-statements.zh:
    - Parioscorpio venator 见于威斯康星州志留纪沃基肖化石库，包括正模 UWGM 2162 和副模 UWGM 2163。2021 年重新描述否定了蝎类解释，但其在节肢动物中的确切亲缘位置仍未确定；这一产出不能用于蝎类起源定年。
