    - subjectId: event:early-triassic-triadobatrachus-ct
      claimKind: scientific
      claimType: morphology
      statement: μCT of the unique split-nodule holotype MNHN.F.MAE.126 reveals a stem-salientian body with fifteen presacrals, caudal vertebrae and possible mentomeckelians; it records an early frog-lineage mosaic, not crown Anura or specialized jumping.
      confidence: medium
      confidenceRationale: The unique holotype was scanned and redescribed in detail; medium confidence preserves uncertain provenance, damaged anatomy and character interpretations.
