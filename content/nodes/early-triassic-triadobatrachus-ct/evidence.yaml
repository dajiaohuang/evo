  claim-statements.zh:
    - 对唯一分裂结核正模 MNHN.F.MAE.126 的微型 CT 显示十五枚荐前椎、尾椎及可能的麦氏软骨，记录了蛙类谱系早期镶嵌体制，而非冠群无尾目或特化跳跃。
