        usage:
          title: Inga multijuga Benth., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Tree to several m., the branchlets densely ferruginous-tomentulose. Leaves large, with a variable number of leaflets (5-10 pairs, fide N. Am. Fl.), 6-9 pairs in Panamanian specimens seen; petiole less than 2 cm. long, essentially terete, tomentulose like the branchlets; rachis up to 2 dm. long, similar to the petiole, not winged, bearing a sessile, cupuliform gland 1-2 mm. in diameter between insertion of the petiolules; leaflets few to several pairs, oblong or elliptic to occasionally ovate-lanceolate, mostly about 10 cm. long and 3-4 cm. broad in the terminal leaflets, 1,2 or less this size in the lowermost leaflets, acute or short-acuminate apically, rounded or obtuse and somewhat inequilateral basally, lightly strigose- puberulent or subglabrate above, rather densely pubescent and paler below; stipules apparently ovate, about 2 mm. long, caducous. Inflorescence of pedunculate spikes up to 6 cm. long, solitary, geminate or fasciculate from the axils of the leaves, the floriferous portion scarcely 2 cm. long; bracts ovate, very small, ferruginous- tomentose like the axis. Flowers congested, spicate on the axis, whitish; calyx tubular, up to 12 mm. long (reported as short as 5 mm. in Guatemalan and Costa Rican specimens), usually cleft on one side for as much as 1/3 its length, puberulent or tomentulose without, the teeth minute; corolla elongate, tubular, 20-25 mm. long, appressed-villous without, the lobes about 2 mm. long; stamens many, almost 4 cm. long, united below into a tube about equalling the corolla; style somewhat exceeding the stamens, the stigma expanded. Legume variously reported glabrous or tomentulose?, flat or subterete?, up to 25 cm. long and 1 cm. wide?, the valves expanded and costate at the edges.
          originalLanguage: en
          sourceField: general
