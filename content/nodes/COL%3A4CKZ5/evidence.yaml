          attribution: Mir ZR, Pebsworth P, Hardman J, Ala'amri S, Alahmari A, Almalki K, Boug A. (2026). Effects of urban association on the movement ecology of hamadryas baboons (Papio hamadryas) in Saudi Arabia. PLOS ONE 21(7):e0354133. https://doi.org/10.1371/journal.pone.0354133. Findings paraphrased.
    facets:
      morphology:
        status: not-assessed
      lifeHistory:
        status: not-assessed
      ecology:
        status: partially-supported
        claims:
          - text: In one GPS study in southwestern Saudi Arabia, minimum daily path lengths for nine successfully tracked adult-male troop representatives differed among natural, semi-natural, and urban categories (Kruskal-Wallis chi-squared = 235.91, df = 2, p < 0.0001; all pairwise comparisons p < 0.001). The result describes the study's collared males and does not establish a causal habitat effect or a species-wide movement pattern.
            sourceIds:
              - mir2026papio
            locator: Methods, Data collection and Minimum daily path lengths; Results, Daily path lengths (publisher article lines 279-293), including the Kruskal-Wallis and Bonferroni-corrected pairwise tests.
            placeTimeScope: Ten adult males were collared across ten locations in five regions of southwestern Saudi Arabia in August 2022; one collar malfunctioned after six days and was excluded. The remaining nine collars recorded 13,962 GPS locations and operated for an average of 256 days through May 2023.
            lifeStatus: Free-ranging adult males captured, collared, and released with their troops; females, juveniles, captive populations, and fossils were not assessed.
            originalLanguage: en
        gaps:
          - The movement comparison represents nine adult males, with one collared male serving as the representative for each troop; it does not measure all troop members independently.
          - Habitat category was observational and group size was not included as a predictor, so the reported differences do not establish causal effects of urbanization.
          - Morphology, life history, other ecology, evolution, distribution, fossils, conservation, systematic search, remain unassessed.
      evolution:
        status: not-assessed
      distribution:
        status: not-assessed
      fossil:
        status: not-assessed
      conservation:
        status: not-assessed
