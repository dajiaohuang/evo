          - text: "A. hirsutus is an erect foxtail, with straight stems: the tubers are ellipsoid; the main stem is covered in white hairs; the spines are densely hairy; the leaf scales are glabrous with entire margins: the pedicel is hairy and is articulated in the top half; and the tepals have a ridge of hairs along the median stripe."
