          originalSourceText: Lianas; stems woody, branched, striate or angular, glabrous. Leaves ovate, subtrilobate, subentire, 3 (-5)-lobed, to 3-parted, 2.5-18 cm long, usually basally cordate but variable, acute to acuminate apically, glabrous or pubescent near the base. Flowers in 10-70-flowered cymes with few open at a time; sepals ovate to elliptic, 2.5-5 mm long, the outer sepals with a subterminal arista 2-5 mm long, glabrous; corollas yellow or violet or yellow with purple or violet markings 2.7- 3.5 cm long with a 10-15-mm-long tube, 4-4.5 mm in diameter, the limb cam- panulate. Fruits capsular, subglobose, 7-9 mm in diameter; seeds black, pyriform, with yellowish patches of short trichomes.
