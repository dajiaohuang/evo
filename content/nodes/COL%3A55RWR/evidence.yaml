        usage:
          title: Tetrapterys seemannii Triana & Planch., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Liana or scandent shrub, the stems slender, sparsely pubescent with T-shaped trichomes when young, soon glabrous, bearing interpetiolar ridges at least when young. Leaves thin, elliptic to oblong-elliptic or ovate-elliptic, shortly acuminate to acute at the apex the acumen downturned, mostly acute to obtuse, or some- times rounded at the base, 5.5-13.0(-16.0) cm long, 2-7 cm wide, glabrous above, glabrous beneath except the midrib at least sometimes sericeous when young, both surfaces with scattered glands, less than 0.5 mm in diam.; major lateral veins 4-7 per side; petioles 5-11 mm long, glabrous. Panicles terminal and upper ax- illary, usually exceeding the leaves; branches, peduncles, and pedicels sericeous, soon glabrate; bracts inconspicuous, oval to elliptic, appressed-pubescent, es- pecially near the base, 5-20 mm long; peduncles 2-5 mm long; pedicels slender, 2-5 mm long; sepals narrowly ovate, obtuse, 2.5-3.0 mm long, glabrous except for ciliate margin. Flowers with the calycine glands thick, shiny, 2.0-2.5 mm long; petals clawed, yellow, probably turning orange in age, glabrous, the blade obovate to oblong-elliptic, sagittate at the base, 4.0-5.5 mm long, 2.6-4.0 mm wide, the margin entire, the medial vein thickened toward the base, the claw thick, 1.5-2.0 mm long; anthers elliptic, glabrous, 1.0-1.2 mm long; styles held ca. 1.5 mm above the sepals, slightly longer than the stamens. Samaras stramin- eous to brown, glabrous or nearly so, the wings thin but rigid, the veins often conspicuous, the superior wing narrowly spatulate, 15-30 mm long, 6-10 mm wide, the inferior wing ovate to obovate or rarely spatulate-oblong, 6-9 mm long, 4-6 mm wide, the adjacent margins of the superior and inferior wings confluent and continuous at the base, the dorsal wing semi-orbicular, rigid, 2-4 mm high, the appendages usually lacking between dorsal and lateral wings; body glabrous, ca. 6 mm diam.
          originalLanguage: en
          sourceField: general
