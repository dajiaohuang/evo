        claims:
          - text: Acaulescent or short-stemmed, succulent perennial, simple or occasionally branched. Leaves deep green to yellowish green, with copious white, subtuberculate and subspinulescent spots, narrowly deltoid, acuminate, to 50 cm long; margin cartilaginous, armed with firm, white teeth. Inflorescence simple, 45-50 cm high, erect, with capitate, somewhat corymbose, dense racemes. Flowers salmon-pink, ± 38 mm long; stamens and stigma exserted.
