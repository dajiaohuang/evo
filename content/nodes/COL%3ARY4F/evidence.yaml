          title: Cavendishia pseudostenophylla Luteyn, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Epiphytic liana, mature branches terete, minutely striate, puberulent brown when dry; bark reddish brown; immature branches and twigs of the new growth subterete to bluntly angled, minutely striate, puberulent, brown. Leaves linear lanceolate to linear elliptic, 9-14 cm long, 1-1.5 cm wide, basally broadly obtuse or rounded, slightly cordate, apically long attenuate, acute, olive green above and reddish brown beneath when dry, glabrous, the margins strongly revolute; 3 (-5) -plinerved, the midrib deeply impressed above, raised and conspicuous beneath, the lateral nerves and the veinlets raised and conspicuous above, slightly raised but obscure beneath; petioles subterete, rugose, 2-3.5 mm long, 1-2 mm in diameter, densely puberulent, dark brown. Inflorescence viscid, 12-20-flowered, the lowest nodes sterile; rachis long tapering, bluntly angled, minutely striate, glabrous, 5-15 cm long, ca. 1-1.5 mm in diameter, a few globular glands scattered along the rachis; floral bracts prominently veined, often somewhat ribbed, short ciliate apically, oblong or oval elliptic, basally narrowed and rounded, apically rounded or acute, (13-)19-27 mm long, (5-)7-11 mm wide, pink, the margins with sessile, globular glands to 0.2 mm in diameter, (3-)7-12 per side; pedicels subterete, to 8 mm long and 1 mm in diameter, glabrous, with a few globular glands; bracteoles oblong, oblong elliptic or oblanceolate, ca. 25 mm long, 10 mm broad at anthesis, basally rounded, apically broadly rounded, glabrous or marginally short ciliate, located ca. 1 mm below the junc- tion of the pedicel and the calyx, completely enveloping the flowers in bud, clasping the calyx and the corolla at anthesis, with up to 15 globular marginal glands. Flowers with the calyx glabrous, 6.5-7.5 mm long, the tube 1.5-2 mm long, 3.5 mm in diameter, cylindric, slightly rugose, basally slightly expanded, globular glands located around margins of the basal expansion and on the tube, the limb campanulate or erect spreading, smooth or slightly ribbed, 5-6 mm long, the lobes triangular, the margins conspicuously glandular callose thickened, the thickenings nearly contiguous at the apex of the lobe, the sinuses obtuse or rounded; corolla ca. 32 mm long, 6 mm in diameter, pink, densely short pilose in the distal %/3, the lobes triangular, ca. 2 mm long; stamens 27-28 mm long, the filaments short pilose in the distal 1/2, alternately 4-4.5 mm and 7.5-8 mm long, the anthers including the tubules alternately ca. 24-24.5 mm and 20 mm long, the thecae 6-7 mm long; style 31-33 mm long. Berry not seen.
