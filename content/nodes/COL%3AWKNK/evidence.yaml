          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Prostrate herbs, the nodes well spaced. Leaves ovate, ovate rhomboid, rarely oblong or reniform ovate, (2-)3.0-6.5 cm long, 1.5-5.0 cm wide, widely deltoid to obtuse at the apex, widely triangular to truncate at the base, usually slightly inequilateral, densely pubescent or with a few elongate hairs above, these golden and bulbous at the base, hirsute beneath, the hairs often elongate and stiff as well as short and soft, the hairs sometimes restricted to the margins of the blade; petioles to 2 cm long; stipules subulate, 3-6 mm long (Standley & Williams 1975). Inflorescences pedunculate, the peduncles 1-4 cm long, slender, glabrescent, often bearded. Flowers with the calycine lobes 4, linear lanceolate, 3-6 mm long, densely hirsute; corolla to 11 mm long. Fruits 2-4 per cluster, ovate, to 2 cm long, densely hairy or with a few hairs, often delicately lenticellate.
