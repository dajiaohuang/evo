        claims:
          - text: Cormous geophyte, 15-40 cm. Leaves sword-shaped. Flowers shades of turquoise to purple, rarely whitish, with blackish centre, tube filiform, filaments united, black; bracts with prominent dark brown cusps.
            textZh: Ixia monadelpha D.Delaroche 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 7121; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: A striking species, Ixia monadelpha has grey-blue to light purple or even pink flowers (rarely white to grey-yellow), dark purple, iridescent green to almost black in the centre edged with a light brown to green halo. The stamens are also darkly coloured and even the pollen is blue to grey. The species was named for the united filaments, sometimes for only half their length, unusual in the genus, and even the anthers are erect and contiguous. The pale floral bracts are minutely speckled brown or red distally but are distinctive in the somewhat thickened, twisted, almost black cusps, the outer with the central cusp more prominent than the laterals. Added to these unusual features are a perianth tube 10-18 mm long and a stem usually bearing two or more branches held at right angles to the main axis and curving upward distally. Ixia monadelpha has often been associated with orange-flowered I. curta, which also has united filaments, contiguous anthers and an unusually long perianth tube, and the two have at times been treated as a single species. The two may well be closely related but can be separated not only by flower colour, but I. curta has corm tunics of fine, soft fibres, a markedly thicker perianth tube and the stem is rarely branched.
            textZh: SANBI 条目提供了 Ixia monadelpha D.Delaroche 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 95054; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
