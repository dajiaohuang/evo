          originalSourceText: Scandent shrubs or woody vines; branches terete, softly pilose. Leaves oval, oblong-ovate or ovate, obtuse to rounded, sometimes emarginate apically, broadly rounded or truncate basally, 3.5-9.5 cm long, 2-3.5(-4) cm wide, chartaceous, veins densely reticulate and prominulous on both sides, somewhat shining, sparse- ly pilose (usually more densely on margin) or glabrescent above, softly and densely velvety-pilose beneath, especially along the veins; petioles pilose, 2-4 mm long. Racemes loose or somewhat dense, terminal; peduncles 1 cm or less long, the axis 2.2-5 cm long, pilose; bracts lanceolate, acute to acuminate, pilose, decid- uous, 1.8-2 mm long. Flowers pink; pedicels short-pilose, 5-8 mm long; outer sepals oval, rarely suborbicular, rounded, densely pilose on the outside except near the ciliate margin, the largest 3.5-5 mm long, the smaller two 2.6-4 mm long; wings suborbicular, broadly rounded apically, usually emarginate, short- clawed basally, the margin ciliate, the outside pubescent (including the claw), 9-12 mm long, 6-9 mm wide; upper petals obovate or obovate-spatulate, rounded,
