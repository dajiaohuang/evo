        usage:
          title: Bunchosia dwyeri Cuatrec. & Croat, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrub or small tree, 1.5-15.0 m tall; trunks 8-20 cm d.b.h; stems sparsely to densely pubescent with sessile or short stalked, T-shaped, whitish trichomes, soon glabrous or nearly so. Leaves opposite, broadly ellipsoid to obovate, mod- erately thick, acuminate to short acuminate at the apex, obtuse to rounded or subcordate at the base, 7-32 cm long, 3.5-19.0 cm wide, glabrous or sparsely pubescent above, sometimes only on the major veins, the trichomes almost ses- sile, sparsely to moderately pubescent beneath, beneath with a pair of platter- shaped glands along the midrib near the base, sparsely pubescent, the trichomes 1.5 mm long, straight, subappressed, usually with a very short stalk; primary lateral veins 6-11 on each side, secondary veins moderately prominent; petioles 2-15 mm long, coarsely appressed-pubescent; stipules thickened, deltoid, to 5 mm long, pubescent. Inflorescences axillary pseudoracemes, 5-15-flowered, 4- 11 cm long; rachis appressed to somewhat patulous pubescent; bracts narrowly deltoid, 2.0-2.5 mm long, villous outside, glabrous within; bracteoles similar, slightly smaller, one of them with a depressed globose gland ca. 1 mm in diameter at the base; peduncles 1.5-2.4 mm long; pedicels 4-8 mm long. Flowers 14-18 mm wide; calyx glands 8, 2.5-3.5 mm long, oblong; sepals rounded at the apex, sparsely appressed-pubescent on the outer surface, conspicuously ciliate, 2-4 mm long; petals yellow, clawed, the limb subrounded, ca. 8 mm in diameter, the margins erose, interior petal somewhat smaller, the margin both erose and glan- dular; stamens ca. 4 mm long, somewhat unequal, the filaments glabrous, flat- tened, united in at least the basal 1/4, the anthers ca. 1 mm long, cordate to sagittate at the base, the connective thickened, more or less hemispherical; style about as long as the longer stamens, villous, much thickened at the apex. Fruits subglobose to ovoid, 1.5-2.0 cm long, red-orange to orange or red.
          originalLanguage: en
          sourceField: general
