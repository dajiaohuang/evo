        claims:
          - text: Coarsely velvety, erect, twiggy shrub to 1.2 m. Leaves densely hairy, oblong to cuneate, subsessile, often scarcely toothed above, stipules and bracts attenuate. Flowers in small, terminal clusters, yellow or orange, calyx golden-velvety.
            sourceIds:
