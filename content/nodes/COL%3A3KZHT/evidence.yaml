            locator: "SANBI/WFO archive Morphology row 8414; source 14353.0; publication: Manning, JC; Goldblatt, P. 2012. Malvaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 613 - 621. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Differs from the closely related and variable species H. salviifolia in that the calyx is not diaphonous nor urceolate. Characterized by the tufted, shiny hairs which give the vegetative parts a golden yellow hue, the subcoriaceous, strongly ribbed, thickly stellate- pubescent calyx and the petals which are dorsally, finely stellate-pubescent. Among the tufted hairs on the leaves and calyx are scattered minute pustules or glands that give the appearance of minute holes. This feature is shown very clearly as black dots on the plate in Cav., Diss. The leaves vary considerably in shape, occurring in at least two distinct shapes. The bracts are usually half as long to longer than the calyx.
            textZh: SANBI 条目提供了该种的鉴别特征。
