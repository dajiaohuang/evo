          originalSourceText: A glabrous shrub, 2-3 m. tall, or small tree up to 8 m., branches somewhat nodose, with moderate internodes; leaves elliptic-ovate, 9-15 or 18 cm. wide X 15-35 cm. long, apex acute, base acute or obtusish, usually subequilateral, pinnately nerved throughout, the nerves 10-16 on each side, not strongly curved upward, densely ciliate, strongly glandular-dotted, drying membranous, translucent; petiole 5-10 mm. long or up to 4 cm. on lower leaves; spikes when young 3 mm. thick X 4-5 cm. long, becoming 1-1.5 cm. X 8-12 cm. when mature; peduncle 1-2 or 3 cm. long; bracts sublunate-triangular-subpeltate, marginally yellow-fringed; fruit oblong, compressed-angular, truncate; stigmas sessile.
