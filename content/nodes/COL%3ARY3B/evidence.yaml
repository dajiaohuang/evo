        usage:
          title: Cavendishia megabracteata Luteyn, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Terrestrial or epiphytic shrubs to 2.5 m tall, stem base to 5 cm in diameter; mature branches terete, minutely striate, glabrous; bark brown, drying grayish to reddish brown; immature branches and twigs of the new growth terete to bluntly angled, striate, glabrous, reddish brown when dry. Leaves ovate, lanceo- late, lance elliptic or oblong, (4-) 8-12 (-15) cm long, (1-) 2.5-7 cm wide, basally obtuse, rounded to truncate, apically acuminate, often abruptly so, dark olive to grayish brown when dry, usually puberulous at the base of the midrib and the lateral nerves on the upper surface; 5-7-plinerved, the midrib and the inner lateral nerves moderately or weakly impressed above but sometimes plane or raised distally, the outer lateral nerves and the veinlets raised and usually con- spicuous above, rarely impressed, all the nerves raised beneath but the veinlets often obscure; petioles subterete, often flattened adaxially, rugose, rarely striate, 4-10(-13) mm long, 1-2.5(-3) mm in diameter, glabrous to densely puberulent adaxially when young, often glabrate and reddish brown at maturity. In- florescence (2-)5-9(-12)-flowered, often lowest one or two nodes sterile, obconic to spherical in bud; rachis coarsely and bluntly angled, striate, glabrous, (0.6-)0.8(-3.5) cm long, ca. 2 mm in diameter, cream colored and often suf- fused with pink when fresh, rarely with a few clavate glands or cartilaginous teeth at the base; floral bracts often translucent when dry, glabrous, smooth with minute, red, clavate, glandular fimbriae abaxially, oblong, obovate or rarely subrotund, basally narrowed and somewhat clasping, apically rounded, usually deeply emarginate (2-)3-6(-7) cm long, (1-)1.5-2.5(-4.5) cm wide, pale purplish to bright rose or dark pink when fresh; pedicels swollen distally, striate, glabrous, (8-)10-16(-19) mm long, (0.5-)1(-1.5) mm in diameter, cream colored and often suffused with pink when fresh, rarely weakly glandular at the distal end; bracteoles with or without prominent midrib, ovate, lanceolate, lance elliptic or nearly linear, 1.5-2(-5) mm long, 0.5-1.5(A) mm wide, apically callose thick- ened; calyx glabrous, 7-11(-13) mm long, cream colored and often suffused with pink, the tube cylindric, ribbed, 2-5 mm long, 3-5 mm in diameter at the base, basally enlarged and deeply lobed, the lobes straight to flaring outward and ex- tending well below articulation, the limb cylindric to slightly spreading, smooth or minutely papillate, (4-)5-7.5(-9) mm long including the lobes, the lobes triangular, (1-)1.5-2(-2.5) mm long, erect after anthesis, the tips completely glandular callose thickened or callose thickened apically, centrally or only marginally, sinuses subacute when fresh, but drying obtuse to broadly rounded, rarely flat; corolla slightly constricted basally and at the throat, often translucent when dry, 31-40(-43) mm long, 7-9 mm in diameter, glabrous or rarely pilose distally, the tube dull or glossy white, often basally pink to pinkish below, grading through violet to pale purple above, the limb white, the lobes oblong, obtuse, 1.5-2 mm long, reflexed at anthesis, white but sometimes marginally purple; stamens 24.5-36 mm long, the filaments densely puberulous distally, alternately 2.5-7.5 mm and 7.5-13.5 mm long, white, the anthers including tubules alternately 16-26.5 mm and 21.5-32.5 mm long, yellowish to tawny orange, the thecae 6-13 mm long; style 32-41 mm long. Berry not seen.
          originalLanguage: en
          sourceField: general
