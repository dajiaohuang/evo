          title: Annona spraguei Saff., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: A tree up to 16 m. high; young branchlets ferruginous-tomentose, soon glabres- cent. Leaves on petioles 8-15 mm. long, membranaceous, pellucid-punctulate, sparsely pubescent above, at first very densely and softly sericeous-pubescent beneath with appressed grayish olivaceous hairs, rufous-tomentose along the midrib and lateral nerves, lanceolate to oblanceolate or narrowly elliptic, shortly acute or some- times subrotundate at the base, acuminate at the apex, 15-35 cm. long and 5-11 cm. broad. Flowers solitary; pedicels about 1 cm. long, in fruit up to 2 cm. long (or longer ?); flower buds globose. Sepals long-caudate from an ovate base, 8-10 mm. long. Petals thick, rotundate-ovate, 18-25 mm. long, tomentellous on the outside. Stamens 3.0-3.5 mm. long. Fruit globose or globose-ovoid, about 5 cm. in diameter; the areoles produced into; long-attenuate protuberances. Seeds oblong, 7-9 mm. long.
