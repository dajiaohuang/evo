        metadataVariant: 0
        usage:
          scope:
            zh: 厄瓜多尔亚马逊两个野生群体、两个月的习惯化观察；记录了观察者在场时行为与空间使用变化，不代表全种固定行为。
            en: Two wild groups in the Ecuadorian Amazon followed for two months during habituation; documents behavior and space-use changes with observer exposure, not fixed species-wide behavior.
