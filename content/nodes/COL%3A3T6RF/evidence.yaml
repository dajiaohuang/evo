          - title
          - url
          - scope
        metadataVariant: 0
        usage:
          scope:
            zh: 2019–2024 年 Morona 河流域观察与访谈记录；直接观察的 L. lagonotus 均在河流东南侧，访谈所称另一岸记录未获现场确认。
            en: Observations and interviews in the Morona basin from 2019 to 2024; direct L. lagonotus observations were on the southeast bank, while interview reports from the opposite bank were not field-confirmed.
      - id: vicente2021
        referenceId: ref-a37d51f4-5d7b-8f55-a9ed-1f58f1861667
