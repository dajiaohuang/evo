        usage:
          scope:
            zh: 本地 MDD v2.5 源记录使用 Saguinus lagonotus，置于 Saguinus 属、Leontocebus 亚属，并提供英文显示名 “Red-mantled Saddle-back Tamarin”；该记录与固定 COL26.8 ID 的交叉联接仍未命中，不能仅凭同一词尾改写分类身份。
            en: The local MDD v2.5 source row uses Saguinus lagonotus under genus Saguinus and subgenus Leontocebus, with the English display name “Red-mantled Saddle-back Tamarin”. Its join to the pinned COL26.8 ID is unmatched; a shared epithet alone is not used to rewrite taxonomic identity.
      - id: matauschek2011
        referenceId: ref-28c6f691-9686-8d2f-a46f-ed8c5b7b2cf0
        fields:
          - id
          - title
          - url
          - scope
        metadataVariant: 0
        usage:
          scope:
            zh: 线粒体细胞色素 b 与 D-loop 分析，样本主要来自秘鲁野生狨猴粪便；支持多个 nigricollis 类群谱系作为独立种的分类假说，不单独解决属级名称采用。
            en: Mitochondrial cytochrome-b and D-loop analysis, using mainly fecal samples from wild Peruvian tamarins; supports species-level hypotheses for several nigricollis-group lineages but does not alone settle genus-level naming.
      - id: garbino2018
        referenceId: ref-668595a3-edf1-8232-ac1f-07fd0aa2ae4e
        fields:
          - id
          - title
          - url
          - scope
        metadataVariant: 0
        usage:
          scope:
            zh: 结合遗传、骨骼、毛色与发声资料提出 Callitrichinae 分类方案；该方案把 Leontocebus 置于 Saguinus 的亚属层级，代表与 COL26.8 不同的属级处理。
            en: Combines genetic, osteological, pelage and vocal evidence in a Callitrichinae classification that treats Leontocebus as a subgenus of Saguinus, a genus-level treatment differing from pinned COL26.8.
      - id: delatorre2017
        referenceId: ref-a32abf0b-175e-8282-a720-5b4a5d697b08
        fields:
          - id
          - title
          - url
          - scope
        metadataVariant: 0
        usage:
          scope:
            zh: 1989–2014 年 23 个厄瓜多尔亚马逊地点的一至两日调查；种群估计仅来自其中八处地点，适用于局地记录与方法范围说明，不是全分布区普查。
            en: One- to two-day surveys at 23 Ecuadorian Amazon sites from 1989 to 2014; population estimates came from only eight sites and are local records, not a full-range census.
      - id: tirira2025
        referenceId: ref-dd6863b8-db61-80d5-a818-6586969ba7d7
        fields:
