        claims:
          - text: Plants 150-250 mm tall, with 1 or 2 branches. Leaf 1, terete, erect, hollow. Flowers enclosed by green to partly dry spathes, blue, tepals with short claws forming a narrow cup, limbs spreading, stamens free, diverging, style with 3 filiform branches extending between the anthers.
            textZh: Moraea fistulosa (Goldblatt) Goldblatt 的 SANBI 物种条目记载了植株、叶片和花部形态。
            sourceIds:
              - sanbi_14562_0
            locator: Strelitzia 30; archive Morphology row 33300, source 14562.0
            placeTimeScope: Regional species account published 2013; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
          - text: One of three species of the Roggeveldia group of sect. Pseudospicatae, Moraea fistulosa has the characteristic blue to violet flowers of the alliance with subequal, ± spreading tepals all bearing yellow nectar guides, free stamens, and filiform style branches extending between the stamens. Of the three species of the group, M. fistulosa is recognised by the straight, hollow, terete leaf blade, ± 3 mm in diam. and relatively tall stem, up to 500 mm high. The smaller M. monticola also has a terete leaf, but only ± 1 mm in diam., solid internally and slightly smaller flowers, the tepals 13-15 mm long (vs. 16-18 mm in M. fistulosa). As in allied species in sect. Pseudospicatae, the flowers open in the later afternoon, after 16:00 and fading and collapsing at dusk, usually between 18:00 and 19:00.
            textZh: SANBI 条目提供了 Moraea fistulosa (Goldblatt) Goldblatt 的鉴别特征。
