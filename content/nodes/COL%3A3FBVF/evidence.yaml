    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Glandular-pubescent, viscidulous, aromatic, perennial herb, suffrutex or dwarf-shrub, 0.3-1.2 m high. Leaves alternate, sessile, ear clasping at bases, membranous, netted-veined, inciso-pinnatifid; the lobes short, sharply few-toothed, all teeth acuminate. Capitula pedunculate, radiate. Peduncle mostly solitary, rarely in a corymb. Involucre campanulate, 9-10 x 3 mm Involucral bracts sub-biseriate, lanceolate-acuminate, 8.0-10.0 x 2-3 mm Ray florets ±15-20, female, fertile, purple-blue, violet-blue, blue; corolla limb oblong-elliptic, 8-10 x 4 mm; corolla tube cylindric, up to 3 mm long, glandular. Style up to 4 mm long, linear branched, style branches ±2.2 mm long. Ovary up to 2 mm long, glabrous, obovate in outline. Disc florets functionally male, yellow; lobes ovate, 0.2 mm long; corolla limb 5 mm long. Style 5 mm long, branched, style branches 0.2 mm long, linear with pollen sweeping hairs, which cover style below the point of bifurcation, for same length as that of branches. Anthers linear, minutely caudate with ovate apical appendages. Ovary up to 3 mm long. Cypselae 5.5 mm long, glabrous, three-angles, obpyramidial, strongly rugose.
            sourceIds:
              - sanbi_15601_0
            locator: "SANBI/WFO archive Morphology row 52624; source 15601.0; publication: Swelankomo, N. 2013. FSA Contribution 22: Asteraceae: Calenduleae: Garuleum. Bothalia 43(2): 167 - 178. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Resembling G. latifolium in its alternate, sessile, membranous leaves, coarsely toothed or more deeply cut halfway to midrib but distinguished by the sub-biseriate vs. 3-seriate involucre.
