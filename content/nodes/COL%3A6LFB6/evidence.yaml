            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: H. nigra shows affinities with two species, H. tessellata and H. viscosa. From the first, H. tessellata, it differs in the absence of the tessellated network of the pellucid upper surface, and the marginal teeth observed in H. tessellata. The upper surface in H. nigra is flatly convex, with uniformly coloured tubercles. From the second, H. viscosa, it differs in that it is a shorter plant, with the lower surface rounded, rough with crowded, uniformly coloured tubercles.
