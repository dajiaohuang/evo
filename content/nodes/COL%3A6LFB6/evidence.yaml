    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Stem leafy, about 15 cm tall, about 7 cm diam. Leaves arranged in about 5 series, black-green, the young erect-recurved, firm, the old spreading to horizontal spreading, 10 mm to 4 cm long, to 20 mm broad, up to 6 mm thick, ovate-lanceolate, broadened at the base, often very acuminate and very recurved towards the tip; upper surface concave, or concave becoming flatly convex, tubercled with uniformly coloured tubercles; tower surface rounded, rough with crowded uniformly coloured tubercles, roundish-oblong, black; keel 1, positioned near the apex; margins rounded, rough. Inflorescence secund, about 38 cm tall; peduncle simple, terete, about 1 mm diam., 30 cm long, bracteate; sterile bracts membranous, long acuminate, about 5 mm long, erect, keeled; raceme about 8 cm long, lax, with about 10 flowers and buds, 3 open simultaneously; floral bracts membranous, 2 mm long, deltoid, acute, keeled with brown to reddish brown veins, clasping the pedicels, (shorter than the pedicels); pedicels 3 mm long, brownish-green, 1 mm diam., erect; perianth white, with brown and green keels to the segments, 14 mm long, compressed at base, funnel-shaped, tube more or less 4 mm across, constricted to 3 mm to the base, limb 2 lipped; posterior segments little recurved, spreading, white with brown or green veins; exterior’s free part strongly recurved, spreading, white with green or brown veins; stamens 6 of two lengths, 8 and 9 mm long, inserted within the perianth tube; ovary 4 mm long, 2 mm diam., green; style 4.25 mm long, curved, capitate.
            textZh: Haworthiopsis nigra (Haw.) G.D.Rowley 的 SANBI 物种条目记录了形态特征。
            sourceIds:
