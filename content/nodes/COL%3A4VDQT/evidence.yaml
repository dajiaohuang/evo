            locator: "SANBI/WFO archive Morphology row 33876; source 14694.0; publication: Klak, C. 2013. Aizoaceae: Octopoma. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 219 - 219. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Schlechteranthus connatus may be confused with S. abruptus as they share a similar leaf shape and size, but is distinguished by the longer central primary axis, which is at least three times longer than the capsule, and bracteoles persistent, present more than half way down the axis (primary axis equal to length of capsule and bracteole mostly at base of capsule in S. abruptus). The capsule itself is also markedly globose in S. connatus), as a result of the subglobose base and convex top, whereas in S. abruptus the base of the capsule is funnel-shaped and the top notprominently rounded. Schlechteranthus connatus also lacks the prominently velvety leaf surface of S. abruptus, and is only slightly velvety.
            textZh: SANBI 条目提供了该种的鉴别特征。
