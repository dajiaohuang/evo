    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Low, succulent shrub, with flowering branches raised well above the leafy centre. Leaves trigonous to semi-terete, opposite pairs basally fused into a sheath, 13-25 x up to 5 mm, up to 5 mm thick. Flowers on long stalks, magenta. Fruit 8-locular, with small closing bodies, valve wings absent.
            sourceIds:
