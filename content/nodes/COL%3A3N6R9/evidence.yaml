    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Delicate slender creeping herb, rooting at the nodes. Stem filiform, whitish to brownish. Leaves on slender petioles of 3-40 mm long, glabrous or with scattered flexuous hairs near the tip, solitary or 2-3 together. Lamina reniform with a narrow basal sinus, crenately divided into 5-7 lobes, the margins of which have rounded triangular teeth. Superior leaf surface glabrous, the inferior usually with scattered crisped hairs particularly noticeable on young leaves. Inflorescence a simple subcapitate umbel, much shorter than the subtending leaf. Peduncle slender, 2-9 mm long. Umbel 3-8(10)-flowered, involucre of inconspicuous narrow lanceolate scarious bracts; rays minute to obsolete. Fruit 1.5 x 1.0 mm, greenish to yellowish-brown, broadly ellipsoid, laterally compressed; base broadly and shallowly cordate; apex deeply emarginate; stylopodium depressed to obsolete, styles short, stiff and divergent; ribs well developed.
            sourceIds:
