    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Like Q. parviflora but pedicels 2-4 mm long, corolla 6-8 mm diam., inside pale green, mottled with red to purple, with fine, twisted hairs, corona purple-black.
            sourceIds:
              - sanbi_14722_0
            locator: "SANBI/WFO archive Morphology row 34091; source 14722.0; publication: Bruyns, PV. 2013. Apocynaceae. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 248 - 264. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: "Plants of Q. bayeriana have stems that are difficult to separate from those of Q. incarnata subsp. hottentotorum except for the lack of the broader peduncular patches which are typical of the latter. Here they are replaced by very small patches on which the flowers are very sparse. Flowers of Q. bayeriana are held on fairly short, usually decurved pedicels so are nodding. The corolla is small, with short, deltate lobes. They have turned out to be very variable in the colouring of the inside: flowers on the original plant collected had pale brown markings on cream but more recent collections have been marked with pale red to red-purple on pale yellow. The inside of the corolla has many fine hairs on it, in addition to the fine cilia along the margins of the lobes. The corona is small as well and is seated on an indistinct stipe. It has very short outer lobes, which are only slightly bifid at the apex. The inner lobes are also short and have a ridge-like dorsal projection near the base which is in series with the outer lobes. The shape and size of the flowers and the colouring in some of them is very suggestive indeed of Q. parviflora subsp. confusa and the two also have similar coronas. They differ mainly in the presence of hairs on the corolla in Q. bayeriana. Although Q. bayeriana is surrounded by a variety of forms of Q. parviflora, all of these are referable to subsp. parviflora and there is no evidence of intergradation between Q. bayeriana and any of these."
