    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte to 15 cm, corm small, non-fibrous. Leaves 2-4, strap-shaped, curved, keeled, thin-textured. Flowers 2, stellate, yellow, with green beneath, ovary cylindrical, at least twice as long as tepals, triangular in t/s, unilocular, bracts 2, broad, spreading, capsule splitting open longitudinally.
            textZh: Pauridia maximiliani (Schltr.) Snijman & Kocyan 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13877_0
            locator: "SANBI/WFO archive Morphology row 7535; source identifier 13877.0; cited publication: Snijman, DA. 2012. Hypoxidaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 115 - 119. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Pauridia maximiliani is a distinctive species, easily recognized by the strongly compressed, two-edged scape, by the narrow, elongated, sharply three-cornered ovary and the adnation of the staminal filaments to the style. Furthermore, the ovary is unilocular throughout, with parietal placentation, and the fruit reaches up to 30 mm long at maturity, exceeding all other species within Pauridia. Unlike the circumscissile fruit dehiscence in the majority of species the capsule of P. maximiliani opens septifragally, with long slits developing close to the septa and extending far down the narrow capsule. In the absence of flowers and fruits, the plants can be identified by the curved, pale green leaves, up to five in number, that are unusually brittle when handled. The only other species in which all six staminal filaments are adnate to the style is P. pusilla from the Gifberg and Matsikamma Mountains to the north of Clanwilliam. In every feature the plants of P. pusilla are diminutive in comparison to those of P. maximiliani and the stigma is maroon rather than plain yellow. Other species distinguished by an elongated, narrow ovary, up to five times or more longer than wide, are P. alba, P. aquatica, P. nana and P. umbraticola, but unlike P. maximiliani these have a predominantly three-locular ovary. The septa in P. alba and P. aquatica, however, have the habit of being incompletely fused distally, a condition which becomes more pronounced after anthesis. P. maximiliani is probably most closely allied to P. scullyi from Namaqualand with which it shares the derived, unilocular ovary, thin-textured leaves and broad inflorescence bracts. Unlike P. maximiliani, the inflorescence in P. scullyi may have two to as many as four or five flowers, the ovary is consistently shorter (3.5-10 mm long) and capsule dehiscence is circumscissile.
            textZh: SANBI 条目提供了 Pauridia maximiliani (Schltr.) Snijman & Kocyan 的鉴别特征。
