        claims:
          - text: Acaulescent, heat-sensitive, succulent herb, up to 100 mm tall, proliferating below ground and forming clumps. Leaves not fibrous, margins usually minutely dentate. Raceme capitate. Flowers white.
            textZh: Aloe albida (Stapf) Reynolds 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_11118_0
            locator: "SANBI/WFO archive Morphology row 149; source identifier 11118.0; cited publication: Herman, PPJ; Retief, E. 1997. Plants of the northern provinces of South Africa: Keys and diagnostic characters. Strelitzia 6: 1 - 681. National Botanical Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: This species is most similar to A. saundersiae and A. inconspicua. Differences between A. albida and A. saundersiae are dis-cussed above. In A. inconspicua the flowers are green, not white, the leaves are slightly wider than in A. albida and there is a bulb-like swelling at the base of the plant, which is not the case in A. albida. Plants of A. inconspicua rarely if ever sucker, while plants of A. albida do so readily, and may form large many-headed clumps. In nature they appear to sucker less freely, and solitary plants are often found.
            textZh: SANBI 条目提供了 Aloe albida (Stapf) Reynolds 的鉴别特征。
            sourceIds:
              - sanbi_5961_0
            locator: "SANBI/WFO archive Diagnostic row 51266; source identifier 5961.0; cited publication: Glen, HF; Hardy, DS. 2000. Aloe. In: G Germishuizen & E du Plessis (eds), Aloaceae (first part), Fl. S. Africa 5(1,1): 1 - 167. National Botanical Institute, Pretoria. [http://www.biodiversitylibrary.org/item/209564#page/3/mode/1up]. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Its nearest ally in size and leaf is A. saundersiae which differs in having narrower greener leaves, and smaller flowers with regular mouth. A. albida is nearest allied in floral characters to A. myriacantha but the latter is a much larger plant with dull pinkish flowers.
            textZh: SANBI 条目提供了 Aloe albida (Stapf) Reynolds 的鉴别特征。
            sourceIds:
              - sanbi_13236_0
            locator: "SANBI/WFO archive Diagnostic row 78109; source identifier 13236.0; cited publication: Reynolds, GW. 1974. Aloes of South Africa, 3rd ed. A.A. Balkema, Cape Town. [All rights reserved]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
