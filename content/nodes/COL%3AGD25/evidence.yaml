        usage:
          title: Ardisia dukei Lundell, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Trees, branchlets thick, furfuraceous with small reddish-brown scales. Leaves large, subsessile, the marginate petioles to 7 mm long; leaf blades membra- naceous, oblanceolate-elliptic, to 30 cm long and 11 cm wide, subabruptly acuminate apically, acute basally, attenuate and decurrent on the petiole, glabrous on the upper surface, appressed furfuraceous beneath. Inflorescences terminal, pyramidal, large, tripinnately paniculate, densely furfuraceous, ca. 30 cm high, ca. 30 cm wide basally. Flowers subcorymbose, 5-merous; pedicels stout, 1.5-2 mm long; sepals ovate, 1-1.3 mm long, ciliolate, glabrous, black- punctate; ovary subglobose, glabrous, the ovules 22-24, pluriseriate, the style ca. 3 mm long.
