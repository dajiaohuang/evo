    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Virgate or branched suffrutex, up to 1 m high. Branches glabrous or villous/strigose, fulvous. Leaves trifoliolate, glabrous or hairy, petiolate; petiole semiterete, shallowly concave above (2-)24(-76) mm long; leaflets sessile, coriaceous, discolorous, dark green above, drying shiny brown, pale green below, glabrous or hairy, strigose above, strigose and villous below, hypostomatous; lamina widely oblanceolate to obovate, base cuneate, apex subacute to acuminate, mucronate; margin entire or ciliate, slightly revolute, slightly thickened, whitish; venation semi-craspedodromous to brochidodromous, midrib and secondaries prominent above and below, tertiaries and others prominently reticulate above; terminal leaflets (19-)55(-89) x (10-)27(-61) mm, lateral leaflets (11-)42(-74) x (5-)14(-25) mm. Panicles and flowers glabrous or hairy, otherwise together with drupes, as for R. discolor. Drupes ±5-6 mm diameter.
            sourceIds:
              - sanbi_9808_0
            locator: "SANBI/WFO archive Morphology row 48208; source 9808.0; publication: Moffett, RO. 1993. Rhus, Fl. S. Africa 19(3,1): 1 - 123. National Botanical Institute, Pretoria. [http://www.biodiversitylibrary.org/item/209553#page/1/mode/1up]. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: "This distinct species differs from its closest ally, R. discolor, as follows: branches and lower veins of leaflets tawny, leaflets glabrous or scabrid, upper surface shiny, brown when dry, apices often acuminate and venation usually somewhat brochidodromous."
