        usage:
          title: Hamelia macrantha Little, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrubs or trees to 5 m tall, the branchlets terete, ultimately angular, minutely puberulent, the nodes well spaced. Leaves ternate toward the apex, broadly oblong to ovate, 13-23 cm long, 4-15 cm wide, rounded, obtuse or widely deltoid at the apex, rounded, subtruncate to cuneate basally, the costa plane to promi- nulous above and beneath, the lateral veins 11-15, membranous to chartaceous, glabrous above, glabrous to rufous puberulent beneath; petioles 6.0-9.5 cm long, glabrous or puberulent; stipules ovate, 3.1-3.5 mm long, acute, glabrous or rarely pubescent. Inflorescences terminal or axillary, the dichasia many flowered; pe- duncle terete, to 8 cm long, the floral axes to 2 cm long; bracts ovate, to 0.7 mm long, acute, glabrate to villosulose. Flowers sessile or on pedicels to 2 mm long; hypanthium 3-5 mm long, the calycine cup scarcely measurable, the lobes tri- angular to ovate, to 1.3 mm long, acute, glabrous to tomentose; corolla yellow, the tube infundibular, 2-3 cm long, constricted basally, glabrous, the lobes ovate, to 4 mm long, glabrous; stamens included, the anthers to 20 mm long, the con- nective produced at the apex, ovate, ca. 1 mm long, sagittate basally; style to 20 mm long, the stigmatic lobes linear, 5-8 mm long. Fruits ellipsoid, to 1.5 cm long, red to finally lustrous black at maturity; persistent ovarian disc conical and truncate; seeds to 1 mm long, delicately foveolate.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 11703
          archiveSourceId: 48CED1AB-2D01-46FA-8E9C-7D0B49C35E70
