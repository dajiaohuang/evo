    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Robust terrestrial, (520-)650(-830) mm tall. Leaves of fertile shoot 12, up to 150 x 33 mm, glabrous, ± spirally arranged, grading into floral bracts that dry back from apex. Inflorescence somewhat densely 30-50-flowered and 110-120 mm in diameter. Dorsal sepal and lateral sepals white, well suffused soft pink to dark pink. Petals white, margins variously suffused pink with a single horizontal darker pink stripe. Lip white to pale pink. Floral bract 32 x 8 mm. Ovary 28 mm long. Dorsal sepal galeate, 25-27 x 5-7 mm, margin spreading. Petals 19-21 x 6-7 mm, strongly falcate, well exerted from galea. Lateral sepals 21-27 x 5-7 mm, forward spreading, ± recurved, apiculate. Lip 20-23 x 1-2 mm, linear, gently recurved. Rostellum erect, apex beaked/hooked. Spur 17-20 x 2-3 mm, straight, held ± horizontally, slender, tapering.
