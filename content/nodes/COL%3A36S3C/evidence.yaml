      ecology:
        status: partially-supported
        claims:
          - text: Grows in high altitude, open, sunny grassland, often rocky, the individuals very scattered. Currently known from west of Wakkerstroom eastwards to the southern slopes of KwaMandlangampisi and also in an area south of Amsterdam some 70 km further north. At these localities no plants of D. nervosa Lindl. sensu stricto were observed. Fragrance moderate, pleasant soapy, detected around noon.
