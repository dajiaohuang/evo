          - text: Recognised by its broad, moderately soft-textured leaves, (12-)18-35 mm wide and relatively large, pale pink flowers with perianth tube 30-40 mm long, and rusty red-brown bracts 38-48 mm long. The leaves lack the fine, closely set tertiary veins of species such as Gladiolus ferrugineus and G. varius.
