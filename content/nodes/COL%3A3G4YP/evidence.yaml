    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants 450-800 mm high. Corm depressed-globose, 20-35 mm diam.; tunics firm-papery, becoming partly fibrous. Stem erect or inclined to horizontal below, lightly flexed in upper third, unbranched. Leaves 6 to 10, lower 4 to 8 in basal fan reaching to between base and middle of spike, drooping if stem inclined, lanceolate to narrowly sword-shaped, (12-)18-35 mm wide, margins and main vein barely thickened, main vein placed asymmetrically, uppermost leaf inserted on ± middle of stem and sheathing upper part of stem usually to ± base of spike, without blade. Spike inclined, straight, 9- to 16-flowered; bracts initially grey-green, soft-textured, becoming dry and rusty brown at tips or ± entirely rust-brown, lightly folded in midline, outer 38-48 mm long, ± 2 internodes long, inner shorter, minutely forked. Flowers whitish flushed pale mauve or mauve to pink, darkening with age, lower 3 tepals each with pale mauve, linear to narrowly diamond-shaped median streak, unscented; perianth tube narrowly and obliquely funnel-shaped, 30-40 mm long, flared outward in upper 10 mm; tepals ovate, margins slightly undulate, 3 upper largest, 30-37 x 18-20 mm, dorsal inclined, upper laterals spreading outward in distal 1/2, lower tepals joined to upper laterals for ± 4 mm and together for ± 2 mm, lower lateral tepals ± 28 x 15 mm, spreading in distal 1/2, lower median ± 33 x 16 mm long. Filaments 16-24 mm long, exserted 10-15 mm from tube; anthers ± 9 mm long, yellow; pollen cream-coloured. Style arching over stamens, dividing 1-2 mm below anther apices, branches 5-6 mm long. Capsules globose, 3-lobed above, 8-10 mm long. Seeds oblong, 4-6 x ± 3 mm, unevenly and weakly winged.
