    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Succulent, perennial tree. Stem 2-3 m high, can be up to 5 m high, unbranched, erect, densely covered with persistent dried leaves. Leaves dull green, sometimes with reddish tinge, without spots, lanceolate-ensiform, up to 1 m long, surfaces smooth or with irregular scattered spines; margin with stout, deltoid, reddish to brownish red teeth. Racemes cylindric, dense, branched, ± 1 m long. Flowers orange to scarlet, occasionally yellow or white, ± 33 mm long; stamens and stigma well exserted.
            textZh: Aloe ferox Mill. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13850_0
            locator: "SANBI/WFO archive Morphology row 9005; source identifier 13850.0; cited publication: Klopper, RR; Smith, GF. 2012. Asphodelaceae: Aloe L. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 66 - 70. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Differences between this species on the one hand and A. pluridens and A. africana on the other are discussed under those species. The leaves of A. ferox are more spread-ing than those of A. marlothii. The erect, symmetrical racemes of red to orange (rarely white) flowers in A. ferox differ from the usually subhorizontal, secund racemes of orange to yellow flowers in A. marlothii. The bracts of A. ferox are about twice as long as those of A. marlothii. Adult plants of A. ferox are relatively light and can be carried by one strong man. Adult plants of A. marlothii, on the other hand, are much heavier at the same size, and require several strong men to lift one.
            textZh: SANBI 条目提供了 Aloe ferox Mill. 的鉴别特征。
            sourceIds:
              - sanbi_5961_0
            locator: "SANBI/WFO archive Diagnostic row 51284; source identifier 5961.0; cited publication: Glen, HF; Hardy, DS. 2000. Aloe. In: G Germishuizen & E du Plessis (eds), Aloaceae (first part), Fl. S. Africa 5(1,1): 1 - 167. National Botanical Institute, Pretoria. [http://www.biodiversitylibrary.org/item/209564#page/3/mode/1up]. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: A. ferox is nearest allied to the Natal species A. candelabrum, and from a distance they look very similar. The latter, however, differs in having longer and more deeply channelled recurved leaves, while in the inflorescence the terminal raceme stands out higher than the others. Another marked difference is the inner segment apices which are brown to deep brown in A. ferox, and always white in A. candelabrum.
            textZh: SANBI 条目提供了 Aloe ferox Mill. 的鉴别特征。
