  claims:
    - subjectId: taxon:dicynodontia
      claimKind: scientific
      claimType: topology
      statement: A broad morphology matrix places the sampled Russian Permian taxa within competing dicynodont topologies and exposes strong Gondwanan–Laurasian sampling imbalance; Dicynodontia is therefore represented as a matrix-tested extinct radiation, not a resolved ancestor chain.
      confidence: medium
      confidenceRationale: The primary study directly analyses dicynodont characters and biogeographic sampling. The wording retains its unresolved nodes and sampling caveat.
      referenceLinks:
        - relation: supports
          referenceId: angielczyk-2003-dicynodont-phylogeny
          pages: 157–212
          quoteLocator: Phylogenetic analysis; Results; Discussion of geographic sampling disparity
    - subjectId: taxon:dicynodontia
      claimKind: scientific
      claimType: fossil-range
      statement: Dicynodontia is displayed at 259.5–251.9 Ma only as the Russian Permian matrix sample, not the global first and last appearances of Dicynodontia. The interval is a source-bounded sample window, not a global FAD, LAD, divergence date, continuous occupancy claim or direct-ancestor assertion.
      confidence: medium
      confidenceRationale: Dicynodontia uses Angielczyk, K.D. (2003) because the cited pages and locator expose the sampled taxon, specimen or living sequence set. Confidence is medium and applies only to Russian late Permian dicynodont sample analysed by Angielczyk; broader endpoints remain unclaimed.
      referenceLinks:
        - relation: supports
          referenceId: angielczyk-2003-dicynodont-phylogeny
          pages: 157–212
          quoteLocator: Phylogenetic analysis; Results; Discussion of geographic sampling disparity
        - relation: contextualizes
          referenceId: ics-2026-06
          pages: International Chronostratigraphic Chart v2026/06
          figure: Global chronostratigraphic scale
          quoteLocator: Numerical boundaries for named geological stages used to bound the source sample
  claim-rationales.zh:
    - 一手研究直接分析二齿兽类性状与生物地理取样；措辞保留未解析节点和取样限制。
    - Dicynodontia 采用 Angielczyk, K.D.（2003）的论文，因为所引页码与定位符直接标示了研究采样的类群、标本或现生序列集合。中等置信度仅适用于 Russian late Permian dicynodont sample analysed by Angielczyk；更宽泛端点保持未声明。
  claim-statements.zh:
    - 一套广泛形态矩阵把取样的俄罗斯二叠纪类群置于相互竞争的二齿兽类拓扑中，并揭示冈瓦纳—劳亚取样严重不均；因此二齿兽下目被呈现为经矩阵检验的灭绝辐射，而非已解析的祖先链。
    - Dicynodontia 仅以 259.5–251.9 Ma 展示为俄罗斯晚二叠世矩阵样本，而非二齿兽类全球首现与末现。该区间是来源限定的样本窗口，不是全球首现、末现、分化日期、连续占据或直接祖先断言。
  ranges:
    - entityId: dicynodontia
      rangeKind: global-composite
      taxonomicConcept: Dicynodontia — source-bounded sample window
      geographicScope: Russian late Permian dicynodont sample analysed by Angielczyk
      olderMa: 259.5
      youngerMa: 251.9
      status: available
      uncertainty:
        olderMa: null
        youngerMa: null
        note: This display is limited to the Russian Permian matrix sample, not the global first and last appearances of Dicynodontia; numerical stage conversions follow ICS v2026/06 where applicable.
      evidenceBasis: "Phylogenetic analysis of Russian Permian dicynodonts (Therapsida: Anomodontia): implications for Permian biostratigraphy and Pangaean biogeography directly anchors the sampled window; the display does not extrapolate it into a global taxon duration."
      confidence: medium
      claimIds:
