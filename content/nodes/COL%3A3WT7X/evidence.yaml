          - text: It is easily recognized by its large colourful flowers with radiating dark lines around the mouth of the corolla tube, relatively narrow leaves, and rather sparse indumentum, particularly on the ovaries and capsules. This last character will at once distinguish it from the closely allied L. formosa; see under that species.
