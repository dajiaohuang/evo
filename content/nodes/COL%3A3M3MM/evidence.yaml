        usage:
          title: Hiraea quapara (Aubl.) Sprague, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Lianas, most parts except upper leaf surface densely pubescent with T-shaped trichomes, those of the stems, petioles, peduncles, pedicels and calyces appearing appressed-pubescent; periderm of older stems thin, reddish-brown, becoming fis- sured. Leaves opposite, sublanceolate-elliptic to elliptic, acute or gradually long- acuminate, ovate to subcordate at the base, mostly 8-25 cm long, 4-11 cm wide, glabrous above except the midrib, softly pubescent throughout below with stalked T-shaped trichomes, the midrib and major veins appressed-pubescent; petioles 1-2 cm long with 2 sessile glands at the apex; 2 subulate stipules to 2 mm long borne at about the middle of the petiole. Inflorescence of solitary, axillary umbels; small bracteoles borne at the apex of peduncles; peduncle 2.5-4.0 cm long, thick, rigid, pubescent with (6-)35-60 flowers; bracts 2, subulate, 2.5 mm long; brac- teoles ovate-oblong, 2 mm long; pedicels 13-20 mm long. Flowers 10-12 mm diam.; sepals triangular-ovate, 4 of them sometimes with 2 large glands; petals clawed, the blade ovate-suborbicular, yellow except orange-red at the base, sub- cordate at the base, 4-5 mm diam., the margin sinuate, all but the inner small one also fimbriate, the inner one orange-red; stamens 10, subequal; styles 3, 1 erect, 2 curved, the apices narrowly spatulate-truncate with the outer angle acute or shortly apiculate, the ovary hirsute. Fruit a schizocarp of 3 samaras, softly hirsute especially on the body; wings lateral, reniform, 0.5-2.0 cm long, 2.0-3.8 cm wide, thin, the outer margin sinuate-undulate.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 7151
