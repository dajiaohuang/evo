          title: Mabea occidentalis Benth., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrub or small tree. Leaves membranous to subchartaceous; blade 8-15 X 3-5 cm, broadly elliptic to ovate-elliptic, the upper surface usually shiny, the base obtuse to rounded, the margin subentire to bluntly serrate and often undulate, the apex strongly long-acuminate. Inflorescence a raceme of groups of c3 and solitary 9 flowers. Staminate flowers in groups of 3, the subtending biglandular bract at or near the base of the peduncle; calyx gamosepalous, the broad lobes fused for ca 1/2 length; stamens 30-45. Pistillate flowers 3-7, solitary at basal nodes, subtending bract eglandular or obscurely glandular; sepals 6, acute, subequal. Capsule ovoid, 11-17 cm long; seed ovoid, ca 8 mm long, slightly laterally com- pressed, smooth or obscurely warted.
          originalLanguage: en
          sourceField: general
