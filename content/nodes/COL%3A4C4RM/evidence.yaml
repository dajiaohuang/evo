        usage:
          title: Palicourea ochnoides Dwyer, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: neath, not forming a distinct undulate, submarginal vein, with 1-2 smaller veins subparallel to and located between adjacent lateral veins, these evanescent to- ward the middle of the blade, the smaller veins pinnatiform, the margin scarcely thickened, stiffly chartaceous, concolorous, glabrous and smooth above, puber- ulent beneath; petioles 0.5-2.5 cm long, ca. 1 mm wide, stiff, glabrous; stipules persistent toward the tips of the twiglets, connate, the sheath turgid, cylindrical, scarious, drying red, each part with 2 triangular lobes, about as long as the sheath, to 4 mm wide at the base, ciliolate. Inflorescences terminal, solitary, cymose pyramidal paniculate, to 12 cm long, to 6.5 cm wide, the peduncle to 6.5 cm long, to 0.18 cm wide, smooth, glabrous, the branches opposite, disposed as 3-4 well- spaced pairs, the lowermost to 3 cm long, the lowermost bracts oblong, to 1.8 cm long, concave and often investing much of the branch, acuminate, scarious, drying red, glabrous, shiny, venose, with an auricle on each side at the base, the lobe to 1 mm long, obtuse, ciliolate, each flower apparently partially hidden by a bracteole, the latter oblong, to I1 mm long, to 5 mm wide, foliose, acuminate, venose, glabrous, the same general texture as a calycine lobe. Flowers pedicel- late, the pedicels to 1.5 mm long, glabrous, the hypanthium 0.7-1.0 mm long, drying red, glabrous; calycine cup short, expanded, the lobes 5, imbricate, foliose, ovate oblong, to 6 mm long, to 2.5 mm wide, obtuse, concave, glabrous inside and out, venose, drying yellow; corolla white, carnose, glabrous outside, villose within, the lobes slightly cucullate; anthers 5, oblong, to 1 mm long. Fruits not seen.
          originalLanguage: en
          sourceField: general
