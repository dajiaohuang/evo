  claims:
    - subjectId: taxon:carcharocles
      claimKind: scientific
      claimType: fossil-range
      statement: A dated occurrence sample was analysed under the paper's Carcharocles megalodon usage to estimate a probabilistic extinction window. The atlas uses Otodus megalodon; the sampled estimate is not an exact global last appearance and does not resolve the nomenclatural choice.
      confidence: medium
      confidenceRationale: Confidence is medium because the cited primary study directly supports the bounded fossil range statement at the supplied locator. The confidence does not extend beyond the atlas uses Otodus megalodon; the sampled estimate is not an exact global last appearance and does not resolve the nomenclatural choice.
      referenceLinks:
        - relation: supports
          referenceId: pimiento-clements-2014-megalodon-extinction
          pages: e111086
          figure: Figures 1–3; Tables 1–2; supporting data
          quoteLocator: Occurrence dataset; optimal linear estimation; extinction interval
    - subjectId: taxon:carcharocles
      claimKind: scientific
      claimType: fossil-range
      statement: Pimiento and Clements (2014), using Carcharocles megalodon, reported an oldest inferred extinction date of 3.5 Ma and a modal estimate of 2.6 Ma. This study-specific interval is neither the complete species range nor an exact LAD; the atlas uses Otodus megalodon.
      confidence: medium
      confidenceRationale: "Otodus megalodon extinction-analysis window under the paper’s Carcharocles usage: the cited primary study or systematic review directly supports the stated sample, calibration or withholding boundary at the supplied locator. Confidence is medium and does not extend to a global FAD, LAD, direct ancestor or unsampled interval."
      referenceLinks:
        - relation: supports
          referenceId: pimiento-clements-2014-megalodon-extinction
          pages: e111086
          figure: Figure 1 and caption
          quoteLocator: "Results, paragraph beginning Results from applying OLE: oldest inferred extinction date 3.5 Ma; modal estimate 2.6 Ma"
  claim-rationales.zh:
    - 置信度为中：所引主研究在给定页码、图版或章节定位器处直接支持这一受限的化石延限表述；置信度不外推到文中明确排除的全群起源、全球首现、直接祖先或精确端点。
    - Otodus megalodon extinction-analysis window under the paper’s Carcharocles usage：所引一手研究或高质量系统综述在给定页码、图表或章节处直接支持此处的样本、校准或暂缓边界。置信度为中等。该置信度不外推至全球首现、全球末现、直接祖先或未采样区间。
  claim-statements.zh:
    - 论文以 Carcharocles megalodon 名称分析具年代的出现记录样本，并估计概率性灭绝窗口。图谱采用 Otodus megalodon；这一抽样估计不是精确全球末现，也不裁决命名选择。
    - Pimiento 和 Clements（2014）以 Carcharocles megalodon 为名，报告了 350 万年前的最早推定灭绝时间与 260 万年前的众数估计。这一研究特定区间既不是完整物种延限，也不是精确末现；图谱采用 Otodus megalodon。
