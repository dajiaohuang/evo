    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Perennial, dwarf shrublet, forming loose clumps, up to 0.25 m high. Leaves highly succulent, ovate, rounded at keel and margins, rough with hardened bladder cells ending in a hair, apex blunt. Flowers solitary, pale yellow or white with yellow centre. Flowering time spring to late summer. Capsules pale brown, mostly 5-locular, closing bodies absent, covering membranes reduced to a ledge, expanding keels parallel, valve wings narrow.
