          title: Triumfetta speciosa Seem., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrub 0.60-2 m. high, sometimes small tree up to 3-6 m. tall, the branches and inflorescence-axes rather densely ferruginous-arachnoid. Leaves with a petiole 1-5 cm. long or even more, very densely arachnoid, the blade rounded-ovate, often 3-lobate, rounded to more or less cordate at the base, the terminal lobe acuminate, the laterals short and generally rather obtuse, sometimes acuminate, 6-9 cm. long and 5-7 cm. wide, the margins very irregularly and bluntly serrate, the serrations often glandular, discolor, the upper surface dark green, lightly scabrous-puberulous, the lower surface pale green, densely arachnoid, 3- to 5- to 7-palminerved, the nervation not prominent. Inflorescences axillary, the cymes of 1-2 cymules, usually opposite the bracts, these ovate and short-petiolate, the peduncles 4-10 mm. long, the pedicels 4-8 mm. long, both densely arachnoid. Flowers large, 3.4-3.7 cm. long, hermaphrodite, the sepals 5, linear-lanceolate, acuminate, the appendages ca. 2-3 mm. long, 3.4-3.7 cm. long and ca. 3.5 mm. wide, long-hirsute without, glabrous within; petals 5, narrowly lanceolate, acute, only 6-7 mm. long and ca. 1.5 mm. wide, very densely hirsute at the base outside, glabrous inside except a transverse densely hirsute band near the base; gonophore ca. 1 mm. long, the 5 glands usually forming a full ring subequalling the gonophore, the urceolus ca. 0.7 mm. long, slightly undulate and densely stellate-ciliolate; stamens ca. 20, the filaments 2.7-3 cm. long, glabrous, the anthers ca. 1.5 mm. long; ovary broadly transversely elliptic, ca. 1 mm. long and 1.5 mm. broad, covered with numerous, slightly arcuate spinules; style 30-34 mm. long, hirsute at the base, the stigma acute. Fruit orbicular on the slightly accrescent gonophore, the body 6-8 mm. in diam., rather densely stellate-puberulous, the spines 100 or more, ca. 3 mm. long, densely hirtellous, the spinules arcuate, 4-celled and each cell 2-seeded when young, at maturity with 6-8 distinct, 1-seeded locules; seeds ovoid, ca. 2 mm. long.
