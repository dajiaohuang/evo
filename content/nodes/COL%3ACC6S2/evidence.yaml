    facets:
      morphology:
        status: partially-supported
        claims:
          - text: The species description reports fresh apothecia 2.3–4.2 mm wide (mean 3.0 ± 0.6 mm, n=15); dry apothecia were 1.2–2.0 (–2.5) × 0.47–0.72 mm (mean 1.6 ± 0.3 × 0.58 ± 0.09 mm, n=18). Sampled apothecia were scattered or gregarious, disk-like, short-stipitate, and orange-grey to brownish-grey when fresh.
            originalLanguage: en
            sourceIds:
              - li2024
            locator: Species treatment T. yuxiensis, Description and Notes; Figure 8; holotype HKAS 128268
            placeTimeScope: "The article reports two collections from Xinping County, Yuxi City, Yunnan, China: the type at 2090 m on 2022-06-05 and a paratype at 2340 m on 2022-06-06. The article’s localities do not establish a global range."
            lifeStatus: Claims apply to the field collections and taxonomic account identified by the cited voucher; do not infer beyond those specimens.
        gaps:
          - The account describes measured collection material, but a genus-wide diagnosis, additional populations, developmental stages, and within-species variation were not systematically assessed.
      lifeHistory:
        status: not-assessed
      ecology:
        status: partially-supported
        claims:
          - text: The authors describe T. yuxiensis as saprobic on decayed wood; the type was collected from soft decayed unknown wood in a managed plantation, and the paratype from decayed unknown wood.
            originalLanguage: en
            sourceIds:
              - li2024
            locator: Species treatment T. yuxiensis, Description and Material examined; vouchers HKAS 128268 and 128270
            placeTimeScope: "The article reports two collections from Xinping County, Yuxi City, Yunnan, China: the type at 2090 m on 2022-06-05 and a paratype at 2340 m on 2022-06-06. The article’s localities do not establish a global range."
            lifeStatus: Claims apply to the field collections and taxonomic account identified by the cited voucher; do not infer beyond those specimens.
        gaps:
          - The source describes substrate and saprobic habit, but interaction mechanisms, host identity for unidentified wood, seasonality, and population ecology remain unassessed.
      evolution:
        status: partially-supported
        claims:
          - text: In the combined LSU and ITS phylogeny, T. yuxiensis was sister to T. aseptata (100% maximum-likelihood bootstrap, 1.0 Bayesian posterior probability). The reported PHI value for that pair was Φw=1.0.
            originalLanguage: en
            sourceIds:
              - li2024
            locator: Results, Phylogenetic analyses; Figure 2; Figure 3B; species treatment Notes
            placeTimeScope: "The article reports two collections from Xinping County, Yuxi City, Yunnan, China: the type at 2090 m on 2022-06-05 and a paratype at 2340 m on 2022-06-06. The article’s localities do not establish a global range."
            lifeStatus: Claims apply to the field collections and taxonomic account identified by the cited voucher; do not infer beyond those specimens.
        gaps:
          - The placements are specific to one study’s sampled taxa and loci; broader phylogenomic evidence, alternative topologies, and divergence times were not reviewed. The authors also note that genus placement remains provisional because the type species lacks genetic data.
      distribution:
        status: partially-supported
        claims:
          - text: The treatment lists the type and one paratype from Xinping County, Yuxi City, Yunnan, at 2090 m (2022-06-05) and 2340 m (2022-06-06), respectively. These are the documented study localities.
            originalLanguage: en
            sourceIds:
              - li2024
            locator: Species treatment T. yuxiensis, Holotype and Material examined; vouchers HKAS 128268 and 128270
            placeTimeScope: "The article reports two collections from Xinping County, Yuxi City, Yunnan, China: the type at 2090 m on 2022-06-05 and a paratype at 2340 m on 2022-06-06. The article’s localities do not establish a global range."
            lifeStatus: Claims apply to the field collections and taxonomic account identified by the cited voucher; do not infer beyond those specimens.
        gaps:
          - Only the named Yunnan study collections were reviewed; no global occurrence search, georeferenced range boundary, or native/introduced assessment was completed.
      fossil:
        status: not-assessed
      conservation:
        status: not-assessed
