          - text: Shrub, up to 300 mm tall. Leaves 3-sided, with distinct keel and margins, covered with papillae. Flowers 30 mm diam., petals white to pink, filamentous staminodes numerous, white. Fruit 5-locular, 6-8 mm diam., closing bodies hook-shaped, closing rodlets present, valve wings broader than expanding keels, tapering towards apex.
