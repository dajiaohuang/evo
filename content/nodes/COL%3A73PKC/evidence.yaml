    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, 12-25 cm, stem flexed outward above leaf sheath. Leaf solitary, linear, channelled, glaucous. Flowers beige with a yellow centre, tepals spreading from base, broadly ovate, stamens free, style branches subsessile.
            textZh: Moraea radians (Goldblatt) Goldblatt 的 SANBI 物种条目记载了植株、叶片和花部形态。
            sourceIds:
              - sanbi_13878_0
            locator: Strelitzia 29; archive Morphology row 7415, source 13878.0
            placeTimeScope: Regional species account published 2012; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
          - text: Although vegetatively resembling several other species of sect. Homeria in the solitary, somewhat glaucous leaf inserted above the ground and the few-branched stem, Moraea radians is so distinctive in its floral structures that it was at first referred to a separate genus, Sessilistigma. The beige-yellow flowers, with short, erect tepal claws and spreading limbs, are remarkable for the subgenus in their free stamens and almost vestigial style ± 1 mm long, dividing into three, flattened branches forked for half their length. Other species of subg. Homeria have filaments partly to entirely united and enclosing a well-developed style, the branches of which are each appressed to the opposed anther. The style branches of M. radians lack crests and are stigmatic at the tips of each lobe.
            textZh: SANBI 条目提供了 Moraea radians (Goldblatt) Goldblatt 的鉴别特征。
