          figure: Figures 1–4
          quoteLocator: Systematic palaeontology; locality; anatomical description and phylogenetic analysis
    - subjectId: taxon:gerobatrachus
      claimType: biogeography
      claimKind: scientific
      statement: USNM 489135 comes from the Clear Fork Group at a named Baylor County locality in Texas; one occurrence does not establish a global distribution.
      confidence: medium
      confidenceRationale: "Gerobatrachus hottoni: The primary study reports the named locality and horizon directly. Confidence is medium because one study sample cannot establish absence, endemism or a global geographic range."
      referenceLinks:
        - referenceId: anderson-2008-gerobatrachus
          relation: supports
          pages: 515–518
          figure: Figures 1–4
          quoteLocator: Systematic palaeontology; locality; anatomical description and phylogenetic analysis
    - subjectId: taxon:gerobatrachus
      claimType: ecology
      claimKind: scientific
      statement: The articulated skeleton permits functional discussion, but diet, prey choice, habitat preference and locomotor performance were not directly observed.
      confidence: medium
      confidenceRationale: "Gerobatrachus hottoni: The evidence boundary is explicit: depositional or anatomical context is retained while unsupported behaviour and niche claims are withheld. Medium confidence applies to that bounded negative statement, not to a reconstructed ecology."
      referenceLinks:
        - referenceId: anderson-2008-gerobatrachus
          relation: supports
          pages: 515–518
          figure: Figures 1–4
          quoteLocator: Systematic palaeontology; locality; anatomical description and phylogenetic analysis
    - subjectId: taxon:gerobatrachus
      claimType: morphology
      claimKind: scientific
      statement: USNM 489135 preserves a frog-like and salamander-like character mosaic in an articulated small tetrapod skeleton.
      confidence: medium
      confidenceRationale: "Gerobatrachus hottoni: The cited figures and descriptions directly document the named anatomical observations. Confidence is medium rather than universal because preservation and specimen sampling limit character completeness and variation."
      referenceLinks:
