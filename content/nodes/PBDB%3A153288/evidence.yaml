  claims:
    - subjectId: taxon:gerobatrachus
      claimType: taxonomy
      claimKind: scientific
      statement: Gerobatrachus hottoni is known from the sole holotype USNM 489135 and was recovered as a stem batrachian in the original analysis, not as crown Batrachia or a direct ancestor.
      confidence: medium
      confidenceRationale: "Gerobatrachus hottoni: Named material and a published systematic or phylogenetic treatment support this bounded identification. Confidence remains medium because the profile does not turn a sampled placement into direct ancestry or universal consensus."
      referenceLinks:
        - referenceId: anderson-2008-gerobatrachus
          relation: supports
