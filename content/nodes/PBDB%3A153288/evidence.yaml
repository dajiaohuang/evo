  claim-rationales.zh:
    - Gerobatrachus hottoni：具名材料和已发表的系统或系统发育处理支持这一有限鉴定。置信度保持中等，因为画像不会把取样位置转化为直接祖先或普遍共识。
    - Gerobatrachus hottoni：一手研究直接报告了具名地点与层位。置信度为中等，因为单一研究样本不能确定缺失、特有性或全球地理范围。
    - Gerobatrachus hottoni：证据边界是明确的：保留沉积或解剖背景，同时不填补无依据的行为与生态位。中等置信度针对这一有限的否定性陈述，而非重建生态。
    - Gerobatrachus hottoni：所引图件与描述直接记录了具名解剖观察。由于保存与标本取样限制了性状完整性和变异，置信度为中等而非普遍结论。
    - Gerobatrachus hottoni：一手来源与具体定位符支持显示的样本区间。置信度为中等，因为该包络明确限定于标本或地点，而非全球首现或末现。
  claim-statements.zh:
    - Gerobatrachus hottoni 仅由正模 USNM 489135 所知，在原始分析中位于蛙螈干群，而非蛙螈冠群或直接祖先。
    - USNM 489135 来自美国得克萨斯州贝勒县具名地点的 Clear Fork 群；单一记录不能确定全球分布。
    - 关节连接骨架可用于功能讨论，但食性、猎物选择、栖息地偏好与运动性能均未被直接观察。
    - USNM 489135 在一具关节连接的小型四足动物骨架中保存了蛙类与蝾螈类性状镶嵌。
    - 显示的 283.3–274.4 Ma 区间是唯一 Gerobatrachus 记录的空谷期包络，并非现生两栖类全球首现。
