  claims:
    - subjectId: taxon:octopus-bimaculoides
      claimKind: scientific
      claimType: event-mechanism
      statement: The Octopus bimaculoides genome and 12 RNA transcriptomes document gene-family expansions and rearrangement. The study found no evidence for whole-genome duplication but did not exclude duplication followed by extensive gene loss; these samples do not date octopus origins.
      confidence: high
      confidenceRationale: Genome coverage and expression datasets directly support the inventory, while evolutionary causation and lineage timing remain comparative.
      referenceLinks:
        - referenceId: albertin-et-al-2015-octopus-genome
          relation: supports
          pages: 220–224
          figure: Figures 1–3; Extended Data Figures 1–9; Supplementary Notes
          quoteLocator: Genome assembly; gene-family analysis; tissue transcriptomes; whole-genome duplication test
    - subjectId: taxon:octopus-bimaculoides
      claimKind: scientific
      claimType: fossil-range
      statement: Albertin et al. sequenced genomic DNA from one living male Octopus bimaculoides and used 12 RNA transcriptomes from tissue and developmental samples to annotate the assembly. These are present-day research samples, not dates for species origin, fossil first appearance or complete geographic range.
      confidence: high
      confidenceRationale: The methods and BioProject accessions directly identify the sampled living material. High confidence applies only to present-day sample status, not evolutionary duration.
      referenceLinks:
        - relation: supports
          referenceId: albertin-et-al-2015-octopus-genome
          pages: 220–224
          figure: Figure 1a
          quoteLocator: "Methods: Genome sequencing and assembly; Transcriptome sequencing; BioProjects PRJNA270931 and PRJNA285380"
  claim-rationales.zh:
    - 基因组覆盖与表达数据直接支持该清单，但演化因果和谱系年代仍属比较推断。
    - 方法与 BioProject 登录号直接标识了所取现生材料。高置信度只适用于当代样本状态，不适用于演化延续时间。
  claim-statements.zh:
    - 加州双斑蛸基因组和 12 个 RNA 转录组记录了基因家族扩张与重排。研究未发现全基因组复制的证据，但未排除复制后发生大量基因丢失；这些样本不为章鱼起源定年。
    - Albertin 等对一只现生雄性加州双斑蛸的基因组 DNA 测序，并用组织及发育样本的 12 个 RNA 转录组注释组装。这些是当代研究样本，不为物种起源、化石首现或完整地理范围定年。
