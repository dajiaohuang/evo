        claims:
          - text: Rhizomatous geophyte to 1 m. Leaves linear, channelled. Flowers in a conical raceme, yellow or cream-coloured.
            textZh: Bulbinella nutans (Thunb.) T.Durand & Schinz 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13854_0
            locator: "SANBI/WFO archive Morphology row 8991; source identifier 13854.0; cited publication: Manning, JC; Goldblatt, P. 2012. Asphodelaceae: Bulbinella Kunth. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 73 - 74. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Bulbinella nutans is not always readily distinguished from B. latifolia from which it is separated largely on size. Apart from the leaves of B. latifolia being considerably broader than those of B. nutans, in living plants they are arched and spreading, whereas those of B. nutansare erect. The inflorescence is broader and shorter in B. nutans.
