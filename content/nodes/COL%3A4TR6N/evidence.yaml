    facets:
      morphology:
        status: partially-supported
        claims:
          - text: "Small, cushion-forming plants 512 cm Ø, the main root branching, woody and thick, descending straight into the soil, but a number of fibrous roots placed proximally in horizontal position; leaves trigonous, greyish-green, low teeth on margins and keel, and on the convex sides, hence the epithet scabrous = rough, to 5 mm long, to 4 mm broad and thick; flowers solitary, bracteoles touching the base of the calyx, petals purplish-pink; fruit top raised, but the valve rims low, base funnel- to bell-shaped, covering membranes raised high in the centre, distally with closing ledges of enormous dimensions: protruding distinctly and very broad, almost reaching the expanding keels at their bases, closing body hood-shaped, expanding keels short, no awns and no valve wings; seeds brown."
            sourceIds:
              - sanbi_3835_0
            locator: "SANBI/WFO archive Morphology row 79619; source 3835.0; publication: Hartmann, HEKO. 1996. Miscellaneous taxonomic notes on Aizoaceae. Bradleya 14: 29 - 56. [https://doi.org/10.25223/brad.n14.1996.a6]. [All rights reserved]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: The species had been placed in R. muricata as a 'forma' without a name. Both species show the same habit of a loose cushion form and possess elevations on the sides of the leaves, R. scabra more so than many populations of R. muricata. The latter possesses leaves double the size of R. scabra and distinct valve wings, a feature absent in all other species of the complex, as far as it is known until now. In habitat, R. scabra can also be recognized by itssmaller, compact form. Furthermore, it grows in calcareous soil with some sand, or in sand over gypsum, a feature already described by Bolus, who also noted the peculiar development of the root system, as it had been described to her by the collector, F. Stayner (the relevant sheet is Stayner Karoo Garden 741/62, BOL!). Since no name had been applied to the form, a new name is given here stressing the marked muricate condition of the leaves.
            textZh: SANBI 条目提供了该种的鉴别特征。
