          publishedAt: undated
          originalSourceText: Herbs or subshrubs, robust, + densely soft-pubescent, to 2 m. Leaves ovate or sometimes ? elliptic, acute, crenate-serrate, the bases rounded to obtuse, to 8.5 cm long and 4.5 cm wide, pubescent on both surfaces, densely so beneath; petioles ca 0.5-1 cm long. Inflorescences capitula, axillary, the peduncles ca 1-2 cm long, pubescent, the bracts mostly ovate, ca 6-9 mm long, pubescent. Flowers sessile; calyx tubular, ca 2 mm long, ? naked within, pubescent and resin-dotted, membranaceous, the teeth spinulose, ca 2.5-3 mm long, ciliate be- tween; corolla tube ca 4-5 mm long, the lower lip longer, ca 2 mm long, slightly pubescent and resin-dotted; stamens exserted, the filaments glabrous, the anthers ca 0.2-0.3 mm long. Nutlets ca (3-)4, flattened ovoid, 2 depressiqns near the base, 1.4-1.5 mm long, the pericarp verrucose.
