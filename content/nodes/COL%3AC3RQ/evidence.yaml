        claims:
          - text: Acaulescent, succulent perennial, usually solitary, rarely suckering to form small colonies. Leaves grey-white, often bluish tinged, becoming slightly reddish with drought stress, obscurely striated and irregularly spotted with pale, elongated H-shaped, confluent spots, lanceolate to ± acuminate, tapering to mucronate apex, 40-48 cm long; margins with small pinkish white teeth. Racemes capitate, lax, branched, 1-1.4 m high. Flowers orange-red, 22-23 mm long, with globose base; stamens and stigma exserted.
