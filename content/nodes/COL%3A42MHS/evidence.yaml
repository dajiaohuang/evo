      evolution:
        status: partially-supported
        claims:
          - text: From their occurrence records and regional geomorphology, the authors proposed that the headwaters of the Acarí River might represent a contact zone involving Mico acariensis, M. chrysoleucos, and M. melanurus, where hybridization could occur. This is a proposed scenario, not a confirmed contact zone or a report of observed hybrids or gene flow; the authors called for further surveys, specimens, and samples to determine whether the contact zone exists and to assess population dynamics and hybridization.
            sourceIds:
              - costa_araujo2023micoacariensis
            locator: "Results and discussion, final paragraph: authors' contact-zone and possible hybridization hypothesis at the Acarí River headwaters, with the stated need for further surveys, specimens, and samples; publisher page lines 160–163."
            placeTimeScope: Acarí River headwaters, south-central Amazonia, Brazil; hypothesis published in 2023 from locality records that include 2015–2018 field expeditions and regional geomorphological context. No timing of a contact event or population-level estimate is reported.
            lifeStatus: Based on wild locality records and regional biogeographic reasoning; captive and fossil evidence are not included.
            originalLanguage: en
        gaps:
          - The proposed contact zone and potential hybridization were not confirmed in this account; the authors call for additional surveys, specimens, and samples to establish whether the zone exists and assess population dynamics and hybridization.
      distribution:
        status: partially-supported
        claims:
          - text: In their 2023 account, two previously reported localities and three new localities support the authors' delineation of Mico acariensis as the only marmoset in the Acarí–Sucundurí interfluve. They delimit the reported distribution by the right bank of the Acarí River, the left bank of the Sucundurí River, and the area south to BR-230, covering approximately 17,480 km². This is a regional range inference from the occurrence records discussed in that paper, not a complete species-wide survey or an estimate of current abundance.
            sourceIds:
              - costa_araujo2023micoacariensis
            locator: Results and discussion, paragraph beginning 'Mico acariensis is among the less-known primates' (publisher page lines 158–163); field survey context in Material and methods (lines 144–147).
            placeTimeScope: Acarí–Sucundurí interfluve, south-central Amazonia, Brazil; occurrence records presented in the 2023 account, including field expeditions conducted during 2015–2018.
            lifeStatus: Wild-range occurrence records and an author-delineated regional distribution; no captive population or fossil record is included.
            originalLanguage: en
        gaps:
          - The reported area is a regional author-delineated range based on two previously reported and three new localities; the article does not establish a complete, range-wide census or current abundance.
          - The authors state that the remote region needs additional surveys to clarify geographic distribution, the proposed contact zone, and population dynamics.
          - Morphology, life history, fossils, conservation status, systematic evidence search, remain unassessed.
      fossil:
        status: not-assessed
      conservation:
        status: not-assessed
