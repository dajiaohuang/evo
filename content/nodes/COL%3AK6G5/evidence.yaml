    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, 15-35 cm. Leaves lanceolate, hairy. Flowers zygomorphic, many on an inclined spike, inverted and facing spike apex, blue with yellow or white markings, outer bracts mostly brown and lacerate, inner bracts divided to base, ovary smooth.
            textZh: Babiana secunda (Thunb.) Ker Gawl. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 6717; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Babiana secunda is one of a handful of species of Babiana with inverted flowers, that is, with the spike inclined and the flowers facing upward, with the dorsal tepal and the unilateral stamens facing the spike apex. It can be distinguished by the smooth, dry, often torn floral bracts, the outer tricuspidate with a long central awn and hairless ovary, the latter unusual for sect. Babiana. Babiana secunda blooms unusually late in the season, usually in October or November. In the other species with inverted flowers, B. angustifolia, B. inclinata, and B. rubrocyanea, the ovary is densely hairy, the bracts remain partly green at flowering, are usually velvety and lack a pronounced awn although they do tend to be tricuspidate. The anthers and pollen are pale to deep blue or violet (or sometimes white) in B. angustifolia and B. inclinata, whereas the anthers and pollen of B. secunda are yellow.
            textZh: SANBI 条目提供了 Babiana secunda (Thunb.) Ker Gawl. 的鉴别特征。
