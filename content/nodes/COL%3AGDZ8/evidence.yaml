        usage:
          title: Ardisia wedelii Lundell, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Trees or shrubs, ca. 3 m high; branchlets thick, almost 1 cm in diameter apically, densely furfuraceous-lepidote, ferruginous. Leaves sessile, subchar- taceous, drying brown, paler beneath, oblanceolate, 25-40 cm long and 9-12 cm wide, attenuate apically, acuminate, attenuate basally, rounded, sparsely and minutely lepidote above, densely furfuraceous-lepidote beneath with larger scales, the costa impressed above, prominent beneath, the primary veins 30-40 on each side, conspicuous on the undersurface. Inflorescences apparently terminal, long pedunculate, narrowly pinnately paniculate, to 20 cm long including a peduncle 13 cm long, less than 2 cm wide, densely furfuraceous- lepidote, the peduncle bearing 1 or 2 bracts below the middle. Flowers 5-merous, umbellate, the umbels subsessile; pedicels furfuraceous, to 4.5 mm long; calyx punctate, furfuraceous, the sepals ovate-triangular, ca. 1.2 mm long, acute, ciliate; corolla sparsely lepidote, ca. 4 mm long, the petals connate basally ca. 1.2 mm, oblong-lanceolate, ca. 1 mm wide, punctate; anthers ca. 1.7 mm long, acute, longitudinally dehiscent, the filaments sub- equaling the anthers, filiform, expanded basally; ovary ovoid, minutely punc- tate, ovules 12, minute, in several series, the style ca. 4 mm long.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 8306
