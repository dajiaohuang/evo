        claims:
          - text: Shrub or small tree, 1.5-3.0 m. Leaves falcate, hairy beneath, 4-10 mm long, bracts ovate-acuminate, wings prominently veined. Flowers in spikes, tube 5-6 mm long, neck slender and exserted. Fruits dry.
            sourceIds:
