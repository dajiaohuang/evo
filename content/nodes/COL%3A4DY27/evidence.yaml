            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Passerina falcifolia is distinguished by the mottled grey-green falcate leaves, which are inclined or horizontally spreading. The widely ovate bracts are villous inside and narrow into a leaf-like, falcate point, with chartaceous wings that are distinctly ± 4-ribbed and reticulately veined. The most conspicuous floral character is the slender, often arcuate, tomentose hypanthium neck, exserted from the clasping bract. This species may be confused with P. filiformis subsp. filiformis which has widely obovate bracts, narrowing abruptly into a filiform point. The bracts are basally to centrally setose on the inside and the wings are glabrous. P. montivaga is another close species, but is distinguished by bracts that are basally setose on the inside, with glabrous wings.
