            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Distinctive in the solitary leaf and orange flowers with herbaceous outer bracts with narrow, scarcely visible membranous margins but ± entirely membranous inner bracts with unmarked margins. Romulea monophylla is distinguished from other yellow-flowered species with membranous inner bracts by the strictly solitary leaf, herbaceous outer bract with narrow membranous margins, and the unspotted inner bracts.
