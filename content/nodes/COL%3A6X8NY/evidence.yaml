        claims:
          - text: Plants 100-150 mm high. Corm globose, ± 10 mm diam., rounded or crested below, tunics woody, split into bent, grooved teeth below. Stem subterranean. Leaf solitary, basal, terete, narrowly 4-grooved, ± 1 mm diam. Peduncle 1, semi-terete, reddish brown; outer bracts green or flushed brown, with scarcely visible, colourless membranous margins, 15-22 mm long, ribbed above (± 6 veins/mm), inner bract ± entirely membranous or distal half with narrow herbaceous central portion, with purple or green veins in centre and wide, colourless margins. Flowers orange, ?with dark lines in throat, outer tepals finely feathered and marbled with brown on reverse; perianth tube funnel-shaped, 6-7 mm long; tepals oblanceolate to elliptic, 20-22 x 6-8 mm. Filaments ± 8 mm long, pilose in lower half, yellow; anthers ± 8 mm long, yellow. Style dividing opposite middle of anthers, branches 2 mm long, divided halfway.
            textZh: Romulea monophylla J.C.Manning & Goldblatt 的 SANBI 物种条目记录了形态特征。
            sourceIds:
