    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, up to 300 mm tall, several-branched. Leaves several, linear, channelled. Flowers enclosed in pale green spathes, yellow, inner and outer tepals with laxly spreading limbs, filaments united in lower half, style branches broad, crests prominent.
            textZh: Moraea namaquamontana Goldblatt 的 SANBI 物种条目记载了植株、叶片和花部形态。
            sourceIds:
              - sanbi_14562_0
            locator: Strelitzia 30; archive Morphology row 33334, source 14562.0
            placeTimeScope: Regional species account published 2013; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
          - text: With flowers typical of the genus, Moraea namaquamontana has moderate-sized, yellow flowers with outer tepals up to 28 mm long and inner up to 25 mm long, both whorls with half reflexed limbs. It stands out particularly in having several, mostly basal, relatively broad leaves, falcate and slightly twisted. The stems usually have one or two branches, these subtended by short, partly sheathing bract-like leaves. The fairly short rhipidial spathes, the outer about one third as long as the inner, recall those of M. gawleri and the corms of the two species are similar, having relatively coarse fibres with prominent vertical members.
            textZh: SANBI 条目提供了 Moraea namaquamontana Goldblatt 的鉴别特征。
