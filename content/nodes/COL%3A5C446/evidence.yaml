    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Corm oblong-ovoid to subglobose, 0.7-2 cm long, 0.6-1.5 cm wide, with dark brown or sometimes reddish brown tunics produced into a firm neck 8 cm long. Stem above ground 3-15 cm high (or somewhat longer in fruiting stage). Basal sheath vaginate; free apex short, ovate-oblong, membranous, obtuse or mucronate, distinctly veined. Basal leaf solitary, 2.5-15cm long (or even longer in fruiting specimens), 1-2(-2.5) mm wide, linear-filiform, subterete, shallowly channelled adaxially, glabrous. Cauline leaves1 or 2, spathaceous, close to the inflorescence, 1-3(-4) cm long, (2.5-)3-7 mm wide near the base, acuminate. Spike 1-6(-10)-flowered, usually short, up to 3.5 cm long, with flowers spaced 3-8 mm apart. Perianth 6-12 mm long, pure white or pink-mauve-purple, with stellately spreading segments; perianth tube 0.7-1.5(-2) mm long; free segments 5-10 mm long, 1.5-3.5 mm wide, oblong or elliptic-oblong to lanceolate-oblong, basally somewhat unguiculate, usually distinctly 3-7-veined, sometimes speckled with small rectangular dots, apically obtuse to subacute. Nectary distinctly elevated, boat-shaped with an entire or shallowly bilobed obtuse free apex, 2-3 mm long, white or mauve-tipped or purplish mauve. Filaments 3-5 mm long, white or light-coloured. Anthers oblong, 0.7-1.8 mm long, 0.5-1 mm wide, reddish brown. Pistil oblong, markedly triquetrous, 5-8 mm long; free styles 4 mm long, green with purplish tinge and whitish style tips, brownish when dry except for the light style tips, tapering to small capitate stigmas. Capsule elliptic-oblong, 7-13 mm long incl. styles, 3-5 mm broad, greenish brown,with suberect or somewhat spreading subulate styles 2-4 mm long. Seeds numerous, subglobose, 0.9-1.2 mm long, light brown, with a minutely reticulate-foveate surface.
