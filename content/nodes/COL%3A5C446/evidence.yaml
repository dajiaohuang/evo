          - text: The variation is considerable especially in size and colouring of the perianth. Many populations are apparently homogeneous as to flower colour, i.e. either pink or white, but not seldom white and pink flowered forms grow together with or without transitions. The pink or mauve colour may be restricted to the nectary region or be diffusely to evenly distributed. Small rectangular dots may occur on the perianth, either sparsely or rarely densely distributed all over the segments. In dried material these dots are visible as brown or orange-brown short streaks. An easily recognized species. Distinctive characters are the narrow basal leaf and the broad-based short cauline leaf or leaves, together with the short perianth tube, the usually distinctly veined segments, and particularly the characteristic elevated nectary with its free tip.
