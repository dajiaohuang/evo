        claims:
          - text: Prefers moist habitats such as bogs and stream banks, but is also frequently found in grassland especially on well-drained, seasonally wet slopes. In montane habitats it is recorded from Danthonia-veld as well as Themeda triandra-veld, and it seems to be favoured by burning.
