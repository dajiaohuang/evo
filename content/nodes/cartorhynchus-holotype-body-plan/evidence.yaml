  claims:
    - subjectId: event:cartorhynchus-holotype-body-plan
      claimKind: scientific
      claimType: morphology
      statement: Holotype AGM I-1 preserves a small, short-snouted ichthyosauromorph with large flippers and dense limb and rib bone; amphibious habits, suction feeding and its phylogenetic position are bounded interpretations rather than observed behaviour or direct ancestry.
      confidence: medium
      confidenceRationale: The named articulated specimen and diagnostic anatomy are illustrated, but functional and topological conclusions depend on comparative inference; a published corrigendum changed character descriptions and tree statistics while retaining the topology.
      referenceLinks:
        - referenceId: motani-2015-cartorhynchus
          relation: supports
          pages: 485–488
          figure: Figures 1–4; Extended Data Figures 1–3
          quoteLocator: Description; Functional and phylogenetic discussion
        - referenceId: motani-2015-cartorhynchus-corrigendum
          relation: contextualizes
          pages: Nature 527, 126
          quoteLocator: Corrigendum text
  claim-rationales.zh:
    - 具名关节相连标本及诊断解剖均有图示，但功能与拓扑结论依赖比较推断；已发表勘误修正了性状描述与树统计量，同时保留原报告拓扑。
  claim-statements.zh:
    - 正模 AGM I-1 保存一种小型、短吻、具大鳍肢及致密肢骨和肋骨的鱼龙形类；两栖习性、吸食及其系统位置均为有边界的解释，而非被观察到的行为或直系祖先关系。
