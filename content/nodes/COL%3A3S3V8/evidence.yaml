    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Stem and branches erect, subflexuous, leaves much crowded, subdistinct, elongate, terete, incurved, erect, attenuated on both ends, acute, very smooth and green; flowers solitary, purplish; calyx-lobes broad, much shorter than the petals. Stem straight, 1 1/2 foot. Leaves 1-1 1/2 inch long, 1 line wide. Peduncle 2 inches long, thickened upward. Calyx-lobes subequal, 2 larger with membranaceous margins. Petals purplish-violet, spathulate-lanceolate, bluntish, about 10 lines long. Styles 5, acute.
