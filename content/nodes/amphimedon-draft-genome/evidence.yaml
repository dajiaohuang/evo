  claims:
    - subjectId: event:amphimedon-draft-genome
      claimKind: scientific
      claimType: morphology
      statement: The Amphimedon queenslandica draft genome contains many metazoan signalling, transcription-factor, adhesion and cell-cycle gene families despite the adult sponge lacking eumetazoan organs.
      confidence: high
      confidenceRationale: Sequence content and comparative annotations are directly reported, while ancestral toolkit and trait-history language remains comparative inference from one sponge genome.
      referenceLinks:
        - referenceId: srivastava-2010-amphimedon
          relation: supports
          pages: 720–726
          figure: Figures 1–4; Supplementary Notes 6–11
          quoteLocator: Draft assembly, gene-family inventories and comparative enrichment analyses
  claim-rationales.zh:
    - 序列内容和比较注释是直接报告结果，而祖先工具箱和性状历史仍是从一份海绵基因组作出的比较推断。
  claim-statements.zh:
    - 尽管成体 Amphimedon queenslandica 不具真后生动物式器官，其基因组草图仍包含许多后生动物信号传导、转录因子、黏附和细胞周期基因家族。
