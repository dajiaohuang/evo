          publishedAt: undated
          originalSourceText: Herb; stems erect or ascending, 10-40 cm tall, 2-3 mm in diam., green or reddish, villous; branches few. Leaves opposite or 3 at a node, nearly equal in a pair, lanceolate to ovate, 1.9-5.9 cm long, 0.8-2.7 cm wide, the apex acute, the base cuneate to acute, the margin serrate, green above and villous, below pale green or more usually reddish between the veins; petioles short. Inflorescences of single axillary flowers; pedicels ca. 0.5 cm long, densely pilose. Flowers showy; floral tube 2-5 mm long, densely pilose; calyx lobes linear lanceolate, 7-12 mm long, glabrescent, long ciliate; corolla blue or lavender (Panama), erect in the calyx, lacking a spur, the tube narrow, 3.5-6.5 cm long, ca. 0.5 cm wide at the base, spotted or lined, glabrous, the limb oblique, broad, flat, 3.9-6.5 cm wide, nearly regular, the lobes entire; stamens included, nearly equalling the corolla tube, the filaments adnate to the base of the corolla tube, glabrous; style puberulous, the stigma 2-lobed. Fruits and seeds not seen on Panamai material. Chromosomes n = 11 (Eberle, 1956).
          originalLanguage: en
          sourceField: general
