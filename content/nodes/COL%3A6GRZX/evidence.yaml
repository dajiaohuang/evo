          originalSourceText: Large trees. Leaves with the leaflets ovate to oblong, 7-14 cm long, 5-11 cm wide, round obtuse apically, obtuse to vaguely cordate basally, thin coriaceous, minutely bullate, usually green, glabrous above, puberulent to minutely farinose below, the principal secondary veins, 6-9, the costa prominulous above, often aculeate; petioles 9-13 cm long, ca. 0.3 cm wide, minutely puberulent to glabrous; rachises 8-25 cm long, pubescent, often acufleate. Inflorescence with bracts and bracteoles ovate or broadly ovate, to 2 mm long; pedicels to 2 cm long and 0.2 cm wide. Flowers with the calyx broadly campanulate, to 17 mm long, asym- metric, longer on the lower side, chartaceous, pubescent, the hairs deciduous, the teeth scarcely evident; standard orange, trapeziform, to 90 mm long and 40 mm wide, widely deltoid apically, obtuse basally, coriaceous, glabrous, the claw
