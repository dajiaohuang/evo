    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Twiggy, rounded shrub up to 2 m high, old branches bare, rough with leaf bases, branchlets white-woolly, closely leafy. Leaves 7-18 x 1-1.5 mm, linear, apex mucronate, acute, hooked, base broad, half-clasping, margins revolute, upper surface with minute, elongated appressed trichomes, later glabrous or nearly so, lower surface white-woolly. Heads heterogamous, campanulate, 4-5 mm long and as much across the radiating bracts, bases woolly, many in compact terminal corymbose clusters 10-20 mm across. Involucral bracts in c. 4-5 series, graded, closely imbricate, glossy, outer palest brown often tipped reddish or orange when young, inner about equalling the flowers, tips obtuse, bright canary-yellow, minutely radiating. Receptacle shortly honeycombed. Flowers 27-45, 7-15 'female', 19-30 'female'. Achenes 0.75 mm long, with duplex hairs. Pappus bristles many, equalling corolla, scabrid, bases cohering by patent cilia.
