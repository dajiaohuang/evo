    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Acaulescent, succulent herb, up to 0.6 m high, excluding inflorescence. Leaves with random surface prickles throughout. Inflorescence ± 1 m high. Racemes erect, cylindrical, very dense. Flowers reddish orange to yellow in bud, orange to yellow at anthesis.
            textZh: Aloe aculeata Pole-Evans 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_11118_0
            locator: "SANBI/WFO archive Morphology row 147; source identifier 11118.0; cited publication: Herman, PPJ; Retief, E. 1997. Plants of the northern provinces of South Africa: Keys and diagnostic characters. Strelitzia 6: 1 - 681. National Botanical Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: A. aculeata differs from A. petricola in having many-nerved, not 3-5-nerved, bracts which are shorter than in the latter species. The pedicels and flowers in A. aculeata tend to be longer than those of A. petricola, though there is overlap in these characters.
            textZh: SANBI 条目提供了 Aloe aculeata Pole-Evans 的鉴别特征。
            sourceIds:
              - sanbi_5961_0
            locator: "SANBI/WFO archive Diagnostic row 51264; source identifier 5961.0; cited publication: Glen, HF; Hardy, DS. 2000. Aloe. In: G Germishuizen & E du Plessis (eds), Aloaceae (first part), Fl. S. Africa 5(1,1): 1 - 167. National Botanical Institute, Pretoria. [http://www.biodiversitylibrary.org/item/209564#page/3/mode/1up]. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Appears to be more closely related to A. marlothii which it closely resembles in leaf, pedicels, bracts and flowers, but not in stem or oblique racemes. When growing together, young non-flowering plants of A. aculeata and A. marlothii are difficult to distinguish.
            textZh: SANBI 条目提供了 Aloe aculeata Pole-Evans 的鉴别特征。
            sourceIds:
              - sanbi_13236_0
            locator: "SANBI/WFO archive Diagnostic row 78106; source identifier 13236.0; cited publication: Reynolds, GW. 1974. Aloes of South Africa, 3rd ed. A.A. Balkema, Cape Town. [All rights reserved]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: This handsome Aloe undoubtedly belongs to Berger's Principales, and the characters of the inflorescence and flowers suggest a close relationship with A. rubroviolacea, Schweinfurth, although the bracts are much smaller and shorter than in A. rubroviolacea. The upper part of the racemes with unopened flowers is a bright orange-scarlet, while the open flowers lower down are a bright lemon-yellow. Sometimes the peduncle is unbranched, especially in the younger plants, but more commonly there are from 1-3 upright branches, in some cases as many as five branches.
            textZh: SANBI 条目提供了 Aloe aculeata Pole-Evans 的鉴别特征。
            sourceIds:
              - sanbi_17714_0
            locator: "SANBI/WFO archive Diagnostic row 78107; source identifier 17714.0; cited publication: Pole-Evans, IB. 1915. Descriptions of some new aloes from the Transvaal. Trans. Roy. Soc. South Africa 5: 25 - 37. [https://www.biodiversitylibrary.org/item/181589#page/87/mode/1up]. [All rights reserved]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
