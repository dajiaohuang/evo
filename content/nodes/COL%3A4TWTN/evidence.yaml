        claims:
          - text: Short-lived perennial or annual, tufted (prostrate at base, trailing, rooting at lower nodes), up to 0.9 m high. Leaf blades 20-100 mm long, 3-7 mm wide, mostly cauline, narrowly lanceolate, soft and thin. Spikelets 2.5-3.5 mm long. Panicle loosely contracted; spikelets distinctly pedicellate and conspicuously asymmetrical; upper glume more than 5 times longer than lower glume.
