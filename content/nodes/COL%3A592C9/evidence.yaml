        claims:
          - text: Densely tufted perennial, up to 450 mm tall. Leaves linear, flat; ligule an unfringed membrane. Inflorescence an open panicle, lower branches sometimes spreading. Spikelets 10-17 mm long (excluding awns), many-flowered, flushed purple, awned; glumes unequal, as long as spikelet but some awns exerted, lemma lobes awned, central awn 20 mm long, basally twisted.
