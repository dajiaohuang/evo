    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, up to 300 mm tall, corm tunics softly fibrous. Leaves several, spreading, delicate and pale green, V-shaped in cross section. Flowers 2-5, yellow, on a scape ± as long as pedicels, style branches long and narrow, ovary slender, expanding upwards; bracts as many as flowers, leaf-like and spreading.
            textZh: Pauridia scullyi (Baker) Snijman & Kocyan 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_14561_0
            locator: "SANBI/WFO archive Morphology row 33017; source identifier 14561.0; cited publication: Snijman, DA. 2013. Hypoxidaceae. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 92 - 94. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Nel (as Ianthe) placed Pauridia scullyi in his Aquaticae group, based on the absence of fibrous corm tunics as well as the disc-like remnants of old corms. P. scullyi, however, has a unilocular ovary with parietal placentation, which separates it from P. aquatica and P. alba, both with a trilocular ovary. Given these differences, P. scullyi now appears more closely allied to P. maximiliani with which it shares the derived, unilocular ovary, thin-textured leaves and broad inflorescence bracts. Found along the mountains immediately east of the Olifants River Valley, P. maximiliani is distinguishable by a consistently two-flowered inflorescence and an elongated, sharply three-cornered ovary, 13-30 mm long. P. scullyi, in contrast, has two to as many as four or five flowers per inflorescence and a consistently shorter ovary, 3.5-10.0 mm long.
            textZh: SANBI 条目提供了 Pauridia scullyi (Baker) Snijman & Kocyan 的鉴别特征。
            sourceIds:
              - sanbi_15172_0
            locator: "SANBI/WFO archive Diagnostic row 58362; source identifier 15172.0; cited publication: Snijman, DA. 2014. A taxonomic revision of the genus Pauridia (Hypoxidaceae) in southern Africa. Phytotaxa 182(1): 1 - 114. [All rights reserved]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
