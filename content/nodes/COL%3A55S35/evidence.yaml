        claims:
          - text: Herba perennis, robusta, glabra. Caulis erectus, foliosus, 1.6 m. altus, intemodis trigonis, nodis subteretibus, basi vaginis brunneis plus minusve nitentibus vel fibrosis crasse obtectus, inter fere ad basem et bracteam nodis 5 instructus. Folia basalia numerosa, lamina plana 9 dm. longa basi 1.5 cm. lata deinde gradatim angustata apicem versus longe gradatimque acuminata margine fere laevi, vagina circiter 6 cm. longa; caulina basalibus similia sed laminis angustioribus brevioribusque vaginis 5-6 cm. longis clausis artis ore obliquo. Inflorescentia spicato-paniculata, 6.3 dm. longa, ramis lateralibus valde complanatae spiculis numerosissimis instructa; bracteae inferiores foliis caulinis similes sed breviores, apicem versus gradatim reductae, inflorescentia breviores. Spiculae valde complanatae, 1.3-1.5 mm. longae, sessiles vel fere sessiles, agglomeratae. Glumae acuminatae vel acutissimae, infimae 4 vacuae, 4-10 mm. longae, floriferae 1.3 cm. longae. Flos inferior hermaphroditus sed ovario interdum infertile, setis angustissime linearibus 3 mm. longis margine minute serrulatis, staminis 3 filamentis 1.3 cm. longis, antheris 8 mm. longis longe mucronatis, ovario cylindrico 2.5 mm. longo 1 mm. diametro, stylo 1 cm. longo superne papilloso ramis stigmatosis tribus 9 mm. longis; flos superior flori inferiori similis sed ovario semper fertile instructus.
