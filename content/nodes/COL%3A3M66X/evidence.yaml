          title: Hoffmannia bullata L.O.Williams, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: 'Subshrubs to 0.3 m tall, the stems simple, the lowermost nodes rhizophorous, the hairs dense, ferrugineous, the lenticels many, the nodes moderately well spaced. Leaves narrowly obovate oblong, 5-15 cm long, 1.5-5.0 cm wide, often slightly falcate, widely deltoid or rounded at the apex, the acumen inconspicuous, obtuse or cuneate toward the base, often abruptly contracted toward the base, the costa plane above or immersed, prominulous beneath, the lateral veins 8-14, arcuate, conspicuous and prominulous beneath, chartaceous, usually bullate at least on drying, discolorous, drying tan or silvery, glabrous above, the costa and veins below with golden, dense hairs, the raphides minute, white; petioles ca. 1.3 cm long, pubescent; stipules not seen. Inflorescences axillary; peduncles slender, to 2.5 cm long, ca. 0.7 mm wide. Flowers with hypanthium oblong or turbinate, glabrous, lightly costate, often seemingly alate on pressing, the teeth 4, to 1.5 mm long: (Williams) "dull brick red; calyx and hypanthium 3-4 mm long, the hypanthium turbinate, glabrous, the calyx lobes triangular or lance triangular, acute, sparsely villosulose; corolla about 1 cm long, glabrous, the lobes oblong, obtuse or acute, 2-3 times as long as the tube; stamens with short filaments, the anthers exserted." Fruits red; pedicels to 2 mm long, oblong or turbinate, 6-7 mm long, truncate at the apex, 4-angled, smooth, glabrous, lightly costate, the raphides abundant, the persistent calyx lobes obtuse.'
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 11748
