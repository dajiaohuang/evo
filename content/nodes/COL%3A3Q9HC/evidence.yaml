        claims:
          - text: "Tufted annual or short-lived perennial. Roots minute; rhizome 1-15 x 0.7-1 mm, ascending, whitish. Culms 6-22 cm tall, 0.4-0.6 mm diam., without nodes. Leaves: sheath 17-27 x 0.5-1.2 mm, brown; blade 1-53 x 0.1-0.6 mm. Inflorescence pseudolateral, not proliferating; bract 4-17 x 0.3-0.9 mm. Spikelets 1-5, 3-6.2 x 1.4-2.2 mm, with 9-24 glumes. Glumes 1.9-2.5 x 0.8-1.1 mm, acute to obtuse, green or with brown patches, midrib green with mucro <0.1 mm. Style trifid. Stamens 3, anthers 0.9-1.4 mm long, crested. Nutlets 0.8-0.9 x 0.6 mm, dark brown, minutely reticulate."
