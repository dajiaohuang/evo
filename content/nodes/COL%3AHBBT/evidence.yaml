        claims:
          - text: Slender, erect or twining shrub, up to 2 m high. Cladodes produced after flowers, in fascicles of ± 4, ± 20-30 x 0.5 mm, with an indistinct keel. Pedicels 1.5 mm long, articulated at apex. Flowers white.
