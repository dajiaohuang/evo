        claims:
          - text: Mat-forming perennial 60-280 mm high; rhizome long, profusely branched; leaves mostly basal; culms usually one-noded. Leaf blade 5-35 x 1-3 mm, broadly obtuse, margins not white cartilaginous, apex short, rounded. Inflorescence not obviously dichotomously branched; axils without long hairs; spikelets solitary at branch apices. Spikelet 1.5-1.8(2.2) mm long; glumes unequal, obtuse, ovate-oblong; lower glume 1/2 as long as spikelet; upper glume 2/3 as long as spikelet; lemma broadly oblong, apex subobtuse; anther 1.3-1.7 mm long.
