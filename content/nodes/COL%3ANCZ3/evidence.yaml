    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Tufted perennial 500-1500 mm high; culms sparsely to densely pilose; old leaf sheaths fibrous to not obviously fibrous. Leaf blade 200-400 x 4-8 mm, flat, glabrous or sparsely to densely hairy; sheath base just above node usually hairy. Inflorescence open, much exserted; pedicels and branches densely to sparsely hairy occasionally only sparsely scabrid; pedicels (at least some) longer than spikelets. Spikelet 15-45 x 4-8 mm (including awns), green to purple; glumes unequal, densely hairy rarely nearly glabrous; lower glume 1-3-nerved, upper 3-5-nerved; lemma 10-20 mm long, densely hairy; awn 3-12 mm long; palea ciliate on keel, sparsely to densely hairy between keels; callus scar circular; anthers 4-8 mm long.
