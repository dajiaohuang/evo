            locator: "SANBI/WFO archive Morphology row 32843; source identifier 14528.0; cited publication: Snijman, DA. 2013. Amaryllidaceae. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 33 - 42. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Hessea incana together with its close ally H. pilosula, constitute the only species pair with the apomorphy of vestiture on the leaves. The covering of minute retrorse hairs in H. incana is dense, giving a hoary appearance to the abaxial surface of the leaf. Furthermore the leaf blades are flattened and broad (3-8 mm). Despite the covering of short hairs or papillae in H. pilosula, the leaves appear shiny green; the blades are narrow (1-5 mm), shallowly canaliculate and thickened abaxially in cross section. The inflorescence of H. incana is also distinguished by its broadly lanceolate spathe valves (8-20 mm wide at anthesis), whereas those of H. pilosula are linear-lanceolate reaching at most 2.5 mm across at anthesis.
            textZh: SANBI 条目提供了 Hessea incana Snijman 的鉴别特征。
            sourceIds:
