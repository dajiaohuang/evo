    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Bulbous geophyte, 80-200 mm tall. Leaves 2, dry at flowering, suberect to spreading, strap-shaped, under surface covered with minute retrorse hairs. Flowers stellate, pink with a deeper pink centre, in a spreading cluster, stamens much shorter than tepals.
            textZh: Hessea incana Snijman 的 SANBI 物种条目记录了形态特征。
