    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Erect, densely branched succulent perennial shrublet 150(-200) mm tall, to 200 mm diam., young internodes brown, stems woody, distinction between long shoots and short shoots small, long internodes to 15 mm long, young internodes indistinctly papillate becoming smooth with age. Leaves dirty green, only slightly reddish suffused, boat-shaped, spreading, top flat, keels indistinct, leaf-pairs isophyllous, basally connate for c. 1/3 of their length; sheeth 5-8 mm long, free parts 9-11 mm long, 5-7 mm broad and thick; epidermis with large bladder cells with thickened outer walls, cells 0.075-0.1 mm, ± circular to polygonal, bladder cells with flat top covered with many antler-like protrusions, especially along the margin of the top. Flowers solitary, terminal, petaloid staminodes white, filamentous staminodes absent or very few, filaments white, 30-35 mm diam., pedicels c. 5 mm long; sepals number unknown, succulent; flowering time August to September. Fruit a hygrochastic capsule, old capsules gray, capsule as seen from above ± circular, 5-8 mm diam., top almost flat, rims very low, lower part funnel-shaped; locules 7 or 8; borderline between expanding keels and expanding sheet distinct, keels broad and only slightly diverging; covering membranes thin, and without any additional closing devices, covering 1/4 of the locule, closing body absent, valve wings broad. Seeds ochre, almost smooth, c. 0.7 x 0.5 mm.
            sourceIds:
              - sanbi_18728_0
            locator: "SANBI/WFO archive Morphology row 103824; source 18728.0; publication: Klak, C; Hanacek, P; Bruyns, PV. 2018. A recircumscription of Jacobsenia (Aizoaceae): Re-instating Drosantehmopsis, with two new quartz-endemics from Namaqualand, South Africa and sinking Knersia. S. African J. Bot. 116: 67 - 81. [https://doi.org/10.1016/j.sajb.2018.02.402]. [Copyright held by the South African Association of Botanists (2018); http://www.sciencedirect.com/science/journal/02546299]. [All rights reserved]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: In D. kwaganapensis and D. vaginata the antlerlike protrusions on the epidermal surface are particularly prominent and they are branched, whereas they are mostly unbranched and shorter in the other two species of Drosanthemopsis. Drosanthemopsis kwaganapensis is the only species with an erect, densely branched habit, combined with thick, dirty green, succulent leaves. The epithet ‘kwaganapensis’ refers to the type locality at the Kwaganap River in Namaqualand.
