        usage:
          title: Palicourea chiriquina Standl., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrubs to 3 m tall, the nodal scars circular, prominent. Leaves elliptic, to 7.2 cm long, to 2.2 cm wide, acute at the apex, the acumen ca. 0.5 cm long, cuneate or acute at the base, the costa subplane beneath, the lateral veins 8-9, arcuate, reaching to the margin, drying somewhat red, the margin delicately revolute, chartaceous, drying red black above, brown beneath, glabrous, minutely punctate or rugulose above; petioles slender, ca. 0.5 cm long; stipules connate, to 3 mm long, each part 2-lobed, the lobes linear, shorter than the sheath. Inflorescences terminal, cymose paniculate, to 6 cm long, ca. 5 cm wide, the peduncle ca. 1/2 the length of the inflorescence, terminated by 3 spreading branches terminated by loose clusters of radiately disposed flowers; bracteoles ca. 1 mm long. Flowers with the hypanthium short, the calycine cup ca. 1 mm long, the teeth evanescent, glabrous; corolla white, 5-6 mm long, the tube cylindrical, inflated, the lobes oblong, ca. 2 mm long, obtuse. Fruits not seen.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 11870
