    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous herb, up to 0.55 m high. Outer and inner tepal limbs reflexed. Style branches broad and flat. Crests prominent. Flowers blue-violet with yellow to orange nectar guides on outer tepals.
            textZh: Moraea elliotii Baker 的 SANBI 物种条目记载了植株、叶片和花部形态。
            sourceIds:
              - sanbi_11118_0
            locator: Strelitzia 6; archive Morphology row 2787, source 11118.0
            placeTimeScope: Regional species account published 1997; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
          - text: With relatively small flowers, Moraea elliotii currently includes plants from the Mpumalanga highveld with a linear leaf inserted high up on the stem but not immediately under the inflorescence, as well as those with a more-or-less basal leaf. The leaf is channelled but sometimes with margins tightly inrolled and appearing subterete or terete (the type of the synonym M. juncifolia). Plants from Gauteng, Mpumalanga and Eswatini mostly flower from December to March, whereas those from the KwaZulu-Natal Midlands generally flower in late spring, and those in the Eastern Cape may bloom as early as September. The flowers are small, with outer tepals 20-30 mm long and those from the north of its range are blue to violet with yellow-orange nectar guides and have inner tepals with half reflexed limbs. Populations from KwaZulu-Natal and Eastern Cape are variable in colour, sometimes pale violet to lilac or even white, often with the inner tepals spreading almost from the base and twisted through 90º and the filaments united for only ± 1 mm, vs 2.0-2.5 mm elsewhere. There appear, however, to be no consistent floral differences between the southern and northern populations and this makes formal recognition of subspecies impossible. Populations of Moraea elliotii with the leaf inserted high on the stem can be confused with M. natalensis, but the latter is a more slender plant usually with smaller flowers, and the leaf is inserted higher on the stem at the base of the crowded branches.
            textZh: SANBI 条目提供了 Moraea elliotii Baker 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: Strelitzia 42; archive Diagnostic row 94203, source 18638.0
            placeTimeScope: Regional species account published 2020; the archive excerpt does not give a dated sampling frame or population frequency.
