    facets:
      morphology:
        status: not-assessed
      lifeHistory:
        status: not-assessed
      ecology:
        status: partially-supported
        claims:
          - text: "At the wild Grande Pescadores Island colony, the study's pre-spill (2018) and post-spill (2022) food-bolus analysis identified Peruvian anchoveta (Engraulis ringens) as the predominant prey in both periods. Table 1 reports numerical proportions of 99.736% before and 99.168% after the spill, and occurrence proportions of 98.165% and 99.881%, respectively. The post-spill denominator is inconsistent within the article: Methods and Results report 998 boluses, whereas Table 1 reports N = 837; the percentages are transcribed as printed and not recalculated. This comparison does not establish a causal oil-spill effect."
            sourceIds:
              - estrada2025guanay
            locator: SciELO Methods §§2.3 and 2.6 (lines 126-138); Results (lines 154-159); Table 1 (lines 160-172); Discussion on limits (lines 175-177).
            placeTimeScope: Grande Pescadores Island, Peru (-11.775277 S, -77.264166 W), about 7 km offshore from the coast near Ancon. The pre-spill sample was collected in November 2018; post-spill collections occurred in 2022 between August and November, 7-11 months after the January 2022 spill.
            lifeStatus: Regurgitated food boluses collected at a wild breeding colony; individual birds and their age or sex were not identified.
            originalLanguage: es
        gaps:
          - "The post-spill sample total conflicts within the article: the Methods and Results state 998 boluses, while Table 1 states N = 837; Table 2 monthly counts also do not exactly reconcile with 998."
          - Only one pre-spill collection month and three post-spill collection months from one colony were compared, and no samples were collected immediately after the spill; the design does not establish causality.
          - Morphology, life history, broader ecology, evolution, distribution, fossils, conservation, systematic search, remain unassessed.
      evolution:
        status: not-assessed
      distribution:
        status: not-assessed
      fossil:
        status: not-assessed
      conservation:
        status: not-assessed
