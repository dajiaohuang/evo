  claims:
    - subjectId: taxon:holostei
      claimKind: scientific
      claimType: topology
      statement: A multilocus, fossil-calibrated ray-finned-fish tree recovers living gars and bowfin together as Holostei. The result supports sampled holostean topology; its node age is model-dependent and not a direct fossil origin date.
      confidence: medium
      confidenceRationale: Confidence is medium because the cited primary study directly supports the bounded topology statement at the supplied locator. The confidence does not extend beyond the result supports sampled holostean topology; its node age is model-dependent and not a direct fossil origin date.
      referenceLinks:
        - relation: supports
          referenceId: near-2012-ray-fin-phylogeny
          pages: 13698–13703
          figure: Figures 1–3; supplementary chronogram
          quoteLocator: Multilocus sampling; fossil calibrations; phylogeny and divergence times
    - subjectId: taxon:holostei
      claimKind: scientific
      claimType: divergence-time
      statement: The 2024 analysis estimated crown Holostei between 303.82 and 271.33 Ma; this is a molecular-clock interval, not a fossil first appearance or a claim that sampled taxa span every intervening age.
      confidence: medium
      confidenceRationale: "Crown Holostei molecular-clock interval: the cited primary study or systematic review directly supports the stated sample, calibration or withholding boundary at the supplied locator. Confidence is medium and does not extend to a global FAD, LAD, direct ancestor or unsampled interval."
      referenceLinks:
        - relation: supports
          referenceId: qi-2024-teleost-wgd-dating
          pages: Article evae128
          figure: Figure 1; Supplementary Table S1
          quoteLocator: "Results: Holostei 303.82–271.33 Ma"
  claim-rationales.zh:
    - 置信度为中：所引主研究在给定页码、图版或章节定位器处直接支持这一受限的拓扑表述；置信度不外推到文中明确排除的全群起源、全球首现、直接祖先或精确端点。
    - Crown Holostei molecular-clock interval：所引一手研究或高质量系统综述在给定页码、图表或章节处直接支持此处的样本、校准或暂缓边界。置信度为中等。该置信度不外推至全球首现、全球末现、直接祖先或未采样区间。
  claim-statements.zh:
    - 多位点、化石校准的辐鳍鱼树把现生雀鳝与弓鳍鱼共同恢复为全骨类。该结果支持抽样的全骨类拓扑；其节点年龄依赖模型，不是直接的化石起源日期。
    - 2024 年分析把全骨鱼冠群估计在 3.0382–2.7133 亿年前；这是分子钟区间，不是化石首现，也不表示样本覆盖其间每个时代。
