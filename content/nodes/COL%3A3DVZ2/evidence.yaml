    facets:
      morphology:
        status: partially-supported
        claims:
          - text: "Plants forming compact clumps, stem-forming absent. Leaves very crowded, pressed against each other, more or less erect, ovate-rhomboid in upper half, lowest half of leaves square, sharply keeled at lop. 30-40(-50) x 15-20(-25) mm, toothed: teeth on leaf margins (5-)9-10(-12) with long bristles, pointed backwards; grey-green, turning to bluish purple, margins and keel whitish; epidermis with numerous clearly visible white dots, confluent into larger flecks, often arranged in curved lines towards keel, minute while dots absent. Flowers with 100-120 petals, linear, acute, 1.0-1.25 mm wide; stamens 250-300. Nectaries brownish, surface often 3-ribbed. Fruit stalk absent or (0.5-)2.5-3.8 x 3.0-4.0 mm, 0.9-1.6 mm thick. Fruits coming loose rather easily, top of fruit flattened to slightly spherical. 7.0-9.5 x 8.6-10.0(-12.0) and (6-)8-9 mm thick. Seeds 1.15-1.50 x 1.0-1.25 mm."
            sourceIds:
              - sanbi_5640_0
            locator: "SANBI/WFO archive Morphology row 81816; source 5640.0; publication: Groen, LE; Van der Maesen, LJG. 1999. Revision of the genus Faucaria (Ruschioideae: Aizoaceae) in South Africa. Bothalia 29(1): 35 - 58. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Some populations of F. felina subsp. britteniae at Hell's Poort, 35 km west of Grahamstown and near Fort Beaufort, look like F. tigrina because of the numerous large flecks on the leaves and the long bristles. However, the leaves of F. felina subsp. britteniae are larger, not pressed against each other and the number of teeth is reduced to 5 or 6. Forma splendens published by Jacobsen & Rowley in 1955, was recognised on the basis of its reddish leaves, typical for some populations. F. tigrina 'Superba' is a superfluous synonym, used in seed catalogues to differentiate good plants and seed, reintroduced by Mrs Dudley Ryder, from the usually inferior hybrids named F. tigrina.
