      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, 10-40 cm, stem with several short branches. Leaves lanceolate, hairy. Flowers zygomorphic, mauve with pale yellow markings, bracts papery, inner bracts divided to base, ovary smooth.
            textZh: Babiana scariosa G.J.Lewis 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 6716; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Readily recognised by the blue flowers with white to yellow markings, a perianth tube of intermediate length, mostly 12-15 mm (but up to 20 mm in the type) combined with distinctive dry, brown to translucent floral bracts. Plants can be relatively tall for the genus, up to 500 or even 800 mm but plants from the Bokkeveld Plateau are consistently shorter, mostly ± 300 mm tall. Babiana scariosa is most closely allied to acaulescent B. papyracea, which has a radially symmetrical, short-tubed flower, but similar dry, membranous floral bracts. It may also be related to B. spathacea of the western Karoo, which also has similar floral bracts, but the flowers of this species are creamy beige with red markings on the lower tepals and have an elongate perianth tube. Hybrids between this species and B. scariosa may be found where the two co-occur on the Bokkeveld Plateau south of Nieuwoudtville.
            textZh: SANBI 条目提供了 Babiana scariosa G.J.Lewis 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 94971; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
