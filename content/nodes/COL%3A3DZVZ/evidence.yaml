    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, 10-40 cm. Leaves lanceolate, obtuse, in a tight fan, margins thickened and crisped. Flowers mostly blue to violet, sometimes creamy yellow speckled dark blue, tepal margins buff to light brown, tepal claws narrow, forming a deep cup, tips attenuate and coiled, anther lobes divergent, ovary beaked.
            textZh: Ferraria uncinata Sweet 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 7489; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Typically with a tufted habit, Ferraria uncinata has flowers with a narrow floral cup 8-12 mm deep, the tepals either deep blue to violet edged with dull yellow-green or in the north of its range buff-coloured to dull yellow with violet speckles and yellow-brown margins. The leaf margins are thickened with at least the edges of the lower leaves crisped and undulate. The margin surface itself is smooth. The hooked tips of the leaves and spathes, the character for which the species was named (uncinatus = Latin for hooked), is frequent, though not constant, not only in F. uncinata but in several other species of the genus. The yellow-flowered central Namaqualand species, Ferraria macrochlamys has at times been included in F. uncinata, but is now understood to be a separate species differing not only in the pale yellow flower colour but in the fine structure of the thickened leaf margins, which resemble those of F. uncinata only superficially. In F. macrochlamys subsp. macrochlamys the marginal thickenings are usually densely ciliate and irregularly serrulate or crenulate, as well as sometimes being slightly crisped. The tepal limbs of F. uncinata are at least 1.5 times as long as the claws and up to three times as long in the northern populations, and the tepal apices are unusually extended. In F. macrochlamys the tepal limbs are slightly shorter to ± 1.5 times as long as the claws and are less prominently attenuate.
            textZh: SANBI 条目提供了 Ferraria uncinata Sweet 的鉴别特征。
