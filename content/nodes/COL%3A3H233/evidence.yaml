          originalSourceText: Inflorescences terminal, (8-)17-27 cm long with peduncles 2-3 cm long or seem- ingly sessile and subtended by regular-sized leaves, the cymules 1-5-flowered, sessile, the bracts subulate, 3-5 mm long. Flowers with the hypanthium com- pressed rotund, ca. 1.5 mm long, the calycine lobes 4, oblong, Sa. 2 mm long, usually curved, ciliate, with 1 to several rotund glands at the juncti6n of the lobes; corolla white, the tube to 2 cm long, strigose, the lobes 4, obtuse,, often as long as the tube; stamens 4, not exserted; ovarian disc pulvinate and bearing a few hairs, the style with the 4 stigmas included. Fruits tetracoccus, to 1 cm in diam. with white flesh persisting, hirsute, drying white ca. 3 mm in diam.; seeds angular, honeycomb reticulate.
