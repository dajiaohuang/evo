        claims:
          - text: Densely leafy shrub to 50 cm, with branches pubescent, mainly in decurrent lines. Leaves tufted, lanceolate, minutely puberulous. Flowers in small heads forming compact, narrow panicles, mauve or white.
            sourceIds:
              - sanbi_14444_0
            locator: "SANBI/WFO archive Morphology row 6079; source 14444.0; publication: Manning, JC; Goldblatt, P. 2012. Scrophulariaceae: Selago L. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 754 - 761. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: The species is very closely allied to S. canescens and S. villicaulis, from both of which it can be distinguished by its broader leaves. It is further distinguished from S. villicaulis by its shorter calyx and corolla tube. Selago burchellii and S. villicaulis are wholly sympatric and their areas lie within that of S. canescens.
