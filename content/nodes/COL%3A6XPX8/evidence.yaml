      morphology:
        status: partially-supported
        claims:
          - text: Plants erect, usually slender; stems glabrous, (140-) 240-400 (-550) mm tall; leaves 2, rarely 3, spreading near the ground, lamina ovate to elliptic. Inflorescences dense and slender, (8-) 15-40 (-85) -flowered; bracts fully deflexed, 2-3 times the length of the 4-9 mm long, rather stout ovary. Flowers borne close to the stem, perianth white with bright purple-red to brownish red blotches and lines on the sepals, petals and inside of lip. Sepals 6-10 mm long, c. xli fused to petals and lip, joindy often forming a shallow sac. Lip spurs half the length of the ovary, 3-12 mm long. Viscidia terminal or rarely subterminal, semi-orbicular; stigma flap broadly semi-orbicular, c. 1 mm long; rostellum obtuse, c. 1 mm long.
