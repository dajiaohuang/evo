  claims:
    - subjectId: event:microraptor-wind-tunnel-model
      claimKind: scientific
      claimType: event-mechanism
      statement: Scaled physical-model wind-tunnel tests found stable, high-drag gliding at high lift coefficients and limited performance differences among tested hindlimb configurations; these are model outputs, not observed Microraptor behaviour.
      confidence: medium
      confidenceRationale: Measured forces from a disclosed physical model provide reproducible functional evidence. Fossil distortion, reconstructed geometry, scaling and absent living behaviour limit extrapolation.
      referenceLinks:
        - referenceId: dyke-2013-microraptor-wind-tunnel
          relation: supports
          pages: "2489"
          figure: Figures 1–5; Supplementary Methods
          quoteLocator: Model design; Wind-tunnel experiments; Results
  claim-rationales.zh:
    - 公开实体模型测得的力提供可复现实验功能证据；化石变形、复原几何、尺度和缺失的现生行为限制外推。
  claim-statements.zh:
    - 缩比实体模型的风洞试验在高升力系数下测得稳定且高阻力的滑翔，不同后肢构型间表现差异有限；这些是模型输出，并非直接观察到的小盗龙行为。
