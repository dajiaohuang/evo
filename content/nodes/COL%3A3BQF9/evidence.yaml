    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Tree usually to 75 m, recorded to 100 m. Bark rough up to 15 m on trunk, smooth, white or grey-green above, often shedding in strips. Adult leaves lanceolate or broadly lanceolate; lamina 9-14 cm long, 1.6-2.7 cm wide; petiole channelled, 12-22 mm long. Peduncle angular, 5-13 mm long; pedicels 2-4 mm long. Operculum conical, 2-3 mm long, 3-4 mm wide; hypanthium obconical, c. 3 mm long, 3-4 mm wide. Fruits 5-9 mm long, 4-7 mm wide.
            sourceIds:
