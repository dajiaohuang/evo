            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: A very tall tree with rough fibrous bark to about halfway up trunk, then smooth, white or grey-green bark above, with umbels paired in leaf axils.
