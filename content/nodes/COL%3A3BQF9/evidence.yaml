            locator: "SANBI/WFO archive Morphology row 76353; source 5196.0; publication: Chippendale, GM. 1988. Eucalyptus, Fl. Australia 19: 1 - 448. Australian Govt Publishing Service, Canberra. [All rights reserved]"
