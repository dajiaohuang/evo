          - text: In Field 2 of a soybean field experiment in Goiás, Brazil, during the 2019/2020 summer crop, Table 4 reports grain productivity of 3,440.63 ± 30.80 kg/ha for the control and 4,007.29 ± 99.71 kg/ha for the SAF9 rhizobacteria treatment. These are the reported means and variation for that field, season, and treatment comparison; they do not establish yield effects across cultivars, soils, regions, or seasons.
