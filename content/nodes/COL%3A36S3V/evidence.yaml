    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Erect terrestrial herb 250-350 mm tall. Leaves 6-8, slightly spreading at 5-15° from axis, rigid, conduplicate, linear-lanceolate, (56-)80-90(-105) mm long x 1.5-2.8 mm wide, 3-5 mm wide when flattened, with three main veins, veins and margins translucent, light straw-coloured. Inflorescence compact, subsecund, 55-75 mm long x 30-35 mm wide, 5-13-flowered. Bracts 16-28 mm long x 4.5-5 mm wide, acute to acuminate, pale maroon-pink, scarious at anthesis. Ovary green, tinged reddish, obliquely patent, ±15 mm long. Flowers white often suffused pale pink, lightly and randomly speckled violet, scent sweet-soapy; 10 mm wide, 5-8 mm tall. Median sepal white flushed pale pink along main vein, finely speckled violet, oblong, shallowly canaliculate, rounded, 10-13(-15) mm long x 9-11 mm wide, lateral lobes recurved. Spur white, suffused pink dorsally, 8-10 mm long x 1 mm wide medially, patent, gently decurved to ± straight, narrowly funnel shaped, nectariferous. Lateral sepals white, flushed pale pink, randomly speckled violet, porrect, ± parallel, oblong, 11-14 mm long x 6-8 mm wide, subacute, apiculate, apiculus (0.5-)1-2 mm long. Petals white, translucent, variously marked violet apically (rarely pure white), erect next to the rostellum, narrowly oblong, subfalcate, variably trilobed distally, 4-6 mm long x ±2 mm wide, anticous basal lobe ±c. 1 mm in diameter. Lip white, randomly speckled violet, rarely unspotted, lorate to very narrowly spathulate, 10-11 mm long x 2-3 mm wide, apex acute to obtuse, slightly decurved, margins ± revolute. Anther purple-brown, horizontal ±1.5 mm long. Stigma white, equally tripulvinate, 1.5 mm in diameter. Rostellum lateral lobes square, central lobe vestigial.
