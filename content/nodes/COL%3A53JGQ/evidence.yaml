        usage:
          title: Swartzia simplex (Sw.) Spreng., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Trees 15 In. tall, upper branches glabrous, prominently lenticellate-dotted. Leaves glabrous, 1- to 5-foliolate; stipules linear, 1-5 mm. long; petiole narrowly obsagittate-winged, 0.5-3 cm. long, gross and terete near the axil, wing expanded and auriculate at insertion of petiolule(s) ; rachis, if present, similarly alate and more prominently so, wing at juncture of terminal leaflet 1.5-3 mm. wide, auricled; leaflets elliptic, abruptly acute or bluntly acuminate apically, cuneate to subobtuse basally, membranaceous or submembranaceous, prominently reticulate-veined; lateral leaflets (if present) usually about 4-8 cm. long and 2-5 cm. broad; terminal leaflet 6-20 cm. long and 3-7 cm. broad; petiolules 2 mm. or less long, terete. In- florescence 3- to 8-flowered, bracteate, axillary or (less often) terminal on upper branchlets; bracts bidentate, dentae linear-lanceolate, about 1 mm. long; peduncles 1-6 cm. long, subterete, lightly pubescent; pedicels glabrous, 0.5-1.5 cm. long; buds globose, up to 8 mm. in diameter. Flowers 1-petalate, petal yellow, cordate- suborbicular, about 23 mm. wide; calyx splitting into 3-4 irregularly ovate sec- tions up to 1 cm. long, scurfy within, glabrous without; stamens many; anthers bilocular, basally versatile, larger ones about 2 mm. long, with conspicuous dark connective; filaments glabrous, about 10 of them grosser and longer than the others, up to 2 cm. long; ovary stipitate, stipe 4-7 mm. long, up to 13-ovulate;
