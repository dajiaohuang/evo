  claims:
    - subjectId: event:early-silurian-qianodus-tooth-whorls
      claimKind: scientific
      claimType: fossil-range
      statement: Twenty-three isolated Qianodus duplicis tooth whorls, including holotype IVPP V26641, occur in the late Aeronian Ozarkodina guizhouensis biozone of the Rongxi Formation at approximately 439 Ma and provide direct evidence of jawed-vertebrate dentition; they support a stem-chondrichthyan occurrence, not a crown-shark body, the origin of jaws or a global FAD.
      confidence: medium
      confidenceRationale: The primary description directly documents the accessioned tooth whorls, histology, developmental sequence and conodont-zone age. Medium confidence preserves the absence of an articulated body or jaw, the restricted dental-character phylogeny and the inability to assign co-occurring scales and spines to this taxon.
      referenceLinks:
        - relation: supports
          referenceId: andreev-2022-qianodus
          pages: 964–968, especially p. 965
          figure: Figures 1c–f and 2a,f; Extended Data Figures 1–5
          quoteLocator: "Systematic palaeontology; tooth-whorl development and histology; Supplementary Information: Geological setting and biostratigraphy"
  claim-rationales.zh:
    - 一手描述直接记录了有编号的牙旋、组织学、生长序列和牙形石带年代。中等置信度保留了没有关节相连躯体或颌、系统分析主要依赖齿列性状以及共存鳞片与棘刺无法归入该类群的边界。
  claim-statements.zh:
    - 包括正模 IVPP V26641 在内的 23 件 Qianodus duplicis 孤立牙旋，产自融溪组晚埃隆期 Ozarkodina guizhouensis 牙形石带，年代约 439 Ma，构成有颌脊椎动物齿列的直接证据；它们支持软骨鱼干群出现记录，而不是冠群鲨类躯体、颌的起源时刻或全球首现。
