          - text: Related to K. baurii, but differs in the broader leaves which overtop the scape at the flowering stage, and the tapering raceme. The tapering raceme and the broader, rounded bracts distinguish K. latifolia from the next species, K. rigidifolia, which is restricted to Mpumalanga.
