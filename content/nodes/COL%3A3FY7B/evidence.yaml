          - text: Bulbous geophyte, ± 70 mm tall, occasionally clumped. Leaves 5-15, dry at flowering, broadly lanceolate, prostrate, occasionally upturned at apex, flaccid to subsucculent, glabrous or under surface occasionally sparsely hairy, green, margin minutely papillate. Flower salver-shaped, white to delicate pink. Fruit succulent, yellow tipped with red, aromatic.
