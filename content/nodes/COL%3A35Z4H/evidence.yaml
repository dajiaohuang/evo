        metadataVariant: 0
        usage:
          title: Didymopanax morototoni (Aubl.) Decne. & Planch., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Trees to 25 m. tall, the foliage and inflorescences often clustered at the summit. Leaves palmately compound; leaflets 7-12, the blades coriaceous, more than 2 1/2 times as long as the petiolules, more than twice as long as broad, oblong or oblong- oblanceolate, 8-45 cm. long, 3-19 cm. broad, long-acuminate at the apex, rounded to subcordate at the base, entire, glabrous above, ferrugineous-sericeous below, the costa and primary lateral veins prominent; petioles to 1 m. long, terete, the ligule to 1 cm. long, the petiolules 3-14 cm. long, puberulent or glabrous. Inflorescence with umbels racemosely arranged in a terminal compound-panicle, densely canescent-sericeous throughout, the primary peduncle 3-15 cm. long, the primary rhachis 6-30 cm. long, the secondary peduncles 7-15, 1-3 cm. long, the secondary rhachises 2-12 cm. long, subtended by an oblong bract to 5 mm. long, the floriferous peduncles 1.0-2.5 cm. long, subtended by a small bract, 2-4 times bracteate along its length; pedicels 2-5 mm. long. Flowers 7-15 per umbel; calyx 1.0-1.5 mm. long, the lobes extremely short; petals oblong, 1.5-2.5 mm. long, 1.0-1.5 mm. broad, glabrous within, the midrib prominent; filaments about 0.75 mm. long, the anthers oblong, 1.0-1.5 mm. long, about 0.75 mm. broad; disc pubescent; styles 2, free, 0.5-1.0 mm. long, erect, spreading in fruit. Fruit transversely oblong, 4-6 mm. long, 7-10 mm. broad, coriaceous.
          originalLanguage: en
          sourceField: general
