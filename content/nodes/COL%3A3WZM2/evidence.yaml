        usage:
          title: Macleania epiphytica A.C.Sm., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Epiphytic shrub 0.5-1 m tall, vegetatively glabrous throughout; branchlets terete. Leaf blades drying coriaceous, oblong elliptic to ovate, 5-8(-10.5) cm long, 2-3(-5) cm wide, basally rounded or broadly obtuse, apically acute to rounded, entire and with a thickened ridgelike border, 5-plinerved, the veins almost plane to moderately prominent above and slightly elevated beneath, the midvein prominently elevated beneath, the veinlets inconspicuous; petioles thick, drying corrugated, 4-8 mm long. Inflorescences axillary, usually in the axils of the upper leaves, fasciculate or obscurely racemose, 2-4-flowered; pedicels stout, 5-11 mm long, bracts minute, triangular to deltoid, 0.5-1.0 mm long, bracteoles 2, papery, ovate to deltoid, acute, 0.6-1.2 mm long borne at or a little above the middle. Flowers with the hypanthium articulate with the pedicel, prismatic to cylindric at anthesis, 3-5 mm long and distinctly 5-angled, glabrous; calyx limb suberect and about 2 mm high including the lobes, the lobes 0.5-1 mm long, triangular to broadly deltoid with acute to rounded sinuses; corolla tube thinly fleshy, cylindrical at anthesis, glabrous, 17-18 mm long, basally 3-5 mm in diameter, slightly contracted apically, bright red to scarlet, the lobes 5, deltoid to narrowly oblong, acute, 1.5-3 mm long, dark green, in- ternally whitish puberulent; stamens 10, the filaments membranaceous, ca. 3 mm long, distinct, the sacs 4-4.5 mm long with a single rigid tubule ca. 3 mm long opening by an oval cleft 2.5 mm long; style about as long as the corolla.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 4200
