      ecology:
        status: partially-supported
        claims:
          - text: It grows with other succulent plants on rugged slopes at altitudes of 600 to 800 m, usually in humus rich pockets amongst stones under low Karoo scrub as solitary plants, but it has also been found to form small clusters. In its distribution area the annual summer rainfall does not exceed 120 mm. H. granulata grows in a firm hard soil with pH 6.
