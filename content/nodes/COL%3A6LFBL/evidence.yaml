    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants acaulescent, sometimes caulescent, about 30 to 40 mm diam., up to 9 cm high. Leaves about 15, 20 to 30 mm long, 10 to 15 mm broad, the young erect, the old ascending, somewhat spreading, ovate-lanceolate, short tapering, grey-green or reddish-brown; upper surface concave, smooth, not pellucid, with a few indistinct parallel lines; lower surface convex, with grey-green tubercles arranged in transverse rows; margins acute below, rounded near the apex of the leaf, tubercled. Inflorescence about 28 cm tall; peduncle simple, terete, about 2 mm diam., 21 cm long, bracteate; sterile bracts membranous, ovate, abruptly long acuminate, about 20 mm long, erect, keeled; raceme about 7 cm long, lax, with 7 or 8 spirally arranged flowers and buds, 2 open simultaneously; floral bracts membranous, 4 mm long, deltoid, acute, keeled with dark brown veins, clasping the pedicels, (equal in length to the pedicels); pedicels 4 mm long, 2.5 mm diam., light green, erect; perianth pinkish-white with brown keels to the segments, 13 mm long, compressed at base, funnel-shaped, tube more or less 3.5 mm across, constricted to 2.5 mm above, straight; segments not free to the base, limb 2 lipped; posterior segments little recurved, white, not spreading, with broad brown veins; exterior part recurved, spreading, white with brown veins; stamens 6 of two lengths, 5 and 6 mm long, inserted within the perianth tube; ovary 2.5 mm long, 1.25 mm diam., green; style 2.5 mm long, straight, light green, capitate.
