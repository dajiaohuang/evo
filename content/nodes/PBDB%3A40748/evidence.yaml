  claims:
    - subjectId: taxon:adapiformes
      claimKind: scientific
      claimType: taxonomy
      statement: Adapiformes is reviewed among early euprimate hypotheses using dental, cranial and postcranial evidence, but its relationship to living strepsirrhines and anthropoids varies among analyses; it is not presented as one direct ancestor lineage.
      confidence: medium
      confidenceRationale: The systematic review explicitly compares competing fossil placements. The statement keeps the group-level claim taxonomic rather than temporal.
      referenceLinks:
        - relation: supports
          referenceId: silcox-lopez-torres-2017-primate-origins
          pages: 113–137
          quoteLocator: Early euprimates; Adapoidea and competing crown-primate hypotheses
    - subjectId: taxon:adapiformes
      claimKind: scientific
      claimType: fossil-range
      statement: adapiformes is displayed at 56–34 Ma only as the review's sampled Eocene record, not an ancestor chain or exact global endpoints. The interval is a source-bounded sample window, not a global FAD, LAD, divergence date, continuous occupancy claim or direct-ancestor assertion.
      confidence: medium
      confidenceRationale: adapiformes uses Silcox, M.T.; López-Torres, S. (2017) because the cited pages and locator expose the sampled taxon, specimen or living sequence set. Confidence is medium and applies only to Eocene adapiform record synthesized by Silcox and López-Torres; broader endpoints remain unclaimed.
      referenceLinks:
        - relation: supports
          referenceId: silcox-lopez-torres-2017-primate-origins
          pages: 113–137
          quoteLocator: Early euprimates; Adapoidea and competing crown-primate hypotheses
        - relation: contextualizes
          referenceId: ics-2026-06
          pages: International Chronostratigraphic Chart v2026/06
          figure: Global chronostratigraphic scale
          quoteLocator: Numerical boundaries for named geological stages used to bound the source sample
  claim-rationales.zh:
    - 系统综述明确比较相互竞争的化石位置；表述把群级主张限定为分类问题，而非时间问题。
    - adapiformes 采用 Silcox, M.T.; López-Torres, S.（2017）的论文，因为所引页码与定位符直接标示了研究采样的类群、标本或现生序列集合。中等置信度仅适用于 Eocene adapiform record synthesized by Silcox and López-Torres；更宽泛端点保持未声明。
  claim-statements.zh:
    - 综述依据牙齿、头骨与头后证据讨论早期真灵长类假说中的 Adapiformes，但其与现生湿鼻类和类人猿类的关系随分析而变；它不被呈现为单一直接祖先谱系。
    - adapiformes 仅以 56–34 Ma 展示为综述采样的始新世记录，而非祖先链或精确全球端点。该区间是来源限定的样本窗口，不是全球首现、末现、分化日期、连续占据或直接祖先断言。
