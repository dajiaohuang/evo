  claims:
    - subjectId: event:cryogenian-sponge-biomarker-debate
      claimKind: scientific
      claimType: taxonomy
      statement: Cryogenian-to-Cambrian 24-isopropylcholestanes are measured compounds, but sampled Rhizaria can synthesize their sterol precursors, so these rocks do not uniquely establish Demospongiae.
      confidence: contested
      confidenceRationale: The geochemical occurrence is replicated, while source-organism attribution is explicitly contradicted by an experimentally sampled alternative source.
      referenceLinks:
        - referenceId: love-2009-sponge-steranes
          relation: supports
          pages: 718–721
          figure: Figures 1–3; Supplementary Tables 1–4
          quoteLocator: MRM sterane measurements and stratigraphic context
