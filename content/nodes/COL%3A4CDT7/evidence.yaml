        claims:
          - text: Hygrophytic, tufted annual to 650 mm tall, geniculate, rarely erect; culm nodes glabrous. Leaf blade 30-150 x 3-8 mm, glabrous or sparsely hairy, hairs not clavate. Inflorescence 25-100 mm long; not exserted beyond uppermost leaf, which is usually about 8 mm wide, often there are two leaves closely associated with the inflorescence; secondary branches usually absent; spikelets adpressed to branches. Spikelet 2.8-3.4(4.0) mm long, acute, glabrous; lower glume up to 1/3 the spikelet length, 0-1-nerved; upper glume (10-)11-14-nerved; lower floret sterile, lemma (9-)10-11-nerved, palea absent or reduced, if reduced then conspicuously shorter than lower lemma; upper lemma pale to yellow, often flushed dark, smooth, shiny; anthers 0.8-1.0 mm long.
