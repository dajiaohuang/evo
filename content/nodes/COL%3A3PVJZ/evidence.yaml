    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Climbing shrub, with white somewhat floccose tomentum. Leaves glabrescent beneath, becoming reticulate owing to dense tomentum on main nerves and veins. Flowers 65-145 mm long. Sepals broadly oblong, 15 mm long. Seeds with long hairs. Flowers white, cream or yellowish with mauve tube.
            sourceIds:
