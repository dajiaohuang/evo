        claims:
          - text: Densely branched annual. Roots thin, fibrous. Leaves distichous, leaf-blades usually sessile to shortly petiolate, lanceolate-elliptic to ovate, 15-45(-65) x 7-20(-25) mm. Inflorescences terminal, ovoid thyrses 20-50 mm long and wide with (2-)5-13 ascending cincinni. Flowers perfect, 6.5-8.5(-9.5) mm wide; pedicels 1.5-3 mm long; sepals puberulous, (1,5-)2-3.5(-3.8) mm long, subapical glands bilobed; paired petals pale lilac, 3.5-5 x 2.7-3.5 mm, medial petal 2-2.5(-2.8) mm long; lateral stamen filaments 2.5-3 mm long, densely bearded; style 1.5-2.3 mm long. Capsules broadly elliptic to obovate-orbicular, bilocular, 3-4 x 2.6-3.75 mm, locules 1-seeded. Seeds elliptic, 2.2-3.1 x 1.5-1.9 mm, testa buff to light brownish orange, foveolate-reticulate.
