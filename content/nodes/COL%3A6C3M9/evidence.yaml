          title: Cunila polyantha Benth., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrubs, scandent or ? erect, to 1.5 m, softly pubescent on the younger branches or glabrous. Leaves ovate to ovate-lanceolate, acute-acuminate, weakly serrulate to subentire, the bases obtuse to ? rounded, to 6 cm long and 3 cm wide, slightly pubescent, more so on the veins beneath; petioles ca 2-5 mm long. Inflorescences verticils, rarely cymose, few and crowded, each ca 5-7-flowered, bracts leaf-like, ca 4-5 mm long, deciduous. Flowers with pedicels 1-3 mm long; bracteoles present, + linear, ca 1.5-2 mm long; calyx tubular, ca 3.5-4 mm long, 5-toothed, the teeth deltoid and ? equal, ca 12-15-veined, pubescent, especially on the inner surface of the teeth; corolla tubular, white, exserted, ca 3-4 mm long, weakly bilabiate, the lips ca 1-1.5 mm long, the upper lip cleft, the lower lip 3-lobed, the middle larger, pubescent near the tip; stamens exserted. mounted
          originalLanguage: en
          sourceField: general
