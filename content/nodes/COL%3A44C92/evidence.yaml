    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous herb, up to 350 mm tall. Plant with 2 or more sheathing bracts present. Tunics of pale straw-coloured fibres. Cataphylls brown, usually broken vertically into irregular strips. Leaf solitary, linear, 3-6 mm wide. Flowers cream to yellow with deeper, yellow nectar guides on outer tepals.
            textZh: Moraea muddii N.E.Br. 的 SANBI 物种条目记载了植株、叶片和花部形态。
            sourceIds:
              - sanbi_11118_0
            locator: Strelitzia 6; archive Morphology row 2792, source 11118.0
            placeTimeScope: Regional species account published 1997; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
          - text: One of the smallest of the yellow-flowered species of subg. Grandiflorae, Moraea muddii stands 150-600 mm tall and is normally a solitary plant with soft, brown, irregularly broken cataphylls. The pale yellow flowers have tepals up to 50 mm long, thus of moderate size for the subgenus. Similar M. unibracteata is also of relatively low stature but has slightly smaller flowers and is easily distinguished by its single sheathing leaf inserted in the upper part of the stem, leaving the lower half visible vs. two or three overlapping sheathing leaves in M. muddii. Plants from Eastern Cape flowering somewhat later in the season and currently included in M. muddii probably represent a separate subspecies or even species but too little is known about them to permit an informed decision about their status. The leaves stand out in having a V-shaped keel instead of the rounded keel elsewhere in subg. Grandiflorae.
            textZh: SANBI 条目提供了 Moraea muddii N.E.Br. 的鉴别特征。
