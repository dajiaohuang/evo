      claimType: topology
      statement: New myxozoan genomes and phylogenomic tests place the sampled parasites within Cnidaria and associate extreme body reduction with genome reduction; this does not identify their exact ancestor or origin time.
      confidence: high
      confidenceRationale: Genome-scale comparisons robustly support cnidarian placement for the sampled taxa, while exact sister relationships and historical timing remain less certain.
      referenceLinks:
        - referenceId: chang-2015-myxozoa
