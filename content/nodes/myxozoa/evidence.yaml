    - subjectId: taxon:myxozoa
      claimKind: scientific
      claimType: fossil-range
      statement: "Myxozoa has no supported scalar temporal range in the cited evidence: phylogenomics resolves a cnidarian placement and genome reduction but provides no fossil or calibrated origin boundary, so the former 0–0 placeholder is withheld."
      confidence: low
      confidenceRationale: Chang et al. (2015) directly supports topology and genomic reduction, not temporal endpoints. Low confidence prevents a living molecular sample from being misrepresented as a zero-duration range.
      referenceLinks:
        - relation: supports
          referenceId: chang-2015-myxozoa
          pages: 14912–14917
          figure: Figures 1–4
          quoteLocator: Phylogenomic and genome-reduction analyses
  claim-rationales.zh:
    - 基因组尺度比较稳健支持取样类群的刺胞动物位置，但确切姊妹关系和历史年代仍较不确定。
    - Chang 等（2015）直接支持拓扑与基因组缩减，而不支持时间端点。低置信度避免把现生分子样本误表为零时长范围。
  claim-statements.zh:
    - 新获得的黏体动物基因组和系统基因组检验把取样寄生类群置于刺胞动物内部，并把极端身体简化与基因组缩减联系起来；这不识别其确切祖先或起源时间。
    - 现有引证不支持 Myxozoa 的单一时间范围：系统基因组学解析了其刺胞动物位置与基因组缩减，却未提供化石或校准起源边界，因此旧有 0–0 占位值被暂缓。
