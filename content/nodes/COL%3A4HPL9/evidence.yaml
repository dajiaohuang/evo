      morphology:
        status: partially-supported
        claims:
          - text: Like P. geminatus but petals 3.5-5.0 mm wide and usually cream-coloured with small red spots.
            sourceIds:
              - sanbi_14102_0
            locator: "SANBI/WFO archive Morphology row 9800; source 14102.0; publication: Bruyns, PV. 2012. Apocynaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 331 - 343. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: In the region mentioned above in the Great Karoo, P. comptus is distinctive and easily recognised. Plants form small mounds of compact stems with relatively small flowers which are invariably less than 20 mm broad. The inside of the corolla is covered with fairly long papillae which reach 1 mm in length. It has a white background colour with bold, usually nearly circular, bright red to red-brown spots which occasionally lengthen into broken, transverse bands towards the bases of the lobes. However, to the north of this region and in the south, this distinctness becomes blurred. In some populations north of Beaufort West and near Britstown, the flowers are to some extent intermediate with P. cornutus. They are somewhat on the large side for P. comptus (23 -25 mm in diameter), with narrower corolla lobes as in P. cornutus but have bold spots and relatively long papillae on the interior as in P. comptus. Those around Britstown also have the erect tips of the inner corona lobes which are typical of P. cornutus. Similarly, south of Laingsburg in the vicinity of Rooinek Pass (in the grid squares 3320 BB, BD, 3321 AC), some plants have been collected with distinctly broader corolla lobes and shorter papillae. These still have, however, the characteristic spots on a white background of P. comptus. P. geminatus subsp. geminatus is recorded from the same area (3320 BB, BC) and there appears to be intergradation between the two here. It seems, therefore, that the discreteness of P. comptus as a species is open to question. Meve mentioned that the papillae on the inside of the corolla are the longest in the genus (and reach 1 mm long). However, these papillae also reach 1 mm long in P. cornutus. Thus, even though they may more frequently attain this length in P. comptus, they cannot always be used to separate the two. In the case of P. geminatus, he observed that P. comptus exhibits ‘far-reaching overlaps of habitat’ with P. geminatus, although he also noted that P. comptus is ‘ecologically very well characterised’. This appears to be contradictory and the existence of some intermediates suggests that these statements might not be correct. He also mentioned (probably as evidence that it is a distinct species) that P. comptus is sympatric with P. geminatus subsp. decorus. However, amongst the records that he cited, P. comptus is not found in any quarter-degree square together with subsp. decorus. Therefore this statement is not corroborated by his own data and it is unclear on what it was based.
