  claims:
    - subjectId: taxon:goniatitida
      claimKind: scientific
      claimType: biogeography
      statement: Mississippian Goniatitidae and Entogonitidae material documents a family-level distribution and tests a Lazarus-pattern interpretation within Goniatitida; it is not the order's global history.
      confidence: medium
      confidenceRationale: Described occurrences and explicit comparisons support the regional family-level pattern, while the narrow taxonomic sample blocks order-wide extrapolation.
      referenceLinks:
        - referenceId: korn-2005-goniatitidae
          relation: supports
          pages: 356–365
          quoteLocator: Figures 1–8; occurrence review and biogeographic discussion
    - subjectId: taxon:goniatitida
      claimKind: scientific
      claimType: fossil-range
      statement: Korn et al. describe an early Late Viséan Moroccan ammonoid assemblage within Goniatitida; the atlas conservatively displays the enclosing Viséan interval, 346.7–330.3 Ma, as a study-sample window rather than an order-wide FAD or LAD.
      confidence: medium
      confidenceRationale: The source names the regional assemblage and relative age directly, while the numerical endpoints are conservative ICS stage bounds. Medium confidence does not extend beyond that sampled assemblage.
      referenceLinks:
        - relation: supports
          referenceId: korn-2005-goniatitidae
          pages: 356–365
          figure: Figures 2–8
          quoteLocator: "Abstract: early Late Viséan assemblage; pp. 357–359; systematic descriptions"
        - relation: contextualizes
          referenceId: ics-2026-06
          pages: International Chronostratigraphic Chart v2026/06
          figure: Global chronostratigraphic scale
          quoteLocator: Numerical boundaries for the named stages and periods used to bound the source sample
  claim-rationales.zh:
    - 已描述的出现记录与明确比较支持区域科级格局，但狭窄分类样本阻止目级外推。
    - 来源直接给出区域组合及相对年代，数值端点则是保守的 ICS 阶界限。中等置信度不外推到该取样组合之外。
  claim-statements.zh:
    - 密西西比亚纪 Goniatitidae 与 Entogonitidae 材料记录了棱菊石目内部科级分布并检验“拉撒路”格局解释；它不是整个目的全球历史。
    - Korn 等描述了棱菊石目内一个来自摩洛哥、时代为维宪期晚期早段的菊石组合；图谱保守显示包容它的整个维宪期 3.467–3.303 亿年前，作为研究样本窗口，而非该目的全球首现或末现。
