        usage:
          title: Ardisia hagenii Lundell, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Trees, to 11 m high, the branchlets thick, at first furfuraceous with small appressed ferruginous scales. Leaves large, with thick marginate petioles to 1.5 cm long; leaf blades chartaceous or subcoriaceous, entire, paler and brown beneath, glabrate above, furfuraceous- with appressed scales on the lower surface, lanceolate-oblong or lanceolate-elliptic, 15-23.5 cm long and 6-8 cm wide, abruptly acuminate apically, the acumen acute, narrowed basally, acute and decurrent on the petiole, the costa impressed above, elevated beneath, the primary lateral veins nearly horizontal, prominent beneath, evi- dent but less conspicuous above, reticulate. Inflorescences terminal, bipin- nately paniculate, narrow, to 15 cm long, few-branched, the secondary branches short, spur-like, congested, furfuraceous, the bracts small, scale-like. Flowers 5-merous, glomerate, subsessile; pedicels thick, to 2 mm long; sepals free, indurated, furfuraceous, forming a cupule, fimbriate, depressed ovate-orbic- ular, 2.5-3.5 mm long, asymmetrical, black-punctate with small glands; corolla (in bud) glabrous, the petals indurated, narrowly elliptic, acute, punctate; stamens (in bud) with short filaments, the anthers (in bud) narrowly lance- olate, acute, longitudinally dehiscent; ovary subcylindrical, widest below, the ovules pluriseriate, numerous, the style 3.4 mm long, conspicuously black- punctate with protruding glands.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 8252
