            locator: "SANBI/WFO archive Morphology row 98836; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Recognised by the pale yellow perianth with a large, solid dark brown to black centre, the dark portion concave, partly united filaments and relatively broad, soft-textured leaves 8-15 mm wide. It shares with orange-flowered I. calendulacea corms that produce long, ribbon-like stolons, each bearing a single large cormlet. Closely related I. maculata and I. calendulacea also have filaments partly united and similar dry floral bracts rust-brown in the upper half. The differences between these three species are subtle and poorly preserved specimens lacking corms and their stolons can be difficult to distinguish. When seen alive they are unmistakeable as their flowers differ in colour and shape, as well as in leaf shape and texture. The stolons in I. maculata are short, branched and bear several small cormlets.
