    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants 300-500 mm high. Corm globose, 12-16 mm diam. bearing long horizontal stolons ± 1.5 mm diam., up to 100 mm long, each bearing a large terminal cormlet ± 6 mm diam.; tunics fibrous, mostly oriented vertically, sometimes accumulating. Stem usually unbranched, robust plants sometimes with a node in upper 1/3 bearing a dry, attenuate scale, sheathing only at base, often recurved. Leaves mostly 4, lanceolate, somewhat fleshy and soft-textured, ± 1/2 as long as stem, 8-15 mm wide, uppermost sheathing lower 1/2 of stem, free distally, fleshy and soft-textured. Spike congested, 3- to 7-flowered; bracts brown above, green or becoming white to pale grey below, outer 9-12 mm long, with short acute central tooth and rounded lateral lobes, only central vein developed, inner 2-veined, shortly forked at apex, as long or slightly shorter than outer. Flowers salver-shaped, pale yellow with dark brown to black, shallowly concave centre, unscented; perianth tube 10-13 mm long; tepals ovate, subequal or inner slightly smaller, 21-30 x 8-15 mm. Filaments 3.5-5.0 mm long, united in lower 1/3 (rarely only at base), ± brown below, pale blue or yellow in upper 1/2; anthers ascending, 8-11 mm long, yellow; pollen yellow. Style dividing opposite base of anthers, branches 2.5-4.5 mm long.
            textZh: Ixia fuscocitrina Desf. ex Redouté 的 SANBI 物种条目记录了形态特征。
            sourceIds:
