          - text: Its distinguishing features are the mostly obovate leaves toothed in the upper half and coarsely pubescent on both surfaces, and flowers arranged in the axils of the upper leaves often forming terminal racemes though occasionally the flowers remain axillary rather than racemose. In herbaria, it is sometimes confused with J. kraussiana, but that species is easily distinguished by its elliptic leaves and flowers arranged all along the leafy stems on delicate filiform pedicels. The calyx is larger in J. maritima than in J. kraussiana and the corolla tube mostly longer.
