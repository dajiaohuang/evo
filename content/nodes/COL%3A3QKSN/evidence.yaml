    facets:
      morphology:
        status: partially-supported
        claims:
          - text: "Perennial herb, sometimes shrubby, basal parts not seen, up to c. 700 mm tall, stems erect or ascending, occasionally ± scrambling, glandular-pubescent, hairs up to 0.2-0.5 mm long, very few glistening glands, very leafy. Leaves opposite, alternate upwards, pseudofasciculate, largest primary leaves 12-30 x 5.5-14 mm, obovate or sometimes oblanceolate, rarely ovate, often very obtuse, sometimes subacute, base cuneate tapering into a short petiolar part, margins coarsely toothed in upper half, the larger teeth occasionally 1-toothed, both surfaces glandular-pubescent, hairs up to 0.2-0.25 mm long, glistening glands as well, scattered mainly on lower surface. Flowers solitary in axils of upper leaves, these rapidly smaller upwards, often producing terminal racemes. Pedicels up to 10-35 mm long, mostly ascending at an angle of c. 45°. Calyx tube 0.3-0.4 mm long, lobes 3-4.5 x 0.8-1 mm, oblong-lanceolate, subacute, glandular-puberulous, hairs up to 0.2-0.25 mm long, a few glistening glands as well. Corolla tube 7-10 x 2-2.1 mm in throat, cylindric, abruptly expanded near apex, limb oblique, c. 10-15 mm across lateral lobes, posticous lobes 4.2-8 x 2.44 mm, anticous lobe 4.5-8.8 x 2.3-4.4 mm, all lobes oblong to cuneate-oblong, tips often ± truncate or retuse, glandular-puberulous outside, hairs up to c. 0.2 mm long, glistening glands as well mainly on backs of lobes, broad transverse band of clavate hairs in throat extending briefly onto base of lower lip, all lobes white or mauve, yellow in throat. Stamens: posticous filaments 1-1.2 mm long, anthers 0.7-1 mm, anticous fdaments 0.6-0.8 mm long, anthers 0.5-0.8 mm, all filaments glandular-puberulous. Stigma c. 0.2 mm long. Style 5.2-6 mm. Ovary c. 1 x 0.8 mm. Capsules 3.5-7 x 2.5-3.5 mm, minutely glandular-puberulous, glistening glands as well, often ± confined to the sutures. Seeds c. 0.7-0.9 x 0.5-0.7 mm. It can be found in flower in any month."
            sourceIds:
