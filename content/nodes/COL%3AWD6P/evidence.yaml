        usage:
          title: Clusia longipetiolata Schery, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrub or tree to 10 m tall; adventitious roots elongate. Leaves ovate or ob- ovate, apically rounded, basally cuneate to obtuse, the costa prominent to near the tip, elevated and broad beneath, the lateral venation slightly ascending, par- allel, nearly straight but slightly sinuate, curving at the base and sometimes at the tip, abruptly forming a submarginal vein ca. 1 mm from the margin, stiff, thick, coriaceous; petiole slender, well defined, not winged, 4-8 cm long. Info- rescence terminal, few flowered, dichasial, bracts 3-5 mm long, thick, cucullate; peduncle stout, drying slightly flattened, striate; pedicels 5 mm long or obsolete, expanding upwards. Flowers (Schery) yellowish white, 5-6 mm wide, the two outer calyx lobes basally connate, the inner 5 coriaceous, broadly rotund; petals thin, ovate rotund, ca. 2.5 cm long, 3 cm wide, staminate flowers with the stamens very numerous inserted on a fleshy annulus around the ovary, filaments obsolete, anthers linear, 3-4 mm long, squarish in cross section; ovary (stigmas) forming a flat central disc 5-7 mm across; pistillate flowers with the androecial receptacle cylindrical, 6-7 mm high, surrounding the ovary; ovary 5-carpellate, pyramidal, the stigmas sessile. Fruit not seen.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 3313
