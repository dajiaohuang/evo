    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Robust perennial, 0.3-1.5 m high; sometimes almost woody; culms geniculate, often rambling, rooting at lower nodes. Leaf blade 50-250 x 3-15 mm. Inflorescence a panicle, bearing spikelets on branchlets appressed to primary branches; rachis scabrid; spikelets paired or densely clustered on short secondary branchlets. Spikelets 2.5-3.5 mm long, dorsiventrally compressed, glabrous or occasionally sparsely pubescent, supported on a bead-like swelling; lower glume up to 2 mm long, 1/4-1/2 spikelet length, acute; upper glume acute, not mucronate or awned. Florets 2; lower floret male, palea present, almost as long as lemma; upper floret bisexual, lemma hard, entire, obscurely mucronate; anther 1.0-1.7 mm long. Flowering time Oct.-June.
