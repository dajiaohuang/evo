        usage:
          title: Hamelia calycosa Donn.Sm., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrubs or trees to 10 m tall, the twiglets terete, smooth, glabrous, ultimately puberulent, branching freely, the nodes well spaced. Leaves oblong, often 3-4- nate at the ends of twigs, lanceolate or trapeziform lanceolate, 1.5-11.0 cm long, 0.9-3.5 cm wide, tapering acutely at the apex, acuminate, the acumen ca. 0.7 cm long, acute to cuneate at the base, the costa grooved, plane or prominulous above, the lateral veins 4-7(-9), arcuate, membranous or papyraceous, glabrous above and beneath except occasionally pubescent on the costa beneath, often barbate in the vein axils beneath; petioles slender, 0.8-2.0 cm long, wiry, glabrate; stip- ules subulate, to 2.5 mm long, puberulent. Inflorescences terminal, rarely axil- lary, the scorpioid cymes lax and spreading, the flowers many in 3-4 fascicles; peduncles to 2 cm long, often minutely puberulent, the floral axes with up to 4 flowers, 0.6-4.0 cm long; bracts triangular to subulate, to 2 mm long, glabrous. Flowers secund, the pedicels to 5 mm long; hypanthium oblong, puberulent, the calycine cup scarcely measurable, the lobes oblong, to 1.5 mm long, fleshy, pu- berulent; corolla pale orange or yellow, striped maroon, the tube somewhat in- fundibuliform, 30 mm long, constricted narrowly at the base, the base ca. 1.5 mm wide, ca. 7.5 mm wide in the middle of the tube, ca. 1 cm wide at the mouth, puberulent outside, glabrous within, the lobes ovate, to 6 mm long; stamens 5, the anthers linear oblong, to 2 cm long, ca. 1 mm wide, the connective extended apically as a rotund petaloid appendage, ca. 0.75 mm long, sagittate at the base, the filaments plane, ca. 4 mm long, attached ca. 6 mm from the base of the tube; style to 15 mm long, the stigmas 5, connate into a mass, to 1.5 mm long. Fruits cylindrical, 7-15 mm long, 4-6 mm wide, the ovarian disc conical and truncate; seeds to 1.2 mm long, minutely foveolate.
          originalLanguage: en
          sourceField: general
