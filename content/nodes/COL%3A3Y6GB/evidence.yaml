        usage:
          title: Marila laxiflora Rusby, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrub or tree to 20 m, younger branches densely appressed glandular-pubes- cent, glabrescent, the twigs with brown or yellow-brown latex. Leaves 9-28 cm long, 2-12 cm wide, ovate, oblong, elliptic or elliptic-lanceolate, apically abruptly acuminate, the acumen to 1.5 cm long, basally rounded or acute, densely brown velutinous before unfolding, becoming glabrous, glabrate or sparsely pubescent along the veins beneath, primary veins 10-15 pairs, mostly 1-2 cm apart, ar- cuately anastomosing into a marginal vein; petioles 1-2 cm long, finely pubescent, grooved above. Inflorescence racemose, axillary from mostly older defoliated nodes, puberulent, 1-4 flowers per cm, rachis 12-30 cm long, pedicels 5-8 cm long, 1-2 cm thick at base. Flowers green, fragrant; sepals 6-8 mm long, ovate or elliptic, puberulent, reflexed at anthesis, but erect in fruit; petals 6-9 mm long, oblanceolate to oblanceolate-oblong; stamens numerous, the anthers ca. 1.5 mm long, the appendage filiform; ovary ca. 3 mm long, the style ca. 3 mm long. Fruit a linear, yellow-brown capsule 4-7 cm long; seeds ca. 1 mm long.
          originalLanguage: en
          sourceField: general
