            locator: "SANBI/WFO archive Morphology row 2132; source 11118.0; publication: Herman, PPJ; Retief, E. 1997. Plants of the northern provinces of South Africa: Keys and diagnostic characters. Strelitzia 6: 1 - 681. National Botanical Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Readily distinguished from the other species by the dwarf, compact habit and the narrow, linear, glabrous leaves. The flowers are smaller and, because of the short internodes, appear close together near the centre of the small cushions. The plants are inconspicuous and are easily overlooked except during their short flowering period in spring.
