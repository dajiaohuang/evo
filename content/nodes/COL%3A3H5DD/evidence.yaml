        claims:
          - text: Compact, semiwoody perennial herb. Rootstock thin, woody, branching from base, forming small cushions 70-140 mm in diameter. Leaves crowded, linear, 10-16 x 1 mm, drying black. Filaments minutely pu-berulous below. Flowers pink to rose-red.
            sourceIds:
