    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Shrublets 1-3 m or trees 3-10 m high, evergreen; branchlets rigid, bark greenish-brown, finely wrinkled, ultimate branchlets pubescent with rather coarse spreading hairs, dark brown. Leaves alternate with occasional subopposite pairs, discolorous, coriaceous and stiff, densely ferruginous-pubescent below with rather coarse spreading hairs, pubescent above when young, glabrescent, ovate-lanceolate, ovate or ovate-oblong, occasionally with a few leaves oblong-rotundate, 2-5 cm long and 1-3 cm wide, usually about 4 x 2 cm; base broad, usually distinctly rounded, occasionally subobtuse; apex acute, finely mucronate; secondary nerves and midrib raised below, not raised or only very finely so on upper surface; margin with a narrow cartilaginous thickening, subinvolute, very distinctly undulate, entire or minutely crenulate; petiole 2-5 mm long, pubescent; stipules absent. Inflorescence axillary, densely villous, 2-7-flowered, bracts large, hairy, broadly ovate, caducous; male inflorescence laxer, larger, and flowers with longer pedicels than in the female. Flowers dioecious, white to cream. Male flowers 5-7 mm long. Calyx campanulate, 1.5-2 mm long, hirsute on outside, with the 5-6 lobes cleft about halfway. Corolla urceolate, appressed-hirsute, densely so on the lobes; tube much longer than the short lobes; lobes 5-6, obtuse, about of length 1/6 of the tube. Stamens 14-20, in two rows, single or 2 together; filaments glabrous, 0.5-2 mm long, flattened; anthers lanceolate 2-3 mm long, apex acute, base subcordate, hairy especially on the connective, dehiscing by longitudinal slits. Ovary rudimentary, hairy, with 2 glabrous linear style branches. Female flowers with calyx and corolla similar to those of the male flowers. Staminodes absent. Ovary globose, densely hispid, 4-celled with a single ovule pendulous from the inner wall in each cell; styles 2, hairy at the base only, glabrous upwards; stigma oblique, crescent-shaped. Fruit sparsely hirsute, glabrescent, fleshy, globose, turning green to yellow to deep red when ripe, 1.2-1.5 cm in diam., usually one-seeded (occasionally 2-3). Seeds 8-10 mm in diam., divided into 3 parts by a groove and two thin curved lines; endosperm flinty, pale grey, somewhat ruminate; embryo slightly curved.
            sourceIds:
              - sanbi_9822_0
            locator: "SANBI/WFO archive Morphology row 48689; source 9822.0; publication: De Winter, B. 1963. Ebenaceae, Fl. S. Africa 26: 54 - 99. Dept. Agric. and Technical Services, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: A very distinct species readily distinguishable from the others when complete material is available. Leafy specimens of some forms of E. crispa var. ovata are, however, distinguishable vegetatively from E. coriacea but the flowers are quite different, the corolla of the former being cleft more than halfway down. Allied to E. tomentosa, of which the leaves are not undulate and elliptic to obovate.
            textZh: SANBI 条目提供了该种的鉴别特征。
            sourceIds:
              - sanbi_9822_0
            locator: "SANBI/WFO archive Diagnostic row 51096; source 9822.0; publication: De Winter, B. 1963. Ebenaceae, Fl. S. Africa 26: 54 - 99. Dept. Agric. and Technical Services, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: This species is very similar to E. crispa subsp. ovata but the leaves of the latter are usually opposite and the fruits are smaller, only about 5 mm in diameter. The corolla tube of E. coriacea is only slightly lobed at the mouth whereas that of E. crispa subsp. ovata is divided into lobes for at least half its length.
            textZh: SANBI 条目提供了该种的鉴别特征。
            sourceIds:
