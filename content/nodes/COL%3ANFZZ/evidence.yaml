        claims:
          - text: Geophyte, up to 250 mm tall. Leaves and inflorescence developing at the same time. Pedicels 100-120 mm long. Leaves generally rough, at least on upper surface, tough. Perianth ± 40 mm long. Flowers deep pink.
            textZh: Brunsvigia natalensis Baker 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_11118_0
            locator: "SANBI/WFO archive Morphology row 819; source identifier 11118.0; cited publication: Herman, PPJ; Retief, E. 1997. Plants of the northern provinces of South Africa: Keys and diagnostic characters. Strelitzia 6: 1 - 681. National Botanical Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: B. natalensis is very closely related to the plants classified as B. radulosa and there will be times when there may be no clear distinction. The time of flowering is generally different, B. natalensis appearing in November or early December whereas B. radulosa is rarely earlier than February and often only comes into flower in March or even as late as April. B. natalensis is normally smaller in all respects, but size alone is not an infallible distinction.
            textZh: SANBI 条目提供了 Brunsvigia natalensis Baker 的鉴别特征。
