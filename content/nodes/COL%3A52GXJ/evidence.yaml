        usage:
          title: Stevia lucida Lag., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrubs to 2 m tall with few to many branches, with stems, leaves, branches of inflorescence and involucral bracts vernicose; stems mostly brown, terete or slightly hexagonal, internodes often short, usually glabrous. Leaves opposite; blades oblong-ovate to lanceolate, to 16 cm long and 5 cm wide, somewhat conduplicate, the base cuneate or rarely subtruncate, the margins regularly serrate or crenate to remotely dentate, the apex shortly to narrowly acute or slightly acuminate, the surfaces densely glandular-punctate, the lower surface pale and more fleshy; the veins pinnate or with lower pair slightly more prominent; petioles to 2 cm--long, wings not obvious. Inflorescence flat-topped, corymbose, with lower branches opposite or alternate, the branches puberulous, the ultimate branches 0-2 mm long. Heads mostly 9-11 mm high; involucral bracts narrowly oblong-elliptical, 5-6 mm long and 0.7-1.5 mm wide, glandular-punctate, the apex usually acute and somewhat scarious; corolla pink, 5-6 mm long, glandular- punctate with hairs on lower parts, the lobes equal, 1.0-1.2 mm long, glabrous. Achenes 3.5-5.5 mm long, hispid, rarely with some glands; pappus a low crown of dentate to entire, united or separate scales, 0.2 mm high, without awns.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 2014
          archiveSourceId: 92FB9C18-5D11-4EED-9EB2-77FF7724FE19
