    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Dioecious, evergreen shrub to 3 m. Leaves trifoliolate, leaflets sessile, oblanceolate, sticky, aromatic. Flowers yellowish. Drupes lens-shaped, shiny.
            sourceIds:
              - sanbi_14073_0
            locator: "SANBI/WFO archive Morphology row 9281; source 14073.0; publication: Moffett, RO. 2012. Anacardiaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 313 - 316. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Rhus undulata changes gradually from an unarmed, divaricate morph with fairly wide leaflets in the south-western Cape to a squarrose, multistemmed, spinous shrub with narrow leaflets in Namaqualand and southern Namibia. Isolated exceptions, such as Schlieben 9054a (B, PRE) with wide leaflets from near Springbok, do however occur. It is sometimes very difficult to separate this species from laccate specimens of the closely allied R. burchellii and R. pallens. R. undulata does, however, consistendy have amphistomatous leaflets, non-revolute margins and paler, slighdy less compressed drupes. It is also a favoured host of the parasite Moquinella rubra (Loranthaceae).
