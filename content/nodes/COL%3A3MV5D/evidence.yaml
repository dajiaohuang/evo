        claims:
          - text: Plants erect, 90-250 mm tall; leaves distant, not petiolate; lower patent, cordate, broadly elliptic, obtuse, finely apiculate, 20-60 x 15-40 mm; upper much reduced, often present only as a sheath. Inflorescences with 1-5 lax flowers, 30-50 mm long; bracts narrowly lanceolate, somewhat shorter than the ovaries. Flowers 20-25 mm in diameter, white with some mauve markings on the petals. Sepals unequal, margins dentate; median lorate, 8 mm long; laterals quadrate-rhomboid, 7-8 mm long. Petals spathulate, erect with the blades curved forwards, claws 7-8 mm long, largely united with the median sepal, blades fan-shaped, shallowly saccate with a callus at the base, finely and deeply fimbriate, to 12 mm long. Lip transversely ellipªtic, pendent, margins fimbriate. Gynostemium short; anther thecae diverging towards the base, 3 mm long; stigma small.
