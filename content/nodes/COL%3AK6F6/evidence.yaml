    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Subcaulescent, cormous geophyte, 2-8 cm. Leaves longer than stem, lanceolate, hairy. Flowers zygomorphic, mauve to blue with yellow markings or entirely dull yellow, fragrant, inner bracts divided to base, ovary smooth.
            textZh: Babiana patula N.E.Br. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 6710; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Distinctive in the relatively small, strongly fragrant flowers, Babiana patula is typically low growing and often has an unusually coloured perianth. While the flowers may be white to creamy yellow, they are more often violet or light mauve to purple with the lower lateral tepals deep yellow and tipped with purple or mauve. The affinities of B. patula seem to lie with the southern Cape B. fourcadei, a taller plant with blue to violet flowers marked with white, a longer perianth tube 20-30 mm long, often a quite different, spicy acrid fragrance, and a completely smooth ovary. The ovary of B. patula, unusual in sect. Babiana but typical of other members of series Patulae, is usually sparsely hairy on in the ribs. The character readily separates it from the superficially similar B. odorata, which also has strongly scented, cream-coloured and yellow flowers, sometimes flushed with mauve, but always has a densely hairy ovary. Babiana patula may also be confused with Babiana ambigua, a typically acaulescent or short plant of sandy habitats. Flowers of B. ambigua are dark blue, rarely mauve, and have white nectar guides. The ovary of B. ambigua, like that of B. patula, is smooth or sparsely hairy on the ribs, but the outstanding difference is that B. ambigua lacks a well-developed fibrous collar around the stem base present in B. patula.
            textZh: SANBI 条目提供了 Babiana patula N.E.Br. 的鉴别特征。
