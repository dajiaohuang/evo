  claims:
    - subjectId: event:taytalura-stem-lepidosaur-skull
      claimKind: scientific
      claimType: topology
      statement: Three-dimensional holotype PVSJ 698 supplies CT-resolved cranial characters recovered as an early-diverging stem lepidosauromorph across the cited analyses; that placement does not make the individual a direct ancestor or establish whole-body anatomy.
      confidence: medium
      confidenceRationale: Preservation and CT observations are strong, and placement was tested under several analytical settings. The claim remains medium because only a skull is known and topology and ancestral-state reconstruction remain model dependent.
      referenceLinks:
        - referenceId: martinez-2021-taytalura
          relation: supports
          pages: 235–238
          figure: Figures 1–2; Extended Data Figures 1–10
          quoteLocator: pp. 235–238, Figs. 1–2 and Extended Data Figs. 1–10; Description, Phylogenetic analyses and Methods
  claim-rationales.zh:
    - 三维保存和 CT 观察较强，且位置在多种分析设置中受检验；仅有头骨且拓扑和祖先状态重建仍依赖模型，因此采用中等置信度。
  claim-statements.zh:
    - 三维保存的正模 PVSJ 698 提供了 CT 解析的头骨性状，并在所引分析中被恢复为早分化的鳞龙形类干群成员；这一位置不使该个体成为直系祖先，也不能建立其全身解剖。
