        usage:
          title: Anredera vesicaria (Lam.) C.F.Gaertn., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Vines, festooning fences and shrubs, glabrous, stems mostly slender, green or purplish; roots tuberous. Leaves alternate, elliptical, slightly succulent, apically acuminate, basally obtuse to cordate, to 6 cm long, the costa with ca. 3 veins alternating on each side, the minor venation obscure; petioles 4-15 mm long. Inflorescences axillary to terminal, erect or somewhat pendant, 3-15 cm long, mostly lax unbranched racemes, the rachis slender, naked for the- first 10 mm, open or appearing somewhat congested in fruit, evenly cylindrical, the flowers mostly blooming at once; pedicels slender, ca. 1 mm long, subtended by a linear bract, the flowers subtended by 2 minute, cucullate, acute often basally connate bracteoles, and by 2 inner, basally accrescent bracteoles which reach more than halfway up the flower bud. Flowers strongly scented, perhaps sometimes uni- sexual, white, calyx 5-parted, the sepals thin, ovate, basally connate; stamens 5, inserted at the base of the calyx lobes, the filaments slender, the anthers oblong, narrow, and curved, basally bifid, dorsifixed; ovary subglobose or ovoid, the stigma short, the styles 3, slightly clavate, entire, emarginate or 2-cleft, papillose. Fruit samaroid, discoid, the 2 inner bracteoles accrescent and enclosing the perianth and sexual parts, forming broad, reticulate, stramineous wings; seed not seen.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 2131
