        claims:
          - text: Cormous geophyte, 25-40 cm. Leaves sword-shaped. Flowers almost actinomorphic, rotate, with unilateral stamens and style, pink to purple, tepals with lower margins transparent.
            textZh: Tritonia squalida (Aiton) Ker Gawl. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 6864; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: One of three closely allied species with almost symmetric, bowl-shaped flowers with more-or-less spathulate tepals and weakly diverging filaments, Tritonia squalida is distinguished by its pale to deep or dusty pink to mauve tepals, the claws with broad hyaline margins. It is separated from orange-flowered T. crocata from shale soils in the same region primarily by flower colour, but it seems that the style also branches slightly lower down and the tepals are never as broad as seen in some plants of T. crocata. The two species have different soil preferences and no intermediates between them have been found in the wild. Putative hybrids between T. squalida and T. deusta have been recorded near Albertinia.
            textZh: SANBI 条目提供了 Tritonia squalida (Aiton) Ker Gawl. 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 94797; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
