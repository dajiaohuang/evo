    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants acaulescent, in a basal rosette which is about 7-10 cm in diam., proliferous from the base, soon caespitose, dark green. Leaves about 25, the young erect, with tips slightly recurved, the old ascending, spreading, about 6 to 7 cm long, up to 20 cm broad, up to 5 mm thick, ovate-lanceolate, very acuminate, often falcate, not shining; upper surface flat to sub-concave, smooth, light green, with some dark green, often interrupted, scarcely or only irregularly anastomosing lines; tower surface dark green, very convex, obtusely and obliquely keeled, with tubercles arranged in often curved or undulate cross rows, or confluent to such cross rows, tubercles dark green, not shining; margins acute, with dark green teeth 1 mm long. Inflorescence about 28 cm tall; peduncle simple, terete, about 2 mm diam., 18 cm long, bracteate; sterile bracts membranous, ovate acuminate, about 5 mm long, erect, keeled; raceme about 10 cm long, lax, with about 10 spirally arranged flowers and buds, 1 to 2 open simultaneously; floral bracts membranous, 3 mm long, deltoid, acute, keeled with reddish veins, clasping the pedicels, (shorter than the pedicels); pedicels 4 mm long, 1 mm diam., grey-green, erect; perianth white with brownish-green keels to the segments, 13 mm long, compressed at base, funnel-shaped, tube more or less 4 mm across, constricted to 3 mm above, straight; segments not free to the base; limb 2 lipped; posterior segments white with green veins, recurved, spreading; exterior part recurved, spreading, white with fine green veins; stamens 6 of two lengths 9 and 10 mm diam., green; style 4 mm long, straight, capitate.
