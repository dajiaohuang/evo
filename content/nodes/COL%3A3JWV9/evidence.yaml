      ecology:
        status: partially-supported
        claims:
          - text: It is a constituent of Karroid vegetation, and grows close to the stems of low scrub on dry rocky slopes facing south. Rain falls mainly in the summer and varies from as little as 120 to 250 mm per annum. The summers are very hot, the winters cold with frost. H. woolleyi grows in a firm hard soil with pH 7.
