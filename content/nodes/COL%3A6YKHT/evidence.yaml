    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Slender annual, loosely tufted, up to 0.8 m high. Leaf blades 50-300 mm long, (3-)5-11(-18) mm wide, leaf blades (at least lower ones) pseudopetiolate, bases sagittate with lobes 2-30 mm long. Culm nodes glabrous. Spikelets 2 mm long, 1-2 mm wide. Panicle open, racemes secund; bristles solitary; lower glume 3-nerved; lower lemma rugose.
