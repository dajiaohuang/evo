        usage:
          title: Oxypetalum cordifolium (Vent.) Schltr., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Slender herbaceous vines, sometimes somewhat woody, finely velutinous- pilosulous on the stems, leaves, and inflorescences. Leaves soft, membranaceous, ovate, cordate, acuminate or cuspidate at the apex, dark green above, paler beneath, mostly 5-10 cm long and 4-6 cm wide; the petiole slender, 3-5 cm long. Cymes umbellate, 1- or few-flowered; peduncles ca. 2 cm long; pedicels slender, 1-1.5 cm long. Flowers with the calyx deeply lobed, the lobes linear-lanceolate to linear-subulate, densely pubescent on the outside, ca. 3.5 mm long and 0.5 mm wide; corolla yellowish to greenish, puberulent outside, glabrous to minutely papillose inside, the short tube ca. 4 mm long, the lobes linear attenuate, 1.5-2.5 cm long, ascending or spreading; corona 5-parted, the segments somewhat thick- ened, truncate-spathulate, the apex + plicate, each bearing a small appendage on the inner face, basally connate with the staminal tube, ca. 3 mm long; stigma terminating in a conspicuous bifid, 3-4-mnm-long beak. Follicles ca. 11 cm long, fusiform with a long acuminate apex.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 1282
