            zh: 秘鲁 Panguana 私人保护地的一处系统调查；L. leucogenys 的观察与 35.7 公顷样地、林隙占地及群体记录有关，不外推到全分布区。
            en: A systematic survey at one Peruvian Panguana reserve; L. leucogenys observations relate to a 35.7-ha observation area, its gaps and local groups, not the full range.
