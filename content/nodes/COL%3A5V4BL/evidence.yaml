          title: Annona glabra L., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: A tree up to 10 metres high; branchlets very soon glabrous. Leaves on petioles 1.0-1.5(-2.5) cm. long, rather thin, pale green, ovate-elliptic or oblong-elliptic, rotundate or acute and decurrent at the base, shortly acute or rarely obtuse at the apex, 7-14 cm. long and 3-8 cm. broad; network of veins dense and nicely prominent on both sides. Flowers solitary, issuing from about the middle of the internodes below the leaves; pedicels 1.5-2.0 cm. long, glabrous. Sepals rotundate, apiculate, 3-5 mm. long. Petals glabrous on outside, the outer ovate, 2.5-3.0(-4.0) cm. long, the inner a little smaller. Stamens 3-4 mm. long, connective disk broad, papillose but not setose. Fruit globose-ovoid, rounded at the top, 7-12 cm. long, smooth, areoles hardly obvious.
