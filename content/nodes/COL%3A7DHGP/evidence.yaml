        usage:
          title: Uncaria tomentosa (Willd. ex Schult.) DC., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: veins and venules, the intervenal areas patulous reticulate; petioles to 1.5 cm long, 0.1-0.35 cm wide, tomentose; the stipules triangular, ca. 1 cm long, ca. 1.2 cm wide at base, acute, stiff, drying rubescent, with appressed white hairs. In- florescences axillary, to 9 cm long, the peduncles 1.0-3.5 cm long, 0.8-3.0 mm wide, simply terminating in a globose capitulum of flowers, or the axes with 2 pairs of branches, these opposite, perpendicular, well spaced, puberulent, each terminated by a rotund capitulum, ca. 2 cm in diam. Flowers yellowish; hypan- thium oblong, to 1.5 mm long, carnose, puberulent, the calycine cup urceolate, ca. 0.65 mm long, densely white villose within, pubescent outside, the 5 teeth disposed as points; corolla with the tube funneliform, ca. 5 mm long, ca. 0.6 mm wide, petaloid, puberulent inside and out, the lobes 5, reflexed, oblong rotund, 1.4-1.7 mm long, glabrous on the adaxial face; stamens 5, the anthers oblong, 1.1-1.5 mm long, sessile, attached near the mouth; ovary 2-loculate, the septum moderately thin, the style linear, far exserted, ca. 4.5-6.0 mm long, the stigmas clavate, 1.0-1.5 mm long. Fruits septicidally bivalvate, narrowly ovate oblong, to 6 mm long, the persistent calyx coroniform, ca. 1 mm long and wide, drying tan, vaguely longitudinally striate, covered with dense white hairs, the seeds linear fusiform, to 4 mm long, the body ca. 1 mm long, the wing narrower than the body, membranous, 1 end linear oblong, the other deeply cleft and biaristate.
