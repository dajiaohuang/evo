        usage:
          title: Stemodia durantifolia (L.) Sw., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Erect, viscid-pubescent herbs to 1 m tall, branching freely, the stems compressed on emerging, somewhat woody below, slender above, drying angled, hispid with short, whitish, gland-tipped hairs. Leaves opposite, lanceolate, varying greatly in size on the same plant, the lower leaves often 4 (-6) cm long, 10 (-15) mm wide, the upper leaves mostly less than 2.5 cm long, 5 mm wide, apically acute, basally auriculate and clasping the stem, appearing perfoliate, serrate, the teeth sharply ascending, callose tipped, viscid with scattered erect, gland-tipped, slender hairs and sessile glands, the hairs somewhat longer beneath, the midvein promi- nent, the ca. 5 lateral pinnate veins on each side often obscure. Inflorescence solitary in the leaf axils, often geminate, sometimes aggregated to appear long spicate;' pedicels short, to 0.5 mm long, drying angled, viscid pilose; 2 linear, opposed, pubescent, ca. 2 mm long bracts near the top of the pedicels. Flowers with the calyx 5-lobed nearly to the base, the lobes narrow, acute, costate, ca. 2 mm long, viscid pilose, somewhat accrescent in fruit; corolla blue or purplish, drying dark apically, 5-6 mm long, outside minutely puberulent and glandular upwards, 2-lipped, the upper lip ca. 2 mm long, truncate or slightly emarginate, bearded in the throat with sturdy clavate hairs, the lower lip 3-lobed, the lobes ca. 1.5 mm long, the stamens 4, the filaments glabrous, terete, inserted at about the same level just below the sinuses in the corolla tube, the lowermost pair somewhat longer, the anthers alike, the connective globose, separating the 2 parallel, basifixed, oblong thecae, the thecae ca. 0.6 mm long, broadly elliptical after dehiscence, light (?yellow) colored; ovary narrowly conical, septally sulcate, somewhat compressed, glabrous, eglandular, the style stout, terete, glabrous, the stigma compressed, fanlike, slightly downcurved, the stigmatic area terminal, linear. Fruit a conical or ovoid capsule ca. 3 mm long, at first dark (?purplish), ultimately stramineous, the placenta dark, narrowly compressed conical, 2-3 mm long, loculicidally and septicidally dehiscent to the base; seeds ca. 0.3 mm long, ellipsoidal, blackish brown, tuberculate in lines.
          originalLanguage: en
