  claims:
    - subjectId: event:giant-pterosaur-launch-model
      claimKind: scientific
      claimType: event-mechanism
      statement: Comparative scaling, bone mechanics and aerodynamic calculations make powered flight and quadrupedal launch feasible for sampled giant-pterosaur reconstructions, but do not directly observe launch or measure extinct mass, muscle power and kinematics.
      confidence: medium
      confidenceRationale: The model exposes anatomical assumptions and quantitative performance estimates, but inputs include reconstructed body mass, wing shape and muscle capacity; feasibility is narrower than demonstrated behaviour across Pterosauria.
      referenceLinks:
        - referenceId: witton-habib-2010-giant-pterosaur-flight
          relation: supports
          pages: e13982
          figure: Figures 2 and 6; Tables 1–3
          quoteLocator: Flight performance; Launch mechanisms
  claim-rationales.zh:
    - 模型公开解剖假设与定量性能估计，但输入包括复原体重、翼形和肌肉能力；机械可行性比证明整个翼龙类的实际行为范围更窄。
  claim-statements.zh:
    - 比较尺度分析、骨力学与空气动力计算表明取样巨型翼龙复原的动力飞行和四足起飞具有可行性，但没有直接观察起飞，也未测量灭绝动物的体重、肌力和运动学。
