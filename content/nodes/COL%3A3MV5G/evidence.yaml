        claims:
          - text: Plants erect, to 300 mm tall; leaves distant, erect, sheathing at the base, blade narrowly elliptic, acute, 40-60 x 20-25 mm, upper blades smaller than the lower. Inflorescences rather dense, 15-25-flowered, 50-70 x 20 mm; bracts narrowly lanceolate, acute, taller than the ovaries. Flowers c. 12 mm in diameter, lip and sepals lime-green, petals speckled and lined purple. Sepals unequal, reflexed, margins entire; median lorate, basal half united with the petal claws, 5 mm long; laterals obliquely ovate, finely acute, 6 x 4 mm. Petals spathulate, erect, claws 3 mm long, fused; blades galeate, margins fimbriate, 4 mm tall and 2 mm deep. Lip pendulous, spathulate; claw 3 mm long and 4 mm wide; blade transversely ovate, margins fimbriate, 5x7 mm. Gynostemium short; anther thecae parallel, c. 3 mm long.
