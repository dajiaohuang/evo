          publishedAt: undated
          originalSourceText: Herbs, annual, coarse and weedy, to 1.5 m, the stems with short and longer hairs. Leaves alternate, ovate, or sometimes ? deltoid, acute, finely to coarsely undulate, the bases obtuse to rounded and long-attenuate, to 11 cm long and 6.5 cm wide, sparsely pubescent on both surfaces, the veins prominent beneath; petioles ? winged or indistinct, to 8 cm long. Inflorescences spicate, scorpioid, to ca 28 cm long, mostly terminal, the bracts absent. Flowers sessile; calyx of 5 free sepals, subulate, ca 1.5-2 mm long; corolla salverform, blue, violet, or rarely white, the tube ca 3-4 mm long, each lobe ca 1 mm long; stamens ? sessile, the anthers ca 0.6-0.8 mm long; ovary weakly 4-lobed, the style somewhat stout, the stigma conical. Fruit deeply 4-lobed, the lobes horizontally divergent, sep- arating into 4 nutlets at maturity, the nutlets angulate, glabrous to sparsely strigose, 2-3 mm long.
