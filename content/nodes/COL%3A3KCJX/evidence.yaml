          - text: Erect annual or short-lived perennial herb, up to 1.5 m high. Leaves large, ovate to broadly ovate or triangular-ovate, wider than 25 mm. Fruits not enclosed in calyx, mitre-shaped, fruit lobes remarkably divergent; mature nutlets with an empty cavity. Flowers white or rarely mauve or blue.
