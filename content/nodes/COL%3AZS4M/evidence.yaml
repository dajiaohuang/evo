          originalSourceText: above, prominulous beneath, the lateral veins (1-)2-5, strongly arcuate ascend- ing, without a submarginal undulate vein, the intervenal areas smooth, the vein- lets not evident, chartaceous to thinly succulent, concolorous, the hairs above strigose, appressed, golden colored or white, subulate, 0.2-0.7 mm long, the hairs beneath as above but mostly on costa and veins, the margin somewhat thick, minutely ciliolate or with short, thick, ascending hairs; stipules to 4 mm long, truncate, the setae 3-5, erect, the hairs stiff, to 1.7 mm long. Inflorescences terminal, 0.5-4.0 cm in diam., the uppermost leaves involucrate, the stem im- mediately below the involucre of leaves with numerous, weak, reflexed hairs. Flowers subsessile, the hypanthium oblong, shorter than the calyx, minutely puberulent; calycine cup 0.2-0.5 mm long, the lobes 4, subulate, erect, slightly spreading, 1.6-3.2 mm long, usually slightly unequal, the hairs slender, stiff, to 0.8 mm long, with a minute gland in the sinus of 2 adjacent lobes; corolla white, the tube slender, 0.6-0.7 cm long, ca. 0.2 mm wide, minutely puberulent to glabrous outside, glabrous within, the lobes 4, oblong, 1.0-2.2 mm long, obtuse; stamens 4, exserted, the anthers oblong, ca. 1 mm long, the filaments threadlike, to 1.8 mm long, attached at the mouth; style filamentous, about as long as the tube, the stigmas 2, 0.3-1.0' mm long, slightly wider than the style. Fruits not seen.
          originalLanguage: en
          sourceField: general
