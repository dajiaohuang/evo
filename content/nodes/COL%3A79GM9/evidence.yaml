          publishedAt: undated
          originalSourceText: or rounded, to 13 cm long and 7 cm wide, ? glabrous and resin-dotted; petioles ca 2-5 cm long. Inflorescences verticils, paired, ca 1-1.5 cm distant, each with 5-7 flowers, bracts broadly rounded, 6-8 mm long. Flowers with pedicels ca 2-10 mm long, covered with uniseriate hairs; bracteoles not apparent; calyx tubular, ca 12-15 mm long, rose, bilabiate, the upper lip entire and ca 7-ribbed, the lower lip 2-toothed and ca 7-ribbed, pubescent with uniseriate and glandular capitate hairs; corolla tubular, ca 18-34 mm long, crimson, with 2 papillae above the ovary, the upper lip ca 3 mm long, the lower lip ca 2 mm long, both pubes- cent; stamens mounted near the top of the, corolla throat, the connective with a long arm, the anthers ca 2-2.2 mm long; styles long and slender, pubescent, the tips bifid, the branches unequal. Nutlets (2-)4, oblong, ca 2-2.5 mm long, mot- tled dark and pale brown.
