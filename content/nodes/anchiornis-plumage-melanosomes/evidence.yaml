  claims:
    - subjectId: event:anchiornis-plumage-melanosomes
      claimKind: scientific
      claimType: morphology
      statement: Melanosome geometry and distribution sampled from BMNHC PH828 support a statistical reconstruction of grey, dark, white and rufous plumage regions; exact colour, all body regions and ancestral states are not directly observed, and the tail pattern used another specimen.
      confidence: medium
      confidenceRationale: Microscopic structures and comparative measurements are direct data, while colour categories follow preservation and statistical reference models. Those dependencies justify medium confidence.
      referenceLinks:
        - referenceId: li-2010-anchiornis-plumage
          relation: supports
          pages: 1369–1372
          figure: Figures 1–4; Tables S1–S4
          quoteLocator: Melanosome sampling; Discriminant analyses; Plumage reconstruction
  claim-rationales.zh:
    - 显微结构与比较测量是直接数据，颜色类别则依赖保存状态和统计参照模型；这些依赖支持中等置信度。
  claim-statements.zh:
    - 从 BMNHC PH828 取样的黑素体形状与分布支持灰、深、白和红褐羽区的统计复原；精确颜色、全部身体区域和祖征不是直接观察，尾部图案还使用了另一标本。
