        claims:
          - text: Climbing subshrub; young parts densely yellow-villous, glabrescent. Leaves broadly ovate, up to 250 x 200 mm, apex acuminate, base rounded to somewhat cordate, with yellow adpressed hairs below and on nerves above; petiole 25-95 mm, yellow-villous. Inflorescence a few-flowered cyme; peduncle up to 200 mm, yellow-villous; pedicels 20-40 mm, yellow-villous; bracts linear-lanceolate, up to 6 mm long. Sepals linear-lanceolate, subulate, 11-16 mm long, hairy outside, inner ones smaller than outer ones. Corolla funnel-shaped, up to 65 mm long, mauve to purple; midpetaline areas hairy on outside. Capsule globose, brown, 12 mm wide. Seeds 8 mm long, covered with long fulvous hairs.
            sourceIds:
