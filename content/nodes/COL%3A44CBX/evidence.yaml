    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous herb, up to 250 mm tall. Plant leafless when in bloom. Style crests present, at least 2 mm long and acute. Inner tepals longer than 10 mm. Lateral branches short to sessile. Flowers pale lilac to blue-violet with yellow-orange spotted nectar guides on outer tepals.
            textZh: Moraea stricta Baker 的 SANBI 物种条目记载了植株、叶片和花部形态。
            sourceIds:
              - sanbi_11118_0
            locator: Strelitzia 6; archive Morphology row 2798, source 11118.0
            placeTimeScope: Regional species account published 1997; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
          - text: Recognised by the combination of a dry (or absent) foliage leaf at flowering, a fairly short stem up to 250 mm high, and small, pale blue-mauve to lilac flowers. Only the outer tepals bear nectar guides and the style branches are relatively well developed and bear short, erect crests ± 3 mm long. The foliage leaf, also distinctive, is emergent at or soon after flowering, and has a terete, prominently ribbed blade with a thickened apex. Ultimately the leaf may be up to 600 mm long or longer, then trailing through low, grassy vegetation. At the end of the growing season the leaf turns dry and brown and the flowering stem to which it is attached begins to elongate in preparation for flowering the following spring. Flowering at the end of the dry season, the rhipidial spathes and sheathing leaves are, like the foliage leaf, usually dry and brown. Moraea stricta is one of relatively few polyploid species.
            textZh: SANBI 条目提供了 Moraea stricta Baker 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: Strelitzia 42; archive Diagnostic row 94204, source 18638.0
            placeTimeScope: Regional species account published 2020; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
