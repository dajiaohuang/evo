      ecology:
        status: partially-supported
        claims:
          - text: "The climate is semi-arid, with hot summer: with temperatures often above 30° Celsius, and winters are cold with frost. Rainfall of between 100 and 300 mm per annum is recorded mainly in summer and autumn. The majority of the natural range of Astroloba robusta closely matches the extent of the 100-150 mm rainfall regime, except at the eastern edge of the species range, where it extends into marginally wetter areas, with rainfall of up to 200 mm per annum. The bulk of the natural range of Astroloba robusta falls within the Gamka Karoo vegetation type (NK11) which is part of the Nama Karoo Biome. Plants are often locally common; sometimes it is even a dominant feature of the vegetation, growing in the open or under nurse bushes. Newly germinated seedlings are almost without exception found within these bushes. This species occurs mostly on flat or gently undulating terrain, as well as on low, rocky, shale slopes. In the south of its range, Astroloba robusta extends into the Koedoesberge-Moordenaars Karoo vegetation type (SKv 6), as well as the succulent-rich Prince Albert Succulent Karoo (SKv 13), both of which are part of the Succulent Karoo Biome. In this region, the species broadly tracks the Swartberg Mountains. The far south-western extension of this species occurs in Western Little Karoo vegetation (SKv 8) just north of the Klein Swartberg Mountains. This vegetation type is also part of the Succulent Karoo Biome. Towards the east of the vast range of this species, the vegetation transitions into Eastern Lower Karoo [vegetation] (NK12), and to the south-east, the vegetation type is Steytlerville Karoo (SKv 14). The former of these two vegetation types is part of the Nama Karoo Biome, the latter of the Succulent Karoo Biome."
