            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: "Diagnosis: Astroloba robusta differs from Astroloba foliolosa and Astroloba congesta by its robust peduncles with markedly flattened bases, long basal bracts on the peduncle, sessile or near sessile flowers, and a winter flowering period, mostly in July and August. Both margins of each leaf maintain their identity up to the leaf apex; leaf colour is green with brownish-grey hues, while margins and keels are usually paler or white; the exposed lower leaf surfaces have a glossy appearance due to the almost flat nature of the outer walls of the epidermal cells."
