    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Planta erecta glabra compacta, supra fere plana, copiose ramulifera, ad 7 cm. alta. Ramuli sat graciles, inferne foliis siccis induratisque onusti, superne dense 4-10-foliati, internodiis in vaginis inclusis. Folia more sectionis “Uncinata” sed integra, 3-4 mm. longa, ad 3 mm. lata, 2 mm. diam., vagina vix 2 mm. longa, juniora subglobosa, carina marginibusque inconspicue pellucido-lineatis, lateribus convexis, lateraliter visa obtusa, luvia, pallide viridia vel subincana. Flores solitarii sessiles diurni, ad 1.8 cm. diam., receptaculo turbinato. Sepala 5, subaequilonga obtusa, ad 3 mm. longa. Petala 2-seriata, interiora angustissima acuminata, rosea, obtusa, 7-8 mm. longa, 0.5 mm, lata vel minus. Staminodia staminibus conspicue longiora rosea, 4-5 mm. longa. Stamina collecta, filamentis roseis, basi dense papillatis, ad 2.5 mm. longis, antheris luteis. Discus annularis crenulatus. Ovarium supra suhplanum, conspicue 5-lobatum, lobis fere globosis. Stigmata anguste subulata, 1.5 mm. longa. Capsula baud visa.
            sourceIds:
