    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, 120-800 mm tall. Leaf 1, linear, channelled, often trailing, margins often undulate, occasionally crisped (juvenile leaves terete and coiled distally). Flowers enclosed in partly dry spathes, white to pale blue-mauve, tepal limbs lightly reflexed, the inner slightly smaller, style branches broad, crests prominent. Mostly Sept.
            textZh: Moraea saxicola Goldblatt 的 SANBI 物种条目记载了植株、叶片和花部形态。
            sourceIds:
              - sanbi_14562_0
            locator: Strelitzia 30; archive Morphology row 33351, source 14562.0
            placeTimeScope: Regional species account published 2013; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
          - text: Late-flowering Moraea saxicola is recognised by the solitary foliage leaf with thickened, straight to undulate margins, and relatively large flowers with outer tepals 34-45 mm long and the limbs of both whorls half reflexed. The tepals are usually pale blue in the north of its range, white to palest yellow elsewhere, and the outer tepal limbs bear pale yellow nectar guides. The foliage leaf is fairly broad and slightly undulate with occasionally slightly crisped margins. Unusual for Moraea, the juvenile leaves are narrow and sometimes terete and coiled near the apex. By the time these plants reach flowering age, the leaf is usually broad, channelled and trailing. Moraea saxicola is allied to the yellow-flowered M. bolusii of northern Namaqualand, which also has an undulate leaf.
