    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants ± 30 mm high. Corm globose, ± 12-16 mm diam.; tunics of grey-brown, medium-textured, netted fibres, accumulating in fibrous collar around base of stem. Stem with 3 aerial internodes, unbranched, sheathing leaves with dry attenuate apices, 35-40 mm long. Foliage leaf solitary, basal, linear, narrowly channelled, 2/3 to ± as long as stem, ± 2 mm wide opened flat. Rhipidial spathes with dry, attenuate apices, inner ± 40 mm long, outer ± half as long. Flowers lasting 3 days, purple, outer tepal limbs with white, wedge-shaped nectar guides at bases, laxly spreading to weakly reflexed; outer tepals ± 20 mm long, claws ± 6 mm long, ascending; inner tepals ± 9 mm long, limbs spreading, ± 4 mm long, 3-lobed with long, tapering central cusp and short, rounded, obtuse lateral lobes, claws ± 5 mm long, ascending, tapering from narrow base to wide apex. Filaments ± 8 mm long, united in smooth cylindric column in lower ± 3 mm, diverging in upper 5 mm; anthers ± 5 mm long, dark purple; pollen red. Ovary ± cylindric, ± 8 mm long, exserted; style branches ± 8 x 2 mm long, ascending, held above subtending limbs, crests narrowly wedge-shaped, ± 4 mm long. Capsules and seeds unknown.
            textZh: Moraea petricola Goldblatt & J.C.Manning 的 SANBI 物种条目记载了植株、叶片和花部形态。
            sourceIds:
              - sanbi_18638_0
            locator: Strelitzia 42; archive Morphology row 97865, source 18638.0
            placeTimeScope: Regional species account published 2020; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
          - text: A typical member of subg. Vieusseuxia in its solitary basal leaf and 3-lobed inner tepals. The purple flowers are assumed to be long-lasting and the outer tepal limbs have narrow, white, wedge-shaped nectar guides edged with dark purple. The inner tepals have unusually broad, 3-lobed limbs with a prominent, linear, reflexed central cusp and rounded lateral lobes. The flowers in general recall M. decipiens, particularly in the flower colour and shape but have much longer filaments, ± 8 mm long vs. 3.5-4.0 mm in M. decipiens, a style ± 5 mm long (vs. ± 2 mm) and shorter tepal claws, 5-6 mm (vs. 8-9 mm). The relatively long style branches are held well above the subtending outer tepals limbs, whereas in M. decipiens the style branches are appressed to the tepal claws and the inner tepals curve upward rather than having reflexed limbs with the central cusp directed downward. Additional collections of this rare species are needed to confirm current observations based on limited material.
