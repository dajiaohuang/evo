    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Bulbous geophyte, 180-200 mm tall. Leaves 2, dry at flowering, spreading, linear, smooth. Flowers somewhat stellate, glistening white, in a laxly spreading cluster, tepals occasionally with undulate edges, stamens shorter than tepals.
            textZh: Hessea tenuipedicellata Snijman 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_14528_0
            locator: "SANBI/WFO archive Morphology row 32848; source identifier 14528.0; cited publication: Snijman, DA. 2013. Amaryllidaceae. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 33 - 42. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Most species of Hessea have straight, rigid pedicels at anthesis, and flowers that vary from pink to white with dark pink to red markings. In contrast, H. tenuipedicellata is easily recognized by its long, slender, pliant, upwardly curved pedicels, and glistening white flowers that lack pink markings.Furthermore, the substellate flowers have channeled, narrow tepals, and each flower opens at one-to four-day intervals so that few reach anthesis simultaneously. The only other known Hessea species with similar slender green pedicels, a sequential flowering pattern, and channeled, narrow, whitish tepals is H. stenosiphon. The flowers in H. tenuipedicellata are substellate and short-tubed (1 mm long), with widely spreading filaments and a well-exserted style. In contrast, the hypocrateriform flowers of H. stenosiphon have a style hidden within a narrow, 8-12-mm-long perigone tube, and outer anthers that occlude the perigone throat.
            textZh: SANBI 条目提供了 Hessea tenuipedicellata Snijman 的鉴别特征。
            sourceIds:
              - sanbi_5666_0
            locator: "SANBI/WFO archive Diagnostic row 44924; source identifier 5666.0; cited publication: Snijman, DA. 1999. A new species, notes on subgeneric taxa, and new synonyms in Hessea (Amaryllidaceae: Amaryllideae) from South Africa. Novon 9(1): 107 - 110. [https://doi.org/10.2307/3392133]. [All rights reserved]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
