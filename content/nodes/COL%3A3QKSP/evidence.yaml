    facets:
      morphology:
        status: partially-supported
        claims:
          - text: "Shrublet, 150 mm-1 m tall, sometimes broader than tall, several-stemmed from base, well-branched above, often with new growth developing below old inflorescences, main stems up to 12 mm diam., young parts glandular-pubescent, hairs up to 1-2 mm long, very delicate. Leaves opposite, very rarely becoming alternate at extreme tips of inflorescences, 7-28 x 4-16 mm (ratio 1.1-2.1:1), mostly broadly ovate to ovate-elliptic, lowermost sometimes elliptic, obtuse to subacute or acute, base cordate to rounded and clasping in most leaves, tapered to a petiolar part 1-2 mm long in lower leaves, margins entire or with up to 4 pairs of teeth, both surfaces densely glandular-pubescent, hairs up to 0.8-2 mm long. Flowers solitary in upper leaf axils forming lax to crowded racemose inflorescences up to c. 250 mm long but often much shorter. Pedicels up to 2-6(-18) mm long. Calyx tube 0.1-0.2 mm long, lobes 5.5-13 x 1.1-2.1 mm, subspathulate, ± obtuse, glandular-pubescent, hairs up to 1-2 mm long. Corolla tube (8-)10-25 x 2.5-3 mm in mouth, cylindric, abruptly expanded at apex, limb nearly regular, (5-)7-14 mm across lateral lobes, posticous lobes (1.3-)3-6 x (1.3-)3-6 mm, anticous lobes (1.7-)3-5 x (1.2-)3-6 mm, suborbicular, minutely glandular to glabrous outside, very minutely glandular around mouth on upper surface of limb, well bearded inside with clavate hairs c. 0.2-0.4 mm long where they extend onto extreme base of anticous lip, lobes white or occasionally creamy-white, dark violet streaks at base of each lobe, throat yellow. Stamens: posticous filaments 1.4-2.8 mm long, posticous anthers 1.2-1.8 mm, anticous filaments 0.4-1 mm, anthers 1-1.3 mm, all filaments puberulous. Stigma 0.3-1 mm long. Style (5-)10-20 mm. Ovary 2-3 x 1.2-1.5 mm. Capsules 6-13 x 3.5-5 mm, glandular-pubescent near apex. Seeds 0.3-0.6 x 0.25-0.3 mm. Flowers can be found in any month."
            sourceIds:
              - sanbi_15191_0
            locator: "SANBI/WFO archive Morphology row 60988; source 15191.0; publication: Vollesen, KB. 2013. 126. Acanthaceae (Part 1), Fl. Zambes. 8(5): 1 - 184. Royal Botanic Gardens, Kew, London. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Jamesbrittenia maxii is characterized by its shrubby habit, broad sessile or nearly sessile leaves that are nearly always opposite right to the tips of the flowering branches, relatively broad calyx lobes and its small white (or sometimes creamy or yellow) corolla limb. The plants may or may not blacken on drying. The pedicels are usually short (up to c. 6 mm), but one of the syntypes (Schlechter 11430, the sheet in S) has pedicels up to 18 mm long; not traced precisely, but somewhere between Steinkopf and Goodhouse in Namaqualand (2918AC). Otherwise, plants with long pedicels have been seen only from the gorge of the Kuiseb river and its environs (2315BD, CA, DB, DD; 2314BB, DB; 2215 AB); plants with short pedicels also occur in the area. The corolla tube is usually at least 18 mm long, but it can be as short as 8 mm.
            textZh: SANBI 条目提供了该种的鉴别特征。
