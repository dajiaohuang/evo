          - title
          - url
          - scope
        metadataVariant: 0
        usage:
          scope:
            en: Supports the 2006 exploratory survey and observations explicitly located on Selayar, including the Punagaan nests and Labau roosts/behavior; the paper also covers mainland Patunuang, so pooled totals, mixed-site plant lists and combined elevation summaries are excluded from this page.
            zh: 支持 2006 年探索性调查及明确标注为 Selayar 的观察，包括 Punagaan 巢址和 Labau 睡眠点/行为记录；论文也覆盖大陆 Patunuang，因此本页排除混合地点的总数、植物清单和合并海拔范围。
