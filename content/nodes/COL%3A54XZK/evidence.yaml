        usage:
          scope:
            en: Supports the taxonomic treatment that restricts T. tarsier to Selayar Island and separates other Sulawesi populations under distinct names; this is a classification synthesis, not a field ecology study.
            zh: 支持将 T. tarsier 限定于 Selayar 岛、并以其他名称处理苏拉威西其他种群的分类处理；这是分类综述，不是野外生态研究。
