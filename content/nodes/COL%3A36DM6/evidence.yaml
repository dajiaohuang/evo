          - text: Diosma pedicellata is a distinct species and differs in being usually a tall stiff much-branched shrub, many-stemmed at base, having leaves petiolate with a narrow midrib when dry and the apex with a straight point; flowers 7 mm diam.; calyx glabrous; petals spreading, glabrous, narrowly sessile with margins irregular; fruit becoming pedicellate above the calyx.
