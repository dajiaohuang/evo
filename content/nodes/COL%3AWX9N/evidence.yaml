    facets:
      morphology:
        status: partially-supported
        claims:
          - text: "Sessile, cormous herb. Leaves in a basal rosette, narrowly ovate, up to 135 mm long. Flowers: bracts leaf-like; stamens much shorter than perianth; perianth with a flat blade, 5.5-10.0 mm long, claw 4-10 mm long, white; May, Jun."
            textZh: Colchicum asteroides (J.C.Manning & Goldblatt) J.C.Manning & Vinn. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_16261_0
            locator: "SANBI/WFO archive Morphology row 70992; source identifier 16261.0; cited publication: Retief, E; Meyer, NL. 2017. Colchicaceae. In: E Retief & NL Meyer (eds), Plants of the Free State: Inventory and identification guide, Strelitzia 38: 868 - 872. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Colchicum asteroides is clearly allied to C. roseum, with which it shares a multifoliate, rosette habit and more or less flat or shallowly concave tepal limbs lacking prominent basal auricles. It is distinguished from C. roseum by the broader, lanceolate leaves with the blades usually at least 10 mm wide towards the base and smaller, pure white flowers that do not protrude much above the crown of the plant. The tepal claws are oblong, 6-8 mm long and the limbs ovate, 8-9 x 4-6 mm. A roseum is characterized by linear-lanceolate leaves up to 5 mm wide and pinkish or pink-streaked flowers that protrude conspicuously above the crown of the plant. The tepal claws are narrowly oblong, 10-12 mm long and the narrowly oblong-elliptic limbs are 13-16 x 3-4 mm.
            textZh: SANBI 条目提供了 Colchicum asteroides (J.C.Manning & Goldblatt) J.C.Manning & Vinn. 的鉴别特征。
            sourceIds:
              - sanbi_6067_0
