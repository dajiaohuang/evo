    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Dwarf tufted perennial herb up to 15(30) cm tall; stems closely leafy, hispid-hirsute. Leaves up to c. 7 x 0.2 cm, linear to very narrowly linear-lanceolate, apex acute, callous-tipped, margins entire or remotely denticulate, gland-pitted, scabrous-hirsute. Capitula sessile, solitary at the ends of or in the forks of the branches, up to 1.0 cm in diam., urceolate-campanulate; involucral bracts c. 4-seriate, c. 1.3 cm long but with the outer bearing a short linear leafy appendage, outer lanceolate at the base hirsute, inner linear and brown-scarious with ciliate margins near the apex. Receptacular paleae fimbrillate. Outer female florets yellow, ligulate, up to c. 1.5 cm long. Inner hermaphrodite florets yellow, up to c. 1 cm long, deeply divided into linear-acuminate glandular-puberulent lobes. Cypsela 2 mm long, turbinate, silky-villous; pappus c. 1.5 mm long, outer series narrowly ovate subdenticulate, inner narrowly ovate entire with a long terminal arista.
