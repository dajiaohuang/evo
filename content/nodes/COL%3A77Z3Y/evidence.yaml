          publishedAt: undated
          originalSourceText: Trees, 4-8 m high; branchlets densely brownish-hirtellous and minutely puberulent, marked with light lenticels. Leaves odd-pinnate, 13-44 cm long, 10.5-24 cm wide; petioles canaliculate, 2.5-6.5 cm long, they and rachises densely brownish-hirtellous and minutely puberulent; leaflets (3-) 5-7 (-9), elliptic, oblong, ovate, or obovate, slightly inequilateral, abruptly acuminate, cune- ate basally, subcoriaceous, margins entire, brownish-hirtellous and minutely puberulent, especially on the veins, becoming glabrate between the veins, the laterals 6-14 cm long and 2.5-6 cm wide, the terminals 8.5-11.5 cm long and 3.5-5.5 cm wide, the lowermost pair smallest; petiolules slightly swollen apically, densely brownish-hirtellous and minutely puberulent, the laterals 5-10 mm long, the terminals 18-26 mm long. Inflorescences axillary panicles, few- branched from the base, densely brownish-hirtellous and minutely puberulent, becoming glabrate, 1-5 cm long. Flowers yellow, 4-merous; pedicels sparsely puberulent, 1.5-2 mm long, calyx cupuliform, 1 mm high, 4-lobed, the lobes broadly triangular, acuminate, a little shorter than the tube, sparsely puberulent; petals 4 oblong-triangular, the upper half spreading, sparsely puberulent on both surfaces, the margins papillose, inflexed apiculate apically, 3 mm long and 1.5 mm wide; stamens 8, 2 mm high in carpellate flowers, the filaments subulate, dilated
