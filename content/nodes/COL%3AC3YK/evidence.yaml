    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants stemless, 150-250 mm tall excluding inflorescence; usually in clumps. Leaves 30-40 per rosette, lanceolate to ovate-lanceolate, 100-170(-300) x 40-60 mm, upper surface flat to slightly channelled, sometimes with few prickles, lower surface convex with few prickles, sometimes obscurely keeled. Inflorescence a simple raceme; peduncle 400-600 mm long; bracts 35-65 x 8-18 mm, many-nerved. Flowers rose-red, cylindric-trigonous, 30-40 mm long; pedicels 25-40 mm long, lengthening to 50 mm in fruit. Anthers not or hardly exserted. Ovary 5.0-8.0 x 1.0-2.5 mm, green; style exserted 1-3 mm. Fruit 24-37 x 7-11 mm, grey. Seeds black, 4.5-5.0 x 3.0-4.0 x 0.5-1.0 mm, with a narrow wing.
            textZh: Aloe pratensis Baker 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_5961_0
            locator: "SANBI/WFO archive Morphology row 49083; source identifier 5961.0; cited publication: Glen, HF; Hardy, DS. 2000. Aloe. In: G Germishuizen & E du Plessis (eds), Aloaceae (first part), Fl. S. Africa 5(1,1): 1 - 167. National Botanical Institute, Pretoria. [http://www.biodiversitylibrary.org/item/209564#page/3/mode/1up]. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: The leaf teeth and prickles, which arise from white tubercular bases, set this species apart from others in this section. Unlike A. polyphylla, plants of this species often form clumps, but like that species they are stemless. The peduncle is densely covered with sterile bracts, unlike most other southern African species of Aloe. A most unusual character of A. pratensis is the raceme, which elongates significantly as flowering progresses although the length of the peduncle remains roughly constant, so that the portion of the raceme with unopened buds is capitate, but the portion with open flowers and developing fruits is conical.
