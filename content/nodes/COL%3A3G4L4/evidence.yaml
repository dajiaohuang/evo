          - text: Recognised by its relatively soft-textured leaves, trailing stems and large, scarlet flowers with white transverse chevrons near the base of the lower tepals, the dorsal tepal horizontal but the others ± spreading from a narrow perianth tube ± 28 mm long. The filaments are ± 40 mm long and well exserted.
