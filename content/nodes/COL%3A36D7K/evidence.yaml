        claims:
          - text: Creeper. Flowers in elongated racemes. Pedicels 1.0-1.5 mm long. Fruits densely packed along rhachis. Leaves elliptic to obovate, mucronate, margin unevenly lobed. Flowers yellow.
            textZh: Dioscorea retusa Mast. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_11118_0
            locator: "SANBI/WFO archive Morphology row 1710; source identifier 11118.0; cited publication: Herman, PPJ; Retief, E. 1997. Plants of the northern provinces of South Africa: Keys and diagnostic characters. Strelitzia 6: 1 - 681. National Botanical Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: This species differs from D. quartiniana in its strongly undulate leaflet margins (these are rarely found in the latter species, and the undulation is less marked when present), and in the male by the more lax inflorescence, which is not catkinlike due to the 1.5-2.7 mm long floral bracts, which are usually shorter than the tepals. The pedicels of D. retusa are usually longer ((0.5 -)0.8-1.8(- 2) mm), and the outer tepals are 2.4-3(-3.3) mm long, narrowly ovate, and usually held erect, giving the flower a conical appearance in bud. The female plants of this species are much harder to distinguish, either in flower or fruit, though they do have more erect tepals.
            textZh: SANBI 条目提供了 Dioscorea retusa Mast. 的鉴别特征。
            sourceIds:
              - sanbi_5709_0
            locator: "SANBI/WFO archive Diagnostic row 57490; source identifier 5709.0; cited publication: Wilkin, P. 1999. A revision of the compound-leaved yams (Dioscorea,Dioscoreaceae) of Africa. Kew Bull. 54(1): 19 - 39. [http://www.jstor.org/stable/4111021]. [All rights reserved]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
