          - text: "A feature that most easily distinguishes Pauridia breviscapa is the very short scape (up to 20 mm long) which is usually entirely hidden by the leaves, often leading to the inflorescence bracts being mistaken for newly emerging leaves. The softly fibrous corm, together with the thin-textured leaves and lanceolate bracts, and black seeds in which the testa has longitudinally arranged rows of laterally widened cells, suggest a close alliance with P. umbraticola, found on the mountains of the Olifants River Valley to the west. The two species differ from each other in the relative lengths of the scape, pedicels and filaments. In P. breviscapa the scape reaches up to 20 mm long, the pedicels are 50-175 mm long, the outer filaments are 1.2-1.5 mm and the inner are 1.5-1.7 mm long. The contrasting states in P. umbraticola are: scape 25-65 mm long, pedicels 20-55 mm long, outer filaments 2.5-3.0 mm long and inner filaments 3.0-3.5 mm long."
