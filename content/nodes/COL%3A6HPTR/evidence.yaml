        usage:
          title: Faramea luteovirens Standl., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: the nodes well spaced. Leaves oblong, obovate oblong, oblong rotund, to 15 cm long, to 8 cm wide, obtuse, rounded or truncate at the apex, cuspidate, the cusp to 1.5 cm long, often falcate, cuneate to acute, rarely truncate at the base, equi- lateral, the costa plane to prominulous above, prominent beneath, the lateral veins 10-13, widely arcuate, prominulous above and beneath, the intervenal areas reticulate, the veinlets often disappearing, the margin conspicuously thickened, coriaceous, glabrous, concolorous or discolorous, usually drying lemon yellow; petioles stiff, to 1 cm long, glabrous; stipules appressed, deltoid to compressed hemispherical,, 2-4 mm long, the awn subulate, 3.5-5.5 mm long, coriaceous, glabrous. Inflorescences axillary or occasionally terminal, the peduncle usually suppressed (or if present to 2 cm long), branches few or absent, the flowers 1-2 per axil; pedicels strongly ascending, to 5 cm long, stiff, lignose, glabrous, ex- panded at the apex. Flowers with hypanthium oblong, ca. 9 mm long, coriaceous, glabrous, the calycine cup ca. 4 mm long with patches of minute appressed glands within, these covered with a membranous "skin," the calycine teeth absent, the margin undulate; corolla white, the tube narrowly cylindrical, falcate, ca. 2.2 cm long, ca. 4.5 mm wide medially, contracted below the middle, stiffly petaloid or subcoriaceous, glabrous, the lobes 3-4, lanceolate, 2.2-3.0 cm long, ca. 4.5 mm wide at the base, obtuse, coriaceous, glabrous, the margins deeply infolded; sta- mens 4, narrowly oblong, ca. 10 mm long, ca. 1.3 mm wide, obtuse, the filaments slender, dorsifixed, ca. 4 mm long, inserted on the lower 1/3 of the corolla tube; stigmas 2, erect, linear, to 2.2 mm long, the style slender, ca. 22 mm long, ca. 0.35 mm wide, the ovary thick walled. Fruits subglobose, 8-1.5 cm in diam., crowned with a calycine cup, smooth, glabrous, drying black.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 11633
