  claims:
    - subjectId: event:tupandactylus-feather-melanosomes
      claimKind: scientific
      claimType: morphology
      statement: Tupandactylus specimen MCT.R.1884 preserves monofilaments, branched feather-like structures and distinct melanosome geometries in cranial soft tissues; exact colours, signalling roles and a universal pterosaur covering are not directly observed.
      confidence: medium
      confidenceRationale: Multiple structures are documented in a named specimen using microscopy and chemical comparisons. Medium confidence keeps taphonomic, homology and phylogenetic-model uncertainty separate from the preserved morphology.
      referenceLinks:
        - referenceId: cincotta-2022-tupandactylus-feathers
          relation: supports
          pages: 684–688
          figure: Figures 1–2; Extended Data Figures 1–7
          quoteLocator: Results; Phylogenetic comparative analysis
  claim-rationales.zh:
    - 具名标本中的多种结构由显微与化学比较记录。中等置信度把埋藏、同源性和系统模型不确定性与保存形态分开。
  claim-statements.zh:
    - 古神翼龙标本 MCT.R.1884 的头部软组织保存单丝、分支羽状结构及不同几何形态的黑素体；精确颜色、信号功能和翼龙普遍覆盖物并未被直接观察。
