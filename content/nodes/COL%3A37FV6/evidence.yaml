    facets:
      morphology:
        status: partially-supported
        claims:
          - text: In two laboratory trials, paralarvae reared under elevated CO2 had slightly shorter mantles than controls (1.78 ± 0.01 mm versus 1.81 ± 0.01 mm; the pooled difference was significant but small). Their statoliths had about 25% lower surface area and were more irregular and porous. These are early-stage laboratory measurements, not demonstrated effects on adult form or field performance.
            sourceIds:
              - kaplan2013
            locator: Results, mantle-length comparison and statolith observations; Figs. 3–5.
            placeTimeScope: Woods Hole Oceanographic Institution, June–August 2011; eggs from Vineyard Sound adults; culture at approximately 20°C. Gas setpoints were 390 and 2200 μatm; measured gas concentrations averaged 394 ± 6 and 2267 ± 10 ppm, while seawater pCO2 calculations averaged 626 and 2440 μatm for control and treatment.
            lifeStatus: Laboratory-reared hatchlings from egg capsules laid by wild-caught adults; the study did not rear animals beyond the yolk-sac stage.
            originalLanguage: en
        gaps:
          - The observed size difference was small and does not establish consequences for wild behavior, survival, or adult morphology.
          - Statolith observations were made in laboratory-reared paralarvae; later development and recovery were not followed.
          - Life-history outcomes beyond hatching, ecology, evolution, distribution, fossils, and conservation remain unassessed; systematic search are incomplete.
      lifeHistory:
        status: partially-supported
        claims:
          - text: "Elevated-CO2 rearing delayed the hatching schedule of Doryteuthis pealeii paralarvae in both replicated trials: the time to 90% hatching was about 24 hours later in trial 1 and the delay was shorter than 24 hours in trial 2. The outcome is limited to laboratory hatching timing and does not demonstrate a change in natural recruitment."
            sourceIds:
              - kaplan2013
            locator: Results, Hatching timeline for squid paralarvae; Fig. 2.
            placeTimeScope: Woods Hole Oceanographic Institution, June–August 2011; Vineyard Sound seawater; eggs from captive-laid capsules of trawled adults. Gas setpoints were 390 and 2200 μatm; measured gas concentrations averaged 394 ± 6 and 2267 ± 10 ppm, with calculated seawater pCO2 means of 626 and 2440 μatm.
            lifeStatus: Embryos in laboratory egg capsules and newly hatched paralarvae; adults were wild-caught, and paralarvae were not reared past the yolk-sac stage.
            originalLanguage: en
        gaps:
          - The experiment measures hatching time under controlled laboratory conditions, not wild hatching phenology or recruitment success.
          - The paralarvae were not followed beyond the yolk-sac stage, so subsequent survival and growth are unknown.
          - Other life-history stages and morphology, ecology, evolution, distribution, fossils, and conservation remain unassessed; systematic search are incomplete.
      ecology:
        status: not-assessed
