          - text: B. lamprophylla is a striking species with the largest flowers in the genus. It is found almost exclusively in dune and riverine forest, normally in shade. Molecular study suggests that B. lamprophylla is most closely allied to B. steudneri. The taxa are also morphologically similar but B. lamprophylla can be easily distinguished by its exceptionally long lateral lip lobes (106-135 mm vs 35.5-60.0 mm). Vegetative specimens are easily distinguished as the glossy dark green, cordate leaves with undulate margins of B. lamprophylla contrast with the dull oblong-lanceolate to ovate-elliptical green leaves of B. steudneri.
