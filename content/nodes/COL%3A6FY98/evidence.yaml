    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Tufted perennial up to 700 mm high; basal sheaths hairy to nearly glabrous; culm with punctate or crateriform glands; nodes glabrous and with annular glandular patch below. Leaf blade 50-140 x 0.5-2.0(4.5) mm, involute or expanded; eglandular. Inflorescence 100300 mm long, open, branches stiff, punctate or crateriform glands present; lowest branches not whorled; pedicels with annular glands; spikelets evenly distributed. Spikelet 5-10 x 2.5-4.0 mm; rachilla persistent, breaking up from below upwards; glumes subequal, lanceolate in side view, apex acute, reaching 2/3-3/4 up lemma above; lemma 1.8-2.1 mm long, subacute, olive-green to grey, membranous, keeled, lateral nerves indistinct; palea keels wingless, margins wide apart, narrowing upwards between keels and margins; anther 1.0-1.3 mm long; caryopsis oblong.
