        claims:
          - text: Prostrate herb. Tendrils reduced or short or wanting. Male peduncles stout, distinct from pedicels which are more slender. Receptacle lobes of male flowers 1-2(-3) mm long, triangular or triangular-ovate. Fruit glabrous, 15-25(-30) mm long, subglobose to ovoid or oblong, shortly rostrate. Flowers pale yellow or greenish yellow.
