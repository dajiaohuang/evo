        usage:
          title: Serjania rhombea Radlk., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Tendrilled lianas; stems 6-ribbed, brown-hirtellous, especially on the ribs; wood composite, the peripheral bundles 3, slender, terete, to 4 mm diam. in older stems. Leaves biternate, 5-18 cm long; rachis narrowly winged; leaflets ovate to rhomboid, obtuse to acuminate at the apex, obtuse to attenuate at the base, coarsely and obtusely toothed above the middle, shortly pilose, (especially be- neath and on the raised midrib above, the terminal leaflet mostly 3-9.5 cm long, 0.5-6 cm wide, the lateral leaflets smaller, Thyrses in racemes 5-15(-20) cm long and borne in leaf axils or on tendrils, or in terminal racemose panicles; in- florescence branches softly short-villous; pedicels glabrate, ca. 1 cm long, ar- ticulate near the base. Flowers white, ca. 3 mm long; sepals ovate, short-tomen- tose; petals narrowly obovate, ca. 2 mm long, borne atop large greenish glands and subtended by an ear-shaped lobe of the gland, spreading broadly at anthesis, the scales of the anterior petals ca. 1.5 mm long, the deflexed appendage villous, about twice as long as broad, the crest broader than long, bifid, curved away from center of flower; staminal cluster spreading, leaning away from the axis, the filaments sparsely villous, all recurved at the apex; ovary glabrous, the ovary and style together ca. 1 mm long, the style about as long as ovary. Fruits cordate- ovate, 1.5-2.2 cm -ong, about as wide as long, the cell sparsely to densely villous, wings gradually constricted below the seed-bearing part, glabrous or subvillous along the media] sections, often reddish at maturity.
          originalLanguage: en
          sourceField: general
