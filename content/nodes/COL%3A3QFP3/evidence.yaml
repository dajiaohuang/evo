    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, 20-50 cm, corms with short or long stolons, tunics membranous to papery. Leaves narrowly sword-shaped, bracts large, dry, rusty above or entirely. Flowers orange or yellow with shallow, dark brown cup often with star-like pattern in centre, tube filiform, filaments united below (rarely free), yellow.
            textZh: Ixia maculata L. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 7167; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Recognised by orange or sometimes yellow flowers with a small dark brown, star-shaped or round centre. The central dark part of the flower is slightly cupped with only the distal 2/3 of the tepals outspread. The yellow filaments are united in the lower half or completely, with the style dividing above the bases of the anthers. Particularly unusual are the short, branched stolons produced from the corm base, each branch bearing a small cormlet. Similar branched stolons are also found in I. stolonifera of sect. Ixia and in I. purpureorosea (sect. Hyalis). The stem is usually unbranched and the linear to narrowly lanceolate leaves are mostly 2-7 mm wide. Ixia maculata is one of few species of sect. Ixia with large dry floral bracts rust-brown in the upper half or entirely. Ixia maculata was initially broadly circumscribed, thus including several species with flowers of various colours but with a dark centre.
            textZh: SANBI 条目提供了 Ixia maculata L. 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 95050; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
