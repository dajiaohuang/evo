        metadataVariant: 0
        usage:
          title: Tocoyena pittieri (Standl.) Standl., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Trees to 10 m tall or much taller (fide Croat), the branchlets terete, smooth but often nodose, glabrous, the nodes usually 2-3 cm apart. Leaves elliptic, to 32 cm long, to 17 cm wide, widely deltoid to somewhat rounded at the apex, shortly acuminate, the acumen to 1 cm long, ultimately obtuse, cuneate toward the base, often somewhat inequilateral, the lateral veins ca. 10, arcuate, the lesser veins slender, irregular and spreading, pinnatiform, plane, stiffly chartaceous, black brown when dry, glabrous except the minutely pubescent axils of the prin- cipal veins beneath, minutely papillate under magnification, lightly marcescent above; petioles to 3 cm long, ca. 0.25 cm wide, glabrous; stipules free, triangular, 5-10 mm long. Inflorescences cymose paniculate, resembling a candelabra, to 13 cm long, ca. 11.5 cm wide, the flowers numerous, erect; bracts and bracteoles triangularly subulate, 0.5-1 mm long. Flowers pedicellate, the pedicels 1-3 mm long; hypanthium oblong, to 4 mm long, truncate, glabrous, the calycine cup ca. 1 mm long, eglandular within, the teeth 5, widely triangularly subulate, to 0.5 mm long, glabrous; corolla yellow, the tube narrowly cylindrical, 8-12 cm long, to 0.6 cm wide, thickly carnose, glabrous outside, within white villous at the base of the tube, the lobes 5, forming an ovate rotund mass in bud, golden farinose outside, ovate elliptic, obovate or elliptic rotund, 1-1.5 cm long, glabrous; sta- mens 5, exserted, sessile, the anthers elliptic, ca. 6 mm long, ca. 2 mm wide,
          originalLanguage: en
          sourceField: general
