    facets:
      morphology:
        status: partially-supported
        claims:
          - text: "Dwarf succulent, ± 50 mm high, 45-50 mm wide; often tuberous, main stem subcylindric. Branches up to 25-37 mm long, 8-10 mm wide, finally deciduous. Leaves rudimentary, deciduous. Flowers: cyathia solitary; peduncles bearing involucre at apex, persisting several seasons, withering, spine-like, 5-13 mm long; involucral glands with 2-4 processes, dull olive-green; styles united nearly to middle into column 27-30 mm long."
            sourceIds:
              - sanbi_16123_0
            locator: "SANBI/WFO archive Morphology row 71539; source 16123.0; publication: Retief, E; Meyer, NL. 2017. Euphorbiaceae. In: E Retief & NL Meyer (eds), Plants of the Free State: Inventory and identification guide, Strelitzia 38: 505 - 516. South African National Biodiversity Institute, Pretoria. [CC BY]"
