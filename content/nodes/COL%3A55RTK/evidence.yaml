          originalSourceText: Liana, the young stems densely pubescent with white, metacentric, sessile or stalked trichomes, soon glabrous. Leaves papyraceous to chartaceous, oblong- ovate to narrowly ovate or elliptical, acute to abruptly acuminate, obtuse to rounded at the base, (4.5-)6-14.5 cm long, (2.5-)3-7 cm wide, glabrous above, sparsely and mostly patulous-pubescent on the lower surface especially along the veins, sometimes glabrous in age except for a sparse pubescence along the major veins; major veins 4-5 pairs, prominently arcuate ascending; petioles 5-12 mm long, canaliculate, pubescent. Panicles terminal or upper axillary, longer or short- er than the subtending leaves, the branches densely pubescent, the trichomes whitish, appressed to patulous; bracts subrounded to oblong-elliptic or ovate, submembranaceous, 5-30 mm long, sparsely loose-pubescent. Flowers 12-18 mm in diam.; peduncles 2-7 mm long; pedicels 2-5 mm long; bractlets ovate, thin, pubescent, amplexicaul, 0.4-1.0 mm long; sepals elliptic, rounded at the apex, ciliate, otherwise glabrous, 2-3 mm long; calycine glands oblong-elliptic, to 3 mm long, the upper part sometimes free, somewhat spreading at least on drying; petals 3-5 mm long, yellow, glabrous, clawed, the blade suborbicular to obovate, the claw 1.2-1.8 mm long; stamens glabrous, exserted and recurved over the sepals, the filaments flattened, greatly tapered toward the apex, ca. 1.5 mm long, the anthers elliptic, 1.2-1.5 mm long; ovary densely hirsute-velutinous, the styles to 2.5 mm long, thick, glabrous, dilated at the apex. Samaras tan to pale brown, conspicuously pubescent with patulous whitish trichomes especially in the lower 1/2 of the wings and on the body; lateral wings thin, the superior wing oblong, rounded at the apex, rarely truncate to subacute, 1.5-3.0 cm long, (5-)7-10 mm wide, distinct from the inferior wing to the base, the inferior wing subrounded, obovate to oval, 6-18 mm long, the dorsal wing rounded, 2-5 mm high.
