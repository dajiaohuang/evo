            locator: "SANBI/WFO archive Morphology row 98605; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Small and inconspicuous Hesperantha filiformis stands up to 150 mm high and has lax spikes of 1 to 3 small flowers with a particularly slender perianth tube about 12 mm long and tepals about 11 x 5 mm. Plants consistently have only three leaves, the lower two basal and the uppermost inserted in the lower third of the stem and sheathing for about half its length. The white flowers are closed during daylight hours so that only the dull grey-brown reverse of the outer tepals is then visible. The flowers open after dark between 19:00 and 19:30 and then have a mild, sweet odour. The ovoid corms are slightly asymmetric, being flattened on one side, with the woody, dark brown tunics typical of sect. Concentricae. Its relationships are uncertain but possibly lie with the Namaqualand species H. flexuosa, which also consistently has three leaves, the uppermost partly sheathing the stem, but the somewhat fleshy leaves of this species are linear and no more than 1.5 mm wide. The firm-textured leaves of H. filiformis are 3-5 mm wide and have thickened margins and main vein, very different from those of H. flexuosa. Capsules of H. filiformis are surprisingly long for so small a plant, 10-11 mm long, but seeds are so far unknown.
