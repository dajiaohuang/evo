    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants 90-150 mm high, with short membranous sheathing cataphyll. Corm broadly ovoid, flattened on one side in lower 1/3, 8-10 mm diam.; tunics woody, dark brown, notched below into sections. Stem erect, simple. Leaves 3, lower 2 basal, lanceolate to falcate, up to 50 mm long, mostly 3-6 mm wide, firm, margins and main veins slightly thickened, appearing raised when dry, uppermost leaf subbasal, partly sheathing stem, free in upper half. Spike lax, 1- to 3-flowered, spaced 9-12 mm apart; bracts green with membranous upper margins, outer ± 10 mm long, inner slightly shorter. Flowers crepuscular, salver-shaped, white, reverse of outer tepals mottled grey-brown along midline, opening after 19:00, tepals then outspread, sweetly scented; perianth tube cylindric, ± 12 mm long, well exserted from bracts; tepals subequal, elliptic, ± 11 x 5 mm. Filaments erect, ± 2 mm long; anthers held horizontally, ± 5 mm long, white; pollen white. Style branches ± 4 mm long, ascending, reaching to ± middle of anthers in closed flower. Capsules ± ovoid-elliptic, obtuse, smooth, ± 11 mm long. Seeds unknown.
            textZh: Hesperantha filiformis Goldblatt & J.C.Manning 的 SANBI 物种条目记录了形态特征。
            sourceIds:
