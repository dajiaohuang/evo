    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, 100-150 mm tall, branching at base, corm tunics brown, margins scalloped. Leaves linear to sword-shaped, ribbed. Flowers several in a lax spike, white with red markings on the lower tepals, perianth tube elongate, cylindrical, bracts keeled, curved upward at the tip.
            textZh: Lapeirousia verecunda Goldblatt 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_14562_0
            locator: "SANBI/WFO archive Morphology row 33277; source identifier 14562.0; cited publication: Goldblatt, P; Manning, JC. 2013. Iridaceae. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 94 - 124. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: This attractive species has odourless, long-tubed, usually 50-55 mm long, white flowers with red, round to heart-shaped marks on one or more of the three lower tepals, and flushed red on the reverse of the tepals and tube. The plane tepals, and fairly long and comparatively narrow bracts with deflexed apices are distinctive. Lapeirousia verecunda belongs to the group of species in sect. Chasmatocallis with bell-shaped corms that are ridged or regularly lobed on the basal rim. Lapeirousia silenoides has similar bracts but cerise flowers with spoon-shaped lower tepals.
            textZh: SANBI 条目提供了 Lapeirousia verecunda Goldblatt 的鉴别特征。
