          title: Xylopia frutescens Aubl., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: A medium-sized tree or shrub; young branchlets densely covered with about 2 mm. long, more or less ferruginous, erect-patent hairs. Leaves rigid, glabrous on upper side, densely covered underneath with long appressed hairs, lanceolate, acute at the base, rather long-acuminate, 4-6 cm. long and 0.8-1.5 cm. broad; petioles 2-4 mm. long. Inflorescences 1-5-flowered, axillary. Sepals ovate, about 2 mm. long, shortly connate at the base. Outer petals 8-11 mm. long and 2.5 mm. broad, oblong- obtuse, sericeous; inner petals a little shorter and narrower. Carpels 6 (or more ?); style with stigma 4 mm. long, glabrous, curvate and thickened above the base. Monocarps 10-13 mm. long and 9-10 mm. broad, rhomboid-globose, obtuse, con- tracted at the base into a stipe 1-2 mm. long. Seeds 2 (or 1), ovoid, black, 6-7 mm. long.
