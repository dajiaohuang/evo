    facets:
      morphology:
        status: partially-supported
        claims:
          - text: "Cormous geophyte, up to 220 mm high. Leaves with blade broad, leathery, glabrous, margins and midrib prominent. Flowers: open late afternoon and close after dark; stamens erect, filaments 3-6 mm long, anthers 3-9 mm long, yellow to whitish; style branches ascending to spreading, as long as or longer than stamens; perianth with tube 14-22 mm long, segments 15-20 mm long, white; Aug.-Oct."
            textZh: Hesperantha longituba (Klatt) Baker 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_16273_0
            locator: "SANBI/WFO archive Morphology row 71835; source identifier 16273.0; cited publication: Retief, E; Meyer, NL. 2017. Iridaceae. In: E Retief & NL Meyer (eds), Plants of the Free State: Inventory and identification guide, Strelitzia 38: 934 - 956. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Recognised by the relatively large white flowers that open in the late afternoon and close after dark, Hesperantha longituba has tepals 15-22 mm long and a perianth tube usually 14-22 mm long. The leaves are broad and leathery with prominent, raised margins and midrib. The large corms, up to 18 mm diam., have overlapping tunics notched into segments below, like those of several western Karoo species, including H. cucullata, H. humilis and H. vaginata and on this basis H. longituba appears allied to these species rather than to those of eastern southern Africa. Hesperantha longituba is sometimes confused with a second spring-flowering species from eastern southern Africa, H. candida, and has at times been included in that species. The two differ mainly in the length of the perianth tube, mostly 14-22 mm long in H. longituba vs. 10-12 mm long in H. candida. The flowers of the latter, as far as are known, are diurnal (confirmed by notes on some herbarium collections) whereas those of H. longituba are crepuscular. Plants from the Aliwal North and Stutterheim areas of Eastern Cape are intermediate in perianth tube length and make the distinction between the two species sometimes seem arbitrary but those from further west, at Cradock, Somerset East, and Graaff-Reinet always have a longer perianth tube, up to or even exceeding 22 mm.
            textZh: SANBI 条目提供了 Hesperantha longituba (Klatt) Baker 的鉴别特征。
