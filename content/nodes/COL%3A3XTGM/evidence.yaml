        usage:
          title: Mandevilla subsagittata (Ruiz & Pav.) Woodson, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Lianas, mostly glabrous or sometimes moderately pubescent. Leaves opposite, sparsely glandular along the midrib, elliptic or oblong-elliptic, acute, subhastate to auriculate basally, to 8 cm long and 3.5 cm wide, glabrous or sparsely pubescent on the veins, membranaceous; petioles + pubescent, 2-5 mm long. Inflorescences racemose, axillary, to ca. 9 cm long. Flowers with the pedicels 3-5 mm long; "bracts scarious, lanceolate, 1-5 mm. long"7; calyx lobes subequal, deltoid, ca. 1 mm long, each bearing 1 oppositely placed squamella; corolla salverform, yellow with a red throat, the tube ca. 25-30 mm"-lon-g, gibbous, somewhat pubescent near the top, the lobes obovate to oblong, ca. 12-16 mm long and 9-12 mm wide, spreading, sparsely pubescent beneath; stamens included, attached near the top of the corolla throat, the anthers ca. 1.5 mm long; nectaries 5, some- times fewer and concrescent, ca. half as high as the ovary. Follicles unknown.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 725
