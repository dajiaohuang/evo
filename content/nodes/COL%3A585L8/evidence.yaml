        usage:
          title: Trianthema portulacastrum L., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Herbaceous annuals, erect or prostrate, the young stems sometimes with a decurrent line of hairs from the interpetiolar stipules to the node below and glabrescent, often alternately branched by the development of the axillary bud subtended by the smaller leaf of the nodal pair. Leaves of any pair strikingly unequal, the larger at least twice as large as the smaller, obovate to rounded- spatulate, 1-3 cm. long, 0.5-2.0 cm. broad, acute, obtuse, retuse and often mucronulate at the apex, cuneate at the base, glabrous above and below; petiole 0.3-1.5 cm. long, at the base connate into a sheath surrounding the stem, the interpetiolar stipule deltoid, 1-2 mm. long, remotely serrate or entire. Inflorescence with the flowers solitary; sessile. Flowers with the perianth tube campanulate, often intimately associated with the petiolar sheath of the subtending leaves, the lobes lanceolate, about 1.5 mm. long, 1 mm. broad, glabrous, appendage horn-like, barbed about 0.75 mm. long; stamens 10, inserted at the orifice of the perianth tube, the filaments filiform, about 1.5 mm. long, glabrous, the anthers ovoid, about 0.5 mm. long and broad; ovary turbinate, about 1 mm. long, I mm. in diameter, truncate and irregularly fleshy-lobed at the apex, glabrous, the style 1, about 1 mm. long. Capsule almost enclosed in the petiolar sheath, turbinate, about 4.5 mm. long, 3.5 mm. in diameter, sessile, truncate and crested at the apex, circumscissile at about the middle; seeds 2-5, reniform, 1.5-1.75 mm. in diameter, the testa wrinkled, reddish-brown to black.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 334
