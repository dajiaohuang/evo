  claims:
    - subjectId: taxon:acari
      claimKind: scientific
      claimType: topology
      statement: Mitochondrial metagenomics samples soil-mite diversity and yields a model-based Acari topology and divergence estimates. Both topology and ages are conditional on the mitochondrial sample and clock model, not direct observations of acarine origin or global range.
      confidence: medium
      confidenceRationale: Confidence is medium because the cited primary study directly supports the bounded topology statement at the supplied locator. The confidence does not extend beyond both topology and ages are conditional on the mitochondrial sample and clock model, not direct observations of acarine origin or global range.
      referenceLinks:
        - relation: supports
          referenceId: arribas-2020-acari-metagenomics
          pages: 683–694
          figure: Figures 1–4; supplementary data
          quoteLocator: Metagenomic sampling; phylogeny; molecular dating
    - subjectId: taxon:acari
      claimType: fossil-range
      claimKind: scientific
      statement: The 410–0 Ma Acari display begins with the oldest securely accepted reviewed mite record and remains a broad fossil-to-living envelope rather than a consensus crown age.
      confidence: contested
      confidenceRationale: The fossil review directly rejects unsupported older assignments, but contested Acari topology limits the interpretation of this broad navigation concept.
      referenceLinks:
        - referenceId: sidorchuk-2018-acari-fossil-record
          relation: supports
          pages: 349–359
          figure: Fossil dataset
          quoteLocator: Abstract and dataset, more than 260 fossils from approximately 410 Ma onward and rejected older assignments
  claim-rationales.zh:
    - 置信度为中：所引主研究在给定页码、图版或章节定位器处直接支持这一受限的拓扑表述；置信度不外推到文中明确排除的全群起源、全球首现、直接祖先或精确端点。
    - 化石综述直接排除不可靠的更老归属，但蜱螨类拓扑争议限制该宽泛导航概念的解释。
  claim-statements.zh:
    - 线粒体宏基因组抽样土壤螨类多样性，并给出模型化的螨类拓扑和分歧估计。拓扑与年龄都受线粒体样本和时钟模型制约，不是螨类起源或全球延限的直接观测。
    - 410–0 Ma 的蜱螨类显示从综述接受的最早可靠螨类记录开始，是宽泛的化石至现生包络，而非公认冠群年龄。
