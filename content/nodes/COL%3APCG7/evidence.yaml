    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Tufted, erect perennial, 0.6-1.2 m high; rhizomes creeping. Leaf blade up to 450 x 10 mm; ligule an unfringed membrane, sometimes erose. Inflorescence a narrow, contracted, dense panicle, up to 250 mm long, green or tinged with purple, becoming light brown. Spikelet 5.5-8.0 mm long, laterally compressed, disarticulating above glumes; glumes ± equal, longer than spikelet. Floret 1, bisexual; lemma glabrous, awned from back well below apex, awn 3-4 mm long, fine and straight; callus with conspicuous, long, white hairs that are longer than lemma. Flowering time Jan.-May.
