    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Eine ausdauernde, einstengelige, wenig verholzende Pflanze von 40-55 cm Größe. Stengel ± hochgabelig verzweigt, spinnwebigfilzig und drüsig behaart. Blätter des unteren Stenqelabschnittes lanzettlich, bis zu 13.5 x 3 cm groß, sitzend, wechselständig, aber sehr dicht stehend, Rand gezähnt, kaum umgerollt. Blätter des oberen Stenqelabschnittes allmählich schmäler und kürzer, lanzettlich bis pfriemlich, sitzend, Blattbasis als Flügel am Stengel herablaufend, locker stehend, ganzrandig, Rand ± umgebogen, alle Blätter oberseits stark drüsig und schwach spinnwebig, unterseits stark spinnwebig-filzig und schwach drüsig behaart, nur die pfriemlichen Blätter 1-nervig, alle anderen netznervig. Köpfchen (bis 14) an beblätterten Zweigen. Involucrum schüsselförmig bis halbkugelig, 9.5-13 mm hoch, 6 bis 7-reihig, grünlich-braun. Die äußeren Hüllschuppen länglich, zugespitzt, nach innen hin lanzettlich bis linealisch, die äußersten (3.1-4) x (0.5-0.9) mm, die inneren (6.2-7.3) x (0.9-1.4) mm, die innersten (6-6.9) x (0.31-0.35) mm, grün, strohig bis hyalin, die äußeren mit Gliederhaaren, die inneren mit Drüsenhaaren ± struppig besetzt. Zunqenblüten 27-38, Liqula schmal lanzettlich bis länglich, (10.5-11.5) x (2.4-3.0) mm, violett, 4 bis 6-nervig, drüsig behaart. Scheibenblüten viele (92-99), Krone 5.2-5.6 mm lang, gelb, drüsig behaart. Pappus ein Kranz aus zerschlitzten Schuppen, 0.4-0.6 mm lang. Achänen (noch nicht reif) schmal elliptisch, im Querschnitt rundlich, 4 bis 6-kantig, (1.6-2.0) x (0.5-0.6) mm, mittelbraun, stark mit borstigen Zwillingshaaren und Drüsenhaaren besetzt.
