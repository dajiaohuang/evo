    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Dwarf, glabrous, often single-stemmed succulent, up to 150 mm tall, stems leafless, cylindrical-clavate, 12-16-angled, tuberculate, up to 60 mm diam. Flowers 1-5, in sessile clusters, congregated near apex, pedicels 1-2 mm long. Corolla campanulate, 6-15 mm diam., inside papillate and glabrous, each papilla tipped with a small, apical bristle, cream, with maroon bars and rings, tube 1-3 mm long, lobes deltate, 2-3.5 x 2.5-5.5 mm, without marginal cilia. Corona spotted with red on yellow, outer lobes bifid, inner adpressed to anthers and not exceeding them.
            sourceIds:
