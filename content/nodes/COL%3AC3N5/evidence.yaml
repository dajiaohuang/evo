    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Short-stemmed, usually solitary, up to 1 m tall. Leaves with numerous longitudinal lines, copiously spotted on both surfaces in young plants, some spots on upper surface in mature plants, unarmed, margins brown, horn-like, with small, sharp, triangular teeth. Flowers in unbranched, narrow, oblong racemes, yellow to greenish yellow, buds sometimes red, hidden by long bracts. (In west) July-Sept. (in east).
            textZh: Aloe gariepensis Pillans 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_14533_0
            locator: "SANBI/WFO archive Morphology row 32906; source identifier 14533.0; cited publication: Klopper, RR; Smith, GF. 2013. Asphodelaceae: Aloe. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 45 - 48. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Aloe gariepensis is the only species in this section in which the flowers are usually yellow both in bud and at flowering. Plants are usually solitary, unlike the much-branched, shrubby A. succotrina, and the leaf sap does not dry purple, with the result that dried leaves are not this colour. The leaves of A. gariepensis are lined, and may be spotted or unspotted.
            textZh: SANBI 条目提供了 Aloe gariepensis Pillans 的鉴别特征。
            sourceIds:
              - sanbi_5961_0
            locator: "SANBI/WFO archive Diagnostic row 51287; source identifier 5961.0; cited publication: Glen, HF; Hardy, DS. 2000. Aloe. In: G Germishuizen & E du Plessis (eds), Aloaceae (first part), Fl. S. Africa 5(1,1): 1 - 167. National Botanical Institute, Pretoria. [http://www.biodiversitylibrary.org/item/209564#page/3/mode/1up]. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Leaves are always lineate, but vary from entirely without spots to copiously spotted both sides in various localities. Racemes also vary from the usual unicoloured greenish-yellow form to reddish, and bicoloured. A. gariepensis is the only species in this series having long cylindric-acuminate racemes 35-50 cm long, pedicels only 15-20 mm long, and bracts much longer than their pedicels.
            textZh: SANBI 条目提供了 Aloe gariepensis Pillans 的鉴别特征。
