              - sanbi_13236_0
            locator: "SANBI/WFO archive Diagnostic row 78127; source identifier 13236.0; cited publication: Reynolds, GW. 1974. Aloes of South Africa, 3rd ed. A.A. Balkema, Cape Town. [All rights reserved]"
