    facets:
      morphology:
        status: partially-supported
        claims:
          - text: The treatment distinguishes Hollandichthys taramandahy from H. multifasciatus by a small black spot at the base of the median caudal-fin rays, lack of distinctive adipose-fin marks, and absence of a humeral spot in specimens over 60 mm SL. In the comparative diagnosis, dorsal and ventral procurrent caudal-fin ray counts were 8-11 (mode 10, n=20) and 7-8 (mode 8, n=20), respectively, versus 10-15 (mode 12, n=72) and 9-12 (mode 10, n=72) for H. multifasciatus. The description also reports retrorse bony hooks on the anal and pelvic fins of sexually mature males. Counts and traits are limited to the treatment's examined specimens and stated comparison samples.
            originalLanguage: en
            sourceIds:
              - bertaco_malabarba_2013
              - plazi_archive_3m86z
            locator: Plazi description-extension row 4 (diagnosis), row 5 (description); treatment https://treatment.plazi.org/id/B865879AFFCAC57BFC5E29ADFAF7F974; original article p. 769 (Plazi row 4) and pp. 770-774 (row 5); DOI 10.1590/S1679-62252013000400004; source archive 033dea15-2311-43cb-8a89-cbb8e73e7988.zip; archive SHA-256 4b4c7d3cc01622331792cca5ac524ff0bf497472ac43123de5873cf7d495a01f. Source ZIP absent from checkout; embedded EML not rechecked. Article item-level reuse rights unknown.
            placeTimeScope: Comparative diagnosis on p. 769 and specimen description on pp. 770-774 in the 2013 treatment. Ray counts are the diagnosis's stated samples (n=20 for H. taramandahy and n=72 for H. multifasciatus); no population-wide variation estimate is inferred.
            lifeStatus: Morphology of specimens described in the taxonomic treatment; the male hook character is explicitly reported for sexually mature males. No universal claim about all individuals or life stages is made.
        gaps:
          - Selected diagnostic and descriptive characters come from one taxonomic treatment and its stated comparative or examined samples; neither dossier assesses variation across all populations or life stages. The Microglanis lundbergi article's morphometric table reports n=9 while its listed type series totals 10 specimens; that difference is unresolved.
      lifeHistory:
        status: not-assessed
        claims: []
        gaps:
          - No systematic reproductive, developmental, lifespan, or full behavioral life-history search was performed.
      ecology:
        status: partially-supported
        claims:
          - text: For specimens reported in this treatment, the authors describe captures in lateral river puddles and very small tributaries with shallow, still black water, muddy and leaf-covered bottoms, and dense riparian vegetation. They report larger specimens (70-80 mm SL) found alone and smaller specimens (30-40 mm SL) collected in groups of 3-6. Stomach contents from three MCP 24621 specimens contained spiders, ants, beetles, and insect parts. These observations are limited to the article's collection and stomach-content samples, not a species-wide habitat or diet rule.
            originalLanguage: en
            sourceIds:
              - bertaco_malabarba_2013
              - plazi_archive_3m86z
            locator: Plazi description-extension row 8 (biology_ecology); treatment https://treatment.plazi.org/id/B865879AFFCAC57BFC5E29ADFAF7F974; original article p. 774 (Plazi row 8); material and locality/date for MCP 24621 on p. 769; DOI 10.1590/S1679-62252013000400004; source archive 033dea15-2311-43cb-8a89-cbb8e73e7988.zip; archive SHA-256 4b4c7d3cc01622331792cca5ac524ff0bf497472ac43123de5873cf7d495a01f. Source ZIP absent from checkout; embedded EML not rechecked. Article item-level reuse rights unknown.
            placeTimeScope: Ecological notes on p. 774 refer to the paper's examined collections. The three stomach-content specimens are lot MCP 24621, listed on p. 769 from the rio do Ouro tributary at Maquiné, Rio Grande do Sul (type locality), collected 31 August 1999. Habitat observations are not extrapolated to unreported sites or all populations.
            lifeStatus: Wild collection observations and contents from three prepared specimens only; no species-wide trophic or behavioral inference is made.
        gaps:
          - Habitat and diet claims are limited to the selected treatment notes, collection labels, localities, and sample sizes. Sampling completeness, seasonal ecology, trophic importance, and species-wide habitat preferences remain unassessed.
