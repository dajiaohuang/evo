        usage:
          title: Stizophyllum inaequilaterum Bureau & K.Schum., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: simple, usually kinky trichomes, the nodes without interpetiolar glandular fields; pseudostipules usually inconspicuous or lacking, sometimes linear with a thick- ened tip. Leaves 3-foliolate or 2-foliolate with tendril or tendril scar; leaflets more or less oblong-elliptic, acuminate, asymmetrically truncate or subcordate, 5.6-13.1 cm long and 3.0-6.1 cm wide, membranaceous, sometimes inconspicu- ously serrulate, more or less pinnately veined to the base, secondary nerves 4-7 on a side, regularly sunken-lepidote glandular below, hence pellucid punctate, hirsute on nerves, especially beneath with long, simple trichomes, these arising sporadically from even minute reticulations, drying dark olive to yellowish-olive, the veins usually brownish beneath; tendril trifid, 8-16 cm long to branching, the 3 arms 0.6-2 cm long; terminal petiolules 1.1-3.7 cm long, lateral petiolules 0.4-2.3 cm long, petiole 2.2-7.5 cm long, pubescent with long simple curly tri- chomes. Inflorescence a long-bracteate, few-flowered terminal fascicle or a contracted raceme terminal on a young lateral shoot, the branches hirsutely reddish-pubescent, the bracts linear, pubescent, to 2 cm long. Flowers with the calyx membranaceous, inflated-campanulate, 12-18 mm long and 9-10 mm wide, the edge irregular, drying light green, slightly lepidote and sparsely hirsute, usually with glands; corolla greenish-yellow with lavender lobes, 5-6.5 cm long and 1-1.5 cm wide at the mouth, the tube 3.8-4.8 cm long, the lobes 0.8-1.0 cm long, the tube glandular-lepidote and puberulous outside, the lobes pubescent, the tube mostly glabrous inside; stamens didynamous, the anther thecae divari- cate, sparsely ciliate with short trichomes along the margins, ca. 2 mm long, the longer filaments 2-2.1 cm long, shorter filaments 1.5-1.6 cm long, inserted 1.3-1.4 cm from the base of the tube; pistil and ovary not seen in the 2 flowers available for study. Capsule linear, narrow, subterete in cross section, 30-32.5 cm long and 4-5 mm wide, densely hirsute or villous.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 2273
          archiveSourceId: C0CE7FC2-1262-44D0-B5F4-C27B6F217991
