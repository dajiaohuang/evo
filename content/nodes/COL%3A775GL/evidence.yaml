          title: Persea veraguasensis Seem., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Tree from 3-18 (-25) m. high; branchlets densely striate, angled, densely subferruginous-sericeous becoming glabrescent and atro-rubescent or gray-brown- maculate. Leaves alternate; petioles slender to robust, rusty-pubescent to gla- brescent, 2.5-3 cm. long; blades dark green, shining above, glabrescent and pale or glaucescent beneath, and sericeous-pubescent,' chartaceous, oblong-elliptic or elliptic, 8-17 cm. long and up to 6 cm. broad, the base obtuse or cuneate, some- times subrhomboid, the apex acute, acuminate or obtuse, the lateral nerves 8-1i0 pairs, conspicuous beneath, diverging from the costa at an angle of 35-45?. Inflorescence axillary, of few-flowered, ferruginous- or buff-sericeous-tomentose panicles shorter than the leaves, up to 6 cm. long, the peduncle sericeous. Flowers to,4 mm. long, sessile or with sericeous pedicels up to 1 mm. long; perianth-lobes fleshy, unequal, the outer 1.3-2.5 mm. long, the inner 2.5-4.5 mm. long; stamens 2.15-2.6 mm. or more long (ser. II & III longer); staminodia to 1.7 mm. long, ligulate, pubescent; gynaecium 3.42 mm. long, the ovary glabrous, ovoid, slightly stipitate, the style pubescent, the stigma triangular-discoid. Fruit globose, apicu- late with bluish bloom, 10-11 mm. in diameter, subtended by the enlarged perianth-lobes and seated on the enlarged red pedicel.
