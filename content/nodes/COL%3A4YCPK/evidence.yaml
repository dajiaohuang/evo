          title: Sorocea pubivena Hemsl., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Trees to about 20 m. Leafy twigs rather thick (2-4 mm.), short-pubescent becoming glabrescent. Leaves alternate, distichous, petiolate, the blade broadly elliptic to elliptic-oblong, caudate-acuminate, the base equilateral and obtusely cuneate, entire to serrate-undulate, 10-30 cm. long, 5-10 cm. broad, firmly mem- branaceous, shortly pubescent beneath, the petiole about 8-20 mm. long; stipules narrowly acute, 6-8 mm. long. Staminate spikes 5-12 cm. long bearing numerous sessile flowers interspersed with minute peltate bracts; tepals 4, somewhat united at the base, about 2 mm. long, filaments broad and slightly connate at their base. Pistillate racemes short, elongating in fruit to 14 cm. bearing numerous flowers about 2 mm. long, the perianth thickened above, adnate to the ovary for about half its length. Drupes subglobose to ovoid, about 10 mm. broad.
