          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Trees to about 10 m. in height, the young twigs slender, minutely puberulent when very immature, becoming glabrate. Leaves broadly elliptic to oval-obovate, rather abruptly subcaudate-acuminate, broadly obtuse to rounded at the base, 8-20 cm. long, 4-7 cm. broad, entire, membranaceous, glabrous, the petiole slender, about 1 cm. long; stipules about 5 mm. long, narrowly lanceolate. Staminate heads discoid, about 1 cm. in diameter, prominently involucrate with several broadly ovate minutely tomentellous bracts about 2 mm. long, the peduncle about 8 mm. long. Pistillate heads globose, about 2 cm. in diameter, the peduncle about 1 cm. long, without a definite involucre.
