            en: PLEO density estimates from Gunung Niut Nature Reserve, West Kalimantan, based on April–May 2019 interviews and ten sample units covering 167 km²; Abbott’s gray gibbon was estimated at 1.70 individuals/km² (CV 0.16; 95% interval 1.13–2.26). This is local pooled opinion, not a direct species-wide census.
            zh: 支持西加里曼丹 Gunung Niut 自然保护区 2019 年 4—5 月的 PLEO 汇集估算及十个合计覆盖 167 平方公里的样区；研究给出 Abbott 灰长臂猿每平方公里 1.70 只的估算（CV 0.16；95% 区间 1.13—2.26）。这是局地意见汇集结果，不是全物种直接普查。
