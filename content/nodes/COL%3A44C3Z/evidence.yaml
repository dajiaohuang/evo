        claims:
          - text: Acaulescent, cormous geophyte, 5-10(-20) cm. Leaves 3-5, sparsely to densely hairy, usually grey. Flowers blue or yellow, rarely white, spicy-fragrant.
            textZh: Moraea ciliata (L.f.) Ker Gawl. 的 SANBI 物种条目记载了植株、叶片和花部形态。
            sourceIds:
              - sanbi_13878_0
            locator: Strelitzia 29; archive Morphology row 6917, source 13878.0
            placeTimeScope: Regional species account published 2012; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
          - text: Distinguished in subg. Acaules by the often pubescent leaves and spathes, and most frequently blue flowers with relatively slender inner tepals, either linear-spathulate or narrowly lanceolate, and slender style crests. The capsules of Moraea ciliata are the longest in the subgenus, 10-28 mm long, and the seeds are more-or-less globose or somewhat angled by pressure and ± 2 x 2-3 mm. Two additional subspecies are recognised, yellow-flowered subsp. lutescens and white- or pale pink-flowered subsp. cuprina. The subspecies have separate but complimentary ranges and are weakly differentiated from one another. Moraea ciliata is easily distinguished from M. tricolor, which has broad style crests longer than the style branches, and tepal claws shorter than the limbs. Closely related M. macronyx has the tepal claws much longer than the limbs, whereas in M. ciliata the claws are slightly shorter than to about as long as the limbs.
            textZh: SANBI 条目提供了 Moraea ciliata (L.f.) Ker Gawl. 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: Strelitzia 42; archive Diagnostic row 94161, source 18638.0
