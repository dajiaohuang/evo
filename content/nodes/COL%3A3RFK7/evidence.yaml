    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Small, stout, succulent tree, 3-5 m, branching dichotomously, without persistent dried leaves. Leaves distichous, dull green to glaucous-green, without spots, broadly linear to lorate, apex rounded, ± 30 cm long; margins minutely dentate in upper third or almost entire. Racemes cylindric, lax, simple, to 50 cm long. Flowers scarlet, to 55 mm long; stamens and stigma exserted.
            textZh: Kumara plicatilis (L.) G.D.Rowley 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13850_0
            locator: "SANBI/WFO archive Morphology row 9014; source identifier 13850.0; cited publication: Klopper, RR; Smith, GF. 2012. Asphodelaceae: Aloe L. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 66 - 70. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: A.plicatilis is a unique and striking plant, with its many clusters of distichous strap-shaped leaves, each cluster resembling an open fan. In leaf it is closely allied to A. haemanthifolia, but the latter is a very small stemless plant growing in groups, with a dense capitate raceme, and could never be confused. Large specimens of A. plicatilis reach 4.6 m [as '15 ft.'] in height, and are characterized by their dichotomous method of branching and rebranching, caused by the leaf clusters dividing into two at the summit, these in turn each redividing in the same manner. The inflorescence is simple, never branched, one only springing from a leaf cluster. The flowers reach 55 mm in length, are rather thick and fleshy, and it appears, are always scarlet.
            textZh: SANBI 条目提供了 Kumara plicatilis (L.) G.D.Rowley 的鉴别特征。
            sourceIds:
              - sanbi_13236_0
            locator: "SANBI/WFO archive Diagnostic row 78147; source identifier 13236.0; cited publication: Reynolds, GW. 1974. Aloes of South Africa, 3rd ed. A.A. Balkema, Cape Town. [All rights reserved]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
