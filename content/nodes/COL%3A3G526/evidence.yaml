        claims:
          - text: Cormous geophyte with reduced leaves, 30-45 cm, tunics fibrous. Leaf produced after flowering on a separate shoot, linear, solitary, hairy. Flowers tulip-shaped, scarlet.
            textZh: Gladiolus stokoei G.J.Lewis 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 7233; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Unmistakable in its nodding, scarlet flowers with obovate, cupped tepals. The reduced, bract-like and softly hairy leaves on the flowering stem distinguishes it from the unrelated, summer-flowering Gladiolus insolens from the Piketberg, which has remarkably similar flowers but a basal fan of smooth, well-developed leaves.
            textZh: SANBI 条目提供了 Gladiolus stokoei G.J.Lewis 的鉴别特征。
