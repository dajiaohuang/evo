    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Like P. geminatus but flowers 5.0-13.5 mm diam., with petals to 2 mm wide, uniformly pale yellow or faintly lined with red-brown, inner corona lobes adpressed to backs of anthers at base only then erect.
            sourceIds:
              - sanbi_14102_0
            locator: "SANBI/WFO archive Morphology row 9801; source 14102.0; publication: Bruyns, PV. 2012. Apocynaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 331 - 343. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Piaranthus parvulus is often easy to recognise even when not in flower by the numerous inflorescences towards the apices of the stems which form slightly knobbly peduncles. Flowers are usually produced in large numbers, each inflorescence often bearing as many as 10 of them in various stages of development. The flowers themselves are distinctive for their small size. They may reach 13 mm in diameter but are often only 10 mm across or even smaller (down to 6 mm), with the lobes mostly less than 2.2 mm broad (occasionally up to 3 mm). Like the corolla, most of the other parts of the flower are also smaller. So, for example, the corona is usually less than 3 mm across (where in most of the others it is generally over 4.5 mm in diameter) and the anthers are smaller. As a consequence, the pollinia are usually about half the size of those in the other species (at ±0.23 -0.35 mm long, where they are normally 0.5 -0.7 mm long). However, it should be noted here that even this feature is variable and some specimens in the Ceres Karoo (e.g. Tulpfontein) also have considerably larger pollinia (up to 0.42 mm long). One of the distinctive features of P. parvulus is the ascending to erect orientation of the inner corona lobes. This is sometimes found in P. punctatus as well and nearly always in P. cornutus but is absent in the ‘geminatus’ complex. They are usually only adpressed to the anthers in the lower half (of the anthers) after which they rise, sometimes straight up above the anthers, occasionally with recurved tips, while on other occasions they may be somewhat connivent towards the centre. As is usual, they are very variable in shape, varying from slender and more or less linear to relatively broad and dorsally channelled. Piaranthus parvulus occurs together with P. punctatus in the southern Ceres Karoo around the foot of Skittery Kloof, with P. comptus around Laingsburg and together with P. geminatus subsp. decorus on the south-eastern side of the Ceres Karoo along the foot of the escarpment. For the most part it appears that the small pollinia prevent any hybridisation from taking place. The only evidence for any intergradation, in this case with P. comptus, is found in some specimens from around the Rooinek Pass south of Laingsburg. These plants had fairly small flowers (13 mm in diameter), large outer coronal crests beneath the inner lobes and inner lobes adpressed to the anthers for their whole length, ascending but not erect.
