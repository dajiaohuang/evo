    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Unarmed, divaricate, woody shrub up to 0.5 m high. Bark and branches light brown, smooth, minutely lenticellate, branchlets slightly compressed, angulate. Leaves erect, trifoliolate, petiolate; petiole margined, flattened above, midrib slightly raised in middle, relatively long, (15-)20(-35) mm long; leaflets sessile, coriaceous, glabrous, concolorous, dark green, amphistomatous; lamina oblanceolate, obtrullate or obovate, base attenuate to cuneate, apex rounded to obtuse, mucronate; margin entire, thickened, slightly revolute, frequently dull whitish; venation kladodromous, midrib prominent below, slightly prominent above, secondaries 2 or 3 per cm, impressed, other veins hidden; terminal leaflets (27-)47(-66) x (10-)16(-20) mm, lateral leaflets (21-)34(-46) x (7-)12(-18) mm. Panicles up to 40 mm long, sparingly branched, mostly axillary within foliage, occasionally terminal. Flowers glabrous, calyx lobes ovate, 1 mm long, corolla lobes ovate, 2 mm long, cream, styles separate, semipersistent. Drupe circular, globoid to obloid, glabrous, shiny, yellow to red while fleshy, relatively large, 6.6 x 5.7 - 7.3 x 6.8 mm, stone discoid.
