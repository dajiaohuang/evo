    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Annual, loosely tufted (usually erect), up to 0.8 m high. Leaf blades 30-150 mm long, 2-4 mm wide. Leaf sheaths nearly always dotted with oblong glands. Spikelets 3-8 mm long, 0.5-1.5 mm wide. Inflorescences with lowest branches whorled; spikelet with rhachilla persistent in lower part and fragile above, lemmas and/or paleas breaking up from base upwards; lower glume four-fifths as long as to longer than lemma above in intact spikelet; lowest lemma 1.5-1.7 mm long, chartaceous to membranous, broadly elliptic, obtuse to subacute, lateral nerves obscure; palea keels minutely scaberulous; anthers 3, 0.8-1.0 mm long. Caryopsis ellipsoid.
