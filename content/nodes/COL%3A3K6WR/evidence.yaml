    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Perennial herb, roots fusiform, tuberous, stock small, producing slender stolons, flowering stem terminal, solitary, simple, 200-300 mm tall, white-woolly-felted, remotely bracteate. Leaves ±4-6, spreading flat on ground, 25-30 x 18-25 mm, obovate to subrotund, slightly narrowed to a broad clasping base, apex rounded or very obtuse, upper surface with long coarse multicellular hairs, lower thinly white-felted, soon glabrescent, prominently 5-nerved, side nerves invisible; bracts few, distant, small, oblong to lanceolate, indumentum as in leaves, but wool persistent. Heads homogamous, campanulate, ±4 x 4 mm, ±15-25 in a compact rounded terminal cluster, bases webbed together with white wool. Involucral bracts in ±5 series, imbricate, subequal, about equalling flowers, straw-coloured or tawny, tips slightly darker, opaque, very obtuse, erose, crisped, scarcely radiating. Receptacle with fimbrils much exceeding ovaries. Flowers 19-26, yellow. Achenes not seen, ovaries 0.75 mm long, glabrous. Pappus bristles many, equalling corolla, scabrid, bases cohering strongly by patent cilia, sometimes lightly fused as well.
            sourceIds:
