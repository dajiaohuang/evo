        usage:
          title: Mimosa pigra L., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrub to a few meters tall, sometimes scandent, the branchlets usually con- spicuously setose-hispid and armed with formidable recurved thorns. Leaves re- ported sensitive, moderate to large, bipinnate, the pinnae up to 15 or even more pairs opposite on the rachis, the leaflets usually about 25 or 30 pairs per pinna; petiole comparatively short, seldom more than 1 or 2 cm. long, eglandular, hispid like the twigs, usually aculeate; rachis 4-25 cm. long, similar to the petiole, egland- ular, the thorns frequently becoming acicular; pinnae 2-7 cm. long, hispid; leaflets linear, 2-8 mm. long and approximating 1 mm. in width, acute apically, inequi- laterally rounded or subtruncate basally, appressed-pubescent (especially below) and setose-ciliate margined, longitudinally few-veined, these veins prominent below; stipules ovate-lanceolate, as much as 8 mm. long, pubescent. Inflorescence of solitary or few-fasciculate, pedunculate heads, axillary from foliate and sub- terminal non-foliate nodes; peduncles up to 5 cm. long in age, hispid; head ovoid, dense; floral bractlets linear, 2-3 mm. long, pectinate above the middle. Flowers sessile, whitish; calyx tubular, about 2 mm. long, cleft to one side, laciniate apically, glabrous; corolla funnelform, about 4 mm. long, short-hispid apically, the 4 lobes less than I/2 the length of the tube; stamens 8, free, the filaments scabrous and expanded distally; ovary setose-hispid. Legume linear-oblong, mostly 4-7 cm. long and little more than 1 cm. wide, short-beaked, stipitate, flat, 7- to 20-seg- mented, densely hispid-setose both on the persistent margins and on the segments.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 5752
          archiveSourceId: A09C9F94-03DC-46DF-9301-10BB134F1B06
