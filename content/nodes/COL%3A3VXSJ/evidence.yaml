          title: Lonchocarpus atropurpureus Benth., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrub or tree 3-15 m. high. Leaves 5- to 9-foliolate; leaflets ovate-oblong to lanceolate, 2-6.5 cm. long, 1-3 cm. wide, obtuse to cuneate at the base, acuminate to an obtuse apex, subcoriaceous, dark green and glabrous above, paler and puberu- lent or sericeous beneath. Racemes slender, axillary, 1.5-8 cm. long. Flowers with the calyx broadly cupulate, 2 mm. long, minutely pubescent, at maturity subentire; petals dark purple or pinkish-purple; vexillum suborbicular, 9 mm. long, the lateral margins inflexed, deeply emarginate and slightly pubescent outside at the apex, otherwise glabrous; wing petals oblong, auriculate, the claw 2.2 mm. long, the blade 7.5 mm. long, glabrous. Legumes long-stipitate, compressed, flat, linear-oblong, 4-10 cm. long, 1 cm. wide, obtuse at the apex, glabrous, 1- to 4-seeded.
