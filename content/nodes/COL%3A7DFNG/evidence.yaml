          title: Ulmus mexicana (Liebm.) Planch., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Trees to 25 m. tall, the young branches sparsely hirsute to glabrous. Leaves lanceolate- to ovate-elliptic, 4-16 cm. long, 2-7 cm. broad, acute to attenuate at the apex, only the costa pubescent above, glabrous to puberulent below, serrate; petiole 4-10 mm. long, glabrous to sparsely hirsute. Inflorescence racemose, to 6 cm. long. Flowers with pedicel to 5 mm. long, hirsute; tepals 5, connate into a more or less campanulate tube, white; stamens 5, exserted, the filaments about 3.5 mm. long, the anthers about 0.75 mm. long, 1 mm. broad; ovary obovate, velu- tinous on margins, borne on a cuneate gynophore, the styles introrsely recurved, papillose stigmatic surface. Fruit obovate, 9-11 mm. long, 2.5-3.0 mm. broad; seed about 1.75 mm. long, 1.25 mm. broad.
