        usage:
          title: Tetrathylacium johansenii Standl., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Tree to 30 m high, the trunk sometimes buttressed, infrequently shrub, the branchlets inconspicuously puberulous to glabrous. Leaves with petioles to 7 mm long, the foliaceous stipules narrowly oblong-ovate, somewhat falcate, to 17 mm long and 3 mm wide, minutely puberulous; blade oblong, often narrowly so, or obovate-oblong, or elliptic-oblong, slightly unequal and rounded to subcordate at the base, long-caudate-acuminate at the apex, remotely repand-serrate to subentire along the margins, to 25 cm long and 9 cm wide, subcoriaceous, lustrous and glabrous above, dull and glabrous to minutely puberulous especially along the prominent costa beneath, the secondary veins prominulous below. Inflorescences to 8 cm long, the spikes to 2.5 cm long, much enlarged in fruit, the flowers very densely crowded along the secondary rachises (spikes), the primary and secondary rachises densely and minutely puberulous, the bracts and bracteoles minute, decidu- ous. Flowers white, the calyx 4(-5)-angled (by crowding of the flowers along the rachis), not gibbous, to 2 mm long, glabrous outside, pubescent inside, the lobes ca 0.5 mm long; stamens with the filaments ca 0.5 mm long, the anthers 0.5 mm long; ovary apparently glabrous. Bacca globose to obovoid, to 2.5 cm long, glabrous, the seeds ovoid, to 2 mm long.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 5910
          archiveSourceId: 89A77877-4DF4-4574-BF49-5CD3BEABE678
