          title: Inga punctata Willd., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Small or moderate tree to 15 m., the branchlets-strigose-puberulent and mark- edly lenticellate. Leaves moderately large, pinnate, 4- to 6-foliolate; petioles 2-4 cm. long, terete or nearly so, puberulent like the branchlets, swollen-callous basally; rachis similar to and (the internodes) about as long as or slightly longer than the petiole, wingless, bearing disc-like or subconic glands between insertions of *the petiolules (or these glands in part or entirely suppressed in some specimens); leaf- lets 2 or 3 pairs, elliptic to ovate, acuminate, those of the apical pair larger, up to 20 cm. long and 9 cm. wide, those of the lowermost pair usually about half as long and.broad, strigose-puberulent on both surfaces; stipules linear-lanceolate, 3-4 mm. long, caducous. Inflorescence an axillary, subterminal, paniculate or corymbi- form branch, the secondary spicate peduncles umbellate from the nodes, or some- times the spikes fasciculate or simple-umbellate directly from the axil; spikes short, the floriferous portion scarcely more than I cm. long, the many flowers densely congested. Flowers sessile, whitish; calyx subturbinate, 3-5 mm. long, the 5 teeth conspicuous but only about 0.5 mm. long, puberulent without; corolla tubular, somewhat expanded above the calyx, 7-9 mm. long, the lobes about 1 mm. long, pubescent without; stamens many, the filaments almost 2 cm. long in age, united into a tube for about I/2 their length, glabrous, the anthers minute, bilocular, only a fraction of a mm. long; ovary and style glabrous. Legume linear-oblong, about 13 cm. long and 2.5 cm. wide, slightly arcuate, lightly pubescent, flattened, some- what margined, apparently indehiscent.
