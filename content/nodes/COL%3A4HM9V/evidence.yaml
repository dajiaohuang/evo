        status: partially-supported
        claims:
          - text: "Large, cultivated, ornamental tree, up to 25 m high; trunk huge, succulent, soft-wooded, buttressed. Leaves bright green, ovate, base acute, apex hooked-truncate; petioles pinkish, ± 70 mm long. Inflorescences: racemes ± 100 mm long; male and female flowers on separate trees. Flowers creamy yellow, small, up to 100 mm long; pedicels up to 4 mm long. Sepals 5, ± united at base. Stamens 6 or 7 in one whorl. Carpels 5-7, styles ± straight. Flowering time Sept.-Apr. Fruit berry-like, succulent, green turning black, pendent."
