        claims:
          - text: Like H. aculeata but flower heads discoid and involucral bracts all ovate-lanceolate.
            sourceIds:
              - sanbi_14159_0
            locator: "SANBI/WFO archive Morphology row 11362; source 14159.0; publication: Manning, JC; Goldblatt, P. 2012. Asteraceae: Heterorhachis Sch.Bip. ex Walp. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 389 - 389. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Heterorhachis hystrix is readily distinguished from H. aculeata by its discoid capitula with conspicuous, pale yellowish green or cream-coloured involucral bracts. The outer three series of bracts are subsimilar, ± foliaceous and ovate, 5-8 mm wide, with plane or only weakly revolute margins, but the bracts of the inner series are much smaller and scale like, forming a distinct collar-like rim protruding 2-3 mm above the preceding series. This collar becomes indurated and is very conspicuous in fruit after the corollas have abscised. The conspicuous involucral bracts may play an attractive function in the pollination biology of the species analogous to the ray corollas in H. aculeata. The species is very similar in leaf to Berkheya ferox O. Hoffm., although the lobes in this species are some-what wider. However, the involucral bracts are much smaller and less conspicuous than in Heterorhachis and the cypselae and pappus scales are devoid of glandular hairs. The capitula in Heterorhachis aculeata, in contrast to those in H. hystrix, are distinctly radiate with a relatively inconspicuous involucre concolorous with the leaves and with the outer three series of bracts resembling the foliage, thus narrowly lanceolate, 3-5 mm wide, and with conspicuously revolute margins. The cypselae bear shorter glands throughout as well as some short twin hairs in the upper half, and the pappus is slightly longer, the inner scales ± 3 mm long. The innermost bracts are oblong and either unarmed or pungent but rather variable in size, with the larger ones typically cucullate. The two species appear to differ in their habit and ecology. The growth form in Heterorhachis hystrix is very characteristic, the plants branching near the base to produce short-lived, erect, rod-like stems up to 1 m tall, which die back after flowering and are replaced by a fresh flush of branches from near the base of the plant. The species, which is known from a single location on the intensively cultivated coastal plain, grows in well-drained, sandy soil with no evident bedrock, and the surrounding vegetation includes both Strandveld and Sand Fynbos elements. This contrasts with the shorter, rounded, bushier habit of Heterorhachis aculeata, mostly up to ± 500 mm high, which favours seasonally damp or waterlogged, loamy sand flats, at altitudes ranging from 100 m to about 800 m.
