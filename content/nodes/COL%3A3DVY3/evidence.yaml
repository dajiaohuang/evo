          - text: "(Dense) Valley Bushveld. Noorsveld, Arid Savanna, open karroid Valley Bushveld. on slopes between stones. F. felina subsp. britteniae is found in open rocky spots in dense thicket, in open grassy spots or under small bushes with a preference for north-facing slopes. Rainfall: 350-5(XX-700) mm. Geological formation: Karoo System, Ecca Series, tillite; Dwyka Scries; Bokkeveld Series. pH (H20) 6.7-7.7."
