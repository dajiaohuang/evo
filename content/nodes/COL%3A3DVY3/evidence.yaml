    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants clump-forming or shrubby, stem-forming with age; stems up to 120 mm long. Leaves spreading, ovate-rhomboid. 30-55(-70) x 12-33 mm, keeled; keel sharp, forming a pronounced chin in almost rectangular arrangement as seen from side, toothed; 6-10<-13) teeth on each margin. 3-5 mm broad at base. 2.5-5.0 mm long normally with long, papillate bristles; epidermis with well-developed wax cover, thicker than in subsp. felina; uniform or partially whitish green with numerous small greyish white dots or dull green with white clearly visible dots. Flowers large for genus, 60-80 mm diam.; petals 125-160; stamens 260-350. Nectaries mostly yellowish. Fruit stalk absent or (0.5-)2.2-3.8(-6.5) x 2.3-6.5 mm. 0.50-1.4 mm thick. Fruits easily falling off (tumble fruits). 7-13 x 10.5-13.0(-15.0) mm, 7-10 mm thick. Seeds 1.4-1.6 x 1.0-1.3 mm.
            sourceIds:
              - sanbi_5640_0
            locator: "SANBI/WFO archive Morphology row 79628; source 5640.0; publication: Groen, LE; Van der Maesen, LJG. 1999. Revision of the genus Faucaria (Ruschioideae: Aizoaceae) in South Africa. Bothalia 29(1): 35 - 58. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Faucaria felina subsp. britteniae is unique in the genus because of the (partially) whitish grey epidermis. This taxon deserves the rank of subspecies by the presence of numerous very small dots on the leaves, papillate bristles and restricted area of distribution. Additional features are the large number of teeth and the size. The most characteristic specimens with many, but rather small teeth are found at Ecca Pass, north of Grahamstown.
