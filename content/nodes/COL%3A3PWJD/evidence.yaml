          originalSourceText: Vines; stems slender and herbaceous, annuals, pilose, glabrescent. Leaves broadly ovate to subreniform, 1-3(-7) cm long, acute to rounded apically, cor- date basally, entire to somewhat angulate, glabrous beneath, ciliate, pilose above. Flowers on peduncles usually longer than the leaves, 1-3-flowered; sepals sub- lanceolate, 2-2.5 mm long, acute to acuminate, white pilose; corollas yellow to pale yellow, 10-15 mm long. Fruits capsular, subglobose, 3-4 mm in diameter; seeds black, minutely puberulent but glabrate.
