    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous herb, up to 450 mm tall. Stem erect or inclined, lowermost internode very long with leaf at first node, internodes above leaf shorter. Flowers lilac to blue-violet with yellow nectar guides ringed with dark mauve on outer tepals.
            textZh: Moraea natalensis Baker 的 SANBI 物种条目记载了植株、叶片和花部形态。
            sourceIds:
              - sanbi_11118_0
            locator: Strelitzia 6; archive Morphology row 2793, source 11118.0
            placeTimeScope: Regional species account published 1997; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
          - text: With moderate-sized, blue-mauve to violet flowers, only the outer tepals with nectar guides, and well-developed style branches and crests, Moraea natalensis has unexceptional flowers for subg. Polyanthes but stands out in having a solitary foliage leaf inserted well above the ground on a stem with a long basal internode. The leaf is green at flowering and narrowly channelled, sometimes with the margins tightly inrolled and thus apparently terete. The few to several branches are short and somewhat crowded above the axil of the foliage leaf. This distinctive growth form is shared among the eastern southern African species of the subgenus only with M. inclinata, a taller plant, usually with darker violet flowers, green rhipidial spathes with the outer only about half as long as the inner, and nearly globose capsules. In M. natalensis the rhipidial spathes are often almost dry at flowering with the outer spathe only slightly shorter than the inner, and the capsules are obovoid to club-shaped.
            textZh: SANBI 条目提供了 Moraea natalensis Baker 的鉴别特征。
            sourceIds:
