        usage:
          title: Turnera ulmifolia L., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Herb, erect, or small shrub, the branchlets usually densely pilose throughout, the hairs simple, pale, often appressed upwards. Leaves short- to moderately long- petiolate, the petiole to 10 mm long, usually densely appressed-puberulous; blade elliptic to narrowly elliptic, sometimes almost linear, infrequently obovate, the base attenuate-cuneate and conspicuously 2-glandular, sometimes inconspicuously so or rarely eglandular, the apex acute to rarely subacute, the margins serrate- crenate especially above the half, to 5 cm long and 2 cm wide, thin-chartaceous, puberulous on both sides, but the indumentum always denser and often grayish beneath, the costa and secondary veins slightly prominent below. Flowers axillary, solitary, heterostylous; pedicels shorter than to equalling the petioles of the sub- tending leaves and adnate to them; bracteoles linear-subulate, to 10 mm long and ca 0.5 mm wide, puberulous; hypanthium ca 5-7 mm long, puberulous; sepals nar- rowly triangular, ca 9-11 mm long and 2 mm wide at the base, puberulous out- side; petals inserted near the throat of the hypanthium, long-unguiculate, to 22 mm long, yellow, sometimes dark purple or brownish at the base; stamens inserted towards the base of the hypanthium, the filaments in short-styled flowers to 12 mm long, in long-styled ones to 8 mm long, the anthers ca 3 mm long; ovary densely sericeous; style in short-styled flowers ca 5 mm long, in long-styled ones to 10 mm long, the stigmas densely penicillate. Capsules broadly ellipsoid, ca 3-4 mm high, the pericarp greenish, tuberculate and densely sericeous to sparsely short-pilose; seeds slightly arcuate, ca 2.5 mm long, glabrous.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 13552
          archiveSourceId: BC879DC6-5B27-4394-BF7E-71CD07AEE5A7
