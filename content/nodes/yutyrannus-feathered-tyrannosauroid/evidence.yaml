      statement: Holotype ZCDM V5000 and referred specimens ZCDM V5001 and ELDM V1001 preserve filamentous integument in association with large tyrannosauroid skeletons; feather distribution and structure are observed, but insulation, display and whole-body coverage are functional reconstructions.
