  claim-rationales.zh:
    - 三件编目骨架直接把丝状体被与该类群关联；高置信度不延伸到颜色、完整覆盖或单一羽毛功能。
  claim-statements.zh:
    - 正模 ZCDM V5000 与归入标本 ZCDM V5001、ELDM V1001 在大型暴龙超科骨架旁保存丝状体被；羽毛分布与结构是直接观察，而保温、展示及全身体被范围属于功能重建。
