        usage:
          title: Ardisia nigrita Lundell, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrubs, the branchlets slender, subterete, minutely lepidote at first, the indument reddish. Leaves petiolate, the petioles slender, 7-15 mm long, canaliculate; leaf blades glabrous, chartaceous, elliptic, 6.5-13.5 cm long and 3-7 cm wide, obtuse or subacuminate apically, the acumen obtuse, acute basally, slightly decurrent, conspicuously punctate at first, the margin entire, the midvein nearly plane above, conspicuous beneath, the veins slender and inconspicuous. Inflorescences glabrous, terminal, ample, tripinnately paniculate, open, pyramidal, to 11 cm long and 15 cm wide basally, the rachis and branches black-punctate. Flowers 5-merous, racemose, the pedicels rather remote, slender, mostly recurved, 10-13 mm long; sepals broadly ovate or suborbicular, ca. 2 mm long, rounded apically, thick with a hyaline margin, ciliolate at first, densely black-punctate with large glands. Fruit immature, subglobose, yellow, ca. 6 mm in diameter, black-punctate with large glands.
