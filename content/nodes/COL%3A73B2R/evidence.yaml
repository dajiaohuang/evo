    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Perennial, tufted, up to 1 m high. Leaf blades up to 300 mm long, up to 1.3 mm wide, old leaves breaking off close to sheath mouth, and remaining leaf bases splitting along midrib, the 2 halves curling away from each other. Spikelets 12-17 mm long (including awns); 8-13 mm wide. Panicle 80-180 mm long, loosely contracted and interrupted; spikelets (5-)6-8-flowered; glumes 13-17 mm long, 1-3-nerved; lemmas 6.5-9.0 mm long, including lobes 3.5-5.0 mm long, adnate to central awn for approximately half their length; lemma backs with 3 tufts of equally spaced white hairs on either side of central nerve, marginal tuft the most basal; central awn 9-12 mm long, geniculate at point where lemma lobes detatch from awn.
