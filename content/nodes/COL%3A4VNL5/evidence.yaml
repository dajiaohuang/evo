      morphology:
        status: partially-supported
        claims:
          - text: "Perennial. Rhizome elongated, 4-7 mm thick; scales brown. Culms 1.3-2.5 m tall, glabrous below, hirsute above. Leaves unequally laterally praemorse distally, 6-16 mm broad, glabrous or sheaths densely villous below mouths; mouth produced into deltoid- rounded tongue 2-5 mm long. Inflorescence with compact terminal panicle 35-60 mm long, lateral panicles erect, single at 3-7 nodes, 30-40(-60) mm long, shortly exserted from sheaths. Bracts foliaceous. Male spikelets sessile or subsessile, 3.5-4 mm long, glumes pale brown. With reddish striae, keels and distal margins hispidulous. Female glumes glabrescent or hispidulous on keels and distal margins, 3-3.5 mm long, pale brown with darker reddish streaks. Achene ovoid to ovoid-globose, 2.25-3.5 x 1.8-2.3 mm, glabrous, smooth, violet or purple: hypogynium obscurely trilobed with fimbriate margin, brown."
            textZh: Scleria angusta Nees ex Kunth 的 SANBI 物种条目记录了形态特征。
