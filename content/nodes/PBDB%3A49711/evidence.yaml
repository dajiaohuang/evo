  claims:
    - subjectId: taxon:palaeotherium
      claimKind: scientific
      claimType: fossil-range
      statement: Palaeotherium medium is sampled in the late Eocene at La Débruge, and separate British range data place regional Palaeotherium loss near the Grande Coupure without dating a global extinction instant.
      confidence: high
      confidenceRationale: Two primary regional records independently constrain late Eocene occurrence and disappearance near the turnover. High confidence remains regional and does not convert a sampled last appearance into a global extinction instant.
      referenceLinks:
        - referenceId: joomun-2008-palaeotherium-diet
          relation: supports
          pages: 92–106
          figure: Figures 1–8; Tables 1–4
          quoteLocator: Abstract, materials and wear results for the La Débruge Palaeotherium medium sample
        - referenceId: hooker-2004-grande-coupure
          relation: supports
          pages: 161–172
          figure: Figures 2–4; mammal range chart
          quoteLocator: Results and conclusions distinguish pre-turnover loss, the sequence hiatus and later first Asian-immigrant records
    - subjectId: taxon:palaeotherium
      claimKind: scientific
      claimType: taxonomy
      statement: The profile uses Palaeotherium at genus rank within Palaeotheriidae, while ecological detail is explicitly restricted to the sampled species P. medium.
      confidence: medium
      confidenceRationale: Primary species attribution and the regional range study support the genus context without collapsing all species into P. medium.
      referenceLinks:
        - referenceId: joomun-2008-palaeotherium-diet
          relation: supports
          pages: 92–106
          figure: Figures 1–8; Tables 1–4
          quoteLocator: Abstract, materials and wear results for the La Débruge Palaeotherium medium sample
        - referenceId: hooker-2004-grande-coupure
          relation: supports
          pages: 161–172
          figure: Figures 2–4; mammal range chart
          quoteLocator: Results and conclusions distinguish pre-turnover loss, the sequence hiatus and later first Asian-immigrant records
    - subjectId: taxon:palaeotherium
      claimKind: scientific
      claimType: morphology
      statement: In the sampled Palaeotherium medium, molar wear facets, high occlusal relief and mixed sharp and rounded cusps provide the morphological basis for dietary inference; limb proportions are not claimed here.
      confidence: medium
      confidenceRationale: The primary study measures dental form and wear directly. Removing unsupported limb analogies keeps morphology at the observed specimen level.
      referenceLinks:
        - referenceId: joomun-2008-palaeotherium-diet
          relation: supports
          pages: 92–106
          figure: Figures 1–8; Tables 1–4
          quoteLocator: Abstract, materials and wear results for the La Débruge Palaeotherium medium sample
    - subjectId: taxon:palaeotherium
      claimKind: scientific
      claimType: ecology
      statement: The La Débruge Palaeotherium medium sample is consistent with leaf browsing plus a smaller fruit or abrasive-seed component; habitat and locomotor behavior are not inferred from tooth wear alone.
      confidence: medium
      confidenceRationale: High confidence applies to the replicated wear proxies, while the explicit non-inferences prevent dental data from carrying unrelated ecology.
      referenceLinks:
        - referenceId: joomun-2008-palaeotherium-diet
          relation: supports
          pages: 92–106
          figure: Figures 1–8; Tables 1–4
          quoteLocator: Abstract, materials and wear results for the La Débruge Palaeotherium medium sample
    - subjectId: taxon:palaeotherium
      claimKind: scientific
      claimType: biogeography
      statement: This profile represents western European study records from La Débruge and the Hampshire Basin rather than a complete genus-wide occurrence distribution.
      confidence: medium
      confidenceRationale: Two primary regional studies directly establish the French and British contexts; broader geography is intentionally not asserted.
      referenceLinks:
        - referenceId: joomun-2008-palaeotherium-diet
          relation: supports
          pages: 92–106
          figure: Figures 1–8; Tables 1–4
          quoteLocator: Abstract, materials and wear results for the La Débruge Palaeotherium medium sample
        - referenceId: hooker-2004-grande-coupure
          relation: supports
          pages: 161–172
          figure: Figures 2–4; mammal range chart
          quoteLocator: Results and conclusions distinguish pre-turnover loss, the sequence hiatus and later first Asian-immigrant records
  claim-rationales.zh:
    - 两项区域主研究分别约束了晚始新世产出和接近更替期的消失。高置信度仍限于区域证据，不把取样到的末次出现转写为全球灭绝瞬间。
    - 分类主张以所引主研究或系统综述中的明确分类与样本为界，不把导航父级写成直接祖先。
    - 形态主张只保留引文图表或诊断直接支持的骨骼、牙齿性状，并把软组织、姿势或功能解释明确标为推断。
    - 生态主张区分直接测得的磨耗或同位素信号与栖息地、行为推断，并保留物种、地点和时代边界。
    - 生物地理主张按论文实际覆盖的地点和区域表述，不把区域样本扩写为完整全球分布。
  claim-statements.zh:
    - 古兽属按所引系统研究采用当前分类层级；导航父级仅表示分类关联，不表示直接祖先。
    - 古兽属的形态档案仅记录所引研究直接描述或测量的牙齿、颅骨或肢骨性状，功能解释另行标注。
    - 古兽属的生态档案按取样物种、地点与方法限定食性和运动推断，不把局部结果推广为整个类群的固定生态。
    - 古兽属的地理档案只覆盖所引研究明确讨论的区域与地点，并非完整的全球产出分布。
    - 中兽古兽在 La Débruge 的晚始新世地层中有明确样本；另一套英国范围资料把古兽的区域消失置于“大割裂”附近，但没有测定全球灭绝瞬间。
