    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Slender, cormous geophyte, 12-35 cm. Lower leaves linear, without a central vein. Flowers greenish to grey, speckled with blue, spicy scented, anther lobes parallel; capsules ovoid.
            textZh: Ferraria densepunctulata M.P.de Vos 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 7486; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Early flowering and relatively rare, Ferraria densepunctulata is distinctive in the narrow basal leaves, oval in cross section, and rather different from the shorter, broader cauline leaves, and in the unusually coloured flowers, minutely dark blue to purple spotted on a pale greenish to grey-blue background, but with the limbs of the inner tepals so densely speckled as to appear solidly coloured, either maroon or dark slate blue. The flowers are also unusual in having the tepal limb margins undulate instead of closely crisped. Small bilobed nectaries are located at the base of the outer tepals but in the midline of the inner tepal claws, the lower halves of which are linear and ± 1 mm wide. Like other members of sect. Ferraria, the stigmas are terminal on the arms of the style branches and the ovary is not beaked. The flowers are unique in the section in lasting two days instead of a single day. The leaves of non-flowering plants are so strikingly different from those of mature, flowering individuals that they appear to represent a different species. Four to six in number, they are held in a close, 2-ranked fan and the blades are dark green, terete and hollow. The early flowering habit of Ferraria densepunctulata is matched in the genus by F. ornata and F. ovata, both of which also have the narrow basal leaves differentiated from the shorter and broader cauline leaves.
            textZh: SANBI 条目提供了 Ferraria densepunctulata M.P.de Vos 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 95226; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
