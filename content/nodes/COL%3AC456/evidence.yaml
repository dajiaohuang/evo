    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants solitary, short-stemmed; stems up to 200 mm long with distinct internodes. Leaves ±16, sheathing at base, blade narrowly deltoid, spreading to recurved, 300-500 x 20-40 mm, green with many dull white spots. Inflorescence a climbing panicle, 1.75-2.25 m long; racemes lax, cylindric; bracts deltoid, 5-7 x 2-4 mm, ±7-nerved. Flowers reddish, mouth whitish, 18-35 mm long; outer segments free for 3-7 mm, inner segments mostly dorsally adnate to outer; pedicels 5-9 mm long. Anthers exserted 1-6 mm. Ovary 5.0-6.0 x 2.0-3.5 mm, green; style exserted 1-8 mm. Fruit not seen.
            textZh: Aloe suffulta Reynolds 的 SANBI 物种条目记录了形态特征。
