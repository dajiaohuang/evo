    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Shrub, up to 300 mm tall, stems woody, non-twining, covered with white, adpressed hairs, sap milky. Leaves somewhat fleshy, orbicular to ovate, up to 12 x 10 mm. Flowers 1-3, clustered on a short, extra-axillary peduncle, pedicels up to 5 mm long. Corolla campanulate, lobed to 2/3 of way down, lobes erect or spreading, ± 2 x 1 mm, green. Corona cup-shaped, with 5 spreading lobes at mouth opposite anthers, ± 1 x 2 mm, white, staminal column not quite 2 mm tall, without a stipe.
            sourceIds:
