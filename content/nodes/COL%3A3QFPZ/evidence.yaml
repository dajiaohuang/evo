    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, 20-40 cm, usually with a few short branches. Leaves linear, very narrow. Flowers white or pink to mauve, tube elongate and wide, 15-18 mm long, stamens unilateral, filaments exserted 2-6 mm, style branches 3-4.5 mm long.
            textZh: Ixia pauciflora G.J.Lewis 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 7125; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Ixia pauciflora typically has just one or two flowers on slender, often unbranched stems, or with one or two (rarely to four) short branchlets. The flowers are relatively large, having tepals 16-18 mm long, ± as long as the flared perianth tube, long filaments exserted 2-6 mm from the tube, and anthers 4-6 mm long. The stamens on fully open flowers are unilateral and are held horizontally with the anthers facing the dorsal tepal, a feature impossible to determine from pressed specimens. Vegetatively, the species is virtually identical to the more common I. capillaris in its two linear leaves, small corms with finely fibrous tunics, a collar of fine fibres around the underground part of the stem, and dry, chestnut-brown cataphylls. Blooms of I. capillaris are radially symmetric and have a perianth tube 4-8 mm long, ± half as long as the tepals, and filaments ± 5 mm long, usually exserted 1-2 mm from the tube. Ixia pauciflora also closely resembles the local Villiersdorp endemic, I. reclinata, in its flower, including the unilateral stamens, extended horizontally with declinate anthers, but the latter has longer filaments, exserted 8-10 mm (vs. 2-6 mm in I. pauciflora). Ixia reclinata also lacks the collar fibres around the stem base present in I. pauciflora, the stems typically have one or two branchlets, and the cataphylls are green or partly membranous when alive and not dry and brown. Ixia reclinata also differs in having the bracts and prophylls subtending the branchlets short and obtuse to subacute, quite different to the fine, thread-like bracts and prophylls of the remaining species of the I. capillaris group.
            textZh: SANBI 条目提供了 Ixia pauciflora G.J.Lewis 的鉴别特征。
