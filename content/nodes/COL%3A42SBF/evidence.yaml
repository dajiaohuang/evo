      lifeHistory:
        status: not-assessed
      ecology:
        status: partially-supported
        claims:
          - text: In the Menabe Central transect study, the within-transect spatial association between Microcebus berthae and M. murinus was negative and statistically significant in non-degraded forest during the dry season (ISIA T = -0.13, p = 0.013). This is a local pattern for one habitat-season scenario; it does not establish competition as a cause or generalize to other seasons, habitats, or the species range.
            sourceIds:
              - schaffler2021microcebus
            locator: Results lines 480-481; Table 4A, non-degraded habitat/dry-season row (lines 501-505; T = -0.13, p = 0.013); Table 4 note (lines 580-582) defines negative T as spatial avoidance.
            placeTimeScope: Menabe Central, western Madagascar. Nocturnal surveys ran from 2003 to 2007 on 34 one-kilometre transects across four dry seasons and two wet-season survey periods; the study reports 786 Microcebus sightings, including 92 M. berthae. The claim concerns only non-degraded habitat in the dry season.
            lifeStatus: Free-ranging wild mouse lemurs detected during nocturnal transect walks; captive and fossil populations were not assessed.
            originalLanguage: en
        gaps:
          - The statistic describes one local habitat-season scenario and does not demonstrate a causal competitive interaction.
          - The study covers Menabe Central and its survey years, not all populations or the full species range.
          - Morphology, life history, other ecology, evolution, broader distribution, fossils, conservation, systematic search, remain unassessed.
      evolution:
        status: not-assessed
      distribution:
        status: not-assessed
      fossil:
        status: not-assessed
      conservation:
        status: not-assessed
