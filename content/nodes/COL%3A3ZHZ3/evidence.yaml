        usage:
          title: Meliosma glabrata (Liebm.) Urb., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Tree 7-11 m tall, 15-30 cm d.b.h.; branchlets completely glabrous or with a few inconspicuous minute trichomes when very young. Leaves narrowly elliptic to oblong-obovate, 6.5-20(-32) cm long, 2-7.5(-1 1) cm wide, acute to short-acu- minate, cuneate at the base, chartaceous, entire or with a few remote teeth toward the apex, drying dark above, olive below, the main veins drying reddish brown below, the midvein impressed above, raised below, the secondary veins plane above and prominent below, 10-12(-13) on a side, tertiary venation prominulous below, glabrous; petiole glabrous, 1-3(-3.5) cm long. Inflorescence arising from branchlets below the leaves, paniculate, subappressed puberulous, 9-16 cm long, the individual flowers subsessile or the pedicels less than 1 mm long. Flowers white, drying black; sepals suborbicular, ciliate-fringed, otherwise glabrous, 1 mm long; outer petals narrowly ovate, thick, not thinner at the margins, the apex obtuse, 2.5-3 mm long, 2 mm wide, the inner petals thin, linear, 2 mm long; stamens 2, the narrow filaments ca. 1 mm long, the anther thecae short, thick, ca. 0.4 mm long, widely separated by the broad connective; ovary ellipsoid, glabrous, ca. 0.8 mm long, apically tapering to the 1.5-2 mm long style, the stigma usually minutely bilobed; disc obsolete. Fruit pyriform-globose, 1.5-2.5 cm long, 1.5-2 cm in diam.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 12426
