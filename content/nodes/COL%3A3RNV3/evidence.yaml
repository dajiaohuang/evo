    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Slender, erect to spreading, thinly tomentose to felted shrublet to 28 cm. Leaves decussate, adpressed or ascending, narrowly elliptic. Flowers in capitula, 5-10 mm diam., cream-coloured or creamy pink, stigma capitate, long papillate.
            sourceIds:
              - sanbi_14458_0
            locator: "SANBI/WFO archive Morphology row 10255; source 14458.0; publication: Beyers, JBP. 2012. Thymelaeaceae: Lachnaea L. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 772 - 775. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Lachnaea marlothii can easily be confused with L. elsieae, a distant relative. Both belong to the group of species with pedicels that elongate in the fruiting stage. L. marlothii, however, is distinguished from L. elsieae by the upper portion of the hypanthium and the sepals being villous-pilose on the outside, the capitate or obovate floral scales and the antesepalous stamens arising a third-way up the sepals.
            textZh: SANBI 条目提供了该种的鉴别特征。
