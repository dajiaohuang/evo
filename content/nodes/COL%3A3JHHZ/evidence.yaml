        usage:
          title: Hamelia magnifolia Wernham, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrubs or small trees, to 6 m tall, the branchlets angular to tetragonal, gla- brous, the nodes well spaced. Leaves rarely ternate at the tips of the branchlets, ovate to ovate elliptic, occasionally puberulent; petioles 1.0-5.5 cm long; stipules deltoid, 4-7 mm long, to 2 mm wide at the base, glabrate. Inflorescences terminal, of compound dichasia, often appearing cymose, the floral clusters numerous and many flowered; peduncle to 3 cm long. Flowers with the calycine cup to 2.5 mm long, the lobes deltoid, ca. 0.6 mm long or shorter, puberulent marginally; corolla yellow, the tube 7.5-12.0 mm long, glabrous except often minutely puberulent at the base, the lobes to 1.5 mm long, about as broad at the base; anthers narrowly oblong, 6-8 mm long, the connective produced apically as an ovate or deltoid appendage, ca. 1 mm long, falcate and ultimately acuminate, basally sagittate. Fruits oblong, to 1 cm long or longer; persistent ovarian disc ca. 1 mm long.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 11706
