      claimType: topology
      statement: SGS-UM 2009-002 records a 29–28 Ma catarrhine with a character combination recovered on the catarrhine stem in the cited matrix, not a crown catarrhine or direct ancestor.
      confidence: medium
      confidenceRationale: Medium confidence distinguishes well-documented cranial anatomy from a biochronological age and a topology based on a small morphology matrix.
