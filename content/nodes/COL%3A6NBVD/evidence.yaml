    facets:
      morphology:
        status: partially-supported
        claims:
          - text: "Plants 150-330 mm high, stem simple, rarely with 1 branch. Corm small, up to 10 mm diam., bearing stolons up to 50 mm long from base, with a large terminal cormlet up to 5 mm diam., tunics finely fibrous to moderately coarse. Leaves 4, uppermost sheathing for most of its length, foliage leaves with blades narrowly sword-shaped to falcate, ± 1/3 as long as stem, mostly 2-4 mm wide, main vein prominent, margins slightly thickened. Spike mostly 5-9-flowered; bracts translucent with purple veins, 3-4 mm long, outer 3-veined, acutely 3-toothed, inner slightly shorter than outer, 2-veined and 2-toothed. Flowers evidently zygomorphic, nodding with tepals vertical, pink, throat and tepal bases yellow edged with deep pink; perianth tube filiform, ± 3 mm long; tepals ovate, ± 9.0 x 4.5 mm. Stamens evidently unilateral; filaments slightly flattened, ± 2 mm long; anthers oblong-orbicular, ± 3 mm long, yellow, thecae recurved and acute at base, splitting incompletely from base. Style dividing at base of filaments, branches ± 1.8 mm long, falcate, slender. Flowering time: Oct. and Nov."
            textZh: Ixia flagellaris Goldblatt & J.C.Manning 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_15933_0
            locator: "SANBI/WFO archive Morphology row 85218; source identifier 15933.0; cited publication: Goldblatt, P; Manning, JC. 2012. Systematics of the southern African genus Ixia (Iridaceae): 4. Revision of sect. Dichone. Bothalia 42(2): 87 - 110. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: "The outstanding feature of Ixia flagellaris is the corm, which is remarkable in the I. scillaris complex in the finely fibrous corm tunics and in the production of slender stolons (Latin: flagellae) up to 50 mm long, each terminating in a relatively large cormlet. No other member of sect. Dichone produces stolons although they are known in a few species of sect. Ixia and Morphixia. I. flagellaris otherwise accords closely with I. scillaris subsp. toximontana, notably in its relatively low stature, 150-330 mm high, and small flowers with tepals ± 9.0 x 4.5 mm, but differs in lacking prominent, thickened leaf margins. The late flowering and moist habitat, seeps and marshy sites, are unusual for the complex, although known in the Piketberg species, I. tenuis. Plants from Kobee Pass (Hall 4517) may belong here as they have fine corm tunics and unthickened leaf margins but they evidently do not produce stolons. Their exact status remains uncertain."
