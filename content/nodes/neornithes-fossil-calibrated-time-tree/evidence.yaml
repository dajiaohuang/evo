  claims:
    - subjectId: event:neornithes-fossil-calibrated-time-tree
      claimKind: scientific
      claimType: divergence-time
      statement: Bayesian fossil-calibrated analyses of clock-like exons and broader RAG sampling infer a modern-bird common ancestor near 95 Ma and rapid diversification around the K–Pg boundary; dates and geographic histories are model outputs conditioned on topology, calibrations and priors.
      confidence: medium
      confidenceRationale: The study discloses molecular datasets, fossil calibrations and Bayesian procedures. Divergence ages and biogeographic reconstructions remain sensitive to those assumptions rather than directly observed fossil events.
      referenceLinks:
        - referenceId: claramunt-cracraft-2015-avian-time-tree
          relation: supports
          pages: e1501005
          figure: Figures 1–3; Supplementary Tables S1–S4
          quoteLocator: Molecular datasets; Fossil calibrations; Divergence-time and biogeographic analyses
  claim-rationales.zh:
    - 研究公开分子数据集、化石校准和贝叶斯步骤；分化年龄与生物地理复原仍对这些假设敏感，而非直接观察到的化石事件。
  claim-statements.zh:
    - 对时钟性外显子和更广 RAG 取样进行化石校准贝叶斯分析，推断现代鸟共同祖先约在 9500 万年前，并在 K–Pg 边界附近快速分化；年代和地理历史是受拓扑、校准与先验制约的模型输出。
