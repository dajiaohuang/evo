    facets:
      morphology:
        status: partially-supported
        claims:
          - text: The treatment's comparative diagnosis describes mature male Hyphessobrycon loweae with an elongated, filamentous dorsal fin. Compared with H. peugeoti, the examined H. loweae material is reported with six to seven horizontal scale rows from dorsal-fin origin to lateral line and 17-21 branched anal-fin rays (mode 20), versus five rows and 21-24 rays (mode 22) for H. peugeoti. These are treatment-level diagnostic comparisons, not estimates of all populations.
            originalLanguage: en
            sourceIds:
              - ingenito_lima_buckup_2013
              - plazi_hyphessobrycon_archive
            locator: "Plazi description-extension row 10 (diagnosis), row 11 (description); treatment https://treatment.plazi.org/id/03D2C41AD050FFB7FF28FF17FEFAF17E; Ingenito, Leonardo F. S., Lima, Flávio C. T., Buckup, Paulo A. (2013): A new species of Hyphessobrycon Durbin (Characiformes: Characidae) from the rio Juruena basin, Central Brazil, with notes on H. loweae Costa & Géry. Neotropical Ichthyology 11 (1): 33-44. DOI 10.1590/S1679-62252013000100004; article pp. 38-40; archive SHA-256 5a0fd2206af2b824dd67882f2fee9ac1cd4f7f1713fa831cbf3e7f35aad87d84."
            placeTimeScope: Comparative diagnosis and meristic description in the 2013 treatment, pp. 38-40, Plazi rows 10-11. The fin character is explicitly restricted to mature males; the counts describe examined taxonomic material and do not quantify all populations.
            lifeStatus: The diagnosis and counts concern specimens described in the taxonomic treatment. Broader population, age-class, and life-status coverage was not assessed.
        gaps:
          - Only comparative diagnoses and selected meristic / specimen description data from one taxonomic article are represented; population-wide variation, additional life stages, and unreported characters remain unassessed.
      lifeHistory:
        status: not-assessed
        claims: []
        gaps:
          - The cited specimen collection dates and early-dry-season collection note do not establish a full reproductive calendar, development, lifespan, or complete life cycle.
      ecology:
        status: partially-supported
        claims:
          - text: The authors report clear, slow-flowing streams with abundant submerged vegetation at named H. loweae localities, including Córrego Xavante, upper rio das Mortes, and rio Culuene tributaries near Gaúcha do Norte. They also cite paratypes from the small, densely vegetated Lago do Leo. These are locality-specific reports, not a complete or uniform habitat rule for the species.
            originalLanguage: en
            sourceIds:
              - ingenito_lima_buckup_2013
              - plazi_hyphessobrycon_archive
            locator: "Plazi description-extension row 12 (biology_ecology); treatment https://treatment.plazi.org/id/03D2C41AD050FFB7FF28FF17FEFAF17E; Ingenito, Leonardo F. S., Lima, Flávio C. T., Buckup, Paulo A. (2013): A new species of Hyphessobrycon Durbin (Characiformes: Characidae) from the rio Juruena basin, Central Brazil, with notes on H. loweae Costa & Géry. Neotropical Ichthyology 11 (1): 33-44. DOI 10.1590/S1679-62252013000100004; article p. 40; archive SHA-256 5a0fd2206af2b824dd67882f2fee9ac1cd4f7f1713fa831cbf3e7f35aad87d84."
            placeTimeScope: Habitat notes in the 2013 treatment, p. 40, Plazi row 12. The cited basis varies by locality and includes personal communications, an author observation, and an earlier published account; dates are not supplied for these habitat observations. The article separately reports upper rio Xingu and upper rio das Mortes drainage records.
            lifeStatus: The paragraph concerns reported habitat observations and taxonomic collection localities. Cultivated, escaped, and unsampled populations were not assessed.
        gaps:
          - Evidence is limited to the article's named locality and collection-site observations. Habitat preference, environmental tolerances, interactions, sampling completeness, and unsampled populations remain unassessed.
