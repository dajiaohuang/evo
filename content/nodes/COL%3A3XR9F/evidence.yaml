          publishedAt: undated
          originalSourceText: Herb, the stem commonly procumbent or trailing, usually branched, up to 2 m long, appressed-stellate-pubescent. Leaves with a slender petiole up to 20 cm long, rather sparsely stellate-pubescent, the stipules ovate, acute or acuminate, 4-7 mm long; blade circular or circular-reniform, deeply cordate, very shallowly several- lobed, ca 1-6 cm long and broad, the margins crenate-denticulate, 5- to 7-palmi- nerved, strigose on both sides with simple or stellate hairs, densely so when young, the venation prominulous beneath. Flowers solitary or in loose, few-flowered clus- ters, the pedicel slender, 2-4 cm long, stellate-puberulus to stellate-tomentellous; epicalyx bractlets linear-ovate, acute, ca 4 mm long and 0.8 mm wide, stellate- puberulus and ciliolate along the margin; calyx ca 5-6 mm long, densely stellate- puberulus, lobed to or little beyond the middle, the lobes deltoid and acuminate, somewhat accrescent and enclosing the schizocarp; petals ca 12 mm long, the claws barbate, white and usually lavender toward the apex; androecium ca 6-7 mm long, the staminal tube sparsely and minutely stellate-puberulus; styles ca 8-9 mm long. Fruit ca 5-6 mm in diam, the mericarps 12-15, smooth, very minutely puberulus.
          originalLanguage: en
          sourceField: general
