          scope:
            en: Official ICMBio SALVE species assessment published in 2025; category date is 2019. Supports the assessment's three separated Amazonas occurrence areas, reported Jacurapá floodplain records, conservation rationale and unknown population metrics. It does not provide a species-specific ecological study or population census.
            zh: ICMBio SALVE 官方种级评估，2025 年发布；类别日期为 2019 年。支持该评估报告的亚马孙州三个分隔出现区域、Jacurapá 洪泛林记录、保护评估依据和未知种群指标；不构成该种的专门生态学研究或种群普查。
