          scope:
            en: Systematic comparison using cytochrome-b, ddRAD and museum pelage evidence. The eight cytochrome-b and six ddRAD samples labelled C. calvus rubicundus follow the paper-era subspecies assignment; these counts are not abundance estimates or a field census.
            zh: 研究结合细胞色素 b、ddRAD 与博物馆皮毛证据；标记为 C. calvus rubicundus 的 8 条细胞色素 b 序列和 6 个 ddRAD 样本沿用论文当时的亚种归属，这些数字不是丰度估计或野外普查结果。
