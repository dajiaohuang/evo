  claims:
    - subjectId: event:triassic-coral-photosymbiosis
      claimKind: scientific
      claimType: ecology
      statement: Microstructure and carbon, oxygen and nitrogen isotope patterns in approximately 212 Ma Turkish coral skeletons are consistent with photosymbiosis in the sampled Late-Triassic taxa.
      confidence: medium
      confidenceRationale: Multiple independent measurements converge in the sampled skeletons, while algal cells and symbiont identities are not directly preserved.
      referenceLinks:
        - referenceId: frankowiak-2016-coral-symbiosis
          relation: supports
          pages: e1601122
          figure: Figures 1–4; Supplementary Tables S1–S5
          quoteLocator: Skeleton microstructure and C, O and N isotope measurements
  claim-rationales.zh:
    - 取样骨骼中的多种独立测量相互一致，但藻细胞和共生体身份并未直接保存。
  claim-statements.zh:
    - 约 2.12 亿年前土耳其珊瑚骨骼的微结构及碳、氧、氮同位素模式，与所取样晚三叠世分类单元存在光合共生相符。
