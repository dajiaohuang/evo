        claims:
          - text: Perennial herb, up to 0.8 m high, with long internodes. Leaves narrowly ovate-acuminate, up to 100 x 20 mm, abruptly narrowed at base into a pseudopetiole and a long membranous sheath, dark green above, paler below. Spathe solitary. Upper cyme on a long exserted petiole. Capsule oblong. Seeds long-ellipsoid. Flowers blue.
