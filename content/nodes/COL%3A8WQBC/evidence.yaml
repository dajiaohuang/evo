        claims:
          - text: Geophyte, up to 0.6 m high. Ultimate inflorescence branches bearing 5-9 apically crowded flowers. Perianth tube cylindric, up to 25 mm long; greenish or blue-violet with red to purple markings on lower tepals.
            textZh: Afrosolen masukuensis (Vaupel & Schltr.) Goldblatt & J.C.Manning 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_11118_0
            locator: "SANBI/WFO archive Morphology row 2581; source identifier 11118.0; cited publication: Herman, PPJ; Retief, E. 1997. Plants of the northern provinces of South Africa: Keys and diagnostic characters. Strelitzia 6: 1 - 681. National Botanical Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: The comparatively tall stature, usually over 450 mm high, alternate branching pattern with the main axis dominant, ultimate inflorescence branches bearing 5 to 9 apically crowded flowers, and the long straight perianth tube, usually 20-25 mm long, are diagnostic for Afrosolen masukuensis. Plants from the Mozambique Coast have greenish flowers with red markings, unusual in the genus, but elsewhere the flowers are blue-mauve or violet with white and dark blue markings. The long perianth tube and general appearance of the flowers, including their colour, suggest a relationship with A. sandersonii of eastern South Africa and Botswana, but that species is typically a shorter plant, rarely exceeding 350 mm, with a divaricate, often intricately branched habit, and the ultimate branches of the inflorescence bear 1 or 2, rarely 3 flowers.
            textZh: SANBI 条目提供了 Afrosolen masukuensis (Vaupel & Schltr.) Goldblatt & J.C.Manning 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 94455; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
