    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Perennial herb, up to 1 m high. Culms clustered, sometimes with 1 or more soft, terete soboles from base of culm cluster. Rhizome very short. Inflorescence unbranched or with a few short basal branches. Achene smooth or tuber-culate or trabeculate towards apex. Glumes glabrous or sparsely ciliate, blackish red, red-brown or pale with streaks.
            textZh: Scleria dregeana Kunth 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_11118_0
            locator: "SANBI/WFO archive Morphology row 3427; source identifier 11118.0; cited publication: Herman, PPJ; Retief, E. 1997. Plants of the northern provinces of South Africa: Keys and diagnostic characters. Strelitzia 6: 1 - 681. National Botanical Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Perennial with annual aerial parts. This is a morphologically variable species. Rhizome internodes may be so short that the plants appear caespitose or they may be slightly longer so that the culm bases are not contiguous. Subterranean propagative stems (soboles) may arise from the culm bases. Whereas rhizomes have amphivasal vascular bundles, those of soboles are collateral. Inflorescences may be simply glomerate-spicate or sparingly branched glomerate-spicate. Glumes may be dark or pale. S. dregeana Kunth, S. caespiiosa Welw. ex Ridl. and S. setulosa Boeck. were based on glabrescent plants with unbranched inflorescences and dark glumes; S. meyeriana Kunth on a very hairy plant with an unbranched inflorescence and pale glumes and S. holcoides Kunth on a hairy plant with a branched inflorescence and pale glumes. The achenes of the types are sparingly tuberculate distally and smooth proximally but gatherings of plants with wholly smooth achenes (Lubke 181), and of plants with achenes which are tuberculate distally and trabeculate proximally (Galpin 9104) exist. Tubercles, when present, are invariably best developed near the apex of the achene. This species is likely to be confused with S. sobolifer E. F. Franklin from which it is distinguished mainly by the presence of a true rhizome with amphivasal vascular bundles and by the absence of a pattern of ridges, troughs and fine transverse bars between the stipe and body of the achene.
            textZh: SANBI 条目提供了 Scleria dregeana Kunth 的鉴别特征。
