      ecology:
        status: partially-supported
        claims:
          - text: Aloe hahnii occurs in the mist belt regions of the Blouberg and most of the Soutpansberg in Soutpansberg and Mountain Bushveld. The altitude ranges from 1000 m in Venda to 2050 m on the Blouberg. It commonly grows on sandy soil derived from the Soutpansberg Group Quartzites. This aloe has been found in Coleochloa setifera-dominated grassland up to the margins of forests on the Blouberg and similar vegetation on the Soutpansberg, whereas in the western Soutpansberg it sometimes grows in low closed woodland in full shade.
            textZh: 该 SANBI 区域物种条目记录的生境：Aloe hahnii occurs in the mist belt regions of the Blouberg and most of the Soutpansberg in Soutpansberg and Mountain Bushveld. The altitude ranges from 1000 m in Venda to 2050 m on the Blouberg. It commonly grows on sandy soil derived from the Soutpansberg Group Quartzites. This aloe has been found in Coleochloa setifera-dominated grassland up to the margins of forests on the Blouberg and similar vegetation on the Soutpansberg, whereas in the western Soutpansberg it sometimes grows in low closed woodland in full shade.
