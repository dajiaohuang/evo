          - text: Aloe hahnii differs from A. swynnertonii in the shorter bracts, pedicels and perianths. as well as flowers that are a glossier scarlet-red and more decurved It is distinguished from A. vogtsii Reynolds, with which it occasionally grows sympatrically in the central regions of the Soutpansberg mist belt, by the latter species having buds that are borne horizontally in more elongated (not capitate) racemes.
