    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Perennial herb, geophyte, 0.4-0.8 m high; corm globose to depressed-globose, tunics coriaceous to coarsely papery; stem erect, simple or shortly 1- or 2-branched. Leaves 7-12, in a tight distichous fan, mostly basal, (8-)15-25 mm wide, margins ciliate to scabrid. Inflorescence a 12-18-flowered spike, flexed at base; flowers light purple or reddish or whitish with shades of pink or yellow, flushed brownish on reverse; perianth tube obliquely funnel-shaped; tepals unequal, ovate, margins undulate. Stamens exserted; anthers pale mauve; pollen cream-coloured. Ovary oblong, weakly 3-lobed; style arching over stamens; branches expanded distally. Flowering time Dec.-June. Capsule narrowly obovoid-oblong, 3-lobed, retuse above.
            textZh: Gladiolus ochroleucus Baker 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_18505_0
            locator: "SANBI/WFO archive Morphology row 90763; source identifier 18505.0; cited publication: Bredenkamp, CL; Magwaza, ZL. 2019. Iridaceae. In: CL Bredenkamp (ed.), A Flora of the Eastern Cape Province, Strelitzia 41(3): 1821 - 1882. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Recognised by the basal fan of lanceolate leaves and smallish, short-tubed flowers with relatively long, green bracts 25-50 mm long and perianth tube 15-20 mm long. The leaf margins are often ciliolate or scabrid. Plants from the northern and central parts of the range, in southern KwaZulu-Natal and Transkei [Eastern Cape], have creamy yellow flowers, while those from south of the Kei River are mostly bright pink. A dark purple form occurs near East London. Gladiolus mortonius from slightly higher elevations inland has a considerably longer perianth tube, 30-45 mm long, and firmer, more fibrous leaves.
            textZh: SANBI 条目提供了 Gladiolus ochroleucus Baker 的鉴别特征。
