            locator: "SANBI/WFO archive Morphology row 45122; source 9268.0; publication: Hilliard, OM. 1983. Gnaphaliinae (first part): Facelis - Edmondia, Fl. S. Africa 33(7,2): 1 - 317. Botanical Research Institute, Department Agriculture, Pretoria. [http://www.biodiversitylibrary.org/item/209547#page/5/mode/1up]. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Distinguished from H. miconiifolium by its flowering stem only remotely bracteate above, soft, 5-nerved leaves and blunt involucral bracts, and from H. nudifolium by its soft leaves crowded at the base of the stem and more golden and brown involucral bracts.
