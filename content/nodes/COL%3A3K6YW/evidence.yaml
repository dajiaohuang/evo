    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Perennial herb, roots with narrow fusiform tubers, stock small, producing slender rhizomes, flowering stem terminal, solitary, simple, 350-600 mm tall, with long multicellular hairs and thinly white-woolly as well, reduced leaves near base, distantly bracteate upwards. Leaves mostly radical, ±4-6, petiole thin, wiry, ±20-120 mm long, blade ±30-120 x 25-50 mm, broadly elliptic to ovate-elliptic, soft-textured, apex obtuse to subacute, apiculate, base rounded or broadly cuneate, upper surface rough with long multicellular hairs, lower conspicuously 5-nerved, hairs best developed on nerves, elsewhere with shining yellow sessile glands, margins weakly revolute; cauline leaves similar but soon sessile and narrower, passing rapidly into few, distant acuminate bracts. Heads homogamous, campanulate, ±5-6 x 4-5 mm, many in a loose or compact corymbose panicle. Involucral bracts in ±4 series, slightly graded, loosely imbricate, about equalling flowers, bases loosely woolly, limb subopaque, slightly glossy, outer golden-brown, inner yellow, tips obtuse, slightly crisped, not radiating. Receptacle with fimbrils twice as long as ovaries. Flowers 19-30. Achenes not seen, ovaries glabrous. Pappus bristles many, scabrid, bases cohering strongly by patent cilia, lightly fused as well.
            sourceIds:
