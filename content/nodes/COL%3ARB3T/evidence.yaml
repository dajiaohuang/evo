        claims:
          - text: "Densely tufted, perennial herb, up to 300 mm high. Culm ± 0.5 mm wide, delicate. Leaves with blade 1.5-2.0 mm wide. Flowers: in a sparse spike; bracts with a base forming a closed enveloping sheath to the culm for at least 15 mm above node from which it arises; utricles (2-)4 or 5 per partial inflorescence, ± 2-ranked on scabrid axis, ± 3 mm long, with a conspicuous vein on each side, beak 0.75 mm long; female glumes fall early, exposing scabrid-margined axis; male spikelets becoming very long with age."
