    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Like T. dodii and T. ramosa but flower spike very long and elongate and bracts conspicuously apiculate.
            textZh: Tritoniopsis elongata (L.Bolus) G.J.Lewis 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 6644; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Distinguished from other species with similar, relatively small, pink flowers with narrow tepals, by the stiff stems, mostly 2-3 mm diam., bearing numerous dingy or brownish pink flowers from near the base of a long spike much longer than the non-flowering part of the stem, and by the conspicuously apiculate bracts that are hard and cartilaginous at flowering time.
            textZh: SANBI 条目提供了 Tritoniopsis elongata (L.Bolus) G.J.Lewis 的鉴别特征。
