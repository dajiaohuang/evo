    - subjectId: taxon:chondrichthyes
      claimKind: scientific
      claimType: fossil-range
      statement: The Chondrichthyes display begins at the approximately 439 Ma Qianodus tooth-whorl sample as an evidence-linked stem-chondrichthyan anchor and continues to living members at 0 Ma; isolated teeth do not establish a crown-chondrichthyan global first appearance, a complete lineage range or direct ancestry.
      confidence: medium
      confidenceRationale: The primary paper documents twenty-three tooth whorls, their late Aeronian horizon, histology and phylogenetic signal. Medium confidence preserves the absence of an articulated body and separates a stem-line evidence anchor from crown-group and global-range claims.
      referenceLinks:
        - referenceId: andreev-2022-qianodus
          relation: supports
          pages: 964–968, especially 965–967
          figure: Figures 1–2; Extended Data Figures 1–3
          quoteLocator: Systematic palaeontology; tooth-whorl development and histology; geological setting and phylogenetic analysis
  claim-rationales.zh:
    - 一手论文记录 23 件牙旋、晚埃隆期层位、组织学与系统信号；中等置信度保留缺少关节相连身体的限制，并区分干群证据锚点与冠群及全球范围主张。
  claim-statements.zh:
    - 软骨鱼类显示范围以约 4.39 亿年前 Qianodus 牙旋样本作为有证据连接的干群锚点，并延续到 0 Ma 的现生成员；孤立牙齿不能建立冠群软骨鱼的全球首现、完整谱系范围或直系祖先关系。
