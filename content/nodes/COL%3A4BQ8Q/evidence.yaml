            locator: "SANBI/WFO archive Morphology row 76469; source 7610.0; publication: Glen, M; Lamb, J; Nicholas, A; Shuttleworth, A. 2011. A new species of Pachycarpus (Apocynaceae: Asclepiadoideae) from KwaZulu-Natal, South Africa. Novon 21(4): 426 - 430. [https://doi.org/10.3417/2010081]. [All rights reserved]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Differentiated from other closely related Pachycarpus E. Mey. species (P. scaber (Harv.) N. E. Br. and P. asperifolius Meisn.) by its small stature, the catilliform or saucer-shaped corolla, and a deltoid corona lobe that is sharp at the distal end, hence the specific epithet. It also differs from P. asperifolius in the inflorescence being terminal and subcorymbose.
