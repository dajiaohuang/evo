    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Habit erect, perennial geophytic herb with milky latex. Rootstock deep-seated, narrow, cylindrical caudex. Stems mostly solitary, 37-40 cm tall, slightly scabrid. Leaves oval, oblong and wide, 3.8-7.9 x 23.4 cm; apex obtuse or rounded with slight mucronate point; base shortly attenuate, rounded; margin thickened, callose and sparsely ciliate, occasionally almost revolute; vestiture glabrous, with the abaxial midrib hispid; venation prominent on the underside; petioles 3-6.5 mm. Inflorescences terminal and extra-axillary, 4 per stem, corymbose or subcorymbose; 4- to 6-flowered; peduncles free, 11-29 mm; pedicels pubescent, 15-21 mm. Flowers pale cream to pale yellow, sweetly scented, 13-17 x 23-25 mm; sepals reflexed, scabrid, 7.5-9 x 3.5-6.5 mm; corolla cream, spreading and catilliform when young, tips reflexed when mature; lobes ovate, ca. 9-12 x 9 mm; gynostegial column 3.9-4.8 mm tall; corona cream, tinged yellow at base; lobes spreading 1.4-3.2 x 1.7-2.4 mm, 2.5-2.7 mm tall, proximal end broad with two curved, erect, contiguous, dentate appendages, broadening distally into a sharp deltoid point (2-2.7 x 0.7-1.9 mm) with sharp apex, a shallow groove running along the upper surface and between the proximal appendages; androecium, with the anther appendages oblong with acute apex, ca. 2 x 1.7-2 mm; anther wings moderately prominent, 2.4-3.4 x 1-1.4 mm; pollinarium, with the corpusculum ca. 0.75-0.85 x 0.45 mm; translator arm narrowly winged, 0.9-1.4 mm; pollinium dorsoventrally flattened, oblong, 1.35-1.8 x 0.65-0.9 mm; gynoeciumwith style head 3.3-3.7 mm diam. Fruit a follicle, solitary, on bent pedicel, inflated, ovoid, ca. 90 x 34 mm, winged apically; apex angular; seeds not seen.
            sourceIds:
