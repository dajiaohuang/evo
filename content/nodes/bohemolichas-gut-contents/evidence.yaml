  claims:
    - subjectId: event:bohemolichas-gut-contents
      claimKind: scientific
      claimType: ecology
      statement: Synchrotron microtomography of Bohemolichas incola inventory specimen 8 maps ostracod, hyolith and stylophoran remains through the gut; prey identity is direct fossil content, while feeding rate, selectivity and neutral-to-alkaline chemistry are bounded inferences from one meal.
      confidence: high
      confidenceRationale: The itemized gut fill is directly imaged, but physiology and habitual diet cannot be generalized from one taphonomically filtered specimen.
      referenceLinks:
        - referenceId: kraft-2023-trilobite-gut
          relation: supports
          pages: 545–551
          figure: Figures 1–4; Extended Data
          quoteLocator: Specimen inventory no. 8; Gut-content mapping; Palaeophysiological interpretation
  claim-rationales.zh:
    - 逐项胃内容物得到直接成像，但不能从一件受埋藏过滤的标本推广生理和惯常食性。
  claim-statements.zh:
    - 对 Bohemolichas incola 编号 8 标本的同步辐射显微断层成像绘制了贯穿肠道的介形类、软舌螺和海林檎遗骸；猎物身份是直接化石内容，而取食速率、选择性和中性至碱性化学环境是从一顿食物作出的有限推断。
