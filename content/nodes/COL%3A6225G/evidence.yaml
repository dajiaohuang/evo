  claims:
    - subjectId: taxon:myxini
      claimKind: scientific
      claimType: morphology
      statement: The Cretaceous hagfish Tethymyxine preserves barbel cartilages, a branchial apparatus behind the skull and chemical traces interpreted as slime glands. These fossil features document similarities to living hagfish, not directly observed slime production or a universal description of every Myxini species.
      confidence: medium
      confidenceRationale: The primary-study abstract identifies the preserved anatomy and chemical traces. The slime-gland interpretation is distinguished from observed secretion, and the fossil specimen does not establish every living species' anatomy.
      referenceLinks:
        - referenceId: miyashita-2019-tethymyxine
          relation: supports
          pages: 2146–2151
          quoteLocator: "Abstract: soft tissue anatomy, barbel cartilages, postcranial branchial apparatus and chemical traces of slime glands"
    - subjectId: taxon:myxini
      claimKind: scientific
      claimType: fossil-range
      statement: The complete body fossil Tethymyxine tapirostrum holotype BHI 6445 from the Cenomanian Hâdjoula Lagerstätte of Lebanon, displayed as 100.5–93.9 Ma, was recovered within crown Myxini; this specimen supports a crown-hagfish fossil bound but not a global FAD, and the older stem hagfish Myxinikela is excluded from the crown range.
      confidence: medium
      confidenceRationale: The primary study directly documents the complete holotype, Cenomanian locality, diagnostic anatomy and phylogenetic placement among living hagfish lineages. Medium confidence preserves stage-scale numerical display, model sensitivity and sampling dependence rather than treating one specimen as the origin of crown Myxini.
      referenceLinks:
        - relation: supports
          referenceId: miyashita-2019-tethymyxine
          pages: 2146–2151
          figure: Figures 1–3; Supplementary Figures S1–S4
          quoteLocator: "Systematic palaeontology: holotype, horizon and locality; morphology-based phylogenetic results"
  claim-rationales.zh:
    - 主研究摘要明确列出了保存的解剖结构和化学痕迹。黏液腺的解释不等于直接观察到分泌行为；该化石标本也不能确定所有现生物种的解剖特征。
    - 一手研究直接记录了完整正模、森诺曼期地点、诊断解剖及其在现生盲鳗谱系中的系统位置。中等置信度保留阶级尺度数值显示、模型敏感性与采样依赖性，不把单个标本当作盲鳗纲冠群起源。
  claim-statements.zh:
    - 白垩纪盲鳗 Tethymyxine 保存了触须软骨、位于头骨后方的鳃器，以及被解释为黏液腺的化学痕迹。这些化石特征记录了与现生盲鳗的相似性，并非直接观察到的黏液分泌，也不代表每个盲鳗物种的通用形态。
    - 黎巴嫩森诺曼期 Hâdjoula 特异埋藏群的 Tethymyxine tapirostrum 完整躯体正模 BHI 6445（显示区间 100.5–93.9 Ma）在分析中位于盲鳗纲冠群内部；该标本支持冠群盲鳗的化石界限，但不是全球首现，且更老的盲鳗干群 Myxinikela 不计入冠群延限。
