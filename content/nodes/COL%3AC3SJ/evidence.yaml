    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plant succulent, not stoloniferous, acaulescent, solitary. Leaves about 20 in a dense rosette, erectly spreading, lanceolate-attenuate, up to 45 cm, long, 9 cm broad at base; upper surface slightly concave, dull green, with numerous dull white spots throughout, the spots elongate and scarcely arranged in undulating transverse bands; lower surface convex, dull green, obscurely spotted throughout, the spots larger, more obscure and more in undulating transverse bands; margins sinuate-dentate, armed with deltoid brownish firm teeth about 3-4 mm long, 10-15 mm distant, the interspaces usually the colour of the leaf, sometimes slightly corneous and pale brownish. Inflorescence a branched panicle up to 1.75 met. high. Peduncle flattened low down, about 3 cm diam., 8-12-branched from about the middle, the lowest branches with 1-3 branchlets producing a total of 15-20 racemes. Racemes cylindric slightly acuminate, the terminal the highest, 20-25 cm, long, 8-9 cm diam. Bracts deltoid-acuminate, about as long as their pedicels, thin sub-scarious pale brown, 3-5-nerved, Pedicels 12-15 mm long. Perianth rose-red, 38-42 mm long, with a globular basal swelling 10-11 mm diam., constricted to 6 mm, above the ovary, thence slightly decurved and enlarging towards the throat, the mouth slightly pale brownish; outer segments free for 10 mm, obscurely nerved, with paler margins and sub-acute slightly spreading apices; inner segments dorsally adnate to the outer for 30 mm, broader than the outer, with broader white marginal border and more obtuse apices. Filaments almost white, the 3 inner narrower and lengthening in advance of the 3 outer. Genitals exserted 1-2 mm. Ovary 8 mm long, 3.5 mm, diam., finely 6-grooved, green. Capsule 30 mm long, 15 mm diam. at middle.
