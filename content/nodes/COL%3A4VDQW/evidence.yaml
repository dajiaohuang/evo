    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Densely branched succulent perennial shrub, to 25 cm tall, 30 cm diameter, internodes not visible, stems very woody. Leaves dull olive green, connate toward bases, sheath 3-4 mm long, free parts spreading widely, 8-10 mm long, 9-10 mm broad, swollen and trigonous, tip without a mucro, margins and keels rounded, but with line along them, epidermis velvety. Flowers remaining open day and night, 13-20 mm diameter, solitary, sessile, bracteolate, calyx lobes 6, shorter than petaloid staminodes, petaloid staminodes pink, 5-8 mm long, filamentous staminodes white, surrounding the central cone of stamens, filaments white, shortly papillate near bases, pollen white, filamentous staminodes and stamens overtop stigmas, stigmas 10-11, pale yellow to greenish, to 2 mm long, top of ovary raised, nectaries in a ring. Fruit 6-7 mm diameter, locules 10-11, top raised and dome-shaped, with low rims, base shortly funnel-shaped, closing bodies large, white, blocking the exit of the locule almost completely, valve wings narrow and ending almost in awns toward tips, covering membranes complete, with stiff closing ledge developed below rim. Seeds pale, longer than tall, almost smooth.
            sourceIds:
              - sanbi_17946_0
            locator: "SANBI/WFO archive Morphology row 103823; source 17946.0; publication: Klak, C; Bruyns, PV. 2016. Expansion of Schlechteranthus (Ruschioideae, Aizoaceae) to include Polymita, with a new species from Namaqualand, South Africa. S. African J. Bot. 103: 70 - 77. [http://dx.doi.org/10.1016/j.sajb.2015.08.020]. [Copyright held by the South African Association of Botanists (2016); http://www.sciencedirect.com/science/journal/02546299]. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: The 10- to 11-locular fruits with closing bodies and narrow or absent valve wings combined with the highly compact habit place this species in Schlechteranthus. The leaves of S. holgatensis are velvety from elongated epidermal cells and this feature is unique in Schlechteranthus. The fruits of the new species most closely resemble those of S. hallii and S. maximiliani, sharing with them the relatively large closing bodies with a stiff closing ledge below the rim of the covering membrane. S. holgatensis shares the rounded, indistinctly keeled leaves with S. steenbokensis and both species lack a distinct apical tooth on each leaf.
            textZh: SANBI 条目提供了该种的鉴别特征。
