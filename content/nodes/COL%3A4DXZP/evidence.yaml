            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Passerina corymbosa is distinguished by its greyish green leaves and grey-brown stems of which the older branchlets are leafless, often arcuate and indurate. The leaves are laterally compressed with the distinct midrib somewhat keeled. The rhombic to obtrullate (diamond-shaped) bracts are always conspicuously angled and distinctly 4- or 5- ribbed. The most diagnostic character in the leaf anatomy of P. corymbosa is the presence of a hypodermal sclerenchymatous sheath, illustrated by Bredenkamp & Van Wyk (2001a). This species has always been confused with P. filiformis sensu lato, which has inconsistently been distinguished by longer, filiform leaves. In Western Cape P. filiformis subsp. filiformis is separated by widely obovate bracts, narrowing abruptly into a filiform point. Where the distribution of P. corymbosa and P. montivaga overlap in the southern Cape, the latter species is distinguished by bracts with ovate wings and margins that are hairy in the distal half. In Eastern Cape P. montivaga is distinguished by obtrullate bracts narrowing abruptly into a straight, leaf-like point.
