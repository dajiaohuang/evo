        claims:
          - text: Shrub or small tree to 2 m. Leaves linear, with a hairy groove beneath, 3.5-10.0 mm long, bracts ovate-acuminate, wings longitudinally folded. Flowers in spikes, tube ± 4 mm long, neck slender, ± 2 mm long. Fruits dry.
            sourceIds:
