    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Robust, erect herb, up to 1 m tall. Basal leaves bi- or tripinnate, pubescent. Achenes 102-152 cm spherical to slightly elongated head. Flowers yellow.
            sourceIds:
              - sanbi_11118_0
            locator: "SANBI/WFO archive Morphology row 3262; source 11118.0; publication: Herman, PPJ; Retief, E. 1997. Plants of the northern provinces of South Africa: Keys and diagnostic characters. Strelitzia 6: 1 - 681. National Botanical Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: A widespread and variable species, especially in the degree of dissection of the leaves, which range from ternate to tripinnatisect, development and density of the vestiture on the stems and leaves, size of the flowers, and development of tubercles on the fruits, which vary from scarcely evident to almost spinulate. Plants from high altitudes and exposed or trampled situations are typically dwarfed and compact or almost prostrate and those from sheltered locations larger and more lush, but the species is always readily distinguished from other sub-Saharan species by its ± appressed pubescent, ternately pinnate or bipinnate leaves with one or two pairs of lateral leaflets, and ± tuberculate achenes. The flowers are small to moderately sized, with reflexed, hispid sepals and 5 obovate petals, 4-9 mm long.
            textZh: SANBI 条目提供了该种的鉴别特征。
            sourceIds:
              - sanbi_15319_0
            locator: "SANBI/WFO archive Diagnostic row 58553; source 15319.0; publication: Manning, JC; Goldblatt, P. 2013. The native and naturalised species of Peltocalathos and Ranunculus (Ranunculaceae: Ranunculeae) in southern Africa. Bothalia 43(2): 179 - 195. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
