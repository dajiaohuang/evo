        claims:
          - text: Tufted annual 120-350 mm high. Leaf blade 60-100 x 4-6 mm. Inflorescence 10 mm wide; spikelets in groups of five, vase-shaped. Spikelet cluster 10 x 3 mm; involucral glume/bract is convex on lower half, with a central constricted area, then it curves outwards, apex acute or awned, length variable, up to 15 mm long; anther 3.1-3.6 mm long.
