          - text: Major diagnostic characters of Schoenus submarginalis include its relatively short (<4.2 mm) and narrow spikelets (< 1.2 mm), as well as the small reddish-purple streaks adjacent to its hyaline glume margins. Schoenus exilis, S. ligulatus, and S. quartziticus also have narrow spikelets; however, these three species do not have hyaline glume margins with adjacent reddish-purple streaks and their spikelets tend to be either linear-lanceolate or narrow lanceolate, compared to the wider lanceolate spikelets of S. submarginalis. Schoenus submarginalis is most similar to S. bolusii, but the leaf sheaths of these two species differ, with S. submarginalis having firm leaf sheaths that are generally solid in colour, while S. bolusii has membranaceous leaf sheaths with reddish-purple streaks. In addition, S. submarginalis has on average taller culms (305-475 mm) than those of S. bolusii (249-310 mm).
