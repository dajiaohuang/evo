    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Caespitose, phyllopodic perennial graminoid. Culms terete, slender, 208-580 x 0.2-0.8 mm. Leaves basal, 1-3, (16-)32-68(-153) x0.2-0.9 mm, mostly straight, proximally channelled, margin usually serrate above sheath. Sheaths usually firmly clasping culm, sometimes but not always longitudinally striate. Ligule firm, relatively short, 0.2-1.0 mm long. Inflorescence a slender pseudolateral panicle, 11-43x 3-8 mm, proximal rachis length 5-20 mm. Proximal primary inflorescence bracts slender, not channelled, apex acute, never widened at base, 24-60(-84) mm long, exceeding length of inflorescence 0.5 times or more, without notable longitudinal veins. Proximal and subproximal primary inflorescence bracts never with membranaceous extension sat base. Spikes 2-14, (3.0-)7.0-16.0 mm long, sometimes overlapping. Spikelets lanceolate to slightly ovate, (2.2-)3.0-3.9(-4.1) x 1.0-1.2 mm, pedicellate, 2-5(-8) spikelets per spike, reddish-brown with hyaline margins having adjacent small reddish-brown streaks. Proximal spikelet prophyll 1 per spikelet, with a raised vein extending to mucro, 0.3-1.0 mm long, prophyll mucro varying in length, 0.7-2.2(-5.2) mm long. Rachilla (0.3-)1.4-2.2(-4.0) mm long. Glumes 6-8 per spikelet, proximal glume 0.3-1.2 mm long, subproximal glume 0.6-1.4 mm long, upper glumes longer than basal ones, apex acute to acuminate, lower glumes less than half length of spikelet. Glume mucros usually relatively short, proximal mucro 0.1-0.5(-1.5) mm long, subproximal mucro 0.1-0.7 mm long. Stamens (2-)3(-4) per floret, anthers 1.3-2.5(-4.3) mm long. Stigmas 3-branched, vestigial stigmas of second bisexual floret sometimes present. Perianth bristles not observed. Nutlet broad elliptic, trigonous, yellowish in colour, 2.2-2.4 x 0.7-1.3 mm. Nutlet beak 0.3-0.6(-1.5) mm long, hispid, purplish-brown when mature.
