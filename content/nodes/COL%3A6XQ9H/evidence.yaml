    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Slender, tuberous geophyte to 25 cm. Leaves 2, basal, suberect to spreading, cauline sheaths urceolate, bracts deflexed. Flowers 2-31, in a rather dense raceme, white, sepals 8-10 mm long, spurs 15-22 mm long.
            textZh: Satyrium situsanguinum van der Niet & Liltved 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13882_0
            locator: "SANBI/WFO archive Morphology row 1105; source identifier 13882.0; cited publication: Kurzweil, H. 2012. Orchidaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 177 - 197. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Satyrium situsanguinum is recognized by its urceolate- campanulate cauline leaf sheaths, white flowers with spurs longer than the ovary, and a rostellum with lateral viscidia. None of these characters is unique within Satyrium but their combination is not matched among other known species. S. lupulinum Lindl. differs in having cream to dull yellowish green flowers tinged dull purple instead of white flowers, leaf sheaths that are more closely adpressed to the flowering stem instead of clasping the stem loosely, often slightly shorter spurs (15-18 mm vs. 15-21 mm), and having a laterally complanate rather than subglobose labellum. Also, although S. lupulinum is relatively widely distributed throughout the southwestern mountains of the CFR, it is has not been recorded from the Slanghoek and adjacent Du Toit's Kloof mountains, or indeed from the same quarter degree grid square (3319CA) as S. situsanguinum. Another species resembling S. situsanguinum is the highly variable S. longicauda Lindl. Apart from several localities in the eastern parts of the CFR, this species is widespread in the moister highlands of the southern African summer-rainfall region. The two species differ in several respects, (although given the highly variable nature of S. longicauda none of these seem consistent). The labellum flap of S. longicauda is mostly puberulous, whereas it is glabrous in S. situsanguinum. The sepals and petals are fused at the base for a small portion in S. situsanguinum, whereas the sepals are ± free to the base in S. longicauda and the leaves of the latter are typically borne on a separate shoot, whereas they are part of the flowering shoot in S. situsanguinum. Satyrium humile Lindl. differs in that the spurs stand away from the ovary instead of being parallel to it, and the rostellum possesses terminal instead of lateral viscidia. Satyrium acuminatum Lindl. differs by its sepals and petals forming a U-shaped entrance to the wide labellum galea instead of having the sepals and petals arranged ± horizontally, and in having kidney-shaped instead of globose viscidia. Finally, Satyrium stenopetalum Lindl. differs in having erect bracts instead of reflexed bracts and the tips of the sepals and petals, including the labellum flap, being acuminate instead of truncate.
