    facets:
      morphology:
        status: partially-supported
        claims:
          - text: "Cormous geophyte, up to 250 mm high. Leaves with blade linear to sword-shaped, pleated, densely hairy. Flowers: arising below ground; zygomorphic; filaments 10-15 mm long; perianth with tube 33-55(-70) mm long, dorsal segment 30-50 mm long, blue to violet with white markings on lower segments; Feb.-May."
            textZh: Babiana bainesii Baker 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_16273_0
            locator: "SANBI/WFO archive Morphology row 59086; source identifier 16273.0; cited publication: Retief, E; Meyer, NL. 2017. Iridaceae. In: E Retief & NL Meyer (eds), Plants of the Free State: Inventory and identification guide, Strelitzia 38: 934 - 956. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Recognised by the subterranean stem and inflorescence, the flowers thus arising shortly below ground level, and by its narrow, upright leaves, associated with blue-mauve to violet flowers with white markings on the lower lateral tepals edged in darker blue. The flowers have a perianth tube 40-55(-70) mm long and subequal tepals, the dorsal usually about as long as the tube, or slightly shorter when the tube exceeds 50 mm. The narrow leaves are linear to sword-shaped, erect and 15-25 mm long, thus much exceeding the flowers. Plants are often difficult to see among the grass where they grow, but when in bloom can often be located by their particularly strong sweet scent. Available evidence indicates that the flowers are pollinated by large-bodied bees. A peculiar feature of this and the allied Babiana hypogaea is the underground inflorescence, a spike but with the lower flowers borne on short stalks, these sometimes resembling lateral branchlets, each bearing one or two flowers.
            textZh: SANBI 条目提供了 Babiana bainesii Baker 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 94938; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
