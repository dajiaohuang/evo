    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Rhizomatous perennial to 40 cm, forming diffuse tufts, stems slightly flattened, dichotomously branched and rooting at nodes. Leaves sword-shaped. Flowers blue, nodding, soft, spathes greenish translucent and slightly lacerate. Capsules short, 3-lobed.
            textZh: Aristea singularis Weim. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 6624; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: It has tufts of leaves at ground level and produces persistent aerial stolon-like stems that root at nodes some distance from the parent plant, a feature unique in Aristea, and in a sense it is a trailing plant. The slender flowering stems, produced from leaf clusters, are usually dichotomously branched and bear pendent flower clusters the rounded, ± doughnut-shaped seeds with a depression at the chalazal end are quite unlike the tangentially flattened, lamellate seeds of other members of subg. Aristea. The seed funicle is persistent and fleshy, forming an irregularly lobed body.
            textZh: SANBI 条目提供了 Aristea singularis Weim. 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 94147; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
