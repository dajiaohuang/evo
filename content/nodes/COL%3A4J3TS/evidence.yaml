          originalSourceText: A glabrous shrub, mostly scarcely 0.5 m. tall; stems simple or occasionally branched, 2-3 mm. thick, somewhat finely striate, greenish; leaves oblong-elliptic, subovate or lance-elliptic, 3-7 or sometimes 8 cm. wide X 12-19 cm. long, apex attenuately sharp-acuminate, base narrowed, subequilaterally acute or rounded and obtuse, minutely auriculate at the petiole, pinnately nerved throughout, the midrib rather prominent beneath, the lateral nerves slender, 6-9 on each side, divergent and submarginally loop-connected, drying green above, paler and subglaucous be- neath, membranous, translucent; petiole mostly scarcely 5 mm. long, longitudinally striate, scarcely vaginate at the very base; spikes 3-5 mm. thick X 3-5 cm. long when mature; peduncle about 5 mm. long; rachis smooth or obscurely papillate; bracts cupulate, glabrous; fruit mostly exserted, free, globose-tetragonous, smooth or obscurely papillate, stigmas short, 3-4, on a short, stout style.
