        claims:
          - text: Tufted annual 100-250 mm high. Leaf blade 60-100 x 2-4 mm, hairy. Inflorescence open, drooping, spikelets ± secund; lower pedicels and branches with ± four spikelets; branches and pedicels twisted or curved, flexuous. Spikelet 8-15(20) x 2-4 mm, moderately laterally compressed, spikelet hairy to glabrous; lower glume 1-nerved; upper glume 7-12 mm long; 3-5-nerved; lemma 8-13 mm long, rounded on back, margins hyaline, bifid; awn 8-20 mm long, straight, arising well below apex; palea ciliate on keels, hairy between keels; callus scar circular, minutely hairy; anthers 0.5-1.0 mm long.
