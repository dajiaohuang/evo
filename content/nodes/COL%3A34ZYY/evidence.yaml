        usage:
          title: Desmanthus virgatus (L.) Willd., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Small shrub or subherbaceous, nearly erect or more commonly diffuse or de- cumbent, the branchlets essentially glabrous, angled or subtetragonal, scarcely lenticellate. Leaves moderately small, bipinnate, the pinnae 1-7 (mostly 2-4) pairs opposite on the rachis, the leaflets mostly 10-20 pairs per pinna; petiole usually no more than 5 mm. long, subterete, perhaps ciliate above, bearing apically at insertion of the lowermost pair of pinnae a large or small, orbicular to obovate, cupulate or patelliform, sessile gland; rachis usually flattened and lightly pubescent or ciliate above, eglandular (except for gland already described at juncture of rachis and petiole), apiculate from the lower side apically; pinnae 1-4 cm. long; leaflets linear or linear-oblong, 2-8 mm. long and mostly 1-2 mm. wide, obtuse or rounded apically, obliquely truncate basally, glabrous except usually ciliate, the costa but not secondary veins visible; stipules setiform, mostly 3-5 mm. long. Inflorescence of axillary, pedunculate heads towards the tips of the twigs; pedun- cles up to 6 cm. long (in age), usually scatteringly pubescent; head small, dense, few-flowered, the flowers all erect; floral bractlets lanceolate, about 2 mm. long, subrigid. Flowers whitish, sessile; calyx cupular-tubular, 2-3 mm. long, glabrous or subglabrous, prominently dentate; corolla of 5 essentially free, obovate, glabrous petals 3-4 mm. long; stamens 10, free, glabrous, the filaments 6-7 mm. long; anthers ovate, almost 1 mm. long, glabrous; ovary linear-oblong, about 3 mm. long, curved, glabrous, bilateral; style about 5 mm. long, expanded apically into a truncate stigma. Legume linear, mostly 4-6 cm. long and 3-4 mm. wide, flat, glabrous, short-beaked, dehiscent on both valves, the seeds oblique.
