        claims:
          - text: Emilia schinzii grows on sandy or grey calcareous soil on flats in mixed Acacia bush (e.g. with Mopane); also on stony soil with some surface clay, disturbed ground (e.g. near roads), on gentle slopes or flat ground, at edges of pans, on overgrazed or wooded grassland, on Kalahari sands and in seasonally waterlogged grassland.
