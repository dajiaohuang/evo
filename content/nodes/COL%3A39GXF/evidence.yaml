            locator: "SANBI/WFO archive Morphology row 67325; source 16005.0; publication: Cron, GV. 2014. A synopsis of Emilia (Senecioneae, Asteraceae) in southern Africa. Phytotaxa 159(3): 195 - 210. [http://dx.doi.org/10.11646/phytotaxa.159.3.3]. [All rights reserved]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
