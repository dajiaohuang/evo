          - text: The lilac-flowering form is apparently more common than the white-flowering form. Emilia schinziigrows on very specific substrates and is probably more widespread in the Waterberg region of South Africa than the two known collections suggest. The basal tube of the disc florets characteristically widens very abruptly into the distal lobed part of the corolla, unlike E. limosa which widens gradually. Jeffrey mistakenly dated Moore’s description of Othonna ambifaria as 1889 instead of 1899, which resulted in his use of the epithet ‘ambifaria’ for the new combination in Emilia.
