        claims:
          - text: Like H. spinosa but branches stellate-tomentose and becoming hard and spinelike (vs. branchlets sparsely stellate-pubescent or glabrous and usually the enlarged peduncles becoming spike-like).
            sourceIds:
              - sanbi_14904_0
            locator: "SANBI/WFO archive Morphology row 34929; source 14904.0; publication: Snijman, DA. 2013. Malvaceae. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 416 - 420. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Characterized by the usually stellate-tomentose leaves, the indurating branchlets, and the long, pilose horns on the capsules. H. affinis, as defined here, varies considerably, but it can, nevertheless, be recognised as an entity and distinguished from related species. The two species with which it has been very generally confused are H. spinosa and H. helianthemum. From H. spinosa it can be distinguished, among other details, by the branchlets being stellate- tomentose and becoming indurated or spine-like, whereas in H. spinosa the branchlets are sparsely stellate-pubescent or glabrous and it is usually the persistent, enlarged peduncles which become spikelike. H. helianthemum differs considerably from H. affinis, for it has long, slender branchlets which do not become indurated but terminate in raceme-like inflorescences.
