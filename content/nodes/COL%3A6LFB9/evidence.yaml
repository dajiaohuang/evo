    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Stem leafy, proliferous from the base and forming small clusters or large mats 50 to 140 mm high, 20 to 63 mm diam., erect or prostrate. Leaves 15 to 50 mm long, 7 to 16 mm broad at the base, ascending, with tips incurved, ovate to lanceolate-acute or cuspidate, 3.25 to 6.6 mm thick; margins smooth, or sometimes roughened by tubercles, rounded or acute; upper surface flat, convex, or concave, often with a raised line which runs the full length of the leaf, smooth or tubercled with small subprominent, white tubercles, irregularly scattered or arranged in longitudinal rows; back surface rounded, obtusely keeled with 5 to 15 regular or irregular transverse or longitudinal rows of rounded and/or numerous, oblong, truncated white tubercles 0.75 to 1.25 mm diam. Inflorescence about 37 cm tall; peduncle simple, terete, 1.25 to 2 mm diam., about 23 to 39 cm long, bracteate; sterile bracts 2 to 3, membranous, ovate, abruptly elongated, about 8 mm long, erect, keeled; raceme 9 to 17 cm long, lax, with 16 to 26 spirally arranged flowers and buds, 1 to 4 open at a time; floral bracts membranous, 2 to 3 mm long, deltoid, acute, keeled with reddish-brown or green veins, clasping the pedicels, (shorter than the pedicels); pedicels 2 to 4.5 mm long, 1.0 mm diam., light grey, erect; perianth pinkish-white, with greenish-brown keels to the segments, 15 to 20 mm long, compressed at base, funnel-shaped; tube more or less 5 mm across, constricted to 3.5 mm above, straight; segments free to the base, limb 2 lipped, posterior segments erect, pinkish-white with reddish-brown veins not spreading, exterior part little recurved, little spreading, pinkish-white with reddish-brown veins; stamens 6 of two lengths 4.5 and up to 6.5 mm long, inserted within the perianth tube, limb 2 lipped; ovary 3 to 3.35 mm long, 1.25 to 2 mm diam., pale green; style 1.0 to 1.25 mm long, curved or straight, capitate.
