      ecology:
        status: partially-supported
        claims:
          - text: Summer rainfall area at altitudes varying between 70 and 100 m. This area is predominantly hilly, with much of the ground covered with sparse low scrub, or often sealed off by impassable thickets of Euphorbia, Aloe and other indigenous trees. The soil is black or brown and somewhat acid, while the summer rainfall varies between 500 and 700 mm per annum. H. reinwardtii grows well raised above the ground in exposed positions at the foot of Acacia trees, or in the shade of indigenous bush, or on rolling grass-covered hills, or on stony slopes where it grows as single clusters or as large mats. H. reinwardtii prefers a firm hard soil with pH 6.5.
