        usage:
          title: Oreopanax xalapensis (Kunth) Decne. & Planch., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrubs or trees to 10 m. tall, the branchlets terete, glabrous or sparsely to densely ferrugineous stellate-pubescent. Leaves palmately compound; leaflets 5-10 (rarely 3-12), the blades ovate- to obovate- or lanceolate-elliptic, 5-30 cm. long, 1.5-11.0 cm. broad, short-acuminate to long-caudate at the apex, attenuate at the base, glabrous above, glabrous or sparingly ferrugineous stellate-pubescent below, entire or serrate, the serrations remote, generally in the apical half of the lamina, the costa prominent below, the primary lateral veins spreading; petioles striate, glabrous or sparsely ferrugineous stellate-pubescent, 7- 31 (-60) cm. long, dilated proximally, the petiolules striate, 0.5-3.5 (-25) cm. long. Inflorescences generally ferrugineous stellate-pubescent throughout, racemose or paniculate, the primary peduncle 1-3 cm. long, the primary rhachis 17-40 cm. long, the bracts ovate-oblong, often to 8 mm. long, the floriferous peduncles many, 0.5-2.0 (-4.0) cm. long, glabrous or pubescent. Staminate heads globose or slightly elongate, 5-13 mm. in diameter, the subtending bracts often connate; flowers 20-50 per head; calyx 1.0-1.5 mm. long, about 1 mm. in diameter, the limb essentially truncate; petals deltoid, 1.5-3.0 mm. long, 1.0-1.5 mm. broad; filaments 2-3 mm. long, the anthers about 1 mm. long, 0.5 mm. broad; style 1. Fruiting heads to 1.5 cm. in diameter, the fruits 2-12 (usually about 6) per head, coriaceous, ellipsoid or subglobose, at maturity 5-7 mm. in diameter, the persistent styles 5, recurved, the seeds frequently 4 or 5, sometimes fewer.
          originalLanguage: en
          sourceField: general
