    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Acaulescent, cormous geophyte, 5-8(-16) cm. Leaves usually narrow, occasionally broad, longer than stem, obliquely lanceolate, hairy. Flowers zygomorphic, blue to mauve with white to pale yellow markings, fragrant, inner bracts divided to base, ovary smooth.
            textZh: Babiana ambigua (Roem. & Schult.) G.J.Lewis 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 6694; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Distinguished by the acaulescent habit, stem lacking a collar of fibres around the base, rather soft-textured fibrous corm tunics and floral bracts divided to the base. The relatively large flowers are predominantly dark blue to violet with white to creamy white markings and have a sweet or spicy scent. It is often confused with a second coastal species, B. nana, and the two sometimes occur together, B. nana flowering somewhat later in the season than B. ambigua. Hybrids between the two species have been described by Lewis (1959) from the Cape Peninsula and on the Atlantic Coast to the north. Although similar in general appearance, B. nana usually has a short aerial stem and larger and more intensely fragrant flowers, the perianth often a deeper colour and, most importantly, the inner bracts are undivided. Lewis (1959) also reported hybrids between B. ambigua and the related and similar B. scabrifolia from the Olifants River Valley. Babiana grandiflora is also easily confused with B. ambigua, but this species from coastal Namaqualand has the inner floral bracts only notched apically, and considerably larger flowers with the dorsal tepal 45-55 mm long vs. 28-40 mm in B. ambigua.
            textZh: SANBI 条目提供了 Babiana ambigua (Roem. & Schult.) G.J.Lewis 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 94954; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
