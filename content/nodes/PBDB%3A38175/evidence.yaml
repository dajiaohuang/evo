      statement: Elasmosauridae is represented by the taxa sampled in O’Gorman’s revised matrix and paleobiogeographic analysis; the recovered topology and recognized Cenomanian/Santonian intervals are study results, not exact family-wide origin or extinction boundaries.
      confidence: medium
      confidenceRationale: The source directly revises a specimen and runs a family-level matrix, but topology and inferred biogeographic phases remain sampling-dependent.
      referenceLinks:
        - referenceId: ogorman-2019-elasmosaurid-phylogeny
          relation: supports
          pages: 39(5):e1692025
          figure: Figures 1–7; Tables 1–2; supplementary matrix
          quoteLocator: Systematic paleontology; phylogenetic analysis; paleobiogeographic discussion
    - subjectId: taxon:elasmosauridae
      claimKind: scientific
      claimType: fossil-range
      statement: The reappraised Aphrosaurus furlongi material from the Maastrichtian Moreno Formation supports a 72.1–66 Ma elasmosaurid study-sample window, not exact family-wide origin or extinction.
      confidence: medium
      confidenceRationale: "Aphrosaurus furlongi represented elasmosaurid sample: the cited primary study or systematic review directly supports the stated sample, calibration or withholding boundary at the supplied locator. Confidence is medium and does not extend to a global FAD, LAD, direct ancestor or unsampled interval."
