  claims:
    - subjectId: taxon:equidae
      claimKind: scientific
      claimType: topology
      statement: The sampled living Equidae form one family-level branch in both combined-data perissodactyl analyses, while relationships among extant equids remain poorly agreed across trees; no fossil range or exact family origin follows from this result.
      confidence: medium
      confidenceRationale: The study directly tests all extant equid species in its taxonomy and reports unresolved internal relationships, which the statement preserves.
      referenceLinks:
        - relation: supports
          referenceId: price-2009-perissodactyl-phylogeny
          pages: 277–292
          quoteLocator: "Abstract; Results and Discussion: Equidae resolution"
  claim-rationales.zh:
    - 研究直接检验其分类框架中的全部现生马科物种，并报告内部关系未解；表述保留这一限制。
  claim-statements.zh:
    - 在两种奇蹄类联合数据分析中，取样的现生马科均形成一个科级分支，但不同树对现生马类内部关系的一致性仍较差；该结果不推出化石范围或精确科级起源。
