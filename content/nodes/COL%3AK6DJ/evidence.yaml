      morphology:
        status: partially-supported
        claims:
          - text: Acaulescent, cormous geophyte to 10 cm. Leaves sword-shaped to linear, apices acute, hairy. Flowers several on a short, inclined spike, blue to violet with broad white markings on lower tepals, tube elongate, inner bracts divided to base, ovary hairy.
            textZh: Babiana engysiphon J.C.Manning & Goldblatt 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 6729; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: A dwarf plant, seldom reaching more than 100 mm above the ground, Babiana engysiphon is recognised by its elongate perianth tube, mostly 35-40 mm long, violet perianth with large white markings on the lower lateral tepals and horizontal spike. The several leaves, narrow and almost linear to narrowly sword-shaped and usually lightly pleated or nearly plane and velvety, arch toward the ground and are often close to horizontal. Its immediate relationships are uncertain. The softly hairy ovary and bracts divided to the base or nearly so conform to ser. Mucronatae of sect. Babiana Plants co-occur in some places with Babiana mucronata subsp. minor, which has short-tubed, scented flowers adapted for pollination by anthophorine bees, whereas the odourless flowers of B. engysiphon are pollinated by long-proboscid flies. Despite the difference in pollination system, some hybridization between the two is evident. These plants have a tube of intermediate length and pale yellow rather than white markings on the lower tepals. Babiana engysiphon also co-occurs with B. rigidifolia, but this more robust, broad-leaved plant grows in a different habitat, with the corms wedged in crevices in sandstone pavement.
            textZh: SANBI 条目提供了 Babiana engysiphon J.C.Manning & Goldblatt 的鉴别特征。
