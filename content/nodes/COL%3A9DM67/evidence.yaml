        usage:
          title: Sesbania grandiflora (L.) Poir., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Small tree to 8 m tall, young parts hairy, soon becoming glabrous. Leaves alternate, even pinnate with (18-)20-40(-50) narrowly elliptic to oblong leaflets; leaflets ca. 7-10 mm wide, 25-35 mm long, rounded at the tip and base; petiole ca. 1 cm long; petiolules ca. 2 mm long, the rachis to 25 cm long; stipels minute; stipules narrowly triangular, to ca. 5 mm long, apparently deciduous. Inflores- cence of 2-4 flowered axillary racemes, pedicels to 2 cm long, thin. Flowers large and showy, ca. 6-9 cm long; hypanthium ca. 10-18 mm long, not including the narrowed base, 15-18 mm wide (flattened out); teeth low to absent, the hypan- thium rim variously erose; petals white, rosy white, or red; standard ca. 50-80 mm long, 40 mm wide, claw and basal auricles ca. 15 mm long; wing petals ca. 50-80 mm long, 20 mm wide, the claw ca. 20 mm long; keel petals upcurved, ca. 60 mm long with basal auricles, claw ca. 1/2 the length of the blade; stamens with the sheath to 80-90 mm long, 3 mm wide, strongly upcurved. Fruits long and narrow, to 50 cm long, ca. 0.6-0.9 cm wide, beaked, the stipe to 4 cm long; surface more or less flat or slightly indented between the seeds, smooth, dull; margins thickened and raised above the valve surface, also slightly indented be- tween the seeds; seeds numerous.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 5796
