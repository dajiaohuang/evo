      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, 8-14 cm, tunics woody, concentric. Leaves linear, margins and midrib thickened and sticky. Flowers bright yellow, tepals slightly cupped.
            textZh: Geissorhiza humilis (Thunb.) Ker Gawl. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 6785; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Geissorhiza humilis is recognised by the relatively large, bright or pale yellow flowers with tepals 16-22 mm long, and three leaves, the blades with thickened margins and midribs, thus narrowly 2-grooved on each surface. Both the leaves and the floral bracts are sticky and usually have grains of sand adhering to them. Populations on the Cape Peninsula always have bright, golden yellow flowers but elsewhere the species may have pale yellow flowers, with or without a green or dark tube. Geissorhiza humilis and the related but smaller flowered G. hispidula grow together at several sites on the Cape Peninsula, and often flower at the same time, when it is clear that they are quite different species although vegetatively they are almost identical. Not surprisingly, they have often been confused and their taxonomic history is intertwined. Geissorhiza hispidula can be distinguished by the smaller, creamy white flowers with short perianth tube 3-4 mm long and tepals 10-15 mm long, the outer marked red on the reverse, and spikes usually with 2 to 5 flowers, often fewer than in G. humilis. Geissorhiza darlingensis, restricted to the Darling area to the north of Cape Town, is closely allied to G. humilis and also vegetatively almost identical but has somewhat larger flowers with tepals 23-26 mm long, a tube 9-11 mm long vs. 5-8 mm in G. humilis, and longer filaments 8-9 mm long. The flowers also have a conspicuous dark centre.
            textZh: SANBI 条目提供了 Geissorhiza humilis (Thunb.) Ker Gawl. 的鉴别特征。
            sourceIds:
