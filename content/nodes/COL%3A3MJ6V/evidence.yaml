    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Shrublet with 3-8 or more stems. Stems 60-200(-500) mm long, 25-60 mm thick, erect, brownish green; tubercles prominent, fused in lower half into 16-24 acute angles along stems, each tipped with a weak spine 5-7 mm long (dark purple-brown when young). Inflorescences each with 1-5 flowers opening successively; pedicel 7-12 mm long, 2-3 mm thick; sepals 3-4 mm long, 1.5 mm broad at base, lanceolate-subulate. Corolla 28-48 mm diam., ± rotate, flat to saucer-shaped, slightly and broadly 5-lobed; inside dark flesh-coloured to greenish yellow becoming pinkish red near centre, densely covered with soft white hair-like bristles 1-3 mm long each arising from a small maroon-tipped cylindrical obtuse papilla; tube 1 mm long, 3.5-4.0 mm broad at mouth, cupular, pentagonal, formed by annular thickening near base in otherwise ± flat corolla, this thickening raised into 5 pinkish slightly shiny bulges around its mouth; lobes 4-7 mm long (excluding narrow tip), 12-18 mm broad at base, spreading, broadly ovate, obtuse, abruptly narrowing to attenuate subulate point 3-6 mm long. Corona ±2.5 mm tall, 3-4 mm broad, dark purple-black, glabrous, raised on short stipe; outer lobes 0.5-1.0 mm long, 1.0-1.7 mm broad, spreading, transversely oblong, truncate-emarginate to shortly and obtusely bifid, laterally fused near base to bases of inner lobes; inner lobes ±0.5 mm long, ± square to deltoid, obtuse to truncate, not exceeding anthers, with obtuse dorsal projection fused to outer lobes.
            sourceIds:
