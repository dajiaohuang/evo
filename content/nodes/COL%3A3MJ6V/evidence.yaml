      ecology:
        status: partially-supported
        claims:
          - text: Subsp. annulata mostly grows in flat areas between low hills in slightly gravelly ground. Only rarely has it been seen to grow on the slopes of hills. Plants are often very scattered with several hundred metres or more from one large plant to the next, but occasionally quite substantial colonies occur. One east of Willowmore was found to contain more than 50 large plants. The areas where it occurs are mostly covered with short Pentzia bushes (Euphorbia ferox is also often present) and there are few other shrubs exceeding 300 mm in height (except for some large forms of Euphorbia polygona in some places near Willowmore). Consequently, specimens of subsp. annulata are often the largest plants in the area and are then usually visible from a considerable distance.
