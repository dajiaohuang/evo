    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, 30-40 cm. Leaves lanceolate, soft, often undulate. Flowers in branched racemes, mauve to purple with darker markings, fragrant, pedicels suberect, with 3 upper and 3 larger lower stamens.
            textZh: Cyanella orchidiformis Jacq. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13978_0
            locator: "SANBI/WFO archive Morphology row 12237; source identifier 13978.0; cited publication: Manning, JC; Goldblatt, P. 2012. Tecophilaeaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 255 - 255. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: He most common and widespread of the three species of sect. Trigella, Cyanella orchidiformis is recognized by its lanceolate leaves, 10-25 mm wide, and racemes of pink to mauve flowers, mostly darker or patterned toward the centre, with the anthers partially or almost wholly greyish or purple, and large, ovoid-ellipsoid fruits, 14-25 mm long. The three species are essentially parapatric or allopatric, although both C. cygnea and C. orchidiformis have been collected near Steinkopf. An exceptionally large-flowered variant with tepals 20 x 6-7 mm has been collected on the Gifberg Pass, growing in sandstone soil after fire and may be polyploid.Cyanella orchidiformis is closely allied to C. cygnea, with which it shares the distinctive large fruits, patterened perianth and coloured anthers, but from which it is distinguished by its generally larger flowers, with tepals mostly 10-13 mm long vs 8-10 mm long, and its unexceptional stamens. The upper filaments in C. orchidiformis are arcuate or weakly geniculate, without a bulbous base and not evidently filiform in the distal half, and the lower anthers are relatively large, 5-6 mm long. The style is very variable in length, mostly 5-10 mm long but occasionally up to 15 mm long. In contrast, C. cygnea has mostly smaller flowers, with tepals 8-10 mm long, and very distinctive stamens, with the upper filaments geniculately sigmoid and sharply narrowed and filiform in the distal half, and with much smaller lower anthers, 2.5-3.0 mm long, and a short style 3-4 mm long. The range of C. orchidiformis is largely to the south and east of C. cygnea but both species have been collected near Steinkopf.The large capsules readily distinguish C. orchidiformis from C. ramosissima, which has subglobose-ovoid fruits 8-10 mm long, but non fruiting specimens are separated by the combination of broader, lanceolate leaves, 10-30 mm vs 8-10 mm wide, and mostly shorter styles, 5-10 mm long vs 10-15 mm long. Occasional forms with longer styles are identified by their foliage and by their partially greyish or purple anthers.
