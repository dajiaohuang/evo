        claims:
          - text: Cormous geophyte, 15-25 cm. Leaves lanceolate, hairy. Flowers zygomorphic, white to pale blue to mauve with yellow markings, fragrant, inner bracts divided to base, ovary hairy.
            textZh: Babiana patersoniae L.Bolus 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 6709; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Recognised by a combination of zygomorphic flowers with a moderately long, slender perianth tube 20-30 mm long, dark blue, usually arrow-shaped anthers (sometimes linear) and a densely hairy ovary. The flowers are pale blue to mauve, sometimes largely white, with the lower lateral tepals partly cream-coloured to yellow. The floral bracts range from 12-18 mm in plants from the west to up to 30 mm long in the east where it may possibly be confused with long-tubed but acaulescent B. sambucina (section Teretifolieae) but B. patersoniae always has the inner bracts divided to the base. In the west, B. patersoniae may be confused with B. purpurea, which also has dark anthers and inner bracts divided to the base but a pink to purple perianth, and longer tepals relative to the tube, which is narrow below and only wider in the upper third, whereas the tube of B. patersoniae has a wider diameter and is gradually flared in the upper half. Confusion is also possible with B. fourcadei, which also has bracts divided to the base, but a smooth ovary, and is often a more robust plant, usually bearing 3 to 5 short lateral branches. The intensely fragrant flowers of B. fourcadei have white lower lateral tepals edged distally in pale blue, long slender style branches not so obviously expanded at the tips, and a generally larger flower with the dorsal tepal 25-30 mm long.
            textZh: SANBI 条目提供了 Babiana patersoniae L.Bolus 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 94986; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
