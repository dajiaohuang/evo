    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, 200-500 mm tall, branching in the upper axils, branches rotated in clockwise fashion. Leaves with overlapping sheaths, sword-shaped, spirally 2-ranked, arching outward. Flowers yellow with brown spots and margins, sweetly to putrid scented, tepal claws broad, forming a wide cup, nectaries prominent, anther lobes parallel. Capsule beaked.
            textZh: Ferraria schaeferi Dinter 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_14562_0
            locator: "SANBI/WFO archive Morphology row 33073; source identifier 14562.0; cited publication: Goldblatt, P; Manning, JC. 2013. Iridaceae. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 94 - 124. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Unlike the flowers of the related species, Ferraria crispa and F. foliosa, those of F. schaeferi sometimes have, at least to the human nose, a pleasant, sweet scent reminiscent of violets, but with a slightly sour undertone. The flowers otherwise resemble those F. crispa and F. foliosa, having widely spreading tepals, the broad claws forming a shallow cup, ± 8 mm deep and some 12 mm wide at the rim. The tepal claws bear large heart-shaped nectaries, while the limbs have a creamy pale yellow ground colour speckled with small dark brown spots, the same colour as the crisped margins. In vegetative form, F. schaeferi most closely resembles F. foliosa, which also has the leaves and branches arranged in a two-ranked spiral, and the leaf blades are similarly thick and leathery with a weakly defined central vein. In addition to the differently coloured perianth, the ovary and capsule have a pronounced beak up to 8 mm long. This readily separates F. schaeferi from F. foliosa. In its sandy habitat, plants spread vegetatively by long runners produced from the base of the stem that can extend below the ground a metre or more from the parent plant, each terminating in a corm.
            textZh: SANBI 条目提供了 Ferraria schaeferi Dinter 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 95224; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
