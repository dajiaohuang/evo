          title: Oenothera tetraptera Cav., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Perennial herb, sometimes suffrutescent, decumbent to ascending, with few simple or branched stems 1.5-5 dm. long, more or less strigulose and also with long spreading hairs; basal leaves oblanceolate or broader, 3-10 cm. long, 1-3 cm. wide, sinuate-pinnatifid, with several ovate-oblong lateral lobes and a larger terminal one, subglabrous to villous, with well developed petioles; cauline leaves reduced, 2-5 cm. long, mostly sinuate-pinnatifid; flowers vespertine, in axils of uppermost reduced leaves; floral tube commonly hirsute as well as strigose, ca. 1 cm. long, puberulent within at base; sepals commonly reddish, 2-3.5 cm. long, coherent in anthesis, at least in pairs, with minute free tips in bud; petals white, rose in age, 2-3.5 cm. long, broadly obovate; stamens subequal, one-half to two- thirds the length of the petals; filaments 1-1.5 cm. long; capsule proper obovoid, 1-1.5 cm. long, 0.6-0.8 cm. thick, hirsute, especially on veins and wings, the latter 2-3 mm. wide, capsule narrowed into a basal ribbed hollow sterile part 0.5-2.5 cm. long; seed light brown, obovoid, ca. 1.3 mm. long.
          originalLanguage: en
          sourceField: general
