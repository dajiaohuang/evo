    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Annual or biennial herbs, simple or branched, up to 65 cm tall, but often not exceeding 15 cm. Leaves up to 1.8 cm long and equally broad, close-set or far apart, the lower ones sometimes subrosulate, ovate to ovate-orbicular, thin or slightly leathery, obtuse or subacute, sometimes apiculate, sessile or shortly petiolate, the lower few pairs sometimes gradually cuneate at the base. Inflorescence lax with long branches, a many-flowered corymbose panicle or reduced to a few cymes; bracts ovate to lanceolate, acute. Calyx of 5 segments, each 5-9 mm long, 1-2.5 ram broad, lanceolate to more or less oblong, acuminate or acute, mucronate, the sides hyaline, joined for up to 1.5 mm, with a keelwing 0.75-1.5 mm broad, broadest about the middle or at the base and then almost semi-cordate. Corolla yellow; tube 5-10 mm long; lobes 6-12 mm long, 2.5-5 mm broad, elliptic-lanceolate to ovate-lanceolate, rarely somewhat obovate, usually rounded and apiculate, sometimes acute, often clawed. Filaments usually 0.75-1.5 mm long, rarely shorter and occasionally 2 mm, inserted in or shortly below the corolla-sinuses; anthers 1.75-7 mm long, mostly with a small apical gland, but occasionally apparently eglandular, sometimes also with 2 minute basal glands. Style and stigma 5-10 mm long with a stigmatic swelling near the base or well below the middle; stigma capitate or clavate, 2-lobed.
