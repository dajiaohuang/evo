    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Among landraces in the study's red-ripe group, P44, identified as 'Tamatta groga de appiccai', showed the highest firmness; the reported range declined from 1.64 N/mm at harvest (T0) to 0.54 N/mm after 30 days (T30) of refrigerated storage. This is a postharvest fruit-trait result for one cultivated landrace, not a species-wide morphology estimate.
            sourceIds:
              - posadinu2023
            locator: Abstract paragraph 3; Results > Fruit texture; Figure 5 caption identifying P44 as Tamàtta groga de appiccai.
            placeTimeScope: Eight Sardinian accessions (six landraces and two commercial varieties) grown in greenhouse trials at Oristano, Sardinia, in autumn-winter 2017–2018 and 2018–2019; fruit firmness was measured at harvest and through 30 days of refrigerated storage at 13°C.
            lifeStatus: Cultivated crop plants; no wild plants were included.
            originalLanguage: en
