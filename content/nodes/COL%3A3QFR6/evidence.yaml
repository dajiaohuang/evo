    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, 23-75 cm, with several short, wiry branchlets. Leaves 3, lower 2 sword-shaped, upper leaf sheathing. Flowers 1-3 per branch, white to pale blue-mauve with yellow cup (red-purple or mauve with white cup elsewhere), tube narrowly funnel-shaped, 7-10 mm long, filaments exserted 2-4 mm.
            textZh: Ixia ramulosa (G.J.Lewis) Goldblatt & J.C.Manning 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 7157; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Ixia ramulosa has the narrowly funnel-shaped perianth tube and moderately to well-exserted anthers of its allies but is distinguished by the perianth tube 7-9(-10) mm long and several, short, wiry, lateral branchlets each bearing 1 or 2 or occasionally 3 flowers. The species normally has just three leaves, the two lowermost with well-developed blades, and the upper one largely to entirely sheathing the stem. Ixia ramulosa is best known from central Namaqualand in the vicinity of Kamieskroon and nearby Grootvlei and Skilpad farms where plants have brilliant, dark purple (also described as magenta) flowers with a white throat. Plants from higher elevations in the Kamiesberg east of Kamieskroon have pink or blue-mauve flowers with a yellow throat and also differ in perianth tube length, 7-8 mm long vs. 8-9(-10) mm for purple-flowered plants from lower elevations. Their later flowering, in October to early November, may be explained by the higher elevation. Among these Kamiesberg populations some consist of particularly tall, slender plants up to 650 mm high with long narrow leaves 5-6 mm wide, very different from the short-leaved populations and possibly explained by their marshy habitat. Alternatively these plants may represent a separate taxon. Provisionally, plants from the Bokkeveld Mtns to the south are included in Ixia ramulosa. Like typical I. ramulosa, these plants have stems with several short, filiform, few-flowered lateral branches and bracts sometimes flushed rust-brown distally, but a perianth tube 8-9 mm long and filaments ± 8 mm long (longer than in typical I. ramulosa), exserted ± 5 mm from the tube. These southern populations have branchlets with one to three flowers and white or pale blue-mauve flowers with a yellow cup and may be exceptionally robust, up to 750 mm high.
            textZh: SANBI 条目提供了 Ixia ramulosa (G.J.Lewis) Goldblatt & J.C.Manning 的鉴别特征。
