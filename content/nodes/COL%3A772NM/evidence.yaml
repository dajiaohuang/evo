          publishedAt: undated
          originalSourceText: A comparatively small, repent herb, epiphytic or on rocks; stem quadrangular, 1-2 mm. thick, minutely hirtellous to glabrate; leaves opposite, or occasionally roots replacing one of the leaves, rarely ternate, elliptic, obovate, or orbicular, 10-22 mm. wide X 12-30 mm. long, apex obtuse or very slightly pointed, base acute to rounded, palmately 3-nerved, nerves impressed above and more or less salient beneath, drying coriaceous and subopaque, sparsely hirtellous or glabrate, more or less variegated when living; petiole 2-4 mm. long, hirtellous; spikes axillary or occasionally terminal, 2-3 cm. long; peduncles 2-4 cm. long, 2-bracteate near the middle, hirtellous; floral bracts round-peltate, glandular-dotted; fruit ovoid, stigma at the apex of a short, thick style.
