    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, mostly 50-100 mm tall, corm round at base, with curved acuminate teeth. Leaves 3-5, with 4 grooves, narrowly 4-grooved. Flowers dark red with black blotches at the edge of a creamy cup, filaments joined in a column; outer bracts keeled with narrow, dry, usually brown margins, inner bract 2-keeled, with dry brown margins; fruiting peduncles curved.
            textZh: Romulea monadelpha (Sweet ex Steud.) Baker 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_14562_0
            locator: "SANBI/WFO archive Morphology row 33382; source identifier 14562.0; cited publication: Goldblatt, P; Manning, JC. 2013. Iridaceae. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 94 - 124. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Very closely related to R. sabulosa. It is interfertile with R. sabulosa, the F1 hybrids resembling the latter in their free filaments (De Vos, I.e. 1970). Probably some specimens, distinguished as R. sabulosa, are hybrids.
            textZh: SANBI 条目提供了 Romulea monadelpha (Sweet ex Steud.) Baker 的鉴别特征。
            sourceIds:
              - sanbi_12511_0
            locator: "SANBI/WFO archive Diagnostic row 51681; source identifier 12511.0; cited publication: De Vos, MP. 1983. Syringodea, Romulea, Fl. S. Africa 7(2,2): 1 - 76. Botanical Research Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: The type and all subsequent collections from the Bokkeveld Plateau are diagnosed by the filaments fused into a stout, smooth, cylindric column, but collections from the Roggeveld have oblong, closely appressed but free filaments bearded basally. These populations may be confused with R. sabulosa, but that species has the filaments triangular in section and distinctly tapered above, and ± terete peduncles.
            textZh: SANBI 条目提供了 Romulea monadelpha (Sweet ex Steud.) Baker 的鉴别特征。
            sourceIds:
