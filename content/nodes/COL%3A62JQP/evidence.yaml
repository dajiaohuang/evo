            en: Black-uakari surveys and specimen comparisons using morphology and molecular data; describes C. ayresi from the Rio Aracá basin.
            zh: 支持黑秃乌卡里的野外调查、形态与分子标本比较；描述来自 Rio Aracá 流域的 C. ayresi。
