            en: Review of published and unpublished habitat records under the former trinomial C. calvus ucayalii; most recorded localities were terra firme or mixed habitat.
            zh: 依据旧三名法 C. calvus ucayalii 汇总已发表和未发表的栖地记录；多数记录地点属于 terra firme 或混合栖地。
