        usage:
          scope:
            en: Systematic comparison of known Cacajao taxa using cytochrome-b sequences, including samples historically assigned to C. calvus subspecies; it is taxonomic evidence, not a field census.
            zh: 以细胞色素 b 序列比较已知 Cacajao 分类单元，包括历史上归入 C. calvus 亚种的样本；该研究提供分类证据，不是野外普查。
