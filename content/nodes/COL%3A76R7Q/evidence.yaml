          title: Peperomia insueta Trel., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: A rather small, terrestrial, acaulescent herb; leaves arising from a short, thick- ened, rhizome-like base, elliptic, apex obtuse, base obtuse, cordulate, or subacute, 2-4 cm. wide X 4-7.5 cm. long, moderately to sparsely crisp-pubescent above, moderately crisp-pubescent beneath, more densely so along the nerves, scarcely ciliate, palmately 5-nerved, or large leaves with an additional pair of slender nerves at the base, the innermost pair of nerves appearing to coalesce with the midrib within the lowermost 5 mm., the midrib and lateral nerves branched upward, drying darker above, paler beneath, membranous, translucent, glandular-dotted beneath; petiole 3-8 cm. long, crisp-pubescent; spikes 1.5 mm. thick X 6-12 cm. long, rather closely flowered; peduncle about equilong, crisp-pubescent; rachis pubescent at the base and with a few, scattered hairs above; bracts round-peltate, glandular- dotted; fruit about 0.6 mm. long, globose, stigma apical or at most only slightly subapical.
