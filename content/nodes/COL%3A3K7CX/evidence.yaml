        claims:
          - text: Herbaceous, probably biennial, up to 1.2 m tall, aromatic, stem forking, often low down, into long virgate branches, glandular-pubescent, loosely and thinly white-woolly at first, persisting on the upper parts, leafy. Leaves mostly 30-80 x 7-20 mm, smaller on the inflorescence branches, reduced near the heads, linear-oblong or oblong, apex acute, base broad, half-clasping, both surfaces glandular-pubescent, margins and sometimes the midline white-woolly. Heads heterogamous, depressed-globose, ±12-14 mm long, (20-)25-30 mm across the radiating bracts, solitary at the tips of long (mostly 50-300 mm) leafy branches corymbose-paniculately arranged. Involucral bracts in ±9 series, graded, imbricate, inner much exceeding the flowers, glossy, bright yellow. Receptacle shortly honeycombed. Flowers ±1000-1400, 100-340 female, 700-1200 homogamous. Achenes 1 mm long, barrel-shaped, glabrous. Pappus bristles many, equalling corolla, tips barbellate, bases with patent cilia, cohering or not.
            sourceIds:
              - sanbi_9268_0
            locator: "SANBI/WFO archive Morphology row 49607; source 9268.0; publication: Hilliard, OM. 1983. Gnaphaliinae (first part): Facelis - Edmondia, Fl. S. Africa 33(7,2): 1 - 317. Botanical Research Institute, Department Agriculture, Pretoria. [http://www.biodiversitylibrary.org/item/209547#page/5/mode/1up]. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Much confused with H. setosum but distinguished by its differently shaped leaves, persistently white-woolly ultimate branches and leaves much reduced near the heads.
