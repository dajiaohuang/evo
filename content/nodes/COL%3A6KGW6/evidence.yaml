            locator: "SANBI/WFO archive Morphology row 98141; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Recognised by the reduced foliage, the flowering stem bearing two or three glabrous leaves with reduced or vestigial blades, and the erect spike of pale mauve, strongly bilabiate flowers, the lower tepals clawed with oblong blades and usually slightly shorter than the median, the nectar guides transverse median chevrons of pale colour edged with purple. The species is closely allied to Gladiolus atropurpureus from tropical Africa but pale-flowered forms of that species can be distinguished from G. oatesii by their broader, spade-shaped lower tepals, the laterals ± as long as or slightly longer than the median and with nectar guides a solid, median blotch, and the shorter filaments 6-8 mm long.
