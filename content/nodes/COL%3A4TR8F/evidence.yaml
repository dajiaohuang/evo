          - text: Perennial, dwarf shrublet, up to 0.25 m high, stems decumbent forming loose clumps. Leaves triquetrous, perfoliate, shortly united into a sheath around stem, glaucous, keel with 1 or 2 teeth, apex recurved, toothed, teeth prominent on younger leaves but becoming less so with age. Flowers solitary, purple. Flowering time Nov.-Mar. Capsules not known.
