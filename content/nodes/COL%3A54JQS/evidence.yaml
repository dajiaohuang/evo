        usage:
          title: Tagetes filifolia Lag., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Bushy, anise-scented, annual herbs 10-30 cm tall; stems glabrous, slender, green to purplish, striate, much branched. Leaves opposite, or alternate above, short-petioled, pinnately dissected, 1-2 cm long, the lobes linear, 1-8 mm long, 0.2-0.5 mm wide, mucronate to aristate, the lowermost usually reduced to slender bristly cilia, marginally scabrid to glabrescent, densely punctate on the under- surface with tiny round translucent oil glands. Inflorescence of leafy bracted cymes; peduncles slender, 1-20 mm long. Heads radiate or discoid; involucre ellipsoid to cylindric, 2-3 mm diam., the bracts 5, linear to narrowly elliptic, 6-7 mm long, marginally connate nearly to the abruptly short-aristate tips, several- nerved, more-or-less indurate-keeled below, glabrous, densely punctate in irregular lines with tiny round, translucent oil glands; receptacle short-conic, pitted; ray florets 0-2, inconspicuous, white to pale yellow, the tube slender, glabrous or minutely puberulent, 1-2 mm long, the ligules ovate, ca. 1 mm long; disc florets 5-10, the corollas pale yellow, slender, 3-4 mm long, glabrous, the lobes slender, 0.5-1 mm long, the anthers 0.5 mm long, tapering to short, acute appendages, the style branches ca. 0.5 mm long, included or scarcely exserted. Achenes 3-4.5 mm long, black or brown, linear to narrowly turbinate, strigillose; carpopodium short, knoblike; pappus of 2-3 stiff, scale-based bristles 3-4 mm long and 2 lacerate-margined scales 1-2 mm long. Chromosome number n =12
          originalLanguage: en
          sourceField: general
