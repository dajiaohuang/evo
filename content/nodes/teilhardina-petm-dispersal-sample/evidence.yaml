  claims:
    - subjectId: event:teilhardina-petm-dispersal-sample
      claimKind: scientific
      claimType: biogeography
      statement: Correlated PETM sections and separately catalogued Teilhardina dental samples support an Asia-to-Europe-to-North-America appearance sequence within a short earliest-Eocene interval.
      confidence: medium
      confidenceRationale: Medium confidence reflects multiple stratigraphic and morphological comparisons while retaining sensitivity to species assignments, temporal correlation and unsampled localities.
      referenceLinks:
        - referenceId: smith-2006-teilhardina
          relation: supports
          pages: 11223–11227
          figure: Figures 1–3; Supporting Tables
          quoteLocator: "Results: relative chronology and morphological sequence across PETM carbon-isotope records"
  claim-rationales.zh:
    - 中等置信度来自多套地层和形态比较，同时保留物种归属、时间对比及未采样地点带来的敏感性。
  claim-statements.zh:
    - 对比校准的古新世—始新世界线极热事件剖面与分别编目的 Teilhardina 牙齿样本，支持其在一个很短的始新世最早期区间内依次出现于亚洲、欧洲和北美洲。
