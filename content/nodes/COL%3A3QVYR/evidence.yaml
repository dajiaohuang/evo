    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Shrub 0.5-1.0 m high, suckering from base of stem below ground. Leaves glabrous to pilose, ovate-oblong or sometimes ovate or obovate, 36-110 x 8-31 mm, apex obtuse to shallowly emarginate, base cuneate to decurrent; petiole 3-14 mm long. Inflorescence of stout-peduncled axillary cymes, flowers paired at lowest node, solitary along rest of inflorescence. Bract 1, with an empty bract on opposite side of axis, with glandular and non-glandular hairs. Bracteoles 2, reduced, subulate to ovate, thick, ±2 mm long. Peduncles 1 or 2 per node, with 5 or 6 flowers crowded towards end, these sessile or shortly pedicellate. Calyx with glandular and eglandular hairs. Corolla with upper lip hooded, 11-15 mm long, lower lip reflexed, throat with 2 shallow pouches, white or cream, with or without mauve markings. Pollen 3-colporate, 34-58 µm long, sexine with entire margocolpus. Capsule 1-seeded, clavate, up to 32 mm long, with long stipe, hard in texture, densely pubescent. Seeds 1 or 2, smooth.
