          title: Oldenlandia lancifolia (Schumach.) DC., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Herbs, the stems slender, weak, glabrous to puberulent, smooth, the nodes well spaced, to 4.5 cm apart. Leaves sessile or subsessile, narrowly elliptic, often slightly inequilateral and curved, 1.5-5.5 cm long, 0.2-0.7 cm wide, attenuate acute at the apex and the base, the costa immersed or scarcely prominulous above, prominulous beneath, the lateral veins ca. 4, slender, strongly arcuate ascending, evanescent, membranous, smooth, minutely and sparsely puberulent above and beneath, the hairs strigose; stipules subulate and bifid, ca. 3 mm long, reflexed. Flowers not seen. Fruits subrotund, didymous, to 3 mm long, glabrous, the raphides numerous, the calycine cup short, the teeth 4, well spaced, acute, to 0.3 mm long; seeds numerous, ca. 0.2 mm long.
