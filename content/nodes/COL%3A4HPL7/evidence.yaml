    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Succulent perennial herb, 50-80 mm tall. Flowers in fascicles of 2 or 3. Corolla lobes 15-20 mm long. Outer corona of 5 short lobes, inner coronal lobes linear-terete, several times as long as anthers. Flowers greyish green mottled with purplish outside, rich deep blackish crimson inside; corona dull orange-yellow.
            sourceIds:
              - sanbi_11118_0
            locator: "SANBI/WFO archive Morphology row 917; source 11118.0; publication: Herman, PPJ; Retief, E. 1997. Plants of the northern provinces of South Africa: Keys and diagnostic characters. Strelitzia 6: 1 - 681. National Botanical Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Vegetatively identical, the two former species of Huerniopsis cannot be separated until just before the flowers open. The buds of P. atrosanguineus become quite a bit larger and have a distinctly narrower tube at the base, which becomes obvious shortly before the flower opens. Flowers in P. atrosanguineus are the most short-lived amongst the stapeliads. In cultivation in Cape Town they have generally opened in the afternoon between 4 and 5 and closed again during the course of the following morning at between 7 and 9, remaining open for a total of 18 hours or less. As usual, there are exceptions and one flower remained open for over of 30 hours, although all others produced by the same plant lasted for the customary 16-18 hours. They have a strong, unpleasant odour that is emitted mainly during the first couple of hours that they are open. At 40-45 mm across, the flowers here are markedly larger than those of P. decipiens and are the largest and most spectacular in Piaranthus. The lobes spread out or may sometimes be slightly reflexed, so the inside is nearly flat. Below the lobes there is a broad but shallow pentagonal tube in the centre. The mouth of this tube is much emphasised and slightly constricted by five inwardly spreading swellings below the sinuses of the lobes. As in P. decipiens, the exterior of the bud is boldly striped with purple. The inside of the corolla is a deep, rich and velvety maroon or brown that sometimes becomes paler towards the tips of the lobes. In some cases the lobes have a distinctly pale apical patch. The transverse mottling that is sometimes found in P. decipiens is very rare here. The corona of P. atrosanguineus is more ornate than that of P. decipiens. The pale orange outer lobes are small and become covered with sweat-like drops of nectar. They consist of short, spreading structures which are often rather papillate on the margins and are raised up and sometimes even pressed together to form a narrow channel. The narrowness of this channel tends to hold nectar produced by the guide-rails in a pool around and below the rails by adhesion to the sides of the channel. So much of this nectar is produced in this species that it has to be drained off if one wishes to gain access to the guide-rails to pollinate the flower. This excess nectar would presumably be consumed by insects that visit the flower and would not present a problem in nature. The relatively narrow inner lobes are adpressed to the anthers and then rise above them in a column, afterwards diverging and sometimes spreading and even occasionally becoming spirally twisted. Towards the base they are pale orange like the outer lobes, but usually become whitish towards their tips. They are also covered with drops of nectar but mainly towards their bases.
