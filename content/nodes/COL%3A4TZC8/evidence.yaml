            zh: ICMBio 2025 巴西国家风险评估资料：用于核对 S. ursulus 与旧名 S. ursula 的对应、分布、栖地损失推断及国家近危类别；不是全分布区的同期种群普查。
            en: ICMBio's 2025 Brazilian national risk assessment; used for the S. ursulus/S. ursula name bridge, range, habitat-loss inference, and national Near Threatened category, not a synchronized range-wide population census.
