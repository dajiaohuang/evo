          - title
          - url
          - scope
        metadataVariant: 0
        usage:
          scope:
            zh: 2026 年东部巴西亚马孙自由活动狨猴的两轮肠道寄生虫采样；17 次捕获事件中 13 次检出寄生物、10 次检出 Prosthenorchis sp.，未报告临床异常。事件比例不代表种群趋势或全分布区感染率。
            en: Two enteroparasite sampling periods in free-ranging tamarins from the eastern Brazilian Amazon in 2026; parasites were detected in 13 of 17 capture events and Prosthenorchis sp. in 10, with no clinical abnormalities reported. Event proportions do not establish a population trend or range-wide infection rate.
