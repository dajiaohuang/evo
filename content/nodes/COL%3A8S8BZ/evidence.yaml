          originalSourceText: A shrub or small tree, 1-5 m. tall; flowering internodes rather slender and elongated, densely brown-tomentose-pubescent; leaves pentagonally ovate, apex acute, base inequilaterally oblique, rather shallowly and openly cordate, 10-16 cm. wide X 17-28 cm. long, pinnately nerved from the lower half, the nerves 5-6 on each side, salient beneath, with rather prominent cross-connecting and anastomosing nervules, glabrous above or the midrib sparsely pubescent near the base, hirsute beneath, the nerves densely so, drying coriaceous, opaque; petiole 3-5 cm. long, vaginate-winged to the blade, densely tomentose-pubescent; spikes 5-8 mm. thick X 25 cm. long; peduncle 2.5-4 cm. long, densely hairy; bracts rounded- or tri- angular-subpeltate; pedicel brown-villous; fruit globose, stigmas sessile or on a short style (?).
