    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Kew's species profile describes Asian rice as a grass that can exceed 1 m in height and reach 5 m in deep water; its upright stem has joint-like nodes bearing leaves, and its grains grow on arching branch-like spikes.
            textZh: 邱园物种简介将亚洲栽培稻描述为禾草，植株可高于 1 米，深水条件下茎可达 5 米；直立茎具节状节点，每节生叶，谷粒生于拱垂的枝状穗上。
            sourceIds:
              - kewflora
            locator: POWO page, Kew Species Profiles section 'Description'
            placeTimeScope: Species-profile description; the 5 m figure is explicitly associated with deep-water growth and is not a typical height estimate.
            lifeStatus: Cultivated Asian rice profile; wild Oryza species are outside this claim.
        gaps:
          - Cultivar, developmental, and environment-associated morphological variation have not been systematically assessed.
      lifeHistory:
        status: partially-supported
        claims:
          - text: POWO's general-information account classifies O. sativa as an annual or helophyte. This short account does not specify cultivar, site, or growth-cycle conditions.
            textZh: POWO 的一般信息将 O. sativa 记为一年生或沼生植物；该简要记录未细分品种、地点或生长周期条件。
            sourceIds:
              - kewflora
            locator: POWO page, General information, introductory species summary
            placeTimeScope: Live POWO account accessed 2026-09-24; no specific cultivation trial or sampling period is given.
            lifeStatus: Cultigen account; this classification is not extended to wild Oryza relatives.
        gaps:
          - Germination, flowering, seed maturation, perenniality under ratooning, and cultivar-specific life cycles remain unassessed.
      ecology:
        status: partially-supported
        claims:
          - text: Kew's profile says O. sativa is commonly found in river valleys and other water-abundant areas, while also noting cultivation in some dryland areas.
            textZh: 邱园简介指出，O. sativa 常见于河谷及其他水源充足地区，同时也记载部分地区采用旱地栽培。
            sourceIds:
              - kewflora
            locator: POWO page, Kew Species Profiles section 'Ecology'
            placeTimeScope: Kew species-profile summary; it does not quantify habitat prevalence or cover all regional cultivation systems.
            lifeStatus: Cultivated rice; no wild ecological niche is inferred.
        gaps:
          - Cultivation ecology, interactions, and environmental variation across regions have not been systematically reviewed.
      evolution:
        status: partially-supported
        claims:
          - text: Huang et al. (2012) analyzed genomes from 1,083 O. sativa accessions, 446 O. rufipogon accessions, and 15 outgroup accessions. Their analyses inferred that japonica was first domesticated from a particular O. rufipogon population near the middle Pearl River in southern China, and that indica later arose through crosses involving japonica and local wild rice. This is the study's model-based conclusion and is not presented as settled consensus.
            textZh: Huang 等（2012）分析了 1,083 份 O. sativa、446 份 O. rufipogon 及 15 份外群材料的基因组。作者据此推断，粳稻最初由中国南部珠江中游附近的一个特定 O. rufipogon 种群驯化形成，随后籼稻由粳稻与当地野生稻杂交形成。此处保留为该研究的模型推断，不表述为已无争议的共识。
            sourceIds:
              - huang2012
            locator: Abstract; Results, genome-wide patterns and domestication sweeps; Methods, accession sampling
            placeTimeScope: Study published 2012; inference is based on its sampled accessions and genomic analysis.
            lifeStatus: Cultivated O. sativa populations are compared with wild O. rufipogon; the wild source species is not conflated with the dossier taxon.
        gaps:
          - Alternative domestication histories and later genome-wide evidence have not been systematically compared.
      distribution:
        status: partially-supported
        claims:
          - text: A 2015 genebank study analyzed 107 aromatic and quality Oryza sativa accessions. Passport information placed the sampled accessions in Assam (54), Nagaland (21), Manipur (16), Mizoram (9), Sikkim (5), and Arunachal Pradesh (2), in Northeast India. These are origins recorded for a selected cultivated germplasm sample, not a complete or current range map for rice.
            textZh: 一项 2015 年的种质库研究分析了 107 份香型及优质 Oryza sativa 种质材料。护照信息将这些样本的来源地记为印度东北部的阿萨姆邦（54 份）、那加兰邦（21 份）、曼尼普尔邦（16 份）、米佐拉姆邦（9 份）、锡金邦（5 份）和阿鲁纳恰尔邦（2 份）。这些是精选栽培种质样本的来源记录，并非水稻完整或当前分布图。
            originalLanguage: en
            sourceIds:
              - roy2015neindiarice
            locator: Materials and Methods, Plant materials; Fig. 1 and accompanying caption.
            placeTimeScope: The article was published 2015-06-12. The 107 accessions were sampled from the National Genebank, NBPGR using characterization and passport data; original collection dates are not reported in the cited methods.
            lifeStatus: Cultivated aromatic and quality landrace accessions held ex situ in the National Genebank. The study does not report wild O. sativa occurrences; its O. rufipogon comparisons are outside this claim.
        gaps:
          - The article documents selected germplasm origins in six Northeast Indian states, not the complete present-day cultivated range, wild distribution, abundance, or geographic coverage of all Oryza sativa groups.
      fossil:
        status: not-assessed
      conservation:
        status: not-assessed
