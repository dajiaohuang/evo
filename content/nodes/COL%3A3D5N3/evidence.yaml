        claims:
          - text: Densely leafy shrub to 1 m. Leaves needle-like, spreading to upcurved. Flower heads radiate, clustered at branch tips on filiform peduncles, bracts free.
            sourceIds:
              - sanbi_14144_0
            locator: "SANBI/WFO archive Morphology row 10387; source 14144.0; publication: Manning, JC; Goldblatt, P. 2012. Asteraceae: Euryops (Cass.) Cass. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 372 - 375. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: E. erectus is an easily recognized species on account of the short curved leaves and the free involucral bracts. The latter character led Compton to propose the new genus Lysichlamys, comprising two species with L. erecta as the type. This species is certainly closely related to E. rehmannii, and I have interpreted a few specimens from the Witteberg as hybrids between these two species. It should be mentioned that two collections of E. erectus were found to have rather poor pollen without showing signs of hybridity (Esterhuysen 24907 and Wall s.n., with 32-67% perfect pollen grains). In spite of this they have formed well-developed achenes.
