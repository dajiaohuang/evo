        usage:
          title: Calliandra magdalenae (Bertero ex DC.) Benth., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Tree to 10 m. tall, the branchlets somewhat ascending-pubescent when young, becoming glabrous in age. Leaves moderate, bipinnate, the pinnae 1 pair, the leaflets several (usually 10-20) per pinna; petiole short, about 1 cm. long, terete, tomentulose, eglandular, bearing terminally an apicule from the lower side; pin- nular rachis 5-9 cm. long, ridged and tomentose above; leaflets linear-ovate or linear-lanceolate to linear-oblong, mostly about 1 cm. long and 3 mm. wide, broadly acute or sometimes obtuse apically and minutely mucronulate, obliquely truncate basally, glabrous above and below, lustrous above, often ciliate, the costa slightly excentric, 1-2 minor veins palmate from the base, secondary veins promi- nently reticulate; stipules lanceolate, 3-6 mm. long, striate, subpersistent. In- florescence of axillary, pedunculate heads; peduncles about equalling petioles, puberulent; floral bracts lanceolate, quite small, persistent. Flowers rose-red, several in dense globular heads; calyx funnelform-campanulate, about 2 mm. long, glabrous, striate; corolla funnelform, 5-7 mm. long, glabrous, the lobes prominent; stamens in age 2.5 or more cm. long, the staminal tube about equalling the corolla. Legume linear-oblong, reported up to 14 cm. long and about 1 cm. wide, pubescent when young, said to be (erroneously?) glabrous at maturity.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 5477
