        claims:
          - text: Terrestrial herb, up to 0.6 m high. Petals obovate-oblong, truncate. Sepals 5.0-7.5 mm long, dorsal sepal galeate with a hooked spur. Lip linear to narrowly elliptic. Flowers purple.
            textZh: Disa hircicornis Rchb.f. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_11118_0
            locator: "SANBI/WFO archive Morphology row 1732; source identifier 11118.0; cited publication: Herman, PPJ; Retief, E. 1997. Plants of the northern provinces of South Africa: Keys and diagnostic characters. Strelitzia 6: 1 - 681. National Botanical Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: This species is highly variable in its colour, ranging from a deep plum-purple to almost red. It is sometimes difficult to distinguish from Disa versicolor, although the shape and orientation of the petals and the degree of spur curvature will separate most collections. In addition, the sepals in D. versicolor turn brown at anthesis, while those of D. hircicomis do not.
            textZh: SANBI 条目提供了 Disa hircicornis Rchb.f. 的鉴别特征。
            sourceIds:
