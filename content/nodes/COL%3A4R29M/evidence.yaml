        usage:
          title: Quassia amara L., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Slender shrubs or small trees, 2-8 m high, the bark exfoliating in small flakes; branchlets reddish, angled. Leaves odd-pinnate, 21-31 cm long and 9-24 cm wide; petiole and rachis oblanceolate-winged, the wing to 15 mm wide apically, rarely also slightly auriculate; leaflets (3-)5(-7), opposite, obovate to oblanceolate, abruptly acuminate apically, cuneate basally, chartaceous, sessile, 4-22.5 cm long and 16-75 mm wide, the terminal usually largest. Racemes axillary or sometimes terminal or rarely cauliflorous, rarely paniculate basally, the branches red, minutely puberulent, 6.5-28 cm long. Flowers showy, the buds conical, the pedicels red, minutely puberulent, articulate below the apex, 5-30 mm long, subtended by a pubescent lanceolate bract ca. 2 mm long; sepals 5, pink to red, triangular, ciliate, ca. 1.5 mm long and wide; petals 5, pink to bright red, white within, lanceolate, pubescent basally within, 3-4 cm long and 5-6 mm wide, not spreading at anthesis; stamens 10, exserted, 3.5-4 cm long, the filaments filiform, appendaged basally, the appendages pubescent, coherent; intrastaminal disc conspicuous, 10- lobed, enlarging and becoming red in fruit; carpels 5, ovoid, free below, but con- nate above to form the style, the style as long as or longer than the stamens, to 5 cm long, deciduous, the stigma simple or slightly lobed. Drupes 1-S per flower, oblong, stalked, with a medial ridge, veined, glabrous, green to reddish, becoming dark red at maturity, ca. 15 mm long and 8 mm wide, forming a star-shaped cluster spreading from the broad red disc.
          originalLanguage: en
          sourceField: general
