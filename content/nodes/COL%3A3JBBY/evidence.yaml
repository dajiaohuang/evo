          title: Halenia euryphylla C.K.Allen, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Herb, perennial (?), to ca. 50 cm tall; stems simply branched, procumbent, terete, faintly striate. Leaves elliptic to ovate-elliptic; the petiole to 2.5 cm long, often evanescent into the basal portion of the lamina, flattened; the lamina 2-6 cm long and 1-2.9 cm broad, conspicuously apiculate, the apiculum 1-1.5 mm long, basally attenuate, membranous, trinervate, the veins conspicuously anas- tomosing. Inflorescences terminal, rarely axillary, the cymes lax, few-flowered; the pedicels 1-2 cm long, spreading to subascending. Flotwers greenish-yellow; calyx lobes narrowly obovate, apiculate at the apex, 7-10 mm long and 2-2.5 mm broad, trinervate, minutely papillose; corolla lobes obovate to elliptic, obtuse and erose at the apex, 9-11 mm long and 4-5 mm broad near the apex, the spur 5-8 mm long, spreading to slightly descending, 0.5-1 mm in diameter; stamens 4.4-5.2 mm long, the filaments 3-3.5 mm long, linear, flattened, the anthers 1.4-1.7 mm long, the thecae free and slightly spreading at the base; pistil 5-6 mm long, the ovary ellipsoid, 3-4 mm long, the style evanescent from the ovary, the stigmatic lobes 0.5 mm long, truncate at the apex. Capsules ellipsoid, 1.2-1.5 cm long, ? lustrous, the style and stigma persisting; seeds ellipsoid, 1-1.3 mm long, lustrous, smooth, light tan.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 5977
