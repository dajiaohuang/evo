        claims:
          - text: Compact, succulent, dwarf shrub, becoming caespitose with age, internodes enclosed. Leaves 6-8 to a branch, fat, elongate-trigonous, with rounded keel and margins, epidermis smooth, 25-40 mm long, < 15 mm diam., greyish blue. Flowers solitary, bracteolate, opening in late afternoon, petals magenta or white, up to 35 mm diam., stamens in an erect central cone or column with age. Fruit flat-topped, closing body absent, 8-10-locular.
