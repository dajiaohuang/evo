    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Like H. alstonii but plant up to 0.5 m tall, stems brown-green with weak spines, flowers 1-3 per cluster, corolla rotate, 11-13 mm diam., inside greenish yellow, without tube, lobes 2.5-4 x 3.5-6 mm, outer corona lobes broadly spreading.
            sourceIds:
              - sanbi_14722_0
            locator: "SANBI/WFO archive Morphology row 34086; source 14722.0; publication: Bruyns, PV. 2013. Apocynaceae. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 248 - 264. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: The stems of D. parviflora are, at least when turgid, almost completely round and without angles. In seedlings the first few stems are very clearly four-angled and only later does the almost spherical shape without clear angles develop. When the stems are plump one cannot distinguish individual tubercles except for their tiny leaf-rudiments which project straight out of the stem. This situation is quite different to that in any other Duvalia but is remarkably similar to what one encounters in some of the western forms of Piaranthus geminatus and it is even possible occasionally to confuse the two when they are not in flower. The flowers of D. parviflora are also amongst the most distinctive in the genus. The corolla is small and often only 12 mm across. Inside it is generally cream or greenish in the centre on the annulus and on the lower half of the lobes, with this colour changing to greenish or brown towards the tips of the lobes. The corolla lobes vary from tightly to loosely folded along their length so that they are sometimes narrow and sometimes rather broader. They lack marginal cilia entirely. The annulus is fairly small and is only slightly raised above the centre, though it is usually constricted below the rim. Both the inner and the outer coronas are pale yellow, matching the colour of the annulus closely, though in fact they are very slightly darker than the annulus. The colour of the corona usually contrasts strongly with the reddish brown of the guide-rails.
