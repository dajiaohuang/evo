        claims:
          - text: Plants 255-800 mm tall, glabrous except for the lip and the subterranean parts; tubers ovoid, 30-35 mm in diameter; leaf solitary, prostrate, reniform to orbicular, 90-170 mm long and 110-190 mm wide, developing after flowering, apiculate, 11-veined, glabrous, heavily plicate, petiole to 15 mm. Inflorescences laxly 3-8-flowered, scape erect; bracts filiform to lanceolate, 14-35 x 1-4.2 mm. Flowers yellowish green tinged with brown, lip with reddish veins. Sepals and petals subequal, ligulate-lanceolate, acute. Median sepal 28-40 x 4-6 mm; lateral sepals 24-37 x 4-5.5 mm. Petals33 x 4.5-6 mm. Lip ovate, 24-38 x 17.5-26 mm, very obscurely 3-lobed, blade with 2 fleshy ridges; midlobe ovate and subacute; side lobes rounded, erect, enclosing the gynostemium. Gynostemium glabrous, curved, clavate, 13.5-19 mm.
