        claims:
          - text: Grows on very thin black sandy soil over and between slabs of rock in full sun; summer rainfall area; nearly, if not quite, frost free. The site in which I found plants growing was clearly likely to be very wet during rainy periods but in the dry winter months the site would be absolutely bone dry and with no shade of any kind, it really would be very hot indeed with only an inch or two of soil over bare rock.
            textZh: 该 SANBI 区域物种条目记录的生境：Grows on very thin black sandy soil over and between slabs of rock in full sun; summer rainfall area; nearly, if not quite, frost free. The site in which I found plants growing was clearly likely to be very wet during rainy periods but in the dry winter months the site would be absolutely bone dry and with no shade of any kind, it really would be very hot indeed with only an inch or two of soil over bare rock.
