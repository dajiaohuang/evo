    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Of the small filiform leaved species that have staminal appendices, only N. masonorum has very narrow perianth segments. Whilst both N. gaberonensis and N. rehmannii have very narrow segments, there is no [staminal] appendix. N. masonorum has minute but clearly seen hairs on the scape and pedicels which is an additional point of identification. The scape is up to some 22 cm in length; the pedicels which can number from 4 to 12 are under 3 cm in length. The segments are undulate and much recurved when fully out and measure only about 1-3 cm in length by 3 mm in breadth. The Umtata population has segments that are less crisped than in the typical plant and the appendix is less developed.
