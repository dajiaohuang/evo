    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous herb. Stems trailing, up to 300 mm long. Plants bearing a cormlet in axil of 1 to several stem nodes. Perianth tube 9-15 mm long, recurved, shorter than bracts and emerging between them. Flowers pale creamy white, tinged with lilac or pink.
            textZh: Hesperantha bulbifera Baker 的 SANBI 物种条目记录了形态特征。
