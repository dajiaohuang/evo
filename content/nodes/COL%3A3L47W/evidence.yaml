            locator: "SANBI/WFO archive Morphology row 2300; source identifier 11118.0; cited publication: Herman, PPJ; Retief, E. 1997. Plants of the northern provinces of South Africa: Keys and diagnostic characters. Strelitzia 6: 1 - 681. National Botanical Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Allied to the largely western southern African Hesperantha bachmannii, H. bulbifera has similar white flowers with curved perianth tube but these are somewhat larger, with a perianth tube 9-15 mm long and tepals 16-20 mm long vs. tube ± 10 mm long and tepals 14-20 mm long in H. bachmannii. In addition, H. bulbifera always has larger corms, 8-10 mm diam. vs. 6-8 mm, with a conspicuous cormlet in the lower leaf axils not present in H. bachmannii.
