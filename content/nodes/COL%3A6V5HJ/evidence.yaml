        usage:
          title: Peritassa pruinosa (Seem.) A.C.Sm., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Liana or shrub with scandent branches, the branchlets slender, cinereous, copiously lenticellate. Leaves opposite or subopposite, the petiole stout, 6-12 mm. long, rugose; blade elliptic or obovate-oblong, obtuse at the base, obtusely short- cuspidate at the apex, entire or obsoletely crenulate at the margins, 10-20 cm. long and 3.5-9.5 cm. broad, thin-coriaceous, the costa prominent on both surfaces. Inflorescences compactly dichotomously several times branched, 1-2.5 cm. long, the peduncle short. Flowers usually paired or ternate, 1.7-2.2 mm. in diam., the pedicel slender and about 1 mm. long; sepals ovate-deltoid, rounded at the apex, erosu- lous to densely ciliate at the margins, 0.4-0.6 mm. long and slightly broader, papyraceous; petals oblong, erosulous or minutely ciliolate distally, 1-1.3 mm. long and 0.7 mm. broad, papyraceous or thin-carnose; disc subentire at the margin, about 0.2 m. high, thin-carnose or submembranous; filaments of the stamens about 0.6 mm. long, the thecae. distinct, slightly divergent at the base, about 0.2 mm. long, dehiscing by longitudinal, oblique clefts, the connective deltoid; ovary about 0.5 mm. in diam., the ovules 2 per cell, the style about 0.3 mm. long, the stigmas ob- scure or minutely capitate. Fruits 1 per inflorescence, subcylindric-ellipsoid, some- times falcate, up to 3 cm. long and about 1 cm. in diarn., the pericarp woody, at least 2 mm. thick; seeds 1-2.
          originalLanguage: en
          sourceField: general
