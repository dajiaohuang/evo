    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Perennial herb, geophyte, 0.8-2.0 m high; stem solitary or 2 or 3 tufted together; corm 30 mm in diam. Leaves linear, acute; venation pronounced; radical leaves 450-950 x (3-)4-6 mm; reduced sheathing leaves 5. Flowering stem 1-2 m high. Bracts white, slightly flecked, 18-32 x 7-10 mm, elliptic-lanceolate, acuminate. Inflorescence a raceme of spikes, pendulous, with 3-8 branches. Perianth dark red, 20-30 mm long; tube 6-12 mm long; tepals 13-20 x 5-9. Anthers 7.5-10.5 mm long. Flowering time Oct.-Feb.
            textZh: Dierama reynoldsii I.Verd. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_18505_0
            locator: "SANBI/WFO archive Morphology row 90728; source identifier 18505.0; cited publication: Bredenkamp, CL; Magwaza, ZL. 2019. Iridaceae. In: CL Bredenkamp (ed.), A Flora of the Eastern Cape Province, Strelitzia 41(3): 1821 - 1882. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Occurring as solitary stems or up to three in small tufts, with pure white or lightly flecked bracts appearing silvery white, and dark wine-red flowers with perianth 17-30 mm long. Dierama dubium has much smaller flowers usually shorter than the bracts, the perianth 14-18 mm long. Purple-flowered forms of D. latifolium are distinguished by the markedly clumped habit and often broader leaves, 5-15 mm.
            textZh: SANBI 条目提供了 Dierama reynoldsii I.Verd. 的鉴别特征。
