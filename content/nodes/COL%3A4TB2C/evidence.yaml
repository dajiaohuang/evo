    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Like R. minutiflora but flowers 15-20 mm long, white with yellow cup, anthers 3.5-4.0 mm long, inner bracts with inconspicuous spots.
            textZh: Romulea sinispinosensis M.P.de Vos 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 7322; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Very closely related to R. minutiflora. Might be considered as a slightly larger form of R. minutiflora distinguished by slightly larger flowers with slightly wider perianth segments, longer anthers and style, and by the faint marks on the margins of the inner bracts. The morphological features and chromosome number indicate a possible amphidiploid origin from R. minutiflora and some other species of Romulea.
            textZh: SANBI 条目提供了 Romulea sinispinosensis M.P.de Vos 的鉴别特征。
            sourceIds:
              - sanbi_12511_0
            locator: "SANBI/WFO archive Diagnostic row 51694; source identifier 12511.0; cited publication: De Vos, MP. 1983. Syringodea, Romulea, Fl. S. Africa 7(2,2): 1 - 76. Botanical Research Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: A polyploid species closely allied to Romulea minutiflora from more southerly and inland locations, which has smaller, mostly pale lilac or mauve flowers with tepals 4-9 x 1.5-2.5 mm, often with a dark ring in the throat, finely rust-coloured speckled outer bracts, and inner bracts with membranous margins only inconspicuously brown-spotted or -speckled near the tips.
            textZh: SANBI 条目提供了 Romulea sinispinosensis M.P.de Vos 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 95145; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
