    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Deciduous, bulbous herb, 200-250 mm tall when flowering. Bulb solitary, hypogeal, depressed globose, 25-35 x 30-35 mm diam.; outer tunics papery and brown, extended into a slender neck up to 90 mm long. Leaves 1 or 2 each season, most often dying back before flowering and emerging anew after flowering, strap-shaped, 150-320 x 6-7 mm, narrowing up to 2 mm at base and apex, glabrous, somewhat glaucous, reddened at base; adaxial surface channelled; abaxial surface distinctly keeled; margins and midrib minutely papillate towards base. Inflorescence 3-6-flowered; scape erect, up to 190 mm long, 4-5 mm diam., tapering distally, glaucous green, flushed with pink near base, solid at base but hollow above; spathe valves 2, equitant, lanceolate, 50-57 x 8-9 mm, herbaceous, reddish turning pale brown, inner withering and reflexing before outer; bracteoles filiform, ± 5 mm long; pedicels erect, ranging from 15-55 x 1.5-2.0 mm in each inflorescence, pale green. Flowers secund, spreading horizontally or slightly drooping, opening ± synchronously; perianth funnel-shaped, 37-42 mm long, scarlet, inner surface of tube whitish pink with 6 scarlet streaks leading downwards from tepal sinuses, not scented, producing nectar; tube 25-30 mm long, lower 10 mm narrow, 2-4 mm diam., curved at ± 90o, upper 15-20 mm flaring open to 10-13 mm at throat; tepals ovate, 10-14 x 6-8 mm, outspread at anthesis, outer and inner almost equal, 5-7-veined, firm-textured, without a thickened midrib; apex obtuse, mucronulate; mucro white. Stamens biseriate, regular, arising ± three quarters up tube, outer attached 3-4 mm below inner; anthers dorsifixed, oblong, up to 3 mm long, yellow. Ovary ellipsoidal, 5-6 x 2-3 mm, green; ovules axile, ± 25 per locule; style pressed against lower tepals, up to ± 9 mm long, exserted beyond stamens, white to scarlet distally; stigma 3-branched, branches slender, truncate, ± 2.0 x 0.5 mm, papillate on inner surface. Capsule narrowly elliptical, ± 30 x 8 mm, 3-valved, valves reflexing when dry. Seeds flattened, up to 10 x 4 mm, blackish.
            textZh: Cyrtanthus macmasteri Snijman 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_6347_0
            locator: "SANBI/WFO archive Morphology row 80666; source identifier 6347.0; cited publication: Snijman, DA. 2003. A new Cyrtanthus species (Amaryllidaceae: Cyrtantheae) endemic to the Albany Centre, Eastern Cape, South Africa. Bothalia 33(2): 145 - 147. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: It is possible to group the species of Cyrtanthus by their flowers. Several species have a perianth in which the tube is narrow at the base and then flares widely to the throat. Reid & Dyer grouped together 13 species defined by this floral form. Of these, C. elatus (Jacq.) Traub, C. guthrieae L.Bolus and C. montanus R.A.Dyer have regular flowers without markings. The other 10 species have distinctive lines running into the throat from the tepal sinuses, the style and often the stamens flex downwards against the lower tepals, and the stigma has three long branches. These include five red-flowered species allied to Cyrtanthus sanguineus (Lindl.) Walp. and three species with lemon to pale pink flowers related to C. loddigesianus (Herb.) R.A.Dyer. Based on its flared tube, paler throat with darker streaking, and deflexed style with a three-branched stigma, C. macmasteri falls clearly into the group comprising C. thomcroftii C.H.Wright, C. galpinii, C. eucallus R.A.Dyer, C. sanguineus, and C. flammosus Snijman & Van Jaarsv. The inclusion here more recently of C. wellandii Snijman in which the stamens and style are included low down in the tube is discussed in Snijman & Batten (2003). Of the smaller-flowered species belonging to the C. sanguineus group, C. macmasteri is most similar to C. galpinii, a species from Zimbabwe, Mozambique, Mpumalanga, Swaziland and northern KwaZulu-Natal. Both have narrow (less than 7 mm wide), hysteranthous leaves that taper to a narrower base (1-2 mm wide), and flowers that flare widely to a pale perianth throat (at least 10 mm across) with contrasting streaks leading down into the tube. In C. galpinii the flowers are variable, although mostly red they may also be pink or orange. In southern Africa the perianth is 50-75 mm long, whereas the specimens from Zimbabwe that are usually called C. galpinii have shorter perianths, 30-60 mm long. In plants from Zimbabwe C. galpinii may rarely have two flowers per inflorescence, however, elsewhere the inflorescence is consistently single-flowered and appears from March to July. In C. macmasteri the length of the perianth (37-42 mm) overlaps the smaller forms of C. galpinii, but the species differs in having a 3-6-flowered inflorescence which is produced mainly in February. It is possible to confuse poorly prepared specimens of C. macmasteri with those of C. collinus Ker Gawl., an unrelated species of the Cape Region that extends along the Cape Fold Mountains from the Riviersonderend Range, Western Cape to the Zuurberg, Eastern Cape. This is due to the perianth tube in C. collinus sometimes being slightly flared towards the mouth. However, the flowers are uniformly red and without nectar guides, the style and trifid stigma arch against the upper tepals and the leaves are V-shaped in cross section, lacking the distinct keel found in C. macmasteri.
