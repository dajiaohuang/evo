    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous herb, up to 300 mm tall. Inner tepals tricuspidate with short, obtuse, lateral lobes and a long central cusp, longer than 10 mm, extending above level of stigmas. Flowers white to pale blue, marked with lilac veins.
            textZh: Moraea marionae N.E.Br. 的 SANBI 物种条目记载了植株、叶片和花部形态。
            sourceIds:
              - sanbi_11118_0
            locator: Strelitzia 6; archive Morphology row 2790, source 11118.0
            placeTimeScope: Regional species account published 1997; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
          - text: Spring-flowering Moraea marionae is an inconspicuous plant and even in bloom the small, white to pale blue flowers are difficult to spot in the resprouting grass. As a result it remains poorly documented over its relatively wide range. The outer tepals are only 10-20 mm long, the limbs rarely longer than 12 mm, and the inner tepals are 3-lobed with small, rounded lateral lobes and a linear central cusp that is coiled inward. The terete leaf is often absent or just emergent at flowering time and attains its full length during the summer after the capsules have ripened. No plants with fully developed leaves are known. Its relationships are most likely with M. trifida, also of eastern southern Africa but with larger, brown to greenish flowers, also with 3-lobed inner tepals, but a channelled leaf present at flowering.
            textZh: SANBI 条目提供了 Moraea marionae N.E.Br. 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: Strelitzia 42; archive Diagnostic row 94256, source 18638.0
            placeTimeScope: Regional species account published 2020; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
