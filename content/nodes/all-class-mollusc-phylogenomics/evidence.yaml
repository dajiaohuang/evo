    - 全部主要现生纲均有代表且运行多种模型，但深层关系随矩阵变化，补充图的勘误也被明确保留。
  claim-statements.zh:
    - Smith 等人新增 15 个物种的转录组并取样所有主要现生软体动物类群，其主要分析恢复出单板纲与头足纲互为姐妹群；这一反对 Serialia 的拓扑与其他矩阵冲突，因此仅作为该研究特定的结果保留。
