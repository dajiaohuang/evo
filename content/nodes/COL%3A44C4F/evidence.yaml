    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants 180-300 mm high, with collar of tough fibres around base. Corm 15-25 mm diam., without cormlets at base; tunics of brown to ± black, tough, medium to coarse fibres. Stem simple or 1(2)-branched exceptionally with up to 6 branches, sheathing leaves with dry attenuate tips, (30-)40-55 mm long. Foliage leaf solitary, linear(-linear-filiform), channelled, usually V-shaped in section, leaf halves closely appressed in dry conditions, 1.5-3.0 mm wide (opened flat), erect or trailing distally. Rhipidial spathes with attenuate, dry tips, inner (40-)50-80 mm long, outer ± half as long. Flowers long-lived, pale blue, mauve or violet blue, outer tepal limbs with large white, velvety nectar guides dotted and usually edged with dark violet at bases, lanceolate, half reflexed; outer tepals (20-)26-34 x 10-16 mm, claws (8-)10-12 mm long, usually speckled with dark blue to violet dots or purple in midline; inner tepals linear, (8-)10-15 mm long, ascending below, distal 1/3-1/2 usually spreading (± erect when short). Filaments (3-)4-6 mm long, united basally for 0.5-1.8 mm; anthers 4-8 mm long, violet; pollen red (rarely white). Ovary ellipsoid, 11-15 mm long; style branches 8-10 mm long, crests 5-8 mm long, linear. Capsules ovoid-ellipsoid, 14-16 mm long. Seeds angular, 1.8-2.0 mm long, light brown, testa spongy, thickened on angles.
            textZh: Moraea cuspidata Goldblatt & J.C.Manning 的 SANBI 物种条目记载了植株、叶片和花部形态。
            sourceIds:
              - sanbi_18638_0
            locator: Strelitzia 42; archive Morphology row 97867, source 18638.0
            placeTimeScope: Regional species account published 2020; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
          - text: Closely allied to Moraea tripetala, M. cuspidata is distinguished by the linear inner tepals up to 15 mm long (rarely less than 10 mm), spreading in the distal half, and usually with a particularly narrow foliage leaf with the halves usually tightly appressed in dry conditions. The brown to almost black corm tunics consist of thickened vertical fibres sometimes with raised ridges, and form a collar of stiff fibres around the base of the stem. The flowers are pale blue to violet with the large, velvety nectar guides spotted with dark blue on a white background. The filaments are usually united for 1.0-1.5 mm but occasionally less, and are ± as long as or slightly shorter than the dark purple anthers that bear red pollen. Capsules (where known) are relatively large, 14-16 mm long and the seeds are also relatively large, 1.8-2.0 mm long and unusual in having a pale, spongy testa much thickened into prominent ridges on the angles. The species is sympatric at some sites and even co-blooming with smaller-flowered Moraea amabilis (also allied to M. tripetala) but that species has a broadly channelled foliage leaf, sometimes plane distally and often pilose on the abaxial surface, and consistently short, hair-like inner tepals typically 1.5-2.0 mm long. At sites where they have been recorded growing together pollen of M. amabilis is white, contrasting with the orange-red pollen of M. cuspidata. An outlying record of M. cuspidata from Perdekloof, southeast of Oudtshoorn, probably belongs here. The flowers are exceptionally small, the inner tepals are 8-9 mm long, otherwise consistent with the species.
