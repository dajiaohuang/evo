  claim-rationales.zh:
    - 地钱门的分类字段只陈述所引研究与导航范围；不会把矩阵位置、数据库映射或样本相似性改写为直系祖先。
    - 地钱门的地理字段限于具名样本或明确模型范围，不外推为全球分布、起源中心或完整扩散路径。
    - 地钱门的生态字段区分保存事实与功能推断；未被直接记录的饮食、行为、栖息地偏好和性能均保留不确定性。
    - 地钱门的形态字段限于主研究列明的标本、样本或分析，并连接到精确页码、图版或补充材料。
    - 地钱门的年代范围是有界的标本、地层或模型投影，不作为全球首现、末现、分化时间或连续谱系时长。
  claim-statements.zh:
    - Metzgeriothallus sharonae 支持苔类实体化石的归属判定；更早的奥陶纪孢子团仅提示、并未确立与地钱门的亲缘关系。
    - 档案中的实体化石来自纽约州东部吉维特期地层，不能据此确定该门的全球起源区域或完整化石分布。
    - 该叶状体植物被解释为小型陆生初级生产者；确切基质、水分条件及生活史并未被直接观察。
    - Metzgeriothallus 标本保存了具有中肋的二叉分枝叶状配子体，以及与之关联的孢子体孢蒴。
    - 本档案将吉维特期实体化石记录作为有证据关联的较老边界；不会将更早的隐孢子暗中当作冠群苔类化石。
