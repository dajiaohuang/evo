  claims:
    - subjectId: event:c4-grassland-expansion
      claimKind: scientific
      claimType: event-mechanism
      statement: Fossil tooth-enamel carbon-isotope records document a widespread increase in C4-plant biomass between 8 and 6 Ma across Asia, Africa, North America and South America, with earlier increases at lower latitudes.
      confidence: high
      confidenceRationale: High confidence follows from directly measured enamel isotope shifts across multiple continental sequences. The inference concerns C4 biomass and regional timing; enamel δ13C is an animal-diet and local-habitat proxy that cannot identify the contributing C4 plant lineages or by itself demonstrate open grassland, vegetation cover, dental adaptation or faunal turnover.
      referenceLinks:
        - relation: supports
          referenceId: cerling-1997-c4
          pages: 153–158
          figure: Figures 1–3
          quoteLocator: Abstract, p. 153; regional enamel δ13C records in Figures 1–3
  claim-rationales.zh:
    - 高置信度来自多个大洲序列的牙釉质同位素实测变化；该推断只涉及 C4 生物量与区域时序，不能单独证明开阔草原、植硅体丰度、牙齿适应或动物群更替。
  claim-statements.zh:
    - 化石牙釉质碳同位素记录表明，约 800 万至 600 万年前，亚洲、非洲、北美洲和南美洲的 C4 植物生物量普遍增加，其中较低纬度地区的增加更早。
