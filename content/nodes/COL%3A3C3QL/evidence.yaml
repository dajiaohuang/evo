          title: Eugenia acapulcensis Steud., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrubs or trees 3-12 m. high, with glabrous twigs. Leaves elliptic, rarely oblong or lanceolate, acute or attenuate at the base, shortly and obtusely acuminate at the apex, 5-12 cm. long and 2-6 cm. wide, glabrous but densely glandular- punctate, the midrib slightly impressed above, prominent beneath, the lateral nerves distant, in 6-9 pairs, prominulous on both surfaces, the lower ones curved at their base, passing into a marginal nerve at about 1-3 mm. distance from the margin; petiole up to 1 cm. long. Flowers green or white, very small, in numerous axillary abbreviated racemes, the rachis up to 1 cm. long though often much shorter (in the latter case perhaps accrescent during fruiting), the pedicels filiform, glabrous or puberulous. Ovary glabrous. Sepals 4, very short and scarcely 1 mm. long, semi-orbiculate. Petals densely glandular-punctate, about 3 mm. long. Berry globose, dark red to black (or sometimes yellow?), about 8 mm. in diameter, crowned with the very small connivent sepals. Embryo homogeneous.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 8433
