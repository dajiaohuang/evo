        claims:
          - text: Monoecious, tuberculate, spineless, glabrous succulent, with 1 or 2(3) thick main stems, up to 300 x ± 100 mm, densely covered with persistent, later somewhat woody short shoots. Leaves soon deciduous, linear, 8-15 x 1-2 mm. Cyathia many on branches in lower half of stems, 1-4 on peduncle in axil of tubercle, 7-12 mm diam., with 5 brown-green glands each with 3-8 yellow processes on outer margin. Capsule sessile, 6-8 mm diam., glabrous and shiny.
