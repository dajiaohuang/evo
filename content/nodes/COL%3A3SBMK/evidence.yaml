        claims:
          - text: Like L. cactiformis but stems often branching from base to form clumps of up to 30, corolla smooth inside.
            sourceIds:
              - sanbi_14722_0
            locator: "SANBI/WFO archive Morphology row 30914; source 14722.0; publication: Bruyns, PV. 2013. Apocynaceae. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 248 - 264. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Larryleachia marlothii is quite variable over this vast distribution. In the eastern part of its range the plants are usually more slender with a dark grey colour and deep grooves between the tubercles. They usually have at least three stems and may have up to 30 in some instances, then forming quite a robust clump, though the stems are mostly short and rarely exceed 100 mm long. The corolla lobes are relatively long and narrow (with a broad base) and the whole corolla has a characteristic reddish patterning on a cream background which varies only slightly in intensity. In the southern, winter-rainfall part of the Namib plants are mostly not more than 60 mm tall, with three to five stems, though even here occasionally they may have up to 20 stems. The harshness of the conditions here is indicated by the manner in which the stems are usually at least partially covered with a pale grey, corky layer caused by blasting by wind-borne sand. They are also thicker and the tubercles are much flatter, with hardly any grooves between them. In the southern coastal Namib, from Lorelei towards Alexander Bay and northwards to Lüderitz, considerable variation is found in the colour patterns on the corolla. The corolla is also very variable in shape in this area, from nearly flat to quite obviously campanulate. In the northern part of the range, from Swakopmund northwards, the corolla is more often campanulate. It is also smaller, with shorter, more deltate lobes and is frequently more darkly coloured, in some cases even a nearly uniform purple-black. However, even amongst these plants there is considerable variability and more or less flat flowers with red on cream may be encountered. From the other species L. marlothii may often be distinguished by its more slender, dark grey stems with deep grooves around the tubercles which give the strong impression of an irregular arrangement of maize kernels ‘on the cob’. However, this distinctiveness breaks down as one moves out of the Rhigozum-steppe westwards into the Namib. Larryleachia marlothii is distinguished from all others in the genus by the fact that the corolla is entirely free of papillae and by the nearly total lack of any dorsal projection on the inner corona lobes, though a minute, round one may occasionally be present. The striking distinctiveness of the seed, in which hairs arise along the margin for some distance away from the coma at the micropylar end, is unique among the stapeliads.
