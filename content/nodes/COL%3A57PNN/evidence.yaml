    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Deciduous geophyte, 100-200 mm high. Rhizome short, compact and swollen, hard and woody in texture, forming an irregular, bulbous structure with one or multiple shoots, roots cylindrical, felted. Cataphylls surrounding shoots, membranous and colourless, acute and prominently veined. Leaves 4-7, subterete, 100150 x 1.0-1.5 mm, leathery, somewhat flexuous, minutely puberulous, dull greyish green, decaying to form a fibrous or ± papery collar 15-20 mm long, sheaths fimbriate at mouth. Inflorescence a simple raceme; peduncle flexed slightly outward and then erect, 1.0-1.5 mm diam. at base, minutely puberulous; raceme moderately dense, mostly 5-10-flowered, 40-70 mm long; bracts ovate-acuminate, 5-8 mm long, membranous, scabridulous on midrib abaxially at base, margins ciliolate; pedicels suberect, 5-7 mm long, scabridulous. Flowers rotate, white with greenish midribs, tepals transversely maculate, opening in afternoon, sweetly scented; outer tepals elliptical, 8-10 x 2 mm, scabridulous along midrib abaxially, inner obovate, 7-9 x 3 mm. Stamens suberect; filaments filiform, tapering below, white, ± 6 mm long, retrorsely scabrid in distal half, inner filaments minutely puberulous for short distance below scabrae; anthers yellow, outer 1.5 mm long, inner ± 1 mm long. Ovary ovoid, ± 1.5 mm long, green, with ± 7 ovules per locule; style erect, filiform, ± 5 mm long, white. Capsules ellipsoid, 4-5 x 3-4 mm, scabridulous. Seeds not seen.
