          - text: An unusual species that accords with sect. Liriothamnus in its horizontal rhizome, cataphylls not completely transformed into collar-like, membranous structures, and in the outer leaves decaying into a fibrous collar at the base but immediately distinguished by the combination of tufted habit and irregular, bulbous rhizome. Branching of the swollen, knobbly, rhizome in T. bulbosa results in small clumps of shoots, each producing one or two unbranched racemes.
