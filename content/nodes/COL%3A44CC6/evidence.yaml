    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants up to 200 mm high. Corm globose, 15-20 mm diam.; tunics forming dense, fibrous mass, dark grey-black. Stem simple or 1-branched, 3 internodes long, bearing sheathing leaves ± 25 mm long. Foliage leaves 2, basal, ± linear, evidently narrowly channelled, straight, possibly ± trailing distally, ± as long as stem, slightly < 1 mm diam. margins plane. Rhipidial spathes with broad, dry, transparent margins, inner ± 25 mm long, outer ± 1/2 as long. Flowers fugaceous, white with style branches flushed pale mauve, outer tepal limbs with large pale yellow nectar guides at bases white in middle, inner tepal claws speckled yellow, scent unknown; outer tepals ± 18 x 8 mm, claws ascending, ± 8 mm long, inner tepals ± 15 x 6 mm. Filaments ± 8 mm long, united below in smooth, cylindric column ± 4 mm long; anthers ± 4.5 mm long, pale mauve; pollen white. Ovary spindle-shaped, ± 7 mm long, included; style branches diverging, ± 6 mm long, crests broadly wedge-shaped, ± 7 mm long. Capsules ellipsoid, 9-10 mm long, without beak. Seeds unknown.
            textZh: Moraea teretifolia Goldblatt & J.C.Manning 的 SANBI 物种条目记载了植株、叶片和花部形态。
            sourceIds:
              - sanbi_18638_0
            locator: Strelitzia 42; archive Morphology row 97809, source 18638.0
            placeTimeScope: Regional species account published 2020; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
          - text: Superficially a small-flowered morph of Moraea saxicola, M. teretifolia stands out in having two basal foliage leaves with straight, terete blades ± as long as the stem. Both closely related M. geminifolia and M. saxicola also have branched stems but larger flowers, the outer tepals of M. geminifolia 25-30 x 10 mm and those of M. saxicola 34-45 x 10-16 mm, whereas in M. teretifolia the outer tepals are ± 18 x 8 mm. The white flowers have large nectar guides at the base of the outer tepal limbs, the nectar guides with a white centre bracketed by broad yellow borders. The capsules of M. teretifolia are 9-10 mm long and differ from those of M. saxicola in lacking a beak. Capsules of M. saxicola are 12-14 mm long with short beak up to 1 mm long.
            textZh: SANBI 条目提供了 Moraea teretifolia Goldblatt & J.C.Manning 的鉴别特征。
