    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Perennial (to subperennial), tufted (erect or geniculate), up to 0.65 m high. Leaf blades up to 200 mm long, up to 2 mm wide. Spikelets 18-20 mm long (including awns). Inflorescence open, branches rigid, naked for most of their length, spreading at 90° from main axis, spikelets borne at tips of long, naked branches; lower glume equalling or longer than upper glume, awned; lemma articulation and column absent; awns 3, subequal; callus tip thickened, naked, rounded to obtuse.
            textZh: Aristida bipartita (Nees) Trin. & Rupr. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_11118_0
            locator: "SANBI/WFO archive Morphology row 303; source identifier 11118.0; cited publication: Herman, PPJ; Retief, E. 1997. Plants of the northern provinces of South Africa: Keys and diagnostic characters. Strelitzia 6: 1 - 681. National Botanical Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Resembles A. effusa, which is a definite annual, has a lower glume with or without a mucro; and forms of A. scabrivalvis, an annual with the lower glume less than 2/3 the length of the upper glume (excluding awns). The whole inflorescence breaks off at maturity and is rolled about as a tumbleweed by the wind.
            textZh: SANBI 条目提供了 Aristida bipartita (Nees) Trin. & Rupr. 的鉴别特征。
            sourceIds:
