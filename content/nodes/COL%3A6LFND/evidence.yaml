            locator: "SANBI/WFO archive Diagnostic row 66128; source identifier 459.0; cited publication: Bayer, MB. 1981. Three new species of Haworthia (Liliaceae-Aloineae). J. S. African Bot. 47(4): 789 - 795. [CC BY]"
