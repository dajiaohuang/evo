    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Rosette acaulescent, 40-70 mm diam., up to 11 leaves. Stem up to 20 mm diam., non-proliferous. Leaves erect up to 30 mm long, 14 mm wide 10 mm thick with truncated, obtuse end-area; face slightly concave, brownish-green smooth unlined, pinkish tubercules above, truncated area and margins scabrid, opaque with up to 3 inconspicuous pinkish longitudinal lines; back convex, unlined, brownish-green, with apical pinkish tubercules, minutely keeled at apex margins acute, entire. Peduncle single, 1-1.5 mm diam., 250-450 mm long including raceme, greyish-brown; raceme 150-250 mm long, with 9-23 nearly secund flowers, 2-4 open at a time, petioles 3-5 mm long. Perianth greyish-green and white, 15 mm long, perigon rounded, upper-outer segments straight, inner-lower segments with involuted margins and recurved, tips flared, tube pale green, bud narrow, straight, slightly down-curved at tip.
            textZh: Haworthiopsis bruynsii (M.B.Bayer) G.D.Rowley 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_459_0
            locator: "SANBI/WFO archive Morphology row 67847; source identifier 459.0; cited publication: Bayer, MB. 1981. Three new species of Haworthia (Liliaceae-Aloineae). J. S. African Bot. 47(4): 789 - 795. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: The flowers are practically secund, the florets are widely spaced on a relatively slender, wiry peduncle, the margins of the outer perianth lobes are well-separated and, fused with the outer surfaces of the inner perianth lobes. The perianth base is regularly 6-sided and the tube is straight.
            textZh: SANBI 条目提供了 Haworthiopsis bruynsii (M.B.Bayer) G.D.Rowley 的鉴别特征。
