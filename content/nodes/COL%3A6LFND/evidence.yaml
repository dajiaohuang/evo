      ecology:
        status: partially-supported
        claims:
          - text: H. bruynsii is a component of the Steytlerville Karoo flora, and grows on low stony hills where it receives about 100 to 150 mm of rain per annum which is distributed mainly during the summer months. The summers are hot to very hot, while the winters are rather cold with some frost. H. bruynsii grows in a firm hard soil with pH 6.7.
