    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Annuals or short-lived perennials. Culms densely tufted, 20-60 cm tall, filiform, 3-angled, smooth. Leaves shorter than culm; leaf blade setaceous, 0.5-1 mm wide, canaliculate, apex scabrous. Involucral bracts setaceous, sheathing. Inflorescences laxly paniculate, consisting of 1-3 corymbiform anthelae to 4 cm; terminal anthela longer than lateral ones, simple or subcompound; lateral anthelae simple, with peduncles exserted from sheaths; rays capillary, 2-4 cm, often upcurved, smooth, subtended by setaceous bractlets. Spikelets solitary, narrowly ovoid, 3- or 4-flowered, apex acute; peduncle long. Glumes 7 or 8, pale rust-colored with purplish lines, spirally imbricate, broadly ovate, membranous, muticous. Perianth bristles absent. Stamens 2; anthers 1.5-2.3 mm. Style ca. 2.3 mm, base much depressed, saddle-shaped, 2-lobed, and almost as broad as nutlet, apex 2-cleft to middle. Nutlet grayish white, shortly stipitate, broadly obovoid, 1.3-1.5 x 1.3-1.5 mm, biconvex, deeply transversely wavy ridged, with longitudinally linear epidermal cells, apex truncate.
