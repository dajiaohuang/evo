    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Tufted annual, possibly biennial, 300-700 mm high; leaves mostly cauline; culms slender, erect, sometimes geniculate; nodes dark. Leaf blades up to 150 x 2.0-6.5 mm, lanceolate, acute, flat, glabrous or with sparsely scattered, long, thin, bulbous-based hairs; margins scabrid; sheaths with long, slender, bulbous-based hairs, bases often red. Inflorescence 60-200 mm long; racemes 10-20, up to 60 mm long, becoming shorter towards apex, ascending, not spreading more than 45o from central axis; spikelets crowded, less than own length apart. Spikelet 5.5-7.5(-8.0) mm long (including awn); glumes 5-8 mm long (including awn), unequal, slightly shorter to as long as, or sometimes longer than spikelet, awn up to 1 mm long; lemma 2.8-3.0 x 0.8-1.0 mm, apex membranous; lateral nerves densely long-hairy, middle of back hairy from base to 3/4 up; awn 0.8-1.2 mm long, shorter than body of lemma; palea as long as lemma, apex emarginate, capitate, hairy, upper margins and apex minutely hairy; anthers 0.6-1.0 mm long; caryopsis 2.0-2.5 x 0.5 mm, oblong.
