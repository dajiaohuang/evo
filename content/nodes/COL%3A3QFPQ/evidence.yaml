        claims:
          - text: Cormous geophyte, 20-50 cm. Leaves linear to lanceolate, often coiled above. Flowers small, in dense spikes, pale yellow, fragrant, tube funnel-shaped.
            textZh: Ixia odorata Ker Gawl. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 7164; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: "Well named for its particularly sweetly scented flowers crowded at the top of the short spike. Typical I. odorata has the following characteristics: bracts 6-7 mm long; perianth tube 7-12 mm long; tepals 9-11 x ± 5 mm; filaments 2.5-3.0 mm long, exserted 1-2 mm; anthers 5-6 mm long. Populations of short, few-flowered plants from middle and upper elevations in the Hottentots Holland-Jonkershoek Mt complex are now treated as a separate species, I. esterhuyseniae, this very different in stature from the taller, fairly small-flowered I. odorata, but they share outer floral bracts with a single main vein and usually a single tooth, in contrast to the more common 3-veined and 3-dentate outer bracts of the genus. Apart from its low stature, I. esterhuyseniae has style branches dividing above the bases of the anthers, usually opposite the middle third of the anthers, thus unlike I. odorata in which the style divides below the anthers, sometimes within the tube and opposite the bases of the filaments. Plants treated as I. odorata var. hesperanthoides Lewis (1962) remain puzzling. The type collection has white flowers with a perianth tube only ± 5 mm long, tepals ± 8 mm long, and anthers 3.5-4.5 mm long, all smaller than in typical I. odorata. Other features accord with typical I. odorata, although the length of the style branches is also shorter than the normal 4-5 mm of the species. The type collection was said to have flowers opening in the late afternoon, unlike ± 11:00 for typical, yellow-flowered I. odorata, indicating that some white-flowered populations, as the type of var. hesperanthoides, represent a separate race, possibly even a separate species. Additional research is needed to assess their status. Ixia odorata is sometimes mistaken for the southern Western Cape and Eastern Cape I. orientalis and the two can be confused when flower colour is not known, although the latter is almost always branched, whereas I. odorata is rarely so. White- or pink-flowered I. orientalis has a perianth tube of similar dimensions, and with a filiform lower portion but the style typically divides opposite the base of the anthers (rarely just below them), and it has longer filaments 5-6 mm long (vs. 2.5-3.0 mm) exserted 2-4 mm (vs. 1-2 mm), and unscented or only weakly scented flowers."
            textZh: SANBI 条目提供了 Ixia odorata Ker Gawl. 的鉴别特征。
