    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Shrub, up to 1 m high. Leaves linear-filiform, 8-80 mm long, glabrous, 3-forked from or above (seldom below) the middle or pinnatipartite. Peduncles solitary, 60-250 (-350) mm long. Involucral bracts connate below the middle with partly overlapping margins or sometimes connate to the middle or more. Flowers yellow.
            sourceIds:
              - sanbi_11118_0
            locator: "SANBI/WFO archive Morphology row 1985; source 11118.0; publication: Herman, PPJ; Retief, E. 1997. Plants of the northern provinces of South Africa: Keys and diagnostic characters. Strelitzia 6: 1 - 681. National Botanical Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: This species forms a transition between the shrubby species of the section and those with annual stems from a subterranean caudex. E. pedunculatus sometimes develops to a vigorous branching shrub somewhat resembling E. abrotanifolius in habit. In other cases the stems are short, little-branched and suffrutescent, arising from a thick subterranean caudex. Such forms have much resemblance to E. laxus. It is not known whether a subterranean caudex is always developed, but it is present in all material seen with preserved basal parts. E. pedunculatus is an extremely variable species. The considerable variation in habit is mentioned above, and the variation in leaf-shape and length of rays is equally striking. A local population from the Kaapsche Hoop area in eastern Transvaal has been described as E. rogersii. It has a characteristic appearance, being a vigorous shrub with small, pinnatipartite leaves, but it seems to be connected with more typical pedunculatus by a continuous series of transitional forms in the surrounding areas. Forms with short and only weakly lignified stems are not so easily defined against E. laxus, which is obviously quite closely related. Distinguishing characters are the less connate and more overlapping involucral bracts and the more densely pubescent and usually smaller achenes of E. pedunculatus.
            textZh: SANBI 条目提供了该种的鉴别特征。
