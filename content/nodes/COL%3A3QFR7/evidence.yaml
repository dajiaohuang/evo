    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, 15-70 cm, with short lateral branchlets. Leaves usually 3, lower 2 sword-shaped to falcate, uppermost sheathing the stem. Flowers few in a wiry spike, half nodding, faintly rose-scented, blue-mauve occasionally pink with yellow cup, perianth tube funnel-shaped, 6-9 mm long, filaments included.
            textZh: Ixia rapunculoides Redouté 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 7165; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Recognised by the half to fully nodding, mostly blue flowers with a yellow cup (locally pale pink with a white cup), short perianth tube mostly 5.5-8.0 mm long, short filaments 2-3 mm long and anthers 2.3-3.5 mm long and half included in the perianth tube. In the vicinity of the Hantamsberg the species co-occurs with I. robusta, which was distinguished at the varietal level by Lewis (1962) by the presence of a short collar of fibres sheathing the base of the stem, and three or sometimes four, rather than the usual two leaves with expanded blades. A significant variant of I. rapunculoides from the Keiskie Mtns south of Calvinia has long narrow tepals ± 18 x 4 mm, a perianth tube 8.5 mm long and filaments inserted ± 4 mm above the tube base and ± 4 mm long. Elsewhere flowers of I. rapunculoides have broader tepals 11-15 x 4.5-6.0 mm, a perianth tube rarely more than 8 mm long, filaments inserted 2-4 mm above the tube base and 2-3 mm long. The anthers of the Keiskie population are also longer, ± 4 mm, compared with 2.3-3.5 mm for I. rapunculoides. These plants merit further investigation.
            textZh: SANBI 条目提供了 Ixia rapunculoides Redouté 的鉴别特征。
