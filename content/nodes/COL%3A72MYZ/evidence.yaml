          title: Lonchocarpus guatemalensis Benth., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Tree 3-20 m. high. Leaves 5- to 9-foliolate; leaflets elliptic to oblong or ovate, 3.5-11 cm. long, 2-5 cm. wide, subcuneate to rounded at the base, abruptly acumi- nate to an obtuse apex, subcoriaceous, pellucid-punctate, glabrous. Racemes axil- lary, solitary or fasciculate, 3-14 cm. long. Flowers appearing with or before the new leaves; calyx cupulate, 4.5-5.5 mm. long, gray-sericeous; petals pale lavender shading to white toward the claw; vexillum suborbicular, 10-13 mm. long, more or less truncate at the base, emarginate at the apex, sericeous without; wing petals oblong, prominently auriculate, the claw 4.5-5 mm. long, the blade 8 mm. long. Legumes stipitate, thin, flat, 7-12 cm. long, 1.5-3 cm. wide, 1- to! 3-seeded, narrowed at both ends, glabrous, pale brown, the upper margin dilated and deeply sulcate be- tween the valve-margins.
