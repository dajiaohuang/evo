        usage:
          title: Ardisia dwyeri Lundell, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrubs, ca. 3 m high, branchlets furfuraceous, rigid, slender to thickish. Leaves petiolate, the petioles stout, 5-10 mm long, canaliculate, densely fur- furaceous on the lower side; leaf blades chartaceous to subcoriaceous, brownish beneath, grayish above, oblong or narrowly elliptic-oblong, 6.5-13 cm long and 2-3 cm wide, acute, apically and basally, the margin entire, persistently brown-lepidote beneath, glabrate above, the midvein narrowly impressed above, prominent beneath, the primary lateral veins slender and inconspicuous. In- florescences small, terminal, bipinnately paniculate, 3.5-6.5 cm long, densely furfuraceous, brown, the bracts small, scale-like. Flowers umbellate, 5-merous; pedicels thick, 3-5 mm long, sparsely lepidote; sepals asymmetrical, depressed- orbicular, 1.7-2 mm long, rounded apically, ciliolate, conspicuously punctate with red marginal and black medial glands; corolla glabrous, ca. 6.5 mm long, the petals connate basally, the campanulate tube 1.7-2 mm high, the petals oblong-elliptic, symmetrical, black-punctate; stamens attached medially to the corolla tube, the filaments thick, ca. 1.6 mm long, the anthers thick, lanceolate, widest basally, ca. 2.8 mm long, glandular-punctate dorsally, the glands inconspicuous, but blackened; ovary glabrous, the ovules pluriseriate, numerous the style slender, punctate, ca. 4 mm long. Fruit subglobose, ca. 8 mm in diameter.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 8175
