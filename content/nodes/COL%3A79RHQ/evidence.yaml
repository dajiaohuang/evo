        usage:
          title: Sauvagesia elata Benth., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Herbs, woody or shrubby, up to 1 m. Leaves with the petioles 3-5 mm long; blades lanceolate, the middle ones usually 6-12 cm long, 1.5-2.5 cm wide, acumi- nate at the apex, glabrous, chartaceous, shiny above, the margin delicately thickened, undulate, the teeth minute, well-spaced, the costa slender, prominulous, the lateral veins slender, crowded, arcuate-ascending; stipules appressed or spreading, the corpus linear or narrowly deltoid, 1-1.5 cm long, striate, the marginal cilia longer than the body, the cilia curled and arachnoid. Inflorescences with the bostryces fasciculate and terminal, extending 6-10 cm beyond the uppermost leaves; pedicels slender, up to 6.5 mm long, the articulation-stalk 1.5-2 mm long. Flowers with the sepals lanceolate to ovate-lanceolate, ca 6 mm long, acute, with a solitary glandular cilium at the apex, this rarely subtended by glandular teeth; petals white, oblong, as long as or shorter than the sepals, retuse at the apex, the notch with 1-3 glandular cilia; segments of the exterior corona filamentous, scarcely swollen at the apex, in 1-3 continuous whorls, the innermost whorl up to 2/5 the length of the interior corona; segments of the interior corona obovate or oblong, up to 4 mm long, the median ridge conspicuous, the veins prominent and flabellate; stamens oblong or almost subulate, ca 2/5 the length of the interior corona, the filaments short; ovary ovate or flask-shaped, the style short, crassate, constricted basally, slightly longer than the ovary. Fruits subrotund, equal to or exceeding the sepals in length.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 8520
