          title: Desmodium campyloclados Hemsl., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Sprawling herb to slender straggling shrub, to 3 m or more, branches slender and elongate; stem and branches striate, soft pubescent with upwardly appressed pilosity. Leaves trifoliolate, stipulate, petiolate; stipules ovate attenuate, the slen- der apex equaling or exceeding the basal portion, stramineous, striate, pilose on the abaxial surface, ciliate, not persistent, 5 mm long, 1.5 mm wide; petioles sulcate, striate, with upwardly appressed pilosity shorter than that of stem, 2.5- 5 cm long; leaf rachis similar, 1.5-2 cm long; stipels lance attenuate, puberulent and ciliate, 2.5-3.5 mm long; petiolules darker, stouter than the leaf rachis, spreading pilose, 2-3 mm long; leaflets mucronulate, thin, moderately appressed pilose on both the surfaces, the terminal leaflet ovate, obtuse at apex, cuneate at base, 6-6.7 cm long, 3-4 cm wide; lateral leaflets similar or somewhat rounded At the base, 5-5.5 cm long, 2.5-3 cm wide. Inflorescence axillary, racemose, lax; rachis spreading pilose and puberulent; pedicels borne in bracteate fascicles of 3-many with 2 lateral flowers developing first, the central 1 following, etc.; bracts early deciduous, the primary bracts narrowly ovate attenuate, striate, ciliate, puberulent and pilose over the abaxial surface, 4-4.5 mm long, 1-1.5 mm wide; secondary bracts similar, smaller, to 1.8 mm long, 0.2 mm wide; pedicels lax, finely puberulent, 12-19 mm long. Flowers with the calyx somewhat puberulent throughout, teeth of both lobes ciliate and somewhat pilose, especially central tooth of the lower lobe, all teeth of lower lobe 3 mm long, the upper bifid lobe 3 mm long; corolla with standard obovate, retuse, cuneate at the base, to 8.5 mm long and 6 mm wide, wings oblong, obtuse, short unguiculate, 7-7.5 mm long, 2.5 mm wide, keel petals narrowly oblong, truncate at the apex, unguiculate ca. 1/3 their length, 8-9 mm long, 2 mm wide. Loment to 5-articulate, stipitate, stipe 3 mm long; articles triangular, the upper suture slightly curved, the lower suture rather deeply indented at isthmi, uncinulate pubescent throughout, to 8 mm long and 4.5 mm wide; mature seeds not seen.
