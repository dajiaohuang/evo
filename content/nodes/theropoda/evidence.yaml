    - subjectId: taxon:theropoda
      claimKind: scientific
      claimType: fossil-range
      statement: Theropoda is displayed at 233.2–66 Ma only as the review's non-avian theropod coverage; living birds and exact global endpoints are outside this claim. The interval is a source-bounded sample window, not a global FAD, LAD, divergence date, continuous occupancy claim or direct-ancestor assertion.
      confidence: medium
      confidenceRationale: Theropoda uses Hendrickx, C.; Hartman, S.A.; Mateus, O. (2015) because the cited pages and locator expose the sampled taxon, specimen or living sequence set. Confidence is medium and applies only to Non-avian theropod record synthesized by Hendrickx et al.; broader endpoints remain unclaimed.
