        usage:
          title: Hyptis recurvata Poit., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Herbs, annuals, slender, lightly pubescent, to 1 m. Leaves ovate to elliptic, acute, crenate, the bases rounded to ? obtuse, to 3 cm long and 2 cm wide, lightly pubescent on both surfaces; petioles ca 0.3(-4) cm long. Inflorescences capitula, ca 1 cm diam, the peduncles slender, ca 1-3 cm long, the bracts filiform to linear, ca 2.5-3 mm long, fimbriolate. Flowers subsessile; calyx tubular, ca 3 mm long, becoming saccate at the base and constricted and distinctly recurved above the middle, pubescent near the orifice, the teeth spinulose, ca 1-1.2 mm long; corolla tube ca 2 mm long, white, the lips ca 0.7-1 mm long, sparsely pubescent; stamens exserted, the filaments glabrous, the anthers 0.2 mm long; style exserted, the branches minute. Nutlets 4, oblong-ovoid, ca 0.8-1 mm long, pale brown.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 6639
