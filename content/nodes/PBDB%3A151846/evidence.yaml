  claim-rationales.zh:
    - 白海金伯拉虫样本的分类字段只陈述所引研究与导航范围；不会把矩阵位置、数据库映射或样本相似性改写为直系祖先。
    - 白海金伯拉虫样本的地理字段限于具名样本或明确模型范围，不外推为全球分布、起源中心或完整扩散路径。
    - 白海金伯拉虫样本的生态字段区分保存事实与功能推断；未被直接记录的饮食、行为、栖息地偏好和性能均保留不确定性。
    - 白海金伯拉虫样本的形态字段限于主研究列明的标本、样本或分析，并连接到精确页码、图版或补充材料。
    - 白海金伯拉虫样本的年代范围是有界的标本、地层或模型投影，不作为全球首现、末现、分化时间或连续谱系时长。
  claim-statements.zh:
    - 白海样本中的 Kimberella quadrata 显示出软体动物样特征，但本档案不据此判定其属于冠群软体动物或具有直系祖先关系。
    - 本档案限于所引白海化石组合，不将其视为 Kimberella 的完整分布。
    - 移动底栖摄食方式是根据体形及相关表面推断的；食物和齿舌摄食机制并未直接保存。
    - 超过 35 件标本记录了两侧对称的身体、宽阔的足样区域及未矿化的背部覆盖层。
    - 558–555 Ma 包络代表所引白海样本，并非该物种的全球延续时长或软体动物首现。
