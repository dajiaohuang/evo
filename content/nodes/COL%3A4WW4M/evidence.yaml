        usage:
          title: Serjania paucidentata DC., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Lianas; stems glabrous, 6-ribbed but 3 ribs more prominent, sulcate when young, glabrous; wood composite, usually with 3 small, terete, peripheral bundles. Leaves biternate, glabrous, 8-15(-26) cm long; petioles 1.5-4(-8) cm long, cana- liculate on upper surface; rachis narrowly winged; leaflets narrowly elliptic to oblanceolate, acute to acuminate and often deeply incised on both sides beneath the acumen, attenuate at the base, 3-13 cm long, 1.8-5 cm wide, thick, mostly entire except for a few crenate, often glandular teeth near the apex, the acumen blunt with a gland-tipped apiculum. Inflorescences terminal or usually axillary and borne on tendrils, slender, to ca. 20 cm long; rachis weakly tomentose; pedi- cels densely tomentose, to ca. 1.5 mm long. Flowers white, to 4.5 mm long; sepals ovate to obovate, densely tomentose without, glabrous within, to 2 mm long; petals narrowly obovate, glabrous, to 4.3 mm long, the anterior scales ca. 3/4 as long as petals, stiffly pubescent on margins, the deflexed appendage slender, ex- tending down to about the middle of the scale, densely stiff-pubescent through- out, the crest slightly bilobed, orange, equalling the length of the deflexed ap- pendage; disc glands 2 or 4, semicircular, nearly glabrous; stamens villous, flattened; staminate flowers with the stamens to 4 mm long, the pistil minute, 3-sided, hispid at the apex. Fruits narrowly ovate-cordate, weakly constricted below the seed-bearing part, 2.3-2.8 cm long, sparsely hispidulous on the wing, densely brown-hispid on the seed-bearing part.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 12560
