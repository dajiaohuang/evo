        usage:
          title: Rufodorsia minor Wiehler, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Epiphytic herbs; stems erect but becoming decumbent, to 50 cm long, green or reddish, strigillose toward the apex, glabrescent below; adventitious roots at the nodes. Leaves nearly equal in a pair, ovate, elliptic or oblanceolate, 1.5-4.6 cm long, 0.9-2.0 cm wide, membranous, the apex acute to rounded, the base acute to cuneate, serrulate, above medium green, sericeous with whitish hairs, below lighter green, pilose; petioles to 1.2 cm long, sericeous or pilose. Inflorescences axillary few-flowered condensed cymes, the peduncles 3-4 mm long, sericeous; bracts leaflike, ovate or rotund, ca. 8 mm long; pedicels ca. 2 mm long. Flowers inconspicuous; calyx lobes distinct, elliptic, serrulate, unequal, light green, seri- ceous or pilose, the posterior lobe larger, 7-9 mm long, 3-4 mm wide, the other lobes slightly smaller; corolla white or cream, the upper side of the throat and the limb reddish with reddish spots on the lower side of the throat, the tube oblique in the calyx, funnelform from a rounded spurred base, 5-7 mm long, sericeous toward the limb, the limb spreading, 3-4 mm across, oblique with the lower lobe longer, ca. 2 mm long and wide, entire, the upper and the lateral lobes slightly smaller; stamens 4, not exserted, the filaments adnate to the base of the corolla tube, curved, glandular, the anthers oblong, coherent in 2 pairs by their apices; disc reduced to a single bibbed posterior gland; ovary pilose, the style red, glabrous, the stigma stomatomorphic. Berry globose, ca. 5 mm in diam., white, pilose; seeds fusiform or elliptic, striate, dark reddish brown, shiny. Chromosomes n = 9 (Wiehler, 1975).
          originalLanguage: en
          sourceField: general
