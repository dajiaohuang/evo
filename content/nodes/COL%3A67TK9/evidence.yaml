    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Erect, woody shrubs up to ±1 m high, virgate or branched. Rhizome woody; roots tuberous when young, lengthening with age, with an occasional tuber towards growing point. Stems erect, with short internodes, minutely pubescent. Spines short, reflexed, sharp. Cladodes solitary, overlapping, linear, ±(25-)40-65 x ±5 mm, 1-nerved, apiculate, leathery, dark green, margin entire, thickened below. Raceme short, compact, ±20-70 mm long; flowers fascicled or solitary; bracts ovate-acuminate, 5 mm long, membranous; tepals ovate, 3-4 mm long; stalks ±1 mm long, articulated below attenuate flower base. Stamens typical. Ovary with locules ±6-ovuled; globose; style short with 3 short stigmatic lobes. Berry not seen.
