        usage:
          title: Diospyros salicifolia Humb. & Bonpl. ex Willd., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrub or tree to 15 m tall; branchlets tomentellous with short hairs and longer sparser spreading hairs. Leaves chartaceous, drying reddish brown or yellowish brown; lamina to 9 cm long and 4 cm wide, oblanceolate, the apex acute to subacuminate, the base cuneate, the lower surface densely strigose on the midrib, more sparsely so elsewhere, the lateral nerves in 4-6 pairs, indis- tinct, the tertiary nerves and veins forming an indistinct reticulum. Male flowers subsessile in (1-)3(-5)-flowered, shortly pedunculate cymules; calyx to 0.6 cm long, tomentellous outside and inside, the lobes 3, with valvate or open deltate aestivation, as long as the tube; corolla ca. 1.2 cm long, narrowly urceolate, densely strigose outside except for the margins of the lobes, the lobes 3, deltate, 0.3 cm long, 0.15 cm wide; stamens ca. 9, to 0.5 cm long, attached to the base of corolla tube, included, glabrous, the connective long-apiculate; pistillode 0.1 cm long, 0.1 cm wide, densely setulose. Female flowers solitary, in the axils of leaves or of reduced leaves towards the base of current year's growth; pedicel 0.1-0.4 cm long; calyx similar to that in the male flower but to 0.9 cm long and the lobes valvate-reduplicate in young flower; corolla ca. 1.5 cm long, other- wise as in the male flower; staminodes 6, ca. 0.3 cm long, glabrous, attached to the corolla tube, 3 opposite to and 3 alternating with the lobes; ovary 0.3 cm long, 0.2 cm wide ovoid-conoidal, strigillose-tomentellous, the style 0.15 cm long, stout, undivided, ending in 3, fleshy, bi-lobed stigmas, the locules 6, uniovulate. Fruit ca. 3 cm long, 3 cm wide, orange yellow, glabrous, globose; seeds 6, or fewer by abortion, 1.4 cm long, 0.7 cm wide, 0.5 cm thick, reddish brown; endosperm smooth; fruiting calyx accrescent, to 1.5 cm long, cup shaped, shallowly lobed, sparsely puberulous outside, tomentellous inside.
