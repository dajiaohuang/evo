        claims:
          - text: Cormous geophyte, 25-70 cm. Leaves linear. Flowers white or pink, tube narrowly funnel-shaped, ± filiform below.
            textZh: Ixia orientalis L.Bolus 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 7123; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: One of only two species of the genus that extend outside the Greater Cape flora region (the other being Ixia marginifolia), I. orientalis is a relatively unspecialised species lacking any outstanding features, thus difficult to diagnose. It can be identified by the combination of branched stems, spikes often with seven or more flowers, four to six leaves (rarely only three), none completely sheathing the stem, and small, pink or white flowers. The perianth tube, 8-12 mm long, is narrowly funnel-shaped with the proximal half to two thirds always extremely narrow. Well-grown specimens have stems with 2 to 4 branches and the main spike usually bears 7 to 12, rarely up to 16 flowers, although in plants from the mountains of the southern Cape the stems may be unbranched and the spikes have fewer flowers. Typical plants from Eastern Cape have the largest flowers, with the tube 12 mm and tepals ± 14 mm long, but to the west, particularly around Caledon, flowers are smaller, sometimes with a tube only 8 mm long and tepals ± 10 mm long, but there seem to be no other differences and the pattern of variation lacks clear discontinuities so that it is impossible to recognise infraspecific taxa. Late flowering, I. orientalis is seldom seen before the middle of September, although there are records as early as August. It may be most closely related to the largely montane Western Cape species, I. odorata, which typically has slightly smaller flowers, usually yellow, rarely white, with a strong sweet scent and distinctive, relatively short filaments up to 3 mm long (measured to the base of the anthers), and the style dividing between the base and apex of the filaments. This contrasts with longer filaments, up to 6 mm long, and a style usually dividing between the base and upper third of the anthers (rarely shortly below the filaments) in I. orientalis. It is also difficult to distinguish from I. flexuosa (sect. Ixia) without careful dissection. Both may have a perianth tube of similar length, with a relatively short, wider distal portion, a style often dividing opposite the bases of the anthers, and many-flowered spikes.
            textZh: SANBI 条目提供了 Ixia orientalis L.Bolus 的鉴别特征。
