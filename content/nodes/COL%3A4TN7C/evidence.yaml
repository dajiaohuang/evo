        usage:
          title: Ruellia inundata Kunth, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Herbs, sometimes suffrutescent, erect to 1.5 m; younger stems quadrangular and puberulent or puberulent glandular and with scattered long hairs, the older stems scattered pilose to glabrous. Leaves ovate to ovate lanceolate, to 15 cm long and 7.5 cm wide, apically acuminate, basally acute to attenuate, dense to sparingly hispidulous on both the surfaces, the margins repand crenulate, sometimes entire in the smaller leaves; petiole to 8 cm long, pilose. Inflorescences axillary, ascending, dichotomously branched, often forming a dense panicle, glandular pubescent; bracts to 9 mm long and 3 mm wide; flowers sessile. Flowers pink to purplish, with the calyx to 1.7 cm long, glandular pubescent, the segments linear with one segment conspicuously longer than the rest; corolla to 2.5 cm long, 1.5 cm across at the limb, the lobes to 5 mm wide, rounded; stamens included. Capsule clavate and flattened, to 8 mm long, glabrous, 2-4 seeded.
