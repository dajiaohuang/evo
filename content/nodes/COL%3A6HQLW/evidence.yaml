    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Slender, cormous geophyte, 15-60 cm, stems partly exposed, spotted with red below. Lower leaves with long, linear blades. Flowers greenish, blue or yellow, sweet or spicy scented, anther lobes eventually diverging, capsules beaked.
            textZh: Ferraria ferrariola (Jacq.) Willd. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 7487; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Readily recognised by the linear basal leaves, quite different from the shorter cauline leaves, the stem usually partly exposed, and with red-flushed and white-speckled cataphylls and lowermost leaf sheath. The large flowers have a deep and relatively narrow floral cup, 17-20 mm deep and ± 12 mm wide at the mouth. The flowers are usually shades of turquoise-grey to pale slate-blue with a pale yellow nectar guide lightly speckled with darker colour on the limbs of the outer tepals. The flowers have a faint sweet odour, often with spicy overtones of almond, cinnamon or vanilla, unique in the genus. Ferraria ferrariola has been confused with F. parva, which has flowers of similar shape with a narrow floral cup but much smaller, with a floral cup ± 6 mm deep and outer tepals 18-22 mm long compared to (30-)35-40 mm in F. ferrariola. The sheaths and cataphylls of F. parva also lack the red flush and white speckling characteristic of F. ferrariola.
            textZh: SANBI 条目提供了 Ferraria ferrariola (Jacq.) Willd. 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 95228; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
