        usage:
          title: Ruellia macrophylla Vahl, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Herbs to small shrubs; stems erect, quadrangular, glabrous to puberulous. Leaves elliptic to ovate elliptic, 8-20 cm long, 2-6 cm wide, apically acuminate, basally acute, glabrous on both the surfaces, the cystoliths dense and visible on both the surfaces, the margins undulate or shallowly crenate; petioles 0.5-2 cm long, glabrous to sparingly puberulous. Inflorescences in axillary peduncled cymes, the peduncles subquadrangular, to 13 cm long, glabrous, often with flowers in the forks; bracts subtending the flowers lanceolate, 2-16 mm long, 1-2 mm wide, those subtending the branches of the inflorescence somewhat larger, all glabrous; pedicels 1-3 mm long, glabrous. Flowers with the calyx campanu- late, 7-9 mm long, coalesced for ca. o of its length, the lobes subulate to sub- ulate linear, of unequal lengths, 2-4 mm long, sparingly puberulous, the mar- gins minutely ciliolate; corolla red, to 4 cm long, sparingly puberulous, the tube salverform, to 3 cm long, 2 mm wide at the base, 6.5 mm wide at the mouth, the lobes oblong, ca. 10 mm long, 5 mm wide, apically rounded; stamens exserted, the anthers 3 mm long, 1.5 mm broad, short spurs ca. 0.25 mm long at the base of each cell, the filaments glabrous; ovary glabrous, the style puberulous. Capsules clavate, 14 mm long, 4 mm broad, the stipitate base 4-5 mm long, glabrous, 16-seeded; seeds reddish brown, lenticular, 3 mm broad.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 91
