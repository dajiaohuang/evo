        usage:
          scope:
            en: The study combines molecular data from living cycads with morphology scored from living and fossil leaf taxa, including 60 fossil species. Its dating and biogeographic conclusions are outputs of sampled trees and models. They do not independently establish a direct fossil first appearance, a complete global distribution or a single cause of diversification.
            zh: 该研究将现生苏铁的分子数据与现生及化石叶类群的形态编码结合，其中包括 60 个化石种。其年代和生物地理结论来自特定取样树与模型，并不能独立确立直接观测到的化石首现、完整全球分布或单一多样化原因。
