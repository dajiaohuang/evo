    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Like Q. linearis but larger, to 30 cm, and stems purplish to greyish green. Flowers usually in dense clusters opening simultaneously, reddish in centre with shiny blackish purple tips, papillate around mouth, inner corona lobes scarcely exceeding anthers and adpressed to them.
            sourceIds:
              - sanbi_14102_0
            locator: "SANBI/WFO archive Morphology row 9768; source 14102.0; publication: Bruyns, PV. 2012. Apocynaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 331 - 343. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Specimens of Q. ramosa form shrubs rooted by a central stem and may reach 300 mm tall and broad. In this species branches will root in cultivation, but this happens slowly and with difficulty. Plants are usually densely branched somewhat above the base. The stems of Q. ramosa are most unusual and their unmistakeable shape was very accurately portrayed by Masson, who figured this species for the first time in his book Stapeliae Novae. The four thick and rounded continuous angles are made up of obscure, rounded and rather ‘mammose’ tubercles which are practically devoid of an apical tooth. Young stems are greenish but soon they become grey and most of the plant has this grey colour, looking rather like pieces of old wood. It is from this that the popular name ou ram or ‘old goat’ is derived. In Q. ramosa the flowers are produced towards the apices of the stems on quite conspicuous peduncular patches and they usually open together in dense clusters. They have a strong and unpleasant smell of sheep or buck urine. The corolla lobes are strongly folded down the middle but rarely spread out very far, mainly because of congestion in the inflorescence. They are dark purple-black both inside and outside with the outside fairly shiny. On the inside they are not at all shiny, becoming densely papillate towards their bases and in the mouth of the tube. The tube, which is cup-shaped and about twice as deep as the height of the gynostegium, is white with dark spots and is slightly thickened around the mouth. In Q. ramosa the gynostegium is broader than tall, with very small outer lobes along the sides and with the inner lobes just covering the anthers. Quaqua ramosa is clearly closely related to Q. mammillaris and Q. arenicola and all these species have flowers which are hard to distinguish between. They are most easily separated vegetatively, with the unusual stems of Q. ramosa making it unmistakeable.
            textZh: SANBI 条目提供了该种的鉴别特征。
