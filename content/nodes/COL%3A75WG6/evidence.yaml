        usage:
          title: Pavonia alba Seem., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Herb or suffrutex up to 2 m high, the stem slender, cinereous-puberulus, the short, simple or stell-a-te- hairs sometimes intermixed with long, simple hairs. Leaves rather long-petiolate, the petiole slender, up to 4.5 cm long, puberulus to more or less shortly villous and sparsely long-hirsute, the stipules subulate; blade ovate to lanceolate, rounded to cordate at the base, acute to acuminate at the apex, coarsely crenate-serrate at the margin, up to 8 cm long and 3.5 cm wide, 3(-5)-palminerved, sparsely puberulus and mostly with simple hairs above, more or less pubescent and with appressed stellate hairs beneath, the main veins slightly prominent beneath. Flowers solitary in the upper leaf axils, forming elongate, leafy, much-branched panicles, the pedicel elongate, very slender, articulated above the middle, up to 2-3.5 cm long, shortly villous and hirsute; epicalyx of 6-8 bractlets, these distinct, more or less linear, acute, 4-8 mm long and 0.5-0.8 mm wide, minutely puberulus and hirsute-ciliate; calyx lobed to about or to below the middle, usually about 12 as long as to sometimes nearly equalling the epicalyx, 3.5-5 mm long, hirsute, the lobes deltoid-ovate, acute; petals 4-8 mm long, white; staminal tube about 12 as long as the corolla, lobulate, antheriferous throughout; style slightly longer than the staminal tube. Mericarps triquetrous-obovoid, rounded and muticous at the apex, dorsally convex, ca 2.5 mnm long, with an inconspicuous, longitudinal rib dorsally, otherwise nearly smooth and glabrous, very dehiscent; seeds reniform, ca 2 mm long, minutely puberulus.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 7372
          archiveSourceId: D41A4FC7-B8B2-4B9A-B0D7-DC38CB3B1C81
