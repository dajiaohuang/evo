    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Well-branched shrublet, to 40 cm. Leaves bipinnate, < 20 mm long, leaflets 2- or 3-lobed, with recurved apices. Flowers yellow, in small, compound, flat-topped umbels, peduncle long, sepals relatively large. Fruit elliptic, mericarps dorsally compressed, dorsally ribbed, marginally winged, homomorphic, vittae present, without additional rib vittae, rib oil ducts inconspicuous.
            sourceIds:
              - sanbi_14097_0
            locator: "SANBI/WFO archive Morphology row 9308; source 14097.0; publication: Magee, AR; Manning, JC; van Wyk, B-E; Tilney, PM. 2012. Apiaceae: Notobubon Magee. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 329 - 330. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: The strong anise-scent, which becomes immediately discernible as one nears the plant, is a very notable characteristic of this species. It can be attributed to the presence of estragole as the dominant compound (78-97%), found only within this species in the genus. It is most closely related to N. collinum with which is shares the 2- or 3-cleft or 2-lobed ultimate leaflet segments, scabrous umbels, and fruit with narrow commissural vittae and no additional vittae under the ribs. It is however readily distinguished by the much larger habit, ca. 1 m tall (0.2-0.4 m in N. collinum), the subterete leaf lobes (flattened in N. collinum), the longer, more divided leaves with 4 to 6 pairs of lateral pinnules along the rachis (only 2 or 3 pairs of lateral pinnules along the rachis in N. collinum) and the small sepals (relatively large in N. collinum).
            textZh: SANBI 条目提供了该种的鉴别特征。
