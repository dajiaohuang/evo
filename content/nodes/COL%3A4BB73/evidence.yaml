    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Geophyte, up to 400 mm tall. Bulb ovate to ovoid, with a contractile root, clear apical beak present, beak a third to half of total length, 25-35 x 20 mm, tunics irregularly longitudinally ridged due to large internal channels, sclerenchymatous, dark brown to blackish, glabrous, surface finely reticulate. Rhizome vertical, up to 70 mm long, thickening conspicuously at ground level, sparsely glandular-hairy, adventitious roots arising along entire length, upper rhizome nodes with pale, glabrous, semi-amplexicaul scales; sheath absent. Aboveground stem present, 20-100 mm long, semi-succulent, glabrous, nodes with 1-2 scales or cauline leaves. Leaves 10-20 per plant, apically congested, trifoliolate, bright green; petioles 20-60 mm long, with prominent basal articulations, sparsely covered with simple hairs; leaflets distinctly petiolulate, obcordate, 7-13 x 8-18 mm, adaxially sparsely hairy along main veins, abaxially sparsely hairy, becoming more hairy towards base, margin sparsely hairy. Peduncles 1-4 per plant, each with 6-11 terminal flowers, at least three times as long as petioles, up to 250 mm long, twice as thick as petioles, semi-succulent, glabrous; bracts many, 4-6 mm long, distinctly callose on upper margins for up to half of bract length, sparsely hairy abaxially, linear to linear-lanceolate, with acute tip. Pedicels slender, sparsely hairy, 8-20 mm long when mature. Sepals of unequal length, 4-9 x 1-2 mm, linear-lanceolate, apex acute, mostly with two small, distinct orange calli, sparsely hairy. Corolla 17-20 mm long, white with funnel-shaped light yellow tube, tube about half the length of corolla, petals oblanceolate, apex truncate with margin finely irregular, glabrous, ecallose. Stamens in 3 series, 2 series per plant, the shortest level 3-4 mm, the middle level 3.5-4 mm and the longest level 7.5-8 mm long, basally connate; anthers oblong, yellow to orange; filaments pale, with simple hairs along entire length; filament teeth 1.8-2 mm long from base, apically acute. Ovary 2 mm long, narrowly ovoid, densely hairy on upper half, with few scattered hairs on lower half, 5-locular with 20-22 ovules per locule; styles 5, separate, in three series with one series per plant, shortest level 3.5 mm long, middle level 4.0 mm long, longest level 7.5 mm long, erect, densely hairy; stigmas green, fimbriate. Fruit an elongate capsule extending well beyond the sepals, up to 15.0 mm long. Seeds with endosperm.
