    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte to 12 cm, tunics soft, evidently concentric, unbranched. Leaves plane, the lower horizontal and prostrate. Flowers in 1- or 2-flowered spikes, pink, greenish in throat, tepals widely cupped.
            textZh: Geissorhiza altimontana Goldblatt & J.C.Manning 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 6831; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: With its five or six relatively short leaves, the basal with horizontally spreading blades, low stature and 1- or 2-flowered spikes, Geissorhiza altimontana appears most closely allied to the Swartberg species, G. nigromontana and G. uliginosa. Geissorhiza uliginosa is essentially aquatic, growing in streams and waterfalls, and has reduced corms, but G. nigromontana has a similar habitat to G. altimontana, viz.; damp, mossy ledges in shallow soil and south-facing slopes, and both species flower in the summer months of January and February. The longer perianth tube, 7-8 mm long, and tepals ± 14 mm long, readily separate G. altimontana from G. nigromontana, which has a very short perianth tube, 2-3 mm long, and tepals 14-16 mm long.
            textZh: SANBI 条目提供了 Geissorhiza altimontana Goldblatt & J.C.Manning 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 94653; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
