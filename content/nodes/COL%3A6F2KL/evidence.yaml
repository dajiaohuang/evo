    facets:
      morphology:
        status: partially-supported
        claims:
          - text: A robust stoloniferous perennial with tufted culms from a contracted base. Stolons to 30 cm long and 6 mm thick with 5-8mm long sheaths covering only the bases of the 3-8 cm long internodes. Culms 40-120 cm long and 4-8 mm thick when mature but contracted to 2-3 mm immediately below the inflorescence, rounded and hollow, transversely septate at 3-10 cm intervals; surface (at least when dry) with small irregular notches and furrows. Sheaths closed, to 1/3-1/2 the culm height, greyish to brown and ending in a triangular lobe with a narrow transparent margin and a wider dark purple border or dark dotted area inside the transparent margin; 3-4 Lateral veins joining the central vein immediately below the apex. Spikelets lanceolate-cylindric, 2.5-5.0 cm long and 2-6 mm wide, much narrower than the culm, but some culms often with the spikelet aborted, leaving only a scar, Lowest glumes scale-like but much shorter than the upper, with a wide transparent margin. Glumes 4-6 mm long, very thick and closely overlapping, pale brownish or straw-coloured; marginal border thinner and transparent; apex rounded; midrib obscure at least in mature glumes. Perianth of about 7 long and slender bristles densely set with short and recurved spine-like teeth. Stamens 3; anthers elongate, apiculate. Style with 2-3 style-branches. Nutlet smooth, about 2 mm long (excluding the long, triangular, brown appendage).
