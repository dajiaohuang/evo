    facets:
      morphology:
        status: not-assessed
        claims: []
        gaps:
          - This calling-rate experiment does not assess morphology or diagnostic variation.
      lifeHistory:
        status: partially-supported
        claims:
          - text: In paired field recordings from a supplementary-feeding experiment at two ponds in the Steigerwald, southern Germany, fed male European treefrogs called at 124±36.9 calls/min compared with 95.5±32.3 calls/min for paired controls (N=8 pairs, p<0.05). Males were temporarily held for 12 hours during treatment, and recordings were made 1–31 nights after treatment in 2002 and 1–2 nights after treatment in 2003. This small, site- and treatment-specific result does not estimate natural population-wide calling rates or demonstrate female preference or mating success.
            textZh: 在德国南部施泰格瓦尔德两处池塘进行的补充喂食野外实验配对录音中，补充喂食雄性欧洲树蛙的鸣叫率为每分钟 124±36.9 次，配对对照组为每分钟 95.5±32.3 次（N=8 对，p<0.05）。处理期间个体被暂时置于容器中 12 小时；2002 年在处理后 1–31 个夜晚录音，2003 年在处理后 1–2 个夜晚录音。这个小样本、特定地点和处理条件下的结果不能估计自然种群的总体鸣叫率，也不能证明雌性偏好或交配成功。
            originalLanguage: en
            sourceIds:
              - meuche2009hyla
            locator: Results, Calling rate and Figure 3; Methods, General methods, Feeding experiments, and Recording of calls.
            placeTimeScope: Two breeding ponds in the Steigerwald, southern Germany; the study followed animals during 2002–2003. Calling-rate comparisons used paired recordings from the field, recorded 1–31 nights after treatment in 2002 and 1–2 nights after treatment in 2003.
            lifeStatus: Wild male frogs captured at breeding ponds for an experiment; animals were temporarily held in ventilated boxes for 12 hours during feeding/control treatment before field calling observations.
        gaps:
          - A small paired calling-rate experiment at two ponds does not establish natural population rates, geographic or annual variation, female preference, mating success, or a complete life-history account.
      ecology:
        status: not-assessed
        claims: []
        gaps:
          - One supplementary-feeding experiment at two ponds does not establish the species' wider ecological relationships or habitat requirements.
      evolution:
