        claims:
          - text: Cormous geophyte, 8-24 cm, corm with a flat base. Leaves sword-shaped. Flowers pink to purple, occasionally yellow.
            textZh: Hesperantha pauciflora G.J.Lewis 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 6682; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Typical pink to purple-flowered Hesperantha pauciflora is recognised by the flat-based, bell-shaped corms with radiating marginal spines and an aerial stem up to 200 mm high. The flowers are large and attractive with tepals 18-26 mm long and a short perianth tube 6-11 mm long. Plants from Namaqualand have dark pink to purple flowers with a white throat, stamens with filaments 4-8 mm long, anthers 6.5-9.0 mm long, and the style branches reaching the anther tips or exceeding them by up to 2 mm in the closed flower. On the Bokkeveld Escarpment, ± 100 km south of the nearest Namaqualand populations, the flowers are either uniformly pale to deep pink, or often with darker pigmentation at the base of the tepals and in the throat, and the stamens in these populations have filaments only 2-3 mm long, with anthers 7-9 mm long, and the style branches barely reach the anther tips or up to 2 mm below them. Plants with pale yellow flowers from the south of its range at Papkuilsfontein south of Nieuwoudtville are included here, expanding the range of variation in H. pauciflora. They appear to differ in no other significant way from the pink-flowered populations and have identical bell-shaped corms with prominent radiating spines, spikes of only 2 to 4 flowers, and submembranous bracts, dry near the tips. The flowers also have the same daily opening and closing pattern. The flowers of Hesperantha pauciflora open on warm days after 13:00 and close again after 17:00.
            textZh: SANBI 条目提供了 Hesperantha pauciflora G.J.Lewis 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 94880; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
