    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Glabrous, herbaceous, annual or perennial twiner. Stems up to at least 1 m long. Leaves pseudostipulate (pseudostipules resembling leaves but much smaller), orbicular in outline, 20-60 mm in diameter, deeply palmately 5-lobed, outer lobes usually bilobed; lobes elliptic to lanceolate, entire, apex obtuse, apiculate, base narrowed; petiole 40-50 mm long. Flowers axillary, solitary or cymosely 2- or 3-flowered; peduncles 40-50 mm long, very slender; bracteoles minute; pedicel 17 mm long, ± clavate. Sepals subequal, edges membranous, elliptic to orbicular, apex obtuse or rounded, mucronulate, 2-5 mm long, often tuberculate. Corolla funnel-shaped with subcylindric tube, purplish mauve, 10-18 mm long and spreading limb as wide. Capsule subglobose, glabrous, 8-10 mm long. Seeds subglobose, 5-6 mm long, brown, pubescent and with 5-10 mm long white hairs on edges.
            sourceIds:
