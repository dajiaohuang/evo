            locator: "SANBI/WFO archive Morphology row 85203; source identifier 15933.0; cited publication: Goldblatt, P; Manning, JC. 2012. Systematics of the southern African genus Ixia (Iridaceae): 4. Revision of sect. Dichone. Bothalia 42(2): 87 - 110. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Ixia altissima is a surprising plant, sometimes standing over 1 m in height and flowering late in the season, well into December. The anthers with vestigial connective and the involute style branches, stigmatic only at the tips, indicate its placement in sect. Dichone but the funnel-shaped perianth tube with the filaments inserted in the middle of the upper part of the tube is unusual for the section, most species of which have the tube virtually filiform throughout with the filaments inserted at the apex of the tube. The perianth tube, only ± 4 mm long, and the pale floral bracts are reminiscent of two Roggeveld Escarpment species, I. trifolia and I. rigida, the latter also flowering relatively late in the season, often in November. These species share relatively unspecialized, longitudinally dehiscent anthers. I. altissima seems most like I. rigida, also a tall plant, up to 600 mm high and sometimes flowering as late as November. The latter has flowers with a similarly funnel-shaped perianth tube 2-3 mm long and silvery translucent floral bracts, contrasting with the slightly longer perianth tube, ± 4 mm long, and shorter anthers, just 3 mm long, in I. altissima, which is also unusual in the section in having the style dividing opposite the middle of the anthers. A conservation status for I. altissima is suggested as Rare (R), in light of its evident rarity, but there is no current threat to the species.
