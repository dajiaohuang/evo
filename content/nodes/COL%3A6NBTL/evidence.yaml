    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants 0.9-1.2 m high, stem surrounded at base by membranous cataphylls, simple or with 1-2 branches subtended by translucent, attenuate bracts and prophylls up to 8 mm long. Corm 15-18 mm diam., mature tunics not known. Leaves 4, lower 3 ± basal, reaching to ± middle of stem, blades linear to linear-sword-shaped, (3-)4-10 mm wide, firm-textured, margins and midrib and often a pair of secondary veins thickened and hyaline (at least when dry), uppermost leaf largely sheathing. Spike erect, elongate, weakly flexuose, 14-20-flowered, lateral spikes 6-14-flowered; bracts dry, membranous, translucent, flecked with brown in upper half, outer ± 7 mm long, usually with 3 prominent veins and 3-toothed, inner bracts ± as long as outer or slightly shorter, 2-veined and 2-toothed. Flowers rotate, mauve-pink; perianth tube narrowly funnel-shaped, ± 4 mm long, filiform and clasping style below, flared in distal ± 2 mm; tepals spreading, oblong-ovate, 12-13 x ± 4 mm. Stamens symmetrically disposed, erect; filaments filiform, inserted just above narrow part of tube, ± 4 mm long, ± white; anthers oblong, ± 3 mm long, erect, dehiscing fully by longitudinal slits, yellow. Style dividing opposite middle of anthers, branches ± 2 mm long, falcate, pale yellow, tubular, stigmatic apically, arching outward between or shortly overtopping anthers.
