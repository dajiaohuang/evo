          - text: A tall plant, sometimes standing over 1 metre high and flowering late in the season, well into December, Ixia altissima has anthers with the vestigial connective and involute style branches, stigmatic only at the tips, characteristic of sect. Dichone but the funnel-shaped perianth tube with the filaments inserted in the middle of the upper part of the tube are unusual for the section, in which other species have the tube virtually filiform throughout. The perianth tube, only ± 4 mm long, and the pale floral bracts are reminiscent of two Roggeveld species of the section, I. rigida and I. trifolia, the former also flowering relatively late in the season, often in November. Both share with I. altissima relatively unspecialised, longitudinally dehiscent anthers. Ixia altissima seems most like I. rigida, also a tall plant, up to 600 mm high, which has flowers with a similarly funnel-shaped perianth tube 2-3 mm long and silvery-translucent floral bracts. This contrasts with the slightly longer perianth tube, ± 4 mm long, and shorter anthers just 3 mm long in I. altissima, which is also unusual in the section in having the style dividing opposite the middle of the anthers.
