    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants arising from perennial, dome-shaped tubers up to 13-15 x 8-10 mm, with a number of spreading wedge-shaped roots emanating from a flat base. Leaves usually 4, erect until beginning to wither, linear terete, translucent shiny green, the longest flattish towards base on adaxial surface, ca. 80 x 3 mm with a broader sheathing base ca. 20 x 4 mm, shorter leaves mainly terete and ca. 40 x 1.2 mm, also with sheathing bases; as leaves wither, basal leaf sheaths tighten into a narrow cylinder, up to 35 x 2 mm, clasping developing peduncle, eventually leaves dry off completely as the inflorescences begin to mature; leaf epidermis with minute elongated, raised, horizontal bands of cells. Flowers hysteranthous, 6-20 in a solitary lax raceme, occasionally a second appears; peduncle up to 145 mm including inflorescence, rising from a narrow cylindrical sheath 30-45 x 1.5-2 mm. which elongates as the inflorescence matures and the leaves wither; flower bract 1.2 x 1 mm, elongated, triangular, acuminate with a broad base wrapping around the pedicel, pedicel ca. 7 x 0.5 mm. Flower with outer whorl of tepals swept backwards reaching the peduncle, lanceolate, obtuse, 7 x 2 mm, inner whorl only slightly reflexed, narrowly ovate, obtuse 7 x 4 mm, all tepals light pale yellow with a very fine green mid vein. Filaments slender, bearded, all ca. 6 x 0.3 mm, outers with a single, very dense cushion of glandular hairs towards the anthers and lowest decurved with anther 0.8 mm across, rest of outer anthers ca. 0.5 mm across, inners with an elongated cushion of hairs covering the mid two thirds of the filament, all curving outwards with anthers 0.5 mm, glandular hairs 1 mm long with apex bulbous. Ovary globose, green, 1 mm in diameter; style and stigma about 6 mm long x 0.3 mm, stigma minute. Capsule shiny bronze-green, ovoid, 2 x 1.8 mm, pedicel almost horizontal with a slight upward turn apically, 8 x 0.3 mm. Seed 1 x 0.8 mm, narrowly pyramidal, surface black with low raised humps, all keels on basal two thirds, including base, with very prominent rough jagged serrations and undulations.
