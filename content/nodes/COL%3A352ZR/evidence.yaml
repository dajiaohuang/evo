          originalSourceText: Tall, erect, somewhat woody herbs to almost 3 m high; stem angulate, gla- brescent to densely uncinulate puberulent. Leaves unifoliolate, stipulate, petio- late; stipules early deciduous, ovate attenuate (the slender tip almost 1/2 the total length), striate, puberulent, stiffly ciliate, 3-9 mm long, 0.7-2 mm wide; petioles striate, minutely puberulent, 0.15-1 cm long, stipels lance attenuate, persistent, 1-3.3 mm long, petiolules puberulent and stiffly pilose, 0.5-1.7 mm long; leaflets sparsely to densely uncinulate puberulent on both the surfaces and sparsely stri- gose chiefly on the midrib and the veins of abaxial surface, linear lanceolate, acute and mucronate at the apex, acute at the base, (3-)8-16 cm long, 0.2-0.6 cm wide. Inflorescence racemose paniculate, rachis uncinulate-puberulent and somewhat stiffly pilose; primary bracts each subtending a fascicle of 2-several pedicels, ovate acuminate, striate, puberulent on the abaxial surface, stiffly cil- iate, 1.7-3.5 mm long, 0.5-1 mm wide, each pedicel further subtended by a similar smaller lance acuminate secondary bract 0.8-2 mm long and 0.4-0.5 mm wide; pedicels pubescent as on the rachis, 4-7 mm long. Flowers with the calyx pu- berulent and stiffly pilose, the margins of the teeth of both lobes stiffly ciliate, the upper bifid lobe 2-2.4 mm long, lateral teeth of lower lobe 2-2.3 mm long,
