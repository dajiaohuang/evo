        usage:
          title: Paullinia dasystachya Radlk., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Lianas or scandent shrubs to 3 m tall; stems weakly viscidulous, terete or weakly ribbed, sparsely to densely brownish hirtellous-tomentose; wood simple. Leaves pinnately 5-foliolate, 15-30 cm long; petiole terete, 2.5-6 cm long; rachis terete; both petiole and rachis densely rufous hirtellous-tomentose; leaflets sessile or short-petiolulate, ovate to elliptic or obovate, acuminate to acute at the apex, attenuate to rounded at the base, (3-)6-14 cm long, (1.5-)3.5-8.5 cm wide, coarsely serrate-dentate mostly above the middle with glandular teeth, the sur- faces glistening, sparsely hirtellous above, the pubescence denser on the veins, beneath hirtellous to pilose especially on the veins; stipules lanceolate, to ca. 5 mm long, densely hirtellous on the outer surface, glabrous inside. Inflorescences axillary or terminal on new growth or borne on tendrils; thyrses solitary, 3-14 cm long, densely rufous hirtellous-tomentose throughout; bracteoles similar to the stipules but smaller, to ca. 3 mm long; pedicels densely long-pubescent, ca. 1 mm long. Flowers (Bolivian material) white; outer sepals ovoid, to 2.5 mm long, densely pubescent outside, ciliate, glabrous inside, the inner sepals obovate, to 4 mm long, sparsely pubescent outside, minutely ciliate, glandular inside; petals narrowly obovate, glandular, the anterior scales ca. 3/4 as long as the petals, the basal part as broad as long, densely ciliate, the crest deeply bifid, orange, ca. 1.2 mm long, the deflexed appendage broadly rounded, glabrous except on the ex- treme margins, shorter than the crest; disc glands 2, semicircular, densely long- pubescent, almost hidden by the pubescence of the disc; stamens with the fila- ments flattened, densely villous throughout; staminate flowers with stamens to 4 mm long, the filaments united at the base, the pistil minute, densely silky- pubescent; bisexual flowers not seen. Fruits obovate, truncate and apiculate at the apex, acute to attenuate at the base, 3-winged, stipitate, to 2.5 cm long (in- cluding stipe), red, densely brownish hirtellous-tomentose outside, white hirtel- lous-tomentose within, the wings broadest toward the apex, the stipe ca. 5 mm long; seed 1, subglobose, ca. 7 mm diam., black, shiny, glabrous, white-arillate at the base.
