          originalSourceText: Vines; stems slender, herbaceous, annual, glabrous. Leaves 1-9 cm long, ovate to elliptic in outline, deeply pinnatisect with 9-19 alternate or opposite pairs of linear lobes, glabrous. Flowers solitary or in 2-5-flowered cymes; sepals elliptic to oblong, 4-7 mm long, obtuse apically, with a 0.25-0.75-mm-long mucro, glabrous; corollas red or rarely white, 2-3 cm long. Fruits capsular, ovoid, 6-8 mm in diameter; seeds dark to black, with dark patches of short trichomes scat- tered somewhat irregularly.
