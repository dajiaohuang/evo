        usage:
          title: Protium panamense (Rose) I.M.Johnst., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Trees or shrubs, 3-40 m high; branchlets striate, gray-barked, dotted with pale-brown lenticels, youngest parts minutely appressed-puberulent, soon gla- brate. Leaves odd-pinnate, glabrous, the petioles, rachis, and petiolules often glaucous, 23-60 cm long; petioles striate, canaliculate, swollen apically and basally, 6-12.5 cm long; leaflets 3-7(-9), ovate-lanceolate to oblong, elliptic, or ovate, usually abrupty acuminate, rounded basally, coriaceous, the margins entire and repandous, the laterals inequilateral, 10.5-36.5 cm long and 4-12.5 cm wide, the terminals usually largest, to 38 cm long and 15 cm wide; petiolules striate, the laterals 11-32 mm long, the terminals to 85 mm long. Inflorescences compact axillary (occasionally cauliferous?) panicles, or rarely small racemes, branched from the base, glabrous, the carpellate to 7.5 cm long (to 10 cm long in fruit), the staminate to 10.5 cm long. Flowers yellow 4(-5)-merous; pedicels absent to 3.5 mm long in staminate flowers, 1-2 mm long in carpellate flowers; calyx cupuliform, 1.5 mm high, glabrous, 4(-5)-lobed, the lobes obtuse, acute apically, spreading; petals 4(-5), triangular, acute, more or less spreading, in- flexed-apiculate, the margins papillose, 3 mm long, 1-1.5 mm wide; stamens 8(-10), 2 mm long; disc 8(-10)-lobed; ovary conical, 4(-5)-lobed, glabrous,
