    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous herb, up to 0.55 m high. Outer tepals reflexed, 15-20 x 6-10 mm. Inner tepals trilobed with central lobe long and slender, lateral lobes much smaller and obtuse. Flowers creamy yellow with brown to green markings.
            textZh: Moraea trifida R.C.Foster 的 SANBI 物种条目记载了植株、叶片和花部形态。
            sourceIds:
              - sanbi_11118_0
            locator: Strelitzia 6; archive Morphology row 2800, source 11118.0
            placeTimeScope: Regional species account published 1997; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
          - text: One of several eastern southern African species of sect. Vieusseuxia with 3-lobed inner tepals, Moraea trifida is distinguished by the dull-coloured, pale yellow to creamy brown flowers, dotted brown to green. The outer tepal limbs are strongly reflexed and the foliage leaf is distinctive in being inserted well above ground. The dull flower colouring recalls some morphs of the winter-rainfall species, M. unguiculata, but the resemblance is superficial. The foliage leaf in M. unguiculata is basal and the flowers are usually smaller.
            textZh: SANBI 条目提供了 Moraea trifida R.C.Foster 的鉴别特征。
            sourceIds:
