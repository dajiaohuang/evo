    facets:
      morphology:
        status: partially-supported
        claims:
          - text: A much-branched, decumbent shrublet, 0.5-2.5 dm high, sometimes prostrate and mat-forming, glabrous (except for leaf-axils); branchlets short, leafy towards the tips, soon defoliated and clothed with imbricated, triangular, acute-cuspidate, persistent leaf-bases, eventually nude, cicatricose and blackish. Leaves crowded at the branch ends, erecto-patent-reflexed, linear(-narrowly oblong), 3-15 mm long, 3-5-lobed above the middle or sometimes at least some entire, flattened, coriaceous, dull bluish green, with a distinct (esp. towards the base), often dark midvein; rachis and lobes 0.5-2 mm wide; lobes 1-4 mm long, obtuse-subacute, muc-ronate or apiculate; leaf-margins laxly ciliolate at least basally; leaf-base dilated, half-clasping, somewhat keeled in the middle, with thin margins, laxly and sometimes indistinctly arachnose in the axil. Capitula terminal, solitary, sessile or nearly so (peduncles up to 2 mm long). Involucre narrowly-widely campanulate, 3-10 mm wide, 4-8 mm high, coriaceous, brownish or yellowish green. Involucral bracts 5-10, uniseriate, connate to about the middle, distinctly 3-7-veined; the free lobes ovate-lanceolate, 2-4 mm long, 1-3 mm wide, obtuse-acute, with puberulous tips and often denticulate-fimbrillate margins. Receptacle convex, distinctly alveolate. Ray-florets 5-10, yellow. Tube 1.5-2 mm long, cylindrical. Lamina elliptic-oblong, 3.5-7 mm long, 4-veined. Style branches 1-1.5 mm long, obtuse.1 1 In Jacot-Guillarmod 2370 some heads had a few tubular female florets with no traces of anthers and with fertile 2-3-lobed styles. Disc-florets c. 8-25. Corolla 3.8-5.5 mm long. Tube 1.2-2 mm long, cylindrical. Limb narrowly campanulate, 2.6-3.5 mm long; lobes narrowly ovate-triangular-lanceolate, 1-1.5 mm long, with cucullate tips. Anthers 1.7-2 mm long incl. the ovate, acute or subacute appendage. Style terete with swollen base; stylophore short but distinct; style branches 0.7-1 mm long, with slightly convex tips. Pappus bristles numerous, 2-4 mm long, ± erect, white, minutely barbellate. Achenes oblong-obovate-elliptic-oblong, densely silky-villous, incl. indumentum 5-7 mm long and 2-4 mm wide, under the indumentum brown, with c. 8 low ribs; hairs thin, ± straight, 2-4 mm long, white (or light brownish), not mucilaginous when soaked.
