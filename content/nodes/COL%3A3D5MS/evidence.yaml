          - text: E. decumbens is allied to E. montanus, with which it sometimes grows together. The two species are quite distinct, although both are often found under the name E. montanus. Some of the most obvious differences are the decumbent growth, the bluish leaf colour, the less connate involucral bracts, and the pubescent achenes of E. decumbens. Specimens cultivated in greenhouses keep their decumbent growth and characteristic leaf colour.
