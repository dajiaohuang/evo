    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants small, clumped or tufted. Leaves 4-8 per rosette, crowded, thick ovate-lanceolate or linear spatulate. 15-40(-50) x 5-15(-25) mm margins undulate or with 0-3(-5) short whitish stout teeth on each leaf margin, without or with short stout smooth bristles; margins and keel with almost semiglobose epidermal cells; leaf surface smooth, often without obvious white dots, numerous small, dark green subepidermal idioblasts visible, wax rugose; leaf margins and keel at least partially whitish cartilaginous, glossy or shiny fresh green, turning reddish in very sunny conditions. Flower with 70-90 petals; stamens 120-180. Nectaries largely greenish. Fruit stalk mostly absent or (0.5-)2.8-5.8 x 2.0-2.6 mm, 0.7-1.4 mm thick Fruits often easily falling off (tumble fruits), 7.0-11.3 x 6.5-12.0 mm. 7.0-10.5 mm thick; lower half of fruit mostly flattened at one side, or more rarely convex on 2 sides, valves on top of fruit bent downwards in the middle forming a depression there. Seeds 1.35-1.6 x 0.9-1.45 mm.
            sourceIds:
