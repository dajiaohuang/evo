    facets:
      morphology:
        status: partially-supported
        claims:
          - text: The study reports that A. franciscus lacks an external vocal sac and external tympanum; its anatomical and acoustic measurements are specific to the examined material.
            sourceIds:
              - boistel2011
            locator: "Abstract, paragraphs 1–3; Methods: Middle ear biomechanics"
            placeTimeScope: Material and experiments reported in the 2011 species-focused study; no population-wide morphological survey is claimed.
            lifeStatus: Study material is not presented as a representative survey across all wild, captive or developmental states.
            originalLanguage: en
            textZh: 2011 年研究报告，所检查的 Atelopus franciscus 材料没有外部声囊和外部鼓膜。解剖及声学测量仅对应研究材料；不是跨种群或全部发育阶段的形态调查。
        gaps:
          - The study's anatomical observations do not describe all external or internal morphology, variation among populations, or developmental stages.
      lifeHistory:
        status: not-assessed
      ecology:
        status: partially-supported
        claims:
          - text: The authors report field responses by males to conspecific calls in a noisy riverbank environment and measure call propagation at less than 8 m under the study conditions.
            sourceIds:
              - boistel2011
            locator: "Abstract, paragraphs 1–4; Results: Ambient noise and Call attenuation"
            placeTimeScope: Natural-habitat and playback measurements reported in the 2011 study; the authors characterize sound-environment measurements as temporal and spatial snapshots.
            lifeStatus: Field observations concern calling males; they do not establish behaviour across life stages or seasons.
            originalLanguage: en
            textZh: 2011 年研究报告，在嘈杂的河岸环境中，野外雄性会回应同种鸣声；研究条件下测得的鸣声传播距离不足 8 米。声环境测量只是特定地点与时段的截面，不能推广为全分布区、所有季节或发育阶段的行为。
        gaps:
          - The acoustic results are limited to the measured settings and do not establish year-round or range-wide behaviour, habitat selection, or population differences.
      evolution:
        status: not-assessed
      distribution:
        status: not-assessed
      fossil:
        status: not-assessed
      conservation:
        status: not-assessed
