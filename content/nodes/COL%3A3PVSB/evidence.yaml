          originalSourceText: Herb; stems erect, simple or branching from a perennial ovoid to rotund tuberous root, often twining at the tips and reaching 40 cm in length, glabrous or glabrescent. Leaves sessile, dissected into filiform segments, 1-2 cm long, glabrous. Flowers solitary on short peduncles in the leaf axils; sepals oval to broadly ovate, 4-5 mm long, obtuse, aristate, sparsely to densely muricate out- side; corolla bright pink to purple on the upper tube and limb, the lower tube white, 2-2.5 cm long. Fruits capsular, subglobose to globose, 4-5 mm in diam- eter, brown, glabrous, the 4 seeds usually 2.5 mm long, 1.5-2 mm broad, finely pubescent with short reddish-brown trichomnes.
