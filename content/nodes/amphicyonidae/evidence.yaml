      statement: Expanded early-amphicyonid morphology sampling recovers Amphicyonidae as a basal caniform branch outside Canoidea, while exact sister relationships remain unresolved; the family is not a dog–bear ancestor blend or one linear lineage.
      confidence: medium
      confidenceRationale: The primary reappraisal increases early family sampling and explicitly reports alternative placements around the branch.
      referenceLinks:
