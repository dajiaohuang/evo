  claims:
    - subjectId: event:acanthostega-eight-digit-limb
      claimKind: scientific
      claimType: morphology
      statement: Upper Devonian East Greenland limb material documents eight digits in the Acanthostega forelimb, showing that five digits were not the fixed primitive condition and that digit-bearing limbs need not imply terrestrial walking.
      confidence: high
      confidenceRationale: Digit count is a direct observation from described limb specimens, and comparison with seven-digit Ichthyostega and six-digit Tulerpeton robustly rejects a universal primitive pentadactyl condition. The ecological implication is kept as a supported suggestion rather than direct behavioural observation.
      referenceLinks:
        - relation: supports
          referenceId: coates-1990-polydactyly
          pages: 66–69
          quoteLocator: Abstract; specimen descriptions; discussion of digit number and aquatic adaptation
  claim-rationales.zh:
    - 趾数是对已描述肢标本的直接观察，与七趾 Ichthyostega 及六趾 Tulerpeton 比较后，足以否定五趾是普遍原始状态。生态含义仍保持为有支持的推测，不写成直接行为观察。
  claim-statements.zh:
    - 东格陵兰晚泥盆世肢材料记录了 Acanthostega 前肢的八个趾，说明五趾并非固定的原始状态，具趾肢也不必然意味着陆地行走。
