    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Perennial herb, geophyte, 0.9-2.5 m high; stems form large clumps; corm 35-40 mm in diam. Leaves linear, ± acute; radical leaves 550-1500 x 5-15 mm; reduced sheathing leaves 5. Flowering stem 1.1-2.7 m high. Bract white, sometimes with few brownish spots, 18-27 x 7-10 mm, elliptic-lanceolate, acute to acuminate. Inflorescence a raceme of terminal spikes, usually pendulous or suberect, with 6-11 branches. Perianth pink or rarely red, (20-)24-33 mm long; tube (5.0-)8.0-10.5 mm long; tepals 12-23 x 5-10 mm. Anthers (7-)8-10 mm long. Flowering time Oct-May.
            textZh: Dierama latifolium N.E.Br. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_18505_0
            locator: "SANBI/WFO archive Morphology row 90724; source identifier 18505.0; cited publication: Bredenkamp, CL; Magwaza, ZL. 2019. Iridaceae. In: CL Bredenkamp (ed.), A Flora of the Eastern Cape Province, Strelitzia 41(3): 1821 - 1882. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Characterised by the conspicuously clumped habit, typically broad leaves, 5-15 mm wide, and pink or rarely dark wine-red flowers with white or faintly speckled bracts. Dark-flowered plants are sympatric with Dierama reynoldsii but that species grows as solitary stems or in small tufts of up to three stems, with narrower leaves 3-6 mm wide.
            textZh: SANBI 条目提供了 Dierama latifolium N.E.Br. 的鉴别特征。
            sourceIds:
