          title: Plantago major L., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Ephemeral or persistent glabrate herb 10-50 cm high at anthesis, developing a short rhizome, but the roots appearing mainly fibrous and shallow. Leaves mostly glabrous, except for a tuft of long trichomes at the base ofnthe petiole, green or with some purplish in the petiole, to 50 cm long overall, ovate, elliptic, or reniform, to 20 cm wide, entire or with denticulate margins and narrowed into a ribbon-like or v-shaped petiole which forms about half the length, major veins 3-8 arising at the base of the petiole and forming an elliptical pattern on the blade, in living material the lamina often displaying a wrinkled or crisped appearance. Scape longer or shorter than the leaves, fertile in the upper half, the lower portion terete or with longitudinal grooves, glabrate or with a few scattered trichomes. Flowers in an elongate spike, congested or somewhat dispersed along the axis, bisexual; bracts about as long as the sepals, with a slender green keel and whitish margins; sepals almost free, elliptic to rotund, 1.5-2.5 mm long with a prominent green keel; corolla-lobes much reduced, to 1 mm long; anthers small, exserted 1-2 mm; stigma short- pilose, exserted 1-2 mm. Pyxis 2-3 mm long, slightly larger on larger plants, circumscissile below the middle at about the top of the sepals, the top hemi- spherical to elliptical, falling with most of the seeds; seeds 9-25 (mostly 14-18 in Panamanian material) 0.8-1.1 mm long, slightly angular but essentially flat on at least one side and not concave, reddish-brown to blackish, the surface with waves of fine, dark tuberculae.
          originalLanguage: en
          sourceField: general
