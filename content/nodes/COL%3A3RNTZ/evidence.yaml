    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Compact, flexuose shrublet to 75 cm. Leaves ascending, narrowly ovate to lanceolate. Flowers cream-coloured to dark pink, glabrous outside, stigma capitate, papillate.
            sourceIds:
              - sanbi_14458_0
            locator: "SANBI/WFO archive Morphology row 10242; source 14458.0; publication: Beyers, JBP. 2012. Thymelaeaceae: Lachnaea L. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 772 - 775. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Lachnaea axillaris is closely related to L. pudens, L. leipoldtii and L. pusilla. The upper portion of the hypanthium in these species is basally invaginated. L. axillaris is easily distinguished from L. pudens by the hypanthium being glabrous on the outside. In L. axillaris the upper portion of the hypanthium is cup-shaped and the stigma is capitate and papillate, whereas in L. leipoldtii and L. pusilla it is narrowly obconical and the stigma is conical and papillate and narrowly conical and papillate respectively.
            textZh: SANBI 条目提供了该种的鉴别特征。
            sourceIds:
              - sanbi_6132_0
            locator: "SANBI/WFO archive Diagnostic row 103928; source 6132.0; publication: Beyers, JBP. 2001. The Cape genus Lachnaea (Thymelaeceae): A monograph. Strelitzia 11: 1 - 115. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
