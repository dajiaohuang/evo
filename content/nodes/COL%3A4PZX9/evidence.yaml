        claims:
          - text: Low shrub, up to 0.6 m tall. Leaves opposite, shortly stem-clasping at base, small, linear, densely set, margins finely serrate-ciliolate. Flowerheads discoid, solitary, terminal, cylindrical; involucral bracts membranous, with mucronate recurved tips and ciliate margins; disc florets yellow. Cypselas densely long-haired; pappus yellowish.
