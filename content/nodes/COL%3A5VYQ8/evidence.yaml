    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte 15-30 mm, with stems arching outward. Leaves firm, erect, tightly plicate. Flowers numerous in an inclined spike, zygomorphic, violet with white and darker blue marks on lower tepals, dorsal tepal and stamens facing spike apex, inner bracts divided to base, ovary hairy.
            textZh: Babiana inclinata Goldblatt & J.C.Manning 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 6730; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Babiana inclinata has been confused with the vegetatively similar B. angustifolia, which also has inverted flowers, but B. inclinata has a more widely cupped flower, unequal tepals that do not form a cup, a dorsal tepal 22-24 mm long and held well apart from the others, and the anthers are purple to lilac or white rather than almost black. The lower tepals are shortly united with the upper laterals for about 2 mm to form a distinct lower lip, and the free parts are 12-15 mm long. While the anthers of B. inclinata are the same size as in B. angustifolia, 5-6 mm long, the filaments are longer, 12-15 mm versus 8-10 mm in B. angustifolia. The tepals of B. angustifolia are ± equal, 20-22 mm long and overlap one another forming a cup and the filaments are 12-15 mm long. In the inverted flowers of the two species the unilateral stamens lie above the dorsal tepal and face the top of the spike.
            textZh: SANBI 条目提供了 Babiana inclinata Goldblatt & J.C.Manning 的鉴别特征。
            sourceIds:
