          title: Euphorbia oerstediana (Klotzsch & Garcke) Boiss., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Herb, stems terete, glabrous except at tips, not fully articulate, sparingly branched, erect to 9 inches. Leaves alternate, sometimes opposite near apex of stems; stipules obsolete; petiole ca 1 cm long; blade thin, ovate-lanceolate, 3.5-6 X 1-2 cm, scattered short hairs on each surface, the base obtuse to rounded, the margin entire, the apex obtuse to mucronate. Cyathia in small terminal groups, campanulate, ca 1 mm diam; glands 2, the appendages green, the margins entire, upright or obsolete. Capsule broadly ovoid, ca 3 mm diam, densely pubescent particularly when young; seed ovoid, 2.5 mm long, surface papillate, minutely carunculate.
          originalLanguage: en
          sourceField: general
