        usage:
          title: Psidium salutare (Kunth) O.Berg, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Undershrub often less than 1 m. high, simple and sparingly branched or with several stems; twigs compressed, puberulous or glabrous. Leaves subsessile, ovate to elliptical-oblong,rounded or obtuse at the base, acute at the apex, up to 6 cm. long and 2 cm. wide, coriaceous, at first more or less puberulous, later glabrate, the midrib elevated on both sides or nearly flat above, the lateral nerves in about 6 pares, arcuate-ascending, prominulous on both sides; petiole obsolete, often with 2 minute setaceous stipules. Peduncles 1-3 cm. long, solitary, axillary, 1-flowered. Calyx open in the bud, later 5-fid to the base, the lobes rounded or obtusish. Petals obconoid, 2 mm. high; placenta 2-lamellate; ovules in a single or double row at each side of the placenta. Berry subglobose, when dry about 1 cm. in diameter, said to be about as large as a cherry and of good flavor.
