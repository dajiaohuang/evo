    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous herb, up to 0.8 m high. Outer tepals 36-50 mm long. Ovary 6-10 mm long, usually exserted from spathes. Leaves linear, 6-12(-20) mm wide. Flowers violet to pale blue with yellow to orange nectar guides on outer tepals.
            textZh: Moraea polystachya (Thunb.) Ker Gawl. 的 SANBI 物种条目记载了植株、叶片和花部形态。
            sourceIds:
              - sanbi_11118_0
            locator: Strelitzia 6; archive Morphology row 2794, source 11118.0
            placeTimeScope: Regional species account published 1997; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
          - text: Widespread and relatively common in interior southern Africa, Moraea polystachya is recognised by the combination of several foliage leaves, branched stem, and large blue-mauve to violet flowers. The limbs of both tepal whorls are half reflexed but only the outer tepals bear nectar guides, and the tepal claws form a narrow cup enclosing the filaments and broad style branches, leaving the style crests prominently displayed. An unusual and particularly distinctive feature of most populations is the red veining on the ovary, this absent in plants from the Little Karoo. Once regarded as an ecological variant of M. polystachya, M. venenata is now regarded as a separate, but closely related species. A shorter plant, M. venenata has somewhat larger flowers with inner tepals usually held ± erect, the ovary also typically red-veined. The larger capsules, up to 16-20 mm long, are nodding when mature and contain larger seeds, ± 2 mm long. Capsules of M. polystachya are held erect, are 9-16 mm long and the smaller seeds are 1.2-1.6 mm long. Both M. polystachya and M. venenata are poisonous to stock. Moraea polystachya in the Little Karoo is distinctive not only in lacking red veining on the ovary but in having blue rather than violet flowers with the inner tepals held erect for most of the flowering cycle. No other features appear to distinguish these plants, which flower in the winter months rather than in late summer and autumn.
            textZh: SANBI 条目提供了 Moraea polystachya (Thunb.) Ker Gawl. 的鉴别特征。
