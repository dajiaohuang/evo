        claims:
          - text: Like I. marginifolia but flowers always blue-mauve with dark blackish centre edged with red, filaments and style branches blackish, filaments 4 mm long (vs. 5-6 mm).
            textZh: Ixia pavonia Goldblatt & J.C.Manning 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_14562_0
            locator: "SANBI/WFO archive Morphology row 33267; source identifier 14562.0; cited publication: Goldblatt, P; Manning, JC. 2013. Iridaceae. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 94 - 124. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Based on morphological similarity, Ixia pavonia must be regarded as most closely allied to the widespread western Karoo species I. marginifolia and like that species, it has three leathery basal leaves with thickened margins and main vein, a stem bearing three or more, short lateral branches, and a flower with a short perianth tube ± 3.5 mm long. Unlike the uniformly blue-mauve, white or pink flowers of I. marginifolia, I. pavonia has a blue-mauve perianth with a black centre surrounded by a broad red zone. Accompanying the colour difference in the perianth are purple-black filaments and style. Although the perianth tube and tepals are about the same dimensions as in I. marginifolia, the filaments in that species are 5-7 mm long and typically exserted 3.5-5.0 mm from the tube. The short filaments of I. pavonia, only 4 mm long and exserted ± 1.5 mm stand in sharp contrast.
            textZh: SANBI 条目提供了 Ixia pavonia Goldblatt & J.C.Manning 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 95065; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
