    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants 150-350 mm long. Corm obovoid, obliquely pointed at the base, with short basal fibrils on a very small basal ridge. Leaves basal, filiform to compressed cylindrical, 100-350 x 1-2 mm, grooves narrow. Peduncles 50-180 mm long. Bracts green or greenish, outer with narrow, inner with wide, colourless membranous margins narrowing to a green tip. Flowers 25-40 mm long, pink, magenta-pink or rarely white, with a yellow or orange-yellow cup, outer segments green on the backs with 3-5 purplish veins and feathered veining. Perianth tube 5-7 mm long; segments 18-30 x 6-12 mm. Filaments 4-10 mm; anthers 6-8 mm long, reaching less than halfway up the perianth. Style 8-12 mm; stigmas at or just below the anther tips. Capsules on erect peduncles.
            textZh: Romulea autumnalis L.Bolus 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_12511_0
            locator: "SANBI/WFO archive Morphology row 50170; source identifier 12511.0; cited publication: De Vos, MP. 1983. Syringodea, Romulea, Fl. S. Africa 7(2,2): 1 - 76. Botanical Research Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: This generally lowland species, as well as the closely related montane R. campanuloides, differs from R. rosea, R. eximea, and R. cruciata which have somewhat similar flowers, in the small ridge at the base of the corm, and inner bracts with colourless membranous margins; also in flowering period (late summer and autumn) and in chromosome number.
            textZh: SANBI 条目提供了 Romulea autumnalis L.Bolus 的鉴别特征。
            sourceIds:
              - sanbi_12511_0
            locator: "SANBI/WFO archive Diagnostic row 51662; source identifier 12511.0; cited publication: De Vos, MP. 1983. Syringodea, Romulea, Fl. S. Africa 7(2,2): 1 - 76. Botanical Research Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Allied to the widespread African Romulea camerooniana and sharing with it a corm with a small, narrowly toothed basal ridge but distinguished by the often larger flowers with finely veined bracts and short stamens and style, not reaching the middle of the perianth and thus included in the floral cup.
