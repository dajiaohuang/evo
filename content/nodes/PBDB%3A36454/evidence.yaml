  claims:
    - subjectId: taxon:plesiosauria
      claimKind: scientific
      claimType: taxonomy
      statement: Plesiosauria is represented securely in the Rhaetian by the diagnostic articulated Rhaeticosaurus skeleton; older Bobosaurus remains an uncertain near-plesiosaur candidate rather than accepted diagnostic Plesiosauria.
      confidence: high
      confidenceRationale: The profile separates directly documented specimens and explicit analyses from global range, behaviour and ancestry inferences; confidence is bounded by the cited primary study and its stated sample. This rationale is specific to plesiosauria:taxonomy.
      referenceLinks:
        - referenceId: wintrich-2017-rhaeticosaurus
          relation: supports
          pages: e1701144
          figure: Figures 1–4; Supplementary Figures S1–S12
          quoteLocator: taxonomy
    - subjectId: taxon:plesiosauria
      claimKind: scientific
      claimType: fossil-range
      statement: The claim-linked older bound for diagnostic Plesiosauria is the Rhaetian 205.7–201.4 Ma interval; the younger 66 Ma bound remains a broad composite and Bobosaurus does not pull the range into the Carnian.
      confidence: high
      confidenceRationale: The profile separates directly documented specimens and explicit analyses from global range, behaviour and ancestry inferences; confidence is bounded by the cited primary study and its stated sample. This rationale is specific to plesiosauria:fossil-range.
      referenceLinks:
        - referenceId: wintrich-2017-rhaeticosaurus
          relation: supports
          pages: e1701144
          figure: Figures 1–4; Supplementary Figures S1–S12
          quoteLocator: fossil-range
    - subjectId: taxon:plesiosauria
      claimKind: scientific
