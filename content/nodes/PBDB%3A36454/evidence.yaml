          figure: Figures 1–4; Supplementary Figures S1–S12
          quoteLocator: biogeography
    - subjectId: taxon:plesiosauria
      claimKind: scientific
      claimType: morphology
      statement: Plesiosauria has a distinctive four-flipper body plan; Rhaeticosaurus preserves diagnostic skeletal characters, whereas Bobosaurus presents a less decisive mosaic.
      confidence: high
      confidenceRationale: The profile separates directly documented specimens and explicit analyses from global range, behaviour and ancestry inferences; confidence is bounded by the cited primary study and its stated sample. This rationale is specific to plesiosauria:morphology.
      referenceLinks:
