  claim-statements.zh:
    - 诊断性关节骨架 Rhaeticosaurus 可靠记录蛇颈龙类已出现于瑞替期；更老的 Bobosaurus 仍是不确定近蛇颈龙候选，不被视为已确认蛇颈龙类。
    - 诊断性蛇颈龙类有主张关联的较老界限为 2.057 亿至 2.014 亿年前瑞替期；6600 万年前较年轻界限仍是综合值，Bobosaurus 不会把延限拉入卡尼期。
    - 本档案重点的最老诊断性出现来自德国 Bonenburg 的 Exter 组；意大利东北部更老候选证据被单独展示。
    - 蛇颈龙类具有独特四鳍肢体制；Rhaeticosaurus 保存诊断性骨骼性状，而 Bobosaurus 的镶嵌组合证据较不确定。
    - 蛇颈龙类是海生游泳动物，但生理与四鳍肢水动力推断必须与 Rhaeticosaurus 直接保存的骨架和组织学分开。
