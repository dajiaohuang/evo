        usage:
          title: Neomirandea gracilis R.M.King & H.Rob., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Small epiphytic shrubs to 1 m tall; stems terete, puberulous, becoming glabrous below. Leaves opposite; blades papyraceous, oblong-elliptical, mostly 4-8 cm long and 1.5-3.0 cm wide, the base short-cuneate, the margins distinctly remote- serrulate, the apex shortly acute, the upper surface sparsely punctate, the lower surface sparsely puberulous and densely glandular-punctate, the primary vein subpilose below, the secondary veins pinnate, not very prominent; petioles short, 1-2 mm long. Inflorescence a small corymbose panicle, 4.5 cm wide and 3.5 cm high, the branches puberulous and sparsely glanduliferous, the ultimate branches 1.5-6.0 mm long. Heads ca. 6 mm high and 1.5 mm wide with 8-9 florets; involucral bracts brown, ca. 12, subimbricate to eximbricate, in ca. 2 series, narrowly oblong with narrowly rounded tips, 1.5-2.5 mm long and ca. 0.4 mm wide, the outer surface sparsely puberulous and glanduliferous; receptacle glabrous; corolla lavender, ca. 4 mm long, narrowly funnelform, the inner surface glabrous, the outer surface puberulous and glanduliferous, the lobes very short- triangular; style base not enlarged. Achenes prismatic, ca. 1.7 mm long, puberulous and glanduliferous; carpopodium a distinct rim, the cells in 3-5 rows; pappus of ca. 32-35 slightly scabrous bristles with slightly enlarged tips, the apical cells acute.
