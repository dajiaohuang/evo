        usage:
          title: Browneopsis excelsa Pittier, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Large unarmed tree, with terete, glabrous, lenticellate branchlets. Leaves 4- to 6-foliolate; petiole short, gross basally, with rachis up to 10 cm. long; rachis flattened and usually 1-sulcate above, glabrous; leaflets ovate to lanceolate or ob- long, 5-11 cm. long, 2-5 cm. wide, apically usually very long-acuminate, basally truncate to obtuse to cuneate, glabrous, dull, chartaceous, minutely reticulate; petiolules about 6 mm. long. Inflorescence a condensed, short-peduncled, few- flowered, cone-like "head", terminal or axillary and subterminal; bracts broadly ovate, to 3.5 cm. long, ciliate, somewhat puberulent, longitudinally rugose, over- lapping. Flowers cream to pinkish, showy; calyx with a thick basal receptacular portion about 8 mm. long, the 4 petaloid sepals (lobes) elliptic, one shorter than the other 3, to 2.5 cm. long, often caducous; petals 3 or 4, 2? of them narrowly elongate-obovate, about 3 cm. long, clawed, glabrous; stamens 14-16, mona- delphous, glabrous, up to 3.5 cm. long; anthers linear-oblong, up to 1 cm. long, versatile, bilocular; ovary narrow, stipitate, densely pubescent, with style up to 4 cm. long or longer; style glabrous; stigma terminal, rounded. Legume linear- oblong, 15-20 cm. long, 3-4 cm. wide, thin and flattened, densely puberulent, obliquely attenuate-mucronate apically, long-stipitate basally, few-seeded.
