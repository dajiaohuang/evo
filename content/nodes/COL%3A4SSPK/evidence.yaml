        usage:
          title: Rhynchosia precatoria (Humb. & Bonpl. ex Willd.) DC., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Herbaceous to suffrutescent vine, the stems angular becoming terete, villous to strigose, gland dotted. Leaves trifoliolate, the leaflets obovoid to deltoid, 3.5- 8.5 cm long, 2.5-7.5 cm wide, apically acute, basally obtuse to cuneate, sparsely villosulose above, gland dotted, villosulose beneath; terminal petiolule 1.2-2.3 cm long, lateral petiolule 0.2-0.3 cm long; petiole 2.5-7.2 cm long, villous; stipels obsolete; stipules lanceolate, ca. 3.0 mm long, caducous, villous. Inflorescence equal to or exceeding the leaves, 6.5-10.5 cm long; peduncles 1.0-2.0 cm long; pedicels 1.0-2.0 cm long; bracts lanceolate, caducous, 1.5-3.0 mm long. Flowers with the calyx not exceeding the corolla, 3.0-5.5 mm long, the lobes 1.0-2.5 mm long, the upper lobes longer than the others, puberulent; corolla yellowish green streaked with brown, 0.6-0.8 cm long, the standard orbicular, auriculate, gland dotted, ca. 0.8 cm long, ca. 0.4 cm wide, the claw ca. 1.5 mm long, the wings oblong, ca. 0.7 cm long, ca. 0.2 cm wide, the claw ca. 1.5 mm long, the keel falcate, ca. 0.7 cm long, ca. 0.1 cm wide, the claw ca. 0.2 cm long; stamens ca. 0.7 cm long. Fruits ovate oblong, strigose, 1.5-2.0 cm long, 0.6-0.8 cm wide, the beak 2.0-3.0 mm long; seeds ovoid, ca. 5.0 mm long, ca. 3.0 mm wide, red and black, the hilum linear to ovate, 2.5 mm long, the strophiole lobes narrow.
          originalLanguage: en
