          scope:
            en: Reports a selected-site Cameroon transect survey of two Euoticus species, with 56 combined encounters and an 8.3 individuals/km encounter rate for E. pallidus; not a species-wide abundance estimate.
            zh: 报告喀麦隆选定地点的两种 Euoticus 样线调查、合计 56 次目击，以及 E. pallidus 每公里 8.3 只的遇见率；不是全物种丰度估值。
