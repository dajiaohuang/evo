    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Perennial, tufted (erect), up to 1 m high. Leaf blades up to 100 mm long, up to 5 mm wide. Spikelets 1-2 mm long, up to 1.2 mm wide. Inflorescence linear, delicate, much-branched, branches fine and flexible; mature spikelets very broadly ovate, 2- or 3-flowered, rhashilla subpersistent, fragile in upper part, lowest floret persistent; palea keels smooth to scaberulous; anthers 3, 0.6-0.8 mm long.
            textZh: Eragrostis habrantha Rendle 的 SANBI 物种条目记录了形态特征。
