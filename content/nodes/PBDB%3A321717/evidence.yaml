  claims:
    - subjectId: taxon:carnufex_carolinensis
      claimType: taxonomy
      claimKind: scientific
      statement: Zanno et al. named Carnufex carolinensis from holotype NCSM 21558 and recovered it at the base of Crocodylomorpha in an unresolved polytomy in their 79-taxon, 413-character analysis; this is a sampled topology, not direct ancestry.
      confidence: medium
      confidenceRationale: "The name, type material and matrix result are explicit in the primary study. Confidence remains medium because the basal placement is analysis-dependent and the holotype is skeletally immature and incomplete. Carnufex carolinensis: For the species-level page, this assessment applies to the named species and its cited diagnosis; it does not imply a broader genus sample."
      referenceLinks:
        - referenceId: zanno-2015-carnufex
          relation: supports
          pages: Article 9276
          figure: Figure 2a; Supplementary Figure S9
          quoteLocator: Systematic palaeontology; Holotype; comprehensive 79-taxon, 413-character phylogenetic analysis
    - subjectId: taxon:carnufex_carolinensis
      claimType: biogeography
      claimKind: scientific
      statement: The Carnufex type and referred material are recorded from the approximately 231 Ma Pekin Formation in Chatham County, North Carolina; this single formation sample does not establish a genus-wide distribution or absence elsewhere.
      confidence: high
      confidenceRationale: "The locality, formation and age are directly reported for the named material. High confidence is limited to that occurrence and does not infer a complete geographic range. Carnufex carolinensis: For the species-level page, this assessment covers the cited occurrence or localities only and does not estimate a complete range."
      referenceLinks:
        - referenceId: zanno-2015-carnufex
          relation: supports
          pages: Article 9276
          figure: Figures 1–2
          quoteLocator: Systematic palaeontology—Locality and horizon; Discussion of the Pekin Formation assemblage
    - subjectId: taxon:carnufex_carolinensis
      claimType: morphology
      claimKind: scientific
      statement: NCSM 21558 preserves partial cranial and postcranial material, including a reconstructed slender, ornamented skull longer than 50 cm and elongate, serrated, slightly recurved premaxillary teeth; these observations are limited to the immature holotype.
      confidence: high
      confidenceRationale: "The preserved elements, three-dimensional reconstruction and tooth morphology are described and figured directly. High confidence does not extend the reconstruction to unknown individuals or ontogenetic stages. Carnufex carolinensis: For the species-level page, this assessment covers the characters observed in the cited specimens; unsampled variation remains outside it."
      referenceLinks:
        - referenceId: zanno-2015-carnufex
          relation: supports
          pages: Article 9276
          figure: Figure 1; Supplementary Figure S9
          quoteLocator: Holotype; Diagnosis; cranial description; three-dimensional skull reconstruction
    - subjectId: taxon:carnufex_carolinensis
      claimType: ecology
      claimKind: scientific
      statement: The study interprets Carnufex as an approximately 3 m terrestrial faunivore and top-tier predator in the sampled Pekin Formation assemblage using serrated teeth, reconstructed skull length and an immature femur-length estimate of 354–441 mm; feeding, locomotion and guild are not direct behavioural observations.
      confidence: medium
      confidenceRationale: "Dentition and preserved anatomy are specimen observations, whereas total length, femur proxy and predator-guild assignment are reconstructions bounded to the study and assemblage. Carnufex carolinensis: For the species-level page, this assessment covers only ecological inferences tied to the cited specimens; unmeasured fields remain unassigned."
      referenceLinks:
        - referenceId: zanno-2015-carnufex
          relation: supports
          pages: Article 9276
          figure: Figure 2b–d; Supplementary Table S2
          quoteLocator: Diagnosis; body-size estimates; Pekin Formation predator-guild discussion
  claim-rationales.zh:
    - 命名、模式材料与矩阵结果均由一手研究明确报告。由于正模骨骼未成熟且不完整、基部位置依赖分析，置信度保留为中等。 Carnufex carolinensis：本种级页面的判断仅适用于所引材料中的该种及其描述，不表示存在更广泛的属级样本。
    - 论文直接报告具名材料的地点、地层组与年代。高置信度只适用于该出现记录，不推断完整地理范围。 Carnufex carolinensis：本种级页面的判断仅覆盖所引化石记录或地点，不据此估算完整分布。
    - 保存骨骼、三维复原和牙齿形态均有直接描述与图示。高置信度不把正模复原外推到未知个体或发育阶段。 Carnufex carolinensis：本种级页面的判断仅覆盖所引标本中观察到的性状；未取样的种内变异不在此结论内。
    - 牙列和保存解剖属于标本观察；全长、股骨代理值和捕食者功能群归属则是限定于该研究及动物群的复原。 Carnufex carolinensis：本种级页面的判断仅覆盖与所引标本相关的生态推断；未测量字段继续保持未指定。
  claim-statements.zh:
    - Zanno 等人依据正模 NCSM 21558 命名 Carnufex carolinensis，并在包含 79 个类群、413 个性状的分析中将其恢复为鳄形类基部未解析多分支；这是取样拓扑，不是直系祖先关系。
    - Carnufex 的模式与归入材料记录于美国北卡罗来纳州查塔姆县约 2.31 亿年前的 Pekin 组；这一单一地层组样本不能确立属级完整分布或其他地区的缺失。
    - NCSM 21558 保存部分头骨与头后材料，包括复原长度超过 50 厘米的细长饰纹头骨，以及细长、具锯齿且略后弯的前上颌齿；这些观察仅限未成熟正模。
    - 该研究依据锯齿牙、复原头骨长度与未成熟股骨 354–441 毫米的估计，把 Carnufex 解释为 Pekin 组取样动物群中约 3 米长的陆生食动物与顶层捕食者；摄食、运动和功能群并非直接行为观察。
