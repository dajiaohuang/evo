        usage:
          title: Waltheria glomerata C.Presl, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrub 1.5-2 m. high, the young branches tomentellous to puberulous. Leaves shortly petiolate, the petiole 0.5-1 cm. long, puberulous to tomentellous, the stipules narrowly triangular-acuminate and ca. 0.8-0.9 cm. long; blade oblong-elliptic or elliptic or even slightly obovate, obtuse or truncate to subcordate at the base, acute at the apex, 6-13 cm. long and 2-8 cm. wNlide, chartaceous, discolor, the margins irregularly serrate, tomentellous when young to scabrous-puberulous later above, whitish-tomentellous beneath, the nervation reticulate, impressed above and prominent beneath. Inflorescences axillary, of densely globose, usually shortly pedunculate, solitary or fasciculate glomerules. Flowers sessile, subtended by several bracts, these distinct or 2- to 3-connate, linear to linear-obovate, acute at the apex, equalling more or less the calyx, tomentellous and with 2 tiers of hairs outside, a lower tier with appressed hairs and an upper *one with long sericeous hairs, tomentellous-sericeous inside; calyx obovate-tubular, 5-angled and carinate, ca. 5-6.5 mm. long and ca. 2.5 mm. wide, the lobes ovate-triangular, acuminate and ca. 1.5-2.5 mm. long, tomentellous and with 2 tiers of hairs outside, a lower tier with short appressed hairs and an upper one with long sericeous hairs, shortly puberulous to tomentellous on the upper half inside; petals narrowly obovate- spatulate, unguiculate, rounded at the apex, ca. 5-7 mm. long and 1-2 mm. wide, white, glabrous; staminal tube very short, ca. 1-1.2 mm. long, glabrous, the fila- ments 3-5 mm. long; anthers ca. 1 mm. long; ovary narrowly obovoid, ca. 1 mm. long and 0.5 mm. broad, sericeous; style geniculate near the middle, ca. 2-2.5 mm. long, hirsute; stigma ca. 0.8-1 mm. long, densely plumose-papillate. Capsule unknown.
