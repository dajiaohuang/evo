  claim-rationales.zh:
    - 一手专著提供广泛标本、性状与系统发育覆盖；主张区分基干取样属和直接祖先。
    - Hesperocyon navigation display 采用 Wang, X.（1994）的论文，因为所引页码与定位符直接标示了研究采样的类群、标本或现生序列集合。中等置信度仅适用于 Hesperocyoninae specimens monographed by Wang；更宽泛端点保持未声明。
    - 一手专著明确识别化石犬类样本和矩阵，而分类边界及高阶关系仍取决于该研究的性状与取样。
    - 专著的地理化石样本有明确记录，但它不是所有出现记录的普查，也不外推到具名研究之外。
    - 专著直接记录了解剖性状和系统比较，但档案保留标本与矩阵的有限范围。
    - 中等置信度只适用于证据边界：官方专著记录支持化石系统学与形态研究，而非直接的生态观察或性能实验。
  claim-statements.zh:
    - 一项专著式形态分析把 Hesperocyon 取样于犬科灭绝的 Hesperocyoninae 辐射中，并修订该记录中的物种级关系；该属不被视为后期犬科已证实的直接祖先。
    - Hesperocyon navigation display 仅以 40–29 Ma 展示为专著所采样的属级记录，而非精确全球起源或灭绝。该区间是来源限定的样本窗口，不是全球首现、末现、分化日期、连续占据或直接祖先断言。
    - Wang 的专著修订将 Hesperocyon 作为灭绝黄昏犬亚科犬类样本的一部分，并用评分形态检验种级关系；该取样属并未被断言为后期犬类的直系祖先。
    - 本档案仅限于 Wang 专著汇集的北美黄昏犬亚科产地，不会把这一策展化石样本转化为完整的属级分布或起源中心主张。
    - Hesperocyon 修订在形态矩阵中对具名化石材料的牙齿和颅骨性状进行评分；这些观察到的性状本身不能确立运动性能或普遍的早期犬类体型。
    - 所引系统学专著没有直接测量 Hesperocyon 的食性、习性栖息地、运动性能、体型范围或单一生态功能群，因此这些档案字段明确保持未解析。
