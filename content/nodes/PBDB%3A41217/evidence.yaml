  claims:
    - subjectId: taxon:hesperocyon
      claimKind: scientific
      claimType: topology
      statement: A monographic morphology analysis samples Hesperocyon within the extinct Hesperocyoninae radiation of Canidae and revises species-level relationships across that record; the genus is not treated as a demonstrated direct ancestor of later canids.
      confidence: medium
      confidenceRationale: The primary monograph provides extensive specimen, character and phylogenetic coverage. The claim distinguishes a basal sampled genus from direct ancestry.
      referenceLinks:
        - relation: supports
          referenceId: wang-1994-hesperocyoninae
          pages: 1–207
          quoteLocator: Systematics of Hesperocyon; character matrix; phylogenetic analysis
    - subjectId: taxon:hesperocyon
      claimKind: scientific
      claimType: taxonomy
      statement: Wang's monographic revision treats Hesperocyon as part of the extinct Hesperocyoninae canid sample and tests species-level relationships from scored morphology; the sampled genus is not asserted to be a direct ancestor of later canids.
      confidence: medium
      confidenceRationale: The primary monograph explicitly identifies the fossil canid sample and matrix, while taxonomic limits and higher relationships remain dependent on the study's characters and sampling.
      referenceLinks:
        - relation: supports
          referenceId: wang-1994-hesperocyoninae
          pages: 1–207
          figure: Systematics figures and phylogenetic trees
          quoteLocator: Systematics of Hesperocyon; character matrix; phylogenetic analysis
    - subjectId: taxon:hesperocyon
      claimKind: scientific
      claimType: biogeography
      statement: This profile is limited to North American Hesperocyoninae localities assembled in Wang's monograph and does not turn that curated fossil sample into a complete genus distribution or origin-centre claim.
      confidence: medium
      confidenceRationale: The monograph's geographic fossil sample is explicit, but its coverage is not a census of all occurrences and is not extrapolated beyond the named study.
      referenceLinks:
        - relation: supports
          referenceId: wang-1994-hesperocyoninae
          pages: 1–207
          quoteLocator: Introduction; geographic and stratigraphic distribution; Systematics of Hesperocyon
    - subjectId: taxon:hesperocyon
      claimKind: scientific
      claimType: morphology
      statement: The Hesperocyon revision scores dental and cranial characters from named fossil material in a morphology matrix; those observed characters do not by themselves establish locomotor performance or a universal early-canid body plan.
      confidence: medium
      confidenceRationale: The monograph directly records its anatomical characters and systematic comparisons, but the profile preserves the limited specimen and matrix scope.
      referenceLinks:
        - relation: supports
          referenceId: wang-1994-hesperocyoninae
          pages: 1–207
          quoteLocator: Systematics of Hesperocyon; character descriptions; character matrix
    - subjectId: taxon:hesperocyon
      claimKind: scientific
      claimType: ecology
      statement: The cited systematic monograph does not directly measure diet, habitual habitat, locomotor performance, body-size range or a single ecological guild for Hesperocyon, so those profile fields remain explicitly unresolved.
      confidence: medium
      confidenceRationale: "Medium confidence applies to the stated evidence boundary: the official monograph record supports a fossil systematics and morphology study rather than a direct ecological observation or performance experiment."
      referenceLinks:
        - relation: supports
          referenceId: wang-1994-hesperocyoninae
          pages: 1–207
          quoteLocator: Study scope; systematics; character matrix; phylogenetic analysis
    - subjectId: taxon:hesperocyon
