      confidence: medium
      confidenceRationale: Hesperocyon navigation display uses Wang, X. (1994) because the cited pages and locator expose the sampled taxon, specimen or living sequence set. Confidence is medium and applies only to Hesperocyoninae specimens monographed by Wang; broader endpoints remain unclaimed.
