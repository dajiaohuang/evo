        claims:
          - text: Cormous geophyte, 80-150 cm, tunics papery, stems branched. Leaves sword-shaped. Flowers funnel-shaped, pink with darker markings on lower tepals.
            textZh: Gladiolus geardii L.Bolus 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 7260; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: A robust species, mostly more than 0.8 m tall, with seven to nine leaves and multi-flowered inflorescences of pink to purple flowers, the perianth tube 30-40 mm long and the dorsal tepal 40-55 mm long. Gladiolus carneus, which is not recorded east of Knysna, is a smaller plant, seldom more than 600 mm tall, with 4 or 5 leaves and mostly smaller flowers with the dorsal tepal 28-40(-50) mm long.
            textZh: SANBI 条目提供了 Gladiolus geardii L.Bolus 的鉴别特征。
