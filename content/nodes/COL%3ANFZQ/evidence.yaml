      ecology:
        status: partially-supported
        claims:
          - text: On Pellaberg the plants occupy south-facing slopes, typically amongst jumbled, quartzitic and micaschist rocks, whereas on Ghaamsberg they favour northeast facing slopes on small hills dotting the mountain's central plateau. The vegetation at both localities is classified as Bushmanland Inselberg Shrubland and includes a mixture of succulent and non-succulent elements. Thunder showers provide erratic, low amounts of rainfall from February to April and are a prerequisite for flowering, whereas the hysteranthous leaves depend on precipitation generated by cold fronts that occasionally extend into the interior in winter. Currently the Ghaamsberg populations are threatened by the proposed mining of this floristically important site for zinc.
