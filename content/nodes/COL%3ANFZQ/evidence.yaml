            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: B. gariepensis differs from the closely allied B. comptonii, which has similar papillate leaf upper surfaces, in having a consistently larger inflorescence in which the flowers have longer pedicels (50-55 vs. 10-25 mm at anthesis), longer tepals (45-50 vs. 20-27 mm) and a longer perigone tube (4-5 vs. <0.5 mm), and the stamens are distinctly biseriate, the outer whorl being ± two thirds as long as the inner. Although lateral appendages at the base of the filaments are sometimes present in B. comptonii they are absent in B. gariepensis. This feature is nevertheless regarded as taxonomically unreliable in Brunsvigia, being variable in B. namaquana and Brunsvigia bosmaniae. Other species from the semi-arid westem parts of Northern Cape that have flowers with distinctly biseriate stamens are B. bosmaniae, Brunsvigia herrei and Brunsvigia pulchra. They are all easily distinguished from B. gariepensis by their large habit and heavily ribbed fruiting capsules.
