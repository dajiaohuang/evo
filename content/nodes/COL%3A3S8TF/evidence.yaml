    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, 15-25 cm. Leaf blades ribbed. Flowers long-tubed with deep wide throat, large, white to yellowish (rarely purple) with red markings on lower tepals, reddish outside, lower tepals with arching, claw-like appendages.
            textZh: Lapeirousia fabricii (D.Delaroche) Ker Gawl. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 7500; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: The flowers of Lapeirousia fabricii are among the largest in the genus, with a long perianth tube and often wide throat. The perianth tube ranges from 30-65 mm long and is usually expanded in the upper 5-10 mm in a short to long cup or gullet. The tepals are shortly clawed, particularly the lower three, which are united basally for ± 2 mm and the erect claws form the upper part of the floral cup. When fully open the lower and sometimes the upper tepal limbs spread at right angles to the tube, or the dorsal is suberect. The lower tepal claws often bear claw-like cusps that arch forward over the limb bases, but these cusps are sometimes absent and represented by thickened median ridges. Vegetatively, L. fabricii has distinctive flattened, narrowly winged stems, the wings usually minutely crisped or serrated. The well developed outer floral bracts are ribbed and have crisped to serrated keels.
            textZh: SANBI 条目提供了 Lapeirousia fabricii (D.Delaroche) Ker Gawl. 的鉴别特征。
