        usage:
          title: Cavendishia revoluta Luteyn, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Terrestrial shrub, glabrous throughout; mature branches terete, striate, mi- nutely rugose, brown to reddish brown when dry; immature branches subterete, bluntly angled, striate, minutely rugose, light brown when dry. Leaves thickly coriaceous, lanceolate to lance ovate, 11-16 cm long, 5-9 cm wide, basally short attenuate, somewhat decurrent, apically acute, somewhat cuspidate, the margins entire and tightly revolute, olive to light greenish brown when dry; 5-7-plinerved, the midrib and the lateral nerves weakly impressed above, sometimes slightly ele- vated distally, the veinlets raised and conspicuous above, the nerves raised and conspicuous beneath, or with the veinlets sometimes obscure; petioles subterete, sometimes flattened adaxially, rugose 4-10 mm long, 3-5.8 mm in diameter, light olive brown to reddish brown. Inflorescence 9-15-flowered; rachis stout, bluntly and coarsely angled, white speckled, ribbed, rugose, 3-4 cm long, 4-5 mm in diameter at the base, cream pink; floral bracts smooth, marginally glan- dular fimbriate, elliptic, concave, 14-20 mm long, 11-12 mm broad, basally cuneate and truncate, apically rounded; pedicels becoming wider distally, striate, 3.5-7.5 mm long, 1.5-2.5 mm in diameter; bracteoles oblong, marginally glandular fimbriate, 2-3 mm long, about 2 mm broad. Flowers with the calyx 9-11 mm long, the tube with short, stout, reddish, glandular fimbriae when im- mature, cylindric to barrel-shaped, 4-5 mm long, 4.5-5.5 mm in diameter not basally enlarged, the limb cylindric, smooth, 5-6.6 mm long including the lobes, the lobes oblong to broadly triangular, marginally densely glandular fimbriate when young, soon caducous, mature margins dark red, appearing thinner than the main body of the limb, 2-2.5 mm long, 2.5-3 mm broad, the sinuses acute; corolla immature; style persistent, 10-11 mm long. Mature berry not seen.
          originalLanguage: en
          sourceField: general
