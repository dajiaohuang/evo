        usage:
          title: Phyllanthus hyssopifolioides Kunth, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Annual herb, erect, completely smooth and glabrous; monoecious; main stem unbranched or nearly so, 1-2.5 dm high, 0.5-1 mm in diam, terete below, flattened above and with thin narrow wings 0.1-0.15 mm broad. Leaves with petioles 0.5-0.8 mm long; stipules ovate-lanceolate, acuminate, basally auriculate, more or less denticulate, 1.2-1.5 mm long; blades ovate to oblong or elliptic, obtuse-apiculate at tip, 6-12 mm long, 2.5-5 mm broad, the lateral veins obscure to distinctly visible. Inflores- cences unisexual, sexes at separate axils, the staminate in few-flowered clusters, the pistillate solitary. Staminate flowers with pedicels less than 1 mm long; calyx- lobes 5, obovate to broader than long, 0.6-0.7 mm long, 0.6-0.9 mm broad; disc- segments 5, cuneate to orbicular, thin, ca 0.2 mm in diam; stamens 3, the filaments free, ca 0.15 mm long, the anthers subglobose, 0.25-0.3 mm broad, dehiscing obliquely. Pistillate flowers with geniculate pedicels, 1 mm long or less; calyx- lobes 6, obovate to oblong, obtuse to subacute, (0.8-) 1-1.2 mm long; disc-segments 6, cuneate, entire; ovary smooth, the styles horizontal, bifid, the style-branches dilated and thickened, appressed to the ovary, less than 0.2 mm long. Capsules subglobose, olivaceous, ca 3 mm broad; seeds 1.6-1.7 mm long, smooth, dull brownish with yellow coating.
          originalLanguage: en
          sourceField: general
