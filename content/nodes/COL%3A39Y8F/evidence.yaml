        usage:
          title: Enterolobium cyclocarpum (Jacq.) Griseb., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Spreading tree, often very large and buttressed on the trunk, the branchlets puberulent to glabrous, smooth. Leaves moderate, twice compound, few-ranked; petiole up to about 8 cm. long, subterete, swollen basally, glabrous or somewhat puberulent, bearing an ovoid gland on the upper side usually near the middle; rachis up to 15 or more cm. long, shallowly sulcate and submarginate above, glabrous or somewhat puberulent, bearing subcupular glands between the terminal and usually penultimate insertions of the pinnae; pinnae 4-15 pairs, opposite on the rachis, the pinnular rachis with sessile or partly sunken, oblong, concave glands near insertion of the terminal 1-4 pairs of leaflets; leaflets 15-30 pairs, opposite, small, inequilaterally oblong or oblong-subfalcate, 8-15 mm. long, obliquely rounded basally, obliquely acute-mucronate apically, subglabrous and dark above, appressed-puberulent and lighter below, the costa excentric; stipules not evident. Inflorescence of 1-3 pedunculate heads from several foliate or (more frequently) defoliate nodes of the young branchlets; peduncle 2-4 cm. long, puberulent or subglabrous; head globular, 10-15 mm. in diameter, multiflorate; bracts minute. Flowers small, sessile, whitish; calyx short tubular-campanulate, about 3 mm. long, puberulent or subglabrous on the tube, canescent-tomentulose on tips of the lobes, valvate in bud; corolla tubular-funnelform, 5-6 mm. long, subglabrous except canescent-tomentulose toward the tip, valvate in bud; stamens many, up to 12 mm. long, filaments united into a staminal tube for about half their length; anthers quadrangular, unappendaged; ovary glabrous, subsulcate laterally; style about equalling or slightly exceeding the stamens. Legume reniform, about 10 cm. across and 3-6 cm. wide, compressed, glabrous, lustrous, curved into a nearly complete circle.
          originalLanguage: en
