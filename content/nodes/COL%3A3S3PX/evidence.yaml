        claims:
          - text: Perennial, dwarf shrublet, up to 0.25 m high, stems decumbent, forming small loose mats, rooting at nodes. Leaves glaucous, triquetrous, margins often tinged red. Flowers large, solitary, deep pink to pinky purple. Flowering time spring to late summer. Capsules deep brown, woody, 5-locular, valve wings broad, closing bodies absent, dense clumps of funicular hairs closing locule.
