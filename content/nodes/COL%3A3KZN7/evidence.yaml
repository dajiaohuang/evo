    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Sprawling shrublet with branches ascending to 60 cm. Leaves obovate-cuneate, in tufts. Flowers in rounded, terminal clusters, yellow to red, throat narrow and petals spreading, calyx lobes large, flat, ovate and papery.
            sourceIds:
              - sanbi_14353_0
            locator: "SANBI/WFO archive Morphology row 8430; source 14353.0; publication: Manning, JC; Goldblatt, P. 2012. Malvaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 613 - 621. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: This species is characterized by the rather coriaceous calyx, which is often red and has the tips of the lobes infolded giving them a truncate appearance. The pubescence is harsh, mostly of tufts of stiff hairs on a raised tubercle. The flowers, which are very short stalked, grow in the axils of the upper and subterminal leaves and so appear to be in heads at the ends of the branchlets. The degree to which the corolla is exserted from the calyx varies and is not combined with any other difference. It may even be due to the age of the flower for, while the petals are still tightly rolled, they seem to be farther exserted. The variety exserta is therefore not upheld here.
            textZh: SANBI 条目提供了该种的鉴别特征。
            sourceIds:
              - sanbi_815_0
            locator: "SANBI/WFO archive Diagnostic row 73297; source 815.0; publication: Verdoorn, IC. 1980. Revision of Hermannia subgenus Hermannia in southern Africa. Bothalia 13(1&2): 1 - 63. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
