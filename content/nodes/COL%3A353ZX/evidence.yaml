          title: Desmopsis microcarpa R.E.Fr., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Small tree 2-3 m. high, with the young branchlets thinly appressed-hirsute, very soon glabrescent. Leaves on petioles 3-4 mm. long, lanceolate-elliptic to broadly elliptic, rounded to cuneate at the base, rotundate and abruptly acuminate and more or less gradually tapering at the apex, glabrous above except on the more or less hirsute midrib, glabrous beneath, 10-20 cm. long and 4-10 cm. broad. Inflo- rescences up to 5-flowered; their peduncles about 1 cm. long and bearing near the apex a rotundate-cordate or foliaceous bract 1-2 cm. long; flower pedicels 5-8 cm. long, very slender, provided near the base and below the middle with 2 bracteoles 0.5-1.0 mm. long. Sepals ovate, 3-4 mm. long. Petals narrowly lanceolate, 4-6 mm. broad at the base, gradually tapering to the blunt apex, sericeous outside, glabrous and black inside. Monocarps 7, spherical or shortly cylindrical, 7-8 mm. across; stipes thin, 6-8 mm. long.
