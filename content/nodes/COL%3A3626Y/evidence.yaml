            locator: "SANBI/WFO archive Morphology row 90717; source identifier 18505.0; cited publication: Bredenkamp, CL; Magwaza, ZL. 2019. Iridaceae. In: CL Bredenkamp (ed.), A Flora of the Eastern Cape Province, Strelitzia 41(3): 1821 - 1882. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Endemic to Eastern Cape, occurring as solitary stems or small tufts, 750-1250 mm tall, with moderately sized, dark maroon to purple-black (rarely light purple) flowers, the perianth 21-32 mm long, and bracts flecked all over and appearing pale brown to the eye.
            textZh: SANBI 条目提供了 Dierama atrum N.E.Br. 的鉴别特征。
