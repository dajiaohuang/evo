    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Perennial herb, geophyte, 0.75-1.30 m high, stem solitary; corm 25-30 mm in diam. Leaves linear-acuminate; venation pronounced; radical leaves 300-750 x 3.0-6.5 mm; reduced sheathing leaves 4 or 5. Flowering stem 0.75-1.25 m high. Bract pale brown, 17-26 x 8-11 mm, elliptic-lanceolate, acute to acuminate, flecked. Inflorescence a raceme of spikes, pendulous, with 1-6 branches. Perianth dark maroon to purple-black, 21-32 mm long; tube 8-12 mm long; tepals 15-22 x 5-9 mm. Anthers 6-9 mm long. Flowering time Oct.-Jan.
            textZh: Dierama atrum N.E.Br. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
