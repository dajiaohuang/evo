    facets:
      morphology:
        status: partially-supported
        claims:
          - text: The SANBI flora-derived entry describes plants 60–150 mm high, with a 10–15 mm corm, mostly basal linear to narrowly lanceolate leaves, and one- or two-flowered spikes. Flowers are bright yellow, rarely dull orange with a yellow centre; capsules are ellipsoid and stalked, 20–25 mm long. Barker's 2005 review additionally reports, from John Manning's personal communication, that the flowers have subterranean bases.
            textZh: SANBI 植物志条目记载植株高 60–150 mm，球茎直径 10–15 mm，叶多基生、线形至狭披针形，花穗具 1–2 朵花。花鲜黄色，少数为暗橙色且中心黄色；蒴果椭圆形、有柄，长 20–25 mm。Barker 2005 年综述另转述 John Manning 的个人通讯，指出该种花的基部位于地下。
            sourceIds:
              - sanbi-flora
              - barker2005
            locator: SANBI Biodiversity Advisor, Morphological description; Barker 2005, Iridaceae section, printed p. 457 (subterranean floral bases attributed to J. Manning personal communication)
            placeTimeScope: Regional taxon description in the 2020 southern African flora; subterranean floral-base observation is reported in 2005 without stated population or sampling scope.
            lifeStatus: Wild flora description; cultivated variation is not covered.
        gaps:
          - The regional account is not a scope-complete review of intraspecific variation, developmental stages or diagnostic comparisons.
      lifeHistory:
        status: partially-supported
        claims:
          - text: The SANBI flora-derived account reports flowers opening around midday and closing at dusk, and a flowering period of March to May. Barker's 2005 review reports that the flower bases are subterranean and, citing John Manning's personal communication, that the ovary and fruit remain buried. The sources do not provide a full annual life cycle or reproductive-system account.
            textZh: SANBI 植物志条目记载花约在正午开放、黄昏闭合，花期为 3–5 月。Barker 2005 年综述称花基部位于地下，并转述 John Manning 的个人通讯称子房和果实保持埋于地下。来源未提供完整年度生活史或繁殖系统账户。
            sourceIds:
              - sanbi-flora
              - barker2005
            locator: SANBI Biodiversity Advisor, Morphological description (daily flower opening/closing) and Flowering time; Barker 2005, Iridaceae section, printed p. 457 (subterranean ovary and fruit attributed to J. Manning personal communication)
            placeTimeScope: Flower timing from the 2020 regional flora; subterranean fruiting observation reported in 2005 without geographic sampling, frequency or seasonal duration details.
            lifeStatus: Wild regional-flora observation; cultivation timing is not covered.
        gaps:
          - Seed germination, full seasonal cycle, pollination, mating system and population-level reproductive variation remain unreviewed.
      ecology:
        status: partially-supported
        claims:
          - text: The regional flora account places the species in alluvial washes, mainly in lime-rich silt or on chalky flats; it also reports a regional altitude range of 0–1370 m.
            textZh: 区域植物志记载其生境为冲积水道，主要见于富石灰的粉砂或白垩质平地；该条目报告的区域海拔范围为 0–1370 m。
            sourceIds:
              - sanbi-flora
            locator: SANBI Biodiversity Advisor, Habitat and Altitude sections; source attribution to Goldblatt & Manning 2020, Strelitzia 42
            placeTimeScope: Habitat and elevation statements from the 2020 southern African flora account; they are not inferred to cover every population or season.
            lifeStatus: Wild habitat description; no cultivated ecology is inferred.
        gaps:
          - Interactions, soils beyond the reported substrate description, disturbance response and ecological variation have not been comprehensively reviewed.
      evolution:
        status: not-assessed
      distribution:
        status: partially-supported
        claims:
          - text: The SANBI flora account describes a scattered range in central South Africa within the Vaal–Orange drainage basin, from Kimberley in Northern Cape to Mmbatho in North West and eastward to Kroonstad in Free State. It mentions a recent but unconfirmed sight record near Devon, Gauteng; this regional account is not an exhaustive global range assessment.
            textZh: SANBI 植物志将其描述为零散分布于南非中部瓦尔河—奥兰治河流域，范围从 Northern Cape 的 Kimberley 至 North West 的 Mmbatho，并向东至 Free State 的 Kroonstad。条目另提及 Gauteng 的 Devon 附近一条近期但未确认的目击记录；该区域记录不是穷尽的全球分布评估。
            sourceIds:
              - sanbi-flora
            locator: SANBI Biodiversity Advisor, Distribution section; Devon record explicitly described as unconfirmed in the source
            placeTimeScope: Regional range statement from the 2020 flora account; no date-resolved occurrence completeness or extra-regional range is inferred.
            lifeStatus: Wild distribution account; horticultural or introduced occurrences are not assessed.
        gaps:
          - A dated, specimen-backed range review across the full native and any introduced range has not been completed.
      fossil:
        status: not-assessed
      conservation:
        status: partially-supported
        claims:
          - text: SANBI's South African Red List page records a 2005-06-30 national assessment as Least Concern. The page states that this was an automated status assigned after the taxon was not selected for detailed assessment; its assessment history lists Duthiastrum linifolium, although the current page heading uses the spelling Duthieastrum. This is historical national evidence, not a current detailed or global assessment.
            textZh: SANBI 南非红色名录页面记录该物种于 2005-06-30 的国家评估状态为无危（LC）。页面说明该等级是在该分类单元未被筛选进入详细评估后自动赋予；评估历史将其列作 Duthiastrum linifolium，但当前页面标题拼作 Duthieastrum。本记录是历史国家层级证据，不是当前详细评估或全球评估。
            sourceIds:
              - sanbi-redlist
            locator: SANBI Red List assessment page, assessment date, automated-status justification and assessment history spelling Duthiastrum linifolium
            placeTimeScope: South African national scope; assessment date 2005-06-30, surfaced on Red List version 2024.1; not a global range assessment.
            lifeStatus: Assessment concerns the wild national taxon; domesticated or cultivated populations are not assessed.
        gaps:
          - The cited LC entry was assigned automatically rather than through detailed assessment; current population evidence and global conservation status remain unreviewed.
