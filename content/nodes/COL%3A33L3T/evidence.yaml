    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Bulb ovoid, 3.5-5 cm in diam., with a short neck. Leaves 2-4, contemporary with the flowers, linear, 15-30 cm long, 5-8 mm broad, spirally twisted, somewhat glaucous. Peduncle about the same length as the mature leaves. Spathe-valves 2, lanceolate. Flowers 2-3 to a peduncle, more or less horizontally spreading; perianth 8-10 cm long, white or pale pink with red or reddish-brown stripes extending along the lobes from the tube; tube slender at the base and slightly curved, broadened above to a throat about 2.5 cm in diam., lobes oblong, about 2.5 cm long. Stamens biseriate. Style trilobed.
