        usage:
          title: Ardisia rigidifolia Lundell, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrubs or small trees, the buds and tips of the branchlets dark reddish- brown, lepidote-furfuraceous, the branchlets thick, gnarled, with short inter- nodes. Leaves clustered at the ends of the branchlets, the petioles stout, 3-5 mm long, marginate; leaf blades rigidly coriaceous, pallid, paler on the lower surface, minutely punctate, elliptic or rhomboid, 3.5-6.5 cm long and 2-3.2 cm wide, obtuse or obtusely subacuminate apically, broadly cuneate basally, decurrent, the costa plane above, prominent beneath, the primary veins slender, prominulous beneath. Inflorescences terminal, tripinnately panic- ulate, pyramidal, to 7 cm long and wide, furfuraceous-lepidote, many-flowered. Flowers 5-merous, white, umbellate; bracts to 1 cm long, lepidote; pedicels 4-5 mm long; sepals ovate, 1-1.3 mm long, punctate with a few conspicuous orange-red glands, the margin scarious, minutely erose; petals oblong, 5 mm long, acutish apically, asymmetrical, punctate with a few inconspicuous glands; stamens ca. 3.5 mm long, the filaments ca. 1 mm long, thick, the anthers thick, lanceolate-oblong, ca. 3 mm long, concolorous, apically dehis- cent, not apiculate; ovary glabrous, the ovules numerous, pluriseriate, the style 5.2 mm long.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 8354
