        claims:
          - text: Cormous geophyte, 30-40 cm, tunics woody. Leaves linear, margins and midribs thickened. Flowers long-tubed, pink with darker markings on lower tepals.
            textZh: Gladiolus vigilans Barnard 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 7244; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Recognised by the mostly four linear leaves with lightly thickened midrib and margins, striate or ribbed bracts, and long-tubed, pale pink flowers with a cylindric perianth tube 35-40 mm long expanded only near the top. The lower lateral tepals are strongly marked with red, spade-shaped nectar guides. Somewhat similar Gladiolus debilis, which also occurs on the Cape Peninsula, has ribbed bracts and a shorter perianth tube, (10-)15-22 mm long.
            textZh: SANBI 条目提供了 Gladiolus vigilans Barnard 的鉴别特征。
            sourceIds:
