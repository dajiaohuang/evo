    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Like B. tubulosa but flowers uniformly creamy white or with red marks on lower tepals, tube with a short, obscure gullet, filaments 13-16 mm long, style branches 3-4 mm.
            textZh: Babiana tubiflora (L.f.) Ker Gawl. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 6740; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Usually a small plant, typical Babiana tubiflora is recognised by the relatively small, white to creamy white flowers, often with small red or pink markings at the base of the lower tepal limbs, an elongate perianth tube, and often narrow, linear leaves. The perianth tube is uniformly slender or very gradually expanded toward the apex and usually 60-80 mm long but sometimes shorter or longer. The filaments are 13-16 mm long and the style branches are 3-4 mm long and often not reaching the anther tips. Babiana tubiflora is closely related to a second long-tubed species, B. tubulosa, and often confused with it. This local endemic of the Atlantic Coast and near interior of Western Cape has creamy beige to pink flowers usually flushed pink outside, prominent red markings on the lower tepals limbs, and a perianth tube 65-105 mm long that is expanded distally into a wider gullet 5-12 mm long. The longer stamens have filaments 20-22 mm long with longer anthers, and the style divides opposite or slightly beyond the anther tips with the style branches ± 6 mm long.
            textZh: SANBI 条目提供了 Babiana tubiflora (L.f.) Ker Gawl. 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 94933; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
