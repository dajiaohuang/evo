        claims:
          - text: Much-branched, wiry, unarmed shrub, from 0.6 to 2.0 m high. Branches grey, branchlets glabrous. Leaves trifoliolate, petiolate; petiole semiterete, canaliculate above, (6-)10(-17) mm long; leaflets sessile, coriaceous, rigid, glabrous, concolorous, olive-green, amphistomatous; lamina linear-acicular, occasionally slightly falcate, concave, apex acute, sometimes mucronulate; margin entire; venation obscure, midrib dull yellow, prominent above and below, terminal leaflets (19-)39(-66) x (1-)2(-3) mm, lateral leaflets (15-)29(-49) x (1-)1.5(-2) mm. Panicles lax, much-branched, relatively short, up to 35 mm long, axillary and terminal, flowers pendulous. Flowers normal, separate styles persistent. Drupe oblate, obloid to ellipsoid, glabrous, shiny, light brown, minutely tricuspidate, relatively large, 4.7 x 3.2 - 6.2 x 5.0 mm.
