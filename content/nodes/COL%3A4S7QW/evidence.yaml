          - text: Densely leaved, low cushion-forming, succulent shrub, up to 80 mm tall. Leaves shaped like grain, 6-7 mm long, rough from raised dots, old leaves persisting on stem in dry state for several years. Flowers solitary, petals yellow, opening in the late afternoon. Fruit top flat, 3-7 mm diam., valve wings broad, 5-locular.
