    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants 3-15 cm tall, sometimes clumped. Corm somewhat depressed-ovoid, 7-19 mm diam., covered with hard, brown, fibrous tunics; fibres unbranched proximally, firmly attached to rim of basal disc, reticulate distally, often extended into slightly outspread tips up to 10(-25) mm long; roots emerging from proximal half of corm. Cataphylls absent at flowering. Leaves 3-11, sheathing at base up to 4 cm, spreading to recurved, linear, 10-115(-120) x 1-7 mm, tapering evenly upwards, canaliculate, shiny green, firm-textured, margin often with minute, widely spaced, recurved teeth. Inflorescences up to 4 in flower at a time, 1-flowered, clustered amongst leaves; scape hidden by leaf sheaths, up to 10 x 1 mm, laterally compressed, whitish; bract 1, linear, inserted at ovary base, ca. 10-24 x 0.5-1.2 mm, whitish, thin-textured. Flower sessile, partly subterranean, more or less rotate, white with yellow centre, backed with pink to maroon distally on outer tepals, sometimes scented; perigone tube arising from a slender, elongated, ovary beak, bowl-shaped, 3.0-5.5 x 3.0-3.5 mm; tepals 6, oblong-lanceolate, 10-18(-30) mm long, outer 3.5-10.0 mm wide, minutely mucronate, inner 3.0-8.0 mm wide. Stamens 6, suberect, subequal, yellow; filaments inserted near perigone tube base, 3.0-3.5 mm long, usually shorter than anthers; anthers linear, latrorse, (2.5-)3.0-5.0(-7.0) x 0.7 mm, basal lobes up to 0.5 mm long; pollen yellow. Ovary subterranean, narrowly ovoid, compressed ventrally, ca. 8 x 2.5 mm, 3-locular, distal beak 18-70 x 1 mm; style 2.5-4.0 mm long; stigma branches erect to spreading, linear-oblong, 2.5-5.0(-11.0) x 0.5-0.7 mm, ca. equalling or exceeding stamens, yellow, densely papillose. Capsule shortly exserted above ground, narrowly ovoid, ca. 9 x 3 mm, beaked, walls thin, disintegrating irregularly. Seeds somewhat globose, 0.93 x 0.82 mm; testa brownish black, densely covered with pliable, blunt, elongated trichomes.
