          - text: Pauridia alticola is distinguished by a solitary-flowered inflorescence held close to the ground within a tuft of leaves. Specialized characters contributing to this compact habit are the shortened scape and sessile flower in which the subterranean ovary tapers into a long beak that raises the perigone clear of the ground. The exposed rotate perigone has a short, yellow, bowl-shaped tube and six, outspread white tepals, those of the outer whorl attractively backed with pink. P. alticola is distinguished from the closely related P. verna by larger, heavily fibrous corms, often slightly larger flowers, the style which is shorter than the stigma branches, and the dense covering of elongated trichomes on the seeds. The partly subterranean flower accounts for this species having first been assigned to Forbesia Eckl. ex Nel, known more recently as Empodium. Subsequently the species was transferred to Saniella Burtt, a genus of just two species. In doing so, Burtt nevertheless conceded that the separation of Saniella from Spiloxene and Pauridia may not be justified. Confirmation of this has since come from the molecular based phylogenetic analysis of Kocyan et al. which resolved that Saniella is nested within an expanded Pauridia.
