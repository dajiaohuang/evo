        claims:
          - text: On the Hantamsberg and Roggeveld the plants are restricted to seasonally inundated summit plateaus in doleritic soils, whereas in the Cederberg they occupy shale bands. Records indicate that the plants once occupied clay-loamy soils of the high-lying valleys in the Kouebokkeveld, but most of these habitats have been replaced by dams and orchards.
            textZh: 该 SANBI 区域物种条目记录的生境：On the Hantamsberg and Roggeveld the plants are restricted to seasonally inundated summit plateaus in doleritic soils, whereas in the Cederberg they occupy shale bands. Records indicate that the plants once occupied clay-loamy soils of the high-lying valleys in the Kouebokkeveld, but most of these habitats have been replaced by dams and orchards.
