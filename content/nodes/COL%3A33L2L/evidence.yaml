        claims:
          - text: Bulbous geophyte to 75 cm, robust. Leaves up to 10, usually green at flowering, broad, twisted. Flowers 15-25, nodding, long, tubular, crimson or pink, stamens dilated at base, shortly exserted from throat, style truncate.
