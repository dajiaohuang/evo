    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Slender, cormous geophyte, 25-50 cm, unbranched. Leaves 2, lower with linear blade less than 1.5 mm wide, upper leaf entirely sheathing. Flowers pink, tube filiform, anthers oblong-linear, style branches filiform, ± straight.
            textZh: Ixia micrandra Baker 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 7168; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: I. micrandra stands out in the group in its long, narrow, almost linear filaments and its style branches, which are unusually long at 2.0-3.5 mm, and straight or slightly arched, thus extending between the bases of the anthers. I. confusa has similarly slender but somewhat shorter filaments, slightly shorter anthers, and shorter, strongly arched style branches, 1.5-2.0 mm long. The leaves of I. confusa have plane, usually wider blades up to 4 mm wide (vs. 0.5-1.5(-2.0) mm) and without the prominently thickened main vein of M. micrandra. The style branches are also strongly arched in I. minor but that species has unusual flattened, lanceolate filaments, narrowed and kinked at the tips. The ranges of I. micrandra and I. minor are almost complementary, that of I. micrandra extending east of I. minor, but the two have been collected growing and flowering on the same day in the Houw Hoek Mtns, where their distributions overlap. The only significant variant of Ixia micrandra we have seen is from near Bot River (MacOwan in Herb. Norm. Austr. Afr. 262). Plants of this population have unusual thick, fleshy leaf blades, but the flowers and other features accord with the species. Largely montane, we see no current threat to the species and endorse Raimondo et al.’s (2009) (LT), least threat, status.
            textZh: SANBI 条目提供了 Ixia micrandra Baker 的鉴别特征。
            sourceIds:
              - sanbi_15933_0
            locator: "SANBI/WFO archive Diagnostic row 84450; source identifier 15933.0; cited publication: Goldblatt, P; Manning, JC. 2012. Systematics of the southern African genus Ixia (Iridaceae): 4. Revision of sect. Dichone. Bothalia 42(2): 87 - 110. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Immediately recognised by its solitary long, narrow foliage leaf, mostly 1.0-2.0 mm long, almost linear filaments, and unusually long style branches 2.0-3.5 mm long either straight or slightly arched, extending between the bases of the anthers. Ixia confusa has similarly slender but somewhat shorter filaments, slightly shorter anthers, and shorter, strongly arched style branches, 1.5-2.0 mm long. The leaves of I. confusa have plane, usually wider blades up to 4 mm wide (vs. 0.5-1.5(-2.0) mm) and without the prominently thickened main vein of I. micrandra. The style branches are similarly strongly arched in I. minor but that species has unusual flattened, lanceolate filaments, narrowed and kinked at the tips. The ranges of I. micrandra and I. minor are almost complementary, that of I. micrandra extending east of I. minor, but the two have been collected in flower on the same day in the Houw Hoek Mtns, where their distributions overlap.
            textZh: SANBI 条目提供了 Ixia micrandra Baker 的鉴别特征。
