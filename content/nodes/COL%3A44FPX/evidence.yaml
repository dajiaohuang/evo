        claims:
          - text: Deciduous tree, 3-10 m high, crown rounded. Leaves thinly textured, very variable, entire to deeply incised, ovate to narrowly ovate, 50-250 x 20-160 mm, upper surface glabrous, smooth, subglossy, lower surface glabrous, usually with hair tufts in vein axils, apex acute, base cordate to truncate, margins coarsely serrate to dentate, venation raised below, cream-coloured, basal 3 veins forming a ‘V’; petioles 10-35 mm long. Male inflorescence an axillary catkin, ± 25 mm long, calyx lobes ovate. Female inflorescence pedunculate, cylindrical, 8-15 mm long, styles free to base, style arms glabrous to glabrescent. Syconia compound, fleshy, cylindrical, 15-60 mm long, whitish, ripening to white, pink or purple-black; edible.
