    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, 70-250 mm tall, stems simple or branching above, corm tunics blackish, margins with horizontal spines. Leaves sword-shaped, ribbed. Flowers in a lax, few-flowered spike, lilac to mauve, fragrant, perianth tube cylindrical, the lower tepals each with a filiform cusp near base, bracts short, curving upward. July-early Sept.
            textZh: Lapeirousia tenuis (Goldblatt) Goldblatt & J.C.Manning 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_14562_0
            locator: "SANBI/WFO archive Morphology row 33286; source identifier 14562.0; cited publication: Goldblatt, P; Manning, JC. 2013. Iridaceae. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 94 - 124. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Lapeirousia tenuis and L. divaricata share corms with spiny basal rims and comparatively small bracts but have markedly different flowers. In L. divaricata (and allied L. spinosa) the lower tepals are united with the upper laterals for some distance and the lower tepals have large, tooth-like median ridges whereas the flowers of L. tenuis have narrow tepals that spread ± uniformly from the apex of the perianth tube. The lower tepals appear to be united for a short distance but are not fused to the upper tepals at all, and they have claw-like basal cusps rather than tooth-like median ridges.
            textZh: SANBI 条目提供了 Lapeirousia tenuis (Goldblatt) Goldblatt & J.C.Manning 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 94448; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
