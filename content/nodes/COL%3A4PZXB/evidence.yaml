        claims:
          - text: Rounded, aromatic shrub to 1 m. Leaves oblong, dark green, margins roughly ciliate. Flower heads discoid, solitary at branch tips, yellow, 35 x 15-25 mm; bracts ovate, dry.
            sourceIds:
