            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: According to Dr. Atherstone, who collected in Little Namaqualand in 1856, this species grows in the sandy flats near the coast at Port Nolloth. The leaves are succulent and very aromatic, and, mixed with fat, used by the Namaquaa and Bastards as a perfume under the name of 'Buchu.' It is called 'Sab' in the Namaqua language, and is dried and collected for sale.
