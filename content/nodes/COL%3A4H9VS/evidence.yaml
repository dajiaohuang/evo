    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Twiggy, rounded annual, ± 20-150 mm tall, with several stems from base, sparsely to densely pubescent. Leaves broadly elliptic in 2 basal pairs, upper ones narrower and shorter. Flowers in crowded rounded heads, upper lobes orange, lower lip white or mauve, stamens 4, seeds wrinkled, pale.
            sourceIds:
              - sanbi_14774_0
            locator: "SANBI/WFO archive Morphology row 35561; source 14774.0; publication: Snijman, DA. 2013. Scrophulariaceae: Phyllopodium. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 471 - 472. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: It is a distinctive species, with a basal rosette of four large leaves and erect stems, which range from a nude 'peduncle' terminating in a single head to a regular pattern of branching well displayed in the largest plants, where each stem may bear a pair of leaves from whose axils develop a pair of branches each terminating in an inflorescence, with further pairs of leaves and branches sometimes developing, in the manner of a cymose inflorescence. It is often confused with P. hispidulum but that species can at once be distinguished by its hispid leaves, bracts and calyx, as well as by floral differences and its smooth blueish seeds. Phyllopodium namaense is without close affinity but its general relationship lies with P. heterophyllum.
            textZh: SANBI 条目提供了该种的鉴别特征。
