  claims:
    - subjectId: event:anisian-stem-teleosteomorph-record
      claimKind: scientific
      claimType: fossil-range
      statement: Named specimens of Pseudopholidoctenus, Barschichthys and Ruedersdorfia from the approximately 244 Ma Rüdersdorf locality document taxonomic, anatomical and ecological disparity on the teleosteomorph stem; they do not establish a global fossil first appearance of crown Teleostei or a synchronous worldwide radiation.
      confidence: medium
      confidenceRationale: Holotypes, referred specimens, diagnostic characters and locality context are directly figured and tabulated. Medium confidence retains the source's stem Teleosteomorpha/Pan-Teleostei placement, the approximate locality age, one-locality sampling and the difference between small adult size and demonstrated developmental miniaturization.
      referenceLinks:
        - relation: supports
          referenceId: arratia-schultze-2024-triassic-teleosteomorphs
          pages: 29–53
          figure: Figures 2–11; Tables 1–2
          quoteLocator: Systematic palaeontology; Geological setting; Discussion and conclusions
  claim-rationales.zh:
    - 正模、归入标本、诊断性状和地点背景均有直接图示与列表。中等置信度保留来源给出的真骨鱼总群干群位置、地点近似年代与单地点取样，并区分小型成年体与已经证明的发育小型化。
  claim-statements.zh:
    - 约 244 Ma 的 Rüdersdorf 地点所产 Pseudopholidoctenus、Barschichthys 与 Ruedersdorfia 具名标本，记录了真骨鱼总群干群的分类、解剖和生态差异；它们不能确立真骨鱼冠群的全球化石首现，也不能证明全球同步辐射。
