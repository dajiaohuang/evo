    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Mat-forming, wiry perennial, rhizomatous and stoloniferous. up to 1 m high. Leaf blades rigid and spiny-tipped, 20-300 mm long, 1-4 mm wide. Spikelets 1.4-2.8 mm long. Panicle spike-like, not whorled, narrower than 5 mm; spikelets very densely clustered around central axis and hiding it completely.
