        usage:
          title: Aphelandra aurantiaca (Scheidw.) Lindl., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Suffrutescent herb to shrub, erect, 1 m tall; young stems tetrangular, older stems terete; younger stems glabrous to velutinous. Leaves elliptic, 8-30 cm long, 3-12.5 cm wide, apically acuminate, basally attenuate, occasionally obliquely decurrent, glabrous except for occasional puberulence along the veins, the costa and lateral veins prominent, reticulations plainly visible on the upper surface and obscure on the lower margins, undulate to entire; petioles to 1 cm long, glabrous. Inflorescences in mostly terminal, quadrifarious spikes, to 15 cm long and 2 cm wide excluding the corollas; rachis puberulous, flattened at the nodes. Flowers sessile; 1 bract subtending each flower, imbricate, elliptic or ovate, to 3 cm long by 1 cm wide, the apex acute, the base cuneate, puberulous-glandular on both surfaces, reticulations prominent on the inner surface, the margins ciliolate, ser- rate, the teeth to 1.5 mm long; 2 bracteoles subtending each flower, narrowly lanceolate, to 10 mm long and 0.5 mm wide, puberulous on both surfaces, striate ridged; calyx 5-merous, 1 cm long, the posterior segment oblong, 2.5 mm wide with a 3-toothed apex, the lateral and anterior segments linear-lanceolate, 1 mm wide, all segments puberulous with striate ridges culminating at the base in callus tissue ca. 1 mm thick; corolla red, orange red, or scarlet, the tube to 4 cm long and 3 mm wide, bilabiate, the upper lip to 2 cm long and 1 cm wide above base, oblong-ovate, apiculate at the apex, forming a partial hood over the anthers, the lower lip 3-lobed, elliptic, the middle lobe 2 cm long, 1.2 cm wide, the apex acute, the lateral lobes elliptic ovate, to 1.2 cm long and 0.75 cm wide, the apex acute, puberulous on both surfaces; style to 4.6 cmn long, sparingly puberulous with ascending hairs, the ovary puberulous at the apex. Capsules 1.6 cm long, sparingly puberulous; seeds hispidulous.
          originalLanguage: en
          sourceField: general
