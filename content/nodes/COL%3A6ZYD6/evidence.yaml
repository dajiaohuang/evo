    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Bulbous geophyte, ± 200 mm tall. Leaves 2(3), dry at flowering, spreading, strap-shaped, upper surface usually softly hairy, occasionally smooth, margin softly fringed. Flowers in a spreading cluster, funnel-shaped, delicate pink, stamens much shorter than tepals. Feb.-Mar.(Apr.).
            textZh: Strumaria pubescens W.F.Barker 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_14528_0
            locator: "SANBI/WFO archive Morphology row 32859; source identifier 14528.0; cited publication: Snijman, DA. 2013. Amaryllidaceae. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 33 - 42. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Strumaria pubescens is readily distinguished by its funnel-shaped flowers in which the tepals remain imbricate until they spread outward in the distal third. The stamens are conspicuously shorter than the tepals, reaching little more than half the length of the tepals and are mostly hidden. The broad, long, pubescent, strap-shaped leaves are most easily confused with those of its close ally S. aestivalis. In S. pubescens, however, only the adaxial surface is hairy, in contrast to both surfaces in S. aestivalis. The species shows considerable variation in size between populations. Specimens from the type locality are depauperate in comparison to the northern collections, and attain only half the size of these specimens, both florally and vegetatively. The luxuriance of the growth of the bulbs from the Gannaga Pass is thought to be due to favourable local conditions of the humus-rich soil and deep shade in which they were found, thus the original description has been amplified accordingly.
            textZh: SANBI 条目提供了 Strumaria pubescens W.F.Barker 的鉴别特征。
            sourceIds:
