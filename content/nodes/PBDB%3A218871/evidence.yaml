  claim-rationales.zh:
    - Cheirolepis trailli：具名材料和已发表的系统或系统发育处理支持这一有限鉴定。置信度保持中等，因为画像不会把取样位置转化为直接祖先或普遍共识。
    - Cheirolepis trailli：一手研究直接报告了具名地点与层位。置信度为中等，因为单一研究样本不能确定缺失、特有性或全球地理范围。
    - Cheirolepis trailli：证据边界是明确的：保留沉积或解剖背景，同时不填补无依据的行为与生态位。中等置信度针对这一有限的否定性陈述，而非重建生态。
    - Cheirolepis trailli：所引图件与描述直接记录了具名解剖观察。由于保存与标本取样限制了性状完整性和变异，置信度为中等而非普遍结论。
    - Cheirolepis trailli：一手来源与具体定位符支持显示的样本区间。置信度为中等，因为该包络明确限定于标本或地点，而非全球首现或末现。
  claim-statements.zh:
    - Cheirolepis trailli 是早期辐鳍鱼；所引研究由多件具名苏格兰馆藏标本代表，而非一件拼合个体。
    - 扫描的 Cheirolepis 材料来自晚艾菲尔期 Achanarras 灰岩及苏格兰相关地点；不据此推断全球分布。
    - CT 研究解析了解剖结构，但不能直接确定食性、详细栖息生态位、游泳性能或营养行会。
    - 具名 Cheirolepis 标本保存无孔前鳍骨、无孔舌颌骨干及榫卯式鳞片，构成更广泛的早期辐鳍鱼性状镶嵌。
    - 显示的 390.4–388.1 Ma 区间限定所引晚艾菲尔期苏格兰样本，并非辐鳍鱼全球首现。
