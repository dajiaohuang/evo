          originalSourceText: Shrubs or small trees 4-6 m. high, the trunk up to 1 dm. in diameter, the twigs glabrous and with distant foliage. Leaves oblong to lanceolate-oblong, 6-12 cm. long and 2-4 cm. wide, long-acuminate and acute at the apex, rounded or obtuse at the base, coriaceous, glabrous, the midrib slightly elevated above, prominent beneath, the lateral nerves numerous, delicate; petiole about 5 mm. long. Flowers glomerate, axillary and lateral, whitish, the bractlets small, connate, ciliate. Re- ceptacle glabrous, at last circumscissile above the ovary. Sepals glabrous outside, puberulous inside, imbricate in the bud with 2 smaller and 2 larger. Petals 4, about 2 mm. long, pubescent, fimbriate. Ovary 2-celled, 4-ovulate, the ovules ascending. Berry globose, up to 1 cm. in diameter, 1- to 3-seeded, blackish blue when dry, edible. Embryo homogeneous.
