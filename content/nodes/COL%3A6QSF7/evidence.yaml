          title: Macrolobium modicopetalum Schery, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Tree with subglabrous to glabrous branchlets. Leaves glabrous, 1 -jugate; petiole short, terete, deeply canaliculate; leaflets subsessile, coriaceous, elliptic, basally unequal and subacute, apically short-attenuate and obtusely mucronate, 12-23 cm. long and 4-9 cm. wide, the veins prominent beneath and laterally con- fluent. Inflorescence spicate, glabrous or very short-pubescent, bracteate, arising laterally or subterminally from the branchlets. Flowers narrow-pedicellate; the sheath (fused bracteoles) obovate, about 7-9 mm. long, bilobate, the lobes about 4 mm. broad; sepals 4, oblong, about 6-7 mm. long and 2.5-4 mm. wide, obtuse, glabrous; petal 1, white, ovate-lanceolate, 12-13 mm. long and 6-8 mm. wide, concave, undulate-margined, briefly unguiculate; stamens 3, the filaments linear, 11-19 mm. long, the anthers ovate, about 3 mm. long; ovary compressed, mar- ginally pubescent, substipitate, 4-ovulate; style glabrous, with the ovary up to 2 0 mm. long.
