        usage:
          title: Parthenium hysterophorus L., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Annual herb to -50 cm tall; stems erect, much branched, to 4 mm diam., strigillose with hairs 0.3 mm long. Leaves lanceolate above to pinnately dissected below, 2.5-8 cm long, 0.2-4.5 cm wide, acute, the base attenuate, both surfaces strigillose with hairs 0.2-0.4 mm long, the margin entire or deeply lobed. Inflorescence paniculiform, of numerous small heads; peduncles 5-8 mm long. Heads radiate, 2.5-3 mm tall; outer involucre cupulate, 4-5 mm diam., the bracts 5, separate, narrowly ovate, 1.6-2.2 mm long, 1.5-1.8 mm wide, acute, abaxial surface strigose with hairs 0.2 mm long, the margin herbaceous, the inner bracts 5, uniseriate, each attached abaxially to the base of a ray floret, two disc paleas and two included sterile disc florets also attached to the base of the ray floret on the adaxial side (the whole unit termed an "achene complex" (Fig. 56C), each of the two disc florets and enclosing paleas is additionally attached from the base to near the apex of the achene by a thin rib); paleas elliptic, 1 mm long, 0.3 mm wide, apically fimbriate; ray florets 5, the ligules light yellow, ovate, 0.6 mm long, 0.5 mm wide, emarginate; disc florets perfect, 25-50, the corollas light yellow, narrowly funnelform, 0.3 mm diam., the throat 1 mm long, the ovary sterile, filiform, 0.7 mm long. Achenes flattened, 2 mm long, 1.2 mm diam.; pappus of two broad awnis 0.5 mm long. Chromosome number n= 17.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 1406
