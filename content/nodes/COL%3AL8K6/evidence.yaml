        usage:
          title: Begonia strigillosa A.Dietr., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Herbaceous. Rhizome varying from short and compact with very short inter- nodes and imbricate stipules to slender and branching with distinct internodes. Leaves oblique, broadly ovate, acuminate, 7-17 cm. long, entire or slightly serrate, rounded to angulate-dentate, coarsely ciliate, glabrous above, sparsely long-pilose below especially on the nerves, often spotted or mottled, petioles to 18 cm. long, often spotted, bearing numerous reflexed fimbriate scales, stipules lanceolate with a setiferous apex and often fimbriate keel, persistent. Peduncle usually exceeding the leaves, sparsely pilose, often purple-spotted. Cyme 2-4-branched, subsymmetrical, mostly glabrous, diffuse. Bracts deciduous, elliptic, entire, mucronulate. Staminate tepals 2, suborbicular to obovate, 6-9 mm. long. Stamens few, the anthers oblong, obtuse. Pistillate bracteoles lacking. Pistillate tepals 2, like the staminate. Ovary 3-celled, placentae bifid, ovuliferous throughout, styles persistent, connate at base, somewhat bifid, stigmas linear. Capsule suberect, ovoid or elliptic-ovoid, locules to 10 mm. long, the two larger wings subtriangular or subobtuse to acuminate.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 2160
