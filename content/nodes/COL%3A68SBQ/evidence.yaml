      morphology:
        status: partially-supported
        claims:
          - text: Rhizomatous geophyte, up to 0.6 m tall with a coarse, loose, straight, bristly neck. Leaves 12-40, filiform, margin irregularly and shortly toothed. Flowers in a dense narrowly conical to subcylindrical raceme, white flushed delicate pink.
