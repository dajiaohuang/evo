            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Leaves of this species are similar to those of Bulbinella elegans, but tend to be narrower and more numerous. However, it is easily distinguished from that species by the fibrous sheath which is loose and straight in B. ciliolata but compactly reticulate in B. elegans. The inflorescence is similar to that of B. caudafelis and in flower it may be confused with narrow-leaved forms of that species. Although fruits and seeds should help to distinguish the two species, further study of more living collections would help to clarify the situation.
