    facets:
      morphology:
        status: partially-supported
        claims:
          - text: "Tree up to 15 m high. Branches glabrous. Leaf-blade elliptic, occasionally obovate, 10-15 cm long, 3-5.5 cm wide, apex acuminate, rarely acute, base narrowly cuneate to rounded, margins spinulose-serrate with incurved teeth, midrib prominent on both sides, lateral veins 6-9, more prominent below, curved, looping near margin, rigidly coriaceous, shiny, dark green above, paler below, glabrous; petiole 6-9 mm long, channelled, incurved. Flowers few; peduncles 1.2-2 cm long; pedicels 1-2 mm long. Sepals broadly ovate-triangular, 2-5 mm diam., concave, leathery, ciliolate along margin. Petals 3-5, unequal, broadly ovate-rotund, 3.5-8 mm long, 4-7 mm wide, concave, ciliolate along margin, 'deciduous'; petaloid scales elliptic-subrotund, 7 mm long, 4-5 mm wide, with somewhat fleshy tumid pubescent gland on inner face at base. Stamens: filaments 3-5 mm long; anthers narrowly ovate, slightly divaricate at base, 3.5 mm long. Ovary ellipsoid, 4-8 mm long, 4-5 mm wide, ridged; style almost none; stigmas 4-5, 1-1.5 mm long, spreading. Fruit yellow or green, 2.5-4 cm diam., with persistent style, 'tardily dehiscent into 4-5 longitudinal sections when dry' (Wild, 1.c.). Seeds few, subglobose, c. 1 cm diam."
            sourceIds:
