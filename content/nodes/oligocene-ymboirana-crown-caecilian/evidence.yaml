  claim-statements.zh:
    - 对正模 DGM 1462-R 的 CT 比较支持约 2500 万年前、暂归水栖蚓螈科的蚓螈，但破损、缺少无歧义科级共有衍征且尚待正式系统发育检验，使冠群位置保持暂定。
