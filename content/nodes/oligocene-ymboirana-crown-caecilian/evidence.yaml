  claims:
    - subjectId: event:oligocene-ymboirana-crown-caecilian
      claimKind: scientific
      claimType: taxonomy
      statement: CT-informed comparison of holotype DGM 1462-R supports an approximately 25 Ma aquatic caecilian assigned to Typhlonectidae, but damage, absent unambiguous family synapomorphies and pending formal phylogenetic testing make the crown placement provisional.
      confidence: low
      confidenceRationale: The named partial skeleton is directly described and compared broadly; low confidence follows the source authors’ explicit affinity caveats.
