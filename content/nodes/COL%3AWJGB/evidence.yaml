        usage:
          title: Cnidoscolus aconitifolius (Mill.) I.M.Johnst., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Tree or arborescent shrub ca 3-8 m high; glabrous, stinging hairs sparse or absent except on petioles and leaf veins. Leaves thinly chartaceous; petioles ca 15- 25 cm long, usually unarmed or nearly so; junction of petiole and blade with a single median dark reniform gland ca 2-3 mm wide; stipules very inconspicuous; blades as broad as or broader than long, usually 15-25 cm across and deeply cut, with 5 main lobes and 2 smaller basal lobes, the lobes oblong to obovate, often ? runcinate-pinnatifid, sharply toothed, acuminate. Dichasia terminal; peduncles ca 15-30 cm long, smooth or sometimes armed, the first branches opposite, the forks of dichasium compact, the inflorescence 3-6 cm across at anthesis, the axes of inflorescence densely and closely minutely pilose. Staminate flowers subsessile; perianth greenish-white, minutely pilose outside but usually unarmed, ca 10-14 mm long, the perianth tube distally dilated, 6-10 mm long, lobes roundish-oblong, 4-6 mm long; disc ca 1-1.5 mm across; stamens with filaments united for most of their lengths into a column, the outer ones 4-5 mm long, the inner 8-9(-12) mm long, the anthers ca 1.5 mm long; staminodes 3, 4-5 mm long. Pistillate flowers subsessile or on short pedicels 1-2 mm long; calyx-segments whitish, linear-oblong, deciduous, 5-7 mm long; disc similar to that of staminate flower; ovary pubescent, the styles 3-4 mm long, connate for 1 mm at base, 3-4-fid into narrow segments. Capsules unarmed, green, minutely rugose, 8-12 mm long; seeds elliptic, com- pressed, 6-8.5 mm long, 4-5.5 mm broad, pale to dark brown and mottled, the caruncle deltoid-cordate, 1.5-2 mm high, 2-2.8 mm broad.
          originalLanguage: en
          sourceField: general
