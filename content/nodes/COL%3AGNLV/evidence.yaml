            locator: "SANBI/WFO archive Morphology row 90698; source identifier 18505.0; cited publication: Bredenkamp, CL; Magwaza, ZL. 2019. Iridaceae. In: CL Bredenkamp (ed.), A Flora of the Eastern Cape Province, Strelitzia 41(3): 1821 - 1882. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: The very distinctive Aristea platycaulis resembles the widespread A. ecklonii in general aspect, notably the modest stature, compressed, 2-winged stem and fairly soft-textured leaves, but the small flowers are crowded in shortly stalked or sessile flower clusters and have a short, papillate ovary that develops into a conspicuously warty, deeply 3-lobed capsule only 3.5-4.0 mm long and slightly wider than high.
            textZh: SANBI 条目提供了 Aristea platycaulis Baker 的鉴别特征。
