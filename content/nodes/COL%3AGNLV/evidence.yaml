        claims:
          - text: Perennial, rhizomatous herb, 0.25-0.35 m high, slender to robust. Leaves linear, apex acuminate, margins brown; basal ensiform, subcoriaceous, spreading; cauline solitary or absent, with keeled base. Bracts lanceolate, scarious, apex ± ovate, margins rusty brown. Inflorescence a raceme, branches laterally compressed, ancipitous, 2-4-flowered rhipidia, some binate. Flowering time Oct.-? Capsule oblong, tricarpellate.
