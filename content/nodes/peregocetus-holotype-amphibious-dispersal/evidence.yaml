  claims:
    - subjectId: event:peregocetus-holotype-amphibious-dispersal
      claimKind: scientific
      claimType: biogeography
      statement: Peregocetus holotype MUSM 3580 anchors a 42.6 Ma Peruvian protocetid occurrence and preserves weight-bearing and aquatic features; locomotor capability and a westward South Atlantic dispersal route remain phylogenetic and functional interpretations.
      confidence: medium
      confidenceRationale: The specimen, horizon and biostratigraphic placement are explicit. Locomotion is inferred from anatomy, and route reconstruction depends on the character matrix, palaeogeography and sampled occurrences.
      referenceLinks:
        - referenceId: lambert-2019-peregocetus
          relation: supports
          pages: 1352–1359.e3
          figure: Figures 1–4; Figures S1–S4
          quoteLocator: Locality and horizon; Anatomy; Phylogeny; Paleobiogeography
  claim-rationales.zh:
    - 标本、层位与生物地层位置明确。运动方式由形态推断，路线复原依赖性状矩阵、古地理和取样出现记录。
  claim-statements.zh:
    - 游走鲸正模 MUSM 3580 锚定约 4,260 万年前的秘鲁原鲸科出现记录并保存承重与水生特征；运动能力和向西跨越南大西洋的扩散路线仍是系统发育与功能解释。
