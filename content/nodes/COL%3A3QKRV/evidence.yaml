    facets:
      morphology:
        status: partially-supported
        claims:
          - text: "Dwarf shrublet, many stems tufted from the base, c. 150-260 mm long, decumbent to erect, mostly sparingly branched near base, glandular-pubescent, hairs up to 0.2-0.8 mm long, glistening glands as well, leafy. Leaves opposite, bases connate, up to 8-22 x 6-15 mm, broadly ovate abruptly contracted to a petiolar part accounting for c. 1/4-1/3 total leaf length, apex obtuse, margins crenulate to serrulate and shallowly lobed, lobes ± oblong, ± truncate to obtuse, both surfaces glandular-pubescent, hairs up to 0.2-0.7 mm long, many glistening glands as well. Flowers solitary in upper leaf axils. Pedicels up to 4-5 mm long. Calyx tube 0.4-0.5 mm long, lobes c. 4.8-9 x 1.2-1.8 mm, ± spathulate, entire to few-toothed at apex, glandular-pubescent, hairs up to 0.2-0.7 mm long, glistening glands as well. Corolla tube 12-18 x 2-2.8 mm in throat, cylindric, abruptly expanded near apex, limb bilabiate, c. 10-15 mm across lateral lobes, posticous lobes 4-7 x 2.2-4 mm, anticous lobe 3.5-6.5 x 2.75-5 mm, oblong to cuneate, apex ± truncate to retuse, glandular-pubescent outside, hairs up to c. 0.15 mm long, glistening glands as well, glistening glands on upper surface confined to orange zone around mouth, broad band of delicate clavate hairs in throat extending very briefly onto base of anticous lip and there c. 1 mm long, lobes white, each with a conspicuous orange to orange-brown median patch forming a stellate pattern around mouth. Stamens: posticous filaments c. 1.2-1.5 mm long, anthers 1-1.2 mm, anticous filaments c. 0.4-0.7 mm long, anthers 0.7-0.8 mm, all filaments bearded with clavate hairs. Stigma c. 0.4-0.5 mm long. Style c. 10-14 mm. Ovary 2-2.5 x 0.8-1.5 mm. Capsules c. 4-8 x 2.5 mm, thickly clad in glistening glands, a few tiny glandular hairs as well, few glistening glands on placentae. Seeds c. 0.8-1 x 0.5 mm."
            sourceIds:
