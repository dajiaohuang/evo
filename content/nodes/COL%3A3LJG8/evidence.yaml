        claims:
          - text: Suffrutex 20-60 cm. altus, ramis rectis tenuibus, indumento patente stellato-scabrido et pilis paucis simplicibus indutis. Folia late ovata vel orbiculato-ovata, obtusa, basi truncata vel cordata, 2-5 cm. longa, 1.5-4 cm. marginibus crasse dentatis, utrinque pilis 4-7-radiatis scabrida; petioli 1-2 cm. longi, basi stipulis 2 instructi; stipulae 5-8 mm. longae, subulatae. Flores solitarii, axillares; pedicelli usque ad 10 cm. longi, plerumque foliis multo longiores, infra ealyeem circiter 0.5-1 cm. articulati. Epicalyx 6-8-lobatus, lobis linearibus acuminatis vel acutis 1.3-1.8 cm. longis, pilis stellatis et etiam interdum paucis simplicibus instructis. Calycis tubus 2-3 mm. longus; lobi lineari-lanceolati, 1.2-1.7 cm. longi, stellato-scabridi. Corolla plus minusve 7 cm. expansa, lutea, glabra; petala obovata, basi cuneata, apice rotundata. Columna staminea 7-8 mm. longa. Stylus 5-ramosus, ramis 3-4 mm. longis teretibus, stigmatibus capitatis hispidis. Capsula globosa, 10-15 mm. diametro, glabra, in locifiis seminibus 3-5 subtriangulatis pilis longis lanatis.
            sourceIds:
