          - text: The type specimen has no ripe capsules, and the characters given in the above description were taken from Britten 5545. H. aridus is evidently a comparatively rare endemic species limited to the dry karroid scrub from Uitenhage to Albany and Bathurst Divisions. It is distinguished by its large dark yellow flowers on long peduncles, ovate or ovate-orbicular leaves, stellate-hispid on both surfaces, and lanate seeds.
