    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants epiphytic; stems reed-like, c. 400 mm tall, 7 mm in diameter, covered by persistent leaf bases; leaves conduplicate at the base, flat apically, linear-lorate, unequally bilobed with the lobes rounded, 150 x 10 mm. Inflorescences borne below the leaves, arcuate, 50-70 mm long and with c. 8 flowers; sheaths hyaline, tubular, 5 mm long; bracts very broadly tubular, 2-3 mm long. Flowers star-like, white, 12 mm in diameter; pedicel plus ovary straight, 6 mm long. Sepals subequal, oblong, subacuminate with the apices keel-shaped and reflexed; median 7x4 mm; latªerals 8.5 x 5 mm. Petals lorate-lanceolate, acute, oblique, 7.5 x 2 mm. Lip deeply 3-lobed, limb ecallose, oblong, 4 x 2.5 mm; midlobe narrowly triangular, acute, 3 x 1.5 mm; side lobes linear-lorate, apically lacerated, 5x1 mm; entrance to the spur flanked by narrow strips of tissue. Gynostemium 2 mm tall; stigma flanked by wide wings; rostellum 1 mm long.
