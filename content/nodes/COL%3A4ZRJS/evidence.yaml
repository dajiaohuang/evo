          title: Stellaria ovata Willd. ex D.F.K.Schltdl., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Herbaceous mostly glabrous, branching perennials, prostrate or spreading. Leaves opposite, glabrous or subglabrous, ovate to broadly ovate, apically rounded and mucronulate, basally rounded but slightly attenuate, 10-40 mm. long, 5-30 mm. broad, the petioles 3-8 mm. long. Flowers solitary in the axils, the glabrous to villous pedicels 10-40 mm. long, usually exceeding the subtending leaves. Sepals 5, ovate to obovate, obtuse to acute, glabrous to villous, 2.5-5 mm. long; petals 5, obovate, deeply 2-cleft, 3-6 mm. long; stamens 10, the flattened filaments 3-4.5 mm. long; ovary sessile, ovoid; styles usually 3, 1-1.5 mm. long, the numerous ovules campylotropous on basal placentae. Capsule ovoid, 3-5 mm. long, the 3 valves deeply 2-cleft, occasionally entire; seeds numerous, ca. 1 mm. broad, cochleate, dark reddish brown, tuberculate, the mature spines usually longer than broad.
