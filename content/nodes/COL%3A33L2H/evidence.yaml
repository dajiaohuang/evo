    facets:
      morphology:
        status: partially-supported
        claims:
          - text: "Bulb ovoid-oblong, about 2 cm in diam. with a short neck. Leaves 1-3, absent or contemporary with the flowers, linear, straight, bright green, 30 cm long. Peduncle about as long as the leaves. Spathe-valves lanceolate, 2.5-3.5 cm long. Pedicels up to 20 mm long. Flowers 6-12 in an umbel; perianth 2.5-3 cm long, bright red; tube slightly curved and slender at the base, dilated to about 5 mm at the throat; lobes oblong-lanceolate, 5-6 mm long, not at all spreading. Stamens biseriate, included. Style reaching to the tips of the segments, trifid. Flowering time: September to November (to April)."
