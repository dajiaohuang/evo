        usage:
          title: Utricularia alpina Jacq., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Perennial epiphytic herbs; stolons filiform or slightly fleshy, radiating from the base of the inflorescence, several of them swollen at or near the point of origin and elsewhere to form ellipsoid tubers 1.5-2.0 cm long. Photosynthetic organs leaflike, 1-2 from the inflorescence base, 6-25 cm total length; lamina narrowly obovate-elliptic or elliptic, the apex obtuse to subacute, coriaceous, multinerved, the nerves not drying prominent, the base ? strongly decurrent; pseudopetiole usually shorter than the lamina. Traps borne on filiform stolon branches, ovoid, stalked, ca. 1 mm long, the mouth basal, the upper lip with 2 subulate recurved appendages. Inflorescences 10-35 cm long; peduncle 1-2 mm thick, 1-3-flowered; bracts linear-lanceolate, acute or acuminate, 5-7 mm long, the bracteoles similar but usually narrower and slightly shorter, the sterile scales on the peduncle 2-4, similar to the bracts but shorter; pedicels erect, 4-6 times as long as the bract. Flowers with the calyx lobes subequal, ovate, obtuse, basally rounded to sub- cordate, 2-3 cm long, 1.2-2.0 cm wide; corolla usually white with a yellow palate, 4-6 cm long, glabrous or minutely papillose, especially at the spur apex, the upper lip transversely oblong, apically rounded, 2-3 times as wide, as long as or longer than the upper calyx lobe, the lower lip larger, to 5 cm wide, fan shaped, the apex rounded, entire, the palate gibbous, prominent, the spur subulate, acute, curved upwards, about as long as the lower lip. Capsules ovoid, ca. 10 mm long, relatively thick walled, dehiscing by a single abaxial longitudinal slit; seeds numerous, nar- rowly cylindrical-fusiform, 0.35-0.5 mm long.
          originalLanguage: en
          sourceField: general
