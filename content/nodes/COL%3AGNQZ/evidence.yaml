            locator: "SANBI/WFO archive Diagnostic row 61831; source identifier 15411.0; cited publication: Mashau, AC. 2015. Aristida L. In: L Fish, AC Mashau, MJ Moeaha & MT Nembudani (eds), Identification guide to the southern Africa grasses. An identification manual with keys, descriptions and distributions, Strelitzia 36: 83 - 104. South African National Biodiversity Institute, Pretoria. [CC BY]"
