    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Annual, tufted (erect, often branched), up to 1 m high. Leaf blades up to 300 mm long, up to 3 mm wide. Spikelets 10-40 mm long (including awns). Inflorescence narrowly oblong to lanceolate, 10-50 mm wide, usually spike-like, interrupted at base, with side branches appressed to main axis, sometimes branches open and spreading, with spikelets densely clustered on branches; lower glume two-thirds to three-quarters the length of upper glume, sometimes with a mucro or short awn to 0.8 mm long, lemma laterally compressed, articulation and column absent; awns 3, laterals well developed, shorter than central awn; callus with rounded, naked tip.
            textZh: Aristida adscensionis L. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_11118_0
            locator: "SANBI/WFO archive Morphology row 301; source identifier 11118.0; cited publication: Herman, PPJ; Retief, E. 1997. Plants of the northern provinces of South Africa: Keys and diagnostic characters. Strelitzia 6: 1 - 681. National Botanical Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: This species has a very wide geographical distribution and exhibits considerable variation in its external morphology. In the past it has been divided into species, subspecies and varieties. Here the treatment of Melderis (1972) is followed pending a future detailed study. Some forms resemble A. hubbardiana, which has the lemma dorsally compressed; while others resemble forms of A. congesta, which have a lemma articulation between the column apex and the awns branching point.
            textZh: SANBI 条目提供了 Aristida adscensionis L. 的鉴别特征。
            sourceIds:
