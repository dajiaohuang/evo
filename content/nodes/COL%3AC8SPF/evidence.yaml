    facets:
      morphology:
        status: partially-supported
        claims:
          - text: The species account describes the type basidioma and microscopic characters and compares its spores and pileus with A. orientifulva and A. suborientifulva.
            originalLanguage: en
            sourceIds:
              - cui2023
            locator: Section 3.2, Amanita sinofulva Q. Cai, Y.Y. Cui & Zhu L. Yang, Diagnosis and Description; Type
            placeTimeScope: Type from Nanjian, Dali, Yunnan, China, collected 2015-06-27; the article lists additional Anhui and Yunnan collections from 2017 and cites broader eastern, central, and southwestern China occurrence. Tibet and Hunan are not asserted here because the paper presents those from an ITS-tree inference.
            lifeStatus: Wild fungal type collection described by the authors.
        gaps:
          - One taxonomic paper and its sampled material do not cover developmental variation, broad population variation, or a complete diagnostic synthesis.
      lifeHistory:
        status: not-assessed
      ecology:
        status: partially-supported
        claims:
          - text: The authors report solitary-to-scattered fruiting on soil in subtropical forests dominated by Fagaceae, sometimes mixed with Pinus.
            originalLanguage: en
            sourceIds:
              - cui2023
            locator: Section 3.2, Amanita sinofulva Q. Cai, Y.Y. Cui & Zhu L. Yang, Habitat
            placeTimeScope: Type from Nanjian, Dali, Yunnan, China, collected 2015-06-27; the article lists additional Anhui and Yunnan collections from 2017 and cites broader eastern, central, and southwestern China occurrence. Tibet and Hunan are not asserted here because the paper presents those from an ITS-tree inference.
            lifeStatus: Wild field collections; the stated forest association does not establish a physiological host relationship.
        gaps:
          - The account does not establish interaction mechanisms, resource dependence, seasonality, or population-level ecology.
      evolution:
        status: partially-supported
        claims:
          - text: The authors’ multilocus analysis places A. sinofulva close to A. orientifulva and A. suborientifulva; their ITS analysis also includes additional provisionally or previously misidentified collections.
            originalLanguage: en
            sourceIds:
              - cui2023
            locator: Results, phylogenetic relationships; Figure 1 and Figures S1–S4
            placeTimeScope: Type from Nanjian, Dali, Yunnan, China, collected 2015-06-27; the article lists additional Anhui and Yunnan collections from 2017 and cites broader eastern, central, and southwestern China occurrence. Tibet and Hunan are not asserted here because the paper presents those from an ITS-tree inference.
            lifeStatus: Modern herbarium collections analyzed in the cited study.
        gaps:
          - Placement is limited to the study taxa, loci, sampling, and analyses; no divergence-time or broader phylogenomic synthesis was assessed.
      distribution:
        status: partially-supported
        claims:
          - text: The authors report A. sinofulva from eastern, central, and southwestern China and list dated collections from Anhui and Yunnan; the paper separately attributes Tibet and Hunan to ITS-tree inference, which is excluded from this direct occurrence claim.
            originalLanguage: en
            sourceIds:
              - cui2023
            locator: Section 3.2, Amanita sinofulva Q. Cai, Y.Y. Cui & Zhu L. Yang, Type, Additional specimens examined, and Distribution
            placeTimeScope: Type from Nanjian, Dali, Yunnan, China, collected 2015-06-27; the article lists additional Anhui and Yunnan collections from 2017 and cites broader eastern, central, and southwestern China occurrence. Tibet and Hunan are not asserted here because the paper presents those from an ITS-tree inference.
            lifeStatus: Reported field-collected specimens; cultivated, introduced, and global range status not assessed.
        gaps:
          - The paper reports its known range and examined collections; no exhaustive global occurrence search or native/introduced assessment was completed.
      fossil:
        status: not-assessed
      conservation:
        status: not-assessed
