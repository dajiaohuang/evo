        usage:
          title: Euphorbia dwyeri D.G.Burch, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Herb, stems terete, glabrous, not articulate, sparingly branched, sprawling, to 1.5 m long. Leaves alternate through most of plant, opposite above a 3-leaved whorl; stipules obsolete; petiole 2.5-6 cm long, slender; blade ovate-lanceolate, 3.5-6 X 2-3.5 cm, thin, green (drying darker above than below), glabrous except for scattered short hairs on the under surface, the base cuneate to rounded, some- times obscurely peltate, the margin entire, the apex obtuse to rounded or emarginate and mucronulate. Cyathia in groups of 2-5 on short dichotomizing laterals, fun- nelform-campanulate, 2 mm long, 2 mm in diam; peduncle to 4 mm long; glands 4, dark, the appendages equaling glands and with short spreading hairs on upper surface simulating a ciliate edge to the gland, occasionally glabrous. Capsule broadly ovoid, 4 X 4 mm, glabrous; seed ovoid, 3 mm long, smooth, terete, ecarunculate.
          originalLanguage: en
          sourceField: general
