        claims:
          - text: Cormous geophyte, 30-50 mm tall, tunics woody, imbricate. Leaves subterete, spirally coiled. Flowers few, yellow, tepals lightly cupped.
            textZh: Geissorhiza corrugata Klatt 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_14562_0
            locator: "SANBI/WFO archive Morphology row 33082; source identifier 14562.0; cited publication: Goldblatt, P; Manning, JC. 2013. Iridaceae. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 94 - 124. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Geissorhiza corrugata stands out in its small size, up to 50 mm tall, including the flowers, and in its loosely spirally coiled leaves. The bright yellow flowers and borne singly on the stems, and have a short perianth tube up to 3 mm long, spreading tepals, and a style dividing ± opposite the bases of the anthers. It shares these distinctive leaf and style features with G. spiralis, which has purple to deep pink flowers with a longer perianth tube. Greenhouse-grown plants have shown that flowers of G. corrugata are self-compatible and autogamous. The short style and spreading branches facilitate self-fertilization. Plants are often exceedingly common locally and can make a striking display, the yellow blooms visible from a considerable distance.
            textZh: SANBI 条目提供了 Geissorhiza corrugata Klatt 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 94670; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
