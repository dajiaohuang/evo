        usage:
          title: Heisteria concinna Standl., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Trees to 9 m. tall, the young branches terete, glabrous, olive-green to brownish- red. Leaves ovate, 6-13 cm. long, 3-6 cm. broad, abruptly and briefly acuminate at the apex, acute to obtuse at the base, coriaceous, the costa plane to immersed above, emersed below, the primary lateral veins generally prominulous; petiole 7-18 mm. long, canaliculate. Calyx crateriform, 5-toothed to the middle, about 1 mm. long, glabrous, the teeth 0.75 mm. long, 0.5 mm. broad; petals 5, elliptic, 2.0-2.5 mm. long, 1.25 mm. broad, glabrous without, the lower half puberulent to villous within; stamens 10, free, the anthers 0.25 mm. long and broad, the filaments filiform, about 1.5 mm. long, puberulent; pistil lageniform, the ovary oblate spheroid, 0.5 mm. long, 0.75 mm. in diameter, the style about 0.75 mm. long; pedicel about 5 mm. long. Fruiting calyx shorter than the drupe, 1.5-2.5 cm. in diameter, reflexed, distinctly 5-lobed, red; drupe broadly ellipsoid, 10-15 mm. long, 8-10 mm. in diameter; pedicel 8-10 mm. long.
          originalLanguage: en
          sourceField: general
