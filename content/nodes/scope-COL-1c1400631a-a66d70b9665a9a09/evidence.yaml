  claims:
    - subjectId: taxon:echinoidea
      claimKind: scientific
      claimType: fossil-range
      statement: The oldest fossil material assigned to Echinoidea consists of disarticulated bothriocidaroid plates from the Pygodus serra Zone of the Darriwilian; time-scaled analyses place the bothriocidaroid root in the Dapingian or Darriwilian.
      confidence: medium
      confidenceRationale: The Darriwilian plates are direct fossil evidence, whereas the Dapingian–Darriwilian root interval depends on time-scaling methods. The claim and range refer to total-group Echinoidea, not crown Echinoidea.
      referenceLinks:
        - relation: supports
          referenceId: thompson-2022-bothriocidaroida
          pages: 1395–1396
          figure: Figures 2 and 6
          quoteLocator: "Abstract; Introduction; Systematic palaeontology: Neobothriocidaris sp. A, Occurrence and Remarks"
    - subjectId: taxon:echinoidea
      claimKind: scientific
      claimType: divergence-time
      statement: Phylogenomic dating places the origin of crown Echinoidea between the Pennsylvanian and Cisuralian across analyses, with most posterior probability in the early Permian; Ordovician echinoids are stem-group records.
      confidence: medium
      confidenceRationale: The crown interval is recovered across phylogenomic dating analyses but remains sensitive to calibration and clock-model choices. The stem-versus-crown distinction prevents the Ordovician fossil range from being misread as the crown divergence date.
      referenceLinks:
        - relation: supports
          referenceId: mongiardino-koch-2022-echinoid-phylogenomics
          pages: 1–2
          figure: Figure 6 and Figure 6—figure supplement 1
          quoteLocator: Abstract; Introduction crown definition; Echinoid (and echinoderm) divergence times
    - subjectId: taxon:echinoidea
      claimKind: scientific
      claimType: taxonomy
      statement: Ordovician bothriocidaroids are treated as stem echinoids, whereas crown Echinoidea is defined and dated separately in the phylogenomic analysis.
      confidence: medium
      confidenceRationale: The taxonomy field is bounded to Echinoidea, the named sample or scoped clade analysis and the cited primary-study locator; interpretation is not generalized to direct ancestry or unsampled species.
      referenceLinks:
