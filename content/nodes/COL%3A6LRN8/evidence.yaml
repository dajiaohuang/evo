    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, 300-600 mm tall, corm globose, tunics overlapping. Leaves 3, terete, hollow, with fine longitudinal grooves, scabrid on the edges. Flowers 2-5 per spike, cream, light mauve outside, tepals spreading, exceeding perianth tube, open in the late afternoon and evening, then sweet scented.
            textZh: Hesperantha teretifolia Goldblatt 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_14562_0
            locator: "SANBI/WFO archive Morphology row 33249; source identifier 14562.0; cited publication: Goldblatt, P; Manning, JC. 2013. Iridaceae. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 94 - 124. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Distinctive in the centric, ± terete, minutely grooved, hollow leaves with the surface between the grooves densely covered by minute papillae or extremely short, cilia-like hairs (visible only at 10x magnification). The white flowers open late in the afternoon, mostly after 16:30, and are then sweetly scented. The flowers, typical of the genus in form, are creamy white with a perianth tube 9.5 mm long, slightly shorter than the elliptic tepals.
            textZh: SANBI 条目提供了 Hesperantha teretifolia Goldblatt 的鉴别特征。
