        claims:
          - text: Cormous geophyte, 35-45 cm, stem with a fibrous neck. Leaves narrow. Flowers crowded terminally, pink, mauve or white with a dark centre, tube filiform.
            textZh: Ixia mostertii M.P.de Vos 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 7122; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Recognised by the hard, coarse corm tunics, the fibres extending upward as a collar around the base of the plant, Ixia mostertii also has relatively large flowers, somewhat crowded apically and with a prominent dark central eye. The flowers are either pink, mauve-pink or white with the central mark dark blue or iridescent green. Notably, the style is long, dividing opposite or above the bases of the anthers. It has been suggested to be allied to I. vinacea on account of the coarse collar of fibres around the base and flowers with a dark centre, but I. vinacea has linear leaves up to 3 mm wide and exceeding the spike, very different from the shorter, broader leaves of I. mostertii. It also differs in the relatively few-flowered spike and short style dividing opposite or slightly above the base of the filaments. The prominent anthers, up to 9 mm long (before anthesis), remain straight and suberect as the flower ages, another important feature of I. mostertii and useful in distinguishing plants collected without corms from I. polystachya, the anthers of which spread widely, often becoming somewhat twisted and almost horizontal after anthesis.
            textZh: SANBI 条目提供了 Ixia mostertii M.P.de Vos 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 95037; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
