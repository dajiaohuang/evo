        claims:
          - text: Caulescent succulent to 20 cm. Leaves not pungent, with tubercles in longitudinal rows. Flowers in lax racemes, erect, white or green tinged pink, midribs green, outer tepals sometimes slightly inflated.
            textZh: Astroloba corrugata N.L.Mey. & Gideon F.Sm. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13852_0
            locator: "SANBI/WFO archive Morphology row 9038; source identifier 13852.0; cited publication: Meyer, NL; Smith, GF. 2012. Asphodelaceae: Astroloba Uitewaal. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 71 - 71. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Astroloba corrugata differs from the other tuberculate-leaved species, although glabrous members have been observed, in the genus by the non-marginate leaf tips and a more even, denser distribution of tubercles, as well as smaller leaf size. Furthermore, the affinities of A. corrugata would seem to lie with those species of the genus that lack a marked inflation of the perianth tube, viz. A. bullulata (Jacq.) Uitewaal, A. congesta (Salm- Dyck) Uitewaal and A. foliolosa (Haw.) Uitewaal. Only two smooth-leaved species, A. herrei Uitewaal and A. spiralis (L.) Uitewaal show this trait.
            textZh: SANBI 条目提供了 Astroloba corrugata N.L.Mey. & Gideon F.Sm. 的鉴别特征。
            sourceIds:
              - sanbi_3768_0
            locator: "SANBI/WFO archive Diagnostic row 66118; source identifier 3768.0; cited publication: Meyer, NL; Smith, GF. 1998. Asphodelaceae: Alooideae: Astroloba corrugata: description of a long-known species in a southern African endemic Alooid genus. Bothalia 28(1): 60 - 62. [https://doi.org/10.4102/abc.v28i1.619]. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
