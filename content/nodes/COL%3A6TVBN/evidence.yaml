        claims:
          - text: Cormous geophyte, 4-22 cm tall, twisted roots covering corm. Leaves 3-7, ovate to lanceolate, channelled, clasping at base. Flower 1, stellate, white with reddish backs, bract 1, inconspicuous.
            textZh: Pauridia ovata (L.f.) Snijman & Kocyan 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13877_0
            locator: "SANBI/WFO archive Morphology row 7538; source identifier 13877.0; cited publication: Snijman, DA. 2012. Hypoxidaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 115 - 119. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Pauridia ovata is one of a small group of species identified by a globose corm, covered by tangled roots, a solitary flowered inflorescence, with just one filiform bract and a unilocular ovary. Like the broad-leaved, shade-loving forms of the most closely related species P. gracilipes found on sandstone rocks from the Cederberg to the mountains near Worcester, plants of P. ovata also have expanded leaves which are narrowed proximally to sheathe the scape. P. ovata is easily distinguished by its white flowers, attractively flushed with wine- red on the outside of the tepals, and by the more or less erect, uppermost leaf that clasps the scape and pedicel, often for more than half its length. P. gracilipes, in contrast, has yellow or orange flowers and the leaves are most commonly more or less equally spreading.
