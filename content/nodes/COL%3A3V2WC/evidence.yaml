  claims:
    - subjectId: taxon:lingula-anatina
      claimKind: scientific
      claimType: event-mechanism
      statement: The living Lingula anatina genome, staged transcriptomes and shell proteome document a sampled phosphate-shell biomineralization toolkit; they do not demonstrate morphological stasis or the lineage's origin time.
      confidence: high
      confidenceRationale: Genome, expression and proteome data directly support molecular inventories, while deep-time stasis and origin claims require independent fossils.
      referenceLinks:
        - referenceId: luo-et-al-2015-lingula-genome
          relation: supports
          pages: Article 8301
          figure: Figures 1–5; Supplementary Notes and Tables
          quoteLocator: Genome assembly; phylogenomics; shell transcriptome and proteome; biomineralization discussion
    - subjectId: taxon:lingula-anatina
      claimKind: scientific
      claimType: fossil-range
      statement: Luo et al. document living gravid Lingula anatina adults collected in July and August at Kasari Bay with exact coordinates, so 0 Ma denotes that present-day collection only and does not date lineage origin, fossil duration or morphological stasis.
      confidence: high
      confidenceRationale: The biological-materials method and supplementary locality figure directly identify the living collection. High confidence applies only to sampled present-day status.
      referenceLinks:
        - relation: supports
          referenceId: luo-et-al-2015-lingula-genome
          pages: Article 8301
          figure: Supplementary Figure 1
          quoteLocator: "Methods: Biological materials; gravid adults collected in July and August at Kasari Bay with coordinates"
  claim-rationales.zh:
    - 基因组、表达与蛋白组数据直接支持分子清单，但深时停滞和起源主张需要独立化石证据。
    - 生物材料方法与补充地点图直接标识了现生采集。高置信度只适用于已取样的当代状态。
  claim-statements.zh:
    - 现生鸭嘴海豆芽基因组、分期转录组和贝壳蛋白组记录了一个磷酸盐壳生物矿化工具箱样本；它们不证明形态停滞或谱系起源时间。
    - Luo 等记录了 7 月和 8 月在笠利湾按精确坐标采集的现生怀卵鸭嘴海豆芽成体，因此 0 Ma 只表示该当代采集，不为谱系起源、化石延限或形态停滞定年。
