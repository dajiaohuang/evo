        usage:
          title: Clethra lanata M.Martens & Galeotti, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Trees or sometimes shrubby, 2-30 m tall, sometimes buttressed at base; young branches, petioles, and bases of peduncles densely rusty-brown lanate. Leaves grouped toward the tips of branchlets with smaller young leaves at the apices; blades of mature leaves obovate, elliptic-obovate or oblong-obovate, 7-18 cm long, 3-9 cm wide, chartaceous to sub-coriaceous, obtuse or acute at apex, narrowed at the base, the margin entire to slightly denticulate due to the emergence of the veins from the leaf blade, the midrib prominent below, scattered stellate or simple pubescence above, denser in vein furrows, below somewhat paler with two! types of pubescence, one short, stellate, and forming a layer covering entire lower surface, the other long, simple or stellate, and confined to the veins and veinlets, either layer may be absent on some individuals; petioles stout, up to 2 cm long. Inflo- rescences many flowered, 4-10 simple or branched fasiculate racemes, 8-26 cm long, the upper part of peduncle and pedicels pale, densely tomentose, the pedicels 2.5-7 mm long. Flowers white, very sweetly aromatic; sepals 5, ovate, 3-5 mm long, puberulent-tomentose within, tomentose without; petals 5, obovate, short-fimbricate, slightly longer than the sepals, pilose within, glabrous without; stamens 5, filaments subulate, glabrous, the anthers sagittate; ovary transversely-elliptic, densely pilose, the style 1.5-2.5 mm long, the stigma 3-lobed, lobes spreading. Capsule trans- versely-elliptic, pilose to tomentose, to 6 mm in diam; seeds 3, compressed.
          originalLanguage: en
          sourceField: general
