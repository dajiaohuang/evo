    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Quite glabrous; branches sulcate; leaves petiolate; leaflets sessile, cuneate-lanceolate, or linear-lanceolate, shortly acuminate, stiff, entire, or with 1 - 2 short, acute teeth at the apex, coriaceous, uninerved, concoloured on both surfaces; racemes axillary or sub-terminal, simple or panicled, glabrous, twice or three times shorter than the leaves; drupe ovate, glabrous, beaked with the persistent styles. An erect, rigid shrub, branches grayish, branchlets purple, resinous. Leaflets somewhat glaucous, acute, mostly recurved, apiculate, 1.5 - 2 inches long, 3 - 4 lines wide, the lateral ones similar, but smaller. Petioles small-winged, 4 - 6 lines long. Racemes 6-8 lines long, few-flowered, rarely branched at base. Flowers minute. Drupe about 3 lines long. Panicles in var. B 1.5 - 2 inches long. Flowers as in var. a. Fruits are wanting.
            sourceIds:
