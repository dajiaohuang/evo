  claims:
    - subjectId: taxon:coelacanthimorpha
      claimKind: scientific
      claimType: topology
      statement: Genome comparisons test the placement of the living coelacanth relative to lungfishes and tetrapods while explicitly examining outgroup bias. This extant relationship test does not delimit fossil Coelacanthimorpha, its origin, or a direct tetrapod ancestor.
      confidence: medium
      confidenceRationale: Confidence is medium because the cited primary study directly supports the bounded topology statement at the supplied locator. The confidence does not extend beyond this extant relationship test does not delimit fossil Coelacanthimorpha, its origin, or a direct tetrapod ancestor.
      referenceLinks:
        - relation: supports
          referenceId: takezaki-nishihara-2016-coelacanth
          pages: 1208–1221
          figure: Figures 1–5; supplementary alignments
          quoteLocator: "Abstract and Discussion: cartilaginous versus ray-finned fish outgroups, branch lengths and amino acid frequencies; topology tests"
    - subjectId: taxon:coelacanthimorpha
      claimKind: scientific
      claimType: divergence-time
      statement: A 24-calibration relaxed-clock analysis estimated the living coelacanth split from lungfishes plus tetrapods near 409 Ma, supporting a model-to-present route rather than a fossil Coelacanthimorpha FAD.
      confidence: medium
      confidenceRationale: "Living coelacanth lineage divergence model: the cited primary study or systematic review directly supports the stated sample, calibration or withholding boundary at the supplied locator. Confidence is medium and does not extend to a global FAD, LAD, direct ancestor or unsampled interval."
      referenceLinks:
        - relation: supports
          referenceId: broughton-2013-bony-fish-tempo
          pages: Article 2ca8041495ffafd0c92756e75247483e
          figure: Figures 1–3; time-calibrated phylogeny
          quoteLocator: Timescale of bony-fish evolution; crown Sarcopterygii split
  claim-rationales.zh:
    - 置信度为中：所引主研究在给定页码、图版或章节定位器处直接支持这一受限的拓扑表述；置信度不外推到文中明确排除的全群起源、全球首现、直接祖先或精确端点。
    - Living coelacanth lineage divergence model：所引一手研究或高质量系统综述在给定页码、图表或章节处直接支持此处的样本、校准或暂缓边界。置信度为中等。该置信度不外推至全球首现、全球末现、直接祖先或未采样区间。
  claim-statements.zh:
    - 基因组比较检验现生腔棘鱼相对肺鱼与四足类的位置，并明确考察外群偏差。这一现生关系检验不能限定化石腔棘鱼类、其起源或四足类的直接祖先。
    - 采用 24 个校准点的宽松分子钟把现生腔棘鱼与肺鱼加四足动物谱系的分化估计在约 4.09 亿年前；这支持模型至今的路线，而不是腔棘鱼类的化石首现。
