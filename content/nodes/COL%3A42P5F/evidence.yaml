          publishedAt: undated
          originalSourceText: Tall shrub, the stems densely retrorse-strigose with brownish hairs; petioles 1-3 cm. long, densely hirsute; leaf-blades ovate-oblong, up to 13 cm. long and about half as wide, short-acuminate, obscurely denticulate, obtuse to subrotund at base, 5-nerved, densely pubescent with simple hairs on both sides; panicle up to 17 cm. long, densely pubescent; pedicels about 1 mm. long; hypanthium cup-shaped, about 2 mm. long to the torus, densely hirsute, the hairs 1-1.5 mm. long; calyx-tube very short, its lobes semicircular, about 0.5 mm. long from the sinus, barely surpassed by the triangular-acuminate exterior teeth; petals white, suborbicular, inequilateral, retuse, 1.6 mm. long; stamens isomorphic; anthers obovoid-oblong, 1.6 mm. long, opening by a wide terminal pore, the connective elevated at base dorsally and prolonged 0.3 mm. below the thecae into two lateral lobes; stigma capitate.
