          title: Mimosa pudica L., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Prostrate herb to somewhat suffruticose, the branchlets terete, glabrous or pubescent (often both glabrous and pubescent branchlets on same plant), heavily or lightly armed with recurved thorns, the thorns broad-based and black-tipped. Leaves moderately small, sensitive, bipinnate, the pinnae 1 or (more commonly) 2 pairs, the leaflets mostly about 16 pairs; petiole elongate, up to 4 cm. long, sub- terete, glabrous or pubescent and sometimes even aculeate, eglandular, with a con- spicuous basal pulvinus; rachis short (2-3 mm.) or obsolete; pinnae congested, the pinnular rachis and pulvinus usually setose, with a pair of squami just above the pulvinus; leaflets linear or linear-oblong, 3-12 mm. long and mostly 1-2 mm. wide, abruptly acute or sulbobtuse apically, inequilaterally truncate or rounded basally, with 1 or 2 smaller basal veins in addition to the costa, venation remote but visible below, glabrous except the margins (and sometimes the lower surface) yellow-setose; stipules linear-lanceolate, falcate, 4-8 mm. long, setose. Inflorescence of axillary, pedunculate, head-like spikes; peduncle about 2 cm. long in maturity; spikes short, very condensed, many-flowered; floral bractlets linear-lanceolate or linear-oblanceolate, setose. Flowers pinkish, sessile; calyx extremely minute, only a fraction of a mm. long; corolla funnelform, 1-2 mm. long, glabrous, 4-lobed, the lobes about half as long as the tube; stamens 4, about 7 mm. long, free, gla- brous; anthers minute, nearly orbicular; ovary small, glabrous, bilateral, the style about equalling the stamens. Legumes typically in a dense cluster, usually 10-15 mm. long and about 4 mm. wide, flat, glabrous, segmented, somewhat constricted between the articulated, 1-seeded segments, heavily setose-aculeate on the margins, the margins persisting after dispersal of the segments.
