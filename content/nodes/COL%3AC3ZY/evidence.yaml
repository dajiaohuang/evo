        claims:
          - text: Plants stemless or short-stemmed, 300-600 mm tall excluding inflorescence; stems branched into small groups. Leaves 16-20 per rosette, 160-350 x 75-120 mm, lined, glaucous green with dull white spots, margins horny, minutely denticulate. Inflorescence a 400-600 mm tall panicle; racemes sublax, subcapitate; bracts deltoid-acuminate, 5-10 x 2-4 mm, 3-5-nerved. Flowers yellow tinged orange, 22-30 mm long, funnel-shaped above constriction above ovary; outer segments free for 4-5 mm, inner segments adnate to outer; pedicels 14-25 mm long. Anthers exserted 1-2 mm. Ovary ±7 x 2 mm; style exserted 1-2 mm. Fruit ±22 x 10 mm.
