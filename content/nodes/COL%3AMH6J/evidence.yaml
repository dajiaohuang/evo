        claims:
          - text: Robust, leafy herb, up to 1 m high. Leaves flat, with 1 central vein. Upper petal lobe 15-25 mm long. Lower petal lobe narrowly linear throughout, slightly curved. Flowers green and white.
            textZh: Bonatea antennifera Rolfe 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_11118_0
            locator: "SANBI/WFO archive Morphology row 539; source identifier 11118.0; cited publication: Herman, PPJ; Retief, E. 1997. Plants of the northern provinces of South Africa: Keys and diagnostic characters. Strelitzia 6: 1 - 681. National Botanical Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: B. antennifera, B. boltonii and B. speciosa are morphologically similar. B. antennifera is distributed mainly in the north and northeastern interior of South Africa, usually in open grassland and dry woodland areas. Populations of B. antennifera from northern KwaZulu-Natal are atypical, flowering from June to July and producing markedly elongate spurs of 51-58 mm (typical flowering is from March to May and spur length 27-44 mm). The claw of the lip and basal fusion of the lip with the stigmatic processes, lateral sepals and lower petal lobes, as well as stigmatic process and rostellum lateral lobe length, fall within the maximum size range for the species. The rostellum lateral lobes are distinctive in posture being sub-erect to 45o, rather than projecting forwards. A specimen of B. antennifera from Zimbabwe (Munro s.n. (K)) has similar rostellum lateral lobe posture (sub-erect to 45o) and an average spur length of 44 mm. B. antennifera and B. speciosa are largely allopatric, being constituents of savannah and coastal dune forest vegetation types, respectively, but both overlap with B. boltonii. The three species also differ in their peak flowering period, with most populations of B. antennifera flowering from March to May, B. speciosa from June to December, and B. boltonii from December to March. Despite the overlapping distribution and flowering times, no intermediate forms have been observed, even in mixed populations (Flanagan 647 (GRA)). Quantitatively, B. antennifera and B. boltonii are distinguished by a critical divide occurring at 15 mm for stigmatic process length and 24 mm for lower petal lobe length, with B. boltonii falling below the divide. Posture of the lower petal lobes and lip lateral lobes are also significantly different in the species-both projecting forward, ascending in B. antennifera, whilst horizontally spreading lower petal lobes and descending lip lateral lobes occur in B. boltonii. B. speciosa is distinct from B. antennifera and B. boltonii with respect to its longer clavate spur apex ((13.5-) 15.0-32.0 mm) in combination with its wider lower petal lobes ((1.5-)2.0-5.5 mm). The lower petal lobe posture projects forward and is weakly to strongly deflexed, with descending lip lateral lobes.
            textZh: SANBI 条目提供了 Bonatea antennifera Rolfe 的鉴别特征。
