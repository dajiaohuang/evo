          title: Cordia sebestena L., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrubs or trees, the younger stems pubescent. Leaves ovate, sometimes broadly so, acute, entire, the bases ? rounded, to 21 cm long and 15 cm wide, scabrous above, pubescent on the veins beneath; petioles ca 3-4 cm long. Inflorescences cymose, paniculate, loosely-flowered. Flowers perfect, pedicels ca 0.5-1.5 cm long, pubescent; calyx cylindrical, the tube ca 10-12 mm long at anthesis, 3(-4)- lobed, the lobes deltoid and ca 1-2 mm long, greatly enlarging in fruit; corolla funnelform, vermillion, the tube ca 20-25 mm long, 5-6-lobed, the lobes ca 10 mm long and 8-9 mm wide; stamens 5(-6), included, the filaments free from the corolla tube for ca 2-3 mm, ? glabrous at the point of attachment, the anthers ca 2.2-2.4 mm long; ovary ovoid, the style ca 20-25 mm long, the lobes clavate and flattened. Fruit drupaceous, ovoid, hard, ca 2-2.5 cm in diam, the calyx tightly adhering and becoming white and fleshy.
