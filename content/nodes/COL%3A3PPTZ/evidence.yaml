        usage:
          title: Inga oerstediana Benth., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Small or moderate tree, the branchlets dark ferruginous-tomentose, becoming less densely so in age. Leaves large, normally 8 -foliolate; petioles up to 5 cm. long, terete, densely dark ferruginous-tomentose; rachis up to 15 cm. long, tomentose like the petiole except very lightly so on the wings, conspicuously alate for the uppermost rachial internode, progressively less alate in penultimate and succeeding (lower) rachial internode (s), bearing between insertion of the petiolules large or small sessile glands (or these sometimes lacking), the glands laterally extended and markedly concave; leaflets 4 (sometimes 3 or 5) pairs, asymmetrically elliptic, ob- long or ovate, 7-16 cm. long and 3-8 cm. wide, rounded or subtruncate basally, inequilaterally acute apically, lightly pubescent above except on the veins where heavily so, moderately pubescent below except densely tomentose on the elevated veins, reticulate; stipules caducous. Inflorescence of 1 to few pedunculate spikes from foliate or young defoliate nodes, the spikes 3-7 cm. long, floriferous for the upper 1-3 cm., densely tomentose like the petiole; bracts ovate, small, promptly caducous. Flowers quite congested, white; calyx campanulate-cupuliform, 3-6 mm. long, ferruginous-hirsute or pilose, the teeth somewhat unequal; corolla sub- tubular, about 1 cm. long, somewhat flaring apically although constricted for the lower half its length; densely ferruginous-hirsute or pilose, the lobes about 2 mm. long; stamens 2.0-2.5 cm. long, the staminal tube included within the corolla; ovary linear, the style exceeding the stamens. Legume apparently linear, 12 or more cm. long and less than 1 cm. wide, subterete and longitudinally sulcate, sessile, ferruginous-tomentose.
          originalLanguage: en
          sourceField: general
