    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Very pale or pure white flowers, uncrisped perianth segments and a structural peculiarity in having small, square bifid scales between each of the filaments making this a very distinct species. The pedicels are densely pubescent but the scape is not. The filaments are less than half the length of the perianth segments. Scape up to 7-5 cm. Perianth segments up to 2-4 cm x 5 mm. The flower is distinctly funnel form. The size of this plant can vary a lot with the scape having a length of up to 95 cm.
