    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte to 60 cm. Leaves lanceolate, twisted. Flowers crowded terminally, salver-shaped, pale to deep pink, purple to blackish in centre, slightly scented, tube filiform, tepals united below in a wide cup, stamens blackish.
            textZh: Ixia superba J.C.Manning & Goldblatt 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 7142; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Recognised by the relatively crowded spike of large flowers and the pink perianth with a large, glossy black centre. Unusual for sect. Ixia the black bases of the tepals are united in a wide cup ±3 mm deep. The stamens and style branches are also darkly pigmented with the erect filaments clasping the style and the anthers diverging. Significantly, the style divides above the bases of the anthers. The lower two leaves are lanceolate and comparatively broad, up to 10 mm wide and the third leaf sheathes the stem for its entire length. It has been confused with I. gloriosa and was at first included in that species, perhaps due to the flower colour, although I. gloriosa has deep magenta flowers with a blackish centre when seen alive. Differences between the two, apart from perianth colour, include leaf width (leaves of I. gloriosa are linear and only up to 3 mm wide), shape of the flowers and the short, erect branches of I. gloriosa in contrast to the spreading branches of I. superba. The style of I. gloriosa divides opposite the bases of the filaments unlike that in I. superba. Both species have the outer floral bracts 3-toothed, sometimes with the central tooth somewhat more prominent.
            textZh: SANBI 条目提供了 Ixia superba J.C.Manning & Goldblatt 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 95039; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
