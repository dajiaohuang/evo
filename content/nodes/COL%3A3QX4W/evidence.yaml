        claims:
          - text: Shrublet or perennial herb, 0.12-0.50 m high, all parts minutely and densely puberulous. Leaves sometimes glandular on margins, narrowly to broadly lanceolate, apex broadly acute to obtuse, base cuneate; petiole slender, 0-6 mm long. Inflorescence of 1(2) flowers per cyme, sessile, scattered in leaf axils. Bract and bracteoles reduced, subulate to triangular, ±2 x 1 mm. Calyx of 5 subequal, narrowly lanceolate lobes. Corolla (4-)5-8 mm long, white with mauve lines on palate. Pollen 2-colporate, 35-42 µm long, areolate. Capsule 4-seeded, cylindrical, puberulous, delicate, up to 8 mm long.
            sourceIds:
