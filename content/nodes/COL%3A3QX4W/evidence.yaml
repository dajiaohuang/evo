            locator: "SANBI/WFO archive Morphology row 49806; source 1111.0; publication: Immelman, KL. 1995. 5. Justicia. In: OA Leistner (ed.), Fl. S. Africa 30(3,1): 18 - 46. National Botanical Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: The species is similar to and presumably derived from J. protracta, but the greatly reduced bract is characteristic. The distributions of the two species do not overlap.
