        claims:
          - text: Cormous geophyte, 20-60 cm. Leaves linear. Flowers long-tubed, cream-coloured, lower tepals each with narrow yellowish green callus, bracts fairly short, acute.
            textZh: Tritonia linearifolia Goldblatt & J.C.Manning 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 6867; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Recognised by the linear, grass-like leaves as long as the flowering stem or longer, 1-2 mm wide and dry at flowering, and inclined spikes of white, long-tubed, zygomorphic flowers with low, greenish yellow, ridge-like calluses on the lower tepals. The corms bear short, fasciated stolons and many small cormlets. The species flowers in summer, in December, at which time the leaves are dry and withered. The flowers are almost indistinguishable from those of Tritonia pallida and the two may comprise a vicariant species pair. That species, centred in the western and central Little Karoo, has lanceolate leaves mostly 8-15 mm wide and about half as long as the flowering stem, and occurs on shale slopes, primarily in renosterveld or transitional vegetation types, flowering from mid-September to late October. The long, linear leaves of Tritonia linearifolia may lead to confusion with the partially sympatric T. bakeri, a long-tubed species widespread through the Little Karoo from Ladismith to the Long Kloof, but the leaves of T. bakeri are highly characteristic, fleshy and semi-terete in section when fresh, without thickened main vein or margins. Flowering is also somewhat earlier, mainly October to November, at which time the foliage is still green. The two species are florally very different, although this is best seen when alive. Tritonia linearifolia has zygomorphic flowers with arcuate stamens whereas the perianth in T. bakeri is almost actinomorphic and salver-shaped, with the flowers inverted, curved or slightly twisted at the base, so that the dorsal tepal is lowermost and the stamens almost central with the anthers facing upwards.
            textZh: SANBI 条目提供了 Tritonia linearifolia Goldblatt & J.C.Manning 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 94801; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
