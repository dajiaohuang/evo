    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Bulbous geophyte to 90 cm. Leaves 5-11, dry or absent at flowering, rosulate, suberect, narrowly to broadly lanceolate, channelled, midrib prominent. Flowers usually 6-12, often turned to 1 side, large, trumpet-shaped, pink to white, throat usually pale lemon, fragrant.
            textZh: Amaryllis belladonna L. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
