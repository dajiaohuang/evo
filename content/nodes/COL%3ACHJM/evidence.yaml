            locator: "SANBI/WFO archive Morphology row 8767; source identifier 13845.0; cited publication: Snijman, DA. 2012. Amaryllidaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 53 - 62. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: The flowers show considerable natural variability, both in size and colour. The perianth varies from deep rose pink to nearly white and is 7-11 cm long. Some of the forms have been afforded varietal and even specific rank but field observations do not support this treatment. The peduncle of A. belladonna persists for a lengthy period after the ripening of the seeds. This contrasts with the collapse of the peduncle just above the bulb of species of Brunsvigia and Crossyne ['as Boophone'] for example, whose ripe inflorescences are rolled about the veld by wind during seed dispersal.
            textZh: SANBI 条目提供了 Amaryllis belladonna L. 的鉴别特征。
