    facets:
      morphology:
        status: partially-supported
        claims:
          - text: "Grass aloe with acaulescent rosettes, solitary or sometimes suckering from base to form small groups, ascending or decumbent, up to 0.13 m high. Leaves rosulate, ascending-spreading to ± prostrate, linear, subterete, 80-190 x 1.7-2.5 mm; leathery to smooth, dark green to purplish green, especially towards base with small, faint, oval white spots on lower surface, margins denticulate, especially in lower 3/4, marginal teeth white, cartilaginous, 0.3 mm long, 1.5 mm apart, apex acuminate. Inflorescence 0.100-0.145 m high, ascending to decumbent, simple. Raceme shortly capitate, 15 mm long, rather dense. Floral bracts 4 x 2.5 mm. Pedicels 7-9 mm long. Flowers: perianth pink, greenish tipped, 8-11 mm long, narrowing towards slightly upturned mouth, cylindrical, angular and trigonous; outer segments free to base; stamens and style not exserted. Flowering time Feb., Mar."
            textZh: Aloe liliputana van Jaarsv. & Harrower 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_18489_0
            locator: "SANBI/WFO archive Morphology row 90307; source identifier 18489.0; cited publication: Klopper, RR; Smith, GF; Bayer, MB; Bredenkamp, CL. 2019. Asphodelaceae. In: CL Bredenkamp (ed.), A Flora of the Eastern Cape Province, Strelitzia 41(3): 1647 - 1680. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: "Distinguishing characters: distinguished from other EC grass aloes (A. boylei, A. cooperi, A. ecklonis, A. kniphofioides, A. linearifolia, A. micracantha, A. minima and A. myriacantha) by rosulate, wiry leaves of 2 mm wide with white non-tuberculate spots on lower surface, especially towards base. Unbranched inflorescence with rather dense, head-shaped raceme; flowers pink, green-tipped, 8-11 mm long; floral bracts as long as, or a little longer than pedicels."
