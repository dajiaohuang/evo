    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte to 45 cm, ultimate branches sessile. Leaves 2 or 3, linear, channelled and trailing. Flowers pale blue-mauve, tepals spreading, with short ascending claws. Capsules globose, exserted.
            textZh: Moraea pearsonii Goldblatt & J.C.Manning 的 SANBI 物种条目记载了植株、叶片和花部形态。
            sourceIds:
              - sanbi_13878_0
            locator: Strelitzia 29; archive Morphology row 7430, source 13878.0
            placeTimeScope: Regional species account published 2012; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
          - text: Flowering in the dry season, the solitary, long, trailing leaf up to 1 m long is dry or almost so when flowering begins. The relatively small, blue flowers are distinctive, resembling those of sect. Hexaglottis in having subequal tepals with short erect claws, free stamens, and style branches divided to the base into filiform arms extending between the stamens. Plastid DNA data confirm an alliance with Moraea crispa and M. pseudospicata, both of which have small, blue flowers with partly united filaments and flattened style branches forked at the tips and appressed to the subtending anthers. The leaf of M. pearsonii is linear and narrowly channelled when fresh, but with the margins tightly inrolled on drying so that the leaf then appears to be terete. The main stem and branches bear sessile rhipidia at the upper nodes, a pattern found in several species of the section, including M. pseudospicata and M. verecunda, both Western Karoo endemics.
            textZh: SANBI 条目提供了 Moraea pearsonii Goldblatt & J.C.Manning 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: Strelitzia 42; archive Diagnostic row 94214, source 18638.0
            placeTimeScope: Regional species account published 2020; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
