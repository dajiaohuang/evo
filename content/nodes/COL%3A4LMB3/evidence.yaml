        claims:
          - text: Plants epiphytic, to 400 mm tall; pseudobulbs conical, covered by leaf-sheaths, 10-70 x 3-10 mm; leaves 3-5, narrowly elliptic, minutely unequally bilobed, venation prominent, 100-200 x 10-28 mm. Inflorescences equalling or longer than the leaves, paniculate, to 300 mm tall, peduncle and rachis covered in membranous, decaying sheaths; branches erect, densely many-flowered, 25 mm long, sparsely puberulous; bracts narrowly lanceolate, acuminate, 2-3 mm long. Flowers variable from yellow to yellow-green, pink or purple. Sepals unequal, apiculate, often obtuse; median narrowly triangular to oblong, 3-3.5 x 2 mm; laterals obliquely triangular, 4 x 3 mm. Petals lorate to lorate-spathulate, round, 2.8-3 x 0.8 mm. Lip obovate, 3-lobed, 4-5 mm long, disc ecallose; midlobe suborbicular, apically apiculate, margins uneven, 2 mm long; side lobes falcate, acute, 1 mm long, porrect; mentum conical, 2.5-3 mm tall. Gynostemium 1 mm tall. Capsules fusiform, 10 x 6 mm.
