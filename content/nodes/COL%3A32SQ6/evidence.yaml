        usage:
          title: Cyclanthera dissecta (Torr. & A.Gray) Arn., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Vines; stems slender, glabrous. Leaves 5-foliolate, sometimes the two lateral lobes slightly joined at the base and the leaves 3-foliolate, the blade suborbicular in outline, 2-4 cm wide and long, the leaflets lanceolate, the lateral leaflets often pedately lobate, the margins coarsely crenate-serrulate, the apex acute, mem- branaceous, the upper surface scabrellous, the lower surface glabrate; petiole 2-5 cm long, slender; tendrils simple. Staminate flowers axillary, elongate- paniculate; rachis 15-25 cm long, slender, flowered only on the upper half, the flowers often in subumbelloid clusters; pedicels 3-6 mm long, filiform; calyx shallowly capulate, 3-5 mm wide, greenish-white, the lobes minute, subulate; corolla ca. 6 mm in diameter, the white or cream lobes 2.0-2.5 mm long, lanceolate, the outer surface glabrous, the inner surface slightly papillate, 3- nerved; androecial head subsessile, 0.5-1.0 mm in diameter. Pistillate flowers solitary, in same axis as the staminate flowers; peduncles 2-15 mm long; calyx and corolla as in the staminate flowers but slightly smaller; ovary obliquely ovoid, rostrate, ca. 2 mm long; setose, the stigma subglobose. Fruits greenish, obliquely ovoid, 1.5-2.0 cm long, explosively debiscent, the seta 5-7 mm long; in outline, 2-4 cm wide and long, the leaflets lanceolate, the lateral leaflets often seeds grayish brown, ovoid, compressed, the margin irregularly appendaged.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 3700
