    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Densely leafy, minutely puberulous shrublet to 30 cm. Leaves tufted, oblong, minutely glandular throughout. Flowers in oblong spikes, white, bracts minutely glandular and with few to many, acute hairs.
            sourceIds:
              - sanbi_14444_0
            locator: "SANBI/WFO archive Morphology row 6131; source 14444.0; publication: Manning, JC; Goldblatt, P. 2012. Scrophulariaceae: Selago L. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 754 - 761. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Selago acocksii will be found in herbaria under several names, including S. tenuis, which it resembles in fades but from which it differs in its leaves, minutely glandular all over (not merely glandular-punctate with or without a few minute hairs at the apex), bracts minutely glandular all over together with few to many acute hairs (not with only a few scattered globular glands and with or without a few minute hairs on the outer surface), and corolla tube mostly shorter. Selago tenuis is known only from Namaqualand.
            textZh: SANBI 条目提供了该种的鉴别特征。
            sourceIds:
              - sanbi_10810_0
            locator: "SANBI/WFO archive Diagnostic row 46500; source 10810.0; publication: Hilliard, OM. 1999. The Tribe Selagineae (Scrophulariaceae). Royal Botanic Garden, Edinburgh. [All rights reserved]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
