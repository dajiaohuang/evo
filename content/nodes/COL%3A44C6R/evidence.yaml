    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants mostly 380-450 mm high, solitary. Corm ± 10 mm diam.; tunics not known. Stem sheathed below by brittle, entire, or irregularly broken cataphylls ribbed silver and purple below, unbranched, covered by (3)4 or 5 usually overlapping sheathing leaves 12-14 mm long. Foliage leaf solitary, exceeding stem, terete with narrow adaxial groove, ± 5 mm diam. Rhipidial spathes green with dry, brown tips, inner 80-140 mm long, outer ± as long or slightly shorter. Flowers probably long-lived, deep yellow, tepals often ± darkly veined, outer tepal limbs with darker yellow nectar guides at bases; outer tepals 45-50 x ± 24 mm, claws ± 2/3 as long as limbs; inner tepals ± 40 x 15 mm long, ascending to erect. Filaments ± 8 mm long, united in lower 2/3; anthers ± 10 mm long, yellow. Ovary cylindric, ± 15 mm long; style branches ± 13 mm long, crests ± 10 mm long. Capsules cylindric-3-lobed, 20-25 mm long.
            textZh: Moraea hiemalis Goldblatt 的 SANBI 物种条目记载了植株、叶片和花部形态。
            sourceIds:
              - sanbi_18638_0
            locator: Strelitzia 42; archive Morphology row 84358, source 18638.0
            placeTimeScope: Regional species account published 2020; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
          - text: A particularly distinctive member of the Moraea spathulata complex, M. hiemalis is unusual in flowering in winter, July and August. It is distinguished by its cylindrical leaf with the margins tightly inrolled, and its solitary habit. The plants are also generally smaller in most features than typical M. spathulata and its immediate allies, the outer tepals 45-50 mm long and the inner ± 40 mm long.
