    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Bulbous geophyte, 5-30 cm. Leaves 2, dry at flowering, prostrate, often broader than long, leathery, often outlined with red. Flowers crowded in a dense head, red or pink, bracts 5-11, leathery, red or pink.
            textZh: Haemanthus sanguineus Jacq. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13845_0
            locator: "SANBI/WFO archive Morphology row 8788; source identifier 13845.0; cited publication: Snijman, DA. 2012. Amaryllidaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 53 - 62. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: The diagnostic features of H. sanguineus are as follows. The peduncle is unmarked, often compressed and furrowed. The 5-11, thin-textured spathe valves are erect to slightly spreading, while those situated laterally are keeled and falcate. The perianth segments spread apart slightly from the base. The leaves are either prostrate or adpressed to the ground. They are characteristically leathery, mostly rough and dark green on the adaxial surface. The margin is cartilaginous, red to opaque and either smooth or denticulate. The bulb is flattened laterally with imbricate, distichous tunics Field observation has shown that H. sanguineus is an extremely polymorphic species. The present circumscription incorporates several ecological races, centred mostly in the mountains and valleys of the Worcester district. The great diversity in size of floral and vegetative parts, as well as the many subtle differences in flower colour between populations, makes it difficult to subdivide the species into infraspecific taxa.
            textZh: SANBI 条目提供了 Haemanthus sanguineus Jacq. 的鉴别特征。
