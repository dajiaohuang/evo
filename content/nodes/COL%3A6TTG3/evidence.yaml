        usage:
          title: Paullinia fuscescens Kunth, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Tendrilled lianas; stems terete, pilose, usually not lenticellate, the younger stems and petioles densely rufous-pilose to -villous; wood simple; tendrils borne from leaf axils or peduncles, bifid. Leaves biternate, 5-13 cm long; petioles pu- bescent throughout, ribbed on the upper surface; rachis winged, sometimes widest in the upper half; leaflets ovate to elliptic or obovate, rounded to acuminate at the apex, the acumen usually rounded and minutely apiculate, attenuate at the base, sparsely and deeply crenate in the distal 1/2-2/3, densely pubescent on the mid- rib and major veins above, sparsely pubescent on the surface, conspicuously pu- bescent throughout on the lower surface especially on the veins and with greatest concentration in the vein axils, the terminal leaflets 2.5-8.5 cm long, 1.3-4 cm wide; stipules inconspicuous, minute. Inflorescences generally axillary, often borne on the same short branches as the tendrils, the thyrses borne in a compacted, slender, spikelike structure to ca. 6 cm long; pedicels short or obsolete, elongating somewhat in fruit. Flowers 3.5-4.5 mm long; sepals densely tomentose, boat shaped and rounded at the apex; petals white, spatulate, rounded at the apex, ca. 3.5 mm long, weakly glandular within, the scales of the anterior petals ca. 2.5 mm long, villous, the crest ca. 0.7 mm long, longer than broad, shorter than the nar- row, densely villous, deflexed appendage; staminate flowers with stamens to 2.8 mm long, the filaments densely villous; bisexual flowers not seen. Fruits suborbic- ular to broadly obovate, 13-20 mm long, rounded to emarginate at the apex, 3-locular, 3-winged, moderately to densely pilose, the medial crest sharply raised; seeds 1-3, globose, white-artillate at the base.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 12524
