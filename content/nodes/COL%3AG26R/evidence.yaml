    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Kew's species profile describes small flowers with four free sepals, four white spatulate petals, six stamens arranged as four median and two longer lateral stamens, and a superior gynoecium of two fused carpels with a false septum bearing about 50 or more ovules.
            textZh: 邱园物种简介记载，其花有 4 枚离生萼片、4 枚白色匙形花瓣、6 枚雄蕊（4 枚中位、2 枚较长侧位），以及由 2 枚合生心皮构成的上位雌蕊；假隔膜上约有 50 枚以上胚珠。
            sourceIds:
              - kewflora
            locator: POWO page, Kew Species Profiles section 'Description'
            placeTimeScope: Species-profile description; no population sample or date-specific measurement is stated.
            lifeStatus: Botanical species description; the cited account does not separate wild and cultivated floral anatomy.
        gaps:
          - Vegetative variation, developmental anatomy, and population-level morphology have not been systematically assessed.
      lifeHistory:
        status: partially-supported
        claims:
          - text: Kew describes A. thaliana as an annual. Its UK cultivation guidance says autumn-sown plants flower the following March to June, then die and usually self-sow; this is cultivation guidance for the UK, not a range-wide calendar.
            textZh: 邱园将该种描述为一年生植物；其英国栽培说明记载，秋播植株通常在次年 3 至 6 月开花，之后死亡并通常自行播种。该时间只适用于所述英国栽培情境，不代表全分布区的物候日历。
            sourceIds:
              - kewflora
            locator: POWO page, General information; Kew Species Profiles section 'Cultivation'
            placeTimeScope: Annual life form and UK cultivation schedule as presented by the accessed Kew account; no broader phenological sampling frame is supplied.
            lifeStatus: Cultivation statements are explicitly limited to the UK gardening context.
        gaps:
          - Seed dormancy, germination ecology, generation time across accessions, and wild population life-history variation remain unassessed.
      ecology:
        status: partially-supported
        claims:
          - text: Kew's UK species profile describes A. thaliana as a pioneer of rocky ground, dunes, open sandy and calcareous habitats, and also records it in disturbed sites such as gardens, waste ground, and railway ballast.
            textZh: 邱园英国物种简介将该种记为岩地、沙丘、开阔沙地和钙质生境的先锋植物，也记录其见于花园、荒地和铁路道砟等受扰动地点。
            sourceIds:
              - kewflora
            locator: POWO page, Kew Species Profiles section 'Ecology'
            placeTimeScope: Regional UK profile statement; it does not establish habitat frequency or ecology throughout the global range.
            lifeStatus: Wild and disturbed-site observations are reported by the regional profile; cultivation observations are not inferred.
        gaps:
          - Interactions, seasonal resource use, and ecology outside the profile's regional scope have not been assessed.
      evolution:
        status: partially-supported
        claims:
          - text: A 2016 study of 1,135 resequenced natural inbred lines sampled across native Eurasian and North African areas and recently colonized North America reported relict populations, primarily in Iberia, and a lineage inferred to have spread north from an unknown glacial refugium. These are study-specific population-history inferences, not a complete species history.
            textZh: 一项 2016 年研究对来自欧亚及北非原生区、以及近期定殖的北美地区的 1,135 个天然自交系进行了重测序；研究报告了主要位于伊比利亚的遗存种群，并推断另一谱系从位置未知的冰期避难所向北扩散。这些是该研究基于样本得出的种群历史推断，并非完整物种史。
            sourceIds:
              - arab1001
            locator: Abstract; Results and Discussion, The Sample; Figure 1A
            placeTimeScope: Genome sample and interpretation published in 2016; geographic coverage follows the study's sampled accessions.
            lifeStatus: Natural inbred accessions; domesticated or cultivated histories are not inferred.
        gaps:
          - The sampled accessions do not constitute a census; alternative demographic models and later genomic findings have not been reviewed here.
      distribution:
        status: not-assessed
      fossil:
        status: not-assessed
      conservation:
        status: not-assessed
