        usage:
          title: Cassipourea elliptica (Sw.) Poir., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrubs or trees to 17 m. tall. Leaves elliptic or ovate, the apex acuminate or acute, the base cuneate, 5-16 cm. long, 2.0-6.5 cm. wide, the upper half sometimes serrate, glabrous, coriaceous or membranaceous; petiole 3-10 mm. long; stipules 4-5 mm. long, appressed pilose dorsally, soon caducous. Flowers numerous, occasionally solitary; pedicels 2-5 mm. long, articulated just beneath the flower, minutely bracteate at the base, strigose to glabrous. Calyx fleshy, campanulate, to 5 mm. long, with 4-5 lobes 2 mm. long, often stipitate at the base, sericeous within. Petals 4-5, spatulate, laciniate, pilose to glabrous. Stamens 15-25, the slender filaments sometimes united at the base, inserted on the outside of the fleshy disc. Ovary 3-locular, sericeous above at the base of the style; style slender, 4-5 mm. long, sericeous at the base or nearly to the stigma; stigma capitate. Fruit ovoid, crowned by the persistent calyx.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 11059
