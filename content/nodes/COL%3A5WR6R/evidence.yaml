          title: Brosimum costaricanum Liebm., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: "Trees up to 30 m. tall, the younger twigs relatively slender, softly white- puberulent to glabrate. Leaves relatively small, rather narrowly obovate-oblong, the tip rather abruptly subcaudate-acuminate, the base obtuse or rounded, 8-18 cm. long, 2-4 cm. broad, membranaceous, softly white-tomentellous or puberulent on the veins beneath; petioles about 5 mm. long. Inflorescences possibly dioecious, globose, the staminate with peduncles about 1 cm. long, very slender, about 1 cm. in diameter. Staminate flowers: tepals 5, nearly free and essentially equal, about 2 mm. long; stamens 3-4, widely exserted, the anthers basifixed, oblongoid, about 1 mm. long. Pistillate flowers presently unknown. Nearly mature fruits globose, about 1.5 cm. in diameter, with persistent peltate bracts, the seed about 1 cm. long."
