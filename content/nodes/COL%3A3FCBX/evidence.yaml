        claims:
          - text: Caulescent succulent with long, nodding leafy stems to 1 m. Leaves distichous, rough, margins sparsely toothed. Flowers in a suberect raceme, nodding, pink or white and green, much inflated below.
            textZh: Gasteria rawlinsonii Oberm. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13855_0
            locator: "SANBI/WFO archive Morphology row 9065; source identifier 13855.0; cited publication: Manning, JC; Goldblatt, P. 2012. Asphodelaceae: Gasteria Duval. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 74 - 75. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Gasteria rawlinsonii is most distinctive, both in floral and vegetative characters. Its long leafy, pendent stems and its oblong-ovoid ovary, which may bear three distal appendages, immediately distinguish it from any other species. In floral characteristics it seems to be allied to G. glomerata, G. bicolor and G. baylissiana. The differences between G. rawlinsonii and G. glomerata are discussed under the latter species. G. bicolor has a short, decumbent to erect, leafy stem up to 200 mm long and G. baylissiana is a dwarf acaulescent species. Unique features of G. rawlinsonii are the almost immaculate, asperulous leaves which are armed with distinct white- to green prickles that harden and turn black with age. It is also the only Gasteria species that does not proliferate from broken leaf pieces. The plants are variable, especially in leaf arrangement and the size of the teeth on the leaf margin. Different populations have either distichous or spirally arranged leaves, and these do not occur together in the same ravine, although they are sometimes separated by only a few kilometres.
            textZh: SANBI 条目提供了 Gasteria rawlinsonii Oberm. 的鉴别特征。
            sourceIds:
              - sanbi_8534_0
            locator: "SANBI/WFO archive Diagnostic row 78226; source identifier 8534.0; cited publication: Van Jaarsveld, EJ. 1994. Gasterias of South Africa: a new revision of a major succulent group. Fernwood Press, Cape Town. [All rights reserved]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
