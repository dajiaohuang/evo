  claims:
    - subjectId: taxon:ammonitida
      claimKind: scientific
      claimType: topology
      statement: An integrated conch-character analysis resolves relationships within sampled Hildoceratidae; this family-level result supplies an Ammonitida case study rather than an order-wide tree or range.
      confidence: medium
      confidenceRationale: Explicit coding and sensitivity analyses support the family topology, while narrow scope prevents extending it to all Ammonitida.
      referenceLinks:
        - referenceId: bardin-2017-hildoceratidae
          relation: supports
          pages: 21–40
          quoteLocator: Figures 2–8; integrated coding and phylogenetic results
    - subjectId: taxon:ammonitida
      claimKind: scientific
      claimType: fossil-range
      statement: Bardin et al. analyze a 105-taxon Early Jurassic Hildoceratidae matrix, supporting a 201.4–174.7 Ma period envelope for that sampled ammonitid family rather than the complete Ammonitida range or a Cretaceous extinction endpoint.
      confidence: medium
      confidenceRationale: The paper directly scopes its family sample to the Early Jurassic. Medium confidence applies to the broad period envelope and not to unsampled ammonitid lineages.
      referenceLinks:
        - relation: supports
          referenceId: bardin-2017-hildoceratidae
          pages: 21–40
          figure: Figures 2–8
          quoteLocator: "Abstract: Early Jurassic Hildoceratidae; Methods: 105-taxon matrix"
        - relation: contextualizes
          referenceId: ics-2026-06
          pages: International Chronostratigraphic Chart v2026/06
          figure: Global chronostratigraphic scale
          quoteLocator: Numerical boundaries for the named stages and periods used to bound the source sample
  claim-rationales.zh:
    - 明确编码与敏感性分析支持科级拓扑，但狭窄范围不能扩展到全部菊石目。
    - 论文把该科级样本直接限定在早侏罗世。中等置信度适用于宽泛的纪级包络，不外推到未取样的菊石目谱系。
  claim-statements.zh:
    - 整合壳体性状分析解析了取样 Hildoceratidae 内部关系；这一科级结果是菊石目案例，而不是目级系统树或范围。
    - Bardin 等分析了一个包含 105 个类群的早侏罗世 Hildoceratidae 矩阵，因此支持该菊石目科级样本的 2.014–1.747 亿年前纪级包络，而不是菊石目完整延限或白垩纪灭绝端点。
