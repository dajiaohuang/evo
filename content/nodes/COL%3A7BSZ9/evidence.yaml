        usage:
          title: Tetrapterys discolor (G.Mey.) DC., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Liana or scandent shrub; stems slender, the younger stems sericeous, soon thinning but remaining sparsely pubescent, the older stems glabrous or with tri- chomes sparse, restricted to the depressions; trichomes T-shaped, whitish, small dense lenticels sometimes present. Leaves thin, elliptic to oblong-elliptic or ovate-elliptic, long-acuminate or less often abruptly acuminate at the apex, obtuse to acute at the base, less often subrounded, 6-16 cm long, 2.5-5.5(-7) cm wide, glabrous above, glabrous beneath except the midrib often sericeous when young, major lateral veins 4-7 per side; petioles 6-15 mm long, appressed-pubescent when young, glabrate in age. Panicles terminal or upper axillary, usually sur- passing the leaves, the branchlets, peduncles and pedicels sericeous to weakly patulous-pubescent with whitish, T-shaped trichomes; bracts inconspicuous, oval to elliptic, 5-20 mm long, weakly appressed-pubescent on both sides, more dense- ly so on the midrib beneath; peduncles 2-5 mm long; pedicels 2-5 mm long. Flowers with the sepals narrowly ovate, obtuse, 2.5-3.0 mm long, glabrous in the apical part except for ciliate margin, weakly villous between the glands; ca- lycine glands thick, shiny, 1.5-2.5 mm long; petals clawed, yellow, glabrous, the blade obovate to oblong-elliptic, sagittate at the base, 4.0-5.5 mm long, 2.5-4.0 mm wide, the margin entire, the medial vein thickened near the base; claw thick, 1-2 mm long; anthers elliptic, ca. 1 mm long, glabrous; styles held ca. 1.5 mm above the sepals, slightly longer than the stamens. Samaras stramineous to brown, the wings thin but rigid, the veins sometimes weakly raised; superior wing narrowly spatulate, asymmetrical, 14-20 mm long, 6-10 mm wide, sparsely pu- bescent throughout with appressed T-shaped trichomes, the margin not confluent with the margin of the inferior wing, the inferior wing ovate to ovate-elliptic or obovate, 6-8 mm long, 4-5 mm wide, the dorsal crest 2-3 mm high; appendages irregularly linear to ovate, 1.5-5.0 mm long, borne between the dorsal and lateral wings; body 5-6 mm in diameter, densely appressed-pubescent.
