          - text: The recurved, deeply channelled leaves of this species recall those of A. alooides, but they are somewhat larger and less strongly recurved in this species.
            textZh: SANBI 条目提供了 Aloe thraskii Baker 的鉴别特征。
            sourceIds:
              - sanbi_5961_0
            locator: "SANBI/WFO archive Diagnostic row 51035; source identifier 5961.0; cited publication: Glen, HF; Hardy, DS. 2000. Aloe. In: G Germishuizen & E du Plessis (eds), Aloaceae (first part), Fl. S. Africa 5(1,1): 1 - 167. National Botanical Institute, Pretoria. [http://www.biodiversitylibrary.org/item/209564#page/3/mode/1up]. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: A. thraskii is a stately and very distinctive species with its long, very deeply channelled, and much recurved leaves; and with the stem densely bearded with old dry leaf remains, it closely resembles A. recurvifolia from the Eastern Transvaal, but they could never be confused when in flower. The latter has a simple inflorescence, with long narrowly cylindric racemes, while A. thraskii is distinguished by having, on the average, 2-3 inflorescences each with 3-6 branches. The racemes are rather broadly cylindrical, up to 10 in. long, with the flowers first opening up the sunny (north) side, while the orange exserted stamens in reflected sunlight give the racemes a glowing golden effect. Sometimes one sees the inflorescences alive with bees attracted by the pollen. The flowers contain a copious supply of pale nectar.
