    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Trees; stems simple, 1-2(-4) m tall. Leaves many, 1.0-1.6 x 0.13-0.22 m, deeply channelled, olive-green, upper surface without prickles, lower surface with few prickles in median line. Inflorescence with 4-8 racemes, 500-800 mm tall; racemes cylindric-conical, very dense; bracts ovate-acute, 7-9 x 4-6 mm, 5-7-nerved. Flowers greenish to orange in bud, lemon-yellow to pale orange at flowering, 18-29 mm long, ventricose; outer segments connate in basal third, inner segments free but adnate to outer in basal quarter; pedicels 1-2 mm long. Anthers exserted 4-20 mm. Ovary 5.0-6.0 x 2.0-3.5 mm, lemon to pale green; style exserted 4-20 mm. Fruit ±30 x 16 mm, reddish brown.
            textZh: Aloe thraskii Baker 的 SANBI 物种条目记录了形态特征。
            sourceIds:
