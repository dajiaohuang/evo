    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Deciduous geophyte, 400-600 mm high. Rhizome compact, horizontal, roots wiry, lanate basally. Cataphylls surrounding shoots, green and leaf-like in texture but lacking blades. Leaves ± 10-12, linear, 150-250 x 3-6 mm, leathery, striate on both surfaces and densely villous with spreading, silvery hairs on ribs and margins, decaying to form a coarsely fibrous collar. Inflorescence a simple or sparsely branched raceme; peduncle ± erect, 2-3 mm diam. at base, densely villous at base, more sparsely so distally; raceme dense, 30-50- flowered, 150-200 mm long, flowers at first congested near apex but rachis elongating during anthesis; bracts ovate-acuminate, 3-5 mm long, membranous, villous, margins ciliate; pedicels suberect, 15-20(-23) mm long, glabrous. Flowers rotate, white with brown midrib, immaculate; outer tepals elliptical, ± 12 x 2.5 mm, inner oblanceolate, ± 11 x 3 mm. Stamens suberect; filaments filiform, tapering below, white, ± 6 mm long, retrorsely scabrid in distal half and inner filaments minutely pubescent for short distance below scabrae; anthers ± 1.5 mm long, yellow. Ovary subglobose, ± 2 mm long, green, with ± 6 ovules per locule, densely villous or bearded on locules with erect, whitish hairs; style erect, filiform, ± 7 mm long, white. Capsules obovoid, contracted at base and sub-stipitate, 5-6 x 3-4 mm, villous. Seeds tetrahedral and angled, greyish, tuberculate, ± 3 mm diam.
