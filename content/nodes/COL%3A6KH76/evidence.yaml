    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous herb, up to 1 m high. Perianth up to 40 mm long, with a short tube and shorter lobes. Leaves linear. Bracts thin, closely ribbed, raised ribs whitish and grooves speckled with rust-coloured, longish blotches. Perianth plain when dry. Flowers white, flushed with pale to deep pink or lilac.
            textZh: Gladiolus ferrugineus Goldblatt & J.C.Manning 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_11118_0
            locator: "SANBI/WFO archive Morphology row 2101; source identifier 11118.0; cited publication: Herman, PPJ; Retief, E. 1997. Plants of the northern provinces of South Africa: Keys and diagnostic characters. Strelitzia 6: 1 - 681. National Botanical Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: "Recognised by the fibrous leaves with poorly developed secondary veins, and unbranched spike of white to pink flowers with relatively short perianth tube 13-16(-20) mm long and dry, rusty brown bracts 20-30 mm long. Gladiolus ferrugineus is closely related to G. varius, distinguished by its mostly larger flowers with longer perianth tube 30-50 mm long. Hybrids between the two species occur on the upper slopes of Long Tom Pass. Gladiolus ferrugineus comprises two, more-or-less distinct forms that we interpret as ecological races: an early-flowering form from the lower escarpment with slightly broader leaves 6-15 mm wide and flowers with a short perianth tube, mostly 12-16 mm long, flowering from late November to early February; and a later-flowering form from the upper escarpment with narrow, heavily thickened and often twisted leaves 3-6 mm wide and flowers with a slightly longer tube 18-25 mm long, flowering in March and April."
            textZh: SANBI 条目提供了 Gladiolus ferrugineus Goldblatt & J.C.Manning 的鉴别特征。
