    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Rhizoma elongatum tenue 1.0-1.5 mm diametro, culmis usque ad 10 mm sepositis. Culmi usque ad 160 mm alti, ca. 1.0 mm diametro, 3-angulati, glabri vel ad apices spatio brevissimo puberuli. Foliorum vaginae glabrae vel longitudinaliter a hiatu inter insertiones marginum laminarum versus nodum puberulae; ligulae puberulae glabrescentesve; laminae usque ad 100 mm longae, 2.0 mm latae, erectae vel suberectae, plerumque V-formatae transverse sectae, glabrae vel marginibus carinisque apices versus puberulis, raro nervo medio adaxialiter hispidulo-puberulo. Inflorescentia pseudolateralis capitata, e spiculis paucis constans; bractea ima erecta, spiculas superans, ad basin brevissime vaginans vel evaginans. Spiculae usque ad 8.5 mm longae, 3.0 mm latae (aristis exclusis), anguste ovoideae vel ellipsoideae, apice acuto. Glumae sparsim et minute puberulae, omnes fertiles vel duae basales steriles quarum infima longiaristata, secunda mutica; glumae fertiles ca. 4.0-4.5 mm longae (aristis inclusis), subcarinatae 3-nerves, aristis subterminalibus rectis 0.6-1.0 mm longis. Verticillus hypogynus exterior e setulis 3 retrorse glochideis constans. Verticillus hypogynus interior e squamellis 3, achenio circa aequilongis, constans. Squamellarum ungues breves glabri; laminae ellipticae, nervo medio prominenti glebuloso, margine lobato globuloso, ala fimbriata submarginali in pagina interiore affixa; aristae retrorse glochideae. Stamina 3; antherae lineares 2.0-2.4 mm longae. Achenium stipitatum longirostre, circa 2 mm longum (rostro et stipite inclusis), late ellipsoideum trigonum trabeculatum, cellulis extimis transverse elongatis (rostro angulis stipite exclusis).
