        usage:
          title: Burmeistera kirkbridei Wilbur, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrublets; stems terete, glabrous, purplish. Principal leaves with blades el- liptic, 3.5-7 cm long, 1.5-3.5 cm wide, ca. 2-3 times as long as wide, apically acute to acuminate, basally cuneate, marginally indistinctly serrulate with ca. 2-4 callosities per cm, glabrous on both surfaces; petioles glabrous, 1.2-3 cm long. Flowers 1.2-1.5 cm long; pedicels solitary in the upper leaf axils, ascendant, slender, glabrous, ebracteolate, ca. 3 cm long; hypanthium in anthesis obconic, glabrous, basally acute, ca. 3 mm long, 3 mm in diameter; calyx lobes ovate or oblong-elliptic, acute, entire, glabrous, ca. 3.5 mm long, 1.5 mm wide; corolla densely but inconspicuously short-pubescent with spreading, stiff trichomes to 0.1 mm long, dark purplish and reportedly tipped with pink, the tube ca. 6 mm long, 2.5-3 mm in diameter, the lobes ovate with an acute to acuminate tip, the 2 upper lobes ca. 6 mm long, the 2 lateral lobes ca. 4 mm long, the lowermost lobe ca. 3 mm long; filament tube distally puberulent, ca. 7 mm long, the anthers all appressed puberulous externally, the longest anther ca. 2 mm long and the shortest ca. 1.5 mm long. Fruits and seeds unknown.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 2941
