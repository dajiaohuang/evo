    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants 100-250 mm high. Corm ± globose, ± 9 mm diam.; tunics dark brown, extended upward as a collar of fibres around base. Stem trailing from cliffs, simple or branched. Leaves mostly 4, lower 3 basal or subbasal, reaching ± to base of spike, soft-textured, ± linear, mostly 1.5-2.2 mm wide, midrib and margins hardly thickened, uppermost leaf shorter, inserted in middle of stem, partly to entirely sheathing. Spike 2- to 4-flowered; bracts green, often drying at tips, 10-15 mm long, inner 2/3 as long to ± as long as outer. Flowers white, ?unscented; perianth tube funnel-shaped, expanded in upper half, (7-)11 mm long; tepals subequal, spreading, (11-)15-16 x 5.5-7.0 mm. Filaments 2.5-3.0 mm long; anthers ± 4 mm long, creamy white; pollen yellow. Style branches exceeding anthers by ± 1.8 mm in closed flower.
            textZh: Hesperantha saxicola Goldblatt 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Morphology row 98636; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Recognised by the trailing stems, linear leaves up to 2.2 mm wide, and spikes of only 2 to 5 white flowers with tepals 11-16 mm long. The stamens are comparatively short, with filaments up to 3 mm long and anthers about 4 mm long. Hesperantha saxicola has been confused with H. leucantha, which has upright stems and smaller, pale pink flowers. A collection from Mt. Sheba, a short distance to the north of Long Tom Pass, appears to belong here but the flowers have tepals lightly flushed with purple outside, leaves less than 1 mm wide, a perianth tube about 7 mm long and tepals ± 11 mm long, smaller than in populations to the south.
