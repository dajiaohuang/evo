            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: "Distinguishing features are: abbreviated, slender, congested shoots bearing small, persistent bracts in lower half, and leaves and flowers above; long, indurated branchlets, minutely papillose (not stellate- pubescent) becoming glutinose; peduncle short, persistent; pedicels longer and stellate-pubescent; petals longer than calyx, margins inrolled on claw, not thickened, glabrous on inner face; capsule with five laterally compressed carpels free to the axis; horns 10, long, pilose, spreading and recurved."
