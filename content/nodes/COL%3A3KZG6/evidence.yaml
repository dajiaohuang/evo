    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Suffrutex, virgate, 40-60 cm tall, stems with grey or brown bark, branches becoming woody and leafless, often glutinous, with numerous minute papillae, otherwise glabrous, ultimate flowering branchlets short and congested with leaves and flowers, minutely papillose. Stipules terete, blunt, usually just under 1 mm long, papillose. Leaves shortly petiolate; blade oblong-cuneate, 5-10 mm long, 3-8 mm broad, broadest at or near apex, dentate in upper part, teeth usually thickened with glands, upper and lower surface papillate and sparsely stellate-pubescent (hairs appressed), nerves prominent beneath; petiole 1-3 mm long. Inflorescence of 1-flowered, solitary cymes, usually in axils of leaves on short congested shoots; peduncle usually very short, about 1.5 mm long (rarely on same plant one up to 2.5 mm long), glabrous; pedicels up to 5 mm long, papillose and sparsely stellate-pubescent, thickening towards apex; bracts minute, ±0.5 mm. Calyx usually lobed to beyond the middle, 4-6 mm long, obscurely papillose with a few appressed stellate hairs without, ciliate on margin and pubescent on inner face. Petals broadly oblong-cuneate, about 8 mm long, 4 mm broad near apex, claw with narrowly inrolled margin, not thickened, appearing glabrous. Stamens with obtrullate, hyaline filaments (appearing glabrous), about 3 mm long; anthers 3, ciliate. Ovary densely hispid, stipitate (stipe ±1.25 mm), about 1.5 mm long; styles about 4 mm long. Capsule from about 4-5 mm long, with 5 laterally compressed carpels, 2.5 mm broad, papillate on surfaces, sometimes stellate-pubescent too, setose along sutures, with 10 diverging, pilose horns which are up to 8 mm long.
            sourceIds:
