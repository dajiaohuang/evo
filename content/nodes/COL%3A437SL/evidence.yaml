          originalSourceText: Decumbent herbs to 50 cm., the stems sharply angled. Leaves elliptic to ovate, the apex acute, sometimes mucronate, the base attenuate, 1.0-2.3 cm. wide, 1.3-3.6 cm. long, glabrous. Inflorescence a many-flowered raceme 1.5-3.5 cm. long; bracts membranaceous, persistent, about 1 mm. long; pedicels about 1.0 mm. long. Tepals 5, lanceolate, white, about 0.5-0.7 mm. long. Stamens about 0.4 mm. long. Ovary globose, about 0.5 mm. in diameter. Fruit with the tubercles united into a honeycomb like pattern, 1.0-1.5 mm. in diameter.
