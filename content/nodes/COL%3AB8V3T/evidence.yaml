  claims:
    - subjectId: taxon:cubozoa
      claimKind: scientific
      claimType: topology
      statement: A multigene analysis tests relationships among sampled box jellyfishes and rejects some morphology-based groupings; it does not date Cubozoa or make sampled species direct ancestors.
      confidence: medium
      confidenceRationale: Several markers and explicit taxon sampling support the recovered clades, while sparse diversity sampling leaves deeper history incomplete.
      referenceLinks:
        - referenceId: bentlage-2010-cubozoa
          relation: supports
          pages: 493–501
          quoteLocator: Figures 1–3; phylogenetic analyses and character discussion
    - subjectId: taxon:cubozoa
      claimKind: scientific
      claimType: fossil-range
      statement: "Cubozoa has no supported scalar crown range in the cited evidence: the phylogeny samples living box jellies but does not establish a diagnostic 505 Ma crown fossil, so the former 505–0 Ma display is withheld."
      confidence: low
      confidenceRationale: Bentlage et al. (2010) directly supports extant cubozoan relationships, not a Cambrian temporal boundary. Low confidence records that the former older endpoint lacks crown-specific fossil support.
      referenceLinks:
        - relation: supports
          referenceId: bentlage-2010-cubozoa
          pages: 493–501
          figure: Figures 1–3
          quoteLocator: Extant phylogenetic analyses and character discussion
  claim-rationales.zh:
    - 多个标记和明确类群取样支持所得支系，但有限多样性取样使深层历史仍不完整。
    - Bentlage 等（2010）直接支持现生箱水母关系，而非寒武纪时间边界。低置信度表示旧有较老端点缺少冠群专属化石支持。
  claim-statements.zh:
    - 多基因分析检验了取样箱水母之间的关系并否定若干形态分类；它不为箱水母纲定年，也不把取样物种当作直接祖先。
    - 现有引证不支持 Cubozoa 的单一冠群范围：系统树采样了现生箱水母，却未确立可鉴定的 505 Ma 冠群化石，因此旧有 505–0 Ma 展示被暂缓。
  ranges:
