          title: Brunfelsia chocoensis Plowman, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrub 2 m tall, twigs terete, the bark flaking in scales which gives a puber- ulent appearance to the naked eye. Leaves obovate or elliptical, basally obtuse, apically acuminate, veins ca. 4 on each side of the midrib, membranaceous, glabrous. Inflorescence of solitary, flowers. Flowers fragrant (Bristan), the calyx tubular campanulate, glabrous, longitudinally striate, reticulate, the lobes 2-4 mm long, enlarging to 13 mm long in fruit and becoming lenticel-dotted; corolla white, the tube twice as long as the calyx, 22-27 mm long and 2-2.5 mm broad, glabrous, the limb salverform, 2-2.5 cm across, the lobes subequal, 8-10 mm long; stamens included, inserted in the upper 1/3 of the corolla tube, the anthers 2 mm long, reniform-hippocrepiform, light brown; ovary glabrous, 2.5 mm long, the style slender, the stigma bifid, with lobes 1.5 mm long, oblong. Fruit a yellow, smooth, fleshy, globose to ovoid berry 2-3 cm across; seeds 2-5, ovoid-ellipsoid, angular, 8-10 mm long, 6-7 mm in diameter, dark brown.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 13223
