          - text: Schoenus filiculmis is a short species (<275 mm) with a somewhat wiry appearance compared to other similar species because of its narrow culms (<0.8 mm) and leaves, which are usually less than 0.5 mm in width. The leaf sheaths and inflorescences can be dark red to almost black in some specimens. In addition, the inflorescences of S. filiculmis are generally shorter (<28.5 mm) and narrower (<4.6 mm) compared to other species in the group, appearing delicate in most specimens. Furthermore, the spikelets of this species sometimes have a slight twist so that they appear to curve outwards from the panicle. The inflorescence bracts of S. filiculmis are relatively short (<45.0 mm) and usually have membranaceous marginal extensions similar to S. aureus, S. pseudoloreus and S. megacarpus; however, the delicate and wiry habit of S. filiculmis make it a distinctive species.
