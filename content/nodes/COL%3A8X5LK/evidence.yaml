    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Caespitose, phyllopodic perennial graminoid. Short with wiry leaves. Not viscous. Culms terete, (78-)150-193(-261) x 0.2-0.5(-0.8) mm. Leaves basal, 2-4(-5), short and narrow, rarely reaching half the height of the culm, (6.0-)16.0-35.5(-55.0) x 0.16-0.33(-2.4) mm, sometimes awl-shaped but most often straight, proximally channelled or not, apex usually flat distally, margin mostly serrate above sheath. Sheaths expanded at base, firm, glossy, often striate, ranging from dark red to reddish-brown in colour proximally. Ligule short, firm or membranaceous, colour ranging from dark-red to whitish, 2-lobed, 0.2-0.7(-1.4) mm. Inflorescence a short, delicate, narrowly-contracted panicle, 9.5-18.6(-28.5) x 1.0-3.5(-4.5) mm, proximal rachis length 4.0-7.0(-9.5) mm. Proximal primary inflorescence bracts firm or delicate, often with membranaceous extensions on margins of various widths, 10.0-31.0(-35.0) mm long, exceeding length of inflorescence linear-lanceolate, sometimes slightly twisted, ranging in colour from reddish-black to brown, 3.2-5.2(-5.9) x 0.7-1.3 mm, pedicellate,1-3(-4) spikelets/spike. Rachilla (0.2-)1.1-2.4(-4.2) mm long. Glumes 3-5(-6) per spikelet, proximal glume (2.2-)2.6-3.0(-3.4)mm long, subproximal glume (2.6-)3.4-3.8(-4.9) mm long, firm, shiny, margins sometimes with a narrow scarious margin, obscurely distichous, upper glumes longer in length, apices acuminate to obtuse. Mucros present or not, proximal mucro (0-)0.1-0.3(-1.1) mm long, subproximal mucro 0-0.2(-2.1) mm long. Stamens 3 per floret, anthers2.6-4.0(-4.5) mm long. Stigmas (2-)3-branched. Perianth bristles 0. Nutlet (only one immature observed) 3-sided, wide elliptical. Nutlet beak farinose.
