    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, 200-300 mm tall, simple or with 1 or 2 short, distally spreading branchlets, nodding in bud. Leaves linear to sword-shaped, margins thickened. Flowers 4-7 in a lax spike, fewer on branchlets, light purple with a dark purple centre, style branches short, 2-2.5 mm long, perianth tube filiform, 2-2.5 mm long, tepals spreading, 12-13 mm long, stamens fully exserted.
            textZh: Ixia brevituba G.J.Lewis 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_14562_0
            locator: "SANBI/WFO archive Morphology row 33250; source identifier 14562.0; cited publication: Goldblatt, P; Manning, JC. 2013. Iridaceae. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 94 - 124. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Distinguished by its pale purple flowers with small, dark eye, Ixia brevituba has relatively broad, blackish anthers that dehisce laterally so that the light-coloured pollen forms a contrasting pale margin to each anther, and short style branches that are ± as long as the filaments, thus scarcely projecting from between the filaments. The lovely amethyst-coloured flowers are borne on inclined spikes so that they face directly upward in an elegant, arching spray. I. brevituba falls among a small group of species that are endemic or near-endemic to the Roggeveld Escarpment and Klein Roggeveld, including I. curvata, I. rigida, and I. trifolia, all of which share relatively unspecialized, longitudinally dehiscent anthers 3-5 mm long. Among these species I. brevituba appears to be most closely allied to I. trifolia on the basis of their unusual, inclined spikes, and lateral branches that are decurved and nodding when young. All other species have spikes that are erect from bud to fruit. The two species also share a perianth tube 2-3 mm long. I. brevituba differs from I. trifolia in its blackish purple anthers and purple perianth tube, which gives the flowers a small, dark central eye, consistently narrower leaves 1.5-2.0 mm wide, and medium-textured corm tunics drawn into a well-developed neck. I. trifolia, like all other species in sect. Dichone, has yellow anthers, although the filaments may be pale mauve, and a pale perianth tube, giving the flowers a well-defined whitish central eye. The leaves of I. trifolia are broader than in I. brevituba, (2.5-)5.0-12.0 mm wide, and the tunics are more coarsely fibrous, with the lower fibres developed into woody claws but not drawn into a neck above. In addition, the style branches of I. trifolia are longer than the filaments, 4-5 mm long, and project conspicuously between them. In view of its narrow range there is concurrence with Raimondo et al.’s (2009) conservation status of vulnerable (Vu), but it is also noted that the entire range of I. brevituba falls within the Tanqua National Park and future disturbance seems unlikely.
