            locator: "SANBI/WFO archive Diagnostic row 84445; source identifier 15933.0; cited publication: Goldblatt, P; Manning, JC. 2012. Systematics of the southern African genus Ixia (Iridaceae): 4. Revision of sect. Dichone. Bothalia 42(2): 87 - 110. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Distinguished by its pale mauve flowers with small, dark eye, and relatively broad, blackish anthers that dehisce laterally, the light-coloured pollen then contrasting with the dark anther tissue. The style is ± as long as the filaments and the short branches 2.0-2.5 mm long scarcely project between them. The flowers are borne on inclined spikes and they face directly upward. Ixia brevituba falls among a small group of species that are endemic or near-endemic to the Roggeveld Escarpment and Klein Roggeveld, including I. curvata, I. rigida and I. trifolia, all of which share conventional longitudinally dehiscent anthers. Ixia brevituba appears to be most closely allied to I. trifolia on the basis of their distinctive, inclined spikes that are decurved and nodding when young. Other related species have spikes erect from bud to fruit. The two species also share a perianth tube 2-3 mm long but the pink (or mauve) flowers of I. trifolia have a pale central eye and yellow anthers. The leaves of I. trifolia are broader than in I. brevituba, (2.5-)5.0-12.0 mm wide, and the tunics are more coarsely fibrous, with the lower fibres developed into woody claws but not drawn into a collar above. In addition, the style branches of I. trifolia are longer than the filaments, 4-5 mm long, and project conspicuously between them.
