          pages: 1391–1402
          figure: Text-figures 1–8
          quoteLocator: Material and preservation; systematic palaeontology; lophophore, digestive tract and pedicle
  claim-rationales.zh:
    - 多处软组织由具名化石材料直接记录；同源和祖先状态含义与观察本身分开。
  claim-statements.zh:
    - 澄江生物群的 Kutorgina chengjiangensis 材料除成对壳瓣外，还保存早期螺旋腕阶段的触手冠、消化道和肉茎，直接记录了早期钙质壳小嘴贝型腕足动物的软体解剖。
