  claims:
    - subjectId: event:kutorgina-soft-tissue-anatomy
      claimKind: scientific
      claimType: morphology
      statement: Kutorgina chengjiangensis material from Chengjiang preserves paired valves together with an early spirolophe-stage lophophore, digestive tract and pedicle, directly documenting soft anatomy in an early calcareous-shelled rhynchonelliformean.
      confidence: high
      confidenceRationale: Multiple anatomical regions are directly described from named fossil material; homology and broader ancestral-state implications remain separate from the observation.
