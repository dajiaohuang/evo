  claims:
    - subjectId: event:tatelt-trilobite-3d-anatomy
      claimKind: scientific
      claimType: morphology
      statement: Microtomographic reconstructions of ash-entombed Tatelt Formation Protolenus and Gigoutella specimens directly preserve four post-antennal cephalic limb pairs, a labrum, mouth and digestive tissues; feeding mechanics and group-wide homologies remain comparative interpretations.
      confidence: high
      confidenceRationale: Three-dimensional articulated anatomy is directly imaged in multiple specimens, but functional and group-wide extrapolations remain inferential.
      referenceLinks:
        - referenceId: el-albani-2024-trilobite-3d
          relation: supports
          pages: 1429–1435
          figure: Figures 1–4; Extended Data
          quoteLocator: Specimens; Microtomographic reconstruction; Ventral anatomy
  claim-rationales.zh:
    - 多个标本的三维关节解剖得到直接成像，但功能解释和向全类群外推仍属推断。
  claim-statements.zh:
    - 对 Tatelt 组火山灰埋藏的 Protolenus 与 Gigoutella 标本进行显微断层复原，直接保存四对触角后头部附肢、上唇、口和消化组织；取食力学与全类群同源关系仍属比较解释。
