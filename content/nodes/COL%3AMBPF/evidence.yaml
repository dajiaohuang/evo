          - text: "Perennial, up to 1.5 m high. Rhizome with distant scales only associated with the development of culms. Culms 300-800(-1500) mm high. Leaf blades up to 600 mm long, 4-10 mm wide. Flowers: inflorescence simple or 2(3) x compound; spikelets pale golden-brown, borne on rays, oblong in outline at maturity; glumes 5-8 mm long, tightly overlapping, midrib elongated into 1.5-2.0 mm long awn; perianth bristles 4-6."
