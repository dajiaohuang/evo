            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Recognised by its long, slender, relatively soft-textured leaves and two-ranked spikes of moderately long-tubed, pale pink flowers with dark red centre, purple anthers and lanceolate-attenuate tepals, the lower three streaked with red. The perianth tube is 33-35 mm long. The margins of the inner bracts are connate below forming a tube enclosing the ovary, and both outer and inner bracts exude drops of photosynthate from the tips that attract ants. The tubular inner bracts are otherwise characteristic of ser. Oppositiflori, where similar exudates are produced by G. dolomiticus and G. pole-evansii.
