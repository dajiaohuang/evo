        usage:
          title: Mikania guaco Bonpl., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Coarse sparingly branched vines; stems mostly brownish, terete, striate, glabrate, usually fistulose. Leaves opposite; blades broadly ovate, to 25 cm long and 15 cm wide, the base short-acute to acuminate, the margins entire, the apex broadly to narrowly short-acuminate, the upper surface sparsely puberulous and with minute spicules, the lower surface rather densely short-puberulous with numerous yellowish glandular punctations, the veins mostly pinnate; petioles slender, to 4.5 cm long. Inflorescence rather densely corymbose with almost all heads in clusters of 3, the ultimate branches ca. 0-1 mm long. Heads ca. 8-10 mm high; subinvolucral bract linear-lanceolate, to 2 mm long, short-puberulous; involucral bracts oblong with rounded tips, 5-6 mm long, ca. 1 mm wide, the outer pair puberulous; corolla whitish, ca. 6 mm long, the tube narrow, 2.5-3.0 mm long, the limb narrowly funnelform, the lobes short-triangular, about as long as wide, with scattered slender hairs on the outer surface, the cells subquadrate and ca. 25 microns wide; anther appendages firm, triangular, about twice as long as wide; style base slender, usually sparsely papillose, the style appendages hirsute with many long papillae. Achenes with 5 ribs or grooves, thickly corticated and terete when fully mature, ca. 4 mm long, the sides sparsely puberulous; pappus of ca. 50 slender bristles which are not or only slightly enlarged apically.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 1899
