        claims:
          - text: Grey-mealy, gnarled shrublet from woody base, mostly to 40 cm. Leaves 1- or 2-pinnatisect. Flowers few, on slender, naked peduncles, yellow to red, tightly furled.
            sourceIds:
              - sanbi_14353_0
            locator: "SANBI/WFO archive Morphology row 8428; source 14353.0; publication: Manning, JC; Goldblatt, P. 2012. Malvaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 613 - 621. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Characterized by the silvery, scaly pubescence which forms a complete, smooth covering on the stems in the lower parts and consists of strigose and stellate hairs, the stellate hairs radiating from a central silvery scale. In most upper parts the silvery stellate hairs and scales are less dense and often scattered, and minute reddish gland-tipped hairs are present as well. The leaves, like those of several other species, especially among species that were formerly in the genus Mahernia, vary considerably in the degree of lobing. In some specimens the leaves are merely coarsely lobed while in others, or even on the same plant, they can be deeply lobed. In this species they vary from subentire to coarsely lobed to pinnatipartite, bipinnatipartite or palmipartite.
            textZh: SANBI 条目提供了该种的鉴别特征。
            sourceIds:
