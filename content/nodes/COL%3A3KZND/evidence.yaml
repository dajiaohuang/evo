    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Low suffrutex; stems many from a thick, woody rootstock, simple or laxly branched, more or less leafless in lower half, subdensely and coarsely hairy with bulbous-based stellate hairs, rays about 1 mm long, acute. Stipules ovate, ovate-lanceolate or linear-lanceolate, about 7 mm long, 1-3.5 mm broad at base, rather thick-textured (oily?), laxly stellate-pubescent dorsally. Leaves shortly petiolate; blade from fairly narrowly to broadly oblong-elliptic, or some leaves obovate to suborbicular, 2-5 cm long, 0.7-3.5 cm broad, discolorous, upper surface with impressed veins, subdensely to laxly stellate-pubescent, hairs few, long, acute and from a bulbous base, undersurface with prominent veins densely whitish to yellowish tomentose, tomentum of matted stellate hairs, margins crenate-dentate; petiole 2-6 mm long, stellate-pubescent. Inflorescence of a few 1-3-flowered cymes borne in the upper half; peduncles 2-10 mm long, shaggily stellate-pubescent; pedicels not readily distinguishable from peduncles, 3-10 mm long, pubescence as on peduncle; bracts linear-lanceolate to subulate, 2-5 mm long. Calyx about 7 mm long, lobed almost to middle, stellate-pubescent on the strong, prominent ribs and margins, lobes deltoid. Petals yellow, recurved in upper half, about 9 mm long, about 6.5 mm broad in the broadly rounded upper third, narrowing to a 2 mm waist and produced into a claw with infolded margins of which the edges are membranous and obscurely hairy. Stamens about 6.5 mm long; filaments joined at base, hyaline, narrowly obovate, about 3 mm long with 1 or 2 stellate hairs on shoulders; anthers about 4.5 mm long, overlapping filaments for 1 mm. Ovary 2.5 mm long, 2 mm diam., 5-angled, densely hairy with sessile and stalked stellate hairs, stipe 5 mm long. Capsule about 9 mm long, 7 mm diam., 5-lobed and bluntly 5-umbonate at apex, pubescent with sessile and stalked hairs, shortly stipitate, with the persistent calyx like a disc at base. Seeds reniform-orbicular, black, plicate.
