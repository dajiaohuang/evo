          - text: This species is readily distinguished by its general appearance. The many, short, subherbaceous stems from a woody rootstock are more or less leafless in the lower half and bear comparatively large discolorous leaves and a few yellow flowers in the upper half. A collector records that the flowers develop in advance of the leaves.
