        claims:
          - text: Like C. orchidiformis but flowers smaller and upper three anthers ± equal on slender filaments longer than anthers.
            textZh: Cyanella cygnea G.Scott 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_14659_0
            locator: "SANBI/WFO archive Morphology row 33561; source identifier 14659.0; cited publication: Manning, JC. 2013. Tecophilaeaceae. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 161 - 162. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Closely allied to Cyanella orchidiformis, with which its shares characteristically mottled flowers and large, ovoid-ellipsoid capsules ± 15 mm long and greyish or purple markings or speckling on the anthers. C. cygnea typically has smaller flowers, with tepals 8-10 vs (8-) 10-15 mm long but is best identified by its stamens. The strongly geniculate-sigmoid filaments of the posterior (upper) stamens are bulbous at the base and filiform in the distal half, giving them a characteristic flexuous form, with the outer pair slightly longer than the median. All three anthers in the posterior cluster are subequal in size, 1.5-2 mm long, and the lower anthers are equally larger, 2.5-3.0 mm long. In contrast, the upper stamens in C. orchidiformis are ± uniformly thick except at the extreme apex and not evidently flexuous, the outer anthers are slightly smaller than the median, and the lower anthers are larger 5-6 mm long, sometimes with the median larger than the laterals. The distributions of the two species are largely complimentary, with C. cygnea occurring to the north and west of C. orchidiformis but they overlap around Steinkopf.
            textZh: SANBI 条目提供了 Cyanella cygnea G.Scott 的鉴别特征。
            sourceIds:
              - sanbi_7651_0
            locator: "SANBI/WFO archive Diagnostic row 47564; source identifier 7651.0; cited publication: Goldblatt, P; Manning, JC. 2012. A revision of Tecophilaeaceae subfam. Tecophilaeoideae in Africa. Bothalia 42(1): 21 - 41. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
