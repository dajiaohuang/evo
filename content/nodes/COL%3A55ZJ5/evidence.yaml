    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Perennial, woody, rhizomatous herbs, glandular-punctate. Roots 6 (occasionally some bifurcating) appearing in a circle from definite points on the fourth node and inter-node of each section of the sympodial rhizome, long, much-branched, forming dense mats, woody, with long scattered root-hairs their thickened bases persisting as short bristles. Rhizome sympodial, each section consisting of 4 internodes, the fourth forming the erect stem, a lower bud continuing the rhizome; internodes angled, smooth, orange brown, with deltoid, amplexicaul, early deciduous bracts. Stems erect, up to 50 cm, unbranched, or rarely with a short side branch, with prominent annular, curved leaf-scars, the lowest internodes up to 15 mm long, the upper brown, occasionally forming a few rootlets below. Leaves about 6-10, in distichous apical tufts, early deciduous, strap-shaped, falcate, 7-15 cm long and 7-15 mm broad, leathery, margin with erect teeth in upper half and on the obtuse to truncate apex, midrib distinct and with about 10 lateral nerves on each side; below the lamina is attached to a light brown, punctate, flat, stipular sheath which is tapered to the base, with folded margins and a narrow rim-like ligule above; axillary scales setaceous, 3-6. Flowers on much abbreviated side branches near the base of the leaf-clusters; the leaves also reduced in size to form bracts. Male flowers consisting of 2 fused stamens with the 2 pairs of apiculate locules facing opposite directions; filaments (or pedicels)presumably lengthening rapidly during anthesis and soon disintegrating, pollen filamentous. Female flowers at first sessile, peduncle accrescent, knobbed, 4-14 mm long, flattened, erect, adjacent to the main stem with 2 fertile pairs of bracts, the inner of a pair about1/3 of the outer in size; the 2 collateral carpels situated on the apex of the peduncle, surrounded by groups of setae (axillary scales), carpels ovoid, compressed lengthwise with a short style 4 mm long divided into 2 subulate stigmatic arms about 25 mm long, ovule solitary, pendulous. Fruit (immature?) cylindrical, about 15 mm long, 2 mm broad, apex truncate.
