      statement: Eutriconodonta is recovered as a sampled Mesozoic mammal grouping in the broad morphology analysis, but membership and relationships among “triconodont” taxa change across character sets; the atlas label therefore denotes a tested hypothesis, not a fixed ancestor branch.
      confidence: medium
      confidenceRationale: The source provides a large explicit matrix and alternative analyses. Medium confidence reflects the paper’s reported instability around several fossil groups.
      referenceLinks:
        - relation: supports
          referenceId: luo-2002-mesozoic-mammal-phylogeny
          pages: 1–78
          quoteLocator: Eutriconodonta sampling; phylogenetic analyses; discussion of unstable Mesozoic groups
    - subjectId: taxon:eutriconodonta
      claimKind: scientific
      claimType: fossil-range
      statement: Eutriconodonta is displayed at 201.4–66 Ma only as the matrix sample's broad Mesozoic coverage, not a stable membership list or exact endpoints. The interval is a source-bounded sample window, not a global FAD, LAD, divergence date, continuous occupancy claim or direct-ancestor assertion.
      confidence: medium
      confidenceRationale: Eutriconodonta uses Luo, Z.-X.; Kielan-Jaworowska, Z.; Cifelli, R.L. (2002) because the cited pages and locator expose the sampled taxon, specimen or living sequence set. Confidence is medium and applies only to Eutriconodont specimens sampled in Luo et al.'s Mesozoic-mammal synthesis; broader endpoints remain unclaimed.
      referenceLinks:
