      ecology:
        status: partially-supported
        claims:
          - text: In a managed bag-cultivation experiment at the National Mushroom Development Institute in Savar, Bangladesh, a substrate containing 50% waste tea leaves and 50% sawdust produced a reported total biological yield of 189.50 ± 3.31 g per packet across two flushes, with 79% biological efficiency. The table reports means from three replicates. This result is limited to the tested cultivation setup and does not describe wild fungal ecology or performance across other substrates and conditions.
            textZh: 在孟加拉国萨瓦尔国家蘑菇发展研究所开展的一项袋式人工栽培试验中，含 50% 废茶叶和 50% 锯末的基质在两潮采收中的总生物产量报告为每袋 189.50 ± 3.31 克，生物学效率为 79%。表中数据为三次重复的均值。该结果仅适用于所测试的栽培设置，不能描述野生生态，也不能代表其他基质和条件下的表现。
            originalLanguage: en
            sourceIds:
              - ahmed2024pleurotuswastetea
            locator: Results §3.3 and Table 3 (50% sawdust + 50% waste tea leaves; total yield and biological efficiency; table note reports three replicates); Methods §§2.1–2.3 for managed bag cultivation and study setting.
            placeTimeScope: National Mushroom Development Institute, Savar, Bangladesh; managed bag-cultivation experiment; study dates not stated in the article.
            lifeStatus: Cultivated mushrooms grown in prepared substrate bags; wild populations were not studied.
        gaps:
          - One managed substrate trial does not establish natural habitat, wild ecological interactions, or performance across strains, farms, seasons, and cultivation conditions.
