          title: Inga heterophylla Willd., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrub or small tree, the branchlets puberulent when very young, soon becoming glabrous, lenticellate. Leaves moderate, the leaflets 1-2 (sometimes more?) pairs; petiole short, usually less than 1 cm. long, glabrous in age, subsulcate above, egland- ular; rachis frequently exceeding the petiole, unwinged, glabrous, bearing cylindric glands at insertion of the pairs of petiolules, at least in the larger leaves; leaflets elliptic, 2-10 cm. long and 1-4 cm. wide, in quadrifoliolate leaves the basal pair of leaflets the smaller, acuminate and markedly attenuate apically, cuneate basally, glabrous, the venation reticulate and prominent below; stipules linear, about 2 mm. long, caducous. Inflorescence of axillary pedunculate umbels, slender and delicate; peduncles up to 2 cm. long; pedicels 4-12 mm. long, glabrous. Flowers moderate; calyx cupulate, scarcely 1 mm. long, glabrous; corolla tubular-funnelform, 5-6 mm. long, glabrous, the tube about twice as long as the lobes; staminal tube ex- serted. Legume linear, up to 13 or 14 cm. long and about 17 mm. wide, flat, glabrous, nearly straight, short-stipitate.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 4871
