        claims:
          - text: Sprawling, roughly hairy perennial to 25 cm. Leaves in whorls of 6, ericoid, almost granular (1.5-2.5 mm long). Flowers 1-3 in axils, anthers exserted, yellowish.
            sourceIds:
              - sanbi_14394_0
            locator: "SANBI/WFO archive Morphology row 6535; source 14394.0; publication: Manning, JC; Goldblatt, P. 2012. Rubiaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 700 - 704. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: G. bredasdorpense seems to be a close ally of G. capense (ssp. capense), but clearly differs in having very short internodes (frequently shorter than the minute leaves), short, ovate-lanceolate leaves (vs. long, linear in G. capense) and highly reduced inflorescences with leaf-like bracts and smaller flowers.
