      statement: The Arthropoda root display replaces the unsupported 540 Ma value with a 521–0 Ma sampled navigation envelope anchored by widespread trilobites, a contained arthropod clade, and living arthropods; it does not date the origin of Arthropoda.
      confidence: medium
      confidenceRationale: The approximately 521 Ma widespread trilobite record provides a direct minimum for the broader root entity. It cannot exclude older arthropods or define crown-versus-total-group origins, so the range is deliberately a descendant-anchored navigation envelope.
