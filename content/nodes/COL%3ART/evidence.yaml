  claim-statements.zh:
    - 节肢动物门根节点以 5.21 亿年前至今的采样导航包络替代缺乏支持的 5.40 亿年前数值，锚点是作为其内部类群的广布三叶虫及现生节肢动物；它不用于测定节肢动物门的起源。
