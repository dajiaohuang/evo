        claims:
          - text: Dioecious, succulent shrublet to 45 x 60 cm with many branches from a thickened main stem; branches 6-15 mm diam., with prominent conical tubercles 2-16 mm long loosely arranged in 3 angles, green to red. Leaves 5-15 x 3-12 mm, sessile, ovate-lanceolate, deciduous. Cyathia subtended by a whorl of 3 prominent bracts 6-10 x 4-10 mm, 5-7 mm diam., glands entire, red or yellow.
