    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Erect soft shrub 0.7-2.5 m tall, freely branched, woody below; stems ascending, strigose, with longer hairs at the nodes. Leaves petiolate; blade firm-textured, often slightly rugose, ovate to oblong-elliptic, 60-170 x 40-100 mm, subglabrous to thinly pubescent, under-surface with reddish brown gland-dots, apex acute, base cuneate to rarely obtuse, margin conspicuously crenate-dentate; petiole 20-50 mm long. Inflorescence paniculate, 120-250 mm long; flowers in sessile, usually 3-flowered cymes forming usually 6-flowered verticils 5-15 mm apart. Calyx 10-11 mm long in fruiting stage, glandular-puberulous towards the base, often suffused with purple. Corolla pale blue or mauve to bluish purple, rarely white or pink, 16-21 mm long; tube not deflexed nor expanded at the base, straight, increasing gradually to about 3 mm deep at the throat; upper lip 5-6 mm long; lower lip concave, 4-5 mm long. Stamens free, up to 15 mm long.
            sourceIds:
              - sanbi_15375_0
            locator: "SANBI/WFO archive Morphology row 50005; source 15375.0; publication: Codd, LEW. 1985. Lamiaceae: 23. Plectranthus. In: OA Leistner (ed.), Fl. S. Africa 28(4): 137 - 172. Botanical Research Institute, Department of Agriculture and Water Supply, Pretoria. [http://www.biodiversitylibrary.org/item/209555#page/9/mode/1up]. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: P. ecklonii is an attractive shrub for semi-shady places where frost is not too severe. The corolla is shorter, wider at the mouth and paler in colour than in P. ambiguus though occasional specimens are difficult to identify with certainty. A white-flowered and a pink-flowered form are known.
