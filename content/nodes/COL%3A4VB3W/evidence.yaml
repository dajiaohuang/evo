    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Tubers small, often 2 or 3 to a plant, 2-4 lin. long, 1 1/2-2 lin. thick, ovoid; stem solitary, erect, simple, or branched at the base, 4-8 in. high, pubescent; leaves 3/4-1 1/4 in. long, 1-2 1/2 lin. broad, lanceolate, linear-oblanceolate or linear-subspathulate, the lower opposite, the rest verticillate, slightly and minutely pubescent along the revolute margins and on the midrib beneath, otherwise glabrous, or nearly so; fascicles or sessile umbels often 2 at a node, 3-5-flowered; pedicels 2-3 1/2 lin. long, puberulous; sepals about 1 lin. long, 1/3 lin. broad, lanceolate, acute; corolla rotate, or perhaps slightly reflexed; lobes 1 1/3 lin. long, 3/4 lin. broad, oblong-ovate, subacute, quite glabrous on both sides; corona-lobes 1/2 lin. long, and as much in breadth, erect, subquadrate-ovate, bifid at the apex, with the teeth usually minutely denticulate on the inner margin, and inflexed upon the top of the staminal column, 2-keeled on the inner face, without any appendage, and with a rather broad shallow groove down the back; staminal column rather more than 1/2 lin. long; anther-appendages minute, cuneate-oblong, truncate, abruptly inflexed over the rim of the crater-like style -apex; young follicles solitary, much swollen at the middle, and equally tapering to a long obtuse beak and stalk-like base, minutely subtomentose.
