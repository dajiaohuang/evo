            locator: "SANBI/WFO archive Morphology row 82017; source 1670.0; publication: Hilliard, OM; Burtt, BL. 1983. Notes on some plants of southern Africa chiefly from Natal: X. Notes Roy. Bot. Gard. Edinburgh 41(2): 299 - 319. [CC BY-SA]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
