          - text: "S. procumbenti A. W. Hill affinis, sed antheris basi glandulis stipitatis destitutis recedit; in vivo lineis aurantiacis duabus basi loborum corollae etiam distinguenda. Sebaea radiata closely resembles S. procumbens and dried specimens are most easily distinguished by the lack of glands on the base of the anther lobes in S. radiata. But in the field, S. radiata is easily recognized by the orange lines in the throat, which suggested the specific epithet; these lines disappear in dried material. The two species are at least partially sympatric, but they occupy different habitats: S. radiata favours clefts and ledges on wet partially shaded cliffs, while S. procumbens may be found on damp grassy slopes or in the shelter of low bushes and grass tufts around the edges of damp rock sheets. We have seen the two species growing in close proximity, and the differences are then striking: the bushier plants of S. radiata on the cliff faces, with S. procumbens on the grassy slopes below the cliffs, its paler yellow flowers without contrasting darker lines in the throat."
