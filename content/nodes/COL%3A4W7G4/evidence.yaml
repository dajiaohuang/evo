        claims:
          - text: Herba perennis tegetes parvas formans; caules plures ad 20 cm longi, simplices vel inferne parce ramosi, erecti vel decumbentes, foliati praecipue in parte inferiore. Folia ad basin caulium congesta, sursum abrupte redacta et remota; inferiora plerumque 15-28 x 7-12 mm, spatulata, apice rotundato, basi angustata petiolari; superiora multo minora late elliptica. Flores pauci vel plures in cymas terminales congestas dispositi; bracteae infimae foliis supremis similes, sursum decrescentes. Calycis segmenta c. 5-6 x 2 mm, basi per 2 mm coalita, lanceolata, acutissima, hyalina, carina crassa viridi c. 0.75 mm lata. Corollae tubus c. 7.5 mm longus; lobi c. 7 x 4.5 mm, elliptici, obtusi, vivide lutei basi lineis duabus brevibus aurantiacis notati. Filamenta 0.25 mm longa, in corollae sinubus orientia; antherae 1.5 mm longae, glandula apicali lutea conica 1 mm longa praeditae, glandulis basalibus absentibus. Stylus 5 mm longus, tumore stigmatoso prope basin praeditus; stigma capitatum. Capsula 6 x 3 mm.
            sourceIds:
