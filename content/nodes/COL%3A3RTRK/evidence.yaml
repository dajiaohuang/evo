        metadataVariant: 0
        usage:
          title: Ladenbergia macrocarpa (Vahl) Klotzsch, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Trees to 40 ft tall, the trunks often buttressed, the branches smooth, glabrous, usually angular. Leaves oblong or obovate oblong, 10-45 (or more) cm long, 6- 24 cm wide, obtuse at the apex, acuminate, the acumen short or evanescent, the costa plane or prominulous, to 0.5 cm wide, expanded toward the petiole, prom- inent beneath, the lateral veins 10-12, prominent beneath, coriaceous, glabrous to densely golden pubescent above, glabrous to densely golden villosulose or appressed pilose beneath, often the axils barbate, shiny, dark brown when dry; petioles to 4.5 cm long; stipules crowded toward the apex of the twigs, persistent or deciduous, oblong rotund, 1.5-3.5 cm long, to 2.5 cm wide, rounded at the apex, coriaceous, glabrescent, venose, shiny. Inflorescences terminal, solitary, minutely pubescent or glabrescent, to 20 cm long, to 22 cm wide, presumably epedunculate, the several branches sharply ascending and terminating the twig- lets, 4-9 cm long, angular. Flowers scarcely pedicellate; hypanthium narrowly turbinate, to 0.8 cm long, tapering gradually into the pedicel, drying blackish, smooth, glabrous or puberulent, the calycine cup bowl shaped, to 0.7 cm long, the teeth triangular to rotund, 1.5-2.8 mm long, often obtuse; corolla with the tube narrowly cylindrical, 3.5-5.0 cm long, apically 3-4 mm wide, the lobes narrowly oblong, ca. 3.5 cm long, ca. 0.35 cm wide, densely golden pubescent; anthers 5, subsessile, ca. 6 mm long, ca. 1 mm wide, attached near the mouth. Fruits scarcely pedicellate, narrowly oblong, often slightly falcate, 7.0-13.5 cm long, 0.8-1.2(-1.8) cm wide, obtuse at the apex, attenuate toward the base, lig- nose, glabrescent to densely golden pilose, drying black brown or golden tan, delicately longitudinally striate ribbed, the persistent calycine cup 6-8 mm long, the calycine lobes ca. 1 mm long, the valves at dehiscence to 1.8 cm wide; seeds narrowly oblong or subfusiform, 1.0-2.5 cm long, the body 1-5 mm long, the wings often split or erosulose at the distal pole, acute at the proximal pole.
