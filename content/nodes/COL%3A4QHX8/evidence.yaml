          - text: "Shrub, up to 2-6 m high; deciduous. Stems sometimes spiny. Leaves opposite or subopposite; blade narrowly oblong-ovate to obovate, 30-70 x 20 mm, margins entire, glabrous. Flowers: 30-40 mm in diameter; many stamens inserted on corolla tube; petals 4- or 5-merous, red; Aug.-Jan. Fruit a ± globose berry, 50-80 mm in diameter, reddish brown, leathery when ripe; each seed surrounded by an edible aril, white to deep red or purple in colour, seeds embedded in a white, spongy, acid or sweet pulp."
