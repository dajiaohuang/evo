          - text: Cultivated as a window plant in Europe, it has escaped in parts of the Low Countries and on the south coast of England; it does not flower there in the open, but does so in the warmer Scilly Isles. Also on St. Helena, where it is probably introduced. It is also established around Buenos Aires, Argentine, and in South Australia and Victoria.
