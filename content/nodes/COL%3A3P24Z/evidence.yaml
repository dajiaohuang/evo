      morphology:
        status: partially-supported
        claims:
          - text: "Perennial herb, 250-350 mm high; slender, growing in tufts. Rhizome oblong, 25-40 x 15-20 mm. Leaves 8-10; well developed at flowering; clasping at base to form a narrow false stem; blade strap-like, linear, 300-450 x 10-15 mm, coriaceous; strongly ribbed, veins 10-16; sparsely hairy, dense on margins and midrib on lower surface forming a white band (ciliate); hairs biramous or stellate. Flowers: inflorescence 1-4 per plant, 2-5-flowered, racemose; pedicels 15-25 mm long; perianth segments 8-12 x 3-4 mm, broadly elliptic, yellow; Aug.-Feb. Fruit a capsule, 6-8 x 4-7 mm, opening by a circular slit."
