          title: Piper linearifolium C.DC., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: A low, bushy shrub, scarcely 2 m. tall; flowering internodes moderately slender and short, gray-pubescent; leaves lanceolate, apex gradually long- and sharp- acuminate, base inequilateral with one side 2-3 mm. shorter, obtuse, cordulate, or some leaves acute, mostly 2-3.5 cm. wide X 10-17 cm. long, subrugescent in age, pinnately nerved from the lower third, the nerves 4-5 or occasionally 6 on each side, prominent beneath, somewhat impressed above, subequally spaced, subparallel and sharply ascending from the midrib, appressed-silky-pubescent on both sides, the nerves more densely so beneath, glandular-dotted, drying rather firm, trans- lucent, pellucid-dotted; petiole 3-5 plus 2-3 mm. long, pubescent, vaginate to near the blade; spikes 2-3 mm. thick X 5-9 cm. long, generally curved; peduncle 5-15 mm. long, pubescent; bracts triangular-subpeltate, densely yellow-fringed; fruit obpyramidal, 3- or 4-sided, glabrous; stigmas small, sessile.
