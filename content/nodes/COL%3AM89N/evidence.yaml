    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Perennial herb, 0.20-0.45 m high; rhizome erect, moderately branched. Leaves terete to subterete, rather flexible, basally dilated; sheath purplish, fibrous. Spathe green, erect, rigid, terete, exceeding stem, appearing as a straight continuation of stem. Bracts imbricate, dull green, sometimes purplish, lower ones broadly lanceolate, upper one tubular, completely sheathing flower bud. Inflorescence composed of 2-6 cymes; single flower per cyme in axils or often 2 developing from base to apex; segments yellow, often with a reddish midvein, narrowly elliptical. Flowering time July-Apr. Capsule broadly obovoid to nearly globose, smooth.
