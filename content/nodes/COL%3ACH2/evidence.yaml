            en: Supports the living lineage names, the compared chordate structures, and only the sampled phylogenetic result and its stated limitations.
            zh: 支持现生支系名称、所比较的脊索动物结构，以及受样本范围约束的系统发育结果与其明确局限。
          locator: "Nature 453:1064–1071; Main text, Introduction (shared structures and three living groups); Results and Discussion, “Deuterostome relationships” (146-locus contrast, 1,090-orthologue analysis and Figure 1); “Genome sequence” (Branchiostoma floridae genome sample: one gravid male, Tampa Bay, July 2003)."
      - id: hotta-2020-ciona-ontology
