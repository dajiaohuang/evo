        usage:
          scope:
            en: "Supports a Ciona robusta (C. intestinalis type A) larva-to-juvenile example only: larval tail anatomy, tail absorption, and post-metamorphic pharyngeal fissures/endostyle. Imaging and histology material sources remain study-specific; no genus-wide or phylum-wide adult claim is inferred."
            zh: 仅支持柄海鞘 Ciona robusta（C. intestinalis type A）从幼体到稚体的例子：幼体尾部结构、尾部吸收、变态后咽裂与内柱。成像和组织学材料来源保持为该研究特定信息，不推断属级或全门成体特征。
          locator: "Scientific Reports 10:17916 (2020); Results, “The DO and AO from the post-hatching larva stage to the Juvenile stage,” “The embryonic development, pre-metamorphosis meta-period,” and “Metamorphosis meta-period,” including Figure 2 and the 27–30 hpf at 18 °C / 75–90 min at 18–20 °C tail-absorption passages; Methods, “Biological materials” and “Image acquisition”; Figures 2 and 6. Samples: C. intestinalis type A (C. robusta); time-lapse/CLSM material from Maizuru Bay and Tokyo Bay, Japan; histology material from the Venice Lagoon, Italy."
