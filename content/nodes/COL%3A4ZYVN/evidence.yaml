    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants lithophytic or terrestrial, 300-600 mm tall; basal leaves c. 10 in a rosette, lorate to narrowly elliptic, shortly petiolate, concolourous green, acute, 60-150 x 12-25 mm, margins slightly undulate, cauline leaves distant, narrowly lanceolate, acute, to 15 mm long. Inflorescences densely to laxly many-flowered, to 300 x 40 mm; bracts green, thin, narrowly lanceolate, acute, to 10 mm long. Flowers lilac to white, with darker spots on all parts. Sepals subequal, subacute, narrowly ovate, 7-10 mm long; median concave; laterals oblique. Petals similar to the sepals, but somewhat smaller. Lip patent, narrowly obtriangular, 8-12 x 5 mm, 5-lobed, lobes linear to lorate, to 4 mm long; side lobes sometimes united into a single, lacerated lobe.
