          - text: Stenoglottis longifolia is most likely to be mistaken for S. fimbriata. Both species exhibit a high degree of morphological variation, particularly in those characters that have historically been used to diagnose them, including overall plant size and degree of fimbriation of the labellum. Whereas specimens of S. longifolia are generally more robust (i.e. having long leaves and tall, many-flowered inflorescences) and usually have relatively large individual flowers with deeply divided side lobes, these traits are inconsistent and vary considerably within and between populations of both taxa. Instead, S. longifolia and S. fimbriata are most reliably distinguished by differences in their floral bracts, column morphology and pollination mode. The bracts of S. longifolia flowers are markedly recurved, whereas those of S. fimbriata are sheathing. The auricles of S. longifolia are clavate with narrow stalks and swollen apices and project beyond the anther, such that they lie between the stigmatic arms and pollinia. In contrast, the auricles of S. fimbriata are usually slender or wider only slightly at the apex and are adnate to the sides of the anther and therefore do not obstruct the stigmatic arms. Consequently, the flowers of S. fimbriata (both varieties) exhibit a high incidence of spontaneous self-pollination, whereas those of S. longifolia do not.
