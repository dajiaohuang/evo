          title: Annona purpurea Moc. & Sessé ex Dunal, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Tree with ferruginous-tomentose branchlets. Leaves deciduous, on 3-5 mm. long petioles, membranaceous, on the upper side shortly and thinly, on the nerves more densely hirsute, finally more or less glabrate, underneath longer ferruginous- hirsute along the nerves, obovate or elliptic-obovate, rotundate at the base, shortly acuminate at the apex, 12-30 cm. long and 6-14 cm. broad. Flowers solitary, sub- sessile; flower bud enclosed at first by an involucre composed of 2 sessile acuminate bracts. Calyx lobes triangular-ovate, acuminate, 1-2 cm. long. Outer petals valvate, thick, rigid, ovate-lanceolate, gradually tapering into a long, obtuse apex, up to 5 cm. long and 2 cm. broad, ferruginous-sericeous on the outside, inner petals imbricate, thinner, elliptic-oblong, rotundate at the apex, 2.5 cm. long. Stamens 5-6 mm. long. Fruit globose, up to 20 cm. in diameter, bearing numerous pyramidal protuberances and clothed with brown felt-like tomentum. Seeds 28-30 cm. long.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 536
          archiveSourceId: DA8CE169-1756-494D-A627-FE14EFCE9C88
