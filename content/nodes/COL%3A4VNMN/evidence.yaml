    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Perennial herb, up to 1 m high. Culm bases distinctly bulbous and woody. Leaves subequally spaced along culm. Inflorescence simply glomerate-spicate or with 1 or several basal branches. Glumes castaneous or dark reddish brown.
            textZh: Scleria bulbifera Hochst. ex A.Rich. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_11118_0
            locator: "SANBI/WFO archive Morphology row 3426; source identifier 11118.0; cited publication: Herman, PPJ; Retief, E. 1997. Plants of the northern provinces of South Africa: Keys and diagnostic characters. Strelitzia 6: 1 - 681. National Botanical Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Perennial with annual aerial parts. The morphology of the inflorescence of this species varies from branched to simply glomerate- spicate, with the glomerules comprising few or many spikelets. The surface patterning of the achene is also variable, with smooth, tuberculate or trabeculate achenes occurring, sometimes even on the same plant. The same types of inflorescence and achene may occur in several species from all of which S. bulbifera is distinguished by its bulbous, woody and silicified culm bases which arise from a woody, horizontal rhizome with (usually) very short internodes so that adjacent culm bases are ± contiguous.
            textZh: SANBI 条目提供了 Scleria bulbifera Hochst. ex A.Rich. 的鉴别特征。
            sourceIds:
              - sanbi_9620_0
            locator: "SANBI/WFO archive Diagnostic row 78250; source identifier 9620.0; cited publication: Hennessy, EF. 1985. The genus Scleria in southern Africa. Bothalia 15(3 & 4): 505 - 530. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
