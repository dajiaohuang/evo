          - text: Bulbous geophyte, 1-4 cm. Leaves 3-7 in a rosette, spreading, linear to lanceolate, plain or spotted, margins thickened. Flowers tubular, erect, borne at ground level, in a congested raceme, white, heavily scented, anthers exserted.
