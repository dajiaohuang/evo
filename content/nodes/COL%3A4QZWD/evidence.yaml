    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Aroena Like Q. parviflora but pedicels 2-4 mm long, corolla 8-16 mm diam., inside yellow near tips of lobes, elsewhere cream, dotted and ringed with red, covered with fine hairs and marginal cilia, corona reddish.
            sourceIds:
              - sanbi_14722_0
            locator: "SANBI/WFO archive Morphology row 34096; source 14722.0; publication: Bruyns, PV. 2013. Apocynaceae. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 248 - 264. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Plants mostly have fairly thick stems with stout and often decurved tubercles arranged into four neat angles. In this respect they bear some resemblance to plants of Q. inversa. The flowers develop from tiny peduncular patches which sometimes etiolate to a small peduncle up to 3 mm long (as in Q. parviflora and Q. inversa) and they are held facing downwards on a short pedicel. Quaqua pulchra has remarkably beautiful flowers. They are more or less flat, with a very shallow tubelet around the gynostegium and with spreading lobes whose apices are somewhat thickened. On the inside the lobes are yellow or yellowish green, which merges gradually into a mottling of red to maroon around the base. The mouth of the tube is usually mottled or barred with this darker colour on a white background, with the white background usually forming at least one ring but sometimes as many as three. The patches of red to maroon may be rather pallid, however, and one plain yellow-flowered plant was also once found near Vredendal. Flattened and much crinkled hairs are found on the inside of the flower on the darker, lower part of the corolla lobes only. There are also plenty of long, very slender cilia along the margins of the lobes. These are somewhat longer than the hairs on the corolla and are fine (not clavate at all) and rather untidily spreading and intertwined. The corona is reddish. It consists of slender outer lobes which are bifid into strongly spreading, almost filiform lobules towards their apices and are lightly channelled towards their bases. The inner lobes are small and are without any trace of a dorsal projection.
