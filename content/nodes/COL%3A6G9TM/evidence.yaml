    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Tufted annual to 350 mm high; vegetative parts with glandular hairs with swollen apices; culm with glandular ring below nodes. Leaf blade 50-100 x to 3 mm; short glandular tipped hairs mixed with long slender hairs present, margins with crateriform glands and mid-rib with sunken glands. Inflorescence open, occasionally contracted; lowest branches not whorled; spikelets spreading; pedicel long, flexible, a single annular gland present. Spikelet (3)5-15 x 1.3-2.5 mm, eglandular, upper part of rachilla fragile, lower part persistent, breaking up from the base upwards; glumes subequal, reaching to 1/2 up lemma above; lemma 1.2-2.0 mm long, broadly obtuse to truncate, keel glabrous or scabrid, lateral nerves distinct; palea wingless, keels glabrous or scabrid, margins wide apart, narrowing between keels and margins towards apex, persistent; anthers 3, 0.6-1.0 mm long; caryopsis broadly oblong to broadly ovate.
            textZh: Eragrostis annulata Rendle ex Scott Elliot 的 SANBI 物种条目记录了形态特征。
