    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants several- to many-stemmed. Leaves at first erect, later folding over about the middle, 0.8-1.5 m long, 12-40 mm broad, yellow-green to dull green or subglaucous (see subspecies), strongly keeled, relatively flaccid in texture; margin serrulate to smooth. Scape overtopping reflexed leaves, 1-2 tall. Raceme oblong to subcylindrical, dense, 70-150 x 45-55 mm; buds orange-red to pinkish red or dull blood-red; flowers spreading to pendulous, yellow to greenish yellow (see subspecies). Bracts oblong-ovate to oblong, obtuse to rounded, 4-8 mm long; margin finely serrulate. Pedicels almost obsolete, about 1 mm long. Perianth subcylindrical, 20-28 mm long; lobes broadly ovate, 2.5 mm long, scarcely spreading. Stamens exserted by 6-9 mm at anthesis and remaining exserted. Fruit subglobose-triquetrous, 4-5 mm long.
