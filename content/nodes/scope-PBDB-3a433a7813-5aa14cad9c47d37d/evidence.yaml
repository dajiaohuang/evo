  claims:
    - subjectId: taxon:darwinius
      claimType: taxonomy
      claimKind: scientific
      statement: PMO 214.214 and WDC-MG-210 are the two slabs of the Darwinius masillae holotype; adapiform and higher-level placement remain analysis-bounded rather than ancestral claims.
      confidence: medium
      confidenceRationale: The taxonomy field for darwinius is bounded to the named material and cited primary-study locator; that evidence type is not generalized to ancestry or a whole clade.
