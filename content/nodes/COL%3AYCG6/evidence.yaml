      lifeHistory:
        status: partially-supported
        claims:
          - text: "A transcriptome comparison of the study's artificially cultivated Cordyceps militaris mycelium and mature fruiting-body samples identified 2,712 differentially expressed genes: 2,113 were reported as up-regulated in mycelium and 599 in fruiting body under the stated thresholds. This describes the two analyzed samples, not a species-wide developmental rule."
            sourceIds:
              - yin2012cordyceps
            locator: Abstract and study overview; Methods, Differential Expression Analysis (FDR ≤ 0.001 and |log2 RPKM ratio| ≥ 1).
            placeTimeScope: "Artificial cultures were incubated at 22°C: mycelium on PDA for 18 days in darkness; fruiting-body material was grown on rice medium through dark and 16:8-hour light:dark phases. The article reports sequencing at BGI in Shenzhen, China, but not the cultivation site or calendar dates."
            lifeStatus: Artificially cultivated mycelium and mature fruiting-body samples; the source does not identify the strain's wild provenance or assess natural populations.
            originalLanguage: en
        gaps:
          - Mycelium and fruiting-body samples were grown on different media, confounding developmental material with culture conditions.
          - The transcriptome comparison reports two sample types without biological replication, so it does not establish strain-wide or species-wide expression patterns.
          - Morphology, other life-history traits, ecology, evolution, distribution, fossils, conservation, and independent review remain unassessed.
