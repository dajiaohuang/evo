  claim-rationales.zh:
    - Qianodus duplicis：具名材料和已发表的系统或系统发育处理支持这一有限鉴定。置信度保持中等，因为画像不会把取样位置转化为直接祖先或普遍共识。
    - Qianodus duplicis：一手研究直接报告了具名地点与层位。置信度为中等，因为单一研究样本不能确定缺失、特有性或全球地理范围。
    - Qianodus duplicis：证据边界是明确的：保留沉积或解剖背景，同时不填补无依据的行为与生态位。中等置信度针对这一有限的否定性陈述，而非重建生态。
    - Qianodus duplicis：所引图件与描述直接记录了具名解剖观察。由于保存与标本取样限制了性状完整性和变异，置信度为中等而非普遍结论。
    - Qianodus duplicis：一手来源与具体定位符支持显示的样本区间。置信度为中等，因为该包络明确限定于标本或地点，而非全球首现或末现。
  claim-statements.zh:
    - Qianodus duplicis 由 23 件孤立齿旋代表，在分析中位于软骨鱼干群；它不是关节连接的冠群鲨类。
    - Qianodus 齿旋来自中国贵州雷家屯晚埃隆期 Rongxi 组；这一单一样本不能确定全球分布。
    - 齿旋记录了牙齿发育与组织学，但不能由孤立构件还原食性、猎物、运动、体型或栖息地偏好。
    - Qianodus 齿旋保存不脱落牙齿并以错列方式向舌侧添加，组织学研究包括正模 IVPP V26641 等具名标本。
    - 显示的约 439 Ma 时间点仅代表晚埃隆期 Rongxi 组样本，并非软骨鱼类全球首现。
