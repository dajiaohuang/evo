  claims:
    - subjectId: taxon:qianodus
      claimType: taxonomy
      claimKind: scientific
      statement: Qianodus duplicis is represented by twenty-three isolated tooth whorls and was recovered as a stem chondrichthyan; it is not an articulated crown shark.
      confidence: medium
      confidenceRationale: "Qianodus duplicis: Named material and a published systematic or phylogenetic treatment support this bounded identification. Confidence remains medium because the profile does not turn a sampled placement into direct ancestry or universal consensus."
      referenceLinks:
        - referenceId: andreev-2022-qianodus
          relation: supports
          pages: 964–968, especially 965–967
          figure: Figures 1–2; Extended Data Figures 1–3
          quoteLocator: Systematic palaeontology; tooth-whorl development and histology; geological setting
    - subjectId: taxon:qianodus
      claimType: biogeography
      claimKind: scientific
      statement: The Qianodus tooth whorls come from the late Aeronian Rongxi Formation at Leijiatun, Guizhou, China; this single sample does not establish a global distribution.
      confidence: medium
      confidenceRationale: "Qianodus duplicis: The primary study reports the named locality and horizon directly. Confidence is medium because one study sample cannot establish absence, endemism or a global geographic range."
      referenceLinks:
        - referenceId: andreev-2022-qianodus
          relation: supports
          pages: 964–968, especially 965–967
          figure: Figures 1–2; Extended Data Figures 1–3
          quoteLocator: Systematic palaeontology; tooth-whorl development and histology; geological setting
    - subjectId: taxon:qianodus
      claimType: ecology
      claimKind: scientific
      statement: The whorls document tooth development and histology, but diet, prey, locomotion, body size and habitat preference cannot be recovered from the isolated elements.
      confidence: medium
      confidenceRationale: "Qianodus duplicis: The evidence boundary is explicit: depositional or anatomical context is retained while unsupported behaviour and niche claims are withheld. Medium confidence applies to that bounded negative statement, not to a reconstructed ecology."
      referenceLinks:
        - referenceId: andreev-2022-qianodus
          relation: supports
          pages: 964–968, especially 965–967
          figure: Figures 1–2; Extended Data Figures 1–3
          quoteLocator: Systematic palaeontology; tooth-whorl development and histology; geological setting
    - subjectId: taxon:qianodus
      claimType: morphology
      claimKind: scientific
      statement: Qianodus whorls preserve non-shedding teeth added lingually in offset rows, with histology examined from named specimens including IVPP V26641.
      confidence: medium
      confidenceRationale: "Qianodus duplicis: The cited figures and descriptions directly document the named anatomical observations. Confidence is medium rather than universal because preservation and specimen sampling limit character completeness and variation."
      referenceLinks:
        - referenceId: andreev-2022-qianodus
          relation: supports
          pages: 964–968, especially 965–967
          figure: Figures 1–2; Extended Data Figures 1–3
          quoteLocator: Systematic palaeontology; tooth-whorl development and histology; geological setting
    - subjectId: taxon:qianodus
      claimType: fossil-range
      claimKind: scientific
      statement: The displayed approximately 439 Ma point is the late Aeronian Rongxi Formation sample and is not a global Chondrichthyes first appearance.
      confidence: medium
      confidenceRationale: "Qianodus duplicis: The primary source and concrete locator support the displayed sample interval. Confidence is medium because the envelope is explicitly specimen- or locality-scoped and not a global first or last appearance."
      referenceLinks:
        - referenceId: andreev-2022-qianodus
