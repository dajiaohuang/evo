        claims:
          - text: An erect or ascending herb, apparently-annual, shortly pubescent or glandular-pilose at least towards the apex, shining, divaricately branched from the base upwards, about 1-1 1/2 ft. high; stem and branches tetragonous, slender, furrowed or striate; glands minute; several internodes longer than the leaves, the upper shorter; leaves opposite, ovate or lanceolate, acute or obtuse and minutely apiculate, shortly narrowed or subobtuse or sub-truncate at the base, submembranous, glabrous or more or less pilose, sparingly glandular, strongly serrate-dentate, petiolate, 3/8-1 in. long, sometimes a little oblique, 1/10-3/4 in. broad; petioles ranging up to 2/5 or 1/2 in. long, glabrous or glandular-pilose; racemes terminal, many- or few-flowered, lax or rather dense, bracteate or leafy, 1-12 in. long, glandular-pilose; bracts alternate or the lower opposite, lanceolate or subulate, acute, glandular-pilose, entire or few-toothed, sessile or subsessile, 1/6-1/2 in. long, the lower leaf-like; pedicels or peduncles rather slender, spreading or ascending, bracteate or leafy only at the base, 1/8-3/4 in. long; calyx-segments lanceolate or sublinear, acute or subacute, entire, glandular-pilose, 1/8-1/5 in. long; corolla white, about 1/2-5/8 in. long, minutely glandular-puberulent outside, thinly membranous; lips about 1/4-3/8 in. long; lobes of the upper lip oval or shortly oblong, rounded at the apex, 1/8-1/6 in. long, lower lip about 1/2 in. broad; spur conical, together with the tube 1/6-1/4 in. long, blunt; palate shortly glandular-bearded; capsule oblong, subtruncate or very broadly excised at the apex, unequal and nearly rounded at the base, 1/4-1/2 in. long, 1/6-1/4 in. broad, slightly narrowed below the apex, not or somewhat horned at the apex.
