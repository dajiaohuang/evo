          title: Euphorbia graminea Jacq., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Herb, stems terete, not articulate, branching from base, sprawling to 1.5 m long. Leaves alternate, becoming opposite above; stipules obsolete; petiole to 2 cm long; blade oblong-elliptic to sublinear or rarely ovate, 2.5-4(-8) X 0.5-1.5(-5) cm, green, short pubescent or glabrous, the base acute to obtuse, the margin entire, the apex acute. Cyathia terminal on dichotomizing upper branches, funnelform, ca 1 mm diam; glands 2-4, minute, exappendiculate (extra-Panamanian specimens often with large white appendages). Capsule broadly ovoid, ca 3.5 mm diam, glabrous; seed ovoid, 1.5 mm long, angular, deeply punctate with pits in regular longitudinal rows, ecarunculate.
