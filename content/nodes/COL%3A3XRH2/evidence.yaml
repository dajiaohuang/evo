        usage:
          title: Malvastrum coromandelianum (L.) Garcke, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Suffrutex or shrub up to 1.5 m high, covered with simple and 4-rayed, strigose hairs, the rays approximate in pairs. Leaves with the petiole slender, up to 2.5 cm long, strigose, the stipules lanceolate, acuminate, 5-10 mm long; blade oblong- lanceolate to rounded-ovate, broadly cuneate to sometimes truncate at the base, acute or obtuse at the apex, coarsely serrate, at the margin, 3-8 cm long, the nerva- tion prominent beneath, strigose on both sides, the indumentum however denser on the lower surface. Flowers axillary, solitary or in glomerules, the individual flow- ers sessile or shortly pedicellate, the pedicel up to 5 mm long; epicalyx bractlets linear-subulate, acute, 3-6 mm long and 0.5-1 mm broad, hispid; calyx broadly campanulate, 5-costate, lobed to or slightly below the middle, 5-7 mm long, strigose, the lobes ovate, acuminate, ciliolate; petals 8-9 mm long and 4-6 mm broad, the claw barbate; androecium slightly shorter than the calyx, the staminal tube ca 3-3.5 mm long, glabrous; styles 5-6 mm long, connate in the lower part. Mericarps 10-12, dorsally sulcate, ca 2 mm long and 1-1.2 mm thick, the apex provided with an erect awn ca 1-1.5 mm long, with 2 short, dorsal awns ca 0.5 mm long near the middle, dorsally and in part laterally minutely stellate-puberulus and hispid toward the apex.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 7244
