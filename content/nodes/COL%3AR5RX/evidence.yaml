          title: Cardiospermum halicacabum L., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Annual vines; stems 5- or 6-ribbed, glabrous or minutely pubescent. Leaves biternate; leaflets oblong to ovate, obtuse or subacute at apex, attenuate or acute at the base, 2-8 cm long, 1-2.5 cm wide, deeply incised-dentate, membranous, pubescent or glabrate; stipules subulate, small. Thyrses long-pedunculate on a tendril, umbellike in appearance. Flowers yellowish white, mostly 4-5 mm long; sepals 4, the outer 2 small, pubescent, the inner 2 large, glabrous, oblong, ca. 4 mm long; petals obovate, attenuate, equal to the inner sepals, the scale round, to 2.5 mm long, the deflexed appendage oblong, villous especially along the mar- gins, the crest obovate, orange; disc with 2 conspicuous suborbicular, glabrous glands 0.5 mm long; filaments pilose, those of the staminate flowers to 3.5 mm long. Capsules subglobose, 3-lobed, 3-4 cm long, membranous, inflated, pubes- cent, green to brown or reddish brown; seeds globose, black, 5 mm long, the hilum large, bilobed.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 12477
