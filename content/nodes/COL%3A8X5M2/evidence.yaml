          - text: Schoenus pseudoloreus can be distinguished from other sedges in this clade by its narrowly contracted panicles with inflorescence bracts having small membranaceous extensions or ‘ears’ thatcover the base of each spike. These extensions originate at the base of the inflorescence bracts and can cover either part or entire spikes, as well as they are sometimes split down the middle and most often deteriorate with age. Schoenus aureus also has similar membraneous extensions with ‘ears’; however, that species has a flat blade and ivory sheaths compared to the terete blade and more reddish sheaths of S. pseudoloreus. Schoenus pseudoloreus plants growing farther to the south and east tend to have firmer and darker coloured glumes compared to their more northern counterparts.
