    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Caespitose, phyllopodic perennial graminoid. Sometimes partly viscous on sheaths. Culms terete, 200-395(-515) x 0.4-1.2(-1.7) mm. Leaves basal, 2-7, often reduced and awl-shaped, (18-)23-31(-41) x 0.16-1.0 mm, proximally channelled or not, margin serrate above sheath. Sheaths expanded at base, firm to membranaceous, glossy, often longitudinally striate and viscous, loosely clasping culm, red-maroon to ivory in colour. Ligule often membranaceous but can be firm, 0.2-2.8 mm. Inflorescence a narrow, spike-like panicle, (19-)23-31(-41) x 3.0-5.5(-8.0) mm, with membranaceous extensions covering at least the base of each spike, proximal rachis length 4.0-11.3(-16.0) mm. Proximal primary inflorescence bracts firm,(31-)48-87(-109) mm long, often exceeding length of inflorescence several times. Spikes 3-11, 6-11(-16) mm long, relatively narrow. Spikelets 3.9-5.8(-8.5) x 1.0-1.6(-2.2) mm, linear-lanceolate to narrow oblong, pedicellate, 2-4(-6) spikelets/spike. Rachilla (0.2-)1.0-2.0(-3.0) mm long. Glumes (3-)4-6(-7) per spikelet, proximal glume (1.4-)2.0-3.0(-4.2) mm long, subproximal glume (0.8-)2.1-2.8(-5.0) mm long, thick, often shiny, upper glumes longer in length, colour ranging from light chestnut-brown to maroon. Mucros may or may not be present, proximal mucro (0.1-)0.5-1.2(-1.7) mm long, subproximal mucro (0-)0.5-0.8(-1.4) mm long. Stamens (2-)3(-6)per floret, anthers 3.3-4.3 mm long. Stigmas 3-branched. Perianth bristles 3, shorter than glumes. Nutlet wide elliptical, 3-sided, often with dark red blotches or spots, 2.7-3.4 x 1.2-1.5 mm. Nutlet beak 0.2-1.5 mm long.
