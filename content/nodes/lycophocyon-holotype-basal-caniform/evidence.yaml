    - subjectId: event:lycophocyon-holotype-basal-caniform
      claimKind: scientific
      claimType: topology
      statement: UCMP 85202 and associated SDSNH skeletons preserve a craniodental–postcranial mosaic that the study’s 30-terminal morphology analysis places at the base of Caniformia; family assignment and diet remain unresolved or model-dependent.
      confidence: medium
      confidenceRationale: Lycophocyon holotype and basal-caniform test uses explicit named specimens or disclosed datasets, but placement, function or ecology depends on a sampled matrix or comparative model and is kept separate from observation.
