          figure: Figures 2–7; Tables 1–3; Appendices S1–S3
          quoteLocator: Holotype and paratypes; Phylogenetic analysis; Dietary habits
  claim-rationales.zh:
    - “狼形兽正模与基干犬型类检验”的具名标本或已公开数据集是明确的，但位置、功能或生态依赖采样矩阵或比较模型，且已与直接观察分开。
  claim-statements.zh:
    - UCMP 85202 和相关 SDSNH 骨架保存了颅牙—躯后骨骼镶嵌特征，研究的 30 端点形态分析将其置于犬型亚目基部；科级归属和食性仍未解决或依赖模型。
