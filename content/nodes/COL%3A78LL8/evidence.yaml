            locator: "SANBI/WFO archive Diagnostic row 47511; source identifier 7035.0; cited publication: Liltved, WR; Oliver, EGH; Pauw, A. 2008. Pterygodium vermiferum (Coryciinae), a new, autonomously self-pollinating, oil-secreting orchid from the Western Cape of South Africa. S. African J. Bot. 74(4): 617 - 622. [http://dx.doi.org/10.1016/j.sajb.2008.03.002]. [Copyright held by the South African Association of Botanists (2008); http://www.sciencedirect.com/science/journal/02546299]. [CC BY]"
