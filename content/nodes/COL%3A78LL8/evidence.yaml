    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Like P. volucris but flowers sometimes cleistogamous, ± 15 x 10 mm diam., with shallowly dish-shaped hood, and rostellum arms with extra twisted arms or appendages.
            textZh: Pterygodium vermiferum E.G.H.Oliv. & Liltved 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13882_0
            locator: "SANBI/WFO archive Morphology row 1123; source identifier 13882.0; cited publication: Kurzweil, H. 2012. Orchidaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 177 - 197. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Within section Ommatodium it is evidently most closely allied to P. volucris and P. schelpei, from the Cape Floral Region (CFR), which share the lateral, lip callosities. It differs from them in having an open, broadly ovate galea formed by the median sepal and two lateral petals, which are entire or sometimes only slightly notched inwards below the apex and do not form a distinct roof-like flap over the gynostemium; several very distinct, straight to twisted rostellum arms projecting outwards or sometimes inwards below the anthers from near the stigmas, which sometimes spread onto the nearby arms; an expanded anther connective; and no viscidia.Pterygodium volucris has a distinctive large flap-like upper portion formed by the expanded, forwardly pointing terminal and distal edge of the lateral petals (Fig. 3). The upper anterior edge of the lateral petals is deeply curved inwards and together with the median sepal form a neat tube with an upwardly pointing orifice. There is no distinctly cucullate galea. The median sepal is erect and more or less straight, not falcate and the lateral sepals are patent to retrorse. The lateral wings of the lip are relatively larger. The rostellum lacks any extra twisted arms or appendages. P. volucris is common in the western and southern Cape between Clanwilliam, the Cape Peninsula and Humansdorp and is sympatric with P. vermiferum.The other similar species, Pterygodium schelpei H.P.Linder, has pure white flowers with an almost T-shaped lip with larger lateral lobes. It occurs from around Worcester in Western Cape Province northwards to the Richtersveld, Northern Cape Province.
            textZh: SANBI 条目提供了 Pterygodium vermiferum E.G.H.Oliv. & Liltved 的鉴别特征。
            sourceIds:
