    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Succulent shrub to 2 m, with slender branches from base. without persistent dried leaves. Leaves dull green, without spots, narrowly lanceolate, to 25 cm long; sheath not auriculate and without ciliate margins, faintly striated, pale green; margins with firm, white teeth. Racemes cylindric, slightly conical, ± dense, simple or branched, 20-30 cm long. Flowers bright red to scarlet, yellowish at mouth, 40-45 mm long; stamens and stigma included or shortly exserted.
            textZh: Aloiampelos gracilis (Haw.) Klopper & Gideon F.Sm. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13850_0
            locator: "SANBI/WFO archive Morphology row 9007; source identifier 13850.0; cited publication: Klopper, RR; Smith, GF. 2012. Asphodelaceae: Aloe L. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 66 - 70. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: In vegetative characters this species resem-bles A. striatula, but the leaves of this species are duller green and the leaf sheaths are not as distinctly striate as in that one. The flowers are borne in a lax raceme on slightly longer pedicels. They are similar to those of A. ciliaris but the leaf bases are very different and the racemes are much laxer than in that species.
