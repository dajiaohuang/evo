    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Much-branched shrublet, up to 750 mm tall. Leaves ± cuneate towards base, thick-textured, densely grey stellate-tomentose, entire or round-toothed. Flowers solitary in leaf axils (upper leaves often reduced in size), bell-shaped, pink, purplish or violet. Capsule usually hidden in persistent calyx.
            sourceIds:
              - sanbi_14904_0
            locator: "SANBI/WFO archive Morphology row 34930; source 14904.0; publication: Snijman, DA. 2013. Malvaceae. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 416 - 420. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Characterized by the dense, fine, whitish, stellate pubescence of the branches, leaves and peduncles contrasting with the coarse stellate pubescence of the pedicels and calyx. The length of the hairs on the calyx varies considerably being long and shaggy on some specimens and not so long on others. The leaf shape and margin varies from elliptic-cuneate with entire margins to oblong-cuneate with a truncate and 3-lobed apex. Two forms of petals and filaments are found. The petals have either a narrow, oblong blade or a semi-orbicular blade with or without a ciliate margin, while the filaments which are broadest near the apex, either narrow gradually to base and apex or narrow abruptly and so may be taken to be somewhat cruciform.
            textZh: SANBI 条目提供了该种的鉴别特征。
