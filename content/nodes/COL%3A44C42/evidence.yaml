        claims:
          - text: Acaulescent, cormous geophyte, 3-6 cm. Leaves oblong, channelled. Flowers yellow, tepals cupped, anthers sessile, style exceeding anthers, stigmas lobed.
            textZh: Moraea citrina (G.J.Lewis) Goldblatt 的 SANBI 物种条目记载了植株、叶片和花部形态。
            sourceIds:
              - sanbi_13878_0
            locator: Strelitzia 29; archive Morphology row 7389, source 13878.0
            placeTimeScope: Regional species account published 2012; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
          - text: The only yellow-flowered species of ser. Eurystigma, Moraea citrina has relatively large flowers with tepals usually 20-28 mm long and rarely wider than 10 mm. The glossy leaves are channelled and have straight margins. It is one of just two species of the series with sessile anthers, the other being M. versicolor. Orange-flowered plants are known from the Bokkeveld Mtns at the northern end of its range. Hybrids have been recorded near Ceres between M. citrina and M. variabilis. These plants have larger flowers in a range of colours, mostly pale orange, not recorded in either species.
            textZh: SANBI 条目提供了 Moraea citrina (G.J.Lewis) Goldblatt 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: Strelitzia 42; archive Diagnostic row 95269, source 18638.0
