          - text: Ich kann mich nicht recht daruber entscheiden, in welche Gruppe die vorliegende Art am besten untergebracht wird. Am wahrscheinlichsten gehort sie zu den -Bracteata- und zwar in die Nahe der M. asperum Haw., mit dem zusammen M. Urbanianum durch das Fehlen der Bracteen unter dem Kelche vor allen anderen Arten der Gruppe charakterisiert ist. Ich hoffe auf die Art noch einmal zuruckzukommen, sobald ich in den Besitz reichlicheren Materiales gelangt bin.
