        claims:
          - text: Dwarf, gnarled, intricately branched or more lax shrublet, up to 600 mm tall. Leaves thick, obovate, apex recurved and hooked, crisped-undulate, mostly 3-12 x 2-5 mm, thinly greyish-woolly. Flowerheads 2-several in small clusters nested among leaves, discoid, cylindric, 5-7 mm long, bracts 4-seriate, caducous, oblong, obtuse, pale yellow or straw-coloured, florets 9-18.
