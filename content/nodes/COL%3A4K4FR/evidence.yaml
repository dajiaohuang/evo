        claims:
          - text: It is endemic to south-facing Ecca Group shale cliff faces (Karoo Supergroup) along the Mzimvubu River. At an altitude of ± 600 m. The vegetation consists of savanna and the rainfall occurs mainly from spring to autumn, 800-1000 mm per annum. The climate is subtropical, with hot summers, dry, sunny, frost-free winters and cool evenings.
