            locator: "SANBI/WFO archive Morphology row 83006; source 6463.0; publication: Van Jaarsveld, EJ; Van Wyk, AE. 2004. Lamiaceae: Plectranthus mzimvubuensis, a new species from Eastern Cape, South Africa. Bothalia 34: 30 - 32. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: "Plectranthus mzimvubuensis is at once distinguished from P. reflexus Van Jaarsv. & T.J.Edwards by its shorter parallel-sided corolla tube which is 10 mm long, whereas that of P reflexus is longer, 25 mm. and constricted at the mouth. P. mzimvubuensis is a much-branched scrambler from a rootstock tearing distinct root tubers, whereas P. reflexus is an erect shrub with fleshy roots. In both species the lips and stamens become reflexed and the mature style is twice the length of the corolla tube. According to Codd's (1985) key in his treatment for the Flora of southern Africa (28.4: 141), the new' species would key out to ‘28' which includes five species, P. ambiguus. P. ecklonii, P. dolomiticus, P. petiolaris and P. laxiflorus. Of these, the corolla of P. petiolaris, P. laxiflorus and P. dolomiticus are curved like a ‘Dutchman's pipe'. P. mzimvubuensis can be distinguished from P. ecklonii and P. ambiguus by its short corolla of 9-10 mm with the lobes of the upper lips hooded, their lower margins overlapping the lateral lobes and forming two short spurs, each 2 mm long and ending in a translucent hair. 0.5-2.0 mm long. The spurred upper lobes of the corolla are a unique feature in the genus Plectranthus, possibly assisting flying insects in effective pollination. The corolla tube of P. ecklonii is 12-18 mm long and slightly expanding to the throat, whereas the corolla tube of P. ambiguus is 20-25 mm long."
