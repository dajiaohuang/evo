    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Perennial, branched, aromatic shrub up to 1 m tall, 3 m diam., scandent and pendent from cliffs. Roots fibrous to slightly fleshy, but bearing distinct oblong to rounded tubers; tubers 25-50 x 14-20 mm, grey, tissue translucent and slightly yellowish. Stems herbaceous, semisucculent, 4-angled, terete in older branches and with a succulent basal caudex. 100 mm diam. Bark smooth, grey. Leaves thin-textured and drying chartaceous, broadly ovate-deltoid to subrotund. (15-)25-50(-75) x (20-)28-50(-60) mm, apex acuminate, with a short drip-tip, base truncate to subcordate, occasionally slightly decurrent on petiole, adaxial surface sparsely strigose becoming glabrescent, abaxial surface prominent reticulate-veined, strigose, becoming less so with age. covered with slightly sunken, translucent gland dots (sessile glandular trichomes) becoming yellowish brown in dried specimens, veins densely strigose and with similar gland dots; margin serrate-dentate with 6-10 pairs of teeth (0.5-)1-2(-4) mm long, ciliate; petiole reddish purple. 10-20(-30) mm long, finely strigose with unbranched, multicellular translucent hairs, sparsely beset with gland-tipped trichomes. Inflorescence short, terminal, verticillate, (30-)70-90(-120) mm long, sometimes with a pair of side branches at base; rachis sparsely strigose, bearing scattered, sessile, yellowish brown gland dots and unbranched, multicellular, glandular trichomes; bracts broadly ovate, acuminate, 7 x 4 mm. Flowers in sessile. 1-3-flowered cymes forming 2-6-flowered verticillasters, the latter 6-12(-18) mm apart; pedicels 5-8 mm long, finely strigose, bearing few, multicellular, gland-tipped trichomes. Calyx up to 4 mm long, accrescent, lengthening to 10-11 mm in fruit, densely covered with sessile, yellowish brown gland dots at base, 2-lipped; upper lip erect, broadly ovate, abruptly acuminate, ± 3 mm long; lower lip 4-toothed, teeth acuminate; tube ± 8 mm long. Corolla pink; tube straight. 9-10 mm long, laterally compressed, 3 mm wide, slightly defiexed forming a swollen saccate base, sparsely beset with translucent hairs, 0.2-3.0 mm long, 2 lipped; upper lip 4-lobed, 8 mm high, becoming re flexed when stigma matures; upper lobes bent forward and forming an ascending, spreading 2-spurred hood, ventral margin of upper lobes overlapping two upper margins of lateral lobes and each lobe forming a characteristic spur up to 2 mm deep, apex of spur beset with translucent hairs, 0.5-1.0 mm long; lower lip boat-shaped, 6 mm long, soon becoming reflexed. Stamens 4, free, fused to tube ± 1.5-2.0 mm from throat, didynamous, lower pair exposed for 14-15 mm, upper pair exposed for 10-11 mm, both pairs becoming reflexed; anthers versatile; pollen cream-coloured. Style 14 mm long extending up to 20 mm when mature, exposed for ± 8 mm. Nutlets rounded, 1.5 x 1.3 mm, dark brown, smooth.
            sourceIds:
