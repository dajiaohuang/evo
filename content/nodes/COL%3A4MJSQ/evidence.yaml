        claims:
          - text: Scandens (?), glaberrima; ramulis mox cortice cinereo saepius transversaliter rimuloso obtectis, vetustioribus teretibus; foliis oppositis, pro genere parvis et densiusculis, modice petiolatis, coriaceis vel tenuiter coriaceis, ambitu oblongis, oblongo-obovatis usque suborbicularibus, saepe secundum costam superne replicatis, basi cuneatim et sensim in petiolum angustatis, apice obtusis vel rotundatis, manifeste crenatis, i. s. nitidis, supra obscurioribus, costa et nervis utrinque prominulis vel subprominentibus, densiuscule reticulatis, reticulo utrinque prominulo; inflorescentiis plerumque in foliorum axillis solitariis; regularibus, bis vel ter dichotome furcatis, modice pedunculatis, axibus lateralibus, manifestis, pauci-(7-15-)floris; floribus mediocribus; alabastris globosis vel depresso-ovoideis; sepalis rotundatis, sub lente minutissime et brevissime ciliolatis; petalis praefloratione imbricatis, breviter unguiculatis, palmato-ovatis, palmatim-nigro-venosis, extra et infra discum explanatum insertis; disco medio et superne in filamenta abeunte; staminibus 3, filamentis basi valde dilatatis, ima basi sese tangentibus, ovarium cingentibus, antheris rima transversali superne et extrorsum dehiscentibus; ovario 3-lobo, in stylum brevem angustato, 3-loculari, ovulis in loculo circ. 10, biserialibus, axi centrali affixis; capsula 3-loba, lobis ab apice compressis, obovato-ellipticis, plurispermis, opacis, obsolete longitudinali-striatis, seminibus (an maturis?) medium tantum lobum aequantibus vel etiam brevioribus.
