          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Scandent shrub, glabrous; flowering internodes rather slender and short, red- granular; leaves lance-elliptic or the lower subovate, apex gradually acute, base sub- equally acute or one side slightly shorter than the other, 2.5-4 cm. wide X 8-12 cm. long, pinnately nerved throughout, the nerves mostly 6-7 on each side, with rather obscure intermediates and cross-connecting nervules, drying thin but firm, translucent, prominently yellow- or red-glandular-dotted on both sides; petiole scarcely 1 cm. long, vaginate toward the base; spikes 4-8 mm. thick X 1.5-2.5 cm. long, mucronate; peduncle slender, about 1 cm. long, eventually recurving; bracts triangular-subpeltate, sparingly very short-fringed on the upper margin; fruit rather large, globose, attenuate into a short, stout style, conspicuously glandu- lar roughened, glabrous, stigmas 3.
