    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Shrublet to 1 m. Leaves small, compressed above, 1.5-2.5 mm long, bracts suborbicular, keeled above. Flowers in dense spikes, tube ± 2 mm long, neck absent. Fruits dry.
            sourceIds:
              - sanbi_14460_0
            locator: "SANBI/WFO archive Morphology row 10228; source 14460.0; publication: Bredenkamp, CL. 2012. Thymelaeaceae: Passerina L. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 776 - 777. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Passerina paleacea may easily be confused with P. rigida, as both occur on sand dunes along the coast. The branches of P. rigida are nodding and abundantly covered by pendulous branchlets, spikes are extended and the fruits are fleshy, yellow berries. Plants of P. paleacea are less robust, reaching a maximum height of 1.5 m. and are characterized by an abundance of subcapitulate inflorescences and dry fruit. The subcapitulate inflorescences at times led to the confusion of P. paleacea with P. truncata (= P. glomerata), but, these two species are morphologically as well as geographically distinct. P. paleacea has a maritime habit and P. truncata is distributed from Vanrhyns- dorp, along the Cederberg Mountains, to Malmesbury, Ceres, Tulbagh and Matjiesfontein up to Seven Weeks Poort. The earlier confusion between P. paleacea and P. ericoides was probably due to their sympatric occurrence, but these two species are morphologically quite different.
            textZh: SANBI 条目提供了该种的鉴别特征。
            sourceIds:
              - sanbi_6345_0
            locator: "SANBI/WFO archive Diagnostic row 103917; source 6345.0; publication: Bredenkamp, CL; Van Wyk, AE. 2003. Taxonomy of the genus Passerina (Thymelaeaceae). Bothalia 33(1): 59 - 98. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
