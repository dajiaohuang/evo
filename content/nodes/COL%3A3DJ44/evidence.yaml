    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Perennial herb. Stems prostrate, pubescent, rooting at nodes. Leaves orbicular to orbicular-obovate, 5-20 mm long and broad, apex obtuse or retuse, base truncate to subcordate, glabrous or sparsely pubescent beneath; petiole 1-8 mm long, pubescent, canaliculate above. Flowers solitary or rarely paired, axillary; peduncles up to 5 mm long, recurving. Sepals ovate to elliptic-ovate, 2.5-3.0 x 1.5 mm, subacute to acute, pubescent or glabrescent with ciliate margins. Corolla white, subrotate, 4.5 mm long, 6 mm wide, deeply lobed; lobes obovate, 1.5-2.5 mm long, 1.0-1.5 mm broad. Capsule globose, 3-4 mm in diameter, 1-locular, bivalved, (2-)4-seeded. Seeds subglobose, 1.5-2.0 mm long, brown to black, shiny.
            sourceIds:
              - sanbi_5962_0
            locator: "SANBI/WFO archive Morphology row 48523; source 5962.0; publication: Meeuse, ADJ; Welman, WG. 2000. Convolvulaceae, Fl. S. Africa 28(1): 1 - 138. National Botanical Institute, Pretoria. [http://www.biodiversitylibrary.org/item/209568#page/1/mode/1up]. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Perennial herbs; stems prostrate, herbaceous, rooting at nodes, pilose with short trichomes to glabrate. Leaves broadly ovate to orbicular, 4-15 mm long, short-petiolate, rounded to emarginate apically, rounded to subcordate basally, glabrous or somewhat pubescent beneath. Flowers solitary or paired in leaf axils, pedicels 2-6 mm long; sepals elliptic-ovate to ovate-oblong, 2.5-4 mm long, pubescent, glabrescent, ciliate; corollas white, 5-7 mm broad; ovary glabrous. Fruits capsular, globose, 3-4 mm in diameter, reflexed; seeds brown to black, subglobose, slightly muricate.
