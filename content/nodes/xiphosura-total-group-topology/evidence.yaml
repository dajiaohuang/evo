  claims:
    - subjectId: event:xiphosura-total-group-topology
      claimKind: scientific
      claimType: topology
      statement: An expanded fossil-and-living morphology matrix resolves traditional synziphosurines across several euchelicerate stems rather than as one simple horseshoe-crab lineage; the result revises a classification hypothesis and does not demonstrate morphological stasis or a single habitat history.
      confidence: medium
      confidenceRationale: The character matrix is explicit and broad, but many fossils are incomplete and alternative coding can change short internal branches.
      referenceLinks:
        - referenceId: lamsdell-2020-xiphosura
          relation: supports
          pages: e10431
          figure: Figures 1–13; Supplemental matrices
          quoteLocator: Character matrix; Phylogenetic results; Revised systematics
  claim-rationales.zh:
    - 性状矩阵明确且范围广，但许多化石不完整，替代编码可改变短内部枝。
  claim-statements.zh:
    - 扩展的化石—现生形态矩阵将传统合甲鲎类分散恢复在多个真螯肢类干支，而非一条简单鲎类谱系；该结果修订分类假说，并不证明形态停滞或单一栖息地历史。
