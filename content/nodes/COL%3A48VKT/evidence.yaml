        claims:
          - text: Much-branched, cushion-forming shrub, up to 0.25 m tall. Leaves spreading, crowded in upper parts, spathulate-obovate, 4-5 mm long, gland-dotted and sticky, margin ± shortly pubescent, tip shortly mucronate. Flowerheads terminal, 1(2), radiate, yellow, ± 5 mm diam., receptacle paleate, florets glandular hairy around middle.
            sourceIds:
