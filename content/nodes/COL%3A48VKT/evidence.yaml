            locator: "SANBI/WFO archive Morphology row 34317; source 14808.0; publication: Manning, JC. 2013. Asteraceae: Oedera. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 306 - 307. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: This is a distinct species with cushion-like habit and small, slender capitula, solitary or paired in cymes. It is related to R. squarrosa, but is not likely to be confused with that species. It might be more difficult to distinguish R. conferta from small specimens of R. sedifolia, but a closer examination of the involucres will reveal obvious differences. Furthermore the leaves are different being ± flat and elliptic-obovate in the former species and somewhat semiterete and narrowly oblong in the latter.
