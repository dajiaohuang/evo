    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Slender, leafy, soft-wooded sub-shrub up to 1.2 m tall; stem and leaves minutely glandular-pubescent, aromatic. Leaves alternate, membranous, sessile or sometimes narrowed to a petiole-like base often with a pair of stipule-like basal auricles, up to 60 x 30 mm, oblanceolate or oblong in outline, coarsely toothed or more deeply cut halfway to midrib, lobes toothed, teeth subulate. Capitula radiate, pedunculate. Peduncles up to 15 mm long arranged in lax terminal corymbs. Involucre and upper part of peduncle loosely woolly at first, later glandular-hispid. Involucre campanulate. Involucral bracts in 3 rows, imbricate, ovate-linear, pungent, outer 2.5-3.0 x 1.5 mm, inner 8.5-9.0 x 1.1 mm Ray florets numerous, female, fertile, ±10 mm long, blue or white; corolla limb up to 6 mm long; corolla tube up to 4 mm long, glandular. Style up to 4 mm long, branched, linear, style branches 2 mm long, subacute. Ovary up to 1.8 mm long, glabrous, obovate in outline, angled. Disc florets functionally male, yellow; the corolla limb 3.03.5 mm long, glandular, 5-lobed; the lobes ovate 0.2 mm long; lower part of corolla 1 mm long. Anthers linear, minutely caudate, with an ovate apical appendage. Style up to 5 mm long, branched, linear, style branches 0.1 mm long with stigmatic papillae along margins. Ovary 2 mm long. Cypselae 4-5 mm long, glabrous, narrowly obovate, somewhat 3-angled, obscurely winged, strongly transversely wrinkled and warty, reddish-brown.
            sourceIds:
