        usage:
          title: Achimenes candida Lindl., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Herbs; stems slender, erect or ascending, 6-50 cm tall, 1-2 mm in diam., green or reddish, nearly glabrous. Leaves very unequal, the larger more than 4 times the size of the smaller, membranous, ovate to elliptic, often falcate, the larger 3.4-10.2 cm long, 0.9-3.7 cm wide, the smaller 0.5-4.8 cm long, 0.2-2.0 cm wide, the apex acuminate, the base oblique, acute to cuneate, the margin coarsely serrate, the upper surface light green, sparsely villous, the lower surface lighter green to whitish, villous especially on the veins; petioles 0.3-1.1 cm long, pilose on upper surface. Inflorescences cymose, few flowered; peduncles short or obsolete; bracts minute; pedicels ca. 1 cm long; floral tube 1-2 mm long, sparsely villous; calyx lobes spreading, linear lanceolate, 2-4 mm long; corolla 1.5-2.5 cm long, the tube erect in calyx, swollen at the base, not spurred, curved toward the mouth, flattened top and bottom, white outside with reddish spots, inside yellowish with red spots or purple veins, nearly glabrous, the limb ca. 12-18 mm wide, the lobes white, undulate, nearly entire; filaments glabrous; disc lobed; ovary apex pilose, the style white, nearly glabrous, the stigma stomatomorphic. Capsule narrowly obconic, ca. 5 mm long, the base surrounded by the floral tube, the apex conic and curved, surrounded by the persistent calyx lobes, sparsely villous, green to brown; seeds fusiform, striate, twisted, ca. 0.25 mm long, dark reddish brown. Chromosomes n = 11 (Lee & Grear, 1963).
          originalLanguage: en
