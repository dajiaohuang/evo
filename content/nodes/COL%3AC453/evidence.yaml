        claims:
          - text: "Succulent, bulbous perennial; acaulescent. Bulb mostly single, with loosely packed, membranous scales covering slightly fleshy leaf bases. Leaves semisucculent, grass-like, deciduous; blade flaccid to erect, slender, ± 2 mm wide, usually 2-5 twisted, light green to glaucous-green, white-spotted near base; margins with soft, white, decurved teeth. Flowers: Haworthia-like, zygomorphic, semi-erect, slightly subsecund; inflorescence a lax, unbranched raceme, appearing before leaves; perianth whitish to light greenish brown with greenish keels to segments; Aug.-Apr. Fruit an apically acuminate capsule."
