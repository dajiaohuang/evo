          publishedAt: undated
          originalSourceText: Trees 10-25 m. tall, buttresses absent or poorly developed; branchlets irreg- ularly angulate, inconspicuously canescent to glabrous; leaves long-petiolate, the blade ovate-oblong, apex acutely acuminate, base broadly rounded, 15-30 cm. long, 6-15 cm. broad, membranaceous, glabrous when mature, the petioles 5-8 cm. long, glabrous; inflorescences about half as long as the subtending leaves, bearing several reduced, shortly petiolate leaves above, the ultimate branches terminating in involucrate cymules bearing 2 staminate and 1 pistillate, sessile or subsessile flowers; staminate flowers about 1 cm. long, densely canescent, the elliptic-oblong perianth lobes about equalling the tube, stamens 3, each subtended by paired, sessile staminodia, 4 mm. long, the anthers about as long as the filaments; pistillate flowers about 1 cm. long, densely canescent, the elliptic-oblong perianth-lobes about equaling the tube, the cupule more than half as long as the perianth-tube, somewhat longer than broad, rather thin in texture, the orifice obscurely and un- equally 3-lobed, not involute. Mature fruit unknown.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 6422
          archiveSourceId: 252802B9-3DDD-4A79-9E1E-FF3D1193E188
