        status: partially-supported
        claims:
          - text: In a short 2012 post-release study at Mehao Wildlife Sanctuary, feeding observations of three Eastern Hoolock Gibbon family groups recorded fruits and flowers at the Sally Lake groups; the 20 Kilo group also had leaves and animal matter recorded. These observations describe only those groups during the preliminary survey and do not establish the species' usual or range-wide diet.
            sourceIds:
              - roy2015hoolock
            locator: Study groups and sites (PDF lines 47-65); diet observations (PDF lines 90-96); authors' limits (PDF lines 104-110).
            placeTimeScope: Mehao Wildlife Sanctuary, Arunachal Pradesh, India, February-May 2012; the claim covers two post-release family groups at Sally Lake and one at 20 Kilo, monitored for approximately two months per group.
            lifeStatus: Free-ranging post-release groups from rescued/translocated families; the paper does not establish diet for wild-born or captive populations.
            originalLanguage: en
        gaps:
          - The study was preliminary and short-term, with three post-release family groups at one sanctuary.
          - The authors note that detailed vegetation and phenology data were not collected; feeding observations do not establish habitat causes or usual species-wide diet.
          - Morphology, life history, other ecology, evolution, broader distribution, fossils, conservation, systematic search, remain unassessed.
