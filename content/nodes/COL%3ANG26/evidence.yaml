        claims:
          - text: Geophyte, up to 500 mm tall. Leaves and inflorescence developing at the same time. Pedicels 200-300 mm long. Perianth 45-55 mm long. Leaves spreading on ground, thick and tough. Flowers red or pink.
            textZh: Brunsvigia radulosa Herb. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_11118_0
            locator: "SANBI/WFO archive Morphology row 820; source identifier 11118.0; cited publication: Herman, PPJ; Retief, E. 1997. Plants of the northern provinces of South Africa: Keys and diagnostic characters. Strelitzia 6: 1 - 681. National Botanical Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: "These plants seem to hold together in a natural group, but at the same time show a fairly wide range in time of leaf production, in their surface and also in the size and shade of flower. Out of this assemblage one could quite conceivably have sorted out a number of specimens and given them specific rank, but this would not for long have successfully masked our ignorance. In the Orange Free State with low and late summer rainfall the leaves are absent at the time of flowering, whereas in Natal, with medium rainfall, they are produced with the inflorescence (the peduncle arising outside the new leaves). This difference in time of leaf production is probably due to habitat conditions. Some specimens have the leaves rough-granular on both surfaces, others are rough on the upper surface alone, but very rarely smooth on both surfaces. There are many other variations; for instance, concerning specimens from the neighbourhood of Fauresmith in the Orange Free State, a collector recorded: ' I am sending you today another Brunsvigia. The bracts are quite different from all I have seen up to now. In this plant they are red and fleshy, not pink or membranous. The colour of the perianth is more red than the previous specimens.' Several other similar examples of variation could be cited."
            textZh: SANBI 条目提供了 Brunsvigia radulosa Herb. 的鉴别特征。
            sourceIds:
              - sanbi_337_0
            locator: "SANBI/WFO archive Diagnostic row 58107; source identifier 337.0; cited publication: Dyer, RA. 1951. A review of the genus Brunsvigia Heist. Pl. Life 7(1): 45 - 64. [All rights reserved]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
