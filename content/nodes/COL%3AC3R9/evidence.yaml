        claims:
          - text: Succulent, perennial shrub to 1.5 m long, branched from base, rarely solitary, with persistent dried leaves. Leaves glossy, grass-green, both surfaces distinctly lineate, linear-lanceolate, 30-40 cm long; margin reddish brown, cartilaginous, with dark brown teeth. Racemes simple, lax, cylindric-acuminate, 80-100 cm, ascending. Flowers yellow, green-tipped in bud, 45 mm long; stamens and style slightly exserted.
