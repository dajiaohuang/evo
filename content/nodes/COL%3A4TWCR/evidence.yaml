    facets:
      morphology:
        status: partially-supported
        claims:
          - text: "In the study's stationary-phase batch-culture time-lapse assays, measured cell area shrank around the onset of PI-positive death in laboratory strains W303-1A and BY4741: mean reductions were 27.2% and 27.0%, respectively. With phloxine B staining, the corresponding mean reductions were 24.8% and 27.9%. W303-1A was grown for 2 days and BY4741 for 1 day to stationary phase; both were imaged hourly for 30 hours at about 24°C. These measurements describe two laboratory strains under the reported protocol, not cell volume, baseline morphology, or species-wide variation."
            originalLanguage: en
            sourceIds:
              - kato2021CellShrinkage
            locator: Results, PI-associated cell-area shrinkage values for W303 and BY4741; Phloxine B values; Materials and Methods, strain/culture and time-lapse imaging including the 30-hour hourly interval and cell-area measurement windows
            placeTimeScope: Kato et al. 2021 laboratory batch-culture study. W303-1A and BY4741 reached stationary phase after 2 and 1 days, respectively; the time-lapse imaging was hourly for 30 hours at about 24°C.
            lifeStatus: Two laboratory strains and their reported culture conditions only; no wild or domesticated population status is inferred.
        gaps:
          - The cited study does not provide a species-level morphological assessment.
          - The dynamic cell-area observation is limited to two laboratory strains and the study's batch-culture, staining, and imaging protocol; it does not characterize baseline morphology, cell volume, other strain backgrounds, or environmental variation.
      lifeHistory:
        status: not-assessed
        gaps:
          - The cited study does not directly assess reproductive or developmental life history for the full accepted species concept.
      ecology:
        status: partially-supported
        claims:
          - text: The study analyzed 103 S. cerevisiae strains whose recorded origins included clinics, Pennsylvania and North Carolina soils, North Carolina and Australian vineyards, fruits, a brewery, commercial S. boulardii preparations, and insect guts. These are the panel's source categories, not estimates of habitat frequency or a complete account of the species' ecology.
            originalLanguage: en
            sourceIds:
              - diezmann2009
            locator: Abstract; Table 1; Materials and Methods, Yeast strains, culturing and DNA extraction
            placeTimeScope: The strain collection included specified U.S. and Australian sites and source categories described in the 2009 paper; collection dates and global coverage are not established by this panel summary.
            lifeStatus: The panel mixes clinical, commercial, human-associated, and wild-environment isolates; no species-wide wild or domesticated status is inferred.
        gaps:
          - The paper uses a selected strain panel rather than a representative field survey; source-category counts do not establish habitat preference, prevalence, or global occurrence.
      evolution:
        status: partially-supported
        claims:
          - text: For the strains with complete sequence data at five nuclear loci, the authors report three population-genetic groups associated with differing ecological and geographic origins; soil isolates showed no detected recombination at those loci in this panel. This is study-specific population structure, not a species phylogeny or complete evolutionary history.
            originalLanguage: en
            sourceIds:
              - diezmann2009
            locator: Abstract, Methodology/Principal Findings; Results, Levels of recombination, genetic diversity and linkage; Figure 1; Table 2
            placeTimeScope: Five-locus analysis of the study's 2009 strain panel; only isolates with the reported sequence data are represented.
            lifeStatus: Evidence concerns stored isolates from the listed source categories and laboratory assays; it does not infer current wild-population dynamics.
        gaps:
          - The bounded five-locus panel does not establish species-wide population structure, a species tree, divergence times, or present-day population processes.
      distribution:
        status: not-assessed
        gaps:
          - The source is not a systematic or georeferenced range survey; the listed isolate origins do not establish global distribution or occupancy.
      fossil:
        status: not-assessed
        gaps:
          - No fossil or paleontological search was performed.
      conservation:
        status: not-assessed
        gaps:
          - No formal conservation assessment or population-trend review was performed.
