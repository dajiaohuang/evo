        claims:
          - text: Annual, loosely tufted, up to 0.8 m high. Leaf blades 30-90 mm long, 3-15 mm wide. Culms decumbent and rooting from lower nodes. Spikelets 1.5-2.0 mm long, 1 mm wide. Panicle 80-200 mm long, racemes arranged in 8-12 whorls on a central axis, each whorl consisting of 4-8 racemes, 20-50 mm long; spikelets solitary or in pairs, widely spaced on axis; upper glume as long as spikelet.
