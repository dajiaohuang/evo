    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Perennial herb, geophyte, 0.15-0.25 m high; corm conic, tunics woody. Leaves 3(4), linear, 2-3 mm wide, firm, erect, midribs and margins slightly raised; lower basal, the uppermost inserted at middle of stem, sheathing. Bracts 12-15 mm long, green, inner translucent with 2 green keels. Inflorescence a 2- or 3-flowered, lax spike; flowers bright mauve-pink, pale yellow in mouth of tube; perianth tube 6-9 mm long, cylindrical, expanded near mouth; tepals 10-15 x 3.5-5.0 mm, spreading, elliptic, acute. Stamens inserted just above mouth of tube; filaments erect, decurrent; anthers diverging, shortly tailed, yellow; pollen yellow. Ovary oblong; style branches reaching to anther apices, laxly spreading in an open flower. Flowering time Aug.-Oct.
            textZh: Hesperantha modesta Baker 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_18505_0
            locator: "SANBI/WFO archive Morphology row 91012; source identifier 18505.0; cited publication: Bredenkamp, CL; Magwaza, ZL. 2019. Iridaceae. In: CL Bredenkamp (ed.), A Flora of the Eastern Cape Province, Strelitzia 41(3): 1821 - 1882. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Sometimes confused with Hesperantha baurii, H. modesta is a late winter-spring-flowering species, usually with three leaves, the lower two basal and with well-developed linear blades of soft texture and the upper one (or two) cauline and largely sheathing (H. baurii usually has four, sometimes five leaves). The flowers are relatively large, in the middle of the range for H. baurii, but the available collections show it to be unusual in usually having only two to four flowers per spike. There is confusion about the type locality of H. modesta as the isotype at the KwaZulu-Natal Herbarium has the locality, Umlaas Location, whereas the sheet at K with the same number and date is purportedly from the Bevaan River, in the interior in the Vryheid District, which is evidently incorrect. Hesperantha subexserta, from Botha’s Hill and also based on a Medley Wood collection, flowering in October, has provisionally been treated as a synonym of H. modesta. The type plants have two basal leaves, and one or two cauline, sheathing leaves of the soft texture typical of H. modesta, but the spike of one of the plants of the type collection has up to eight flowers and a short lateral branch in contrast to the two or three, or at most four flowers per spike of specimens of H. modesta. A collection from Eshowe, Zululand (Lawn 1179), well to the north of other collections of H. modesta is provisionally included here. The poor condition and crowded mounting of the specimens makes them difficult to identify for certain but the flowering time, October, and marshy habitat, suggest this species.
            textZh: SANBI 条目提供了 Hesperantha modesta Baker 的鉴别特征。
