          originalSourceText: wide, glabrous to sparsely pubescent above, glabrous to densely softly pubescent beneath, membranaceous; petioles ca. 1-2 cm long, pubescent. Inflorescences racemose, irregular, axillary, the peduncles ca. 1-2 cm long. Flowers with the pedicels 2-4 mm long; bracts elongate-ovate or lanceolate, acuminate, pubescent on the margins and the inner surface, 1-3 cm long; calyx-lobes separate almost to the base, ? equal, deltoid, acuminate, ca. 1.5-2 mm long, each bearing 1 op- positely placed lacerate squamella; corolla salverform, weakly arcuate, yellow with a red or peach throat, the tube ca. 25-35 mm long, pubescent at the level of stamen attachment, the lobes~obliquely oblong, ca. 18-22 mm long and 8-11 mm wide, spreading; stamens ? included, borne near the orifice of the throat, the anthers ca. 2.5 mm long, the connective obtusely 2-lobed; nectaries ? con- crescent. Follicles somewhat moniliform, terete, sparsely pubescent, ca. 10-15 cm long; seeds awl-shaped, ca. 8 mm long.
