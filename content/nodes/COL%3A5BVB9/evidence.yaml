        claims:
          - text: Dwarf cormous geophyte, 30-40 cm. Leaves sword-shaped. Flowers pink to orange or white, sometimes with pink keels, stamens declinate.
            textZh: Watsonia laccata (Jacq.) Ker Gawl. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 7451; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: A relatively short species with funnel-shaped, white or pale pink to mauve or rarely orange flowers with declinate stamens and short, pale yellow (rarely purple) anthers 4-5 mm long. The broad-based bracts, pale and dry above with netted venation, and the fusiform capsules are also distinctive. The flowers are mostly pink to mauve (rarely orange near Heidelberg) and broadly funnel-shaped with the upper part of the perianth tube flared and 7-10 mm long but up to 15 mm long in some populations. Populations in the upper Breede River Valley between Montagu and Worcester represent a distinct variant with consistently bright orange, narrowly funnel-shaped flowers with the upper part of the perianth tube scarcely or only weakly flared and 15-25 mm long, thus ± 1.0-1.5 times as long as the tepals, and often purple anthers. Some of the longer-tubed forms may also indicate introgression with that species. Watsonia aletroides has ± tubular flowers with the tepals less than half as long as the upper part of the perianth tube. Both species have similar bracts and unusual, fusiform capsules.
            textZh: SANBI 条目提供了 Watsonia laccata (Jacq.) Ker Gawl. 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 94359; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
