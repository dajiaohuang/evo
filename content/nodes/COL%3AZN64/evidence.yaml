            locator: "SANBI/WFO archive Diagnostic row 58146; source identifier 2897.0; cited publication: Snijman, DA. 1983. A new species of Boophane Herbert (Amaryllidaceae) from the north western Cape. J. S. African Bot. 49(3): 243 - 249. [CC BY]"
