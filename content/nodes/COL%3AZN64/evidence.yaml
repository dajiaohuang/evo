        claims:
          - text: Like C. guttata but flowers pale yellow to maroon, ± zygomorphic with stamens declinate.
            textZh: Crossyne flava (W.F.Barker ex Snijman) D.Müll.-Doblies & U.Müll.-Doblies 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13845_0
            locator: "SANBI/WFO archive Morphology row 9261; source identifier 13845.0; cited publication: Snijman, DA. 2012. Amaryllidaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 53 - 62. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: The plant has small yellow flowers with declinate stamens and a bulb with a well-developed neck made up of frayed vertical segments with transversely thickened bands. Crossyne guttata, previously known as Boophone ciliaris (L.) Herbert from the south western Cape, is its closest ally. The latter also has prostrate ciliate leaves and small flowers but differs in that the flowers are actinomorphic and maroon-coloured. The flowers of C. flava are mostly without a scent but produce copious nectar. During the day ants, bees and butterflies were seen visiting the flowers of which the bees appeared to be the only effective pollinators. The pale yellowish-green colour of the inflorescences made them appear most conspicuous at dusk when the flowers may also be visited by moths.
            textZh: SANBI 条目提供了 Crossyne flava (W.F.Barker ex Snijman) D.Müll.-Doblies & U.Müll.-Doblies 的鉴别特征。
            sourceIds:
