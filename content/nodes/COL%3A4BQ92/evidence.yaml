    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Stem 500-700 mm tall, thin to stout, erect, simple, pubescent, hairs occasionally bifarious. Leaves ascending- spreading; petiole 3-8 mm long; blade 40-120 x 10-25 mm, linear or linear-lanceolate, rarely narrowly oblong, margins scabrous-pubescent, surfaces glabrous to pubescent and scabrous, usually more densely pubescent along the midrib. Inflorescence umbellate with paired flowers, sessile or subsessile and pedunculate, lateral at upper nodes and terminal; peduncles up to 45 mm long, pubescent. Bracts 10-15 mm long, linear, acuminate, glabrous above, pubescent below, deciduous. Pedicels 20-40 mm long, pubescent. Sepals 13-20 mm long, lanceolate or linear to narrowly ovate or broadly elliptic, acute to acuminate, glabrous above, pubescent below. Corolla 30-36 mm long, inflated globose, lobed almost to the base, whitish or yellowish-green covered with purple-brown splotches, glabrous above, glabrous to puberulous below; lobes 25-31 mm long, broadly elliptic to suborbicular, concave below, acute tips recurved, margins imbricate at the base. Corona lobes 14-18 mm long, spreading horizontally, lanceolate conduplicate and boat-shaped, somewhat subdeltoid viewed sideways, narrowly winged among the underside, this wing not extending to the apex of the lobe, the broad erect wing-like sides 7-10 mm high, rising to the level of the style apex at the broadly rounded base, connate and ± cucullate at the obtuse apex. Anther appendages 2.5-4.0 mm long, broadly ovate to sub-orbicular, acute to rounded apex inflexed over style apex; wings 3.5-5.0 mm long, vertical with straight outer surface.
            sourceIds:
