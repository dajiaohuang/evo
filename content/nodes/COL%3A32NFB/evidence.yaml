    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, 100-200 mm tall. Leaves linear. Flowers on suberect pedicels, pink to mauve, fragrant, tepals 10-18 mm; anthers yellow, 3 upper and 3 lower, upper median anther larger than upper laterals, filaments partially fused basally; style much longer than lower stamens. Capsule subglobose, 7-10 mm long.
            textZh: Cyanella ramosissima (Engl. & Krause) Engl. & K.Krause 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_14659_0
            locator: "SANBI/WFO archive Morphology row 33559; source identifier 14659.0; cited publication: Manning, JC. 2013. Tecophilaeaceae. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 161 - 162. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Readily recognized by the linear leaves, 2-8 mm wide, and dense raceme of large, pink to mauve flowers with 3 + 3 arrangement of stamens with plain yellow anthers, and a consistently long style, 10-15 mm long, thus almost twice as long as the lower stamens. Cyanella ramosissima may be confused with vegetatively similar C. marlothii, which has smaller flowers with the filaments of all six stamens connate for half or more of their length into a tube 1-2 mm long, bicoloured anthers, and a short style, ± 6 mm long.The distinctive combination of narrow leaves and a long style separates Cyanella ramosissima from the forms of C. orchidiformis with unpatterned tepals. The two species share smaller upper lateral anthers and otherwise resemble one another very closely although they are readily distinguished in fruit as C. ramosissima has much smaller, subglobose or ovoid capsule, 7-10 mm long versus the large, oblong or ellipsoidal capsules, 12-15 mm long of C. orchidiformislatter. Although C. orchidiformis mostly has the style shorter than the lower anthers, occasional collections (see below) have elongated styles like those of C. ramosissima. In the absence of fruits, such aberrant plants can be identified by their broader, soft-textured leaves and slightly larger anthers, tinged greyish distally. The two species are essentially allopatric, overlapping in their distribution only in the Richtersveld, where C. ramosissima is restricted to the mountainous central region whilst C. orchidiformis extends around the fringes.
            textZh: SANBI 条目提供了 Cyanella ramosissima (Engl. & Krause) Engl. & K.Krause 的鉴别特征。
            sourceIds:
              - sanbi_7651_0
            locator: "SANBI/WFO archive Diagnostic row 47561; source identifier 7651.0; cited publication: Goldblatt, P; Manning, JC. 2012. A revision of Tecophilaeaceae subfam. Tecophilaeoideae in Africa. Bothalia 42(1): 21 - 41. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
