          title: Cedrela tonduzii C.DC., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Tree to 40 m. (fide Little 6077); branchlets often thick, sometimes conspicu- ously lenticellate. Leaves with 5-7 pairs of leaflets 7.5-14 cm. long by 2.5-6.0 cm. wide, lanceolate to elliptical, the base acute to rounded, subequilateral, the apex acuminate obtuse to acute, rarely glabrate, the veins usually pubescent above, the lower surface densely puberulent to pilose. Inflorescences sometimes dense, usually shorter than the leaves, puberulent; bracts subpersistent, to 1.5 mm. long, puber- ulent. Flowers 5-7 mm. long; calyx shallowly to deeply 5-lobed, occasionally split to the base on one side, 1-1.5 mm. deep, generally puberulent; petals ellipti- cal, thickened at the center, puberulent to short pilose without, light at the base shading to rose at the apex along the margins; stamens with the filaments thick-fleshy where they are adnate to the gynophore, narrowing abruptly above, the connective wide, ending in a marked apiculum, the anthers 1-1.9 mm. long; ovary ovoid, glabrous; style usually 2-3 mm. long, glabrous; capitate stigma usually about 0.75 mm. thick. Fruit 6-10 cm. long, the valves heavy, usually at least 2 mm. thick, the outer surface lenticellate, smooth; central column with 5 wings extending to the apex over the broad end, the scars from seed attachment extending basally about 1/3 the length of the column.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 7903
