    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Branch nearly 1 ft. long; branchlets nearly filiform, quite glabrous, internodes 1-2 lin. long, leaf-scars tooth-like; leaves alternate, erect or slightly spreading, linear-lanceolate, acute, 4-6 lin. long, 0.5-1 lin. wide, flat or with recurved margins, ashy-green, glabrous, 1-nerved, upper leaves nearly verticillate; flowers surrounded at the base with white hairs; calyx 6-7 lin. long, glabrous; tube slender, almost filiform at the middle, narrowly funnel-shaped above; lobes ovate- or ovate-oblong, acuminate, 1.5 lin. long, sparingly hairy outside; petals 8, rather fleshy, oblong, obtuse, lin. long, inserted in pairs; anthers half as long as the petals, the upper exserted.
            sourceIds:
              - sanbi_18780_0
            locator: "SANBI/WFO archive Morphology row 104439; source 18780.0; publication: Wright, CH. 1925. Thymelaeaceae. In: WT Thiselton-Dyer (ed.), Fl. Cap. (Harvey) 5: 1 - 81. [https://www.biodiversitylibrary.org/item/15248#page/3/mode/1up]"
