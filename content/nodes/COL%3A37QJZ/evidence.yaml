        claims:
          - text: Bladder cells on stems apically rounded. Petals yellow, orange or red (rarely white); flowers often large; staminodes white or black when present. Staminodes lacking. Low shrublet to 15 cm, with slender, roughly scabrous stems. Leaves subterete to cylindrical, papillate, with magenta tips. Flowers solitary, few petals, yellow, without staminodes. Fruits 5-locular.
