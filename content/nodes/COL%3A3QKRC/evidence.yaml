    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Spreading, glandular-hairy and often glistening, dwarf shrublet to 50 cm. Leaves crowded, very small, mostly entire, narrow. Flowers axillary, tube inflated above, pink to blue, rarely white, with yellow throat.
            sourceIds:
              - sanbi_14433_0
            locator: "SANBI/WFO archive Morphology row 6020; source 14433.0; publication: Manning, JC; Goldblatt, P. 2012. Scrophulariaceae: Jamesbrittenia Kuntze. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 743 - 744. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: "The distinguishing features of the species are its small narrowly oblong to spathulate leaves (ratio of length to breadth 2.5-7:1), mostly entire, some of the primary leaves occasionally with a pair of small teeth near the apex (rarely a plant will produce an occasional leaf as much as 7 x 3 mm with two pairs of teeth), the normally very short indumentum on stems, leaves and pedicels (a mixture of glistening glands and minute gland-tipped hairs that often ooze and give these parts as well as the calyx a varnished look, the individual hairs then often invisible), often longish pedicels, the calyx clad predominantly in large glistening glands, and the corolla limb usually shades of pink, mauve or blue, possibly always yellow in the throat (collector's notes often meagre or wanting) and, once, a red spot was recorded at the base of each lobe; this is not visible in the dried specimen. Jamesbrittenia aspalathoides is often confused with a variety of other microphyllous species; Philcox (in Fl. Zam. 8(2): 3, 1990) went so far as to reduce it to synonymy under Sutera atropurpurea, but Jamesbrittenia atropurpurea is at once distinguished by its flowers: corolla tube c. 15-24 mm long, either glabrous or very minutely puberulous, limb shades of brown, the margins of the lobes revolute giving the lobes a peculiarly narrow appearance, the texture thick, venation invisible on the upper surface."
