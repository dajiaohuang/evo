            locator: Strelitzia 42; archive Morphology row 84359, source 18638.0
            placeTimeScope: Regional species account published 2020; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
          - text: Poorly known, Moraea unibracteata is one of the smallest members of subg. Grandiflorae. It can always be recognised by the stem bearing a single sheathing leaf, this inserted in the upper half of the stem and usually reaching or overlapping the rhipidial spathes. The pale yellow to almost white flowers are unremarkable in the subgenus, although relatively small, with outer tepals 30-45 mm long and anthers 7-9 mm long. The tepals are reported to have dark veins, especially evident when dry.
