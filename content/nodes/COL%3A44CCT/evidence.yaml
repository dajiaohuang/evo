    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants up to 350 mm high, solitary. Corm ± 10 mm diam.; tunics of fine, pale fibres. Stem sheathed below by brown cataphylls, unbranched, bearing a single, green sheathing leaf inserted in upper part of stem, often overlapping rhipidial spathes, lower part of stem exposed. Foliage leaf solitary, shortly exceeding stem, channelled, (2-)4-10 mm wide. Rhipidial spathes green, apices dry and brown, inner spathe 60-80 mm long, outer ± 3/4 as long. Flowers ?long-lived, pale yellow to nearly white (sometimes drying pale blue), when dry veined with purple, outer tepal limbs with darker yellow nectar guides at bases, spreading to half reflexed; outer tepals lanceolate, 30-45 mm long, claws suberect, ± 2/3 as long as limbs; inner tepals 30-40 mm long, narrowly lanceolate, ± erect. Filaments ± 8 mm long, united in lower half; anthers 7-9 mm long, yellow. Ovary 15-18 mm long; style branches ± 10 mm long, crests 10-13 mm long. Capsules and seeds unknown.
            textZh: Moraea unibracteata Goldblatt 的 SANBI 物种条目记载了植株、叶片和花部形态。
            sourceIds:
