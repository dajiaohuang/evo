          - text: Rubus longepedicellatus is easily separated from R. rigidus Sm. by its well-developed, much ramified bracteose thyrse, the consistently 3-foliolate floricanes and the 7-foliolate primocanes. The petals in this species exceed the sepals, whereas in R. rigidus the petals are equal to or shorter than the sepals.
