        claims:
          - text: Scandent shrub. Inflorescence a well-developed, much ramified bracteose thyrse. Floricanes 3-foliolate, pri-mocanes 7-foliolate. Corolla longer than calyx. Flowers mauve and pink to white.
            sourceIds:
