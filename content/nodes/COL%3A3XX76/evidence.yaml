        claims:
          - text: Slender, hairy shrublet to 75 cm. Leaves toothed. Flowers in laxly arranged cymules, tube inflated above, yellowish brown.
            sourceIds:
              - sanbi_14436_0
            locator: "SANBI/WFO archive Morphology row 6053; source 14436.0; publication: Manning, JC; Goldblatt, P. 2012. Scrophulariaceae: Manulea L. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 745 - 747. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: "It is closely allied to M. turritis, but may be distinguished by its differently shaped leaves (usually ovate or occasionally oblong, not elliptic), this reflected in the ratio of leaf length to breadth: blade c. 12-23 x 7-20 mm in M. ovatifolia, c. 18-60 x 7-20 mm in M. turritis. The flowers of M. ovatifolia are somewhat larger than those of M. turritis: calyx lobes c. 2.5-3 mm long (versus 1.5-2.3 mm), corolla limb c. 7-9.5 mm across the lateral lobes (versus 6-7 mm), posticous lobes c. 3.5-4.8 x 1.5 mm (versus 2.25-3.5 x 0.75-1.5 mm). Manulea ovatifolia is also usually hairier on the inflorescence axes and calyx than M. turritis, and it is possibly shrubbier in habit."
