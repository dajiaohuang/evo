  claims:
    - subjectId: event:neopterygian-caudal-fin-mosaic
      claimKind: scientific
      claimType: morphology
      statement: Comparative anatomy and development show a hypural-diastema complex in gars and teleosts and an early role for caudal fin rays in external symmetry, so the complete complex cannot be treated as an unconditional teleost synapomorphy; descent, loss and latent parallelism remain competing histories.
      confidence: medium
      confidenceRationale: Adult specimens and developmental series span major sampled actinopterygian lineages and directly document skeletal and soft-tissue components. Medium confidence preserves incomplete species sampling, the paper's hypothesis-level preference for latent homology, and the poor fossil visibility of connective tissue and vasculature.
      referenceLinks:
        - relation: supports
          referenceId: desvignes-2018-neopterygian-caudal-fin
          pages: 832–853
          figure: Figures 1–3 and 5
          quoteLocator: Results; Discussion of homology by descent and latent homology
  claim-rationales.zh:
    - 成年标本和发育序列覆盖了多个主要辐鳍鱼样本谱系，并直接记录骨骼与软组织组分。中等置信度保留不完整的物种取样、论文对潜在同源性的假说级偏好，以及结缔组织和血管在化石中的低可见性。
  claim-statements.zh:
    - 比较解剖与发育资料显示雀鳝类和真骨鱼类都具有尾下骨间隙复合体，尾鳍鳍条还早期参与外部对称性的建立；因此完整复合体不能被无条件视为真骨鱼共有衍征，继承、丢失与潜在平行演化仍是相互竞争的历史解释。
