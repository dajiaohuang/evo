          originalSourceText: rather abruptly narrowed to a slender acumination (to 1 cm. long), acute to cuneate at base with the broader half produced 1 mm. beyond the narrower, re- motely denticulate, glabrous, foveolate, 5-6.5 (-9.5) cm. long, 1.7-2.3 (-3.3) cm. wide, petioles to 12 mm. long, glabrous, stipules early deciduous, only scars seen. Inflorescences pedunculate and cymose, terminal and axillary. Staminate pedicels to 18 mm. long. Tepals regularly 4, the outer ovate, obtuse, to 6 mm. long and 5.5 mm. broad, the inner elliptic, to 5 mm. long and 2 mm. wide. Stamens numer- ous, free, the connective produced. Pistillate pedicels slender, glabrous, to 20 mm. long. Tepals 2, ovate, broadly acute, to 10 (-16) mm. long and 8 mm. wide. Ovary glabrous, puncticulate. Styles 3, bifid, broadly expanded above the base. Capsule unequally tri-alate, the largest wing to 10 mm. wide, ascending, acute.
