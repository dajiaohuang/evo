    facets:
      morphology:
        status: partially-supported
        claims:
          - text: A small shrub about 0.35 m. high. Branches glabrous, rarely minutely whitish pubescent, at length becoming glabrous; bark rough and splitting. Leaves opposite, ericoid, linear or lanceolate-linear, obtuse, subconnate at the base, 2-6 mm long, flat above, rounded beneath, glabrous or very minutely puberulous when young. Heads about 8-flowered 1.2-1.4 cm long, obconic. Involucral bracts 7-seriate, closely imbricate, oblong-linear, obtuse, narrowed at the base, glabrous, with membranous margins. Receptacle small, fimbriate. Corolla 1.1 cm long; lobes 2 mm long, lanceolate, subacute. Stamens inserted about 2/3 down the tube; filaments 4-5 mm long, filiform; anthers, 3.5 mm long, linear, with a lanceolate acute apical appendage. Achenes 3-5 mm long, oblong, densely villous. Pappus 8-9 mm long, as long as the corolla, light straw-coloured.
            sourceIds:
              - sanbi_9858_0
            locator: "SANBI/WFO archive Morphology row 45379; source 9858.0; publication: Hutchinson, J; Phillips, EP. 1917. A revision of the genus Pteronia (Compositae). Ann. S. African Mus. 9(1): 277 - 329. [All rights reserved]"
