    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants solitary, acaulescent. Tuber oblong to oblong-globose, tapering and rounded at the top, up to 25 mm long and 18 mm in diameter, covered by a dark brown tunic, overtopped by a ring of bristles. Roots spreading, as single units, in addition 2-5 arranged in adpressed bundles surrounded by dark brown corky sheath; single roots 5-8 mm wide, bundles 10-20 mm wide. Leaves rosulate, erectly spreading becoming patent, ovate-lanceolate, 4-6, 50-150(-240) mm long and 25-40 mm wide, softly succulent, amplexicaul, membranous at the base, pale green; adaxial surface distinctly striated, translucent; abaxial surface obscurely striated, not translucent; margin entire; apex acuminate. Raceme erect, usually solitary, 450-570 mm tall with 30-40 flowers. Peduncle 3.5 mm in diameter, terete. Bracts membranous, deltoid-acuminate, 2 mm long, 1 mm wide at the base. Pedicels 10-20 mm long, erectly spreading. Tepals pale yellow, reflexed when fully open; outer segments ovate-elliptic, 8 mm long, 1.5 mm broad; inner segments 8 mm long, 2.5 mm broad. Stamens 4-5 mm long. Filaments bearded with yellow hairs. Anthers yellow, oblong, dorsifixed. Ovary globose, green, grooved. Style 5 mm long; stigma minute. Capsule globose-ovoid, 6 mm long, 5 mm wide. Seeds black, angular, with rough surface, 3 mm long and 1 mm wide.
