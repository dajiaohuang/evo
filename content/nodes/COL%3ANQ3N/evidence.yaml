          - text: B. striata is clearly separated from other members of the genus by the presence of distinctly striate leaves which are translucent on the adaxial surface. The only other species with some similarity in leaf patterning is B. haworthioides B. Nord., in which reticulate markings occur. However, the leaves of the latter are much smaller and tend not to exceed 2.5 cm in length. Superficially, the leaves of B. striata resemble those of the evergreen species, B. latifolia (L.f.) Roem. & Schult., which is common in the eastern Cape. A further distinguishing character of B. striata is the aggregation of 2-5 roots into bundles which are ensheathed by a corky layer.
