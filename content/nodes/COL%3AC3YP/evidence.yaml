    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants stemless, 150-250 mm tall excluding inflorescence, usually solitary. Leaves 16-30, 140-200 x 40-80 mm, biconvex to slightly channelled, both surfaces with few to many white spots, usually irregular, sometimes in transverse bands, denser on upper surface. Inflorescence with 2-5 ultimate branches, ±600 mm tall; racemes dense, capitate; bracts deltoid-cirrhous, 15-30 x 3-5 mm, ±7-nerved. Flowers greenish white becoming tinged with pink, 13-17 mm long; segments free for almost half their length; pedicels 12-30 mm long, erect. Anthers not or hardly exserted. Ovary 4.0-10.0 x 2.0-2.5 mm, green; style not or hardly exserted. Fruit 14-18 x 10-12 mm, grey. Seeds ±4.0 x 2.5 x 1.0 mm, hardly winged, brown.
            textZh: Aloe prinslooi I.Verd. & D.S.Hardy 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_5961_0
            locator: "SANBI/WFO archive Morphology row 49085; source identifier 5961.0; cited publication: Glen, HF; Hardy, DS. 2000. Aloe. In: G Germishuizen & E du Plessis (eds), Aloaceae (first part), Fl. S. Africa 5(1,1): 1 - 167. National Botanical Institute, Pretoria. [http://www.biodiversitylibrary.org/item/209564#page/3/mode/1up]. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: The very dense, almost spherical racemes of small, whitish flowers distinguish this species from all others in this section. Sterile specimens are easily confused with A. maculata, and there seems to be no vegetative character that distinguishes unambiguously between these two species.
            textZh: SANBI 条目提供了 Aloe prinslooi I.Verd. & D.S.Hardy 的鉴别特征。
            sourceIds:
              - sanbi_5961_0
            locator: "SANBI/WFO archive Diagnostic row 51317; source identifier 5961.0; cited publication: Glen, HF; Hardy, DS. 2000. Aloe. In: G Germishuizen & E du Plessis (eds), Aloaceae (first part), Fl. S. Africa 5(1,1): 1 - 167. National Botanical Institute, Pretoria. [http://www.biodiversitylibrary.org/item/209564#page/3/mode/1up]. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Regarded as a link between the Graminialoe and plants belonging to the Saponariae, for at first glance the flowers appear to be like those of A. albida (Stapf) Reynolds. They are, however, not stipitate and are nearest in shape to the flowers of A. grandidentata Salm Dyck, having hardly any constriction above the ovary. Flower colouration is usually off white or pale pink but two yellow forms have been observed at one locality.
