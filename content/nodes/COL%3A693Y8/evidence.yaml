        usage:
          title: Bunchosia lanieri S.Watson, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrub or small tree to 4 m tall. Leaves opposite, moderately thin, elliptic to ovate-elliptic or oblong-elliptic, apiculate or short-acuminate at the apex, obtuse to rounded at the base, 9.5-24.0 cm long, 3.6-11.0 cm wide, sparsely appressed- pubescent on the upper surface, densely mostly appressed-pubescent below, some of the trichomes weakly stalked and the arms at least weakly patulous; primary lateral veins 6-9 on each side, the secondary veins inconspicuous; pet- ioles 7-10 mm long, appressed-pubescent; stipules paired, thick, narrowly tri- angular, 4-5 mm long, appressed-pubescent. Pseudoracemes axillary, with up to 50 flowers, 4.5-19.5 cm long; bracts narrowly triangular, folded along the midrib, 3.5-5.0 mm long, densely villous outside, often with a buttonlike gland on 1 side at the base, especially near the base of inflorescence, glabrous inside; bracteoles much like bracts but smaller, the lowermost with a conspicuous gland at the base; rachis more or less villous, somewhat flattened toward the apex. Flowers ca. 16 mm in diam., yellow; sepal glands 8, ca. 2.5-3.0 mm long; sepals ovate-triangular, obtuse to narrowly rounded at the apex, sericeous outside, glabrous within; petals yellow, 7-8 mm long, clawed, glabrous, the limb rounded, the margin weakly erose, the interior petal smaller, the margin more entire but glandular; stamens somewhat unequal, exserted ca. 3 mm above the sepals, the filaments glabrous, flattened, united in the lower ?3; ovary sericeous, the style held just above the cluster of stamens, truncate and 3-sided at the apex. Fruits 3-locular, depressed- globular and 3-lobed, orange-red, ca. 1.0 cm long and 1.5 cm wide.
          originalLanguage: en
          sourceField: general
