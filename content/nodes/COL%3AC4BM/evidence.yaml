    facets:
      morphology:
        status: partially-supported
        claims:
          - text: "Dichotomously branched succulent trees with a rounded crown, 4-8 m high and of about the same width. Main trunk stout and firm, 0.6-0.8 m in diameter at base; leaf-bearing branches about 30 mm in diameter. Bark grey. Roots fleshy, about 33 mm in diameter in mature plants, dark brown to grey. Leaves about 20 in apical rosettes, firm, leathery, ensiform, 40-59 x 4.5 cm (when pressed flat), dull green; upper surface canaliculate, lower surface convex; margin dentate, teeth 2 mm long 5-10 mm apart; apex acute, mucronate; older leaves becoming deciduous from base. Inflorescence erect, candelabriform, 35 cm tall, bearing up to 6 racemes; peduncle 100 mm long, 19 mm in diameter, biconvex and slightly flattened at base, terete upwards; scape 100-120 x 9 mm; raceme capitate, 4-6 cm long, up to 50-60-flowered, buds laxly arranged, yellow; floral bracts scarious, deltoid, acuminate, 12-14 x 3-4 mm; pedicles 10-14 x 2 mm, yellow. Perianth cylindric, curved, pendent when mature, 47-50 mm long, 8-9 mm in diameter, yellowish orange, base slightly swollen; outer segments fused in lower 30 mm (free for 10 mm), apices subacute; inner segments free to base, linear-oblanceo late, canaliculate, obtuse to subacute, yellow with a brownish median stripe. Stamens yellowish, about 50 mm long, light yellow, becoming exposed for 3-5 mm when mature; anthers yellow, 3 mm long. Ovary greenish yellow, ovoid, 7 x 4 mm, grooved; style 35-45 mm long, yellow, exposed for up to 7 mm when mature. Capsule and seed not seen. Flowering time: mainly April-May."
            textZh: Aloidendron tongaense (van Jaarsv.) Klopper & Gideon F.Sm. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13229_0
            locator: "SANBI/WFO archive Morphology row 79392; source identifier 13229.0; cited publication: Van Jaarsveld, EJ. 2010. Aloe tongaensis, a new species from Tongaland, KwaZulu-Natal (South Africa), and a new sectional arrangement of the tree aloes. Aloe 47(3): 64 - 71. [All rights reserved]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: It differs from A. eminens in its smaller inflorescence (up to 6-branched, 35 cm high), its short (4-6 cm long), capitate, subdensely flowered racemes and in its yellowish orange, curved perianth which is 47-50 mm long. It is further separated by the outer perianth segments that are fused for more than half their length and by the shortly exposed stamens (for 3-5 mm). In A. eminens, the inflorescence is 50-60 cm high, long, with the outer segments fused in the lower third. The flowers in both species become pendent when open. Aloe barberae is the tallest of the African aloes, growing up to 18 m, and is similar to the new species in vegetative features but here the resemblance ends. Aloe barberae is confined to forested kloofs and river valleys in the southeastern and eastern parts of southern Africa. It has densely flowered racemes and the short, cylindric-trigonous perianth is 33-37 mm long and horizontally presented when open. The outer perianth segments are free to almost the base. In all other members of section Dracoaloe the perianth segments are fused at least in the lower third.
