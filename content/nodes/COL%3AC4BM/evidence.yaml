        claims:
          - text: At Kosi Bay it grows in Northern Coastal Forest. It grows under warm, humid, subtropical conditions at an altitude of 5-30 m. Plants occur scattered in sandy soil. Rainfall is high, 1250-1500 mm per annum, and is experienced mainly in summer.
