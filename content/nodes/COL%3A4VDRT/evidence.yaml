          title: Schlegelia fuscata A.H.Gentry, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: the branches simple-pubescent, each pedicel pair and each flower subtended by a pair of acute bracts with ciliate tips, the rachis 1.2-5 cm long, pedicels 4-8 mm long. Flowers with the calyx cupular, widest at the middle, with 4-5 round-tipped lobes, 6-7 mm long and 1-6 mm wide, glistening white with a slight pink tint when fresh, black when dry, inconspicuously lepidote, simple- pubescent at the tips; corolla greenish-white on the tube outside, the lobes pink, paler at the tips and deeper at the base shading into the purplish-pink of the throat, tubular with reflexed lobes, 1.0-1.1 cm long and 4 mm wide at the mouth, the tube 7 mm long, the lobes 3-4 mm long, the posterior pair sometimes partially fused, glabrous outside, the lobes glandular-lepidote to glandular-puberulent inside, the tube glabrous inside except for long simple multicellular glandular trichomes at the level of stamen insertion; stamens didynamous, the anther thecae not divergent, 1.5-2 mm long, the filaments all ca. 0.8 cm long but the posterior pair bent more sharply holding the posterior anthers lower in the throat, the staminode 3 mm long, inserted 4-5 mm from the base of the tube; pistil 5 mm long, the ovary spherical, 2-2.5 mm long and 2.5-3.0 mm wide, glabrous, the ovules 8-9-seriate on a single central placenta in each locule; disc absent. Fruit a spherical fleshy berry to 1.2 cm in diameter, pale purple when fresh, the calyx persistent and covering the lower half to third of the fruit, glabrous but large-papillate; seeds angular, papillate-surfaced, 2-3 mm, long, less than 1 mm wide.
          originalLanguage: en
          sourceField: general
