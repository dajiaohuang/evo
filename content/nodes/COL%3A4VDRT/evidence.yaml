          title: Schlegelia fuscata A.H.Gentry, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Vine ("epiphyte," Tyson et al. 3195) to at least 2 cm in diameter, the bark dark, indistinctly ridged; stem without phloem arms in cross section; branchlets terete,. scattered lepidote, without interpetiolar ridges or glandular fields. Leaves opposite, simple, elliptic, apically rounded, basally truncate to wide-cuneate, 7.6-12.6 cm long and 4.2-9.5 cm wide, extremely coriaceous, secondary veins 4-5 on a side, the main veins impressed above, raised beneath, lepidote above and beneath, otherwise glabrous, the lepidote trichomes glandular and con- gested at the base of blade beneath, this glandular area usually black from infection by a member of the Melanconiales (fungus), when fresh glossy green above and dull pale green beneath, drying brown above and beneath, the petiole 1.3-2.5 cm long. Inflorescence a 5-12-flowered axillary raceme or a subpanicle with the basal pedicels of the raceme forked and bearing 2 flowiers,
