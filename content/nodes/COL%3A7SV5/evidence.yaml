        metadataVariant: 0
        usage:
          title: Catalogue of Life COL26.8 — Tarsius Storr, 1780
          url: https://www.checklistbank.org/dataset/316115/taxon/7SV5
          scope:
            en: Pinned COL26.8 accepted name, authorship, rank and parent classification; not biological evidence.
            zh: 固定 COL26.8 中的接受名、作者、等级与分类父链；不提供生物学证据。
      - id: merker2005
        referenceId: ref-2680a2ec-74e9-8e7e-a50a-4d12ffab8e84
        fields:
          - id
          - title
          - url
          - scope
        metadataVariant: 0
        usage:
          scope:
            en: Four study plots across a human land-use gradient; the study captured 71 tarsiers and radio-tracked 30. Reported habitat, density, range-size and nightly-travel patterns are confined to those plots and the paper-era name T. dianae.
            zh: 支持四个不同人类土地利用样区的比较；研究捕获 71 只并对 30 只进行无线电追踪。栖地、密度、活动范围和夜间移动结果仅限这些样区，原文使用当时的名称 T. dianae。
      - id: merker2009
        referenceId: ref-9861a7c9-3f68-87cc-aa23-f710ef26b1e2
        fields:
          - id
          - title
          - url
          - scope
        metadataVariant: 0
        usage:
          scope:
            en: Supports the authors’ use of T. dentatus for the central-Sulawesi lineage often called T. dianae and the 2001–2006 transect study of 144 tarsiers between Kamarora and Peana; it is not a range-wide population survey.
            zh: 支持作者将常称为 T. dianae 的中苏拉威西谱系归入 T. dentatus，并记载 2001—2006 年 Kamarora 至 Peana 样线上的 144 只样本；这不是全分布区调查。
      - id: merker2006
        referenceId: ref-b12c7a37-1b2a-85af-ab28-1f6865e44bdf
        fields:
          - id
          - title
          - url
          - scope
        metadataVariant: 0
        usage:
          scope:
            en: Supports the 2001 Gimpu specimen series, comparisons of pelage, anatomy and proportions, duet-song description, and local records near Gimpu, Lempelero, Tomua and Marena. The authors’ proposed outer limits were explicitly tentative.
            zh: 支持 2001 年 Gimpu 标本系列、毛色与解剖和比例比较、二重唱描述，以及 Gimpu、Lempelero、Tomua、Marena 附近的局地记录；作者提出的外围界限明确仍待确认。
      - id: grow2010
        referenceId: ref-3d35dfe0-c5db-8afc-aaa9-95bb0a5080d5
        fields:
          - id
          - title
          - url
          - scope
        metadataVariant: 0
        usage:
          scope:
            en: A two-month exploratory study in August–September 2008 at Mt. Rore Katimbu in Lore Lindu National Park located one group of at least four; three adults were captured. Grouping, body-proportion and behavior findings are preliminary and based on very small samples.
            zh: 支持 2008 年 8—9 月在 Lore Lindu 国家公园 Rore Katimbu 山开展的两个月探索性研究：找到至少四只组成的一群，捕获三只成体。群体结构、身体比例和行为结论均为小样本初步发现。
      - id: shekelle2017-spectrumgurskyae
        referenceId: ref-e347eb58-9ead-839e-a43b-fc2e5598663e
        fields:
          - id
          - title
          - url
          - scope
        metadataVariant: 0
        usage:
          scope:
            en: Supports the naming of the Manado form as T. spectrumgurskyae, with duet-call and specimen provenance central to identification; the type locality is Manado. The paper places this taxonomic treatment in a northern-Sulawesi biogeographic argument, not a new population census.
            zh: 支持将 Manado 形态群命名为 T. spectrumgurskyae；辨识以二重唱和标本来源为重要依据，模式产地为 Manado。论文将该分类处理置于苏拉威西北部生物地理讨论中，并非新的种群普查。
      - id: clink2020
        referenceId: ref-c47e763d-dde5-8a89-a2c6-fe9b11e1bd97
        fields:
          - id
          - title
          - url
          - scope
        metadataVariant: 0
        usage:
          scope:
            en: Acoustic recordings from Tangkoko National Park in July–August 2018; female duet phrases were assigned to individuals at 80% accuracy and male phrases at 64% using the paper’s classifier. These are results for sampled recordings, not a species-wide communication rate.
            zh: 支持 2018 年 7—8 月 Tangkoko 国家公园的声学记录；论文分类器将雌性二重唱片段判给正确个体的准确率为 80%，雄性为 64%。这些是所采录音的结果，不代表全种交流率。
      - id: shekelle2017-supriatnai
        referenceId: ref-e347eb58-9ead-839e-a43b-fc2e5598663e
        fields:
          - id
          - title
          - url
          - scope
        metadataVariant: 0
        usage:
          scope:
            en: Supports the description of the Gorontalo form as T. supriatnai, the Bumbulan type locality, and the diagnostic use of duet-call form and provenance in the authors’ northern-Sulawesi classification.
            zh: 支持将 Gorontalo 形态群描述为 T. supriatnai、Bumbulan 模式产地，以及作者在苏拉威西北部分类中使用二重唱形式和来源地进行辨识。
      - id: zakaria2022
        referenceId: ref-b45c54b5-70ec-824a-a6c4-2ef5f63cb38e
        fields:
          - id
          - title
          - url
          - scope
        metadataVariant: 0
        usage:
          scope:
            en: Local nest-tree observations compared agricultural areas and secondary forest in Popayato-Paguat, Gorontalo. The paper reports different commonly used nest-tree plants by habitat and 42.9% continued use among nest trees surveyed for site fidelity; these results do not establish species-wide preferences.
            zh: 支持 Gorontalo 的 Popayato-Paguat 农业地与次生林巢树观察比较。论文报告不同生境中常见巢树植物不同，并记录后续忠实度调查仍使用 42.9% 的既有巢树；这些结果不构成全种偏好。
      - id: shekelle2008
        referenceId: ref-4be95191-9021-8642-a807-17c415d52a8b
        fields:
          - id
          - title
          - url
          - scope
        metadataVariant: 0
        usage:
          scope:
            en: Supports the Siau type locality and diagnosis based on tail tuft, pelage, skull and vocalizations. The paper reports no genetic data for the newly named species and describes only one holotype plus one earlier museum skull.
            zh: 支持 Siau 模式产地及以尾簇、毛色、头骨和鸣声为依据的诊断。论文没有提供该新描述物种的遗传数据，仅涉及一件正模和一件较早的馆藏头骨。
      - id: merker2010
        referenceId: ref-aee31f62-9c77-843c-a88d-7431fabd4b09
        fields:
          - id
          - title
          - url
          - scope
        metadataVariant: 0
        usage:
          scope:
            en: Supports the species diagnosis from genetic markers, pelage, tail tuft and duet calls, and the authors’ mapped northern and southern populations. Their southern population was confirmed only at the type locality; northern boundaries and the gap around Palu are study-era survey limits.
            zh: 支持以遗传标记、毛色、尾簇和二重唱为依据的物种诊断，以及作者标绘的南北两个种群。论文仅在模式产地确认南方种群；北界及 Palu 周围的间隔均受当时调查所限。
      - id: shekelle2019
        referenceId: ref-8469ebff-ab63-81eb-ac50-d6bd411ecde1
        fields:
          - id
          - title
          - url
          - scope
        metadataVariant: 0
        usage:
          scope:
            en: Supports the holotype from Desa Benteng on Togean, the authors’ 12S mtDNA phylogeny and diagnosis, and their proposed Togean distribution except Una Una. The paper states that only the type specimen was available; mapped distribution is not a uniform island-by-island census.
            zh: 支持 Togean Desa Benteng 的正模、作者的 12S 线粒体 DNA 系统树和诊断，以及其提出的除 Una Una 外的 Togean 分布。论文说明当时仅有正模标本；分布图并非逐岛统一普查。
      - id: syahrullah2023
        referenceId: ref-b2e9ba8d-c7f2-873d-a58f-24df657ea7bf
        fields:
          - id
          - title
          - url
          - scope
        metadataVariant: 0
        usage:
          scope:
            en: Supports a dated survey of Peleng, Banggai, Labobo and Bangkurung; the density estimate and non-detections are bounded by that survey.
            zh: 支持对 Peleng、Banggai、Labobo 和 Bangkurung 的有日期调查；密度估值和未检出均受该次调查边界限制。
      - id: shekelle2013
        referenceId: ref-2f25587a-0943-87e2-a589-ff7a4e65fe61
        fields:
          - id
          - title
          - url
          - scope
        metadataVariant: 0
        usage:
          scope:
            en: Supports short, non-random Sangihe observations in 1995–1997; not a population estimate.
            zh: 支持 1995—1997 年 Sangihe 的短期非随机观察；不提供种群估值。
      - id: shekelle2009
        referenceId: ref-f5eee74b-cc93-86a7-ae7b-6b7c20ccb7fa
        fields:
          - id
          - title
          - url
          - scope
        metadataVariant: 0
        usage:
          scope:
            en: Supports GIS habitat scenarios for Sangihe tarsiers; potential population values are modeled with densities from related species.
            zh: 支持 Sangihe 眼镜猴的 GIS 栖地情景分析；潜在种群数以近缘种密度建模。
      - id: andriyani2021
        referenceId: ref-61038314-41d9-8719-a8e1-26f2ec41c5b8
        fields:
          - id
          - title
          - url
          - scope
        metadataVariant: 0
        usage:
          scope:
            en: Supports nest-site observations at two South Sulawesi locations from October 2020–January 2021; not a range-wide account.
            zh: 支持 2020 年 10 月至 2021 年 1 月在苏拉威西南部两处地点的巢址观察；不是全分布区综述。
      - id: groves2010
        referenceId: ref-cd8804f6-ebfd-8aaa-ae54-220c4bb09d58
        fields:
          - id
          - title
          - url
          - scope
        metadataVariant: 0
        usage:
          scope:
            en: Supports the taxonomic restriction of T. tarsier to Selayar Island; it does not attribute pooled historical ecological observations to this species.
            zh: 支持将 T. tarsier 限于 Selayar 岛的分类处理；不把历史合并生态观察归属于该种。
      - id: wirdateti2008
        referenceId: ref-74d46d4b-ff7e-892e-a996-dace7ac35e32
        fields:
          - id
          - title
          - url
          - scope
        metadataVariant: 0
        usage:
          scope:
            en: The paper pools Selayar and mainland Patunuang observations under a broad historical name; it does not provide site-specific evidence for the currently Selayar-restricted taxon.
            zh: 论文以历史广义名称合并 Selayar 与大陆 Patunuang 观察；没有提供目前限于 Selayar 的分类单元之地点专属证据。
