    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants single- to several-stemmed. Leaves grasslike, fibrous, ascending, 600-750 x 2-3 mm,, keeled; margin and keel smooth. Scape subequal to or shorter than leaves, 550-650 mm tall. Raceme long-ovoid to subcylindrical, tapering to apex, dense, 50-100 x 25-35 mm; buds ascending; flowers spreading to pendulous, ± concolorous, yellow-orange to coral-scarlet, becoming dark purple on withering. Bracts ovate-lanceolate to lanceolate, long acuminate, 4-6 mm long; margin entire. Pedicels 1 mm long, elongating up to 2 mm in fruit. Perianth subcylindrical, 13-16 mm long; lobes ovate, 2.5 mm long, distinctly spreading. Stamens remaining in basal half of perianth tube at and after anthesis. Style 1.5-2.5 mm long at anthesis. Fruit subglobose, 5-6 mm long.
