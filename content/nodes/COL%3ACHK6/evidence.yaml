    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Bulbous geophyte, up to 0.8 m tall. Bulb half exposed. Leaves many, absent at flowering time, spreading in a basal rosette, broadly tongue-shaped, covered with short hairs, occasionally hairy only when young, midrib prominent, margins often undulate. Flowers large, trumpet-shaped, uniformly pink, fragrant. Apr., after good autumn showers.
            textZh: Amaryllis paradisicola Snijman 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_14528_0
            locator: "SANBI/WFO archive Morphology row 32801; source identifier 14528.0; cited publication: Snijman, DA. 2013. Amaryllidaceae. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 33 - 42. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Amaryllis paradisicola differs from A. belladonna in having broad, tongue-shaped leaves, 70-130 x 350-500 mm, covered with short, patent hairs on both surfaces, at least during their development. Although the hairs become increasingly sparsely spaced as the leaf blades enlarge, they remain evident under a hand lens in most plants and are only rarely absent at maturity. Studies in the field and of the herbarium material at NBG and BOL indicated that populations of A. belladonna in the southern Cape, the Agulhas Plain and the Cape Peninsula have widely spreading, narrow leaves, 13-26 x 270-680 mm, whereas the western populations from Saldanha and the Cederberg have somewhat upright, slightly broader leaves, 36-73 x 300-675 mm, that arise from an elongated basal sheath, 110-300 mm long. The leaves of A. belladonna are therefore perceptibly longer and narrower than those of A. paradisicola while the leaf surfaces are consistently glabrous, even when young. Amaryllis paradisicola is furthermore distinguished by several floral characters, of which flower colour and stigma shape are most diagnostic. The 10-21-flowered A. paradisicola is slightly more floriferous than A. belladonna, which has 6-12 or occasionally 21 flowers per inflorescence; and the tepals, although darkening with age, are uniformly pink, without the cream to lemon-yellow perigone throat of A. belladonna. The inner stamens relative to the outer stamens vary from 10 mm longer to almost equally long in A. belladonna, whereas the inner stamens of the new species exceed the outer stamens by 15 mm or more. Lastly, the mature stigma of A. paradisicola is distinctly trifid with slender, spreading branches that reach up to 1.5-2.5 mm long when mature, unlike the broader (up to 2 mm across), minutely trifid stigma of A. belladonna. Although not as strongly scented, the flowers of both species smell somewhat like those of Narcissus.
            textZh: SANBI 条目提供了 Amaryllis paradisicola Snijman 的鉴别特征。
