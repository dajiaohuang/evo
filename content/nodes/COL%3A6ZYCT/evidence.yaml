    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Bulbous geophyte, ± 80 mm tall, dwarf. Leaves 2, dry at flowering, spreading, filiform, smooth. Flowers in a spreading cluster, stellate, white or occasionally pale pink, scape wiry, spiralled at least near base.
            textZh: Strumaria pygmaea Snijman 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_14528_0
            locator: "SANBI/WFO archive Morphology row 32860; source identifier 14528.0; cited publication: Snijman, DA. 2013. Amaryllidaceae. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 33 - 42. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: The delicate habit of S. pygmaea places it close to S. tenella. Both species have filiform leaves and the smallest flowers in the genus, however, S. pygmaea has only two to three leaves (up to 80 mm long) and a sheathing cataphyll, whereas S. tenella has up to six leaves per annum (70-380 mm long) and lacks a cataphyll. A novelty, is the extremely slender, wiry and more or less spirally twisted scape which bears contrasting stout, green pedicels. The infructescence persists throughout the vegetative phase, with the green pedicels apparently functioning as assimilatory structures.
            textZh: SANBI 条目提供了 Strumaria pygmaea Snijman 的鉴别特征。
            sourceIds:
              - sanbi_4232_0
            locator: "SANBI/WFO archive Diagnostic row 44959; source identifier 4232.0; cited publication: Snijman, DA. 1994. Systematics of Hessea, Strumaria and Carpolyza (Amaryllideae:Amaryllidaceae). Contr. Bolus Herb. 16: 2 - 158. [All rights reserved]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
