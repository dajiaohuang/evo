        usage:
          title: Ageratina molinae R.M.King & H.Rob., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Small erect or decumbent shrubs to 1 m high, with few to many branches; stems yellowish to purple-tinged, terete, puberulous. Leaves opposite; blades membranaceous, ovate to rhomboid, to 4.5 cm long and 3.5 cm wide, the base very short-cuneate to subtruncate, trinervate, the margins serrate to subentire, the apex short-acuminate, the surface sparsely short puberulous, the veins hirtellous; petioles slender, 0.5-3.0 cm long. Inflorescence laxly corymbose-paniculate with laxly corymbose branches, the ultimate branches slender, 2-9 mm long, puberulous. Heads ca. 5 mm high with 19-28 florets; involucral bracts 16-18, eximbricate, biseriate, narrowly lanceolate, 3.5-4.0 mm long, bicostate, mostly long acute, scarcely attenuate, the outer surface puberulous, without glands; corolla white, 3.0-3.5 mm long, the tube very slender, 1.5-2.0 mm long, glabrous, the limb short campanulate, ca. 1.0 long, the lobes triangular, scarcely longer than wide, glabrous on inner surface and with numerous simple hairs on outer surface; anther thecae ca. 0.5 mm long. Achenes fusiform, ca. 1 mm long, with scattered long bristles on the ribs and surface; carpopodium cylindrical with narrowly oblong cells; pappus bristles ca. 25, somewhat fragile at base, mostly 1.7-2.0 mm long, not distinctly broadened distally, shorter series of bristles lacking.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 1674
