          originalSourceText: Lianas; stems woody below, herbaceous above, glabrate. Leaves rounded- cordate, 8-20 cm broad, about as long as broad, acute or cuspidate-acuminate, cordate basally, glabrate or pilose beneath along the veins. Flowers usually clustered; sepals broadly ovate, 15-18 mm long, obtuse to subacute, often dry- ing purplish, pilose to glabrescent; corollas purple, the throat darker, 5-8 cm long. Fruits capsular, subglobose, glabrous, 1 cm in diameter; seeds comose.
