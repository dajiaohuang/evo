          - text: Shrub, up to 1.5 m tall, rhizomatous; culm branched in lower parts. Leaves cauline, rigid, pungent; ligule a fringe of hairs. Inflorescence an open panicle. Spikelets 12-14 mm long; 1-flowered; lemma 3-awned, all 3 awns or central only plumose, with articulation between apex of lemma and base of column. Year-round.
