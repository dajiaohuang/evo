    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Stout leafy annual herb to 4 m. Leaves up to 20 x 5 cm, often much narrower, entire, denticulate, pinnatifid, pinnatisect, or runcinate-pinnatisect, the lower attenuate into a winged petiole-like base, the upper sessile, not or scarcely auricled. Heads many in a long relatively narrow panicle. Involucre up to 14 x 6 mm. Flowers yellow. Achenes c. 4.5 mm long including 1 mm beak, oblong, rounded at both ends, strongly compressed, median rib on each face, broadly winged, transversely wrinkled, black.
