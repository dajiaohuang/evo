          - text: "Open, rather laxly branched shrubs. Branchlets with internodes mostly 20-35 x 1 mm. Leaves lanceolate-ovate to elliptical, 30-40 x 10-15 mm, margins essentially smooth and flattened, chartaceous. Inflorescence: raceme terminal, 20-30 mm long, 10-20-flowered. Flowers whitish, 10 x 1 mm at anthesis; pedicels 2 mm long. Berries ellipsoid, 8-9 mm long, pink."
