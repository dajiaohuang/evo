  claims:
    - subjectId: taxon:morganucodonta
      claimKind: scientific
      claimType: taxonomy
      statement: Morganucodontans are sampled as early mammaliaforms outside narrower crown Mammalia in the cited broad character analysis; this placement is a higher-taxon convention and topology, not evidence that Morganucodonta is the direct ancestor of living mammals.
      confidence: medium
      confidenceRationale: The paper directly scores morganucodontans and discusses the Mammalia boundary. The statement avoids ancestry and whole-group duration.
      referenceLinks:
        - relation: supports
          referenceId: luo-2002-mesozoic-mammal-phylogeny
          pages: 1–78
          quoteLocator: Taxon sampling; Mammaliaformes relationships; discussion of crown Mammalia definitions
        - relation: supports
          referenceId: kermack-1981-morganucodon-skull
          pages: 1–158, especially 1–8
          quoteLocator: Material, taxonomy and systematic position of Morganucodon
    - subjectId: taxon:morganucodonta
      claimKind: scientific
      claimType: biogeography
      statement: The primary skull study describes Lower Jurassic Morganucodon watsoni from Wales and M. oehleri from China; these two source localities are representative material, not a complete geographic distribution for Morganucodonta.
      confidence: medium
      confidenceRationale: The source names the two species, countries and Lower Jurassic context, but an order-level dossier must not turn them into a complete range or origin centre.
      referenceLinks:
        - relation: supports
          referenceId: kermack-1981-morganucodon-skull
          pages: 1–158, especially 1–8
          quoteLocator: "Introduction and material: M. watsoni from Wales; M. oehleri from China"
    - subjectId: taxon:morganucodonta
      claimKind: scientific
      claimType: ecology
      statement: The described Morganucodon skulls have teeth differentiated into incisors, canines, premolars and molars, but the study does not directly observe diet, habitat, locomotion or behaviour for Morganucodonta as a whole.
      confidence: medium
      confidenceRationale: The dental differentiation is a direct anatomical observation; ecological function is deliberately withheld beyond a cautious dental inference.
      referenceLinks:
        - relation: supports
          referenceId: kermack-1981-morganucodon-skull
          pages: 1–158, especially 1–8
          quoteLocator: Abstract; dentition and functional differentiation
    - subjectId: taxon:morganucodonta
      claimKind: scientific
      claimType: morphology
      statement: Kermack and colleagues describe a 26 mm Morganucodon watsoni skull and a slightly larger M. oehleri skull, with a squamosal–dentary contact while the articular–quadrate joint is retained; this is one anatomical mosaic, not a linear transition or direct ancestry claim.
      confidence: high
      confidenceRationale: The named skull study directly describes the stated anatomy, while functional and evolutionary interpretations remain bounded to the authors' material and taxon sampling.
      referenceLinks:
        - relation: supports
          referenceId: kermack-1981-morganucodon-skull
          pages: 1–158, especially 1–8
          quoteLocator: Abstract; skull, jaw articulation and middle-ear descriptions
    - subjectId: taxon:morganucodonta
      claimKind: scientific
      claimType: fossil-range
      statement: Morganucodonta is displayed at 201.4–145 Ma only as the synthesis's sampled fossil envelope, not exact global genus-group endpoints. The interval is a source-bounded sample window, not a global FAD, LAD, divergence date, continuous occupancy claim or direct-ancestor assertion.
      confidence: medium
      confidenceRationale: Morganucodonta uses Luo, Z.-X.; Kielan-Jaworowska, Z.; Cifelli, R.L. (2002) because the cited pages and locator expose the sampled taxon, specimen or living sequence set. Confidence is medium and applies only to Morganucodontan specimens sampled in Luo et al.'s Mesozoic-mammal synthesis; broader endpoints remain unclaimed.
      referenceLinks:
        - relation: supports
          referenceId: luo-2002-mesozoic-mammal-phylogeny
          pages: 1–78
          quoteLocator: Taxon sampling; Mammaliaformes relationships; discussion of crown Mammalia definitions
        - relation: contextualizes
          referenceId: ics-2026-06
          pages: International Chronostratigraphic Chart v2026/06
          figure: Global chronostratigraphic scale
          quoteLocator: Numerical boundaries for named geological stages used to bound the source sample
  claim-rationales.zh:
    - 论文直接编码摩根兽类并讨论哺乳纲边界；表述避免祖先关系和全群延续范围。
    - 来源明确两种标本、国家和早侏罗世背景，但目级档案不能把它们转化为完整分布或起源中心。
    - 牙齿分化是直接的解剖观察；除审慎的牙齿功能推断外，生态功能保持未定。
    - 具名颅骨研究直接描述了相关解剖；功能和演化解释仍限定于作者的材料与类群取样。
    - Morganucodonta 采用 Luo, Z.-X.; Kielan-Jaworowska, Z.; Cifelli, R.L.（2002）的论文，因为所引页码与定位符直接标示了研究采样的类群、标本或现生序列集合。中等置信度仅适用于 Morganucodontan specimens sampled in Luo et al.'s Mesozoic-mammal synthesis；更宽泛端点保持未声明。
  claim-statements.zh:
    - Kermack 及同事描述了一件长 26 毫米的 Morganucodon watsoni 头骨和一件稍大的 M. oehleri 头骨：存在鳞骨与齿骨的接触，同时保留关节骨与方骨组成的关节。这是一种解剖特征的镶嵌组合，并不代表线性演变或直接祖先关系。
    - 头骨主研究描述了威尔士下侏罗统的 Morganucodon watsoni 和中国的 M. oehleri；这两个来源地点提供代表性材料，并非摩根齿兽目的完整地理分布。
    - 所描述 Morganucodon 头骨的牙齿分化为门齿、犬齿、前臼齿和臼齿，但研究并未直接观察整个摩根齿兽目的食性、生境、运动方式或行为。
    - 在所引广泛性状分析中，摩根兽类被取样为狭义冠群哺乳纲之外的早期哺乳形类；这一位置属于高阶分类约定与拓扑，不是摩根兽目为现生哺乳类直接祖先的证据。
    - Morganucodonta 仅以 201.4–145 Ma 展示为综述所采样的化石包络，而非精确全球类群端点。该区间是来源限定的样本窗口，不是全球首现、末现、分化日期、连续占据或直接祖先断言。
