    facets:
      morphology:
        status: partially-supported
        claims:
          - text: "Erect, simple or branched herbs up to 35 cm high. Leaves up to 4 cm long and 1-5 cm broad, lanceolate to ovate-lanceolate, acute or acuminate, the lower ones often reduced and scale-like. Flowers terminal, solitary or in few-flowered cymes with long branches, heterostylous. Calyx of 5 segments, each 1-2.5 cm long, 1-4 mm broad, lanceolate to elliptic-lanceolate, long-acuminate, keel-wing up to 2 mm broad near the base, much narrower above, glandular at the base inside. Corolla white, cream, yellow or 'salmonpink' (fide Nation); tube 1-2.3 cm long, narrowed above the ovary, widening again from the point of insertion of the filaments; lobes 5-15 mm long, 3-14 mm broad, obovate-oblong to suborbicular, acute, apiculate, sometimes shortly clawed. Long-styled flowers: Filaments 0.5-0.75 mm long, inserted 10.5-12.5 mm below the corolla-sinuses; anthers 1.5-2 mm long, often adhering, each with a shortly stipitate, lanceolate apical gland 0.75-1.5 mm long, and 2 small round shortly stipitate, basal glands. Style and stigma 9-10 mm long; stigma 5 mm long, papillate, 2-lobed, above the anthers. Medium styled flowers: Filaments 1.75 mm long, inserted 6.5 mm below the corolla-sinuses; anthers 1.25 mm long, each with a shortly conical, stipitate apical gland 0.5 mm long, and 2 small round, stipitate basal glands. Style and stigma 4.25 mm long; stigma 2.5 mm long, 2-lobed, papillate, level with the anthers. Short-styled flower: Filaments 4-4.5 mm long, inserted 13-14 mm below the corolla-sinuses; anthers 2.5 mm long, each with a shortly stipitate apical gland 0.6-1 mm long and 2 small round stipitate basal glands. Style and stigma about 3-5 mm long; stigma 2.25-2.75 mm long, papillate, 2-lobed, below the anthers."
