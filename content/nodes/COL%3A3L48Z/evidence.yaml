    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Perennial herb, geophyte, 0.12-0.18 m high; stem curved, simple. Leaves 3, lower 2 basal, sheathing, falcate, subacute, margins thickened, midrib prominent, veins visible below. Bracts 7 mm long, 7-nerved, green, apex becoming red, interior short. Inflorescence a 2-flowered spike; perianth 15-17 mm long; perianth tube 5 x 0.75 mm, throat dilated; tepals subequal, 10-12 x 4.0-5.5 mm, elliptic, obtuse; pale purple or rosy. Stamens exserted; filaments 2 mm long. Flowering time Jan.-Mar.
            textZh: Hesperantha ingeliensis Hilliard & B.L.Burtt 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_18505_0
            locator: "SANBI/WFO archive Morphology row 91004; source identifier 18505.0; cited publication: Bredenkamp, CL; Magwaza, ZL. 2019. Iridaceae. In: CL Bredenkamp (ed.), A Flora of the Eastern Cape Province, Strelitzia 41(3): 1821 - 1882. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Poorly known Hesperantha ingeliensis is distinguished from other eastern southern African pink-purple-flowered species of Hesperantha by the spike of only one or two flowers with an unusually short perianth tube, ± 5 mm long, and tepals ± twice as long. Its immediate relationships are uncertain, but it is possibly allied to H. baurii, from which it is distinguished by the spikes of mostly two flowers with shorter anthers.
            textZh: SANBI 条目提供了 Hesperantha ingeliensis Hilliard & B.L.Burtt 的鉴别特征。
