          title: Rhynchosia reticulata (Sw.) DC., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Herbaceous to suffruticose vine; stems angled to terete, villous to strigose along ridges. Leaves trifoliolate, leaflets ovate to obovate, the lateral leaflets asymmetric, 2.5-6.5 cm long, 2.3-5.5 cm wide, apically acute, basally cuneate to subcordate, finely strigulose above, reticulate, strigulose and gland dotted be- neath; terminal petiolule 2.0-11.0 mm long, the lateral petiolules 1.0-2.0 mm long; petiole 2.0-4.5 cm long, angled, villous; stipels linear, 1.0-2.0 mm long; stipules lanceolate to ovate 0.3-1.0 cm long, 0.1-0.5 cm wide, caducous to per- sistent. Inflorescence shorter or longer than the leaves, 5.0-13.5 cm long, dense- ly, ca. 20-30, flowered; peduncles 1.5-2.5 cm long, pedicels ca. 3.5 mm long; bracts lanceolate, 3.0-5.0 mm long, caducous. Flowers with the calyx usually equal to or exceeding the corolla, 0.7-1.1 cm long, the lobes lanceolate, 0.5-0.9 cm long, puberulent, gland dotted; corolla yellow, 0.6-1.0 cm long, puberulent, gland dotted, the standard obovate, auriculate, 8.0-9.5 mm long, 3.0-4.0 mm wide, the claw ca. 1.0 mm long, the wing oblong, 7.5-8.0 mm long, ca. 2.0 mm wide, the claw ca. 1.0 mm long, the keel falcate, 7.5-9.0 mm long, ca. 2.0 mm wide, the claw 1.0-1.5 mm long; stamens 5.0-9.0 mm long. Fruits oblong ovate, 1.5-2.0 cm long, 0.5-0.7 cm wide, the beak 1.0-2.0 mm long, puberulent; seeds 2, ovoid, ca. 3.0 mm long, brown black, hilum ovate, ca. 1.0 mm long.
