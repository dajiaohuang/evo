        usage:
          title: Stemodia jorullensis Kunth, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Small annual herbs, erect, prostrate or ascending, to 30 cm tall, the stems slender, drying angled, sparingly pilose with weak, whitish hairs; roots short. Leaves opposite, broadly ovate, mostly 8-12 mm long, apically obtuse or rounded, basally truncate or cuneate, the margins serrate with ca. 8 blunt teeth on each side, some of the teeth double, venation pinnate with 4-5 veins on each side, above sparingly pilose with weak white hairs, beneath with a few similar hairs and punctate with sessile or plane glands; petiole narrow, broadening upwards, about '/2 as long as the blade. Inflorescences 1-3 flowers in the leaf axils, the pedicels slender, pilose, much exceeding the leaves, ebracteate. Flowers with the calyx pilose, 5-lobed to near the base, 4 lobes alike and equal, narrowly acute, the fifth slightly longer, broader, apically differentiated; corolla white, perhaps with some pink, drying dull yellow or orange, 6-9 mm long, tubular, 2-lipped, glabrate outside, sometimes ciliate on the angles, the upper lip 2-lobed, the lobes broadly rotund, ca. 1.7 mm long, apically sinuate, bearded at the throat with stout, clavate hairs, the lower lip 3-lobed, the middle lobe obtuse, ultimately acute, the 2 lateral lobes rotund, the tube generally pilose within, sometimes with a few scattered sessile glands; stamens 4, the anterior filaments basally geniculate, glabrous, inserted near the base of the tube, 5-6 mm free, the anthers alike or dissimilar, the thecae ca. 0.7 mm long, oblong, parallel, separated by the globose connective, the posterior filaments glabrous, ca. 1 mm free, inserted in the upper half of the corolla tube, the anthers similar to the anterior pair but slightly larger, a minute staminode inserted between the posterior filaments at the same level; ovary glabrous, smooth, eglandular, compressed, septally sulcate, the style straight, the stigma situated at the level of the lower (posterior) anthers, bent at an obtuse angle to the style, minutely appendaged on the sides. Capsule ovoid or ellipsoidal, about as long as the calyx, apically acute or obtuse, dehiscing septicidally and loculicidally from the apex, the valves apically recurving; placenta narrowly conical, dark, winged only at the base; seeds numerous, reddish brown, oblong, longitudinally ca. 6-sulcate, ca. 0.5 mm long.
          originalLanguage: en
          sourceField: general
