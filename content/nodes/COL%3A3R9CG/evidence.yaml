        claims:
          - text: Succulent shrublet, up to 200 mm tall, leafy at flowering; stems up to 30 mm diam. Leaves lanceolate, mostly 30-100 x 10-13 mm, fleshy, convex above and concave beneath, with recurved margins, glaucous. Flowerheads solitary on stout, bracteate peduncles, nodding in bud but later erect, discoid, bright yellow, broadly cylindrical, ± 15 mm diam.; involucral bracts 6-8, mostly 15-30 mm long. Pappus bristles 15-20 mm long.
