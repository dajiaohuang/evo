        claims:
          - text: Cormous geophyte, 7-8 cm, tunics woody, concentric. Leaves sword-shaped, margins and midrib slightly thickened. Flowers white, tepals spreading, stamens and style included in tube.
            textZh: Geissorhiza esterhuyseniae Goldblatt 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 6774; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: One of the most remarkable species in the genus, Geissorhiza esterhuyseniae has both stamens and style included within a relatively long perianth tube up to 16 mm long. This set of characters is known elsewhere in Geissorhiza in the northern Cederberg species, G. cedarmontana, and in G. adriaanii (sect. Engysiphon) from Piketberg. Corms are not known for G. esterhuyseniae and it is included in subg. Weihea because of its morphological similarity to G. cedarmontana. This species has a perianth tube 13-15 mm long, comparable with that of G. esterhuyseniae, but shorter filaments 1 mm long and the white flowers have red at the tepal bases, whereas G. esterhuyseniae has uniformly white flowers with filaments ± 3 mm long. Both species grow in similar sheltered, south-facing rocky situations.
            textZh: SANBI 条目提供了 Geissorhiza esterhuyseniae Goldblatt 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 94674; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
