        usage:
          title: Drymonia aciculata Wiehler, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Epiphytic shrubs or lianas; stem erect, to 5 m long, the internodes 1.5-7.0 cm long, green or reddish brown, glabrous. Leaves nearly equal to greatly unequal in a pair, narrowly or broadly elliptic, ovate, obovate or lanceolate, 7-18 cm long, 2.3-10.0 cm wide, subcoriaceous, the apex acute to abruptly acuminate, the base acute to rounded, entire, above dark green, glabrous, below lighter green with minute dots and prominent veins; petiole 1-4 cm long, glabrous. Inflorescences axillary of one or few flowers; peduncle not obvious; bracts linear, ca. 0.5 cm long; pedicels ca. 1 cm long, reddish, minutely strigillose. Flowers with the calyx oblique, the lobes unequal, lanceolate, ca. 2 cm long, 0.5-1 cm wide, reddish or rarely green, strigillose at the base, glabrous toward the acuminate apex; corolla white or cream colored with reddish or orange lines on the limb and within the tube, the tube oblique in the calyx, 3.0-4.5 cm long, the base saccate, broader toward the limb, glabrous, the lobes of the limb suborbiculate, ca. 1 cm long, erose, the basal lobe almost fimbriate, glandular; stamens included, the fila- ments 2-3 cm long, glabrous, the anthers oblong; disc gland white, glabrous; ovary ovoid, finely white sericeous, the hairs appearing to be in rows on dried material, the style glabrous, the stigma stomatomorphic. Capsule not seen.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 6253
