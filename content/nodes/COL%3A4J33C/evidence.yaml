          title: Piper aequale Vahl, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: A glabrous, nodose shrub, 1-3 m. tall; flowering internodes slender and com- paratively short; leaves elongated-elliptic, lance-elliptic or ovate, 3.5-9 X 12-17 cm. long, apex more or less attenuate, bluntly acuminate, base equilaterally acute or obtusish, pinnately nerved to the upper third or nearly throughout, the nerves mostly 4-5 or 6 on each side, with fainter intermediates and cross-connecting- anastomosing nervules, commonly 2 or 3 pairs approximated near the base and 1 or 2 pairs above the middle of the blade, the nerves often golden in dry specimens, drying rather firm, somewhat glossy, narrowly revolute, translucent; petiole about 5-10 mm. long or sometimes up to 1.5 cm. on lower leaves, commonly vaginate near the base but occasional leaves vaginate to the middle or above; spikes 2-4 mm. thick and up to 10 cm. long; peduncle commonly about as long as the petiole; bracts rounded dome-shaped when young with submarginal fringe, becoming round- or triangular-subpeltate and loosely fringed; fruit small,, obpyramidal- trigonous, convex at the top, glabrous; stigmas slender, sessile.
