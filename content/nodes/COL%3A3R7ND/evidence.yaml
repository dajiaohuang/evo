    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Perennial herb; stems decumbent, glandular-villous, 0.2-0.35 m long. Leaves sessile to subsessile; blade broadly ovate to subrotund, 15-20 x 10-18 mm, glandular-pubescent, apex rounded, base subcordate, margin obscurely few-toothed. Flowers solitary in the axils of the upper leaves; pedicels 10-20 mm long with a pair of leaf-like bracts about the middle. Calyx glandular-hispid, up to 10 mm long, deeply toothed. Corolla mauve, 18-20 mm long; tube campanulate, 14-16 mm long; upper lip 2.5 mm long; lower lip 4 mm long.
            sourceIds:
              - sanbi_15367_0
            locator: "SANBI/WFO archive Morphology row 50287; source 15367.0; publication: Codd, LEW. 1985. Lamiaceae: 15. Satureja. In: OA Leistner (ed.), Fl. S. Africa 28(4): 103 - 106. Botanical Research Institute, Department of Agriculture and Water Supply, Pretoria. [http://www.biodiversitylibrary.org/item/209555#page/9/mode/1up]. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: The species has affinities to K. pilosa but differs in decumbent stems (instead of prostrate to decumbent), shorter internodes, shorter and stouter pedicels, larger flowers, bracteoles and nutlets and the absence of particularly long overground runners. The leaves have a sharp mentha-like scent. This taxon occupies drier environments than Killickia pilosa.
            textZh: SANBI 条目提供了该种的鉴别特征。
            sourceIds:
