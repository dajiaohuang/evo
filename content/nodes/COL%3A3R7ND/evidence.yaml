            locator: "SANBI/WFO archive Diagnostic row 104853; source 7050.0; publication: Brauchler, C; Doroszenko, A; Esser, H; Heubl, G. 2008. Killickia (Lamiaceae): a new genus from KwaZulu-Natal, South Africa. Bot. J. Linn. Soc. 157: 575 - 586. [All rights reserved]"
