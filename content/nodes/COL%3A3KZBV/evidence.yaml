        claims:
          - text: Rounded, grey-mealy shrub to 1 m, with pubescent branches. Leaves cuneate to ovate, toothed above, pale mealy beneath. Flowers small, in many-flowered, elongate, terminal clusters, yellow.
            sourceIds:
              - sanbi_14353_0
            locator: "SANBI/WFO archive Morphology row 12311; source 14353.0; publication: Manning, JC; Goldblatt, P. 2012. Malvaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 613 - 621. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: "Three not clearly defined groups can be recognized, (1) a fairly robust, suberect to erect form with normal internodes, (2) a form with more or less the same habit but with short internodes, and (3) a prostrate form with flowers rather smaller and petals only slightly longer than the calyx. All three these forms are represented in LINN: the typical form by Cat. No. 854.5, the form with short internodes by 854.6 and the prostrate form with short petals by 854.7. All forms are characterized by numerous small flowers, suborbicular cuneate leaves which are stellate-tomentose on both surfaces, the lower usually whitish tomentose, and the rather thin calyx which is usually laxly stellate-pubescent, with the stellate hairs occurring mainly on the nerves."
            textZh: SANBI 条目提供了该种的鉴别特征。
