        usage:
          title: Maripa nicaraguensis Hemsl., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Lianas; stems smooth to slightly angled, grayish-brown to brown. Leaves elliptic to lanceolate, 9-15(-25) cm long, the base obtuse to rounded, the apex acute to shortly acuminate, chartaceous to subcoriaceous, glabrescent. Inflores- cences terminal, paniculate-thyrsiform with reddish peltate glandular trichomes on the branches; bracts triangular to triangular-ovate, to 2 mm long, mostly per- sistent in flower, caducous in fruit. Flowers with pedicels 4-8(-12) mm long; sepals ovate to broadly ovate, 7-8 mm long, coriaceous to membranaceous, ciliate, the exterior lobes with reddish glandular basal trichomes, the interior lobes glabrous to appressed-pubescent outside; corolla lilac to pinkish, the tube base nearly white (living), 30-45 mm long. Fruits ellipsoid, broadly ellipsoid to suborbicular, 20-30 mm in diameter, the surface smooth to reticulate, yellow and turning brown to dark brown; seeds ovoid, 20-22 mm long, 11-13 mm in diameter.
          originalLanguage: en
          sourceField: general
