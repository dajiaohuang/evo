    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, 10-16 cm, tunics woody, concentric, stem branched. leaves soft-textured, lower 2 or 3 spreading to prostrate, ± linear. Flower single per branch, zygomorphic, tepals vertical, blue-mauve, greenish in throat, stamens unilateral, declinate.
            textZh: Geissorhiza monticola Goldblatt & J.C.Manning 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 6836; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Distinguished by its large, zygomorphic flowers solitary on the branches, Geissorhiza monticola has a nodding blue perianth and well-exserted, declinate stamens The flowers have a short perianth tube ± 3 mm long and tepals 14-18 mm long. The plane leaves are prostrate with slightly thickened margins and main veins. Its relationships presumably lie with G. delicatula of the Langeberg and Swartberg and its allies, with which it shares an oblique corm, several plane leaves with the marginal vein set slightly away from the margin itself, and solitary flowered spikes. Geissorhiza delicatula has much smaller, cup-shaped flowers held upright, with elliptical or obovate, pale mauve tepals mostly 7-10 mm long, erect stamens with filaments 3-5 mm long, and a central style of similar length with short style branches up to 1.5 mm long, thus less than half as long as in G. monticola. Geissorhiza nigromontana may also be confused with G. monticola, but it has a stem ± prostrate toward the base, a spike of 2 or 3 flowers (flowers always single in G. monticola), bears cormlets in the leaf axils, shorter leaves with blades 4-10 mm wide vs. 2-3 mm in G. monticola, and the flowers are, as far as known, upright and radially symmetric.
            textZh: SANBI 条目提供了 Geissorhiza monticola Goldblatt & J.C.Manning 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 94655; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
