    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, 5-15 cm. Leaves lanceolate, hairy, margins sometimes thickened, shorter or longer than stems. Flowers zygomorphic, lower tepals ± clawed and contiguous at base and diverging obliquely above, pale blue with white to yellow marks on lower tepals, scented, inner bracts divided to base, ovary hairy.
            textZh: Babiana mucronata (Jacq.) Ker Gawl. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 6750; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: One of the most common species of the interior valleys and lower mountain slopes of the western half of Western Cape, Babiana mucronata is recognised among species of sect. Babiana with a densely hairy ovary by the pale to deep violet flowers with white to pale yellow blotches on the lower lateral tepals. The anthers are pale yellow to lilac or sometimes turquoise and the flowers usually have an acrid to metallic odour or occasionally apparently odourless. Most other blue-flowered species of sect. Babiana from this area are more-or-less acaulescent, have leaves taller than the stem, and a smooth or sparsely hairy ovary, except for the relatively tall B. lineolata, which favours wet sandy ground and is easily separated by the rigid, narrow, deeply pleated leaves and short floral bracts, mostly 7-10 mm long.
            textZh: SANBI 条目提供了 Babiana mucronata (Jacq.) Ker Gawl. 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 94957; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
