    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants 100-350 mm tall; basal sheaths several, hyaline; leaves erect or falcate, conduplicate, usually reaching to above the inflorescence base, up to 200 x 1-3 mm, grading into the floral bracts. Inflorescences lax, 40-150 mm long; bracts from half as long to longer than the ovaries. Flowers white or pink with purple spots on the sepals. Median sepal erect, galea obtuse, 5-6 (-10) x 4 x c. 2 mm deep, margins not incurved; spur terete, acute, horizontal or at length gradually decurved, 5-10 (-25) mm long; lateral sepals patent, oblong, obtuse to rounded, shallowly navicular, 4-7 (-10) mm long, apiculi well-developed. Petals erect next to the stigma, narrowly oblong, oblique, trunculate to obtuse, 2.5-4 mm tall, apex curved in obscuring the spur entrance, with a large basal anticous lobe partially obscuring the stigma. Lip oblanceolate, 4-6 (-8) mm long. Anther semi-pendent to horizontal; stigma on a c. 1 mm long pedicel, margins incurved over receptive surface; lateral rostellum lobes square, central lobe much smaller.
