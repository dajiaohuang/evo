        status: partially-supported
        claims:
          - text: Dioecious, prickly, scrambling perennial to 3 m. Leaves in whorls of 6-8, ovate-lanceolate, margins prickly. Flowers many in axillary cymes, peduncles woolly, anthers subsessile, yellowish.
            sourceIds:
              - sanbi_14394_0
            locator: "SANBI/WFO archive Morphology row 6538; source 14394.0; publication: Manning, JC; Goldblatt, P. 2012. Rubiaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 700 - 704. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Widely distributed and variable (leaf size and shape!), ('male') plants have less densely villous and less conspicuous inflorescences than ('female'), ('male') forms with less hairy inflorescence branches should not be confused with G. undulatum.
            textZh: SANBI 条目提供了该种的鉴别特征。
            sourceIds:
              - sanbi_3095_0
            locator: "SANBI/WFO archive Diagnostic row 51106; source 3095.0; publication: Puff, C. 1986. Paederiaceae, Anthospermae, Rubieae, Fl. S. Africa 31(1,2): 1 - 75. Botanical Research Institute, Pretoria. [http://www.biodiversitylibrary.org/item/209569#page/5/mode/1up]. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: "Dioecism has evolved in a number of Galium species, but G. tomentosum is the only Southern African species to show this phenomenon. It is also one of the very few in which dioecism is coupled with sex-dimorphism (G. cotinoides de Cham. & v. Schlechtend., a Chilian species not related to G. tomentosum, for example, is another: Ehrendorfer, personal communication). Although the synflorescences of [male] and [female] plants have an identical basic structure, their appearance is rather different: in [female] plants the densely villous peduncles and pedicels are much elongated and ± weak so that in nature they are always pendulous. In [male] plants, peduncles and the much less hairy or subglabrous pedicels are short, stiff and straight, and, as a result, the synflorescences are not pendulous. At present, no explanation of the function or possible advantage of dioecism and the long, pendulous [female] synflorescences in G. tomentosum can be offered, but they are certainly not an adaption to anemogamy: G. tomentosum is clearly entomogamous, and both, [male] and [female] flowers produce much nectar and were frequently found to be visited by small insects particularly in Namaqualand."
            textZh: SANBI 条目提供了该种的鉴别特征。
            sourceIds:
              - sanbi_2814_0
            locator: "SANBI/WFO archive Diagnostic row 84567; source 2814.0; publication: Puff, C. 1978. The genus Galium L. (Rubiaceae) in southern Africa. J. S. African Bot. 44: 203 - 279. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
