            locator: "SANBI/WFO archive Morphology row 98053; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Important diagnostic features for the species that distinguish it from Lapeirousia plicata include outer floral bracts that are channelled throughout and not unifacial distally, and a stem produced up to 40 mm above ground. The flowers are recorded as being uniformly white, or in one collection yellowish, always lacking the blue or purple markings characteristic of L. plicata. The tepals, 10-14 mm long, and tube, 30-40 mm long, are somewhat longer than in L. plicata, which has tepals 7-10 mm long and a tube typically 12-20 mm long, rarely up to 35 mm. Significantly, L. plicata occurs within the range of L. kalahariensis but typically blooms there later in the year, in May and June, sometimes in July. Lapeirousia kalahariensis also shows a resemblance to L. odoratissima from southern tropical Africa, but that species has much larger flowers, the perianth tube 100-140 mm long, and a well-developed, strongly ribbed basal leaf.
