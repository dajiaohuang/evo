    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Loosely tufted annual or short-lived perennial, 150-400 mm high; culm nodes dark, glabrous. Leaf blade 40-90 x 4-12 mm; margins pale, thickened, scaberulous. Inflorescence digitate or subdigitate, of 2-5 racemes 50-180 mm long; rachis ribbon-like, broadly winged, smooth, margins scabrous; pedicel subterete, glabrous; spikelets in clusters of 3. Spikelet 2.0-3.0 mm long, densely hairy; internode absent; lower glume a short membranous cuff 0.1-0.3 mm long, truncate or absent; upper glume shorter than spikelet, densely covered with long silver or purple hairs, nerves 3, prominent; lower lemma 5-nerved (marginal nerves not prominent), densely long hairy; hairs overtopping spikelet by up to 1 mm; upper lemma concealed, shorter than spikelet, yellow to pale brown; anthers 0.8-1.2 mm long.
