          title: Lacistema aggregatum (P.J.Bergius) Rusby, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrubs or trees to 18 m., the young branches glabrous or strigose. Leaves lanceolate to obovate-lanceolate, 7-17 cm. long, 2.0-7.5 cm. wide, apex attenuate, cuneate to rounded at the base, membranaceous to subcoriaceous, generally glabrous above, glabrous or sparsely strigose below, the margin entire to distantly and broadly serrate; petiole 5-7 mm. long; stipules 5-9 mm. long. Inflorescence of cylindrical spikes, 4-12 per axil; bracts broader than long, one subtending each flower. Flowers sessile, monochlamydeous; bracteoles at most 1 mm. long; perianth segments 4, about 0.5 mm. long, erose, unequal; disc about 0.75 mm. long, fleshy; stamen almost 1 mm. long, glabrous; stigma exserted; fruit 6-8 mm. long, about 6 mm. in diameter, often on a gynophore to 3 mm. long.
