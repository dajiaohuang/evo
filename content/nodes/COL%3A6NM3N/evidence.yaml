    facets:
      morphology:
        status: partially-supported
        claims:
          - text: "Plants usually single-stemmed. Leaves narrow, at first ascending and later recurving, 200-750 x 3-7 mm, keeled; margin smooth or, rarely, sparsely toothed. Scape overtopping recurved leaves, 250-800 mm long. Raceme elongate-oblong, fairly lax, usually secund, 60-280 mm long; buds ascending, greenish brown to maroon; flowers eventually pendulous, creamy yellow or yellow-green to greenish brown, rarely suffused with dull red, faintly scented. Bracts ovate, 4.0-6.5 mm long, usually broadest ± middle then narrowing abruptly to an acute to acuminate apex; margin entire. Pedicels 1-2 mm long, elongating slightly in fruit. Perianth cylindrical, 7-10 mm long; lobes ovate, 1 mm long, not spreading. Stamens exserted by 1-2 mm at anthesis, later withdrawn. Fruit sub-globose, 5-6 mm long. Flowering time: mainly January to March but occasional specimens may flower as early as August."
            textZh: Kniphofia parviflora Kunth 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_6616_0
            locator: "SANBI/WFO archive Morphology row 49842; source identifier 6616.0; cited publication: Codd, LEW. 2005. Asphodelaceae (First part): Kniphofia, Fl. S. Africa 5(1,2): 1 - 94. South African National Biodiversity Institute, Pretoria. [http://www.biodiversitylibrary.org/item/209560#page/3/mode/1up]. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: K. parviflora is unique in the genus in usually having a secund raceme. As the flowers start to open, the inflorescence leans to one side and the flowers turn in that direction. In the bud stage the raceme is narrowly cylindrical and may be confused in the herbarium with K. breviflora, but K. parviflora has longer racemes, greenish yellow to pale greenish brown flowers and broader, more ovate bracts.
            textZh: SANBI 条目提供了 Kniphofia parviflora Kunth 的鉴别特征。
            sourceIds:
