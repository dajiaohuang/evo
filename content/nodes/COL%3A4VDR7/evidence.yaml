    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Succulent shrub, up to 130 mm tall, stems up to 30 mm diam. at base. Leaves boat-shaped, ± 3 x 4 mm, up to 5 mm diam., surface smooth. Flowers solitary, bracteoles larger than foliage leaves, pink. Fruit 7-locular.
            sourceIds:
              - sanbi_14694_0
            locator: "SANBI/WFO archive Morphology row 33880; source 14694.0; publication: Klak, C. 2013. Aizoaceae: Octopoma. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 219 - 219. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: This species is most similar to S. inclusus in its compact habit, leaves with a high degree of fusion, and solitary flowers, but is distinguished by the longer central primary axis, which is at least one and a halftimes longer than the capsule, often resulting in the capsules held in a row above the terminal leaf pairs (primary axis equal in length to capsule and capsules not held in a row in S. inclusus). In S. tetrasepalus, the old leaves do not remain on the branch, leaving branches bare, while in S. inclusus, the old leaves remain on the branch.
