    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Rhizomatous geophyte, up to 300 mm tall, basal neck short, of 1 or 2 membranous sheaths without fibres. Leaves 4-8, linear, succulent, smooth. Flowers in a broadly conical raceme, yellow.
            textZh: Bulbinella gracilis Kunth 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_14536_0
            locator: "SANBI/WFO archive Morphology row 32913; source identifier 14536.0; cited publication: Snijman, DA. 2013. Asphodelaceae: Bulbinella. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 53 - 54. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: This species is easily identified by a number of distinctive features. In particular, the absence of dead leaf remains forming a fibrous sheath around stem and leaf bases is not encountered in any other Bulbinella species in South Africa. The patent pedicels in the fruiting stage are unique to B. gracilis and B. nana. The almost terete leaves are considerably more succulent than those of other Bulbinella species. The small, inconspicuous, boat-shaped bracts are similar to but smaller than those of the two autumn-flowering species, B. trinervis and B. divaginata.
            textZh: SANBI 条目提供了 Bulbinella gracilis Kunth 的鉴别特征。
            sourceIds:
              - sanbi_5933_0
            locator: "SANBI/WFO archive Diagnostic row 84533; source identifier 5933.0; cited publication: Perry, PL. 1999. Bulbinella in South Africa. Strelitzia 8: 1 - 78. National Botanical Institute, Pretoria. [CC BY]"
