    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Perennial shrub, 3-6 m high; stem simple, with tuft of leaves at apex. Leaves petiolate, oblong to ovate, up to 1.5 m x 600 mm, usually rounded at base or rarely cordate, shiny. Peduncle 300-450 mm long. Bracts lanceolate, glaucous. Spathes rarely up to 5 in sequence, claret, glaucous, 400-450 mm long, exuding mucilage; apices green, attenuate. Flowers light mauve to white. Sepals white-tinged with mauve towards base; lower shorter, navicular, keeled at base; upper linear-lanceolate, ± keeled below; perianth tube up to 30 mm long. Petals unequal; lower navicular; margins inflexed and meeting over centre; upper cuspidate. Stamens with slightly coiled filaments. Ovary triangular. Flowering time Oct.-Jan. Seeds with tuft of orange hairs.
