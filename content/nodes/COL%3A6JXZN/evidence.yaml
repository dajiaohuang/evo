        claims:
          - text: Acaulescent succulent to 40 cm. Leaves in a rosette, triangular, tuberculate. Flowers in an inclined, simple or branched raceme, nodding, reddish, inflated below.
            textZh: Gasteria ellaphieae van Jaarsv. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13855_0
            locator: "SANBI/WFO archive Morphology row 9061; source identifier 13855.0; cited publication: Manning, JC; Goldblatt, P. 2012. Asphodelaceae: Gasteria Duval. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 74 - 75. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Gasteria ellaphieae is immediately recognized by its densely tuberculate, triangular, ascending to recurved leaves and erect to erectly spreading reddish pink racemes, often branched in the upper half. It is an attractive dwarf species, and with its short triangular recurved leaves it sometimes superficially resembles a haworthia. The plants may be solitary or proliferate to form small groups. It differs from the species with tuberculate adult leaves (G. carinata, G. baylissiana, G. nitida var. armstrongii and G. batesiana) by its short, triangular and recurved, often falcate leaves. In floral and vegetative characteristics it is similar to G. nitida and G. vlokii. It has, however, a different leaf shape and epidermal texture (apart from being smaller). The perianth length of G. ellaphieae (25-27 mm long) is also somewhat intermediate between the two, which is 29-33 mm in G. vlokii and 20-27 mm in G. nitida. These three species are immediately distinguished by their bright, red-pink flowers which appear during January and February. G. nitida occurs in grassy fynbos regions to the south; it is a much larger species with erect to ascending smooth leaves. G. vlokii has asperulous leaves lacking tubercles and occurs in fynbos on the Swartberg mountain range to the west. The distribution of these three related species is clearly allopatric but is confined to rocky, quartzitic sandstone soils. G. ellaphieae also occurs close to, and is related to, G. pulchra. The latter has similar juvenile leaves but differs by being much larger, with ascending linear, acuminate leaves and a large paniculate inflorescence (flowering in spring). Superficially, G. ellaphieae may also be confused with the larger G. carinata and G. batesiana, from the renosterveld regions of the southern Cape and from northern Natal and the eastern Transvaal respectively. However, G. carinata has a different leaf epidermal texture and the plants flower in spring. G. batesiana also has somewhat similar, but larger recurved leaves, but here the resemblance ends, as it has a very different leaf epidermal texture and larger flowers.
            textZh: SANBI 条目提供了 Gasteria ellaphieae van Jaarsv. 的鉴别特征。
