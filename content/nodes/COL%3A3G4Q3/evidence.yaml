    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Perennial herb, geophyte, 0.20-0.45 m high; corm globose, tunics of fine, densely matted fibres; stem erect or inclined, simple or 1-branched, flexed above. Leaves 4-6, fleshy, 1.5-2.0 mm wide; midrib thickened and prominent when dry. Bracts green, sometimes flushed purple above. Inflorescence a 4-12-flowered spike; flowers white to cream-coloured, the reverse of 3 upper tepals usually flushed pink to dull purple towards apex, no nectar guides; perianth tube narrowly funnel-shaped; tepals oblanceolate, unequal, the dorsal largest, hooded over stamens, upper laterals directed forward. Stamens exserted; anthers mauve; pollen cream-coloured. Ovary ovoid; style arching over stamens. Flowering time Oct.-Jan. Capsule narrowly ovoid-ellipsoid.
            textZh: Gladiolus inandensis Baker 的 SANBI 物种条目记录了形态特征。
