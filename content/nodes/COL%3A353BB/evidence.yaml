          title: Desmodium molliculum (Kunth) DC., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Herb, stem repent to scandent from a perennial rootstock, stems densely patent pilose with long white trichomes; leaves trifoliolate, stipulate, petiolate; stipules obliquely ovate, acuminate, striate, ciliate, puberulent and pilose on the abaxial surface, becoming reflexed at maturity, long persistent, 4-5 mm long, 2 mm wide; petioles sulcate, patent pilose, ca. 1 cm long, the leaf rachis similar, ca. 2-5 mm long; stipels lance attenuate, ciliate, persistent, ca. 2 mm long; pe- tiolules stouter than the leaf rachis, densely pilose 1-1.5 mm long; leaflets ap- pressed pilose on both the surfaces, the terminal leaflet suborbicular, slightly retuse or mucronulate at the apex, rounded to cuneate at the base, to 1.5 cm long and wide, lateral leaflets slightly oblique, cuneate at the base, ca. 1 cm long and wide. Inflorescence generally erect, racemose, rachis ridged and grooved, dense- ly uncinulate puberulent to pubescent and with some pilosity; pedicels borne in pairs (or 3's), each pair subtended by a primary bract and each pedicel further subtended by a smaller secondary bract, all early deciduous; primary bracts ovate acuminate, striate, ciliate, and somewhat pilose, 3-5.5 mm long and 1.5-2.5 mm wide; secondary bracts linear, ciliate, puberulent on abaxial surface, ca. 1 mm long and 0.2-0.5 mm wide; pedicels ascending, densely uncinulate puberulent, to ca. 1 cm long. Flowers with the calyx bilabiate, puberulent throughout, the central tooth of the lower lobe long acuminate and long pilose, 2.5-4 mm long, lateral teeth acute, only slightly pilose, 2-3 mm long, the upper slightly bifid lobe 2-3 mm long; standard obovate retuse, cuneate at the base, 5.5-6 mm long, 3-4 mm wide, the wings oblong, obtuse and truncate at the apex, unguiculate, 5-6 mm long, 1.5 mm wide, the keel petals scythe shaped, obtuse and truncate at the apex, long unguiculate, 6.5 mm long, 1.5 mm wide. Loment stipitate, to 5-artic- ulate, the articles curved above and below, the isthmi slightly eccentric, uncin- ulate pubescent throughout, to 5 mm long and 3.5 mm wide. Seed suborbicular to quadrate, 2 mm long, 1.5 mm wide.
