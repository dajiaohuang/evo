        claims:
          - text: Perennial, rhizomatous (rhizomes short and creeping) or tufted (densely), up to 1.2 m high. Leaf blades 100-450 mm long, l,5-7.0(-0.0) mm wide, linear, finely plicate, flat or inrolled. Culm nodes glabrous. Spikelets 2.0-3.5 mm long. Panicle open or loosely contracted; bristles solitary; lower glume 3-nerved; lower lemma rugose.
