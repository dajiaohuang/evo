    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Perennial herb, up to 1 m high. Inflorescence rhachis drooping, 60-250 mm long. Spikelets 5-7(-8) mm long. Glumes tawny, glabrous or glabrescent, pale stramineous with faint reddish streaks.
            textZh: Scleria welwitschii C.B.Clarke 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_11118_0
            locator: "SANBI/WFO archive Morphology row 3432; source identifier 11118.0; cited publication: Herman, PPJ; Retief, E. 1997. Plants of the northern provinces of South Africa: Keys and diagnostic characters. Strelitzia 6: 1 - 681. National Botanical Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Perennial with annual aerial parts. This species is morphologically similar to S. rehmannii C.B.Cl. and S. longispiculata Nelmes. All three species have ± horizontal, woody rhizomes; that of S. welwitschii is reddish, those of S. rehmannii and S. longispiculata pale stramineous. The inflorescences of S. welwitschii and S. rehmannii are simply glomerate-spicate or, in S. welwitschii and less often in S. rehmannii with one or a few lateral branches from the proximal glomerules, whereas that of S. longispiculata is unbranched. The inflorescence of S. welwitschii is lax and drooping, those of S. rehmannii and S. longispiculata are rigid, ±erect. Spikelets of 5. welwitschii are 5-8 mm long; of S. rehmannii 4-5 mm long; of S. longispiculata 8-9 mm long. The glumes of S. welwitschii are fulvous-stramineous or castaneous; of S. rehmannii wholly or partly blackish-red; of S. longispiculata light castaneous. Achenes of S. welwitschii and S. longispiculata are smooth; those of S. rehmannii smooth or lightly tuberculate. Achenes of S. welwitschii and S. rehmannii are grey or light brown; of S. longispiculata brown with the stipe black. Achenes of S. welwitschii and S. rehmannii are ± 2 mm long; those of S. longispiculata ± 4 mm long.
            textZh: SANBI 条目提供了 Scleria welwitschii C.B.Clarke 的鉴别特征。
