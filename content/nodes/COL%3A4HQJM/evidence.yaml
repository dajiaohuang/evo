        usage:
          title: Picramnia latifolia Tul., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Slender shrubs or small trees, 3.5-7 m high; branchlets appressed-puberulent, becoming glabrate. Leaves alternate, pinnate, 21-32 cm long; petiole and the rachis sparingly appressed-puberulent, becoming glabrate; leaflets (3-)6-8(-9), mainly an odd number, alternate, ovate to elliptic or oblong, obtuse or acute and abruptly acuminate apically, rarely retuse, acute and slightly inequilateral basally, the margins entire, revolute, chartaceous, the blade sparingly appressed-puberu- lent, especially basally, becoming glabrate, 4-17 cm long and 2-8.5 cm wide, the petiolules sparingly pubescent to glabrate, 3-4 mm long. Staminate racemes axillary, aggregated, simple or rarely branched basally, densely-flowered, minutely yellowish appressed-puberulent, 10-21 cm long. Staminate flowers 5-merous, numerous, 1-3 together in clusters, white or green, the pedicels minutely yellowish appressed-puberulent, to ca. 1 mm long; calyx cup-shaped, 5-lobed, minutely yellowish appressed-puberulent, ca. 1 mm high, the lobes ovate-triangular; petals 5, elliptic, acuminate, glabrous, longer than the calyx-lobes, 1 mm long; stamens 5, exserted, the filaments filiform, glabrous, inserted at the bases of the petals be- tween the ovary-lobes, more than twice as long as the calyx, ca. 2-3 mm long; ovary conical, 5-lobed, tomentose apically, ca. 1 mm high, the style and stigma absent. Carpellate racemes aggregated, appressed yellowish-puberulent, to 23 cm long in flower, to 65 cm long in fruit. Carpellate flowers 5-merous, whitish, the pedicels appressed yellowish-puberulent, ca. 1 mm long; sepals 5, triangular, appressed yellowish-puberulent, persistent and spreading in fruit, ca. 1.5 mm long; petals 5, ovate, shorter than the sepals, ca. 1 mm long; stamens absent; disc annular; ovary ovoid, densely appressed-puberulent, 1-2 mm high, the style bilobed, the lobes recurved and persisting in fruit. Berries pink to bright red, yellow, or orange, ellipsoidal to globose, minutely appressed-puberulent, 2-3- loculed, to 1 cm long; seeds 1(-2-3).
