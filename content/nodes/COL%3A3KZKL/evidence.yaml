    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Stiffly hairy shrublet to 50 cm, often much branched from base. Leaves narrowly oblong, slightly toothed, white-tomentose beneath. Flowers in lax, terminal clusters on wiry branches, yellow.
            sourceIds:
              - sanbi_14353_0
            locator: "SANBI/WFO archive Morphology row 8423; source 14353.0; publication: Manning, JC; Goldblatt, P. 2012. Malvaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 613 - 621. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: This species is characterized by the narrowly oblong leaf-blade sometimes narrowing slightly towards the base, but with the base rounded, not cuneate into the petiole, the white-tomentose undersurface and the sinuate-crenate, slightly recurved margins which form a narrow dark rim around the undersurface, by the long, lax, terminal paniculate cymes with long slender peduncles and pedicels, and the usually broad-based stipules and bracts. A fourth characteristic, found on the types and other specimens from the western Cape, namely the tubercle-based, long, bristle-like hairs borne laxly on most parts of the plant, seems to be replaced in specimens from northerly (Namaqualand) and more easterly regions by a denser stellate pubescence of short hairs (character displacement ?). H. muricata is close to the not very well known species H. repetenda, which is a more erect plant with usually broader, obovate or broadly oblong-ovate leaves cuneate in the lower third, not narrowly oblong and narrowed towards the rounded base as in H. muricata.
            textZh: SANBI 条目提供了该种的鉴别特征。
