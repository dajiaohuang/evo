  claims:
    - subjectId: event:junggarsuchus-skull-consolidation
      claimKind: scientific
      claimType: morphology
      statement: Articulated specimen IVPP V14010 preserves a nearly complete Middle Jurassic skull with several crocodylian-like consolidations alongside a gracile terrestrial postcranium; functional and phylogenetic interpretations do not make it a directly observed crown ancestor.
      confidence: medium
      confidenceRationale: The articulated skull and anterior skeleton provide strong anatomical evidence. Medium confidence separates those observations from cursorial function and the sampled topology.
      referenceLinks:
        - referenceId: clark-2004-junggarsuchus
          relation: supports
          pages: 1021–1024
          figure: Figures 1–3
          quoteLocator: Holotype and locality; Description; Phylogenetic analysis
  claim-rationales.zh:
    - 关节连接的头骨和前部骨架提供扎实解剖证据；中等置信度把这些观察与奔跑功能和取样拓扑分开。
  claim-statements.zh:
    - 关节连接的 IVPP V14010 保存近完整的中侏罗世头骨，其中若干加固特征类似鳄类，身体则纤细并适于陆生；功能和系统解释并不使其成为直接观察到的冠群祖先。
