          originalSourceText: beneath, a tuft of hair in the axils, membranaceous; petioles ca. 5-9 mm long. Inflorescences spicate, thyrsiform near the base, terminal or axillary and opposite, to ca. 6 cm long. Flowers + sessile; calyx lobes deltoid, somewhat keeled, ca. 2.5-3.5 mm long, the margins fimbriolate, bearing 1-2 squamallae within; corolla subcampanulate, white, glabrous externally, the tube ca. 2 mm long, densely pubescent within, the lobes oblong, ca. 4 mm long; stamens wholly exserted, the filaments ca. 2 mm long, the anthers ca. 2 mm long; ovary apocarpous basally, syncarpous above, pubescent, the nectaries ca. 5, shorter than the ovary, the stigma pentagonal. Follicles ? united, continuous, scabrous, ca. 17 cm long; seeds ca. 1 cm long, the testa pubescent.
