    identity:
      method: The pinned COL26.8 registry row for 8P9GS was verified as accepted rank=species, full scientific name and authorship, and sourceDatasetId 2144. The COL-ID row in the pinned ITIS 2026-08-26 mammal crosswalk was then checked for an accepted exact normalized binomial match, valid ITIS usage, and TSN 947108; no name-only fuzzy match was used.
      scope: This confirms the versioned nomenclatural usage link between COL26.8 and the ITIS authority record. It does not independently establish full biological species-concept equivalence across studies.
