    facets:
      morphology:
        status: partially-supported
        claims:
          - text: The study examined 3 adult Molossus specimens and reports a mean forearm length of 36.76 mm, classified as small under its stated length bands. The sample is restricted to adults and this single quantitative size indicator; it does not establish the species’ full morphology or sex- and age-related variation.
            originalLanguage: en
            sourceIds:
              - plos-molossus-2025
            locator: Methods > Taxonomic sampling (adult sampling criteria and species sample sizes); Results > Variability of sizes and shapes in Molossus, paragraph beginning “The species also differ in forearm measurements”.
            placeTimeScope: Adult specimens included in the 2025 study’s Neotropical sample; species-level specimen localities were not abstracted here. Forearm length is reported in millimetres as a proxy for body size, using the authors’ size categories.
            lifeStatus: Study specimens only; the paper does not provide a complete wild, captive, or domesticated status audit for every specimen.
        gaps:
          - Sex-specific values, age beyond the adult-only criterion, geographic variation, diagnostic characters, and a complete species-level character account were not assessed.
      lifeHistory:
        status: not-assessed
        claims: []
        gaps:
          - The study does not investigate life cycle, reproduction, development, seasonal timing, or behavior for this species.
      ecology:
        status: not-assessed
        claims: []
        gaps:
          - The article gives genus-level context about insectivory and possible ecological drivers; species-specific diet, habitat, and interaction evidence for this taxon was not abstracted or assessed.
      evolution:
        status: partially-supported
        claims:
          - text: The mitochondrial COI + cyt b tree recovered M. milleri as sister to M. verrilli, with low branch support; the authors estimate that divergence in the Pliocene.
            originalLanguage: en
            sourceIds:
              - plos-molossus-2025
            locator: Results > Phylogeny and phylogenetic signal; Fig. 6 (Bayesian tree inferred from mitochondrial COI and cytochrome b sequences).
            placeTimeScope: The study’s sampled Molossus tree, based on mitochondrial COI and cytochrome b; clade support and sampling are as reported by the authors. This is one study’s phylogenetic result, not a synthesis of all available evidence.
            lifeStatus: Evolutionary inference for the nominal species in the study’s sampled tree; no population-level or fossil-specimen claim is made.
        gaps:
          - Nuclear-genome, population-level, and broader comparative phylogenies were not reviewed; no independent replication or conflict search was performed.
      distribution:
        status: not-assessed
        claims: []
        gaps:
          - The paper’s Neotropical sample is not a species-level range treatment. Specimen localities, native or introduced status, range boundaries, and sampling completeness were not abstracted.
      fossil:
        status: not-assessed
        claims: []
        gaps:
          - No species-level fossil record search was performed. The paper uses a fossilized birth-death calibration in its genus-level phylogeny, which is not evidence of fossils assigned to this species.
      conservation:
        status: not-assessed
        claims: []
        gaps:
          - No current global or national conservation assessment search was performed; no risk category is inferred.
