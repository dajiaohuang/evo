    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Annual or short-lived perennial up to 30 mm high; culms often branched, eglandular. Leaf blade 10-35 x 1.0-1.5 mm, usually involute, lower surface often with long bulbous based hairs, margins scabrid, eglandular. Inflorescence open, lowest branches not whorled, glabrous to hairy in axils (sometimes on same inflorescence); branches and pedicels with sunken glands; a gland is always present on branch just below junction of spikelet pair and one midway on each pedicel. Spikelet 3-4 x ±1.0-1.3 mm; rachilla persistent below, fragile above; lemmas disarticulating from the base upwards; glumes subequal, reaching 1/2-3/4 up lemma above; lemma 1.5-2.4 mm long, keeled, lateral nerves distinct, glabrous, subacute; palea persistent, keels slender, scaberulous, wingless, margins wide apart; anthers 0.6-0.8 mm long; caryopsis broadly elliptic.
