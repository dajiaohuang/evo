      ecology:
        status: partially-supported
        claims:
          - text: In the holotype population, plants were growing in the shady understory of a montane forest dominated by Podocarpus latifolia (Thunb.) Mirb. and Carissa bispinosa Desf. Other accompanying observed species were Celtis africana Burm. f., Carex spicato-paniculata C. B. Clarke, Schoenoxiphium lehmannii (Nees) Steud., Dietes iridioides (L.) Klatt and Blechnum giganteum Schltdl. The habitat in the paratype population appears to be similar, with plants found in damp and shady places in a forest.
