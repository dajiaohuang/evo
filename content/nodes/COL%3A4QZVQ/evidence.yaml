    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Small, leafless succulent forming clumps to 15 cm, tubercles on stems hardened into spreading teeth, arranged in 4(5) angles; sap clear. Flowers campanulate, cream-coloured, petals shortly adpressed-hairy.
            sourceIds:
              - sanbi_14102_0
            locator: "SANBI/WFO archive Morphology row 9769; source 14102.0; publication: Bruyns, PV. 2012. Apocynaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 331 - 343. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Plants of Q. aurea are indistinguishable from those of the various southern forms of Q. incarnata and form clumps up to 300 mm in diameter with relatively stout stems, where many of the tubercles bear small, stipular denticles. As in most species in this section, the flowers are produced in large numbers towards the tips of the stems on ‘peduncular patches’ and they are borne on very short pedicels. The flowers themselves are rather pretty. Inside they are cream towards the tips of the lobes with this colour becoming fainter and tending to white in the centre. The fairly narrow lobes spread out (but not fully against the stem) and there is a shallow, broadly V-shaped corolla tube from which the tips of the outer corona lobes usually project. The inner surface is covered with short bristles, though this is only clearly visible under a microscope. The flowers emit a sharp and sourish honey-like scent. The comparatively large corona, which is almost entirely contained in the corolla tube, is bright yellow. It consists of outer lobes which are almost erect and divided into deltoid lobules, and inner lobes which cover the anthers and are slightly dorsally swollen.
            textZh: SANBI 条目提供了该种的鉴别特征。
