  claims:
    - subjectId: event:rongxi-fanjingshania-dermoskeleton
      claimKind: scientific
      claimType: event-mechanism
      statement: Fanjingshania renovata from the late Aeronian Rongxi Formation at approximately 439 Ma is represented by holotype IVPP V27433.1 and more than one thousand isolated dermal elements; tomography of IVPP V27433.8–12 and V27434.2 shows a stem-chondrichthyan shoulder spine–plate complex formed through multiple growth centres and cyclical bone-and-dentine resorption, without an articulated body or associated dentition.
      confidence: medium
      confidenceRationale: The original description fixes the material and horizon, and the later open-access tomography study directly images cement lines, resorption and tissue replacement across several referred elements. Medium confidence retains the disarticulated association, analogical full-body reconstruction and the prohibition on synonymizing co-occurring Qianodus teeth.
      referenceLinks:
        - relation: supports
          referenceId: andreev-2022-fanjingshania
          pages: 969–974, especially pp. 970–972
          figure: Figures 1g, 2a–c and 3; Extended Data Figures 1 and 4c
          quoteLocator: "Systematic palaeontology: holotype, referred material, locality and horizon; Discussion"
        - relation: supports
          referenceId: andreev-2025-fanjingshania-shoulder
          pages: 2–6
          figure: Figures 1–3, especially Figure 2
          quoteLocator: "Results: structure and development; Discussion: dermal skeletal remodelling"
  claim-rationales.zh:
    - 原始描述固定了标本材料与层位，后续开放获取的断层成像研究在多件归入标本中直接显示了胶结线、吸收和组织替换。中等置信度保留离散材料关联、整身复原的类比性质，并禁止把共存黔齿鱼牙旋直接并入该类群。
  claim-statements.zh:
    - 约 439 Ma 晚埃隆期融溪组的 Fanjingshania renovata 由正模 IVPP V27433.1 和一千余件孤立皮骨骼元件代表；IVPP V27433.8–12 与 V27434.2 的断层成像显示，其软骨鱼干群肩部棘—板复合体由多个生长中心以及骨和牙本质的周期性吸收形成，但尚无关节相连躯体或伴生齿列。
