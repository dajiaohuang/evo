        claims:
          - text: Densely branched succulent shrub, up to 400 mm tall. Leaves heterophyllous, first leaf-pair 10-30 x 5-8 mm, free parts tongue-shaped to triangular, second leaf-pairs connate for 4/5 of its length, forming a corpuscle, corpuscle thicker than the stem bearing it, round to oval in diam. Flowers with white petals, suffused with pink. Fruit stalk not corky basally.
