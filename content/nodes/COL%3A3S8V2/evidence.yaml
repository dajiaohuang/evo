    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, 100-180 mm tall, branching from base, corm tunics brown, margins with short, down-pointed teeth, deeply buried, with cormlets at underground nodes, stem compressed and minutely serrate on wings. Leaves linear, ribbed. Flowers in a lax, few-flowered spike, white with red markings on lower tepals, red-brown on outside, perianth tube elongate-cylindrical, tepals narrow, spreading. Late Aug.-Sept.
            textZh: Lapeirousia simulans Goldblatt & J.C.Manning 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_14562_0
            locator: "SANBI/WFO archive Morphology row 33284; source identifier 14562.0; cited publication: Goldblatt, P; Manning, JC. 2013. Iridaceae. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 94 - 124. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: The flowers in L. simulans and L. arenicola are so similar in tube length and general size and markings that they can be distinguished only with difficulty, and their flowering times overlap although that of L. simulans is generally somewhat later in the season, usually mid- to late September, by which time the last flowers of L. arenicola are often depauperate, and have shorter tubes and duller colouring than earlier in the season. The two species are most readily distinguished by the underground part of the stem. The corms of L. arenicola lie 35-55 mm below the surface on a straight stem that lacks axillary cormlets but the underground stem of L. simulans is 55-85 mm long so that the corm lies at a greater depth than in L. arenicola, and each of the two underground nodes consistently bears a large cormlet.
            textZh: SANBI 条目提供了 Lapeirousia simulans Goldblatt & J.C.Manning 的鉴别特征。
