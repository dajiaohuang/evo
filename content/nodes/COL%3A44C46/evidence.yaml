    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, 18-40 cm. Leaf solitary, linear, channelled, glaucous, clasping stem below. Flowers yellow or salmon with a yellow centre, tepals often with a large green mark, tepal claws forming a wide, shallow cup, filaments included, intensely fragrant.
            textZh: Moraea comptonii (L.Bolus) Goldblatt 的 SANBI 物种条目记载了植株、叶片和花部形态。
            sourceIds:
              - sanbi_13878_0
            locator: Strelitzia 29; archive Morphology row 7391, source 13878.0
            placeTimeScope: Regional species account published 2012; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
          - text: Large-flowered Moraea comptonii is distinguished by the fiddle-shaped to spathulate tepals weakly divided into claw and limb, with the lower halves forming an open cup and upper halves spreading. The flowers are particularly strongly and sweetly scented and either entirely yellow, or salmon-pink to orange with a yellow cup, often with dark green markings in the lower third. Like its close relative M. elegans, plants have a solitary leaf, a partly to fully included ovary, and the inner rhipidial spathes become enlarged to enclose the developing capsules. Also like M. elegans, the filaments are fully united in a column tapering from a wide base but the anthers are usually shorter than the style branches in contrast to M. elegans, in which the anthers exceed the style branches. Another difference between the two is that the tepals of M. elegans are more-or-less ovate, widest in the lower third, and the tepal markings are confined to the outer tepals in the upper third, whereas tepals of M. comptonii are widest in the distal third and are either unmarked or have markings at the bases of the tepal limbs of both whorls.
            textZh: SANBI 条目提供了 Moraea comptonii (L.Bolus) Goldblatt 的鉴别特征。
            sourceIds:
