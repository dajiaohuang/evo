        usage:
          title: Minquartia guianensis Aubl., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Trees to 30 m. tall, the young branches angular, glabrous. Leaves elliptic, 8-16 cm. long, 3.0-7.5 cm. broad, abruptly and briefly acuminate at the apex, rounded or obtuse at the base, chartaceous, glabrous, the costa emersed above and below, the primary lateral nerves numerous, conspicuous; petiole 5-23 mm. long, broadly canaliculate. Inflorescence spicate, rusty-tomentulose, the rhachis elongat- ing to 5 cm. long, the flowers sessile, subtended by small ovate bracts. Calyx cupuliform, about 1 mm. long, 1.5-2.0 mm. in diameter, 5-toothed, rusty- tomentulose without; petals 5, connate into a campanulate corolla tube, the tube 1.0-1.5 mm. long, tomentulose without, black-punctate within, the lobes 1.0-1.5 mm. long, 1 mm. broad, villous within; stamens 10, inserted just below the orifice, the alternipetalous inserted slightly lower than the antipetalous, the anthers broader than long, minute, the filaments about 0.5 mm. long, glabrous; ovary globose, about 1.5 mm. in diameter, densely rusty-tomentulose, the style short. Immature drupe ellipsoid, about 7 mm. long, 4 mm. in diameter.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 8578
