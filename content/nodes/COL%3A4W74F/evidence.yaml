    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Rhizomatous suffrutex, 0.6-1.0 m high. Branching dichotomous, branches erect, grey, lenticellate, branchlets stiff, glabrous, dark brown. Leaves ascendent, trifoliolate, petiolate; petiole rigid, semiterete, shallowly canaliculate above, slightly winged, (11-)20(-30) mm long; leaflets sessile, coriaceous, glabrous, slightly discolorous, olive-green above, grey to yellowish green below, hypostomatous; lamina linear to lanceolate, sometimes ternunally falcate, apex subacute, mucronulate, margin entire, slightly thickened; venation brochidodromous to semicraspedodromous, midrib prominent above and below, other veins prominent above, less so below; terminal leaflets (40-)80(-100) x (4-)(8)(-11) mm, lateral leaflets (30-)52(-70) x (3-)6(-9) mm. Panicles much branched, axillary and terminal, latter up to 90 mm long, exposed. Flowers normal, disc circular to slightly 5-crenulate, styles separate, rarely 4. Drupe obloid, glabrous, shiny, light brown, 3.2 x 2.0 to 4.2 x 2.6 mm.
            sourceIds:
              - sanbi_9808_0
            locator: "SANBI/WFO archive Morphology row 48213; source 9808.0; publication: Moffett, RO. 1993. Rhus, Fl. S. Africa 19(3,1): 1 - 123. National Botanical Institute, Pretoria. [http://www.biodiversitylibrary.org/item/209553#page/1/mode/1up]. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: As a suffrutex it survives the periodic fires these grasslands are subject to. This habit, together with its ascendent foliage, serves to separate it from the arborescent R. lancea which does not occur in Natal. R. kwazuluana is very similar to R. magalismontana subsp. trifoliolata differing mainly in leaf anatomy.
