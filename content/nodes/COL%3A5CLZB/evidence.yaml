          title: Xylopia aromatica (Lam.) Mart., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: A tree; young branchlets tomentose. Leaves large, 8-15 cm. long and 2.0-4.5 cm. broad, rigid, lanceolate or elliptic-lanceolate, gradually narrowing at the apex, rounded or shortly acute at the base, glabrous on the upper side from the first except on the midrib, covered underneath with short patent or appressed hairs or even glabrous, glaucous; petioles 3-6 mm. long. Flowers numerous in axillary inflo- rescences; flower buds long and narrow, trigonous, densely sericeous. Calyx cup- shaped, with almost wholly connate sepals. Outer petals linear, up to 30 mm. long and 2-3 mm. broad; inner petals a little shorter, about 1 mm. broad. Stamens 1.0-1.5 mm. long. Carpels very numerous (about 25). Monocarps cylindric, toru- lose, 2.0-2.5 cm. long and 6-7 mm. thick. Seeds about 6, ovoid, black, 5-6 mm. long.
