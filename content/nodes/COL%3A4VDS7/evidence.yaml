        usage:
          title: Schlegelia parviflora (Oerst.) Monach., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Woody vine; stem without phloem arms in cross section; branchlets terete, glabrous, without interpetiolar ridges or glandular fields. Leaves opposite, simple, obovate to elliptic-obovate, apically rounded to acute, basally cuneate, 11.2-19.5 cm long and 4.8-14.7 cm wide, coriaceous, secondary veins 6-8 on a side, minutely lepidote at least beneath, otherwise glabrous with a glandular field near the base of the blade below, drying olive to olive brown, the petiole 1.0-2.4 cm long. Inflorescence a few- to many-flowered axillary, more or less contracted, sometimes almost fasciculate panicle, the branches puberulous with small bracts, 1-2 mm long, subtending many of its dichotomies, these more or less short-puberulous at least along the margins. Flowers with the calyx cupular with 2-3 round-tipped lobes, 4-6 mm long and 3-5 mm wide, incon- spicuously lepidote or subpuberulous at least at the base, usually drying tan; corolla white or cream flushed with pink, tubular with reflexed lobes, 1.0-1.2 cm long and 0.4 cm wide at the mouth, the tube 0.6-0.8 cm long, the lobes 0.4-0.6 cm long, glabrous outside, the lobes glandular-lepidote to glandular- puberulous inside, the tube scattered pubescent in the upper half inside, glab- rous below the level of stamen insertion; stamens more or less equal, the anther thecae thick, slightly divergent, 1 mm long and almost 1 mm wide, the filaments 4 mm long, the bases swollen and pubescent, the staminode 2-3 mm long, inserted 4 mm from the base of the corolla tube; pistil 3-4 mm long, the ovary spherical, 1.5-2 mm long and 2 mm wide, glabrous, the ovules multi- (ca. 8-)seriate on a central placenta in each locule; disc absent. Fruit a spher- ical, fleshy berry, 0.9-1.1 cm in diameter, glabrous, the lower part covered by the persistent calyx; seeds angular, ca. 2 mm long, less than 1 mm wide.
