        usage:
          title: Digitalis purpurea L., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Perennial herbs to 1.5 m tall, stems sometimes stout, glabrate or scurfy pubescent with greyish arachnoid hairs, drying sulcate. Leaves alternate, 8-15 cm long (lower leaves sometimes much larger), elliptical or obovate, apically acute, obtuse or rounded, basally obtuse, narrowed into the winged petiolar area, the margins crenate serrate with numerous blunt teeth, pinnately veined with ca. 4 veins on each side, glabrate above, pilose beneath with whitish hairs, especially on the veins; petiole winged, 5-15 mm wide, 3-8 cm long, often exceeding the blades, basally clasping and concaulescent on the stem. Inflores- cence a secund raceme to 30 cm long, the numerous flowers evenly spaced, the peduncle pilose or glabrate, the pedicels pilose, ca. 1 cm long, subtended by an ovate, pubescent bract. Flowers showy, fragrant, the calyx 5-lobed to the base, the lobes oblong, elliptical or ovate, apiculate, 12-18 mm long, glabrous to pubescent; corolla broadly campanulate, 3-5 cm long, somewhat zygomorphic with 4 short lobes, the lowermost slightly longer and deltoid, purple with brownish flecks on the lower side, glabrous outside, ciliolate, sparingly long pilose at the mouth within; stamens 4, straight, stout, the anthers alike, the thecae subequal, divaricate, basally connate, ovate, ca. 2 mm long; style slender, the stigma 2-lobed. Capsule ovoid conical, 12 mm long, 10 mm broad at the base, dehiscing septicidally, subtended by the wide-spreading calyx.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 12830
