    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Loosely tufted perennial 250-1200 mm high; rhizomes scaly; basal sheaths glabrous or silky hairy; culm nodes dark, glabrous. Leaf blade 50-300 x 2-7 mm. Inflorescence of 6-25 racemes 20-110 mm long, borne irregularly or in untidy whorls upon an elongated axis 40-200 mm long; rachis triquetrous, narrowly winged, glabrous to scaberulous, margins scaberulous; pedicel apex scaberulous; spikelets paired. Spikelet 2.0-2.9 x 0.8 mm; lower glume ovate-triangular, margins often membranous; upper glume 3/4 as long to equalling spikelet but narrower, 3-nerved, hairy; internode absent; lower lemma as long as spikelet, hairs slender and adpressed, 7-nerved, widest spacing either side of midrib, hairy especially between outer lateral nerves for the entire length of lemma; upper lemma ellipsoid, shorter than spikelet, partly exposed, light to dark brown; anthers 1.2-1.4 mm long.
