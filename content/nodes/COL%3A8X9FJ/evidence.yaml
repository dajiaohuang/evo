    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants 450-600 mm high, forming large clumps. Corm subglobose, 10-20 mm diam.; tunics finely netted, extending upward as a collar. Stem erect, simple. Leaves 3 to 5, lower 2 to 4 basal, ± as stem, linear, 3-5 mm wide, midrib lightly and margins moderately thickened and hyaline, sometimes dry and broken at flowering, uppermost leaf or leaves smaller and inserted on lower part of stem, partly or largely sheathing and becoming bract-like; bract-like cauline leaves 3 or more, inserted on upper part of stem, overlapping. Spike 6- to 15-flowered, internodes mostly 8-10 mm long; bracts green and herbaceous flushed purple, with brown papery margins, becoming dry and brown apically, (15-)20-25 mm long, not clasping stem, apiculate to attenuate, 2.0-2.5 internodes long, inner shorter and concealed, acute. Flowers zygomorphic, bright pink or purplish; perianth tube with lower part 13-15 mm long, included in bracts, upper part ascending to horizontal and funnel-shaped, 7-10 mm long, ± 6 mm diam. at mouth; tepals spreading distally, obovate, 13-15 x 5-6 mm. Filaments unilateral and arcuate, 10-12 mm long, exserted 3 mm from tube; anthers 6-7 mm long, purple. Style arching over stamens, dividing near apex of anthers, branches slender and not recurving, ± 5 mm long. Capsules and seeds unknown.
            textZh: Watsonia vicschuettei C.J.Potg. & I.M.Johnson 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Morphology row 97980; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: A slender species with small, dark pink, funnel-shaped flowers, linear leaves 3-5 mm wide, and simple, erect stems forming large clumps, distinguished from other pink-flowered species by its narrow, largely herbaceous bracts, (15-)20-25 mm long, not clasping the stem at the base. The flowers are among the smallest in the group, with the lower part of the perianth tube 13-15 mm long and the upper part 7-10 mm long, and are distinctive in having the filaments exserted ± 3 mm from the perianth tube, with short anthers, 6-7 mm long. The late summer flowering, in February and March, is also characteristic. Watsonia bella has similarly small flowers with short anthers but has shorter, dry brown bracts, (10-)12-16 mm long, clasping the stem in the lower part, and filaments included in the tube. Spring-flowering Watsonia inclinata and W. pondoensis have similar, largely herbaceous bracts 17-30 mm long but larger flowers with the lower part of the perianth tube 15-20 mm long, tepals 20-28 mm long, and included filaments with larger anthers, ± 9 mm long.
            textZh: SANBI 条目提供了 Watsonia vicschuettei C.J.Potg. & I.M.Johnson 的鉴别特征。
