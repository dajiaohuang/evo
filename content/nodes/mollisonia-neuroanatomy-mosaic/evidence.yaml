    - 重复的元素与位置观察支持神经组织解释，但前部解剖不完整且不同性状系统发生冲突。
  claim-statements.zh:
    - Mollisonia symmetrica 标本 MCZ 1811 与 USNM 305093 的碳质薄膜保存视神经、可能紧凑的头部融合神经节和分节腹神经索；保存不完整且附肢信号冲突，使祖先神经组织和干群位置仍有争议。
