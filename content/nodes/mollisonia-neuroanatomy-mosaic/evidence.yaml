      claimKind: scientific
      claimType: topology
      statement: Carbonaceous films in Mollisonia symmetrica specimens MCZ 1811 and USNM 305093 preserve optic nerves, a possible compact cephalic synganglion and a segmental ventral nerve cord; incomplete preservation and conflicting appendicular signal make ancestral organization and stem placement contested.
      confidence: contested
      confidenceRationale: Repeated elemental and positional observations support nervous-tissue interpretation, but anterior anatomy is incomplete and character systems conflict.
