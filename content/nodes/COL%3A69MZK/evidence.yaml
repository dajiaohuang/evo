          publishedAt: undated
          originalSourceText: Shrub to 3(-5), m tall; twigs glabrous. Leaves 12-20 cm long, ovate, elliptic or oblong, often oblique, apically mostly acute or acuminate, basally rounded or obtuse, the margins slightly revolute, above puberulent on the midvein and major lateral veins and with scattered, minute glandular hairs on the lamina, beneath with minute hairs on the major and minor veins, lateral veins 15-20 on each side, prominently elevated beneath, the surface often drying dark with a rugose surface; petioles puberulent, 2-3 mm long; minor leaves wanting. Inflorescences numerous, scattered along the stems, axillary and terminal racemes or small panicles on mostly unbranched, short or elongate, pubescent to glabrate axes to 4 cm long, leafy bracts scattered through the inflorescences; pedicels to 5 mm long, slender, drying black, the bracteoles linear, 1.5 mm long. Flowers fragrant, calyx 2-3 mm long, cyathiform or campanulate, puberulent, almost ecostate,
