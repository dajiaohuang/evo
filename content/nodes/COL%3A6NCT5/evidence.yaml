          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Herb to 2 m tall; stems fistulose, green, glabrate to viscid pubescent with straight hairs which dry white. Leaves ovate, entire or sparingly sinuate-dentate, apically acuminate, basally obtuse or narrowed, above glabrate, beneath sparingly pubescent along the veins, the petioles to ca. 5 cm long, often winged by the narrowed leaf base; minor leaves often present and as large as the majors. In- florescence an umbel on a slender, puberulent, unbranched peduncle, to 4 cm long, pedicels filiform, 1 cm long, to 3 cm long in fruit. Flowers mostly de- fleeted, calyx 2-3 mm long, lobed about halfway down, accrescent and becoming 1 cm long in fruit, with a conspicuous midvein, spreading and not enveloping the fruit; corolla yellow to greenish white, often with some greenish dots, 10-15 mm across, lobed about halfway, the lobes deltoid or obtuse; anthers ellipsoid, ca. 2 mm long; style expanded-capitate. Fruit a black mucilagineous berry, 8-10 mm across. Seeds many, compressed lenticular, ca. 1 mm long. Chromosomes n = 12.
