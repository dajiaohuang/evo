    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Herb, apparently annual but possibly sometimes perennial. Stems prostrate and ascending, up to 0.4 m high; young branches with sparse to dense erect stiff or sometimes curly hairs. Leaves broadly ovate to rhomboid, up to 40 x 22 mm but usually much smaller, almost glabrous above, with a few stiff hairs along veins below, apex bluntly acute, terminal tooth ± as long as broad, base broadly cuneate, margin crenate to bluntly serrate with 2-7 pairs of teeth; petiole up to 14 mm long but usually shorter; stipules broadly lanceolate, up to 2 x 1.5 mm, green, ciliate. Inflorescences bisexual and almost globular in upper axils, unisexual (female) only in lower axils; bisexual inflorescences pubescent or lanate on outside, densely lanate on inside, up to 2.5 mm in diameter. Achenes enclosed in markedly lanate involucre.
            sourceIds:
              - sanbi_6120_0
            locator: "SANBI/WFO archive Morphology row 48435; source 6120.0; publication: Friis, I; Immelman, KL. 2001. Urticaceae, Fl. S. Africa 9: 1 - 34. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Often confused in the literature with D. iners, but can easily be distinguished by the deep green leaves, the characteristic leaf shape, the crenate leaf margin and the usually almost globular bisexual involucres, which have a characteristic pale pubescent or lanate indumentum on the outer surface.
