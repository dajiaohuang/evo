        claims:
          - text: In small dense tufts, solitary or few together. Leaves in a compact basal rosette, numerous, erect, flat, 1-3 cm long, 2-3 mm wide, slightly widened towards the tip, sheathing at the base. Stipules caducous, very small, 1-1.5 mm long, entire or toothed at the sides, those of the cauline leaves longer with 1-2 projecting lateral teeth. Peduncle 2-4 cm long, with 1-2 partial whorls of leaves. Inflorescence forking below, pseudoracemose above; flowers few. Perianth segments 3-3.5 mm long, distinctly connate at the base. Disc of 3 broad obtuse lobes, white. Stigmas small, cylindrical, reflexed. Fruit rounded, distinctly longer than the perianth. Seeds few, black, shining, bordered.
