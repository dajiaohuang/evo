          title: Quararibea asterolepis Pittier, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Tree 10-25 m. tall, the trunk angular and sometimes buttressed, the crown ovate-rounded or pyramidal, the bark grayish and smooth, the young branchlets fimbrillate-lepidote. Leaves With a petiole 1-2.5 cm. long, often slightly arcuate, more or less densely fimbrillate-lepidote; blade oblong-lanccolate to elliptic, some- times slightly obovate, obtuse or rounded at the base, obtuse or caudate-acuminate at the apex, 7.5-25 cm. long and 3.5-10 cm. wide, subcoriaceous, slightly shining and glabrous to scatteringly fimbrillate-lepidote above, more or less densely fimbrillate-lepidote beneath, seldom glabrous, penninerved, the nerves prominent beneath. Flowers mostly oppositifolious, solitary, the pedicel 1-1.5 cm. long and ca. 0.2 cm. wide, densely fimbrillate-lepidote, bracteolate, the bracteoles ca. 1.25-2 mm. long, densely fimbrillate-lepidote, long persistent; calyx campanulate-conical, (3-)4(-5)-lobulate. ca. 1.1-1.4 cm. long and 0.6-1 cm. wide, densely fiimbrillate- lepidote without, appressed-sericeous within, the lobes triangular, more or less obtuse and ca. 3-4 mm. long; petals narrowly obovate, acute at the base, asym- metrically ernarginate at the apex, 2-2.6 cm. long and 0.5-0.6 cm. wide, whitish, shortly stellate-puberulous on both sides; staminal column cylindric, slightly en- larged near the apex, ca. 1.8-2 cm. long and 0.15 cm. wide, whitish, shortly and densely stellate-puberulous except the base, divided into 5 antheriferous, fleshy lobes ca. 2-3 mm. long, each lobe bearing 8 sessile anthers, the thecae paired, free or confluent at the apex and ca. 1.5 mm. long; ovary pyriform, glabrous, 2-celled; style filiform, slightly enlarged between the antheriferous lobes of the staminal column, up to 2.3 cm. long, densely fimbrillate-lepidote at the base to stellate- tomentellous at the apex; stigma shallowly bilobulate. Capsule ovoid to sub- globose, mammillate, up to 2 cm. in diam., densely and minutely fimbrillate- lepidote, 1-celled, the fructiferous calyx cupuliform; seeds up to 1.3 cm. long.
