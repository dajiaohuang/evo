    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Densely branched dwarf succulent shrublet to ±80 mm tall. Stems woody, branching from base, to 5 mm thick, internodes ochre to greyish, 4-6 mm long. Leaves basally connate, surface smooth, free parts spreading and somewhat trigonous in cross-section, acute without apical tooth or mucro, keels finely denticulate. Inflorescence 1-flowered, bracteoles embracing the base of the flower. Flowers to 27 mm diam., petals and filamentous staminodes cream-coloured, inner petals shorter than outer, filamentous staminodes collected into a cylinder around the stamens, all elements epapillate or the inner with few, short papillae. Fruits 6-locular, top convex with low rims, base funnel-shaped, closing bodies largish, valve wings broad, broadest at their middle, without additional closing devices below covering membranes, expanding keels broad and diverging towards top, not ending in awns. Seeds D-shaped, ±0.9 mm long, without a crest, pale, ochre coloured, almost smooth.
            sourceIds:
              - sanbi_7291_0
            locator: "SANBI/WFO archive Morphology row 104843; source 7291.0; publication: Klak, C. 2010. Three new species and two new combinations in the Aizoaceae from the Western and Northern Cape of So. S. African J. Bot. 76: 299 - 307. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
