          publishedAt: undated
          originalSourceText: Epiphytic shrub or liana, the main stems to 10 cm thick, the branches and branchlets becoming gray with age. Leaves chartaceous to thinly coriaceous, the petioles 2-6 mm long and 1.5-3.5 mm wide, flattened or slightly canaliculate above; blades elliptic, elliptic-oblong, or obovate, 1.5-2.5 times as long as wide, 7-15 cm long and 3.5-9 cm wide, obtuse or rounded or sometimes slightly acuminate apically, cuneate or sometimes subobtuse basally; the midrib slightly prominent above, prominent beneath, the lateral veins and the veinlets promi- nent, at least beneath, hypophyllous glands small, numerous, in a usually distinct row 3-10(-15) mm from the margin. Inflorescences multiflorous racemes, the rachis 10-15 cm long; nectaries tubular, straight or slightly curved, with a more or less conspicuous longitudinal groove, 5-8 mm long, 1-1.5 mm in diameter, the apex often globose, the orifice with a subauriculate rim. Flowers small, fra- grant, the pedicels 6-12 mm long and to ca. 1 mm in diameter; bracteoles suborbicular, ca. 1 mm long and ca. 2 mm wide; sepals suborbicular, 1-1.5
