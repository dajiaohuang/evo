          - text: Perennial, dwarf shrublet, up to 0.3 m high, stems smooth, much-branched. Leaves compressed-subterete, obtuse, recurved at apex, bladder cells fine, glassy. Flowers in rich cymes, pale magenta. Flowering time Nov.? Capsules 5-locular, covering membranes complete, closing bodies absent, expanding keels diverging at apex, valve wings broad.
