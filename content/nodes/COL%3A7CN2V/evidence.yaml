        usage:
          title: Trattinnickia burserifolia Mart., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Tree, to 30 m high; branchlets dark, puberulent, provided with lanceolate grayish lenticles. Leaves 18.5-28 mm long; petioles minutely puberulent, thick- ened basally, 3.5-7.5 cm long; leaflets 5-11, oblong to elliptic, the laterals inequilateral, abruptly acuminate, narrowly cuneate basally, the margins entire, coriaceous, glabrous, smooth and lustrous above, duller beneath, 7-12 cm long and 3-4 cm wide, the lowermost pair smallest; petiolules striate, minutely puberu- lent, the laterals 3-6 mm long, the terminals to 12 mm long. Inflorescences axil- lary or subterminal thryses, branched from the base, puberulent, the branches spreading, 7-13 cm long in fruit. Flowers with the pedicels puberulent, 2-3 mm long in fruit; "3-merous, 3-4 mm long and 2-2.5 mm in diam. Calyx cupu- liform, nearly half as long as the flower; its lobes triangular, obtuse, as long as the tube. Corolla tubular, outside papillose, inside glabrous but near the apex provided with some hairs, carnose, red; its lobes ovate-triangular, acute, about as long as the tube. Stamens in the masc. fi. as long as the tube of the corolla, in the fem. fi. shorter; filaments very short, much dilated; anthers elliptic, apicu- late. Disc annular, 6-lobed, glabrous, 0.25 mm high. Pistil glabrous, in the masc. fi. forming with the disc a hardly 1 mm high cone, in the fem. fi. 2 mm high; ovary conical ovoid, 1.5 mm high; stigma 2-lobed, sessile." Fruits globose, gla- brous, the exocarp brown, thin, slightly wrinkled, 6-7 mm in diameter.
          originalLanguage: en
          sourceField: general
