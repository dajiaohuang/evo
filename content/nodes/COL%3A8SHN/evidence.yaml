        usage:
          title: Acalypha villosa Jacq., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrub or small tree 2-8 m high; monoecious or dioecious; stems villose with ? appressed hairs. Leaves with slender villose petioles 3-12 cm long; stipules linear-lanceolate to subulate, pubescent, 2.5-4 mm long; blades membranous, ovate to ovate-lanceolate, acuminate, mostly rounded to subcordate at the base, generally 8-15 cm long, 5-9 cm broad, above strigose or glabrate, beneath sparsely to densely villose and dotted with small (0.05-0.1 mm) shining resinous droplets, 5-nerved at base but pinnately veined above (veins ca 6-8 on a side), the margins coarsely crenate-dentate (25-35 teeth on a side). Inflorescences unisexual, axillary; 9 flowers in slender racemes ca 5-15 cm long, with ca 10-40(-60) flowers, short pedicellate; 6' flowers in spikes ca 3-8 cm long, 1-2 mm thick, rather loosely flowered and becoming more or less interrupted proximally, sessile or with peduncles ca 1-2.5 cm long. Pistillate flowers solitary; bracts very small, scarcely more than 0.5 mm long, pubescent; pedicels 1-1.3 mm at anthesis, attaining 1-3 mm in fruit; calyx- lobes 5, lanceolate, 0.6-0.8 mm long, pubescent; ovary densely verrucose and dotted with resinous droplets, the styles free, basally verruculose, 2-2.5 mm long, distally laciniate into ca 5-10 narrow segments. Capsules ca 2 mm broad, densely verrucose with greenish processes and hispidulous; seeds plumply ovoid (nearly globose), slightly beaked apically, light brown, smooth (minutely foveolate), ca 0.9-1.1 mm long, the caruncle nearly obsolete.
