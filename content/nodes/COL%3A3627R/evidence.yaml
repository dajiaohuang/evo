    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous herb, up to 1.5 m high. Coflorescences (1-) 3-6. Lowermost peduncles mostly 90-230 mm long. Bracts reddish brown, paler towards shoulders, main veins 4 or 5 each side of midvein. Flowers magenta-pink to deep wine-red.
            textZh: Dierama mobile Hilliard 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_11118_0
            locator: "SANBI/WFO archive Morphology row 1666; source identifier 11118.0; cited publication: Herman, PPJ; Retief, E. 1997. Plants of the northern provinces of South Africa: Keys and diagnostic characters. Strelitzia 6: 1 - 681. National Botanical Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Endemic to Mpumalanga and Eswatini, occurring as solitary plants or small tufts up to 1500 mm tall, with relatively small, magenta-pink to deep wine-red flowers, the perianth 16-20 mm long, and lateral spikes borne on strikingly long peduncles, usually 90-230 mm long. The bracts have 4 or 5 veins each side of the main vein. Dierama pictum has similar flowers but the plants are mostly shorter, usually barely up to 1000 mm tall, with shorter peduncles 60-125 mm long, and dark brown bracts with sharply contrasting white shoulders and 6 to 8 veins each side of the main vein. The two species may hybridise in Eswatini.
            textZh: SANBI 条目提供了 Dierama mobile Hilliard 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 94770; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
