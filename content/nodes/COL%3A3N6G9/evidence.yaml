    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Glabrous creeping herbs with slender stems, rooting at the nodes. Leaves peltate (very rarely with a deep narrow sinus extending to the petiole), on long petioles which may exceed 30 cm; lamina up to 12 cm in diameter, circular to broadly elliptic, with 12-20 veins radiating from the petiole; margin often shallowly lobed, the lobes with small secondary crenulations. Inflorescence a proliferous umbel on a long slender peduncle which exceeds the subtending petiole. Umbel rays 5-7. When fully expanded, each ray forming a verticillate raceme, with the fruit in interrupted whorls. Bracteoles lanceolate-acute, in whorls under each whorl of flowers. Pedicels slender, 1-20 mm long; petals white to cream. Fruit ellipsoid, flattened laterally, base cordate, stylopodium depressed to obsolete, styles c. 1 mm long; commissure not strongly constricted, dorsal and lateral ribs well developed and quite acute in section; pericarp reddish-brown and slightly wrinkled when mature.
            sourceIds:
