    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Perennial, densely tufted, up to 2 m high. Leaf blades up to 650 mm long, up to 5 mm wide, leaves flexible, some leaf auricles with long woolly hairs. Lower culm internodes glabrous or pubescent to woolly-hairy. Spikelets 35-50 mm long (including awns). Inflorescence oblong to broadly oblong, symmetrical, large, up to 800 mm long and over 200 mm wide, much-branched; lower glume less than two-thirds the length of the upper; lemma articulation between apex of lemma and base of column; column 8-20 mm long; awns 3, subequal; callus tip naked, deeply bifid.
            textZh: Aristida meridionalis Henrard 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_11118_0
            locator: "SANBI/WFO archive Morphology row 305; source identifier 11118.0; cited publication: Herman, PPJ; Retief, E. 1997. Plants of the northern provinces of South Africa: Keys and diagnostic characters. Strelitzia 6: 1 - 681. National Botanical Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Similar to A. stipoides, an annual; and A. spectabilis, which has the lower glume membranous for the upper 1/3-2/3; and A. vestita, which has a lemma awn column 5-7 mm long.
            textZh: SANBI 条目提供了 Aristida meridionalis Henrard 的鉴别特征。
