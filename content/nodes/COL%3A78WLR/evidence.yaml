        claims:
          - text: Cormous geophyte, 1-3 cm, corms rounded at base with coarse, bent teeth. Basal leaf solitary, sticky with adhering sand grains. Flowers solitary, lilac with darker stripes in a pale cup. Ripe capsules recurved.
            textZh: Romulea lilacina J.C.Manning & Goldblatt 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 7334; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: An early flowering species instantly recognised by its solitary (rarely two), sticky leaf with adhering sand grains, sticky bracts, and lilac flowers without a yellow cup and with concolorous stamens. A similar, later flowering species from the Cederberg, Romulea cedarbergensis, is even smaller, with mostly two leaves without adhering sand grains and smaller, white to pale pink flowers with golden-yellow cup and stamens, the tepals only 7-16 mm long and filaments 4-6 mm long.
            textZh: SANBI 条目提供了 Romulea lilacina J.C.Manning & Goldblatt 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 95165; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
