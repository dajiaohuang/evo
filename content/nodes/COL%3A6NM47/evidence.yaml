        claims:
          - text: Perennial herb. Inflorescence large, oblong to rhomboid. Peduncle up to 1.5 m high. Buds pinkish red to green tinged with dull red. Perianth exceeding 28 mm in length (rarely less). Stamens scarcely exserted. Flowers yellow to yellowish green or green.
