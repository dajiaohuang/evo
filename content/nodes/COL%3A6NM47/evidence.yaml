          - text: K. linearifolia, K. rooperi and K. uvaria are closely related and intermediate specimens occur where their distribution areas overlap. The distinguishing characters are discussed under K. uvaria. There are also intermediate specimens linking K. linearifolia and K. tysonii, but the latter can usually be separated by the more elongate racemes with shorter flowers and well-exserted stamens.
