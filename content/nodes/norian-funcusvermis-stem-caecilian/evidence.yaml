  claim-statements.zh:
    - 至少 76 个个体的孤立三维 Funcusvermis 骨骼出自 U–Pb 年代约束的诺利期骨床，支持蚓螈总群记录，但不代表冠群无足目、一个关节连接个体或全球首次出现。
