    - subjectId: event:norian-funcusvermis-stem-caecilian
      claimKind: scientific
      claimType: fossil-range
      statement: At least 76 individuals represented by isolated three-dimensional Funcusvermis elements occur in a U–Pb-bracketed Norian bonebed and support a caecilian total-group record, but not crown Gymnophiona, one articulated animal or a global first appearance.
      confidence: medium
      confidenceRationale: Multiple named holotype, paratype and referred elements plus the dated section support the bounded occurrence; medium confidence retains isolated association and topology limits.
