        claims:
          - text: Cormous geophyte, 3-10 cm with short stems. Leaves oblong or lanceolate, hairy. Flowers zygomorphic, blue or purple with white markings, fragrant, inner bracts forked apically, ovary smooth.
            textZh: Babiana nana (Andrews) Spreng. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 6751; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: The moderate-sized blue, violet, or sometimes purple to pink flowers marked with white or pale yellow on the lower tepals of Babiana nana are a striking sight in spring along the coast of the Western Cape Province, and are rendered even more attractive at close range by their intense, rosy violet perfume. The species appears to have a combination of the most unspecialised characteristics of Babiana, including green floral bracts becoming dry at the tips, inner bracts forked only at the tips, and zygomorphic, bilabiate flowers. In addition, it is one of relatively few members of the sect. Teretifolieae that has an aerial (though short) stem that is often branched. The relatively short, funnel-shaped perianth tube and blue perianth are likewise ancestral features for the genus. A few other species of the section also have an aerial stem but appear specialised in their leaf morphology, notably B. pilosa and B. rubella.
            textZh: SANBI 条目提供了 Babiana nana (Andrews) Spreng. 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 94895; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
