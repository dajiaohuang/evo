            locator: "SANBI/WFO archive Morphology row 91001; source identifier 18505.0; cited publication: Bredenkamp, CL; Magwaza, ZL. 2019. Iridaceae. In: CL Bredenkamp (ed.), A Flora of the Eastern Cape Province, Strelitzia 41(3): 1821 - 1882. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: One of several species of eastern southern Africa with long-tubed, pink to purple flowers, Hesperantha hutchingsiae appears to be allied to the Eastern Cape and KwaZulu-Natal species H. pulchra. It is distinguished from that species by the shorter, narrower leaves 1.5-2.0 mm wide, 2- or 3-flowered spikes, and rosy-purple flowers. Hesperantha pulchra has leaves 3.0-5.5 mm wide, and spikes with mostly 5 to 11 bright pink flowers. Hesperantha hutchingsiae also stands out in the brown cataphyll sheathing the base of the stem, and in the dark brown anthers and pollen, both unusual in the genus, although dark brown to purple anthers also occur in the pink-flowered H. grandiflora and H. stenosiphon, both of which have flowers with a substantially longer perianth tube, 40-55 mm long in H. grandiflora and 45-60 mm long in H. stenosiphon; and in H. mtamvunae, with much longer anthers 11-12 mm long.
            textZh: SANBI 条目提供了 Hesperantha hutchingsiae Hilliard & B.L.Burtt 的鉴别特征。
