    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Perennial herb, geophyte, ± 0.3 m high; corm 8 x 8 mm, tunics not evident; stem simple, rigid, erect. Leaves 4, lower 3 basal, uppermost sheathing, unfolded, 10-22 x 1.5-2.0 mm, linear, acute, margins thickened; midrib prominent, veins smooth on both sides. Bracts green, tinged brownish, with red-purple. Inflorescence a spike; perianth 37 mm long, tube 21 x 0.5 mm, throat abruptly dilated; tepals subequal, 16 x 5.5 mm, elliptic, obtuse, rosy purple. Stamens exserted; filaments 5 mm long; anthers 7.5 mm long. Flowering time Mar.-?.
            textZh: Hesperantha hutchingsiae Hilliard & B.L.Burtt 的 SANBI 物种条目记录了形态特征。
            sourceIds:
