          originalSourceText: Slender, scandent lianas. Leaves alternate, ovate, acute, cordate, 3 to 5 nerved, membranous, ca. 10 cm. long, 8 cm. wide, glabrous. Pseudostipules present. Flowers solitary, axillary, rectilinear, borne on young leafy shoots, 4 to 6 cm. long, yellow spotted purple, the utricle ovoid, 1 to 1.5 cm. long, narrowing obliquely to a short tube 7.5 mm. long, acuminate. Fruit cylindric, ca. 3.5 cm. long, 1 cm. wide, dehiscing acropetally. Seeds numerous, horizontally compressed, 2 mm. diameter, 0.5 mm. thick.
