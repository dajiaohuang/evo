  claims:
    - subjectId: taxon:lepisosteiformes
      claimKind: scientific
      claimType: topology
      statement: Gene trees, species-tree analyses and morphology converge on a similar relationship pattern among sampled living gars. The living Lepisosteidae sample does not delimit all fossil Lepisosteiformes or establish an exact order origin.
      confidence: medium
      confidenceRationale: Confidence is medium because the cited primary study directly supports the bounded topology statement at the supplied locator. The confidence does not extend beyond the living Lepisosteidae sample does not delimit all fossil Lepisosteiformes or establish an exact order origin.
      referenceLinks:
        - relation: supports
          referenceId: wright-2012-gar-phylogeny
          pages: 848–856
          figure: Figures 1–5; supplementary matrices
          quoteLocator: Molecular and morphological datasets; species-tree comparisons
    - subjectId: taxon:lepisosteiformes
      claimKind: scientific
      claimType: fossil-range
      statement: Living-gar sampling and a calibrated Holostei node do not directly support the former 201.4 Ma–present Lepisosteiformes range; an order-specific occurrence synthesis is required, so the display is withheld.
      confidence: low
      confidenceRationale: "Lepisosteiformes temporal range: the cited primary study or systematic review directly supports the stated sample, calibration or withholding boundary at the supplied locator. Confidence is low and does not extend to a global FAD, LAD, direct ancestor or unsampled interval."
      referenceLinks:
        - relation: supports
          referenceId: near-2012-ray-fin-phylogeny
          pages: 13698–13703
          figure: Figure 1; supplementary calibrations
          quoteLocator: Holostei and living-gar sampling; no order-wide fossil range audit
  claim-rationales.zh:
    - 置信度为中：所引主研究在给定页码、图版或章节定位器处直接支持这一受限的拓扑表述；置信度不外推到文中明确排除的全群起源、全球首现、直接祖先或精确端点。
    - Lepisosteiformes temporal range：所引一手研究或高质量系统综述在给定页码、图表或章节处直接支持此处的样本、校准或暂缓边界。置信度为低。该置信度不外推至全球首现、全球末现、直接祖先或未采样区间。
  claim-statements.zh:
    - 基因树、物种树分析和形态数据在所抽样现生雀鳝关系上趋于一致。现生雀鳝科样本不能限定全部化石雀鳝目，也不能确定精确目级起源。
    - 现生雀鳝采样和全骨鱼校准节点不能直接支持原先 2.014 亿年前至今的雀鳝目范围；必须补充目级出现记录综合，因此该显示暂缓。
