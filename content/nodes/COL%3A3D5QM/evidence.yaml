        claims:
          - text: Like E. othonnoides but taller, to 1 m. Leaves more finely divided, lobes 5-8 on each side. Flower heads orange, involucre cup-shaped.
            sourceIds:
              - sanbi_14144_0
            locator: "SANBI/WFO archive Morphology row 10412; source 14144.0; publication: Manning, JC; Goldblatt, P. 2012. Asteraceae: Euryops (Cass.) Cass. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 372 - 375. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: This rare and imperfectly known species shows distinct affinities to E. othonnoides, e.g., in habit, indumentum, and achenes, but it is also allied to E. wageneri by characters of leaves, involucre, and ray-florets. The species thus takes a natural position in sect. Euryops, in spite of the peculiar, post-florally elongating pappus. Only very scarce flowering material has hitherto been collected, and it remains to ascertain whether the rays are always orange-coloured.
