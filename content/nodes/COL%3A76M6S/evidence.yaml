        usage:
          title: Pentagonia macrophylla Benth., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Trees to 7 m ( or to 16 m?), the nodes crowded at the apex of the stem. Leaves ovate rotund, oblong, or rhombic rotund, to 45 cm long, to 24 cm wide, widely deltoid at the apex, basally cuneate, rounded or occasionally truncate, often inequilateral, the costa prominent above and beneath, the lateral veins 12-15, coriaceous, glabrous above, minutely sericeous on the veins beneath; petioles to 14 cm long, 0.3-0.5 cm wide in the middle, not strongly dilated basally; stipules free, triangular, 3.5-4.0 cm long, ca. 1.5 cm wide at the base, coriaceous, glabrous or golden puberulent. Inflorescences axillary, sessile or pedunculate, the cymes with few to many flowers aggregated usually into a rotund mass shorter than the petiole; bracts red. Flowers yellow; hypanthium obovate rotund, 0.6-0.8 cm long, coriaceous, glabrous, the calycine lobes 5, erect, oblong, 0.6-0.9 cm long, obtuse, concave, coriaceous, moderately pubescent, with a cluster of minute, oblong glands within at the sinuses; corolla with the tube cylindrical, 3.5-4.0 cm long, to 1 cm wide, puberulent outside, densely golden villose within near filament attachment, the lobes 5, spreading or scarcely reflexed, ovate oblong, 5.5-7.0 mm long, acute, villose marginally, smooth; stamens 5, included in the tube, the anthers perhaps dimorphic, the smaller saucer shaped, ca. 3.5 mm long, the pollen aborted?, the larger to 8.5 mm long, polleniferous, the filaments linear subulate, 1.2-2.0 cm long, differing slightly in length, ca. 1.3 mm wide at the base, attached below the middle of the tube, densely villose basally on the adaxial side; style linear, 2.0-2.5 cm long, ca. 0.8 mm wide, the stigmas 2, spread at anthesis, oblong rotund, 3-4 mm long, obtuse. Fruits rotund, to 2.8 cm in diam., nutlike, villo- sulose, the calycine cup 1.5-2.0 cm long, the lobes lanceolate, narrow oblong or subrotund, to 1.3 cm long, equal to or exceeding the cup in length, the wall of the fruit ca. 0.35 cm in diam.
