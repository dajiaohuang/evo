  claim-rationales.zh:
    - Myxinikela siroka：具名材料和已发表的系统或系统发育处理支持这一有限鉴定。置信度保持中等，因为画像不会把取样位置转化为直接祖先或普遍共识。
    - Myxinikela siroka：一手研究直接报告了具名地点与层位。置信度为中等，因为单一研究样本不能确定缺失、特有性或全球地理范围。
    - Myxinikela siroka：证据边界是明确的：保留沉积或解剖背景，同时不填补无依据的行为与生态位。中等置信度针对这一有限的否定性陈述，而非重建生态。
    - Myxinikela siroka：所引图件与描述直接记录了具名解剖观察。由于保存与标本取样限制了性状完整性和变异，置信度为中等而非普遍结论。
    - Myxinikela siroka：一手来源与具体定位符支持显示的样本区间。置信度为中等，因为该包络明确限定于标本或地点，而非全球首现或末现。
  claim-statements.zh:
    - Myxinikela siroka 由正模 FMNH PF15373 与副模 FMNH PF8472 代表，被解释为盲鳗干群或可能的总群成员，而非盲鳗纲冠群。
    - 两件 Myxinikela 标本均来自美国伊利诺伊州原 Pit 11 地点的莫斯科期 Francis Creek 页岩；不据此推断更广分布。
    - 化石保存了身体轮廓与软组织痕迹，但不能直接确定食性、黏液产生、栖息地偏好或取食行会。
    - 两件标本保存圆口类—盲鳗式解剖镶嵌，体长分别为 73.3 与 62.5 毫米，且多处结构的解释受保存状况限制。
    - 显示的 310–307 Ma 区间限定 Francis Creek 页岩标本，并非盲鳗谱系延续时间或全球首现。
