      claimType: morphology
      claimKind: scientific
      statement: The two specimens preserve a cyclostome–hagfish anatomical mosaic, with body lengths of 73.3 and 62.5 mm and multiple structures whose interpretation depends on preservation.
      confidence: medium
      confidenceRationale: "Myxinikela siroka: The cited figures and descriptions directly document the named anatomical observations. Confidence is medium rather than universal because preservation and specimen sampling limit character completeness and variation."
