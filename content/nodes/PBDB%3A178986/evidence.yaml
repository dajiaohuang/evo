  claims:
    - subjectId: taxon:myxinikela
      claimType: taxonomy
      claimKind: scientific
      statement: Myxinikela siroka is represented by holotype FMNH PF15373 and paratype FMNH PF8472 and is interpreted as a stem or putative total-group hagfish, not a crown-Myxini member.
      confidence: medium
      confidenceRationale: "Myxinikela siroka: Named material and a published systematic or phylogenetic treatment support this bounded identification. Confidence remains medium because the profile does not turn a sampled placement into direct ancestry or universal consensus."
      referenceLinks:
        - referenceId: miyashita-2020-myxinikela
          relation: supports
          pages: 850–865, especially 852–860
          figure: Figures 1–4 and 8; Table 1
          quoteLocator: Systematic palaeontology; anatomical description; locality and measurements
    - subjectId: taxon:myxinikela
      claimType: biogeography
      claimKind: scientific
      statement: Both represented Myxinikela specimens come from the Moscovian Francis Creek Shale at the former Pit 11 locality in Illinois; no broader distribution is inferred.
      confidence: medium
      confidenceRationale: "Myxinikela siroka: The primary study reports the named locality and horizon directly. Confidence is medium because one study sample cannot establish absence, endemism or a global geographic range."
      referenceLinks:
        - referenceId: miyashita-2020-myxinikela
          relation: supports
          pages: 850–865, especially 852–860
          figure: Figures 1–4 and 8; Table 1
          quoteLocator: Systematic palaeontology; anatomical description; locality and measurements
    - subjectId: taxon:myxinikela
      claimType: ecology
      claimKind: scientific
      statement: The fossils preserve body outlines and soft-tissue traces but do not directly establish diet, slime production, habitat preference or feeding guild.
      confidence: medium
      confidenceRationale: "Myxinikela siroka: The evidence boundary is explicit: depositional or anatomical context is retained while unsupported behaviour and niche claims are withheld. Medium confidence applies to that bounded negative statement, not to a reconstructed ecology."
      referenceLinks:
