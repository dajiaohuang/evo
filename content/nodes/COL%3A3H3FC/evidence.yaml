        claims:
          - text: Roughly hairy, sprawling annual to 10 cm. Leaves oblanceolate, sometimes pinnatifid, margins revolute, roughly hairy above, white-felted below. Flower heads radiate, solitary at branch tips, rays yellow with greenish reverse; bracts glabrous above, pungent, longer than rays.
