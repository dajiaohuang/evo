    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, subacaulescent, stem up to 50 mm tall. Leaves 2-several, congested, linear-lanceolate, undulate or crisped. Flowers erect but nodding in fruit, actinomorphic, pale greenish, flushed purple, fruit-scented, tepals suberect, 12-15 mm long, nectary pouch-like; filaments slightly swollen medially, 7-11 mm long.
            textZh: Ornithoglossum zeyheri (Baker) B.Nord. 的 SANBI 物种条目记录了形态特征。
