          - text: Haemanthus deformis, together with its close ally H. albiflos, are the only evergreen species in the genus. The habit of H. deformis is most unusual, contributing no doubt to J. D. Hooker's choice of epithet. Unlike any other species the inflorescence appears between the persistent leaves of the previous season. The peduncle remains short, less than 60 mm long, while the flowers are closely surrounded by 6-7 broad white spathe valves, which may or may not have green veins. The current season's leaves appear only after the inflorescence, in a position lateral to the peduncle. The leaf blades are broadly oblong (70-25 mm wide), more or less as long as broad, with the texture very thick and fleshy.Previous authors included H. deformis in their H. albiflos complex, on the assumption that specimens bearing this name were merely depauperate forms of H. albiflos. Mature bulbs in cultivation at Kirstenbosch certainly cannot be regarded as such. Their habit has remained constant over many years, the peduncle lengthens somewhat during the fruiting stage but is consistently short while flowering.
