    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Bulb solitary or in clumps, ovoid, medianly compressed, up to 100 mm across; tunics thick, more or less equal, with horizontal margins, turning green when exposed to light. Leaves 2 or 4, strongly recurved, persisting for more than a year, the two older leaves present with the inflorescence, the most recent leaves appearing shortly after; blade broadly oblong, more or less as long as broad or sometimes broader than long, 80-260 mm long, 70-250 mm broad, thick and flat; both surfaces immaculate, entirely glabrous or densely pubescent on the adaxial or abaxial surface; margin ciliate; apex blunt. Peduncle arising between the leaves of previous season, short, less than 60 mm long, greatly compressed, 6-15 mm across greatest diam., green, smooth or pubescent. Umbel compact cyathiform, somewhat compressed, 45-70 mm across. Spathe valves 6-7, erect and overlapping, as long as the flowers, slightly recurved at the tips, oblong to somewhat spathulate, 30-60 mm long, 12-45 mm broad near the apex, white, sometimes with slight green veining, firm but not fleshy; margins ciliate; tips obtuse. Flowers 25-45, white. Pedicels short, 1-7 mm long, green. Perianth 30-31 mm long; tube 7.5-9 mm long, more or less cylindrical; segments erect, oblong, 21-3.5 mm long, 1-2 mm broad; tips subacute to obtuse. Filaments exserted by up to 10 mm, white. Anthers about 2 mm long when open, golden yellow. Ovary subglobose, 2.5-3 mm diam., green. Style as long as the stamens. Berries ovoid, about 15 mm diam., soft and pulpy, orange to red. Seeds ovoid, about 5 mm diam.
