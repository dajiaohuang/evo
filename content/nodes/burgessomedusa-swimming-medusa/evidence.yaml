  claims:
    - subjectId: event:burgessomedusa-swimming-medusa
      claimKind: scientific
      claimType: morphology
      statement: Burgessomedusa specimens preserve a large bell, more than ninety marginal tentacles and internal radial structures consistent with a free-swimming medusozoan by the middle Cambrian.
      confidence: high
      confidenceRationale: Multiple specimens preserve diagnostic gross anatomy; exact placement within Acraspeda and swimming performance remain comparative interpretations.
      referenceLinks:
