          quoteLocator: Raymond Quarry specimens, diagnosis and medusozoan comparisons
  claim-rationales.zh:
    - 多件标本保存诊断性宏观解剖；其在无缘膜水母类中的精确位置和游泳性能仍属比较解释。
  claim-statements.zh:
    - Burgessomedusa 标本保存了大型伞部、九十余条边缘触手和内部辐射构造，与中寒武世已出现自由游泳的水母型刺胞动物相符。
