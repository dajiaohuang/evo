  claims:
    - subjectId: taxon:probainognathia
      claimKind: scientific
      claimType: topology
      statement: The same revised cynodont matrix recovers Probainognathia as one of the two principal sampled eucynodont branches and reports low early rates relative to Cynognathia; neither result establishes a direct lineage to mammals or a clade-wide first appearance.
      confidence: medium
      confidenceRationale: Topology and rate comparison come from the explicit sampled matrix; the claim separates them from ancestry and range endpoints.
      referenceLinks:
        - relation: supports
          referenceId: ruta-2013-cynodont-radiation
          pages: Article 20131865
          figure: Figures 1–3
          quoteLocator: "Abstract; Results: phylogeny, disparity and evolutionary rates"
    - subjectId: taxon:probainognathia
      claimKind: scientific
      claimType: fossil-range
      statement: Probainognathia is displayed at 237–174.7 Ma only as the sampled matrix coverage, not a clade origin, extinction or direct mammal ancestry. The interval is a source-bounded sample window, not a global FAD, LAD, divergence date, continuous occupancy claim or direct-ancestor assertion.
      confidence: medium
      confidenceRationale: Probainognathia uses Ruta, M.; Botha-Brink, J.; Mitchell, S.A.; Benton, M.J. (2013) because the cited pages and locator expose the sampled taxon, specimen or living sequence set. Confidence is medium and applies only to Late Triassic–Early Jurassic probainognathian matrix sample in Ruta et al.; broader endpoints remain unclaimed.
      referenceLinks:
        - relation: supports
          referenceId: ruta-2013-cynodont-radiation
          pages: Article 20131865
          figure: Figures 1–3
          quoteLocator: "Abstract; Results: phylogeny, disparity and evolutionary rates"
        - relation: contextualizes
          referenceId: ics-2026-06
          pages: International Chronostratigraphic Chart v2026/06
          figure: Global chronostratigraphic scale
          quoteLocator: Numerical boundaries for named geological stages used to bound the source sample
  claim-rationales.zh:
    - 拓扑与速率比较来自明确取样矩阵；该主张将其与祖先关系和范围端点分开。
    - Probainognathia 采用 Ruta, M.; Botha-Brink, J.; Mitchell, S.A.; Benton, M.J.（2013）的论文，因为所引页码与定位符直接标示了研究采样的类群、标本或现生序列集合。中等置信度仅适用于 Late Triassic–Early Jurassic probainognathian matrix sample in Ruta et al.；更宽泛端点保持未声明。
  claim-statements.zh:
    - 同一套修订犬齿兽矩阵把 Probainognathia 恢复为真犬齿兽类两个主要取样分支之一，并报告其早期速率低于犬颌兽类；两项结果都不建立通向哺乳类的直接谱系或全支系首现。
    - Probainognathia 仅以 237–174.7 Ma 展示为矩阵采样覆盖，而非类群起源、灭绝或哺乳类直接祖先关系。该区间是来源限定的样本窗口，不是全球首现、末现、分化日期、连续占据或直接祖先断言。
