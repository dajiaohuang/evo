          title: Tropaeolum pendulum Klotzsch, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Apparently an annual, tall and slender climber, -S nm long, sparse-pilose, especially at base of petioles and peduncles. Leaves with small and caducous stipules; petioles 6-8 cm long; the lamina orbicular to somewhat reniform, 3-5 (-6) cm long, 4-7(-9) cm broad, peltate, slightly 5-lobed to almost entire, the middle 3 lobes short-mucronate, the base truncate or subtruncate, the principal nerves 3(-5), the lateral nerves forked. Flowers on peduncles often shorter than the petioles, 4-7 cm long; calyx lobes heteromorphic, the lower lobes lanceolate, +12 mm long, 3-4 broad, the upper lobes almost triangular, 10 mm long, 7-8 mm broad at the base, yellow or yellowish; spur 15-16 mm long, straight, slender, slightly conical at the base, yellow, the filiform tip green or greenish; upper petals cuneate to spathulate to obovate, shortly unguiculate, 4-5 mm long, 3-4 mm broad near the apex, irregularly serrate, yellow, with darker veins and nor- mally with a dark violet spot near the apex, lower petals unguiculate 7-8 mm long, the lamina elliptical, 4-5 mm long, serrate at the apex, yellow. Fruitingf carpets 5-6 mm long, somewhat elongate, ribbed.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 13544
