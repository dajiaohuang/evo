    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Slender, erect or ascending herbs up to 20 cm high; stems simple or branched from the base, sometimes glandular. Leaves up to 1.2 cm long, 1-1.5 mm broad, scattered along the stems, linear-lanceolate to ovate-lanceolate, acute or acuminate, the lower ones sometimes reduced and scale-like. Inflorescence 1-few-flowered; bracts lanceolate or linear-lanceolate, acute or acuminate. Calyx of 5 segments, each 5.5-10 mm long, 1-2.25 mm broad, narrowly elliptic-lanceolate to oblong-lanceolate, acuminate, joined for 2-4 mm at the base, keeled or very narrowly winged in the lower part, the midrib often distinctly branched. Corolla yellow or pale yellow; tube 5-7.5 mm long; lobes 6-9.25 mm long, 3-5.25 mm broad, ovate-elliptic to ovate-cordate or ovate-orbicular, acute or rounded, sometimes apiculate, shortly clawed. Filaments 1.75-3 mm long, inserted in the sinuses; anthers 1.75-3.5 mm long, each with a minute apical gland. Style and stigma 5-7 mm long with a small stigmatic swelling near the base; stigma large, capitate, 2-lobed.
            sourceIds:
