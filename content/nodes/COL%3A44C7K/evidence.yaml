    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants 160-350 mm high. Corm ± conical, 12-18 mm at widest diam., with numerous small cormlets round base; tunics of medium-textured, matted, dark grey fibres. Stem flexuose, 1- to 5-branched, rarely simple, bearing sheathing leaves 32-38 mm long. Foliage leaf solitary, linear, longer than stem, erect to falcate, narrowly channelled, 2-3 mm wide opened flat. Rhipidial spathes with brown, attenuate tips, inner 33-45 mm long, outer ± half as long. Flowers fugaceous, blue, outer tepal limbs with white nectar guides at bases sometimes edged with dark blue, limbs of both whorls ± half reflexed, inner often more so than outer, unscented; outer tepals ± lanceolate, 22-27 x 8-9 mm, limbs 15-18 mm long, claws 7-8 mm long, inner tepals 17-20 x 5-7 mm. Filaments ± 8 mm long, united in lower half; anthers ± 5 mm long, grey-blue; pollen white or pale blue. Ovary ± cylindric, 5-6 mm long; style branches ± 7 x 5 mm, crests narrowly wedge-shaped, 7-8 mm long. Capsules and seeds unknown.
            textZh: Moraea lazulina Goldblatt & J.C.Manning 的 SANBI 物种条目记载了植株、叶片和花部形态。
            sourceIds:
              - sanbi_18638_0
            locator: Strelitzia 42; archive Morphology row 97849, source 18638.0
            placeTimeScope: Regional species account published 2020; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
          - text: Resembling a second Little Karoo species, Moraea exiliflora, also with a solitary, narrowly channelled basal leaf, M. lazulina has significantly larger flowers and is typically a taller plant, usually with a moderately branched stem. The flowers are always blue with large, white nectar guides on the outer tepals, 22-27 x 8-9 mm, whereas Moraea exiliflora has smaller, pale blue, mauve or white flowers with yellow (or white) nectar guides and outer tepals 14-17 x 4.5-6.0 mm. Other features of M. lazulina are likewise larger than in M. exiliflora. The shape of the flowers also differs to some extent, the tepal limbs of M. lazulina being reflexed more than 45º, the inner sometimes more so than the outer whereas the tepal limbs of M. exiliflora are laxly spreading to reflexed up to 30º.
            textZh: SANBI 条目提供了 Moraea lazulina Goldblatt & J.C.Manning 的鉴别特征。
