          title: Vantanea occidentalis Cuatrec., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Large tree to 40 m, the branchlets glabrous. Leaves coriaceous, entire, oblong elliptic to obovate-elliptic, obtuse or subacuminate at apex, broadly cuneate at base, 7-16 cm long and 2.5-8.5 cm broad, glabrous; petiole 1-10 mm long, flat- tened above, thickened at base. Inflorescence (after Cuatrecasas) terminal, paniculate, shorter than the upper leaves, the branchlets dichotomously articu- late, puberulous, bracts caducous. Flowers (after Cuatrecasas) with the sepals orbicular, subglabrous, 6-7 mm long, with a single gland outside; petals sub- coriaceous, oblong, rather obtuse, glabrous, outside greenish white, inside white; stamens numerous (ca. 80), glabrous, the filaments unequal, ca. 8 mm long, linear, acute at apex, united at base, the anthers small, ovate-lanceolate, the connective thick at base, acute at apex; disc cupular, 1 mm high, minutely den- tate; ovary 3-4 mm high, hirsute, the style 5 mm long. Drupe ovoid-ellipsoid, narrowed at both ends, ca. 3.5 cm long and ca. 1.8 cm thick, the endocarp woody, 2.2-3.3 cm long and 1.2-1.7 cm thick, ellipsoid-ovoid, acute at apex, tapering to a rounded base, surface rather smooth with 5 broad ribs alternating with 5 ob- long valves, 1.8-2.1 cm long and 3-4 mm wide; seed oblong, 1 per fruit.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 6478
