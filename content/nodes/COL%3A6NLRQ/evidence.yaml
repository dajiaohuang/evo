          - text: It may be separated from the previous species, K. angustifolia by the slightly broader leaves nd narrowly funnel-shaped perianth. Its nearst affinity is probably K. pallidiflora Baker of Madagascar, which has more distinctly funnel-shaped flowers and longer pedicels. The Richards Bay specimens tend to have denser racemes and edtinged flowers.
