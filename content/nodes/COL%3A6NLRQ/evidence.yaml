    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants with short stolons forming small groups of stems. Leaves soft, erect, 200-350 x 28 mm, keeled, shallowly channelled above; margin and keel smooth. Scape overtopping or subequal to leaves, 300-500 mm tall. Raceme ovoid, lax to medium-dense, few-flowered, 30-100 x 30-35 mm; buds ascending, deep yellow; flowers finally deflexed, yellow to pale yellow. Pedicels 3-4 mm long. Bracts narrowly lanceolate, acuminate, 4-6 mm long; margin entire. Perianth narrowly funnel-shaped, 14-18 mm long; lobes ovate, obtuse, 3 mm long, spreading. Stamens exserted by 2-3 mm at anthesis, later withdrawn. Fruit small, subglobose.
            textZh: Kniphofia pauciflora Baker 的 SANBI 物种条目记录了形态特征。
