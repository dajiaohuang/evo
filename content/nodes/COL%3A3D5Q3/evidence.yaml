        claims:
          - text: Like E. tenuissimus but leaves (5-)10-50 mm long, flower heads borne above leaves, involucres cup-shaped and achenes shortly hairy.
            sourceIds:
              - sanbi_14144_0
            locator: "SANBI/WFO archive Morphology row 10408; source 14144.0; publication: Manning, JC; Goldblatt, P. 2012. Asteraceae: Euryops (Cass.) Cass. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 372 - 375. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: As pointed out by Compton E. rehmannii is closely allied to E. tenuissimus and E. linifolius, and it has often been confused with these two species. Even one of the collections cited by Compton (I.c.) belongs to E. tenuissimus (Pillans in herb. Bolus 14175). The species is quite variable, and some of the characters mentioned by Compton are not always reliable. The statement that the capitula are 'borne high above the leaves' holds true in most cases, but there is no sharp discontinuity in this respect against E. tenuissimus. This is illustrated in the scatter diagram, showing the combined variation of peduncle length and leaf length in E. rehmannii and E. tenuissimus ssp. tenuissimus. The number of involucral bracts is useless as a separating character, but the shape of the involucre is more distinct. In E. rehmannii the involucre is cupshaped with much-connate phyllaries, whereas it is more hemispherical and expanded in E. tenuissimus. The hair-covering of the achenes affords one of the best distinguishing characters. In E. rehmannii the hairs are short and papilliform and only slightly mucilaginous when soaked. E. tenuissimus has densely villous achenes with longer hairs, which in water swell and become strongly mucilaginous. E. linifolius and E. thunbergii could also be confused with E. rehmannii but differ in the narrower leaves, pubescent branches, and different achenes.
