          publishedAt: undated
          originalSourceText: striate. Leaves alternate, 8.5-17 cm long, 2-5.5 cm wide, obovate to narrowly elliptic, acuminate, attenuate at the base, chartaceous to coriaceous; entire to conspicuously remotely serrate, drying dark green or olive, the venation lighter beneath, the veins plane above, the main veins prominent beneath, the lateral nerves 8-10(-12) on a side, the surface minutely punctate, glabrous except for conspicuous simple trichomes in the axils of the lateral nerves beneath, the slen- der petiole indistinctly demarcated from the leaf base, ca. 0.5-2 cm long. Inflo- rescence an open panicle, terminal or from the uppermost leaf axils, usually ca. 20 cm long, sparsely puberulous with short gland-tipped trichomes and longer eglandular trichomes, the flowers on pedicels mostly ca. 2 mm long. Flowers white; sepals ovate, ciliate, otherwise glabrous, 1-1.2 mm long; outer petals trans- versely oblong, much broader than long, ca. 1 mm long, 1.5 mm wide, the inner petals smaller; stamens with filaments shorter than the anthers, ca. 0.5 mm long, the thecae large, contiguous, ca. 0.6 mm long; ovary ovoid, ca. 1 mm long, the base surrounded by a cupular disc, glabrous or the apex more or less puberulous, contracted into the base of the 1 mm long style, the stigma undivided. Fruit globose, 0.6-0.8 cm in diam., turning reddish at maturity.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 12454
