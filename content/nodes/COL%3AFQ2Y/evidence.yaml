    facets:
      morphology:
        status: partially-supported
        claims:
          - text: In this hatchery cohort, mean body mass increased until an inflection during the ninth month and then declined; the smoothed cohort trend peaked around ages 9–10 months. This is an age-specific weight trend from one cohort, not a diagnostic adult description or species-wide size range.
            sourceIds:
              - kron2020
            locator: Results > Cohort Weight and Survivorship; Figure 1A and caption.
            placeTimeScope: University of Miami National Resource for Aplysia hatchery cohort from one egg mass; animals were weighed monthly, with Figure 1 showing a peak around 9–10 months post-hatch.
            lifeStatus: Hatchery-reared captive animals; no wild size comparison was made.
            originalLanguage: en
        gaps:
          - The cohort weight curve does not establish diagnostic morphology, adult body dimensions, sex differences, or size variation across wild populations.
      lifeHistory:
        status: partially-supported
        claims:
          - text: Among the 53 individuals whose natural mortality was tracked in this single hatchery cohort, median lifespan was 363 days; the final recorded mortality occurred at 422 days post-hatch. These cohort-specific observations do not estimate species-wide longevity or wild survival.
            sourceIds:
              - kron2020
            locator: Materials and Methods > Animal Rearing; Results > Cohort Weight and Survivorship; Figure 1B and caption.
            placeTimeScope: Two hundred animals from a single egg mass were reared at the University of Miami National Resource for Aplysia; natural mortality was recorded for 53 individuals, with the final event at 422 days post-hatch. Study calendar dates were not stated in the locators reviewed.
            lifeStatus: Captive hatchery cohort; no wild animals were included.
            originalLanguage: en
        gaps:
          - A single captive cohort and 53 tracked natural mortalities do not establish species-wide, wild, or population-comparative lifespan; reproduction and early development were not assessed.
      ecology:
        status: not-assessed
        claims: []
        gaps:
          - The hatchery cohort study does not assess natural habitat, wild diet, ecological interactions, or range-wide ecology.
