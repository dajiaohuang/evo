        usage:
          title: Sacoglottis trichogyna Cuatrec., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Tree, the branchlets subterete, glabrous. Leaves rigid-chartaceous or thin- coriaceous, flexible, glabrous, elliptic, acuminate, obtusely cuneate at base, slightly crenate, 6.5-11.5 cm long and 2.5-5 cm wide, secondary nerves thin, slightly prominulous below, glabrous, drying grayish green; the petiole 8-11 (4-7, fide Cuatrecasas) mm long, grooved above, thickened at base. Inflorescence (after Cuatrecasas) paniculate, axillary, much shorter than the leaves, peduncle well-developed, the branchlets minutely hirtellous, the bracts ovate-triangular, ca. 1 mm long, deciduous. Flowers with the sepals orbicular, 1 mm long, eglan- dular, glabrous except the minutely ciliate margin; petals linear-oblong, gla- brous, 5-6 mm long and ca. 1.5 mm wide, whitish green; stamens 10, glabrous, the filaments flattened, united at base, alternately 3 and 4 mm long, the anthers ovate-oblong, ca. 1 mm long, the thecae ca. 0.5 mm long, connective thick, sub- acute; disc surrounding ovary, denticulate, ca. 0.8 mm high; carpels 5, the ovary ovoid, ca. 1.5 mm high, villose-hispidulous, the style ca. 4 mm long, the stigma capitate, 5-lobate. Drupe oblong-ellipsoid to oblong-ovoid, 3-4 cm long, 2-2.8 cm in diameter, the exocarp smooth, 1-2 mm thick, the endocarp woody, with 5 raised ribs, filled with resinous cavities 1-4 mm in diameter, its surface pitted and rather warty; seed oblong, 1-3 per fruit.
          originalLanguage: en
          sourceField: general
