        claims:
          - text: Acaulescent succulent to 20 cm. Leaves distichous, oblong, rough to tuberculate, margins smooth. Flowers in a suberect raceme, nodding, red and green, inflated at base.
            textZh: Gasteria glomerata van Jaarsv. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13855_0
            locator: "SANBI/WFO archive Morphology row 9062; source identifier 13855.0; cited publication: Manning, JC; Goldblatt, P. 2012. Asphodelaceae: Gasteria Duval. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 74 - 75. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: "Gasteria glomerata is an attractive dwarf species immediately recognized by its immaculate glaucous leaves, the epidermis of which is tuberculate-asperulous. The distichous leaves are compact, lorate to widely ovate, and recurved. The plants proliferate from the base to form dense, tight clusters and with age become globose in shape. The flowers are bright red-pink often with a markedly swollen gasteriform portion, in size not exceeded by any other Gasteria species. A feature unique among Gasteria species is that the capsule often remains pendulous. G. glomerata is related to two other cremnophilous species, G. rawlinsonii and G. baylissiana, but differs from them in several ways. Florally G. glomerata appears to resemble most closely G. rawlinsonii, but vegetatively the two cannot be confused. G. rawlinsonii is distinguished by its long pendent stems bearing asperulous (non-tuberculate) leaves. In vegetative features G. glomerata most closely resembles G. baylissiana, another dwarf species. The latter has dark green, densely tuberculate (not asperulous), erectly spreading to patent leaves and a smaller perianth of 14-16 mm. A special feature of these three species is their flowers: the gasteriform portion of the perianth is often markedly globose and varies considerably. The latter is often triangular in cross section, a unique synapomorphy only rarely shared by G. bicolor. The distribution of G. glomerata, G. rawlinsonii and G. baylissiana is clearly allopatric and confined to rocky quartzitic sandstone soils. The flowering times of G. baylissiana and G. rawlinsonii are also in spring. Another species which has distichous tuberculate leaves with which G. glomerata may possibly be confused is G. nitida var. armstrongii. This taxon has dark green, tuberculate leaves and a perianth of which the gasteriform portion is narrowly elliptic. The specific epithet glomerata (glomerate = compactly clustered) refers to the plant's habit."
            textZh: SANBI 条目提供了 Gasteria glomerata van Jaarsv. 的鉴别特征。
