        claims:
          - text: Like D. passerinoides but style and filaments sparsely pubescent, anthers purple and fruits rough and pitted.
            sourceIds:
              - sanbi_14402_0
            locator: "SANBI/WFO archive Morphology row 11425; source 14402.0; publication: Manning, JC; Goldblatt, P. 2012. Rutaceae: Diosma L. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 718 - 719. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Diosma strumosa is a very distinct plant standing quite on its own in the genus with its scrofulous deeply pitted fruit, its long recurved petals, its wine-coloured anthers and disc and its style and filaments sparsely clothed with minute hairs. No other species of Diosma occupies a similar habitat on Bokkeveld shales, perhaps the nearest approach being that of Diosma passerinoides which is also peculiar in that it appears to be associated with silcrete hillocks lying on the Bokkeveld beds. The name is an illusion to the swellings on the fruit.
            textZh: SANBI 条目提供了该种的鉴别特征。
            sourceIds:
