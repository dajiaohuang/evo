      ecology:
        status: partially-supported
        claims:
          - text: In the first-year caged experiment on new cinderblock substrates at Conch Reef in the Florida Keys (November 2003–August 2004), redband parrotfish-only treatments had algal cover and biomass similar to herbivore-exclosure controls and showed no significant effect on measured algal groups except Dictyota spp. This is a single-site, caged-treatment result for algal succession on new substrates; it is not a range-wide estimate of grazing by free-ranging fish.
            textZh: 在佛罗里达礁岛群康奇礁的新混凝土砌块基质第一年围笼实验中（2003 年 11 月至 2004 年 8 月），仅放入红带鹦嘴鱼的处理组，其藻类覆盖度和生物量与草食动物排除对照相近；除 Dictyota 属外，对测量的藻类类群未显示显著影响。这是单一地点、围笼处理下针对新基质藻类演替的结果，不能作为自由活动鱼类摄食影响的全分布区估计。
            originalLanguage: en
            sourceIds:
              - burkepile2010redband
            locator: Results, Year 1 treatment effects on algal abundance; Methods, Experimental Setup and Maintenance; article copyright notice.
            placeTimeScope: Conch Reef in the Florida Keys, USA; the first-year experiment used new cinderblock substrates and ran from November 2003 through August 2004.
            lifeStatus: Wild redband parrotfish enclosed in field cages at a reef; the claim concerns an experimental treatment rather than an uncaged population estimate.
        gaps:
          - A single-site, one-year caged experiment on new substrates does not establish free-ranging grazing rates, effects on established algal communities, geographic variation, or species-wide ecological relationships.
      evolution:
        status: not-assessed
        claims: []
        gaps:
