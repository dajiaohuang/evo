    facets:
      morphology:
        status: partially-supported
        claims:
          - text: The species account diagnoses this taxon by filamentous hyphae dominating the inner stipe-base volval remnants and describes the holotype basidioma and microscopic characters.
            originalLanguage: en
            sourceIds:
              - cui2023
            locator: Section 3.2, Amanita circulata Y.Y. Cui, Q. Cai & Zhu L. Yang, Diagnosis and Description; Type
            placeTimeScope: Type from Puer, Lancang Lahu Autonomous County, Yunnan, China, collected 2016-08-20; the paper also lists dated vouchers from Anhui and Yunnan. The stated eastern and southwestern China range is the authors’ 2023 account, not a global range.
            lifeStatus: Wild fungal type collection described by the authors.
        gaps:
          - One taxonomic paper and its sampled material do not cover developmental variation, broad population variation, or a complete diagnostic synthesis.
      lifeHistory:
        status: not-assessed
      ecology:
        status: partially-supported
        claims:
          - text: The authors report solitary-to-scattered fruiting on soil in subtropical mixed forests with Fagaceae and Pinaceae.
            originalLanguage: en
            sourceIds:
              - cui2023
            locator: Section 3.2, Amanita circulata Y.Y. Cui, Q. Cai & Zhu L. Yang, Habitat
            placeTimeScope: Type from Puer, Lancang Lahu Autonomous County, Yunnan, China, collected 2016-08-20; the paper also lists dated vouchers from Anhui and Yunnan. The stated eastern and southwestern China range is the authors’ 2023 account, not a global range.
            lifeStatus: Wild field collections; the stated forest association does not establish a physiological host relationship.
        gaps:
          - The account does not establish interaction mechanisms, resource dependence, seasonality, or population-level ecology.
      evolution:
        status: partially-supported
        claims:
          - text: In the combined multilocus phylogeny, A. circulata is in a monophyletic clade with A. flavidocerea, A. pekeoides, A. verrucosivolva, and three unnamed or provisionally identified taxa.
            originalLanguage: en
            sourceIds:
              - cui2023
            locator: Results, phylogenetic relationships; Figure 1 and Figures S1–S4
            placeTimeScope: Type from Puer, Lancang Lahu Autonomous County, Yunnan, China, collected 2016-08-20; the paper also lists dated vouchers from Anhui and Yunnan. The stated eastern and southwestern China range is the authors’ 2023 account, not a global range.
            lifeStatus: Modern herbarium collections analyzed in the cited study.
        gaps:
          - Placement is limited to the study taxa, loci, sampling, and analyses; no divergence-time or broader phylogenomic synthesis was assessed.
      distribution:
        status: partially-supported
        claims:
          - text: The authors state that A. circulata is known from eastern and southwestern China and enumerate type and additional dated collections in Anhui and Yunnan.
            originalLanguage: en
            sourceIds:
              - cui2023
            locator: Section 3.2, Amanita circulata Y.Y. Cui, Q. Cai & Zhu L. Yang, Type, Additional specimens examined, and Distribution
            placeTimeScope: Type from Puer, Lancang Lahu Autonomous County, Yunnan, China, collected 2016-08-20; the paper also lists dated vouchers from Anhui and Yunnan. The stated eastern and southwestern China range is the authors’ 2023 account, not a global range.
            lifeStatus: Reported field-collected specimens; cultivated, introduced, and global range status not assessed.
        gaps:
          - The paper reports its known range and examined collections; no exhaustive global occurrence search or native/introduced assessment was completed.
      fossil:
        status: not-assessed
      conservation:
        status: not-assessed
