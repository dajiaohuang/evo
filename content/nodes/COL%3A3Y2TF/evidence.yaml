          originalSourceText: Large woody vine, the branchlets angular, with rows of lenticels, often flexu- ous. Leaves large, the petioles 3-9 mm long, canaliculate above; blade oblong, 2.5-3.5 times as long as wide, 10-20(-25) cm long and 3-6(-7.5) cm wide, acuminate apically, the acumen 1-1.5 cm long, obtuse to rounded or sometimes subacute basally, coriaceous or subcoriaceous, rarely chartaceous, the midrib sul- cate above, prominent beneath, the major lateral veins in ca. 10 pairs, alternat- ing with minor ones, forming a marginal vein, prominent on both sides of the blade, the veinlets prominent at least beneath; hypophyllous glands small, mostly inconspicuous and hardly visible with the unaided eye, in a row of 6-15, 1-8 mm from the margin, minute dark glands in the margin. Inflorescences umbelli- form, with 20-35 or possibly more fertile flowers and 5-6 nectaries, the rachis globose, 6-9 mm in diameter; nectaries large, dipper-shaped, 5-7.5 cm long, the stalk 3-4 cm long, canaliculate inside, lenticellate outside, the cup 1.5-3.5 cm long and 1-2 cm wide, the opening large. Flowers perpendicular on the
