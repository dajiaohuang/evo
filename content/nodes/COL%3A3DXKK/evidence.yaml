        claims:
          - text: Roughly hairy annual branching from base, to 15 cm. Leaves oblanceolate. Flower heads radiate, solitary on long peduncles, purple-blue with cream-coloured rays, ray florets without pappus.
            sourceIds:
              - sanbi_14145_0
            locator: "SANBI/WFO archive Morphology row 10468; source 14145.0; publication: Manning, JC; Goldblatt, P. 2012. Asteraceae: Felicia Cass. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 375 - 378. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: This distinctive, highly floriferous species is readily distinguished from all other species of Felicia by its broad, white or cream-coloured rays and deep purple disc. The rounded plants become covered with dainty white flower heads that in their broad rays and small, convex, purple discs are quite unlike any other species of Felicia. The central disc florets, which are functionally male, have somewhat longer ovaries than the surrounding florets, with the result that the disc is conspicuously convex and projects prominently above the rays. F. josephinae is one of a handful of annual species in section Neodetris Grau that have a strictly biseriate involucre and that lack pappus bristles on the ray florets. Among these species it appears to be most closely allied to F. heterophylla, the only other species in the genus known to have blue or purple disc florets. The two species also resemble one another in their involucral bracts, which bear both glandular and setose hairs, in their cypselas, which are rather scantily clad with long hairs, and in their subplumose pappus bristles. F. josephinae is distinguished from F. heterophylla by its relatively broader (10-12 x 4-6 mm vs 15 x 4 mm) rays that are white to cream-coloured rather than deep blue, by the shorter peduncles (30-50 mm long vs 50-150 mm long), resulting in a more compact appearance to the plants, and by the narrower involucres (4 mm vs 6-8 mm diam.) that contain relatively few disc florets in which the petal lobes are conspicuously recurved rather than suberect or slightly recurving. Herbarium material of the two species in which the colour of the rays has faded or is not noted, can always be separated by the characteristically short peduncles and compact habit of F. josephinae.
            textZh: SANBI 条目提供了该种的鉴别特征。
