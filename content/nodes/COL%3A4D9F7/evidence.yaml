    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plant about 6-8 in. high; stem simple or branching at the base only, rather stout, pubescent along two broad lines; leaves rather close together, incurved-ascending, 2 1/4-31/4 in. long, 2 1/2-5 lin. broad, linear-lanceolate, acute, narrowed into the 3 lin. long petiole at the base, coriaceous, very much crisped or undulate along the margins, glabrous on both sides; umbels several, subaxillary, 3-4-flowered; peduncles 1-2 lin. long, moderately stout; bracts subulate, 1 1/2-2 lin. long; pedicels 3-4 lin. long; sepals 3-4 lin. long, 3/4 lin. broad, gradually tapering from base to apex, glabrous; corolla 4-6 lin. in diam., 5-lobed to rather more than half-way down, glabrous on both sides; tube about 1 1/2 lin. long, globose-campanulate; lobes 2-2 1/2 lin. long, 1 1/2-1 2/3 lin. broad at the base, ovate-lanceolate, subacute, concave and somewhat incurved in their lower part, recurved at the apex; corona-lobes adnate to the corolla-lube for half their length, and in that part confluent, forming a sort of disk lining the base of the corolla-tube, apical part free, erect and rising slightly above the sinuses of the corolla, 1/2-2/3 lin. long, 1 1/6-1 1/2 lin. broad, transversely oblong, truncate, in dried flowers rather thin, flat or with the margins incurved; staminal column 1 1/2 lin. long, stout, conical; anther-appendages small, oblong, acute, loosely inflexed over and covering the small depressed-truncate style-apex; follicles not seen.
