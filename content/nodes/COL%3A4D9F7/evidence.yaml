          - text: This remarkable plant bears such a close resemblance to Xysmalobium gomphocarpoides, Dietr., and Woodia mucronata, N. B. Br., as to be readily mistaken for either of them. It was distributed by Drège as Pachycarpus gomphocarpoides under letter 'a.'
