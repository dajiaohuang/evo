          title: Chrysophyllum cainito L., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Tree to 30 m. Leaves with petioles 0.8-2.3 cm long; blades elliptic or oblong, occasionally ovate or somewhat obovate, short-acuminate, to 15(-19) cm long and 8.3 cm broad, shiny-glabrous above, appressed-rufous-tomentulose below. Flowers often numerous per axillary cluster, the pedicels 5-16 mm long, appressed- rufous-sericeous; sepals ca 1 mm long, suborbicular or broadly ovate, closely rufescent; corolla green, yellow or purplish-white, 3-5 mm long, rotate-funnelform, the tube glabrous, the lobes appressed-sericeous externally cxcept at the margins, ovate or lance-ovate, equalling or slightly exceeding the tub-; anthers 0.6-0 9 mm long, the short filaments attached to the corolla-lobes near the base; style 0.5 mm long or less, the stigma with 7-12 small marginal lobes. Fruit 3-10 cm broad, subglobose, several-seeded; seeds oblique-obovate, flattened, 1-2.5 cm long, the s2ar lateral, extending nearly the length of the seed.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 12805
