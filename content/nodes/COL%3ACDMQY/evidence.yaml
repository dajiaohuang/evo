    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, up to 250 mm tall, stem few-branched. Leaf solitary, linear, channelled, inserted shortly above ground. Flowers pale blue-lilac, outer tepals with bright orange marks near limb bases, tepals unequal, with long, narrow ascending claws, inner much smaller, limbs slightly reflexed, filaments in a long, slender column, style crests well developed, opening late afternoon, lasting until late evening. Mainly Oct.
            textZh: Moraea macgregoriorum Goldblatt 的 SANBI 物种条目记载了植株、叶片和花部形态。
            sourceIds:
              - sanbi_14562_0
            locator: Strelitzia 30; archive Morphology row 33348, source 14562.0
            placeTimeScope: Regional species account published 2013; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
          - text: "Although vegetatively there is little to distinguish Moraea macgregoriorum from related species, including M. saxicola and it allies, in the solitary, rather narrow undulate leaf, branched stem and ± dry spathes, the flower is, however, striking: the pale blue-lilac tepals are held well apart from one another and have long, very narrow claws, narrow, spreading to reflexed limbs and characteristic orange nectar guides. Particularly distinctive are the elongate filaments ± 15 mm long and disproportionately short anthers ± 4 mm long (M. saxicola has filaments 12-14 mm long and anthers 6-9 mm long). As in other members of sect. Deserticolae the ovary is included in the spathes. Molecular phylogenetic studies show that M. macgregoriorum is closely allied to M. saxicola and M. bolusii."
            textZh: SANBI 条目提供了 Moraea macgregoriorum Goldblatt 的鉴别特征。
