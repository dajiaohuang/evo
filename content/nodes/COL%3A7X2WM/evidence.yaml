            lifeStatus: The claim is bounded to the taxonomic material discussed in the diagnosis; the paragraph does not characterize the provenance or life status of every individual.
        gaps:
          - Only a comparative taxonomic diagnosis is represented; within-species variation, ontogeny, broader populations, and additional anatomical systems remain unassessed.
