            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Distinguished by the narrow leaves, small corms with particularly soft tunics, either membranous or composed of fine, soft fibres and usually bearing slender stolons with a single terminal cormlet. The relatively short, stiff branches spread at a wide angle from the main stem and bear few flowers. Branches, usually produced in I. polystachya, in which collections of I. sarmentosa were often included (sometimes as var. lutea), are more-or-less upright and bear numerous flowers. The flowers of I. sarmentosa also consistently have short filaments, ± 2 mm long, and the style, pale green to pale yellow, divides opposite the base to middle of the short filaments, the style branches then extending outward between the filaments. Ixia polystachya has larger corms with well-developed fibrous tunics and does not produce stolons Flowers of Ixia sarmentosa are relatively large, especially in northern populations, the tepals mostly 17-22 x 8-10 mm, but in populations from the mountains around Stellenbosch and Somerset West the tepals are 12-16 x 5-7 mm. Other than the smaller flowers there appears to be no difference between these and the larger flowered plants.
