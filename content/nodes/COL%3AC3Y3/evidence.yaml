    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Herb succulent, stemless. Leaves 89-152 cm a dense rosette, erect, slightly recurved towards the apex, lanceolate-ensiform, reddish green or bluish, 60-80 cm long and 12-15 cm broad at the base, beset along the margins with small chestnut-coloured deltoid thorns 2 mm long and 5-7 mm apart. Inflorescences 2-3 from the same rosette, copiously panicled, erect, 1.25-1.65 metres high, with about 8 arcuate-erect branches subtended at the base with deltoid-acuminate bracts; racemes cylindrical-conical, densely flowered, about 25-35 cm long, flowers at first scarlet greenish at the tips, becoming yellow when open; bracts at first densely imbricate afterwards embracing the pedicels, broadly ovate-acuminate, many-veined, 20 mm long and 11 mm broad; pedicels erect-spreading, 15-20 mm long, greenish scarlet. Perianth at first scarlet (R.C.S.) tipped with green, later changing to a citron-yellow (R.C.S.) 35-38 mm long, somewhat 3-angled and cylindrical, outer segments shorter than the inner, free, acute, inner segments more obtuse, slightly recurved at the apex, the two lateral ones becoming compressed towards the apex so as to close the mouth of the tube. Style and stamens just exserted, anthers grenadine red (R.C.S.) at first, flame scarlet (R.C.S.) when open, style and filaments bright chalcedony yellow (R.C.S.), filaments flattened and wing-like 2-2.5 mm broad. Capsule enveloped with the dry perianth, cylindrical-trigonous, woody, 20 mm long; seeds darkish, irregular, narrowly winged, 4-5 mm long.
            textZh: Aloe pienaarii Pole-Evans 的 SANBI 物种条目记录了形态特征。
