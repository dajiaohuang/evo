            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: It rather resembles A. abyssinica in habit and general appearance, and must, I think, be referred to Berger's Tropicales, although the bracts are much larger than those which are found in this group, in fact the bracts at the tips of the racemes are one of the most conspicuous features of the inflorescence. The unopened flowers are scarlet (R.C.S.) tipped with green. As soon as the stamens are exserted, the colour of the perianth changes from scarlet to citron-yellow from the apex downwards; the base of the perianth, however, usually retains its scarlet hue.
