          title: Copaifera aromatica Dwyer, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Tree to 30 m. tall, with aromatic bark. Leaves 10-30 cm. long, with glabrous petioles; leaflets 8-12, alternate or opposite, distinctly inequilateral, narrowly ovate-oblong or broadly oblong, 2.5-9 cm. long, 1.3-3.5 cm. broad, falcate- acuminate, apically attenuate and minutely retuse, basally obtuse or cuneate, gla- brous, often punctate, principal veins somewhat pubescent below. Flowers unknown. Legume (immature) obovate-rotund, about 3 cm. long and broad, obtuse apically and basally; seed obovate-oblong, 1.5 cm. long and 1.1 cm. broad, invested by a dark-red aril 1.7 cm. long.
