          - text: Phymaspermum peglerae shares the discoid non-corymbose heads and large fruit with P. erubescens and P. aciculare but can be distinguished by the densely bronze villous indumentum (sparse to dense silvery villous or hispid indumentum in P. erubescens and glabrous in P. aciculare), the usually larger leaves 9.0-18.0 mm long and the largest fruit in the genus >4 mm.
