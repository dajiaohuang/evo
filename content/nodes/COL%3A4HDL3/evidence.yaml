    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Multistemmed, densely leafy shrublet, 0.6-0.7 m high. Stems few-branched; branches erect, silvery villous; fascicles sometimes present in leaf axils. Leaves alternate, erect, 9.0-18.0 x 1.0 mm, linear, acuminate to mucronate, entire, without petiole-like base, without secondary basal lobes, silvery-villous on both surfaces, fleshy; basal swelling present, continuous with stem ribs. Capitula discoid, homogamous, terminal, solitary, pedunculate; peduncles 25.0-80.0 mm long, densely silvery-tomentose. Involucre 8.0-12.0 x 7.0-10.0 mm, hemispherical to cyathiform, not tapering at the base; involucral bracts 3-seriate, tightly arranged, margins and apices scarious, membranous apices of all bracts 0.5-1.0 mm long, densely villous, brown margins absent, median resin canals present; outer bracts lanceolate, 2.7 mm long, attenuating; middle bracts lanceolate, 3.9 mm long, acute to rounded; inner bracts oblong linear, 5.5 mm long, rounded. Receptacle convex; paleae in marginal series, oblong, ± 6.3 mm long, rounded, membranous with scarious margins and apices, scarious apices ±1.3 mm long. Disc florets ± 20, without resin canals; corolla 2.3 mm long, with only glandular trichomes, yellow; tube 1.0 mm long; limb campanulate, 1.0 mm long (excluding lobes); lobes spreading, ± 0.5 mm long, triangular-ovate. Anthers ±3.0 mm long (including apical appendage); apical appendage obovate, obtuse. Style 4.0 mm long (excluding branches); branches 0.5 mm long. Cypselas 4.6 x 1.0 mm, obovate, 12-ribbed, apical rim thickened, dentate, glandular trichomes present, sparse, scattered, not mucilaginous when soaked, discontinuous resin canals in ribs absent. This species flowers in midsummer, around January.
