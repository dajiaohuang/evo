        claims:
          - text: Cormous geophyte, 10-22 cm, corm rounded. Leaves narrowly sword-shaped. Flowers white to cream-coloured, fragrant.
            textZh: Hesperantha erecta (Baker) Benth. ex Baker 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 6673; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: An unspecialised species, Hesperantha erecta is recognised by the relatively short stature, rarely exceeding 150 mm, small corm with the tunics fragmenting into elliptical segments, and pale yellow to creamy white flower open during the day, the outer tepals only lightly pigmented grey to light brown outside. Although the flowers are white to creamy yellow, they are not, as might be expected in the genus, crepuscular as far as known and have been recorded opening ± midday and at 14:00 and closing at ± 16:00, thus before sunset.
            textZh: SANBI 条目提供了 Hesperantha erecta (Baker) Benth. ex Baker 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 94810; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
