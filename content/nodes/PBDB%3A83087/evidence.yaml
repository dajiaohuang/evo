        part: body
      confidence: high
      confidenceRationale: The specimen and laboratory result are direct, whereas the approximately 52 ka estimate and demographic tree are models.
      referenceLinks:
        - relation: supports
          referenceId: prufer-2017-vindija
          pages: 655–658
          figure: Figures 1–4
          quoteLocator: Specimen dating; genome coverage; demographic analyses
    - subjectId: taxon:homo_neanderthalensis
      claimKind: scientific
      claimType: fossil-range
      statement: Homo neanderthalensis is displayed at 0.055–0.0455 Ma only as the dated Vindija specimen envelope, not the complete duration of Neanderthals. The interval is a source-bounded sample window, not a global FAD, LAD, divergence date, continuous occupancy claim or direct-ancestor assertion.
      confidence: medium
      confidenceRationale: Homo neanderthalensis uses Prüfer, K.; de Filippo, C.; Grote, S.; Mafessoni, F.; Korlević, P.; Hajdinjak, M.; Vernot, B.; Skov, L.; Hsieh, P.; Peyrégne, S.; et al. (2017) because the cited pages and locator expose the sampled taxon, specimen or living sequence set. Confidence is medium and applies only to Vindija 33.19 specimen age envelope, Croatia; broader endpoints remain unclaimed.
      referenceLinks:
        - relation: supports
          referenceId: prufer-2017-vindija
          pages: 655–658
          figure: Figures 1–4
          quoteLocator: Specimen dating; genome coverage; demographic analyses
        - relation: contextualizes
          referenceId: ics-2026-06
          pages: International Chronostratigraphic Chart v2026/06
          figure: Global chronostratigraphic scale
          quoteLocator: Numerical boundaries for named geological stages used to bound the source sample
  claim-rationales.zh:
    - 标本与实验室结果属于直接证据，而约 5.2 万年前估计和种群树属于模型。
    - Homo neanderthalensis 采用 Prüfer, K.; de Filippo, C.; Grote, S.; Mafessoni, F.; Korlević, P.; Hajdinjak, M.; Vernot, B.; Skov, L.; Hsieh, P.; Peyrégne, S.; et al.（2017）的论文，因为所引页码与定位符直接标示了研究采样的类群、标本或现生序列集合。中等置信度仅适用于 Vindija 33.19 specimen age envelope, Croatia；更宽泛端点保持未声明。
  claim-statements.zh:
    - page: zh
      section: vindija-genome
      part: body
    - Homo neanderthalensis 仅以 0.055–0.0455 Ma 展示为有测年约束的温迪亚标本包络，而非尼安德特人的完整存续期。该区间是来源限定的样本窗口，不是全球首现、末现、分化日期、连续占据或直接祖先断言。
