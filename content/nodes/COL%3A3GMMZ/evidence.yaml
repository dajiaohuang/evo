        claims:
          - text: Perennial shrub or dwarf shrub, 0.45-1.00 m high; branches slender, at first pilose, terete, straight, corymbosely branched above, leaf scars small, but rather prominent. Leaves alternate, rarely opposite or whorled, linear or nearly lanceolate, rather obtuse, flat, 1-nerved, glabrous. Flowers solitary (rarely in pairs) in axils of upper leaves. Hypanthium densely hairy outside; tube inflated below, narrowly funnel-shaped above; sepals rounded. Petaloid floral scales 8, clavate, half as long as sepals. Anthers obtuse. Ovary compressed, hairy at apex. Stigma subcapitate. Fruit surrounded by ovoid, pubescent base of hypanthium. Flowering time all year.
