        claims:
          - text: Hairy, branched annual, up to 400 mm tall. Leaves opposite in lower half of stems, alternate above, elliptic to ovate, margins 1-3-dentate, clearly 3-veined from base, hairy. Flowerheads radiate, solitary on hairy and glandular-pubescent peduncles; involucral bracts in 3 rows, outer row shorter than inner 2 equally long rows, hairy; ray florets blue; disc florets yellow. Cypselas with short hairs.
