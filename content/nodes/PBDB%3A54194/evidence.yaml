    - subjectId: taxon:rhynchocephalia
      claimKind: scientific
      claimType: taxonomy
      statement: Rhynchocephalia is represented as a formerly diverse sampled radiation with Sphenodon as its sole living lineage; quantitative disparity results do not make the tuatara an unchanged ancestor or a proxy for every fossil member.
      confidence: high
      confidenceRationale: The study directly compiles diversity and morphological-disparity data through time. High confidence applies to the sampled pattern and living relict status, not to complete fossil coverage.
      referenceLinks:
        - referenceId: herrera-flores-2017-rhynchocephalia
          relation: supports
          pages: 319–328
          figure: Figures 1–4
          quoteLocator: Abstract; Materials and methods; diversity and disparity results; Discussion
    - subjectId: taxon:rhynchocephalia
      claimKind: scientific
      claimType: fossil-range
      statement: The time-scaled Rhynchocephalia dataset spans Late Triassic fossils to living Sphenodon, supporting a rounded 238 Ma–present study-sample window rather than an exact global FAD or unchanged lineage claim.
      confidence: medium
      confidenceRationale: "Rhynchocephalia time-scaled study sample: the cited primary study or systematic review directly supports the stated sample, calibration or withholding boundary at the supplied locator. Confidence is medium and does not extend to a global FAD, LAD, direct ancestor or unsampled interval."
      referenceLinks:
        - relation: supports
          referenceId: herrera-flores-2017-rhynchocephalia
          pages: 319–328
          figure: Figures 1–4; time-scaled phylogeny
          quoteLocator: Fossil diversity, disparity and living Sphenodon sample
  claim-rationales.zh:
    - 研究直接汇编了随时间变化的多样性与形态差异数据。高置信度仅适用于取样格局和现生孑遗状态，不代表化石记录完整。
    - Rhynchocephalia time-scaled study sample：所引一手研究或高质量系统综述在给定页码、图表或章节处直接支持此处的样本、校准或暂缓边界。置信度为中等。该置信度不外推至全球首现、全球末现、直接祖先或未采样区间。
  claim-statements.zh:
    - 喙头目在此表示为一个曾经多样化的取样辐射，现仅剩楔齿蜥支系；定量形态差异结果并不把楔齿蜥视为不变祖先或所有化石成员的替身。
    - 喙头类时间标定数据集从晚三叠世化石延伸到现生楔齿蜥，支持取整的 2.38 亿年前至今研究样本窗口，而非精确全球首现或“未变化谱系”主张。
