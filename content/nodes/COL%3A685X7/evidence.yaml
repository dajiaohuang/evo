      ecology:
        status: partially-supported
        claims:
          - text: Found in deeper sands along valleys and in seeps, where it is found with Staberoha ornata and Thamnochortus acuminatus. This area receives little rain, as it is in the rainshadow of the Olifantsriver Mountains, and is also very cold in winter, thus making it a harsh environment. The plants are probably killed by fire, and have to be reestablished from seed.
