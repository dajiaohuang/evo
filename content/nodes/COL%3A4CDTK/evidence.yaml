    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Trailing or rambling annual to 1000 mm high, often rooting at nodes. Leaf blade to 100 x 10-25 mm, thick, slightly leathery, flat with cordate bases, cross-venation not conspicuous; ligule a fimbriate membrane. Inflorescence branches with flat glandular patches. Spikelet (1.5)2.0-2.5(-3.0) mm long, asymmetrical, ovate, some spikelets with long woolly hairs, others shortly hairy; glumes as long as spikelet, hairy; lower glume separated from upper glume by short internode; lower glume 3-nerved; upper glume 5-nerved; lower floret male, lemma 5-nerved, palea well developed; upper lemma shiny, smooth except for scattered papillae occurring sometimes at base and/or apex; palea scaberulous; anthers 0.7-0.9 mm long.
            textZh: Panicum glandulopaniculatum Renvoize 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_15530_0
            locator: "SANBI/WFO archive Morphology row 62317; source identifier 15530.0; cited publication: Fish, L. 2015. Panicum L. In: L Fish, AC Mashau, MJ Moeaha & MT Nembudani (eds), Identification guide to the southern Africa grasses. An identification manual with keys, descriptions and distributions, Strelitzia 36: 472 - 496. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Resembles P. heterostachyum, which has thinner leaves and a densely verruculose upper lemma, and P. brevifolium (from Zambia, Zimbabwe, Malawi and Mozambique), which has eglandular inflorescence branches.
