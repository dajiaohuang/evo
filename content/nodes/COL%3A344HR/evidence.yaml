        claims:
          - text: Tufted perennial 300-400 mm high. Leaf blade to 200 x 2 mm, filiform. Spikelets arranged in lax triads, pedicels slightly equal to unequal. Spikelet about 9 mm long, straw coloured; lower glume 6 mm long; upper glume 3-nerved; lower lemma 7-nerved; upper lemma generally with 8 tufts of hairs in upper half and loosely hairy below tufts, 5-7-nerved, lobes 1.5 mm long, central awn 12 mm long; anther 2-3 mm long.
