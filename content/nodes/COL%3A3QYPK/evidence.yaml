    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Sparse shrublet with few erect or decumbent branches, up to 1 m high. Stems terete or irregularly ridged. Leaves lobed, with obtuse teeth, folded lengthwise, recurved, green to deep ruby-red. Corolla tube 7-10 mm long. Flowers yellowish green and yellow.
            sourceIds:
              - sanbi_11118_0
            locator: "SANBI/WFO archive Morphology row 2518; source 11118.0; publication: Herman, PPJ; Retief, E. 1997. Plants of the northern provinces of South Africa: Keys and diagnostic characters. Strelitzia 6: 1 - 681. National Botanical Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: The type specimen has unusually small, almost orbicular leaves and it was therefore difficult to interprete species from the description alone. The holotype could not be found, but there is little doubt that the specimen in PRE is an isotype and that its collector's number has been replaced by a TRV number. The unusual leaves agree well with the original description and the collection date is the same. K. vatrinii R.-Hamet may also prove to be slightly later synonym of this variable species. The leaves may vary from distinctly petiolate to sessile and from undulate to somewhat lobed.
