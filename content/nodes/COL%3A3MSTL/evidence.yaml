    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Small succulent forming clumps to 0.3 -0.5) m diam. Stems 20-120 mm long, 10-20 mm thick (excluding teeth), decumbent, grey-green sometimes mottled with purple; tubercles 3-8 mm long, broadly deltoid, spreading, laterally flattened and joined into 4-5 fairly sharp angles along stem, tapering abruptly to small acute tooth. Inflorescence of 1-3 flowers developing in gradual succession from short peduncle, with attenuate bracts up to 6 mm long; pedicel 8-10(-18) mm long, 2 mm thick, spreading to hold flower facing horizontally; sepals 8-10 mm long, 2 mm broad at base, narrowly ovate-acuminate. Corolla 20-28 mm long, 20-40 mm diam., tubular-campanulate; outside smooth, cream to pink with 3-5 raised longitudinal veins running down each lobe; inside cream finely spotted with red-brown or maroon becoming concentrically lined with red-brown or maroon in lower half of tube (below thickening), papillate except below thickening in tube, papillae reaching max. length of 1.5 mm and densest towards mouth of tube then decreasing in length gradually onto lobes, papillae cream spotted with maroon with apical bristle to 0.75 mm long; tube up to 20 mm long, only slightly expanded in basal half, gradually widening towards mouth, not pentagonal; lobes 8-10 mm long, 8-10 mm broad at base, erect to spreading, deltate, acuminate. Corona 5-6 mm tall, 8 mm broad, without basal stipe; outer lobes spreading on base of tube and partly fused to it, divided into 5 broad ± truncate and emarginate lobes, dark maroon; inner lobes 3-4 mm long, cream spotted with pale maroon, with darker tips, adpressed to backs of anthers near bases then connivent-erect and becoming divergent above, below dorsiventrally flattened with inflated dorsal gibbosity at base, with distinctly swollen bristly apex.
            sourceIds:
              - sanbi_10484_0
            locator: "SANBI/WFO archive Morphology row 67552; source 10484.0; publication: Bruyns, PV. 2005. Stapeliads of southern Africa and Madagascar, Vol. 1. Umdaus Press, Hatfield. [All rights reserved]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Plants of H. longituba may form clumps up to 0.5 m in diameter and the stems are often quite loosely grouped, depending on the amount of shade received. The stems are more or less equally often 4-angled or 5-angled and the angles are usually quite sharp and clearly defined. In H. longituba the flower generally has an almost cylindrical tube beyond which it is slightly flared, with the lobes almost erect to somewhat spreading. The inside is always finely spotted with maroon on a cream background and is densely papillate to just below the mouth of the tube, where the papillae suddenly disappear.
