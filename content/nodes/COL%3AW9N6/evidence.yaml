    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Rhizomatous, evergreen perennial to 1.2 m, with long fleshy roots. Leaves 5-12, basally clustered, suberect, strap-shaped, channelled, dark maroon near base, often striped white along midrib. Flowers 20-35, in a terminal cluster, pendulous, tubular, scarlet, with green to yellow tips. Berries irregularly oblong, dark red.
            textZh: Clivia mirabilis Rourke 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13845_0
            locator: "SANBI/WFO archive Morphology row 8766; source identifier 13845.0; cited publication: Snijman, DA. 2012. Amaryllidaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 53 - 62. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Clivia mirabilis is distinguished by its straight, actinomorphic, bicolored (orange/yellow) tubular corolla, long drooping pedicels, 25-40 mm long, that are orange-red at anthesis and green when fruiting; the distinctive single median white striation on the upper surface of the leaves with smooth cartilaginous margins; and irregularly shaped glebulose-gongyloid berries. The basal part of the leaves forming the leaf sheath is flushed a deep carmine maroon, unlike any other Clivia except C. nobilis, which occasionally produces similarly coloured leaf bases. The orange-red coloration of the pedicels in this species during anthesis is a unique character in the genus Clivia.
            textZh: SANBI 条目提供了 Clivia mirabilis Rourke 的鉴别特征。
            sourceIds:
