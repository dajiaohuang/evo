    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants 150-200(-380) mm high. Corm 6-12 mm diam.; tunics of hard, wiry, black fibres. Stem usually unbranched, 2 or 3 internodes long, sheathing leaves with dry attenuate tips, 30-45 mm long. Foliage leaf solitary, sometimes with second leaf from axillary cormlet, usually shorter than stem, rarely longer, 2-3 mm wide when opened flat, widely channelled or leaf halves almost folded together, inserted or shortly below ground level, usually bearing small axillary cormlet. Rhipidial spathes with dry, brown, attenuate tips, inner up to 55 mm long, outer ± 1/2 as long. Flowers long-lived, pale blue, outer tepal limbs with triangular yellow nectar guides at bases and dark veins radiating from nectar guides; outer tepals 27-29 mm long, claws 12-14 mm long, limbs ovate, ± 15 mm long, inner tepals hair-like, up to 4 mm long. Filaments ± 5 mm long, united ± 1 mm; anthers ± 6 mm long, dark blue-black; pollen white. Ovary linear-cylindric, 10-13 mm long, darkly lined vertically on locules and septa; style branches ± 12 mm long, crests ± linear, 8-12 mm long. Capsules ± cylindric, (15-)20-24 x 2 mm. Seeds angular, 0.8-1.5 mm diam., golden-brown, shortly winged on angles.
            textZh: Moraea ogamana Goldblatt & J.C.Manning 的 SANBI 物种条目记载了植株、叶片和花部形态。
            sourceIds:
              - sanbi_18638_0
            locator: Strelitzia 42; archive Morphology row 97869, source 18638.0
            placeTimeScope: Regional species account published 2020; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
          - text: A member of the Moraea tripetala complex of species, M. ogamana has hair-like inner tepals ± 4 mm long but is distinguished by the linear-cylindric ovary 10-13 mm long, often partly included in the spathes, and pale blue flowers with dark radiating venation and yellow nectar guides on the outer tepals. Associated with these features are the short stature, rarely exceeding 180 mm, fairly small corms, 7-12 mm diam., with wiry, black tunic fibres and a relatively short leaf, usually shorter than, but occasionally exceeding the stem. Unlike most populations of M. tripetala in the Western Cape forelands, which have orange-red pollen, the pollen of M. ogamana is white. An additional, but somewhat trivial distinction, the style crests, up to 12 mm, are unusually long for the relatively small flowers. Plants usually have a single small cormlet in the foliage leaf axil, and this modest level of vegetative reproduction results in plants sometimes growing in small clumps of three or four individuals. Correlated with the long, angular ovary, the capsules are ± cylindric and normally 20-24 mm long. Capsules of M. tripetala are ellipsoid-oblong and only 10-14 mm long. The seasonally waterlogged habitat is distinctive for M. ogamana.
