    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, 12-35 cm, corm with flat base. Leaves terete and hollow or lanceolate to falcate and margins sometimes crisped. Flowers small, white, dark on reverse, sweetly cinnamon-scented especially in the evening.
            textZh: Hesperantha spicata (Burm.f.) N.E.Br. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 6693; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: "Recognised by the relatively small, white flowers with perianth tube ± 4 mm long and tepals as long as to 1.5x as long. The anthers, articulated on the filament tips spread horizontally over the tepals. The corms, usually ± bell-shaped or obconic, often have a flared margin and sometimes lack the serrated or spiny margins common in sect. Hesperantha. The seeds are notable, having a white, spongy coat, not known in other species of the genus. Variation in leaf morphology, correlated to some extent with height and number of flowers per spike, led to recognition of three subspecies: subsp. graminifolia with plane leaves with straight margins and often a taller plant; subsp. fistulosa with terete, hollow leaves; and subsp. spicata with strongly falcate leaves with undulate to crisped margins, a shorter stature and fewer-flowered spikes. Recent records of subsp. fistulosa in full bloom growing in a wet seep and subsp. spicata in fruit nearby in deep sand expands our understanding of this plant. The situation seems inconsistent with separation at subspecies rank and an alternative treatment as a separate species for subsp. fistulosa seems equally acceptable."
            textZh: SANBI 条目提供了 Hesperantha spicata (Burm.f.) N.E.Br. 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 94883; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
