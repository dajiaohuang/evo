    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Rhizomatous perennial, up to 180 mm tall, roots several, spreading, swollen towards tips. Leaves 3-12, linear, covered with long, tawny hairs, rarely smooth. Flowers pale pink, in a compact, many-branched panicle with conspicuous, white bracts. Capsules globose, 5 mm diam., held erect.
