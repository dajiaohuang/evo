    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous herb, up to 500 mm tall. Spike lax, distichous, 6-8-flowered. Perianth tube 7 mm long, straight. Tepals subequal, 14 x 2.5-3.0 mm. Flowers pink and white.
            textZh: Hesperantha rupestris N.E.Br. ex R.C.Foster 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_11118_0
            locator: "SANBI/WFO archive Morphology row 2306; source identifier 11118.0; cited publication: Herman, PPJ; Retief, E. 1997. Plants of the northern provinces of South Africa: Keys and diagnostic characters. Strelitzia 6: 1 - 681. National Botanical Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: A fairly robust species, sometimes standing 450-500 mm high, Hesperantha rupestris most closely resembles pink-flowered H. baurii in general aspect and is distinguished by the white to creamy white flowers with outer tepals flushed dark pink to red on the outside. Plants usually have four leaves, the lower two basal, narrowly lanceolate and reaching to about the base of the spike. The firm-textured blades have the margins and main vein thickened. As in other eastern southern African Hesperantha species with white flowers, these are diurnal and have been reported as opening in the morning.
            textZh: SANBI 条目提供了 Hesperantha rupestris N.E.Br. ex R.C.Foster 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 94858; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
