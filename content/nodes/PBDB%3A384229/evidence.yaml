    - Tethymyxine tapirostrum：具名材料和已发表的系统或系统发育处理支持这一有限鉴定。置信度保持中等，因为画像不会把取样位置转化为直接祖先或普遍共识。
    - Tethymyxine tapirostrum：一手研究直接报告了具名地点与层位。置信度为中等，因为单一研究样本不能确定缺失、特有性或全球地理范围。
    - Tethymyxine tapirostrum：证据边界是明确的：保留沉积或解剖背景，同时不填补无依据的行为与生态位。中等置信度针对这一有限的否定性陈述，而非重建生态。
    - Tethymyxine tapirostrum：所引图件与描述直接记录了具名解剖观察。由于保存与标本取样限制了性状完整性和变异，置信度为中等而非普遍结论。
    - Tethymyxine tapirostrum：一手来源与具体定位符支持显示的样本区间。置信度为中等，因为该包络明确限定于标本或地点，而非全球首现或末现。
  claim-statements.zh:
    - Tethymyxine tapirostrum 正模 BHI 6445 在已发表形态分析中位于盲鳗纲冠群内部，但具体支系位置仍依赖矩阵。
    - BHI 6445 来自特提斯东部黎巴嫩 Hâdjoula 的森诺曼期特异埋藏群；该地点不能确定冠群盲鳗的全球分布。
    - 海相沉积背景有据可查，但化石不能直接确定食性、食腐行为、水深偏好或现代盲鳗生态。
    - BHI 6445 保存了一具完整软体盲鳗，其取食器官与身体性状被用于已发表系统矩阵。
    - 显示的 100.5–93.9 Ma 区间是 BHI 6445 的森诺曼期包络，提供盲鳗纲冠群化石界限，但不是全球首现。
