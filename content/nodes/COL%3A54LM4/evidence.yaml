        usage:
          title: Talinum paniculatum (Jacq.) Gaertn., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Herbaceous plants, erect, slender, glabrous throughout, the root often thick and fleshy. Leaves alternate, broadly elliptic to obovoid, rarely oblanceolate, 4-13 cm. long, 1.5-5.5 cm. broad, acute to obtuse at the apex, cuneate or attenuate at the base, plane, petiole 3-15 mm. long. Inflorescence terminal, compound, lax, 10-60 cm. long, 6-20 cm. broad, the lateral simple or compound cymes racemosely arranged on the primary rhachis, bracteate; pedicel 6-25 mm. long, dilated distally. Sepals ovate, 1.5-3.0 mm. long and broad, connate at the base, slightly keeled, reflexing and deciduous; petals elliptic, 3.0-4.5 mm. long, about 1 mm. broad; stamens 15 or more, the filaments 1.5-2.0 mm. long, free, the anthers ovoid, to 0.5 mm. long and broad; ovary sessile, globose, about 1 mm. long, 1 mm. in diameter. Capsule ovoid to globose, 3-5 mm. long, 3-5 mm. in diameter; seeds strongly reniform, 0.75-1.0 mm. in diameter, the testa minutely striate, black, indistinctly strophiolate.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 10974
