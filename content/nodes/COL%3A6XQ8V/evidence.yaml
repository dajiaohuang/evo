    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants slender, glabrous, (150-) 170-280 (-360) mm tall; leaves 2-3, with 1-3 sheaths, longest lamina only partly spreading, thick and smooth, elliptic to narrowly elliptic, 50-120 mm long. Inflorescences dense, 12-56-flowered; bracts sharply deflexed, lanceolate-acuminate, 1.5-3 times the length of the 5-8 mm long ovary. Flowers yellowish green to dull white, thick-textured, with many short hairs on the basal half of the inner surfaces of petals and lip. Median sepal truncate to obtuse, 3-5 mm long; lateral sepals almost as long, broadly elliptic-oblong, somewhat falcate. Petals slightly shorter, narrowly ovate. Lip spurs absent or as slight sacs at the lip base. Pollinia with prominent discoid viscidia; stigma flap subrotund, hood-shaped with the receptive surface sunk into a slight cavity; rostellum with 2 very short spreading arms.
