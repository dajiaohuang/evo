        claims:
          - text: Cormous geophyte, 4-8 cm, tunics woody, concentric. Leaves linear to sword- shaped. Flowers small, 1-few per spike, white or cream-coloured, occasionally with dark centre, tepals spreading.
            textZh: Geissorhiza setacea (Thunb.) Ker Gawl. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 6817; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: A dwarf species 40-80 mm tall, Geissorhiza setacea is most easily recognised by its fairly large, relatively long-tubed flowers usually borne singly on short stems. The flowers are usually white and have a perianth tube ± 6 mm long and tepals 8-12 mm long. Also short in stature, G. nana has similar but smaller flowers with a perianth tube 1.0-2.5 mm long and tepals 3-6(-8) mm long. Although usually white-flowered, populations of G. setacea have pale yellow flowers with a blackish centre in the north of its range at Elandsberg Nature Reserve near Gouda.
            textZh: SANBI 条目提供了 Geissorhiza setacea (Thunb.) Ker Gawl. 的鉴别特征。
            sourceIds:
