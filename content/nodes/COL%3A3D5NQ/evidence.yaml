            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: E. integrifolius, represented by a single collection, is allied to E. munitus but sufficiently distinct to deserve recognition as a species. It differs from the latter i.a. by the entire, obtuse leaves and the papillate achenes. Possibly it can be regarded as a high montane derivative of the latter species. It also resembles E. ericoides, which likewise has entire and short curved leaves but differs by other leaf as well as fruit characters.
