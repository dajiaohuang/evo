        claims:
          - text: Twiggy shrub to 1 m, white-woolly on young parts. Leaves oblanceolate, spreading, gland-dotted. Flower heads radiate, few in slender peduncles in lax umbels, yellow.
            sourceIds:
              - sanbi_14184_0
            locator: "SANBI/WFO archive Morphology row 10742; source 14184.0; publication: Manning, JC; Goldblatt, P. 2012. Asteraceae: Oedera L. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 399 - 400. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: R. multipunctata is a usually tall species with slender capitula. It is related to R. sedifolia and R. resinifera. It differs from the former in having the capitula arranged in cymes and from the latter in the characters of the achenes (see key) and leaves, which are distinctly glandular-punctate, narrowly obovate and not very glutinous as in R. resinifera.
