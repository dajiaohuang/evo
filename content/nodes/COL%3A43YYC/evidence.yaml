    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Prostrate or scandent herb. Tendrils simple, un-branched. Stems and petioles concolorous, uniformly green. Leaf lamina deeply palmately 3-7-lobed usually to the middle or beyond, lobes narrowed towards base, rhombic, elliptic or obovate in outline, ± sinuate-lobulate. Male flowers solitary, pedicel 2-5 mm long, peduncle free from petiole of subtending leaf. Ovary and fruit with longitudinal rows of small tubercles, otherwise smooth; fruit stalk 6-17 mm long. Flowers pale yellow, cream or white, green-veined, dark at base.
