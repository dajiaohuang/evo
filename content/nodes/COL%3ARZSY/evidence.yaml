        usage:
          title: Cecropia peltata L., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Trees 6-20 m. tall with stout, seldom-branching trunks, the young branches stout, hispidulous to glabrate. Mature leaves divided about midway to the center or scarcely beyond, scabridulous above, paler and densely arachnoid-villosulose to glabrate beneath, the lobes usually 9-11, not contracted toward the base or scarcely so, obtuse to rounded at the tip, the petioles densely and minutely hirtellous, with a ferruginous-velutinous basal pulvinus; stipules about 6-9 cm. long, hirtellous. Staminate spadices in clusters of 12-30, 3-5 cm. long, about 4 mm. in diameter, with slender hirtellous stipes about 3-5 mm. long, the spathes 4-6 cm. long shortly before anthesis, broadly conic-oblongoid, densely white-arachnoid-villous, the common peduncle 7-10 cm. long after anthesis, slender, minutely hirtellous. Pistillate spadices in clusters of 4-6, at anthesis about 4-5 cm. long and 5 mm. in diameter, in fruit about 5-10 cm. long and 1 cm. in diameter, subsessile or with very inconspicuous stipes, the spathes as in the staminate inflorescences, the common peduncle about 7-8 cm. long at anthesis, somewhat accrescent in fruit.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 8021
