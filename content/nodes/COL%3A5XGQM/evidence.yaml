        usage:
          title: Cavendishia capitulata Donn.Sm., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Erect, much branched, spreading, usually epiphytic shrub 0.5-1.5( -2) m tall, stem base 1-3 (-15) cm in diameter; mature branches terete to bluntly angled, glabrous, bark brown, rusty brown or gray to almost black; immature branches and twigs of new growth bluntly angled, glabrous or densely hirsute with spreading, white or yellowish trichomes ca. 0.5 mm long, frequently with clavate, reddish glandular fimbriae ca. 0.1 mm long. Leaves obovate, oblanceo- late, elliptic, oblong elliptic or ovate, 1.5-3(-6) cm long, 0.5-1.5(-3) cm wide, basally cuneate or rounded, apically rounded, obtuse or rarely abruptly tapering to a blunt tip, dull green or olive to grayish brown when dry, the young leaves densely puberulent, glabrate at maturity; 3-5 (-7) -plinerved, the midrib im- pressed or slightly raised, conspicuous above, raised and conspicuous beneath, lateral nerves slightly raised and conspicuous or plane and obscure on both sur- faces, the veinlets slightly raised, conspicuous or obscure above, usually obscure beneath; petioles smooth, striate or more commonly rugose, subterete or flat- tened, 1-3(-5) mm long and 0.5-1 mm in diameter, puberulent, glabrescent, brown, reddish brown or blackish. Inflorescence fasciculate, 3-6(-7) flowered; rachis glabrous, 1-3(-7) mm long, 1-1.5 mm in diameter; floral bracts smooth or muricate, glabrous, obovate, basally narrowed, apically rounded, shallowly emarginate or rarely acute 11-14(-19) mm long, 6.5-11 mm wide, purple to reddish purple, marginally scarious and sparsely fimbriate, rarely densely ciliate, frequently with scattered, short, thick, reddish brown, glandular fim- briae along the lamina; pedicels cylindric or obconic, rugose or obscurely ribbed, sometimes bluntly angled, glabrous or sparsely pilose distally, (0.5-) 1.5-2 (-5) mm long 1-1.5(-2.5) mm in diameter, rarely with reddish brown, glandular, distal fimbriae; bracteoles oblong to oblong elliptic, (1-)3-6(-8.5) mm long, 1-2 mm wide, basally truncate, apically obtuse, purple, marginally scarious and densely glandular fimbriate with fimbriae to 0.8 mm long. Flowers with the calyx 4.5-7.5 mm long, the tube cylindric or barrel-shaped, often pentagonal in cross section, smooth or minutely rugose, 1-3 mm long, 2-3 mm in diameter, slightly enlarged with a narrow rim or collar basally, green to purple, sometimes with scattered, reddish brown, glandular fimbriae, the limb erect, somewhat spreading or campanulate, 1.5-4 mm long including the lobes, green to greenish white, the lobes triangular, obtuse to acute, 0.5-1.5 mm long, 1.5-2 mm wide, erect or somewhat connivent after anthesis, densely glandular fimbriate with fimbriae to 0.2 mm long, the sinuses broadly rounded or obtuse, rarely acute; corolla constricted basally, narrowed to the throat, 10-16 mm long, 4-5 mm in diameter, glabrous, the basal 1/4 white or pale red, the middle '/2 purple or red- dish purple, the distal 1/4 white, the lobes white, triangular, obtuse, 1 mm long; stamens 9-14.5 mm long, the filaments glabrous or distally with scattered hairs, alternately either 1.5-3 mm or 3-6 mm long, the anthers including tubules al- ternately 5.5-10 mm and 7.5-12.5 mm long, the thecae 2-3 mm long; style (9.5-)11-15.5 mm long, the stigma somewhat peltate. Berry 5-7 mm in diam- eter.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 4133
          archiveSourceId: FF202643-AEB4-4FD5-87C0-FD78E3FD1E4B
