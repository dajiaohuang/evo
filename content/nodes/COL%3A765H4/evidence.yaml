          title: Paullinia bristanii Croat, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Lianas; stems deeply 3-6-sulcate, glabrous; wood simple. Leaves pinnately 5-foliolate, 14-32 cm long, glabrous except for the vein axils beneath; petiole 2.5-10 cm long; petiole and rachis with a prominent medial rib on the upper surface, narrowly winged throughout, the wings slightly broader near the apex; leaflets elliptic, ovate-elliptic or obovate-elliptic, abruptly acuminate at the apex, attenuate to acute or obtuse at the base, 5-16 cm long, 2-7 cm wide, entire or weakly and obscurely toothed near the apex, drying dark; stipules deciduous. Inflorescences spikelike, axillary, more than 4 cm long, the rachis prominently angular, densely tomentulose, the bracteoles narrowly linear-lanceolate, 3-5 mm long, densely pubescent on both surfaces; pedicels short, shortly appressed-pubes- cent. Flowers unknown; sepals (persisting in fruit) to 2 mm long, sparsely ap- pressed-pubescent outside, glandular within. Fruits globose, sessile, glabrous; immature fruit to ca. 1 cm diam.
