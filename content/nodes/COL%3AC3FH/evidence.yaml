          - text: Plants are long-lived and typically form dense clumps of up to 70 heads. Not only are its flowers the smallest (20-25 mm long) among South African members of the A. zebrina-complex, but they are also characteristic in being an unusual intense red. Also diagnostic are the general small stature of the plants and shorter inflorescences (0.65-0.75 m). An outstanding feature is its concentrated and relatively early (December to February) flowering period.
