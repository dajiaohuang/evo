      ecology:
        status: partially-supported
        claims:
          - text: Plants are associated with relict stands of Klerksdorp Thornveld, a vegetation type characterized by unevenly scattered Acacia karroo-dominated tree stands in a grassland matrix. Plants mainly grow in full sun in open grassy areas among woody vegetation. Aloe braamvanwykii prefers red sandy loam (often with small stone aggregates) derived from rocks of the Ventersdorp Supergroup, but occasionally can also be found on more clay-rich soils.
            textZh: 该 SANBI 区域物种条目记录的生境：Plants are associated with relict stands of Klerksdorp Thornveld, a vegetation type characterized by unevenly scattered Acacia karroo-dominated tree stands in a grassland matrix. Plants mainly grow in full sun in open grassy areas among woody vegetation. Aloe braamvanwykii prefers red sandy loam (often with small stone aggregates) derived from rocks of the Ventersdorp Supergroup, but occasionally can also be found on more clay-rich soils.
