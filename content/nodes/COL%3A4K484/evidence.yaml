    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Perennial herb up to 0.2 m tall; stems straggling, sparingly branched, up to 0.3 m long. Leaves petiolate; blade thin-textured, broadly ovate, 25-40 x 20-35 mm, subglabrous to sparingly pubescent, under-surface with honey-coloured gland-dots, not suffused with purple, apex acute to obtuse, base abruptly cuneate, margin regularly crenate-dentate, finely ciliate; petiole 15-40 mm long. Inflorescence usually simple, rarely with a pair of branches near the base, racemes 40-120 mm long; flowers in sessile, 1-3-flowered cymes, forming 2-6-flowered verticils 10-20 mm apart. Calyx 7-8 mm long in fruit, glandular-puberulous with a few fringing multicellular hairs. Corolla whitish with a few purple spots on the lip, 7-8 mm long; tube expanding and saccate at the base, narrowing slightly towards the throat; upper lip 4-5 mm long; lower lip boat-shaped, 3 mm long. Stamens free, 2-2.5 mm long.
