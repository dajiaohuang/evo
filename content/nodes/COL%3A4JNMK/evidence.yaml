    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Stems 1-several from the base, erect, 0.5-1.2 m tall, sparingly branched, retrorse-pubescent. Leaves petiolate; blade lanceolate to ovate-lanceolate, 50-70 x 15-25 mm, sparingly appressed-pubescent especially on the nerves, copiously gland-dotted on both surfaces, apex acute, base obtuse to cuneate, margin serrate. Inflorescence dense, spike-like, 50-100 mm long; rhachis densely retrorse-pubescent; bracts broadly ovate, acute, the lowermost pair 10-25 x 8-15 mm, becoming progressively smaller towards the apex. Calyx densely pubescent, 2 mm long at flowering, increasing to 4-5 mm at fruiting stage. Corolla white or mauve, 5-6 mm long; upper lip 2.5 mm long, 3 mm broad; lower lip 2.5 x 1 mm. Stamens exserted by 2.5 mm. Style exserted by 2 mm. Nutlets 1 mm long.
            sourceIds:
