        usage:
          title: Sphyrospermum cordifolium Benth., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Epiphytic or terrestrial shrublets, mostly 2-6 dm tall, the branchlets densely spreading puberulous, glabrescent. Leaves coriaceous, ovate, to lance ovate, (1.5-)2.0-5.0(-7.0) cm long, (10-)15-25(-32) cm wide, basally rounded or subcordate and apically obtuse or rounded to acute, marginally entire and slightly recurved, moderately puberulous on both the surfaces but becoming glabrate, usually moderately beset with appressed glandular trichomes ca. 0.1 mm long, 3(5)-nerved from the base, the midvein and the paralleling principal veins often impressed above and elevated beneath, the veinlets usually obscure; petioles glabrous to pilosulose, 1-2 (-3) mm long; pedicels 1 (-2) per axil, pilosulose and often with inconspicuous, glandular, appressed trichomes distally, sometimes glabrous, (1.0-)1.5-2.5 cm long. Flowers with the hypanthium usually moderately spreading pilosulose, occasionally sparingly so or glabrous, usually appressed glandular strigose proximally, subglobose or thickly fusiform to shortly cylindric, 1-1.5(-2) mm long, 1.0-1.5 mm in diameter; calyx limb erect, 1.0-1.6 mm long including the lobes, the lobes 4 or 5, deltoid, acute, 0.5-0.8 mm long, often with a tuft of trichomes at the tip; corolla membranous, (4-) 5-7(-8) mm long, 1.2-2.0(-2.2) mm in diameter, glabrous or sparsely and in- conspicuously strigillose or puberulous distally, the lobes 4 or 5, narrowly tri- angular, acute, erect; stamens usually either 4-5 or 8-10, slightly shorter than the corolla, the filaments slender, pilosulose or glabrous, 2.0-3.5(-4.5) mm long, the anthers 2-3 mm long, the tubules distinct, about as long to almost twice as long as the thecae. Berry subglobose to thickly fusiform, pilosulose or glabrous, white or white with a violet tinge at maturity, fleshy, 4-7 mm in diam- eter; seeds elongate, whitish, the green embryo visible within.
          originalLanguage: en
          sourceField: general
