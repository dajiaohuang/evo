    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Perennial herb, 3-8 dm tall, the stem simple or more generally with several ascending branches from above the base, glabrous or nearly so; basal leaves oblanceolate to oblong-lanceolate, subglabrous, or puberulent especially on the edges, 3-8 cm. long, 1-2 cm. wide, sinuate-dentate, obtuse to acute, with short winged petioles; cauline leaves rather crowded, spatulate to lanceolate, even linear, sinuate-dentate to almost entire, often wavy, subglabrous to strigulose, 1-5 cm. long; floral bracts 1-3 mm long, caducous, lanceolate to ovate with narrow tip, subglabrous or with few short hairs on margins; inflorescence simple or branched, 2-5 dm. long, with naked peduncles 1 or more dm. long; hypanthium 2.5-3 mm long, subglabrous or sparsely strigulose, narrow-funnelform, white-pubescent within; sepals grayish-strigulose, 7-10 mm long, narrow, separately reflexed in anthesis; petals white, becoming red, 8-10 mm long, broadly elliptic, the claw rather narrow, ca. 2 mm long; filaments subequal, slightly enlarged upward, 8-10 mm long; anthers reddish 3-3.5 mm long; style somewhat longer than stamens, puberulent at very base; stigma-lobes about 0.5 mm long; capsule nearly or quite glabrous, the body fusiform, obtusely 4-angled, 5-9 mm long, 1-1.5 mm wide, gradually tapering into rather thick pedicel-like base 2-5 mm long.
