          title: Zornia reticulata Sm., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Perennial herb, stems prostrate to erect, to 75 cm long, branched, pilose to glabrous. Leaves 2-foliolate; lower leaflets broadly lanceolate to ovate-lanceolate, acute, to ca. 20 mm long, ca. 8 mm wide, the upper leaflets lanceolate to linear, acute, to 20 mm long, ca. (2-)3-5(-8), punctate or epunctate, villous to glabrous below, glabrate above, exstipellate; stipules peltate, glabrous to villous, punctate or epunctate, 5- to 9-nerved, attenuate at each end. Inflorescence spicate, usually crowded, many flowered; bracts lanceolate to lance-ovate, acute to acuminate, to 12 mm long, 8 mm wide, the auricle to 3.5 mm long, often falcate, glabrous to densely villous, 5- to 9-nerved. Flowers yellow, mostly concealed by bracts. Fruit 4- to 7-articulate, usually included in bracts, articles 2.0-2.4 mm long, ca. 2 mm wide, usually reticulate, pilose to villous, bristles retrorsely hairy, 0.2-0.4 mm long, eglandular.
          originalLanguage: en
          sourceField: general
