        usage:
          title: Eriosema diffusum (Kunth) G.Don, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Erect herb or subshrub, the stems ascending from a woody base, terete, densely sericeous. Leaves trifoliolate, the leaflets oblanceolate to obovate, 2.5- 4.7 cm long, 0.8-1.2 cm wide, apically acuminate, basally cuneate, the margins revolute, pubescence strigose above, tomentose silvery beneath, especially along the veins, the terminal leaflet longer than the laterals, the petioles 1.0-2.0 mm long, densely white sericeous; stipules lanceolate, connate to occasionally split- ting, 0.6-1.0 cm long, 0.3-5.0 cm wide, externally strigose. Inflorescence 1.5-3.8 cm long, not exceeding the leaflets; flowers 5-10 per cluster; peduncles 1.8-3.0 mm long, 1.0-1.5 mm wide; pedicels 0.3-0.5 cm long; bracts subtending the flowers lanceolate, caducous, 2.0-4.0 mm long, 1.0-1.5 mm wide. Flowers with the calyx 3.0-4.0 mm long, the tube 1.0-1.5 mm long, externally pubescent, gland dotted; corolla yellow, 7.0-8.0 mm long, the standard ovate, 8.0-9.0 mm long, 4.0-4.5 mm wide, auriculate at the base, the wings oblong, 0.6-0.7 cm long, the claw 0.2 mm long, the keel falcate, 0.6-0.7 cm long, the stamens 0.7 cm long. Fruit ovate, 0.9-1.1 cm long, 0.5-0.7 cm wide, brown strigose; seeds ovoid, 3.0- 3.3 mm long, 1.5-2.0 mm wide, black or mottled.
          originalLanguage: en
          sourceField: general
