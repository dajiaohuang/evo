  claims:
    - subjectId: taxon:yutyrannus
      claimKind: scientific
      claimType: fossil-range
      statement: Yutyrannus is represented by three associated Lower Cretaceous Yixian Formation specimens; they establish a sampled local occurrence, not a complete genus range or a tyrannosauroid feather origin.
      confidence: high
      confidenceRationale: The holotype, referred specimens and formation are directly reported. High confidence is restricted to those individuals and provenance.
      referenceLinks:
        - referenceId: xu-2012-yutyrannus
          relation: supports
          pages: 92–95
          figure: Figures 1–3; Supplementary Information
          quoteLocator: Holotype and referred specimens; locality and horizon; systematic palaeontology
    - subjectId: taxon:yutyrannus
      claimKind: scientific
      claimType: taxonomy
      statement: Yutyrannus huali is described from three nearly complete skeletons representing two ontogenetic stages, and its basal tyrannosauroid placement is the result of the study's sampled phylogenetic analysis rather than a direct-ancestor claim.
      confidence: medium
      confidenceRationale: The named specimens and diagnosis are directly reported, while the wider placement depends on character coding, comparative sample and analysis settings.
      referenceLinks:
        - referenceId: xu-2012-yutyrannus
          relation: supports
          pages: 92–95
          figure: Figure 3; Supplementary Information
          quoteLocator: Abstract; systematic description; phylogenetic analysis
    - subjectId: taxon:yutyrannus
      claimKind: scientific
      claimType: morphology
      statement: The named Yutyrannus skeletons preserve a three-fingered manus, a typical theropod pes and long filamentous integumentary structures; these described structures do not directly establish their colour, complete body coverage or a single function.
      confidence: high
      confidenceRationale: The primary study documents the named skeletons and their integumentary structures directly; the explicit limits prevent anatomical preservation from being promoted to colour or functional evidence.
      referenceLinks:
        - referenceId: xu-2012-yutyrannus
          relation: supports
          pages: 92–95
          figure: Figures 1–2; Supplementary Information
          quoteLocator: Abstract; specimen descriptions; integumentary structures
    - subjectId: taxon:yutyrannus
      claimKind: scientific
      claimType: biogeography
      statement: This profile's geographic statement is limited to the Lower Cretaceous Yixian Formation of Liaoning Province, China, from which the three named Yutyrannus skeletons were reported; it does not assert a genus-wide distribution.
      confidence: high
      confidenceRationale: The formation and provincial provenance are directly reported for the three-skeleton sample, but that sample cannot establish a complete geographic range.
      referenceLinks:
        - referenceId: xu-2012-yutyrannus
          relation: supports
          pages: 92–95
          figure: Figures 1–2; Supplementary Information
          quoteLocator: Abstract; holotype and referred specimens; locality and horizon
    - subjectId: taxon:yutyrannus
      claimKind: scientific
      claimType: ecology
      statement: The cited study records specimen anatomy, large body size and filamentous integument but does not directly observe diet, habitat preference, locomotor behaviour, insulation, display or performance; those ecological interpretations remain unassigned here.
      confidence: medium
      confidenceRationale: The specimens and their preserved structures are direct evidence, but ecological roles and feather functions require inferences beyond what the study directly observes.
      referenceLinks:
        - referenceId: xu-2012-yutyrannus
          relation: supports
          pages: 92–95
          figure: Figures 1–3; Supplementary Information
          quoteLocator: Abstract; specimen descriptions; phylogenetic analysis
  claim-rationales.zh:
    - 正模、归入标本和地层均有直接报告。高置信度仅限这些个体及出处。
    - 具名标本和诊断有直接记录，而更广泛的系统位置依赖性状编码、比较样本和分析设定。
    - 一手论文直接记录具名骨架及其丝状体被；明确保留其不等同于颜色、全身体被或单一功能的边界。
    - 三件标本的地层和省级产地有直接记录，但该样本不能建立完整地理分布。
    - 标本和保存结构是直接证据，但生态角色与羽毛功能需要超出论文直接观察的推断。
  claim-statements.zh:
    - 羽王龙由下白垩统义县组三件相关标本表示；它们建立局部取样记录，不是完整属级范围或暴龙超科羽毛起源。
