        claims:
          - text: Like E. multifidus but leaf lobes broad and flattened, somewhat cuneate and bracts free almost to base.
            sourceIds:
              - sanbi_14144_0
            locator: "SANBI/WFO archive Morphology row 10385; source 14144.0; publication: Manning, JC; Goldblatt, P. 2012. Asteraceae: Euryops (Cass.) Cass. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 372 - 375. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: E. cuneatus is the only hexaploid known in the genus. The type of leaf division is essentially the same as in the related species E. multifidus, subcarnosus and namaquensis, i.e., the leaves are normally three-lobed with forked lateral lobes. The leaves are broader and more distinctly cuneate than in any of the allied species, however, and they are further greyish glaucous. The achenes are similar to those of E. multifidus, viz., copiously woolly with long and thin hairs, not becoming mucilaginous in water. There is a correlation between size of pollen grains and degree of ploidy in this group of species, the hexaploid (E. cuneatus) having the largest pollen grains. In cultivation in greenhouses the leaves become considerably enlarged, but they keep their characteristic cuneate shape and glaucous bloom.
