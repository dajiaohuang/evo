        usage:
          title: Tephrosia multifolia Rose, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrubs or erect herbs to 2.5 m tall, much branched; stems, leaves, and inflo- rescence pubescent, pilose, or velvety. Leaves to 35 cm long; leaflets (15-)21- 31(-40), linear, oblong or narrowly elliptic, 2-6 cm long, 0.5-1.2 cm wide, the middle leaflets often the longest, rounded to somewhat acute basally and apically, mucronulate, paler green and more densely pubescent beneath, the main second- ary veins 10-15 on each side, these and the midrib slightly raised beneath; petiole 1.5-3.0 cm long; rachis grooved, 5-25 cm long. Inflorescences terminal and ax- illary, to 20 cm long; peduncle 2-9 cm long, the nodes 20-50, buds to 7 per node; primary bracts 5-10 mm long; secondary bracts 4 mm long; pedicels 4 mm long, slender. Flowers drying to 15 mm long; calyx strigose, 3-6 mm long, the lower and 2 lateral teeth subequal, narrowly triangular to acuminate, the upper teeth connate, shorter, the teeth approximately equaling the tube; petals clawed, ap- parently white to pink, the standard circular to oblong, ca. 15 mm long, the claw to 3 mm long, densely covered with brown appressed hairs on the back, the wings narrow, oblong, ca. 15 mm long, the claw to 3 mm long, slightly adherent to the keel; keel narrow, oblong, to 5 mm wide, the claw to 3 mm long; staminal tube 10-15 mm long, the vexillary stamen connate in part, basally free; ovary silky, linear, ovules 8-10, the style hairy above. Fruit 5-6 cm long, 5 mm wide, widest toward the tip, flattened, slightly upcurved, velvety, the style base persistent, calyx persistent but somewhat torn, the 2 valves twisting on dehiscence; seeds 6-10, brown, oblong, 3 mm long.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 4717
          archiveSourceId: F14A98B7-04A7-4106-A35D-E157D643A917
