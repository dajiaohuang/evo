    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Tufted perennial, short rhizome to 8.0-10.0 mm diameter. Culm 240-980 mm tall, 0.9-1.2 mm thick, but ca. 2.0 mm thick across the rim of the leaf sheath, glabrous. Leaf sheath 30-125 mm long, glabrous, not papery, wine-red. Leaf blade 40-300 mm long, glabrous, canaliculate. Involucral bract 3-5, leaf-like, 11-60 mm long, glabrous. Inflorescence capitate, 8.0-10.0 mm diameter, each with over 10 spikelets. Spikelets 2.8-5.8 x 1.0-3.1 mm, terete, dark brown, florets bisexual. Glumes 1.8-5.0 x 1.0-2.1 mm, boat-shaped with a mucro 0.5 mm long, margins entire. Stamens 3, anthers crested. Style trifid. Nutlets 1.0-2.5 x 0.5-2.0 mm, dark brown, minutely papillose; hypogynous disc to 0.5 mm long, cupular, 6-9-lobed.
            textZh: Ficinia arnoldii Tshiila & Muasya 的 SANBI 物种条目记录了形态特征。
