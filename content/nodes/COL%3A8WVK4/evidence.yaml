            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Similar to Ficinia indica, differing in being tufted with surculose to short rhizomes (vs. stolons), and occurring in clay-rich renosterveld vegetation type (vs. deep sandy fynbos vegetation). Both F. arnoldii and F. laevis are restricted to renosterveld vegetation and do not overlap with the fynbos F. indica. with F. arnoldii occurring in the SW whereas F. laevis is found in the NW area of Western Cape and further north into the Northern Cape.
