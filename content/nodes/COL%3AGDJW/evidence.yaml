        usage:
          title: Ardisia panamensis Lundell, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrubs, the branchlets slender, terete, lepidote, the internodes ca. 1 cm long. Leaves with stout petioles 5-8 mm long, deeply sulcate on the upper surface, lepidote-furfuraceous with small appressed brown scales; leaf blades narrowly obovate-elliptic, 5.5-7 cm long and 2-3 cm wide, abruptly acute to long-acuminate apically, with an acute tip, obtuse basally, entire, thick and firm, conspicuously punctate with large glands, these most evident on the young leaves, dull, the venation prominulus, paler beneath, sparsely lepidote with minute brown scales, the costa stout and prominent, the lateral nerves prominent, divaricate at a wide angle, connected by the lax reticulation of the ultimate nerves. Inflorescences terminal, zigzag, twice branched, lax, many- flowered. Flowers 5-merous, umbellate at the ends of the branches, the main rachis strongly zigzag, bearing at the base of each branch a leaflike brown- punctate petioled bract 1-1.5 cm long; bracts at the base of the pedicels 1-2 mm long, persistent, linear, brown-punctate; pedicels slender, 10-13 mm long, pale, sparsely and minutely lepidote, often strongly curved, thickened apically; flower buds 3.5 mm long, acuminate; sepals 1-1.4 mm long, rounded- ovate, obtuse, glabrous, whitish, the margins scarious, bearing on the back a dense group of small reddish glands, the margins minutely denticulate; petals pale, ovate, 4.6 mm long, acuminate, punctate, a few large black glands, connate basally ca. 1.5 mm; stamens ca. 3.4 mm long, the filaments ca. 1.5 mm long, the anthers lanceolate, 1.5-2 mm long, long-acuminate, concolorous, longitudinally dehiscent; ovary ovoid, minutely punctate, the ovules 17-19, large, in several series, the style slender.
          originalLanguage: en
          sourceField: general
