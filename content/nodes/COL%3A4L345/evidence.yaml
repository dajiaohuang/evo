        claims:
          - text: Glandular-hairy annual to 24 cm. Leaves narrow, often toothed. Flowers in small heads, yellow with orange throat, salver-shaped, tube mostly glabrous, 11-26 mm long.
            sourceIds:
              - sanbi_14442_0
            locator: "SANBI/WFO archive Morphology row 5900; source 14442.0; publication: Manning, JC; Goldblatt, P. 2012. Scrophulariaceae: Polycarena Benth. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 752 - 752. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Its flowers resemble those of P. capensis, being yellow with a bearded orange star in the mouth, but it is a much less leafy plant than P. capensis, divaricately rather than corymbosely branched, with longer and narrower bracts (these bracts are a conspicuous feature, always much exceeding the calyx) and (even in well-grown plants) fewer flowers in the head, which gives the plant a dainty appearance (whence the trivial name). Both calyx and corolla tube are mostly longer than in P. capensis, and the tube of P. subtilis tends to be glabrous. The two species are allopatric, their areas meeting somewhere south of Piquetberg. On the other hand, P. subtilis occurs in the same geographical area as, but possibly always at lower altitudes than, P. gracilis, another dainty plant with even fewer flowers in the inflorescence than P. subtilis (up to 5(-7)) and these arranged in lax racemes rather than in heads. Polycarena gracilis lacks the conspicuous bracts of P. subtilis (4-7.5 mm long, versus 9-18 mm) and has a mostly shorter calyx (4-6 mm, versus (5-)6-9 mm). The limb of the corolla in P. gracilis is white to cream in colour, with the backs of the lobes as well as the tube often flushed with purple, and the orange patch in the throat is confined to the base of the posticous lip, which is more heavily bearded than the lateral lobes.
            textZh: SANBI 条目提供了该种的鉴别特征。
