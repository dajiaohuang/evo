  claims:
    - subjectId: event:famennian-maghriboselache-broad-snout
      claimKind: scientific
      claimType: event-mechanism
      statement: Several partly articulated Maghriboselache mohamezanei skeletons from the Famennian Thylacocephalan Layer of Morocco preserve three-dimensional neurocrania with a broad cartilage-enclosed snout, widely separated nasal capsules, a high-aspect-ratio tail and large pectoral fins; this is a specimen-level sensory and body-plan record, not a global crown-chondrichthyan origin.
      confidence: medium
      confidenceRationale: The primary study documents multiple named specimens, their Famennian layer and cranial and fin anatomy, while missing caudal regions, compression and matrix-sensitive placement limit organism-wide and lineage-wide inference.
      referenceLinks:
        - relation: supports
          referenceId: klug-2023-maghriboselache
          pages: 1–7
          figure: Figures 1–6; Supplementary Table S1
          quoteLocator: Introduction; Material; Systematic palaeontology; neurocranium description
        - relation: supports
          referenceId: klug-2023-maghriboselache
          pages: 19–28
          figure: Figures 13–15
          quoteLocator: Phylogenetic analysis; Discussion; Conclusions
  claim-rationales.zh:
    - 一手研究记录了多件具名标本、法门期层位以及脑颅和鳍部解剖；尾部缺失、压扁与矩阵依赖的位置限制了对完整个体和谱系的外推。
  claim-statements.zh:
    - 来自摩洛哥法门期噬甲动物层的数件部分关节相连 Maghriboselache mohamezanei 骨架保存三维脑颅、宽大的软骨包围吻部、相距很远的鼻囊、高展弦比尾和大型胸鳍；这是标本层级的感觉系统与体制记录，不是全球冠群软骨鱼起源。
