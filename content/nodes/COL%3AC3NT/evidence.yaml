    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants usually stemless, sometimes short-stemmed in old, robust plants; 150-300 mm tall excluding inflorescence; usually solitary. Leaves ±12 per rosette, 160-470 x 60-120 mm, upper surface channelled, dark green with many pale spots in irregular transverse bands, lower surface convex, pale green, lineate. Inflorescence with 3-8 ultimate branches, 1.0-1.75 m tall; racemes capitate to subcapitate, dense; bracts narrowly deltoid-acuminate, 10-20 x 2-4 mm, 3-many-nerved. Flowers dull flesh-pink to almost white, often with paler longitudinal stripes, 22-35 mm long, subclavate above basal constriction; outer segments free for 7-10 mm, inner segments adnate to outer; pedicels 12-25 mm long, length-ening to +30 mm in fruit. Anthers exserted 1-2 mm. Ovary 5.0-7.0 x 1.5-3.0 mm, green; style exserted 2-3 mm. Fruit 19-32 x 9-15 mm, pink-ish grey. Seeds deep grey-maroon, ±4.0 x 2.5 x 1.0 mm, wing small to absent.
