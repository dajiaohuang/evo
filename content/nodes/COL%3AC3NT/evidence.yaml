          - text: This species is very similar to A. zebrina and A. parvibracteata. It differs from both of these by the subdense to dense, conical to subcapitate terminal raceme. It differs from A. parvibracteata in that the leaf sap dries golden yellow, not (usually) purple, and from A. zebrina in that peak flowering time is winter (July) not autumn (March). These species intergrade in southern tropical Africa.
