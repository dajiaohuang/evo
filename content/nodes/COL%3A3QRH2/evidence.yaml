          title: Jubelina wilburii W.R.Anderson, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Lianas, all parts drying dark; stems sericeous or becoming glabrate, the tri- chomes golden brown, T-shaped, sessile, ca. 0.2 mm long, straight and appressed. Leaves opposite, sericeous, eglandular, elliptic ovate or rounded, acuminate at the apex, obtuse or rounded at the base, 11.0-17.5 cm long, 6.5-11.5 cm wide, sometimes with a few large sunken glands in the lower ?3 of the blade, sparsely and inconspicuously appressed-pubescent, soon glabrate, the midrib densely pu- bescent above, prominently sunken, primary lateral veins 5 or 6 on each side, arcuate-ascending; petioles 1.0-1.7 cm long; stipules triangular, 0.5 mm long. Inflorescences terminal and upper axillary, cymose-paniculate, the branches usually to 7 per node, densely rufous tomentose, the trichomes appressed to patulous, the distal nodes with leaflike bracts 6-17 mm long, these sericeous, prominently 2-4-glandular; flowers in 4-flowered umbels or 6-flowered corymbs; floral bracts 2-4(-6) mm long, ovate or elliptic, eglandular; peduncles 1.0-3.5 mm long; pedicels 2-4 mm long. Flowers with sepals 5, 2.5-3.0 mm long, narrowly ovate, obtuse and revolute at the apex, tomentose outside, glabrous within, the anterior sepal eglandular, the 4 lateral sepals each with 1 large gland, these 1.5 mm long; petals 5, clawed, greenish-yellow, sericeous, glabrous towards the mar- gin, the 4 lateral petals with the limb 3.0-4.5 mm long, 2.5-4.0 mm wide, rounded to broadly obovate, concave, rounded to weakly hastate at the base, the margin erose and usually eglandular, posterior petal erect, the limb 2.5-2.8 mm long, 1.5-2.5 mm wide, elliptic or obovate, the margin glandular; stamens 10, the fil- aments glabrous, connate at the base, to ca. 1 mm high, 1.8-2.5 mm long, slightly unequal, the anthers subequal, to 1 mm long, glabrous; ovary globular, 1.5 mm high, tomentose, each of the 3 carpels several-sulcate, the styles 3, 2 mm long, equalling or slightly exceeding the anthers, glabrous or pubescent, subequal, the anterior style inclined toward the posterior petal, the 2 posterior styles arcuate- ascending. Fruits of 3 samaras or 1 or 2 by abortion, 2.0-2.5 cm long, 5-6 cm wide, sparsely appressed-pubescent throughout; samaras with the lateral wings broadly ovate, confluent at the base, 2.5-4.0 cm long, 2.5-3.5 cm wide, rounded at the apex, the veins conspicuous, the dorsal wing 2.0-2.7 cm wide, 1.0-1.3 cm high, semicircular; seed pyriform, ca. 1 cm long.
