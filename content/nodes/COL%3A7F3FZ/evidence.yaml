        usage:
          title: Urvillea ulmacea Kunth, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Vines, the younger parts herbaceous, becoming woody; stems terete when young, striate, -sparsely uncinate-pubescent, the older stems terete or 3-sided, 3-sulcate, shiny, glabrate. Leaves 3-f oliolate, 4-15 mm long; petiole without wings, 1-6 cm long, margined, glabrate to sparsely pubescent; leaflets ovate to ovate-lanceolate, acuminate to obtuse at the apex, attenuate at the base on termi- nal leaflets, obtuse to subeordate on lateral leaflets, 2-7(-9) cm long, 1-3.5(-4.5) cm wide, serrate to crenate marginally except at the base, the teeth glandular, the upper surface strigose to villous on the midrib and some major veins, the re- mainder glabrous or sparsely puberulent, the lower surface densely pubescent to almost glabrous except on the veins; stipules inconspicuous. Thyrses borne on short branches in the upper axils, usually subtended by tendrils, the floriferous part usually less than 3 cm long; pedicels glabrous, 1.5-2.5 mm long, articulate in the lower third. Flowers white, to 4 mm long; sepals ovate to ovate-oblong, glabrous, ciliate, the outer sepals to ca. 1.5 mm long; petals obovate, glabrous out- side, glandular inside, ciliate, the anterior scales ellipsoid, 1/2-2/3 as long as the petals, conspicuously ciliate, the crest fan shaped, thin, pale yellow green, con- spicuously villous along the upper margin and back side, the deflexed appendage rounded, slightly longer than the crest, glabrous except conspicuously ciliate, the cilia longer than the appendage itself; disc glands 2, large for size of flower, slightly pubescent; stamens free with glabrous filaments; ovary glabrous or mi- nutely puberulent, the style short. Capsules elliptic, to 4 cm long and 2 cm wide, obtuse to rounded at the apex, sometimes emarginate, stipitate and acute at the base, the cells somewhat inflated, the wings soft and thin; seeds oval, dark, shiny, 3-4 mm long, the hilum near one end, reniform.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 12572
