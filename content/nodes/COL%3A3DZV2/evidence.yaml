    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Subcaulescent, cormous geophyte to 15 cm, stems branched at ground level. Basal leaves sword-shaped, leathery, without a central vein, cauline leaves shorter. Flowers yellow with dark spots at base of tepal limbs, limbs with crisped, pale yellow margins, sweetly scented, anther lobes divaricate, ovary beaked.
            textZh: Ferraria flava Goldblatt & J.C.Manning 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 7492; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Immediately recognised by the bright yellow, sweetly scented flowers and typically stemless habit, with well-grown plants bearing 3 or 4 main branches arising below the ground and with numerous rhipidia set closely together. The several broad, firm to rigid leathery leaves, up to 300 x 20 mm, recall those of F. divaricata, which has aerial stems and larger, usually predominantly brown flowers (but sometimes dull yellow) with a wider floral cup. The flowers of F. flava resemble those of F. macrochlamys and its immediate allies in having a relatively narrow floral cup but are larger, with tepals ± 30 x 10 mm and claws ± 15 mm long, and last a single day, unlike those of the F. macrochlamys group, which have smaller tepals with claws 10-14 mm long, and last two days.
            textZh: SANBI 条目提供了 Ferraria flava Goldblatt & J.C.Manning 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 95232; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
