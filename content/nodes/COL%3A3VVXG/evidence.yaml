        claims:
          - text: Short-lived perennial or annual, loosely tufted, up to 0.8 m high. Leaf blades 110-220 mm long, 3-8 mm wide. Spikelets 8-20 mm long, 2-10 mm wide. Glumes ascending or spreading, not concealing spikelets, a quarter to half (to three-quarters) the spikelet length; lemmas acute, not turgid at maturity, awn to 15 mm long. Mature caryopsis more than 3 times as long as wide.
