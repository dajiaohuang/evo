    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Erect herb up to 0.4 m high when in fruit. Tuber 0.10-0.15 m diameter, flattened globose to spindle-shaped. Aerial stems 1 or 2, erect, up to 0.3 m long, 2-3 mm diameter, puberulous, branching lateral. Leaves spreading, puberulous, petiolate; petiole 2-5 mm long; blade 40-45 x 20-25 mm, elliptic, sometimes ovate to obovate, coriaceous, above glossy, green, beneath pale green, secondary veins divaricate and 7-10 to a side, apex obtuse-mucronate, base cuneate to obtuse. Inflorescences terminal, compact, globose, 8-15-flowered, puberulous, peduncles 10-15 mm long, pedicels 0-3 mm long; bracts 2-3 mm long, subulate. Sepals 4-5 x 1 mm, linear-triangular, puberulous, green, apex attenuate. Corolla tube 2-3 mm long, campanulate, outside puberulous, citron-green, inside sulphur-yellow with maroon ridges; lobes 4-5 x 2-2.5 mm, ovate, outside puberulous, inside citron-green with maroon base, apex obtuse to acute. Coronal feet hemi-globose, free, tri-segmented; central segment 4-5 mm long, filiform, pinkish to greenish, papillose, apex simple, tortuose; lateral segments 1-1.5 mm long, subulate, green. Stamens from inner base of coronal feet; filaments 2.5-3 mm long, filiform; anthers 1.5-2 mm long, narrowly ovate-triangular, full length slits, apex attenuate. Ovaries 0.5-1 mm long; style 2 mm long, terete, nectiferous, upper half green, lower maroon; style-head 2 x 1 mm, ovoid, apex green, acute; translators ±2 mm long, spoon elliptic. Gynostegium in corolla mouth. Follicles erect, solitary or paired, 110-150 x 4-5 mm, very narrowly ovoid. Seeds obliquely ovate and concave, brown; coma 25-30 mm long, whitish.
