  claims:
    - subjectId: event:juramaia-conditional-provenance
      claimKind: scientific
      claimType: topology
      statement: BMNH PM1343B preserves a partial articulated skeleton whose original study attributed it to approximately 160-million-year-old Tiaojishan strata and recovered a basal eutherian position; provenance, age use and topology remain conditional, and an unconstrained tip-dating analysis instead estimated an Early Cretaceous morphological age signal.
      confidence: contested
      confidenceRationale: The specimen anatomy is direct, but collection provenance, stratigraphic attribution, character scores and tip-dating priors condition the competing age and topology interpretations.
