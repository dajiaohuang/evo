  claim-rationales.zh:
    - 标本解剖是直接证据，但采集产地、地层归属、性状评分和尖端定年先验制约相互竞争的年代与拓扑解释。
  claim-statements.zh:
    - BMNH PM1343B 保存部分关节相连骨架，原研究将其归入约 1.60 亿年前的髫髻山组并恢复为基干真兽类；产地、年代用途和拓扑仍有条件限制，无约束尖端定年则估算出早白垩世的形态年龄信号。
