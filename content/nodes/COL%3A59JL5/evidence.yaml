          publishedAt: undated
          originalSourceText: Creeping, much branched, often epiphytic small shrubs; stems becoming dark brown, slender, slightly fleshy, glabrous. Leaves opposite, fleshy; blades obovate to rhomboidal, to 2.5 cm long and 1.8 cm wide, the base cuneate, abruptly narrowly decurrent, the margins slightly crenate in distal half or two-thirds, the apex rounded to obtuse, the surfaces glabrous, the veins obscurely trinervate near base; petioles to 2.5 cm long, with slender bases, becoming slightly but distinctly broader distally. Inflorescence terminal on lateral branches, slightly corymbose, the branches sparsely puberulous. Heads sessile or nearly sessile in clusters of 2-4, 8-9 mm high and ca. 3 mm wide with 10-12 florets; involucral bracts 25-30, imbricate, in ca. 5 series, 1-7 mm long, short-orbicular to oblong with rounded scarious tips, the outer surface glabrous with 3-5 striations; corolla white, ca. 3.5
