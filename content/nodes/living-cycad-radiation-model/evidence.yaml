  claims:
    - subjectId: event:living-cycad-radiation-model
      claimKind: scientific
      claimType: divergence-time
      statement: A 2011 fossil-calibrated molecular analysis inferred that most sampled living cycad species originated within roughly the preceding 12 million years, but later fossil-integrated work weakens a simple globally synchronous-radiation narrative; none of these models dates the origin or fossil first appearance of Cycadales.
      confidence: medium
      confidenceRationale: The 2011 result is a reproducible model estimate for sampled living lineages, while later analyses use different taxon, fossil and calibration treatments and recover much older deep nodes. Medium confidence applies to the documented history of model results and their scope, not to a single universal age for living cycad diversification.
      referenceLinks:
        - relation: supports
          referenceId: nagalingum-2011-living-cycad-radiation
          pages: 796–799
          figure: Figure 1; Table 1
          quoteLocator: Abstract; fossil-calibrated timetrees and diversification results
        - relation: contextualizes
          referenceId: liu-2022-cycadaceae-palaeogene
          pages: 217–230
          figure: Figures 2–3; Table 2
          quoteLocator: Molecular dating; Discussion
        - relation: contextualizes
          referenceId: coiro-2023-cycad-biogeography
          pages: 1623–1629
          figure: Figures 2–3; Table 1
          quoteLocator: Total-evidence dating of cycads; Discussion
  claim-rationales.zh:
    - 2011 年结果是针对取样现生谱系的可复现模型估计；后续分析采用不同的分类取样、化石和校准处理，并恢复出更老的深层节点。中等置信度适用于模型结果及其边界的研究史，不适用于一个普适的现生苏铁多样化年龄。
  claim-statements.zh:
    - 2011 年一项化石校准的分子分析推断，多数取样现生苏铁物种形成于约最近 1200 万年内；但后续整合化石的研究削弱了简单的全球同步辐射叙事。任何一套模型都没有给出苏铁目的起源或化石首现年代。
