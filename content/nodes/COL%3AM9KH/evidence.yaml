          originalSourceText: Shrub or small tree up to 6 m. high, with slender, more or less pubescent branches; leaves serrate, thin, appressed-hispidulous above, pilosulous or puberulent beneath, those of adjacent nodes strongly dimorphic and unequal; larger leaves elliptic-ovate, 5-15 cm. long, 1.5-5 cm. wide, cuspidate-acuminate, acute or rounded at base, somewhat oblique, with slender petioles 5-20 mm. long, the smaller leaves (often soon deciduous) orbicular or subreniform, 5-10 mm. long and broad, usually emarginate at base, sessile; plants monoecious or dioecious, the flower-clusters axillary, generally unisexual; staminate perianth 4-lobed; pistillate perianth about 2 mm. long, stipitate, very slightly compressed, bidentate.
