    facets:
      morphology:
        status: partially-supported
        claims:
          - text: "Plant: a dwarf succulent herb, with a depressed subglobose body and a subtuberous tap root. Body almost discoid, 22-30 mm diam. with a tessellately tuberculate central area; tubercles unequally hexagonal, scarcely prominent. Branches relatively few and widely spaced, successively developed from the tubercle axils, erectly to widely spreading, prominently tuberculate, almost cylindric or slightly tapering, up to 75 mm long, 10 mm diam. at the enlarged base; sometimes flowering when less than 10 mm long. Leaves rudimentary, estipulate, fleshy, ovate, acute, concave (not folded), fleeting, leaving a prominent, circular white scar. Inflorescence axillary from near the apex of the branches; peduncles erectly spreading, up to 20 mm long, subpersistent becoming thin and hard but scarcely spine-like, bearing a few distant bracts and a solitary, bisexual cyathium carried on a short stipe obscurely jointed to the apex of the peduncle; bracts oblong, obtuse, minutely ciliate, concave, ca. 2 mm long, fleeting, leaving a prominent lunate scar. Involucre campanulate, ca. 7.5 mm diam. including the glands, glabrous, green, lightly red striate; inside glabrous except for some hairs below the inner margin of the glands at the apex of the obsolescent septa, which also usually carry a small subplumose bracteole. Glands 5, distant, thick and fleshy, almost truncate-globose, ca. circular seen from above, ca. 2 mm diam., deeply concave, brownish becoming green, bottle-green with copious nectar in the cavity, sometimes with 2 or 3 minute teeth on the outer margin. Lobes 5, transversely oblong, usually somewhat emarginate, irregularly laciniate toothed, glabrous but minutely ciliate, green, ca. 1.5 mm wide, closely contiguous at the base of the glands. Male flowers far exserted, widely spreading, successively developed; pedicels, pubescent, ca. 2.5 mm long; filaments glabrous, white, ca. 1.25 mm long; anther thecae red; pollen snow-white. Bracteoles subplumose, ca. 2 mm long. Female flower shortly pedicellate; ovary ca. ovoid, softly crisped hairy; styles stout, green, free to the base, spreading recurved. Capsule 3-lobed, subglobose, ca. 6 mm diam., 5 mm high, erect, just exserted from the involucre, softly crisped pubescent, but often glabrous at dehiscence. Seed ca. broadly ovoid, obscurely 4-angled, densely echinulate and raggedly rugulose, less densely on the ventral face and smooth each side of the suture and below the acute apex, ca. 3 mm x 2.5 mm."
            sourceIds:
              - sanbi_2937_0
            locator: "SANBI/WFO archive Morphology row 82931; source 2937.0; publication: Leach, LC. 1985. A new species of Euphorbia (Euphorbiaceae) from the Cape Province. S. African J. Bot. 51: 281 - 283. [Copyright held by the South African Association of Botanists (1985); http://www.sciencedirect.com/science/journal/02546299]. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: With snow-white pollen E. albipollinifera appears to be unique in the genus. Although pollen colour is seldom recorded I have seen the majority of the African species in flower; moreover, white pollen seems to be extremely rare among flowering plants as a whole. The new species is probably most closely related to E. albertensis N.E. Br. and E. brevirama N.E. Br. but is a smaller plant with a depressed, flat-topped, almost discoid body, and with subpersistent, neither woody nor spinescent peduncles. It is also distinguished from the former by its proportionally broader, scarcely raised tubercles and longer more widely spaced branches, and especially by its deeply concave, almost subglobose, more or less circular glands. Although in this latter character very similar to E. brevirama, it is quite different in its pilose ovary and short styles which are free to the base. Other unusual features include the peduncle which is jointed towards its apex, sometimes with the apical portion set at a slight angle to the rest of the peduncle; this portion dries and falls with the cyathium if this fails to set fruit, while the lower portion of the peduncle remains green. It is not certain, however, whether this character is entirely constant, as in the plant collected by Bursey, the entire peduncle sometimes withered. Finally the minutely echinulate seed coat appears to be quite characteristic of the species.
