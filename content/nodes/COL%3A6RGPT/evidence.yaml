      ecology:
        status: partially-supported
        claims:
          - text: According to collection-lot labels, the reported individuals were collected in the main channel of the rio Amazonas, in white water, over a bottom rich in organic matter and pieces of wood. This is a label-based habitat observation from the cited treatment, not a species-wide habitat preference or complete distribution statement.
