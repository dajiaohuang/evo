    facets:
      morphology:
        status: partially-supported
        claims:
          - text: The diagnosis describes Microglanis lundbergi by a deeply notched forked caudal fin, two juxtaposed pale elliptical spots on the supraoccipital region, and an adipose-fin base 13.1-16.6% of SL. The description reports orange-brown coloration with pale supraoccipital spots and other preserved-color pattern details. These are treatment-level diagnostic and descriptive observations, not an assessment of variation across all populations. The morphometric table reports n=9, while the listed type series totals 10 specimens; this discrepancy is retained as unresolved.
            originalLanguage: en
            sourceIds:
              - jarduli_shibatta_2013
              - plazi_archive_6rgpt
            locator: Plazi description-extension row 4 (diagnosis), row 5 (description); treatment https://treatment.plazi.org/id/03B8FF3BA628895BFED2FC433E406821; original article p. 508 (Plazi row 4) and pp. 508-509 (row 5); DOI 10.1590/S1679-62252013000300004; source archive 95e56920-147b-4e47-bf6f-858c13683b7f.zip; archive SHA-256 75f4e69193f65cfa0e32a728ae690f065ed0c860d58e1760adfbd8ca6d3d107e. Source ZIP absent from checkout; embedded EML not rechecked. Article item-level reuse rights unknown.
            placeTimeScope: Diagnosis on p. 508, description on pp. 508-509, and morphometric table (n=9) in the 2013 treatment. The examined type series listed in that article totals 10; the source does not resolve the difference from the table sample, so no reconciliation is inferred.
            lifeStatus: Morphology and preserved coloration of specimens described in the treatment; no population-wide variation or live-color claim is made.
        gaps:
          - Selected diagnostic and descriptive characters come from one taxonomic treatment and its stated comparative or examined samples; neither dossier assesses variation across all populations or life stages. The Microglanis lundbergi article's morphometric table reports n=9 while its listed type series totals 10 specimens; that difference is unresolved.
