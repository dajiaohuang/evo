            locator: Plazi description-extension row 7 (biology_ecology); treatment https://treatment.plazi.org/id/03B8FF3BA628895BFED2FC433E406821; original article p. 510 (Plazi row 7); DOI 10.1590/S1679-62252013000300004; source archive 95e56920-147b-4e47-bf6f-858c13683b7f.zip; archive SHA-256 75f4e69193f65cfa0e32a728ae690f065ed0c860d58e1760adfbd8ca6d3d107e. Source ZIP absent from checkout; embedded EML not rechecked. Article item-level reuse rights unknown.
            placeTimeScope: Habitat note on p. 510 explicitly attributes the observation to collection-lot labels. It is limited to the reported material and location; other localities, dates, and habitat conditions were not inferred from this note.
            lifeStatus: Wild collection-label observations only; no broader ecological, abundance, or conservation conclusion is made.
        gaps:
