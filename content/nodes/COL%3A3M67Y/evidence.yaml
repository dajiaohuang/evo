        usage:
          title: Hoffmannia gentryi Dwyer, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: well spaced. Leaves oblong or ovate oblong, 12-20 cm long, 5-10 cm wide, deltoid toward the apex, occasionally acute, acute or obtuse at the base, rarely subtruncate, the costa prominulous on both sides, the lateral veins ca. 10, arcuate and scarcely prominulous, the intervenal areas lightly reticulate, the undulate submarginal vein to 5 mm from the margin, membranous, scarcely discolorous, hairy on both sides, the hairs on upper surface few, subulate, spreading or ap- pressed, mostly confined to the costa and the veins, below more dense, often curled and giving a webby effect; petioles weak, slender, often curved, to 4.5 cm long, densely hairy; stipules deciduous. Inflorescences axillary, to 2.5 cm long; peduncle slender, to 1.5 cm long, ca. 0.3 mm wide, the cymes 4-5-flowered, the flowers unilaterally and helicoidally disposed. Flowers subsessile, densely villose, the hypanthium turbinate, to 2.5 mm long, the lobes 4, narrowly oblong; corolla light green, subcampanulate, the tube about as long as the calycine teeth, perhaps glabrous outside, raphides abundant, the lobes 4, longer than the tube; stamens 4, erect, the anthers oblong, ca. 4 mm long, subsessile, attached near the mouth; style slender, exceeding the anthers, the stigmas connate, clavate, ca. 1.5 mm long. Fruits not seen.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 11765
          archiveSourceId: D7A352F6-3545-46A5-9064-FAAF5363380B
