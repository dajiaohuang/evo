    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Tufted annual, rarely perennial 500-2 000 mm high; hygrophyte; stoloniferous. Leaf blade 150-600 x 5-25 mm; ligule absent. In-florescence 100-300 mm long, untidily ovate; raceme 30-150 mm long, distinctly compound with many short secondary branchlets; spikelets in dense clusters. Spikelet 2.0-3.5 x 1.0-1.5 mm, elliptic; glumes and lower lemma minutely hairy, nerves with long, rigid hairs; lower floret male or sterile; lower lemma acute or with a short curved awn 1-3(-7) mm long; upper lemma 2.0-2.5(3.0) mm long; anther 0.5-1.3 mm long.
