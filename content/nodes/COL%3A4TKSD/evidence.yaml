    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Primocanes 1.0-1.5 m long, erect and arching or sprawling, covered in a white bloom; axis terete, eglandular; sparsely or densely covered in 1-4 mm long prickles, often with fine acicles at the base. Floricanes reddish, glabrous, with or without a bloom; sparsely covered in 3-5 mm long, patent and partly deflexed prickles or densely armed with robust curved prickles. Leaves 5-9 partite on floricanes; 3-7 partite on primocanes; lacerate, laciniate or incised; upper surface glabrous or sparsely pubescent on the blade, pubescent along the sunken veins; lower surface fine to coarsely woolly, pale greenish white to silver-white. Stipules inserted 1-5 mm above the base of the petiole, persistent, linear to lanceolate-falcate; 4-15 mm long, 0.5-2.0 mm wide, acute, entire, glabrous inside, pubescent, tip glandular. Petioles of primo-cane leaves 12-40 mm long, of floricane leaves12-40 mm long. Synflorescence a few to many flowered frondose-bracteose thyrse; rhachis with or without prickles, glabrous to pubescent; pedicels with or without prickles. Flowers 10-13 mm wide, 4-7 mm deep. Hypanthium saucer-shaped, 4-5 mm across, finely pubescent outside, glabrous inside except near the base of the torus. Sepals 5-6 equal, spreading and upcurving at the tips, becoming erect after anthesis; teeth triangular, 5-10 mm long, 2-3 mm wide, pubescent. Petals pale pink to crimson, 5.5-7.0 mm long, 4.0-5.6 mm wide, held vertically. Stamens 100-120, glabrous, upcurving; filaments 5.0 mm long, held in two rows. Pistils 40-45, 2.5-3.5 mm long, variously pubescent below. Collective fruit ovoid, 6-10 mm across, densely white pubescent.
