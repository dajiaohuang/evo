    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Very densely tufted perennial 250-1000 mm. Leaf blade to 700 x 0.5 mm, tightly rolled, setaceous, scaberulous; ligule acute. Inflorescence contracted, usually not extending above leaves. Spikelet 4.0-5.0(-5.5) mm long (excluding awn); glumes ± equal, very long acuminate, membranous, hyaline, flushed purple; lemma ± laterally compressed, widest at middle, elliptic, symmetrical, strongly overlapping, rounded to crown; crown straight-sided, rim hairs less than 0.5 mm, finely tuberculate, hairy basally; awn ± centrally placed, up to 80 mm long, fine, inconspicuously geniculate, twisted, scabrid; callus short, obtuse, long hairy; anthers 1.2-1.5 mm long.
