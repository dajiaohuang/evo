    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, mostly 150-400 mm tall, stem usually branched, smooth. Leaves linear-lanceolate, pleated, velvety. Flowers several in a dense, erect spike, bilabiate, cream to white, flushed lilac outside, odourless, perianth tube elongate-cylindrical, (30-)35-45 mm long, dorsal tepal 20-23 mm long, ovary smooth, bracts dry, translucent pale brown or colourless with brown flecks, attenuate, inner bract divided in the upper two thirds.
            textZh: Babiana spathacea (L.f.) Ker Gawl. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_14562_0
            locator: "SANBI/WFO archive Morphology row 33033; source identifier 14562.0; cited publication: Goldblatt, P; Manning, JC. 2013. Iridaceae. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 94 - 124. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Immediately recognised by the long-tubed, usually creamy beige to ± white flowers with dark red to purple markings near the bases of the lower three tepals, a perianth tube 35-45 mm long and dorsal tepal ± 25 mm long. The dry, membranous, long-cuspidate floral bracts, which prompted the name spathacea, are distinctive only in combination with the perianth characters. Two other species also have similar floral bracts, B. scariosa, which has bilabiate, blue flowers with a relatively short perianth tube, 12-20 mm long, and the acaulescent B. papyracea, which has large, radially symmetric flowers. South of Nieuwoudtville plants included in B. spathacea are unusually variable, some having pale lilac-blue flowers with purple markings, a somewhat smaller perianth with the tube 30-36 mm long and the dorsal tepal 13-23 mm long. These plants also sometimes have longer style branches, up to 4 mm long, unusual for the species, in which 1.8-2.0 mm long is typical. It seems likely that hybridisation with Babiana scariosa, which also grows there and in the same habitat, is the source of the bluish colouring, shorter perianth tube, and longer style branches. Closer to Nieuwoudtville plants have white flowers with red markings, flushed lilac on the tube and reverse of the tepals, and the anthers and pollen are dark purple. Flowers are smaller and have a tube ± 30 mm long and a dorsal tepal ± 15 mm long, but the style branches in these plants are 2.0-2.5 mm long, which is typical of B. spathacea.
            textZh: SANBI 条目提供了 Babiana spathacea (L.f.) Ker Gawl. 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 94972; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
