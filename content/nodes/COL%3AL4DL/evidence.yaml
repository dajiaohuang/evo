          originalSourceText: Unarmed shrub or small tree to 7 m. tall, branchlets brown-pubescent when young. Leaves ovate, glabrous above and pubescent below, conspicuously 9- to 11-nerved, up to 12 cm. long and almost as broad, cleft apically up to I/2 their length, basally rounded to subcordate, lobes lanceolate, acute; petiole about 2 cm. long, calloused basally and at insertion of the blade. Inflorescence a terminal raceme up to 10 cm. long or longer, rufous-pubescent, with pedicels up to 2 cm. long. Flowers whitish, about 4.5 cm. long; calyx elongated, about 4.5 cm. long, subregular, tube about 1 cm. long; petals linear, elongated, about 3 cm. long; fertile stamens 10, up to 4 cm. long, in 2 series; anthers linear, basally sagittate, about 1 cm. long in bud; ovary stipitate, pubescent. Legume linear, lightly pubescent, stipitate, up to 20 cm. long and 1 cm. wide.
