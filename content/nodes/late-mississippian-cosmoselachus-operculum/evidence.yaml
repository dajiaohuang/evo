          quoteLocator: CT reconstruction; branchial anatomy; phylogenetic analysis
  claim-rationales.zh:
    - 一手描述和 CT 复原直接记录了具编号的部分标本与鳃盖解剖，但其受损和身体不完整限制了更广泛的功能推断。
  claim-statements.zh:
    - 晚密西西比世 Fayetteville 页岩的 Cosmoselachus mehlingi 部分正模 AMNH FF 20509 保存来自舌弓和鳃弓、融合成波纹状鳃盖并覆盖至少两个后部鳃弓的长辐条。
