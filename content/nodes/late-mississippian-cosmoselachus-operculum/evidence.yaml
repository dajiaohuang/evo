  claims:
    - subjectId: event:late-mississippian-cosmoselachus-operculum
      claimKind: scientific
      claimType: event-mechanism
      statement: The partial holotype AMNH FF 20509 of Cosmoselachus mehlingi from the Late Mississippian Fayetteville Shale preserves elongate rays from the hyoid and branchial arches fused into a corrugated operculum covering at least two posterior branchial arches.
      confidence: medium
      confidenceRationale: The primary description and CT reconstruction directly document the accessioned partial specimen and operculate anatomy, while its damage and incomplete body limit broader functional inference.
