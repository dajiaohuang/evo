    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Perennial herb, 0.8-1.2 m high; stem thick, often flexuous. Leaves distichous, erect, ensiform, coriaceous, arranged in a fan-shaped manner. Bracts alternate, spathe-like, sheathing; apices brown. Spathe 45-60 mm long, robust, apex obtuse or emarginate. Inflorescence erect with slight zigzag curvature; perianth white with yellow nectar guides on outer tepals; tepal claws speckled orange, bearded. Stamens pressed against petaloid style; filaments filiform, 6 mm long; anthers 4 mm long. Ovary green, inferior, turbinate, 10 mm long; style 3 mm long, with white, acuminate branches. Flowering time Sept.-? Capsule subglobose, 25-35 x 20 mm, subpendulous, indehiscent, walls disintegrating when mature.
            textZh: Dietes butcheriana Gerstner 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_18505_0
            locator: "SANBI/WFO archive Morphology row 90733; source identifier 18505.0; cited publication: Bredenkamp, CL; Magwaza, ZL. 2019. Iridaceae. In: CL Bredenkamp (ed.), A Flora of the Eastern Cape Province, Strelitzia 41(3): 1821 - 1882. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Recognised by its very broad leaves, mostly 30-50 mm wide, Dietes butcheriana has white flowers closely resembling those of D. iridioides but with white rather than blue-purple flushed style branches. The large capsules, up to 35 x 20 mm, are pendent and have a smooth surface and rounded apex quite different from the beaked and wrinkled capsules of D. iridioides and are indehiscent, the walls slowly decaying to release the seeds.
            textZh: SANBI 条目提供了 Dietes butcheriana Gerstner 的鉴别特征。
