        usage:
          title: Herpetacanthus panamensis Leonard, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Herbs, sometimes suffrutescent to 50 cm tall; stems ascending, sparingly branched, sometimes rooting at the lower nodes, young stem quadrangular, puberulous to pilose, the hairs reddish, old stem terete, glabrous. Leaves elliptic, to 13 cm long, 5.5 cm wide, apically acute to slightly acuminate, basally acute to attenuate, glabrous to pilose, and the cystoliths dense and prominent on both the surfaces, the margins undulate; petioles short, to ca. 3 mm long, puberulous to pilose. Inflorescences in terminal and axillary spicate panicles, the spikes to 3 cm long, 1 cm wide, the peduncles puberulous to pilose; bracts loosely im- bricate, ovate to elliptic, to 13 mm long, 7 mm wide, apically acute, pilose, the margins ciliate; bracteoles alike, 2 mm wide. Flowers with 5-merous calyx to 4 mm long, the segments subulate, 3.5 mm long, 0.5 mm wide basally, glabrous outside, finely glandular puberulous inside, tipped by 1 or 2 hairs; corolla white, to 17 mm long, the tube 9 mm long, 1.5 mm wide basally, 3.5 mm wide at the mouth, the lips ca. 8 mm long, puberulous toward the tip, the upper lip ovate, 3.5 mm wide, apically minutely bidentate, the lower lip 3-lobed, the lobes 2 mm long, the middle lobe rounded, 2.5 mm wide, the lateral lobes acute, 1.5 mm wide, the longer of each pair of stamens barely exserted. Capsules clavate, sparingly puberulous, 10 mm long, 2.5 mm broad; seeds 4, flattened, ovate, 2.5 mm long, 2 mm wide, roughened.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 40
