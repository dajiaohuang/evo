  claims:
    - subjectId: taxon:ornithischia
      claimKind: scientific
      claimType: topology
      statement: Ornithischia is represented by the taxa and characters sampled in Butler and colleagues’ morphology analysis; internal relationships are a matrix hypothesis and do not encode direct ancestors or exact clade duration.
      confidence: medium
      confidenceRationale: The broad cladistic analysis is explicit and reproducible, but several placements depend on character scoring and missing data. Medium confidence preserves that scope.
      referenceLinks:
        - referenceId: butler-2008-ornithischian-phylogeny
          relation: supports
          pages: 1–40
          figure: Figures 1–4; Tables 1–2; appendices
          quoteLocator: Methods and taxon sample; Results; discussion of unstable nodes
    - subjectId: taxon:ornithischia
      claimKind: scientific
      claimType: fossil-range
      statement: Ornithischia is displayed at 216.5–201.4 Ma only as the source-bounded uppermost-Triassic Eocursor sample and its ICS stage conversion, not an Ornithischia FAD or LAD. The interval is a source-bounded sample window, not a global FAD, LAD, divergence date, continuous occupancy claim or direct-ancestor assertion.
      confidence: medium
      confidenceRationale: Ornithischia uses Butler, R.J.; Upchurch, P.; Norman, D.B. (2008) because the cited pages and locator expose the sampled taxon, specimen or living sequence set. Confidence is medium and applies only to Lower Elliot Formation Eocursor sample, South Africa; broader endpoints remain unclaimed.
      referenceLinks:
        - relation: supports
          referenceId: butler-2008-ornithischian-phylogeny
          pages: 1–40
          figure: Figures 1–4; Tables 1–2; appendices
          quoteLocator: Methods and taxon sample; Results; discussion of unstable nodes
        - relation: contextualizes
          referenceId: ics-2026-06
          pages: International Chronostratigraphic Chart v2026/06
          figure: Global chronostratigraphic scale
          quoteLocator: Numerical boundaries for named geological stages used to bound the source sample
  claim-rationales.zh:
    - 广泛支序分析明确且可复现，但若干位置依赖字符编码和缺失数据；中等置信度保留该范围。
    - Ornithischia 采用 Butler, R.J.; Upchurch, P.; Norman, D.B.（2008）的论文，因为所引页码与定位符直接标示了研究采样的类群、标本或现生序列集合。中等置信度仅适用于 Lower Elliot Formation Eocursor sample, South Africa；更宽泛端点保持未声明。
  claim-statements.zh:
    - 鸟臀目表示 Butler 等人形态分析中取样的类群和字符；内部关系属于矩阵假说，不编码直接祖先或精确支系时长。
    - Ornithischia 仅以 216.5–201.4 Ma 展示为论文限定的南非 Eocursor 晚三叠世样本及其 ICS 阶段换算，而非鸟臀类的全球首现或末现。该区间是来源限定的样本窗口，不是全球首现、末现、分化日期、连续占据或直接祖先断言。
  ranges:
    - entityId: ornithischia
      rangeKind: global-composite
      taxonomicConcept: Ornithischia — source-bounded sample window
      geographicScope: Lower Elliot Formation Eocursor sample, South Africa
      olderMa: 216.5
      youngerMa: 201.4
      status: available
      uncertainty:
        olderMa: null
        youngerMa: null
        note: This display is limited to the source-bounded uppermost-Triassic Eocursor sample and its ICS stage conversion, not an Ornithischia FAD or LAD; numerical stage conversions follow ICS v2026/06 where applicable.
      evidenceBasis: The phylogeny of the ornithischian dinosaurs directly anchors the sampled window; the display does not extrapolate it into a global taxon duration.
      confidence: medium
