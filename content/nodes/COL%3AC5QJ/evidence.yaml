  catalogue-dossier:
    scientificName: Alouatta palliata (Gray, 1849)
    authorship: (Gray, 1849)
    rank: species
    sourceDatasetId: "2144"
    identity:
      method: Exact COL26.8 accepted usage C5QJ checked for verbatim name, authorship, species rank, accepted status and sourceDatasetId 2144; each accepted parent node was followed by stable ID through the pinned hierarchy registry to the root.
      scope: COL26.8 accepted species usage C5QJ. Each biological claim remains limited to its named study population, methods and dates; only the Los Tuxtlas demographic study and the Isla Agaltepec field population in Melin et al. identify the subspecies Alouatta palliata mexicana. No claim is generalized across the accepted species.
      sourceIds:
        - col
    lifeStatusScope:
      wild: The biological sources cover free-ranging Alouatta palliata in Nicaragua, Costa Rica, Mexico and Panama, plus Los Tuxtlas groups identified as A. p. mexicana; each claim retains its own site, cohort and time scope. The comparative morphology claim uses museum CT specimens with no stated geographic population or subspecies.
      domesticated: Domesticated or captive populations were not assessed by this dossier.
      fossil: Fossil occurrence was not assessed by this dossier.
    evidence:
      title: A demographic history of a population of howler monkeys (Alouatta palliata) living in a fragmented landscape in Mexico
      doi: 10.7717/peerj.3547
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC5571790/
      publishedAt: 2017-08-22
      accessedAt: 2026-09-24
      version: PeerJ 5:e3547, version of record published 2017-08-22
      license: Creative Commons Attribution 4.0 International (CC BY 4.0)
      licenseUrl: https://creativecommons.org/licenses/by/4.0/
      rightsHolder: Cristóbal Azkarate, Dunn, Domingo Balcells and Veà Baró
      rightsEvidenceUrl: https://pmc.ncbi.nlm.nih.gov/articles/PMC5571790/
      rightsEvidenceLocator: "Article front matter, Copyright and License block immediately below Received/Accepted dates (PMC5571790): ©2017 Cristóbal Azkarate et al.; the article states that it is distributed under the Creative Commons Attribution License. The linked license resolves to CC BY 4.0 at https://creativecommons.org/licenses/by/4.0/."
      licenseAppliesTo: The PeerJ version-of-record article text authored by the listed authors. Third-party material is excluded unless separately marked as CC BY 4.0.
      attribution: Cristóbal Azkarate J, Dunn JC, Domingo Balcells C, Veà Baró J. 2017. A demographic history of a population of howler monkeys (Alouatta palliata) living in a fragmented landscape in Mexico. PeerJ 5:e3547. https://doi.org/10.7717/peerj.3547. CC BY 4.0. Paraphrased; no figures or third-party material reused.
      locator: "Full text at PMC5571790; item-level reuse notice: article front matter, Copyright and License block immediately below Received/Accepted dates; see rightsEvidenceLocator for the exact notice and linked license."
      scope: A longitudinal field study of 10 groups in the Los Tuxtlas region of Mexico, with 454 monthly group visits from 2000 through 2011. Findings are specific to the monitored population, time interval and methods; they are not a species-wide demographic estimate.
    facets:
      morphology:
        status: partially-supported
        claims:
          - text: A comparative CT study found greater nasal-turbinate surface area in eight Alouatta palliata specimens than in 15 Ateles geoffroyi specimens (p = 0.0001); the difference persisted after adjustment for skull size. The Alouatta specimens' geographic populations and subspecies were not reported, and this anatomical comparison alone does not establish sensory function or species-wide variation.
            originalLanguage: en
            sourceIds:
              - melin2022
            locator: Methods §2(c)(i); Results §3(a)(ii), “Sensory anatomy”; Fig. 2b and Fig. S3a. The comparative sample included eight A. palliata, 15 Ateles, and two Cebus CT scans; no locality or subspecies is given for the A. palliata museum specimens.
            placeTimeScope: Comparative museum CT specimens identified as A. palliata and A. geoffroyi; specimen collection dates and geographic provenance for the eight A. palliata specimens are not reported in the study.
            lifeStatus: Museum specimens; the study does not identify whether the source animals were wild or captive.
        gaps:
          - This is one comparative museum-specimen result, not a species-wide anatomical survey; age-sex variation, diagnostic range, and functional consequences remain unassessed. The article's olfactory-bulb values come from prior genus-level literature with underlying sample counts and provenance unspecified, so they are not used as species-specific evidence.
      lifeHistory:
        status: partially-supported
        claims:
          - text: For the monitored Los Tuxtlas population, the authors infer that most conceptions leading to births occurred from April to June and weaning peaked in April-May; conceptions were fewer than expected during the November-March energetic-stress period. These seasonal patterns describe this study population and period.
            originalLanguage: en
            sourceIds:
              - peerj2017
            locator: Abstract, paragraph opening “Long-term field studies are critical...” (seasonality sentence opening “In particular, the period of lowest temperatures...”); Results > Births, paragraph opening “Although we observed births throughout the whole year...” and next paragraph opening “As the gestation time of howler monkeys is 6 months...”; Discussion, paragraph opening “This suggests that the majority of conceptions that lead to births...”. The Abstract and Results > Births paragraphs give the study-specific seasonal timing; Discussion provides the authors’ interpretation.
            placeTimeScope: Study-identified subspecies A. p. mexicana; ten groups in Los Tuxtlas, Veracruz, Mexico; 454 monthly group visits from 2000 to 2011. Seasonal associations are specific to this monitored population and period and are not asserted species-wide.
            lifeStatus: Wild free-ranging groups; no captive or domesticated animals are included in this claim.
        gaps:
          - The study is a population-level longitudinal sample and does not provide a complete species-wide life-cycle account or establish that seasonal timing generalizes across the range.
      ecology:
        status: partially-supported
        claims:
          - text: The study followed 10 howler monkey groups in an anthropogenically fragmented Los Tuxtlas landscape and reported that the monitored population remained relatively stable overall from 2000 to 2011, with an increase in total individuals. This is not a current or range-wide population trend.
            originalLanguage: en
            sourceIds:
              - peerj2017
            locator: Abstract, paragraph opening “Long-term field studies are critical...” (sentences beginning “Here, we present long-term demographic data...” and “The population remained relatively stable...”); Methods > Study site, paragraph opening “The Los Tuxtlas Biosphere Reserve represents...” (study area); Results, paragraph opening “Overall, we observed an increase in the number of individuals...”. The Results paragraph reports the bounded 2000–2011 trend.
            placeTimeScope: Study-identified subspecies A. p. mexicana; Los Tuxtlas, Veracruz, Mexico; 10 groups monitored monthly from 2000 through 2011 in a fragmented landscape.
            lifeStatus: Wild groups; captive and domesticated animals were not part of the study.
          - text: In the study's adult sleep records from Nicaragua, 54 of 55 Alouatta palliata records used the sit-in posture (98.2%); 76.4% were on horizontal substrates and 83.6% on large branches. These are observations from the sampled groups and nights, not a species-wide estimate.
            originalLanguage: en
            sourceIds:
              - urbani2020
            locator: Methods §§2.1–2.2 for the Ometepe groups, observation dates and n=55 adult A. palliata records; Results and Table 1 for posture, substrate inclination and substrate diameter; official article page/front matter for the item-level license.
            placeTimeScope: Two habituated groups near Estación Biológica de Ometepe, Isla de Ometepe, Nicaragua; observations in December 2003–January 2004 and February 2006. The study identifies A. palliata but does not state a subspecies.
            lifeStatus: Wild, habituated groups; the sleeping records concern adult individuals only.
          - text: In comparative fruit-investigation observations, Alouatta palliata sniffed shared food plants at about three times the rate reported for Cebus imitator and less often than Ateles geoffroyi. This interspecific comparison is limited to the study's observed animals and sampled foods; it does not establish a species-wide sensory mechanism. The study reports site variation in other tactile and bite/reject behaviors.
            originalLanguage: en
            sourceIds:
              - melin2022
            locator: Methods §§2(a), 2(c)(i), 2(e)(i); Results §3(a)(iii), “Foraging behaviour”; supplementary Methods S1/Table S1 for sample-site distinctions. The interspecific analysis concerns trichromat individuals and shared food plants; color-vision findings are not treated as an Alouatta-specific dichromat–trichromat comparison.
            placeTimeScope: Wild Alouatta observations at Sector Santa Rosa, Costa Rica; the study also includes an Isla Agaltepec, Mexico population identified as A. p. mexicana. The field observation dates are not stated in the article details used here; Santa Rosa is not assigned a subspecies.
            lifeStatus: Wild, free-ranging populations; no captive or domesticated animals are included.
          - text: For one Alouatta palliata group on Barro Colorado Island, the Results section reports step selection positively associated with distance to 8 m canopy gaps and with crown thickness, but not canopy height. Cross-validation accuracy was 0.31 and did not exceed random selection. The abstract and Discussion describe canopy-height relationships differently from this species-specific Results statement, so the weak model does not support a generalized canopy preference.
            originalLanguage: en
            sourceIds:
              - mclean2016
            locator: Methods, “Animal movement patterns,” for 2005–2006 group tracking and 1,600 GPS points; Results, “Movement patterns and forest structure,” and Table 2 for model terms and rS=0.31 cross-validation; Discussion for single-group and model limitations. The abstract and Discussion contain canopy-height wording that differs from the Results section's species-specific statement.
            placeTimeScope: One wild social group on Barro Colorado Island, Panama, tracked for 7–12 consecutive days per month across a year in 2005–2006; 1,600 GPS points. The canopy LiDAR data were collected in September 2009. No subspecies is stated.
            lifeStatus: One wild, free-ranging social group.
        gaps:
          - No range-wide habitat synthesis, diet, or species-interaction review was assessed. The cited habitat-selection model is local to one group and did not predict selection better than random; it is not a current or species-wide habitat result. No current demographic monitoring was assessed.
      evolution:
        status: not-assessed
        gaps:
          - No phylogenetic, population-genetic or evolutionary analysis was assessed.
      distribution:
        status: not-assessed
        gaps:
          - The local Los Tuxtlas study site does not establish the species-wide distribution, native status or range limits.
      fossil:
        status: not-assessed
        gaps:
          - No fossil record search or geological evidence was assessed.
      conservation:
        status: not-assessed
        gaps:
          - No formal conservation assessment, threat category, population viability analysis or current trend was assessed.
