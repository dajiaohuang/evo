        claims:
          - text: Cormous herb, up to 1 m high. Tepals 16-19 mm long. Stem frequently branched. Leaves broad, 14-20 mm wide. Main spike 25-35-flowered. Upper perianth tube 7-9 mm long. Floral bracts dry. Flowers pale pink.
