          - text: Distinguished by its long spikes of relatively small, pale pink flowers with the upper part of the perianth tube 6-7 mm long and tepals 17-19 mm long, and short, ± dry floral bracts 9-14 mm long, not clasping the stem. Watsonia transvaalensis from the escarpment north of Graskop has mostly narrower leaves, 8-20(-25) mm wide, with moderately thickened margins, and mostly unbranched stems with larger bracts, 13-28 mm long, and larger flowers with tepals 20-25 mm long.
