    facets:
      morphology:
        status: partially-supported
        claims:
          - text: The 2003 Flora of North America account describes Pinus torreyana seed cones as symmetric, 10–15 cm long, ovoid before opening and broadly ovoid when open; the apophyses are thick and angulately dome-shaped with five low convergent keels.
            originalLanguage: en
            sourceIds:
