        claims:
          - text: "Corm oblong, about 1 cm. in diameter, tunics firm, dark brown: underground neck 5-15 mm. long, bearing 5 rather thin foliage leaves. Leaves more or less horizontal, glabrous, green with white margin and brownish base, the two outer plicate, ovate-lanceolate, 7-8 cm. long, the inner shorter ovate. Capitulum 2-5 flowered, up to 15 mm. in diameter; bracts broadly ovate, more or less folded round each flower, about 15 mm. long, pedicels thick, about 3 mm. long. Petals greenish white, about 14 mm long, claw narrow, a little longer than the cucullate blade; stamens about half the length of the blades of the petals, filaments from a broad base subulate, reddish brown; anthers subbasifixed, introrse, connective yellowish, broad, pollen sacs dark reddish-brown, pollen yellow; carpels sharp-angled on the back, ovaries about the same length as the styles and gradually passing into them, stigmata minute; capsules and seeds unknown."
