        usage:
          title: Inga spectabilis (Vahl) Willd., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Moderate-sized tree, the branchlets lightly pubescent to glabrous and markedly angled, lenticellate. Leaves large, mostly 4-foliolate; petioles scarcely 1 cm. long, angled or short-winged, sometimes puberulent; rachis up to 7 or more cm. long, somewhat puberulent, alate towards the upper part of each rachial internode (the wing broadest just below insertion of the leaflets), the wing from subobsolete to 7 or 8 mm. wide measured from midrachis, bearing a large, cupuliform or patelliform gland between insertion of the petiolules, usually puberulent at least medianly above; leaflets 1-3 (usually 2) pairs, elliptic or nearly so, up to 25 cm. long and 15 cm. wide in terminal pair, the basal pair smaller (often lacking in herbarium material), rounded to acute apically, more or less obtuse and inequilateral basally, coriaceous, glabrous above in maturity, subglabrous below, the veins impressed above and prominently elevated below, the alternate lateral veins much shorter than the others; stipules linear to linear-lanceolate or linear-oblanceolate, about 1 cm. long, subpersistent. Inflorescence mostly a terminal panicle of pedunculate spikes (the spikes sometimes solitary from an axil), the peduncular portion gen- erally 4-5 cm. long and lightly puberulent, the floriferous portion about 5 cm. long and tomentulose, the flowers more or less congested; bracts nearly elliptic, up to 2 cm. long and almost 1 cm. wide, more or less persistent, tomentulose. Flowers white; calyx tubular-campanulate, about 9 mm. long, pubescent, somewhat cleft to one side, the teeth about 3 mm. long; corolla tubular, about 2 cm. long, tomen- tose, the lobes somewhat flaring; stamens about 4 cm. long, the staminal tube about equalling the corolla. Legume flat, reported up to 60 cm. long and 7 cm. wide, the margins thick but not elevated, glabrous.
          originalLanguage: en
          sourceField: general
