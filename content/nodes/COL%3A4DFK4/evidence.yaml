        usage:
          title: Parathesis seibertii Lundell, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Trees to 15 m high, the branchlets slender to stout, apically ferruginous- lepidote with minute closely appressed stellate trichomes, these scarcely dis- cernible. Leaves with slender petioles 1-1.5 (-2.5) cm long; leaf blades lanceolate, oblong-elliptic, or oblanceolate, 5-20 cm long and 1.5-5 cm wide, acuminate apically and basally, chartaceous or membranaceous, obscurely crenulate to entire, at first minutely and sparsely lepidote beneath with ap- pressed stellate trichomes, conspicuously black-punctate, striolate, the costa elevated beneath, the primary lateral veins slender. Inflorescences axillary, paniculate, to 15 cm long, long-pedunculate, the peduncles and branches slender, 1- or 2-branched, sparsely and minutely puberulent; pedicels slender, (4-) 6.5-11 mm long, minutely puberulent. Flowers subcorymbose, minutely papillose-puberulent, to 6 mm long at anthesis; sepals triangular, to 1.2 mm long, red-black punctate; petals narrowly lanceolate, to 6 mm long, papillose- tomentose over almost the entire inner surface, densely red-black punctate in lines; stamens 3-3.5 mm long, the filaments slender, glabrous, 1.5-2 mm long, not punctate, the anthers erect, dorsifixed 1/3 above the base, lanceolate, 1.75-2.4 mm long, attenuate apically and apiculate, epunctate or with 1 to several minute black glands dorsally; ovary puberulent or tomentulose to the middle and at the base of the style or only apically, the ovules 7-9, uniseriate, enclosed, the placenta depressed-globose, apiculate, the style slender, ca. 5 mm long, punctate in lines. Fruit purple, depressed-globose, drying ca. 7 mm in diameter.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 8328
          archiveSourceId: 2752C9B0-8CFF-4394-B626-23B595FA30D8
