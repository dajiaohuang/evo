    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, up to 60 mm tall, tunics woody, concentric. Leaves firm, narrow, falcate. Flowers 1 per spike, zygomorphic, with horizontal unilateral stamens and style, purple, pale yellow in the centre.
            textZh: Geissorhiza karooica Goldblatt 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_14562_0
            locator: "SANBI/WFO archive Morphology row 33132; source identifier 14562.0; cited publication: Goldblatt, P; Manning, JC. 2013. Iridaceae. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 94 - 124. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Distinctive in having half nodding flowers solitary on stems or branches, of which up to four may be produced on each plant. The glossy violet-purple flowers are large and attractive and unusual in being zygomorphic with unilateral, declinate stamens, while the tepals are subequal and symmetrically arranged. Plants have four to six narrow, linear leaves inserted at the base, up to 1.8 mm wide. Geissorhiza karooica appears to be allied to two western Karoo species, G. corrugata and G. spiralis, which have radially symmetric flowers also borne singly on each branch but with spirally coiled leaves, and are also distinctive in having the style dividing near the anther bases into unusually long branches.
            textZh: SANBI 条目提供了 Geissorhiza karooica Goldblatt 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 94672; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
