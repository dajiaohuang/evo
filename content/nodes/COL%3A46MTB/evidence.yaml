          originalSourceText: Epiphytic slightly fleshy shrubs to 1 m high; stems terete, densely hirsute. Leaves opposite; blades slightly fleshy to coriaceous, broadly elliptical to slightly obovate, mostly 5.5-9.5 cm long and 3.0-6.5 cm wide, the base cuneate, the margins entire, the apex slightly short-acuminate, the upper surface sparsely hispidulous, the lower surface sparsely pilose, more densely pilose on primary vein, the secondary veins pinnate, prominent; petioles narrow, mostly 5-10 mm long. Inflorescence a broadly corymbose panicle, to 15 cm wide and 12 cm high, the branches puberulous, the ultimate branches 2-9 mm long. Heads ca. 9 mm high and 1.5-2.0 mm wide, mostly with 5 florets; involucral bracts 8-9, sub- imbricate, in ca. 3 series, linear-lanceolate with narrowly obtuse tips, 3-6 mm long and 0.8-1.0 mm wide, the outer surface minutely puberulous and very sparsely glanduliferous; receptacle flat, minutely puberulous; corolla lavender or purplish, ca. 7 mm long, narrowly funnelform, the inner surface glabrous, the tube and lower limb mostly glabrous on outer surface, the lobes ovate-oblong, ca. 0.8 mm long and 0.5-0.6 mm wide, with outer surface sparsely glanduliferous and minutely puberulous; style base not enlarged. Achenes prismatic, 2.5-3.0 mm
