          - text: The glabrous acicular leaves, 1-2.5 cm long, overtopping the inflorescence and the distinctly glabrous stems, readily distinguish D. buekii from D. proteoides. In addition, the outer surface of the outer whorl of involucral bracts (apart from the ciliate margins), is glabrous.
