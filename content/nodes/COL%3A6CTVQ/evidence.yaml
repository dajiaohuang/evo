    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Rhizomatous geophyte, 20-45 cm, stems grey-hairy. Leaves linear. Flowers in a corymbose panicle, enantiostylous, mauve, tepals ovate, long stamens shorter than tepals, with anthers two-thirds as long as anther of short stamen.
            textZh: Dilatris pillansii W.F.Barker 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13863_0
            locator: "SANBI/WFO archive Morphology row 8735; source identifier 13863.0; cited publication: Manning, JC; Goldblatt, P. 2012. Haemodoraceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 97 - 97. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Distinguished by the relatively small, mauve, markedly cupped flowers with ovate tepals 8-10 mm long, all stamens well included with the longer just 3-4 mm long, and the shortly lanate inflorescence branches with crisped hairs 1-2 mm long. The larger anther, ±1.5 mm long, is less than twice as large as the smaller anthers. Dilatris pillansii has been much confused with D. corymbosa, a Cape Peninsula endemic, but that species has larger flowers with elliptic tepals 10-13 mm long, the two longer stamens ± as long as the perianth or slightly longer, 6-8 mm long, and densely villous inflorescence branches with longer, shaggy hairs 2-3 mm long. The larger anther, ±3 mm long, is more than twice as large as the smaller ones.
            textZh: SANBI 条目提供了 Dilatris pillansii W.F.Barker 的鉴别特征。
            sourceIds:
              - sanbi_16026_0
            locator: "SANBI/WFO archive Diagnostic row 73236; source identifier 16026.0; cited publication: Manning, JC; Goldblatt, P. 2017. A reviewof Dilatris P.J.Bergius (Haemodoraceae: Haemodoroideae). S. African J. Bot. 113: 103 - 110. [http://dx.doi.org/10.1016/j.sajb.2017.08.001]. [Copyright held by the South African Association of Botanists (2017); http://www.sciencedirect.com/science/journal/02546299]. [CC BY]"
