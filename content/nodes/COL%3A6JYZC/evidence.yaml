        claims:
          - text: Cormous geophyte, 6-15 cm, tunics woody, concentric. Leaves ovate, leathery, prostrate. Flowers few per spike, white, pink on reverse, tube fairly long.
            textZh: Geissorhiza ovata (Burm.f.) Asch. & Graebn. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 6804; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Easily recognised by the pair of ovate or oblong basal leaves, prostrate or nearly so, and the stem prostrate near base, Geissorhiza ovata has long-tubed white flowers marked with red in the centre and red to brown on the reverse of the tepals. The perianth tube, mostly 10-18 (rarely up to 30) mm, is well exserted from the bracts and the spreading tepals are typically 10-13 mm long. It is allied to G. parva, a smaller species with a similar habit with short, prostrate or semi-prostrate leaves but smaller yellow to creamy-white flowers, with a perianth tube 3-4 mm long. Geissorhiza ovata is quite variable as to height and flower size, and although the perianth tube is typically 10-18 mm long it is up to 30 mm long in plants from the Klein River Mtns. Plants from near the eastern end of its range near Swellendam have the smallest flowers with tepals ± 7 mm long, although the perianth tube is of normal length.
            textZh: SANBI 条目提供了 Geissorhiza ovata (Burm.f.) Asch. & Graebn. 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 94669; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
