        usage:
          title: Waltheria indica L., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Herb or small shrub 0.60-2 m. high, the young stems grayish and soft-velvety- lanate-arachnoid. Leaves with a pedicel 0.5-3.3 cm. long, lanate-arachnoid to sericeous, the stipules subfiliform, the blade narrowly ovate to ovate, rounded or truncate or somewhat subcordate at the base, obtuse or subacute at the apex, 3.5- 12 cm. long and 1.5-7 cm. wide, chartaceous, the margins serrate-crenate, grayish and soft-velvety-lanate-arachnoid on both sides, the indumentum slightly denser on the lowger surface, the nervation not reticulate, impressed above and prominent below. Inflorescences axillary or terminal, of tight-globose, subsessile to long- pedunculate glomerules, the peduncles lanate-arachnoid to sericeous. Flowers sessile, the bracts linear-lanceolate, about as long as the flowers, sericeous; calyx tubular-campanulate, somewhat 5-angled, ca. 4-4.5 mm. long, divided about 112 way into 5 triangular-subulate lobes ca. 2-2.5 mm. long, long-sericeous outside, glabrous inside except the sericeous lobes; petals obovate-oblong, unguiculate, 4-4.5 mm. long and 1-1.5 mm. wide, yellow or orange, glabrous outside, scatteringly arachnoid near the base just above the claw inside; staminal tube ca. 2 mm. long, glabrous; anthers subsessile, ca. 0.8 mm. long; ovary oblong-ellipsoid, ca. 1.5 mm. long and 0.75 mm. wide, sericeous on the upper half; style geniculate in the middle, ca. 1.5 mm. long, loosely arachnoid; stigma plumose-papillate. Capsule included in the calyx and surrounded by the marcescent corolla, obovoid, ca. 2.5-3 mm. long and 1.5-2 mm. wide, sericeous above, 1-seeded; seed obovoid, ca. 1.8-2.1 mm. long and 1-1.3 mm. wide, the testa smocth.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 13384
