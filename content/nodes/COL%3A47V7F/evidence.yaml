            locator: "SANBI/WFO archive Diagnostic row 84466; source 7160.0; publication: Magee, AR; Van Wyk, B-E; Tilney, PM. 2009. A taxonomic revision of the woody South African genus Notobubon (Apiaceae: Apioideae). Syst. Bot. 34(1): 220 - 242. [All rights reserved]"
