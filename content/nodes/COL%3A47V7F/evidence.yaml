    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Lax, erect, shrub, up to 1 m tall, branches remaining simple-stemmed. Leaves finely dissected, flat-topped, green to glaucous, leaflets weakly pinnatisect or 2- to 3-sect, lobes linear. Umbels flat-topped, on a long persistent peduncle, terminal one relatively large, fertile, lateral ones 0-3, smaller, functionally male. Flowers yellow. Fruit elliptic, mericarps dorsally compressed, dorsally ribbed, marginal ribs not winged, homomorphic, vittae present, without additional rib vittae, rib oil ducts inconspicuous.
            sourceIds:
              - sanbi_14721_0
            locator: "SANBI/WFO archive Morphology row 34069; source 14721.0; publication: Magee, AR. 2013. Apiaceae. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 243 - 248. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Notobubon pearsonii may be confused only with N. ferulaceum (the two species are geographically isolated), from which it differs in the smaller, bipinnate leaves (less than 50 mm long), the umbels that are flat-topped in outline, with the previous year’s peduncles often still visible on the plant and in the much smaller fruit (3.0-3.5 mm long). Furthermore, this species is unique in lacking not only marginal wings (present in all other species) but also the additional vittae under the vascular bundles in the ribs. It does, however, share the broad commissural vittae found in most other species of Notobubon.
            textZh: SANBI 条目提供了该种的鉴别特征。
            sourceIds:
