  claims:
    - subjectId: taxon:araneae
      claimKind: scientific
      claimType: morphology
      statement: Spider spinnerets are abdominal appendages that control silk deployment. Garwood et al. distinguish true spiders from the Carboniferous Idmonarachne fossil, whose preserved underside lacks spinnerets; its spider-like appearance alone does not make it a member of Araneae.
      confidence: high
      confidenceRationale: The study defines spinnerets and documents their absence using the preserved ventral surface and tomography. This claim retains the authors' anatomical distinction without treating inferred silk production in the fossil as an observation.
      referenceLinks:
        - referenceId: garwood-2016-idmonarachne
          relation: supports
          pages: "20160125"
          quoteLocator: "Introduction: spinneret definition; Discussion: preserved underside, tomography and exclusion from Araneae"
    - subjectId: taxon:araneae
      claimKind: scientific
      claimType: topology
      statement: Extensive target-gene and taxon sampling provides a reproducible topology and revised classification for sampled spiders. It does not establish the fossil first appearance, exact crown age or a direct ancestor of Araneae.
      confidence: medium
      confidenceRationale: Confidence is medium because the cited primary study directly supports the bounded topology statement at the supplied locator. The confidence does not extend beyond it does not establish the fossil first appearance, exact crown age or a direct ancestor of Araneae.
      referenceLinks:
        - relation: supports
          referenceId: wheeler-2017-spider-tree
          pages: 574–616
          figure: Figures 1–5; appendices and matrices
          quoteLocator: Taxon sampling; analytical methods; classification and topology
    - subjectId: taxon:araneae
      claimType: fossil-range
      claimKind: scientific
      statement: The 315–0 Ma Araneae display is an oldest-known-fossil-to-living navigation envelope and does not date spider origination or crown divergence.
      confidence: medium
      confidenceRationale: A systematic fossil review and a separately imaged Carboniferous arachnid study converge on the approximately 315 Ma true-spider record while distinguishing stem-like material.
      referenceLinks:
        - referenceId: selden-penney-2010-spider-fossil-record
          relation: supports
          pages: 171–206
          figure: Table S1
          quoteLocator: Systematic fossil-record review of Carboniferous spiders
        - referenceId: garwood-2016-idmonarachne
          relation: supports
          pages: Article 20160125
          figure: Main-text figures
          quoteLocator: Introduction traces Araneae to approximately 315 Ma and distinguishes Idmonarachne from true spiders
    - subjectId: taxon:araneae
      claimKind: scientific
      claimType: taxonomy
      statement: Wheeler et al. use extensive target-gene sampling to revise relationships among living spiders, while Garwood et al. distinguish the Carboniferous Idmonarachne from true spiders by its preserved appendages; the combined classification remains a sampled and revisable hypothesis.
      confidence: medium
      confidenceRationale: The primary phylogeny and fossil study directly report sampled characters and their interpretations, but taxon sampling and preservation limit a final order-wide classification.
      referenceLinks:
        - referenceId: wheeler-2017-spider-tree
          relation: supports
          pages: 574–616
          figure: Figures 1–5; appendices and matrices
          quoteLocator: Taxon sampling, classification and topology
        - referenceId: garwood-2016-idmonarachne
          relation: supports
          pages: "20160125"
          figure: Main-text figures
          quoteLocator: Preserved appendages and exclusion of Idmonarachne from true Araneae
    - subjectId: taxon:araneae
      claimKind: scientific
      claimType: biogeography
      statement: The spider fossil review records Carboniferous and younger occurrences, and Wheeler et al. sample living lineages broadly for target-gene phylogeny; these fossil localities and sampled species do not form a complete geographic distribution of Araneae.
      confidence: medium
      confidenceRationale: Both studies identify their included fossil records or living taxa, but neither is a global presence–absence survey of spiders.
      referenceLinks:
        - referenceId: selden-penney-2010-spider-fossil-record
          relation: supports
          pages: 171–206
          figure: Table S1
          quoteLocator: Fossil spider localities and temporal occurrence review
        - referenceId: wheeler-2017-spider-tree
          relation: supports
          pages: 574–616
          figure: Figures 1–5; appendices and matrices
          quoteLocator: Extensive living-spider taxon sampling
    - subjectId: taxon:araneae
      claimKind: scientific
      claimType: ecology
      statement: The cited spider phylogeny and fossil-origin studies test relationships and preserved anatomy rather than diet, habitat use, locomotor performance, body size or ecological guild; those fields remain unassigned for Araneae here.
      confidence: high
      confidenceRationale: The source designs are explicitly phylogenetic and anatomical, so withholding ecological fields avoids converting sampled relationships or fossil preservation into observed behaviour.
      referenceLinks:
        - referenceId: wheeler-2017-spider-tree
          relation: supports
          pages: 574–616
          figure: Figures 1–5; appendices and matrices
          quoteLocator: Phylogenetic sampling and study scope
        - referenceId: garwood-2016-idmonarachne
          relation: supports
          pages: "20160125"
          figure: Main-text figures
          quoteLocator: Preserved anatomy and spider-origin comparison, without direct behaviour observations
  claim-rationales.zh:
    - 研究定义了纺器，并通过保存的腹面和断层成像记录其缺失。本主张保留作者的解剖区分，不将推断的化石产丝能力当作直接观察。
    - 置信度为中：所引主研究在给定页码、图版或章节定位器处直接支持这一受限的拓扑表述；置信度不外推到文中明确排除的全群起源、全球首现、直接祖先或精确端点。
    - 系统化石综述与独立成像研究均支持约 315 Ma 的真蜘蛛记录，同时区分干群样材料。
    - 系统发育和化石研究直接报告了取样性状及其解释，但类群取样和保存状况限制了最终的目级分类。
    - 两项研究分别列出化石记录和现生类群样本，但都不是蜘蛛目全球存在与缺失的普查。
    - 所引研究聚焦系统发育和保存解剖，并没有饮食、栖息地、运动性能或生态功能群数据，因此保留未赋值。
  claim-statements.zh:
    - 蜘蛛的纺器是控制蛛丝释放与运用的腹部附肢。Garwood 等将真蜘蛛与石炭纪 Idmonarachne 化石区分开：后者保存的腹面缺少纺器，仅凭蜘蛛样外形不能将其归入蜘蛛目。
    - 大规模目标基因与类群抽样，为所抽样蜘蛛提供了可复现的拓扑和修订分类。它不能确定蜘蛛目的化石首现、精确冠群年龄或直接祖先。
    - 315–0 Ma 的蜘蛛目显示是已知最早化石至现生的导航包络，不用于测定蜘蛛起源或冠群分化。
