        claims:
          - text: Cormous geophyte, 45-70 cm, tunics fibrous. Leaves slender, cross-shaped in section, sheaths hairy. Flowers bell-like, greenish yellow, fragrant.
            textZh: Gladiolus sufflavus (G.J.Lewis) Goldblatt & J.C.Manning 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 7270; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Recognised by its stiffly erect stems with three or four leaves, the lowermost or lower two subbasal with a centric blade, terete or X-shaped in section and the remainder largely sheathing with softly villous sheaths, and nodding, pale yellow to yellow-green, bell-shaped flowers with a sharply bent perianth tube 14-15 mm long. Gladiolus pritzelii has bright yellow flowers, often conspicuously marked with brown on the lower tepals, and plane leaves with one or two raised veins but unthickened margins.
            textZh: SANBI 条目提供了 Gladiolus sufflavus (G.J.Lewis) Goldblatt & J.C.Manning 的鉴别特征。
