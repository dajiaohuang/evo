    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Acaulescent, cormous geophyte to 5 cm. Leaves several, spreading, channelled and somewhat twisted and undulate. Flowers white with yellow nectar guides on outer tepals and purple marks on inner tepals.
            textZh: Moraea falcifolia Klatt 的 SANBI 物种条目记载了植株、叶片和花部形态。
            sourceIds:
              - sanbi_13878_0
            locator: Strelitzia 29; archive Morphology row 6924, source 13878.0
            placeTimeScope: Regional species account published 2012; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
          - text: A small, tufted plant seldom reaching 60 mm when in flower, producing several smooth, falcate leaves, sometimes with ciliate margins, surrounding one or more sessile inflorescences, the spathes of which differ hardly at all from the leaves except by their position subtending the fugaceous blooms. The flowers are white with prominent yellow nectar guides on the outer tepals and dark purple or sometimes grey markings on the inner tepals and frequently dark purple on the lower half of the otherwise white style crests.
            textZh: SANBI 条目提供了 Moraea falcifolia Klatt 的鉴别特征。
