            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: The distribution of P. rubra partly coincides with that of P. corymbosa, P. montivaga and P. falcifolia. P. rubra is a smaller shrub (average height 0.3-0.75 m), often occurring in calcareous soil. It is distinguished from the other three species which are taller (average heights 1-2 m), and especially from P. falcifolia, which is a tall shrub or a small tree (up to 3.04 m), often associated with indigenous forests. P. rubra may also be separated by the inflorescences which have extended, robust spikes, with up to 30 fertile, enlarged bracts. The bracts are typified by the midrib which is shortly extended into a point and by the wings which are adaxially tomentose, widely ovate, chartaceous, ± 5-ribbed and reticulately veined. Flowers are distinguished by the exserted hypanthium neck, which is ± 2 mm long and glabrous to sparsely pubescent.
            textZh: SANBI 条目提供了该种的鉴别特征。
