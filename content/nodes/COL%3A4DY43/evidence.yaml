        claims:
          - text: Shrublet to 1 m. Leaves lanceolate, hairy beneath, 2.5-5.0 mm long, bracts spreading, ovate-acuminate. Flowers in long, lax spikes, tube ± 3 mm long, neck ± 1 mm long. Fruits dry.
            sourceIds:
