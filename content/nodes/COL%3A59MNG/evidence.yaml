          originalSourceText: Lianas; stems more or less woody throughout, appressed-tomentose through- out, the extremities densely so. Leaves ovate to ovate-cordate, 3-9 cm long, basally cordate, apically acute to acuminate, glabrescent to densely pubescent below. Flowers in axillary or subterminal compound cymes; sepals subequal, the exterior sepals elliptic to obovate-elliptic, 14-20 mm long and often with a few trichomes at the apex or on the back, the interior sepals elliptic, obtuse to subacute, rarely emarginate, mostly glabrous; corollas reddish to lilac or rarely white, 6-7 cm long, the interplicae pubescent. Fruits indehiscent, ovoid, 14-17 mm long, 6-7 mm in diameter, apiculate, subtended by the accrescent sepals; seeds ellipsoid, 9-10 mm long, dark brown, finely pubescent with short trichomes.
