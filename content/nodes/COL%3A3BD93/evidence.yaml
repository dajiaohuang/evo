        usage:
          title: Erythrina chiriquensis Krukoff, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Trees; branchlets smooth, armed, the spines deltoid, flat, to 1 cm long. Leaves with the leaflets ovate deltoid, 6-20 cm long, 4-12 cm wide, the terminal leaflets usually slightly larger, the acumen often to 1.5 cm long, truncate at the base, the margins vaguely revolute, thick chartaceous, glabrous above and below, the main veins 4-8; petioles 10-15 cm long, smooth, glabrous; rachises 3-4.5 cm long; stipules narrowly rectangular. Inflorescences with the peduncles to 27 cm long and 0.6 cm wide, rubescent, sympodium longer in fruit, pedicels 0.3-1.5 mm long. Flowers with the calyx narrowly campanulate, ca. 13.5 mm long and stiffly car- nose to subcoriaceous, rough, glabrous to ferrugineous villosulose; teeth obso- lete; standard subsessile, narrowly oblong, to 60 mm long, 5-15 mm wide, ta- pering gradually toward the apex, concave, subcuneate, basally carnose, glabrous; wing petals oblong to somewhat circular ca. 9.5 mm long, obtuse ba- sally, delicately petaloid, glabrous except for the puberulent margins, the keel petals semicircular, 8.5-10 mm long, 6-7 mm wide, obliquely rounded, truncate basally, irregular undulate on the upper margin, thickened and puberulent on the lower margin, the claw ca. 1.5 mm long; staminal sheath 25-30 mm long, 1.5-3 mm wide, the long anthers ca. 3.3 mm long, glabrous, the short anthers ca. 2.5 mm long, pilose, the odd filament united to the sheath for ca. 8 mm then free for ca. 15 mm; ovary stipitate for ca. 7 mm, vaguely sigmoid and linear fusiform, ca. 13.5 mm long and 1.5 mm wide, the hairs ferrugineous, curled, the style subulate. Legumes stipitate for ca. 3 cm, to 13 cm long, 1.5-2 cm wide, narrowly cuneate apically, the beak to 3 cm long, ca. 0.6 cm wide basally, the seminiferous areas 2-3 per pod, often interrupted by a narrow constriction, 0.5-0.9 cm wide, to 5 cm long, smooth, vaguely reticulate, minutely ferrugineous farinose; seeds ob- long, ca. 1.2 cm long, 0.6 cm wide, dull or bright scarlet.
