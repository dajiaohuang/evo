    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Stem 270-540 mm tall, slender to stout, simple or branched at the base, sparsely to densely pubescent, hairs frequently bifarious. Leaves spreading; petioles 3-12 mm long; blade 44-75 x 12-28 mm, lanceolate or linear- lanceolate to narrowly ovate or narrowly oblong, ± glabrous to pubescent above, puberulous or pubescent below, midvein and margins scabrous. Inflorescence 2-4- flowered, sessile or lowermost pedunculate, at nodes and terminal; peduncles up to 30 mm long, pubescent. Bracts 3.4-8.8 mm long, narrowly linear, acute or acuminate, pubescent below, deciduous. Pedicels 15-30 mm long, pubescent or tomentose. Sepals 9-15 x 3.5-5.5 mm, lanceolate to narrowly ovate, narrowly elliptic or ovate-oblong, apex acute, glabrous above, pubescent below. Corolla 14-23 mm long, lobed ± to the base; lobes reflexed straight back, rarely reflexed-spreading, 12-19 x 8-13 mm, elliptic, apex obtuse and notched, margins usually revolute; apparently pale green or greenish-white spotted with purple, glabrous or covered at the base with minute soft, velvet-like hairs above, glabrous or puberulous below. Corona lobes 7-15 mm long, base narrow, claw-like, spreading horizontally, 2-6 mm long, 1-2 mm broad, often dilated at the extreme base, with a pair of contiguous erect keels, 2.2-3.6 mm high, 1.2-3.0 mm broad and always higher than broad, subdeltoid, oblong or subfalcate, apex obtuse or truncate; beyond the keels the claw-like base dilated into an orbicular, broadly ovate or broadly elliptic blade, apex obtuse or obtusely apiculate, margins often undulate, blade vertical or slightly inflexed over the keels, 3.5-8.5 x 5.7-8.5 mm, often transversely oblong and sharply cuspidate with a linear, obtuse apex 0.5-4.1 mm long, lobes apparently browny-green. Anther wings 3-6 mm long, ± oblique and slightly concave with basal angles diverging and curving outwards; appendages 2.0-3.4 mm long, broadly ovate or broadly ovate-oblong, obtuse, erect at first and then curved over and much above the style apex, sides slightly reflexed.
