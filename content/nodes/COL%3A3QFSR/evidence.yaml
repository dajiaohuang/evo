    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants mostly 1.2-1.5 m high, sheathed below by prominent, pale, dry-membranous, often irregularly torn cataphylls with age accumulating in a dense mass. Corm 12-18 mm diam., with tunics of relatively fine fibres. Stem usually with 3 to 5 short branches up to 4 mm long, branches subtended by pale, dry, attenuate scale-like bracts and prophylls 2-4 mm long. Leaves 3, lower 2 terete, ± 1/2 as long as stem, mostly 1.5-2.0 mm diam., firm-textured without evident veins when alive; uppermost leaf entirely sheathing or almost so, reaching to spike base or to lowermost branches. Main spike (1)2(3)-flowered, lateral spikes 1- or 2(3)-flowered; bracts silvery membranous, translucent with narrow, dark purple veins, ± 7 mm long, outer 3-veined and 3-toothed or 3-lobed; inner 2-veined, shallowly forked. Flowers upright to half nodding, pale blue, pale green in throat, faintly rose-scented, with bright yellow anthers prominently displayed; perianth tube broadly funnel-shaped, ± 5 mm long, narrow part ± 2 mm long; tepals spreading, patent distally, ovate, ± 12 x 6.0-6.5 mm, outer slightly wider than inner. Filaments ± 6 mm long, exserted ± 4 mm from tube; anthers 4-5 mm long, ± parallel, yellow; pollen yellow. Style dividing opposite lower 1/3 of anthers, branches ± 3 mm long, slender, extending between anthers.
            textZh: Ixia teretifolia Goldblatt & J.C.Manning 的 SANBI 物种条目记录了形态特征。
