            locator: "SANBI/WFO archive Morphology row 98240; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: The short, widely funnel-shaped perianth tube, ± 5 mm long, flowers with outspread tepals and partly exserted filaments with prominently displayed anthers, and the several short lateral branchlets place Ixia teretifolia close to I. marginifolia. The tall stature and habitat are shared in sect. Morphixia with I. alata but the several very short branches, each with 1 or 2(3) flowers differ from that species, and recall particularly I. linearifolia. The centric leaves lacking visible veins are unique in sect. Morphixia and unusual in the genus, almost all species of which have plane, isobilateral leaves. Except for their slightly smaller size, the flowers of I. teretifolia differ very little from those of I. marginifolia and its immediate allies, which have a short, funnel-shaped perianth tube, tepals spreading distally and fully exserted anthers.
