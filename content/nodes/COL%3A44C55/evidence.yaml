    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Stemless, cormous geophyte, up to 25 mm tall. Leaves 3 or 4, terete, falcate, transparent on the upper surface. Flowers in a basal tuft, pale pink to lilac with a yellow cup, tubular below, tepals cupped, filaments united in a column, style lobes entire, undulate.
            textZh: Moraea fenestralis (Goldblatt & E.G.H.Oliv.) Goldblatt 的 SANBI 物种条目记载了植株、叶片和花部形态。
            sourceIds:
              - sanbi_14562_0
            locator: Strelitzia 30; archive Morphology row 33288, source 14562.0
            placeTimeScope: Regional species account published 2013; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
          - text: One of the smallest species of subg. Galaxia, Moraea fenestralis has falcate, terete leaves with a transparent band of tissue on the upper (adaxial) surface. Plants bloom early in the season, mostly in June but also July, and the small flowers have tepals ± 15 mm long. An unusual feature of the flowers is that the inner tepals are joined to the filament column for ± 2 mm. The short style branches bear broad stigmatic lobes with entire, undulate margins, the ancestral condition for the subgenus.
            textZh: SANBI 条目提供了 Moraea fenestralis (Goldblatt & E.G.H.Oliv.) Goldblatt 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: Strelitzia 42; archive Diagnostic row 95275, source 18638.0
            placeTimeScope: Regional species account published 2020; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
