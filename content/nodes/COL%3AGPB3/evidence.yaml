    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Perennial, densely tufted, up to 1.75 m high. Leaf blades up to 600 mm long; 4-5 mm wide. Spikelets 35-40 mm long (including awns); lower glume half the length to nearly as long as the upper, firm below, upper third to two-thirds membranous and often torn, mucro or awn absent; lemma articulation present between apex of lemma and base of column; column 4-6 mm long, twisted; awns 3, equal to subequal; callus tip naked, emarginate to distinctly bifid.
            textZh: Aristida spectabilis Hack. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_11118_0
            locator: "SANBI/WFO archive Morphology row 311; source identifier 11118.0; cited publication: Herman, PPJ; Retief, E. 1997. Plants of the northern provinces of South Africa: Keys and diagnostic characters. Strelitzia 6: 1 - 681. National Botanical Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Resembles A. meridionalis, which has the lower glume with only the extreme apex membranous; A. pilgeri, with an articulation between the column apex and awns branching point; and A. sciurus, which has no articulation.
            textZh: SANBI 条目提供了 Aristida spectabilis Hack. 的鉴别特征。
