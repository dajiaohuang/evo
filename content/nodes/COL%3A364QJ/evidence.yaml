        claims:
          - text: Perennial, rhizomatous, up to 2 m high. Leaf blades 150-300 mm long, 20 mm wide, bases rounded, clasping stem; young growth waxy. Spikelets (sessile) 7-9 mm long (pedicellate longer).
            textZh: Diheteropogon amplectens (Nees) Clayton 的 SANBI 物种条目记录了形态特征。
            sourceIds:
