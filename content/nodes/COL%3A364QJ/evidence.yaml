            locator: "SANBI/WFO archive Morphology row 1700; source identifier 11118.0; cited publication: Herman, PPJ; Retief, E. 1997. Plants of the northern provinces of South Africa: Keys and diagnostic characters. Strelitzia 6: 1 - 681. National Botanical Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: "D. amplectens is a very variable species and two varieties have been recognised: var. amplectens with leaf base 2.5-5.5 mm wide and leaf gradually tapering to apex; var. catangensis with leaf base 5.5-26.0 mm wide and leaf apex abruptly tapering. As the specimens at PRE show no clear cut boundary between the two varieties, these have not been recognised until further studies have been done for this region."
