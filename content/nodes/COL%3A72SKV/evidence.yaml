        usage:
          title: Mangifera indica L., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Tree 5-40 m high, the branches glabrous. Leaves with petioles 0.8-6.2 cm long; blades oblong-lanceolate to oblong or narrowly elliptic-lanceolate, apically acu- minate or acute (rarely obtuse), basally cuneate to narrowly obtuse, 9-36 cm long, 2-7 cm broad, subcoriaceous or coriaceous, marginally straight or subundulate, glabrous on both surfaces, often glossy above and with prominulous or prominent reticulation. Panicles 15-50 cm long, densely flowered, pyramidal, the branches irregularly pilosulous and often spreading. Flowers 5-merous, the pedicels 0.5-4(-6) mm long; calyx-segments ovate-lanceolate, concave, 1.5-3 mm long, externally pu- bescent, spreading but arcuate and the distil portion ascending; petals oblanceolate or obovate to oblong, acute to obtuse or rounded, plicate toward the base, each producing a ventro-basal flap of tissue extending between the lobes of the disc, yellow or cream or pink (the ventral ridges often dark-red or rose-colored and imparting a streaked appearance to the corolla), 3-5 mm long, spreading or some- what ascending, strongly recurved at the tip; disc consisting of 5 separate (some- times apically coalescent) tumid cushions in a whorl between the stamens and petals and alternate with the petals; stamens 5, 1 large and fertile, the rest reduced to staminodes; ovary obliquely subglobose or ovoid, the style slender, often subequal in length to the fertile stamen. Drupes large (from 6 cm), often oblong or subreni- form, frequently yellow externally (varying from yellow to green or apricot), the mesocarp thick and juicy, often orange or yellow in color.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 464
