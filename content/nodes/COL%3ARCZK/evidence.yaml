          title: Carica papaya L., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: "Dioecious or occasionally polygamous or monoecious trees 2-8 m. tall with characteristic stout succulent and unbranched trunks, usually glabrous in all parts or essentially so. Leaves in a dense terminal crown, long-petiolate; blade simple but palmately divided into usually 7 more or less irregularly and broadly pinnatifid segments, variable in size but frequently up to 4-5 dm. in diameter; petiole usually up to 5-7 dm. long. Staminate inflorescences repeatedly compound, many-flowered, somewhat shorter than the subtending petioles, spreading or pendulous, the pistillate far shorter than the subtending petioles, usually only 1- to 3-flowered. Staminate flowers: calyx lobes very broadly deltoid, obtuse, about 1 mm. long; corolla salver- form white or yellow, the tube about 1.5-2.0 cm. long, about 2 mm. in diameter, the lobes oblong, 1.0-1.5 cm. long, slightly spreading; stamens inserted at the orifice of the corolla tube, exserted, the antepetalous anthers about 2.5 mm. long, nearly sessile and descending basally into the corolla tube, the antesepalous anthers erect, wholly exserted, about 2 mm. long, with apically 2-lobed filaments of nearly equal length; pistillode acicular, about 1 cm. long. Pistillate flowers far larger than the staminate, irregularly campanulate, white or pale cream: calyx lobes broadly deltoid, about 1 mm. long; corolla essentially polypetalous or very weakly united, the segments about 5-7 cm. long, 1.5-2.0 cm. broad, broadly acute, irregu- larly reflexed toward the tips; staminodia lacking, rarely minute and hypogynous; ovary ovoid-ellipsoid, usually about 3 cm. long (including the indefinitely attenuate style) and 2 cm. broad, the stigma essentially sessile, of 5 thick segments about 1 cm. long fimbriately di- or trichotomous toward the tip. Berry extremely variable, up to 3 dm. long and 2 dm. thick, green or yellow when ripe."
          originalLanguage: en
          sourceField: general
