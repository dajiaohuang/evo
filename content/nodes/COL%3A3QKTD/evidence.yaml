    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Dwarf shrublet, virgately branched, erect or decumbent. Stems up to 450 mm long. Both stems and leaves clad in glistening glands only. Leaves lanceolate to ovate in outline narrowed to a broad petiolar part, blade cut to midrib, lobes linear-oblong, entire or 1- or 2-toothed or occasionally the secondary lobing more pronounced, then leaves almost bipinnatisect. Flowers with corolla lobes maroon to crimson, magenta-pink or deep purple.
            sourceIds:
              - sanbi_11118_0
            locator: "SANBI/WFO archive Morphology row 2475; source 11118.0; publication: Herman, PPJ; Retief, E. 1997. Plants of the northern provinces of South Africa: Keys and diagnostic characters. Strelitzia 6: 1 - 681. National Botanical Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: The most important characters of which are the linear-oblong, acule or subspathulate, entire calyx lobes and the small flowers (tube 5.5-7.5 mm, limb 3-5 mm across the lateral lobes), the limbs of which are mostly dark shades of red though once recorded as 'almost port wine, varying from pink to magenta'. (Change of colour with age may be involved.) The leaves are typically pinnatisect, the lobes linear or oblong, either entire or toothed, but sometimes the secondary lobing is more pronounced and then the leaves are almost bipinnatisect. Both stems and leaves are clad in glistening glands only. Jamesbrittenia stricta is allied to J. pristisepala and where their areas meet, in Lesotho, around Fouriesburg, Golden Gate and Witzieshoek in the Orange Free State, the low Drakensberg on the Transvaal-Natal border, and the Cape Witteberg, hybridization may occur. Jamesbrittenia pristisepala differs from J. stricta in its more finely dissected leaves, strongly toothed calyx lobes, and larger flowers, particularly the larger corolla limb, which ranges in colour from yellowish to shades of mauve. The varying degrees of toothing of the calyx lobes encountered in areas of sympatry are indicative of possible hybridity, and so is variation in leaf-lobing and in the size and colour of the corolla limb.
            textZh: SANBI 条目提供了该种的鉴别特征。
