  claim-rationales.zh:
    - 五件化石及诊断性状由一手研究描述；冠群位置、同步起源与多样化成因仍属于拓扑或古生态解释。
  claim-statements.zh:
    - 五件莫斯科阶至格舍尔阶昆虫化石分别记录一件鞘翅类干群、一个全变态幼虫、一件膜翅类干群、早期半翅目和啮虫目，从而扩充了宾夕法尼亚亚纪真变态类取样；但不能证明它们同步起源，也不能确定后来各冠群目的首次出现。
