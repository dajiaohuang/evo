      claimKind: scientific
      claimType: fossil-range
      statement: Five Moscovian-to-Gzhelian insect fossils document a stem coleopterid, a holometabolous larva, a stem hymenopterid, early Hemiptera and Psocodea, expanding sampled Pennsylvanian Eumetabola without proving synchronous origins or later crown-order first appearances.
