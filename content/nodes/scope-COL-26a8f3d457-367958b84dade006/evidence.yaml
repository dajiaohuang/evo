  claims:
    - subjectId: taxon:odonata
      claimKind: scientific
      claimType: topology
      statement: Targeted sequencing of 478 loci across 136 species and 46 of 48 living families supports an updated sampled Odonata classification. Several backbone relationships remain uncertain, and the living sample does not delimit the order's fossil range or origin.
      confidence: medium
      confidenceRationale: Confidence is medium because the cited primary study directly supports the bounded topology statement at the supplied locator. The confidence does not extend beyond several backbone relationships remain uncertain, and the living sample does not delimit the order's fossil range or origin.
      referenceLinks:
        - relation: supports
          referenceId: bybee-2021-odonata-targeted-genomics
          pages: "107115"
          figure: Figures 1–4; supplementary matrices
          quoteLocator: Taxon and locus sampling; phylogenetic analyses; revised classification
    - subjectId: taxon:odonata
      claimType: fossil-range
      claimKind: scientific
      statement: The 268–0 Ma Odonata display begins with the earliest fossil recognized as a modern odonate, Saxonagrion minutus, rather than inheriting the older Odonatoptera edge.
      confidence: medium
      confidenceRationale: The review explicitly identifies the approximately 268 Ma fossil as the earliest modern odonate, providing a concept-matched minimum rather than an origin estimate.
      referenceLinks:
        - referenceId: bybee-2016-odonata-fossil-record
          relation: supports
          pages: Article 46
          figure: Figure 2
          quoteLocator: Fossil-record paragraph identifies Saxonagrion minutus at approximately 268 Ma as the earliest modern odonate
        - referenceId: nel-1999-saxonagrion
          relation: supports
          pages: 883–888
          figure: Systematic palaeontology and figures
          quoteLocator: Upper Permian Salagou Formation fossil; wing-venation attribution to Panodonata
    - subjectId: taxon:odonata
      claimKind: scientific
      claimType: taxonomy
      statement: Targeted sequencing of 478 loci from 136 living species representing 46 of 48 living odonate families produced an updated sampled classification; unresolved backbone sections remain and the result is not a complete order history.
      confidence: medium
      confidenceRationale: The primary analysis directly reports its locus and taxon sampling and revised classification, while explicitly leaving some backbone relationships unresolved.
      referenceLinks:
        - referenceId: bybee-2021-odonata-targeted-genomics
          relation: supports
          pages: 160:107115
          figure: Figures 1–4; supplementary matrices
          quoteLocator: Abstract; taxon and locus sampling; phylogenetic analyses; revised classification
    - subjectId: taxon:odonata
      claimKind: scientific
      claimType: biogeography
      statement: Saxonagrion minutus was described from the Upper Permian Salagou Formation in the Lodève Basin, France, while the modern genomic sample covers 136 species in 46 families; neither record supplies a complete Odonata distribution.
      confidence: medium
      confidenceRationale: The primary fossil paper fixes one locality and the primary genomic study states its taxon sample. Neither is a census of geographic presence or absence for the order.
      referenceLinks:
        - referenceId: nel-1999-saxonagrion
          relation: supports
          pages: 883–888
          figure: Systematic palaeontology and figures
          quoteLocator: Salagou Formation, Lodève Basin, France; Saxonagrion material
        - referenceId: bybee-2021-odonata-targeted-genomics
          relation: supports
          pages: 160:107115
          figure: Figures 1–4; supplementary matrices
          quoteLocator: 136 living species representing 46 of 48 families
    - subjectId: taxon:odonata
      claimKind: scientific
      claimType: ecology
      statement: The targeted-genomics study tests classification rather than diet, habitat use, flight performance, body size or ecological guild; this profile therefore leaves those fields unassigned rather than inferring them for Odonata.
      confidence: high
      confidenceRationale: The study's stated scope is a locus-based phylogenetic classification. It is not an ecological observation dataset, so the profile makes no organism-wide functional inference.
      referenceLinks:
        - referenceId: bybee-2021-odonata-targeted-genomics
          relation: supports
          pages: 160:107115
          figure: Figures 1–4; supplementary matrices
          quoteLocator: "Abstract and methods: anchored hybrid enrichment, taxon sampling and phylogenetic analyses"
    - subjectId: taxon:odonata
      claimKind: scientific
      claimType: morphology
      statement: The primary fossil description attributes Saxonagrion minutus to Panodonata from preserved wing venation; the observation concerns that Upper Permian fossil and is not a diagnostic body plan for all Odonata.
      confidence: medium
      confidenceRationale: The original description documents wing-venation evidence and its authors' assignment. It does not justify generalizing one fossil's anatomy to the entire order.
      referenceLinks:
        - referenceId: nel-1999-saxonagrion
          relation: supports
          pages: 883–888
          figure: Systematic palaeontology and figures
          quoteLocator: Preserved wing venation; Panodonata attribution for Saxonagrion minutus
  claim-rationales.zh:
    - 置信度为中：所引主研究在给定页码、图版或章节定位器处直接支持这一受限的拓扑表述；置信度不外推到文中明确排除的全群起源、全球首现、直接祖先或精确端点。
    - 综述明确把约 268 Ma 化石列为最早现代蜻蜓类，提供概念匹配的化石最低界而非起源估计。
    - 478 个位点、136 个现生物种和 48 个科中 46 个的采样直接支持该研究的更新分类；未解析的骨干关系及未采样谱系仍被保留。
    - 化石地点与现生采样范围分别由两项一手研究记录；二者都不是蜻蜓目全球出现或缺失的完整普查。
    - 位点测序和系统发育分析不直接观察食性、栖息地、飞行性能、体型或生态类群，因此档案明确保留这些未赋值字段。
    - 萨克森蜻蜓的翅脉及作者的泛蜻蜓类归属来自单件上二叠世化石；不会外推为整个蜻蜓目的统一体制。
  claim-statements.zh:
    - 对 136 个物种、48 个现生科中的 46 科以及 478 个位点的靶向测序，支持更新后的蜻蜓目抽样分类。若干主干关系仍不确定，现生样本也不能限定该目的化石延限或起源。
    - 268–0 Ma 的蜻蜓目显示从被认作现代蜻蜓类最早化石的 Saxonagrion minutus 开始，而不沿用更早的 Odonatoptera 边界。
    - 对代表 48 个现生蜻蜓目科中 46 科的 136 个现生物种进行 478 个位点的靶向测序，得到更新的取样分类；主干仍有未解决区段，结果并非完整的目级历史。
    - Saxonagrion minutus 描述自法国 Lodève 盆地上二叠统 Salagou 组，而现生基因组样本覆盖 46 科 136 种；两类记录都不能提供完整蜻蜓目分布。
    - 靶向基因组研究检验的是分类，而不是食性、生境利用、飞行性能、体型或生态功能群；因此本档案将这些字段保留为未指定，而不替蜻蜓目作推断。
    - 一手化石描述依据保存的翅脉将 Saxonagrion minutus 归入泛蜻蜓类；该观察仅涉及这件上二叠统化石，不是全部蜻蜓目的诊断性身体构型。
