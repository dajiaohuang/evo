          - text: Annual, up to 300 mm tall. Leaves ovate, toothed to nearly entire. Flowers in lax racemes, calyx lobes lanceolate, glandular pubescent, corolla 15-20 mm long, greyish magenta, upper lip with greenish yellow rectangular spot at base, lower lip with convex palate at base, upper surface of palate greenish yellow, with two diverging glabrous bosses, spurs projecting backwards, ± straight, pinkish white. Capsule oblong to oblong-ovate.
