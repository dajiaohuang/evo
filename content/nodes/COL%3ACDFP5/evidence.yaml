        claims:
          - text: Like I. pauciflora but flowers pale lilac veined purple outside, tube 15-18 mm long, and filaments exserted no more than 1.5 mm (vs. 2 mm).
            textZh: Ixia dolichosiphon Goldblatt & J.C.Manning 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 7153; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Distinguished by its relatively long perianth tube, 15-18 mm long, white or pale lilac-flushed perianth and short filaments ± 2 mm long, included or exserted up to 1.5 mm from the tube. It is closely allied to, and most easily confused with beige-flowered I. paucifolia, a species of shale slopes in the dry interior valleys of the southwestern Cape. That species has flowers with a perianth tube (22-)25-34 mm long, slightly constricted at the apex, spreading tepals 12-15 x 5 mm, filaments ± 3 mm long, exserted 2-3 mm from the perianth tube and anthers ± 4 mm long. Although confined to cooler, south-facing slopes, I. dolichosiphon flowers from late August to mid-September, earlier than any population of I. paucifolia. It differs from I. paucifolia not only in its white or pale lilac-flushed flowers, veined purple on the outside, and shorter perianth tube, but in the tepals, stamens and style. The tepals are 9-13 mm long, the anthers are ± 3 mm long and the style divides opposite the middle of the anthers with the style branches emerging between them in contrast to the longer style of I. paucifolia that divides close to the anther tips with the style branches arching above the anthers. As in I. paucifolia, the filaments of I. dolichosiphon are decurrent almost to the base of the tube, dividing the interior of the tube into three compartments.
            textZh: SANBI 条目提供了 Ixia dolichosiphon Goldblatt & J.C.Manning 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 95071; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
