      evolution:
        status: partially-supported
        claims:
          - text: Using draft genome and silk-gland transcriptome assemblies for Caerostris darwini, the study reported at least 31 putative spidroin genes and expansions of several spidroin gene classes relative to Trichonephila clavipes. It also detected sex- and gland-specific expression patterns in the sampled tissues. The proposed connection between these patterns and exceptional dragline-silk toughness is presented by the authors as a hypothesis, not as a demonstrated causal result.
            sourceIds:
              - babb2022
            locator: Abstract; Results, 'Characterization of the spidroin sequences in the C. darwini genome', especially the comparison with T. clavipes; see also the abstract's expression-analysis summary.
            placeTimeScope: Wild-caught adult Caerostris darwini from Andasibe-Mantadia National Park, Madagascar. Methods report genome-sequencing DNA from two females, RNA-sequencing material from three further females, and qPCR validation material from three further females and three males. The article does not state specimen-collection dates, so the sampling time is unknown; the version of record was published 2022-06-06.
            lifeStatus: Specimen-derived genomic and transcriptomic evidence from wild-caught adults. The study does not use captive, domesticated, or fossil specimens and does not report field population frequencies.
            originalLanguage: en
        gaps:
          - This is one study-specific genome and transcriptome analysis; within-species population variation, independent population replication, and broader phylogenomic context remain unassessed in this dossier.
          - The proposed contribution of expression or protein composition to silk toughness is a hypothesis in the source and is not treated as a demonstrated mechanism here.
