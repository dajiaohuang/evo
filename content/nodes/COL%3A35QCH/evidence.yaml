    facets:
      morphology:
        status: partially-supported
        claims:
          - text: A weak herb, very slender, annual, shining, minutely glandular-pilose, ascending or suberect, 5-12 in. high; stem tetragonal, inconspicuously furrowed, simple or sparingly branched; internodes exceeding the leaves; leaves opposite, ovate, elliptic or lanceolate, obtuse at the apex, more or less narrowed, sometimes abruptly so at the base, petiolate or the uppermost pair in some cases sessile, thinly membranous, translucent, 1/5-2/3 in. long, 1/8-1/3 in. broad, subentire or few-toothed; petioles ranging up to 1/6 in. long; racemes terminal, few-flowered, lax, 3/4-2 in. long; bracts alternate, lanceolate, obtuse, sessile, entire, smaller than the leaves, recurved in fruit; pedicels 1/5-3/5 in. long; calyx-segments linear-oval or sublinear, obtuse, minutely puberulous and ciliolate, 1/12-1/9 in. long; corolla 2/5 in. long and broad; lower corolla-lip trifid, 1/4-1/3 in. long; lobes ovate-oblong, rounded, and emarginate at the apex, 1/5 in. long; upper corolla-lip nearly as long as the lower, broad, bifid; palate nearly glabrous; umbo marked with orange-coloured papillae; spur conical, subsaccate, obtuse, about 1/12 in. long; stamens 4; anthers small; pollen very small, spheroidal, marked with about 6 longitudinal furrows, smooth; capsule subquadrate, broadly excised at the apex, unequally rounded or subtruncate at the base, glabrous, pallid, 1/4 in. long, not quite as broad; seeds broadly winged, including the wing 1/12 in. long, 1/20 in. broad, oval-oblong and emarginate at both ends, the body sublinear, pale yellowish-green and tuberculate, wings white and marked with approximate parallel minute ribs transverse to the body of the seed.
            sourceIds:
              - sanbi_931_0
            locator: "SANBI/WFO archive Morphology row 81504; source 931.0; publication: Hiern, WP. 1904. XCV. Scrophulariaceae. In: WT Thiselton-Dyer (ed.), Fl. Cap. (Harvey) 4(1-3): 121 - 420. Lovell Reeve & Co., London. [https://www.biodiversitylibrary.org/item/15241#page/129/mode/1up]. [All rights reserved]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
