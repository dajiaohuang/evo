    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants 0.70-1.25 m high, solitary or few in small tufts. Corm ± 15 mm diam. Stem with lowermost peduncle 45-110 mm long. Foliage leaves few, 550-850 x 3-5(-9) mm; reduced sheathing leaves ± 4. Spikes pendulous, terminal 6- to 12-flowered, laterals 2 to 5, sometimes compounded, each 4- to 10-flowered; bracts elliptic-lanceolate, acuminate, 15-18(-23) x 5-8 mm, < or up to 2 internodes long, membranous, pale reddish brown and well flecked in lower part and along midline, margins and shoulders white, lateral veins ± 5 each side of main vein. Flowers bell-shaped with tepals suberect or scarcely flaring apically, creamy white to pale yellow, rarely pale pink; perianth tube 6-8 mm long; tepals 9-12 x 4-6(-7) mm. Anthers 5-7 mm long. Stigmas held 3-4(-9) mm below top of perianth.
            textZh: Dierama sertum Hilliard 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Morphology row 98561; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Occurring as solitary stems or small tufts with brown-flecked bracts, and small to moderately sized, rather closed, creamy white to pale yellow (rarely pale pink) flowers, the perianth 16-19(-25) mm long. Dierama pallidum from south-central KwaZulu-Natal between Pietermaritzburg and Durban has similar flowers but pure white bracts. Dierama argyreum, also with white bracts, has larger, bell-shaped white or ivory-coloured flowers, the perianth 18-35 mm long with flaring tepals.
            textZh: SANBI 条目提供了 Dierama sertum Hilliard 的鉴别特征。
