  claims:
    - subjectId: taxon:elasmobranchii
      claimKind: scientific
      claimType: topology
      statement: Mitochondrial sequences from 595 sampled species provide a broad explicit estimate of living elasmobranch relationships. The mitochondrial tree does not define the total fossil range, exact crown age or global origin of Elasmobranchii.
      confidence: medium
      confidenceRationale: Confidence is medium because the cited primary study directly supports the bounded topology statement at the supplied locator. The confidence does not extend beyond the mitochondrial tree does not define the total fossil range, exact crown age or global origin of Elasmobranchii.
      referenceLinks:
        - relation: supports
          referenceId: naylor-2012-elasmobranch-phylogeny
          pages: 47–72
          figure: Phylogenetic trees and taxon appendix
          quoteLocator: 595-species sampling; mitochondrial analyses; topology discussion
    - subjectId: taxon:elasmobranchii
      claimKind: scientific
      claimType: divergence-time
      statement: A calibrated mitogenomic analysis estimated the shark–ray split near 281 Ma, supporting a model-dependent 281 Ma–present window for modern elasmobranch lineages, not a total-group fossil FAD.
      confidence: low
      confidenceRationale: "Modern elasmobranch lineage model and fossil constraints: the cited primary study or systematic review directly supports the stated sample, calibration or withholding boundary at the supplied locator. Confidence is low and does not extend to a global FAD, LAD, direct ancestor or unsampled interval."
      referenceLinks:
        - relation: supports
          referenceId: inoue-2010-holocephalan-mitogenomics
          pages: 2581–2584
          figure: Figure 2; Tables 2–3
          quoteLocator: Divergence-time estimation; elasmobranch fossil constraints and caveats
  claim-rationales.zh:
    - 置信度为中：所引主研究在给定页码、图版或章节定位器处直接支持这一受限的拓扑表述；置信度不外推到文中明确排除的全群起源、全球首现、直接祖先或精确端点。
    - Modern elasmobranch lineage model and fossil constraints：所引一手研究或高质量系统综述在给定页码、图表或章节处直接支持此处的样本、校准或暂缓边界。置信度为低。该置信度不外推至全球首现、全球末现、直接祖先或未采样区间。
  claim-statements.zh:
    - 595 个抽样物种的线粒体序列提供了广泛而明确的现生板鳃类关系估计。线粒体树不能限定板鳃类的完整化石延限、精确冠群年龄或全球起源。
    - 校准后的线粒体基因组分析把鲨—鳐分化估计在约 2.81 亿年前，因此可建立依赖模型的 2.81 亿年前至今现代板鳃类谱系窗口，但不能当作板鳃类总群的化石首现。
