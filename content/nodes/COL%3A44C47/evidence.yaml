    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, 200-300 mm tall. Leaves single, linear, channelled, trailing above. Flowers enclosed in translucent spathes, blue-violet, nectar guides orange and white, tepals subequal, lightly spreading.
            textZh: Moraea contorta Goldblatt 的 SANBI 物种条目记载了植株、叶片和花部形态。
            sourceIds:
              - sanbi_14562_0
            locator: Strelitzia 30; archive Morphology row 33294, source 14562.0
            placeTimeScope: Regional species account published 2013; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
          - text: Recognised by the large dark blue flowers with relatively broad tepals, the outer 21-26 x 10-12 mm long, with the claws ± a third as long as the limbs, Moraea contorta is most closely related to the more widespread M. pritzeliana and its range falls entirely with that of the latter. The flowers of M. contorta have a strong sweet, coconut-like scent while those of M. pritzeliana, often darker in colour, are apparently unscented. Vegetative differences are more pronounced, and M. contorta typically has a single, linear, channelled leaf in contrast to the very distinctive pair of opposed, helically coiled leaves of M. pritzeliana. The two species share a unique feature, as the capsules ripen and the stems dry out they become loosely coiled.
            textZh: SANBI 条目提供了 Moraea contorta Goldblatt 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: Strelitzia 42; archive Diagnostic row 94194, source 18638.0
            placeTimeScope: Regional species account published 2020; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
