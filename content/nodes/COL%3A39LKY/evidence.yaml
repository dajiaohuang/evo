    facets:
      morphology:
        status: partially-supported
        claims:
          - text: "Evergreen shrub or small tree, up to 6 m high; older stems with straw-coloured bark. Leaves: blades up to 80 x 40 mm, elliptic, ± acute at apex, cuneate at base; glabrous, coriaceous, shiny above, midrib ± flat above, raised beneath; domatia absent; petioles up to 6 mm long, stout, puberulous above. Stipules joined, awn up to 3 mm long. Flowers axillary, in 1-5-flowered cymes; white or pink. Corolla: tube 4-6 mm long, glabrous outside, densely crisped-hairy at throat; lobes up to 6 x 3 mm, reflexed. Flowering time Sept.-Dec. Fruit purplish black, spherical, 7-8 mm in diam."
            sourceIds:
