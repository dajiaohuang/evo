        claims:
          - text: "The SANBI e-Flora morphology field describes Syringodea saxatilis M.P.de Vos: plants 40–80 mm high, with a solitary falcate leaf that is unifacial and subcylindrical distally but bifacial and folded basally; flowers pale to deep violet."
            textZh: SANBI e-Flora 形态字段记载 Syringodea saxatilis M.P.de Vos：株高 40–80 mm，具一枚镰形叶，叶片远端单面、近圆柱形，基部双面并对折；花浅紫至深紫。
