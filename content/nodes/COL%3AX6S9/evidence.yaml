    facets:
      morphology:
        status: not-assessed
      lifeHistory:
        status: not-assessed
      ecology:
        status: partially-supported
        claims:
          - text: A 2019 ground survey at Boabeng-Fiema Monkey Sanctuary recorded 602 Colobus vellerosus individuals in 34 groups across six forest patches. This is a site-level survey count, not a global abundance estimate.
            sourceIds:
              - wiafe2023colobus
            locator: Results, 2019 survey population counts (PDF lines 501-513); survey design and transect effort (PDF lines 334-396).
            placeTimeScope: Boabeng-Fiema Monkey Sanctuary, Ghana, 2019; six forest patches, 17 transects of 500-1,000 m, and 71,050 m total walking distance over two survey rounds.
            lifeStatus: Free-ranging animals counted in forest patches; age, sex, captive populations, and fossils were not assessed.
            originalLanguage: en
        gaps:
          - The count covers one sanctuary and its surveyed patches and is not a species-wide abundance estimate.
          - Visibility, animal detection, and transect access constrained survey methods; the authors did not fit a DISTANCE model because of few effective sightings.
          - Morphology, life history, broader ecology, evolution, range-wide distribution, fossils, conservation status, systematic search, remain unassessed.
      evolution:
        status: not-assessed
      distribution:
        status: partially-supported
        claims:
          - text: In a 2019 survey at Boabeng-Fiema Monkey Sanctuary, Colobus vellerosus was recorded in six forest patches, with 34 groups and 602 individuals counted. The result documents occurrence at this site and does not map the species' full geographic range.
            sourceIds:
              - wiafe2023colobus
            locator: Results, 2019 population counts (PDF lines 501-513); the six-patch survey design is described at PDF lines 334-396.
            placeTimeScope: Boabeng-Fiema Monkey Sanctuary, Ghana, 2019, across the six surveyed forest patches.
            lifeStatus: Free-ranging animals observed during ground surveys; captive and fossil occurrences were not assessed.
            originalLanguage: en
        gaps:
          - This is one sanctuary record and does not establish the complete distribution or occupancy outside the survey area.
          - Other sites, survey years, and independent detection methods remain unassessed.
      fossil:
        status: not-assessed
      conservation:
        status: partially-supported
        claims:
          - text: The article reports a 70% increase in estimated Colobus vellerosus density at Boabeng-Fiema between 2007 and 2019 (5.8% per year), while cautioning that the comparison involved different survey personnel and methods. It should not be read as a methodologically uniform or range-wide population trend.
            sourceIds:
              - wiafe2023colobus
            locator: Results, 2007-2019 comparison (PDF lines 531-535); authors' methodological caveat (PDF lines 720-723).
            placeTimeScope: Boabeng-Fiema Monkey Sanctuary, Ghana, reported comparison between 2007 and 2019 survey estimates.
            lifeStatus: Wild sanctuary population estimates; the paper does not provide a captive or fossil trend.
            originalLanguage: en
        gaps:
          - The reported increase is a local comparison and the authors identify differences in personnel and methods between survey periods.
          - Current threat drivers, demographic structure, wider-range trends, and independent population estimates remain unassessed.
