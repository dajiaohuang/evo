        claims:
          - text: Humile, compactum vel cultum demum magis laxe ramosum; caulis robustus, apice 2.5 cm. diam.; rami primarii rigidi, 3-4 mm. diam., internodiis ad 1 cm. longis; partes herbacea laete virides, glabrae vel folium ciliatum vel pilosum rarissime visum; folia patentia, anguste obovata abrupteque acuta vel sublanceolata, prope basin conspicue angustata, supra plana, obtuse carinata, apiculata, 0.6-1.8 cm. longa, 3-6 mm. lata, ad 3 mm. diam., vagina ad 1 mm. longa; flores solitarii diurni; pedunculi saepe 2 mm. longi; receptaculum subglobosum, ad 3 mm. longum, ad 4 mm. diam.; sepal a 5, in flore maturo conspicue inaequalia, 2 exterior a 5-6 mm. longa, medio ad 3 mm. diam., supra con vex a, obtuse carinata, apiculata, apiculo subreeurvo, interiora marginata, 2-4 mm. longa; petala 4-seriata, obtusa, inferne angustata rosea, in staminodia transeuntia, 4-7 mm. longa, ad 1 mm. lata; staminodia pallide rosea, stamina conice conferta superantia, ad 3 mm. longa; filamenta alba, intima prope medium papillata, antheris luteis; glandulae approximatae vel fere contiguae, crenulatae; ovarium circa marginem concavum, lobis approximatis obtusis, per 0.5 mm. elevatis; stigmata 5, subulata, longe acuminata, 1.5 mm. longa; capsula 4 mm. diam., supra per 1 mm. elevata.
