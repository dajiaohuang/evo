    facets:
      morphology:
        status: partially-supported
        claims:
          - text: "Plants small, acaulescent, rarely 5-8 cm caulescent, solitary, or with a few offsets from base forming small groups. Leaves 10-20, densely rosulate, spreading, slightly recurved towards apex, 20-25 cm long, 5-6 cm broad, oblong-lanceolate, acuminate; upper surface rather flat in lower half, slightly concave upwards, bright green with scattered elongated 'H' shaped dull white spots, and linear greenish-white lines; lower surface convex, pale green with numerous pale green specks and linear green lines; margins sinuate-dentate, the teeth 3-5 mm long, spreading, deltoid, pungent, dark brown, 8-12 mm distant. Inflorescence a branched more or less corymbose panicle, 3-6-branched usually above the middle, mostly 50 cm high, sometimes reaching 75 cm, the branches and branchlets arcuate-ascending, the lowest branches subtended at base by a lanceolate-attenuate papery bract 5-8 cm long. Peduncle reddish-green, covered with a waxy bloom. Racemes densely capitate, corymbose (flat topped), about 20-30-flowered, 4-8 cm long, 5-6 cm diam.; the buds white striped with greenish tips, the mature flowers coral-pink. Bracts lanceolate-acuminate, very thin, dry, white, about 7 mm long, 3-5-nerved, Pedicels lowest of terminal racemes up to 15 mm long. Perianth mostly 28 mm long, with 7 mm diam. sub-globose basal swelling, constricted above the ovary to 4 mm, thence slightly decurved and enlarging towards the throat, distinctly compressed laterally; outer segments free for 8 mm, with whitish margins, obscurely 3-nerved, the nerves greenish at apex; inner segments dorsally adnate to the outer for their greater length, obscurely 3-nerved, broader and with more obtuse apices than the outer. Filaments the 3 inner narrower and lengthening in advance of the 3 outer, pale lemon. Anthers the 3 inner and 3 outer in turn exserted 1-3 mm Style deeper lemon coloured than the filaments. Stigma exserted 1-3 mm. Ovary 5.5 mm long, 2-7 mm diam., finely 6-grooved, green. Note: The leaf sap is greenish, and does not change colour after drying for a few days."
