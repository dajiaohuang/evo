      usage:
        scope:
          en: Systematic review and expanded anatomical phylogenetic analyses; supports an ornithodiran placement while retaining uncertainty over pterosaur origins and closest relatives.
          zh: 系统综述与扩展解剖系统分析支持将翼龙置于鸟跖类，同时保留其起源和最近亲的不确定性。
