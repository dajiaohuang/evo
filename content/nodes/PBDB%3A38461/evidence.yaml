  claims:
    - subjectId: taxon:pterosauria
      claimKind: scientific
      claimType: taxonomy
      statement: Review and expanded anatomical analyses place Pterosauria within archosaur Ornithodira near dinosaurs, but its precise origin and closest relatives remain analysis-dependent.
      confidence: high
      confidenceRationale: The profile separates directly documented specimens and explicit analyses from global range, behaviour and ancestry inferences; confidence is bounded by the cited primary study and its stated sample. This rationale is specific to pterosauria:taxonomy.
      referenceLinks:
        - referenceId: witton-habib-2010-giant-pterosaur-flight
          relation: contextualizes
          pages: 867–873
          figure: Figures 1–5
          quoteLocator: taxonomy
        - referenceId: baron-2021-origin-pterosaurs
          relation: supports
          pages: Article 103777
          quoteLocator: Abstract; Conclusions points 1–2
    - subjectId: taxon:pterosauria
      claimKind: scientific
      claimType: fossil-range
      statement: The Pterosauria navigation envelope retains a rounded 228 Ma older edge for the Norian Carniadactylus sample and a broad 66 Ma younger edge; the named specimens support Late Triassic pterosaur presence but not an exact global first or last appearance, clade-origin date or direct ancestry.
      confidence: medium
      confidenceRationale: The detailed redescription identifies a nearly complete holotype, a referred specimen, their Norian formations and a tested pterosaur placement. Medium confidence preserves stage-scale dating, taxonomic revisions and the composite younger boundary.
      referenceLinks:
        - referenceId: dalla-vecchia-2009-carniadactylus
          relation: supports
          pages: 159–188, especially 160–179
          figure: Figures 1–16
          quoteLocator: Holotype and referred material; geological setting; systematic palaeontology and phylogenetic analysis
    - subjectId: taxon:pterosauria
      claimKind: scientific
      claimType: biogeography
      statement: Pterosaur remains are reported from every continent, but a 108-taxon analysis finds the record extremely patchy; package dossiers therefore remain tied to named specimens and localities rather than a complete distribution.
      confidence: high
      confidenceRationale: The profile separates directly documented specimens and explicit analyses from global range, behaviour and ancestry inferences; confidence is bounded by the cited primary study and its stated sample. This rationale is specific to pterosauria:biogeography.
      referenceLinks:
        - referenceId: witton-habib-2010-giant-pterosaur-flight
          relation: contextualizes
          pages: 867–873
          figure: Figures 1–5
          quoteLocator: biogeography
        - referenceId: upchurch-2015-pterosaur-biogeography
          relation: supports
          pages: 697–717
          figure: Figures 1–7; Table 1
          quoteLocator: Abstract; Introduction; sections 2 and 5.2
    - subjectId: taxon:pterosauria
      claimKind: scientific
      claimType: morphology
      statement: Pterosaurs support a membranous wing primarily on an elongate fourth finger; launch capacity and flight performance are biomechanical model outputs rather than preserved motions.
      confidence: high
