      fields:
        - id
        - title
        - url
        - scope
      metadataVariant: 0
      usage:
        scope:
          en: Comparative scaling and biomechanical feasibility study; reconstructed mass, wing planform, muscle power and launch kinematics are model inputs, not direct observations.
          zh: 比较尺度与生物力学可行性研究；重建体重、翼面积、肌肉功率和起飞运动学均为模型输入，并非直接观察。
