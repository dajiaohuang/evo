        - url
        - scope
      metadataVariant: 0
      usage:
        scope:
          en: Detailed redescription and phylogenetic analysis of Norian pterosaur holotype MFSN 1797 and referred specimen MPUM 6009; this locality does not establish a global first appearance.
          zh: 对诺利期翼龙正模 MFSN 1797 与归入标本 MPUM 6009 的详细再描述和系统分析；该地点不能确定全球最早出现时间。
    - id: upchurch-2015-pterosaur-biogeography
      referenceId: upchurch-2015-pterosaur-biogeography
      fields:
        - id
        - title
        - url
        - scope
      metadataVariant: 0
      usage:
        scope:
          en: Quantitative analysis of 108 pterosaur taxa; reports an every-continent record while emphasizing severe spatial and temporal patchiness and sampling-sensitive biogeographic inference.
          zh: 对 108 个翼龙分类单元进行定量分析；报告各大洲均有记录，同时指出时空分布极不均匀，地理推断受采样影响。
    - id: wang-2017-hamipterus-eggs
      referenceId: wang-2017-hamipterus-eggs
      fields:
        - id
        - title
        - url
        - scope
      metadataVariant: 0
      usage:
        scope:
          en: Reports exposed Hamipterus eggs and embryo-bearing specimens from one fossil block; behavioral and hatchling-flight interpretations remain distinct from preserved evidence.
          zh: 报告一块化石板上的 Hamipterus 卵及含胚胎标本；行为和幼体飞行解释须与直接保存的证据区分。
    - id: cincotta-2022-tupandactylus-feathers
      referenceId: cincotta-2022-tupandactylus-feathers
      fields:
        - id
        - title
        - url
        - scope
      metadataVariant: 0
      usage:
        scope:
          en: Analyzes preserved integument and melanosome geometry in a Crato Formation pterosaur specimen; signalling function and exact colour are interpretive conclusions.
          zh: 分析 Crato 组一件翼龙标本保存的体表组织与黑素体形态；信号展示功能与确切颜色均属解释性结论。
    - id: witton-habib-2010-giant-pterosaur-flight
