        usage:
          title: Cynanchum cubense (A.Rich.) Woodson, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Large herbaceous vines with abundant latex, the stems glabrous or nearly so, hollow. Leaves widely ovate, deeply cordate when mature, or shallowly cordate, apically acuminate to short-apiculate, glabrous, 10-30 cm long and 7-49 cm wide with a cluster of laminar glands at the base; petioles 5-12 cm long, glabrate. Inflorescence at first racemose, branching to become a panicle of racemes to 30 cm long, the branches minutely puberulent, densely so when younger; pedicels mostly 2-4 mm long. Flowers with the calyx deeply lobed, the lobes shorter than the corolla lobes, ovate-lanceolate, acuminate, puberulent to glabrate on the outside, 1.5-3.0 mm long and 1.0-1.4 mm wide; corolla greenish-white, rotate, the lobes at anthesis reflexed, with revolute margins, glabrous outside, densely white papillose inside, 3.0-3.3 mm long and 1.3-1.4 mm wide; corona cyathiform, shallowly 5-lobed, shorter than the gynostegium, the lobes truncate with slightly inrolled lateral margins, ca. 0.6 mm long, glabrous to densely papillate inside; gynostegium 1.8-2.2 mm high, the column densely papillate, the head 2.4-2.7 mm in diameter, slightly umbonate. Follicles (described from Cuban material) ovate-oblong, smooth, 15-21 cm long, 7-10 cm in diameter.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 1314
          archiveSourceId: 074C9DF2-45CB-487F-A0D1-38171A2F5475
