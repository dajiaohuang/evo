        claims:
          - text: "Succulent, bulbous perennial; acaulescent. Bulb often clumping, with loosely packed, membranous scales covering slightly fleshy leaf bases. Leaves semisucculent, grass-like, deciduous; blade erect, slender, 4-5 mm wide, strongly spiralling, greyish green, white-spotted near base; margins with soft, white, decurved teeth. Flowers: Haworthia-like, zygomorphic, erect; inflorescence a lax, unbranched raceme, appearing with leaves; perianth reddish brown to greenish brown with greenish keels to segments; Nov., Dec. Fruit an apically acuminate capsule."
