    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Glandular-hairy annual to 20 cm. Leaves crowded basally. Flowers in racemes, tube shortly funnel-shaped, lobes rounded, white with yellow tube.
            sourceIds:
              - sanbi_14436_0
            locator: "SANBI/WFO archive Morphology row 6041; source 14436.0; publication: Manning, JC; Goldblatt, P. 2012. Scrophulariaceae: Manulea L. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 745 - 747. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: It is allied to M. latiloba, which differs in its relatively broader calyx lobes and shorter corolla tube, as well as in the lack of relatively long balloon-tipped hairs on the calyx. De Rust lies well east of the area of M. latiloba, whose nearest known station was recorded as 'Ladismith road to Riversdale'.
