        usage:
          title: Columnea kalbreyeriana Mast., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Suffrutescent herbs or shrubs, terrestrial and epiphytic; stems to 1 m long, 4-8 mm in diam., transparent strigose. Leaves of a pair strongly unequal; larger leaf narrowly oblong, 20.1-27.7 cm long and 4.3-4.9 cm wide, long acuminate, strongly oblique at the base, serrate, green above, glabrous, below green or red spotted, strigose, the hairs transparent, 4-10 celled, fine, also 2-3 celled white appressed hairs; petioles lacking or to 2 mm long; smaller leaves lanceolate, 1.2-1.7 cm long and 4 mm wide, acuminate, oblique at the base, green. Flowers in pairs; bracts lanceolate, 1.4-1.5 cm long, pale brown hirsute; pedicels 1.1-1.8 cm long, transparent to brown strigose; calyx lobes ovate, 2.8-3.4 cm long, the apex long acuminate, coarsely dentate, greenish yellow, sparsely strigose; corollas yellow with pink or red stripes, funnel shaped but strongly zygomorphic, 5.1-6.1 cm long, ca. 6 mm in diam. above the base, becoming ca. 8 mm at the throat, outside reddish hirsute, the lobed portion of the corolla 2.9-3.6 cm long, the lobes strongly unequal, the posterior pair connate, bibbed at the apex, ca. 1.1 cm long, the anterior lobe 2.1-2.8 cm long, reflexed; filaments yellow, glabrous, the anthers exserted; ovary sericeous, the style glabrous, yellow, the stigma stomato- morphic. Fruits not seen.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 6174
