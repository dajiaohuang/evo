            locator: "SANBI/WFO archive Morphology row 3550; source identifier 11118.0; cited publication: Herman, PPJ; Retief, E. 1997. Plants of the northern provinces of South Africa: Keys and diagnostic characters. Strelitzia 6: 1 - 681. National Botanical Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Intergrades with S. plicatilis, which is a smaller plant with much narrower leaves and a shorter, sparser panicle; also closely related to S. lindenbergiana, which has much narrower, linear, finely plicate leaves.
