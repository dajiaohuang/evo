    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Very tall, robust perennial, shortly rhizomatous and tufted (culms erect and occasionally rooting at nodes), up to 3 m high. Leaf blades 150-800 mm long, 10-110 mm wide, lanceolate, conspicuously plicate, leaf sheaths usually densely pubescent or at least with hairy margins. Culms 4-10 mm in diameter, nodes glabrous. Spikelets 2-3 mm long. Panicle open, 400-600 mm long; bristles solitary; lower glume 3-nerved.
