        usage:
          title: Erigeron cuneifolius DC., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Diminutive rosette forming herbs developing a relatively stout rootstock. Basal leaves broadly obovate or spatulate to 3 cm long and 1.5 cm broad, the margins entire or with 2-5 teeth in the upper portion, glabrous to puberulent, more so beneath, minutely ciliate on the margins, the midvein strong and the minor venation more or less obscure. Inflorescence a scape to 30 cm tall, slender, puberulent with ascending hairs, the leaves scalelike to 10 mm long, lanceolate, basally partly clasping the stem and apically callose-glandular. Heads radiate, solitary or 1-3 near the top of the scape, ca. 4 mm high; involucral bracts imbricate in 2-3 unequal series, the longest ca. 3 mm long, narrowly lanceolate with a broad, erose hyaline margin, the herbaceous midvein extending into the tip; receptacle 1.5-3 mm across, convex, naked, alveolate; ray florets numerous in 1 or 2 series, 5 mm long, corollas white, the ligule 0.3 mm wide, the tube relatively long, 2-2.5 mm long, glabrous, the style branches linear, relatively short; disc florets 4 mm long, the corolla yellow, gradually expanding upwards with little distinction between limb and tube, anthers ca. 1 mm long, the appendages narrow, style branches flattened, copiously papillose-verrucose on the margin, the appendages half as broad as long. Achene much compressed with two veins thickening the margins, glabrous to densely pubescent; pappus of fine strigulose bristles in 1 series reaching the tips of the style branches, achene of the ray florets like that of the disc florets but narrower, perhaps not fertile.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 1808
