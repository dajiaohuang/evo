          - text: Schoenus purpurascens is a species with loose membranaceous leaf sheaths (often with small reddish-purple streaks), non-channelled basal leaf blades (leading to the leaves appearing flat), as well as ovate spikelets (<4.1 mm long) with relatively short mucros. Schoenus bolusii also has membranaceous leaf sheaths with reddish-purple streaks; however, the leaf blades of the two species differ, as those of S. purpurascens are most often not channelled and thus appear flat compared to the channelled, terete leaf blades of S. bolusii. In addition, S. purpurascens has ovate spikelets, whereas those of S. bolusii are between lanceolate to ovate in shape. Schoenus calceolus and S. prophyllus also have ovate spikelets; however, those two species do not have the non-channelled leaves of S. purpurascens.
