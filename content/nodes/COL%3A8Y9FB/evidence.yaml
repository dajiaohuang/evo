    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Caespitose, phyllopodic perennial graminoid. Culms terete, slender, (193-)339-528(-732) x 0.4-0.9 mm. Leaves basal, 2-4(-8), (4-)54-149(-392) x 0.2-1.4 mm, mostly straight, usually not proximally channelled, margin usually serrate above sheath. Sheaths membranaceous with reddish-purple streaks, usually loosely clasping culm, longitudinally striate. Ligule membranaceous, varying lengths, 0.3-1.1(-9.2) mm long. Inflorescence a pseudolateral panicle, 9-33(-45) x 3-12 mm, proximal rachis length 4-16(-29) mm. Proximal primary inflorescence bracts slender, not channelled, apex acute to acuminate, never widened at base, 29-66(-206) mm long, exceeding length of inflorescence up to several times, without notable longitudinal veins. Proximal and subproximal primary inflorescence bracts never with membranaceous extensions at base. Spikes 2-11, (4.0-)7.4-19.0 mm long, usually dispersed along rachis. Spikelets ovate, 2.6-4.1 x 1.0-1.7 mm, pedicellate, 2-10 spikelets per spike, reddish-brown sometimes with narrow hyaline margins. Proximal spikelet prophyll 1 per spikelet, with a raised vein extending to mucro, 0.4-1.1 mm long, prophyll mucro 0.8-2.5(-3.6) mm long. Rachilla 0.8-2.8 mm long. Glumes 4-7 per spikelet, proximal glume 0.4-1.8 mm long, subproximal glume 0.6-2.2 mm long, upper glumes longer than basal ones, apex acute to acuminate. Glume mucros relatively short, proximal mucro 0.1-0.8 mm long, subproximal mucro 0.1-0.3 mm long. Stamens (1-)3(-5) per floret, anthers 1.3-3.7 mm long. Stigmas 3-branched, vestigial stigmas of second bisexual floret sometimes present. Perianth bristles not observed. Nutlet not present on examined specimens.
