        metadataVariant: 0
        usage:
          title: Tynanthus croatianus A.H.Gentry, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Liana, the stems with 4 phloem arms in cross section, the pith conspicuously 4-angled; branchlets tetragonal, becoming subterete, finely striate, becoming noticeably lenticellate with age, young twigs more or less puberulous, the nodes without interpetiolar glands or pseudostipules, vegetative parts with odor of cloves. Leaves 3-foliolate, or 2-foliolate with a tendril or tendril scars; leaflets membranaceous, papillose on both surfaces with scattered lepidote scales espe- cially above, minutely puberulous below mostly on and near nerves and above more or less glabrescently so over whole surface, drying light green to yellowish with distinct yellow to reddish-brown reticulation beneath, darker green to brownish above, the terminal leaflet when present broadly ovate, obtusely acuminate, truncate to broadly cuneate, 5.5-12 cm long and 3.7-8 cm wide, the lateral leaflets broadly ovate, obtusely acuminate, more or less asymmetrically truncate or subcordate on one side at the base, 3.9-10 cm long and 2.7-6 cm wide; terminal petiolule 1.5-3.3 cm long, laterals 0.6-2.5 cm long, the petiole 1.4-7.5 cm long, drying dark reddish; tendril strongly trifid; 11-15 cm long to branching, the 3 arms 1.0-2.2 cm long. Inflorescence a small, usually axillary panicle, 3-8 cm long and 2-6 cm wide, the branches strongly puberulous. Flowers sweetly aromatic with odor similar to lilacs, calyx cupular, puberulous, eglandular, truncate or minutely sub-denticulate, 3-4 mm long and 3-4 mm wide; corolla white with 2 yellow lines in the throat; bilabiate, 1.2-2 cm long, split about half its length, the 2 upper lobes almost fused, the 3 lower lobes 4-9 mm long, puberulous outside, inside pubescent on lower 3 lobes, margins of upper 2 lobes, at the base of the lower side of the tube and sparsely elsewhere, glabrous at the point of stamen insertion; stamens didynamous, the anther thecae 1.5 mm long, divaricate, twisted near the base and reflexed forward, the connective extended 0.3 mm beyond point of anther attachment, the longer filaments 1.0-1.2 cm long, shorter filaments 0.9-1.0 cm long, the staminode 0.5 cm long, inserted 2 mm from the base of corolla tube; pistil 16-17 mm long, the stigma small, bilamellate, 1 mm long, the style puberulous, the ovary conical 1.5-2 mm long and 1 mm wide at the base, densely puber- ulous, the ovules 4-seriate in each locule at the bottom of the ovary and 2- seriate at the top; disc reduced, shortly cupuliform, densely pubescent on the margin. Capsule linear, acuminate, flattened, 25-35 cm long and 0.8-1.2 cm
