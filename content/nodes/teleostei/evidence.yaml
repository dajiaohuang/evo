      confidenceRationale: Confidence is medium because the cited systematic synthesis directly supports the bounded taxonomy statement at the supplied locator. The confidence does not extend beyond the classification is a navigational taxonomic framework and does not itself establish Teleostei's fossil origin or temporal endpoints.
      referenceLinks:
