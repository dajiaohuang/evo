          referenceId: betancur-2017-bony-fish-classification
          pages: "162"
          figure: Figures 1–3; classification appendices
          quoteLocator: Phylogenetic synthesis; nomenclatural framework; classification
    - subjectId: taxon:teleostei
      claimKind: scientific
      claimType: divergence-time
      statement: Concatenated ohnologue clocks estimated crown Teleostei between 254.36 and 234.16 Ma; the interval is a model result for the divergence event, not a fossil FAD, complete duration or ancestor.
      confidence: medium
      confidenceRationale: "Crown Teleostei molecular-clock interval: the cited primary study or systematic review directly supports the stated sample, calibration or withholding boundary at the supplied locator. Confidence is medium and does not extend to a global FAD, LAD, direct ancestor or unsampled interval."
      referenceLinks:
        - relation: supports
          referenceId: qi-2024-teleost-wgd-dating
          pages: Article evae128
          figure: Figure 1; Supplementary Table S1
          quoteLocator: "Results: crown Teleostei 254.36–234.16 Ma"
