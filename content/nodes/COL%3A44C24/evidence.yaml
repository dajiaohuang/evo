        claims:
          - text: Cormous geophyte, 20-30 cm. Leaf solitary, linear, channelled. Flowers violet with a dark eye, inner tepals trifid with a long, straight, central cusp.
            textZh: Moraea amissa Goldblatt 的 SANBI 物种条目记载了植株、叶片和花部形态。
            sourceIds:
              - sanbi_13878_0
