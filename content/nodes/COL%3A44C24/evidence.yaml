            placeTimeScope: Regional species account published 2012; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
          - text: Moraea amissa has broad, spreading, outer tepal limbs reminiscent of M. villosa but the pale blue flowers are much smaller and the inner tepals are either entire or imperfectly 3-lobed, thus inconsistent with M. villosa. The stems and leaves are glabrous, in contrast to the condition in most members of the M. villosa alliance.
            textZh: SANBI 条目提供了 Moraea amissa Goldblatt 的鉴别特征。
