  claims:
    - subjectId: event:magericyon-feeding-fea
      claimKind: scientific
      claimType: event-mechanism
      statement: Finite-element models based on Magericyon holotype B-4071 and comparative carnivoran mandibles quantify simulated bites and external-load scenarios; their stress and force results bound functional hypotheses but do not directly observe prey handling.
      confidence: medium
      confidenceRationale: Magericyon feeding finite-element models uses explicit named specimens or disclosed datasets, but placement, function or ecology depends on a sampled matrix or comparative model and is kept separate from observation.
      referenceLinks:
        - referenceId: peigne-2008-magericyon
