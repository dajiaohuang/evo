  claim-rationales.zh:
    - “巨犬熊进食有限元模型”的具名标本或已公开数据集是明确的，但位置、功能或生态依赖采样矩阵或比较模型，且已与直接观察分开。
  claim-statements.zh:
    - 以 Magericyon 正模 B-4071 和比较食肉目下颌为基础的有限元模型，量化了模拟咬合与外部负载情景；应力和力的结果限定了功能假说，但没有直接观察猎物处理。
