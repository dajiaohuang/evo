          scope:
            en: Supports the naming of the Manado form as T. spectrumgurskyae, with duet-call and specimen provenance central to identification; the type locality is Manado. The paper places this taxonomic treatment in a northern-Sulawesi biogeographic argument, not a new population census.
            zh: 支持将 Manado 形态群命名为 T. spectrumgurskyae；辨识以二重唱和标本来源为重要依据，模式产地为 Manado。论文将该分类处理置于苏拉威西北部生物地理讨论中，并非新的种群普查。
      - id: clink2020
        referenceId: ref-c47e763d-dde5-8a89-a2c6-fe9b11e1bd97
