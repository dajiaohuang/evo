        usage:
          title: Eugenia uniflora L., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrubs or small trees 3-10 m. high. Leaves ovate to ovate-lanceolate, shortly acuminate, obtuse to rounded or subcordate at the base, 2.5-6.0 cm. long and 1.5- 3.5 cm. broad, chartaceous, glabrous, lateral nerves prominulous on both sides, arcuate-anastomosing at about 3 mm. within the margin, the veins laxly reticulate; petiole about 2 mm. long. Flowers solitary in the axils of bracts at the base of young shoots or sometimes in fascicles of 4-8; bracts scarious, up to 5 mm. long. Pedicels slender, glabrous, 1.5-2.0 cm. long. Sepals oblong, ciliate, up to 4 mm. long, glabrous. Petals obovate, unguiculate, 8-12 mm. long. Ovary glabrous, 8-ribbed, 2-celled; cells several (10-14-) ovulate; placenta peltate, thickened in the middle. Berry depressed-globose, 8-ribbed, 1-seeded, 2.5-3.0 cm. in diameter, red, edible. Cotyledons partly free.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 8392
