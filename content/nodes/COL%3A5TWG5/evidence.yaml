    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants solitary, 250-600 mm tall excluding inflorescence, with a 300-500 mm long, often prostrate stem. Leaves 16-24, erect to spreading, 500-750 x 60-100 mm, channelled, upper surface with many whitish spots, irregularly arranged or in transverse bands, lower surface with more numerous spots in more distinct bands. Inflorescence with 11-20 ultimate branches, 1.4-2.0 m tall; racemes conical, sub-lax; bracts deltoid-acuminate, 5-12 x 2-3 mm, 5-7-nerved. Flowers brownish red to darkish pink with greyish powdery bloom, 24-33 mm long, subclavate above basal constriction; outer segments free for 5-7 mm, inner segments adnate to outer; pedicels 8-12 mm long. Anthers exserted up to 2 mm. Ovary 6.0-8.0 x 1.5-3.0 mm, green; style exserted 1-4 mm. Fruit not seen.
            textZh: Aloe pruinosa Reynolds 的 SANBI 物种条目记录了形态特征。
