            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: This plant is smaller than A. dyeri but larger than other members of the section. A. pruinosa is more readily short-stemmed than that species, and there are differences in leaf markings and in the size and colour of the flowers. A. pruinosa differs from all other southern African Aloe species in having a copious dull grey bloom on the flowers, pedicels and peduncle. Although similar in many respects to A. greenii, it is distinguishable from that species in the field in all seasons; the differences are given under A. greenii.
