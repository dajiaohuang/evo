        usage:
          title: Columnea allenii C.V.Morton, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Epiphytic herbs; stems woody at the base, pendent, 1-2 mm in diam., reddish, strigose. Leaves of a pair equal, oblong elliptic, 1.5-2.2 cm long and 8-10 mm wide, the apex short acuminate, rounded at the base, entire, green above, glabrous, beneath green or sometimes reddish, sparsely strigose, hairs reddish, 4-9 celled, more numerous on the veins, redder near the margins, also with 2-3 celled transparent hairs; petioles 1-2 mm long. Flowers solitary; bracts to 1 mm long, linear, strigose; pedicels 10-17 mm long, reddish strigose; calyx lobes ovate lanceolate, 2.0-2.9 cm long, long acuminate, subentire, green tinged with red, adpressed pilose; corollas scarlet with yellow streaks at sinuses of the anterior lobes and sometimes on the lateral lobes, funnelform but strongly zygomorphic, 6.2-7.1 cm long, ca. 4 mm in diam. above the base, becoming 15 mm at the throat, the lobes strongly unequal, the posterior pair connate, truncate at the apex, 2.0-2.5 cm long, the lobed portion of the corolla 3.7-4.5 cm long, the anterior lobe 2.3-2.6 cm long, reflexed, the corolla externally densely reddish pilose; stamens exserted, the filaments yellow, glabrous; ovary pilose, the style slightly glandular pilose, yellow, the stigma bibbed. Fruits not seen. Chromo- somes 2n = 18 (Fussell, 1958).
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 6113
