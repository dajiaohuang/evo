        claims:
          - text: Like P. micranthum but to 6 cm, bracts glandular-pubescent.
            sourceIds:
              - sanbi_14441_0
            locator: "SANBI/WFO archive Morphology row 5921; source 14441.0; publication: Manning, JC; Goldblatt, P. 2012. Scrophulariaceae: Phyllopodium Benth. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 750 - 752. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Miss Esterhuysen collected it together with P. caespitosum, under the same number, and segregated them only later. The two species differ in habit, as well as in indumentum, and P. viscidissimum dries darker than P. caespitosum. The relationship of the species probably lies with P. micranthum from which it can be distinguished by its stems with longer glandular hairs extending to the base of the plant (not the lowermost 2-3 internodes with short (0.1 mm) eglandular hairs only), and by the glandular-pubescent bracts, which are possibly mostly narrower than those of P. micranthum.
            textZh: SANBI 条目提供了该种的鉴别特征。
