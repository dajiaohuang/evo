        claims:
          - text: Herba ramosa fortasse breviter perennis sed anno primo florens, usque ad c. 1 m alta, glabra vel pilis parcis gracilibus glandulosis praecipue in caulibus pedicellis calycis lobis praedita. Caules quadrangulares, foliati. Folia opposita, patentia; lamina plerumque 20-70 x 10-35 mm, late lanceolata vel ovata, marginibus grosse vel incise dentata, apice acuto, basi cuneata in petiolum 5-20 mm longum angustata, et lamina et petiolo sursum decrescentibus. Racemi terminales, plerumque paniculati, multiflori, demum flagelliformes. Bracteae ad 10 mm longae sed saepe minores, lineares. Pedicelli 12-25 mm longi, filiformes. Calycis lobi lineares vel anguste lanceolati, 3 postici anthesi c.2-2.5 x 0.5-0.75 mm, 2 antici paulo breviores latioresque, omnes sub fructu accrescentes. Corollae tubus c. 2-3 mm longus, in calcar (5-)6-9 mm productus, bullis in hypochilo ad orem calcaris 2 glanduloso-pubescentibus et pallide viridi-luteis extra invaginatis; labium posticum c.8-11 mm longum, lobis lateralibus oblongis, c. 3-3.5 x 2.25-3 mm, lobo mediano c. 3.5-4.5 x 3-4 mm in lobulis 2 oblongis 3-4 x 1.75-2.5 mm; labium anticum c.8-11 x 6-9 mm, paulo emarginatum, undulatum, medio in palatum convexum longitudinaliter sulcatum dense papillosum elevatum, papillis in fundum hypochili et in calcar extensis; corolla omnis alba, venis laete griseo-caeruleis, palato interdum pallide luteo-suffuso. Stamina erecta; filamenta antica 2.75-3 mm longa, basi circum postica filamentis 1 mm longis torta; antherae c. 0.75-1 mm longae. Ovarium c.1.5 x 1.25 mm, stylo c.1 mm longo, stigmate capitato. Capsulae 3-10 x 3-7 mm, angulo apicali c. 30°; semina 2 x 0.75 mm, elliptica, testa verrucosa, alis marginalibus semini aequilatis.
