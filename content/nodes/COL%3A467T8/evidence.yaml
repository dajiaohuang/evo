          - text: It is a bushy herb, characterized by its long-spurred white flowers borne in delicate panicled racemes that become flagelliform as the fruits begin to develop. The leaves of N. silvatica resemble those of N. melissifolia, but the inflorescences of N. melissifolia are more congested than those of N. silvatica, the flowers tend to be clustered and the tip of each inflorescence is subumbellate, altogether different in appearance from the delicate flagelliform racemes of N. silvatica. The flowers of N. melissifolia are probably always smaller than those of N. silvatica, and this is perhaps reflected in the mostly shorter spur, c.4-5.5 mm long, not mostly 6-9 mm, and the capsules are usually larger, mostly 10-17 mm long, not 3-10 mm.
