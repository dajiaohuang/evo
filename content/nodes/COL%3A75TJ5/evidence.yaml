        usage:
          title: Paullinia panamensis Croat, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Lianas; stems deeply 3-6-sulcate or 3-sulcate with the costa weakly sulcate, conspicuously long-hispid, the trichomes reddish brown, to 6 cm long; texture of the surface smooth; wood simple. Leaves pinnately 7-foliolate, 22-45 cm long, sparsely but conspicuously hirsute on all surfaces and margins, viscidulous; peti- oles without wings, 3-16 cm long, prominently sulcate above; both lower and up- per rachis broadly winged, the wings 6-10 mm wide; leaflets oblong-lanceolate to oblong-elliptic or oblong-oblanceolate, usually narrowly acuminate, sometimes acute at the apex, attenuate at the base on the terminal leaflet, inequilateral and acute to narrowly rounded on lateral leaflets at the base, 5-18 cm long, 1.5-6.7 cm wide, crenate mostly above the middle, the reticulate venation prominulous on both surfaces; stipules lanceolate-oblong, 14-20 mm long, several-nerved, glabrous except for the hispid margins. Inflorescences axillary, apparently soli- tary, short; rachis sparsely hispid; bracteoles narrowly deltoid, glabrous, thickened greatly at the base, especially medially; pedicels to 2.5 mm long, glabrous, ar- ticulate about midway. Flowers white; sepals rounded, glabrous; petals obovate, glabrous, glandular within, the anterior scales with crests emarginate, the deflexed appendage ciliate; disc glands 2, semicircular, glabrous; stamens with the fila- ments glabrous; ovary glandular. Fruit not known.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 12665
