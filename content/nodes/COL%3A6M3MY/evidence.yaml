        claims:
          - text: Cormous herb, up to 300 mm tall. Basal leaves 3 or 4, linear, erect. Spike lax, 4-6-flowered. Flowers bright to dark pink outside, inside magenta-pink.
            textZh: Hesperantha schlechteri (Baker) R.C.Foster 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_11118_0
            locator: "SANBI/WFO archive Morphology row 2307; source identifier 11118.0; cited publication: Herman, PPJ; Retief, E. 1997. Plants of the northern provinces of South Africa: Keys and diagnostic characters. Strelitzia 6: 1 - 681. National Botanical Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: One of several pink-flowered species of the genus, Hesperantha schlechteri is recognised by the relatively short perianth tube, 5-7(-10) mm long, anthers mostly 4.0-4.5 mm long, and typically 5 leaves, the lower 3 with extended blades 2-4 mm wide. The flexuose stem has a pronounced loop above the sheaths of the upper leaves. Plants from Mariepskop with four or five leaves, the blades only about 1 mm wide, may not be correctly placed in H. schlechteri. Plants from near Mac-Mac Falls are also puzzling, the plants having blades of the lower leaves 4-6 mm wide, unusually broad for any Hesperantha species in Mpumalanga. The flowers are quite small, with tepals ± 7 mm long and a tube ± 5 mm long. They may be depauperate H. schlechteri or an undescribed species. A few other collections, including some from Dullstroom, also represent this variant.
            textZh: SANBI 条目提供了 Hesperantha schlechteri (Baker) R.C.Foster 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 94849; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
