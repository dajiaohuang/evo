        claims:
          - text: Shrublet with flaccid, decumbent, terete branches, up to 450 mm tall. Leaves oblanceolate to obovate, sessile, with pale horny margin. Inflorescence a round-topped thyrse. Corolla tube elongate-ampullaceous. Flowers yellow to orange.
