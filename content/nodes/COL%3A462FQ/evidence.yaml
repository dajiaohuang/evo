        usage:
          title: Nectandra laurel Klotzsch ex Nees, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Tree to 16 m. high; branchlets thick, densely ferruginous-tomentose becoming grayish, somewhat angled. Leaves alternate, occasionally near the tips of the branchlets becoming opposite or subopposite; petioles 1.5 (-2.5) cm. long; blades usually ferruginous-tomentose throughout, quickly becoming glabrous above ex- cept for venation, greenish brown when- dried, coriaceous, elliptic or ovate, (6-) 10-15 (-35) cm. long and 3-6 (-15) cm. broad, the base obtuse usually, the apex obscurely or sharply acuminate, the acumen often to 2.5 cm. long, penninerved, ferruginous-pubescent throughout, impressed above, elevated beneath, the nerves 7-9 (-14) pairs, impressed above, elevated beneath, diverging from the costa at an angle of 35-450, the transverse venation impressed above, prominent beneath. Inflorescence axillary or often subterminal, paniculate, 8 (-20) cm. long, densely ferruginous-tomentose, few- to many-flowered, the peduncles 5-7 cm. long. Flowers to 15 mm. in diameter, fragrant, the pedicels to 2 mm. long, the perianth white, pubescent, the lobes fleshy, pubescent, (5-) 7 mm. long; stamens of ser. I & II 1.7 mm. long, the anthers broadly ovate, obtuse, the connective tissue papillose, the filaments short and comparatively slender, those of ser. III to 1.7 -mm. long, the filaments conspicuously biglandular; staminodia 0.3 mm. long; gynaecium glabrous, 2.3 mm. long, the ovary ovoid or obovoid, slightly larger than the style, the stigma obtuse, discoid. Fruit ellipsoid, smooth, to 12 mm. long and 8 mm. in diameter; the cupule hemispherical, about I4 the length of the entire fruit.
          originalLanguage: en
          sourceField: general
