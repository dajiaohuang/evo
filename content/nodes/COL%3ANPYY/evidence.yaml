    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants perennial, rising from shortly ovoid tubers, 15 x 10 mm, roots orange-brown, spreading downwards, occasionally rebranched 35-70 x1.5-3 mm, a number of fine adventitious roots situated along the whole length of the roots. Leaves up to 5, 50-180 x 6-8 mm x 4 mm thick, erect to suberect spreading, rising from a rosette, very bright shiny green, linear-lanceolate acute from a broad base ca. 8 mm, soon becoming strongly canaliculate on adaxial surface, margins hyaline with a row of erect to suberect spreading fine hairs in the basal two thirds, 0.5-0.6 mm long, margins curling upwards and inwards forming an open tube in the apical third, epidermal surface finely granulate, outer half to one third withering during non-growing winter season. Peduncle plus inflorescences up to 220 x 1.2 mm with up to 8 bracts, 3 very prominent, lower 2 ca.20 mm apart, upper becoming closer, 5-7 mm long and 1.5 mm at base, lanceolate to ovate acuminate; inflorescence dense, with 20 flowers, up to 80 mm, bracts 5 mm long, acuminate, from a 3 mm triangular base, bracts projecting well beyond buds giving a furry appearance to the unopened inflorescence. Flowers angled slightly upwards, all tepals recurved, bright luminous yellow with a green mid-vein, outer tepals elliptic, subacute, 6 x 1.8 mm, inner ovate with margins slightly plicate, obtuse, 6 x 3.2 mm. Filaments yellowish, 5-6 mm long, in a tight bunch around style and all projecting forwards; all anthers 0.6 mm long, outers with a carpet of spreading hairs in upper half, inners with spreading hairs almost the whole length of filaments, hairs narrowly linear ca. 1 mm long. Ovary 1.8 mm in diameter, bright green, ovoid from a flat base with defined sinuses; style 6 mm long, yellowish green with a slight downward curvature in the apical third; stigma with fine papillae arranged stellately. Capsule and seeds not seen.
