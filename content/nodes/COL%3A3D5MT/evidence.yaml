    facets:
      morphology:
        status: partially-supported
        claims:
          - text: A vigorous glabrous shrub with erect stems and branches, ± closely leafy in the upper parts, becoming nude below. Leaves erect-erecto-patent, oblanceolate-obovate-spathulate, 6-20 mm long, 3-8 mm wide, flat and somewhat coriaceous, with 3-10 small teeth along the margin towards the apex, some seldom completely entire, with a distinct midrib and sometimes faint lateral veins. Peduncles terminal, 1-5 together, erect, stout, (0.5-)1-9 cm long, 0.6-1.2 mm wide, thickened to 2-3 mm wide below the involucre, striate, with a small tuft of cobwebby tomentum at the base. Involucre campanulate with truncate base, widening above to (8-)10-17 mm in diam., distinctly many-veined. Involucral bracts 10-13, subuniseriate, connate to about 2/3; the free lobes broadly ovate- deltoid, widest immediately above the base, partly overlapping, 2.5-5 mm long, 2.5-4.5 mm wide, obtuse, with puberulous margins and tips. Receptacle alveolate. Ray-florets 10-15, yellow. Tube c. 2.5 mm long, narrowly cylindrical. Lamina lorate-narrowly oblanceolate or oblanceolate, 12-16 mm long, 3-5 mm wide, 4-7-veined. Style terete with swollen base; style branches c. 1 mm long. Disc-florets numerous. Corolla 4.5-5 mm long. Tube 1.2-1.8 mm long, cylindrical. Limb narrowly campanulate, 3-3.5 mm long; lobes (narrowly) ovate, 1-1.4 mm long, 0.5-0.8 mm wide, apically minutely papillate on the outside, tips subcucullate. Anthers 2-2.5 mm long incl. the ovate acute appendage. Style terete with swollen base; style branches 0.7-1 mm long. Pappus bristles few, c. 2 mm long, erect, white. Achenes (immature) narrowly oblong, 3-4 mm long, c. 1 mm wide, glabrous, with indistinct ribs and a faint constriction below the top.
