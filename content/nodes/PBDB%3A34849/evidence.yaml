      claimType: fossil-range
      statement: The historical Acanthodii navigation grade begins at the approximately 439 Ma Fanjingshania dermoskeletal sample, which the cited analysis places on the chondrichthyan stem; the 252 Ma younger edge is a rounded legacy composite, not evidence that Acanthodii is monophyletic or that Fanjingshania is a direct ancestor or global first occurrence.
      confidence: medium
      confidenceRationale: The primary description fixes a late Aeronian horizon and a large referred sample, but the material is disarticulated and the acanthodian-grade grouping is historical. Medium confidence is therefore limited to the display anchor and its explicit interpretive boundary.
      referenceLinks:
        - referenceId: andreev-2022-fanjingshania
          relation: supports
          pages: 969–974, especially 970–972
          figure: Figures 1–3; Extended Data Figures 1 and 4
          quoteLocator: "Systematic palaeontology: holotype, referred material, locality and horizon; phylogenetic analysis and Discussion"
  claim-rationales.zh:
    - 一手描述限定了晚埃隆期层位和大型转归样本，但材料彼此分离，棘鱼等级也是历史分组；中等置信度仅适用于显示锚点及其明确的解释边界。
  claim-statements.zh:
    - 历史性的棘鱼类导航等级从约 4.39 亿年前 Fanjingshania 皮骨骼样本开始；所引分析把它置于软骨鱼干群。2.52 亿年前的年轻端是取整后的历史综合边界，不能据此认定棘鱼类为单系，也不能把 Fanjingshania 写成直系祖先或全球首现。
