          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: A rather large, sparingly hairy to glabrate, assurgent, succulent herb; stem spotted when growing, up to 10 mm. thick and ascending to 20 or 30 cm., rooting from the nodes of the decumbent basal part; leaves alternate, peltate within 1 cm. of the margin, elliptic-ovate, 6-11 cm. wide X 10-18 cm. long, apex abruptly short-acuminate, base rounded or truncately subcordate, rather faintly 7- to 11- plinerved below, or large leaves with as many more branches above the middle, drying dull and opaque, somewhat pubescent or glabrate; petiole 6-15 cm. long, fleshy, pubescent or glabrate; spikes terminal, solitary or paired, up to 25 cm. long; peduncle up to 5 cm. long, pubescent or glabrate; bracts round-peltate; fruit ellipsoidal, rostrate, stigma at the base of the curved beak.
