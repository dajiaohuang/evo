        usage:
          title: Chromolaena odorata (L.) R.M.King & H.Rob., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Woody herbs or reclining shrubs to 3 m tall, much branched; stems reddish- brown, terete, finely striate, glabrous to hirsute. Leaves opposite; blades deltoid to rhombic-ovate, to 9 cm long and 5 cm wide, the base cuneate to subtruncate, the margins entire to serrate, the apex narrowly acuminate, the upper surface glabrous, rarely pubescent, the lower surface with numerous short-stalked to sessile red glands, the venation prominently trinervate from near the base; petioles to 2 cm long. Inflorescence a broad panicle to 8 cm wide and 4 cm high with corymbose branches, the ultimate branches usually pubescent. Heads ca. 1 cm high with ca. 25 florets; involucral bracts ca. 15, glabrous to sparsely pubescent, imbricate, with 3-4 costae, the outer bracts oblong with rounded to truncate apices, the inner bracts narrow, short-acute; receptacle naked; corolla white, lavender, pink or light bluish, ca. 6 mm long, tubular. Achenes ca. 4 mm long, prismatic, 4-5-ribbed, ribs with short bristles; pappus of ca. 30 scabrous bristles, ca. 6 mm long, the apical cells acute.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 1616
