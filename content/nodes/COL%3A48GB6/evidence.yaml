        claims:
          - text: "Perennial herb, 0.15-0.75 m high. Stems several, arising from a woody rootstock. Leaves sessile; blade linear or narrowly obovate, 5-40 x 1-24 mm, always with fascicles of younger leaves in axils, apex subacute, base cuneate, margins entire. Flowers: inflorescence elongate with 5-20 verticils ± evenly spaced, 5-15 mm apart, verticils usually 6-flowered; calyx 2.5 mm long at flowering, enlarging to 5 mm long, lower pair of teeth fused into a lip ending in a small pair of upcurved, spinescent teeth, lateral teeth suppressed and replaced by a wide shoulderlike sinus, puberulous, gland-dotted and often with white globular glands; corolla < 9 mm long, upper lip < 5 mm long, lobes of upper lip denticulate or entire, white; Oct.-May."
            sourceIds:
              - sanbi_16179_0
            locator: "SANBI/WFO archive Morphology row 72239; source 16179.0; publication: Meyer, J; Retief, E; Meyer, NL. 2017. Lamiaceae. In: E Retief & NL Meyer (eds), Plants of the Free State: Inventory and identification guide, Strelitzia 38: 596 - 613. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
