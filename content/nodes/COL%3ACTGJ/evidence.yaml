    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Like A. coranica but up to 40 cm tall, pedicels elongating and stiffening when fruiting, and fruit spindle-shaped and 6-ribbed, with papery walls (vs. subglobose, smooth and membranous-walled).
            textZh: Ammocharis longifolia (L.) Herb. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13845_0
            locator: "SANBI/WFO archive Morphology row 8765; source identifier 13845.0; cited publication: Snijman, DA. 2012. Amaryllidaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 53 - 62. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: The flower-bud on opening is regular, except for one stamen which from the first is in a declinate position. In older flowers the stamens are definitely declinate and then tend to straighten out, the flower finally becoming more or less regular. The flowers open successively, and the colour varies a good deal in different specimens. The perianth-lobes in freshly opened flowers are white on the inner surface and white to pink on the outer surface, with conspicuous reddish-pink keels. As the flower becomes older the lobes turn a deep pink. During anthesis the pedicels are 5-11 cm long, but as the fruits mature the pedicels become rigid and elongate, reaching a final length of 8-15 cm. The young fruits are not unlike those of a Brunsvigia, but on maturing do not dehisce like a capsule. The mature fruits are subspherical to fusiform in shape according to the number of seeds developed. They often rupture before drying with the withered remains of the perianth still attached. As a rule a single vertical split appears first, but this is soon followed by others. The brittle papery tissue between the ribs tends to break down, leaving the ribs still attached to the pedicel. The heavy seeds are usually shed as the fruit dries, though some may fall soon after the living capsule-wall has begun to split. Seed-dispersal, however, takes place mainly in the following way. The mature infructescences become detached from the bulb and are then blown or tumbled about by the wind. In the course of this 'tumbling' the seeds more readily break through the papery walls and fall to the ground. Mrs. F. Isaac of Cape Town and Mr. H. Herre of Stellenbosch have both kindly supplied evidence that the infructescence is actually tumbled about by the wind. It has been observed also by Mr. John Martley of Banhoek, who `found two ripe inflorescences blowing about the veld on the flats of Alderman's Farm, Firgrove, both containing ripe seed '. The seeds are large and fleshy and often germinate in the capsule. A drawing of a capsule which had ripened in October, and which had stood all winter, was made by Richard Salisbury on 26 April 1814, and showed the radicle of a germinating seed pushing through the papery tissue between the ribs (Rendle, loc. cit.).
