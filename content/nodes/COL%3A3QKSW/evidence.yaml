    facets:
      morphology:
        status: partially-supported
        claims:
          - text: "Perennial herb, woody caudex up to c. 15 mm diam. at crown, stems many from the crown, c. 70-200 mm long, prostrate, profusely branched, glandular-pubescent, hairs up to 0.6-1.3 mm long, scattered glistening glands as well, closely leafy. Leaves opposite, pseudofasciculate, largest c. 5-22 x 5-15 mm, broadly ovate in outline with a short petiolar part, bi- to tripinnatisect, lobes linear, acute, thinly glandular-pubescent below, hairs c. 0.2-1 mm long, few glistening glands as well, crowded glistening glands above. Flowers solitary in the axils of the uppermost leaves. Pedicels up to c. 3-5 mm long. Calyx tube 0.2 mm long, lobes c. 4.5-6 x 2.5-3 mm, accrescent in fruit and enfolding the capsule, spathulate in outline, the expanded upper part deeply dissected, glandular hairs up to c. 0.5-0.8 mm long, glistening glands as well, as in leaves. Corolla tube 5-6 x 2.5-3 mm, cylindric, expanded in throat; mouth dorsoventrally compressed, limb oblique, c. 11 mm across lateral lobes, posticous lobes 3.8-4 x 3-3.5 mm, anticous lip porrect, anticous lobe 4-4.8 x 3.2-4 mm, all lobes suborbicular, glandular-puberulous outside, hairs c. 0.25 mm long, glistening glands as well, broad transverse band of clavate hairs in throat extending onto base of anticous lip, lobes dull terracotta, throat and base of anticous lip yellow. Stamens: posticous filaments c. 2 mm long, anthers 0.8 mm, anticous filaments c. 0.5 mm long, anthers 0.5-0.6 mm long, filaments glabrous. Stigma c. 0.2-0.4 mm long, included. Style 2.75-3 mm long. Ovary c. 1.5 x 1.5 mm. Capsules c. 3-5 x 2-3 mm, glistening glands all over. Seeds 0.6-0.7 x 0.4-0.5 mm."
            sourceIds:
