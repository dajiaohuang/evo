          - text: Jamesbrittenia multisecta is a most distinctive plant, with finely cut leaves, the segments very narrow and acute, the calyx lobes similarly dissected. In herbaria, it has been confused with J. aurantiaca, from which it is distinguished by its constantly opposite and more finely dissected leaves, dissected calyx lobes, flowers only in the upper leaf-axils, and much shorter pedicels.
