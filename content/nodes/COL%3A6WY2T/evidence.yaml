        metadataVariant: 0
        usage:
          title: Rudgea cornifolia (Kunth) Standl., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Trees to 7 m tall, the branchlets slender, smooth, glabrous, nodose, the nodes well spaced. Leaves oblong to lanceolate, occasionally obovate, 8-14 cm long, to 7 cm wide, obtuse or rounded at the apex, occasionally subacute, acuminate, the acumen to 1.7 cm long, to 0.3 cm wide, obtuse to cuneate at the base, oc- casionally vaguely auriculate, the costa slender, prominulous above and beneath, occasionally with pores ("domatia") in the vein axils, the lateral veins 7-8, at first strict, then arcuate, joining adjacent veins to form an undulate submarginal vein to 1.5 cm from the margin, chartaceous, concolorous, glabrous; petioles absent or to 0.7 cm long, glabrous to minutely pubescent; stipules connate, com- pressed rectangular, to 3 mm long, truncate, subcoriaceous, glabrous, the margin thickened with ca. 6 triangular subulate lobes, to 0.75 mm long. Inflorescences terminal, solitary, glabrous, paniculate; peduncles 3.5-4.0 cm long, usually longer than the remainder of the inflorescence, either with 4 upright branches umbel- lately disposed and once ramose or the rachis with 2 pairs of opposite branches, to 2 cm long, dichotomous, each branchlet with a single few flowered cymule. Flowers glabrous; hypanthium oblong or rotund, the calycine cup cylindrical, ca. 2 mm long, carnose, the teeth as evanescent points; corolla white, to 7 mm long, the tube basally attenuate, the lobes 5, cucullate, longer than the tube; anthers 5, narrowly oblong, ca. 3 mm long, obtuse, dorsifixed, the filaments short; stigmas 2, capitate, the style narrowly cylindrical, thicker above the middle, the ovary wall and septum thick. Fruits white, rotund or compressed rotund, to 5.5 mm long, to 6.5 mm wide, smooth, glabrous, minutely farinose often vaguely 2-lobed, the calycine scar annular, ca. 1 mm in diam.
          originalLanguage: en
          sourceField: general
