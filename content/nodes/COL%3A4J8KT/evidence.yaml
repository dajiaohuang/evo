        usage:
          title: Piscidia piscipula (L.) Sarg., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Tree, large. Leaves with 6-10 leaflets, obovate-oblong, often inequilateral, up to 9.5 cm. long, up to 5.5 cm. wide, tapering obtusely but shortly acuminate and mucronate at the tip, thinly coriaceous, apparently glabrous above and below, the costa plane above, the main veins 8-11; petioles 1.5-2 cm. long, puberulent; petio- lules up to 0.6 cm. long, contorted, minutely puberulent; rachises 4-7 cm. long racemes axillary, up to 13 cm. long, often very nodose above, the branches often several at the base of the rachis, 2-15 cm. long; bracteoles reniform, up to 0.9 cm. long, densely puberulent on the outside. Flowers with the calyx campanulate, about 6 mm. long, puberulent, persistent, the teeth short, obtuse to acute, the uppermost usually united; vexillum orbicular, about 12 mm. long, puberulent on the outside; wing petals semiorbicular, about 13 mm. long, glabrous, irregularly undulate on the upper margin, the auricles rounded, about 1.1 mm. long; carinal petals subreni- form, about 10.5 mm. long, pubescent; stamens monadelphous, the sheath glabrous, carnose, almost 3 times the length of the filaments, the odd filament free for about 2 mm. at the base; ovary scarcely stipitate, curved, linear, about 1 mm. wide, some- what flat, densely puberulent, the style thickly subulate, puberulent along 2/3 of its length, attenuate at the tip. Fruits pedicellate, the pedicel about 1 cm. long, very slender and puberulent, the body stipitate for 1-1.5 cm. terete, the wings 4, longi- tudinal, each wing rectangular, 3-7 cm. long, about 4 cm. wide, truncate at the apex and at the base, thinly membranous, the veins crowded, pinnate, glabrous.
