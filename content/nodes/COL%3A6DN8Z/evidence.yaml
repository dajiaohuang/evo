        metadataVariant: 0
        usage:
          title: Drymonia coriacea (Oerst. ex Hanst.) Wiehler, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Epiphytic shrubs or suffrutescent herbs; stem lax, stout, to 2.5 m tall, green or reddish, strigillose toward the apex, unbranched or flowering branches ascend- ing from the nodes of the prostrate stems. Leaves nearly equal to unequal in a pair, elliptic, lanceolate or oblanceolate, sometimes falcate, 8-25 cm long, 4-10 cm wide, coriaceous, the apex acuminate, the base cuneate, entire, reddish and glabrous on both sides or sparsely strigillose below along the prominent veins; petiole 1-5 cm long, reddish purple. Inflorescences appearing congested in the upper leaf axils, few flowered; peduncles lacking; bracts nearly enclosing the flowers, ovate, numerous, persistent, to 1.5 cm long, red purple, strigillose; pedicels ca. 1 cm long, red, strigose. Flowters not conspicuous; calyx oblique, the lobes similar to the bracts, unequal, the posterior lobe smaller and surrounding the gibbous corolla base, ovate, ca. 1 cm long, the apex rounded, entire to den- tate, reddish or rarely green, strigillose; corolla pale orange to purplish, the tube gibbous at the base, narrowed toward the middle then strongly ventricose or pouched on the lower side before contracting to a narrow throat, 1.7-2.2 cm long, ca. 4 mm wide at the base, ca. 1 cm deep at the pouch, ca. 3 mm wide at the throat, glabrous at the base, pilose above, inside glandular, the lobes of the limb erect, semiorbiculate, ca. 2 mm long, 3 mm wide; stamens included, the filaments adnate to corolla tube for ca. 1 cm above the base, the anthers oblong, to 4 mm long, 2 mm wide; disc gland solitary; ovary puberulent, the style gla- brous. Capsule globose, surrounded by the persistent bracts and calyx, dehiscing by 2 valves; seeds not seen.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 6262
