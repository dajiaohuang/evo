        usage:
          title: Coccoloba uvifera (L.) L., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Tree of strand areas, 2-15 m. tall; branches stout, papillose to pilose; ocreae rigid, coriaceous at the base, membranaceous at the apex, 3-8 mm. long, papillose to pilose; leaves of normal shoots with stout petioles, 7-10 mm. long, puberulent to pilose, the blades orbicular to reniform, 10 X 10, 11 X 14, 13 X 18, 20 X 27 cm. long and broad, thick and fleshy when fresh, coriaceous when dry, glabrous and minutely punctate on both surfaces, the apex rounded, truncate or emarginate, the base rounded to broadly cordate, one lobe extending around the petiole, the primary veins 3-5 pairs usually straight, bifurcate and weakly anastomosing near the margin, commonly barbate in the axils of the basal veins, the secondary venation minutely reticulate or obscure; inflorescence stout, 15-30 cm. long, racemose, occasionally branched at the base, the rachis puberulent, staminate flowers in clusters of 1-7, the pistillate flowers solitary at each locus, the bracts ovate, 1-1.5 mm. long, 2 mm. broad, puberulent, the ocreolae membranaceous, 1 mm. long, puberulent, the flowering pedicels 1-2 mm. long, the hypanthium 2-3 mm. long, the perianth lobes 4 mm. long, 3-4 mm. wide, the fertile stamens to 4 mm. long; fruiting pedicels 3-4 mm. long, fruit obpyriform, 1.2-2 cm. long, 8-10 mm. in diameter, narrowed at the base, rounded-truncate at the apex, the perianth rose-purple when mature; achene black.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 10919
