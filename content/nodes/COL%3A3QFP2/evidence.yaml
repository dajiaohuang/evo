            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Ixia macrocarpa, the second acaulescent species known in Ixia, has long-tubed, pale yellow flowers with dark markings at the base of the tepals. Despite the shared acaulescent habit, it may not be closely allied to I. acaulis, the other acaulescent species of the genus, restricted to rocky outcrops of limestone and marble in the Knersvlakte southwest of Loeriesfontein. Ixia macrocarpa differs in having broader, falcate leaves arranged in a tight fan, filaments united in a column enclosing the style, and diverging anthers. The pale yellow flowers have the tepals marked dark red-brown at the bases. Ixia acaulis has narrow, spreading to prostrate leaves, and uniformly yellow flowers with the style dividing opposite the bases of free filaments, and parallel anthers. Seeds of I. macrocarpa are smooth and unusually large, ± 3 mm diam.
