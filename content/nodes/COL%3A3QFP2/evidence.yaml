    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants acaulescent, leaves and flowers reaching 30-50 mm above ground, often in small clumps. Corm broadly conic, 6-8 mm diam.; tunics of pale brown, fine, netted fibres. Stem underground, sheathed by membranous cataphylls reaching ground level. Leaves 6 or 7, falcate-flabellate, basal, 5-15 x (3-)4-6 mm, obtuse, leathery, glaucous, without evident main vein, margins cartilaginous. Spike contracted, few-flowered, hidden in leaf bases; bracts membranous, translucent, flushed green distally, outer linear-oblong, ± 30 mm long, median vein visible only near apex, acute, inner slightly shorter with 2 veins visible distally, acute. Flowers salver-shaped, pale yellow with red-brown blotch at bases of tepals, presence of scent unknown; perianth tube filiform, 35-45 mm long, cylindric, occluded by walls closely clasping style; tepals spreading, subequal, elliptic, slightly spooned, 12-15 x 4-5 mm. Filaments inserted at mouth of tube, united in a column ± 4 mm long; anthers diverging, curving inward distally, ± 4 mm long, yellow. Ovary subterranean, flask-shaped, 6 mm long. Style dividing just below apex of filament column, ± 2.5 mm long, extending between anthers. Capsules largely subterranean, concealed in leaf sheaths, oblong-ellipsoid, 20 x 5 mm, sterile in upper third, splitting at ground level to release seeds. Seeds globose, smooth, ± 3 mm diam., reddish brown, raphal vascular trace excluded.
            textZh: Ixia macrocarpa Goldblatt & J.C.Manning 的 SANBI 物种条目记录了形态特征。
