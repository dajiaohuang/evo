          title: Erythrina lanceolata Standl., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrub or small tree, leafy when blooming; often armed. Leaves with the leaflets ovate, apically acute to long acuminate, basally rounded or obtuse, char- taceous, soon glabrescent above, beneath becoming glabrous or remaining spar- ingly puberulent with sparse, weak hairs, and with a minute waxy reticulum visible under a lens, unarmed, the petioles about as long as the terminal leaflet. Inflorescence with the bracts linear lanceolate, 1-1.3 mm long, ca. 0.3 mm wide, the bracteoles slightly smaller; pedicels 0.3-1 cm long, thick and longer in fruit. Flowers with the calyx thin, campanulate, 7.5-17 mm long, slightly shorter on the lower side, 5.5-8 mm wide at the mouth, the apex slightly bilobed, sparsely pubescent with appressed hairs, soon glabrescent; standard scarlet, narrow, ob- lanceolate, 4-8 cm long, 1-2 cm wide, rounded or retuse apically, the wings mostly rounded, not hastate, the keel petals 5-12 mm long, about equalling the wings; stamens 3.6-6.1 cm long, free for 1-2.4 cm; pistil 3.2-5.3 cm long, the stipe and ovary pubescent. Legume linear, terete, compressed between the seeds, 15-32 cm long, the pubescence persistent at least between the seeds, the stipe mostly 4-8 cm long, the acumen 2-8 cm long; seeds scarlet, unmarked, 10-13 mm long.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 5063
