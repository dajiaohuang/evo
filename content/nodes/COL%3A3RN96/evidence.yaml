    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Bulbous geophyte, 10-45 cm. Leaf solitary, lanceolate, erect, with crisped margins. Flowers oblong to urn-shaped, pale blue and white with yellow tips, or yellowish green, with brown markings, anthers included; apical flowers on blue pedicels and usually sterile.
            textZh: Lachenalia mutabilis G.Lodd. ex Schult. & Schult.f. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_14509_0
            locator: "SANBI/WFO archive Morphology row 11980; source identifier 14509.0; cited publication: Duncan, GD. 2012. Hyacinthaceae: Lachenalia J.Jacq. ex Murray. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 106 - 111. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: In the arid northern parts of its range in the southern Richtersveld and Namaqualand, the flowers of L. mutabilis are predominantly spreading, with dull yellowish-green tepals and brownish-green or light blue rachis apices; towards the central and southern parts from Vanrhynsdorp southwards, the flowers tend to be slightly to strongly cernuous with brighter yellowish-green, light to bright yellow or light to deep mauve outer tepals. Forms in the Citrusdal and Clanwilliam areas have narrower, longer racemes with intense, electric blue rachis apices. A form with inflated scapes from Sewefontein in western Namaqualand and another from the Gifberg south of Vanrhynsdorp are exceptional in having fertile flowers with distinct pedicels 4 mm long and exserted stamens. A particularly attractive bright yellow form occurs just north of Calvinia and in the southern Tanqua Karoo.
            textZh: SANBI 条目提供了 Lachenalia mutabilis G.Lodd. ex Schult. & Schult.f. 的鉴别特征。
