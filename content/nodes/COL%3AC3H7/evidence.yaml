        claims:
          - text: Aloe challisii is known only from the upper vertical, quartzitic, sandstone cliffs (south- and southeast-facing) along the southern part of the Steenkampsberg. It grows at an altitude of 1700-1800 m, frequently covered in cloud. Plants occur scattered in rock crevices among moss and are difficult to reach.
