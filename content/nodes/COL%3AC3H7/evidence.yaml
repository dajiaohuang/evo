    facets:
      morphology:
        status: partially-supported
        claims:
          - text: "Perennial succulent with subterranean suckers, forming small, dense groups up to 200 mm in diameter. Roots fleshy. Branches pendent. Leaves soft, flaccid, rosulate, 4-7 per branch, linear-triangular, 100-200(-250) x 8-10(-20) mm curved and pendent from rock faces, very fleshy especially during rainy season and becoming almost subterete and channelled during dry season, smooth, slightly glaucous, bluish green, white-spotted at base; abaxial side convex, adaxial side flat or slightly channelled during rainy season, becoming channelled during dry season, striate, purplish green towards base; margin serrate, semi-translucent, white, cartilaginous, up to 1.5 mm broad at base, 0.2 mm broad elsewhere; teeth 1 x 0.4 mm, 1-3 mm apart; apex acute to subacute, armed with 5 or 6 teeth. Inflorescence simple, decumbent, 140-160 mm tall; peduncle 100 mm long, 5-6 mm broad at base, biconvex and slightly flattened at base, terete upwards, with 4 sterile bracts, 8-9 mm long and clasping up to 9 mm at base; raceme short, subcapitate, 40-45 mm long, up to 15-flowered; floral bracts scarious, deltoid, acuminate, 8-9 x 4 mm; pedicels 10-15 mm long, ascending, orange. Perianth subclavate, pendent, 25 mm long, bright orange-red; apices obtuse to subacute, yellow, green-tipped; tube cylindrical-trigonous; segments with a median green stripe, free to base, outer three concave, 25 x 3 mm, widening to 6 mm, linear-oblanceolate, canaliculate; inner three not as deeply canaliculate, widening to 6 mm; base 5 mm in diameter, widening to 7 mm up to halfway and then narrowing towards apex. Stamens yellowish, 20-22 mm long. Ovary oblong, 5-6 x 2 mm, grooved, brownish green; style 18 mm long. Capsule 16 x 5 mm. Seed oblong, angular, 3-4 x 1.5 mm, grey-black. Flowering time: mainly in spring (October)."
