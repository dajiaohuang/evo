  claims:
    - subjectId: taxon:fukangichthys
      claimType: taxonomy
      claimKind: scientific
      statement: Fukangichthys longidorsalis is a scanilepiform whose CT-informed analysis placed it on the polypterid stem; that placement is a sampled topology, not direct ancestry.
      confidence: medium
      confidenceRationale: "Fukangichthys longidorsalis: Named material and a published systematic or phylogenetic treatment support this bounded identification. Confidence remains medium because the profile does not turn a sampled placement into direct ancestry or universal consensus."
      referenceLinks:
        - referenceId: giles-2017-ray-fin-timescale
          relation: supports
          pages: 265–268
          figure: Figures 1–3
          quoteLocator: Main text; Methods; Supplementary Methods and character matrices
    - subjectId: taxon:fukangichthys
      claimType: biogeography
      claimKind: scientific
      statement: The named Fukangichthys specimens come from the Middle Triassic Kelamayi Formation of Xinjiang, China; this sample does not establish global distribution.
      confidence: medium
      confidenceRationale: "Fukangichthys longidorsalis: The primary study reports the named locality and horizon directly. Confidence is medium because one study sample cannot establish absence, endemism or a global geographic range."
      referenceLinks:
        - referenceId: giles-2017-ray-fin-timescale
          relation: supports
          pages: 265–268
          figure: Figures 1–3
          quoteLocator: Main text; Methods; Supplementary Methods and character matrices
    - subjectId: taxon:fukangichthys
      claimType: ecology
      claimKind: scientific
      statement: The cited studies focus on anatomy and topology and do not directly establish diet, habitat preference, swimming performance or trophic guild.
      confidence: medium
      confidenceRationale: "Fukangichthys longidorsalis: The evidence boundary is explicit: depositional or anatomical context is retained while unsupported behaviour and niche claims are withheld. Medium confidence applies to that bounded negative statement, not to a reconstructed ecology."
      referenceLinks:
        - referenceId: giles-2017-ray-fin-timescale
          relation: supports
          pages: 265–268
          figure: Figures 1–3
          quoteLocator: Main text; Methods; Supplementary Methods and character matrices
    - subjectId: taxon:fukangichthys
      claimType: morphology
      claimKind: scientific
      statement: CT and comparative anatomy of IVPP V4096.6 and IVPP V4096.13 supply endoskeletal and external characters used to revise scanilepiform placement.
      confidence: medium
      confidenceRationale: "Fukangichthys longidorsalis: The cited figures and descriptions directly document the named anatomical observations. Confidence is medium rather than universal because preservation and specimen sampling limit character completeness and variation."
      referenceLinks:
        - referenceId: giles-2017-ray-fin-timescale
          relation: supports
          pages: 265–268
          figure: Figures 1–3
          quoteLocator: Main text; Methods; Supplementary Methods and character matrices
