  claim-rationales.zh:
    - Fukangichthys longidorsalis：具名材料和已发表的系统或系统发育处理支持这一有限鉴定。置信度保持中等，因为画像不会把取样位置转化为直接祖先或普遍共识。
    - Fukangichthys longidorsalis：一手研究直接报告了具名地点与层位。置信度为中等，因为单一研究样本不能确定缺失、特有性或全球地理范围。
    - Fukangichthys longidorsalis：证据边界是明确的：保留沉积或解剖背景，同时不填补无依据的行为与生态位。中等置信度针对这一有限的否定性陈述，而非重建生态。
    - Fukangichthys longidorsalis：所引图件与描述直接记录了具名解剖观察。由于保存与标本取样限制了性状完整性和变异，置信度为中等而非普遍结论。
    - Fukangichthys longidorsalis：一手来源与具体定位符支持显示的样本区间。置信度为中等，因为该包络明确限定于标本或地点，而非全球首现或末现。
  claim-statements.zh:
    - Fukangichthys longidorsalis 是斯堪尼勒鱼类，CT 支持的分析将其置于多鳍鱼干群；该位置是取样拓扑而非直接祖先关系。
    - 具名 Fukangichthys 标本来自中国新疆中三叠世 Kelamayi 组；该样本不能确定全球分布。
    - 所引研究聚焦解剖与拓扑，不能直接确定食性、栖息地偏好、游泳性能或营养行会。
    - IVPP V4096.6 与 IVPP V4096.13 的 CT 和比较解剖提供了用于修订斯堪尼勒鱼类位置的内骨骼与外部性状。
    - 显示的 247–241.464 Ma 区间是中三叠世 Kelamayi 组包络，与依赖拓扑的辐鳍鱼冠群校准相互独立。
