          - text: A summer-flowering species from the KwaZulu-Natal Drakensberg with poorly developed corm, recognised by the soft-textured leaves without thickened margins, and the small, pale lilac-pink flowers with prominent, dark veining on the lower lateral tepals, these much shorter than the lower median tepal, and a very short perianth tube ± 5 mm long. The slender stolons are characteristic of several species in the series.
