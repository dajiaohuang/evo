    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants 300-600 mm high. Corm poorly developed, ± 5-8 mm diam., producing several long white stolons; tunics papery becoming finely fibrous. Stem erect, flexed outward above sheath of uppermost leaf, simple or 1-branched. Leaves 4 to 7, lower 3 basal, reaching to between middle of stem and base of spike, narrowly lanceolate, 4-8 mm wide, soft-textured, main vein lightly thickened and raised, margins hyaline, not thickened, cauline leaves progressively shorter. Spike flexed outward near base of spike, (3)6- to 12-flowered; bracts soft-textured, pale green flushed purple, 14-16 mm long, inner shorter, usually twisted to lie almost under outer, notched apically. Flowers pale lilac-pink flushed darker along tepal midline on reverse, lower 3 tepals cream-coloured to pale yellow below with dark purple veins, sinuses with dark purple spot, unscented; perianth tube obliquely funnel-shaped, ± 5 mm long; tepals oblanceolate-attenuate, dorsal largest, horizontal over stamens, 19-27 x 16-18 mm, upper laterals twisted upward, appressed to dorsal tepal below, obliquely spreading above, 17-19 x ± 13 mm, lower 3 tepals united for ± 1.5 mm, lower laterals 12.0-13.5 x ± 5 mm, narrowed below into claws ± 2 mm long, limbs abruptly expanded, channelled in lower 1/3, lower median 15-18 x 5.5-7.0 mm. Filaments ± 7 mm long, exserted ± 5 mm from tube; anthers ± 6 mm long, violet; pollen lilac. Style arching over the stamens, dividing between middle and upper 1/3 of anthers, branches ± 2 mm long. Capsules obovoid-ellipsoid, obtuse, 8-10 mm long. Seeds ovate, ± 6 x 3 mm, broadly and evenly winged, seed body not dark.
