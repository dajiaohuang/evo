    facets:
      morphology:
        status: partially-supported
        claims:
          - text: "Multistemmed shrublet up to 200 mm high, with perennial rootstock; stems ± erect or spreading; most parts strongly and pleasantly herb-scented when crushed; plants very floriferous. Leaves alternate, occasionally opposite towards base of stems, spreading, greyish green; lamina elliptic to obovate, (5-)8-15(-25) x (3-)6-10(-15) mm, tapering towards base, apex ± obtuse, margin coarsely serrate to irregularly lobed, both surfaces with glandular-hispid hairs, ±0.3 mm long, and with evenly distributed, glistening glands, veins impressed above, raised below; petiole 1/4-1/3 total leaf length. Flowers solitary in upper leaf axils, terminal flowers being the youngest. Pedicels usually 10-20 mm long. Calyx divided almost to base; tube 0.5-1.0 mm long; lobes 5.5-8.0 x 0.8-1.5 mm, oblong, apex subacute to rounded, densely covered with glandular hairs ±0.3 mm long and with scattered glistening glands. Corolla: tube 12-18 x 0.8-1.2 mm, measured midway between base and limb, but ± cylindrical, abruptly expanding and geniculate near apex, with multicellular glandular hairs, 0.7-1.0 mm long, and scattered glistening cells; well-bearded on outside of expanded part; mouth rounded, limb nearly regular, 16.5-25.0 mm across lateral lobes; lobes spreading, broadly ovate, 8.2-11.5 x 8-11 mm, base cuneate, apex distinctly retuse, rarely ± rounded, outside with few glandular hairs and scattered glistening glands, especially towards base, inside glabrous; lobes medium-textured, brilliant scarlet above, dull whitish below, without a thin-textured, pale margin; throat 3-4 mm diam., bright yellow, with transverse, V-shaped band of hairs on inside not extending onto base of anterior lip. Stamens: posticous filaments ±0.7 mm long, posticous anthers ±0.8 mm long; anticous filaments ±1.2 mm long, anticous anthers ±1.2 mm long; all filaments distally slightly bearded with clavate hairs; anthers included. Ovary 2-3 x 0.8-1.5 mm, glabrous; style 10-15 mm long; stigma ±1 mm long, appearing simple, though minutely bifid, included; nectary not distinct, apparently comprising sterile basal 1/4 portion of ovary, no nectar secretion observed. Capsules 4-7 x 2-3 mm, slightly shorter, as long as, or just protruding from persistent calyx lobes, glabrous. Seeds ± elliptic to unevenly shaped, ±0.5 mm long, grey- brown; testa with polygonal cells clearly visible, arranged in ± longitudinal rows, outer periclinal walls collapsed inwards forming a shallow pit, radial walls smooth."
            sourceIds:
              - sanbi_15191_0
            locator: "SANBI/WFO archive Morphology row 61044; source 15191.0; publication: Vollesen, KB. 2013. 126. Acanthaceae (Part 1), Fl. Zambes. 8(5): 1 - 184. Royal Botanic Gardens, Kew, London. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: In the most recent comprehensive key to the species of Jamesbrittenia, J. bergae keys out as J. accrescens. The new species is easily distinguished from the latter by its different floral colour, medium-textured corolla limb (the limb is thick-textured in the case of J. accrescens), shorter corolla tube (that of J. accrescens being 18-25 mm long and thicker), corolla lobes with the apices usually retuse (not + rounded as in J. accrescens) and the margin without a thin-textured, pale, marginal zone (that of J. accrescens having a thin, cream to greenish yellow margin). Furthermore, the ovary and capsule of J. bergae are glabrous, whereas those of J. accrescens are minutely glandular-puberulous. The capsules of J. bergae are smaller (4-7 x 2-3 mm) than those of J. accrescens, which are 7-10 x 3.5-4.5 mm. J. bergae, in addition, has a different habitat and geographical distribution than J. accrescens, which is known to grow in rocky places in scrub, often on margins of patches of forest, from the Zoutpansberg eastwards to the eastern highlands of Mpumalanga.
