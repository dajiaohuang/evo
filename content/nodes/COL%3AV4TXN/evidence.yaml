      morphology:
        status: partially-supported
        claims:
          - text: The type strain 5S69T is reported as Gram-negative, strictly anaerobic, non-spore-forming, and straight or slightly curved rods measuring 0.35–0.45 × 1.0–2.0 μm; cells are motile by a single polar flagellum.
            originalLanguage: en
            sourceIds:
              - paper
            locator: Section 3.1, ‘Phenotypic Characteristics of Strain 5S69T’
            placeTimeScope: The cultured type strain in the exponential-growth phase under study conditions.
            lifeStatus: Wild isolate; evidence is restricted to the named cultured type strain and the paper-reported observations.
        gaps:
          - These observations do not characterize population variation or all growth phases and environments.
      lifeHistory:
        status: not-assessed
        claims: []
        gaps:
          - No life-history study or systematic search was performed; reproduction, development, behavior and lifespan are not characterized.
      ecology:
        status: partially-supported
        claims:
          - text: The authors isolated strain 5S69T from injection water collected at the Vostochno-Anzirskoe oil field in Tatarstan, Russia, and characterize it as sulfate-reducing. These observations do not establish a measured field-scale role in carbon or sulfur cycling.
            originalLanguage: en
            sourceIds:
              - paper
            locator: Abstract; sections 3.1 and 4; strain isolation context
            placeTimeScope: The single cultured type strain and the sampled oil-field water described in the article.
            lifeStatus: Wild isolate; evidence is restricted to the named cultured type strain and the paper-reported observations.
        gaps:
          - No in-situ abundance, activity rate, interaction network or reservoir-wide survey was assessed.
      evolution:
        status: partially-supported
        claims:
          - text: The study uses 16S rRNA, 120 conserved single-copy proteins and genomic relatedness indices to support placement of 5S69T as a distinct Pseudodesulfovibrio species. It reports this as the authors' taxonomic conclusion.
            originalLanguage: en
            sourceIds:
              - paper
            locator: Abstract; phylogenetic and genomic index analyses; conclusions
            placeTimeScope: The type strain and comparator strains in the 2024 study.
            lifeStatus: Wild isolate; evidence is restricted to the named cultured type strain and the paper-reported observations.
        gaps:
          - Alternative taxon sampling, later nomenclatural changes and independent phylogenomic review were not assessed.
      distribution:
        status: partially-supported
        claims:
          - text: The paper reports the type strain from injection water collected at the Vostochno-Anzirskoe oil field, Tatarstan, Russia.
            originalLanguage: en
            sourceIds:
              - paper
            locator: Title; abstract; strain isolation section
            placeTimeScope: One reported collection locality only; no wider range is implied.
            lifeStatus: Wild isolate; evidence is restricted to the named cultured type strain and the paper-reported observations.
        gaps:
          - No further localities, global range, georeferenced boundary or sampling completeness were assessed.
      fossil:
        status: not-assessed
        claims: []
        gaps:
          - No fossil or paleontological literature/database search was performed; no fossil-presence or fossil-absence conclusion is made.
      conservation:
