        usage:
          title: Morinda citrifolia L., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Trees or shrubs to 25 ft tall, the branchlets 4-angled, glabrous, the nodes well spaced. Leaves oblong, 14-30 cm long, 12-18 cm wide, obtuse to acute at the apex, widely cuneate at the base, often slightly inequilateral, the costa grooved and subimmersed above, prominulous but appearing subplane beneath, to 0.3 cm wide proximally, the lateral veins ca. 8, prominulous, arcuate, the median veins to 5 cm apart, chartaceous to papyraceous, concolorous, glabrous or punctate above, glabrous beneath except the barbate vein axils; petioles to 2 cm long; glabrate, slightly alate adaxially; stipules oblong or oblong rotund, 10-20 mm long, 10-20 mm wide at the base, scarious, glabrous, appressed. Inflorescences axillary, glabrous, drying black, the peduncles 1-4, stout, to 3 cm long, the floral masses rotund to oblong, to 2 cm in diam. Flowers sessile, the hypanthium hidden in the floral mass, the calycine cup short, truncate, the margins scarious, the lobes evanescent, glabrous; corolla white, the tube cylindrical, ca. 6 mm long, carnose, glabrous outside, villose inside near the mouth, the lobes 5, narrowly oblong, to 9 mm long, 1.5 mm wide, obtuse, carnose, glabrous; stamens 5, long exserted at anthesis, the anthers subversatile, linear oblong, to 5.5 mm long, twisted and crescentic on shedding pollen, the filaments slightly unequal in length, inserted at the corolla mouth; stigmas 2, spread at anthesis, plumose in appear- ance, narrowly oblong, to 5.2 mm long, 0.8 mm wide, the margin erose. Fruits fleshy, succulent, as large as a man's hand, drying black.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 11106
