        claims:
          - text: Perennial, rhizomatous, up to 3 m high, robust, not tufted. Leaf blades up to 0.7 m long, up to 80 mm wide, leaves deciduous at base of blade, blades rounded or caudate at base, tips not sharp; ligule with fringing hairs shorter than membranous base. Spikelets 8-15 mm long. Inflorescence 0.3-0.6 m long, compact with ascending branches; lemmas with long hairs on back.
