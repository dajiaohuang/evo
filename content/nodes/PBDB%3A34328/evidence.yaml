      statement: A reconstructed Dunkleosteus terrelli skull and linkage model yield explicit estimates of jaw kinematics and bite force. The estimates depend on geometry and muscle assumptions and are not direct observations of behaviour, ecology or a genus-wide body plan.
      confidence: medium
      confidenceRationale: Confidence is medium because the cited primary study directly supports the bounded morphology statement at the supplied locator. The confidence does not extend beyond the estimates depend on geometry and muscle assumptions and are not direct observations of behaviour, ecology or a genus-wide body plan.
