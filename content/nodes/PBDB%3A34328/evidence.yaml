      confidenceRationale: "Dunkleosteus species sampled by Carr and Hlavin 2010: the cited primary study or systematic review directly supports the stated sample, calibration or withholding boundary at the supplied locator. Confidence is medium and does not extend to a global FAD, LAD, direct ancestor or unsampled interval."
