          quoteLocator: Skull reconstruction; linkage model; bite-force calculations
    - subjectId: taxon:dunkleosteus
      claimKind: scientific
      claimType: fossil-range
      statement: Two named Dunkleosteus species from Upper Devonian formations support a 372.15–358.86 Ma Famennian sample envelope; it is not an exhaustive genus-wide FAD or LAD.
