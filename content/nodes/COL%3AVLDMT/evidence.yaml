          originalSourceText: Shrub or tree to 6 m tall; twigs puberulent with small, dense, mostly ap- pressed, simple or glandular hairs. Leaves broadly ovate, to 25 cm long, sinuately 1-4-dentate on each side of the margin, occasionally entire, the apex and lobes acuminate, the base mostly truncate, slightly dimidiate, the veins and lamina softly pubescent with fine erect hairs, more conspicuous beneath; the petiole to '/2 as long as the leaves, pubescent; minor leaves mostly present, less than '/2 as large as the major leaves. Inflorescences several-flowered, fascicled in the leaf axils, peduncles not apparent, the pedicels ca. 10 mm long, pubescent and de- flexed in flower, glabrescent, elongating and erect in fruit. Flowers with the calyx cyathiform, as broad as deep, ca. 4 mm long with five manifest acuminate lobes ca. 1 mm long, pubescent, drying with evident venation, accrescent and partly or entirely enclosing the fruit; corolla yellow, 7-9 mm long, the tube puberulent outside and in the upper portion, lobed 1/s way down or further, the lobes puberulent outside, obtuse; filaments puberulent on the ventral surface, inserted in the middle of the corolla tube or above, somewhat shorter than the
