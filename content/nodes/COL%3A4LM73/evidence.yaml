    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants epiphytic, 150-400 mm tall; stems slender, not swollen into pseudobulbs; leaves 2-4, thin, erect, linear-lorate, acute, sometimes minutely unequally bilobed, 120-220 x 8-16 mm. Inflorescences shorter than the leaves, paniculate, branches 20-30 mm long, densely many-flowered; bracts narrowly ovate, acuminate, 3-4 mm long. Flowers white, tinged yellow and purple, to greenish-yellow. Sepals unequal, apiculate; median sepal narrowly triangular, 7.5-9 x 3-3.5 mm; laterals obliquely broadly ovate, 8.5-10 x 5-8 mm. Petals lorate-spathulate, acute, 6-7 x 1.5-2.2 mm. Lip obovate, 3-lobed with the sinuses between the lobes obscure, pubescent on top, 8 x 6-8 mm, disc with a central knob-like callus; midlobe ovate, acute, reflexed, 3 mm long; side lobes porrect, rounded, to 2.5 mm tall; mentum conical, 6-7 mm tall. Gynostemium 2 mm tall. Capsules very narrowly ovoid, 25-30 x 7 mm.
