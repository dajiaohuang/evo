        usage:
          title: Tovomita longifolia (Rich.) Hochr., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Stilted tree to 15 m tall, twigs stout, new growth drying yellowish, older growth drying gray, glabrous; latex cream or yellow. Leaves somewhat coria- ceous, obovate, to 20 cm long, 8 cm wide, apically obtuse or rounded, basally acuminate or obtuse, minutely revolute, the costa nearly plane above, elevated beneath, the lateral veins 6-7, arcuate-ascending, wider spaced upwards, as- cending at the margin but not forming a submarginal vein, minor venation ob- scure, consisting of 1-2 ill-spaced intermediate lateral veins and numerous veins pinnate on the laterals, linear canals sometimes evident beneath; petiole 10-40 cm long, ca. 2 mm wide, nearly flat above. Inflorescences terminal, pyramidal to rotund, subtended by pairs of normal leaves; rachis stout, drying yellowish brown, to ca. 6 cm long; bracteoles deltoid or obtuse, ca. 2 mm long, the margins hyaline; pedicels 5-8 mm long, stout. Flowers unisexual, the buds ovate to glo- bose, the minute sepal tips forming an apicule, ca. 7 mm long, reddish brown, finely striate, calyx prefloration complete, splitting to the base into 2 outer sepals, the sepals reflexed, boatlike or spathulate, ca. 8 mm long, coriaceous, the 2 inner sepals similar but slightly larger with hyaline margins; petals 4-7, thinner, nar- rower; stamens numerous (ca. 80), the filaments 2-4 mm long, slender, subterete, erect in bud, the anthers elongate, the lobes parallel, the connective slightly emergent and apiculate; ovary not examined (obsolete in staminate flowers). Fruit ultimately subglobose or pyriform, 5 cm long, 3 cm across, sulcate, apiculate, the apex prolonged by the 5 connate styles and sometimes appended by 5 persistent cuneiform patent stigmas, the base drawn into a stout subterete stipe, subtended by the persistent, erect, patent or reflexed outer perianth and stamens; valves oblanceolate, to 5 cm long, 2 cm wide; seeds 5 or by abortion fewer, filling the locules which occupy the globose, central portion of the fruit.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 3358
