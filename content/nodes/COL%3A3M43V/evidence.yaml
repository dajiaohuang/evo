    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Annual or over-wintering herbs up to 1 m high with ascending branches; lower part of stem densely retrorsely hairy. Basal leaves in a rosette, up to 20 cm long and 5 cm broad, lyrate-pinnatifid, somewhat runcinate, with 5-6 pairs of short, broad, lateral lobes and a large, oblong-ovate, obtuse, terminal lobe; all lobes ± dentate; densely white hairy. Lower stem leaves similar but smaller. Upper stem leaves small, sessile, simple, oblong to lanceolate. Sepals 3-4 mm long, narrow. Petals 6-8 mm long, spathulate, rounded. Siliquae 0.7-1.5 cm long, 1-1.5 mm in diameter, narrowly cylindrical, appressed-erect, on 2-4 mm long, erect pedicels almost as thick as the siliqua; valves 0.6-1 cm long, rounded, 3-nerved, veins obscure in ripe fruits; beak about 1/2 as long as the valves, 1-2-seeded, somewhat swollen. Seeds 76-152 mm each locule of the fruit, reddish-brown, c. 1 x 0-7 mm.
