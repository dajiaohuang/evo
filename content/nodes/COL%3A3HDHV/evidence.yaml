    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Small tree or scrambler up to 5 m tall; branchlets glabrous. Leaf-blade 40-80 x 20-50 mm, coriaceous, glabrous and usually shiny above, apex obtuse to subacute, base obtuse to rounded, margin subentire; petiole up to 15 mm long; stipules 2-3 mm long, linear, caducous. Inflorescence leaf-opposed, 1(-3)-flowered; peduncles up to 10 mm long, glabrous; pedicels up to 15 mm long, slender, shortly stellate-pubescent. Sepals 15 mm long, linear-oblong, pubescent and greenish outside, pinkish inside. Petals pink, 13-15 mm long, oblong-oblanceolate, with a basal nectariferous portion 2.5 mm long, circumvillous, ridged above. Androgynophore glabrous below for 1 mm, prolonged above into a densely pubescent portion 1.5 mm long. Ovary densely hairy, 4-lobed; style 10 mm long, glabrous; stigma broad. Fruit 4-lobed, shining, glabrescent, brown to blackish, somewhat fleshy.
            sourceIds:
              - sanbi_3093_0
            locator: "SANBI/WFO archive Morphology row 48743; source 3093.0; publication: Wild, H. 1984. Tiliaceae, Fl. S. Africa 21(1): 1 - 44. Botanical Research Institute, Pretoria. [http://www.biodiversitylibrary.org/item/209546#page/1/mode/1up]. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Related to G. occidentalis but the leaves are larger, thicker-textured and shinier on the upper surface, with entire or subentire margins. The holotype in B has unfortunately been destroyed and no further material of the type gathering has been located but, judging by the description, there is little doubt that it applies to the present concept.
            textZh: SANBI 条目提供了该种的鉴别特征。
            sourceIds:
