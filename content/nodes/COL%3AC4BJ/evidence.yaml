    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Tree aloe, 1-12 m tall. Branches robust, erect, never spreading, carrying large rosettes at terminal ends. Leaves grey-green, fairly large, up to 600 mm long, ± 100 mm wide at base, distinctly clasping branches, margins with small white teeth. Flowers in branched, recurved racemes arising from lowest leaves of rosettes, yellow, slightly swollen in middle.
            textZh: Aloidendron pillansii (L.Guthrie) Klopper & Gideon F.Sm. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_14533_0
            locator: "SANBI/WFO archive Morphology row 32893; source identifier 14533.0; cited publication: Klopper, RR; Smith, GF. 2013. Asphodelaceae: Aloe. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 45 - 48. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Apart from its general habit of growth and its thick smooth dichotomous branches, the most distinctive (and unexpected) feature of A. pillansii is the method of producing the inflorescences laterally from the axils of the lowest leaves. The peduncle is sharply decurved near base, branched about the middle, with the branches ascending and the racemes sub-erect to erect. The whole inflorescence (about 50 cm long) hangs downwards in between the lowest leaves, with the racemes upturned, so that the base of the peduncle is usually a little higher than the terminal raceme. This character appears to be unique in the genus Aloe. In racemes which are erect, the flowers are evenly distributed around the axis, but in oblique racemes the flowers are erectly sub-secund. A. pillansii is usually branched about the middle or lower, and ranges from few to many compactly or divaricately branched trees. Young simple-stemmed plants reach a height of 1.8-2.7 m [as '6-9 ft.'] before dividing at the summit and branching commences. Occasionally one sees a simple-stemmed plant 6-9 m [as '20-30 ft.'] high, forked at the summit, but this is not typical. In structure, size, shape and yellow flowers, A. pillansii, A. ramosissima and A. dichtoma are almost indistinguishable, but in size, branching and leaves, they could never be confused, while the inflorescence of A. pillansii immediately separates it from all other species.
            textZh: SANBI 条目提供了 Aloidendron pillansii (L.Guthrie) Klopper & Gideon F.Sm. 的鉴别特征。
