    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Perennial, rhizomatous and tufted, up to 0.6 m high. Rhizomes knotty. Culms profusely branched from lower nodes. Leaf blades 40-200 mm long, 1-3 mm wide. Spikelets up to 3 mm long, 0.8 mm wide. Racemes usually in pairs 40-100 mm long, often adhering to each other because hairs on spikelets become entangled; lower glume two-thirds to four-fifths as long as spikelet; lower lemma 7-nerved with 3 nerves close together in middle, thus with narrow interspaces adjacent to central nerve.
