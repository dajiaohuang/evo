          - text: L. poterioides can easily be confused with L. pedunculare. The presence of the felty indumentum at the tip of the peduncle and involucral bracts, the conspicuous, broad, transparent, membranous margin of the bracts, the leaf lobes that are almost obtuse and the distribution with one exception above 1 500 m altitude, distinguish L. poterioides from L. pedunculare.
