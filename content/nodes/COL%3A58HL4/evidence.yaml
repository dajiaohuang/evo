      ecology:
        status: partially-supported
        claims:
          - text: In laboratory observations, 90% of Trichoplax animals observed with microalgae present (n=30) paused within the first 17 minutes, compared with 22% without food (n=76). Animals observed with food spent an average 39% of observation time paused (12 animals; 5.8 hours total), versus 2.6% without food (65 animals; 33.5 hours total). These are results from the reported culture conditions, not estimates of wild feeding behavior or species-wide rates.
            textZh: 在实验室观察中，有微藻时观察到的 Trichoplax 个体有 90%（n=30）在前 17 分钟内暂停运动；无食物时为 22%（n=76）。有食物时，个体平均有 39% 的观察时间处于暂停状态（12 个体，共 5.8 小时）；无食物时为 2.6%（65 个体，共 33.5 小时）。这些结果仅适用于论文报告的培养条件，不能视为野外行为或整个物种的发生率估计。
            originalLanguage: en
            sourceIds:
              - smith2015trichoplax
            locator: Results, Trichoplax stops movements and ciliary beating in the presence of food, paragraphs beginning ‘Some animals moved continually’ and ‘Trichoplax paused more frequently’; Methods, Animals.
            placeTimeScope: Laboratory observations comparing food-present and food-absent conditions; the reported food was the microalga Rhodamonas salina. The paper does not give field locations or a wild collection period for these measurements.
            lifeStatus: Laboratory-cultured animals observed on a glass substrate; no wild population was observed for this claim.
        gaps:
          - One laboratory strain and food treatment do not establish wild behavior, geographic or seasonal variation, natural diet breadth, or species-wide feeding rates.
