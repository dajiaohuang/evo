      statement: Ambulocetidae is treated in the synthesis as a sampled Eocene fossil family with amphibious anatomical interpretations; those specimens test locomotor transitions but do not form a demonstrated linear ancestor series.
      confidence: medium
      confidenceRationale: Family identity and comparative anatomy are supported by a systematic synthesis of primary studies; direct ancestry is explicitly withheld.
      referenceLinks:
        - relation: supports
          referenceId: uhen-2010-whale-origins
          pages: 198–202
          quoteLocator: Ambulocetidae and amphibious locomotion synthesis
    - subjectId: taxon:ambulocetidae
      claimKind: scientific
      claimType: fossil-range
      statement: ambulocetidae is displayed at 48–47 Ma only as the review's sampled ambulocetid interval, not a linear ancestral stage or exact endpoints. The interval is a source-bounded sample window, not a global FAD, LAD, divergence date, continuous occupancy claim or direct-ancestor assertion.
      confidence: medium
      confidenceRationale: ambulocetidae uses Uhen, M.D. (2010) because the cited pages and locator expose the sampled taxon, specimen or living sequence set. Confidence is medium and applies only to Eocene ambulocetid sample synthesized by Uhen; broader endpoints remain unclaimed.
      referenceLinks:
        - relation: supports
          referenceId: uhen-2010-whale-origins
          pages: 198–202
          quoteLocator: Ambulocetidae and amphibious locomotion synthesis
        - relation: contextualizes
          referenceId: ics-2026-06
          pages: International Chronostratigraphic Chart v2026/06
          figure: Global chronostratigraphic scale
          quoteLocator: Numerical boundaries for named geological stages used to bound the source sample
  claim-rationales.zh:
    - 科级身份与比较解剖由一手研究系统综述支持；主张明确不陈述直接祖先关系。
    - ambulocetidae 采用 Uhen, M.D.（2010）的论文，因为所引页码与定位符直接标示了研究采样的类群、标本或现生序列集合。中等置信度仅适用于 Eocene ambulocetid sample synthesized by Uhen；更宽泛端点保持未声明。
  claim-statements.zh:
    - 综述将陆行鲸科视为具有两栖解剖解释的始新世取样化石科；这些标本用于检验运动转变，但不构成已证实的线性祖先序列。
    - ambulocetidae 仅以 48–47 Ma 展示为综述所采样的陆行鲸科区间，而非线性祖先阶段或精确端点。该区间是来源限定的样本窗口，不是全球首现、末现、分化日期、连续占据或直接祖先断言。
