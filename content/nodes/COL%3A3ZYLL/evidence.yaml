          - text: Perennials. Leaves flat and broad. Dry leaves persistent and ‘skeletonized’ through lignified veins. Prostrate to sprawling perennial. Leaves not imbricate, tips recurved, to 65 mm long, bladder cells small. Flowers stalked, yellow, ±40 mm diam., filamentous staminodes concealing reproductive parts. Fruits 5-locular, with valve wings.
