        usage:
          title: Phyla betulifolia (Kunth) Greene, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Sprawling herbs, with procumbent, often hollow stems rooting at the nodes, and ascending branches; stems and branches tetragonal when fresh, more or less appressed-strigose or strigillose with elongate whitish trichomes. Leaves with the blades thin-chartaceous or submembranous, rhomboid-ovate or ovate, often decidedly plicate, 1.5-8 cm long and 1.5-4.7 cm wide, acute apically, cuneately attenuate into the petiole basally, coarsely serrate-dentate (except on the basal cuneate acumination) with sharply acute or subacuminate teeth, densely or spar- ingly appressed-strigose with elongate whitish trichomes on both surface's; midrib and secondaries impressed above, prominent beneath; petioles slender, 4-30 mm long, strigose like the branches or sometimes more densely villous with spreading elongate whitish trichomes. Spikes densely many-flowered, at first ovate-capitate, later elongate-oblong, to 1.5 cm long; peduncles varying from solitary in the leaf- axils to paired or in 3's, 2-6 or more per node, mostly greatly abbreviated, 1-4 mm long, shorter than the flower-spikes, and than the subtending petioles, rarely elongate to 2.8 cm; bractlets membranous, ciliate, cuneate from the dilated apex, abruptly cuspidate, the cusp slightly surpassing the corollas. Flowers numerous, tiny, closely imbricate in many ranks; calyx less than 1 mm long; corolla pale- pink or pale-purple, varying to white, ca. 1 mm long. 2n = 36.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 13763
