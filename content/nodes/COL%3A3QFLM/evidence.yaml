        claims:
          - text: Cormous geophyte, 20-45 cm. Leaves; 2 basal, linear-filiform. Flowers pale blue, mauve or watery pink, tube funnel-shaped, anthers partly included.
            textZh: Ixia dieramoides Goldblatt & J.C.Manning 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 7149; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: With corms with fine, netted tunics and narrow, leathery leaves of the Ixia capillaris type, I. dieramoides is recognised mainly by the larger flowers with a tube 13-18(-22) mm long and with filaments and often the bases of the anthers included in the tube. The smaller flowers of I. capillaris have a tube (4-)5-7(-8) mm long, tepals spreading from the base and filaments typically exserted 1-2 mm. Unlike I. capillaris, the flowers are often faintly scented. Well-grown plants usually reach 600 mm high, thus extending substantially above the surrounding vegetation, which may be only 350 mm high. In dry, stony ground in poor soils, plants may be just 250 mm high, have one or two flowers and may be unbranched. Seen from a distance, the flowering spikes nodding in the breeze resemble species of Dierama. Ixia dieramoides from the Cederberg has short, included filaments 2.5-5.0 mm long, as well as shorter anthers and style branches.
            textZh: SANBI 条目提供了 Ixia dieramoides Goldblatt & J.C.Manning 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 95088; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
