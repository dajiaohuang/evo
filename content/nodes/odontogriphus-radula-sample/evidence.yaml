          pages: 159–163
          figure: Figures 1–4; Supplementary Information
          quoteLocator: Specimen sample; feeding apparatus; reconstruction; phylogenetic interpretation
  claim-rationales.zh:
    - 连续齿列和替换几何来自标本观察；齿舌同源性及软体动物干群位置依赖比较解剖解释。
  claim-statements.zh:
    - 189 件 Odontogriphus 标本反复保存了位于膜上的成对横向齿列及后方替换结构，同时还有宽足和外套沟构造；将该器官认作软体动物齿舌虽有力论证，仍属于同源性解释。
