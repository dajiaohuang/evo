  claims:
    - subjectId: event:odontogriphus-radula-sample
      claimKind: scientific
      claimType: morphology
      statement: The 189-specimen Odontogriphus sample repeatedly preserves paired transverse tooth rows on a membrane with posterior replacement, together with a broad foot and mantle-groove structures; calling this apparatus a molluscan radula is strongly argued but remains a homology interpretation.
      confidence: medium
      confidenceRationale: Repeated structures and replacement geometry are specimen observations; radular homology and stem-mollusc placement depend on comparative anatomical interpretation.
