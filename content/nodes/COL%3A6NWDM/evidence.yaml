    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants 100-150 mm high, simple or few- to many-branched, mostly from base, stem compressed and 1- or 2-angled. Corm triangular in outline, basal rim prominently serrated, 24-28 mm diam. at base. Leaves several, the basal ribbed, 1/3 to ± as long as stem, to 5 mm wide, upper leaves progressively smaller above, smooth, the uppermost resembling floral bracts. Spike 6- to 10-flowered; bracts green, outer 10-18 mm long, with shallow, slightly serrated keel, inner ± 1/3-1/2 as long as outer, membranous with two darker keels, notched at apex. Flowers blue-purple, lower tepals with V-shaped white mark above base surrounded by darker violet to ± black zone, lower median tepal with a small claw-like tooth above base, unscented; perianth tube slender below, widening and curving outward in upper 1/3, 35-38 mm long; tepals unequal, dorsal erect, ovate, ± 15 x 6 mm, upper laterals slightly smaller, recurved, lower tepals united basally for ± 3 mm, curving downward, ± 8 x 4 mm. Stamens unilateral, arcuate; filaments ± 7 mm long, exserted ± 3 mm from mouth of tube; anthers suberect, prominently tailed, ± 4 mm long; pollen yellow. Style arching above stamens, dividing opposite lower 1/3 to middle of anthers; style branches ± 3.5 mm long, divided for slightly > 1/2 their length. Capsules ovoid, ± 12 mm long, showing outline of seeds, with moderately well developed locular ridges. Seeds unknown.
            textZh: Lapeirousia purpurea Goldblatt & J.C.Manning 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Morphology row 98063; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: The obconic corms of Lapeirousia purpurea have fine teeth projecting from the base and resemble the corms of L. dolomitica, L. lewisiana and L. violacea, also long-tubed species, but can be distinguished by the rich violet colour of the perianth, with the upper lateral tepals strongly reflexed and the lower three tepals with a V-shaped white mark above the base surrounded by a dark violet to black zone. The lower median tepal bears a small claw-like cusp near the base. In L. violacea all three lower tepals usually bear a small tooth near the base.
            textZh: SANBI 条目提供了 Lapeirousia purpurea Goldblatt & J.C.Manning 的鉴别特征。
