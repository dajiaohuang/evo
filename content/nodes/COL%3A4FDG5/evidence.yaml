          publishedAt: undated
          originalSourceText: Tall herbs, often woody at the base, with slender sometimes angled stems, to 5-10 dm. tall, with a strong odor of garlic. Leaves elliptic to obovate, the apex acute or acuminate, often mucronate, the base narrowed, 5.5-16.0 cm. long, about 2-6 cm. broad, slightly pubescent; petioles 1.5-2.0 cm. long. Inflorescence in slender usually sparsely flowered racemes 15-40 cm. long; pedicels up to 1 mm. long. Tepals white or greenish-white, sometimes pale pink, often basally pubescent, about 3-5 mm. long. Stamens 8, free, up to 3 mm. long. Ovary 4-uncinate, the hooks becoming elongate and quite prominent in fruit. Fruit linear, 8 mm. long.
