    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants 500-700 mm high, always solitary. Corm 15-20 mm diam.; tunics of matted, brown fibres. Stem unbranched, covered by (2)3 or 4, green sheathing leaves, not usually overlapping, apices dry, brown. Foliage leaf linear, channelled, exceeding stem, trailing distally, mostly 11-15 mm wide. Rhipidial spathes green, with acute, dry tips, inner 9-16 mm long, inner slightly shorter. Flowers long-lived, yellow, creamy yellow or white, outer tepal limbs with bright yellow nectar guides at bases edged with a ring of purple veins; outer tepals broadly lanceolate, obtuse, 40-75 x 30-35 mm, claws ± 2/3 as long as limbs; inner tepals broadly lanceolate with tapering base, obtuse to retuse, up to 40-60 x 20-25 mm long, erect. Filaments ± 10 mm long, united in lower 1/2; anthers ± 10 mm long. Ovary cylindric, 20-30 mm long; style branches 18-20 mm long, crests 10-20 mm long, erect. Capsules cylindric-3-lobed, 30-40 mm long. Seeds flattened, disc-like.
            textZh: Moraea moggii N.E.Br. 的 SANBI 物种条目记载了植株、叶片和花部形态。
            sourceIds:
              - sanbi_18638_0
            locator: Strelitzia 42; archive Morphology row 84347, source 18638.0
            placeTimeScope: Regional species account published 2020; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
          - text: Distinguished in subg. Grandiflorae by its solitary habit, long, narrow, channelled leaf 11-15 mm wide, often with a grey blush, and very large, pale yellow to white flowers. The outer tepals are up to 75 mm long and the inner up to 60 mm long. It is most easily confused with M. spathulata, some forms of which are similar, but the two can usually be distinguished by the solitary habit of M. moggii compared with typically clump-forming M. spathulata, which has broader leaves often flat or very widely channelled and usually darker yellow flowers. Apart from this, M. moggii is generally a late flowering species, while M. spathulata flowers in spring or summer, except for some southern KwaZulu-Natal populations that also flower late in the season. Two subspecies are recognised, northern subsp. moggii, with pale yellow flowers, and southern subsp. albescens which typically has white or creamy yellow flowers.
