        usage:
          title: Neomirandea allenii R.M.King & H.Rob., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Epiphytic shrubs to 1.5 m tall; stems terete, minutely puberulous. Leaves opposite, subsessile; blades fleshy, broadly elliptical to obovate, to 9 cm long and 6 cm wide, the base short-cuneate to slightly rounded, the margins entire, rarely slightly serrulate, the apex obtusely acute to narrowly rounded, the surfaces with glandular punctations and without hairs, the venation pinnate, the secondary veins prominent; petioles ca. 3-5 mm long, greatly thickened, glabrous. Inflores- cence a corymbose panicle, to 10 cm wide and 10 cm high; ultimate branches ca. 5 mm long, puberulous. Heads 8-9 mm high with ca. 10 florets; involucral bracts ca. 12, subimbricate, in 2-3 series, broadly lanceolate, mostly 2-3 mm long and 0.5 mm wide, the outer surface sparsely puberulous and with glandular puncta- tions; receptacle glabrous; corolla pink or purple, ca. 5 mm long, narrowly funnel- form without hairs inside, the lobes about as long as wide with numerous glands on outer surface, the glands mostly long-stalked; style base not enlarged. Achenes prismatic, with few long-stalked glands and uniseriate multiseptate hairs, the glands and hairs more numerous at base and apex; carpopodium with larger cells in a few series; pappus of ca. 30 scabrous bristles, mostly ca. 5 mm long, the apical cells of some bristles acute, few to many interspersed bristles with enlarged tips and blunt apical cells.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 1924
