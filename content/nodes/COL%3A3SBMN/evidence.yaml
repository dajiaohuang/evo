    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Like L. cactiformis but corolla spotted with red on yellow, tube distinctly pentagonal, inner corona lobes exceeding anthers and rising in a column in centre.
            sourceIds:
              - sanbi_14722_0
            locator: "SANBI/WFO archive Morphology row 30916; source 14722.0; publication: Bruyns, PV. 2013. Apocynaceae. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 248 - 264. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Flowers of L. picta are generally large for this genus. On the background colour there are numerous, nearly round, evenly distributed, purple-brown spots which often become somewhat transversely elongated in the tube. This patterning extends along the lobe for most of its length except near the apex, which is usually dark purple-brown. However, the apex of the lobe is mostly folded back once the flower is fully open, making this dark patch visible only as the flowers open. The corolla tube has a broad inward bulge at the sinuses of the lobes and this gives the tube a distinctly pentagonal shape that is rarely found in L. cactiformis. As is common in the genus, the inside of the corolla is covered with papillae but here they are broad and rounded, often with a dark, apical cell and only rarely with an apical bristle.The corona is particularly variable. Usually the horns of the outer lobes are divergent and spreading so as to lie close to (sometimes adpressed to or curling round) the long dorsal projection of the inner lobe. As a consequence the outer series has the appearance of being made up of five trifid lobes; occasionally they do not diverge at all and the 15 horns (10 outer coronal horns and five dorsal projections on the inner lobes) are more or less equally spaced. In L. picta the inner lobes are relatively long. They are initially incumbent on the anthers, then connivent and then erect, rising in a slender vertical column above the centre of the flower and exceeding the height of the outer lobes. In a few cases they have been found to form a cage above the anthers. In such flowers they are incumbent on the anthers only near their bases, after which they rise above them and meet in the centre to form a small vertical column.It has been found that in L. cactiformis and L. picta the seed and seedlings are markedly different, whereas their vegetative and floral parts are somewhat similar and the two species could be confused. Florally they are most readily separable by the long inner corona lobes of L. picta. There are other less reliable distinctions, and these are discussed under L. cactiformis.
