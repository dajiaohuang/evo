    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants 500-700 mm high, usually solitary. Corm ± 15 mm diam.; tunics of medium-textured, netted fibres. Stem sheathed below by light brown, broken cataphylls, unbranched, partly covered by sheathing leaves 2(3), ± 100 mm long, lower part often exposed. Foliage leaf linear, channelled, usually exceeding stem, 5-10(-25) mm wide. Rhipidial spathes grey-green with light brown tips, inner 90-140 mm long, outer ± 2/3 as long. Flowers long-lived, slate-blue to pale blue-mauve, outer tepal limbs with linear, pale yellow nectar guides at bases, half reflexed; outer tepals 65-75 x 25-35 mm, limb 45-50 mm long; inner tepals 50-60 mm long. Filaments 8-10 mm long, united in lower half; anthers 10-12 mm long, as long or longer than filaments. Ovary cylindric, up to 25 mm long; style branches ± 15 mm long, crests 15-20 mm long. Capsules cylindric-3-lobed, ± 20 mm long, shortly beaked. Seeds unknown.
            textZh: Moraea ardesiaca Goldblatt 的 SANBI 物种条目记载了植株、叶片和花部形态。
