            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
          - text: The only blue-flowered member of subg. Grandiflorae in southern Africa, Moraea ardesiaca is immediately recognised by the large flowers either slate-blue to blue-mauve. Confusion with M. carnea is possible but this species has pale pink flowers with darker pink to purple style crests and smaller, narrower tepals 55-60 mm long vs. 65-70 mm in M. ardesiaca. Moraea carnea also occurs along streams on open slopes at relatively high elevations, usually above 2300 m, whereas M. ardesiaca is generally found at lower elevations along streams and drainage lines.
