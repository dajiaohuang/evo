  claim-statements.zh:
    - AM F66763 是来自 Griman Creek 组、保存三枚兽齿型臼齿的右齿骨残片；其单孔类亲缘依据已发表的牙齿比较，不能据此把 Steropodon 当作直系祖先或普遍的单孔类首现。
