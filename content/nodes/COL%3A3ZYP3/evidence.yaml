    facets:
      morphology:
        status: partially-supported
        claims:
          - text: "Dwarf, erect shrub up to 170 mm high, 250 mm wide. Stems articulated, green, succulent, becoming slightly woody with age towards bases; internodes cylindrical, 3.5-5.5 x 3.5-4.5 mm, epidermal bladder cells xeromorphic with hair-like extensions. Leaves deciduous, up to 3-5 mm long, concave above, convex below, overlapping at bases, epidermal bladder cells mesomorphic without hair-like extensions. Calyx with 5 lobes; lobes shortly connate and erect during anthesis. Flowers solitary at tips of stems, 10-15 mm diam. Staminodes: petaloid staminodes white to cream-coloured, free to bases, recurving over calyx lobes; filamentous staminodes absent. Ovary semi-inferior; placentation axile. Fruit a hygrochastic capsule, 5-locular, (4-)5-6 mm diam., valve wings inflexed over expanded valves, without seed bags. Seeds brown, D-shaped, 1.3-1.5 mm long, with a crest, hilar bulge absent, testa cells slightly raised."
            sourceIds:
