        usage:
          title: Serjania circumvallata Radlk., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Glabrous, tendrilled lianas; younger stems striate, with milky sap, the older stems grooved, flattened to 3-angled; wood composite, with 3-5(-6?) peripheral bundles, these sometimes obscure, often paired, sometimes flattened. Leaves 3-foliolate and pinnate; petioles 2-7 cm long, with marginal ribs above; petiolules short or to 13 mm long; leaflets chartaceous, lanceolate-elliptic, ovate or elliptic, acute to acuminate at the apex, attenuate to rounded at the base, entire to ob- tusely crenate above the middle, the teeth usually glandular, the terminal leaflet usually 10-14(-19) cm long, 3.5-6.5 (-9) cm wide, the lateral leaflets somewhat smaller, the major lateral veins about 5 pairs, reticulate veins prominulous. Thyrses solitary in leaf axils or in terminal paniculate racemes, the ultimate branches densely bracteolate and cincinnal, the branches, pedicels and calyces minutely and densely white-tomentose. Flowers white, ca. 3 mm long; sepals ob- long to obovate, the 2 opposite the staminal cluster enlarged, obovate, petaloid; petals obovate, glabrous except for villous margins, glandular within near the middle, to 1.7 mm long, all borne on disc glands, the scales of the anterior petals with an obscure, densely villous, deflexed appendage and with a prominent yel- low crest deeply 2-lobed to about midway or beyond and extending above the petals, the scales of the lateral petals with a densely villous deflexed appendage, these in contact with the anterior scales; filaments villous to near the apex; ovary minute, glabrous, 3-sided, glandular, the styles 3, equalling the ovary; staminate flowers with the stamens exserted, the longest stamen to 2.3 mm long, all anthers facing anterior petals. Fruits ovate, subcordate, 4.5-5 cm long, less than 3.5 cm wide, glabrous, the cells 6-8 mm long and ca. 6 mm wide, rugose, the wings with the veins prominulous, much constricted just below the seed-bearing part.
