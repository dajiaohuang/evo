          publishedAt: undated
          originalSourceText: Unarmed, naturalized trees, with puberulent to glabrous branchlets, spreading crown, and rough, brown bark. Leaves 6-12 cm. long, glabrous or nearly so; leaflets 6-18 pairs, oblong, 1-2.5 cm. long, rounded to retuse apically, obliquely obtuse to subtruncate basally, chartaceous, reticulate. Inflorescence as described for the genus; pedicels slender, 6-10 mm. long. Flowers yellow striped with red; sepals 5, elliptic-lanceolate, 6-10 mm. long; larger petals 3, obovate, 8-12 mm. long, subfimbriate; stamens arcuate, investing the ovary below, up to 14 mm. long; anthers oblong, about 2 mm. long; ovary somewhat pubescent basally. Legume 5-15 cm. long, about 2 cm. thick, lepidote, with an acid pulp surrounding the seeds; seeds about 1 cm. wide.
