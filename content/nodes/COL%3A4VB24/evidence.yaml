    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Stems 7-27 cm tall, unbranched. Leaves opposite and decussate; lamina 30-70 x 10-20 mm, oblong- or ovate-triangular or lanceolate; petiole 3-5 mm long. Inflorescences 3-5 per stem, 5-9-flowered; peduncles 10-50 mm long; pedicels 5-9 mm long. Calyx segments 4-5.5 x 1-1.5 mm. Corolla lobes 7-9 x 3-4 mm, flat, yellow-green; dorsal surface glabrous, rarely sparsely pilose, ventral surface glabrous, margin ciliate or glabrous. Corona 3-4 mm long, much exceeding the gynostegium, yellow-green; each lobe narrowly elliptic to broadly sagittate in dorsal view, acute at apex, erect, the ventral side with median longitudinal groove. Anthers with appendages c. 0.5 mm in diameter, circular, white, appressed against gynostegial head; corpusculum 0.23-0.28 mm long, not flanged; pollinium attachment subapical; pollinia 0.55-0.65 mm long, compressed pyriform, the germination zone extending along 2/3 of the outer edge, almost reaching the point of attachment. Gynostegium white. Fruit unknown.
