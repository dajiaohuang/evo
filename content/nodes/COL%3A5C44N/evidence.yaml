        claims:
          - text: Cormous geophyte, 5-20 cm. Leaves narrowly lanceolate. Flowers red to purplish brown, tepals recurved, tube shorter than tepals, 2-3 mm long, filaments very short.
            textZh: Wurmbea recurva B.Nord. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13859_0
            locator: "SANBI/WFO archive Morphology row 12157; source identifier 13859.0; cited publication: Manning, JC; Goldblatt, P. 2012. Colchicaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 80 - 83. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Clearly allied to W. marginata, with which it shares the red or deep purple perianth with contrasting yellow anthers. The spike is narrower, however, due to the smaller perianth with shorter and re-flexed segments. There is some variation in flower colour, from deep purple or red to a lighter brownish tinge. The light colour in some forms may be due to introgression from other species, such as W. inusta, which apparently hybridizes with W. recurva, occasionally forming hybrid swarms.
            textZh: SANBI 条目提供了 Wurmbea recurva B.Nord. 的鉴别特征。
            sourceIds:
              - sanbi_5002_0
            locator: "SANBI/WFO archive Diagnostic row 58134; source identifier 5002.0; cited publication: Nordenstam, RB. 1986. The genus Wurmbea (Colchicaceae) in the Cape region. Opera Bot. 87: 5 - 41. [All rights reserved]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
