    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants 150-200 mm high. Corm unknown. Stem mostly 2- to 4-branched, flexed above sheaths of basal and cauline leaves, sheathing leaves 30-40 mm long, attenuate, dry and light brown in distal half. Foliage leaf solitary, basal, linear, falcate, ± twice as long as stem, narrowly channelled, ± 2 mm wide opened flat, often dry and trailing distally. Rhipidial spathes dry and light brown in distal half, attenuate, inner 30-35 mm long, outer almost half as long. Flowers fugaceous, pale ivory-yellow, limbs of all tepals with deeper yellow nectar guides at bases, spreading; outer tepals narrowly obovate, 20-25 x 7-8 mm, limbs 18-22 mm long, claws of both whorls ± 2 mm long, ascending as a narrow cup including lower half of filament column, inner tepals 18-21 x 6-7 mm. Filaments ± 5 mm long, united in smooth, cylindric column 4 mm long, free and diverging in upper 1 mm; anthers ± 3 mm long before anthesis, ± 2 mm after releasing pollen, exceeding style branches, yellow; pollen yellow. Ovary spindle-shaped, usually exserted, ± 5.5 mm long; style branches flattened, 2.5 x 1.5 mm long, with broad stigmatic lobes, crests ± linear, erect, ± 1 mm long. Capsules obovoid, ± 10 mm long. Seeds unknown.
            textZh: Moraea eburnea Goldblatt & J.C.Manning 的 SANBI 物种条目记载了植株、叶片和花部形态。
            sourceIds:
              - sanbi_18638_0
            locator: Strelitzia 42; archive Morphology row 97888, source 18638.0
            placeTimeScope: Regional species account published 2020; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
          - text: "Known only from the Farm Vleiland in the northern foothills of the Klein Swartberg Mtns in Western Cape, South Africa; on clay slopes. Diagnosis: the relatively small, pale yellow flowers of Moraea eburnea have moderately well-developed, flattened style branches terminating in unusually broad stigmatic lobes and short, erect crests somewhat unusual in subg. Homeria, as are the filaments, united in a smooth, cylindric column ± 4 mm long but free and diverging in the upper 1 mm. The distally free filaments and moderately well-developed style branches suggest that M. eburnea may be most closely related to the M. pallida group."
