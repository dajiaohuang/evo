          - text: It differs from T. guthrieae by the larger, wider, more or less orbicular flowers, in which the tepals are exserted next to the floral bracts, and by the absence of sterile branches at the nodes of older, mature culms. This new species is also found far to the east of the nearest currently known populations of T. guthrieae from the Langeberg at Garcias Pass.
