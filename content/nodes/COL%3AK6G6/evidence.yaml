    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, 10-25 cm, stems aerial, much branched. Leaves narrow, undulate and twisted, margins crisped and long-hairy. Flowers zygomorphic, windowed, dorsal tepal narrow, arcuate, blue with yellow markings, stamens arcuate, anthers connate, inner bracts forked apically, ovary smooth.
            textZh: Babiana sinuata G.J.Lewis 的 SANBI 物种条目记录了形态特征。
            sourceIds:
