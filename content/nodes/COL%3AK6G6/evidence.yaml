            locator: "SANBI/WFO archive Morphology row 6718; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: One of the most distinctive species of the genus, Babiana sinuata can be recognised immediately by the twisted and broadly undulate leaves with thickened, crisped margins and woolly to cobwebby cataphylls and leaf sheaths; the upper (adaxial) margins also bear fine long hairs. The moderate-sized, pale blue-mauve flowers have the upper tepals at first arching over the stamens but later becoming erect and the lower median tepal has a prominent violet central mark on a pale yellow background. Most remarkable, however, are the long, arched stamens with anthers joined together, a feature unique in the genus. The woolly cataphylls and crisped, undulate, and twisted leaves suggest a close relationship with B. striata, with which it has been confused. Flowering earlier in the year, B. striata is easy to distinguish by the more compact inflorescence of smaller flowers with the anthers parallel but not joined together, and the corm tunics of particularly coarse fibres.
            textZh: SANBI 条目提供了 Babiana sinuata G.J.Lewis 的鉴别特征。
