          originalSourceText: Shrub or small tree, the younger stems, petioles, lower leaf-surface, inflores- cence, and hypanthia cinereous or ferruginous with stellate hairs; leaves sessile, oblanceolate to obovate, up to 4 dm. long, a third to half as wide, abruptly short- acuminate, entire or denticulate, rounded to a cordate-clasping base, glabrous above at maturity; panicle large, divaricately branched; flowers 5-merous, sessile in small glomerules; hypanthium cup-shaped to obconic, 1.5-2.5 mm. long; calyx-tube prolonged about 0.5 mm., nearly truncate, often erose; exterior teeth broadly triangular, adnate, projecting about 0.2 mm.; petals white, about 2.5 mm. long; stamens weakly dimorphic; ovary 3-celled, half-inferior; style slender, 8-10 mm. long; stigma ,truncate.
