    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Perennial herb with several leaf rosettes crowning a slender woody rhizome, flowering stems simple, somewhat decumbent then erect to ±150-300 mm, loosely greyish-white woolly, closely leafy. Radical leaves ±30-80 x 10-35 mm, obovate or oblong-obovate, apex subacute, base slightly narrowed, clasping, both surfaces densely grey-woolly, cauline leaves similar, becoming oblong-lanceolate to linear-lanceolate and smaller upwards, appressed. Heads homogamous or occasionally heterogamous, broadly campanulate, ±7-15 mm long, solitary or up to ±14 crowded at the stem tip. Involucral bracts in ±8-12 series, graded, loosely imbricate, much exceeding flowers, radiating, outer glossy white, tipped dark or light brown, becoming pure white inwards. Receptacle with fimbrils equalling or exceeding ovaries. Flowers 50-335, rarely 2-7 female, yellow sometimes tipped purplish. Achenes ±1 mm long, glabrous. Pappus bristles many, equalling corolla, barbellate above, bases cohering by patent cilia.
            sourceIds:
