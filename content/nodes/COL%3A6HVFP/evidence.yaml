        usage:
          title: Fevillea cordifolia L., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Lianas; stems, glabrous, often reddish. Leaves simple, cordate, 6-15 cm long, 4-12 cm wide, apex acuminate to attenuate, the base cordate, the margin with re- mote, rounded, glandular teeth, minutely ciliate, chartaceous to subcoriaceous, the upper and the lower surfaces minutely pustulate and usually somewhat puberulent on the veins; petiole 2-8 cm long, slender, striate; tendrils 2-branched near the apex. Staminate flowers axillary, paniculate, the rachis 10-20 cm long, puberulent, each branch with a small, ovate bracteole at the base; pedicels 1-2 mm long, slender; calyx campanulate, greenish yellow, puberulent, ciliate, lobate to near the middle, the lobes broadly lanceolate, ca. 2 mm long, acute; corolla greenish yellow, the lobes broadly obovate, 3-4 mm long, the apex rounded, gla- brous on the outer surface, puberulent toward the base on the inner surface, bearing a narrow flap of tissue on the lower 1/3 of petal separating 2 shallow nectary cups, weakly 7-nerved for most their length; stamens ca. 1 mm long, the anthers about as long as broad, equalling or longer than the filaments. Pistillate flowers disposed as the staminate flowers; calyx and corolla similar to the stami- nate flowers; ovary globose, 3-4 mm in diameter, puberulent, styles ca. 1 mm long, connate to near middle, the stigmas forming a capitate, 3-lobate head. Fruits green, flesh greenish white, globose or subglobose, 7-12 cm in diameter, the surface granular, a circumferential scar near the apex, indehiscent; seeds 6, 2 in each carpel, pendulous, lenticular, 5-6 cm long, 4-5 cm wide, ca. 1 cm thick, white, the testa punctate and minutely echinate.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 3668
          archiveSourceId: DF9A16A1-F101-497E-9715-DC4A4AD7CC35
