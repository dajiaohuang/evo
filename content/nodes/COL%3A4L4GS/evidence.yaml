        usage:
          title: Polyclathra cucumerina Bertol., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Slender vines; stems glandular pubescent, pilosulous, or glabrate. Leaves simple, rounded cordate to ovate, 4-12 cm long and nearly as wide, slightly angulate to deeply 3- to 5-lobate, cordate at the base, the apex of the lobes obtuse, the margins denticulate, chartaceous, the upper and the lower surfaces puberulent or scabrous; petiole 2-8 cm long, slender, pubescent or scabrous; ten- drils 4-branched. Staminate flowers solitary, axillary; peduncles 7-25 cm long, glandular pubescent; calyx cylindrical, dilated at the apex, greenish white, glan- dular puberulent, the lobes linear, 8-18 mm long; corolla white, the lobes 2.0- 2.5 cm long, obovate oblong, obtuse or acute, the outer surface glandular puber- ulent; stamens ca. 2 cm long, the anthers forming a cylindrical oblong head, subequalling the filaments, the filaments pilose at the base. Pistillate flowers solitary, axillary; peduncles 0.5-1.5 cm long; calyx and corolla as in the stami- nate flowers; ovary ellipsoid to subglobose, pubescent. Fruit green with white stripes, yellowing in age, 4-6(-8) cm long, 3-4 cm wide, ellipsoid to oblong, the thin pericarp splitting from the apex and revealing tiers of horizontal cavi- ties, each containing a single seed; seeds dull brown, ca. 6 mm long, broadly ovate, compressed.
          originalLanguage: en
          sourceField: general
