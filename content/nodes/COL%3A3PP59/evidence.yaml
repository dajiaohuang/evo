        claims:
          - text: Perennial herb, up to 450 mm tall. Leaves sessile, entire to pinnate, densely silvery hirsute. Heads solitary on long, sparsely leafy peduncles. Rays much longer than involucral bracts. Flowers with white rays, disc yellow.
            sourceIds:
              - sanbi_11118_0
            locator: "SANBI/WFO archive Morphology row 2407; source 11118.0; publication: Herman, PPJ; Retief, E. 1997. Plants of the northern provinces of South Africa: Keys and diagnostic characters. Strelitzia 6: 1 - 681. National Botanical Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: In placing this new species in the monotypic Inezia Phill., the circumscription of the genus has had to be changed. Phillips originally separated Inezia from Lidbeckia Berg, (a genus with two species) mainly on the fertile ray florets, and the distribution-Lidbeckia being a genus of the Cape floral area, whereas Inezia is a genus of mountainous grassland in the eastern Transvaal and Swaziland. However, this new species breaks this distinction down, because it has ray florets with ovules of similar reduction to Lidbeckia quinqueloba (L.f.) Cass. In any case, the ray florets of the only hitherto known species of Inezia, I. integrifolia, are not perfectly fertile, the ovules being slightly degenerate, but nevertheless present. I. speciosa has an even more reduced ovule in the ray achenes. The type of Lidbeckia, L. pectinata Berg., has ray florets which are completely sterile, with no style and the achene severely reduced, with no ovule present. Lidbeckia quinqueloba (L.f.) Cass., on the other hand, has the style developed, with two unequal branches with rounded, rather than truncate apices. A rudimentary ovule is also discernible in the achene. All four species have the achene surfaces with broad bicellular glands which sometimes become three-tiered. These are also present on the rays, but are more sparse here. The degree of reduction of the ray floret no longer seems to hold well as a distinguishing character between these two genera.
