        claims:
          - text: Davey 14426 and Horwood 11 appear to be only very stunted plants of this species, with stems 2.5-5 cm h., rising from short thick irregularly brchd., woody prostrate brchs., but they require to be compared when alive, no other distinction being apparent in the dried material. This plant bears a great semblance to that figured by Salm Dyck as M. semidentatum, but I consider best to give it a distinct name for the present. The name M. semidentatum appeared in Salm Dyck's catalogues as a mere nomen nudum; he sent a species under that name to Haworth and also to Kew; Haworth described it as having only one tooth on the back of the lvs. There are at Kew two original drawings of the species sent by Salm Dyck under that name which agree with Haworth's description in having only one tooth on the back of the lvs., these are also described as more erect and more crowded, and the fls. as being smaller with more numerous and obtuse (not acum.) pet. than those in the figure which Salm Dyck gives of his plant.
            sourceIds:
              - sanbi_8393_0
            locator: "SANBI/WFO archive Morphology row 84314; source 8393.0; publication: Burtt Davy, J. 1926. A manual of the flowering plants and ferns of the Transvaal with Swaziland, South Africa. Longmans, Green and Co. Ltd., London. [All rights reserved]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: As Haworth was the first to describe M. semidentatum, the name goes with his description; until more is known of the plant it is impossible to say whether the one Salm Dyck figured is distinct from that which Haworth described or not. In either case it seems very improbable that a plant end. to the Trans, should have been in cult, in Eur. in 1820; and as the Trans, plant seems to have smaller fls. than Salm Dyck represents, I deem it best to consider it a distinct species for the present. Sond. quotes a specimen of M. semidentatum, collected by Zey. near the Gamka River, which is a more likely locality for it.
