        claims:
          - text: Cormous geophyte, relatively large. Leaves 3 or 4(5), longest leaf 85-345 x 9-53 mm, margins glabrous. Flowers 1-17 in a terminal capitulum; bract of the first flower 35-130 x 20-56 mm, patently erect; tepals 11.5-25.0 mm long, claws 6-12 mm long, blades 5.5-13.5 mm long; blades auriculate and cupped below. Stamens exserted; open anthers 1.5-2.8 mm long. Ovary with 3 subulate style bases; styles keeled; carina distinctly excurrent from upper 1/3 part of ovary; stigma punctate. Flowering time Aug., Sept.?.
