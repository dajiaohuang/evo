    facets:
      morphology:
        status: partially-supported
        claims:
          - text: A slender twining vine to 5 m, stems annual. Tuber to c. 10 cm long, ovoid, fleshy, with dense fine fibrous roots, periderm pale brown, parenchyma white or yellowish. Indumentum of vegetative parts and inflorescence of simple, straight, quite coarse 0.1-0.6 mm long hairs, often brown or grey in colour, stems and fruit glabrescent, leaves densely pubescent on both surfaces to pubescent on veins and margins only, reproductive parts always pubescent and often with longer hairs than vegetative parts. Stems unarmed, to c. 5 mm in diam., sometimes pigmented; small, brown, tuberculate bulbils sometimes present in leaf axils. Leaf digitately 3-7(- 9)-foliolate, rarely entire; petioles 0.6-10 cm, petiolules 0.5-5(-10) mm; posterior leaflets 1.0-8.8(-14.6) x 0.5-6.4 cm, often asymmetric on the basal side of the leaflet, especially in 3-foliolate material, occasionally bifid, intermediate leaflets (where present) 1.6-9.3 x 0.4-4.7 cm, terminal leaflet 2.4-10.8(- 15.0) x 0.5-6.8 cm, all elliptic to oblanceolate to obovate or linear, sometimes broadly so, rarely suborbicular, rhombic or spathulate, bases cuneate except in asymmetric posterior leaflets, apices rounded to truncate or rarely slightly emarginate, with an apiculus of very variable length formed by the excurrent midrib, each leaflet with a single midrib. Male inflorescences either solitary or in clusters in axils of vegetative shoots or compound, floral bracts subdense to dense and covering rachis, giving a catkin-like appearance, 0.4-7.8 cm long, spicate, peduncles 0.2-3.1(- 5) cm long or rarely inflorescence sessile; female inflorescence 0.7-11.8 mm long, peduncle 0.8-12.8 cm long. Flowers often sweetly scented, tepals scarcely differentiated. Male flower sessile to pedicellate, pedicel to 1.3(-2) mm long; floral bracts 1 per pedicel, 2.3-6.7(-8.5) x 0.8-4.6 mm, ovate to lanceolate or elliptic, apex acute to long-acuminate, white, cream, yellow, pink or green, flower often darker; outer tepals 0.9-2.3 x 0.4-1.5 mm, ovate to lanceolate, acute to acuminate, chartaceous, dorsally pubescent; inner tepals 0.9-2.4 x 0.3-1.2 mm, ovate to lanceolate, acute to acuminate, membranous, ± glabrous; anthers 0.2-0.6 x 0.2-0.7 mm, globose, filaments 0.05-0.2 mm, staminodes 0.6-1.7 mm long, apex petaloid, oblong to elliptic, acuminate, base filiform. Female flower sessile; floral bracts 1.9-6.1 x 0.8-4.6 mm, ovate to lanceolate, acute to acuminate; outer tepals 0.8-2.3 x 0.4-1.3 mm, inner tepals 0.8-2.3 x 0.3-1.1 mm, broadly elliptic to elliptic-oblong, concave, each subtending a staminode, 0.5-0.4 mm long, clavate, ovary 2.1-6.1 mm long at an thesis, oblong to elliptic, pubescent, style 0.2-0.6(-0.7) mm, stigma lobes spreading, linear. Capsule 15-34 x 9-18 mm, oblong to elliptic or slightly obovate in outline, base truncate to slightly cordate, apex obtuse to rounded, indumentum sparse except near axis. Seed 3.5-7 x 2-4 mm, often with a small apical projection, wing 4-14 x 2.5-6 mm, oblong to elliptic, apex obtuse to truncate.
