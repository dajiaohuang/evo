          title: Celtis iguanaea (Jacq.) Sarg., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: "Andromonoecious shrubs or small trees to 12 m. tall, the branches flexuose, armed with short recurved spines. Leaves ovate to broadly elliptic, 3-11 cm. long 1.5-4.5 cm. broad, acute or attenuate at the apex, obtuse to subcordate at the base, slightly inequilateral, 3-nerved at the base, sparsely pubescent to glabrous above and below, serrate at least toward the apex; petiole 0.5-1.0 cm. long. Inflorescence cymose, fasciculate. Bisexual flowers: sepals 5, about 1.5 mm. long, 0.75 mm. broad, connate at the base, margin ciliate, greenish-yellow; stamens 5, exserted, the filaments 1.5 mm. long, glabrous, the anthers 1 mm. long, 0.75 mm. broad, the torus hairy; ovary more or less cylindrical, shortly hairy, the styles 2, fused at the base. Staminate flowers with rudimentary pistil. Flowers described from Mexican specimens. Fruit ovoid, 8-12 mm. long, 6-8 mm. in diameter, yellow, orange or red."
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 13572
          archiveSourceId: C6F31291-AB6F-41ED-A614-B6B26CE964DD
