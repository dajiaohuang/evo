    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Usually single-stemmed with only one rosette, sometimes branched into two, erect, 0.5-2 m tall. Leaves long, relatively narrow, ± 400 mm long, 80 mm wide at base, usually with small white spots on upper and particularly lower surfaces, margins with reddish brown triangular teeth. Flowers in repeatedly branched, broadly triangular racemes, orange-red with greenish yellow tips.
            textZh: Aloe khamiesensis Pillans 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_14533_0
            locator: "SANBI/WFO archive Morphology row 32895; source identifier 14533.0; cited publication: Klopper, RR; Smith, GF. 2013. Asphodelaceae: Aloe. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 45 - 48. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: A. khamiesensis is a very distinctive species, closely allied to A. framesii in leaf, racemes, pedicels and flowers, but differs chiefly in having longer leaves, larger rosettes, and an erect stout stem 3-5 ft. high, and a 4-8-branched inflorescence. It grows in mountainous country, while A. framesii is found in the coastal belt, usually in large dense groups.
            textZh: SANBI 条目提供了 Aloe khamiesensis Pillans 的鉴别特征。
