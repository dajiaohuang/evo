          publishedAt: undated
          originalSourceText: Annual or short-lived perennial erect herbs or subshrubs to 0.9 m tall, sparingly branched; stems greenish to slightly reddish, terete, slightly striate, usually broadly fistulose, long-pilose and minutely puberulous. Leaves mostly opposite; blades broadly ovate to deltoid, to 10 cm long and 8 cm wide, the base usually truncate or slightly cordate, strongly trinervate, the margins crenate to serrate-crenate, the apex short-acute to narrowly rounded or obtuse, the upper surface dull green, sparsely long-pilose, the lower surface scarcely paler, sparsely long-pilose on the veins and veinlets, glandular punctations often lacking; petioles to 4 cm long. Inflorescence cymose to subcorymbose with densely corymbose to subumbellate branches, the branches densely puberulous with few to many longer hairs, the ultimate branches 1-8 mm long, not or scarcely enlarged distally. Heads 4.5-6.5 mm high with 50-75 florets; involucral bracts 20-30, eximbricate, in 2 series,
