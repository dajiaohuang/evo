        usage:
          title: Guettarda foliacea Standl., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Trees, to 15 m tall, or shrubs, the twiglets terete, smooth, glabrous, ultimately pubescent, often with spreading lateral branches. Leaves often crowded at the apex of the twiglets, obovate oblong to elliptic, 3-17 cm long, 1.2-6.5 cm wide, widely deltoid or rounded at the apex, the acumen short or absent, less than 1 cm long, basally obtuse or truncate, rarely acute or subcordate, usually inequi- lateral, the costa prominulous beneath, the lateral veins 8-10, arcuate, the veinlets pinnatiform, stiffly membranous or chartaceous, concolorous or discolorous, the hairs above white or scattered, the hairs beneath short or long, appressed or spreading, often strigose, appearing shaggy, the axils often barbate; petioles 0.8- 2.0 cm long, slender, puberulent; stipules not seen. Inflorescences axillary, usu- ally spreading, the peduncle slender, to 3 cm long, ca. 0.5 mm wide, pubescent, the few branches short and often secundly disposed; bracts deciduous, oblong, to 6 mm long, ca. 1 mm wide, sericeous, the calycine cup cupuliform, scarious, usually slightly longer than the hypanthium, sericeous, truncate, the teeth absent; corolla white, the tube narrowly cylindrical, to 1.5 cm long, ca. 1 mm wide in the middle, sericeous outside, glabrous within, the lobes 4-5, oblong, ca. 3 mm long, obtuse, thinly carnose, sericeous outside, the anthers subsessile, narrowly ob- long, 3 mm long, attached ca. 2 mm below the mouth; style slender, the stigmas compressed, capitate rotund, ca. 0.25 mm long. Fruits sessile, rotund, 0.8- 1.5(-2.0) cm in diam., finely velutinous, red at maturity.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 11687
