        usage:
          title: Justicia trichotoma (Kuntze) Leonard, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrubs to 1.5 m tall; stems erect, subquadrangular, the lower portions terete, strigose. Leaves ovate to ovate lanceolate, one blade of each pair conspicuously larger than the other, the larger blade to 11 cm long, 4 cm wide, the smaller blade to 6.5 cm long, 2.5 cm wide, all apically acuminate, basally attenuate, sparingly strigose above, pubescence mostly restricted to the costa, the lower surface similar, but more pubescent, the cystoliths inconspicuous, visible on the lower surface only, the margins undulate; unwinged portions of petiole to 1 cm long, strigose. Inflorescences in small axillary cymes, the peduncles to 2.5 cm long, strigose; bracts and bracteoles subulate, to 1.5 mm long, 0.5 mm wide basally, strigose. Flowers sessile, calyx 5-merous, the segments narrowly subulate, to 6 mm long, 1 mm wide, puberulous; corolla violet, to 2 cm long, puberulous, the tube funnelform, 1.5 mm wide basally, 4 mm wide at the mouth, the upper lip 6 mm long, 4 mm wide, apically acute, the lower lip 7 mm long, 3-lobed, the lobes 3 mm long, apically obtuse, the middle lobe 2.5 mm wide, the lateral lobes 2 mm wide; stamens exserted to about the tip of the upper lip, the anther cells superposed, the lower cell calcarate. Capsules clavate, to 10 mm long, 2 mm wide, 1 mm thick, puberulous; seeds dark brown, suborbicular, ca. 2 mm in diameter, roughened.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 226
