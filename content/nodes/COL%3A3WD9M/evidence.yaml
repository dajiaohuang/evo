    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Herb, hydrophyte, 0.5-1.0 m long; stems prostrate or erect, rooting at nodes, with conspicuous, white, erect, spindle-shaped pneumatophores clustered at nodes of floating stems and from roots. Leaves narrowly lanceolate, 6-12 main veins on each side of midrib. Flowers solitary in leaf axils. Sepals 5; up to 14 x 2.8 mm. Petals up to 18 x 10 mm. Stamens 10; pollen shed singly. Fruit a terete capsule, up to 30 mm long, longitudinally 10-ribbed, bulged at 1.5 mm intervals, light brown, thick walled, tardily dehiscent; pedicels up to 20 mm long. Seeds uniseriate, up to 1.3 mm long, pale brown, firmly embedded in coherent cubes of woody endocarp.
            sourceIds:
