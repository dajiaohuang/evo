      claimType: morphology
      statement: PMO 214.214 and WDC-MG-210 are part and counterpart of one approximately 47.5 Ma Darwinius holotype preserving an exceptionally complete juvenile skeleton; its crown placement is not directly observed.
      confidence: high
      confidenceRationale: High confidence applies to the documented specimen identity and anatomy, while the preparation disclosure and interpretation-sensitive sex, ecology and topology remain explicit.
