        status: partially-supported
        claims:
          - text: Creeping, succulent shrub, rooting at almost each node, forming densely leaved mats, up to 1 m diam., internodes shining, spongy, > 4 mm diam. Leaves much longer than internodes, trigonous to almost club-shaped, up to 40 mm long, ± 14 mm thick. Flowers solitary, on very short, erect shoots, pedicels 10-20 mm long, sepals 5, petals 13-29 mm long, yellow. Fruit base funnel-shaped, top flat, 8-10 mm diam.
