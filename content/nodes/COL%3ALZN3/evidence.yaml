          publishedAt: undated
          originalSourceText: Epiphytic shrub or vine, also becoming an independent tree and reported 12 m. tall, glabrous or nearly so; petioles 5-12 mm. long; leaf-blades commonly obovate-oblong, 5-10 cm. long, two-fifths to three-fifths as wide, rather gradually acuminate to a slender tip, cuneate to the base, apparently 3-pli-nerved but with another pair of submarginal veins; secondary veins about 0.5 mm. apart; pedicels solitary, slender, glabrous, 3-6 cm. long; outer bracts ovate, foliaceous, 2-3 cm. long, many-nerved, much exceeding the inner ones and the calyx; calyx truncate, the lobes represented by minute tubercles only; petals pink, broadly and obliquely obovate, 1.5-2 cm. long.
