    facets:
      morphology:
        status: partially-supported
        claims:
          - text: "Plants one-to several-stemmed. Leavei soft, erect at first, later arcuate, 400-700 x 2-1 mm, ± triangular in cross section with a narrov channel above, slightly keeled below; margin and keel smooth or remotely denticulate toward; apex. Scape 400-650 mm tall, overtopping arcu ate leaves. Raceme usually lax, rarely subdense oblong-cylindrical, 80-250 x 5-6 mm; bud cream-coloured or dull yellow to orange-red flowers pendulous, often somewhat arcuate, vary ing in colour from white to cream, yellow or coral-red. Bracts lanceolate to linear-lanceolate acute to acuminate, 6-10 mm long. Pedicels 2-3 mm long. Perianth subcylindrical, often slightly arcuate, 19-30 mm long; lobes ovate, 2.5 mm long, not or scarcely spreading. Stamens included or slightly exserted at anthesis, later withdrawn. Fruit subglobose to ovoid, ±6 mm long. Flowening time: end of November to early April with a peak from January to March."
            textZh: Kniphofia angustifolia (Baker) Codd 的 SANBI 物种条目记录了形态特征。
