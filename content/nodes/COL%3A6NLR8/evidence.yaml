          - text: The variation may occur within a small area and the situation resembles the hybrid swarms reported under K. fibrosa. Here again it is assumed that the longer perianth and reddish colours are contributed by K. triangularis, which has dense, concolorous racemes, orange-red to coral-red in colour, with flowers 24-35 m long. Specimens with flowers about 30 mm long may be confused with K. ichopensis var. ichopensi, but the two can usually be separated on the basis of leaf width which, in K. angustifolia, does not exceed 5 mm.
