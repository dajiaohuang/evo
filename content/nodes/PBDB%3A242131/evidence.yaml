  claim-rationales.zh:
    - Beiyanerpeton：具名材料和已发表的系统或系统发育处理支持这一有限鉴定。置信度保持中等，因为画像不会把取样位置转化为直接祖先或普遍共识。
    - Beiyanerpeton：一手研究直接报告了具名地点与层位。置信度为中等，因为单一研究样本不能确定缺失、特有性或全球地理范围。
    - Beiyanerpeton：证据边界是明确的：保留沉积或解剖背景，同时不填补无依据的行为与生态位。中等置信度针对这一有限的否定性陈述，而非重建生态。
    - Beiyanerpeton：所引图件与描述直接记录了具名解剖观察。由于保存与标本取样限制了性状完整性和变异，置信度为中等而非普遍结论。
    - Beiyanerpeton：一手来源与具体定位符支持显示的样本区间。置信度为中等，因为该包络明确限定于标本或地点，而非全球首现或末现。
  claim-statements.zh:
    - Beiyanerpeton 由正模 PKUP V0601 与标本 PKUP V0602–V0606 代表，在已发表矩阵中位于蝾螈总科内部。
    - 六件 Beiyanerpeton 标本来自中国辽西横道子 Tiaojishan 组；不据此推断全球延限。
    - 幼体结构可用于发育解释，但食性、精确栖息地偏好、运动性能与营养行会仍无直接证据。
    - 关节连接的 Beiyanerpeton 标本系列保存了蝾螈总科解剖与被解释为幼态延续证据的幼体结构。
    - 显示的 160–154 Ma 区间限定牛津期样本；157 ± 3 Ma 锆石年龄来自上覆岩层而非骨架本身。
