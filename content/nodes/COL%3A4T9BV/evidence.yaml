        claims:
          - text: "Shrub or dwarf shrub, succulent, 0.3-0.9 m high. Stems: old stems nude, bark rough, grey, young stems smooth with prominent ridges. Leaves sessile; bifoliolate; leaflets obovate to broadly obovate, 5-8 x 3.5-4.5 mm, base oblique or somewhat cuneate, apex rounded. Stipules triangular, 0.5 mm long. Flowers solitary, axillary. Sepals 5, ovate or obovate, 3.5-4.5 x 2-3 mm. Petals 5, obovate, 9-14 x 4-8 mm, apex obtuse, base with a long claw; yellow, with red or reddish brown markings. Fruit drooping, subspherical, 8-10 x 6-8 mm, ridged. Flowering time Aug., Sept.?."
