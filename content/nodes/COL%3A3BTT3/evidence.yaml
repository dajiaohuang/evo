    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Small, virgate, single- to multi-stemmed shrub, 1-2 m high. Branches hairy when young, glabrescent when older. Leaves broadly ovate to elliptic, crowded at ends of branches. Inflorescence a pseudoraceme. Corolla cleft halfway down, glabrous except for median line of appressed bristles. Flowers greenish yellow to dull white; November, February and May.
            sourceIds:
              - sanbi_11118_0
            locator: "SANBI/WFO archive Morphology row 1904; source 11118.0; publication: Herman, PPJ; Retief, E. 1997. Plants of the northern provinces of South Africa: Keys and diagnostic characters. Strelitzia 6: 1 - 681. National Botanical Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: E. dewinteri is most closely related to E. crispa, especially in flower structure. Our species differs from E. crispa in (i) having the leaf blades ovate to elliptic and not obovate to lanceolate; (ii) not having leaf blades with undulate margins; and (iii) having much shorter peduncles than E. crispa. E. dewinteri differs from the other known species of the genus in growth form, being a virgate single- or multi-stemmed shrublet, 1-2 m high with divaricate branching at the end of the stems.
