          - text: Leaves very unequal and usually 2–5 times as long as broad. Perennial succulent with prostrate stems to 6 cm long, flowering branches erect, branches with 4 leaves. Leaves spreading, fused for ±8 mm at base, 23-26 x 9 mm at base, top flat, glaucous, velvety. Flowers solitary on pedicels 20-24 mm long, purplish, 25 mm diam. Fruits 6- or 7-locular.
