        claims:
          - text: An erect herb, glabrous, 4-7 in. high, glaucescent, annual; leaves ovate, somewhat acute or obtuse at the apex, serrate or cuneate-dentate, shortly petiolate or subsessile, 1/2-1 in. long, 1/4-1/2 in. broad, opposite or the floral alternate, successively smaller and subamplexicaul; racemes terminal, few- or several-flowered; pedicels 1/4-2/3 in. long; calyx-segments broadly ovate or oval, rounded or obtuse at the apex, green and very narrowly bordered with white, 1/10-1/7 in. long, 1/16-1/9 in. broad; upper corolla-lobes oval, emarginate, 1/4-1/3 in. long, 1/8-1/6 in. broad; lower lip deeply bilobed, 1/4 in. long, 3/8 in. broad; palate nearly glabrous, bicallose; spur very broad, conical, somewhat pointed, 1/4-2/7 in. long, 1/5-1/4 in. broad.
