  claim-rationales.zh:
    - 热河真三尖齿兽的分类表述只覆盖具名标本及所引主研究的分析范围；导航归属不表示直系祖先或普适系统树。
    - 热河真三尖齿兽的地理字段只投影主研究记录的具体产地，不外推为全球分布、起源中心或完整扩散路径。
    - 热河真三尖齿兽的生态字段区分保存事实与功能推断；未被标本直接记录的饮食、行为、栖息地或性能均明确保留不确定性。
    - 热河真三尖齿兽的形态字段限定于主研究列明的具名标本和精确页码、图版或补充材料，不外推到整个支系。
    - 热河真三尖齿兽的年代范围是主研究标本或地层背景的有界投影，不作为全球首现、末现、分化时间或连续谱系时长。
  claim-statements.zh:
    - IVPP V16051 是 Liaoconodon hui 的正模，来源研究将其视为真三尖齿兽；这里的导航归位不主张直接祖先关系。
    - 本资料所述产出仅限于辽宁建昌附近九佛堂组，并非真三尖齿兽目的完整地理范围。
    - 牙齿支持小型食肉动物的解释，骨架支持陆生运动；但食性、栖息地利用和运动表现均未被直接观察。
    - 这件近完整正模保存了已脱离齿骨、但仍由骨化麦氏软骨连接的外鼓骨和锤骨。
    - 1.214 亿至 1.132 亿年前的展示区间，是对阿普特期地层背景的换算，并非标本直接测年、全球首次或末次出现，也不是普遍适用的颌—耳过渡区间。
