  claims:
    - subjectId: event:miacoidea-character-matrix-topology
      claimKind: scientific
      claimType: topology
      statement: The published 99-character analysis places sampled Vulpavus, Uintacyon and Miacis-grade taxa outside crown Carnivora and does not recover traditional “Miacidae” or Viverravidae as simple stem branches of Feliformia and Caniformia.
      confidence: medium
      confidenceRationale: “Miacoidea” character-matrix topology uses explicit named specimens or disclosed datasets, but placement, function or ecology depends on a sampled matrix or comparative model and is kept separate from observation.
      referenceLinks:
        - referenceId: wesley-hunt-flynn-2005-miacoidea
          relation: supports
          pages: 1–28
          figure: Figures 1–6; Appendices 1–3
          quoteLocator: Character descriptions; Phylogenetic analyses; Discussion of Miacoidea
  claim-rationales.zh:
    - ““细齿兽总科”性状矩阵拓扑”的具名标本或已公开数据集是明确的，但位置、功能或生态依赖采样矩阵或比较模型，且已与直接观察分开。
  claim-statements.zh:
    - 已发表的 99 性状分析把所取样的 Vulpavus、Uintacyon 和 Miacis 级分类单元置于食肉目冠群之外，也没有把传统“Miacidae”或 Viverravidae 恢复为猫型亚目与犬型亚目的简单干群分支。
