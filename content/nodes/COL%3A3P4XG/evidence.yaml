        usage:
          title: Hyptis brevipes Poit., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Herbs, annual, erect or sometimes sprawling, to 60 cm, pubescent, the hairs long and uniseriate. Leaves lanceolate-elliptic, rarely rhomboid-ovate, acute, doubly or irregularly serrate, the bases attenuate, to 5 cm long and 2 cm wide, pubescent on both surfaces, more so on the veins beneath, resin-dotted; sessile to petioles ca 1 cm long. Inflorescences capitula, ca 1 cm in diam, the peduncles ca 0.5-1 cm long, the bracts awl-shaped and ciliate, ca 4-6 mm long. Flowers sessile, tufts of hairs at the bases; calyx ? campanulate, 3-3.5 mm long at maturity, lightly pubescent within near the orifice, obscurely 10-nerved, the teeth spinulose, ca 1.5-2 mm long; corolla ca 3 mm long, white, the lower lip ca 0.6-0.8 mm long, pubescent, the hairs uniseriate; stamens weakly exserted, the filaments ? pubescent, the anthers ca 0.2 mm long; styles ca 3 mm long, the lobes small. Nutlets 4, oblong-ovoid, ca 0.6 mm long, the pericarps slightly roughened, dark brown.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 6631
