        usage:
          title: Kallstroemia pubescens (G.Don) Dandy, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Annual herb; stems prostrate to decumbent, to 1 m long, hirsute and sericeous with apically-directed fine white trichomes. Leaves obovate, to 2 cm long and 1 cm wide; leaflets (2-)3 pairs, elliptical to obovate, appressed-hirsute to glabrate, veins and margins more or less sericeous, to 11 mm long and 5 mm wide, terminal pair largest. Flowers ca 1 cm in diam; peduncles 5-15 mm long; sepals lanceolate, 3.5-4 mm long, 1.5 mm wide, in flower ca-as -Jong as style, hispidulous with fine, white trichomes of two lengths, spreading from base of mature fruit and appearing linear-lanceolate through margins becoming sharply involute, persistent; petals yellow, obovate, ca 6 mm long and 5 mm wide, marcescent; ovary pyra- midal, 4 mm long including style, densely appressed short-pilose with fine white trichomes, the style stout, conical, the stigma capitate, ca 1 mm long, obscurely 10-lobed, papillose. Fruit ovoid, 5-6 mm in diam, densely appressed short-pilose, the beak ca 3 mm long, ca as long as fruit body, short-pilose, cylindrical, the base conical; mericarps 3-4 mm high, ca 1 mm wide, abaxially cross-ridged and tubercled, adaxial edge angled.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 14018
          archiveSourceId: FC2D9413-9CA9-4353-A064-671A91A2BD0F
