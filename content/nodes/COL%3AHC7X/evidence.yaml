    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Under experimental exposure to dichlobenil, laboratory-grown A. nidulans showed altered hyphal morphology and growth; the study also found changes in cell-wall-related gene expression. The result is specific to the tested inhibitor and conditions and is not a description of untreated natural morphology.
            originalLanguage: en
            sourceIds:
              - guerriero2013AspergillusDichlobenil
            locator: Abstract and Results; article summary of growth, spore-germination, gene-expression, and ultrastructural observations.
            placeTimeScope: Laboratory cultures under dichlobenil exposure; observations included 0, 1, 3, 6, and 24 hour time points.
            lifeStatus: Cultured fungus under experimental treatment.
          - text: In laboratory experiments, Hülle cells were observed at multiple locations along hyphae, and germinated Hülle cells grew hyphae that developed into spore-producing colonies. This documents a specialized cell form and developmental response under experimental conditions.
            originalLanguage: en
            sourceIds:
              - troppens2020AspergillusHulleCells
            locator: Abstract; Results on Hülle-cell distribution and germination.
            placeTimeScope: Laboratory-grown A. nidulans material in a 2020 cell-biology study.
            lifeStatus: Cultured fungus; not a field population.
        gaps:
          - Normal diagnostic morphology, environmental and strain variation, developmental-stage measurements, and identification limits have not been assessed.
      lifeHistory:
        status: partially-supported
        claims:
          - text: A laboratory study demonstrated that A. nidulans Hülle cells can germinate, grow hyphae, and form colonies that produce conidiospores; Hülle-cell-derived colonies produced conidiospores sooner than spore-derived colonies in the reported experiment. This is a bounded developmental observation, not a full life-cycle account.
            originalLanguage: en
            sourceIds:
              - troppens2020AspergillusHulleCells
            locator: Abstract and Results on Hülle-cell germination and colony conidiospore production.
            placeTimeScope: Laboratory developmental experiments reported in 2020; source does not establish frequencies in wild conditions.
            lifeStatus: Cultured fungus under experimental conditions.
        gaps:
          - Sexual and asexual cycle timing, mating compatibility across natural populations, dispersal, and environmental stage transitions require broader evidence.
