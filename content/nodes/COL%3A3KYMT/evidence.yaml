    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plant stemless or nearly so, branching at the base and forming a clump 3-4 1/2 (or including the flowers about 7-8) cm high. Leaves 6-8 to a growth, cruciately opposite, crowded, connate, the outer widely spreading, the inner incurved-ascending, 2-3 1/2 cm long, 5-7 mm broad and 3-4 mm thick at the base, flat above, with obtuse side angles, rounded on the back at the base and obtusely keeled (often obliquely) at the apical part, gradually tapering from the base to an acute apex when viewed from above, and in side view most of them of about the same thickness for three-fourths of their length, then tapering to an acute point, others with the keel at the apical third dilated so that the leaf is there about 5-5 1/2 mm thick, acute; surface glabrous, rough, from being densely covered with minute tubercles all over, dull green, with a slight greyish (or scarcely glaucous) tint and the dot-like tubercles dark green. Perhaps when exposed to the sun in the open air the leaves may be more or less purple-tinted. Peduncle terminal, 1-3-flowered, 4-5 cm long and about 2 mm thick, with a pair of bracts 5-7 mm above its base. Bracts about 7 mm long, erect, resembling reduced leaves, acute. Calyx 5-lobed, green or reddish, tuberculate-dotted like the leaves; lobes subequal, revolute at the tips, 5-7 mm long and 4-4 1/2 mm broad, oblong-ovate, obtuse, one of them narrowly membrane-margined at the apex. Corolla about 2 1/2 cm in diameter, but only seen when faded; petals numerous, apparently in 2-3 (or more?) series, 7-12 mm long, 1 mm broad, linear, acute, light yellow, not gland-dotted when dry. Stamens numerous, 3-5 mm long. Stigmas 5 in the flower examined, free to the base, much exceeding the stamens, about 11 mm long, filiform.
