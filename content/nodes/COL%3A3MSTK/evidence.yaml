    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Leafless succulent with stems cylindrical and tesselated, teeth in 6-8, often spiralling rows; sap clear. Flowers campanulate, cream-coloured with brown-red spots.
            sourceIds:
              - sanbi_14102_0
            locator: "SANBI/WFO archive Morphology row 9787; source 14102.0; publication: Bruyns, PV. 2012. Apocynaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 331 - 343. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: "Huernia longii is unique in Huernia for the rhizomatous habit of the stems. These form groups from which the outer stems spread for up to 30 cm horizontally underground and then rise to the surface to form new clumps away from the parent plant. Along the stems the tubercles are arranged into 6-9 clear rows which are often slightly spiralled. Each tubercle is tipped by a small tooth which gradually wears off with age. The stems bear a remarkable resemblance to those of, say Echidnopsis montana and share with this species also the rhizomatous habit. Florally, E. montana is, of course, very different. Florally H. longii and H. pillansii are very similar. In H. longii the corolla lobes vary from a little longer than broad to twice as long as broad but do not taper into slender tips. The shape of the tube and the spotting of red-brown on cream inside the flower are also very similar to those of H. pillansii. As in that species, there are papillae all over the corolla to about halfway down the tube where they abruptly end and they are banded with red-brown on cream. The outer corona is indistinguishable from that in H. pillansii and is also dark maroon, while in the inner corona there is some variation, on the basis of which two subspecies are recognised: in both it has a swollen, bristly apex. In H. longii the flowers emit a faint excrement-like odour."
            textZh: SANBI 条目提供了该种的鉴别特征。
            sourceIds:
