          originalSourceText: Lianas; stems covered with short brownish or yellowish ascending, appressed trichomes, glabrescent. Leaves coriaceous, elliptic-oblong to oval, 4-7.5 cm long, apically rounded, muricate, basally rounded, appressed pilose above, densely yellowish pilose to tomentose below. Flowers several in axillary compound cymes; sepals lanceolate-oblong to ovate-oblong, 1-1.5 cm long, acute, yellowish ap- pressed-pilose; corolla white, 1.5-2 cm long, interplicae hirsute, styles 2, free to ovary apex, the 2 stigmas globose. Fruits capsular, subconical, apically hirsute; seeds ovate, black, glabrous.
