        usage:
          title: Rondeletia panamensis DC., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrubs or trees to 6 m tall, the branchlets terete, white tomentose to glabrous. Leaves elliptic to subovate, 2-15 cm long, 1.3-7.0 cm wide, acute to subacumi- nate at the apex, attenuate basally, the lateral veins 6-9, strongly arcuate as- cending, stiffly papyraceous to subcoriaceous, discolorous, the tertiary veins per- pendicular; petioles scarcely measurable or to 1.2 cm long, white tomentose to glabrate; stipules deltoid, 3-5 mm long, 2.0-6.5 cm wide, the cusp ca. 2 mm long, tomentose to glabrate. Inflorescences terminal, axillary, the peduncle to 4 mm long, the dichasia compound, tomentose to glabrate. Flowers pentamerous, ped- icellate, the pedicels to 7 mm long; hypanthium small, rotund, ca. 2.5 mm long, truncate, white tomentose, the calycine cup ca. 1.5 mm long, the lobes 5, subu- late, ca. 8 mm long, ca. 2.5 mm wide, petaloid, densely sericeous within at the base; corolla white, the tube 11-18 mm long, petaloid, villosulose outside, mod- erately so within except dense near the mouth, the latter with a ringlike callosity, the lobes 4, subrotund, ca. 5 mm in diam., 1 lobe ca. 3 mm in diam., anthers oblong, ca. 2 mm long, the filaments ca. 2 mm long; ovarian disc ringlike, ca. 3 mm deep, the style linear, ca. 8 mm long. Fruits rotund, to I cm in diam., sparsely tomentose, dehiscing loculicidally, the calycine lobes conspicuous, persistent.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 12233
          archiveSourceId: 694F0EE4-0E0C-4130-AD1F-1997C87AD9CB
