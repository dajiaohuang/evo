        usage:
          title: Begonia stigmosa Lindl., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: strongly asymmetric, very broadly ovate or suborbicular, abruptly acuminate and usually with a second cusp more nearly opposite the petiole, cordate at base, 15-30 cm. long, scarcely if at all lobed, ciliate-denticulate, thin, glabrous above or with a few small white trichomes, the nerves beneath bearing trichomes like those on the petiole but smaller, petioles erect, to 38 cm. long, 4-10 mm. in diameter, covered with spreading to reflexed narrowly triangular lacerate pink scales 3-5 mm. long, stipules tardily deciduous, lanceolate, pilose, membranaceous, 15-20 mm. long. Peduncle 2-5 dm. long, 7 mmn. in diameter, soon glabrous. Cymes bisexual, nearly regular, few- to many-flowered, 7-22 cm. long, lax, glabrous. Bracts quickly deciduous, oblong, acute, fimbriate. Pedicels slender, 7-23 mm. long. Flowers white or pink. Staminate tepals 2, suborbicular, cordate at base, 10-15 mm. long. Stamens free, very numerous, filaments much longer than the broadly oblong anthers, connective apiculate-produced. Bracteoles lacking. Pistillate tepals 2 like the staminate or rarely a smaller one inside the others. Ovary 3-celled, placentae bifid, ovuliferous throughout, styles bifid, the stigmatic tissue linear, spiral, con- tinuous. Capsule erect, broadly ovoid, 6-8 mm. long, wings very unequal, the largest oblong or subdolabriform, 10-15 mm. wide. the others narrowly margini- form.
