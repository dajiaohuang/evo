          - text: Schoenus crassiculmis often appears semi-succulent in the field, with basal leaves that are reduced in length. This species also has relatively short proximal and subproximal glumes. Schoenus auritus appears similar in that it also usually appears semi-succulent in the field; however, the leaves of S. crassiculmis never exceed half the length of the culm, whereas those of S. auritus can be longer than half the culm length. In addition, the lower glumes of S. crassiculmis are relatively short (not over half the spikelet length), while S. auritus has longer glumes that mostly exceed half the spikelet length. Bristles and vestigial stigmas have not been observed in S. crassiculmis, but these structures have been observed in S. auritus. Furthermore, S. crassiculmis does not have the membranaceous leaf sheaths that are present in S. auritus. Finally, although the proximal and subproximal primary inflorescence bracts of S. crassiculmis can sometimes be slightly expanded laterally, this expansion is not as notable as in S. auritus.
