    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Caespitose, phyllopodic perennial graminoid, often appearing semi-succulent. Culms terete, robust, (110-)225-327(-468) x 0.5-1.4 mm. Leaves basal, reduced in length and width, 1-4, (7-)18-52(-87) x 0.3-0.5(-1.4) mm, can be straight or curled, often proximally channelled but sometimes flat, margin usually serrate above sheath. Sheaths varying in colour from brown to reddish-purple, firm, attenuate at leaf base, longitudinally striate. Ligule firm, 0.2-1.0 mm long. Inflorescence a pseudolateral panicle, 12-29(-46) x 3-8(-14) mm, proximal rachis length (4-)7-19 mm. Proximal primary inflorescence bracts firm, not channelled, apex acute, rarely slightly widened at base, (22-)33-47(-64) mm long, exceeding length of inflorescence 0.5 times or more, with longitudinal veins. Proximal and subproximal primary inflorescence bracts without membranaceous extensions at base. Spikes 2-13(-16), 4.0-10.0(-20.0) mm long, overlapping, often contracted. Spikelets lanceolate, 3.4-4.8(-6.3) x 0.7-1.4 mm, pedicellate, 1-4(-7) spikelets per spike, reddish-brown in colour. Proximal spikelet prophyll 1 per spikelet, well-developed, with raised central vein extending to mucro, 0.5-2.3 mm long, prophyll mucro 0.8-2.3(-3.8) mm long. Rachilla 0.4-1.8(-3.5) mm long. Glumes 4-7 per spikelet, proximal glume 0.6-1.9 mm long, subproximal glume 0.6-2.1 mm long, with or without narrow hyaline margin, upper glumes longer than basal ones, apex acute to acuminate. Glume mucros usually relatively short, proximal mucro 0.1-0.7(-2.0) mm long, subproximal mucro 0.1-0.7 mm long. Stamens 3 per floret, anthers 1.6-2.7(-3.8) mm long. Stigmas 3-branched, vestigial stigmas of second bisexual floret not observed. Perianth bristles lacking. Nutlet broad elliptic, trigonous, yellowish in colour, 2.0-2.5 x0.7-1.5 mm. Nutlet beak, 0.2-0.9 mm long, hispid.
