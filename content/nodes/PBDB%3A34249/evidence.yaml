  claims:
    - subjectId: taxon:placodermi
      claimKind: scientific
      claimType: fossil-range
      statement: The Placodermi historical-grade display uses the approximately 436 Ma Huixingshao Formation Xiushanosteus sample as its evidence-linked older anchor; the 358.9 Ma younger edge remains a rounded composite, and neither endpoint is asserted as a global first or last appearance or a direct-ancestor interval.
      confidence: medium
      confidenceRationale: Multiple articulated Xiushanosteus specimens directly support an early Silurian placoderm-grade occurrence. Medium confidence retains the historical-grade boundary, sampling limits and the composite younger endpoint.
      referenceLinks:
        - referenceId: zhu-2022-chongqing-gnathostomes
          relation: supports
          pages: 954–958, especially 955–957
          figure: Figures 1–2; Extended Data Figures 1–7
          quoteLocator: Systematic palaeontology and description of Xiushanosteus; locality, horizon and phylogenetic analyses
  claim-rationales.zh:
    - 多件关节相连的 Xiushanosteus 标本直接支持早志留世盾皮鱼等级记录；中等置信度保留历史等级边界、取样限制和综合性的年轻端点。
  claim-statements.zh:
    - 盾皮鱼类历史等级的显示范围以约 4.36 亿年前回星哨组的 Xiushanosteus 样本作为有证据连接的老端锚点；3.589 亿年前的年轻端仍是取整后的综合边界，两个端点都不被表述为全球首现、末现或直系祖先区间。
