        usage:
          title: Viburnum costaricanum (Oerst.) Hemsl., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: glabrous, the twigs 4-15 mm long, sparsely to densely and mostly appressed- pubescent with simple hairs and sessile, pauciradiate stellate hairs, drying ochra- ceous or dark, yellowish, or greyish-brown; bud scales glabrous to tomentose, the outer pair ca. 1 mm long, the inner pair ca. 3 mm long. Leaves 5-9 cm long, entire or apically toothed, ovate, often with 1 or 2 pairs of glands near the base, apically acuminate, basally acute, acuminate, obtuse, or rounded, glabrate with sessile pauciradiate hairs on the principal veins above and beneath, mostly barbellate in the vein axils beneath, sometimes shiny, sometimes conspicuously reticulate- veined beneath; petioles 4-16 mm long, puberulent to strigose, channelled above; stipules absent. Inflorescences 2-4-times compound cymes 4-8 cm in diameter, terminal, the bracts deciduous, oblong, ciliate or sometimes strigose overall, 1-3 mm long, the bracteoles entire, obtuse, very short or sometimes exceeding the calyx tube, ciliate; peduncle and pedicels drying brown, pubescent with more or less appressed, sessile stellae and with simple hairs. Flowers white, strongly fragrant; calyx ca. 1 mm long, the tube cylindrical or obconical, mostly glabrate, lobed to ca. 1/4 of the day down, the lobes obtuse or rounded, ciliate but otherwise glabrate; corolla campanulate, glabrate with a few hairs near the apex of the tube, ca. 2.5 mm long, lobed to 2/% of the way down, the lobes quincuncial in bud and rounded; stamens exserted, the filaments narrowed apically, glabrous, the anthers ca. 1 mm long; superior portion of the ovary (style) glabrous or sometimes with occasional minute simple hairs, conical with indistinct longitudinal ridges, the stigmas 3, more or less connate, unappendaged. Fruit unknown.
          originalLanguage: en
          sourceField: general
