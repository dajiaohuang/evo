        claims:
          - text: Cormous geophyte, 50-75 cm, tunics papery, stems branched. Leaves sword-shaped. Flowers funnel-shaped, deep pink with red and white markings on lower tepals.
            textZh: Gladiolus phoenix Goldblatt & J.C.Manning 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 7267; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Diagnosed by the branched stems up to 750 mm high, relatively soft-textured leaves 6-20 mm wide, and the small, dark pink flowers with short perianth tube 18-20 mm long, and lower tepals each with a white lozenge-shaped nectar guide outlined with red. The corms develop characteristic short, fasciated stolons bearing clusters of small cormlets.
            textZh: SANBI 条目提供了 Gladiolus phoenix Goldblatt & J.C.Manning 的鉴别特征。
