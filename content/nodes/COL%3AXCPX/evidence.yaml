        usage:
          title: Columnea mira B.D.Morley, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Suffrutescent or vinelike herbs or shrubs, epiphytic; stems 3-6 mm in diam., red purple hirsute when young. Leaves of a pair unequal; larger leaf oblanceo- late, 5.3-8.1 cm long and 2.1-2.8 cm wide, the apex acute, oblique at the base, coarsely serrate, green above but conspicuously red hirsute, 4-8 celled, also 2-3 celled white adpressed hairs, concolorous red purple beneath, densely hirsute, the hairs red, 5-9 celled, also 2-3 celled white adpressed hairs; petioles absent or to 2 mm long; smaller leaves lanceolate, acuminate, serrate, ca. 8 mm long and 3 mm wide, green above, red purple beneath. Flowers solitary or paired; bracts ca. 4 mm long, linear, brown reddish pilose; pedicels 1.1-1.6 cm long, brown reddish pilose; calyx lobes lanceolate, 8-10 mm long and ca. 1.5 mm wide, acuminate, 2-3 toothed, the teeth linear, to 2 mm long, green, red hirsute; corollas yellow with 2 long chocolate or red stripes running from the sinuses of the anterior lobe and two shorter pale red stripes running from the sinuses between the lateral and the posterior lobes, somewhat ventricose, ca. 4.6 cm long, 3 mm in diam. above the base, becoming ca. 1.1 cm, contracted at the throat to ca. 8 mm in diam., externally reddish pilose, the lobed portion of the corolla 9 mm long, the lobes unequal, the posterior pair connate and ca. 7 mm long, bilobed, the anterior lobe ca. 6 mm long, all lobes spreading and linear oblong in outline; filaments yellow, glabrous, the anthers exserted, 1 mm long and 1.2 mm wide, the disc gland bilobed; ovary reddish pilose, the style reddish, glabrous, the stigma stomatomorphic. Fruits not seen.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 6183
