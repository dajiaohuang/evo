  claims:
    - subjectId: taxon:megachelicerax
      claimKind: scientific
      claimType: taxonomy
      statement: Megachelicerax cousteaui gen. et sp. nov. is described from holotype KUMIP 314091a,b; the profiled stem-chelicerate assignment remains a phylogenetic result, not direct ancestry.
      confidence: high
      confidenceRationale: The named taxon and holotype are explicit in the primary description, while placement is kept separate as an analysis-dependent conclusion.
