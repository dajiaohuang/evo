  claim-rationales.zh:
    - 惠勒组螯肢干群正模的分类字段限于 KUMIP 314091a,b 的具名分类；系统位置不会被改写为直系祖先。
    - 惠勒组螯肢干群正模的地理字段限于犹他州 Drumian 期惠勒组单一正模出现记录，不外推为全球分布。
    - 惠勒组螯肢干群正模的生态字段将巨型螯肢的功能推断同直接保存事实分开；猎物、行为与运动性能并未直接保存。
    - 惠勒组螯肢干群正模的形态字段限于正反模直接保存的螯肢、前体附肢和后体片层结构，并连接到精确图版。
    - 惠勒组螯肢干群正模的树形字段保留已发表矩阵的取样与方法依赖性；它不主张直接祖先—后代序列。
    - 巨螯肢虫属：置信度为中：继承的具体页码、图版或章节定位器支持具名标本或抽样分析的存在与范围；措辞有意把结论限制在该证据内，不把导航包络提升为全球生物边界、直接祖先或精确起源。
  claim-statements.zh:
    - 本档案限于犹他州鼓山期 Wheeler 组的正模标本，不能据此确定 Megachelicerax 的全球分布。
    - 大型捕食者的生态解释来自巨大螯肢及体制比较；猎物、行为和运动性能并未直接保存。
    - KUMIP 314091a,b 直接保存了巨大的三节螯肢、螯肢之后五对假双枝型前体附肢，以及带有片状薄片结构的后体附肢。
    - 贝叶斯和简约法分析将 Megachelicerax 恢复在螯肢类干群中，位于所采样的寒武纪 habeliid 类群与寒武纪之后的 synziphosurine 类群之间；这一拓扑不是直接祖先—后代序列。
    - 新属新种 Megachelicerax cousteaui 根据正模 KUMIP 314091a,b 描述；本档案中的干群螯肢类归属仍是系统发育分析结果，而非直系祖先关系。
    - Megachelicerax 在此由来自犹他州鼓阶惠勒组的正模 KUMIP 314091a、b 约束；这一具名正模背景不是全球分布或精确完整延限。
