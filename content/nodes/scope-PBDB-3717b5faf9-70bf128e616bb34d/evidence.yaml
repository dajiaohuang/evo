          relation: supports
          pages: 931–937; Figure 1; Extended Data Figures 1–2
          figure: Figure 1; Extended Data Figures 1–2
          quoteLocator: Megachelicerax cousteaui holotype KUMIP 314091a,b
    - subjectId: taxon:megachelicerax
      claimKind: scientific
      claimType: biogeography
      statement: This profile is restricted to the Drumian Wheeler Formation holotype from Utah and does not establish a global Megachelicerax distribution.
      confidence: high
      confidenceRationale: The named formation and locality anchor the specimen, but one occurrence does not delimit the taxon's full biogeography.
      referenceLinks:
        - referenceId: lerosey-aubril-ortega-2026-megachelicerax
          relation: supports
          pages: 931–937; Figure 1
          figure: Figure 1
          quoteLocator: Cambrian Drumian Wheeler Formation of Utah
    - subjectId: taxon:megachelicerax
      claimKind: scientific
      claimType: ecology
      statement: Large predatory ecology is inferred from massive chelicerae and body-plan comparisons; prey, behaviour and locomotor performance are not directly preserved.
      confidence: medium
      confidenceRationale: The holotype preserves feeding appendages but not a meal or observed behaviour, so ecological interpretation remains bounded.
      referenceLinks:
        - referenceId: lerosey-aubril-ortega-2026-megachelicerax
          relation: supports
          pages: 931–937; Figures 1–2; Extended Data Figure 3
          figure: Figures 1–2; Extended Data Figure 3
          quoteLocator: Massive chelicerae and inferred predatory body plan
    - subjectId: taxon:megachelicerax
      claimKind: scientific
      claimType: morphology
      statement: KUMIP 314091a,b directly preserves massive three-segmented chelicerae, five pseudobiramous post-cheliceral prosomal limb pairs and plate-like lamellae-bearing opisthosomal appendages.
      confidence: high
      confidenceRationale: The part and counterpart preserve the named external anatomy; homology and function are deliberately not treated as direct observations.
      referenceLinks:
        - referenceId: lerosey-aubril-ortega-2026-megachelicerax
          relation: supports
          pages: 931–937; Figures 1–2; Extended Data Figures 1–5
          figure: Figures 1–2; Extended Data Figures 1–5
          quoteLocator: Holotype external morphology and appendage anatomy
    - subjectId: taxon:megachelicerax
      claimKind: scientific
      claimType: topology
      statement: Bayesian and parsimony analyses recover Megachelicerax on the chelicerate stem between sampled Cambrian habeliids and post-Cambrian synziphosurines; this topology is not a direct ancestor–descendant sequence.
      confidence: medium
      confidenceRationale: The published matrices recover this placement, but branch order depends on character coding, taxon sampling and analytical method.
