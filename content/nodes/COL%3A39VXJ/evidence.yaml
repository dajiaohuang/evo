    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Possibly perennial or annual, densely tufted, up to 300 mm tall, densely glandular-hairy. Leaf blades 25-250 mm long, filiform or up to 7 mm wide. Nodes with a ring of hairs; culms often decumbent. Spikelets 3.0-5.5 mm long. Panicle spike-like, dense, unbranched; lemma awns hair-fringed; anthers 0.2-0.7(-1.2) mm long.
