        usage:
          title: Desmodium wydlerianum Urb., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Slender subshrubs, to 4 dm or more, often repent, the stem rooting at the nodes, angulate, striate, uncinulate puberulent. Leaves trifoliolate, stipulate, pet- iolate; stipules elliptic acuminate, striate, uncinulate puberulent over the abaxial surface, ciliate, to 6 mm long, 1.5 mm wide; petioles sulcate on the adaxial surface, striate, uncinulate pubescent and sparsely pilose, 5-4.5 cm long, the leaf rachis similar, more slender, 1.4-1.6 cm long; stipels lance attenuate, striate, uncinulate puberulent on the abaxial surface, ciliate, 1.5-3.5 mm long; petiolules stouter than the leaf rachis, densely pilose and uncinulate pubescent, 2.5-3 mm long; leaflets thin, dark green and often with a blotch above, much paler beneath, terminal leaflet ovate acuminate, truncate at the base, with undulate margins, uncinulate puberulent to pubescent on the midrib and the chief lateral veins, similarly pubescent over the whole surface or glabrescent, pubescence of the abaxial surface similar but less abundant and less conspicuous, 7-8 cm long, 5.5- 6 cm wide, the lateral leaflets similar but slightly oblique, 5-6.4 cm long, 3-3.5 cm wide. Inflorescence of axillary racemes, rachis angulate, ridged and grooved, uncinulate pubescent; bracts early deciduous, none seen on Panama specimens, primary bracts narrowly ovate, striate, puberulent, ciliate, ca. 1.5 mm long; sec- ondary bracts similar, 1/3 as long; pedicels borne singly, each subtended by 1 primary and 2 lateral secondary bracts, pubescent as the rachis or with sparsely scattered pilosity in addition, 1.2-1.6 cm long. Flowers with the calyx uncinulate puberulent throughout, teeth of both the lobes somewhat appressed pilose, the central tooth of the lower lobe 2.5-3.5 mm long, the lateral teeth to 3 mm long, the upper bifid lobe to 3 mm long; standard orbicular to obovate, short unguic- ulate, to 4.5 mm long, 3.5-4 mm wide, the wings suboblong and short unguiculate, to 4.5 mm long, 1.5-2 mm wide, the keel petals remotely scythe shaped, long unguiculate, 4.5-5 mm long, 2 mm wide. Loment stipitate to 3-articulate, the stipe 1-1.5 mm long, the articles densely uncinulate pubescent on the surfaces, the dorsal suture slightly invaginated, the ventral suture rounded, isthmi eccentric and narrow, 7-11.5 mm long, 3-3.5 mm wide; seed almost naviculate in outline, 4 mm long, 2 mm wide.
