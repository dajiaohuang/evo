    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Perennial, stoloniferous and tufted, culms to 1 m long, geniculate to decumbent, often rooting at nodes. Leaf blades 100(-150) mm long, 2-6 mm wide. Culm nodes (without branches at nodes) with long spreading hairs. Spikelets to 7 mm long, 1.2-1.5 mm wide. Inflorescence open, branches spreading, lowest branches not whorled; spikelets linear to oblong, rhachilla persistent, sometimes becoming fragile, lemmas and paleas breaking up from base upwards; glumes half to three-quarters the length of lemmas directly above in intact spikelet; palea margins wide apart, not touching, keels a narrow line, scaberulous; anthers 3.0,8-1.0 mm long.
            textZh: Eragrostis barbinodis Hack. 的 SANBI 物种条目记录了形态特征。
