          title: Clusia fructiangusta Cuatrec., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrub or small tree to 15 m, usually epiphytic; latex white; stems drying sharply angled. Leaves obovate or obcuneate, apically rounded, basally cuneate, mostly 8-12 cm long, 6-7 cm wide, the costa elevated beneath almost to the apex, the lateral nerves ascending, straight, parallel, distinct beneath, ill defined above, drying discolorous, above slightly shiny, beneath dull and somewhat yel- lowish; petiole wanting, the leaf base slightly clasping the stem. Inflorescence a terminal panicle often exceeding the leaves; peduncle and branches angled, the peduncle naked for 5-8 cm; bracts cucullate, ca. 5 mm long, conspicuous; ped- icels strongly angled, 2-6 mm long but appearing obsolete; sepals 6, decussate, broad, 4-6 mm long, rotund; petals 4, decussate, broadly ovate, white or bluish, often purplish at the base or maculate above; in pistillate flowers the staminodes concrescent into a thick cylindrical ring; ovary cylindrical, stigmas 7-8. Fruit (Cuatrecasas) narrowly cylindrical or ellipsoidal, 3-3.5 cm long, longitudinally grooved, the stigmas subsessile; seeds very numerous, linear elliptical, the raphe linear, the membranous laciniate aril 3-3.2 mm long, ca. 1 mm wide, red.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 3305
          archiveSourceId: 07A81DA4-ABC3-4220-9A1C-B1C8816107AC
