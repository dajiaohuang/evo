        usage:
          title: Centrosema pascuorum Mart. ex Benth., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Delicate vine or erect herb; stems slender, sparingly long pilose with spread- ing white hairs, glabrescent, sometimes reddish, a fine tomentum of minute hairs sometimes persistent near the base of the plant. Leaves trifoliolate, the leaflets linear, narrowly ovate, or oblong, mostly gradually tapering to the apex; apically mucronate, basally abruptly obtuse, mostly 4-10 cm long, 4-7 mm wide, glabrate, the major pinnate veins ascending, arcuate and anastomosing near the margin to form a submarginal vein, the minor venation reticulate, elevated; petiolules ca. 2 mm long with a few elongate white hairs; petioles mostly 2-4 cm long, glabrate, slender, drying angled; stipels subulate, 3-6 mm long; stipules ca. 7 mm long, acuminate deltoid, sometimes slightly reddish, strongly nervate. Inflorescences 1 or 2 peduncles per leaf axil, each peduncle 1 flowered but with an undeveloped flower at the apex; peduncles 5-10 mm long, sparingly pilose; bracts ca. 8 mm long, ciliate, resembling the stipules but narrower; bracteoles resembling the bracts but broader, covering most of the calyx; pedicels about as long as the peduncles, glabrous. Flowers blue, standard ca. 2 cm long, calyx short cupular, the teeth subulate, the uppermost longest, ca. 7 mm long, the others ca. 5 mm long, the sinus between the lowest 2 shorter; standard orbicular, flat, ca. 2 cm long. Legume linear, slightly curved, compressed, mostly 4-8 cm long, 3-4 mm wide, the margins thickened, the beak acicular, to 10 mm long, sparingly pilose; seeds compressed rectangular, ca. 4 mm long, brown.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 4977
