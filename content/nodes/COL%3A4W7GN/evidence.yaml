    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Perennial or biennial ? rosulate herbs. Leaves up to 14 cm long and 2 cm broad mainly radical, elongate-spathulate or oblong-oblanceolate, obtuse, sometimes apiculate, somewhat fleshy; cauline leaves smaller, obovate or almost elliptic, obtuse or subacute; peduncle erect or ascending, 5-60 cm tall. Inflorescences compact and head-like or elongate with the individual cymes distinct; cymes few-flowered; bracts obovate-oblong to linear, fleshy, more or less spurred when dry. Calyx of 5 segments, each 5-9 mm long, 1.25-2.75 mm broad; lanceolate to elliptic, acute or acuminate, often mucronate, softly membranous, joined for 0.5-1.25 mm, keeled or rarely with a very narrow wing. Corolla white, tube 7.5-10.5 mm long; lobes 4.5-7 mm long, 1.5-3.5 mm broad, oblanceolate to obovate-elliptic or ovate-elliptic, clawed, obtuse or subacute, often apiculate. Filaments very short to 0.5 mm long, inserted 0.75-1.5 mm below the corolla-sinuses; anthers 1.75-2.5 mm long, each with a shortly stipitate, conical-oblong, dark red-brown, apical gland 0.75-2 mm long, and 2 minute basal glandular dots. Style and stigma 2-3.5 mm long, swelling confluent with the stigma, together 1-2.25 mm long, or swelling above the middle of the style; stigma clavate, 2-lobed.
