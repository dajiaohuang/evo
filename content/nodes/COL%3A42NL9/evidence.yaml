          title: Miconia lateriflora Cogn., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrub to 3 m. tall, the stems and leaves glabrous; petioles slender, 5-25 mm. long; leaf-blades shining, thin, elliptic, 10-25 cm. long, two-fifths to half as wide, slenderly acuminate or caudate, obscurely crenulate and sparsely ciliate, obtuse to broadly cuneate at base, 3-nerved; panicle loose and open, sparsely branched; flowers predominantly 4-merous, sessile in small terminal glomerules; hypanthium tubular, becoming ovoid in fruit, glabrous or minutely punctate, 3.5-4 mm. long; calyx-lobes nearly obsolete; exterior teeth narrowly triangular, 1.5-2 mm. long; petals obovate, 1.5-2 mm. long; stamens isomorphic, the anthers sub- ulate, 3-3.5 mm. long; connective minutely 4-lobed at base; ovary nearly free, 4-celled; stigma truncate; fruit strongly 8-costate, sometimes glandular-pilose.
