        usage:
          title: Gonzalagunia panamensis (Cav.) K.Schum., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrubs to 10 ft tall, the branchlets terete, smooth, villosulose, the nodes well spaced, mostly 3-6 cm apart. Leaves elliptic or ovate elliptic, 5-13 cm long, 1- 4(-6) cm wide, acute at the apex, usually acuminate, the acumen to 2 cm long, cuneate to subobtuse at the base, often markedly inequilateral, the costa prom- inulous above and beneath; petioles slender, 1.0-1.5(-2.0) cm long, ca. 0.8 mm wide, pubescent; stipules ovate oblong, widely triangular to subulate, to 3 mm long, the awn usually evident, weak, as long as or longer than the body. Inflo- rescences terminal, solitary, to 31 cm long, the peduncles flagelliform, 1.5-4.0 cm long, to 0.2 cm wide, pubescent, the cymules sessile or subsessile, 0.5-1.0 cm apart; bracts linear subulate or triangular subulate, shorter than the hypan- thium or much longer, to 7 mm long, pubescent; pedicels short or absent. Flowers with the hypanthium subrotund, ca. 0.8 mm long, puberulent, the calyx ca. 1 mm long, the teeth 4, triangular, ca. 0.4 mm long, the cup stiffly petaloid, glabrous and eglandular within; corolla white, the tube narrowly cylindrical, 10.0-13.5 mm long (or longer), ca. 1 mm wide, petaloid, sparsely hairy outside, sometimes glabrescent, glabrous within, the lobes 4, oblong rotund, 3.2 mm long; stamens 4, the anthers narrowly oblong, 2.0-2.2 mm long, the filaments short, ca. 0.7 mm long, attached 3-4 mm below the mouth; style slender, 7-10 mm long, the stigmas 4, ca. 0.7 mm long. Fruits 4-lobed, rotund, 3-4 mm in diam., glabrous to pubes- cent, white or purple black at maturity.
          originalLanguage: en
          sourceField: general
