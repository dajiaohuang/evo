    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants stemless to short-stemmed, 400-700 mm tall excluding inflorescence, solitary. Leaves 20-30, arcuate-erect to arcuate-incurved, lanceolate-ensiform, 400-600 x 60-90 mm, slightly channelled to D-shaped in section, glaucous to dull green, lower surface sometimes with apical median line of few prickles. Inflorescence of very dense, cylindric racemes, 1-3-branched, 1.0-1.3 m tall; bracts narrowly lanceolate, 18-20 x 5-6 mm, ±5-nerved. Flowers orange in bud, chrome-yellow at flowering, 24-30 mm long, cylindric-ventricose, mouth slightly narrowed and upturned; outer segments free for ± half their length, inner segments free but dorsally adnate to outer segments in lower third; pedicels 5-6 mm long. Anthers exserted up to 13 mm. Ovary ±5 x 3 mm, pale green; style exserted 4-14 mm. Fruit not seen.
