          - text: Differences between this species on the one hand and A. petricola and A. reitzii on the other are discussed under those species. A. aculeata differs from this species in geographical range and flowering time and in having larger flowers and copious prickles on the leaves.
            textZh: SANBI 条目提供了 Aloe gerstneri Reynolds 的鉴别特征。
            sourceIds:
              - sanbi_5961_0
            locator: "SANBI/WFO archive Diagnostic row 51288; source identifier 5961.0; cited publication: Glen, HF; Hardy, DS. 2000. Aloe. In: G Germishuizen & E du Plessis (eds), Aloaceae (first part), Fl. S. Africa 5(1,1): 1 - 167. National Botanical Institute, Pretoria. [http://www.biodiversitylibrary.org/item/209564#page/3/mode/1up]. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: In general habit of growth, leaf, inflorescence, and shape and size of flowers, A. gerstneri seems nearest allied to A. petricola Pole Evans, found principally in the Nelspruit and Sabie Districts of the Eastern Transvaal, but the latter flowers during June-July and has more glaucous more leathery, more spreading, straighter leaves, shorter pedicels, bicoloured racemes and flowers more clearly nerved. Another near ally is A. aculeata Pole Evans, which grows further north in the Lydenburg, Waterberg, Pietersburg and Zoutpansberg Districts of the Transvaal, and as far north as 80 miles south of Salisbury in Southern Rhodesia, but this species, which also flowers in June-July, is immediately separated by its very aculeate leaves and larger flowers. A noteworthy character of A. gerstneri is the very distinct white base from which the marginal teeth spring. This is a character not found in A. petricola, but it occurs in the Zoutpansberg form of A. aculeata. In young plants of A. gerstneri, the leaves are usually copiously spiny on both sides, sometimes with a row of spines down the median line dorsally; these spines disappear with age, until in mature specimens the leaves are smooth both sides, except sometimes for a few spines in median line dorsally near apex.
