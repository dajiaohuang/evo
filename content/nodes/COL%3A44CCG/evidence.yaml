    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, 25-60 cm. Leaf solitary, linear, channelled. Flowers white to cream-coloured, inner tepals trifid with a short, obliquely twisted, central cusp.
            textZh: Moraea tricuspidata (L.f.) G.J.Lewis 的 SANBI 物种条目记载了植株、叶片和花部形态。
            sourceIds:
              - sanbi_13878_0
            locator: Strelitzia 29; archive Morphology row 7367, source 13878.0
            placeTimeScope: Regional species account published 2012; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
          - text: Readily distinguished in sect. Vieusseuxia by the comparatively large, white or sometimes pale creamy yellow flowers with spreading, comparatively broad tepal limbs forming a wide cup. The inner tepal limbs are 3-lobed with rounded lateral lobes and a slender central lobe up to 5 mm long, usually obliquely coiled inward (sometimes straight in subsp. parviflora). Closely allied to M. bellendenii and sometimes barely distinguishable from it without knowledge of flower colour, M. tricuspidata is a shorter plant, rarely exceeding 500 mm in height, whereas M. bellendenii has deep yellow flowers and is a taller, more slender species, 500-1000 mm high. Slight but apparently consistent differences in size of floral parts can usually be relied upon to distinguish them. Although they have somewhat different habitat preferences and flowering times, the two occasionally grow close to one another at sites on the Cape Peninsula, where hybrids between the two occur, these intermediate in height and with pale yellow flowers.
            textZh: SANBI 条目提供了 Moraea tricuspidata (L.f.) G.J.Lewis 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: Strelitzia 42; archive Diagnostic row 94249, source 18638.0
