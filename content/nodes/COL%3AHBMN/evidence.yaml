        claims:
          - text: Erect, spiny, much-branched, glabrous shrub, up to 1 m high. Spines exserted, present below nodes and cladode fascicles, ± 6 mm long. Cladodes 1-3 in a fascicle, erect, filiform, 15-50 mm long. Flowers white.
