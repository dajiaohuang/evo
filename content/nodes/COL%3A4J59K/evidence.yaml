          title: Piper peracuminatum C.DC., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: A shrub or small tree, 2-3 m. tall; flowering internodes moderately short and stout, hirsute, the hairs of various lengths; leaves elliptic-obovate, apex narrowly sharp-acuminate, base inequilateral, cordulate, the longer side 2-4 mm. longer at the petiole and covering the petiole, 8-13 cm. wide X 16-27 cm. long, scabrous above and loosely villous or at least pubescent along the nerves, thinly long-hairy beneath, ciliate, somewhat rugescent or nearly smooth, pinnately nerved from the lower half, the nerves 6 or 7 on each side, drying rather thin, subtranslucent; petiole 5-10 plus 2-4 mm. long, densely hirsute, vaginate-winged to the blade; spikes 5 mm. thick X 10-13 cm. long; peduncle rather stout, 2 cm. long, with intermixture of short, stiff, and long, crisp hairs; bracts rounded- or triangular- subpeltate, fringed, pedicel villous; fruit oblong, compressed, rusty-hirtellous, stigmas sessile.
