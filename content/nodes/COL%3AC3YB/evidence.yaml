    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Succulent tree to 3(-5) m, simple or branched, with persistent dried leaves in upper half. Leaves pale green to yellowish green, obscurely lineate, lanceolate-falcate, 60-70 cm long; margin narrow, white, cartilaginous, with deltoid, incurved, white or pale pink teeth. Racemes conical, dense, branched, up to 1 m high. Flowers salmon-pink to dull scarlet, rarely yellow, 40-45 mm long; stamens and stigma well exserted.
            textZh: Aloe pluridens Haw. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13850_0
            locator: "SANBI/WFO archive Morphology row 9015; source identifier 13850.0; cited publication: Klopper, RR; Smith, GF. 2012. Asphodelaceae: Aloe L. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 66 - 70. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: This species is taller and more sparsely branched than A. arborescens. The leaves are narrower and more yellowish green, and the racemes are laxer, narrower and more acute than those of A. arborescens. The leaf teeth are pinkish white, not glaucous white, and the leaf sap has a distinctive sharp odour. The only other tall, single-stemmed Aloe in the range of A. pluridens is A. ferox, which is a much stouter plant with broader, firmer leaves and dense subcylindric racemes of subsessile flowers.
            textZh: SANBI 条目提供了 Aloe pluridens Haw. 的鉴别特征。
            sourceIds:
              - sanbi_5961_0
            locator: "SANBI/WFO archive Diagnostic row 51314; source identifier 5961.0; cited publication: Glen, HF; Hardy, DS. 2000. Aloe. In: G Germishuizen & E du Plessis (eds), Aloaceae (first part), Fl. S. Africa 5(1,1): 1 - 167. National Botanical Institute, Pretoria. [http://www.biodiversitylibrary.org/item/209564#page/3/mode/1up]. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: A. pluridens is nearest allied to A. arborescens, from which it is distinguished by having narrower pale green to yellowish-green leaves with smaller more crowded pinkish-white teeth, fewer flowered slightly laxer less acuminate racemes, with the apical bracts less densely imbricate. The leaf sap has a very distinctive sharp odour. It also differs in being a comparatively taller and slenderer plant. Stems vary from simple, to up to 20 ft. in tall bush, and are sometimes branched at ground level, or at the middle or high up. Simple stemmed plants are usually much taller than specimens with 6-9 branches which average about 6-10 ft. in height.
            textZh: SANBI 条目提供了 Aloe pluridens Haw. 的鉴别特征。
