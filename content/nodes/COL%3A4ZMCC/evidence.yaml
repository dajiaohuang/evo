    facets:
      morphology:
        status: partially-supported
        claims:
          - text: In the described larval chondrocranium at Gosner stage 27, Staurois parvus lacked a larval otic process; the author identifies this as a possible distinguishing feature whose taxonomic level needs investigation in other ranids.
            sourceIds:
              - lukas2026staurois
            locator: Results §3.1; Discussion §4.1
            placeTimeScope: Vienna Zoo Schönbrunn breeding facility, Austria; one developmental series of 116 larvae across Gosner stages 19–27, including 11 stage-27 larvae. Article first published 2026-03-31; sample collection dates are not stated.
            lifeStatus: Larvae were provided by a zoo breeding facility. This is captive-facility material and does not describe wild-collected larvae or population-level variation.
            originalLanguage: en
            textZh: 在 Gosner 第 27 阶段的幼体软骨颅描述中，Staurois parvus 没有幼体耳突。作者将其列为可能的鉴别性状，但指出仍需在其他蛙科类群中研究其分类层级意义。材料来自奥地利维也纳美泉宫动物园繁殖设施：共 116 只、第 19–27 阶段幼体，其中 11 只处于第 27 阶段。文章首发于 2026 年 3 月 31 日，未给出采样日期。这些圈养来源材料不证明野生种群变异或该性状的全种诊断价值。
        gaps:
          - The developmental series is from one breeding facility; it does not establish variation among wild populations, species-wide prevalence, or the taxonomic diagnostic value of the observed feature.
      lifeHistory:
        status: not-assessed
      ecology:
        status: partially-supported
        claims:
          - text: At the studied fast-flowing stream, males used foot flagging among their conspicuous visual signals; acoustic advertisement calling preceded foot flagging in playback and observational results.
            sourceIds:
              - grafe2012
            locator: Abstract, paragraphs 1–4; Methods, Study site and species
            placeTimeScope: One population at a rocky section of Sungai Mata Ikan, Ulu Temburong National Park, Brunei Darussalam; sampling periods were 2005–2007 and 2010.
            lifeStatus: The study describes free-ranging frogs at the named site; its result is not generalized to all populations.
            originalLanguage: en
            textZh: 在文莱乌鲁淡布隆国家公园 Sungai Mata Ikan 的一段岩石急流，雄性 Staurois parvus 使用显著的足部挥动视觉信号；观察和回放实验中，声学求偶鸣叫先于足部挥动。采样时段为 2005–2007 年和 2010 年，研究涉及该地点的一个自由生活种群，不能推广为本种全部种群或季节的行为。
        gaps:
          - The single-site study does not establish range-wide habitat use, seasonal ecology or variation among populations.
      evolution:
        status: not-assessed
      distribution:
        status: not-assessed
      fossil:
        status: not-assessed
      conservation:
        status: not-assessed
