          - text: E. othonnoides is a characteristic and easily recognized species, although the leaves are fairly variable. Apart from in thickness the leaves vary in lobation from pinnatipartite to few-lobed or entire. Rarely (e.g., in my collection from Laingsburg Div.) most leaves are entire.
