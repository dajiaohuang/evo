    lifeStatusScope:
      wild: Wild ecology evidence comes from one Lake Manyara National Park population monitored 2011–2019. Wild reproductive evidence comes from Gombe National Park, where miscarriage records span 1972–2002. Captive morphology and growth evidence concerns 14 female and 16 male baboons followed from infancy to adulthood over seven years at the CNRS Primatology Station, Rousset-sur-Arc, France. These samples are distinct and do not represent every population. The comparative genome study used 12 sampled baboons, with two individuals per species, but its cited sample description does not classify the samples as wild or captive.
      domesticated: Domestication has not been assessed.
      fossil: Fossil evidence has not been assessed.
