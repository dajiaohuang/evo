  catalogue-dossier:
    scientificName: Papio anubis (Lesson, 1827)
    rank: species
    sourceDatasetId: "2144"
    identity:
      method: Exact accepted COL26.8 species usage 6TM9B verified against ChecklistBank dataset 316115 search and taxon endpoints; verbatim name, authorship, species rank, accepted status, sourceDatasetId 2144, and Primates parent classification were checked. The complete accepted parent path through Primates was verified from the immutable COL26.8 hierarchy archive.
      scope: COL26.8 usage 6TM9B only. Evidence spans a wild population at Lake Manyara National Park, Tanzania (2011–2019), a wild Gombe National Park population in Tanzania (reproductive records 1972–2002), and a captive cohort at the CNRS Primatology Station, Rousset-sur-Arc, France. These separate study scopes do not support species-wide generalization. A separate comparative genomic study analyzed two sampled individuals from each of the six extant Papio species; its P. anubis marker count is panel-relative.
