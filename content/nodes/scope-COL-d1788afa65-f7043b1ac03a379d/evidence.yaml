    facets:
      morphology:
        status: partially-supported
        claims:
          - text: In a seven-year longitudinal sample of captive olive baboons at the CNRS Primatology Station in Rousset-sur-Arc, France, females and males were similar in measured size and shape at birth; differing growth rates and durations later produced substantial size differences while measured body shape remained similar. This finding describes the studied cohort, not wild populations.
            textZh: 在法国鲁塞特-苏尔-阿克 CNRS 灵长类研究站开展的一项为期七年的圈养橄榄狒狒纵向研究中，雌雄个体出生时的测量体型与身体形状相近；此后生长速度和持续时间不同，形成明显体型差异，而测量的身体形状仍相近。该发现仅适用于所研究的群体，不代表野外种群。
            sourceIds:
              - druelle2017
            locator: Abstract; Materials and methods—Study site and subjects; Results—Changes in morphotypes (dimensionless segment lengths and masses) with age; Discussion—Sex-related differences.
            placeTimeScope: One captive cohort at the CNRS Primatology Station, Rousset-sur-Arc, France; the reported longitudinal study lasted seven years. The article metadata gives first publication as 2017-03-14; calendar start and end years for cohort measurements are not specified here.
            lifeStatus: Captive olive baboons; not a wild-population comparison.
            originalLanguage: en
        gaps:
          - Morphometric evidence is limited to one captive cohort and does not describe variation across wild populations or the full accepted species concept.
      lifeHistory:
        status: partially-supported
        claims:
          - text: The study followed 14 female and 16 male captive olive baboons from infancy (minimum age two months) to adulthood over seven years. The largest measured changes in body morphometrics occurred during the first two years and involved distal body parts.
            textZh: 该研究对 14 只雌性和 16 只雄性圈养橄榄狒狒进行了为期七年的追踪，个体从幼年（最小起始年龄为两个月）随访至成年。身体形态测量变化最大集中在前两年，并涉及身体远端部位。
            sourceIds:
              - druelle2017
            locator: Abstract; Materials and methods—Study site and subjects; Results—Changes in morphotypes (dimensionless segment lengths and masses) with age.
            placeTimeScope: One captive cohort at the CNRS Primatology Station, Rousset-sur-Arc, France; ages from at least two months to adulthood across a seven-year study. Calendar sampling years are not reported in the cited study sections.
            lifeStatus: Captive cohort; these growth observations do not establish wild growth trajectories.
            originalLanguage: en
          - text: In the Gombe National Park population of Tanzania, birth and miscarriage records from 1972–2002 included 732 pregnancies from 175 females with known rank; 65 pregnancies ended in miscarriage. In a time-dependent analysis, higher-ranking pregnant females exposed to immigrant males that reached top rank within one year had higher miscarriage hazards outside drought conditions. The rank-related pattern largely disappeared when mean rainfall over two years was below about 1,100 mm; exposure to new immigrants generally did not show the same association. This is a conditional result from one wild population, not a species-wide miscarriage rate or proof of deliberate male-caused pregnancy loss.
            textZh: 在坦桑尼亚贡贝国家公园的种群中，1972—2002 年的出生与流产记录纳入 175 只已知等级雌性的 732 次妊娠，其中 65 次以流产告终。时变分析显示，在非干旱条件下，接触到移入后一年内升至群体最高等级雄性的高等级孕雌，其流产风险较高；两年平均降雨量低于约 1,100 毫米时，这种等级相关模式基本消失。一般移入雄性的接触并未显示相同关联。这是单一野生种群中的条件性结果，不代表全物种流产率，也不能证明雄性有意造成妊娠损失。
            sourceIds:
              - bailey2021
            locator: Abstract; Results—three-way interaction and rainfall threshold; Methods—Miscarriage data and Fetal exposure to immigrant males.
            placeTimeScope: Gombe National Park, Tanzania; reproductive and miscarriage records from 1972–2002. Rainfall context uses two-year means; article published 2021-02-17.
            lifeStatus: Wild olive baboons in the Gombe study population; not captive animals or a range-wide sample.
            originalLanguage: en
        gaps:
          - The captive CNRS morphometric cohort does not establish wild growth trajectories. The Gombe analysis concerns reproductive loss at one wild population; reproductive schedules, fertility rates, survival, and longevity across other populations remain unassessed.
      ecology:
        status: partially-supported
        claims:
          - text: At Lake Manyara National Park, Tanzania, road-transect distance sampling from 2011–2019 produced an estimate more than three times the upper-limit abundance estimated from sleeping-site counts and average group size. The authors note that baboons' use of roads may explain the bias; this is a site- and method-specific result, not a species-wide density estimate.
            textZh: 在坦桑尼亚曼雅拉湖国家公园，2011 至 2019 年的道路样线距离抽样所得估计值，超过按夜宿地点数量和平均群体大小估算的数量上限三倍。作者指出，狒狒使用道路可能解释这种偏差；这是特定地点和方法的结果，不是物种层面的密度估计。
            sourceIds:
              - kiffner2022
            locator: Abstract; Results and Discussion; Figure 2 and Tables 1–3.
            placeTimeScope: Lake Manyara National Park, Tanzania; road transects and sleeping-site comparison using surveys from 2011–2019.
            lifeStatus: Wild olive baboons in one protected area.
            originalLanguage: en
          - text: In the Gombe study, pregnancies involving at least one visible wound had a higher modeled miscarriage hazard than pregnancies without a wound (hazard ratio 2.83, 95% CI 1.40–5.72). Pregnant females were wounded more often than expected after the arrival of a male who reached top rank within one year (24.7% observed versus 8.6% expected in the analysis of 768 pregnancies). The authors state that further observations are needed to establish selective targeting; these observational associations do not establish intent or causation.
            textZh: 在贡贝研究中，至少出现一次可见伤口的妊娠，其模型估计的流产风险高于未受伤妊娠（风险比 2.83，95% 置信区间 1.40–5.72）。在针对 768 次妊娠的分析中，迅速升至群体最高等级的雄性移入后，孕雌受伤比例高于预期（观察值 24.7%，预期值 8.6%）。作者指出仍需更多观察才能确认是否存在选择性攻击；这些观察性关联不能证明行为意图或因果关系。
            sourceIds:
              - bailey2021
            locator: Results—Wounding; Figure 2; Methods—Wounding analysis; Discussion—paragraph noting that further observational evidence is needed.
            placeTimeScope: Gombe National Park, Tanzania; pregnancy and wounding records analyzed from the long-term study, including the 1972–2002 miscarriage dataset; article published 2021-02-17.
            lifeStatus: Wild olive baboons; site-specific observational evidence, not a species-wide behavioral account.
            originalLanguage: en
        gaps:
          - The Lake Manyara density study and Gombe social study cover two site-specific populations; neither establishes species-wide abundance, range-wide ecology, population variation, or a global population trend. The reported observational associations do not establish causal mechanisms.
      evolution:
        status: partially-supported
        claims:
          - text: "In a comparative genomic analysis of two sampled individuals from each of the six extant Papio species, 4,645 Alu insertion polymorphisms were classified as indicative of P. anubis: they were present in both sampled P. anubis individuals and absent from the other sampled Papio individuals. This panel-relative count does not estimate variation across the species or resolve every reticulate relationship."
            textZh: 一项比较基因组研究对六个现生 Papio 种各取两只个体进行分析。按论文定义，4,645 个 Alu 插入多态位点出现在两只取样的橄榄狒狒中，且未见于其他取样的 Papio 个体，因此被归为 P. anubis 指示位点。此面板内计数不能代表该物种的全部遗传变异，也不能单独解析所有网状演化关系。
            sourceIds:
              - jordan2018
            locator: Methods—Samples; Results—Phylogenetically informative Alu insertions; Fig. 4a.
            placeTimeScope: Genome panel of 12 baboons, with two individuals from each of six extant Papio species; collection locations and dates are not specified in the cited sample description. Published 2018.
            lifeStatus: The cited sample description does not classify the 12 genomic samples as wild or captive; no ecological status is inferred.
            originalLanguage: en
        gaps:
          - The marker count is defined relative to two sampled individuals per Papio species. It does not estimate range-wide or within-species genomic diversity and does not resolve the full reticulate evolutionary history.
