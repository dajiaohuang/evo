  claims:
    - subjectId: taxon:scorpiones
      claimKind: scientific
      claimType: fossil-range
      statement: The Scorpiones range formerly used the Silurian Parioscorpio occurrence as its older endpoint. Anderson et al. (2021) rejected that fossil's scorpion identification, so this atlas withholds the inherited range pending independent scorpion evidence; no origin date is established here.
      confidence: medium
      confidenceRationale: The later redescription invalidates use of Parioscorpio as a scorpion range anchor. This records withdrawal of that inference, not an alternative age estimate.
      referenceLinks:
        - referenceId: anderson-2021-parioscorpio-reassessment
          relation: supports
          quoteLocator: Redescription and rejection of scorpion affinities; phylogenetic conclusions
  claim-rationales.zh:
    - 后续重新描述否定了用 Parioscorpio 作为蝎类延限锚点的依据。这里记录的是撤回该推断，而非提供另一项年代估算。
  claim-statements.zh:
    - 蝎类延限此前以志留纪 Parioscorpio 产出作为较老端点。Anderson 等（2021）否定了该化石的蝎类归属，因此图谱暂不提供这一沿用范围，等待独立的蝎类证据；此处不确定起源年代。
