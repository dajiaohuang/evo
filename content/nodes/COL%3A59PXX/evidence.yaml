        usage:
          title: Turnera panamensis Urb., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrub 0.5-4.0 m tall, the branchlets puberulous. Leaves with the petioles canaliculate above, to 5 mm long, puberulous, the stipules subulate, to 4 mm long; blade ovate, elliptic, narrowly elliptic or narrowly ovate-elliptic, the base acute and decurrent, the apex bluntly acuminate, the margins crenate, the crenae at first glandular, later usually subemarginate, to 18 cm long and 6 cm wide, chartaceous, subglabrous above, puberulous beneath, becoming glabrescent, the costa and secondary veins prominent beneath. Flowers axillary and solitary, often approximate on abbreviated branchlets, heterostylous; peduncles to 6 mm long, puberulous, the bracteoles stipule-like, to 5.5 mm long, inconspicuously 2-stipulate; pedicels to 7 mm long, puberulous; hypanthium 4-5 mm long, puberulous; sepals narrowly triangular, long-acuminate-aristate, 12-15 mm long, puberulous outside, 3-veined; petals inserted near the throat of the hypanthium, long-unguiculate, 18- 30 mm long, yellow, orange-yellow or orange; stamens inserted towards the base of the hypanthium, the filaments in short-styled flowers 10-12 mm long, in long- styled flowers to 6 mm long, glabrous, the anthers to 2 mm long; ovary oblong- ellipsoid, ca 3 mm long, glabrous to more or less densely puberulous towards the apex; styles in short-styled flowers ca 5 mm long, in long-styled flowers to 8 mm long, glabrous to more or less densely puberulous below; stigmas penicillate. Capsules subglobose-ellipsoid, 6-8 mm long, dark brown, the pericarp densely tuberculate, glabrous; seeds nar- rowly pyriform, slightly curved to almost straight, 4-5 mm. long, rather densely whitish-puberulous.
          originalLanguage: en
          sourceField: general
