        status: partially-supported
        claims:
          - text: Perennial herb, rootstock stout, woody, crown brown silky-woolly, flowering stems up to ±700 mm high, simple, one or several tufted together, woolly-felted, remotely leafy in lower part, remotely leafy or bracteate upwards. Leaves often only 3 or 4, ascending, up to 200 x 80 mm, broadly elliptic or ovate, apex more or less acute, base somewhat narrowed in lower leaves, broad, cordate-clasping in upper, upper surface thinly cobwebby at first, later harshly pubescent, lower greyish-white felted, faintly 5-9-nerved, reticulate. Heads homogamous, campanulate, ±6 x 5 mm, many in a congested or lax corymbose cyme. Involucral bracts in ±4 series, subequal, closely imbricate, base woolly, tips glossy, subopaque, bright deep or pale pink or buff, very acute to acuminate, squarrose. Receptacle with fimbrils longer than ovaries. Flowers 25-31. Achenes ±1 mm long, glabrous. Pappus bristles many, equalling corolla, scabrid, bases lightly fused.
            sourceIds:
