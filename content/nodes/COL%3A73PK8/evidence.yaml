    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous herb, up to 400 mm tall. Cataphylls of mature plant split regularly into rigid, blackish fibres and innermost cataphyll not forming an open network above. Leaves thick, 4-10 mm in diameter. Flowers pale yellow to white.
            textZh: Moraea robusta (Goldblatt) Goldblatt 的 SANBI 物种条目记载了植株、叶片和花部形态。
            sourceIds:
              - sanbi_11118_0
            locator: Strelitzia 6; archive Morphology row 2796, source 11118.0
            placeTimeScope: Regional species account published 1997; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
          - text: Like its apparent close relative, Moraea galpinii, M. robusta has distinctive coarsely fibrous corm tunics forming a collar around the stem base but it differs from M. galpinii in its larger, white or pale yellow flowers with the limbs of both the inner and outer tepals at length spreading to laxly reflexed, the outer tepals 55-65 mm long vs. ± 40 mm in M. galpinii. The leaf is channelled and wider than in M. galpinii, 4-10 mm wide but in some populations the margins are closely inrolled. Populations on the slopes of The Sentinel in the northern KwaZulu-Natal Drakensberg have the upper portion dry and broken suggesting emergence before winter, whereas the lower portions are green, evidently having emerged in the spring. The narrowly ellipsoid capsules are up to 45 mm long and up to 10 mm at the widest. The capsules contain numerous angular seeds arranged in two rows per locule. The narrow capsules with a prominent beak and angular seeds stand in marked contrast to the ± ovoid capsules and flattened, discoid seeds of M. spathulata and other species of the subgenus for which these characters are known.
            textZh: SANBI 条目提供了 Moraea robusta (Goldblatt) Goldblatt 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: Strelitzia 42; archive Diagnostic row 94223, source 18638.0
            placeTimeScope: Regional species account published 2020; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
