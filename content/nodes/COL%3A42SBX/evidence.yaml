      lifeHistory:
        status: partially-supported
        claims:
          - text: "The study included six captive, laboratory-born male gray mouse lemurs: four were maintained at 24–26°C and two were acclimated at 25°C before 17 days at 10°C. In the 10°C subset (n=2), sleep-wake rhythms persisted during torpor, mostly as NREM sleep; when body temperature fell below 21°C, EEG became isoelectric. Group comparisons for this same n=2 subset found reduced NREM2 and increased isoelectric state at 10°C. These results are limited to the studied captive animals and protocol, and do not establish a species-wide threshold or wild-population pattern."
            originalLanguage: en
            sourceIds:
              - royo2019
            locator: Results, Effects of Torpor on Behavioral States; Figure 2C and its <21°C EEG-isoelectric threshold; Figure 3A and Table 1 for 10°C (n=2) versus 25°C/control behavioral-state distributions; Tables 2–3 for low-temperature comparisons and Tb_min correlations. Methods, Experimental Protocol, establishes the four-animal 25°C cohort and two-animal 10°C cohort.
            placeTimeScope: Six laboratory-born and laboratory-raised males from the UMR 7179 CNRS/MNHN colony in Brunoy, France; short-day 10:14 light:dark photoperiod. Four animals remained at 24–26°C; two were acclimated for 5 days at 25°C then exposed to 10°C for 17 days. The <21°C EEG-isoelectric observation and low-temperature sleep comparisons apply only to the 10°C n=2 subset. Figure 2C illustrates an individual animal, so the threshold is not asserted as a species-wide constant.
            lifeStatus: Captive laboratory animals; no wild-population behavior is inferred.
        gaps:
          - Evidence comes from a small captive male sample under a specific laboratory photoperiod and temperature protocol; other life-history and behavioral facets were not assessed.
