          title: Psidium guineense Sw., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrubs usually less than 1 m. high; young twigs compressed to subterete, pubes- cent. Leaves elliptical to oblong, rounded, obtuse or acutish at the apex, obtuse or acute at the base, up to 13 cm. long and 7 cm. broad, chartaceous, pubescent on both sides when young, glabrate except the midrib and veins beneath when adult, the lateral nerves about 7-10 on each side, prominulous to flat above, prominulous beneath, arcuate-anastomosing near the margin; petiole 4-10 mm. long. Peduncles 1- to 3-flowered, 2-3 cm. long, pubescent. Flower buds pubescent, constricted under the calyx, 1.0-1.5 cm. long. Calyx irregularly 4- to 5-fid at anthesis, the segments about 7 mm. long, sericeous within. Petals 5, about 1.5 cm. long. An- thers linear-oblong. Ovary about 5 mm. long, 3- to 5-celled; ovules in a triple row at each side of the 2-lamellate placenta, turned in all directions. Berry sub- globose, about 2 cm. in diameter, yellow.
