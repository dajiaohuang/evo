        claims:
          - text: Soft, sparsely hairy shrub to 2 m. Leaves ovate, toothed. Flowers in panicles, calyx glandular-hairy, corolla saccate at base, mauve, blue or pink with darker speckling.
            sourceIds:
              - sanbi_14344_0
            locator: "SANBI/WFO archive Morphology row 7563; source 14344.0; publication: Manning, JC; Goldblatt, P. 2012. Lamiaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 601 - 604. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: One of the commonest species in southern Africa which varies in stature and degree of pubescence according to growing conditions. See notes after P. grallalus and P. rubropunctatus. Flower colour is usually pale to deep mauve with purple flecks on the upper lip. A form with pinkish flowers from the Transkei was described as P. behrii and is popular as a garden plant for shady places. In other respects it is not separable from P. fruticosus.
            textZh: SANBI 条目提供了该种的鉴别特征。
            sourceIds:
