            locator: "SANBI/WFO archive Diagnostic row 50829; source 15375.0; publication: Codd, LEW. 1985. Lamiaceae: 23. Plectranthus. In: OA Leistner (ed.), Fl. S. Africa 28(4): 137 - 172. Botanical Research Institute, Department of Agriculture and Water Supply, Pretoria. [http://www.biodiversitylibrary.org/item/209555#page/9/mode/1up]. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
