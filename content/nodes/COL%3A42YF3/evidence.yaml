        claims:
          - text: Climber up to 1 m tall, or shrub up to 150 mm tall, stems 1-1.5 mm diam., finely pubescent. Leaves oblong to narrowly elliptic, 4-17 x 1.5-4 mm, finely pubescent, grey-green. Flowers 1-8 per extra-axillary cluster, peduncle 1-2 mm long, pedicels 2-3 mm long. Corolla campanulate, glabrous, except for 5 patches of yellow hairs in tube, tube ± 2.5 mm broad, pure white (fading to yellow and brown), lobes up to 2 mm long, folded inwards lengthwise, erect to slightly spreading, pea-green.
