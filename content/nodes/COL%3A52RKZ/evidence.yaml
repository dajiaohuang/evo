    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Dwarf shrub, up to 250 mm tall. Leaves mainly cauline, short and rigid; ligule a fringe of hairs. Inflorescence a panicle, at most only slightly exserted from uppermost leaf sheath. Spikelets in densely clustered ovate to oblong fascicles, 10-14 mm long; lemma 3-awned, only central awn plumose, hairs usually golden, with articulation between apex of lemma and base of short column.
