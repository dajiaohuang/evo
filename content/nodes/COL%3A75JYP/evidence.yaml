        usage:
          title: Palicourea bella (Standl.) Dwyer, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrubs, the twigs 4-angled, stout, golden puberulent, the nodes well spaced except at the tips. Leaves elliptic, to 15 cm long, to 6.6 cm wide, deltoid at the base, the costa prominent beneath, the lateral veins ca. 22, arcuate, drying green, scarcely discolorous, white strigillose above, prominent beneath; petioles mod- erately slender, to 3 cm long, pilose; stipules connate to 1.5 cm long, bilobate, the lobes oblong, rotund at the apex, about 1/2 the length of the body or less. Inflorescences terminal, to 12 cm long, the cymules densely aggregated at the ends of the peduncles, the latter about 7 cm long, the primary branches ca. 2.5 mm long, ca. 5-flowered; bracts oblong, to 1.7 cm long, acute, hirtellous. Flowers with pedicels 4-6 mm long, pilose; hypanthium short, pilose, the calycine cup short, cupuliform, pubescent outside with short erect hairs and 5 glandular areas within, each area covered by an albuminous material and containing 6-12 oblong glands, the calycine lobes foliose, ovate to ovate elliptic, 11-14 mm long, acute, venose, petaloid, pink when dry; corolla white, cylindrical, 16 mm or longer, dilated at base, carnose, puberulent outside, villose within except at filament attachment, the lobes 5, ovate oblong, 4.5-5.0 mm long, obtuse; stamens 5, the anthers oblong, ca. 3 mm long, the filaments short, 0.5 mm wide, attached above the middle of the tube; ovarian disc compressed rotund, to 2 mm long, topped by a doughnut shaped ring, the style slender, 4-10 mm long, the stigmas slender, fingerlike, ca. 2.5 mm long. Fruits not seen.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 11867
