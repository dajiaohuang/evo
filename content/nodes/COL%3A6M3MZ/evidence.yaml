            locator: "SANBI/WFO archive Morphology row 98601; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: When first collected, Hesperantha secunda was referred to H. pilosa because of its pilose leaves and the scale-like bract in the upper third of the stem. However, its unusual, somewhat fleshy leaves with thickened to winged margins and thickened main vein, and nearly secund spike, prompted a reappraisal of its status and it is now regarded as a separate species, perhaps most closely allied to H. pilosa. In addition to its unusual leaves, the flowers are nodding on a curved perianth tube and have unusually short, ascending style branches, ± 4 mm long. Hesperantha pilosa has plane to ribbed leaves (or rarely terete or with slightly winged margins) and upright flowers with a straight perianth tube, tepals 9-16 mm long vs. 10-11 mm in H. secunda and longer style branches, 7-11 mm long, spreading laxly over the tepals. Flowers of H. secunda open at sunset, the tepals beginning to unfold at ± 17:00 and fully expanded by 18:00, remaining open until the early hours of the morning. The strong scent has a slightly unpleasant acrid component.
