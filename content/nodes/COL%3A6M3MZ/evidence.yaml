    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants 100-200 mm high. Corm ovoid, 7-8 mm diam.; tunics woody, concentric. Stem unbranched, smooth, with minute, membranous, scale-like bract up to 3 mm long on upper third of stem. Foliage leaves 3, lower 2 basal, linear to narrowly sword-shaped, falcate or straight, finely hairy 2.5-4.0 mm wide, margins raised and winged at 90º to surface, main vein also raised with narrow wings parallel to surface, uppermost leaf sheathing lower part of stem for all or most of its length, several ribbed, finely hairy. Spike ± nodding, mostly 3- to 7-flowered; bracts subequal, 7-10 mm long, outer green or becoming ± pale and membranous, inner membranous with 2 green keels. Flowers nocturnal, creamy white, outer tepals grey-brown on reverse, nodding, tepals spreading at right angles to tube and vertical, strongly scented; perianth tube cylindric, curving outward, 6-7 mm long; tepals 10-11 x 2.5-3.5 mm, inner slightly shorter and wider than outer. Filaments ± 3 mm long; anthers 5-6 mm long, spreading almost parallel to tepals, white; pollen white. Style branches ascending, ± 4 mm long, reaching to base or lower fourth of anthers.
            textZh: Hesperantha secunda Goldblatt & J.C.Manning 的 SANBI 物种条目记录了形态特征。
            sourceIds:
