        claims:
          - text: Cormous geophyte to 20 cm, corm with a broad, fan-like oblique base, basal ridge fibrous. Basal leaves several, channelled to apex. Flowers yellow, usually with brown markings.
            textZh: Romulea austinii E.Phillips 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 7295; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Diagnosed by the hemispherical corm with broadly crescent-shaped basal ridge not wider than the corm itself, subterranean stem, leaves that are unifacial in the lower half, canary-yellow flowers with golden-yellow cup, usually with brown markings around the throat, and inner and outer bracts that are submembranous in the basal half but green and subherbaceous above. Romulea austinii is difficult to separate from forms of R. tortuosa lacking strongly compressed corms with a wide, fan-shaped basal ridge but that species typically has entirely papery or membranous bracts and more numerous leaves, bifacial almost to the tips and usually flexuous or twisted and sometimes conspicuously ciliate. Although De Vos (1972) cited the relatively shorter anthers in R. austinii as another character separating it from R. tortuosa, this is not infallible as some populations of R. tortuosa have similarly short anthers. The two species are largely parapatric, with R. tortuosa ranging to the north and west, from Namaqualand onto the Bokkeveld, Cold Bokkeveld and Roggeveld as far south as Worcester, thus overlapping with R. austinii on the Bokkeveld Plateau between Nieuwoudtville and Calvinia, and below the escarpment in the western Great Karoo between Matjiesfontein and Laingsburg.
            textZh: SANBI 条目提供了 Romulea austinii E.Phillips 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 95147; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
