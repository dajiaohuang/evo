        usage:
          title: Centrosema plumieri (Turpin ex Pers.) Benth., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Robust twining vine; stems pubescent just above the nodes, otherwise often glabrate. Leaves pinnate trifoliolate, leaflets broadly ovate to rhombic 5-9(-15) cm long, sharply short acuminate, basally obtuse or cuneiform, shiny and glabrate above except on the midvein, copiously appressed pubescent beneath with straight white hairs; petiolules 3-4 mm long, drying dark, glabrate except tomen- tose ventrally; rachis and petiole drying with a conspicuous dorsal groove near the ends, glabrate to pilose; rachis 10-25 mm long, petiole mostly shorter than the terminal leaflet; stipels subulate, exceeding the petiolules, stipules obtuse, ca. 5 mm long, conspicuously striate, ciliolate. Inflorescence axillary, few flowered; peduncles stiff, drying dark, 2-10 cm long; bracts caducous; bracteoles 2, inserted at the top of the pedicel, spathaceous, 10-20 mm long, conspicuously nervate, apically ciliolate, often drying dark; pedicels 6-10 mm long. Flowers showy; calyx cupular, 4-6 mm long, the teeth undulate except for the slightly longer lowest tooth, glabrate; standard orbicular, emarginate, nearly flat, 5-6 cm across, white outside, purple inside, pubescent outside, wings and keel purple. Legume linear, flat, 10-14 cm long, ca. 10 mm wide, thick margined, mostly drying black, glabrate; seeds ellipsoidal, rhomboidal, 6-9 mm long, dark brown, the hilum along one corner.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 5513
