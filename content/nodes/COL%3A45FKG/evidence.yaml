        claims:
          - text: Plants with stems less than 10 mm long; leaves 1-3, lorate-oblanceolate, rounded, very obscurely unequally bilobed, 15-40 x 4-6 mm. Inflorescences of several racemes, each 15-35 mm long and with 4-7 flowers; sheaths 2 mm long; bracts tubular, acute, 1 mm long; pedicels 5 mm long. Flowers pale green, to 5 mm in diameter. Sepals unequal, acute; median 2.6-5 x 1 mm; laterals spreading, oblanceolate-rhomboid, 3-5 x 0.7-2 mm. Petals ovate, acute, 2-3 x 1-2 mm. Lip midlobe triangular, 1 mm long, acute; side lobes lost; spur base 1 mm in diameter, tapering to an acute apex, 12-18 mm long.
