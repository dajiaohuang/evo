    - subjectId: event:parhyale-wing-homology-knockout
      claimKind: scientific
      claimType: event-mechanism
      statement: CRISPR knockout and expression comparisons in Parhyale hawaiensis and insects support serial homology between proximal leg segments, lateral body wall and wing-related structures, but do not directly observe the first insect wing or identify one fossil transition.
      confidence: high
      confidenceRationale: The perturbations and phenotypes directly test developmental correspondence, while deep homology and historical origin remain evolutionary interpretation.
