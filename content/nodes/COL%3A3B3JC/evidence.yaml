    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Slender, many-stemmed shrub, 0.4-1.2 m tall. Leaves decussate on flowering and short-shoots, scale-like and triangular, 0.8-1.6(-4.5) mm long, glabrescent with pitted glands. Flowerheads racemose or solitary on peduncles 2-3.5(-7) mm long, disciform, 3 mm long, cream-coloured; involucral bracts 4, glabrescent; marginal paleae free, woolly.
            sourceIds:
              - sanbi_14753_0
            locator: "SANBI/WFO archive Morphology row 34213; source 14753.0; publication: Manning, JC. 2013. Asteraceae: Eriocephalus. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 286 - 288. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Although closely related to E. microphyllus, E. microcephalus can be distinguished by the thin, small leaves 0.8-1.6 x 0.3-0.5 mm, slender, delicate branches and mostly red-purple young shoots with a diameter of less than 1 mm. The leaves of E. microphyllus are (1.2-)1.5-4.0(-7.0) x 0.6-0.8 mm on rigid branches. Internodes of young shoots of E. microcephalus are 4.0-8.5 mm long as opposed to the 3-5 mm of those of E. microphyllus. Side branches are mostly opposite, forming an angle of 70-90° with the main axis in E. microcephalus, but less than 70° in E. microphyllus. E. microcephalus is fairly rare and restricted to a few high mountains, whereas E. microphyllus is common in Namaqualand.
            textZh: SANBI 条目提供了该种的鉴别特征。
            sourceIds:
