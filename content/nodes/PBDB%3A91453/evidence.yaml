  claim-rationales.zh:
    - Priscomyzon riniensis：具名材料和已发表的系统或系统发育处理支持这一有限鉴定。置信度保持中等，因为画像不会把取样位置转化为直接祖先或普遍共识。
    - Priscomyzon riniensis：一手研究直接报告了具名地点与层位。置信度为中等，因为单一研究样本不能确定缺失、特有性或全球地理范围。
    - Priscomyzon riniensis：证据边界是明确的：保留沉积或解剖背景，同时不填补无依据的行为与生态位。中等置信度针对这一有限的否定性陈述，而非重建生态。
    - Priscomyzon riniensis：所引图件与描述直接记录了具名解剖观察。由于保存与标本取样限制了性状完整性和变异，置信度为中等而非普遍结论。
    - Priscomyzon riniensis：一手来源与具体定位符支持显示的样本区间。置信度为中等，因为该包络明确限定于标本或地点，而非全球首现或末现。
  claim-statements.zh:
    - 4.2 厘米长的 Priscomyzon riniensis 正模 AM5750 被解释为七鳃鳗总群；本画像不把它提升为七鳃鳗冠群或直接祖先。
    - AM5750 产自南非东开普省 Waterloo Farm 的法门期 Witpoort 组；这是一个取样地点，不代表全球分布。
    - 该标本记录了水生细长躯体与口器，但食性、寄生性、洄游、幼体生态和实测游泳性能均无直接证据。
    - AM5750 在 4.2 厘米长的躯体中保存了大型口盘、14 枚环口齿和鳃篮。
    - 显示的 360–359 Ma 区间只是 Waterloo Farm 正模出现记录的取整包络，并非全球种延限或七鳃鳗冠群首现。
