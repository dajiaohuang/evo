  claims:
    - subjectId: taxon:priscomyzon
      claimType: taxonomy
      claimKind: scientific
      statement: The 4.2 cm Priscomyzon riniensis holotype AM5750 is interpreted as a total-group lamprey; the profile does not promote it to crown Petromyzontida or a direct ancestor.
      confidence: medium
      confidenceRationale: "Priscomyzon riniensis: Named material and a published systematic or phylogenetic treatment support this bounded identification. Confidence remains medium because the profile does not turn a sampled placement into direct ancestry or universal consensus."
      referenceLinks:
        - referenceId: gess-2006-priscomyzon
          relation: supports
          pages: 981–984
          figure: Figures 1–2
          quoteLocator: Description and reconstruction of Priscomyzon; locality and horizon
    - subjectId: taxon:priscomyzon
      claimType: biogeography
      claimKind: scientific
      statement: AM5750 comes from the Famennian Witpoort Formation at Waterloo Farm in the Eastern Cape of South Africa; this is one sampled locality, not a global distribution.
      confidence: medium
      confidenceRationale: "Priscomyzon riniensis: The primary study reports the named locality and horizon directly. Confidence is medium because one study sample cannot establish absence, endemism or a global geographic range."
      referenceLinks:
        - referenceId: gess-2006-priscomyzon
          relation: supports
          pages: 981–984
          figure: Figures 1–2
          quoteLocator: Description and reconstruction of Priscomyzon; locality and horizon
    - subjectId: taxon:priscomyzon
      claimType: ecology
      claimKind: scientific
      statement: The specimen documents an aquatic elongate body and oral apparatus, but diet, parasitism, migration, larval ecology and measured swimming performance remain unavailable.
      confidence: medium
      confidenceRationale: "Priscomyzon riniensis: The evidence boundary is explicit: depositional or anatomical context is retained while unsupported behaviour and niche claims are withheld. Medium confidence applies to that bounded negative statement, not to a reconstructed ecology."
      referenceLinks:
        - referenceId: gess-2006-priscomyzon
          relation: supports
          pages: 981–984
          figure: Figures 1–2
          quoteLocator: Description and reconstruction of Priscomyzon; locality and horizon
    - subjectId: taxon:priscomyzon
      claimType: morphology
      claimKind: scientific
      statement: AM5750 preserves a large oral disc, fourteen circumoral teeth and a branchial basket in a 4.2 cm body.
      confidence: medium
      confidenceRationale: "Priscomyzon riniensis: The cited figures and descriptions directly document the named anatomical observations. Confidence is medium rather than universal because preservation and specimen sampling limit character completeness and variation."
      referenceLinks:
        - referenceId: gess-2006-priscomyzon
          relation: supports
          pages: 981–984
          figure: Figures 1–2
          quoteLocator: Description and reconstruction of Priscomyzon; locality and horizon
    - subjectId: taxon:priscomyzon
      claimType: fossil-range
      claimKind: scientific
      statement: The displayed 360–359 Ma interval is a rounded envelope for the Waterloo Farm holotype occurrence and is not a global species range or crown-lamprey first appearance.
      confidence: medium
      confidenceRationale: "Priscomyzon riniensis: The primary source and concrete locator support the displayed sample interval. Confidence is medium because the envelope is explicitly specimen- or locality-scoped and not a global first or last appearance."
      referenceLinks:
