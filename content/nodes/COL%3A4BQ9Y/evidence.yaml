    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Stem 200-380 mm tall, slightly slender to ± stout, branched at the base or unbranched, scaberulous to scabrous or pubescent, hairs usually in 2 broad lines. Leaves erectly spreading; petiole 3-8 mm long; blade 40-68 x 15-40 mm, lanceolate or narrowly ovate to ovate, oblong or elliptic, margins scabrous or pubescent, surfaces scabrous or pubescent, usually less so above, midrib scabrous. Inflorescence umbellate, 2-4-flowered, sessile or subsessile at uppermost nodes and terminal, the lowermost occasionally pedunculate; peduncles up to 7 mm long, pubescent. Bracts 4-8 mm long, narrowly linear, acuminate, lightly pubescent below. Pedicels 5-15 mm long, pubescent. Sepals 9-14 x 3-6 mm, lanceolate, narrowly oblong or narrowly elliptic to elliptic or oblong, acuminate or acute-acuminate, glabrous above, pubescent below. Corolla 11-19 mm long, spreading cup-shaped, lobed almost to the base, apparently yellow spotted on the back with dark violet, glabrous above, glabrous to pubescent below; lobes 9-16 x 8-10 mm, concave, narrowly ovate to broadly ovate or broadly elliptic or ± suborbicular, acute tips recurved, margins slightly imbricate below. Corona lobes 8-12 mm long, with basal half claw-like and 2-6 mm long, abruptly dilated at the base into ascending and spreading auricles, auricles subdeltoid, obtuse and 2-4 mm broad, keels erect, linear, extending from the auricles to overlie and rest upon the anther wings, keels 2-4 x 1.5-2.0 mm at base, narrowed upwards to the truncate or emarginate apex, keels contiguous at the apex and gaping below, often longitudinally folded with the inner fold running along the inner margin and the outer fold extending to the tips of the auricles; beyond the keels the margins of the claw incurve forming a short channel before they dilate to form an ovate or elliptic, acute or apiculate, erect and incurved blade, 5-7 mm long and 3-5 mm broad, corona lobes apparently brown with yellowish keels. Anther wings 2.5-4.0 mm long, oblique to ± horizontal, outer edge straight with upcurved concave basal angles; appendages 1.5-2.6 mm long, broadly ovate, obtuse to subacute apex inflexed over and covering the style apex.
            sourceIds:
              - sanbi_2976_0
            locator: "SANBI/WFO archive Morphology row 76483; source 2976.0; publication: Smith, DMN. 1988. A revision of the genus Pachycarpus in southern Africa. S. African J. Bot. 54(5): 399 - 439. [Copyright held by the South African Association of Botanists (1988); http://www.sciencedirect.com/science/journal/02546299]. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: The specific epithet plicatus (= folded into pleats or furrows, usually lengthwise) refers to the longitudinal folds in the coronal keels. This species is easily recognized by its distinctive corona lobes and by the anther wings, which are oblique to subhorizontal, whereas in all other species they are vertical or slightly oblique. It is, however, sometimes confused with P. macrochilus, but in that species the flowers are often larger (corolla 16-28 mm long, not 11-19 mm) and the corona lobes quite different.
