      evolution:
        status: partially-supported
        claims:
          - text: In a population-genomic sample of 982 maize inbred lines and 190 teosinte accessions, the study's neighbor-joining tree grouped the sampled maize lines into a monophyletic clade, with sampled Central Balsas Zea mays ssp. parviglumis accessions closest to maize. The authors interpreted this pattern as support for one maize domestication event and the Balsas River valley as its center. This is an inference from sampled germplasm, not a direct observation of domestication or a complete evolutionary account.
            textZh: 在一项包含 982 个玉米自交系和 190 份大刍草种质的群体基因组样本中，邻接法系统树将所采样的玉米材料聚为一个单系支，并显示采自中央巴尔萨斯地区的 Zea mays ssp. parviglumis 材料与玉米最近。作者将这一模式解释为支持玉米发生过一次驯化、且巴尔萨斯河谷是驯化中心。这是基于抽样种质的推断，不是对驯化过程的直接观察，也不是完整的物种进化史。
            originalLanguage: en
            sourceIds:
              - xu2022zea
            locator: Results, Genetic structure within the genus Zea; Methods, Plant material and Genotyping and SNP quality control.
            placeTimeScope: Genome-wide analysis of 982 maize inbred lines and 190 teosinte accessions sampled from Mexico and Central America; article published 2022-02-18. The claim is limited to the sampled lines and the study's population-genetic interpretation.
            lifeStatus: Evidence includes cultivated maize inbred lines and sampled teosinte accessions; it is not a census of wild populations.
        gaps:
          - A population-genomic analysis of sampled germplasm supports a bounded relationship and domestication inference but does not provide a complete evolutionary history, full subspecies coverage, or direct archaeological observation.
