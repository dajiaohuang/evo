      confidenceRationale: Mammaliaformes uses Luo, Z.-X.; Kielan-Jaworowska, Z.; Cifelli, R.L. (2002) because the cited pages and locator expose the sampled taxon, specimen or living sequence set. Confidence is medium and applies only to Mesozoic mammaliaform sample and living continuation represented in Luo et al.; broader endpoints remain unclaimed.
