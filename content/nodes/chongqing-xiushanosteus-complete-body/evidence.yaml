  claims:
    - subjectId: event:chongqing-xiushanosteus-complete-body
      claimKind: scientific
      claimType: morphology
      statement: Xiushanosteus mirabilis holotype IVPP V300001 and referred specimens IVPP V300002–V300021 from the middle-to-late Telychian Huixingshao Formation at approximately 436 Ma preserve an approximately 30 mm placoderm-grade stem-gnathostome body and a mosaic skull roof; this is articulated specimen evidence, not a direct ancestor, global dominance estimate or global jawed-vertebrate FAD.
      confidence: high
      confidenceRationale: Multiple articulated specimens directly preserve the small body and cranial armor, and the primary study provides a specimen list, horizon and detailed figures. The high confidence applies only to the documented material and character mosaic; placoderm-grade relationships remain poorly resolved and are not converted into ancestry.
      referenceLinks:
        - relation: supports
          referenceId: zhu-2022-chongqing-gnathostomes
          pages: 954–958, especially pp. 955–957
          figure: Figures 1a, 2 and 4; Extended Data Figures 3a–e and 4–6
          quoteLocator: Systematic palaeontology; anatomical description; phylogenetic and morphospace discussion
  claim-rationales.zh:
    - 多件关节相连标本直接保存小型躯体与颅甲，一手研究给出了标本清单、层位和详细图版。高置信度只适用于已记录材料及性状镶嵌；盾皮鱼等级的关系仍解析不足，不能转化为祖先关系。
  claim-statements.zh:
    - 约 436 Ma 中—晚特列奇期回星哨组的 Xiushanosteus mirabilis 正模 IVPP V300001 与归入标本 IVPP V300002–V300021，保存了约 30 毫米长、盾皮鱼等级的有颌类干群躯体及镶嵌式颅顶；这是关节相连标本证据，不是直接祖先、全球优势度估计或有颌脊椎动物全球首现。
