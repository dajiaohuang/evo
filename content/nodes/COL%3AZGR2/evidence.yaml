    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Bulb subglobose, varying in size, up to 19 cm diam., narrowing abruptly into a long stem-like neck, 30-120 cm high, multiplying prolifically from the base. Leaves from the top of the false stem, ensiform, narrowing towards apex and base, about 65-150 cm long and 6-12 cm broad, parallel veins obvious and the midrib thickened on the lower surface, margins slightly undulate, smooth. Peduncle about 70 cm long or longer, somewhat flattened 1.5-3 cm broad. Spathe-valves 5-12 cm long, 1.5-3 cm broad at base, narrowing towards apex; bracteoles narrowly linear. Umbel 5-10-flowered. Pedicels 1-8 cm long. Perianth with a long greenish cylindric tube, widening slightly at the apex, 8-10 cm long, erect at first, becoming cernuous as the flower matures; segments white, usually suffused with pink (but without a deep red keel) subspreading or forming a rather wide funnel, oblong-elliptic, about 8-10 cm long, 2.4-4 cm broad, the inner slightly broader than the outer, peaked apex green, 3-6 mm long. Filaments declinate, tinged pink or red in the upper portion. Style red towards the apex. Fruit not beaked.
