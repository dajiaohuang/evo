        usage:
          title: Canavalia glabra (M.Martens & Galeotti) J.D.Sauer, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Vine trailing or climbing on herbs and shrubs; stems glabrate, sometimes with sparse erect brownish hairs. Leaves pinnate trifoliolate, leaflets mostly 10-14 cm long, 4-7 cm wide, ovate, apically acuminate, acute or obtuse with a short acu- men, sparsely pubescent with weak white hairs. Inflorescence to 20 cm long; bracteoles rotund, ca. 2 mm long; pedicels ca. 3 mm long. Flowers white or rose; calyx ca. 13 mm long, pubescent with short, dense hairs, the tube relatively long, the upper lip as long as the tube, forming a short umbo, the top of the calyx with a distinct hump behind the recessed area behind the lip, the lowest tooth ca. 2.5 mm long, pointed, exceeding the obtuse lateral teeth; standard ca. 4 cm long. Legumes to ca. 20 cm long, 3 cm wide, oblong with a pronounced beak and a short narrow stipe, compressed, glabrescent, with prominent longitudinal ridges at the sutures and each valve with an additional ridge near the sutural ridge; seeds to 15 mm long, oblong, compressed, the hilum ca. 7 mm long.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 4768
