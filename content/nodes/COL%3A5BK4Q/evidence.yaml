          title: Virola elongata (Benth.) Warb., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Dioecious shrubs or small trees to 25 m., the younger branchlets puberulent with ochraceous evanescent hairs. Leaves glabrous above, sparsely puberulent below with fugaceous sessile stellate hairs, subcoriaceous, apically acute to acumi- nate, basally obtuse to acute, 7-32 cm. long, 1.5-11.0 cm. broad; secondary veins 9-20 per side, the tertiary veins obscure; petioles canaliculate, 4-16 mm. long, 1.0-2.5 mm. broad. Staminate fascicles in broad many-flowered panicles 4-18 cm. long, 3-15 cm. broad; pedicels 2-3 mm. long, the subtending peduncle not conspicuously expanded; bracts deciduous, 2-3 mm. long; perianth tardily 3(-4) parted, 1.5-3.0 mm. long; anthers 3(-6), 0.6-1.6 mm. long, connate to apex or distally divergent, the infra-antheral portion of the androecium 0.2-0.6 mm. long. Pistillate flowers few in racemes 4-7 cm. long; tepals densely tomentose with ochraceous, stellate fugaceous hairs; ovary 1-carpellate with a subsessile, obscurely 2-cleft stigma. Fruits 5-40 per inflorescence; pedicels 2-5 mm. long, the glabrescent ligneous pericarp ultimately dehiscing longitudinally into 2 valves, ellipsoid or subglobose, 11-16 mm. long, 8-12 mm. broad; aril deeply laciniate, the seed ellipsoid.
          originalLanguage: en
          sourceField: general
