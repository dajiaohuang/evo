          rank: suborder
          status: accepted
        - id: 3W7
          name: Primates
          authorship: Linnaeus, 1758
          rank: order
          status: accepted
    lifeStatusScope:
      wild: Ecology evidence is from free-ranging gorillas at Loango and Mbeli Bai; life-history evidence is from female western lowland gorillas at one monitored Mbeli Bai population during 1995–2020. The genomic study used samples mostly from wild-caught zoo-held specimens and is not contemporary field sampling. The morphology source used archival crania, but original wild or captive status is not documented specimen by specimen for the target sample. No claim is extrapolated to every Gorilla gorilla population.
      domesticated: Domestication was not examined. The genomic study used mostly zoo-held, wild-caught specimens; individual origins are not all resolved, and no domesticated biology is asserted.
      fossil: No fossil evidence is assessed in this record.
