  catalogue-dossier:
    scientificName: Gorilla gorilla (Savage & Wyman, 1847)
    rank: species
    sourceDatasetId: "2144"
    identity:
      method: Exact accepted COL26.8 usage record queried at ChecklistBank dataset 316115; name, authorship, species rank, accepted status, source sector, and parent chain were checked from the taxon endpoint.
      scope: COL26.8 usage 3H3C9 only. Existing ecology evidence is from one western lowland group at Loango and two tool-use observations at Mbeli Bai; evolutionary evidence is one model-based demographic history from 14 western lowland gorilla genomes; female life-history estimates concern one free-ranging western lowland population at Mbeli Bai; and morphology evidence concerns facial fluctuating asymmetry in one archival western-lowland cranial sample from a comparative study of three subspecies. These bounded samples do not constitute a species-wide or range-wide synthesis.
      parentChain:
        - id: 62SMC
          name: Gorilla
          authorship: I. Geoffroy Saint-Hilaire, 1852
          rank: genus
          status: accepted
