        claims:
          - text: "Plants to 2 m tall; stems semi-woody; leaves deep glossy green, blades narrowly elliptic, acuminate, thin, nerves prominent, 170-300 x 40-65 mm, tapering basally into a short petiole and longer sheath. Inflorescences erect, 5-15-flowered, to 70 mm long; peduncles zig-zagging; bracts narrowly ovate, acuminate, 10-20 mm long. Flowers: sepals greenish, petals and lip white; tepals subequal, linear-spathulate, c. 60-70 x 2 mm, stalk almost triangular, blades acute, to 4 mm wide. Lip similar, but terminal blade 8-10 mm wide, margins crenulate. Gynostemium slender, terete, to 60 mm long; lateral gynostemium appendages 2-3 mm; anther c. 7 mm long; rostellum slender, bifid, 3 mm long."
