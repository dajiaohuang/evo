  claims:
    - subjectId: taxon:cnidaria
      claimKind: scientific
      claimType: fossil-range
      statement: The Cnidaria root display uses 562–0 Ma as a sampled navigation envelope from the older bound of the 562–557 Ma Auroralumina horizon to living cnidarians; the fossil's crown placement is a morphology-analysis result, not the observed origin of Cnidaria.
      confidence: medium
      confidenceRationale: The named horizon and preserved polypoid anatomy are directly documented, while the medusozoan stem placement and resulting crown-Cnidaria minimum remain character- and matrix-dependent. The range therefore preserves the sampled boundary and its uncertainty.
      referenceLinks:
        - referenceId: dunn-2022-auroralumina
          relation: supports
          pages: 1095–1104
          figure: Figures 1–5; Extended Data Figures 1–8
          quoteLocator: Bed B horizon and 557–562 Ma age; holotype anatomy; phylogenetic position
  claim-rationales.zh:
    - 具名层位和保存的水螅体解剖可直接核实，但干群水母类位置及其冠群最小年龄仍依赖性状和矩阵；范围保留采样边界及其不确定性。
  claim-statements.zh:
    - 刺胞动物门根节点采用 5.62 亿年前至今的采样导航包络，从 5.62–5.57 亿年前 Auroralumina 层位的较老边界延伸到现生刺胞动物；该化石的冠群位置是形态分析结果，不是刺胞动物起源的直接观察。
