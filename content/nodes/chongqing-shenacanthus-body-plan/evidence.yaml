  claims:
    - subjectId: event:chongqing-shenacanthus-body-plan
      claimKind: scientific
      claimType: morphology
      statement: The sole near-complete Shenacanthus vermiformis holotype IVPP V300000 from the approximately 436 Ma Huixingshao Formation combines minute scales, absence of facial dermal bones and a chondrichthyan-like posterior branchial region with large thoracic armour plates; it is total-group chondrichthyan evidence, not a crown-shark diagnosis or a global Chondrichthyes FAD.
      confidence: medium
      confidenceRationale: The body-plan mosaic is directly illustrated in an articulated holotype, but only one specimen is known and no teeth are preserved. Maximum-parsimony and Bayesian analyses differ in the details of its position, so the atlas retains total-group placement without overstating a precise stem node.
      referenceLinks:
        - relation: supports
          referenceId: zhu-2022-chongqing-gnathostomes
          pages: 954–958, especially pp. 956–958
          figure: Figures 1a, 3 and 4; Extended Data Figure 8 and phylogenies
          quoteLocator: Systematic palaeontology; Shenacanthus description; phylogenetic results and Discussion
  claim-rationales.zh:
    - 体制镶嵌直接图示于一件关节相连正模，但目前仅有这一件标本且没有保存牙齿。最大简约法与贝叶斯分析对其具体位置存在差异，因此图谱保留总群归属而不夸大精确干群节点。
  claim-statements.zh:
    - 约 436 Ma 回星哨组唯一近完整的 Shenacanthus vermiformis 正模 IVPP V300000，将微小鳞片、面部皮骨缺失和软骨鱼样后鳃区与大型胸部甲板组合在一起；它是软骨鱼总群证据，不是冠群鲨类诊断或软骨鱼纲全球首现。
