      morphology:
        status: partially-supported
        claims:
          - text: Perennial herb, up to 0.75 m high. Leaves 2-7, forming a 5-500 mm long false stem by their sheathing parts, free part of petiole shorter than 100 mm. Involucral bracts obvious, 30-85 mm long. Flowers white and orange-red to pinkish.
            textZh: Scadoxus puniceus (L.) Friis & Nordal 的 SANBI 物种条目记录了形态特征。
