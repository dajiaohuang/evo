          - text: False stem longer than 5 cm; free part (i.e. not the sheathing part) of the petiole shorter than 10 cm; 9-15 nerves on each side of the midnerve in the lamina; inflorescence usually with more than 30 flowers; involucral bracts often more than 4 and usually not uniform; pedicels more than 1 cm long at anthesis.
