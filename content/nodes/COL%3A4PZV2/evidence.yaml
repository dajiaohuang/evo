    facets:
      morphology:
        status: partially-supported
        claims:
          - text: A straggly shrub; branches sparingly canous-pubescent, with longitudinally splitting bark. Leaves opposite, contiguous but not connate at the base, linear-lanceolate, subobtuse, keeled, 0.5-1 cm long, 2-3 mm broad, thick and coriaceous, softly and shortly canous-tomentellous on both surfaces. Heads 5-flowered, solitary, terminating short leafy branchlets, cylindric, 1.5 cm long, about 5 mm in diameter across the middle. Involucral bracts 4-5-seriate, closely imbricate, the outermost broadly ovate-triangular, subacute, 3-4 mm long, the innermost ovate-lanceolate, about 8 mm long and 5 mm broad, all with a distinct midrib and a broad band of short canons indumentum up the middle, the outer and intermediate ones shortly ciliate. Receptacle small, fimbriate. Corolla 1 cm long, gradually widened upwards, slightly ribbed, glabrous; lobes lanceolate, 3 mm long. Anthers not exserted beyond the tips of the lobes. Achenes 5 mm long, appressed silky-villous in the lower part. Pappus about 9 mm long, brownish yellow.
