            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Of all the species of subgenus Gemmaria, S. aestivalis is remarkable in having wide nectar wells formed by the fusion of the lateral margins of the inner filaments to the sharp edges of the triquetrous style. This specialised characteristic is also well developed in subgenus Strumaria and indicates parallel development in the two groups. Vegetatively, S. aestivalis most closely resembles S. pubescens, in having yellow-fleshed bulbs and broadly lorate pubescent leaves; both are derived characters, which points to a close alliance between the species.
            textZh: SANBI 条目提供了 Strumaria aestivalis Snijman 的鉴别特征。
