    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Bulbous geophyte, 70-120 mm tall. Leaves 2(3), dry at flowering, recurved, strap-shaped, both surfaces covered with long silky white hairs. Flowers in a dense cluster, widely funnel-shaped, white with a pale pink median stripe on each tepal.
            textZh: Strumaria aestivalis Snijman 的 SANBI 物种条目记录了形态特征。
