    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Several-stemmed, glabrous, glaucous, annual herbs, 15-30 cm high. Leaves 1-3 cm long, pinnately 3-9-lobed with linear lobes, sometimes crowded near the base. Racemes terminal, lax, several-flowered. Pedicels 7-8 mm long in flower, slender, erect; 0.9-1.3 cm long in fruit, ascending, spreading or recurved. Sepals 4-6 mm long, 1.3-2 mm broad, narrowly oblong; the outer 2 cucullate; the inner 2 strongly saccate, membranous-margined. Petals 7.5-9.5 mm long, 4.5-8.5 mm broad, obovate or broadly obovate, sometimes with an appendage. Filaments 3.1-4.5 mm and 3.5-5 mm long, the short ones with or without appendages. Anthers 1.5-2.8 mm long. Ovary linear; style very short with a large capitate stigma; ovules 36-66. Fruits 1.8-4.5 cm long, 1.9-2.6 mm broad, linear to linear-oblong with straight margins; valves flat, 1-nerved, reticulately veined; style 0.5-1.8 mm long, stout. Seeds 1.4-2 mm in diameter, circular, winged.
