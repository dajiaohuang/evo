    facets:
      morphology:
        status: not-assessed
        claims: []
        gaps:
          - The breeding-phenology study did not assess diagnostic morphology or species-level variation.
      lifeHistory:
        status: partially-supported
        claims:
          - text: In the author's Skåne monitoring series, start of breeding among local Rana temporaria populations varied by as much as three weeks within a year. The observations span 1990–2015, with the number of monitored ponds varying from 29 to 84 and the most distant ponds separated by 60 kilometres; this is a local monitoring series, not a species-wide phenology estimate.
            sourceIds:
              - loman2016
            locator: Abstract; Methods > Monitoring frog spawn.
            placeTimeScope: Skåne province, southern Sweden; monitoring from 1990 through 2015; 29–84 ponds depending on year, maximum pond separation 60 km.
            lifeStatus: Wild breeding populations observed through their spawn at ponds.
            originalLanguage: en
            textZh: 在瑞典南部斯科讷的 Rana temporaria 监测序列中，同一年内当地种群的开始繁殖时间最多相差三周。观察持续于 1990–2015 年，每年监测 29–84 处池塘，最远池塘间距为 60 千米。研究通过池塘卵团观察野生繁殖种群；这是地方监测序列，不能作为整个物种的繁殖物候估计。
        gaps:
          - This local time series does not cover the species' range, other life stages, survival, or reproduction outside the monitored ponds and years.
      ecology:
        status: partially-supported
        claims:
          - text: For 19 Skåne ponds with logger data in 2011–2015, earlier mean breeding time was associated with warmer average logged pond temperatures and larger average breeding congregations, estimated from spawn-clump counts; the reported temperature and congregation terms were statistically significant. Substantial residual pond variation remained, and this observational association does not identify a causal mechanism.
            sourceIds:
              - loman2016
            locator: Methods > Temperature measurements in ponds; Results paragraph beginning ‘There were effects of pond temperature’; Figure 5.
            placeTimeScope: 19 logger ponds in Skåne, southern Sweden; breeding and temperature subset from 2011–2015. Spawn-clump count was used as the breeding-congregation estimate.
            lifeStatus: Wild breeding populations; no captive frogs were studied.
            originalLanguage: en
            textZh: 在斯科讷 19 处具有 2011–2015 年温度记录仪数据的池塘，较早的平均繁殖时间与较暖的平均池塘温度、以及用卵团数量估计的较大平均繁殖聚集相关；温度和聚集项具有统计学显著性，但池塘之间仍有较大残余差异。这是野生繁殖种群的观察性关联，不能确定因果机制，也不能推广为全分布区的生态结论。
        gaps:
          - A local pond association does not establish mechanism, diet, habitat use across the range, or ecological interactions beyond breeding-site temperature and congregation size.
      evolution:
        status: not-assessed
        claims: []
        gaps:
          - No species-specific phylogenetic or comparative evolutionary analysis was assessed.
      distribution:
        status: not-assessed
        claims: []
        gaps:
          - The Skåne study area is not a range-wide distribution assessment.
      fossil:
        status: not-assessed
        claims: []
        gaps:
          - No fossil evidence or bounded fossil-record search was assessed.
      conservation:
        status: not-assessed
        claims: []
        gaps:
          - No current assessment, population trend, or threat analysis was reviewed.
