        claims:
          - text: Cormous geophyte to 10 cm. Leaf blades ribbed. Flowers long-tubed, violet with dark red markings on lower tepals, a filiform tooth at base of all lower tepals, bracts large and inflated.
            textZh: Lapeirousia violacea Goldblatt 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 7506; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Lapeirousia violacea shares dark violet flowers with reddish to purple and white markings on the lower tepals with L. jacquinii, but they differ markedly in their floral bracts and corms. The corms of L. jacquinii are bell-shaped without the long spiny, laterally projecting teeth typical of the obconic corms of L. violacea, which has inflated outer bracts folded or slightly keeled, thus very different from the shorter, typically two-keeled bracts of L. jacquinii. The two species share pollinators but hybrids between them are unknown in the wild.
            textZh: SANBI 条目提供了 Lapeirousia violacea Goldblatt 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 94449; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
