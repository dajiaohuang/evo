        usage:
          title: Crotalaria rotundifolia J.F.Gmel., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Herb, perennial, prostrate, to 3 dm long; stem terete, sparsely sericeous, pilose. Leaves unifoliolate, the leaflets narrowly elliptic to lanceolate, apex acute, acuminate or mucronulate, the base rounded to cuneate, 18-25 mm long, 5-13 mm broad, the margins entire, above strigose, beneath strigose, the veins on each side of the midvein obscure; petiole 1-2 mm long; stipules absent or winging the stem for up to one cm. Inflorescences leaf-opposed racemes, bearing 1-3 flowers, bracts linear, 3-4 mm long; pedicels 3-4 mm long; bracteoles linear, 3-4 mm long, pilose, located on the base of the calyx. Flowers yellow, 9-10 mm long; calyx 9-10 mm long, the tube campanulate, the lobes 2-3 times as long as the tube, pilose; corolla yellow with maroon veins, 9-10 mm long, the standard 4.5- 6.0 mm long, 4-7 mm broad, retuse, the wings 4-5 mm long, the claws 2-2.5 mm long, oblong oblanceolate, oblique, the keel 6-7 mm long, the twisted beak short; stamens dimorphic, the long anthers 0.9-1.5 mm long, the short anthers 0.3-0.5 mm long; style with a pubescent stigma, sharply geniculate, 4.0-5.5 mm long. Legume inflated, 1.7-2.0 cm long, glabrous, black at maturity; seeds ca. 15, brown, oblique cordiform, to 2.5 mm long.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 5416
