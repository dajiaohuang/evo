        metadataVariant: 0
        usage:
          title: Rustia occidentalis (Benth.) Hemsl., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrubs or small trees, to 5 m tall; branchlets terete, smooth, rimose, often cracking, glabrous. Leaves narrowly oblong to obovate oblong, often falcate, regularly 3 times longer than wide, to 22 cm long, to 9 cm wide, acute or deltoid at the apex, acuminate, the acumen to 3 cm long, usually falcate, basally acute, the costa plane or slightly depressed above, prominent beneath, the lateral veins ca. 15, arcuate, those in the middle of the blade 1.0-2.5 cm apart, stiffly papy- raceous, scarcely discolorous, the intervenal areas with scattered glandular punc- tations, glabrous; petioles slender, to 4 cm long, to 0.2 cm wide, usually angular, the lamina decurrent alate, glabrous; stipules not seen. Inflorescences terminal, solitary, paniculate, occasionally racemiform, shorter than the uppermost leaves, the peduncle absent or 0.5-2.0 cm long, the lateral branches short or to 6.5 cm long, angular, opposite (at least the 2 lowermost pairs), the flowers solitary on reduced ultimate branchlets or in spreading cymules on the upper 1/2 of the branchlets. Flowers with the hypanthium cuneate, to 5 mm long, ca. 2.5 mm wide, glabrous, the calycine cup ca. 0.5 mm long, the margin erose, toothless or with 5 vague, undulate areas; corolla purple or red, the tube compressed cylin- drical, ca. 7.5 mm long, ca. 3 mm wide at the base, slightly constricted medially, stiffly carnose to coriaceous, glabrous except densely white villose at the filament attachment point, the lobes 4, oblong, slightly shorter than the tube, acute or obtuse, glabrous; stamens 5, the anthers oblong, ca. 6.8 mm long, ca. 2 mm wide, obtuse and porocidal at the apex, obtuse basally, dorsifixed near the base, the filaments short, ca. 0.8 mm broad; stigmas 2, erect, concave adaxially, ca. 1 mm long, the style cylindrical, ca. 0.9 mm long, ca. 0.7 mm broad, constricted basally. Fruits briefly pedicellate, capsular, obovoid, ca. 1 cm long, to 0.8 cm wide, truncate at the apex with an annular scar, drying dark brown, thin but lignose, delicately longitudinal striate, glandular punctate, splitting to base into 2 valves, each with a conspicuous, median, longitudinal, seminiferous septum.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 12261
