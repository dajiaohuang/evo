        claims:
          - text: Like L. funicaulis but flowers with sepals villous-tomentose outside, scales inserted at mouth of hypanthium and exserted, skunk-scented.
            sourceIds:
              - sanbi_14458_0
            locator: "SANBI/WFO archive Morphology row 10265; source 14458.0; publication: Beyers, JBP. 2012. Thymelaeaceae: Lachnaea L. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 772 - 775. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Lachnaea villosa superficially resembles L. funicaulis but differs in its inflorescence and floral structure. In L. villosa the inflorescence is pseudobracteate (not bracteate), the upper portion of the hypanthium and sepals are villous-tomentose on the outside (not tomentose- sericeous) and the floral scales are exserted (not enclosed), and arise in the mouth of the hypanthium, (not midway to four-fifths down the upper portion of the hypanthium). It is allied to L. elsieae but can be distinguished from it by being a reseeder, having lanate-ciliate leaves, the upper portion of the hypanthium and sepals being villous-tomentose and by the capitate floral scales.
            textZh: SANBI 条目提供了该种的鉴别特征。
