      claimType: topology
      statement: Hominoidea is represented in the molecular supermatrix by sampled living apes within Catarrhini; the supported node does not include every fossil hominoid or establish a 25 Ma global first appearance.
      confidence: medium
      confidenceRationale: The claim is intentionally limited to the extant sequence sample and separates topology from the atlas display range.
      referenceLinks:
        - relation: supports
          referenceId: springer-2012-primate-supermatrix
          pages: Article e49521
          figure: Figures 1–2
          quoteLocator: Species supermatrix topology for Catarrhini and Hominoidea
  claim-rationales.zh:
    - 主张有意限制于现生序列样本，并将拓扑与图谱显示范围分开。
  claim-statements.zh:
    - 在分子超级矩阵中，Hominoidea 由狭鼻小目内取样的现生猿类代表；有支持的节点不包含每一种化石猿类，也不建立 2500 万年前的全球首现。
