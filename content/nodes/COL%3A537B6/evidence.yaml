        usage:
          title: Strychnos nigricans Progel, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrub, erect or scandent, sometimes climbing; branchlets usually puberulent with minute (to 0.1 mm long), erect, grayish trichomes which are sometimes mamilliform; older branches glabrous, developing dark grayish-brown bark, the lenticels often conspicuous and orbicular to ellipsoidal or oblong. Leaves with petioles 1-7 mm long which are minutely puberulent to essentially glabrous; blades ovate or lanceolate to elliptic or obovate, apicaly acuminate (sometimes long- acuminate), basally rounded or subcordate to cuneate, 2.5-14 cm long, 1-4 cm broad, entirely glabrous on both surfaces or puberulent below on the primary nerves with trichomes to 0.1 mm long, frequently barbate in the axils of the inner pair of principal nerves with trichomes to ca 0.6 mm long, 3(5)-plinerved (occasionally showing a tendency toward pinnate nervation), the primary nerves raised below, impressed above, the reticulation obscure or faint above, faint to prominulous be- low. Inflorescences terminal, cymose, sometimes paniculoid, the various branches essentially glabrous or minutely grayish-puberulent with trichomes to 0.1 mm long. Flowers with pedicels obsolete to 2.5 mm long (the central pedicel of a dichasial unit often reduced); calyx-lobes ovate to ovate-lanceolate, entirely gla- brous or else marginally ciliate, up to 1.2 mm long, often unequal and patulous, exceeding the slight calyx-tube; corolla externally glabrous, the tube 1 mm or less in length, internally glabrous, the lobes ovate or ovate-lanceolate, 1-1.5 mm long, internally papillose on the upper portion, bearded internally at the middle or more toward the base; anthers 0.7-1 mm long, glabrous, sessile or subsessile at the throat of the corolla-tube; ovary subglobose to ovoid, ca 1 mm long, the style glabrous, 1 mm long or less, the stigma small, capitate. Seeds with a white, wooly covering.
          originalLanguage: en
          sourceField: general
