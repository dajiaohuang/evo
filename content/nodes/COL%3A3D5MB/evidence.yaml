            locator: "SANBI/WFO archive Morphology row 10383; source 14144.0; publication: Manning, JC; Goldblatt, P. 2012. Asteraceae: Euryops (Cass.) Cass. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 372 - 375. South African National Biodiversity Institute, Pretoria. [CC BY]"
