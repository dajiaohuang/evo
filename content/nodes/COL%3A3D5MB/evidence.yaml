          - text: E. brevilobus was collected already by Burchell but confused with E. serra until it was finally described by Compton. The species is, however, more related to E. speciosissimus and wageneri by the pinnatipartite leaves. It is best distinguished on the short and rigid, spreading leaf-lobes, which are longest in the middle part of the leaf.
