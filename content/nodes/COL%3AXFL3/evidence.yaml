    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Weedy annuals with long, straggling stems rooting at the nodes, usually glabrous. Leaves broadly linear-acuminate, cordate and amplexicaul at the base, 50-90 x 10-15 mm, pale green, margins often crenulate, minutely and sparsely setaceous with the setae appressed to the leaf-surface. Spathes pedunculate, short and broad, free or fused basally, acute, c. 20 x 10 mm. Upper cyme 0 or represented by a peduncle. Flowers with blue petals. Capsule quadrate with the dorsal locule aborted or rarely 1-seeded; seeds cylindric-ellipsoid, 3 mm long, smooth, farinose with a short thick hilum, slightly marbled.
