        usage:
          title: Solanum umbellatum Mill., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrubs or trees 1-3(-7) m tall; twigs loosely pubescent with long-stalked, pauciradiate hairs, the stalks multiseriate and stout. Leaves to 20 cm long and 10 cm broad, lanceolate to elliptic, narrowed at each end, above usually drying dark with small, dispersed, sessile, porrect stellae; minor leaves usually ovate to lanceolate, pointed. Inflorescence a long-stalked cyme standing well above the foliage, the peduncle branching in the upper portion, loosely pubescent or tomentose with pauciradiate stellae on multiseriate stalks; pedicels 3-6 mm long, pubescent, articulating at the base. Flowers with the calyx 2-5 mm long, lobed 34 the way or more, tomentose or glabrescent, glabrous within; corolla white, drying olivaceous or brownish, 10-15 mm across, tomentose without, lobed slightly to deeply; filaments glabrous, the anthers 3 mm long; ovary glabrate. Fruits 8-10 mm across, yellow when ripe, glabrous; seeds 1.5-2 mm long. This species is distinct in the shaggy pubescence of the inflorescence, which consists in part of porrect stellae on long coarse multiseriate stalks.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 13350
          archiveSourceId: D7FDDDA1-486D-4B74-929C-3270EBD87B39
