    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants usually solitary, short-stemmed, 250-500 mm tall excluding inflorescence. Leaves ±20, spreading, 175-350 x 50-90 mm, blue-green in summer, blue-purple in winter, upper surface flat to slightly channelled, with many irregular pale spots, lower surface convex, lineate, with or without irregular spots. Inflorescence with ± 8 ultimate branches, up to 1 m tall; racemes cylindric-conical, dense, up to 175 mm long; bracts deltoid-acuminate, 14-20 x 2-4 mm, 5-9-nerved; pedicels 15-30 mm long, lengthening in fruit. Flowers 19-35 mm long, brilliant orange or sometimes varying from yellow to red, subclavate above basal constriction; outer segments free for 5-9 mm, inner segments adnate to outer. Anthers exserted 1-4 mm. Ovary 7-8 x 2-3 mm; style exserted 2-5 mm. Fruit ±16 x 8 mm.
