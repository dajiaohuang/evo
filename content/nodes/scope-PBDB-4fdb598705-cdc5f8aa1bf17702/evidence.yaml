  claims:
    - subjectId: taxon:teilhardina
      claimKind: scientific
      claimType: fossil-range
      statement: Separately catalogued Teilhardina dental samples in China, Belgium and Wyoming occur in correlated PETM sections within an approximately 56–55.8 Ma sequence; correlation and dental taxonomy do not make them one migrating population or a global genus origin.
      confidence: medium
      confidenceRationale: The primary paper directly reports specimens and section correlations. Medium confidence retains taxonomic and correlation dependence.
      referenceLinks:
        - relation: supports
          referenceId: smith-2006-teilhardina
          pages: 11223–11227
          figure: Figures 1–3
          quoteLocator: Locality sequence; dental samples; carbon-isotope correlation
    - subjectId: taxon:teilhardina
      claimType: taxonomy
      claimKind: scientific
      statement: The primary study identifies separately catalogued PETM dental samples as Teilhardina in three sections, while keeping their correlated appearance sequence distinct from a single population, direct ancestry or a crown-Primate diagnosis.
      confidence: medium
      confidenceRationale: Dental identification is directly reported, but the cross-continental sequence depends on species assignments and correlation rather than association in one population or skeleton.
      referenceLinks:
        - referenceId: smith-2006-teilhardina
          relation: supports
          pages: 11223–11227
          figure: Figures 1–3; Supporting Tables
          quoteLocator: Teilhardina dental identifications and morphological sequence across the correlated PETM sections
    - subjectId: taxon:teilhardina
      claimType: biogeography
      claimKind: scientific
      statement: The profiled Teilhardina samples are from the Hengyang Basin in China, Dormaal in Belgium and the Bighorn Basin in Wyoming; these three correlated localities do not establish a complete distribution or migration track.
      confidence: medium
      confidenceRationale: The paper directly reports the sampled localities and their correlated sequence, while unrecorded localities and movement between them remain outside the specimen evidence.
      referenceLinks:
        - referenceId: smith-2006-teilhardina
          relation: supports
          pages: 11223–11227
          figure: Figures 1–3
          quoteLocator: Hengyang, Dormaal and Bighorn Basin section locations and carbon-isotope correlation
    - subjectId: taxon:teilhardina
      claimType: ecology
      claimKind: scientific
      statement: The three correlated Teilhardina samples are dental and stratigraphic evidence; they do not directly record diet, habitual habitat, locomotion, body mass or ecological guild.
      confidence: high
      confidenceRationale: The primary study's named material and figures delimit the evidence to dental samples and section context, so the profile withholds unobserved ecological attributes.
      referenceLinks:
        - referenceId: smith-2006-teilhardina
          relation: supports
          pages: 11223–11227
          figure: Figures 1–3; Supporting Tables
          quoteLocator: Dental sample descriptions and PETM section comparison; no associated postcranial or behavioural observation
    - subjectId: taxon:teilhardina
      claimType: morphology
      claimKind: scientific
      statement: Dental comparisons among separately catalogued Teilhardina samples support the reported PETM morphological sequence; no associated postcranial skeleton is documented by this comparison.
      confidence: medium
      confidenceRationale: The figures and supporting tables directly support the dental comparison, but sample association, species assignment and broader anatomical reconstruction remain limited.
      referenceLinks:
        - referenceId: smith-2006-teilhardina
          relation: supports
          pages: 11223–11227
          figure: Figures 1–3; Supporting Tables
          quoteLocator: Dental morphology and intercontinental morphological sequence
  claim-rationales.zh:
    - 一手论文直接报告标本与剖面对比；中等置信度保留分类和对比依赖性。
    - 牙齿鉴定由一手论文直接报告，但跨洲序列依赖物种归属和地层对比，而非同一种群或同一骨架的关联。
    - 论文直接报告了取样地点及其对比序列；未取样地点和地点之间的实际移动均超出标本证据范围。
    - 一手论文中具名材料和图版把证据限定为牙齿样本及剖面背景，因此档案明确保留未被观察到的生态属性。
    - 图版和补充表格直接支持牙齿比较，但样本关联、物种归属和更广泛的解剖重建仍受限制。
  claim-statements.zh:
    - 中国、比利时和怀俄明分别编号的 Teilhardina 牙齿样本位于彼此对比的 PETM 剖面中，形成约 5600 万—5580 万年前的出现序列；地层对比与牙齿分类不使其成为同一迁移种群或全球属级起源。
    - 一手研究在三个剖面中将分别编目的 PETM 牙齿样本鉴定为更猴属，同时把其对比后的出现序列与单一种群、直接祖先关系或灵长类冠群诊断明确区分。
    - 档案中的更猴属样本来自中国衡阳盆地、比利时多尔马尔和美国怀俄明州大角盆地；这三个经对比的地点并不能确立完整分布或迁徙路线。
    - 三个经对比的更猴属样本仅提供牙齿和地层证据；它们并未直接记录食性、惯常栖息地、运动方式、体重或生态类群。
    - 分别编目的更猴属样本之间的牙齿比较支持所报告的 PETM 形态序列；该比较没有记录关联的颅后骨骼。
