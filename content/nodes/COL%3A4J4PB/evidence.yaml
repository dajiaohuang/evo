          originalSourceText: A shrub or small tree, up to 3-4 m. tall, nodose; flowering internodes somewhat zigzag, slender and rather short, granular, sparingly crisp-pubescent; leaves elliptic or elliptic-oblanceolate; the midrib somewhat nearer one side, apex narrowly atten- uately acuminate, base inequilateral, one side 2-5 mm. shorter, acute or the longer side more rounded and obtusish, 4-6 cm. wide X 13-17 cm. long, somewhat scabrous, pinnately nerved from the lower half, the nerves 4-5 on each side, with cross-connecting-anastomosing nervules, glabrous above, hirsute along the nerves beneath, the hairs suberect, mostly 0.5 mm. or more long, drying papery, green above, paler and glandular-dotted beneath, translucent; petiole about 5 plus 2-5 mm. long, somewhat hirsute, vaginate at the base; spikes as yet young, 2-3 mm. thick X 8-10 cm. long, peduncle up to 1 cm. long, granular, glabrous; bracts rounded- or triangular-subpeltate, narrowly and sparsely fringed; ovary or fruit not developed.
