          publishedAt: undated
          originalSourceText: A shrub or small tree, 2 m. tall; upper internodes comparatively short and slender, loosely to moderately crisp-villous; leaves elliptic, elliptic-oblanceolate or elliptic-subobovate, apex acutely long-acuminate, base 3-5 mm. shorter on one side, obtuse, or longer side cordulate, 5-7 or sometimes 9 cm. wide X 15-20 cm. long, pinnately nerved from the lower half, the nerves 4-5 on each side, with cross- connecting and anastomosing nervules, sparsely white-villous glabrescent above, mostly crisp-villous and slightly scabrous beneath, the nerves more densely so, drying rather thin, green, somewhat glossy, translucent; petiole mostly about 5 plus 3-5 mm. long, crisp-villous, vaginate at the base; spikes 4 mm. thick X 7-9 cm. long; peduncle 1 cm. long, crisp-villous; bracts round-triangular-subpeltate, with a wide, dense yellow fringe; fruit subcylindrical, truncate; stigmas sessile.
