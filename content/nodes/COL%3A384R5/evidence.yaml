        usage:
          title: Dussia cuscatlanica (Standl.) Standl. & Steyerm., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Tree to ca. 50 m tall; young stems yellowish to reddish pubescent, patent to crispate, glabrate. Leaves 11-25-foliolate; the petioles ca. 9 cm long, the rachises 20-40 cm long; petiolules 4-10 mm long; leaflets 5-11 cm long, 3-6 cm wide, the lower leaflets more oval to ovate, terminal leaflet usually obovate, others usually oblong, the apex acuminate to acute, the base obtuse, truncate or subcordate, the upper surface glabrous, the lower moderately pubescent with patent to slightly crispate trichomes. Inflorescence racemose, yellowish to reddish tomentose; bracts tridentate to rhombic or lanceolate, erose to entire, acuminate, 5-10 mm long, 2-4 mm wide, bracteoles obovate, entire or dentate, acuminate, 5-7 mm long, 2-3 mm wide. Flowers (15-)18-25 mm long; calyx 8-10 mm long, the lobes 4-5 mm long; corolla pale pink with a greenish streak along the standard. Fruit 5-10 cm long, 2.5-3.5 cm wide, dehiscent, the valves curling; seeds 2.0-3.5 cm long, 1.3-1.7 cm in diameter.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 4622
