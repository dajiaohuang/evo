            locator: "SANBI/WFO archive Morphology row 49095; source identifier 5961.0; cited publication: Glen, HF; Hardy, DS. 2000. Aloe. In: G Germishuizen & E du Plessis (eds), Aloaceae (first part), Fl. S. Africa 5(1,1): 1 - 167. National Botanical Institute, Pretoria. [http://www.biodiversitylibrary.org/item/209564#page/3/mode/1up]. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Differences between A. spicata and A. vryheidensis are discussed under that species. This pair is unlikely to be confused with any other aloe. The salient differences between A. tauri and A. spicata mentioned in the first description of the former were dimensions and ratios of dimensions in the inflorescence and of the leaves. In almost all of these, there was at least some overlap, the only exception being in Leach's measurements of the raceme length and hence of the raceme:peduncle ratio. Reynolds's and our measurements indicate that here, too, there is overlap.
