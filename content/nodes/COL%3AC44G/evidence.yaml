    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants almost stemless to arborescent, 1-2 m tall; stems simple or branched. Leaves ±30 per rosette, spreading to slightly recurved, 500-700 x 50-95 mm, channelled, green to reddish. Inflorescences 1-5 per rosette, 0.6-1.2 m tall, less than 50 mm in diameter; bracts ovate-acute, 10-11 x 5-7 mm, 3-5-nerved. Flowers sessile, brownish red in bud, greenish yellow to almost white at flowering, 7-15 mm long. Anthers exserted 5-15 mm. Ovary ±4.0-5.0 x 2.5 mm, orange; style exserted 3-15 mm. Fruit ±13 x 6 mm, almost black. Seeds ±2.0 x 1.25 x 0.7 mm, black, without wings.
            textZh: Aloe spicata L.f. 的 SANBI 物种条目记录了形态特征。
