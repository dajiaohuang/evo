          title: Mendoncia costaricana Oerst., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Herbaceous vines, the stem subquadrangular, grooved, strigose to subgla- brous. Leaves elliptic to elliptic ovate, to 10 cm long, 7 cm wide, apically abruptly acuminate and sometimes falcate, the apiculate tip to ca. 2 mm long, basally rounded but slightly short-attenuate, pilose above and beneath, sparingly scabrous above with hairs arising from obscure stellate bases, sparingly pu- berulous beneath, the margins entire; petioles to 4 cm long, sparingly strigose. Flowers axillary, borne singly or in pairs; pedicels ca. 2 cm long, strigose; bracts obovate, to 15 mm long, 11 mm wide, apiculate, basally subcordate, strigose out- side, glabrous within; corollas white with dark spots at the throat, to 3 cm long, 8 mm wide at the throat, the lobes emarginate, 4-5 mm long, 4-5 mm wide; ovary glabrous. Fruit flattened ovoid with double margins, ca. 2 cm long, 1.3 cm wide, 4 mm thick, puberulous.
