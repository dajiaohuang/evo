        status: partially-supported
        claims:
          - text: Bulbous geophyte to 10 cm. Leaves 2, dry at flowering, prostrate, ovate, softly hairy above. Flowers 4-14, on long spreading pedicels, star-shaped, white, tepals flat, style tapering uniformly downwards to a broad base.
            textZh: Strumaria chaplinii (W.F.Barker) Snijman 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13845_0
            locator: "SANBI/WFO archive Morphology row 8816; source identifier 13845.0; cited publication: Snijman, DA. 2012. Amaryllidaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 53 - 62. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Strumaria chaplinii forms a close alliance with S. discifera and S. leipoldtii and more remotely so with S. villosa, all of which occur further north in the Western Cape Province. Each of these species has densely pubescent leaves and similarly-sized, predominantly white, stellate flowers. The flowers of S. chaplinii are characteristically flat and open, with plane-surfaced tepals. The style is broadest at the extreme base and extends smoothly upwards without the sculpturing found at the base of the style in S. discifera. The fleshy inner scales of its bulb are white, easily distinguishing it from S. villosa, which has yellow-fleshed bulbs. The pubescent adaxial leaf surface distinguishes it from the smooth-surfaced, densely fringed leaves of S. leipoldtii.
            textZh: SANBI 条目提供了 Strumaria chaplinii (W.F.Barker) Snijman 的鉴别特征。
