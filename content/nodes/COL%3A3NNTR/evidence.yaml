          title: Hyperbaena allenii Standl., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Small trees; young stems striate, densely pubescent. Leaves petiolate, lanceo- late-oblong, entire, the apex acute or obtuse, the base obtuse or rounded, 14-23 cm. long, 4.5-6.0 cm. wide, subcoriaceous, pinnately nerved, glabrous above, puberulent below; petioles swollen distally, 1.5-3.0 cm. long, densely pubescent. Staminate inflorescence axillary, fasciculate, spiciform, 0.5-3.0 cm. long, the rachis densely pubescent; bracts and bracteoles about 0.5 mm. long, densely pubescent. Staminate flowers; Sepals 6, the 3 outermost small, obovate, obscurely toothed, 0.7-0.9 mm. long, 0.5-0.6 mm. wide, exteriorly pubescent, the 3 innermost conspicuously larger, obovate, obscurely toothed, 1.1-1.4 mm. long, 0.7-0.9 mm. wide, glabrous or with the margins ciliolate; petals 6, obovate, 0.5-0.8 mm. long, 0.3-0.5 mm. wide, glabrous; stamens 6, free, about 1 mm. long, glabrous. Pistillate flower not seen. Fruit ovoid, about 2 cm. long, glabrous.
