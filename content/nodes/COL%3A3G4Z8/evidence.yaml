    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants 750-1500 mm high. Corm depressed-globose, 25-50 mm diam.; tunics initially leathery, fragmenting irregularly and becoming coarsely fibrous. Stem erect, usually with 1 or 2 branches, occasionally more, 2.0-2.5 mm diam. below base of spike. Leaves 8 to 10, lower 4 or 5 ± basal and reaching to ± base of spike, grey-green and somewhat glaucous, blades narrowly sword-shaped to linear, 7-10 mm wide, margins and midribs moderately thickened, cauline leaves progressively smaller above, imbricate and sheathing stem to ± base of spike. Spike slightly inclined, ± straight, 18- to 30-flowered; bracts pale green in bud, dry and light brown above by anthesis, lanceolate-attenuate, apices dry and twisted, 12-16 mm long, inner bracts slightly shorter than outer. Flowers pale pink to nearly white, lower lateral tepals each with a central yellow streak surrounded by a light purple blotch, unscented; perianth tube obliquely funnel-shaped, 10-12 mm long; tepals broadly ovate, dorsal inclined to hooded over stamens, 23 x 14 mm, upper laterals directed forward, weakly curving upward in distal third, 23 x 12 mm, lower 3 tepals united for ± 2 mm, lower laterals narrowed below, 13-14 x 5.5-6.0 mm, lower median 16-18 x ± 8 mm, arching downward. Filaments 14 mm long, exserted ± 8 mm from tube; anthers ± 6 mm long, purple; pollen cream-coloured. Style arching over stamens, dividing opposite lower to upper 1/3 of anthers, branches ± 2 mm long, not reaching anther tips. Capsules ovoid, 3-lobed apically, 5-8 mm long. Seeds ovate, ± 5-6 x 2.5-3.0 mm, wing unevenly developed, sometimes lacking on one side or across middle.
