          - text: "Distinguished from allied species by its tall stature, 750-1500 mm high, narrow glaucous leaves 7-10 mm wide, and small, dry, brittle floral bracts 12-15 mm long. The short-tubed flowers resemble those of Gladiolus densiflorus and G. crassifolius and the three species are best distinguished vegetatively: G. crassifolius has strongly fibrous leaves with more heavily thickened midrib and margins plus at least one pair of secondary veins, and G. densiflorus has leaves with fine, closely set tertiary veins. Some plants in Mpumalanga, where the distribution of the species overlaps, may be difficult to place."
