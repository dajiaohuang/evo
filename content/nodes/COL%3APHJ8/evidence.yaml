        usage:
          title: Calceolaria tripartita Ruiz & Pav., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Annual herb, 0.1-0.7 m tall; stems procumbent or ascending, fleshy, often reddish below, pilose with fine, often glandular hairs. Leaves (1.5-)3-8(-20) cm long, (1.2-)3-7.5(-15) cm broad, very variable, pinnatisect, ovate with 1-3 pairs of elliptic or lanceolate, acute lateral lobes, the apical lobe ovate or lanceo- late, usually somewhat larger than the others, doubly serrate, occasionally incised laciniate, above green and pilose, often with gland-tipped hairs, beneath pale green, pilose or almost glabrous; petioles (0.6-(2-5)-6) cm long, at the lower nodes connate by a swollen ridge across the node. Inflorescence usually of several pairs of axillary pedicels, sometimes a terminal pair of 6-12 flowered cymes; primary peduncles 3-8 cm long; pedicels 1-3 cm long, glandular pilose; bracts, 'when present, petiolate, entire or nearly so, lanceolate, acute, the margin serrate or laciniate; sepals 4-7 mm long, 2.5-4.0 mm broad in anthesis, later somewhat enlarged, green, ovate, acuminate, denticulate, ciliate with gland- tipped hairs; corolla yellow, sometimes with an orange tinge, glabrous, the upper lip 2-3 mm long, 3-4 mm wide, hooded, concealing the fertile parts of the anthers, the lower lip 10-20 mm long, 6-15 mm wide, projecting, saccate most of its length, the proximal part appressed against the upper lip, closing the mouth; anthers 2.0-3.5 mm long, the posterior (upper) cell fertile, the anterior (lower) cell sterile, reduced to a knob, projecting down in the orifice as a blunt club, by leverage bringing the posterior fertile cell from under the hood of the corolla, the connective elongated, slender and sigmoid, occasionally flattened, 1.2-2.0 mm long, the filament 0.5 mm long; style 1.5-2.0 mm long, curved. Capsule widely conic, 5-9 mm long, glandular pilose.
          originalLanguage: en
          sourceField: general
