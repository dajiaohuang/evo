    facets:
      morphology:
        status: partially-supported
        claims:
          - text: "Perennial herb, 200-450 mm high; robust, growing singly. Rhizome subglobose, oblong or turbinate, 4-12 x 4-8 mm. Leaves 8-15, well developed at flowering, coriaceous, erect or recurving, arranged one above the other in 3 ranks, rigid, spirally twisting towards apex with age, waxy; blade lanceolate, sometimes linear-lanceolate, 100-700 x 6-30 mm; ribbed, bases sometimes red or purple; almost glabrous or hairy towards base, margins and midrib outlined in white by a thickened band of squat hairs (ciliate); hairs stellate. Flowers: 5-12-flowered, racemose, 2-5 per plant; perianth segments 10-20 x 6-10 mm, ovate-elliptic, yellow; Aug.- Feb. Fruit a capsule, 6-7 x 5-7 mm, opening by a circular slit."
