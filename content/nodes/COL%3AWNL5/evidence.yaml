        usage:
          title: Cochlospermum vitifolium (Willd.) Spreng., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Tree 5-12 m high, the trunk 5-10 cm in diam, relatively few-branched, the branchlets minutely puberulous, becoming glabrous. Leaves with the petioles slender, to 30 cm long, minutely puberulous when young, the stipules small, sub- ulate, soon caducous; blade cordate-subeircular in outline, usually (3-)5-palmat- ifid, sometimes (3-)5-palmatilobed, to 30 cm in diam, the lobes with acute to, obtuse sinuses, with the apex acute to long-caudate or long-acuminate and minutely mucronulate, with the margins from distinctly crenate to crenulate-serrulate to sub- entire, and with the midvein prominent beneath, the upper surface slightly shiny and glabrous, the lower surface somewhat paler and finely puberulous especially along the veins to nearly glabrous. Inflorescences terminal and paniculate, the panicles erect and spreading. Flowers with the pedicels to 3 cm long, slightly elon- gated in fruit, puberulous; calyx subcoriaceous, minutely tomentellous and sparsely puberulous, the 2 outer sepals ovate to oblong-obovate, rounded (to sometimes acute?) at the apex, 12-18 mm long and 7-9 mm wide, the 3 inner sepals largely obovate to subrotund, rounded at the apex, 20-22 mm long and 16-20 mm wide; petals obovate, 5-6 cm long, yellow; filaments unequal, 8-20 mm long, glabrous, the anthers oblong-linear, ca 4-6 mm long; ovary subglobose, ca 7-8 mm in diam, puberulous; style to 35 mm long, glabrous. Capsules obovoid-ellipsoid, umbilicate, 5-valved, to 8 cm long, grayish-velvety-tomentellous; seeds reniform, 4-5 mm long, dark brown, densely whitish long-lanate.
          originalLanguage: en
          sourceField: general
