        sectionEvidence:
          - sectionOrdinal: 0
            topic: taxonomy
            heading:
              en: A familiar species label conceals unresolved fossil assignments
              zh: 熟悉种名之下有未解决化石归属
            referenceId: ref-e2e04022-53dd-4a54-a9de-957c7d568588
            sourceKey: primary-fossil-pmc4589347-paradoxus
            locator: PMC4589347 XML sec009 paragraph 2; sec020 paragraphs 0–4, 8
            locatorPrecision: manually-recorded-section-and-paragraph-label
            evidenceSummary:
              en: The 2015 paper challenges earlier placement of the Orsberg specimen MB.Am.45 in paradoxus and retains it as Chelotriton sp. Comparisons distinguish neotype-locality material from Enspel and Randeck skeletons traditionally assigned the same name. Thus the 18-by-35-mm skull, extreme posterior jaw joints and forelimb lengths of MB.Am.45 are not paradoxus measurements. The database concept remains retained for navigation, while original specimen identity requires a separate revision. The article’s arguments do not establish a newly named species or complete the reconciliation of every database occurrence.
              zh: 2015 年论文质疑此前将 Orsberg 标本 MB.Am.45 放入 paradoxus，保留为 Chelotriton sp.。比较将新模产地材料与传统归入同名的 Enspel、Randeck 骨骼分开。因此 MB.Am.45 十八乘三十五毫米头骨、极后移颌关节及前肢长度不是 paradoxus 测量。数据库概念保留导航，原标本身份仍需独立修订。论文论证没有建立新命名物种，也未完成每条数据库出现记录核对。
            scope:
              en: Published specimen or comparative scope only; database concept equivalence, species-wide biology and full phylogenetic placement are not independently certified.
              zh: 仅限出版标本或比较范围；数据库概念等同性、全物种生物学及完整系统位置未经独立认证。
          - sectionOrdinal: 1
            topic: morphology
            heading:
              en: Neotype-locality comparisons have their own anatomical scope
              zh: 新模产地比较有自身解剖范围
            referenceId: ref-e2e04022-53dd-4a54-a9de-957c7d568588
            sourceKey: primary-fossil-pmc4589347-paradoxus
            locator: PMC4589347 XML sec007 paragraphs 5–7; sec014 paragraphs 1–2; sec020 paragraphs 1, 7
            locatorPrecision: manually-recorded-section-and-paragraph-label
            evidenceSummary:
              en: The source cites two to four processes per rib in paradoxus material from the neotype locality and an approximately 30–35° orientation of a frontal process to the sagittal plane. Those are comparative reports from particular material, not a universal adult diagnosis or directly remeasured specimens here. The paper records uncertain or variable vertebral and cranial characters across the genus, including preservation-dependent differences. It does not transfer the genus diagnosis’s body-length range or MB.Am.45’s incomplete wrist and digit anatomy to every paradoxus fossil.
              zh: 来源引述 paradoxus 新模产地材料每肋二至四突，以及额骨突相对矢状面约三十至三十五度方向。这是特定材料比较报告，不是通用成体诊断，也不是这里直接重测标本。论文记录属内不定或可变椎骨、头骨性状，含保存相关差别。不能将属诊断体长范围或 MB.Am.45 不完整腕指解剖转移至每个 paradoxus 化石。
            scope:
              en: Published specimen or comparative scope only; database concept equivalence, species-wide biology and full phylogenetic placement are not independently certified.
              zh: 仅限出版标本或比较范围；数据库概念等同性、全物种生物学及完整系统位置未经独立认证。
          - sectionOrdinal: 2
            topic: development
            heading:
              en: Historical metamorphosis interpretations were revised for referred material
              zh: 归入材料的历史变态解释曾修订
            referenceId: ref-e2e04022-53dd-4a54-a9de-957c7d568588
            sourceKey: primary-fossil-pmc4589347-paradoxus
            locator: PMC4589347 XML sec013 paragraph 3; sec019 paragraph 4; sec020 paragraphs 4, 9
            locatorPrecision: manually-recorded-section-and-paragraph-label
            evidenceSummary:
              en: Some skeletons traditionally called paradoxus were earlier interpreted as having a fully metamorphosed hyobranchial apparatus; later cited work interpreted Enspel and Randeck material as retaining larval components. The 2015 discussion uses this as a comparative mosaic-development example. It does not demonstrate that every paradoxus population was paedomorphic, establish a larval duration or measure breeding biology. Because the same paper questions several species assignments, developmental interpretation and the recorded name must remain separate evidence fields.
              zh: 传统称 paradoxus 的一些骨骼，较早被解释为舌鳃装置完全变态；后来引述研究将 Enspel、Randeck 材料解释为保留幼体部分。2015 年讨论将其用于比较镶嵌发育实例，没有证明每个 paradoxus 种群幼态保持、确定幼体年限或测繁殖生物学。论文同时质疑多个种级归属，因此发育解释与记录名称应保留为独立证据。
            scope:
              en: Published specimen or comparative scope only; database concept equivalence, species-wide biology and full phylogenetic placement are not independently certified.
              zh: 仅限出版标本或比较范围；数据库概念等同性、全物种生物学及完整系统位置未经独立认证。
      - doi: 10.1111/joa.13201
        referenceId: ref-0cf2133a-2367-40e4-a3dc-d9ca8347d1d0
        sourceKey: primary-fossil-pmc7369190-paradoxus
        sourceFile: data/sources/snapshots/amphibia-primary-corpus-2026-10-02/PMC7369190/article.xml
        sourceConcept: 2020 tentative Enspel/Randeck paradoxus association, not certified species equivalence
        evidenceRead: Materials/methods, landmark and geometric analysis, lateral/dorsal results, raw XML fossil morphology and phylogeny/ecology/shape results, morphology/phylogeny discussion and raw ecology discussion read; Table1 counts/footnotes; eight tentative Chelotriton fossils, taphonomic/estimation bounds, no independent scans/landmark or original cited ecological studies examined
        contemporaryConceptEquivalence: not-independently-certified
        rightsBoundary:
          license: CC BY 4.0
          licenseUrl: https://creativecommons.org/licenses/by/4.0/
          attribution: Own factual synthesis and Chinese translation of the original study; no figures reproduced.
        sectionEvidence:
          - sectionOrdinal: 0
            topic: taxonomy
            heading:
              en: The 2020 study labels its paradoxus association tentative
              zh: 2020 年研究将 paradoxus 关联标为暂定
            referenceId: ref-0cf2133a-2367-40e4-a3dc-d9ca8347d1d0
            sourceKey: primary-fossil-pmc7369190-paradoxus
            locator: PMC7369190 section 0 paragraph 0; section 5 paragraph 3; XML joa13201-sec-0008 paragraphs 0–1
            locatorPrecision: manually-recorded-section-and-paragraph-label
            evidenceSummary:
              en: Seven Enspel fossils and one Randeck fossil were tentatively associated with paradoxus, following cited earlier work. Their differing skull shapes prompted the suggestion that the deposits may contain different species, and the authors state that named Chelotriton species await validation. Consequently, the study’s pooled fossil shape and size comparisons cannot be certified as a single paradoxus population trait. This preserves the earlier 2015 concerns about historical assignments rather than silently treating a later citation as final identity confirmation.
              zh: 依引述较早工作，Enspel 七个、Randeck 一个化石暂与 paradoxus 关联。不同头骨形状促成两地点或含不同种的建议，作者记具名 Chelotriton 种仍待验证。因此所合并化石形状及大小比较不能认证为单一 paradoxus 种群性状。这保留 2015 年对历史归属的疑问，不把较晚引用悄然当作最终身份确认。
            scope:
              en: Published specimen or comparative scope only; database concept equivalence, species-wide biology and full phylogenetic placement are not independently certified.
              zh: 仅限出版标本或比较范围；数据库概念等同性、全物种生物学及完整系统位置未经独立认证。
          - sectionOrdinal: 1
            topic: fossil
            heading:
              en: Deposit ages and reconstructed skulls have distinct evidence roles
              zh: 沉积年代与重建头骨具有不同证据角色
            referenceId: ref-0cf2133a-2367-40e4-a3dc-d9ca8347d1d0
            sourceKey: primary-fossil-pmc7369190-paradoxus
            locator: PMC7369190 section 1 paragraph 1; section 2 paragraph 0; XML joa13201-sec-0009 paragraph 1; joa13201-sec-0012 paragraphs 2–3
            locatorPrecision: manually-recorded-section-and-paragraph-label
            evidenceSummary:
              en: The cited 24.8–24.6-million-year Enspel interval and 17–15-million-year Randeck interval date the sampled deposits. They do not show continuous occupation by one species between those ages. Shape analysis included estimated missing landmarks and symmetrization of distorted Enspel fossils, and post-hoc comparisons omitted the single Randeck sample. Palaeoclimate and terrestrial-life interpretations belong to the comparative study, not independently established paradoxus thermal limits or directly preserved reproductive behaviour.
              zh: 引述 Enspel 24.8–24.6 百万年及 Randeck 十七至十五百万年区间是所采沉积年代，不证明同一种在两年代间连续占据。形状分析包含缺失标志点估计及变形 Enspel 化石对称化，事后比较排除 Randeck 单样本。古气候及陆生解释属于比较研究，不是独立建立的 paradoxus 耐温或直接保存繁殖行为。
            scope:
              en: Published specimen or comparative scope only; database concept equivalence, species-wide biology and full phylogenetic placement are not independently certified.
              zh: 仅限出版标本或比较范围；数据库概念等同性、全物种生物学及完整系统位置未经独立认证。
