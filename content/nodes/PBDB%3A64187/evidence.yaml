        referenceId: ref-e2e04022-53dd-4a54-a9de-957c7d568588
        sourceKey: primary-fossil-pmc4589347-paradoxus
        sourceFile: data/sources/snapshots/amphibia-primary-corpus-2026-10-02/PMC4589347/article.xml
        sourceConcept: 2015 comparisons to paradoxus neotype-locality material; MB.Am.45 and Enspel/Randeck assignments unresolved
        evidenceRead: Diagnosis and raw XML Material/locality, Affinities, skull outline/roof/other head parts, postcranium, heterochrony, Chelotriton diversity and phylogenetic method paragraphs read; MB.Am.45 genus-only specimen, comparative named taxa kept separate; no original cited specimens, figures or matrix independently examined
