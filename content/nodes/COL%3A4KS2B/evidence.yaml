          originalSourceText: Vine or subscandent shrub. Leaves imparipinnately compound, usually 7-9 foliolate, without tendrils, the leaflets more or less ovate, obtuse to short- acuminate, serrate, truncate to cuneate or somewhat attenuate, 2.5-3.8 cm long and. 1.5-2.0 cm wide, petiolulate. Inflorescence a terminal panicle. Flowers with the calyx large, cupular-campanulate, 1.5-2 cm long, strongly 5-dentate with apiculate lobes, pale lavender when fresh; corolla pale lavender or pinkish with a magenta patch at the base of the 2 adaxial lobes, the tube white with deep magenta lines inside and some pinkish splotches near the base, cam- panulate above a short cylindric base, 6-8 cm long, with scattered lepidote scales on the lobes, glandular-pubescent at the level of stamen insertion inside and pubescent with kinky trichomes in the sinuses between lobes, otherwise glabrous; stamens didynamous, the thecae divaricate, 3 mm long, the longer filaments 1.9-2.0 cm long, shorter filaments 1.4-1.5 cm long, the staminode 3 mm long, inserted ca. 10 mm from base of corolla tube; pistil 3.2-3.4 cm long, the ovary linear, glabrous, 5 mm long and 1.5 mm wide, the ovules 6-seriate in each locule; disc pulvinate, 0.5 mm long and 1.5-2.0 mm wide. Capsule (Sprague) linear and leathery.
