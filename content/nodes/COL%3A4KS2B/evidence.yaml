    facets:
      morphology:
        status: partially-supported
        claims:
          - text: A scandent shrub. Branches long, obscurely 4-angled, glabrous, lenticelled. Leaves 14-19 cm long, usually 9-foliolate; petiole about 4 cm long; leaflets ivy-green, dark above somewhat lighter and minutely gland-dotted beneath, ovate, to narrowly ovate, shortly acuminate, acute, oblique at the base, coarsely crenate on the margin, the average size is 3-6 cm long and 2-3 cm broad, twice or less than twice as long as broad, petioled; petiolule 3-10 mm long. Inflorescence a terminal panicle, few- to many-flowered, branches of the panicle opposite and decussate, glabrous, lenticelled; pedicels 0.4-1.5 cm long, bibracteate near the base and articulate near the apex, the upper portion short and thick about 2 mm long forming a stipe to the flower and falling with it. Calyx inflated, subpetaloid, whitish, 5-lobed and 5-angled, glabrous without and minutely glandular within at least in upper half (glands minutely stalked); tube about 1 cm long; lobes triangular oblong, about 8 mm long usually shorter than the tube, 5 mm broad at the base with the apex apiculate and margins minutely ciliate, eventually spreading to reflexed. Corolla a pale lavender-violet, with the tube pale vinaceous lilac within, faintly tinged yellow and striped (the stripes gold in the basal half and in the upper mallow-purple) faintly scented, about 7.5 cm long; tube funnel-shaped, glabrous without, microscopically glandular in the basal portion within, and sparsely pilose on the lower portion of the throat; the lower narrowly cylindric part about 1.7 cm long, usually longer than the calyx tube, the funnel-shaped upper portion gradually widening to the mouth and somewhat compressed; mouth about 3 cm broad and 1 cm deep; limb 2-lipped, lobes ciliate and faintly and widely undulate, pilose at the sinuses, about 2 cm long and 3 cm broad, the upper pair erect and recurved, the 3 lower spreading with the apical portion somewhat recurved. Stamens 4, included, didynamous, with a staminode between the short posticous pair; filaments white, minutely glandular at the base (glands stipitate) and sometimes sparsely pilose; anther cells eventually diverging, connective produced into an incurved apex and with a dorsal crest between the cells. Disc thick, whitish, annular-cupular, about 1.5 mm high and 2.5 mm in diam. Ovary green, cylindric, 6 mm long, 2-celled; style about 3 cm long, tinged with mallow-purple, 2-lobed, lobes oblong, 2.5 mm long. Fruit 30 cm or more long, sub-cylindric, somewhat compressed, about 10 mm broad and 3 mm thick with the septum running like a midrib down the centre of the broad side; apex acute. Seeds closely packed along a flattened free-central placenta, compressed, with a hyaline border which spreads out into a wing.
            sourceIds:
              - sanbi_291_0
            locator: "SANBI/WFO archive Morphology row 62505; source 291.0; publication: Verdoorn, IC; Connell, ME. 1961. Podranea ricasoliana (Tanfani) Sprague. Fl. Pl. South Africa 34t.1347. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
