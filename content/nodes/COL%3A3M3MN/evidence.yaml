        usage:
          title: Hiraea reclinata Jacq., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Lianas, wide ranging in forest over low vegetation or pendant from larger trees; younger--parts, including peduncles, pedicels, and calyces densely pubes- cent with T-shaped trichomes. Leaves opposite, obovate-oblong, elliptic or ob- ovate, acute or rounded at the apex, sometimes acuminate especially when young, tapered to an obtuse or subcordate base, 5-15(-22) cm long, 2.5-8.5 cm wide, glabrate to sparsely pubescent on surface below, the veins below densely ap- pressed-pubescent; petioles usually ca. 5 mm long, with paired sessile glands near the apex; stipules subulate, borne about midway up the petiole, slender, 3-5 mm long. Inflorescences cymose panicles, axillary, small; flowers in small umbels 1.8-2.2 cm wide; peduncles nearly obsolete or 1-5 mm long, appressed-pubes- cent; bracts and bracteoles ovate, acute, pubescent, to 1.5 mm long; pedicels 9- 25 mm long. Flowers with the sepals triangular to ovate, all but one usually bearing prominent, stalked glands, these greenish-yellow, round to ellipsoid, ca. 1.5 mm long; petals yellow, often marked with orange near the base, membrana- ceous, glabrous, 4.5-7.0 mm long, clawed, the blade orbicular, the petal opposite the glandless sepal with a fimbriate margin; stamens 10, glabrous, of irregular sizes, some directed inward beneath the styles; styles 3, flattened, curved, to 4.5 mm long, the apex subtruncate-spatulate with the inner angle protruding and stigmatic, the dorsal angle apiculate; lobes of the ovary densely pubescent. Fruit a schizocarp of 3 samaras, the wings lateral, orbicular to reniform, 1.2-1.6 cm long, 2-3 cm wide, membranaceous, with sparse appressed T-shaped trichomes and prominent reticulate veins, the margin sinuate; seminiferous area subcuneate, sparsely setaceous, the dorsal crest 2 mm high.
          originalLanguage: en
          sourceField: general
