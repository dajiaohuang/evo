    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Perennial herb, geophyte, 180-250 mm high; corm globose, ± 9 mm in diam., asymmetric with concentric tunics. Leaves 3, lower 2 terete and finely ribbed, blades 8-15 x 1.2 mm, uppermost leaf scale-like, sheathing lower 1/2-2/3 of stem. Inflorescence a 1- or 2-flowered spike, bracts green; flowers relatively small, pale mauve; perianth tube 6-8 mm long, tepals narrow ± 8.0 x 2.5 mm. Stamens with filaments exserted ± 2 mm from tube; anthers ± 4 mm long. Ovary ovoid, ± 2 mm long; style dividing at mouth of perianth tube, branches ± 3.5 mm long. Flowering time Nov., Dec.?.
            textZh: Hesperantha helmei Goldblatt & J.C.Manning 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_18505_0
            locator: "SANBI/WFO archive Morphology row 91014; source identifier 18505.0; cited publication: Bredenkamp, CL; Magwaza, ZL. 2019. Iridaceae. In: CL Bredenkamp (ed.), A Flora of the Eastern Cape Province, Strelitzia 41(3): 1821 - 1882. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Distinctive in its terete, finely ribbed, smooth leaves, and relatively small, pale mauve flowers with a perianth tube 6-8 mm long and narrow tepals ± 8.0 x 2.5 mm. Another unusual attribute of the species is the small sheathing scale-like leaf in the upper part of the stem, a characteristic feature of a small group of species allied to H. pilosa. Among these species H. helmei is perhaps most closely related to H. teretifolia, which also has terete, prominently ridged leaves, the grooves lined with fine ciliate hairs, a feature lacking in H. helmei. The flowers of H. teretifolia are creamy white and larger than those of H. helmei, with a perianth tube ± 8 mm long and tepals ± 10 mm long but the two species are broadly similar in general appearance. The scale-like bract of H. helmei is 8-10 mm long vs. 2-4 mm in H. teretifolia.
            textZh: SANBI 条目提供了 Hesperantha helmei Goldblatt & J.C.Manning 的鉴别特征。
            sourceIds:
