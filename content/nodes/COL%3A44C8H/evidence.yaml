    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, 50-75 cm. Leaf solitary, clasping lower half of stem, channelled, trailing above. Flowers yellow or salmon-pink, tepal claws short and clasping, anthers exserted on a thick filament column.
            textZh: Moraea marlothii (L.Bolus) Goldblatt 的 SANBI 物种条目记载了植株、叶片和花部形态。
            sourceIds:
              - sanbi_13878_0
            locator: Strelitzia 29; archive Morphology row 7405, source 13878.0
            placeTimeScope: Regional species account published 2012; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
          - text: Broadly resembling the widespread Moraea cookii in the solitary broad leaf clasping the lower half of the stem, M. marlothii is a taller plant with slightly smaller, usually half nodding flowers with spreading to half reflexed tepals 27-34 x 11-17 mm and nearly equal vs. outer tepals 30-43 x 14-18 mm and markedly larger than the inner in M. cookii. The filaments are completely united whereas those of M. cookii are free in the upper 1-2 mm. A striking feature of M. marlothii is the slender, curved ovary up to 20 mm long. Moraea marlothii co-occurs on the Hantamsberg with vegetatively similar M. reflexa, which has pendent flowers with the tepals fully reflexed and a top-shaped ovary only 7-8 mm long.
            textZh: SANBI 条目提供了 Moraea marlothii (L.Bolus) Goldblatt 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: Strelitzia 42; archive Diagnostic row 94281, source 18638.0
            placeTimeScope: Regional species account published 2020; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
