  claims:
    - subjectId: event:zachelmie-digit-trackways
      claimKind: scientific
      claimType: morphology
      statement: Eifelian bedding surfaces at Zachełmie preserve quadrupedal trackways and isolated footprints with digit impressions attributed to an unidentified limbed tetrapod trackmaker; the traces do not identify a named body taxon or direct ancestor.
      confidence: medium
      confidenceRationale: The prints, trackway geometry, digit impressions and stratigraphic context are directly documented, but trace-maker identity must be inferred from traces and the environmental interpretation has been debated. Medium confidence preserves the distinction between a digit-bearing trackmaker and a complete body-fossil or ancestor assignment.
      referenceLinks:
        - relation: supports
          referenceId: niedzwiedzki-2010-zachelmie-trackways
          pages: 43–48
          figure: Figures 1–5; Supplementary Figures 1–25
          quoteLocator: Abstract; trackway and footprint descriptions; phylogenetic implications
  claim-rationales.zh:
    - 足印、行迹几何、趾印与地层背景均有直接记录，但造迹者身份必须由遗迹推断，古环境解释也曾存争议。中置信度保留了“具趾造迹者”与“完整身体化石或直系祖先”之间的边界。
  claim-statements.zh:
    - Zachełmie 的艾菲尔期层面保存了四足行迹和带趾印的孤立足印，归因于一种身份未明的具肢四足动物造迹者；这些遗迹不能识别命名的身体分类单元或直系祖先。
