        claims:
          - text: Softly hairy shrublet to 35 cm. Leaves trifid, 20-50 mm long, lobes subterete. Flower heads radiate, large, mostly solitary on elongate, terminal peduncles, yellow or orange; pappus vestigial.
            sourceIds:
              - sanbi_14144_0
            locator: "SANBI/WFO archive Morphology row 10392; source 14144.0; publication: Manning, JC; Goldblatt, P. 2012. Asteraceae: Euryops (Cass.) Cass. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 372 - 375. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: E. hebecarpus has the longest peduncles and largest flowerheads in sect. Psilosteum. In many characters it is reminiscent of members of sect. Euryops (general habit, elongate stout peduncles, large capitula, numerous much-connate involucral bracts, and conspicuous rays). Sometimes a minute pappus is present, consisting of a few very short bristles. Also this character links the species (and the sect. Psilosteum) with other groups of Euryops. The leaves are more or less distinctly pilose with long multicellular hairs, especially when young. The hair-covering on the achenes consists of short tri-cellular obtuse hairs, giving the surface a hoary appearance.
            textZh: SANBI 条目提供了该种的鉴别特征。
