    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants 300-450 mm high, solitary. Corm subglobose, 25-40 mm diam.; tunics coarsely netted, extending into a fibrous collar. Stem erect, simple. Leaves 3 or 4, ± basal or uppermost sub-basal, reaching to base of spike or more, linear to narrowly lanceolate, 4-7 mm wide, channelled or sigmoid in section with margins curved up, midrib and margins moderately thickened and hyaline; bract-like cauline leaves 2 or 3, large. Spike densely 10- to 20(30)-flowered, internodes 4-8 mm long; bracts dry and cinnamon-brown, often greenish brown, with evident pale netted veins, 16-20(-25) mm long, clasping stem in lower 1/3-1/2, strongly overlapping, acute to attenuate, inner shorter, concealed, forked apically for up to 2 mm. Flowers zygomorphic, weakly bilabiate, pink to purple with paler throat, often with darker median streak in basal 1/2 of tepals; perianth tube with lower part 12-18 mm long, upper part ascending and funnel-shaped, ± 15 mm long, 8 mm diam. at mouth; tepals lanceolate, 20-25 x 9-13 mm, upper 3 spreading and lower 3 nearly horizontal. Filaments unilateral and arcuate, 14-20 mm long, reaching mouth of tube; anthers 8-11 mm long, whitish to mauve or violet. Style arching over stamens, dividing near anther apices, branches 5-6 mm long. Capsules narrowly ovoid, ± 10 mm long. Seeds unknown.
            textZh: Watsonia canaliculata Goldblatt 的 SANBI 物种条目记录了形态特征。
