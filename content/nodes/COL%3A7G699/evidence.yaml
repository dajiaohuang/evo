            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Distinguished from other species with dense spikes of moderate-sized, pink, funnel-shaped flowers and coarse, dry, brown, overlapping bracts by its comparatively short, erect stem, 300-450 mm tall, and narrow leaves, 4-7 mm wide, with the margins curved inward so that the leaves are markedly channelled or sometimes sigmoid in section. Watsonia lepida, also a solitary-growing species, has flat leaves 5-15 mm wide, the lowermost dry and broken at flowering, and uniformly dark brown bracts.
