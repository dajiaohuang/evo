        claims:
          - text: Perennial, rhizomatous (older plants with long horizontally creeping rhizomes), up to 0.74 m high. Leaf blades 50-300 mm long, 5-8 mm wide, pectinately ciliate. Spikelets 3.0-3.7 mm long. Panicle whorled; spikelets very densely clustered on upper third of branches, leaving lower part bare; lower glume half the spikelet length; upper glume as long as spikelet.
