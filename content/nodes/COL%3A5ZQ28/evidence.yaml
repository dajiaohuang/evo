        metadataVariant: 0
        usage:
          title: Columnea pectinata C.V.Morton, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Suffrutescent herbs, or vinelike shrubs, epiphytic; stems to 1 or 2 m long, 6-9 mm in diam., rugose, golden brown hirsute, the hairs red to maroon. Leaves of a pair strongly unequal, the larger leaf oblanceolate, 12.4-18.1 cm long and 2.9-5.3 cm wide, the apex shortly acuminate, oblique at the base, sharply serrate towards the tip, above dark green, hirsute, hairs reddish, 4-7 celled, red blotched towards the tip and around the margin below, hirsute, the hairs reddish and more so on the veins and the leaf margins, 5-8 celled, also 2-3 celled white hairs; petioles 2-6 mm long; smaller leaves lanceolate, 0.9-2.3 cm long and 0.3-1.1. cm wide, acuminate, oblique at the base, red tipped or green below, reddish hirsute. Flowers several in each axil; bracts 0.6-1.4 cm long, narrow, acuminate, red to pink hirsute; pedicels 2-5 mm long, coarsely gold or brown hirsute; calyx lobes pectinate, 0.8-1.6 cm long, 4-8 toothed, the teeth 2-3 mm long, red, brown hirsute; corollas orange to scarlet, tubular, 1.6-1.9 cm long, ca. 4 mm in diam. above the base, becoming ca. 6 mm in diam., slightly contracted at the throat, the outside brown pilose, the lobes subregular, spreading to re- flexed, to 2 mnm long; filaments glabrous, the anthers included, yellow; ovary sericeous, the style glabrous, the stigma stomatomorphic. Fruits 9 mm long and 5 mm in diam. when immature, white when mature.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 6199
