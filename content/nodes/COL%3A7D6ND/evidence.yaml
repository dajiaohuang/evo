        claims:
          - text: Perennial, tufted, up to 0.8 m high. Leaf blades 100-250 mm long, 3-5 mm wide. Leaf blades flat. Spikelets 7-9 mm long. Panicle to 250 mm long, usually open, with branches spreading; upper glume two-thirds the spikelet length; rhachilla internodes ± 1.5 mm long, hairy; lemmas glabrous, usually smooth, nerves usually raised, column of awn a loose spiral.
