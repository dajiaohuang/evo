        usage:
          title: Voyria aurantiaca Splitg., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Herb to 18 cm high; the stems orange to purplish-yellow, 1 to several, fastigiately branched at the base, erect, simple or few-branched, slender, terete, glabrous. Scales membranous, -+- hyaline, the opposite cauline scales connate for ca. 1/6-1/2 their length, the cauline scales narrowly ovate, acuminate-subulate at the apex, to 6 mm long and ca. 2 mm wide, much shorter than the internodes, the basal scales much shorter. Inflorescences dichasial, loose, to 7-flowered. Flowers 5-merous, the pedicels 2-8 mm long; calyx colorless, campanulate, 5-6 mm long, the lobes narrowly triangular, long-acuminate-subulate at the apex, about as long as the tube, the sinuses rotund; corolla orange or yellow, 15-20 mm long, the tube cylindric, scarcely dilated at the throat, 12-16 mm long, ca. 1-1.5 mm in diameter, villosulous towards the apex but below the insertion of the stamens within, the lobes spreading, narrowly ovate, acute to abruptly acute apically, 3-4 mm long; stamens inserted somewhat below the throat of the corolla tube, the filaments short, to 1 mm long, the anthers scarcely coherent, oblong, ca. 1 mm long, the thecae shortly apiculate-appendaged at the base, the append- ages ca. 0.5 mm long; gynoecium 10-14 mm long, eglandular, the style slender, 5-7 mm long, the stigma capitate, minutely tuberculate, ca. 1 mm in diameter. Capsule narrowly oblong, acute apically, to 8 mm long, completely dehiscent; seeds wingless.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 6000
