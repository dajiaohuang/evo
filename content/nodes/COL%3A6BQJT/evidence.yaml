        usage:
          title: Cuervea kappleriana (Miq.) A.C.Sm., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Liana, the branchlets usually opposite, often rugose, cinereous or brownish. Leaves with the petiole 8-15 mm. long, the blade elliptic-oblong or ovate-oblong, subattenuate and decurrent at the base, gradually acuminate at the apex, entire or obscurely crenulate at the margins, 8-19 cm. long and 4-10 cm. broad, chartaceous, the costa prominent on both surfaces. Inflorescences 5-12 cm. long. Flowers 10-17 mm. in diam.; sepals broadly ovate or ovate-deltoid, subentire or faintly erosulous at the margins, 1.3-2.5 mm. long, usually obviously flabellate-nerved; petals often strongly concave, obovate-elliptic, rounded at the apex, entire or faintly undulate- crenulate and often inflexed at the margins, 5.5-9 mm. long and 3.5-7.5 mm. broad; disc 0.4-0.7 mm. high, membranous; stamens 1.6-2.2 mm. long; ovary 0.8-1.5 mm. in diam., the ovules 4-6 per cell, the style stout, the stigmas conspicuous, spreading, oblong, obtuse. Mericarps depressed-obovate to suborbicular, 5-9 cm. long, 5.5-10 cm. broad and 1-1.5 cm. thick, the pericarp thin-coriaceous; seeds 4-6 per mericarp, the embryoniferous-portion 2-5 cm. long and 1.5-3 cm. broad, the wing about 20-25 mm. long and 5-10 mm. broad distally, coriaceous.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 6439
