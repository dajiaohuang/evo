    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Erect, much branched coppicing shrubs (chamaephytes), 1.0-1.5 m high, appearing almost 'leafless' at times, as the small cladodes are widely spaced and deciduous in late winter to December. Rhizome compact, woody, covered by acute cataphylls; roots terete, long. Stems several, old and young, bearing a few innocuous applanate spines near the base. Branches curving upwards with many widespreading branchlets. Cladode fascicles placed far apart on branchlets, with 2-4 filiform cladodes, cladodes 2-4 mm long, appearing after flowering (January to July), deciduous. Flowers 2-4, in apical umbels, on short bare branchlets with occasional flowers lower down; tepals 3 mm long, cream or white with a green median stripe; stalks ±4 mm, articulated in lower half. Stamens with yellow anthers. Ovary with ±6 ovules per locule; obovoid, dark; style short. Berry ±6 mm in diameter, red or greyish black. Flowering October to November; in fruit December; with cladodes January to June.
