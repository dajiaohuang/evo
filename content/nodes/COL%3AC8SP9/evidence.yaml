    facets:
      morphology:
        status: partially-supported
        claims:
          - text: The species account describes the type basidioma and microscopic characters and distinguishes A. orientalis by its spore shape and dimensions from related taxa.
            originalLanguage: en
            sourceIds:
              - cui2023
            locator: Section 3.2, Amanita orientalis Q. Cai, Y.Y. Cui & Zhu L. Yang, Diagnosis and Description; Type
            placeTimeScope: Type EFHAAU 1367 from Huangshan, Anhui, China, collected 2018-09-15; the paper lists one additional Huangshan specimen from 2018-07-14. The stated eastern China range is the authors’ account, not a global range.
            lifeStatus: Wild fungal type collection described by the authors.
        gaps:
          - One taxonomic paper and its sampled material do not cover developmental variation, broad population variation, or a complete diagnostic synthesis.
      lifeHistory:
        status: not-assessed
      ecology:
        status: partially-supported
        claims:
          - text: The authors report solitary-to-scattered fruiting on soil in subtropical forests with Fagaceae and Pinaceae.
            originalLanguage: en
            sourceIds:
              - cui2023
            locator: Section 3.2, Amanita orientalis Q. Cai, Y.Y. Cui & Zhu L. Yang, Habitat
            placeTimeScope: Type EFHAAU 1367 from Huangshan, Anhui, China, collected 2018-09-15; the paper lists one additional Huangshan specimen from 2018-07-14. The stated eastern China range is the authors’ account, not a global range.
            lifeStatus: Wild field collections; the stated forest association does not establish a physiological host relationship.
        gaps:
          - The account does not establish interaction mechanisms, resource dependence, seasonality, or population-level ecology.
      evolution:
        status: partially-supported
        claims:
          - text: The combined multilocus analysis groups A. orientalis with A. griseofolia and two South Korean collections identified in the paper as A. ceciliae; the article flags those identifications as erroneous.
            originalLanguage: en
            sourceIds:
              - cui2023
            locator: Results, phylogenetic relationships; Figure 1 and Figures S1–S4
            placeTimeScope: Type EFHAAU 1367 from Huangshan, Anhui, China, collected 2018-09-15; the paper lists one additional Huangshan specimen from 2018-07-14. The stated eastern China range is the authors’ account, not a global range.
            lifeStatus: Modern herbarium collections analyzed in the cited study.
        gaps:
          - Placement is limited to the study taxa, loci, sampling, and analyses; no divergence-time or broader phylogenomic synthesis was assessed.
      distribution:
        status: partially-supported
        claims:
          - text: The authors report A. orientalis as known from eastern China and list type and additional Huangshan collections from 2018.
            originalLanguage: en
            sourceIds:
              - cui2023
            locator: Section 3.2, Amanita orientalis Q. Cai, Y.Y. Cui & Zhu L. Yang, Type, Additional specimens examined, and Distribution
            placeTimeScope: Type EFHAAU 1367 from Huangshan, Anhui, China, collected 2018-09-15; the paper lists one additional Huangshan specimen from 2018-07-14. The stated eastern China range is the authors’ account, not a global range.
            lifeStatus: Reported field-collected specimens; cultivated, introduced, and global range status not assessed.
        gaps:
          - The paper reports its known range and examined collections; no exhaustive global occurrence search or native/introduced assessment was completed.
      fossil:
        status: not-assessed
      conservation:
        status: not-assessed
