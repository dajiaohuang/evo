          originalSourceText: Trees, ca. 6 m high, the branchlets thick, compactly tomentose with dense dark red dendroid trichomes. Leaves with red-tomentose elongated stout petioles 3.5-5.5 cm long, the petioles canaliculate; leaf blades subcoriaceous, elliptic or oblong-elliptic, 13-22.5 cm long and 6.5-10 cm wide, short-acuminate apically, acutish basally, glabrous early above, persistently fine-tomentose beneath with appressed indument, bizonal, the costal zone with red dendroid trichomes intermixed, costa and primary lateral nerves impressed above, conspicuous beneath, the primary lateral veins ca. 20 pairs. Inflorescences terminal, openly pyramidal, tripinnately paniculate, to 22 cm wide, leafy at base, conspicuously red-tomentose, the trichomes dendroid. Flowers corymbose, finely red-to- mentose, the buds at anthesis ovoid-ellipsoid, 5-6 mm long; pedicels to 5 mm long; calyx black-punctate, the sepals ovate-triangular, 1.5-2 mm long, acute; petals linear-lanceolate, tapering from the base to the apex, 6 mm long, black-punctate in lines, villous within except basally; stamens ca. 3.5 mm long, the anthers versatile, slender, linear-lanceolate, ca. 2 mm long, conspicuously black-punctate the entire length, including the basal lobes, the filaments flat-
