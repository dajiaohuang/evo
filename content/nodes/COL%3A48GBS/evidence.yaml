        claims:
          - text: Twiggy, soft shrub, 0.5-1.0 m high; single-stemmed and woody at base. Leaves subfasciculate at nodes, subsessile, subspathulate to oblanceolate, 5-14 x 2-5 mm, base attenuate, apex rounded, margins entire; ± coriaceous; grey-green, densely white-puberulous, especially on lower surface, gland-dotted. Inflorescence slender, spaced with 4-8 verticils. Flowers white, mauve or dull purple. Calyx expanding to 7 mm long in fruit. Corolla 8-9 mm long. Stamens exserted by 7-9 mm. Flowering time all year.
