        claims:
          - text: Like B. stricta but flowers pink to purple, with lobes mostly shorter than tube and stigmas large and orbicular.
            textZh: Babiana purpurea (Vahl) Ker Gawl. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 6712; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Babiana purpurea has pink or purple flowers that at first glance appear to be radially symmetric but the stamens are unilateral and erect and the anthers are parallel, facing the lower tepals, which usually have contrasting markings near the base. The dark blue to blackish anthers are arrow-shaped, suggesting a relationship with B. nervosa and B. villosa of sect. Babiana. Unlike these species, however, the anther connectives are not visibly expanded. The flowers are evidently adapted for pollination by large anthophorine bees that visit the flowers in search of nectar, quantities of which are secreted from septal nectaries into the base of the perianth tube. It can be distinguished from B. nervosa by the pink to red-purple perianth colour, perianth tube 18-28 mm long, and unusual style branches, broadly lobed at the tips and held above the anther apices. Babiana nervosa has white to creamy yellow or blue to blue-mauve flowers with creamy white markings on the lower lateral tepals, a perianth tube 10-18 mm long, and fairly short style branches up to 3 mm long, less prominently expanded at the tips, and usually dividing opposite the lower half to middle of the anthers. Although Lewis (1959) described the flowers of B. purpurea as sometimes having symmetrically disposed stamens, this condition is evidently rare and not representative of the species. Babiana purpurea is sometimes confused with a second species of clay soils in the southern Cape, B. patersoniae, which extends from Napier and Riviersonderend to Port Elizabeth and Alexandria in Eastern Cape. That species has flowers with a longer perianth tube, 20-30 mm long, lightly flared from the base and curved near the apex, a bluish or mauve to nearly white perianth, and a strong sweet fragrance with a strong clove component.
            textZh: SANBI 条目提供了 Babiana purpurea (Vahl) Ker Gawl. 的鉴别特征。
            sourceIds:
