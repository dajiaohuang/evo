        claims:
          - text: Annual, caespitose. Culms 0.13-0.38 m tall, glabrous. Leaves 1-2 mm broad, glabrous or the sheaths minutely pilose towards the truncate or concave mouths. Inflorescence unbranched, 20-65 mm long, or with one short basal branch bearing a single glomerule. Glomerules 2-13-(18) of 1-7 sessile or subsessile spikelets. Bracts acuminate, shorter than or slightly exceeding the spikelets. Spikelets 4-5 mm long. Glumes 2.5-3.5 mm long, glabrous, mucronu- late, pale with red-brown striae, or wholly reddish-brown. Achene subglobose, 1.4-1.8 x 1.2-1.6 mm, glabrous, trabeculate to tuberculate-verrucose, grey possibly with brown stipe (only immature achenes seen).
            textZh: Scleria pergracilis (Nees) Kunth 的 SANBI 物种条目记录了形态特征。
            sourceIds:
