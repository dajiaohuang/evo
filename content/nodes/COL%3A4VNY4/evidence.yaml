            locator: "SANBI/WFO archive Morphology row 79709; source identifier 9620.0; cited publication: Hennessy, EF. 1985. The genus Scleria in southern Africa. Bothalia 15(3 & 4): 505 - 530. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: This annual species may be distinguished from the perennial S. dieterlenii which it resembles in its aerial parts, by the lack of a rhizome or any other perennating stem, by its broadly V-shaped lamina-profile (the lamina-profile of S. dieterlenii is flanged-V- shaped); by its glabrous glumes and by its grey, strongly tuberculate-verrucose achenes with the crests of the tubercles lighter grey.
