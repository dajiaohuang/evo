        usage:
          title: Schultesia guianensis (Aubl.) Malme, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Herb, 5-35 cm tall; stems erect, unbranched or sparsely branched, the branches strongly ascending, 4-angular, slightly winged. Leaves uniformly distributed along the stem; the lamina of the basal leaves ovate, the upper ones narrowly ovate to linear, 0.8-4.7 cm long and 2-8 mm broad, acute to subobtuse at the apex, attenuate to amplexicaul at the base, the lateral veins 1-3, the veins basally connate, inconspicuous, thin-chartaceous. Inflorescences in the upper axils and terminal, borne singly or in simple or compound, few-flowered dichasia; the pedicels to 4 mm long (flowers usually sessile to subsessile); the bracts foliose, narrowly ovate to linear, to 22 mm long and to 4 mm broad. Flowers 1.6-2.6 cm long, dull pale to dirty pink; calyx 1.2-2.2 cm long, urceolate, winged, the wing (1.5-)2-3 mm broad, the densely reticulate veins conspicuous, the lobes narrowly ovate, long-attenuate at the apex, 6-10 mm long; corolla 1.6-2.6 cm long, infundibular, the throat constricted below, the lobes obovate to subspathu- late, rounded to subacute at the apex, 6-8 mm long, covered with numerous, minute, dark purple spots; stamens included, 13.5-16 mm long, inserted basally on the corolla tube, the filaments 12-14 mm long, the anthers 1.5-2 mm long, bilobate at the base with an inconspicuous mucro; pistil exserted, the ovary fusiform, 8-10 mm long, the style 7-9 mm long, the stigma lobes discoid, ca. 2 mm in diameter. Capsule fusiform, 12-14 mm long; seeds irregular, ca. 0.5 mm long.
          originalLanguage: en
          sourceField: general
