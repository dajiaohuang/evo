          - text: If the pressed material is scrappy or the collector's notes incomplete, specimens might be confused with K. albescens or K. breviflora. From the latter it differs in the longer perianth and from both in the buds being distinctly pendulous and scarlet in colour, and the bracts not as long-acuminate.
