    facets:
      morphology:
        status: partially-supported
        claims:
          - text: "Plants usually several-stemmed. Leaves dull green to semi-glaucous, at first erect then recurving or bending ± at middle, 600-900 x 6-12 mm, narrowly keeled; margin and keel smooth. Scape subequal to leaves, 500-850 mm tall. Raceme ovoid to shortly rhomboid, 30-70 x 20-35 mm, dense; buds pendulous, flame-scarlet; flowers at first spreading, later pendulous, orange-yellow to salmon-orange. Bracts ovate-lanceolate, lanceolate or linear-lanceolate, acuminate, 6.5-7.5 mm long. Pedicels 0.5-1.0 mm at flowering stage, elongating up to 2 mm in fruit. Perianth subcylindrical, 13-15 mm long; lobes ovate, 1.5 mm long, not spreading. Stamens exserted by 3-4 mm at anthesis, later withdrawn. Fruit subglobose to ovoid, 6-7 mm long. Flowering time: mid-November to the end of January."
