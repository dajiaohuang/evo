          title: Pouteria calistophylla (Standl.) Baehni, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Tree ca 20 m high. Leaves with petioles 1-3 cm long; blades obovate or ellip- tic-obovate, acuminate, 10-22 cm long, 4.5-10 cm broad, glabrous above, rufous- sericeous-tomentulose beneath (the pubescence mostly appressea), the primary laterals 12-22 pair, prominently raised below, the secondary laterals (except the 9-3 most medial ones) subperpendicular to the primary laterals (although some- what sinuous), sometimes obscured beneath by pubescence, the reticulation sub- obscure. "Well-developed flowers unknown, but a very young flower has a stout pedicel 5 mm long, with 5 sepals and a 5-lobed corolla, the filaments attached at the level of the sinuses, the staminodes narrow, approximately triangular- lanceolate; an overmature flower has 5 deltoid-ovate very firm sepals about 9 mm long, the ovary parasitized, probably originally 2-loculate; fruit unknown"
          originalLanguage: en
          sourceField: general
