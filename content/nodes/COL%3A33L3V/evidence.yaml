    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Bulbous geophyte to 40 cm. Leaves 2-5, green at flowering, linear, greyish. Flowers 2-6, spreading horizontally, tube narrow and curved below, then abruptly inflated and urn-shaped, vermilion, stamens shortly exserted, style 3-branched.
            textZh: Cyrtanthus staadensis Schönland 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13845_0
            locator: "SANBI/WFO archive Morphology row 8809; source identifier 13845.0; cited publication: Snijman, DA. 2012. Amaryllidaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 53 - 62. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Typical specimens with markedly dilated perianth tubes occur in the Van Staadens River Gorge near Port Elizabeth. The tubes are usually somewhat fluted. In other localities the perianth tubes are not dilated to the same degree; extensive fieldwork is necessary to determine whether this species and C. collinus intergrade.
            textZh: SANBI 条目提供了 Cyrtanthus staadensis Schönland 的鉴别特征。
