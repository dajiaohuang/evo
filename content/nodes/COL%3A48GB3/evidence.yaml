          originalSourceText: 0.5-1 cm long. Inflorescences verticils, ca 6-flowered, 1-1.5 cm distant, the false raceme to 17 cm long, the bracts elliptic, ca 3.5-4.5 mm long, the margins pubescent. Flowers with pedicels ca 2-2.5 mm long; bracteoles not apparent; calyx 4-5 long at maturity, pubescent within and without at the base, the hairs ca 2 mm long, the upper lip rounded and acutely tipped, 3-veined, the decurrent margins extending almost to the base, the lower lip 5-7-veined, the lateral teeth wider; corolla tubular, white to yellow-green, the tube ca 2-3 mm long, the lips ca 1-1.5 mm long, the lower lip ? concave; stamens exserted, the lower pair with a small appendage at the base of the filament, the anthers ca 0.6 mm long; ovary 4-lobed, the gynobase lobed, the style bifid near the tip, the branches + equal. Nutlets (3-)4, oblong, ca 1.2 mm long, black, the pericarp ? warty.
