        claims:
          - text: Annual to 30 cm. Leaves linear. Spikelets in a delicate, open panicle, 2-3 mm long, silvery, awned.
            textZh: Aira cupaniana Guss. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13885_0
            locator: "SANBI/WFO archive Morphology row 6414; source identifier 13885.0; cited publication: Manning, JC; Goldblatt, P; Linder, HP. 2012. Poaceae: Aira L. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 203 - 203. South African National Biodiversity Institute, Pretoria. [CC BY]"
