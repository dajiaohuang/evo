            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: A variable species known to intergrade with A. caryophyllea and in Africa the two species can be difficult to separate. In the past, FSA specimens were distributed between the two species, A. caryophyllea L. and A. cupaniana Guss., but are here treated under A. cupaniana, pending further research.
            textZh: SANBI 条目提供了 Aira cupaniana Guss. 的鉴别特征。
