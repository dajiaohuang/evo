        usage:
          title: Stylogyne turbacensis (Kunth) Mez, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: "Shrubs or small trees, glabrous; branchlets slender to stout, terete. Leaves with canaliculate petioles mostly 1-1.5 cm long; leaf blades elliptic or obovate- elliptic, 6-15 cm long and 3-8 cm wide, rounded and abruptly short-acuminate or acutish apically, cuneate or acute and decurrent on the petiole basally, entire, chartaceous to subcoriaceous, finely- and closely-veined, the costa plane or nearly so above, elevated beneath. Inflorescences terminal, pinnately- paniculate, sessile or nearly so, to 6 (-10) cm high and 6 (-12) cm wide. Flowers unisexual or apparently bisexual, 5-merous, subcorymbose; pedicels mostly 3-6 (-11) mm long, rigid in fruit. Staminate flowers: sepals thin, ovate-elliptic, 1.3-1.75 mm long, orange-punctate, the margins wide and thin, minutely erose; petals oblong-elliptic, thin, 4b5-5.5 mm long, asymmetrical, connate basally, orange-lineate; stamens 2.5-3.5 mm long, the filaments 0.5-2 mm long, the anthers linear-oblong, 1.8-2 mm long, dorsifixed above the base, concolorous, twisted, rounded apically; gynoecium abortive, the style 0.5-0.75 mm long. Carpellate flowers: 4.5-5 mm long at anthesis, conspicuously punctate; sepals ovate-oblong to lanceolate-oblong, 1.4-2 mm long, rounded, dorsally punctate with elevated glands, the margin thin and paler; petals oblong-elliptic, 4-4.8 mm long, connate for ca. 1.5 mm basally, obtuse, rounded or obliquely emarginate, orange-lineate; stamens 2-2.22 mm long, the fila- ments 0.8-1 mm long, the anthers 1.2-1.7 mm long, basifixed, concolorous, epunctate; ovary ovoid, 1.2 mm long, the ovules 3-5, uniseriate, erect, the style slender, 2.5-2.8 mm long. Fruit black at maturity, subglobose, drying 6 mm in diameter."
          originalLanguage: en
          sourceField: general
