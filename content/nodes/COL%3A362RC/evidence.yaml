    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Perennial herb, 0.75-1.00 m high; stem irregularly branching. Leaves linear. Bracts entirely sheathing; apices obtuse or apiculate. Spathe 50-80 mm long, apex obtuse or emarginate, margins free to base. Flowers white; nectar guides yellow; limbs horizontal to recurving; outer tepals with dense yellow beard on midline; inner tepals with dark brown markings. Stamens with tapering filaments, contiguous at base; anthers 7-10 mm long. Style 5 mm long, with pale mauve branches. Flowering time Sept.-Mar. Capsule 28-50 mm long, cylindrical, ridged and furrowed vertically, splitting into 3 locules when mature.
            textZh: Dietes grandiflora N.E.Br. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_18505_0
            locator: "SANBI/WFO archive Morphology row 90735; source identifier 18505.0; cited publication: Bredenkamp, CL; Magwaza, ZL. 2019. Iridaceae. In: CL Bredenkamp (ed.), A Flora of the Eastern Cape Province, Strelitzia 41(3): 1821 - 1882. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: The largest-flowered species of the genus, Dietes grandiflora is easily recognised not only by the larger flowers, which last three days in contrast to those of other members of the genus, but also by the floral markings. The white outer tepals are conspicuously marked with a velvety, yellow nectar guide at the base of the limbs, and a yellow velvety band in the centre of the claws while the inner tepals have dark brown lines either side of the pale midline. The flowers in well-grown plants may be up to 100 mm in diam.
            textZh: SANBI 条目提供了 Dietes grandiflora N.E.Br. 的鉴别特征。
