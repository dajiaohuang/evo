        usage:
          title: Psychotria grandis Sw., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Trees, usually 5-7 m tall, the branchlets terete, the ultimate branches usually markedly nodose, the internodes twisted, subangular, glabrous. Leaves oblong, often narrowly so, occasionally obovate oblong, rarely oblong rotund, usually 3 times longer than wide, 12-30 cm long, 4.0-10.5 cm wide, acute to deltoid at the apex, acuminate, the acumen short, attenuate acute basally, the costa plane to prominulous above, often delicately rimose, conspicuously rimose beneath, to 0.2 cm wide basally, thinly coriaceous or stiffly papyraceous, concolorous or somewhat discolorous, glabrous, the lateral veins 12-15, well spaced, those in the middle of larger blades 1-2 cm apart, prominulous above and beneath, widely arcuate; petioles 1-4 cm long or absent; stipules free, large, ovate or ovate rotund, to 2 cm long, the awns shorter than the body, tending to persist on ultimate branchlets, coriaceous, smooth, delicately venulose, drying black or brown. In- florescences terminal, solitary, paniculate, to 26 cm long, to 20 cm wide, glabrate, the peduncles to 22 cm long, to 0.3 cm wide, angular, the lowermost branches 4-nate, to 3 cm long, the upper set of branches 2-3, usually ternate or 4-nate, angular, the bracts and bracteoles minute, deciduous. Flowers sessile, heterosty- lous; hypanthium rotund, 1.5 mm long, the calycine cup short, expanded, mi- nutely puberulent outside, eglandular within, the teeth 5, triangular, 0.2-0.8 mm long; corolla white, the tube cylindrical, ca. 2 mm long, petaloid, venose, glabrous outside, densely bearded well below the mouth at the filament attachment posi- tion; stamens exserted or not, the anthers narrowly oblong, 1 mm long; styles to 5 mm long, with the stamens included, short styles with exserted anthers, the stigmas slender, either as broad as long or to 4 times longer than broad. Fruits rotund to oblong, to 0.7 cm in diam., black, glabrescent, scarcely ribbed, the calycine cup often persistent, minute.
          originalLanguage: en
          sourceField: general
