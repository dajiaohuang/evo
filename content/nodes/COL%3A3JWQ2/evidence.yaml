      morphology:
        status: partially-supported
        claims:
          - text: Solitary, acaulescent succulent. Leaves abruptly recurved, dark green, translucent along veins, often scabrid. Flowers white.
            textZh: Haworthia bayeri J.D.Venter & S.A.Hammer 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13856_0
            locator: "SANBI/WFO archive Morphology row 9079; source identifier 13856.0; cited publication: Bayer, B. 2012. Asphodelaceae: Haworthia Duval. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 75 - 77. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: For many years the species has been regarded as either H. emelyae Poelln. or H correcta Poelln. From the former it is readily distinguished by its very dark crystalline epidermis and its peculiar markings, which consist of branched lines, whitish, thin, and yet deeply 'imbedded.' The whitish to tan lines of H. emelyae are often complex and rather broad, with an inner series of reddish lozenge-shaped markings. In addition this species often shows a series of rounded whitish spots which sometimes coalesce to produce a nearly white and quasi-opaque upper surface, invariably absent in H. bayeri. The surface can be smooth, asperulous, or sulcate, but it is never finely crystalline as in H. bayeri. H. bayeri can occasionally be confused with the cat-tongued form of H. pygmaea from the Great Brak area; from this it can be distinguished by the darker color of its more finely crystalline (and relatively narrower) leaves and by its slender peduncle and larger paler flowers. Those of H. pygmaea are constricted at the upper part of the tube.
            textZh: SANBI 条目提供了 Haworthia bayeri J.D.Venter & S.A.Hammer 的鉴别特征。
            sourceIds:
              - sanbi_1444_0
            locator: "SANBI/WFO archive Diagnostic row 74942; source identifier 1444.0; cited publication: Hammer, SA; Venter, JD. 1997. New and old species of Haworthia Duval from the Little Karoo. Cact. Succ. J. (Los Angeles) 69(2): 75 - 77. [All rights reserved]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
