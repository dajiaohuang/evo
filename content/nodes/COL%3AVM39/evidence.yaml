        usage:
          title: Citharexylum macrochlamys Pittier, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Tree, to 30 m tall; trunk straight, to 50 cm diameter basally, the bark reddish rugose, the core dirty-white; wood hard and tough; crown elongate, and the limbs slightly ascending; branchlets and twigs stout, more or less fistulose, acutely tetragonal or 6-angled, slightly 4-6 margined, light-brown, glabrous; leaf-scars comparatively large, oblong, ca. 5 mm long and 3 mm wide, sessile or borne on extremely short sterigmata, most prominent at the base. Leaves usually alternate, ternate at the ends of the young flowering shoots; elliptic-oblong or elliptic to ovate or subobovate, entire but often undulate in drying, 9.8-25 cm long, 5.5-9.2 cm wide, apically acute or subacute to acuminate or rounded, basally subtruncate to acute or rounded-attenuate or even cuneate with 2 or 3 large, thickened, black glands beneath and parallel to the petiole, thin-chartaceous or membranous, bright-green on both surfaces, whitish beneath when immature, obsoletely puberu- lent on both surfaces, especially beneath, or glabrous, smooth to the touch above, finely reticulate-roughened between the salient veins beneath; petioles slender or stout, 1.5-3.7 cm long, more or less broadly sulcate above, basally greatly ampliate in the form of a shield, densely but minutely puberulent or glabrate. Inflorescence subterminal, the racemes usually ternate, simple, mostly erect or ascending axillary in the 2 or 3 upper nodes of the branchlets, 13-28 cm long, 1-2 cm wide, loosely many-flowered; peduncles slender or stout, 4-7.5 cm long, minutely puberulent or glabrate; rachis glabrous to minutely hirsute or puberulous; pedicels slender, 0.5-1.5 mm long, puberulent or minutely hirtellous; bracts and bractlets absent;
          originalLanguage: en
          sourceField: general
