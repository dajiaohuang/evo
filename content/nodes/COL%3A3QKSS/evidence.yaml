    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Stout, dwarf, twiggy shrublet, 150-600 mm tall, old lateral shoots becoming subspinescent, young parts glandular-pubescent. Leaves close-set, broadly obovate to spathulate, thick. Flowers axillary, corolla tube 9.5-14 mm long, limb ± regular, lobes rounded or shallowly notched, throat with club-shaped hairs, white to pale yellow with brownish patches.
            sourceIds:
              - sanbi_14766_0
            locator: "SANBI/WFO archive Morphology row 35501; source 14766.0; publication: Snijman, DA. 2013. Scrophulariaceae: Jamesbrittenia. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 463 - 464. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: "Drège collected J. merxmuelleri in 1830 but Hiern equated the specimen with J. microphylla and 150 years passed before it was recognized as an undescribed species. The two species resemble one another in habit: short branchlets thickly beset with short brachyblasts, the tiny leaves of which are 4-ranked and close-set (as in several species of Crassula!); the leaves of J. merxmuelleri are very obtuse, those of J. microphylla acute. The species are also strikingly different in their flowers: the corolla lobes shades of purple in J. microphylla, brown margined white to pale yellow in the lower half in J. merxmuelleri (precisely as in J. albomarginata). The margins of the lobes tend to roll back and the nearly regular limb must then resemble that of certain species of Manulea, e.g. M. robusta."
            textZh: SANBI 条目提供了该种的鉴别特征。
