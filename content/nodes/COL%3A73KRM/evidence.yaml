        usage:
          title: Mikania micrantha Kunth, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Slender, sparingly branched vines; stems yellowish or brownish, terete to slightly 4-angled, slightly striate, glabrate to sparsely puberulous, mostly fistulose. Leaves opposite; blades ovate, 3-13 cm long and to 10 cm wide, the base cordate to deeply cordate, the margins subentire to coarsely dentate, the apex narrowly short-acuminate, the surface glabrate with numerous pale glandular punctations, strongly trinervate from the base; petioles slender, 1-6 cm long. Inflorescence a corymbose panicle with subcymose branches, heads often in clusters of 3; ultimate branches up to 2 mm long, usually glabrous. Heads 4-5 mm high; subinvolucral bract narrowly elliptical to narrowly obovate, ca. 2 mm long, short-acuminate, glabrous to short-puberulous; involucral bracts oblong with short-acuminate tips, ca. 3.5 mm long, ca. 1 mm wide, glabrous to short-puberulous; corolla white, 2.5-3.0 mm long, the tube narrow, 1.0-1.3 mm long, the limb broadly campanulate with partially to fully developed ridges of papillae inside, the lobes about as long as wide and strongly recurved when old, the outer surface with a few pale glands, the corolla cells mostly quadrate and less than 25 ,u wide; anther aopendages firm, triangular-ovate; style base glabrous, the style appendages with short papillae. Achenes 4-5-ribbed, 1.5-2.0 mm long with many scattered pale glands; pappus of 35-40 slender bristles mostly in 1 series, the tips usually slightly enlarged.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 1403
