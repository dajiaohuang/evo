    facets:
      morphology:
        status: partially-supported
        claims:
          - text: "Many-stemmed, much-branched, spinescent, aromatic shrubs, 150-450 mm tall, spreading. Old stems displaying anomalous secondary growth, dark grey; young shoots yellow-brown, shortly sericeous; older shoots brown-grey to dark grey, terminally spinescent, 10-22 mm long. Leaves 1-4 mm long, always decussate, sessile on cushion-like thickenings, entire, permanently silver-to green-grey sericeous, adaxially proximally concave, distally flattened, abaxially semiterete, apex acute, base semi-amplexicaul, bases of two opposite leaves connate, leaves on brachyblasts obtuse-triangular to lanceolate, densely imbricate, those on young shoots linear to linear-lanceolate. Capitula heterogamous radiate, 2-4.5 mm long, sessile, solitary, terminal on brachyblasts or spicate on dolichoblasts, almost hidden among subtending leaves. Involncral bracts 4, 3.2-4.0 x 0.8-1.4 mm, 2 slightly keeled with margins overlapping, other 2 flattened; each with central thickened green to purple part and transparent margin, abaxially appressed sericeous, adaxially smooth. Paleae: those of marginal florets free, oblong-ovate, 3.5 x 1.2 mm, hardened, keeled, abaxially lanate, hairs septate, enveloping female florets; those of disc florets narrowly oblong to lanceolate, becoming narrower towards centre, 3.8 x 1.0-3.6 x 0.2 mm, with membranous margins, abaxially lanate. Ray florets 2 or 3, 2.5-2.8 mm long; corolla white with distinct 1.3-2.2 mm long lamina. Style branches linear, as long as or shorter than ray, rarely longer. Ovary (and cypsela) oblong, slightly flattened, densely lanate. Seed 2-3 mm long, obovoid, slightly flattened. Disc florets 4-10, 2.5-3.0 mm long, functionally male with sterile ovary; corolla trumpet-shaped, 5-lobed, white to pale yellow to yellow with red-purple lobes. Stamens 5, exserted at maturity. Style unbranched, apex truncate, with sweeping hairs. Receptacle after anthesis white-lanate between involucral bracts and marginal paleae. Flowering time: December to March in summer, July to September in winter."
