        usage:
          title: Viola odorata L., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Herb, acaulescent, stoloniferous. Leaves with the petioles up to 9 cm long, the stipules narrowly ovate, acuminate, up to 1.5 cm long, glandular-fimbrillate; blade subcircular, deeply cordate at the base, obtuse at the apex, crenulate at the margins, up to 5.2 cm long and wide, membranous, with scattered, appressed, hyaline, short hairs on both surfaces and along the margins. Flowers with the pedicels up to 9 cm long, the bracteoles narrowly triangular, acute, ca 6 mm long and 1.5 mm wide at the base, minutely glandular-fimbrillate; sepals ovate, acute, ca 10 mm long (basal auricles included) and 3-4 mm wide, the basal auricles ca 3 mm long and fimbrillate at the base; corolla purple; anterior petal oblong- obovate, rounded at the apex, 15 mm long (spur included) and 6 mm wide, the spur ca 4 mm long; lateral and upper petals oblong-obovate to obovate, rounded at the apex, 12 mm long and 5-7 mm wide; anthers ca 2 mm long, the connective appendages deltoid, ca 1.5 mm long and wide at the base; ovary ovoid, as long as the anthers; style ? geniculate at the base, enlarged towards the apex, ca 2.5 mm long, the apex unciform. Capsule ellipsoid, ca 7-8 mm long, puberulous.
          originalLanguage: en
          sourceField: general
