  claims:
    - subjectId: event:odontochelys-plastron-dorsal-shell-mosaic
      claimKind: scientific
      claimType: morphology
      statement: Odontochelys specimens IVPP V 15639, V 13240 and V 15653 preserve a developed plastron with expanded ribs and neural plates but no complete carapace; plastron-first assembly, basal topology and habitat remain interpretations.
      confidence: medium
      confidenceRationale: The ventral and dorsal elements are figured in multiple named specimens. Medium confidence retains uncertainty in comparative homology, matrix placement, depositional ecology and extrapolation to a universal shell sequence.
      referenceLinks:
        - referenceId: li-2008-odontochelys
          relation: supports
          pages: 497–501
          figure: Figures 1–4
          quoteLocator: pp. 497–501, Figs. 1–4; Systematic palaeontology, Description and Discussion
  claim-rationales.zh:
    - 多件具名标本图示腹侧与背侧构件；中等置信度保留比较同源性、矩阵位置、沉积生态及普适甲壳序列外推的不确定性。
  claim-statements.zh:
    - Odontochelys 标本 IVPP V 15639、V 13240 和 V 15653 保存发育完善的腹甲、扩展肋骨与神经板，但没有完整背甲；腹甲先形成的组装顺序、基部拓扑和生境仍属解释。
