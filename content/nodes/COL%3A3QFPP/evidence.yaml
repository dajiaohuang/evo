    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants 200-300 mm high. Corm 10-13 mm diam.; tunics of fine to medium-textured fibres. Stem usually with 2 or 3, short, drooping, filiform branches, subtended by scale-like, acuminate-truncate bracts and prophylls ± 1 mm long. Leaves 3, lower 2 basal, linear, slightly twisted (juvenile leaves loosely coiled distally), ± 1/3 as long as stem, ± 3 mm wide; main vein slightly raised, margins not thickened, uppermost leaf ± entirely sheathing with short free tip, enclosing most of stem. Main spike 2- or 3-flowered, lateral spikes mostly 1-flowered; bracts membranous, translucent with light brown veins, 6-7 mm long, outer 3-veined and acutely 3-toothed, inner 2-veined and 2-toothed, ± as long as outer. Flowers nodding to half pendent, pale mauve, faintly rose-scented; perianth tube funnel-shaped, 6-7 mm long, narrow lower part ± 3 mm long; tepals ascending below, spreading distally, obovoid-ellipsoid, 12-14 x 6-7 mm. Filaments ± 7 mm long, exserted ± 1.5 mm from mouth of tube; anthers ± 3 mm long, ± parallel, later weakly diverging, yellow. Style dividing opposite middle to upper 1/3 of anthers, 1.5(-2.5) mm long.
            textZh: Ixia nutans Goldblatt & J.C.Manning 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Morphology row 98846; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Immediately recognised by the two linear, soft-textured basal foliage leaves without thickened margins, ± 3 mm wide and slightly twisted distally, together with short-tubed, nodding to slightly pendent flowers. The flowers conform most closely to those of the I. latifolia group in their perianth tube of moderate length, at least 6 mm long, and partly exserted filaments. The unusual leaf morphology does not indicate any particular close relationship to other members of the series.
