        claims:
          - text: Herb up to 1 m tall. Leaves ovate or elliptic, acute or attenuate, (15-)27-69(-l 11) x (7-)10-24(-45) mm; upper and lower leaves cuneate and petiolate. Inflorescence an open, one-sided cyme of onesided cymes. Bracts 1.0-2.5(-4.5) mm long, with stalked glandular and eglandular trichomes. Calyx (3.5-)4.2-6.2(-8.0) mm long; lobes with stalked glandular and eglandular trichomes. Corolla with eglandular and stalked glandular trichomes without. Capsule (13.0-)15.7-20.2(-23.0) x (2.5-) 2.8-3.8(-4.0) mm, with eglandular and stalked glandular trichomes; stipe (7.0-)8.6-11.3(-13.0) mm long.
