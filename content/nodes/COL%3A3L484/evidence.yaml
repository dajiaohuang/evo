    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, 15-30 cm, corm rounded. Leaves sword-shaped. Flowers white, red (occasionally brown) on reverse of outer tepals, fragrant.
            textZh: Hesperantha cucullata Klatt 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 6671; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Distinguished by the relatively large, white flowers mostly with the outer tepals red outside and usually 12-20 x 6-10 mm, and the large asymmetric corms up to 14 mm diam. with imbricate tunics. The flowers are crepuscular, usually opening after 16:30 and then sweetly scented. Well-grown plants have at least four leaves, the lower three basal and with long, plane blades up to 10 mm wide. Populations from the Bokkeveld Mtns growing on sandstone pavement are often shorter in stature, with a slightly longer perianth tube, 10-12 mm vs. 6-10 mm, and shorter anthers, 4-5 mm vs. 6.0-8.5 mm, and perhaps merit taxonomic recognition. The style branches reach the tips of the anthers in these plants because the anthers are relatively short, whereas the style branches reach to between the base and middle of the anthers in other populations. Plants from the southern Roggeveld with spikes of fewer flowers (mostly two or three) and the outer tepals brown outside (red elsewhere), and growing in wet habitats are referred to Hesperantha palustris.
            textZh: SANBI 条目提供了 Hesperantha cucullata Klatt 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 94829; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
