        claims:
          - text: Plants epiphytic; stems 100-300 mm tall, 5-10 mm in diameter, erect, covered in imbricate, persistent leaf bases; leaves strap-shaped, dark green, equally or unequally bilobed, distichous, leathery to somewhat succulent, to 100 x 10 mm. Inflorescences of 1-3 axillary racemes, usually shorter than the leaves, with 5-152-ranked flowers; bracts papyraceous, broadly ovate, obtuse, 2.5 mm long. Flowers white with a greenish tinge. Sepals subequal, narrowly lanceolate, acute, recurved; median sepal 8-13 x 3-4 mm; lateral sepals 8-13 x 2-3 mm. Petals similar to sepals, but slightly smaller. Lip like the petals; spur 20-30 mm long, tapering from a 4 mm diameter mouth, apex usually hooked. Gynostemium 1 mm tall; rostellum 3 mm long.
