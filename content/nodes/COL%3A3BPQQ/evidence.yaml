    facets:
      morphology:
        status: partially-supported
        claims:
          - text: "Evergreen tree, 18-40 m high, with a spreading crown. Bark shed in various pieces from entire length of trunk, leaving a smooth or granular texture on under layer, white or grey, mottled, streaked with red, sometimes with rough, reddish brown or black bark accumulating at base of trunk. Leaves alternate or opposite; drooping; petioles and twigs red; blade narrowly ovate, 120-220 mm long, apex acute, margins entire, concolorous, distinctly veined. Flowers: in simple umbels; buds conical, ovoid or beaked, 6-9 mm long; stamens exserted; perianth dull yellow; Sep.-Jan. Fruit a capsule with a prominent rim and protruding valves."
            sourceIds:
