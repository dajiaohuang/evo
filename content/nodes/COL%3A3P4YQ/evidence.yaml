        usage:
          title: Hyptis conferta Pohl ex Benth., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Herbs, perennial, coarse, to 1.5 m, appressed-pubescent on the branches. Leaves lanceolate or narrowly elliptical (in Pan'ama), acute, serrate, the bases attenuate, to 18 cm long and 2.5 cm wide, glabrous or densely soft-pubescent above, glabrous or pubescent on the veins beneath, the midrib and secondary veins pronounced; sessile to petioles ca 0.5 cm long. Inflorescences capitula, dense, axillary, ? hemispherical, the peduncles ca 1-4 cm long, the bracts lan- ceolate or awl-shaped, ca 8-9 mm long, densely pubescent. Flowers sessile, tufts of hairs at the bases; calyx tubular-campanulate, ca 3-4 mm long at maturity, pilose-annulate within above the nutlets, the teeth acicular to setaceous, ca 3-4 mm long; corolla tube ca 4.5-5 mm long, white and rose, the lower lip ca 1.5- 1.8 mm long, the lips and tube lightly pubescent; stamens exserted, the filaments sparsely pubescent near the base, the anthers ca 0.4 mm long; gynobase some- what elongated, becoming lobed, the style minutely bifid near the tip. Nutlets 4, oblong-flattened, the lobes of the gynobase adhering, ca 1.5-1.6 mm long, brown.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 6575
