          - text: Usually specimens from South Africa and Namibia have larger flower heads on longer peduncles (up to 2 cm) and the involucrum is often conspicuously enclosed by one or two green and densely pilose bracts, which are larger than the other outer involucral bracts. The leaves are mainly entire and lanceolate. However, the observed variation is more or less continuous and exceptions do occur. Pluchea integrifolia described as endemic to South Africa is identical with this variant of P. bojeri.
