    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Shrub up to 2(4) m high with erect branches; pilose, younger parts densely pilose to woolly, trichomes simple uniseriate multicellular, 0.5-1.5 mm long; glandular, glands sessile or stipitate. Leaves (1.5)2.5-5.5(7) cm long, 0.5-2 cm wide, lanceolate to oblanceolate, entire or dentate, sessile, pilose, density of non-glandular trichomes increasing towards midrib and margin, base attenuate, apex acute. Capitula (3)4-6(7.5) mm long, narrow, nearly cylindrical, numerous, sessile or shortly pedunculate, heterogamous, forming dense corymbose panicle. Peduncles up to 1 cm long, densely pilose, glandular, with or without 1-2 bracts. Involucral bracts in 4-6 rows, the outer 2(3) rows closely imbricate, herbaceous, pilose to woolly, glandular, margin fimbriate; inner involucral bracts scarious, glabrous, apex fimbriate. Outer involucral bracts (1.5)1.8-2.5 mm long, (0.8)1-1.5 mm wide, ovate to lanceolate, apex acute; inner bracts (3)3.7-5 mm long, 0.2-0.5(0.6) mm wide, linear-acute. Receptacle slightly concave, verrucose, more or less hairy, 1-2 mm in diameter. Marginal florets (2)2.5-3.5 mm long, irregularly 3-4(5)-lobed, lobes 0.2-0.5 mm long. Disc florets 2-8, 3-4.5 mm long, 5-lobed, lobes glabrous, 0.7-0.9(l) mm long; corolla and stigma light purple; style shortly bifid, apical sweeping hairs more or less acute. Anthers (1.6)1.7-2(2.3) mm long, basal appendages (0.4)0.5-0.8 mm long, apical appendages more or less obtuse; antheropodium 0.3-0.4 mm long, filament collar cells swollen. Achenes of disc florets vestigial, achenes of marginal florets glabrous, terete to subangular, 0.8-1.2 mm long, 0.2-0.3(0.4) mm in diameter, testa epidermis not dorsally thickened, indistinctly ribbed. Pappus of 10-25 barbellate bristles in one row, teeth appressed, bristles of irregular length and width, bristles of disc florets often fused at the base.
            sourceIds:
