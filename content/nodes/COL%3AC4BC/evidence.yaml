          - text: Succulent perennial to 60 cm, with slender, erect to decumbent branches. Leaves dark green with reddish tips, faintly striate, triangular-ovate to triangular-lanceolate, 5.0-7.5 cm long; margins with firm, white teeth. Racemes cylindric, ± lax, simple, 35-48 cm long. Flowers yellowish green in bud, orange-red with yellowish green tips when mature, 40 mm long; stamens and stigma not exserted.
