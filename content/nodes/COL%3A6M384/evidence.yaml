      ecology:
        status: partially-supported
        claims:
          - text: Hessea cinnamomea favours seasonally waterlogged peaty lowlands at elevations of less than 60 m. Thousands of bulbs flowered in June 1986 after a wild fire cleared large areas of lowland fynbos within the Reserve the preceding summer and several hundred bulbs flowered at Modderdam adjacent to the Reserve after a similar fire in 1989. Flowering in these populations declines rapidly for one to three years after each fire as the density of the shrubby fynbos increases. Ultimately, only the vegetative phase is evident for the remaining inter-fire period.
            textZh: 该 SANBI 区域物种条目记录的生境：Hessea cinnamomea favours seasonally waterlogged peaty lowlands at elevations of less than 60 m. Thousands of bulbs flowered in June 1986 after a wild fire cleared large areas of lowland fynbos within the Reserve the preceding summer and several hundred bulbs flowered at Modderdam adjacent to the Reserve after a similar fire in 1989. Flowering in these populations declines rapidly for one to three years after each fire as the density of the shrubby fynbos increases. Ultimately, only the vegetative phase is evident for the remaining inter-fire period.
