        claims:
          - text: Bulbous geophyte, 6-15 cm. Leaves 2, dry or emergent at flowering, spreading, linear. Flowers widely funnel-shaped, in a north-facing cluster, tepals crisped, white to pale pink with claret centre, with spicy scent.
