        claims:
          - text: Ganze Pflanze dunkel-blaugrün. Blätter an jungen Pflanzen und Zweigen 1. Ordnung bis 4 cm lang, 2 mm breit, rinnenformig, oberseits durch Wachsüberzug milchblau, Ränder schön rot, im Abstand von 1-2 mm mit roten, durchsichtigen, weichen Zähnchen versehen, Blattende mit ebensolchem Mucro. Die Blätter alter Pflanzen und Zweige jüngster Ordnung nur 8-15 mm lang und entsprechend schmäler. Cyathien endständig an den Spitzen der jüngsten Zweige, von 8-13 mm Durchmesser mit fünf braungrünen Drüsen, die in 2-4 meist wieder gegabelte, 2 mm lange, weißbräunliche Hörnchen auslaufen. Frucht ± 10 mm Durchmesser, ziemlich dicht mit rückwärts gerichteten, weichen Borsten-haaren besetzt, und durch stark vortretende Adern sehr uneben, anden Seiten der Kokken mit 2 mm breiten Flügeln versehen, die ihr fast das Aussehen der Früchte flügelfrüchtiger Tribulusarten verleihen.
            sourceIds:
              - sanbi_11289_0
            locator: "SANBI/WFO archive Morphology row 83850; source 11289.0; publication: Dinter, MK. 1914. Neue und wenig bekannte Pflanzen Deutsch-Südwest-Afrikas. Im Selbstverlag, Okahandja. [All rights reserved]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Stamm keulig, 15-20 cm über der Erde hoch, im Habitus mit dem von E. namibensis Marl, vollig übereinstimmend, im oberen Teil dicht mit wiederholt verzweigten Ästen besetzt mit Zweigen bis 3. Ordnung, wahrend die Äste bei E. namibensis und E. argillicola bis zu ihrem Absterben ungeteilt bleiben.
