          title: Melothria pendula L., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Vines; stems scabrous to glabrate. Leaves with blades cordate to sagittate, rarely shallowly 3- to 5-lobate (in other parts of the range sometimes deeply 3- to 5-lobate), 3-7(-10) cm long, to as wide as long, the apex acuminate to caudate, the base cordate, the margin undulate, minutely and remotely toothed, charta- ceous, the upper and the lower surfaces scabrous with white pustular based tri- chomes; petioles 1-4 cm long, scabrous to glabrate; tendrils simple, glabrate. Staminate flowers in axillary, long pedunculate racemes, the rachis 2-3 cm long, filiform, glabrate, 2- to 6-flowered; pedicels 2-3 mm long; calyx campanulate, the lobes subulate, ca. 0.5 mm long, sparsely pilose; corolla yellow, the lobes ovate oblong, acute, spreading, papillose puberulent on the inner surface, puberulent on the outer surface; anthers narrowly oblong, ciliate on the margin; pistillode globose. Pistillate flowers solitary; peduncles 1-3 cm long, glabrate; calyx and corolla as in the staminate flowers; ovary ellipsoidal, glabrous, smooth. Fruits
          originalLanguage: en
          sourceField: general
