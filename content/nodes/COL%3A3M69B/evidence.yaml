        usage:
          title: Hoffmannia morii Dwyer, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Subshrubs to 1 m tall, the stem simple, obtusely angular, rimose, glabrous or glabrescent, covered with mosses, the nodes to 4 cm apart. Leaves widely oblong, 13-25 cm long, 7-12 cm wide, deltoid at the apex, obtuse or widely cuneate toward the base, the costa subplane above, prominent beneath, the lateral veins ca. 10, arcuate, not joining to form a conspicuous submarginal vein, thin coria- ceous when dry, slightly discolorous, glabrous above, puberulent beneath on the veins and costa, often moss covered; petioles to 3 cm long, to 1 mm wide, not vesciculiferous or with poorly developed vescicles. Inflorescences axillary and terminal, the flowers numerous in globose heads, 2 cm in diam. Flowers with pedicels ca. 2.5 cm long; hypanthium subrotund or turbinate, ca. 2 mm long, the hairs elongate, to 3 mm long, the calycine cup ca. 2 mm long, the lobes 4, narrowly oblong, ca. 4.5 mm long, thickly petaloid or subcoriaceous with purple hairs to 2 mm long outside; corolla tube narrowly cylindrical, glabrous, 5 mm long, 2.5 mm wide, thickly petaloid, the lobes 4, oblong, triangular, ca. 3 mm long, cu- cullate; stamens 4, the anthers oblong ca. 3 mm long, the filaments ca. 1 mm
