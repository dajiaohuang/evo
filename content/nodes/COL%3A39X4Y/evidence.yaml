        usage:
          title: Entada gigas (L.) Fawc. & Rendle, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Large vine of lowland areas, often climbing to the tops of forest trees, the branchlets essentially glhrbrous and inconspicuously lenticellate. Leaves very large, bipinnate, commonly cirrhiferous, the pinnae usually 2 pairs, opposite, the leaflets 3-6 pairs per pinna; petiole usually 2-4 cm. long, eglandular, frequently puberu- lent, callous basally; rachis similar to the petiole, up to 20 cm. long, eglandular, commonly terminating in a stout, branched tendril, especially on new growth; pinnae up to 15 cm. long, the axis similar to the rachis; leaflets asymmetrically oblong, the terminal ones as much as 8 cm. long and 3 cm. wide, the basal ones as small as 1.5 cm. wide and 1 cm. broad, usually blunt or even emarginate apically, inequilaterally obtuse basally, glabrous except on the costa, somewhat glossy above, dull below, the venation conspicuous, the secondary lateral veins essentially parallel; stipules linear, about 4 mm. long. Inflorescence an elongate spike, supra-axillary (usually inserted 5-10 mm. above the axil), the peduncular portion only 1-5 cm. long, the floriferous portion 7-25 cm. long, the floriferous bractlets squamiform. Flowers cream, odorous (often described as unpleasantly so, or with a "sickly odor"), short-stipitate; calyx shallowly cupulate, about 1 mm. deep, rather ir- regularly 5-lobed, glabrous; corolla of 5 narrowly elliptic petals about 3 mm. long, glabrous, free or somewhat connate basally; stamens 10, 6-7 mm. long, the anthers usually bearing a (caducous) gland; ovary glabrous. Legume very large, as much as 2 m. long (commonly several dm. long) and about 1 dm. broad, more or less oblong, curved, flat, transversely jointed but the margins continuous, glabrous, the segments 1-seeded; seeds orbicular, 3-5 cm. in diameter, flattened, blackish, glossy.
          originalLanguage: en
          sourceField: general
