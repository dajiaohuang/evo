    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Perennial herb, geophyte, 0.3-0.6 m high; corm globose, tunic fibres reticulate in upper half, parallel towards base; stem simple, erect, slender. Leaves erect, linear, acuminate, 1-5 mm wide, striate with 3 or more veins. Inflorescence a ± secund, lax spike; flowers zygomorphic, dark red, drying to blackish purple-red; perianth tube funnel-shaped; tepals subequal, oblong, obtuse; median callus one yellow, larger than lateral ones. Stamens with reddish filaments. Style reddish. Flowering time Dec., Jan.
            textZh: Tritonia atrorubens L.Bolus 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_18505_0
            locator: "SANBI/WFO archive Morphology row 91077; source identifier 18505.0; cited publication: Bredenkamp, CL; Magwaza, ZL. 2019. Iridaceae. In: CL Bredenkamp (ed.), A Flora of the Eastern Cape Province, Strelitzia 41(3): 1821 - 1882. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Readily recognised by its stiff, linear leaves (1-)2-5 mm wide with the main vein, submarginal and intervening veins moderately thickened, the blades thus striate, and the dark red flowers drying blackish purple. The lower median tepals bear a yellow, axe-shaped callus and evidently smaller, dark calluses on the lower lateral tepals. It has a superficial resemblance to Tritonia disticha but this species has broader leaves, (5-)8-12(-20) mm wide, and orange to red flowers without evident calluses on the lower tepals. It is more likely to be confused with T. drakensbergensis, which has similarly narrow (but not striate) leaves and red flowers with yellow calluses on the lower tepals, but this is a high altitude species from basalt soils and the calluses are lower and triangular in shape.
            textZh: SANBI 条目提供了 Tritonia atrorubens L.Bolus 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 94789; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
