    facets:
      morphology:
        status: partially-supported
        claims:
          - text: "Usually small and inconspicuous, annual or short-lived perennial. Stems: in water spreading, internodes up to 2 cm long, with branches up to 10 cm or more long; on land all parts smaller, creeping and rooting at nodes, densely branched and turf-forming, internodes (1.5-)3-4(-11) mm long, ± 0.5 mm in diameter. Leaves glabrous, lanceolate to elongate-lanceolate (sometimes with petiole-like bases when growing in water), (3-)4-6(-15) mm long, (0.5-)1-1.5(-3) mm wide, margins not toothed, tip rounded. Flowers solitary in leaf axils, distinctly pedicellate; pedicels 1-2 mm long, with 2 membranous bracteoles at the base; bracteoles minute, irregularly toothed or beard-like. Sepals 3, united below, without distinct veins, not glandular, ovate, ± 0.5 mm long, tips obtuse. Petals 3, ovate to elongate ovate, ± 1 mm long, reddish-white, spreading at anthesis but lying on the fruit later. Stamens 3, shorter than the sepals. Styles 3, curved. Capsules ± spherical, ± 1.5 mm in diameter, when ripe lying to the side of and not in the leaf axil, opening by 3 valves. Seeds ± 0.5 mm long, ± 0.1 mm in diameter, slightly curved or almost straight, with a net-like pattern on the surface, the individual pits mostly hexagonal."
            sourceIds:
