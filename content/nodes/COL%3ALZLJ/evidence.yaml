          originalSourceText: Tree to 12 m. tall or perhaps taller, also reported as an epiphyte, the younger stems, petioles, pedicels, and sepals coarsely pubescent; petioles stout, 3-6 cm. long; leaf-blades subcoriaceous, elliptic or elliptic-ovate, up to 25 cm. long and 15 cm. wide, acute or apiculate, broadly rounded at base, glabrous above, brown and glabrous on the surface beneath at maturity, permanently pubescent on the veins, 5-nerved, the outer pair diverging at right angles from the midvein and together forming the arc of a circle; pedicels solitary or rarely paired, stout, 1-2 cm. long; bracts connate, about 25 mm. long; petals large, white; anthers broadly rounded, about 7 mm. long.
