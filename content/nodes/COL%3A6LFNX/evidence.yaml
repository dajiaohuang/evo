        claims:
          - text: Acaulescent succulent to 12 cm diam., rosettes withdrawn to ground level. Leaves few, abruptly recurved, opaque, dark green with pinkish flecks, scabrid above to spinescent. Flowers white.
            textZh: Haworthia emelyae Poelln. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13856_0
            locator: "SANBI/WFO archive Morphology row 9087; source identifier 13856.0; cited publication: Bayer, B. 2012. Asphodelaceae: Haworthia Duval. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 75 - 77. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Haw. emelyae and the var. beukmanii are very similar, the distinction mainly based on the crowded tubercles on the back of the leaves and the somewhat larger size of var. beukmanii. Both plants assume a brownish-green color in sunlight, and the appearance of the tubercles is the same on both plants. The type and the var. both have acute leaves ending in a short point.
            textZh: SANBI 条目提供了 Haworthia emelyae Poelln. 的鉴别特征。
