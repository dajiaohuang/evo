          originalSourceText: A shrub, 2 m. tall; flowering internodes moderately slender and elongate, densely retrorsely dingy-pubescent; leaves lance-elliptic or suboblong, apex gradually acuminate, base somewhat inequilateral, rounded or cordulate, one side slightly shorter, 5-6.5 cm. wide X 15-17 cm. long, pinnately nerved from below the upper third, the nerves about 6 on each side, glabrous above, the midrib impressed below the middle, hirsute beneath, the nerves rather densely so, the hairs staring, drying rather thick, subtranslucent, glossy above, narrowly revolute; petiole about 10 plus 2 mm. long, densely pubescent, vaginate to the blade; spikes 7-8 mm. thick X 4 cm. long, caudate at the tip; peduncle scarcely 1 cm. long, sparsely hairy; bracts broad, narrowly lunate-concave, glabrous; fruit depressed-quadrangular, 2-3 mm. in diameter, ridged, granular, glabrous; stigmas 2, broad, sessile.
