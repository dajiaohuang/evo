        claims:
          - text: Leafless, much-branched succulent, 15-50 cm, with robust stems mottled with purple on grey, tubercles laterally flattened and joined into 4 angles, acute but not spine-like; sap clear. Flowers spotted with purple-brown on cream, papillate, petals oblong-ovate.
            sourceIds:
              - sanbi_14102_0
            locator: "SANBI/WFO archive Morphology row 9767; source 14102.0; publication: Bruyns, PV. 2012. Apocynaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 331 - 343. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Quaqua pillansii is probably the most handsome and striking member of a genus where the plants are generally rather dull-looking. The robust stems are up to 300 mm long and form a substantial shrub sometimes nearly half a metre in height and even more in diameter, which roots only on the main central stem (though cuttings are readily rooted). The imposing size of these plants is only exceeded occasionally in Q. mammillaris. The stems are beautifully mottled with purple-brown on a grey-green background. They have large, deltoid, laterally flattened tubercles which are joined into four broad wings along the stems. Each tubercle is tipped with a blunt but hard tooth. Nevertheless, despite the size of the plants, they are not always particularly easy to find. Plants are, for one thing, often very few and far between but, in addition, the jagged teeth and mottling of the stems break up their outlines to provide an effective camouflage which enables them to blend in remarkably with their surroundings of sandstone rocks and bushes. The flowers are also unmistakeable. They are produced in dense, more or less simultaneously-opening clusters and they emit a strong, somewhat fruity, unpleasant odour. Outside, the corolla is dark and often somewhat shiny but inside the flower is covered by a very rich combination of cream mottled with roundish spots and transverse markings of purple-brown or maroon. The lobes are broad and ovate and usually spread out only slightly so that the flower is distinctly campanulate. In the centre there is a small but relatively deep, cupular tube whose mouth is slightly constricted by the thickened tissue of the corolla. The interior is covered with papillae, in some plants densely and extensively but in others these are found only around the mouth of the tube. Each papilla has an elongated apical bristle and these bristles are longest in the tube and around its mouth. The corona is seated on a short stipe right in the base of the tube. It has short, blunt outer lobes united into a cup around the anthers and inner lobes which are broad and usually rise somewhat in the centre, rather above the level of the anthers. The whole structure varies from nearly entirely dark purple to dark on the outer lobes and paler yellow on the inner.
