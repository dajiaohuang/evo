        usage:
          title: Ficus popenoei Standl., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Trees to 25 m. tall. Twigs 4-6 mm. in diameter, fulvous spreading pubescent, eventually glabrate and developing a moderately thick greyish brown periderm. Stipules about 10 mm. long, densely spreading fulvous pubescent. Lamina 5-15 cm. long X 4-10 cm. wide, broadly oval to obovate-oblong, pubescent below and scabrid above; lateral veins 5-9 (-10) pairs, departing from the midrib at an angle of 200-400; basal veins departing at a similar angle; intercostals somewhat prominent. Petiole 5-15 mm. long, pubescent, 1/6-/l6 the length of the lamina. Figs 14-22 mm. long X 9-16 mm. in diameter, cylindric, pubescent, borne among the leaves; color green, brown tinted (yellow-brown pubescent in dried material) ; peduncle 3-5 mm. long, pubescent; basal bracts broadly deltoid about 2-5 mm. long, pubescent; orifice about 2 mm. in diameter, flat or very slightly umbonate.
