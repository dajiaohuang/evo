    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Clump-forming, glabrous succulent, up to 300 mm tall, stems leafless, 4-angled, tuberculate, up to 32 mm diam. Flowers ± 3-10, opening together in many, sessile clusters along grooves of stem, pedicels 1-3 mm long. Corolla campanulate, glabrous except for stiff bristles around mouth of tube, smooth, 7-25 mm diam., inside white to pale yellow or pinkish, tube 1-2.5 mm long, lobes spreading, lanceolate, 3-10 x 2-2.5 mm. Corona yellow, outer lobes shortly bifid and pouch-like below, inner adpressed to anthers, without dorsal appendage.
            sourceIds:
              - sanbi_14722_0
            locator: "SANBI/WFO archive Morphology row 30940; source 14722.0; publication: Bruyns, PV. 2013. Apocynaceae. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 248 - 264. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Plants of Q. framesii can be very large, reaching up to 500 mm in diameter, and they have robust stems with rather prickly teeth on the tubercles, usually with two small, but quite obvious stipular denticles on either side of each tooth. In these details and in their robustness, they bear some resemblance to the robust forms of Q. incarnata found on granites around Saldanha. Flowers are produced in many small clusters near the tips of the stems and often all those on a cluster will open more or less simultaneously. The buds are usually greenish but the flower, when it opens, is a bright yellow, becoming paler around the mouth of the tube and inside it. The corolla lobes are more or less uniformly broad right to their tips and the tips are generally somewhat incurved. In the centre there is a small, but relatively deep tube whose mouth is very slightly constricted by a ring of white bristles. The tube is just deep enough to contain the whole of the bright yellow gynostegium. Quaqua framesii is closely related to Q. incarnata, as can readily be seen from the yellow colour of the flowers, the bristles in the mouth of the tube, the somewhat similarly shaped gynostegium and from the similar-looking stems. Also the more or less uniform width of the corolla lobes most of the way to their tips (which are incurved) and the rather longer bristles in the mouth of the tube suggest that it is to subsp. incarnata that Q. framesii is most closely allied. However, from Q. incarnata it can be separated by several unusual features of the gynostegium. The lower parts of the outer corona lobe form a deep pouch leading nearly to the base of the gynostegium and it is these pouches that give the gynostegium its usually pentagonal shape when viewed from above. Furthermore, the outer corona lobes are only very slightly bifid at the apices and the lobules remain connivent rather than diverging, as is usually the case in Q. incarnata.
            textZh: SANBI 条目提供了该种的鉴别特征。
