    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Geophyte, 50-80 mm tall, tuber large with several, tapering roots, leaves 15-20, falcate-secund, subcylindrical, upper surface flattened, succulent, longitudinally lined with white, nonciliate, new leaves surrounded at base by a pale, membranous sheath amongst soft, ± dense fibres. Flowers in a raceme with a curved scape, greenish yellow, sweetly scented. Capsule spherical, ± 7 mm diam.
            textZh: Bulbine vittatifolia G.Will. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
