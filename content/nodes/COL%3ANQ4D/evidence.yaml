            locator: "SANBI/WFO archive Morphology row 30828; source identifier 14535.0; cited publication: Snijman, DA. 2013. Asphodelaceae: Bulbine. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 49 - 53. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Related to both B. margarethae and B. fallax from further south in the Vanrhynsdorp district. It differs from the former by being larger in all parts, especially in the size of the seeds, and from B. fallax by having less succulent, narrower, non-ciliate leaves and very much more robust inflorescences.
            textZh: SANBI 条目提供了 Bulbine vittatifolia G.Will. 的鉴别特征。
