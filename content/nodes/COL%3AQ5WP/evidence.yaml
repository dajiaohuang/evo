        usage:
          title: Calycophyllum candidissimum (Vahl) DC., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Trees to 15 (-40) m tall, the bark reddish brown, often exfoliate, the twiglets smooth, glabrous, rubescent. Leaves oblong rotund, obovate oblong and occa- sionally falcate, to 15 cm long, to 7 cm wide, obtuse at the apex, cuspidate, the cusp usually triangular, to 2.5 cm long, ca. 0.3-0.5 cm wide in the middle, basally attenuate cuneate or widely cuneate, often slightly inequilateral, the costa plane or immersed above, prominulous beneath, the lateral veins 8-10, arcuate, the intermediate veins parallel and branching near the margin, the intervenal areas spreading reticulate, papyraceous, often drying red brown, glabrescent or villos- ulose above and beneath, rarely with minute white raphides; petioles 3 (-4) cm long, slender, to 1.3 mm wide; stipules deciduous, oblong, ca. 2.5 cm long, obtuse, scarious, rubescent, villose. Inflorescences terminal (sometimes appearing axil- lary), paniculate, rarely shorter than the uppermost leaves, often flat topped or convex at the apex, to 20 cm long, usually with 3-4 peduncles arising from the tip of the twiglet, these strongly ascending, each with several strongly ascending branches, the flowers disposed in compound dichasia, the median flower of each cluster sessile. Flowers with the hypanthium turbinate, ca. 3 mm long, ca. 1.5 mm wide, truncate, glabrescent or villosulose with farinose glandular dots inter- spersed, the calycine cup less than 1 mm long, the teeth absent or often one expanded into a petiolate lamina, obovate spatulate, the blade to 3.3 cm long, to 2.5 cm wide, petaloid, glabrous, venose, the claw slender, ca. 0.2 cm wide; corolla white, the tube compressed cylindrical, ca. 3.3 mm long, densely villose within above the middle, the lobes 5, strongly reflexed, oblong, 3-4 mm long, obtuse, glabrous, venose; stamens 5, the anthers oblong, ca. 1.5 mm long, subversatile, the filaments slender, elongate, to 3 mm long, exserted, attached at the mouth; ovarian disc pulviniform, pubescent, 0.75-1 mm long, 0.4-0.6 mm wide, the style 3.3-5.3 mm long, ca. 0.15 mm wide, the stigmas 2, slender, ca. 2.2 mm long, curved or erect, puberulent, the ovary rotund in cross section, 2 loculate, the septum moderately thick, the ovules numerous. Fruits sessile or subsessile, ob- long, 0.5-1 cm long, truncate or rounded apically, usually obtuse or rounded at the base, lignose, villosulose, often with minute white raphides, drying tan, with ca. 8 delicate ribs, splitting from the apex, the margins of the valves wide; seeds to 5 mm long, the wing acuminate at each pole.
