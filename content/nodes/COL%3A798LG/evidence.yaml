    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, 8-15 cm, corms rounded at base with coarse, bent teeth. Basal leaves several. Flowers magenta to pale pink or white with dark veins and dark blotches at edge of yellow cup, bracts with broad membranous margins.
            textZh: Romulea atrandra G.J.Lewis 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 7338; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Distinguished from R. rosea, which has somewhat similar flowers, in its firmer green bracts with closely spaced veins and prominent membranous margins and tips, in the sharply bent, grooved teeth of the corm tunics, and in chromosome number. Three varieties occur which differ mainly in leaf width, and size and colouring of the perianth and anthers.
            textZh: SANBI 条目提供了 Romulea atrandra G.J.Lewis 的鉴别特征。
            sourceIds:
              - sanbi_12511_0
            locator: "SANBI/WFO archive Diagnostic row 51661; source identifier 12511.0; cited publication: De Vos, MP. 1983. Syringodea, Romulea, Fl. S. Africa 7(2,2): 1 - 76. Botanical Research Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: The central species in ser. Atrandrae, Romulea atrandra is highly variable in size, flower colour and markings. It is diagnosed by the rounded corm, firm-textured and closely ribbed outer bracts with conspicuous brown-flecked membranous tips, and white, pale blue or lilac to magenta flowers with white to golden-yellow cup, with or without dark blotches around the cup or dark lines in the cup. The most striking form, occurring over much of the Roggeveld, has large, bright magenta flowers with a pale yellow or whitish cup boldly striped with black on the veins, and banded with black in the throat. Other populations have white or pale blue to pink or magenta flowers with unstriped cups, either pale or golden-yellow and with or without dark markings in the throat. Populations along the south coast have small, unmarked, white to pale blue flowers and may be confused with forms of R. rosea, from which they differ in the closely ribbed bracts with conspicuous brown-flecked tips, and anatomically in lacking veins in the rib margins.
            textZh: SANBI 条目提供了 Romulea atrandra G.J.Lewis 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 95171; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
