          - text: Geophyte, 100-270 mm tall, tuber oblong with hard, basal roots. Leaves 12-20, recurved and pressed to the ground, up to 12 mm wide, upper surface flat, edges boldly patterned with several broad, rectangular windows bordered in pale green, withering and turning orange at flowering, margin finely ciliate. Flowers yellowish. Capsule oblong-ellipsoidal, ± 10 mm long.
