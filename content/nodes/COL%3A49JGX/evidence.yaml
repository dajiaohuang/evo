        claims:
          - text: Like O. sabulosum but leaves spathulate and lobed apically.
            sourceIds:
              - sanbi_14187_0
            locator: "SANBI/WFO archive Morphology row 11378; source 14187.0; publication: Manning, JC; Goldblatt, P. 2012. Asteraceae: Oncosiphon Källersjö. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 401 - 401. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Oncosiphon schlechteri shares the perennial habit, obtuse leaf lobes and decurrent involucral bracts with the other littoral species O. sabulosus but is distinguished by the apically 3- to 5-fid or sometimes simple leaves (pinnatifid to pinnisect in O. sabulosus), spatulate to linear in outline (oblong to obovate in outline in O. sabulosus), prominently cobwebbed peduncles and young stems (glabrous in O. sabulosus), and smaller involucre, ?5 mm diam. (?5 mm diam. in O. sabulosus), with a cuneate base and several involucral bracts decurrent on the peduncle (base round to cordate with some involucral bracts decurrent in O. sabulosus).
            textZh: SANBI 条目提供了该种的鉴别特征。
