        claims:
          - text: Cormous herb, up to 300 mm tall. Perianth segments broadly ovate to oblong, held at right angles to tube. Tube 20-30 mm long. Flowers red or bright pink.
            textZh: Freesia laxa (Thunb.) Goldblatt & J.C.Manning 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_11118_0
            locator: "SANBI/WFO archive Morphology row 2040; source identifier 11118.0; cited publication: Herman, PPJ; Retief, E. 1997. Plants of the northern provinces of South Africa: Keys and diagnostic characters. Strelitzia 6: 1 - 681. National Botanical Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Evidently closely allied to Freesia grandiflora and sharing subglobose-conical corms, suberect spikes of brilliant scarlet flowers (pale bluish in subsp. azurea), and seeds that are bright orange or red when fresh. Both species are restricted to forest or savanna in regions of summer rainfall. The flowers in F. laxa are generally smaller, with a relatively longer perianth tube more than twice as long as the tepals (9-15 mm long), and very short filaments, 3-4 mm long and scarcely exserted from the tube. The species reproduces vegetatively by sessile cormlets.
            textZh: SANBI 条目提供了 Freesia laxa (Thunb.) Goldblatt & J.C.Manning 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 94622; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
