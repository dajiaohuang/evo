        usage:
          title: Heteropterys obovata (Small) Cuatrec. & Croat, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Liana; stems densely reddish-brown appressed-pubescent, becoming glabrate. Leaves opposite, elliptic to obovate-elliptic, acuminate at the apex and usually narrowed to a sharp apiculum, acute at the base, 5-13 cm long, 2-7.5 cm wide, glabrous on the upper surface, minutely muricate, the lower surface minutely muricate and whitish to brownish sericeous, frequently glandular, the trichomes usually of 2 types, the surface completely covered with fine, sessile, T-shaped trichomes to ca. .7 mm long and with sparse, to 1 mm long, stalked hairs, with a thicker body, usually darker in color than the sessile trichomes; glands of lower surface few to absent, usually in a row ca. midway between the midrib and margin; petioles 3-13 mm long with a pair of small glands appressed at the base on the upper side. Inflorescence upper axillary or terminal, 4-18 cm long, the axis, peduncles, pedicels and calyx lobes densely reddish-brown appressed-pu- bescent; pedicels sessile, not articulate. Flowers yellow; calyx lobes ovate, erect, biglandular, to 2 mm long; petals obovate-spatulate, to 3.3 mm long, clawed, the margins entire to weakly toothed; stamens to ca. 3 mm long, the staminal tube glabrous, to 1.7 mm long, the anthers to 1.2 mm long; pistil to 3.3 mm long, the ovary ovoid, densely reddish-brown pubescent, the styles to 1.7 mm long, gla- brous. Samaras brown, 3-4 cm long, glabrous to inconspicuously appressed- pubescent throughout; the body ovoid-ellipsoid, to ca. 1 cm long, the dorsal margin straight, thickened, the wing 12-14 mm wide near the apex, constricted in the middle to lower 1/3 becoming broader and ending abruptly near the base of the body.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 7229
