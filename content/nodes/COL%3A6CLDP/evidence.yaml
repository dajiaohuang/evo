          title: Dendropanax querceti Donn.Sm., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrubs or trees to 17 m. tall, the branchlets rugose. Leaves elliptic to oblong- lanceolate, 5-13 cm. long, 2-5 cm. broad, acuminate at the apex, cuneate at the base, entire or irregularly denticulate, the costa raised, the primary lateral veins prominulous, arcuate-ascending; petioles 0.5-4.5 cm long. Inflorescences gener- ally of a single terminal umbel, rarely with 1 or 2 smaller inconspicuous lateral umbels, the floriferous peduncle 0.5-2.5 cm. long, bracteate in the lower fourth; pedicels 3-15 mm. long. Flowers 5-35 per umbel, 5-merous; calyx obconic, about 2 mm. long and broad, the teeth small, apiculate; petals oblong, 1.5-2.0 mm. long, 1.0-1.5 mm. broad; filaments about 1 mm. long, the anthers about 1 mm. long; styles connate into a short column. Fruit subglobose, 4-7 mm. in diameter, the styles spreading distally.
