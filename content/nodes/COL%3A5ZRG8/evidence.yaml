          title: Combretum laxum Jacq., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Liana (sometimes a shrub ?), branchlets rufous- or tawny-tomentose to almost glabrous. Leaves chartaceous to subcoriaceous, opposite, petiolate, petioles 2-7 mm. long, tomentose to almost glabrous, lamina oblong or oblong-elliptic to broadly ovate or suborbicular, 6-18 X 3-7 cm., not conspicuously scaly, varying from tomentose to nearly glabrous, usually acuminate sometimes subcaudate at the apex, rounded or subcordate at the base. Flowers white or yellow, small, fragrant, sessile, 4-merous, in terminal or terminal and axillary panicles, rhachis rufous- or fulvous- tomentose, tomentellous or pubescent. Lower receptacle 1-1.5 mm. long, tomen- tose, tomentellous, pubescent or nearly glabrous; upper receptacle cupuliform, 1-2 X 1.5-2.5 mm., densely pubescent to nearly glabrous. Calyx-lobes deltoid, about 0.7 mm. long. Petals 4, broadly obovate to transversely elliptic or subreniform, about 1 mm. in diam., glabrous, exceeding the calyx-lobes. Stamens 8, filaments about 4 mm. long, anthers 0.5 mm. long. Disk small, glabrous. Style 2.5-4 mm. long. Fruit oblong, narrowly ovoid or suborbicular, 4-ridged or -winged, 2.4 X 1.5-2 cm., pubescent or glabrous.
