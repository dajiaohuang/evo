        usage:
          title: Pentagonia nuciformis Dwyer, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Trees to 17 m tall, the twigs terete, ultimately angular, the nodes moderately crowded; petiole scars oblong or obovate rotund, to 1 cm long. Leaves oblong, entire, 15-30 cm long, 5-16 cm wide, widely rounded or widely deltoid toward the apex, scarcely acuminate or with the acumen to 1 cm long, the costa prom- inulous above and ridgelike, prominent beneath, the lateral veins 12-14, at first strict, then arcuate toward the margin, the intervenal areas lineolate, thinly co- riaceous, glabrous; petioles 2-4 cm long, slightly dilated at the base, glabrous; stipules free, deltoid oblong, to 4 cm long, to 2 cm wide, acute, glabrous, cori- aceous, black when dry, with 2 well-spaced proximal keels converging toward the apex. Flowers not seen. Fruits ca. 15, axillary, oblong or subrotund, often angular, to 4 cm long, to 3 cm wide, nutlike, lignose, glabrous but with minute, brown scales, deciduous, the persistent calycine cup 0.3-0.5 cm long with a few glands within, the glands to 5 mm long, the lobes 5, often withered, oblong, equal to or longer than the tube, the pericarp lignose, to 4 mm thick, smooth and lightly reticulate within; seeds abundant, disposed as 2 oblong rotund clusters when dry, to 2 cm long, the individual seeds oblong, ca. 7 mm long, angular, shiny, minutely honeycombed in appearance.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 11929
          archiveSourceId: F3AF7B92-B6A4-4CF8-8A02-C14FC6D7B65C
