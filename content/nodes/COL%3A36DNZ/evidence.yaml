          - text: Diosma thyrsophora is a distinct species growing up to 3 m tall, totally glabrous, single-stemmed at base with branchlets numerous, very slender, somewhat clustered, with leaves linear-lanceolate, obtuse, sessile, alternate, gland-dotted along either side of the midrib and on margins, with petals with one or two scarcely discernible hairs about the middle, narrowing below to a short claw and with the anther gland deflexed.
