  claims:
    - subjectId: taxon:raoellidae
      claimKind: scientific
      claimType: topology
      statement: The whale-origin synthesis treats sampled raoellids as close fossil relatives used to test the land-to-water transition, while their relationship to Cetacea remains a phylogenetic inference rather than evidence that a raoellid specimen was a direct whale ancestor.
      confidence: medium
      confidenceRationale: The review integrates primary morphology, stratigraphy and phylogeny but does not identify a direct ancestor. The statement preserves that distinction.
      referenceLinks:
        - relation: supports
          referenceId: uhen-2010-whale-origins
          pages: 193–198
          quoteLocator: Artiodactyl relatives and earliest cetaceans; raoellid discussion
    - subjectId: taxon:raoellidae
      claimKind: scientific
      claimType: fossil-range
      statement: raoellidae is displayed at 48–47 Ma only as the sampled raoellid interval in the whale-origin review, not a direct whale ancestor or global family range. The interval is a source-bounded sample window, not a global FAD, LAD, divergence date, continuous occupancy claim or direct-ancestor assertion.
      confidence: medium
      confidenceRationale: raoellidae uses Uhen, M.D. (2010) because the cited pages and locator expose the sampled taxon, specimen or living sequence set. Confidence is medium and applies only to Eocene raoellid sample synthesized by Uhen; broader endpoints remain unclaimed.
      referenceLinks:
        - relation: supports
          referenceId: uhen-2010-whale-origins
          pages: 193–198
          quoteLocator: Artiodactyl relatives and earliest cetaceans; raoellid discussion
        - relation: contextualizes
          referenceId: ics-2026-06
          pages: International Chronostratigraphic Chart v2026/06
          figure: Global chronostratigraphic scale
          quoteLocator: Numerical boundaries for named geological stages used to bound the source sample
  claim-rationales.zh:
    - 综述整合一手形态、地层和系统发育证据，但未认定直接祖先；表述保留这一差别。
    - raoellidae 采用 Uhen, M.D.（2010）的论文，因为所引页码与定位符直接标示了研究采样的类群、标本或现生序列集合。中等置信度仅适用于 Eocene raoellid sample synthesized by Uhen；更宽泛端点保持未声明。
  claim-statements.zh:
    - 鲸类起源综述把取样 Raoellidae 视为用于检验陆生—水生转变的近缘化石类群；其与鲸目的关系仍是系统发育推断，而不是某件 Raoellidae 标本为鲸类直接祖先的证据。
    - raoellidae 仅以 48–47 Ma 展示为鲸类起源综述中的劳氏兽科采样区间，而非鲸类直接祖先或全球科级范围。该区间是来源限定的样本窗口，不是全球首现、末现、分化日期、连续占据或直接祖先断言。
