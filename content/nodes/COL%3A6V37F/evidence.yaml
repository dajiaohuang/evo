          title: Peperomia hispidula (Sw.) A.Dietr., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: A rather small, assurgent, branched, spreading herb; stem 2-3 mm. thick below when dry, branches ascending to 20 cm. or more from the decumbent, root- ing base, hispid at least at the nodes, the hairs rigid to rather flaccid, internodes variable in length; leaves alternate, ovate-orbicular or rhombic-ovate, 8-15 mm. in diameter, apex rounded, obtuse, base rounded or triangular, obtuse, loosely hispid above or glabrate, loosely hispid beneath at least along the nerves, palmately 5- nerved with the midrib strongly branched at about the middle, drying membranous and subpellucid; petiole commonly 5-15 mm. long, slender, hispid to glabrate, but usually with at least a few hairs near the blade; spikes leaf-opposed or terminal, slender, mostly 1-2 cm. long, loosely and alternately flowered; peduncle slender, 10-15 mm. long, hispid to glabrate; bracts round-peltate; fruit globose-ovoid, about 1 mm. long, covered with white, hispid hairs and on a pedicel up to 0.5 mm. long when mature, stigma apical on a conic style.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 9922
