        claims:
          - text: Tufted perennial to 600 mm high, erect to geniculate. Leaf blade to 100 x 3-5 mm, upper leaf surface densely papillate; leaves and sheaths with bulbous-based hairs. Spikelet 2.4-3.5 mm long; glumes not recurved; lower glume ovate, 1/3 the spikelet length; upper glume 9-nerved; lower floret male, lemma 5-9-nerved, palea well developed; upper lemma pale to dark brown, shiny.
