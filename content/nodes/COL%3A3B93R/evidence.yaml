    facets:
      morphology:
        status: partially-supported
        claims:
          - text: "Annual or biennial erect to decumbent or prostrate herb. Stems up to 0.5 m long, pilose with deflexed hairs, with glandular hairs and sessile glands. Leaves alternate, sub-opposite to opposite; petiole 25-165 mm long, indumentum as on stem; stipules 2 or 4, ovate with apex acuminate, whitish; blade 35-45 x 30-40 mm, simple, broadly ovate to broadly deltate-ovate, sub-pinnately to sub-palmately veined, margin serrate and nearly entire to shallowly, lobed to rarely pinnatifid, usually soft-textured, base cordate to truncate, apex obtuse to acute, sparsely pilose with numerous sessile glands adaxially and abaxially. Inflorescence of 3-7 flowers, indumentum as on stem; peduncles 30-60 mm long; pedicels 10-16(-22) mm long; bracts 4-6, ovate, glabrous to glandular, ciliate, whitish to straw coloured. Sepals 3x2 mm, indumentum as on stem and dense, apical mucro terete and 0.6 mm long. Petals 4-5 x 2-2.5 mm, violet or white. Stamens free; fertile stamens violet, 3-4 mm long, narrowly ovate becoming terete in upper half; pollen striate interwoven to reticulate, polar diameter 66 µm; staminodes narrowly ovate, 2 mm long. Ovary 0.5 mm long with rostrum 1.5 mm long; style 0-1 mm long; stigmas 0.6 mm long. Mericarps: head 3-5 mm long, apical pit glandular with one distinct furrow below pit, tail 20-25 mm long. Seed ±3 mm long."
            sourceIds:
