          - text: Erect to prostrate pilose and glandular herb. Leaves with petiole 25-165 mm long; lamina simple, broadly ovate to broadly deltate-ovate with base cordate to truncate, sparsely pilose with numerous sessile glands, normally soft-textured, margin serrate and usually only shallowly lobed. Petals violet or white. Mericarps with glandular pits and one furrow below pit, tail short, 20-30 mm long.
