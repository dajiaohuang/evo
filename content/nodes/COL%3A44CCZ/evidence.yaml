    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Acaulescent, cormous geophyte, 2-5 cm. Leaves ovate to oblong, channelled, prostrate. Flowers purple to mauve with yellow centre, tepals cupped, anthers sessile, style exceeding anthers, stigmas lobed.
            textZh: Moraea variabilis (G.J.Lewis) Goldblatt 的 SANBI 物种条目记载了植株、叶片和花部形态。
            sourceIds:
              - sanbi_13878_0
            locator: Strelitzia 29; archive Morphology row 7420, source 13878.0
            placeTimeScope: Regional species account published 2012; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
          - text: With a reddish purple flower with yellow cup, Moraea variabilis most resembles M. versicolor but differs in the glossy, dark green leaves, channelled with straight margins, filaments usually united entirely or rarely free for less than 1 mm, thus with the anthers sessile or almost so, and the style dividing just above the anther tips. Moraea versicolor has the leaves usually glaucous and with wavy margins, the filaments free and diverging in the upper 1.0-1.5 mm, and the style dividing 2-3 mm above the tips of the anthers. The ranges of the two species are complimentary. Apparent hybrids with Moraea citrina have been recorded at a few sites and have large orange or pink flowers. The variation in flower size and colour among the hybrids suggests that they are interbreeding.
            textZh: SANBI 条目提供了 Moraea variabilis (G.J.Lewis) Goldblatt 的鉴别特征。
