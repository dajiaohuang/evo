    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Tree, 4-17 m, rarely 30 m high. Leaves fairly sparsely and very minutely scaly below appearing minutely pitted, lanceolate-elliptic to elliptic, usually broadest about the middle and from there tapering to base and apex. Inflorescence axillary as well as terminal. Flowers white.
            sourceIds:
              - sanbi_11118_0
            locator: "SANBI/WFO archive Morphology row 2862; source 11118.0; publication: Herman, PPJ; Retief, E. 1997. Plants of the northern provinces of South Africa: Keys and diagnostic characters. Strelitzia 6: 1 - 681. National Botanical Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: O. woodiana resembles O. africana in that it also bears axillary inflorescences. It can easily be distinguished by the shape of the leaves; the sparse small lepidote scales on the under surface (which appear like minute dots or pits); by the anastomosing loops of the veins which do not form a more or less straight line inside the margin; the grey or white twigs which are partly 4-angled and the dark fruits which are more or less pointed and oblique at the base.
