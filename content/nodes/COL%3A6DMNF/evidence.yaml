        usage:
          title: Drymonia variegata Uribe, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Epiphytic vinelike herbs or shrubs; stems more than 0.5 mn long, slender, 3-5 mm in diam., the internodes 1-6 cm long, green to reddish, pilose, sericeous or villous toward the apex, the nodes thicker; branches short. Leaves opposite, lanceolate, ovate to oblong, 8-11 cm long, 3.5-4.6 cm wide, membranous, the apex acuminate, the base rounded oblique, crenulate, above dark green to bronze with silvery veins, bullate, pilose, below red violet, villous especially along the veins; petioles 1.1-1.7 cm long, reddish, villous. Inflorescences axillary, single flowered; peduncles and bracts not seen; pedicels ca. 1 cm long, reddish, pilose. Flowers showy; calyx lobes unequal, free to the base, slightly spreading, the dorsal lobe smaller, oblong, ca. 8 mm long, ca. 2 mm wide, the other lobes 1.0-1.2 cm long, ca. 3 mm wide, green toward the base, reddish toward the acute apex, the margin toothed above, pilose outside and toward the apex inside; corolla "cream with magenta markings at the base of the lobes," (fide Gentry & Clewell) the tube slender, ca. 3 cm long, ca. 5 mm in diam. at the spurred base, above ca. 9 mm in diam., outside pilose, above inside glabrous, the lobes fimbriate; stamens (in bud) with lower filaments adnate to the base of the corolla tube ca. 5 mm, slender, the upper fialments free almost to the base, broad, all glabrous, the anthers ca. 5 mm long, sagittate; disc reduced to a single dorsal gland; ovary ovoid, ca. 6 mm long, densely pilose, the style glandular puberulent, the stigma broadly stomatomorphic to bilobed. Fruit interior red, seed mass purple.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 6304
