          - text: Distinguished from the widespread I. scillaris by its very slender habit, the stems rarely branched, usually three, narrow leaves, mostly 1.5-3.0 mm wide, and relatively small flowers with tepals 8-9 x 4-5 mm and anthers 2.0-2.5 mm long. The corms are also relatively small, mostly less than 10 mm in diameter and with relatively fine tunic fibres. Corms of I. scillaris are larger, typically 12-18 (rarely only 10) mm in diameter, with relatively coarse tunic fibres, and the species has broader leaves, mostly 8-25 mm wide. Provisionally collections from De Hoek at the southern end of the Piketberg and flowering in September are included here. These plants have slightly broader but shorter leaves than typical I. tenuis and have undulate margins.
