      ecology:
        status: partially-supported
        claims:
          - text: Known from just a handful of sites, Ixia tenuis is restricted to rocky, sandstone habitats in the Piketberg Mtns, mostly at elevations of 650-800 m. The type population was collected on the Farm Noupoort on south-trending slopes of a rocky hill growing in wet moss on shallow soil on sandstone outcrops. The remaining collections lack detailed habitat notes. The undulate-leaved variant is from the foot of the Piketberg Range and blooms earlier, in September.
