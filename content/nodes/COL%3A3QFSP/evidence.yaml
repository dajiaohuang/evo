    facets:
      morphology:
        status: partially-supported
        claims:
          - text: "Plants slender, 180-350 mm high, stem simple or rarely 1-branched. Corms globose, 7-10 mm diam., tunics of fine fibres. Leaves mostly 3(2), occasionally 4 but then this very reduced in size, ± linear to narrowly sword-shaped, 1/4-1/2 as long as stem, mostly 1.5-3.0 mm wide, relatively soft-textured, pale grey-green, when alive main vein slightly raised (appearing thickened when dry), margins not raised (rarely undulate, then blade up to 5 mm wide). Spike mostly 4-10-flowered, flowers mostly 10-15 mm apart; bracts 2-3 mm long. Flowers deep magenta with tepal bases yellow edged with darker magenta (or pale pink or white), throat pale yellow, perianth tube 3.0-3.5 mm long, expanded in upper 1 mm; tepals 8-9 x 4-5 mm, oriented vertically but with lowermost tepals recurved and ± horizontal. Stamens unilateral; filaments ± 2 mm long; anthers 2.0-2.5 mm long. Style branches ± 1 mm long, reaching to ± middle of filaments. Flowering time: mid-Oct.-mid-Nov."
            textZh: Ixia tenuis Goldblatt & J.C.Manning 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_15933_0
            locator: "SANBI/WFO archive Morphology row 85217; source identifier 15933.0; cited publication: Goldblatt, P; Manning, JC. 2012. Systematics of the southern African genus Ixia (Iridaceae): 4. Revision of sect. Dichone. Bothalia 42(2): 87 - 110. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Ixia tenuis is distinguished from the widespread I. scillaris by its very slender habit, the stems rarely branched, usually three, narrow leaves, mostly 1.5-3.0 mm wide, and relatively small flowers with tepals 8-9 x 4-5 mm and anthers 2.0-2.5 mm long. The corms are also relatively small, mostly less than 10 mm in diameter and with relatively fine tunic fibres. Corms of I. scillaris are larger, typically 12-18 (rarely only 10) mm in diameter, with relatively coarse tunic fibres, and the species has broader leaves, mostly 8-25 mm wide. Collections by W.F. Barker (Barker 4671 and 5764) from De Hoek and flowering in September were included. These specimens have slightly broader but shorter leaves than typical I. tenuis and have undulate margins. The species is rare, and at present merits a conservation status of Vulnerable (VU), but with no imminent threat.
