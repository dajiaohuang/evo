        usage:
          title: Aphelandra seibertii Leonard, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Herbs, erect to 19 cm high; stem quadrangular, pilose hairs to 1 mm long, the lower stem rooting at the nodes. Leaves elliptic to 9.5 cm long, 4.2 cm wide, apically acute, basally acute, the pilose hairs to 1 mm long above and beneath, dense along costa and lateral veins beneath, the margins entire to slightly undulate, the petioles to 1.6 cm long, densely pilose. Inflorescences in 1-3 terminal spikes, to 13 cm long and 1 cm wide, the rachis densely pilose; bracts closely imbricate, spreading at maturity, rhombic, to 14 mm long, 6 mm wide, the tips often purplish, the margins above the midpoint dentate with 2-3 erect teeth, ca. 1 mm long, the bractlets lanceolate 8.5 mm long, 2 mm wide, keeled, translucent, pilose along the keel. Flowers falling away at time of maturity when the bracts are expanded; calyx segments translucent, with sparse small glandular hairs plus pilose hairs, lanceolate, anterior segments 5 mm long and 0.7 mm wide, the lateral segments 5 mm long and 0.5 mm wide, the posterior segment 5.3 mm long and 1.4 mm wide; corolla yellow at base, the lobes lavender tipped, bilabiate, the tube funnel- form, 11 mm long, 2 mm wide at the base, 4 mm wide at the mouth, the upper lip 6.5 mm long and 5.5 mm wide, divided to 2 mm into 2 rounded lobes, the lower lip 8 mm long, with 3 lobes, the lateral lobes rounded, 6 mm long and 2 mm wide, the middle lobe retuse, 8 mm long and 5 mm wide, puberulous glandular outside, glabrous inside; stamens slightly exserted, the filaments pilose. Capsules oblanceo- late, ca. 8 mm long, 3 mm wide and 1.5 mm thick, reddish brown; seeds 4 near- triangular, puberulent, 3 mm long and 0.7 mm thick.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 144
