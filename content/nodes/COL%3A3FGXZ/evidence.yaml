        claims:
          - text: Cormous geophyte, 16-35 cm, tunics soft. Leaves linear. Flowers large, pink, tepals cupped, stamens unequal and unilateral.
            textZh: Geissorhiza grandiflora Goldblatt 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 6781; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Geissorhiza grandiflora has one of the largest flowers in the genus, comparable in size with those of some species of sect. Engysiphon (subg. Weihea). The flowers are deep pink and zygomorphic with stamens and style both unilateral and lying above the lowermost tepal. The light brown, imbricate corm tunics are papery in texture but otherwise match those of subg. Geissorhiza and are regularly notched along the lower margin. The unequal stamens and branched stems are characteristic of the sect. Monticolae, in which it most closely resembles G. burchellii, a generally smaller species with leaves with heavily thickened margins and midrib, and dark purple, radially symmetric flowers with a shorter perianth tube 4-6 mm long. The two species are occasionally sympatric or nearly so and both have been collected on the Cossacks and Slanghoek Mtns. A collection from the Grootwinterhoek mtns, provisionally assigned to G. grandiflora, has somewhat smaller flowers than are typical and their colour is uncertain.
            textZh: SANBI 条目提供了 Geissorhiza grandiflora Goldblatt 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 94715; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
