    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, 10-16 cm, tunics woody, concentric. Leaves lanceolate, trailing. Flowers 1-few per spike, blue, tepals spreading.
            textZh: Geissorhiza nigromontana Goldblatt 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 6800; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Distinctive in its short-tubed blue-purple flowers, the perianth tube 2-3 mm long and much longer tepals 14-16 mm long, Geissorhiza nigromontana has spikes of only 2 or 3 flowers. The style branches are unusually long, 4-5 mm long, and the corm tunics are softly papery. Notably the stem is prostrate at the base and becomes abruptly erect above. It is most probably closely related to G. foliosa, a species of the Langeberg foothills, which blooms mainly in October and November and it has the broad flat leaves typical of that species, but G. foliosa has a perianth tube 5-6 mm long, a spike of up to 7 flowers and style branches up to 3 mm long. Geissorhiza nigromontana is also distinctive in bearing cormlets in the lower stem axils, a feature rare in the genus.
            textZh: SANBI 条目提供了 Geissorhiza nigromontana Goldblatt 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 94652; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
