          title: Ormosia tovarensis Pittier, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Tree to ca. 25 m; young stems yellowish to reddish tomentose. Leaves 7-9- foliolate, the rachis 12-36 cm long, reddish tomentose, the petiole 4-15 cm long, reddish tomentose, the petiolules 3-10 mm long, reddish tomentose, the leaflets coriaceous, elliptic, oblong-elliptic or obovate, 8-30 cm long, 1-18 cm wide, rounded at each end, the margins often revolute, the upper surface glabrous, densely reddish pubescent with moderately crispate hairs beneath, the secondary veins raised. Inflorescence terminal, the axes reddish tomentose, the bracts del- toid, 5-6 mm long, the bracteoles linear-deltoid, ca. 2 mm long. Flowers 15-16 mm long, violet; calyx reddish tomentulose, 10-11 mm long, 5-lobed, the teeth 4-5 mm long; ovary yellowish pubescent with crispate hairs. Fruit yellowish to reddish velutinous, 1-3-seeded, 4-9 cm long, 3-4 cm wide, ca. 2 cm thick, the valves ligneous; seeds bicolored red and black, 15-22 mm long, 13-19 mm wide, 10-18 mm thick, the hilum 3.0-3.5 mm long.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 5102
