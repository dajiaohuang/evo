        claims:
          - text: Cormous geophyte, 25-40 cm. Leaves sword-shaped. Flowers long-tubed, cream-coloured with red streaks, bracts large, rust-coloured above and attenuate.
            textZh: Tritonia flabellifolia (D.Delaroche) G.J.Lewis 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 6871; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Distinguished from the florally similar Tritonia pallida from the Little Karoo by always lacking calluses on the lower tepals, which are marked with a red or yellow and red streak, and by its stiffly erect, narrowly lanceolate-attenuate leaves, mostly 4-10 mm wide, and distinctive attenuate-aristate bracts mostly 15-40 mm long.
            textZh: SANBI 条目提供了 Tritonia flabellifolia (D.Delaroche) G.J.Lewis 的鉴别特征。
