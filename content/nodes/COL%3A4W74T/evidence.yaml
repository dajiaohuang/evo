    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Slender, single- to multistemmed, deciduous shrub to small tree, up to 2.25 m high. Leaves consistently 4-7-foliolate; leaflets generally toothed, sessile, elliptic to narrowly elliptic obovate; terminal leaflets (27-)44(-68) x (8-)12(-16) mm. Drupe circular, obloid.
            sourceIds:
              - sanbi_11118_0
            locator: "SANBI/WFO archive Morphology row 3297; source 11118.0; publication: Herman, PPJ; Retief, E. 1997. Plants of the northern provinces of South Africa: Keys and diagnostic characters. Strelitzia 6: 1 - 681. National Botanical Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: The 5(-7)-foliolate plants are readily recognizable but as entire, toothed, 3- and 5-foliolate leaves sometimes occur on the same plant, each type usually on its own branch, the determination of isolated herbarium sheets is very difficult. Habit is of the utmost importance and to the trained eye the venation pattern below and the membranous leaflets are diagnostic. Trifoliolate specimens are however easily confused with either R. transvaalensis, R. grandidens, R. dentata or more rarely R. pyroides var. gracilis.
            textZh: SANBI 条目提供了该种的鉴别特征。
            sourceIds:
