            locator: "SANBI/WFO archive Diagnostic row 51640; source 9808.0; publication: Moffett, RO. 1993. Rhus, Fl. S. Africa 19(3,1): 1 - 123. National Botanical Institute, Pretoria. [http://www.biodiversitylibrary.org/item/209553#page/1/mode/1up]. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
