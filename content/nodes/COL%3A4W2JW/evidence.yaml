    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Weak-stemmed perennial herb, freely branched, rhizomatous; stems 0.15-0.3 m long, slender, quadrangular, glabrous to sparingly pilose. Leaves petiolate; blade lanceolate to lanceolate-hastate, 10-30 x 3-6 mm, glabrous or nearly so, gland-dotted beneath, apex acute, base obtuse to rounded, margin entire, often inrolled; petiole 1-3 mm long. Inflorescence slender, lax, 5-12 mm long; pedicels 2-3 mm long. Calyx puberulous to hispidulous, at flowering 1.5-2 mm long, enlarging to 3 mm long in fruit. Corolla small, 4.5-6 mm long, variously coloured, violet to red or white with purple spots, the lower lip often paler than the upper; tube ascending, 3-4 mm long, widening to 2 mm wide at the throat; lips subequal, 1.5-2 mm long. Stamens reaching the apex of the upper lip, the lower pair attached about 2 mm above the base of the tube. Nutlets 1 mm long, pale brown, minutely tuberculate.
            sourceIds:
              - sanbi_15357_0
            locator: "SANBI/WFO archive Morphology row 50311; source 15357.0; publication: Codd, LEW. 1985. Lamiaceae: 4. Scutellaria. In: OA Leistner (ed.), Fl. S. Africa 28(4): 16 - 18. Botanical Research Institute, Department of Agriculture and Water Supply, Pretoria. [http://www.biodiversitylibrary.org/item/209555#page/9/mode/1up]. [CC BY]"
