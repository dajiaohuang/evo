        usage:
          title: Dalea cliffortiana Willd., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Herb to 0.7 m tall, usually much branched above; stems terete or slightly ridged from nodes, glabrous, sometimes pubescent on upper parts of stem, glan- dular dotted but glands less dense, less regular than on leaves. Leaves alternate, imparipinnate, (1-) 1.5-3.0(-5) cm long including the petiole and the terminal leaf- let; leaflets (5-)11-15(-19), entire, gland dotted below, gray green (on drying?), linear to narrowly elliptic, (2-)4-8(-15) mm long, including petiolule, 1-2 mm wide, the leaflets becoming larger from the base to the tip of the leaf; rachis narrowly winged; stipules narrow, stipels represented by paired glands. Inflores- cence narrow, compact spikes, terminal on the main and the lateral axes, becom- ing 0.8-3.5 cm long, 0.6-0.8 cm wide; bracts abruptly acuminate, pubescent at least on the margins, with long, soft hairs, gland dotted, green with light colored scarious margin. Flowers with the calyx 3-5 mm long, densely pilose, the teeth 5, triangular to acuminate, equal; petals 5, the standard white or rose tinged, 3- 5 mm long, clawed, the wing and keel petals blue to pink, exceptionally white; wings 2.0-2.5 mm long, the keel petals 2.0-3.5 mm long; stamens 9-10, connec- tive minutely gland tipped; pistil more or less pubescent. Fruit a 1-seeded, ob- ovoid, dry legume, 2.0-2.5 mm long, the style base persistent; single seed oblong, ca. 1.5 mm long.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 5209
