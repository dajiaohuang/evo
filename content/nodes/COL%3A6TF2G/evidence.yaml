        usage:
          title: Oxalis filiformis Kunth, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Creeping herb to 10 cm tall, pubescent with fine and whitish or reddish simple and pluricellular hairs, 1.5-2 mm long, mixed; roots fibrous, branched; -rhizomes and stems filiform, to more than 50 cm long, reddish, decorticating, hirsute, rooting; internodes 1-5 cm long, the nodes 1-leaved or with fascicles of leaves. Leaves with leaflets cordiform or transversely oblong, cuneate, 2-15 mm long, 3-20 mm wide, incised to 1/4 of its length, both faces pubescent or above glabrous, glabrescent, ciliate; stipules connate, reddish, enlarged at the apex, 2-3 mm long, 0.75-1.75 mm wide, setose-ciliate, concave. Inflorescences of the cymes longer than the foliage, 1-flowered; peduncles 1-7 cm, filiform; bracteoles linear, pilose, 1.5-3 mm long; pedicel 0.5-2.5 cm long. Flowers with the sepals greenish, the margins often violaceous, oblong, 3-5 mm long, 1-2 mm wide, obtuse, the apex densely ciliate, pubescent; petals 2-3.5 times the length of the sepals, rarely with minute glandular hairs scattered on the border and outside; stamens minutely pubescent, the longer stamens to 5.5 mm long, the shorter stamens to 4 mm long, connate to 1/4 of its length; pistils all longistylous, 6.5-7.5 mm long, the ovary reddish, carpels with a few short hairs inside, 3-6-ovuled, styles densely pubes- cent, ca. 5 mm long, slightly connate at the base, the stigma bifid, laciniate, papillose. Capsule oblong, 5-12 mm, thick, the calyx to 1/2-2/3 the capsule length, acute, minutely pubescent, the styles long, free, the carpels 3-6-seeded; seeds reddish-brown ca. 1 mm long, ellipsoid, flattened, acute, 6-ribbed, transversally striate.
          originalLanguage: en
          sourceField: general
