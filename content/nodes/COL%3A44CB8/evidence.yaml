        claims:
          - text: Cormous geophyte, 4-15 cm, branching mainly from base. Leaves 2 or 3, linear, margins inrolled, twisted or coiled. Flowers white and yellow, style branches and crests often flushed violet.
            textZh: Moraea serpentina Baker 的 SANBI 物种条目记载了植株、叶片和花部形态。
            sourceIds:
              - sanbi_13878_0
            locator: Strelitzia 29; archive Morphology row 7363, source 13878.0
            placeTimeScope: Regional species account published 2012; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
          - text: A small plant, Moraea serpentina rarely attains 200 mm in height and 90-120 mm is usual. It is readily distinguished by the typically three, rarely two or four foliage leaves, the blades channelled or flat and always at least loosely twisted, sometimes tightly so. The flowers are either partly yellow with pale yellow or white style branches and crests or white with the inner tepals and style branches flushed with violet. The inner tepals are held erect, a striking feature of the species. In the Kamiesberg populations the leaves are hairy on the margins or abaxial surface. Closely related M. tortilis, restricted to northern Namaqualand, has a broadly similar appearance but the leaf blades are terete and tightly coiled in corkscrew fashion, and the violet or white flowers have both outer and inner tepal limbs invariably half reflexed. Populations of Moraea serpentina from the western Knersvlakte, north of Vredendal, stand out in having consistently smaller, pale blue-violet flowers and two or even a single leaf but evidently do not otherwise differ from white-flowered plants. One- or two-leaved plants are occasionally found elsewhere across its range.
            textZh: SANBI 条目提供了 Moraea serpentina Baker 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: Strelitzia 42; archive Diagnostic row 94167, source 18638.0
            placeTimeScope: Regional species account published 2020; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
