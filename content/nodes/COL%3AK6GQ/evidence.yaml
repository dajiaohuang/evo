    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte 15-20 mm, with suberect stem. Leaves loosely pleated, softly hairy. Flowers several in an inclined spike, zygomorphic, purple, tube elongate, anthers erect, violet, inner bracts divided to base, ovary hairy.
            textZh: Babiana tubaeformis Goldblatt & J.C.Manning 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 6745; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Babiana tubaeformis has been collected several times at the same locality or close by north of Piketberg. It differs from B. nervosa in its longer tubed flowers and particularly in the fairly broad, soft-textured leaves arranged in a spreading fan, unlike the fairly rigid, narrow, deeply pleated, ± erect, shortly hairy leaves of B. nervosa. Possibly most closely related to B. fragrans, which has comparable, soft-textured, long-hairy, fairly broad leaves and large floral bracts rust-coloured only at the tips. Babiana tubaeformis is recognised in sect. Babiana by the elongate perianth tube 25-30 mm long and the dark violet stamens reaching to about the middle of the dorsal tepal. Other long-tubed species of sect. Babiana, B. ecklonii and B. latifolia, are unlike B. tubaeformis in their odourless, dark violet flowers with a slender perianth tube 30-47 mm long, curved at the apex, and the lower tepals joined to one another for at least 4 mm (5-7 mm in B. ecklonii), thus forming a strongly bilabiate perianth with horizontally extended lower tepals and the dorsal erect. Babiana fragrans also has strongly scented flowers with a perianth tube 18-20 mm long, broader usually light blue (rarely pale yellow) tepals, and the style dividing opposite the lower third of the anthers.
