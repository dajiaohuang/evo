        claims:
          - text: Cormous geophyte, 5-20 cm. Leaves lanceolate, margins sometimes crisped. Flowers nodding, zygomorphic, white to pink with purple or maroon tips, filaments filiform, 15-25 mm long.
            textZh: Ornithoglossum undulatum Sweet 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13859_0
            locator: "SANBI/WFO archive Morphology row 11054; source identifier 13859.0; cited publication: Manning, JC; Goldblatt, P. 2012. Colchicaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 80 - 83. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: One of the most characteristic species of the genus, easily recognized by its large flowers with very long filaments and styles. The perianth is usually bi-coloured in contrasting tones of white or rose-pink and deep-purple or maroon. The filaments are slender, usually white-coloured, sometimes rosy, and only occasionally purple-tipped. The undulate character of the leaves is taxonomically virtually useless, since entirely flat-leaved single specimens, or even whole populations, are by no means uncommon. The nectary margin also varies in shape. It is often more or less straight (like in O. vulgare) but not seldom prolonged into a short tongue, which may be entire, emarginate or bilobed. Similar tongue-like projections of the nectary margin also occur in two other species, viz. O. gracile and O. calcicola.
            textZh: SANBI 条目提供了 Ornithoglossum undulatum Sweet 的鉴别特征。
            sourceIds:
              - sanbi_4997_0
            locator: "SANBI/WFO archive Diagnostic row 58123; source identifier 4997.0; cited publication: Nordenstam, RB. 1982. A monograph of the genus Ornithoglossum (Liliaceae). Opera Bot. 64: 5 - 51. [10.1111/j.1756-1051.1983.tb01058.x]. [All rights reserved]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
