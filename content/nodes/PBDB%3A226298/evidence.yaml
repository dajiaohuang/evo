      claimKind: scientific
      claimType: fossil-range
      statement: Elpistostege is bounded here by articulated specimen MHNM 06-2067 from the Frasnian Escuminac Formation at Miguasha, Quebec, Canada; this named specimen context is not a global distribution or exact complete range.
      confidence: medium
