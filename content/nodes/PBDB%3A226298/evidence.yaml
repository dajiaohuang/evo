          quoteLocator: Miguasha, Quebec, Canada locality and MHNM 06-2067
    - subjectId: taxon:elpistostege
      claimType: taxonomy
      claimKind: scientific
      statement: Cloutier et al. place Elpistostege within the elpistostegalian, stem-tetrapodomorph region of their analysed topology; this package preserves that sampled placement without treating it as a fixed universal tree.
      confidence: medium
      confidenceRationale: The primary study supplies an explicit specimen-based phylogenetic analysis, but the placement of Elpistostege changes with taxon and character sampling; the claim is limited to that analysis.
      referenceLinks:
        - referenceId: cloutier-2020-elpistostege-hand
          relation: supports
          pages: 549–554
          figure: Figures 1–5; Extended Data Figures 1–2
          quoteLocator: Comparative anatomy and phylogenetic analyses
    - subjectId: taxon:elpistostege
      claimType: biogeography
      claimKind: scientific
      statement: The Elpistostege specimen used here is from the Miguasha fossil locality in Quebec, Canada; that named locality is not a global distribution or habitat-preference claim.
      confidence: high
      confidenceRationale: The locality and specimen context are directly reported in the primary study. The claim deliberately stops at the documented occurrence and does not infer an unsampled range.
      referenceLinks:
        - referenceId: cloutier-2020-elpistostege-hand
          relation: supports
          pages: 549–554
          figure: Figure 1; specimen description
          quoteLocator: Miguasha, Quebec, Canada locality and MHNM 06-2067
    - subjectId: taxon:elpistostege
      claimType: morphology
      claimKind: scientific
      statement: CT data from articulated Elpistostege specimen MHNM 06-2067 document four proximodistal radial rows, branched carpals and distal elements interpreted as digits or putative digits while lepidotrichia remain present.
      confidence: medium
      confidenceRationale: The internal anatomy is directly documented, while digit homology and functional interpretation remain hypotheses; medium confidence preserves that distinction.
      referenceLinks:
        - referenceId: cloutier-2020-elpistostege-hand
          relation: supports
          pages: 549–554
          figure: Figures 2–5; Extended Data Figures 1–2
          quoteLocator: Pectoral-fin description and CT reconstruction
    - subjectId: taxon:elpistostege
      claimType: ecology
      claimKind: scientific
      statement: The cited Elpistostege pectoral-fin study documents an aquatic fossil setting but does not establish diet, habitat preference or observed locomotor behaviour for the genus.
      confidence: medium
      confidenceRationale: The depositional locality is documented, whereas diet and behaviour are not directly observed in the cited anatomical study; unavailable fields remain unavailable rather than filled from living analogues.
      referenceLinks:
        - referenceId: cloutier-2020-elpistostege-hand
          relation: supports
          pages: 549–554
          quoteLocator: Specimen context and pectoral-fin discussion
  claim-rationales.zh:
    - 希望螈鱼：置信度为中：继承的具体页码、图版或章节定位器支持具名标本或抽样分析的存在与范围；措辞有意把结论限制在该证据内，不把导航包络提升为全球生物边界、直接祖先或精确起源。
    - 一手研究给出基于标本的系统发育分析，但希望螈鱼位置会随取样和特征改变；此声明只保留该分析范围。
    - 论文明确记录了魁北克米瓜沙及标本背景；声明不把单一地点外推为全球分布或生境偏好。
    - CT 直接显示鳍内骨骼与鳍条，但指同源性和功能解释仍属假说，因此保留中等置信度。
    - 所引解剖研究记录了水生化石环境，却没有直接观察食性或行为；缺失生态字段保持未解析。
  claim-statements.zh:
    - Cloutier 等在其分析的拓扑中，将 Elpistostege 置于希望螈类、四足形类干群所在的区域；本内容包保留这一基于采样的定位，不将其视为固定不变的通用系统树。
    - 此处采用的 Elpistostege 标本来自加拿大魁北克的 Miguasha 化石地点；该地点记录不代表全球分布或生境偏好。
    - 关节相连的 Elpistostege 标本 MHNM 06-2067 的 CT 数据记录了沿近端至远端排列的四列辐状骨、分支的腕骨，以及被解释为指或可能的指的远端骨骼，同时仍保留鳞质鳍条。
    - 所引 Elpistostege 胸鳍研究记录了水生环境中的化石背景，但未确定该属的食性、生境偏好，也未直接观察其运动行为。
    - Elpistostege 在此由来自加拿大魁北克省米古沙弗拉斯阶埃斯库米纳克组的关节连接标本 MHNM 06-2067 约束；这一具名标本背景不是全球分布或精确完整延限。
