        usage:
          title: Hoffmannia psychotriifolia (Benth.) Griseb., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrubs to 2.5 m tall, the stems ultimately slender, terete, glabrous, rubescent. Leaves oblong, to 20 cm long, to 8 cm wide, usually 3-4 times longer than wide, acute and finally attenuate acuminate at the apex, the acumen to 2.5 cm long, acute and oblique at the base, the lateral veins 10-12, widely arcuate, stiffly chartaceous, concolorous or discolorous, glabrescent, usually with minute, scat- tered white raphides on both the surfaces; petioles to 9 cm long, and 2 mm wide, stipules not seen. Inflorescences in the axils of the uppermost leaves, the pedun- cles reduced to a pad or to 8 mm long, the flowers radially disposed, ca. 7 per inflorescence. Flowers on slender pedicels to 4 mm long, white, to 12 mm long; hypanthium 2-4 mm long, scarcely ribbed, often with abundant red raphides, the calycine teeth 4, deltoid, 0.8-2 mm long, acute; corolla 8-11 mm long, the lobes 4, thickly petaloid, often longer than the tube; stamens 4, the anthers 2-2.8(-4) mm long, the connective not produced at the apex or the base, the filaments 0.5- 1 mm long; ovary 2-3-loculate, the style to 5.5 mm long, the stigmas 2, linear, spreading at maturity, 2-3.3 mm long. Fruits on radiate, slender pedicels, shorter than the fruit; fruit oblong to ovate oblong, obtuse or truncate at apex, to 8 mm long, at least 2 times longer than wide, at first delicately ribbed, smooth, glabrous, often drying yellow, finally fleshy, in vivo china red, pink or purple.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 11801
