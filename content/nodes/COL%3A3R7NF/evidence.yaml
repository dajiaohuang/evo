      morphology:
        status: partially-supported
        claims:
          - text: Perennial herb; stems prostrate, slender, glandular-villous, 0.25-0.6 m long. Leaves sessile to shortly petiolate; blade ovate to broadly ovate, 16-24 x 12-20 mm, glandular-pubescent, apex obtuse to rounded, base truncate to subcordate, margin obscurely few-toothed to subentire. Flowers in 1-3(-5)-flowered cymes; pedicels (strictly peduncle plus pedicel) slender, 10-25 mm long with a pair of minute bracteoles about the middle. Calyx glandular-hispid, up to 6 mm long, shortly toothed. Corolla white to pale blue with a median yellow stripe, 10-15 mm long; tube campanulate, 6-11 mm long; upper lip 2.5 mm long; lower lip 4 mm long (corolla minute, yellowish, up to 6 mm long in cleistogamous plants).
            sourceIds:
