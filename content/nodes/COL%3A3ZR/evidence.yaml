      claimKind: scientific
      claimType: topology
      statement: Combined nuclear data provide a documented phylogeny for sampled Salmonidae within the Salmoniformes route. A family-level living sample is not a complete order topology and does not establish the order's fossil origin or global range.
      confidence: medium
      confidenceRationale: Confidence is medium because the cited primary study directly supports the bounded topology statement at the supplied locator. The confidence does not extend beyond a family-level living sample is not a complete order topology and does not establish the order's fossil origin or global range.
      referenceLinks:
        - relation: supports
          referenceId: crespi-fulton-2004-salmonidae
          pages: 658–679
          figure: Figures 1–5; sequence matrices
          quoteLocator: Taxon and gene sampling; combined-data topology
    - subjectId: taxon:salmoniformes
      claimKind: scientific
      claimType: fossil-range
      statement: The bundled broad fish clock and Salmonidae topology do not directly support the former 56 Ma–present Salmoniformes display; an order-specific fossil or clock locator is required, so the range is withheld.
      confidence: low
      confidenceRationale: "Salmoniformes temporal range: the cited primary study or systematic review directly supports the stated sample, calibration or withholding boundary at the supplied locator. Confidence is low and does not extend to a global FAD, LAD, direct ancestor or unsampled interval."
      referenceLinks:
        - relation: supports
          referenceId: near-2012-ray-fin-phylogeny
          pages: 13698–13703
          figure: Figure 1; supplementary chronogram and calibrations
          quoteLocator: Broad actinopterygian clock sample; no audited Salmoniformes endpoint in the atlas locator
  claim-rationales.zh:
    - 置信度为中：所引主研究在给定页码、图版或章节定位器处直接支持这一受限的拓扑表述；置信度不外推到文中明确排除的全群起源、全球首现、直接祖先或精确端点。
    - Salmoniformes temporal range：所引一手研究或高质量系统综述在给定页码、图表或章节处直接支持此处的样本、校准或暂缓边界。置信度为低。该置信度不外推至全球首现、全球末现、直接祖先或未采样区间。
  claim-statements.zh:
    - 组合核基因数据为鲑形目路线中的所抽样鲑科提供了有据系统树。现生科级样本不是完整的目级拓扑，也不能确立该目的化石起源或全球延限。
    - 现有的广义鱼类分子钟和鲑科拓扑不能直接支持原先 5600 万年前至今的鲑形目显示；必须补充目级化石或分子钟精确定位，因此该范围暂缓。
