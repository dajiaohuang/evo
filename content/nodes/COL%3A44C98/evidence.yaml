        claims:
          - text: Cormous geophyte, 10-30 cm, stem usually branched above the leaves and branches crowded. Leaves 2-several, clustered above ground. Flowers pale yellow to salmon, style arms 6, filiform and extending between filaments.
            textZh: Moraea nana (L.Bolus) Goldblatt & J.C.Manning 的 SANBI 物种条目记载了植株、叶片和花部形态。
            sourceIds:
              - sanbi_13878_0
            locator: Strelitzia 29; archive Morphology row 7355, source 13878.0
            placeTimeScope: Regional species account published 2012; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
          - text: "Flowers of Moraea nana are of the Hexaglottis-type and closely resemble those of Moraea sect. Hexaglottis in their spreading, subequal tepals with short erect claws and style branches reduced to paired filiform arms, but the resemblance is convergent and M. nana has a vegetative form almost identical to that of some species of subg. Umbellatae, with leaves and branches crowded together above the ground. Chromosome number n = 10, also matches subg. Umbellatae (subg. Hexaglottis has x = 6). Moraea nana is probably most closely allied to M. maximiliani and the two can only be distinguished by examination of the floral parts: M. maximiliani has tepal claws ± 6 mm long, entirely united filaments, and short, apically diverging style branches partly hidden by the short erect and contiguous anthers, whereas M. nana has shorter tepal claws, 2-4 mm long, filaments free in the upper half, and filiform, spreading style branches extending between the filaments. Moraea nana and M. maximiliani are interfertile but neither can be crossed with species of sect. Hexaglottis. Flowers typically open after midday, ± 12:30 and collapse after 18:00 but in plants from the Pakhuis area of the northern Cederberg flowers open at ± 8:00 and deliquesce at ± 13:00. Flowers of these populations are slightly smaller than is typical but otherwise do not appear to differ significantly."
            textZh: SANBI 条目提供了 Moraea nana (L.Bolus) Goldblatt & J.C.Manning 的鉴别特征。
