    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Like I. pauciflora but flowers zygomorphic with declinate stamens, anthers curved upward, filaments exserted 8-10 mm, perianth tube 13-15 mm long, style branches 4.5-5.0 mm long.
            textZh: Ixia reclinata Goldblatt & J.C.Manning 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 7150; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Ixia reclinata has linear leaves typical of the I. capillaris group but considerably larger flowers with a perianth tube up to 15 mm long and spreading tepals forming a flower ± 40 mm in diameter. The style divides just below to opposite the bases of the anthers and has branches ± 5 mm long, unusual for the complex. This contrasts with blue-mauve (or pale yellow) flowers with a tube up to 8 mm long, flower diameter of ± 20 mm, style dividing opposite the upper third of the anthers and with branches < 1.5 mm long in I. capillaris. The flowers of I. reclinata are white, suffused with blue-mauve and zygomorphic, having unilateral stamens with parallel filaments extended horizontally with the anthers held closely together and facing upward. Unilateral stamens are rare in Ixia but are known in I. pauciflora of the I. capillaris group, to which I. reclinata appears to be most closely related. In I. pauciflora the stems are usually unbranched, the pink flowers have filaments exserted only 2-5 mm and the style usually divides opposite the lower third of the anthers. Stems of I. pauciflora are typically sheathed below by a collar of fibres, a feature uncommon in Ixia, but also present in the I. capillaris group in I. dieramoides.
            textZh: SANBI 条目提供了 Ixia reclinata Goldblatt & J.C.Manning 的鉴别特征。
