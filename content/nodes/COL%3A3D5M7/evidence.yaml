    facets:
      morphology:
        status: partially-supported
        claims:
          - text: A divaricate, closely much-branched, erect shrub, 0.3-1 m high, with rigid, straight, tapering and spinescent branchlets, and with numerous brachyblasts scattered along the stems and branches; cortex grey or brownish. Leaves crowded on the brachyblasts and scattered along the branch-lets, with a white, arachnose-woolly tuft at the base, linear-oblong, 1.5-8 mm long, 0.5-1 mm thick, entire, fleshy-coriaceous, sub- terete, or flattened and canaliculate above, obtuse or subobtuse, minutely apiculate, with a delicately muricate surface, indistinctly nerved, glabrous. Peduncles few or several from the brachyblasts, sometimes solitary in the leaf-axils, (1-)2-5 mm long, filiform and slender, flexuous, terete, glabrous. Involucre turbinate or narrowly campanulate from a narrow, cuneate or rounded base, 2.5-5 mm high, glabrous. Involucral bracts 5-7, uniseriate, connate at the base(-1/3); the free lobes narrowly ovate -lanceolate, 2-4 mm long, 1-1.5(-2) mm wide, obtuse-subacute, distinctly or usually indistinctly 1-3-nerved, subcoriaceous with thinner, somewhat fimbrillate margins, with sparsely ciliated tips. Receptacle ±flat, alveolate. Ray-florets 1-2 or often 0, yellow, shorter than the disc-florets. Tube 1-1.5 mm long, cylindrical. Lamina elliptic-oblong, 1-2 mm long, 0.7-1.2 mm wide, often without distinct veins, entire or apically 2-3-fid. Style terete with swollen base; style branches 0.7-0.9 mm long, with truncate-rounded tips. Disc-florets 5-13. Corolla 3.7-4.3 mm long. Tube 1.5-1.9 mm long, cylindrical. Limb campanulate, 2-2.5 mm long; lobes narrowly ovate, 1-1.3 mm long, 0.5-0.7 mm wide, revolute during anthesis. Anthers 1.5-1.8 mm long incl. the ovate, obtuse-subacute appendage. Style terete with swollen base on a short stylophore; style branches 0.6-0.7 mm long, truncate. Pappus bristles several-numerous, 1-1.5 mm long, erect, white, distinctly barbellate-subplumose. Achenes oblong, copiously sericeous-lanate with white or light brownish hairs, c. 3 mm long and 1 mm wide incl. the indumentum, under the indumentum narrowly elliptic-oblong-oblanceolate, c. 1.5 mm long and 0.3-0.4 mm wide, brown, with 5 indistinct ribs or veins; hairs 1-2 mm long, ± flexuous, somewhat mucilaginous when soaked.
