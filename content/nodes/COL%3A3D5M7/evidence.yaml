          - text: E. asparagoides is a very characteristic species. The stems are repeatedly branched in a zig-zag way, giving the shrub a compact and very twiggy appearance. The most striking features are the spinescent branches, the usually fascicled short leaves with a woolly basal tuft, the turbinate involucres on very short and slender peduncles, and the discoid or disciform capitula.
