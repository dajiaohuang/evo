    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants 350-450 mm high. Corm unknown. Stem with (1)2 or 3 branches from penultimate node, bearing a solitary sheathing leaf 45-55 mm long, attenuate, ± dry and light brown midway through flowering. Foliage leaf solitary, linear, fibrotic, falcate, longer than stem, narrowly channelled, 2-3 mm wide when opened flat. Rhipidial spathes pale grey-green, dry and light brown in upper half, attenuate, with fine white nerves evident, inner 50-65 mm long at anthesis, outer ± half as long, inner elongating after flowering to enclose ripening capsules. Flowers fugaceous, pale yellow, outer tepal limbs with deeper yellow nectar guides at base with fine dark dots; outer tepals obovoid-pandurate, 25-27 mm long, limbs ± 20 mm long, claws of both whorls ± 6 mm long, ascending to form narrow cup including lower half of filament column, limbs spreading and twisted through ± 45º distally, inner tepals ± 22 x 7 mm. Filaments 7-8 mm long, united for most of their length in smooth, cylindric column, free and diverging in upper 0.7 mm; anthers ± 8 mm long before anthesis, 5-6 mm after releasing pollen, then tips arching inward, exceeding style branches, yellow; pollen yellow. Ovary cylindric, usually exserted, ± 12 mm long; style branches ± 4 mm long, crests ± linear, erect, ± 1.5 mm long. Capsules and seeds unknown.
            textZh: Moraea doleritica Goldblatt & J.C.Manning 的 SANBI 物种条目记载了植株、叶片和花部形态。
            sourceIds:
              - sanbi_18638_0
            locator: Strelitzia 42; archive Morphology row 97884, source 18638.0
            placeTimeScope: Regional species account published 2020; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
          - text: The pale yellow flowers with relatively well-developed style branches and short, erect crests and, in particular, the filaments free distally for a short distance are somewhat unusual for subg. Homeria and recall Moraea pallida and M. cookii, also with a solitary foliage leaf. The spreading tepals twisted distally through ± 45º of M. doleritica are also found in M. cookii and M. pallida. Both M. cookii and M. pallida have a relatively broad leaf clasping the lower part of the stem, thus rather different to the particularly long, narrowly channelled, and relatively rigid, tough, fibrous leaf of M. doleritica. The range of M. doleritica in the Great Karoo is complimentary to that of M. cookii and M. pallida, with M. cookii extending from the Cederberg in Western Cape through the mountains of the Karoo to Lesotho, and M. pallida occurring across the Upper Karoo through Free State to Mpumalanga.
            textZh: SANBI 条目提供了 Moraea doleritica Goldblatt & J.C.Manning 的鉴别特征。
