        usage:
          title: Amphidasya ambigua (Standl.) Standl., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Subshrubs to 3/4 m tall, the stem occasionally subprostrate or upright, lignose, often rough with petiole scars, glabrous, the leaves aggregated terminally. Leaves oblong, elliptic or occasionally obovate, 7-24 cm long, 2.2-8 cm wide, occasion- ally subfalcate, deltoid or rounded at the apex, acuminate, the acumen short or to 1 cmi long, cuneate at the base, often slightly inequilateral, the costa grooved, plane or prominulous above, prominulous beneath, 1.2-2.5 mm wide proximally, the lateral veins 14-18, plane or prominulous above, prominulous beneath, often opposite, the intervenal areas patulous-reticulate, chartaceous, often discolorous, glabrous above, puberulent beneath, especially on the costa and veins, rarely subsessile; petioles 2-6 cm long, to 0.2 cm wide, puberulent, often flexuous; stipules free, appressed, the sheath rectangular, 4-5 mm long, or much larger (fide Standley), the lobes 6-8 subulate and flabellately disposed, terminal, 2-3 times the length of the body, acute, densely puberulent. Inflorescences terminal and axillary, the flowers densely crowded at the apex of the stem, the conglom- erate shorter than the petioles of the large leaves. Flowers with the hypanthium ca. 4 mm long, pubescent or glabrous, the calycine cup short, the calycine lobes 5-6, lanceolate, 5-12 mm long, 1.2-1.5 mm wide, acute, subcarnose, somewhat villosulose or villose especially on the margins; corolla white, the tube cylindrical, 20-30 mm long, 0.15 cm wide, petaloid to thickly carnose, puberulent on outside, glabrous or with glandular fimbriate structures within, these to 0.8 mm long, the lobes 5, narrow lanceolate or narrowly oblong, 3-5 mm long, with glandular fimbriate structures adaxially; stamens 3-5, the anthers oblong or ovate-oblong, 2-2.5 mm long, with a terminal petaloid appendage, subulate, 0.5-1 mm long, acute, the filament short; style slender, to 28 mm long, ca. 0.35 mm wide, the stigmas oblong, 4-5 mm long, 0.7 mm wide. Fruits oblong or oblong-rotund, 5-7 mm long; calycine lobes persistent, linear-subulate, unequal, to 17 mm long, acute, ca. 3 times the length of the fruit, the latter truncate, the nectary scar umbonate, the corolla tube scar annular, smooth or rugulose (the pressure of seeds against wall on drying), glabrescent to densely pubescent.
