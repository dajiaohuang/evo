        usage:
          title: Schoenobiblus panamensis Standl. & L.O.Williams, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Small dioecious trees 2-3 m. tall, the branches slender, essentially dichotomous, glabrous or glabrate, grayish brown. Leaves alternate, the blade subsessile, ob- lanceolate, narrowly subcaudate-acuminate, narrowly cuneate at the base, 12-20 cm. long, 3.5-5.0 cm. broad, rather thinly membranaceous, prominently venose, glabrous. 'Staminate inflorescences terminal and in the upper leaf axils, paniculi- form with few umbellate branches, the secondary peduncles 2.0-2.5 cm. long, minutely appressed-puberulent, bearing about 8-12 small pink and white flowers, the pedicels very slender, about 1.7 cm. long, minutely appressed-puberulent. Flowers densely appressed-puberulent without, rotate, the tube about 1 mm. long and broad at the orifice, pink, the lobes oblong-elliptic, spreading, white, about 4 mm. long and 1 mm. broad; stamens exserted, the filaments about 2 mm. long, the lower half concrescent to the base of the perianth lobes, the anthers about 1 mm. long; pistillode minutely fusiform, somewhat less than 1 mm. long, sparsely pilosulose, the disc flabelliform, eccentric, about half as long as the pistillode. Pistillate inflorescences and flowers, and fruit unknown.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 13475
