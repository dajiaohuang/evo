  claims:
    - subjectId: taxon:carnivora
      claimKind: scientific
      claimType: fossil-range
      statement: "The 56–0 Ma Carnivora route is a total-group evidence anthology: the Dormaal Carnivoraformes sample anchors the older bound and living crown carnivorans extend to the present; it is not a crown-Carnivora FAD or ancestor chain."
      confidence: medium
      confidenceRationale: Approximately 280 specimens, tarsal and dental anatomy and a morphology matrix support the stem carnivoraform sample. Explicit total-group wording prevents that sample from being promoted to crown Carnivora.
      referenceLinks:
        - referenceId: sole-2014-dormaalocyon
          relation: supports
          pages: 1–21
          figure: Figures 3 and 8–10; Appendices 1–3
          quoteLocator: Dormaal sample; dental and tarsal descriptions; phylogenetic analysis
  claim-rationales.zh:
    - 约 280 件标本、跗骨与牙齿解剖及形态矩阵支持该食肉形类干群样本；明确的总群措辞防止把它提升为食肉目冠群。
  claim-statements.zh:
    - 56–0 Ma 的食肉类路线是总群证据选集：Dormaal 的 Carnivoraformes 样本锚定较老端点，现生食肉目冠群延续至今；它不是食肉目冠群首现或祖先链。
  ranges:
    - entityId: carnivora
      rangeKind: global-composite
      taxonomicConcept: Carnivora total-group evidence anthology and living crown continuation
      geographicScope: Dormaal locality, Belgium; living global continuation
      olderMa: 56
      youngerMa: 0
      status: available
      uncertainty:
        olderMa: null
        youngerMa: null
        note: 56 Ma is the rounded Dormaal Carnivoraformes sample context; stem carnivoraforms do not establish a crown-Carnivora FAD or direct ancestry.
      evidenceBasis: Dental and tarsal anatomy from the Dormaal sample anchors a total-group browsing route, while living crown carnivorans extend to the present.
      confidence: medium
      claimIds:
        - claim:taxon:carnivora:root-range
      referenceLocators:
        - referenceId: sole-2014-dormaalocyon
          locator: pp. 1–21; Figures 3 and 8–10; Appendices 1–3
      evidenceLevel: literature-synthesized
