    facets:
      morphology:
        status: not-assessed
        gaps:
          - No morphology or diagnostic evidence was assessed in this batch.
      lifeHistory:
        status: partially-supported
        claims:
          - text: Longitudinal observations of wild young indris documented age-related behavioral development across four sampled age classes (0–3, 4–7, 10–15 and 16–20 months). Maternal carrying was frequent in the youngest class and declined as locomotion increased; social play and grooming with non-maternal group members were first recorded at 128 days. Singing was observed only in the 16–20 month class in this sample.
            sourceIds:
              - brunod2025
            locator: Methods 2.1.1 and 2.1.2; Results 3.1 and Table 2; Discussion 4.1 and 4.2; Conclusions
            placeTimeScope: Eight wild young individuals from eight habituated family groups at Maromizaha Forest, Moramanga district, Alaotra-Mangoro region, Madagascar (18°56′49″S, 48°27′33″E); observed 2022-05-12 through 2023-07-23 over 67 field days and 428.25 hours. Age classes sampled were 0–3, 4–7, 10–15 and 16–20 months; the 8–9 month class was absent. These observations do not estimate species-wide developmental variation.
            lifeStatus: Free-ranging wild young indris and their mothers; no captive animals were included.
            originalLanguage: en
        gaps:
          - Evidence covers only eight young individuals at one field site and does not establish species-wide life-history variation, adult reproduction, lifespan or population differences.
      ecology:
        status: partially-supported
        claims:
          - text: In the observed young indris, leaves were the most consumed food in all four sampled age classes. Fruit consumption was 15.14% of feeding time in the 0–3 month class and 27.09% in the 4–7 month class. The authors recorded consumption across 18 plant families overall and found that the proportion of mother-offspring co-feeding declined with offspring age. These are sample-specific feeding observations, not a complete species diet or population-level estimate.
            sourceIds:
              - brunod2025
            locator: Methods 2.1.1 and 2.1.2; Results 3.2 Feeding Behavior and 3.3 Co-Feeding; Discussion 4.5; Conclusions
            placeTimeScope: Eight wild young individuals from eight habituated family groups at Maromizaha Forest, Moramanga district, Alaotra-Mangoro region, Madagascar (18°56′49″S, 48°27′33″E); observations from 2022-05-12 to 2023-07-23, 67 field days and 428.25 hours. Feeding analyses used four sampled age classes and 948 class-level feeding sessions; 495 feeding sessions assessed mother-offspring co-feeding. A single protected forest site and these sampled groups cannot establish the species-wide diet, full range, seasonal ecology or population-level frequencies.
            lifeStatus: Free-ranging wild young indris and their mothers in habituated groups; no captive animals were included.
            originalLanguage: en
        gaps:
          - Evidence is limited to young individuals in one protected forest and a finite observation period; adult diets, species-wide ecological relationships, range-wide population patterns and other sites were not assessed.
      evolution:
        status: not-assessed
        gaps:
          - No phylogenetic or evolutionary evidence was assessed.
      distribution:
        status: not-assessed
        gaps:
          - The Maromizaha study locality is not a species-wide range assessment or distribution history.
      fossil:
        status: not-assessed
        gaps:
          - No fossil evidence or geological age was assessed.
      conservation:
        status: not-assessed
        gaps:
          - No conservation assessment, threat analysis or population trend was independently assessed in this batch.
