          publishedAt: undated
          originalSourceText: rounded or obtuse at the base, the costa slender, prominulous above and beneath, drying red, the lateral veins 6-8, arcuate, forming an undulate, submarginal vein well in from the margin, the intervenal areas smooth, the smaller veins not visible, rigidly papyraceous to thin coriaceous, drying deep red brown above, lighter beneath, glabrous above and beneath but moderately villose on the costa below; petioles stiff, terete, to 0.5 cm long, glabrate; stipules persistent only at the tips of the twiglets, triangular, to 3.5 mm long. Inflorescences axillary, the peduncle slender, 1.2-4.5 cm long, ca. 0. 15 mm wide, often curved, pubescent, terminated by 2 flowers or by 2 short, spreading branches, to 8 mm long, each branch with 2-5 flowers; bracts and bracteoles not seen. Flowers (in young bud) sessile, the hypanthium scarcely measurable, the calyx urn shaped, ca. 1 mm long, carnose, appressed pilose outside, the margin subtruncate with 4 compressed-rotund lobes, the latter scarcely measurable; corolla tube cream colored or pink and streaked, carnose, pubescent outside, the lobes valvate; ovules pendent, one in each of the 2 cells, the style cylindrical. Fruits presumably rotund when fresh, fleshy, red, when dried oblong, to 3.2 cm long, to 2.5 cm wide, the seeds 2, oblong, to 2 cm long, wider at the apex than at the base, truncate toward the apex, conspicuously rostrate, the beak triangular, to 0.4 cm long, obviously attenuate toward the base, drying purple black, smooth, glabrous, vaguely sulcate.
