  claims:
    - subjectId: taxon:blastoidea
      claimKind: scientific
      claimType: fossil-range
      statement: The supported blastoid record used here extends from the Sandbian Macurdablastus uniplicatus to a Wuchiapingian last occurrence near 255 Ma; a Permian–Triassic boundary endpoint would be an extinction inference rather than the observed last appearance.
      confidence: medium
      confidenceRationale: Macurdablastus is directly documented and treated as a blastoid outside Eublastoidea, while the younger endpoint is a literature synthesis of the youngest reported record. Both endpoints remain sensitive to taxonomic revision and future sampling.
      referenceLinks:
        - relation: supports
          referenceId: bauer-2019-macurdablastus
          pages: 1003–1013
          figure: Figures 1E–F and 2
          quoteLocator: "Abstract; Macurdablastus as a key to understanding Eublastoidea; Systematic palaeontology: Class Blastoidea"
        - relation: supports
          referenceId: paul-2021-blastoid-hydrospires
          quoteLocator: "Introduction, first paragraph: late Sandbian Macurdablastus to Upper Permian Wuchiapingian range"
    - subjectId: taxon:blastoidea
      claimKind: scientific
      claimType: taxonomy
      statement: Macurdablastus uniplicatus is treated in the cited revision as a blastoid outside Eublastoidea, providing a source-bounded class record rather than a claim about every blastoid relationship.
      confidence: medium
      confidenceRationale: The revision directly redefines Eublastoidea around a named taxon, but broader blastoid relationships remain subject to taxonomic revision and sampling.
      referenceLinks:
        - referenceId: bauer-2019-macurdablastus
          relation: supports
          pages: 1003–1013
          figure: Figures 1E–F and 2
          quoteLocator: "Abstract and Systematic palaeontology: Class Blastoidea"
    - subjectId: taxon:blastoidea
      claimKind: scientific
      claimType: biogeography
      statement: The displayed blastoid evidence is restricted to named Sandbian and Wuchiapingian records in its source studies and does not establish a global distribution, origin centre or extinction geography.
      confidence: medium
      confidenceRationale: The references document record endpoints, not a geographically complete blastoid occurrence census.
      referenceLinks:
        - referenceId: bauer-2019-macurdablastus
          relation: supports
          pages: 1003–1013
          quoteLocator: Macurdablastus occurrence and systematic context
        - referenceId: paul-2021-blastoid-hydrospires
          relation: supports
          quoteLocator: Introduction, reported late Sandbian to Wuchiapingian range
    - subjectId: taxon:blastoidea
      claimKind: scientific
      claimType: ecology
      statement: The cited systematic and hydrospire studies do not establish a class-wide diet, habitat preference, locomotor performance, body-size distribution or guild for Blastoidea; these fields remain unresolved.
      confidence: high
      confidenceRationale: The evidence is limited to named fossil morphology and a functional discussion, not a whole-class ecology reconstruction.
      referenceLinks:
        - referenceId: bauer-2019-macurdablastus
          relation: supports
          pages: 1003–1013
          quoteLocator: Systematic palaeontology and stated study scope
        - referenceId: paul-2021-blastoid-hydrospires
          relation: supports
          quoteLocator: Functional-significance scope and range discussion
    - subjectId: taxon:blastoidea
      claimKind: scientific
      claimType: morphology
      statement: Macurdablastus is a named blastoid with source-described morphology, and hydrospire interpretation is retained as a source-bounded functional-morphology result rather than a class-wide invariant trait.
      confidence: medium
      confidenceRationale: The references directly support named anatomical and functional-morphology discussions, but their scope does not cover all blastoid variation.
      referenceLinks:
        - referenceId: bauer-2019-macurdablastus
          relation: supports
