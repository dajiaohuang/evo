            locator: "SANBI/WFO archive Morphology row 50974; source 9836.0; publication: Toelken, HR. 1985. Crassulaceae, Fl. S. Africa 14: 1 - 229. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: R.-Hamet used the name K. rotundifolia var. peltata before it was validated by R. Fernandes. Although K. neglecta is superficially similar to K. rotundifolia it can be distinguis by its cordate or peltate leaves and dense part-inflorescences.
