        claims:
          - text: Rosette usually developing only one erect, terete stem up to 1 m high. Leaves petiolate, glabrous; petiole 20-50(-80) mm long, not clasping; lamina ovate, 35-80(-130) x 30-60(-90) mm, deeply cordate or peltate, entire or slightly sinuate, flat to patelliform, green. Inflorescence a flat-topped thyrse with several dense dichasia. Calyx with lobes narrowly lanceolate-triangular, 2-3 mm long. Corolla yellow to orange; tube elongate-ampullaceous, 6-8 mm long; lobes lanceolate, 2.5-3.5 x 1.5-2.5 mm. Anthers 0.6-0.8 mm long. Squamae linear, 1.6-2.5 mm long, gradually tapering towards apex. Seeds c. 1 mm long.
            sourceIds:
