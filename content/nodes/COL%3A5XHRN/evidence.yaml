    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Robust tufted perennial or soft annual, 200-750 mm high; basal leaf sheaths loose, densely hairy especially on smaller plants and the annuals. This species tends to be annual on the dunes and perennial in the gravel flats between the dunes. Leaf blade to 110 x 8-10 mm. Inflorescence 30-120 mm long. Spikelet 7.5-10.0 mm long; glumes 10.0 mm long; 3(-4)-flowered; lower 2 florets bisexual; upper floret usually male; lemma central awn 3-5 mm long; anthers 2.0-3.2 mm long; caryopsis 3.4 mm long, narrowly obovate.
