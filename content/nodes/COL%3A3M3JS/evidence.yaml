        usage:
          title: Hiraea grandifolia Standl. & L.O.Williams, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Liana, the young stems densely ferruginous tomentose, the internodes to 5 cm long. Leaves opposite, obovate, rounded and cuspidate to short acuminate at the apex, rounded to subcordate at the base, 12-28 cm long, 6-17 cm wide, glabrous or nearly so on the upper surface except on the veins, densely hirsute- villous below; petioles 1.5-3 cm long; stipules subulate, borne near the apex of the petiole. Inflorescence axillary, umbelliform-fasciculate; peduncle usually to 6 cm long, 1-few-flowered; pedicels ca. 2 cm long, densely hirtellous, bracteate at the base. Flowers yellow; sepals densely hispid, blunt, to 3 mm long, 4 of them bearing 2 whitish disciform glands ca. 1.5 mm long; sexual parts of flower not studied. Infructescence with peduncles short or to 10 mm long, 1-several-flow- ered; pedicels 20-23 mm long, the peduncles and pedicels densely tomentose, the lateral wings depressed-ovate to suborbicular, hyaline, membranaceous, drying pale brown, radially veined, sparsely patulous, pubescent with T-shaped tri- chomes, the margin straight to minutely sinuate, 4.5-5.5 cm long, 2.5-3.2 cm high, the veins prominulous, anastomosing toward the margin of the wing, the dorsal wing much reduced, triangular, to 4.5 mm high, the seminiferous area densely hispid with stiff, straight, pointed trichomes.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 7142
          archiveSourceId: 8CFF7D6B-BA57-4C98-9210-F6A4F3734F1E
