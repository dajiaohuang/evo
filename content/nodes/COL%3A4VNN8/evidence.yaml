            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Perennial with annual aerial parts. This species is often confused with S. nutans from which it is distinguished by its soboles, its abbreviated rhizome, its basally congested leaves and by the presence of bulliform translucent cells subjacent to the adaxial epidermis in the intercostal regions.
            textZh: SANBI 条目提供了 Scleria catophylla C.B.Clarke 的鉴别特征。
