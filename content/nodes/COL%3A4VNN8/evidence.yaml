    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Perennial herb, up to 0.7 m high. Leaves crowded towards base of culm. Plant sometimes with 1 or several soft, fleshy soboles arising from culm cluster. Inflorescence unbranched, with 4-15 clusters of 1-7 reflexed spikelets. Achene smooth. Glumes densely hairy, hairs purplish black, black in colour.
            textZh: Scleria catophylla C.B.Clarke 的 SANBI 物种条目记录了形态特征。
