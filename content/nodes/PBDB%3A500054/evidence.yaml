  claims:
    - subjectId: taxon:xiushanosteus
      claimType: taxonomy
      claimKind: scientific
      statement: Xiushanosteus mirabilis is a placoderm-grade jawed stem gnathostome represented by articulated material; its character mosaic does not establish direct ancestry or resolve historical Placodermi as a natural clade.
      confidence: high
      confidenceRationale: "Xiushanosteus mirabilis: multiple articulated specimens and the published analysis directly support the named material and bounded character mosaic. Confidence is high only for those observations, not for direct ancestry or a universal placoderm topology."
      referenceLinks:
        - referenceId: zhu-2022-chongqing-gnathostomes
          relation: supports
          pages: 954–958, especially 955–957
          figure: Figures 1a, 2 and 4; Extended Data Figures 3–6
          quoteLocator: Systematic palaeontology and phylogenetic analysis
    - subjectId: taxon:xiushanosteus
      claimType: biogeography
      claimKind: scientific
      statement: Xiushanosteus is documented from the Huixingshao Formation in Xiushan County, Chongqing, South China; the evidence records that locality rather than a global distribution.
      confidence: high
      confidenceRationale: "Xiushanosteus mirabilis: the primary study identifies the Chongqing Lagerstätte, horizon and specimen series directly. High confidence remains limited to that documented locality and does not establish broader geographic extent."
      referenceLinks:
        - referenceId: zhu-2022-chongqing-gnathostomes
          relation: supports
          pages: 954–958, especially 955–957
          figure: Figures 1a and 2; Extended Data Fig. 3
          quoteLocator: Chongqing Lagerstätte locality, horizon and specimen descriptions
    - subjectId: taxon:xiushanosteus
      claimType: ecology
      claimKind: scientific
      statement: The articulated body supplies depositional and anatomical context, but diet, life habitat, trophic guild and measured swimming performance remain unresolved.
      confidence: medium
      confidenceRationale: "Xiushanosteus mirabilis: the source documents material and assemblage context while not directly observing behaviour or niche. Medium confidence applies to this explicit evidential boundary, not to an ecological reconstruction."
      referenceLinks:
        - referenceId: zhu-2022-chongqing-gnathostomes
          relation: supports
          pages: 954–958
          figure: Figures 1–2
          quoteLocator: Anatomical description and Lagerstätte context
    - subjectId: taxon:xiushanosteus
      claimType: morphology
      claimKind: scientific
      statement: Holotype IVPP V300001 and referred IVPP V300002–V300021 preserve approximately 30 mm articulated bodies with cranial armour and a mosaic skull-roof character combination.
      confidence: high
      confidenceRationale: "Xiushanosteus mirabilis: multiple named articulated specimens and detailed figures directly support the recorded body and cranial observations. High confidence does not extend to unpreserved anatomy or direct ancestry."
      referenceLinks:
        - referenceId: zhu-2022-chongqing-gnathostomes
          relation: supports
          pages: 954–958, especially 955–957
          figure: Figures 1a and 2; Extended Data Figures 3–6
          quoteLocator: Systematic palaeontology and anatomical description
    - subjectId: taxon:xiushanosteus
      claimType: fossil-range
      claimKind: scientific
      statement: The displayed 438.6–432.9 Ma interval is the Telychian time-scale envelope for the Huixingshao Formation Xiushanosteus sample and is not a global genus range, FAD, LAD or gnathostome origin.
      confidence: high
      confidenceRationale: "Xiushanosteus mirabilis: multiple named specimens and the concrete source horizon directly support this sample-bound window. High confidence remains limited to the documented sample and stage conversion, not to a global appearance boundary."
      referenceLinks:
        - referenceId: zhu-2022-chongqing-gnathostomes
          relation: supports
          pages: 954–958, especially 955–957
          figure: Figures 1a, 2 and 4; Extended Data Fig. 3
          quoteLocator: Telychian Chongqing Lagerstätte horizon and systematic palaeontology
  claim-rationales.zh:
    - Xiushanosteus mirabilis：多件关节相连标本和已发表分析直接支持具名材料及有限的性状镶嵌。高置信度仅适用于这些观察，不外推为直系祖先或普遍的盾皮鱼拓扑。
    - Xiushanosteus mirabilis：一手研究直接确定重庆拉格施泰特、层位和标本系列。高置信度仅适用于该记录地点，不确定更广地理范围。
    - Xiushanosteus mirabilis：来源记录材料与动物群背景，却未直接观察行为或生态位。中等置信度仅针对这一明确的证据边界，而不是生态重建。
    - Xiushanosteus mirabilis：多件具名关节相连标本与详细图件直接支持躯体和颅部观察。高置信度不外推到未保存的解剖或直系祖先关系。
    - Xiushanosteus mirabilis：多件具名标本及明确层位支持该样本限定窗口。高置信度仅适用于文献记录样本和阶级换算，不是全球出现边界。
  claim-statements.zh:
    - Xiushanosteus mirabilis 是由关节相连材料代表的盾皮鱼等级有颌类干群；其镶嵌性状不能确立直接祖先关系，也不能把历史上的盾皮鱼类解析为自然类群。
    - Xiushanosteus 记录于华南重庆秀山县的回星哨组；该证据记录这一地点，而不是全球分布。
    - 关节相连躯体提供沉积与解剖背景，但食性、生活栖息地、营养功能群和实测游泳性能仍未解决。
    - 正模 IVPP V300001 与归入标本 IVPP V300002–V300021 保存约 30 毫米长的关节相连躯体、头甲及镶嵌式颅顶性状组合。
    - 显示的 438.6–432.9 Ma 区间是回星哨组 Xiushanosteus 样本的特列奇期时间标尺包络，不是该属的全球延限、首现、末现或有颌类起源时间。
