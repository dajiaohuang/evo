  claims:
    - subjectId: event:indohyus-aquatic-raoellid-evidence
      claimKind: scientific
      claimType: ecology
      statement: Indohyus skulls RR 207 and RR 208, separate dense limb bones and a tooth-isotope sample support aquatic wading and a raoellid sister placement to Cetacea in the cited analysis, but not crown-cetacean membership or direct ancestry.
      confidence: medium
      confidenceRationale: Multiple anatomical, histological and isotope observations converge, but they come from a disarticulated bone-bed assemblage and the behavioural and topological conclusions remain interpretations of that sampled material and matrix.
      referenceLinks:
        - referenceId: thewissen-2007-indohyus
          relation: supports
          pages: 1190–1194
          figure: Figures 1–5; Supplementary Information
          quoteLocator: Osteology; Isotopes; Phylogenetic analysis
  claim-rationales.zh:
    - 多项解剖、组织学和同位素观察彼此收敛，但材料来自解体的骨床组合，行为与拓扑结论仍是对取样材料和矩阵的解释。
  claim-statements.zh:
    - 印多霍斯兽头骨 RR 207 与 RR 208、分离的致密肢骨及牙齿同位素样本支持水中涉行，并在所引分析中支持劳氏兽科为鲸类姊妹群，但不支持其属于鲸类冠群或为直系祖先。
