    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants pendent, usually in clumps up to 800 mm in diameter. Leaves 4- or 5-ranked in young plants, later rosulate, rosettes up to ±450 x 450 mm, strongly recurved, narrowly lanceolate-acuminate, 200-400 x 40-55 mm, slightly channelled, green to reddish, striate when green. Inflorescence usually a 2-4-branched, dense, capitate to conical raceme, 250-300 mm long; peduncle reflexed, with few sterile bracts; bracts 6-10 x 2-3 mm, 1-nerved. Flowers red to yellow, 23-25 mm long; all segments free; pedicels 20-30 mm long. Anthers not or slightly exserted. Ovary 5-7 x 2-3 mm, green; style not or slightly exserted. Fruit not seen. Flowering time sporadically throughout the year, but mostly August to November.
