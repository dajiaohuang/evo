    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Perennial, densely tufted, up to 4 m high. Leaf blades 800-1800 mm long, 8-10 mm wide, leaves robust, mainly basal, glaucous, up to two-thirds culm height; blades with cutting margins and midrib, usually markedly V-shaped in cross section, tips setaceous. Panicle 400-600(-700) mm long; spikelets either female or hermaphroditic (but then functionally male); female-fertile spikelets with (5-)6(-7) florets per spikelet, hermaphroditic spikelets with (l-)3(-4) florets; glumes of equal length, 8-15 mm long; glume veins, rhachises and rhachilla colourless; lemmas of female-fertile florets 10-14 mm long, those of hermaphroditic florets 12-15 mm long.
            textZh: Cortaderia selloana (Schult. & Schult.f.) Asch. & Graebn. 的 SANBI 物种条目记录了形态特征。
