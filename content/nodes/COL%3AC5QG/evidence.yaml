            zh: 研究使用 IUCN 分布图比较巴西亚马逊十个主要间河区的灵长类组合；补充表 S1 列出范围图与各间河区的相交矩阵。支持区域范围图叠置摘要，不是现场出现点记录、丰度估计或完整分布评估。
            en: The study compares primate assemblages across ten major Brazilian Amazon interfluves using IUCN range maps; Supplementary Table S1 gives the range-map overlap matrix for each interfluve. It supports regional map-overlay summaries, not field occurrence points, abundance estimates or complete range assessments.
