      statement: The 2019 taxon-rich phylogenomic matrices repeatedly recover Pancrustacea and support Remipedia as the sampled sister to Hexapoda in Labiocarida, while the positions of Copepoda, Cephalocarida and other deep branches vary across analytical treatments.
