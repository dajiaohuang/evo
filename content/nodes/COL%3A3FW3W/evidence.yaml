    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Acaulescent perennial herb. Leaves entire, or obscurely and remotely denticulate, blade decurrent on petiole, lower surface woolly to woolly-tomentose when immature. Scapes not widened below head. Rays biseriate, prominent. Flowers with red or orange rays, disc pinkish, reddish or black.
            sourceIds:
              - sanbi_11118_0
            locator: "SANBI/WFO archive Morphology row 2073; source 11118.0; publication: Herman, PPJ; Retief, E. 1997. Plants of the northern provinces of South Africa: Keys and diagnostic characters. Strelitzia 6: 1 - 681. National Botanical Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: "The species is recognized by the large flowerheads with the crowded, usually deep blood-red, long ray florets and the commonly black disc. Furthermore the entire leaves and the short, winged petiole separate it from G. jamesonii. It is less easily distinguished from the taxon described by S. Moore as G. speciosa. This taxon has rather large heads, sometimes as large as in G. aurantiaca, and the tomentum of the upper leaf surface (as well as rarely also the lower one) typically resembles that of G. aurantiaca; besides, the pappus is often more or less violet-purple. However, the ray florets are smaller and more narrow than in G. aurantiaca, and they are not typically blood-red. Furthermore G. speciosa is restricted to Transvaal, and it is best explained as one of several forms of G. viridifolia (see under that species). According to Hilliard G. aurantiaca hybridizes with G. kraussii Schultz-Bip. (i.e. G. ambigua (Cass.) Schultz-Bip. according to the present work). The hybrid shows every gradation in leaf shape and indumentum between the two parents and has larger heads than either of them. The rays are very variable in colour: Pink, yellow, orange, red, white tinged pink or creamy white; the disc also varies in colour and often seems to be whitish, while the pappus varies from violet-prurple over whitish to more or less whitish-tawny. Two varieties of G. aurantiaca established by Dümmer, var. wyliei (type specimen: Medley-Wood 10150 (K, lectotype, NH, isolectotype)) and var. alba (type specimen: Medley-Wood 10151 (K, lectotype, BOL, L, NH, isolectotypes)), are considered by Hilliard as representatives of this hybrid. It is not always easy to separate the hybrid form from the true G. aurantiaca on the herbarium sheets. The hybrid shows much affinity to that species, having prominent rays and large heads, the heads generally being slightly larger than in the true G. aurantiaca, but by no means always. The lower leaf surface varies from woolly or cobwebby to dense, persistently whitish to lemon tomentose (as in G. ambigua). The rays may reach 40 mm in length, the achenes 10 mm on the few specimens studied."
