        usage:
          title: Trixis inula Crantz, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Perennial herbs 0.5-3 m tall, erect, much branched with glandular trichomes on the vegetative parts. Leaves petiolate; blades 24-70(-165) mm long, 5-22 mm wide, linear-lanceolate to elliptical, acute, attenuate or slightly truncate at the base, glabrate above with scattered glands and hairs, beneath strigose to pilose, rarely villous and sparsely glandular; petioles 1-7 mm long. Inflorescences paniculate or corymbose; peduncles sparsely glandular, strigose to pilose or glabrous, rarely sericeous. Heads hermaphrodite; involucral bracts 7-9, 8-13(-15) mm long, linear or oblong, acute, convex, sparsely glandular, sparsely strigose to strigose, rarely glabrous; receptacle fimbrillate; florets 8-15 per head, the outer florets 5-9 mm long, the corolla yellow. Achenes (4-)5(-9) mm long, beaked, covered with double hairs that are usually not mucilage-releasing, and glandular trichomes, the beak about 1/4 the length; pappus, 7-11 mm long, of setose tawny bristles. Chromosome number 2n = 54
          originalLanguage: en
          sourceField: general
