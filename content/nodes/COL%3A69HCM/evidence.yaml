        usage:
          title: Centropogon cornutus (L.) Druce, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Suffrutescent herbs 1-3 m tall, often somewhat scandent; stems simple or branched, hollow, glabrous in the lower portions and short, spreading, stiff- pubescent above. Median cauline leaves with blades oblong to ovate-oblong, elliptic-oblong to elliptic, 10-15(-25) cm long, usually 2-3 times as long as wide, apically acute or acuminate, basally rounded to cuneate, marginally subentire to obscurely denticulate or shallowly crenate-denticulate with 3-8 sharp teeth per cm, glabrous above and glabrous to minutely scaberulous on the veins beneath; petiole 0.5-2 cm long. Flowers solitary in the axils of the upper leaves, 6-8 cm long; pedicels erect, sparsely to densely puberulent, (3.5-)4.5-7( -9.5) cm long, the bracteoles paired, ciliate, linear 4-10 (-15) mm long, borne at or near the pedicel base; hypanthium glabrous to bristly-pubescent; calyx lobes narrowly lanceolate to linear or linear-subulate, denticulate, often marginally short bristly- pubescent, 8.5-20 mm long, usually wide-spreading at maturity; corolla red or pink, the lobes often white or occasionally the corolla completely white, the tube 3.54.5 cm long, moderately to strongly curved throughout its length, narrowest basally and gradually widening upward, glabrous, sparingly hirsute, pilose, or sparingly spreading short-pubescent along the principal veins externally, glabrous internally, the lobes spreading, falcate, deltoid, the 2 upper lobes 7-9 mm long, the 3 lower lobes slightly shorter, all lobes marginally bearing stiff whitish hairs 0.5-1.2 mm long; filament tube 46-60 mm long, white or white and distally pink, glabrous below, distally sparsely to moderately pilose with the trichomes 1.5-3(-5) mm long, basally distinct and united to the corolla tube, the anther tube 7.5-9.5 mm long, densely hirsute especially along the connectives and at the base and apex, the trichomes mostly 1.5-2.5 mm long, the terminal pubescence of the 2 shorter anthers fused into a triangular, hardened scale ca. 3 mm long. Berries scarcely inflated, a little broader than high, 10-17 mm in diameter; seeds flattened with rounded edges, more or less circular in outline, 0.6-1.8 mm in diameter, shallowly foveate-reticulate.
