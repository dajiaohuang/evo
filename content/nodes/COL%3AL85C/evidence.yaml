          title: Begonia plebeja Liebm., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Herbaceous, fuscous-villous when young. Rhizome usually repent, to 8 cm. long at least, 8-10 mm. thick, internodes very short. Leaves oblique, broadly ovate or elliptic, acute, palmately 7-8-nerved, denticulate, angulate-dentate or almost evenly rounded, cordate, 7-20 cm. long, thin, soon glabrous, petioles erect, 6-28 cm. long, usually soon glabrous, stipules persistent, imbricate, lanceolate, acuminate- setiferous, 1-2 cm. long, entire, heavily and closely reticulate-nerved. Peduncles exceeding the leaves, up to 22 cm. long. Cymes bisexual, strongly unilateral and usually much longer than wide, few- to many-flowered. Bracts deciduous, obovate, ciliate. Staminate tepals 2, broadly ovate, 5-9 mm. long, white or pale pink. Stamens about 15, filaments short, anthers oblong. Pistillate flowers bracteolate. Pistillate tepals 2, like the staminate. Ovary 3-celled, placentae bifid, ovuliferous on all sides, styles short-connate, stigmas lunate-capitate. Capsule suberect, oblong- ellipsoid, 12 mm. long, wings unequal, the largest subtriangular and as high as wide.
          originalLanguage: en
          sourceField: general
