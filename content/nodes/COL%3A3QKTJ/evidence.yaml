          - text: "The character that holds together the specimens that are grouped under the name J. tysonii is the shape of the leaves (oblanceolate in outline) and their lobing: lobes cut more than 2/3 of the way to the midrib, more or less oblong, obtuse, usually entire, occasionally the larger ones with one or two teeth. These leaf-characters distinguish J. tysonii from the closely allied J.filicaulis which has leaves more or less ovate in outline, divided from 1/3 of the way to right to the midrib, the lobes more or less spathulate or cuneate in outline, at least the largest lobes toothed and with every gradation to bipinnatisect leaves. Specimens of J. tysonii tend to dry black, but this is not constant; specimens of J. filicaulis never blacken. Also, the inflorescence of J. filicaulis is leafy; that of J. tysonii may run up into nearly nude racemes, but the heavy browsing to which the plants are subjected often disguises or disturbs this feature."
