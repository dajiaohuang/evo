    facets:
      morphology:
        status: partially-supported
        claims:
          - text: "Dwarf shrublet, stems up to c. 10 mm in diam., up to c. 300 mm long but often heavily browsed, possibly always ± erect unless affected by browsing, glandular-pubescent, hairs up to 0.1-0.3 mm long, leafy. Leaves opposite becoming alternate towards tips of branchlets, pseudofasciculate, largest primary leaves c. 5-20 x 2-8 mm, oblanceolate in outline tapering into apetiolar part up to c. 1/3 total leaf-length, margins (except in some smaller leaves) with 1-4 pairs of teeth or lobes cut c. 1/3 to 2/3 of way to midrib, rarely more deeply, lobes often ± oblong, occasionally cuneate, obtuse, mostly entire, occasionally the largest lobes with 1 or 2 teeth, both surfaces glandular-pubescent, hairs up to 0.1-0.3 mm long, glistening glands as well particularly on lower surface. Flowers solitary in the axils of the leaves, sometimes running up into nearly nude racemes. Pedicels up to 5-16 mm long. Calyx tube 0.1-0.2 mm long, lobes 2-4 x 0.5-1 mm, ± oblong, glandular-pubescent, hairs up to 0.2-0.3 mm long, glistening glands as well. Corolla tube 8-14.5 x 1.5-2 mm in throat, cylindric, abruptly expanded near apex, limb oblique, 10-15 mm across lateral lobes, posticous lobes 5-8 x 1.5-3 mm, anticous lobe 4.5-8 x 1.8-3.8 mm, all lobes cuneate-oblong, ± truncate or retuse, glandular-pubescent outside, hairs up to 0.25-0.3 mm long, glistening glands as well mainly on backs of lobes, transverse band of clavate hairs in throat extending very briefly onto base of lower lip, lobes white or cream, throat yellow, sometimes a dark violet median streak at base of each lobe. Stamens: posticous fdaments 1-1.2 mm long, anthers 0.7-1.1 mm, anticous filaments 0.3-0.6 mm long, anthers 0.4-0.8 mm, all filaments minutely puberulous. Stigma c. 0.2 mm long. Style 5.5-12 mm. Ovary 1.4-1.8 x 0.8-1 mm. Capsules 3.5-5 x 2-2.5 mm, minutely glandular-puberulous, a few glistening glands on sutures. Seeds c. 0.6 x 0.3 mm (few seen). Flowers can possibly be found in any month."
            sourceIds:
