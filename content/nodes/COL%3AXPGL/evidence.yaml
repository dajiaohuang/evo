          originalSourceText: Woody lianas, sometimes erect or suberect. Leaflets usually 3, rarely 5, elliptic to oval, broadly obtuse at the base, 6-20 cm. long, 2-10 cm. broad on flowering or fruiting branches, sometimes larger on vegetative stems, ferruginous-tomentulose to glabrate. Inflorescence idensely and persistently ferruginous-tomentulose, spicate- paniculate, the small yellowish flowers sessile or subsessile. Sepals ovate, about 1.5 mm. long; petals about 2.5 mm. long. Follicles obliquely compressed-obovoid, about 1.5 cm. long and 1 cm. broad, with a stipe about 3-4 mm. long.
