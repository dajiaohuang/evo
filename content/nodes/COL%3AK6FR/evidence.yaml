    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, 15-40 cm, main spike axis sterile. Leaves linear-lanceolate, glabrous. Flowers on lateral branches, highly zygomorphic, upper tepal tubular below, limbs of upper and lower lateral tepals spreading, inner bracts divided to base, ovary smooth.
            textZh: Babiana ringens (L.) Ker Gawl. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 6748; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: The unusual flower of Babiana ringens, one of the most distinctive species in the genus, is adapted for sunbird pollination. Its specialisations include the red colour, stiff stamens and style, and elongate perianth tube with a wide throat. Apart from the flower itself, the most striking adaptation of Babiana ringens is the sterile main stem, which acts as a perch for visiting sunbirds. Closely related, but smaller-flowered B. avicularis, shares this feature but differs from B. ringens in the falcate leaves elliptic in section and in the smaller flowers with a perianth tube 16-21 mm long, with the narrow basal part 4 mm long and kinked at the apex and dorsal tepal 15-18 mm long vs. tube 22-45 mm long and dorsal tepal 18-50 mm long but mostly 20-45 mm in B. ringens. The two species are allied to B. hirsuta, which has similar red flowers with a channelled dorsal tepal enclosing the filaments and style, but a multi-branched stem, the main axis of which bears a typical spike of several flowers.
            textZh: SANBI 条目提供了 Babiana ringens (L.) Ker Gawl. 的鉴别特征。
