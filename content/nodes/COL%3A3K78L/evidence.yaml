        claims:
          - text: Gnarled, cushion-forming, closely leafy shrublet to 5 cm. Leaves small, imbricate, ascending, elliptic, grey-felted. Flower heads discoid, solitary, sessile at branch tips, campanulate, whitish, ± 5 x 4 mm, bracts spreading above, florets ± 25, ovary papillate-hairy.
