          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Herbs, prostrate or to 25 cm tall, the stems golden green, pilose, the nodes well spaced. Leaves ovate lanceolate to oblong, often somewhat falcate, 2.0-7.5 cm long, 1-3 cm wide, deltoid, obtuse to occasionally rounded at the apex, basally cuneate or obtuse, occasionally truncate, acute or obtuse, usually slightly in- equilateral, the costa plane or grooved above, plane to prominulous beneath, the lateral veins 8-12, arcuate, chartaceous, densely pilose beneath and above, vel- vety to the touch, often drying olive green, the veins often bearded beneath; petioles 0.3-1.3(-3.5) cm long; stipules mostly persistent, ovate triangular, 5-6 mm long, the awn longer than the body, densely hairy. Inflorescences subsessile or on peduncles 2-3(-5) cm long, 0.1-0.3 cm wide, densely pilose. Flowers sessile, numerous; hypanthium subrotund, ca. 2 mm long, densely hairy, the calycine lobes 4, erect, ovate or oblong, 3(-6) mm long; corolla white, rarely purple, the tube 4-5 mm long, petaloid, pilose outside, glabrous within, the lobes 4, oblong or triangular, ca. 2 mm long; stamens 4, the anthers sessile, attached near the middle of the tube, ovate, ca. 1 mm long; style ca. 2 mm long, the stigmas slender, about the same length as the style. Fruits bright blue, ovoid, to 7 mm in diam., pilose.
          originalLanguage: en
          sourceField: general
