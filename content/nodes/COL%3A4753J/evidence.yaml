    facets:
      morphology:
        status: partially-supported
        claims:
          - text: This plant varies considerably in size with a scape that can be up to 80 cm in length. The pubescent pedicels can be very variable in length from 3-5 to 11 cm and can number from 10 to 20. The segments are 2-5 to 3 cm long by 3 to 5 mm wide. As with N. angustifolia the terminal portion of the segments is undulate and recurved. Minute pubescence has been recorded at the base of the segments and extends along the keel for a short distance. The colour varies a good deal from pale to deep rose with a conspicuous darker mid vein. The leaves are linear, deeply channelled and from 2.5 to 5 mm wide. The stamens are a little shorter than the segments. Shows the staminal appendix.
