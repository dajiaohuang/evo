      ecology:
        status: partially-supported
        claims:
          - text: In the summer rainfall area. Generally found growing in black, fibrous, acid soils on the damp banks of streams and rivers. Frequently growing in dense grasses and other growth which would protect the bulbs, which are well buried from the direct rays of the sun. The leaves die down completely after flowering and are dormant until the start of the next rainy season.
