          title: Kallstroemia maxima (L.) Hook. & Arn., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Annual herb; stems prostrate to decumbent, to 1 m long, sericeous and spar- ingly hirsute with apically-directed white trichomes. Leaves obovate, 1-5.5 cm long, 1-3.5 cm wide; leaflets 3-4 pairs, broadly oblong to elliptical, appressed- hirsute to glabrate, margins and veins sericeous, 5-18 mm long, 3-11 mm wide, terminal pair usually largest. Flowers ca 1 cm in diam; peduncles to 28 mm long; sepals ovate, 4-5 mm long, 2 mm wide, as long as or little shorter than petals, hirsute with appressed to spreading trichomes, in flower ca as long as style, in fruit clasping but not entirely covering mature mericarps and shorter than beak, only scarious margins becoming involute, persistent; petals yellow, fading orange, obovate, 4-6 mm long, to 6 mm wide, marcescent; -ovary ovoid, ca 1 mm in diam, usually glabrous but occasionally strigose basally, the style 2 mm long, cylindrical, base slightly conical, the stigma capitate, ca 1 mm long, obscurely 1 0-lobed, papillose. Fruit ovoid, 4-5 mm in diam, usually glabrous but occasionally strigose basally, the beak 3-6 mm long, glabrous, cylindrical, the base widely conical; mericarps 4 mm high, 1.5 mm wide, abaxially tubercled, cross-ridged, and slightly keeled, sides pitted, adaxial edge angled.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 14025
