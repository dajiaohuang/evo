        usage:
          title: Portulaca oleracea L., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Plants herbaceous, radially spreading and prostrate or somewhat ascending, glabrous throughout, the roots fibrous. Leaves alternate, elliptic to obovoid, 1-3 cm. long, 0.5-1.0 cm. broad, generally obtuse at the apex, cuneate at the base, plane; petiole 1-8 mm. long, the stipules fimbriate, inconspicuous. Inflorescence with the flowers crowded, the flowers sessile or essentially so, yellow. Perianth tube crateriform, 1 mm. long, 1.5 mm. in diameter; sepals ovate, 3.0-4.5 mm. long, 3-4 mm. -broad, strongly keeled, connate at the base, generally persistent and enclosing the operculum of the fruit; petals 4, 3.0-4.5 mm. long, 1.5-3.0 mm. broad; stamens 6-15, the filaments 1.5-1.75 mm. long, the anthers globose, to 0.5 mm. long and broad; ovary half-inferior, short-conical, the style lobes 4-6. Capsule ovoid to fusiform, 6-9 mm. long, about 2.5 mm. in diameter, circumscissile slightly below the middle; seeds almost cochleate, about 0.5-0.75 mm. in diameter, the testa minutely tuberculate, almost black.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 10970
