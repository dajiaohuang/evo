        usage:
          title: Centropogon luteynii Wilbur, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: 0.1 mm long. Principal leaves with blades ovate to lance-ovate, mostly (2-)4-8 (-9.5) cm long, 2-5 cm wide, ca. 2-2.5 times as long as wide, apically acute to acuminate, basally cordate, marginally conspicuously dentate with usually 6-9 (-13) dark purple-tipped teeth per cm, the teeth 0.5-0.7 mm long, glabrous or nearly so on the upper surface, the puberulence, when present, restricted to the principal veins, the pubescence of the lower surface persisting and copious but inconspicuous and restricted to the elevated veins, the trichomes minute, curved, mostly less than 0.1 mm long; petioles puberulous, (0.5-)1-2 cm long. Flowers solitary in the axils of the upper leaves, 3.5-4.0 cm long; pedicels slender, flexuous, ascending to widely spreading, ebracteolate, sparingly to moderately but incon- spicuously puberulous, (2-) 3-5(-6) cm long; hypanthium in anthesis cylindric- campanulate, basally rounded, 3-5 mm long, 2-3 mm in diameter, moderately to densely but inconspicuously puberulent, the appressed incurved trichomes ca. 0.1 mm long; calyx lobes erect or with the tip slightly spreading or recurving, narrowly triangular, entire, 3-6 mm long, glabrous or sparingly puberulent; corolla bright red or crimson externally, paler within, drying dark purplish, externally inconspicuously puberulous with hyaline or reddish trichomes less than 0.1 mm long, glabrous internally, the tube 2.3-2.7 mm long, slightly curved, basally con- stricted to 1.5-2.5 mm in diameter, gradually enlarging in the upper two-thirds to ca. 4-6 mm in diameter, the lobes all narrowly linear and erect to somewhat spreading, the upper pair erect, 7-10 mm long, the lateral pair 6-9 mm long and cut more deeply on the ventral than on the dorsal margin, the lowermost lobe 5-8 mm long; filament tube glabrous, reddish, 27-30 mm long, slightly exserted, the anthers 4-5 mm long, the 2 lowest anthers bearing an apical tuft of stiff, white bristles 0.8-1.0 mm long, otherwise glabrous. Berries globose to oblong, 8-14 mm long, 8-12 mm in diameter; seeds lenticular, orbicular, minutely foveate-reticulate, ca. 0.5 mm long, dark brownish.
