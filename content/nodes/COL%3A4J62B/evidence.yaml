          originalSourceText: Shrub (?), nodose; flowering internodes slender and short, somewhat ridged and striate-pilose, especially below the petioles; leaves obliquely elliptic or elliptic- obovate, apex abruptly subcaudately long-acuminate, tip about 2.5 cm. long, base narrowed downward, obtuse or subcordulate, one side about 3 mm. shorter, 6-8 cm. wide X 13-16 cm. long, pinnately nerved below the upper third, the nerves 5 or 6 on each side, with cross-connecting-anastomosing nervules, submarginally loop- connected upward and, excepting the innermost pair, not continuing to the apex, glabrous above, the nerves beneath appressed-puberulent, both sides glandular- dotted, drying somewhat glossy, thin, translucent; petiole about 5 plus 3 mm. long, hairy-lined beneath, vaginate near the base; spikes as yet very young, 1 mm. thick X 1 cm. long; peduncle sparsely hairy; bracts rounded-subpeltate, marginally ciliate; ovary and fruit not developed.
