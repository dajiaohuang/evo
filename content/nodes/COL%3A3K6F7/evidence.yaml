    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Rhizomatous perennial herb with one to several leaf rosettes at the crown, flowering stems usually solitary, ±120(-250) mm tall, loosely greyish-white woolly, leafy. Radical leaves prostrate, up to ±70 x 30 mm, elliptic to obovate, loosely white- or greyish-woolly above at first, later shortly pubescent, white-felted below, the older leaves in particular commonly discolorous, drying greyish or blackish above, whitish below; cauline leaves up to ±15 x 5 mm, becoming smaller upwards, distant, narrowly elliptic, greyish-white woolly. Heads homogamous, campanulate, ±15 mm long, 30 mm across the fully radiating bracts, solitary. Involucral bracts in ±15 series, graded, loosely imbricate, much exceeding the flowers, acute, outer palest golden-brown, sometimes pinkish or crimson, inner opaque white, pinkish at the base inside. Receptacle nearly smooth. Flowers 217-277. Achenes 1 mm, ellipsoid, with duplex hairs. Pappus bristles many, tips subplumose, bases with patent cilia, sometimes cohering.
