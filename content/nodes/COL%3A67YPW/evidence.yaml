    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Acaulescent, geophyte mostly to 8 cm including leaves. Leaves narrowly sword-shaped, long-hairy on sheaths, short-hairy on blade. Flowers zygomorphic, in a congested spike at ground level, violet with white markings on lower tepals, tube 20-35 mm long, inner bracts forked apically, ovary smooth.
            textZh: Babiana karooica Goldblatt & J.C.Manning 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 6731; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: An early flowering species, Babiana karooica is recognised in sect. Teretifolieae by the acaulescent habit, blue to violet flowers with perianth tube 20-35 mm long and puberulous in the throat, and violet anthers. The style divides beyond the anther tips. The species is easily confused with larger-flowered B. sambucina, which blooms later, mostly in August and September, but that species has a straight perianth tube 35-65 mm long and at least 1.5× as long as the dorsal tepal in length, and the tepals are broader, mostly 30-35 x 5-12 mm. In addition, the perianth tube is smooth inside, the anthers are cream-coloured to pale yellow, and the style typically divides opposite the base to middle of the anthers. Babiana karooica also lacks the distinctive leafy outer bract of the lowermost flower of the spike characteristic of B. sambucina. Babiana karooica may also be confused with B. bainesii but this species always has the spike underground, the flowers thus arising below ground level. A widespread species of the southern African summer-rainfall zone, B. bainesii typically flowers in late summer, mainly February to April, but later, in July and August in colder parts of the high mountains of the Great Karoo. Babiana karooica has broader and shorter leaves than B. bainesii, usually sparsely hairy on the veins and margins, slightly smaller flowers, and green floral bracts tipped rust-brown.
            textZh: SANBI 条目提供了 Babiana karooica Goldblatt & J.C.Manning 的鉴别特征。
