          title: Solanum phaseoloides Pol., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Procumbent, apparently succulent herb to 10 m long, glabrate. Leaves tri- foliolate, the leaflets with conspicuous (to 5 mm long) petiolules, suborbicular to rhomboid, apically obtuse, basally rounded, to 4 cm long, the lateral pair smaller and often oblique at the base; petioles slender and elongate, to 5 cm long, slightly clasping the stem. Inflorescence axillary or lateral, an open, few- flowered raceme, the peduncle to 6 cm long, very slender; pedicels ca. 2 cm long. Flowers with the calyx short-campanulate with 5 rotund lobes; corolla white, ca. 1 cm across, lobed nearly to the base; stamens equal, the filaments united basally, ca. 1 mm long and continuing in a relatively broad connective, the anthers stout, 1.5-2.5 mm long; ovary conical, the style clavate in the upper portion, the stigma globose. Fruit "flattened like a lance" (Jimenez 1222 (US), Costa Rica), the out- line obturbinate or rhombic, drying dark, very thin and flat on herbarium sheets, 2-3 cm long.
