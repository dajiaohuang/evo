          - text: Manulea plurirosulata has been much confused with both M. benthamiana (that is, M. corymbosa) and M. bellidifolia. It can at once be distinguished from the former by its glabrous corolla mouth and very different calyx. Its relationship lies with M. bellidifolia, which differs in habit (stems loosely tufted at the base in M. bellidifolia, not crowded, as in M. plurirosulata, which suggested the trivial name), greater stature (150-450 mm versus 20-180 mm), mostly longer leaves with shorter petiolar part (blade 25-90 x 7-30 mm, petiolar part less than 1/4 length of blade versus 12-35 x 5-13 mm, petiolar part roughly 1/2 as long as to nearly equalling blade) and coarser indumentum on stems and calyx, composed principally of balloon-tipped hairs to 0.25 mm long (not principally gland-tipped hairs to 0.1 mm with very occasional nearly sessile balloon-tipped hairs), and more scantily bearded throat (hairs in discrete bands, not one continuous band right round throat). Plants flowering in the seedling stage naturally do not show the crowded clump of leaf rosettes that are characteristic of M. plurirosulata.
