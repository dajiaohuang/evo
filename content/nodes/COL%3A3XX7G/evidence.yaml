    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Annual herb, stems 20-180 mm tall, solitary to many and then in discrete units crowded together into a small leafy rosette, usually simple, sometimes with a pair of branches low down, glandular-puberulous, plus very occasional tiny balloon-tipped hairs, usually nude, occasionally with a pair of leaves ± halfway. Leaves in 2-3 pairs at base of each stem, crowded, spreading, bases connate, blade 12-35 x 5-13 mm, oblanceolate to narrowly elliptic tapering to a petiolar part 6-30 mm long (roughly half as long as to nearly equalling blade), margins entire to serrate, both surfaces glandular-puberulous. Flowers many in simple terminal racemes, initially capitate, elongating a little in fruit, lowermost flowers sometimes distant. Bracts (lowermost) 2-4 x 0.6-1.2 mm, lanceolate, acute. Pedicels (lowermost) 2-4 mm long, shorter upwards. Calyx obscurely bilabiate, tube 0.4-0.8 mm long, anticous lobes 3-5 x 0.8-1 mm, anticous lip split 3-5 mm, posticous lobes 2.8-4.5 x 0.6-1 mm, posticous lip split 3-5 mm, all lobes lanceolate, glandular-puberulous all over outside and on margins, hairs to 0.1 mm, very occasional ± sessile balloon-tipped hairs as well, sometimes wanting. Corolla tube 6-9.5 x 1.2-2 mm in throat, cylindric, expanded in ± upper third or half, limb distinctly bilabiate, 7-12 mm across lateral lobes, posticous lobes 2.8-4.5 x 2-3.6 mm, anticous lobe 3-5.4 x 1.7-3 mm, all oblong to oblong-elliptic, margins often revolute, creamy-white, orange/yellow around mouth and in throat, tube puberulous with tiny glandular and eglandular hairs, ± sessile glistening glands on backs of lobes, inside well bearded with clavate hairs all round throat, darkish in posticous position, pale elsewhere. Stamens 4, anticous anthers 0.5-1 mm long, tips just visible in mouth, posticous anthers 1.4-1.8 mm long, included, posticous filaments bearded with dark hairs. Stigma 4-7.5 mm long, shortly exserted or just included. Style 0.5-1.3 mm long. Ovary 1.5 x 1 mm. Capsules 3.5-6 x 2.5-4 mm. Seeds c. 0.5 x 0.3 mm, pallid.
