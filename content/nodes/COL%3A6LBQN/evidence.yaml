        usage:
          title: Hamelia rovirosae Wernham, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrubs, the branchlets villous, the hairs septate. Leaves ternate, occasionally opposite, elliptic to ovate, 5-16 cm long, 2-7 cm wide, acuminate, attenuate at the base, the lateral veins 3-5, arcuate, glabrous to sparsely villose above, villous beneath; petioles 0.3-2.0 cm long; stipules linear, often widely so, 5-8 mm long. Inflorescences terminal, dichasial or often helicoid; peduncles to 3 cm long, vil- lous, the floral axes 1.5-3.5 cm long, each axis 3-8-flowered, the flowers secund, sessile or on pedicels 0.1-0.2 cm long. Flowers with the hypanthium to 4.5 mm long, villous, the calycine lobes oblong or triangular, 2.0-5.4 mm long, villous, glabrous within; corolla reddish orange to scarlet, the tube 1.8-2.2 cm long, 2-3 mm wide, villous, the lobes ovate, 1-2 mm long, acute, villous outside; anthers 10-12 mm long, the terminal appendage ovate, ca. 0.5 mm long, the filaments 7- 9 mm long; ovary 5-celled. Fruits cylindrical, to 1.2 cm long, 0.5-0.8 cm wide, red, finally black; seeds ca. 1 mm long.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 11710
