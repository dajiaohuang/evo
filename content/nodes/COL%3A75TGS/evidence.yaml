        usage:
          title: Paullinia brenesii Croat, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: the crest, densely villous along its margin; disc glands thick, semicircular, finely pubescent inside; stamens villous, flattened; staminate flower with the stamens to 4 mm long, the pistil ca. 1 mm, the ovary densely pubescent, the 3 styles gla- brous to sparsely pubescent; bisexual flowers with the stamens to 3 mm long, about as long as the ovary, the ovary ellipsoid, 3-angled, densely grayish ap- pressed-pubescent, the style 3-branched from near the base, its branches sparsely pubescent. Fruits red, stipitate, broadly obovate and emarginate to truncate at the apex, ca. 12 mm long, 1.2-2.5 cm wide, 3-celled, sparsely pubescent, usually prominently winged, the wing itself to 7 mm long, the valves densely tomentose within, the stipe to 3 mm long; seeds 1-3, enveloped at the base by a white aril. The species is named in honor of A. M. Brenes, who made the first collection known to me. Paullinia brenesii is closest to P. fuscescens but is distinguished by its larger leaves and more broadly winged fruit.
          originalLanguage: en
