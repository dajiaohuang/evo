          originalSourceText: Lianas; stems terete, densely brown-tomentose when young, glabrate and somewhat purplish in age, the persistent pubescence in narrow, straight bands alternating with reddish brown strips of periderm; wood simple. Leaves bitemate; petioles 1.5-4.5 cm long, terete to margined or rarely narrowly winged and usu- ally broadest in the upper half; petiole and rachis pubescent; leaflets ovate to ovate-elliptic or obovate, obtuse to bluntly acute or rarely acuminate at the apex, attenuate at the base, 2-8(-10) cm long, 1-4.5 cm wide, conspicuously crenate to crenate-lobate, the surfaces viscidulous, usually conspicuously pubescent on both surfaces with usually erect, curved trichomes, the upper midrib sharply raised, more densely pubescent than the surface, the axils of the lower lateral veins barbulate; juvenile leaves more distinctly lobate, to 18 cm long and 7 cm wide. Thyrses in terminal panicles to 10-20 cm long, the branches, pedicels, bracteoles, and calyces densely grayish- or brown-tomentose; bracteoles narrowly deltoid, to ca. 2.5 mm long; pedicels 3-4 mm long, articulated about midway. Flowers white, ca. 5 mm long; sepals ovate to elliptic, densely appressed-pubes- cent within; petals obovate, ca. 4 mm long, the scales 3 mm long, ciliate, the crest semicircular to obovate, orange, glabrous, the deflexed appendage longer than
