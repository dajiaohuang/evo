    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, 250-400 mm tall. Leaves linear-lanceolate, glabrous. Flowers on ± horizontally spreading pedicels in a lax raceme, bracteoles always ± basal, orange, zygomorphic, fragrant, tepals 8-10 mm; anthers yellow, 5 upper and 1 larger lower, filaments connate ± halfway.
            textZh: Cyanella aquatica Oberm. ex G.Scott 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_14659_0
            locator: "SANBI/WFO archive Morphology row 33565; source identifier 14659.0; cited publication: Manning, JC. 2013. Tecophilaeaceae. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 161 - 162. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Distinguished by the lax, sparsely branched racemes, ± basal bracteoles on sharply sigmoid pedicels, and bright orange flowers. In general form the species is most similar to Cyanella hyacinthoides, which also has a 5 + 1 arrangement of stamens with the filaments connate for ± half their length or more but which differs in its fibrous corm tunics and dense racemes of white or pink to blue flowers with the bracteoles usually inserted near the middle of the pedicels or above, only rarely near the base. The two taxa are ecologically separated, with C. hyacinthoides favouring better drained, sandy or gritty soils. In perianth colour C. aquatica might be confused with yellow-flowered C. lutea but that species has suberect pedicels with the bracteoles inserted ± midway along, filaments that are ± free to the base, and a laterally deflexed style. C. lutea is also ecologically separated, favouring fine-grained clay soils in renosterveld or drier karroid vegetation.
            textZh: SANBI 条目提供了 Cyanella aquatica Oberm. ex G.Scott 的鉴别特征。
            sourceIds:
              - sanbi_7651_0
            locator: "SANBI/WFO archive Diagnostic row 47566; source identifier 7651.0; cited publication: Goldblatt, P; Manning, JC. 2012. A revision of Tecophilaeaceae subfam. Tecophilaeoideae in Africa. Bothalia 42(1): 21 - 41. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
