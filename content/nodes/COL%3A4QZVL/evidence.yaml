    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Small, clump-forming, glabrous succulent, up to 120 mm tall, stems leafless, 4- or 5-angled, tuberculate, up to 20 mm diam. Flowers 1-3, developing in succession, in many sessile clusters in grooves of stem, pedicels 1-2 mm long. Corolla rotate, glabrous, smooth, 9-14 mm diam., inside darkly mottled on yellow, tube lacking, lobes spreading, deltoid, 3-6 x 2-3.5 mm. Corona purple-black, outer lobes bifid into erect, deltoid teeth, inner adpressed to anthers, without a dorsal appendage. Apr.-July, also at other times depending on rain.
            sourceIds:
              - sanbi_14722_0
            locator: "SANBI/WFO archive Morphology row 34089; source 14722.0; publication: Bruyns, PV. 2013. Apocynaceae. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 248 - 264. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Specimens of Q. acutiloba form clumps up to 300 mm in diameter. Vegetatively they are not readily distinguishable from most other members of this section, although the stems are often rather irregularly 4- or 5-angled with the angles slightly spiralling and they never have the minute stipular denticles alongside the teeth on the tubercles that most of the others regularly have. However, Q. acutiloba is always easy to recognise when in flower. The buds are characteristic and unmistakable with their broadly and shortly deltate shape and the very short pedicels that hold them close to the stem. The corolla is usually around 10 mm across and is practically without a tube. On the inside it is glabrous and entirely smooth. In this species the flowers are quite variable in the extent to which the lobes spread out. They are usually quite flat but occasionally they only open slightly so that the corolla has a more or less campanulate appearance. They are extremely variable in colour and may be found from dark, practically uniform purple-black to intensely or faintly spotted with purple-black on yellow-green or, on rare occasions, they are plain yellow-green. The somewhat cup-like corona is also relatively flat and broad. The outer lobes fill the gaps between the inner lobes and each is usually divided into two very short, deltoid lobules. The inner lobes are narrow and they cover the anthers at least partly. This whole structure is usually dark red (becoming darker when the corolla is darker) but it is bright yellow when the flower is plain yellow.
