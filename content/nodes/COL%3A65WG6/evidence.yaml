    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Trees; stems 6-8 m tall, usually simple. Leaves 30-40, erect to recurved, 300-750 x 35-100 mm, channelled, deep green, without surface prickles. Inflorescence with 12-18 racemes, 1.0-1.3 m tall; racemes very dense, cylindric; bracts oblong, 1-2 x 2-3 mm. Flowers orange-yellow in bud, lemon at flowering, 15-20 mm long, cylindric-ventricose; outer segments connate in lower half, inner segments free but dorsally adnate to outer for ±5-6 mm; pedicels 1-2 mm long. Anthers exserted 7-15 mm; filaments vermilion. Ovary 4-5 x 2-3 mm, green; style deep orange, exserted 7-20 mm. Fruit not seen.
            textZh: Aloe rupestris Baker 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_5961_0
            locator: "SANBI/WFO archive Morphology row 49090; source identifier 5961.0; cited publication: Glen, HF; Hardy, DS. 2000. Aloe. In: G Germishuizen & E du Plessis (eds), Aloaceae (first part), Fl. S. Africa 5(1,1): 1 - 167. National Botanical Institute, Pretoria. [http://www.biodiversitylibrary.org/item/209564#page/3/mode/1up]. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: This species is close to A. thraskii and A. excelsa. The stem of A. rupestris sometimes branches, unlike A. excelsa, and the leaves are smaller and lack the surface prickles which are common in A. excelsa. The racemes of A. rupestris are erect, while those of A. excelsa are more or less oblique. In A. thraskii, the leaves are much longer than those of A. rupestris, and are deeply channelled and reflexed. The racemes of A. thraskii are much broader than those of A. rupestris, the flowers are longer and brown, not orange-yellow becoming lemon-yellow, and the exserted portions of the stamens and styles of A. thraskii emerge from the flower at an angle, not straight as in A. rupestris.
            textZh: SANBI 条目提供了 Aloe rupestris Baker 的鉴别特征。
            sourceIds:
              - sanbi_5961_0
            locator: "SANBI/WFO archive Diagnostic row 51320; source identifier 5961.0; cited publication: Glen, HF; Hardy, DS. 2000. Aloe. In: G Germishuizen & E du Plessis (eds), Aloaceae (first part), Fl. S. Africa 5(1,1): 1 - 167. National Botanical Institute, Pretoria. [http://www.biodiversitylibrary.org/item/209564#page/3/mode/1up]. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: A. rupestris appears to be nearest allied to A. thraskii, and to the Southern Rhodesian species A. excelsa Berger. A. thraskii differs in having much longer, more deeply channelled and recurved leaves, a much stouter and shorter stem, broader racemes, and differently shaped larger flowers. The very distinctive species, A. excelsa, has been the special study of Mr. H. B. Christian, who states that it differs from A. rupestris in having leaves copiously tuberculate-aculeate when young, old leaves up to 2 met. long, a taller inflorescence with longer peduncle, the branches of the inflorescence erectly spreading to oblique with each raceme in line with its branch, longer cylindric-acuminate racemes, much larger flowers which vary in colour from orange to deep blood-red, and the exserted portion of the stamens a very dark purple.
            textZh: SANBI 条目提供了 Aloe rupestris Baker 的鉴别特征。
