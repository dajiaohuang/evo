    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Erect, rounded shrub, up to 0.5 m high. Leaves alternate, filiform, entire or mostly trisect above middle, sometimes some pinnatipartite, laxly woolly, glabrescent. Capitula radiate, solitary, terminal, long pedunculate; involucral bracts imbricate, narrowly oblong- lanceolate to oblong-spathulate. Ray florets white-pinkish. Disc florets tubular below, narrowly campanulate above, 5-lobed, yellow, often tipped reddish. Flowering time Mar.-May. Pappus cup-shaped, white, shorter in disc florets. Cypselae oblong, ribbed, glandular.
            sourceIds:
