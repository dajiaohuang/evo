            locator: "SANBI/WFO archive Morphology row 86122; source 18107.0; publication: Cron, GV; et al. 2019. Asteraceae. In: CL Bredenkamp (ed.), A Flora of the Eastern Cape Province, Strelitzia 41(1): 438 - 439. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: The leaves of C. hilliardiae are narrow and densely set and, especially when young, greyish from the somewhat deciduous tomentum. Most leaves are tripartite above the middle, but simple as well as more lobed leaves occur on the same specimens. The impressed glands on the leaves are sometimes barely discernible, being hidden in furrows and wrinkles of the leaf surface.
