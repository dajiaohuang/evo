  claims:
    - subjectId: event:xenopus-tropicalis-draft-genome
      claimKind: scientific
      claimType: event-mechanism
      statement: A roughly 7.6-fold draft assembly from a seventh-generation inbred Nigerian female Xenopus tropicalis spans about 1.51 Gbp and supplies an extant comparative model; it is not an amphibian ancestor, crown-age estimate or survey of all amphibian genomes.
      confidence: high
      confidenceRationale: Assembly accession AAMC00000000, sequencing depth and annotation metrics are reported directly; high confidence applies only to this sampled laboratory genome and draft.
      referenceLinks:
        - relation: supports
          referenceId: hellsten-2010-xenopus-genome
          pages: 633–636
          figure: Figures 1–4; Supplementary Tables 1–3
          quoteLocator: Genome assembly, annotation and comparative analyses
  claim-rationales.zh:
    - 该主张绑定具名标本或明确数据集及一手来源定位；置信度仅适用于所述样本、方法与边界，不外推为全球首次出现、直接祖先或完整类群覆盖。
  claim-statements.zh:
    - 来自第七代近交尼日利亚雌性热带爪蟾、约 7.6 倍覆盖的草图组装跨度约 15.1 亿碱基，提供现生比较模型；它不是两栖类祖先、冠群年龄估计或全部两栖动物基因组调查。
