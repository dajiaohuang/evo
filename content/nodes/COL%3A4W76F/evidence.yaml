    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Shrub, up to 4 m high. Leaves 3-foliolate, petiolate; leaflets sessile, olive-green, glabrous, amphistomatous; lamina linear; terminal leaflets (11-)29(-50) x (1.0-)1.7(-2.1) mm, apex rounded, mucronulate, margin entire. Panicles lax. Drupes rhombic, discoid, glabrous, shiny, light to dark brown, ± 5.8 x 2.0 mm. Flowers greenish yellow.
            sourceIds:
              - sanbi_11118_0
            locator: "SANBI/WFO archive Morphology row 3309; source 11118.0; publication: Herman, PPJ; Retief, E. 1997. Plants of the northern provinces of South Africa: Keys and diagnostic characters. Strelitzia 6: 1 - 681. National Botanical Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Because they are both sympatric in some areas, have a wiry habit and leaflets that are superficially similar, this species is often confused with R. ciliata. R. tridactyla is however a clearly distinct species with the strictly linear, amphistomatous leaflets with rounded apices, together with discoid drupes separating it from the others.
            textZh: SANBI 条目提供了该种的鉴别特征。
