    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Shrub, dwarf shrub or herb, up to 1 m high. Leaves alternate, pinnate to subbipinnate, up to 100 x 60 mm; rachis stout, glandular, leaflets thick-textured, elliptical or obovate, up to 25 x 10 mm, margins entire, sometimes revolute, glabrous, densely pellucid-glandular. Flowers in terminal and axillary cymes on stout peduncles up to 90 mm long; petals 5, up to 8 mm long, yellow, clawed, limb concave with lacerate margins. Flowering time Sept.-Mar. Fruit a 4-lobed capsule, ± 5 mm long, dehiscing at apex, densely pellucid glandular, each lobe several seeded. Seeds blackish, wedge-shaped, 2 mm long, rounded at back, minutely tuberculate.
            sourceIds:
