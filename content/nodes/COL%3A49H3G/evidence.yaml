    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Scrambling shrub to tall, woody climber. Branches terete, the young parts fulvous-tomentose, soon glabrescent; bark dull brown with small white lenticels; sap milky. Leaves firmly membranous, petiolate, obovate-oblong to oblanceolate, 6-11 cm long, 1.5-4.2 cm broad, cuneate, apex abruptly acuminate, rusty tomentose in the bud stage, soon becoming glabrous; secondary nerves 3-4 on each side, alternate, somewhat irregularly parallel; petiole 3-6 mm long, pubescent, channelled above, with 2 or more small glands towards the apex; stipules 0. Inflorescence axillary, consisting of panicles of few-flowered cymes borne profusely towards the ends of the branches, fulvous-tomentose; bracts small, ovate-lanceolate, early deciduous; pedicels very short. Flowers relatively small, greenish, sweetly scented. Calyx 2-2.5 mm long, finely fulvous-tomentose; sepals ovate, subacute. Corolla salver-shaped; tube tubular-campanulate, 3-4 mm long and 1.5 mm in diameter, minutely tomentellous without, glabrous within with 5 ligulate scales in the mouth alternating with the lobes; lobes usually reflexed, linear-oblong, 3-6 mm long. Stamens 5; anthers sessile, lanceolate, shortly sagittate, 2-2.5 mm long, apex acute, reaching the corolla throat. Disc cupular, deeply 5-lobed, almost as long as the ovary. Ovary of 2 free carpels; style short; stigma spindle-shaped with a fringe near the apex and a 2-lobed apiculus. Fruit of 2 follicular mericarps, widely spreading; mericarps slender, subcylindric, 14-18 cm long and 6-8 mm in diameter, tapering at each end, at first finely tomentose, later glabrescent. Seeds numerous, linear-oblong 1.1-1.3 cm long, tip acute to obtuse, channelled on one side, with an apical coma of whitish hairs 3.5 cm long; cotyledons flat, narrow, radicle short, straight.
