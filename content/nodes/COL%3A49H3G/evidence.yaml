          - text: O. chirindica S. Moore was separated on grounds of longer corolla lobes (6 mm) and longer pedicels (4-5 mm). In typical O. inandensis, the corolla lobes are 3-4 mm long, while in Gerstner 2598 they are up to 5 mm long. The leaves are almost identical with those of O. inandensis and have the characteristic venation of that species. Although the material seen of O. chirindica is very scanty, it seems evident that it must be relegated as a synonym. In addition to O. chirindica, Pichon places O. oblanceolata Engl, in synonymy under O. inandensis. This species has not been investigated but, if Pichon is correct, then the distribution of O. inandensis extends as far north as the French Cameroons, Uganda and Ethiopia.
