    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Summer growing geophyte reaching 160 mm high. Corm oblong-ovoid to subglobose, 8-12 mm x 5 mm, tunics brown, produced into a narrow submembranous, flimsy neck 10-40 mm long. Stem green sometimes light brownish-maroon above the sheaths, 90-120 mm long from the corm to the upper leaf, 1 mm diam. Basal leaves 1 or 2, alternate, usually erect and somewhat flexuous, green, narrowly linear, 160 x 1.0-1.5 mm, with faint parallel veins; apex long attenuate; margin involute to make leaves appear subterete, entire; base broad, sheathing. Cauline leaves 2, usually erect and somewhat flexuous, indistinctly many-veined; apex attenuate; margin involute to make leaves appear subterete, entire; lower cauline leaf inserted about the middle of the stem, 50-100 mm long, with sheath portion 15-30 mm long; upper cauline leaf inserted about three quarters up the stem, 10-40 mm long, with sheath portion 10-20 mm long. inflorescence spicate, 3-8-flowered; peduncle 15-20 mm long; rachis 20-30 mm long, somewhat stout with flowers spaced (1-)2-8 mm apart. Perianth 4-5 mm long; tepals 6, each with 3 veins running from the tip to the base; tube white flushed cream without, white within, broadly cylindric, gradually widening upwards, 1.0-1.5 mm long and 2.0-2.5 mm broad at the throat; lobes strongly clawed, diverging, 3-4 mm long; claws white flushed cream without, white within; limbs white, sometimes flushed greenish cream without, with a distinct, deep purple, transversely reniform bilobed patch distal to the attachment of the filament, narrowly trullate, 3 x 0.6-0.7 mm, acute, margins sometimes involute. Nectary distinctly raised, distal to point of attachment of filament, 0.2-0.3 mm long, white proximally; distal face at about 45° to the tepal surface and within the purple blotch on the tepal. Filaments white, straight, 0.8 mm long. Anthers golden yellow to brownish yellow with age, dorsifixed, rounded-oblong, 0.5 x 0.2 mm. Pistil ovary light green or sometimes with the outer edges dark purplish red, oblong-elliptic, 2-3 mm long; styles 3, cream, conical, subulate, 1-2 mm long; stigmas suberect, small, capitate. Capsule oblong to oblong-ovoid, 3angled, 5-6 x 2.0-2.5 mm. Seeds ellipsoid, slightly compressed, 0.7 mm long, 0.5 mm in diam., brown with reticulate surface and with a short obtuse beak at one end. All flowering specimens have been collected in February, but it is likely that flowering continues into March.
