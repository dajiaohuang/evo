          - text: Wurmbea burrowsii is similar to W. elatior in having a purple bilobed patch on the distal face of the nectary and the pistils with similar colouring (green with a purplish tinge). It differs from W. elatior in being nearly a quarter its size. The leaves of W. elatior are nearly double the length of those of W. burrowsii and the former carries two leaves from a basal sheath whereas W. burrowsii has an additional middle leaf instead of only a basal and an upper leaf. The flowers of W. burrowsii are smaller than those of W. elatior and the spike also carries half the number of flowers of W. elatior. Wurmbea angustifolia is taller (200 mm) than W. burrowsii (160 mm) and has a solitary basal leaf compared to the one or two of W. burrowsii. The limbs of the tepals of W. angustifolia can be twice as wide as those of W. burrowsii and the filaments twice as long.
