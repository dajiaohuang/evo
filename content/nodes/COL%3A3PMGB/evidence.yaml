          originalSourceText: Shrub to 2.5 m, much branched, the stems ascending, slender, slightly lined from the nodes when young, later terete, whole plant strigose with appressed medifixed hairs. Leaves (7-)11-15(-19) foliolate, leaflets narrowly elliptic to ob- ovate, rounded at the apex, mucronate, rounded or broadly cuneate at the base, lowermost leaflets smaller than the terminal ones, 10 mm long, 3 mm wide, the largest leaflets 24 mm long, 8 mm wide, the middle leaflets typically ca. 15-17 mm long, 5-7 mm wide, strigose, greener and less densely hairy above; petiolule 1.5 mm long, the petiole 5-10 mm long, the rachis 3.0-4.5(-6.0) cm long; stipels setaceous, inconspicuous, 0.5-0.75 mm long; stipules setaceous, inconspicuous, ca. 1 mm long. Inflorescences of dense axillary racemes ca. 4 cm long, to 5 cm long in fruit, thus shorter than the largest mature leaves, the nodes ca. 40-70 but not all with mature flowers or fruits; pedicels single, ca. 1 mm long, recurved in fruit; bracts small, inconspicuous, setaceous, barely 1 mm long, early deciduous. Flowers dull red, ca. 5 mm long, the hypanthium campanulate, ca. 1.25 mm long, the 5 teeth subequal, triangular, ca. 0.5 mm long, strigose; petals subequal, the standard obovate, narrowed to cuneate base, 4.5 mm long, hairy outside, the wing petals with blade narrow elliptic, ca. 3.5 mm long, tapered to the claw, ca. 1.0-1.5 mm long, auriculate at the base, the keel petals fused above, obovate, ca. 4 mm long, narrowed to the free clawed bases; staminal sheath ca. 2 mm long, the anthers ca. 0.5-0.75 mm long; pistil ca. 3.5 mm long, scattered hairy, ovary linear, the style upcurved, ca. 1 mm long; stigma capitate. Fruits straight or slightly curved, 15-20 mm long, strongly constricted between the seeds, ca. 1 mm wide between the seeds, 2 mm wide at the seeds, tapering to a slender beak 1-2(-3) mm long, tapering basally to a narrowed portion 1-2 mm long above the persistent remnants of the calyx cup, (2-)3-4 seeded; seeds oblong to subreni- form, 2-3 mm long, 1.0-1.5 mm wide, smooth, dull, brown.
