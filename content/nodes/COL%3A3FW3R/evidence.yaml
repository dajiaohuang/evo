    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Acaulescent perennial herb. Leaves entire or sinuate, with remote, obscure teeth, lanceolate, oblanceolate, elliptic, oblong or ovate to subrotund, lower surface persistantly whitish or lemon tomentose. Scapes not swollen below head. Rays biseriate, prominent. Flowers with rays white above, pink, mauve or red below, rarely yellow, disc white, yellow, reddish or blackish.
            sourceIds:
