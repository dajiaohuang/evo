            locator: "SANBI/WFO archive Morphology row 2072; source 11118.0; publication: Herman, PPJ; Retief, E. 1997. Plants of the northern provinces of South Africa: Keys and diagnostic characters. Strelitzia 6: 1 - 681. National Botanical Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Rays which are white above and reddish below (with various shades) are confined to E. Cape, Natal, Orange Free State, Swaziland, Transvaal, and (fide Wild, 1972) Southern Mozambique. The yellow ray colour is universal in all other parts of the distribution area, but can also be found in the areas mentioned. The violet-purple pappus colour is similarly confined to the E. Cape-Transvaal area, while the whitish-tawny pappus is universal in all other areas, but also common in E. Cape-Transvaal.
