          originalSourceText: Erect shrubs. Branches, terete, the branchlets slightly compressed, petioles (to 5 mm.. long) and peduncles (5-10 mm. long) rusty-furfuraceous, later sub- glabrate. Leaf blades very broadly ovate, almost orbicular at the base, scarcely constricted to the apex, this obtuse, thick and hard, nervation distinct or veinless, 3-10 cm. long, 2-8 cm. wide. Spikes solitary, to 3 cm. long; rachis glabrous. Bractlets with distinct margins. Flowers or buds becoming brown, 1-1.5 mm. long, perpendicular to the rachis. Fruit ovate, 4-5 mm. long, the apex not exceeded by the margin of the persistent calyculus.
