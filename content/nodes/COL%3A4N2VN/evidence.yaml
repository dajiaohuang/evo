      ecology:
        status: partially-supported
        claims:
          - text: No other South African protea endures so rigorous a microclimate as P. nubigena does. Even in summer the cool, moist cliff faces it inhabits are in an almost perpetual shadow, while in winter they are probably frozen for weeks on end. Direct sunlight rarely falls on P. nubigena. During the summer, torrential deluges generated by afternoon thunderstorms pour a mean annual rainfall in excess of 1500 mm over the basalt cliffs and even if it is not raining, clouds may enshroud the kranzes day after day. Not surprisingly, P. nubigena is a very slow grower.
