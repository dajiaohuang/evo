          - text: Protea nubigena may be distinguished from all other pro-teas from the summer rainfall region of South Africa, on account of its dwarf, highly branched growth habit, the very small inflorescences and flowers (styles 35-40 mm long) and the small, oblanceolate, glabrous, glaucescent leaves 40-60 mm long, 7-14 mm wide.
