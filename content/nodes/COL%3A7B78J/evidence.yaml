      evolution:
        status: partially-supported
        claims:
          - text: Using approximately 348 bp of mitochondrial D-loop sequence, Sariyati et al. recovered separate Peninsular Malaysian and Sumatran siamang clades across their phylogenetic analyses. In the maximum-likelihood tree, bootstrap support was 98% for the Peninsular clade and 83% for the Sumatran clade; Bayesian posterior probabilities were 1.00 and 0.98, respectively. The comparison included six newly collected Peninsular Malaysian siamang faecal samples and published GenBank sequences. This is one mitochondrial marker study, not genome-wide evidence or a range-wide population-structure assessment.
            originalLanguage: en
            sourceIds:
              - sariyati2024siamangmtDNA
            locator: Abstract; Materials and methods, Sample collection and Data resources; Results, Maximum Likelihood tree and Bayesian Inference tree; Figures 4–5; Conclusions.
            placeTimeScope: The article analyzes approximately 348 bp of mitochondrial D-loop sequences, including six newly collected Symphalangus syndactylus faecal samples from Fraser's Hill and Genting Highlands in Peninsular Malaysia plus published GenBank sequences representing Sumatran siamangs and other hylobatids. Regional clade support varies by phylogenetic method; this does not establish genome-wide structure or a species-wide subspecies consensus.
            lifeStatus: The article describes new faecal samples from Peninsular Malaysian populations and also acknowledges contributions from Zoo Melaka and Genting Nature Adventure; provenance is not assigned to every comparison sequence. No captive-versus-wild biological comparison is claimed.
        gaps:
          - The evidence is a single mitochondrial D-loop marker study with limited regional sampling; nuclear-genome evidence, broader population coverage, and independent taxonomic review remain unassessed.
      distribution:
