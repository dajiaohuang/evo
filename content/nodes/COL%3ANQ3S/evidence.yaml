    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants at first solitary, dividing and becoming branched. Rosettes pendent, up to 150 mm diam., up to 250 mm long, characteristically curving upwards at the apices. Stems pendent, up to 700 x 15 mm, characteristically orange-brown when cut, covered with persistent leaf bases, weathering to form a fibrous network; basal part often becoming glabrous, grey-brown, smooth and with aerial roots. Roofs grey-brown, fleshy, terete, ± 1.5-2.0 mm diam. Leaves 6-10 per rosette, ascending to ascending-spreading, linear-lanceolate, 70-170 x 12-18 mm, apex acute, mucronate, flat above, convex to rounded below, becoming channelled during drought, soft-textured, pale green, smooth, obscurely striated, margin entire. Inflorescence 110-350 mm long, sparsely flowered (20-30 flowers) in upper third; raceme up to 100-150 mm long; peduncle up to 5 mm diam. at base, biconvex, green; bracts deltoid, up to 3 x 0.5 mm, acuminate, clasping; pedicels 8-10 mm long. Perianth stellate, ± 13 mm diam.; tepals bright yellow with greenish yellow median stripes, apices obtuse to emarginate; outer tepals narrowly oblanceolate, up to 10 x 2 mm; inner tepals elliptic to elliptic-oblanceolate, up to 9 x 3 mm. Stamens up to 7 mm long, bearded in central part, with hairs 2.5-3.0 mm long. Ovary globose, up to 1 mm diam.; style erect, up to 4.5 mm long. Capsule obovate, up to 3 x 2.5 mm, ascending. Seeds 3 x 1.5 mm, black.
