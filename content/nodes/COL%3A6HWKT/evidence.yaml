        claims:
          - text: Glabrous; rhizome very short; stems 4-16 in. long, tufted, very slender, each with 1 head of 5-10 spikelets; uppermost sheath leafless, lower pale brown with long setaceous leaves; bracts 2, lower 1-3 in. long, suberect; spikelets 1/4 in. long, pale brown; glumes ovate; keel excurrent; anthers linear-oblong; crest small, lanceolate; nut 2/5 the length of the glume, obovoid, trigonous, smooth, leaden-black minutely-white reticulated by the outermost layer of withered cells; style shorter than the nut, branches 3 linear, long; gynophore rather prominent, obpyramidal, margin entire.
