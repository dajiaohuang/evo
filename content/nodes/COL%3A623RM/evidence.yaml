      statement: Felidae forms a sampled family branch in the extant-carnivoran supertree, with its higher feliform relationship revised relative to the earlier supertree; this evidence does not include extinct felid diversity comprehensively or define the family’s origin time.
      confidence: medium
      confidenceRationale: The primary analysis supports extant family topology and explicitly notes source-tree conflict; fossil history is withheld.
      referenceLinks:
        - relation: supports
          referenceId: nyakatura-2012-carnivora-supertree
          pages: Article 12
          figure: Figure 2
          quoteLocator: Family-level topology; Felidae and Feliformia discussion
