    - 一手分析支持现生科级拓扑，并明确指出来源树冲突；主张不陈述化石历史。
  claim-statements.zh:
    - 猫科在现生食肉类超级树中形成一个取样科级分支，其猫型类高阶关系相对早期超级树有所修订；该证据未全面包含灭绝猫科多样性，也不定义科级起源时间。
