m long and 7-10 mm wide, externally puberulent, glabrous and shiny within, its rim usually very regular and truncate, fitting closely over the base of the mature fruit like the cup of an acorn or subincluding the very immature fruit, the pedicels greatly incrassate and acutely tetragonal in fruit, ampliate to ca. 1.2 mm above.
