        usage:
          title: Aegiphila panamensis Moldenke, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrub or small tree to 10 m tall or vine-like; trunk straight, erect, cylindric; bark grayish-white, minutely scored vertically with shallow confluent furrows and scaling off in small plates between the furrows; branches ascending, irregularly opposite, almost white; wood creamy-white, with a somewhat aromatic odor; branchlets slender or rather stout, elongate, obtusely tetragonal or subterete, flattened and ampliate at the nodes, usually conspicuously flattened and sulcate toward the tips, gray-green or brownish, densely puberulent, rarely glabrate, often becoming furrowed in drying. Leaves opposite, membranous or chartaceous, entire, lanceolate or oblong to oblong-lanceolate or obovate, 9-18 cm long, 3-8 cm wide, acute to long-acuminate or caudate, basally acute or acuminate and some- times narrowly attenuate into the petiole, dark-green above, paler beneath, black- ening in drying, densely roughened-puberulent on both surfaces, especially along the midrib and secondary veins, probably glabrescent, densely and minutely glandular-punctate beneath, usually with numerous glandular disks of varying dimensions scattered on the lamina along both sides of the midrib beneath, dis- appearing upwards, secondary veins 8-12 pairs, mostly prominent on both sur- faces, minor veins slender and delicate but usually conspicuous beneath; petioles slender or stoutish, weak, 5-13 mm long, spreading, puberulent or glabrate. Inflorescences axillary cymes and terminal panicles; the cymes solitary, opposite, to 10 cm long and 6.5 cm wide, half as long as the subtending leaves or less, often densely many-flowered, bracetolate, the panicles pyramidal, usually large and thyrsoid, sometimes long and narrow, to 30 cm long, basally to 21 cm wide, the branches ca. 5 pairs or numerous, opposite or approximate, 2-3 cm long,
