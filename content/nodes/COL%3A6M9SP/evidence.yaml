          publishedAt: undated
          originalSourceText: Subshrubs to 0.3 m tall, the stems subprostrate and rooting at the nodes, the bark somewhat rough, the lenticels minute. Leaves deciduous, but crowded to- ward the apex of the twiglets, narrowly obovate oblong, 4.5-8 cm long, 1.6-4.5 cm wide, deltoid to obtuse toward the apex, acute at the base, the costa prominent above 'and beneath, the lateral veins 22-25, plane above, prominulous beneath, the intervenal areas conspicuously bullate above, stiffly chartaceous, concolor- ous, ferrugineous villosulose beneath; petioles 0.4-1 cm long, the hairs many, ferrugineous; stipules oblong, ca. 3 mm long, leaf-like. Inflorescences axillary, the peduncles 0.5-5 cm long, slender, ca. 1.2 mm wide, the hairs few, the cymules on reduced branches, the flowers few. Flowers scarcely pedicellate; calycine cup much reduced, the lobes 4, thickly subulate, to 1.5 mm long, the hairs few, to 0.8
