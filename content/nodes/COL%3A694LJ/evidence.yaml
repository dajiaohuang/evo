        claims:
          - text: Plants (50-) 100-300 (-500) mm tall; basal sheath obtuse and apiculate, ribbed and with dark brown muricate patches, (20-) 40-80 mm long; leaves 1 (-3), blade usually narrowly lanceolate, acute, spreading, shallowly conduplicate, 60-80 (-120) x 4-10 (-30) mm. Inflorescences 1 (-6) -flowered. Flowers facing out horizontally, up to 30 mm in diameter, sepals and petals pale mauve to almost white. Median sepal galea 10-13 x c. 2-3 mm x 3-6 mm deep; spur slender, at length somewhat decurved, apically subclavate, obtuse, (15-) 25-40 mm long; lateral sepals (10-) 13-18 x 4-6 mm. Petals oblanceolate to narrowly obovate, suboblique, acute, facing forwards. Lip c. 2 mm long. Anther c. 3 mm long, apex upcurved; stigma c. 2.5 mm in diameter; rostellum 3-5 mm tall.
