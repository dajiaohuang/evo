        usage:
          title: Burmeistera parviflora E.Wimm. ex Standl., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Epiphytic or terrestrial, suffrutescent herbs; stems hollow, 30-50(-100) cm high, glabrous or sparingly to moderately puberulous above. Principal leaves with blades elliptic, oblong or ovate, 6.5-12 cm long, (1.5-)2.5-4(-5) cm wide, usually 2.5-3.5 times as long as wide, apically abruptly narrowed to an acuminate tip (0.5-)1-2 cm long, basally cuneate to somewhat rounded, marginally shal- lowly crenate-serrulate with 4-6(-10) callose-tipped teeth per cm and with a prominent submarginal vein extending the length of the blade, sparsely to densely but microscopically papillate or strigillose especially on the veins beneath but appearing glabrate; petioles 1-3 cm long, glabrous or minutely puberulous. Flow- ers 2-2.5 cm long; pedicels solitary in the upper leaf axils, spreading-ascending, somewhat flexuous, slender, glabrous, ebracteolate, 4-9 cm long; hypanthium in anthesis glabrous, obconic, basally subacute, pale green to dark reddish purple, 3-6 mm long; calyx lobes acutely to bluntly triangular, 2-3(-4) mm long, glabrous, entire or with a few inconspicuous marginal callosities, dark red or purplish, erect or somewhat spreading; corolla glabrous, clear yellow, the tube (5-)7-14 mm long, the lobes lance-ovate, the 2 upper lobes 5-9 mm long, the lateral lobes (3-) 5-8 mm long, the lowest lobe 3-5 mm long; filament tube 12-19 mm long, distally puberulent, glabrous below, the filaments not adnate to the corolla tube, the 3 upper anthers glabrous and ca. 4 mm long, the 2 shorter or lower anthers ca. 2.5 mm long, with a scanty fringe of soft white hairs. Berries scarcely inflated, obovoid, 5-6 mm in diameter, pinkish to white; seeds light brownish, oblongish, 0.8-1.0 mm long, shallowly pitted with depressions slightly longer than wide.
