          originalSourceText: "Achlorophyllous parasites on various species of Flacourtiaceae, the leafless plants usually numerous and arranged more or less in rows along the stem or branches of the host. Inflorescences 1-flowered with a fleshy, thickened receptacle subtended by ca. 6 imbricate bracts. Flowers 4-6 mm long, 2-3 mm wide, the calyx epigynous, of 4 petaloid, whitish, obovate segments, each narrowed to a circular base and inserted near the top of the ovary; male flowers (after Vattimo, Mus. Natl. Hist. Nat. Paris 15: 226. 1956) with a short central sterile stylar column terminating in a hemispheric stigma-like cap; stamens inserted around the stylar column below the cap in 2 series of ca. 19 anthers each, subsessile; female flowers with a single pistil, the ovary hemispherical, 3 mm long, 2.5-3 mm wide, some-"
