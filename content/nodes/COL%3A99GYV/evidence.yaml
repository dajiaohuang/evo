          title: Capsicum chinense Jacq., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Small, short lived shrub to 1.5 m tall, glabrate or puberulent. Flowers mostly 2-5 per node; pedicels recurving and becoming thick in fruit; calyx with a pronounced constriction between the base of the calyx and pedicel, teeth mostly absent; corolla dull white or somewhat greenish; the lobes spreading to recurved; anthers blue to violet, rarely yellow; the stigma not exserted from the anthers more than 1 mm. Fruit pendant, persistent, variously shaped, but often with longitudinal furrows, the fruit wall fleshy, ripening brown, red, orange, pink, yellow or almost white; seeds cream to yellow.
