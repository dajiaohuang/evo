    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Well-branched, foetid shrublet, up to ± 1.3 m tall, becoming black when dry. Leaves outspread, elliptic, tip subacute, entire or minutely toothed, thinly hairy. Flowers axillary, corolla tube ± 20-26 mm long, limb nearly regular, glandular-puberulous outside, white to blue, purple or mauve, base of each lobe darkly barred. (July-)Aug.-Sept.(-Jan.).
            sourceIds:
              - sanbi_14766_0
            locator: "SANBI/WFO archive Morphology row 35497; source 14766.0; publication: Snijman, DA. 2013. Scrophulariaceae: Jamesbrittenia. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 463 - 464. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: "Jamesbrittenia fruticosa is distinguished from its allies primarily by its leaves: the cauline leaves are nearly always elliptic, tapering at both ends (ratio of length: breadth 2-4.8:1) and spread nearly at right angles to the stem; only the uppermost leaves subtending flowers are sometimes ovate and broad-based. The pubescence on the leaves is often (but by no means always) shorter than in allied species; it is useful to examine the margins, where the hairs are easily seen in profile. The pedicels are short (up to 10 mm, but 4-5 mm is more usual), the calyx lobes mostly less than 1 mm broad (occasionally up to 1.5 mm), the corolla tube long (mostly 20-26 mm, occasionally as short as 16 mm) and only lightly bearded with short clavate hairs that scarcely extend onto the base of the lower lip. The whole plant often blackens on drying."
            textZh: SANBI 条目提供了该种的鉴别特征。
            sourceIds:
