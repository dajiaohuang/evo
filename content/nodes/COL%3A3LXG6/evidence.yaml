          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Small shrubs, to 2 m tall, often epiphytic, the twiglets terete or angular, smooth, glabrous, the nodes well spaced. Leaves oblong rotund or ovate oblong, mostly equilateral, to 7 cm long, to 4 cm wide, usually deltoid, occasionally obtuse at the apex, obtuse, rounded or cuneate at the base, the costa plane proximally above, subprominulous proximally beneath, evanescent distally, the lateral veins ca. 5, arcuate, evanescent above and beneath, coriaceous, drying dark brown; petioles to 1 cm long, to 0.25 cm wide, shiny, puberulent to gla- brescent, the lamina decurrent on the upper side; stipules oblong, to 1.5 cm long, tapering, obtuse, coriaceous, glabrous. Flowers terminal, solitary, subsessile; hypanthium oblong, ca. 10 mm long, ca. 3.5 mm wide, glabrous, the lobes 5, often deciduous, 0.5-1.0 cm long or perhaps scarcely measurable; corolla white or yellow with the tube narrowly cylindrical, 4-5 cm long, 0.2-0.4 cm wide, often subfalcate, glabrous inside and out, the lobes 5, oblong, ca. 1.5 cm long, ca. 1.2 cm wide, glabrous; stamens 5, the anthers oblong, ca. 11 mm long, 2 mm wide, obtuse, the filaments short, ca. 1 mm long; style linear, ca. 5.5 cm long, ca. 0.9 mm wide, the stigmas about as wide as the style, to 12 mm long, villose. Fruits sessile, narrowly oblong, 5(-7) cm long, 0.4-0.9 cm wide, truncate or rounded, smooth, glabrous, lignose; seed ca. 2 mm long with a tuft of tawny hairs to 12 mm long.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 11741
          archiveSourceId: 21E2BCD2-6335-49A4-AF33-FEBB249C3BE1
