        usage:
          title: Columnea polyantha (Wiehler) L.E.Skog, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Woody herbs or shrubs, stems to 1.5 m tall, 0.7-1.0 cm in diam., brown purplish tomentose. Leaves of a pair unequal, the larger leaf oblanceolate, 10.3- 22.5 cm long and 2.3-4.5 cm wide, acuminate, oblique at the base, serrate, adaxially hirsute tomentose, the hairs fine and reddish, 7-10 celled, also 2-3 celled white adpressed hairs, abaxially hirsute tomentose, the hairs green or reddish, fine, 5-8 celled, lamina green above and beneath but with reddish cast from vestiture; petioles ca. 2 mm long; smaller leaves caducous, to 2.5 cm long. Inflorescences axillary, cymose; bracts 5-10 mm long, linear, brown purple, tomentose, the pedicels to ca. 2 cm long, long brown tomentose. Flowers in clusters of 3-6; sepals lanceolate, ca. 8 mm long and 1 mm wide, acuminate, brown tomentose; 3-4 toothed, the teeth linear, to 1 mm long; green, corollas yellow with crescentric red marks on the lobes, funnel shaped but a little swollen, 3.7-4.3 cm long, ca. 3 mm in diam. above the base, becoming ca. 9 mm in diam., the throat contracted to ca. 5 mm in diam., the lobes slightly unequal, spread- ing, ca. 4 mm long, externally transparent and reddish pilose; filaments glabrous, yellow, the anthers exserted, 2 mm long and 1.5 mm wide; disc gland bilobed, the style yellow, glabrous, the stigma stomatomorphic. Fruits not seen.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 6205
