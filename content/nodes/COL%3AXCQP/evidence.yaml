        usage:
          title: Columnea panamensis C.V.Morton, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Suffrutescent herbs or low shrubs, epiphytic; stems fleshy, 5-7 mm in diam., reddish, pubescent, when older drying orange, the nodes prominent. Leaves of a pair subequal, elliptic, 3.2-6.0 cm long and 1.3-2.1 cm wide, the apex more or less acute, cuneate at the base, entire, green above and pilose tomentose, the hairs transparent, brown or reddish, 4-5 celled, below green, appressed pilose tomentose, the hairs transparent, brown or reddish, 3-6 cells, more numerous on the veins; petioles 5-10 mm long. Flowers solitary; bracts 2-3 mm long; pedicels 10-13 mm long, white to dull orange tomentose; calyx lobes lanceolate to oblanceolate, 1.2-1.7 cm long, acute, entire, green with reddish margins and tips, reddish brown pilose tomentose; corollas scarlet with orange flush along the anterior side of the tube, funnelform but strongly zygomorphic, 6.6-7.1 cm long, ca. 4 mm in diam. above the base, becoming 11 mm in diam. at the throat, externally pilose tomentose, the lobed portion of corolla 3.1-3.6 cm long, the lobes strongly unequal, the posterior pair connate, entire at the apex, ca. 1.8 cm long, the anterior lobe 1.4-1.8 cm long, spreading; filaments red or reddish, glabrous above, glandular pilose below, the anthers exserted; ovary white villous, the style pilose glandular, reddish or yellow, the stigma stomatomorphic. Fruits depressed globose, 1.3 cm long, 1 cm in diam., white.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 6193
