    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Finely leafy, aromatic shrub to 1 m, branching from a woody caudex. Leaves short-petiolate, ascending, linear-elliptic, mucronate. Flowers in small, terminal clusters on short racemes, white.
            sourceIds:
              - sanbi_14402_0
            locator: "SANBI/WFO archive Morphology row 11405; source 14402.0; publication: Manning, JC; Goldblatt, P. 2012. Rutaceae: Diosma L. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 718 - 719. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Diosma aspalathoides is considered to be a distinct species being a shrub with several stems arising from a stout persistent subterranean lignotuber, glabrous in most parts; having leaves short-pedicellate, round-backed or two-ribbed when dry with two rows of gland dots, the upper leaves usually recurved at the apex with a blunt point; having flowers pedicellate, about 10 mm diam., with petals more than 2.5 mm diam. and the disc 4 mm diam. It differs from D. pedicellata which has leaves with a straight point and a narrow midrib when dry and flowers in slender reduced racemes, 7 mm diam. with petals less than 2.5 mm broad. It differs from D. acmaeophylla which has sessile leaves.
            textZh: SANBI 条目提供了该种的鉴别特征。
            sourceIds:
              - sanbi_2849_0
            locator: "SANBI/WFO archive Diagnostic row 64065; source 2849.0; publication: Williams, IJM. 1982. Studies in the genera of the Diosmeae (Rutaceae): 14. A review of the genus Diosma L. J. S. African Bot. 48(3): 329 - 407. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
