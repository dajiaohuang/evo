        usage:
          title: Spachea membranacea Cuatrec., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Slender trees, to 10 m tall; sap often somewhat milky; young stems, petioles, inflorescence branches, and midrib of leaf strigose with ferruginous, T-shaped trichomes. Leaves opposite, ovate-elliptic to oblanceolate, long-acuminate, rounded or shortly. cuneate at the base, 4-18 cm long, 1.5-6.0 cm wide, glabrate except for the midrib above and below, with several round glands below, usually 1 on each side of the midrib below and others sometimes scattered throughout the blade, the margin entire, pubescent, revolute in age; petioles 6-9 mm long; stipules connate, minute, ovate, axillary. Inflorescences of long, pendent, axillary racemes 10-20 cm long, longer than the leaves, the axes and peduncles sparsely ferruginous-pubescent with appressed, T-shaped trichomes; axis slender, flex- uous; bracts ovate-oblong, acute, ca. 1.5 mm long, united to the peduncle at the base; pedicel 1-flowered, 2-5 mm long, bearing 2 small bracts midway and 5 inconspicuous glandular appendages at the apex; peduncle 5-10 mm long, pink. Flowers 8 mm diam.; calyx 8-glandular, the sepals oblong-elliptic, ca. 2.5 mm long, thickened toward the apex, puberulent or glabrescent, acute to rounded and reflexed at the apex, ciliate, the glands white, prominent, 2.5-3.0 mm long, nar- rowed and curved outward at the apex; petals clawed, magenta, obovate, ca. 4 mm long, ciliate, spreading, the base attenuate, the margins weakly denticulate, the claw thick, 1.0-1.5 mm long; stamens 10, ca. 2 mm long, shorter than the sepals, subequal, the anthers elliptic-oblong, glabrous, ca. 1 mm long, the fila- ments ca. 1 mm long, hirsute at the base; pistil 2-parted, each ovary with a slender, persistent, divergent style, longer than the ovary, the apex truncate, thickened, held at about the level of the anther. Fruit a coriaceous schizocarp of 2 separable, 1-seeded carpels, each carpel indehiscent, ovoid, 3.5-5.0 mm long and ca. 2 mm wide, with a thin fleshy red covering at maturity; seeds hemi- spheroid, tan, smooth, ca. 4 mm long.
