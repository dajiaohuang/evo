          quoteLocator: Origin of modern whales; Mysticeti and Odontoceti discussion
    - subjectId: taxon:neoceti
      claimKind: scientific
      claimType: fossil-range
      statement: neoceti is displayed at 36–0 Ma only as a synthesis-bounded crown-whale navigation envelope, not a directly observed crown split. The interval is a source-bounded sample window, not a global FAD, LAD, divergence date, continuous occupancy claim or direct-ancestor assertion.
      confidence: medium
      confidenceRationale: neoceti uses Uhen, M.D. (2010) because the cited pages and locator expose the sampled taxon, specimen or living sequence set. Confidence is medium and applies only to Eocene–Oligocene fossil evidence through living Neoceti synthesized by Uhen; broader endpoints remain unclaimed.
      referenceLinks:
