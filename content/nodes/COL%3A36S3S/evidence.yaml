    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants slender, 250-500 mm tall; basal sheaths several, hyaline, obtuse, 10-30 mm long; leaves cauline, 3-8, imbricate or lax, lanceolate, up to 120 x 15 mm near the base. Inflorescences lax, 10-30-flowered; bracts generally as long as the ovary to rarely longer. Flowers horizontal, pale violet to blue to mauve, lip apex yellow. Median sepal erect, rotund, galea 7-9 x 5.5-9 mm wide x c. 3 mm deep, wide open; spur conical, subacute, laterally flattened, straight, c. 3 mm long; lateral sepals spreading, oblong to obovate, flat with a slight apical keel and apiculus, 7-9 x 4-6.5 mm. Petals erect, obliquely oblong, 3.5-4.5 x 1-1.5 mm, basal anticous lobe flanking the anther, 1-2 mm tall. Lip oblong, rounded, 3.5-4.5 x 1-2 mm, with 2 side lobes at the base curved up over the stigma. Anther 1.5-2 mm long; stigma flat, tripulvinate, almost square, shortly stipitate; rostellum erect, fused to the petals by keels almost as tall as the shallowly canaliculate, c. 2 mm tall lateral lobes, central lobe obsolete.
