        claims:
          - text: Loosely tufted annual 100-200(-300) mm high, culms geniculate or erect. Leaf blade 30-90 x 3-8 mm. Inflorescence 20-80 x 10-25 mm; soft, silky. Bisexual/fertile spikelet to 2 mm long, 1-2-flowered; pedicel 2-3 mm long, villous; lemma awned from below apex, awn up to 2 x length of body; anther 0.5-0.6 mm long. Sterile spikelet 6-9 mm long, awnless, consisting of two glumes and numerous imbricate, obtuse, empty lemmas.
