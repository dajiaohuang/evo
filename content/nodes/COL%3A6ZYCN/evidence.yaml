        claims:
          - text: Bulbous geophyte, 120-200 mm tall, forming clumps. Leaves 2 or 3, emerging at flowering, strap-shaped, recurved to spreading, not in a fan, thin-textured, light green, smooth. Flowers funnel-shaped, shell pink, drooping, stamens included. ?May.
            textZh: Strumaria prolifera Snijman 的 SANBI 物种条目记录了形态特征。
            sourceIds:
