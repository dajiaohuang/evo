            locator: "SANBI/WFO archive Morphology row 32854; source identifier 14528.0; cited publication: Snijman, DA. 2013. Amaryllidaceae. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 33 - 42. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Strumaria prolifera is easily recognized by its pink, funnel-shaped flowers, which enclose the stamens. Only two other species have similarly shaped flowers with short, included stamens, namely S. barbarae Oberm. from southern Namibia and the eastern Richtersveld, and S. pubescens W.F.Barker from the Roggeveld escarpment and Laingsburg District. Based on the stamen and style morphology, S. prolifera shows greatest affinity with S. barbarae, which belongs to subgenus Strumaria. In both species the filaments form a proximal tube up to 3-5 mm long and through the fusion of the outer stamens to the three-winged style base, the tube is divided into three separate hollows, where nectar collects from the peristylar pores on the ovary dome. Thus insects seeking nectar are forced to probe each hollow consecutively. Moreover, both species have drooping, scented flowers. The perigone in S. barbarae, however, is longer (28-38 mm) and mostly white when fresh, unlike the shorter (18-20 mm long), distinctly pink perigone in S. prolifera. More divergent is S. pubescens, belonging to subgenus Gemmaria, that has spreading to erect flowers in which all six stamens are adnate to the narrowly trigonous style base. Nectar therefore discharges and collects as three small droplets in the sinuses between the inner filaments and style.
