  claims:
    - subjectId: taxon:buriolestes_schultzi
      claimType: taxonomy
      claimKind: scientific
      statement: Buriolestes schultzi is based on articulated holotype ULBRA-PVT280, and the study recovers it among sauropodomorphs in its sampled morphology matrix; the matrix placement is not evidence of direct ancestry.
      confidence: medium
      confidenceRationale: "The holotype is directly documented, while phylogenetic placement depends on character coding, taxon sampling and analysis settings. Buriolestes schultzi: For the species-level page, this assessment applies to the named species and its cited diagnosis; it does not imply a broader genus sample."
      referenceLinks:
        - referenceId: cabreira-2016-buriolestes
          relation: supports
          pages: 3090–3095
          figure: Figures 1–2; Figure S3
          quoteLocator: Systematic palaeontology; phylogenetic analysis
    - subjectId: taxon:buriolestes_schultzi
      claimType: biogeography
      claimKind: scientific
      statement: This profile's geographic statement is limited to the Candelária Sequence of the Santa Maria Formation in Rio Grande do Sul, Brazil, where the holotype was collected; it does not assert a global distribution.
      confidence: high
      confidenceRationale: "The locality and formation of the holotype are recorded directly, but a single source-bounded occurrence cannot establish genus-wide distribution. Buriolestes schultzi: For the species-level page, this assessment covers the cited occurrence or localities only and does not estimate a complete range."
      referenceLinks:
        - referenceId: cabreira-2016-buriolestes
          relation: supports
          pages: 3090–3095
          figure: Figure 1; Figure S1
          quoteLocator: Locality, geological setting and holotype description
    - subjectId: taxon:buriolestes_schultzi
      claimType: morphology
      claimKind: scientific
      statement: Holotype ULBRA-PVT280 includes a partial skull, axial skeleton, forelimb and nearly complete left hind limb, and preserves recurved, serrated teeth; these observations are limited to the named specimen.
      confidence: high
      confidenceRationale: "The specimen inventory and dental morphology are described and illustrated directly in the primary study. Buriolestes schultzi: For the species-level page, this assessment covers the characters observed in the cited specimens; unsampled variation remains outside it."
      referenceLinks:
        - referenceId: cabreira-2016-buriolestes
          relation: supports
          pages: 3090–3095
          figure: Figures 1 and 3; Supplemental Experimental Procedures
          quoteLocator: Systematic palaeontology; tooth morphology and dietary character coding
    - subjectId: taxon:buriolestes_schultzi
      claimType: ecology
      claimKind: scientific
      statement: The recurved, serrated teeth of ULBRA-PVT280 are compatible with faunivory in the study's character-based reconstruction; habitat, locomotion, body size and guild remain bounded comparative interpretations rather than observed behaviour.
      confidence: medium
      confidenceRationale: "Dental morphology is directly documented, while diet and the remaining ecological fields depend on comparative coding, reconstruction and the sampled topology. Buriolestes schultzi: For the species-level page, this assessment covers only ecological inferences tied to the cited specimens; unmeasured fields remain unassigned."
      referenceLinks:
        - referenceId: cabreira-2016-buriolestes
          relation: supports
          pages: 3090–3095
          figure: Figure 3; Supplemental Experimental Procedures
          quoteLocator: Tooth morphology; character-state and diet reconstruction
  claim-rationales.zh:
    - 正模有直接记录，而系统位置依赖性状编码、类群取样和分析设定。 Buriolestes schultzi：本种级页面的判断仅适用于所引材料中的该种及其描述，不表示存在更广泛的属级样本。
    - 正模的地点和地层有直接记录，但单一受限出现不能建立属级的全球分布。 Buriolestes schultzi：本种级页面的判断仅覆盖所引化石记录或地点，不据此估算完整分布。
    - 论文直接描述并图示了标本组成和牙齿形态。 Buriolestes schultzi：本种级页面的判断仅覆盖所引标本中观察到的性状；未取样的种内变异不在此结论内。
    - 牙齿形态有直接记录，而食性及其余生态字段依赖比较编码、重建和所采样的系统树。 Buriolestes schultzi：本种级页面的判断仅覆盖与所引标本相关的生态推断；未测量字段继续保持未指定。
  claim-statements.zh:
    - Buriolestes schultzi 以关节相连的正模标本 ULBRA-PVT280 为基础，研究在所采样的形态矩阵中将其恢复为蜥脚形类成员；该矩阵定位不是直接祖先关系的证据。
    - 正模标本 ULBRA-PVT280 包含部分头骨、中轴骨骼、前肢和近乎完整的左后肢，并保留后弯且具锯齿的牙齿；这些观察仅限于该标本。
    - 本档案的地理说明仅限于正模标本采集地——巴西南里奥格兰德州 Santa Maria 组的 Candelária 层序，不代表全球分布。
    - 在该研究基于性状的重建中，ULBRA-PVT280 后弯且具锯齿的牙齿与取食动物相符；生境、运动方式、体型和生态功能类群仍属于受研究范围限定的比较解释，而非直接观察到的行为。
