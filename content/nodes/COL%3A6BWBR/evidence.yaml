          - text: "Bulbous herb, up to 500 mm high. Leaves 3 or 4; present at flowering; blade linear, ± 400 x 5-10 mm, narrowing gradually to both ends. Flowers: in a 6-9-flowered umbel; perianth with tube slender, gradually dilated to throat, 55-65 mm long, lobes broadly ovate, 6-7 x 5 mm, outer 3 with an inflexed apiculus, dull yellowish green; Sep.-Dec. Fruit a 3-valved capsule."
