      lifeHistory:
        status: not-assessed
      ecology:
        status: partially-supported
        claims:
          - text: It occurs mainly on the north-western aspect of the slopes, or on top of the Ubombo Mountains, at an altitude of 300 to 800 m. In its distribution range the annual rainfall varies between 800 and 1400 mm and is recorded during the summer months, mainly as thunder storms. The summers are hot and humid. H. limifolia grows mainly in rocky shale outcrops, often enjoying full sunshine for most of the day, with some shade being provided by the grass amongst which it grows. On the upper regions of the mountains the plants are often sheltered by scattered loose stones and rocks, in pockets and rock crevices, often with another rock partially overlapping and providing shade. At the higher altitudes the plants occur on the edge of the mist belt, and this additional supply of moisture results in plants which are somewhat different from those growing in the lower drier region. H. limifolia prefers a soil of pH 6.2.
