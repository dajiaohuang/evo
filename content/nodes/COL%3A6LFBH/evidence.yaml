    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants acaulescent, with leaves in a basal rosette up to 12 mm diam., proliferous from the base and forming clusters. Leaves up to 20, the young erect, more or less recurved, the old spreading, 3 to 10 cm long, 2-4 cm broad, up to 6 mm thick, ovate to lanceolate, or triangular sharply tapering, with a pungent tip; upper surface flat to concave, with transverse callosites, with raised confluent concolorous shining tubercles arranged in undulated transverse rows, often with raised longitudinal lines; lower surface convex, similar to the upper surface; keel 1, centrally or obliquely arranged in the upper third of the leaf, tubercled, or with transverse callosites; margins upcurved, acute, rough. Inflorescence up to 35 cm tall; peduncle simple, about 2 mm diam., up to 20 cm long, bracteate; sterile bracts membranous, ovate, acuminate, about 7 mm long, erect, keeled; raceme up to 15 cm long, lax, with about 12 to 25 spirally or secundly arranged flowers and buds, 1(-4) open simultaneously; floral bracts membranous, about 3 mm long, deltoid, acute, keeled with pinkish to reddish veins, clasping the pedicels, (shorter than the pedicels); pedicels up to 6 mm long, up to 1 mm diam., green, erect; perianth straight, about 14 mm long, white, with grey-brown or green keels to the segments, compressed at base, funnel-shaped, tube more or less 3.5 mm across, constricted to 2.5 mm above; segments closely cohering, limb 2 lipped; posterior segments erect or recurved, white with grey-green or brown-green veins; exterior part recurved, spreading, with brown veins; stamens 6 of two lengths, 5 and 6 mm long, inserted within the perianth tube; ovary 2.5 mm long, 1.5 mm diam., green; style 3 mm long, curved, yellow-green, capitate.
