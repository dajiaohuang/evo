        usage:
          title: Citharexylum macradenium Greenm., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Tree, to 20 m tall with rounded crown; trunk to 25 cm in diameter at the base; bark gray, roughened by raised oblong strips; branchlets stout, acutely tetragonal, more or less 4-margined, light-gray, glabrous; twigs and young shoots slender, more or less acutely tetragonal, glabrous, shiny, drying dark; leaf-scars on short ascending sterigmata 1-3 mm long. Leaves opposite, or subopposite on vigorous shoots, easily detached from the stem, firmly chartaceous, entire, lanceo- late or narrowly oblong to elliptic, 7-16.5 cm long, 1.7-4.2 cm wide, apically acute or short-acuminate, cuneately narrowed at the base, often infundibularly involute into the petiole and just above the base bearing (1-) 2(-3) extremely large, thick, black glands to 4 mm long, one of which is often terminated by a discoid stigma- like body, bright-green on both surfaces, drying dark, glabrous and densely impressed-punctate on both surfaces, but not shiny, vein reticulation sparse, mostly obscure; petioles slender, 1.1-2.7 cm long, subterete or sulcate above, glabrous, nigrescent in drying. Racemes terminal 8.5-19.5 cm long, 1-1.5 cm wide, simple or with a pair of lateral branches near the base, densely many-flowered mostly erect, sometimes recurved; peduncles stout, 2-2.5 cm long, acutely tetrag- onal, glabrous, often with 1 or 2 bractlet-bearing nodes; rachis slender or stout, angled or ribbed, glabrous; pedicels slender, 1-1.5 mm long, glabrous, in fruit to 5 mm; bracts and bractlets caducous; prophylls setaceous, ca. 1 mm long. Flowers with the calyx cupuliform, ca. 2.5 mm long, 5-angled in cross-section, apically subtruncate, minutely 5-denticulate; corolla white, tubular-infundibular, the tube ca. 4 mm long, glabrate outside, pubescent in the throat, the lobes oblong, ca. 2 mm long, puberulent on both surfaces; style puberulent. Fruit lustrous, orange to orange-yellow or white, subglobose or round, 2-sulcate, 6-10 mm in diameter, fleshy when mature, bony when immature, glabrous; fruiting-calyx subpatelliform, ca. 2.5 mm long and 6 mm wide, 5-ribbed, glabrous, the rim irregularly and shallowly erose.
