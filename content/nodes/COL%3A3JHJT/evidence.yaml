        usage:
          title: Hamelia xerocarpa Kuntze, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrubs or small trees, the branchlets ultimately angular, scarcely lenticellate, villous. Leaves ovate to elliptic, 8-37 cm long, 4-14 cm wide, acuminate, atten- uate to rounded at the base, the lateral veins 11-18, chartaceous, pilose above, sericeous along the veins, especially in the axils; petioles 0.8-7.0(-8.5) cm long, villous; stipules triangular, 7-17 mm long, cuspidate, often with 2 reduced lateral teeth, glabrate. Inflorescences terminal, of dichasia or scorpioid cymes; pedun- cles 1.5-5.5 cm long, villous, the floral axes to 15 cm long, ascending, often ferrugineous pilose, the flowers secund, ca. 25 on each axis, pedicels to 0.2 cm long. Flowers with the hypanthium 3-4 mm long, glabrous to spreading pilose; calycine lobes ovate, 1-2 mm long, glabrous to pilose; corolla yellow salverform, to 3.5 cm long, the tube 0.4-0.7 cm wide, glabrous to densely puberulent, the lobes ovate, 4-8 mm long, acute; anthers 10-16 mm long, acute, the connective extended for ca. 0.1 mm at the apex, acute, sagittate at the base, the filaments 8-15 mm long; ovary 5-loculate, the style ca. 20 mm long, the stigmas 5, to 5 mm long.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 11717
          archiveSourceId: 240A4DEE-C9F3-47C3-9B78-9D30BC39F50C
