    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants solitary or few-stemmed. Leaves erect, soft in texture, dull green, 400-600 x 15-25 mm, deeply keeled, hirsute along nerves on both surfaces; margin conspicuously and regularly serrulate. Scape equal to or longer than leaves, 450-600 mm long. Raceme shortly rhomboid-cylindrical to ovoid, dense, 80-120 x 40-45 mm; buds orange or dull coral to salmon-pink tipped with green; flowers pendulous, dull greenish yellow. Bracts linear-lanceolate, acuminate, 10-14 mm long; margin minutely denticulate to subentire. Pedicels 2-4 mm long. Perianth subcylindrical, 22-27 mm long; lobes ovate, 2.5 mm long, not spreading. Stamens not or scarcely exserted at anthesis. Fruit subglobose, 7-9 mm long.
            textZh: Kniphofia hirsuta Codd 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_6616_0
            locator: "SANBI/WFO archive Morphology row 49834; source identifier 6616.0; cited publication: Codd, LEW. 2005. Asphodelaceae (First part): Kniphofia, Fl. S. Africa 5(1,2): 1 - 94. South African National Biodiversity Institute, Pretoria. [http://www.biodiversitylibrary.org/item/209560#page/3/mode/1up]. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: K. hirsuta resembles the following species, K. ritualis, in raceme, bract and perianth characters but is unique in the genus in having pubescent leaves. The only other species which approaches it in this respect is K. stricta which usually has scabrid papillae on the nerves.
