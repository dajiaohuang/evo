        usage:
          title: Salix humboldtiana Willd., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrubs or trees to 15 m tall; branches slender, flexuous, puberulent with weak spreading hairs, drying with reddish bark, the youngest growth drying yellowish. Leaves linear-lanceolate, 5-6 cm long, 4-4 mm wide, apically acute, basally obtuse, the margins serrate with low callose-glandular teeth, glabrous beneath, the costa pilose to puberulent and glabrescent above, the costa prominently elevated beneath, plane above, the surface finely rugose above, the minor venation not evident, beneath the minor venation slightly elevated, differing in texture from above, the lateral veins ill-spaced, more or less arcuate, forming a well- defined submarginal vein ca. 0.5 mm from the margin; petiole slender, 3-5 mm long, deeply canaliculate above, pubescent; stipules subfoliaceous, dentately 3-4 mm long, deciduous. Inflorescences lax racemes (aments, catkins) terminal on short lateral shoots, 3-10 cm long, the flowers congested at anthesis, slightly more distant in fruit, the rachis angled, short-pilose near the base with several foliose basal bracts with reduced stipules; bracteoles 1-2 mm long, ovate, densely ciliate; pedicels obsolete. Flowers (female) with the gland deeply 2-lobed, ca. 0.3 mm long, slightly reddish; ovary narrowly ellipsoidal, stipitate, the stipe 0.5-1.0 mm long, in fruit becoming 1 mm long and resembling pedicels, the stigmas 4 in 2 pairs, digitate. Fruit ovoid to ellipsoidal, ca. 6 mm long, drying brownish; seeds ca. 1 mm long, compressed trapezoidal, long pubescent (comose) with white hairs. Male flowers were not seen.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 12468
          archiveSourceId: 1DE9D016-1150-4C75-8BF6-94CF13481F04
