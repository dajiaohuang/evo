        usage:
          title: Ardisia megistophylla Lundell, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrubs, 2 m high, furfuraceous, branchlets thick. Leaves large, with thick canaliculate petioles conspicuously marginate to the base, the petioles to 4.5 cm long; leaf blades paler beneath, chartaceous, elliptic or oblanceolate- elliptic, to 130 cm long and 18 cm wide, narrowed apically, probably short- acuminate, attenuate and decurrent on the petiole basally, densely covered beneath with closely appressed brownish scales, the midvein impressed above, prominent beneath, the primary lateral veins numerous, slender but conspic- uous on the undersurface, less evident above, the nerves almost at right angles to the costa, the intermediaries well developed, the margin entire. Inflorescences terminal, paniculate, to 25 cm long, with thick peduncle and rachis, furfuraceous. Flowers 5-merous, glomerate, the short thick pedicels ca. 2 mm long; sepals lepidote, ovate-elliptic, to 2 mm long, rounded apically, the margin erose-ciliate but this not always evident, punctate with conspicuous black rounded glands; ovary glabrous, the ovules pluriseriate, numerous. Fruit depressed-globose, 6-8 mm in diameter.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 8264
