      ecology:
        status: partially-supported
        claims:
          - text: "In a single captive-colony comparison at Jersey Zoo, 16S faecal microbiome profiles from six pied tamarins classified as affected by recurrent diarrhoea and weight loss and 13 unaffected animals showed higher relative abundance of Lactobacillus amplicon sequence variants in affected animals; some Lachnospiraceae and Ruminococcaceae variants were more abundant in unaffected animals. The comparison is exploratory: only six affected samples were sequenced, affected animals were older and had substantially greater lifetime antibiotic exposure, and the study does not establish cause or describe wild populations."
            sourceIds:
              - richardsrios2021
            locator: Methods, Selection of animals and sampling; Results, Number of affected animals and Sequencing effort; Results, Differentially abundant ASVs; Discussion.
            placeTimeScope: Jersey Zoo, Jersey; colony sampling between November 2018 and April 2019. The article classified 8 affected and 13 unaffected animals; two affected samples lacked sufficient DNA, leaving six affected and 13 unaffected animals in the 16S analysis.
            lifeStatus: Captive colony animals; no wild individuals were included.
            originalLanguage: en
        gaps:
          - Small sample from one captive colony; affected animals differed in age and antibiotic exposure. No causal, wild-population, or across-colony inference is supported.
