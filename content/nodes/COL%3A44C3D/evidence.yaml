    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, 20-45 cm. Leaf solitary, clasping lower half of stem, channelled, trailing above. Flowers pale yellow to cream-coloured, tepals claws forming a narrow cup, anthers on a slender filament column, included.
            textZh: Moraea britteniae (L.Bolus) Goldblatt 的 SANBI 物种条目记载了植株、叶片和花部形态。
            sourceIds:
              - sanbi_13878_0
            locator: Strelitzia 29; archive Morphology row 7386, source 13878.0
            placeTimeScope: Regional species account published 2012; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
          - text: Often confused with other single-leaved species of subg. Homeria, Moraea britteniae is immediately recognised by the basal foliage leaf sheathing the lower half of the stem and the creamy white (to pale yellow) flowers. The tepal claws form a narrow cup including the filament column and sometimes the base of the anthers, with the apices of the filaments free for up to 1.5 mm. The ovary is relatively long, 15-24 mm, giving rise to capsules mostly 25-45 mm long. The apically free filaments and leaf sheathing the stem for some distance correspond with the critical features of the M. cookii-M. pallida group, although the long floral cup is unknown elsewhere in the group.
            textZh: SANBI 条目提供了 Moraea britteniae (L.Bolus) Goldblatt 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: Strelitzia 42; archive Diagnostic row 94283, source 18638.0
            placeTimeScope: Regional species account published 2020; the archive excerpt does not give a dated sampling frame or population frequency.
