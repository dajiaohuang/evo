        usage:
          title: Clusia liesneri Maguire, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrub or tree to 15 m tall, often epiphytic; twigs often angled. Leaves obovate, 7-12 cm long, 4-5 cm wide, apically blunt, rounded or obtuse, basally narrowed into the short petiole, the lateral veins strongly ascending, prominent and distinct above, prominent but sometimes indistinct beneath, often drying discolorous, slatey above, green or lighter beneath, subcoriaceous; petioles distinct but short, ca. 5 mm long. Inflorescences cymose paniculate, short; peduncles 1-2 cm long, angled, bracts wanting, bracteoles conspicuous, cucullate, 2-3 mm long, the mar- gins thinned and sometimes drying discolorous; pedicels stout, 1-3 mm long, obscured by bracteoles. Flowers with the buds pinkish, sepals (Maguire) 6, de- cussate, concave orbicular; petals 5-6-ribbed; androecium consisting of a dark hemispherical mass of 5-6 filaments, the stamens circular 1-2-seriate, immersed basally and abaxial to this with 6-10 circular reduced anthers immersed in the apex of the androecial mass. Fruit obovoid, apically flat, the stigmas sessile, connivent, partially enveloped by the persistent sepals.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 3306
