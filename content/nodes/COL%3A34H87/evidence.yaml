        claims:
          - text: Glabrum caespitosum; rami prostrati, ad 4 mm. diam., e basi ramulos graciles floriferos emittentes; folia patentia vel recurvata, supra concava, viridia, primaria ad 4 cm. longa, ad 5 mm. lata, saepe medio 3 mm. diam.; i lores saepius solitarii ramulum brevem terminantes itaque inflorescentiam laxam formantes, foliis intermixtis, rarius 3-nati, diurni, corolla demum ad 2.2 cm. diam., vel rarius 2.4 cm.; pedunculi 1.5-2 cm. longi, apice leviter constricti; receptaculum turbinatum, 6 mm. longa, 6 mm. diam., apice leviter contrictum; sepala valde inaequilonga, ad 0.7-1.2 cm. longa, interdum accrescentia; petala 1-2-seriata, in sectione sat densa, subaequilonga, apicem versus interdum leviter ampliata, nivea, ad 9 mm. longa, fere ad 1.5 mm. lata; staminodia late recurvata, basi pallida, deinde rosea, apice acuminata alba, 5 mm. longa; stamina ad 3.5 mm. longa, filamentis pallidus, exterioribus parcissime papilloso-ciliatis, interioribus medio vel supra papillata, antheris luteis; glandulae distantes undulatae; ovarium leviter elevatum, lobis distantibus obtusis, glandulas haud attingentibus; stigmata 5 subulata acuminata, ad 2.25 mm. longa; capsula 8 mm. diam., valvis ringentibus.
