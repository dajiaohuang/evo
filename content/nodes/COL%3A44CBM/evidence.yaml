        claims:
          - text: Cormous herb, up to 0.9 m high. Plants usually in clumps. Leaf flat above, 15 mm wide. Cataphylls usually dark brown and often unbroken. Flowers yellow with deep yellow nectar guides.
            textZh: Moraea spathulata (L.f.) Klatt 的 SANBI 物种条目记载了植株、叶片和花部形态。
            sourceIds:
              - sanbi_11118_0
            locator: Strelitzia 6; archive Morphology row 2797, source 11118.0
            placeTimeScope: Regional species account published 1997; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
          - text: Somewhat variable across its wide range, Moraea spathulata typically forms large tufts, thus it is not unusual to see several flowers open at once. Each flowering stem bears a single broad leaf, shallowly channelled to almost flat. The species can be distinguished by its large yellow flowers, the outer tepals up to 50 mm long, tall stems, and clump-forming habit. Plants flower in late winter and spring along the coast but in summer and autumn inland. The species comprises numerous local races, but owing to the small differences between them, it is difficult to define many of them. Four subspecies were described in Goldblatt (1973) but are not currently recognised.
            textZh: SANBI 条目提供了 Moraea spathulata (L.f.) Klatt 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: Strelitzia 42; archive Diagnostic row 94218, source 18638.0
