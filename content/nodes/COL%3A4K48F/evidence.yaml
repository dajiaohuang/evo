    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Perennial semi-succulent herb up to 0.25 m tall, branching from the base; stems thickened at the base, up to 20 mm or more in diameter, becoming brown and potatolike with age. Leaves petiolate; blade semi-succulent, ovate to broadly ovate, 12-30 x 10-25 mm, sparingly pubescent, under-surface often glandular-puberulous, with pale to reddish brown gland-dots, apex obtuse, base truncate, margin with few, fairly distinct teeth; petiole 6-13 mm long. Inflorescence simple, 30-120 mm long; flowers in sessile, 1-3-flowered cymes, forming 2-6-flowered verticils 10-20 mm apart. Calyx 5-6 mm long in fruiting stage, glandular-hispidulous. Corolla pale bluish mauve to whitish; tube 4-8 mm long, expanding abruptly and forming a saccate base 4-5 mm deep, narrowing gradually to 2 mm deep at the throat; upper lip 4-5 mm long, lower lip concave, 3-4 mm long. Stamens free, of two lengths, upper pair 1.5 mm long, lower pair 3 mm long.
            sourceIds:
              - sanbi_15375_0
            locator: "SANBI/WFO archive Morphology row 50007; source 15375.0; publication: Codd, LEW. 1985. Lamiaceae: 23. Plectranthus. In: OA Leistner (ed.), Fl. S. Africa 28(4): 137 - 172. Botanical Research Institute, Department of Agriculture and Water Supply, Pretoria. [http://www.biodiversitylibrary.org/item/209555#page/9/mode/1up]. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: The swollen, almost potato-like stem bases distinguish P. ernstii from all other species. The flowers are rather like those of P. praetermissus but are smaller and pale bluish mauve in colour.
