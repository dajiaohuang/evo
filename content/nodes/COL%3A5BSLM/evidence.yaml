    facets:
      morphology:
        status: not-assessed
      lifeHistory:
        status: partially-supported
        claims:
          - text: Between 2009 and 2021, researchers compiled 22 egg-laying attempts at eight Ecuadorian nests; 16 recorded nestlings remained in nests for six to ten months before first flight. A single monitored pair had a reported mean interval of 15 months between eggs, which is not a species-wide reproductive interval.
            textZh: 研究者在 2009 至 2021 年间整理了厄瓜多尔八个巢址的 22 次产卵记录；16 只记录到的雏鸟在首次飞行前于巢中停留六至十个月。一个持续监测配对的平均产卵间隔为 15 个月，但这不能代表全种群的繁殖间隔。
            sourceIds:
              - restrepo2024
            locator: Abstract; Results; Table 1; Discussion, egg-laying and nestling period
            placeTimeScope: Eight nests in the Ecuadorian Andes; observations 2009-2021; the 15-month interval is from the Peñón del Isco pair monitored 2011-2021.
            lifeStatus: Wild-born Andean Condors; nest-based observations.
            originalLanguage: en
        gaps:
          - Age at maturity, survival, lifespan, demographic rates, and geographic variation are not synthesized; several observations are non-systematic or from one pair.
      ecology:
        status: partially-supported
        claims:
          - text: At the Ecuadorian nest sites, authors recorded agonistic encounters involving condors and other raptors and a Spectacled Bear; they note that the lack of records at some nests could reflect lower observation effort. These nest-area observations do not quantify the species' broader food-web or scavenging interactions.
            textZh: 在厄瓜多尔巢址，作者记录到秃鹫与其他猛禽以及眼镜熊之间的攻击性遭遇；作者指出，部分巢址未记录到此类事件可能与观察力度较低有关。这些巢区观察并未量化该种更广泛的食物网或食腐关系。
            sourceIds:
              - restrepo2024
            locator: Abstract; Results; Discussion, interspecific interactions and sampling effort
            placeTimeScope: Eight Ecuadorian nest areas; observations 2009-2021, with systematic nest watches at three sites during specified intervals in 2017-2022.
            lifeStatus: Wild-born condors at nest sites; source distinguishes nestling rearing from periods without eggs/chicks.
            originalLanguage: en
        gaps:
          - Diet, carrion use, seasonal habitat use, prey/carrion availability, and interaction frequencies across the full range remain unreviewed.
      evolution:
        status: not-assessed
      distribution:
        status: partially-supported
        claims:
          - text: A 2016 Ecuador study modeled the species' national extent of occurrence as 49,550 km² and area of occupancy as 14,106 km² using 60 roosting-site coordinates from seven satellite-tagged condors and seven environmental predictors at 500 m resolution. These are model outputs for Ecuador, not a global distribution estimate.
            textZh: 一项 2016 年厄瓜多尔研究以七只卫星追踪秃鹫的 60 个栖息点坐标及七项 500 米分辨率环境变量建模，估算该种在厄瓜多尔的分布范围面积为 49,550 平方公里、占域面积为 14,106 平方公里。这些是厄瓜多尔的模型结果，并非全球分布估算。
            sourceIds:
              - kohn2016
            locator: Materials and Methods, Geographic distribution and Gap analysis; Results, Geographic distribution; Fig. 1
            placeTimeScope: Ecuador; model based on 60 roosting sites from seven tagged birds; seven environmental predictors, 500 m spatial resolution; source published 2016.
            lifeStatus: Field observations and satellite telemetry of wild Andean Condors; the model estimates potential distribution.
            originalLanguage: en
        gaps:
          - A current global locality inventory with dates, native/introduced status, spatial uncertainty, unsampled areas, and range-wide reconciliation is incomplete.
      fossil:
        status: not-assessed
      conservation:
        status: partially-supported
        claims:
          - text: The Ecuador-focused 2016 study estimated 94-102 individuals from 93 birds seen in a simultaneous two-day 2015 census, and its population viability scenarios identified habitat loss as the greatest modeled threat in Ecuador. The paper discussed an earlier national Critically Endangered listing but is not itself a current IUCN or national reassessment.
            textZh: 厄瓜多尔专题研究根据 2015 年同步进行的两日普查中记录的 93 只个体，估算该国种群为 94–102 只；其种群生存力情景模型指出，在厄瓜多尔，栖地丧失是模型中最大的威胁。论文提及当时较早的国家级极危列名，但该研究本身不是当前 IUCN 或国家级重新评估。
