    identity:
      method: Pinned COL26.8 hierarchy node 5BSLM was checked for exact accepted name, authorship, species rank, accepted status, and sourceDatasetId against the release registry. Each biological article explicitly names Vultur gryphus; none assigns the COL usage ID, so the record makes no additional synonym or population-to-global concept claim.
      scope: Nominal accepted species usage 5BSLM in COL26.8 (parent 87CF). Source claims retain their study population, locality, and dated evaluation scope; they are not extended to the whole range.
    lifeStatusScope:
      wild: Wild-born condor observations and Ecuador field surveys are identified separately and remain geographically limited.
      domesticated: Captive breeding or released birds are not treated as wild-born samples unless a source explicitly distinguishes them.
      fossil: Fossil material, fossil taxonomy, and geological age have not been assessed.
