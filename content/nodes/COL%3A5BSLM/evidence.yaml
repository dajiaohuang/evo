            zh: 厄瓜多尔八个野生出生神鹫巢址的一手观察：2009–2021 年繁殖记录，以及三处巢址在 2017–2022 年内指定时段的系统观察。平均产卵间隔来自 2011–2021 年监测的一个配对。支持局地筑巢与巢区遭遇记录，不代表全种人口学参数或完整食物网。仅转述事实并引用；不再分发来源图表或文章原文。
