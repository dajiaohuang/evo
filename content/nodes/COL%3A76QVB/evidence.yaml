          originalSourceText: A sparsely hairy or glabrate, creeping or sometimes scandent herb; stems 2-3 mm. thick, rooting at the nodes; leaves alternate, elliptic-ovate, 4-5 cm. wide X 7-8.5 cm. long, apex acuminate, typically rounded at the base and sometimes cordulate or barely subpeltate, drying rather thin and dull, sparsely hairy beneath when young, or glabrous on both sides, ciliolate towards the apex, 9-plinerved with the nerves coalescing below the middle; petiole 3-5 or sometimes even 9 cm. long, glabrous or somewhat ciliate; spikes 3-5 cm. or more long, mostly paired at the ends of terminal or axillary stalks 3-4 cm. long; peduncle scarcely 2 cm. long; bracts round-peltate; fruit ellipsoidal, rostrate, stigma at the base of the beak.
