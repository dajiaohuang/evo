            en: "Publisher abstract only: the 2017 paper reports that Centrophorus lusitanicus should be treated as a junior synonym of C. granulosus; it separately states that the London specimen then considered a syntype should not be considered a syntype and was likely not originally collected off Portugal. Correspondence between the paper's taxonomic concept and assigned COL26.8 accepted record remains unresolved."
