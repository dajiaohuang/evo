        usage:
          title: Myristica fragrans Houtt., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Aromatic, dioecious, glabrate trees to 20 m. high, the older bark rather smooth and olivaceous, mottled with white, the younger branches often mottled with red. Leaves subcoriaceous, glabrous, lanceolate to ovate or obovate, apically acute to acuminate, basally acute, 6-12 cm. long, 3-6 cm. broad, with usually 6-11 pairs of secondary veins, the tertiary nerves obscure, not conspicuously perpendicular to the midrib, the petioles 5-15 mm. long, ca. 1 mm. broad. Staminate flowers 1 to few in dichotomous cymes; pedicels glabrous, 5-15 mm. long; bracts ca. 1 mm. long; perianth tardily 3-parted, 3-7 mm. long; anthers 12-30, 2-3 mm. long, dorsally co- herent to the column, the infra-antheral portion of the column 1-2 mm. long. Pistillate flowers solitary or rarely paired in the axils; pedicels glabrous, 5-15 mm. long; bracts ca. 1 mm. long; perianth accrescent, tardily 3-parted, the segments del- toid, the subsessile stigma obscurely 2-lobed. Fruit fleshy, ovoid to pyriform, the pericarp splitting longitudinally into 2 valves, 3-6 cm. long, 2.5-4.5 cm. broad; seed 1.5-4.5 cm. long, 1.0-2.5 cm. broad, the laciniate aril reddish.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 8142
          archiveSourceId: 49854D32-B4B6-4644-A48E-57BFF5A5CAEE
