          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Trees. Leaves elliptical-oblong, rounded or subcordate at the base, mostly obtusely acuminate at the apex, 10-24 cm. long and 4-11 cm. wide, chartaccous, glabrous, aromatic. Inflorescence terminal or lateral, in the first case often many-flowered, the flowers usually in clusters of 3. Receptacle cup-like, produced above the ovary, about 12 mm. high. Sepals 4, semi-orbiculate, glabrous, about 4 mm. long. Petals and stamen filaments yellowish white, the petals about 1 cm. long, concealed by the elongate stamens. Berry pear-shaped or subglobose, about 3-5 cm. long, pinkish or white, carnose, insipid.
