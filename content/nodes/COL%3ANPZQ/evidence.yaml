    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plant perennial, acaulescent herb arising from a tuberous base; tuber napiform, hypogeal, 15 x 8 mm with several slender roots. Leaves up to 3, base with an upright, short petiolate membranous extension up to 2 x 2 mm, lamina prostrate, suberect to erect-falcate, turgid, very succulent, present at anthesis but almost entirely buried; outer leaves ovate to narrowly ovate, concavo-convex, acute, aristate, longest up to 10.0 x 7.5-4.5 mm broad and 4.5 mm thick, occasionally a fourth, central, erect leaf present, lanceolate acute ca. 3 x 2 mm. Inflorescence single, erect, terete, wiry; peduncle up to 115 x 0.6 mm; raceme 50 x 30 mm, lax, rhachis occasionally flexuose. Flowers up to 9, slightly nodding. Bracts paperaceous, white, transparent, overall 1.6 x 0.8 mm at broadest point, basal half ± square with upper corners spreading outwards, outer half narrowly triangular, apex acuminate. Pedicels 8.0 x 0.4 mm, erecto-arcuate. Tepals with outer whorl sharply reflexed, inner whorl not as sharply reflexed as outer; outer tepals elliptic 6.2 x 1.8 mm, inner ovate 6.2 x 2.8 mm. Stamens patent with lower outer recurved; all filaments slender, terete 4 mm long; hairs 1.0-1.4 mm, clavate; outer filament hairs clustered on apical third, all patent towards anther, inner filament hairs clustered in middle two-thirds all patent outwards from outer margin of filament; anthers ellipsoid 0.6-0.4 mm. Ovary obovoid 1.0 x 0.8 mm, style terete 3.6 x 0.2 mm, stigma swollen and projecting beyond anthers. Capsule 3.0 x 2.8 mm, ± spherical, farinose with loculicidal dehiscence; seeds 0.8-1.5 x 1.0-1.2 mm, sub-deltoid to deltoid, tuberculate-pusticulate with a narrow membrane running along the margin angles, shiny black.
