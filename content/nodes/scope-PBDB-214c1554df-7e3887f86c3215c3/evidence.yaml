  claim-rationales.zh:
    - 晚始新世原鲸科成员的分类表述只覆盖具名标本及所引主研究的分析范围；导航归属不表示直系祖先或普适系统树。
    - 晚始新世原鲸科成员的地理字段只投影主研究记录的具体产地，不外推为全球分布、起源中心或完整扩散路径。
    - 晚始新世原鲸科成员的生态字段区分保存事实与功能推断；未被标本直接记录的饮食、行为、栖息地或性能均明确保留不确定性。
    - 晚始新世原鲸科成员的形态字段限定于主研究列明的具名标本和精确页码、图版或补充材料，不外推到整个支系。
    - 晚始新世原鲸科成员的年代范围是主研究标本或地层背景的有界投影，不作为全球首现、末现、分化时间或连续谱系时长。
  claim-statements.zh:
    - CGM 60584 确立了 Aegicetus gehennae，并经 Georgiacetinae 在导航中归入 Protocetidae；这一分类不表示直接祖先。
    - 本资料代表 Wadi Al Hitan 下部 Gehannam 组材料，并不能确定 Aegicetus 的完整分布。
    - 海洋捕食和尾驱游泳属于解剖推断；猎物、运动表现和尾鳍均未被直接保存。
    - CGM 60584 保存了大量关联的躯后骨骼，包括加长的躯干、未融合的荐椎、缩小的四肢以及缺乏承重骶髂关节。
    - 3,771 万年前的展示点是在相互冲突的地层证据下作出的界线换算，并非标本精确年龄、首次出现或末次出现。
