        usage:
          title: Ximenia americana L., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Trees to 7 m. tall, the spines axillary branches, often leafy, usually stout. Leaves ovate, 3-11 cm. long, 2.0-4.5 cm. broad, retuse and mucronulate at the apex, obtuse to cuneate at the base, subcoriaceous, glabrous or bullate, the costa immersed above, emersed below, the primary lateral veins 3-6 pairs, most conspicu- ous towards the base of the lamina; petiole 5-7 mm. long, canaliculate. Inflores- cence umbellate, simple or compound, often fasciculate, multi-flowered, the bracts small, ciliate, caducous. Calyx crateriform, to 0.75 mm. long, about 1.5 mm. in diameter, 3- or 4-toothed, ciliate; petals 4, liguliform, 7-11 mm. long, 1.5-2.0 mm. broad, greatly reflexed, coriaceous, glabrous without, densely covered with red-brown barbed hairs within, white and often purple tipped; stamens 8, sub- exserted, the anthers linear, 3.0-4.5 mm. long, 0.5-0.75 mm. broad, the filaments 3.0-4.5 mm. long, glabrous; ovary long-conical, 3-4 mm. long, 1.0-1.5 mm. in diameter, glabrous, the style 3.0-4.5 mm. long; pedicel 5-6 mm. long. Drupe ellipsoid, 2-3 cm. long, 1.5-2.5 cm. in diameter, pale yellow.
          originalLanguage: en
          sourceField: general
