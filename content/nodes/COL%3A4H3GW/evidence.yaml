        usage:
          title: Phyllanthus compressus Kunth, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Herb, annual or short-lived perennial, up to ca 3 dm high, sparsely to freely branching; monoecious; branches distally flattened and with a sharp wing 0.2-0.25 mm across on each side, ca 1-1.2 mm wide (including wings only 0.7 mm or more wide on secondary branches). Leaves firm in texture; petioles usually less than 1 mm long; stipules auriculate, acuminate, ca 1-2 mm long; blades elliptic, obtusely but distinctly pointed, mostly 6-15 mm long and 2.5-5 mm broad, the primary veins some'times distinct but not prominent, the secondary veins (and sometimes all venation) obscure or invisible. Cymules with usually 1 or 2 male and 1 or 2 female flowers. Staminate flowers with pedicels usually less than 1 mm long; calyx-lobes usually 5, ca 0.5-0.7 mm long and broad; disc-segments 5, entire; stamens 3, the filaments united about halfway (sometimes less), less than 0.5 mm long, the anthers opening ? horizontally; pollen grains oblong, 4-colporate. Pistil- late flowers with pedicels sharply reflexed, less than 1 mm long; calyx-lobes usually 5, ca 0.6-0.8 mm long, obovate; disc annular, entire; ovary smooth, the styles free, bifid, less than 0.4 mm long. Capsules ca 1.7-2 mm in diam; seeds ca 0.9-1 mm long, brownish, verruculose.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 4425
