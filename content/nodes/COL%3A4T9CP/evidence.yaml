        claims:
          - text: Erect or sprawling shrub, up to 1 m tall, resprouting from base, young stems rarely shortly hairy. Leaves petiolate, bifoliolate, leaflets asymmetrical, obovate, thin-textured. Flowers up to 9 per axil, deep yellow with reddish brown markings. Fruit drooping, large, longitudinally angled and 5-winged, wings 5 mm wide.
