    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Erect to procumbent perennial herb, up to 0.6 m high. Leaves thinly textured, often with very acute tip. Inflorescence axis longer than 5 mm, so that inflorescence does not appear to be contracted. Tertiary bracts (2.1-) 2.8-4.2(-4.7) mm broad, windows not clearly differentiated. Corolla tube shorter than 14 mm. Capsule (6.8-)7.1-8.2(-8.4) mm long. Flowers deep purple.
            sourceIds:
              - sanbi_11118_0
            locator: "SANBI/WFO archive Morphology row 1638; source 11118.0; publication: Herman, PPJ; Retief, E. 1997. Plants of the northern provinces of South Africa: Keys and diagnostic characters. Strelitzia 6: 1 - 681. National Botanical Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: D. eenii resembles D. clinopodia, D. minor and D. fruticosa, but differs from D. clinopodia by having longer inflorescence axes and only 1 'umbel' in each axil; from D. minor by having longer inflorescence axes and by having an upright rather than procumbent habit and from D. frulicosa by having a shorter habit and smaller corollas.
            textZh: SANBI 条目提供了该种的鉴别特征。
