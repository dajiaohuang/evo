        usage:
          title: Gonolobus albomarginatus (Pittier) Woodson, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Herbaceous or subligneous vines; stems slender, sparsely to densely pubescent, the hairs stiff, spreading. Leaves ovate to oblong-ovate, apically acuminate, deeply cordate at the base, short strigose to glabrate on both sides, 6-16 cm long and 3-8 cm wide; petioles glabrate to short pubescent, 3-6 cm long. Inflores- cences umbelliform racemose, fewer than 10-flowered, puberulent throughout; peduncles 1-2 cm long; pedicels 2.5-4 cm long. Flowers with the calyx divided to the base, the lobes lanceolate to linear-lanceolate, pubescent outside, glabrous within, 8-15 mm long and 2-4 mm wide; corolla green with darker reticulations inside, rotate, 2.5-4 cm in diameter, the lobes lanceolate, acute, 15-25 mm long and 3-5 mm wide, puberulent outside, glabrous inside except for a band of dense white papillae along one margin, the faucal annulus a prominent ridge of corolline tissue nearly 1 mm high, ciliate throughout or in tufts opposite the corolla si- nuses; corona carnose, obscurely 5-lobed, the margins crenulate; the anther ap- pendages subquadrate, remotely emarginate or occasionally tridentate, 1-2 mm long and 1-2 mm wide at the base; stigma head sharply pentagonal. Follicles unknown.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 1321
