      ecology:
        status: partially-supported
        claims:
          - text: The species is hygrophilous, preferring well-aerated habitats near streams or drinking holes with running water where, in the absence of competition, it may form dense stands resembling beds of diminutive papyrus. C. prolifer is, however, intolerant of shading and of stagnant conditions and if drainage is severely impeded, the population exhibits sterile inflorescences and considerable vegetative reproduction in the form of proliferations from bract axils or ray tips. If stagnation is prolonged, the population may be restricted to the fringes of the stagnant area. If culms are trampled or lodged by floods, the plants multiply by vegetative proliferation within a short while.
            textZh: 该 SANBI 区域物种条目记录的生境：The species is hygrophilous, preferring well-aerated habitats near streams or drinking holes with running water where, in the absence of competition, it may form dense stands resembling beds of diminutive papyrus. C. prolifer is, however, intolerant of shading and of stagnant conditions and if drainage is severely impeded, the population exhibits sterile inflorescences and considerable vegetative reproduction in the form of proliferations from bract axils or ray tips. If stagnation is prolonged, the population may be restricted to the fringes of the stagnant area. If culms are trampled or lodged by floods, the plants multiply by vegetative proliferation within a short while.
