        claims:
          - text: "Perennial, erect or nodding, 23-105 cm high, in large clumps: rhizome horizontal, rarely vertical, ligneous; internode 0.6-3.1 x 0.2-0.6 cm, clothed by many-nerved, red-brown, persistent sheaths: leaves limited to sheaths; sheaths 4.5-6.5 x 0.4-2.4 cm, glabrous, many-nerved, nerves converging at apex, margin of mouth scarious; blades generally absent: culms triquetrous to terete, mainly triangular, glabrous: inflorescence bud ovoid, up to 4.6 cm long: involucral bracts 3, subtending rays, not exceeding inflorescence; inflorescence 5.6-18 x 5-5.5 cm; rays 101-259, umbellate, up to 16 cm long, forming reflex angle with culm apex, sheathed at base by tubular prophylls, 0.9 cm long: capillary rays occasional; ray receptacle globose: spikelets 1-30 per ray, 6-17 x 1-1.5 mm, generally flat, elliptic to narrowly ovate, yellow-brown to red-brown, darkening on drying and age: rhachilla straight, yellow-brown: glumes lowermost 1-3 sterile, remainder fertile, 1.2-1.7 x 0.2-0.4 mm, broadly ovate, base truncate, glabrous, yellow-brown, margin scarious, keel three-nerved, central nerve excurrent into mucron, 0.1 mm long: stamens 3; anthers 1.2 x 0.2 mm, yellow-brown, crested; filament as long as anther, pallid, with small red-brown markings: style 0.3 mm long, pale yellow-brown; style branches three, 1.2 mm long, dark brown, papillate: achene 0.4 x 0.2 mm, obovate, trigonous in transverse section; outermost cells rectangular, with markedly sinuous margins."
