        usage:
          title: Inga hayesii Benth., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Small tree, the branchlets rather heavily pubescent when young becoming glabrous. Leaves moderate, 4- to 8-foliolate; petiole 1-2 cm. long, pubescent especially medianly, narrowly winged except at the extreme base; rachis 2-10 cm. long, similar to the petiole except the rachial internodes prominently alate (wing up to 5 mm. wide measured from midrachis), bearing sessile, patelliform or cupuli- form glands between insertion of the petiolules; leaflets 2-4 pairs, ovate, oblong or elliptic, the larger (terminal) ones as much as 15 cm. long and 7 cm. wide, the smaller (basal) ones about 5 cm. long and 2.5 cm. wide, acute, obtuse or even rounded apically, obtuse or rounded basally and not markedly inequilateral, with scattered curved-appressed hairs above and below, the veins prominent below; stipules broadly ovate, 2-3 mm. broad, soon caducous. Inflorescence very con- densed, of 1 to few? axillary spikes from the tips of branches, the peduncular portion usually less than 1 cm. long and obscured by the compact floriferous por- tion 1-3 cm. long; bracts lanceolate, inconspicuous, at most a few mm. long. Flowers whitish, densely compacted; calyx tubular, 6-9 mm. long, subglabrous except for small tufts of hair at the tip of calyx lobes and sometimes the base of the calyx, longitudinally striate, rather deeply cleft on one or two sides (the teeth thus unequal); corolla tubular-funnelform, 13-16 mm. long, silvery-pilose with- out, the lobes about 3 mm. long; stamens up to 4 cm. long, the staminal tube included; ovary subglabrous, 4-angled due to lateral indentations; stigma capitel- late. Legume linear-oblong, up to 17 cm. long and 2 cm. wide, flattened, yellow- tomentose.
          originalLanguage: en
          sourceField: general
