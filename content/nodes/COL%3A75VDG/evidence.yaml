    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, 6-9 cm, corm fibres rigid, dark brown. Leaves 2-7, suberect, firm, hemiterete to U-shaped in t/s, smooth or with a few recurved teeth. Flowers 1 or 2, stellate, deep yellow, with green or reddish reverse, bracts 1 or 2, leathery, spreading, with a recurved tip.
            textZh: Pauridia affinis (Schult. & Schult.f.) Snijman & Kocyan 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13877_0
            locator: "SANBI/WFO archive Morphology row 7539; source identifier 13877.0; cited publication: Snijman, DA. 2012. Hypoxidaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 115 - 119. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: The most important distinguishing features of Pauridia affinis are the corm tunics which consist of rigid, unbranched, dark brown fibres that are firmly attached to a hard, smooth, slightly convex disc below. In addition, the membranous, almost truncate cataphylls contrast markedly with the firm, terete to hemiterete leaves, which when cut develop a thick, dark scar. The scape, pedicels and backs of the outer tepals are characteristically reddened and when ripe the walls of the capsule break away longitudinally. Like many other species in the genus the corm produces contractile roots, but P. affinis is somewhat unusual in also developing droppers that apparently optimize the position of the corms in the soil. Pauridia affinis has sometimes been confused with P. monticola, a species found on sandstone rock sheets and slopes along the mountain chain between the Bokkeveld Mountains near Nieuwoudtville in the north and near Worcester in the south. Subtle differences, however, separate the two species. Unlike the 1.5-2.0(-3.0) mm wide, terete to hemiterete leaves of P. affinis, those of P. monticola are often broader, 1.5-6.0(-13) mm wide, dorsiventrally flattened and somewhat canaliculate. Apart from occasional plants with two-flowered infloresences in areas near Mamre, Wellington and Theewaterskloof Dam, near Villiersdorp, P. affinis has a predominantly 1-flowered inflorescence and somewhat elongated capsule (10-12 mm long), unlike the consistently 2-flowered inflorescence and shorter capsules (5-10 mm long) in P. monticola. Confusion between the two species may sometimes arise with collections from the Bokkeveld Mountains, Matsikamma, Gifberg and Elandskloof Mountains near Citrusdal where plants of P. monticola often have inrolled leaves, which superficially appear to be terete like those of P. affinis, but these plants are, nevertheless, distinguishable by consistent differences in capsule size.
