            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: This species often closely resembles E. divinorum but differs from it in the glandular not hairy ovary, the smaller leaves and fruits, the usually glabrous corolla and the less dense not compound inflorescence. The vernacular name used for both varieties is Guarrie or Gwarrie. The fruits have been reported as edible in both varieties but are not very palatable. The leaves of var. undulata as well as var. myrtina are reported to be browsed by cattle and the var. myrtina by kudu in South West Africa.
