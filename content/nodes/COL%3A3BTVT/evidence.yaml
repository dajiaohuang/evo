        claims:
          - text: Evergreen shrub or tree, 0.75-5.00 m or up to 7 m high. Leaves, twigs and corolla as in var. undulata, but leaves narrowly elliptic, elliptic or oblanceolate-elliptic, tapering ± equally to apex and base. Flowers white, greenish white or cream.
            sourceIds:
