          title: Dialium guianense (Aubl.) Sandwith, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Tall tree, with glabrous or puberulent branchlets. Leaves mostly 5- to 7- foliolate, caducous-stipulate, short-petiolate; rachis about 5-8 cm. long, often puberulent; leaflets ovate to elliptic-lanceolate, apically attenuate, basally rounded to cuneate, 3-12 cm. long, 1.5-4 cm. wide, glabrous, conspicuously reticulate, alternate or subopposite; petiolules about 3 mm. long, flattened or sulcate above, somewhat callous. Inflorescence an extended, branching panicle, terminal or sub- terminal, puberulent to glabrous; bracts caducous; pedicels very short. Flowers small, inconspicuous, apetalous; calyx pubescent without, densely so in bud, the receptacular portion short and stocky, the 5 lobes expanded, imbricate, obtuse, up to 3 mm. long; petals lacking; stamens 2, short; anthers bilocular, erect and basi- fixed, dehiscing by slits from the apex, the connective conspicuous; ovary sessile or subsessile, pubescent, 2-ovulate; style short, with a small terminal stigma. Legume subglobose to ellipsoid, up to 2.5 cm. long, very short-stipitate, with a fragile exocarp and somewhat fleshy endocarp.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 5313
