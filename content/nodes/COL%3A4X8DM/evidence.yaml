        usage:
          title: Sida rhombifolia L., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Herb or shrub up to 1.5 m high, the stem erect, usually profusely branched. minutely stellate-puberulus, infrequently also hirsute with mostly simple hairs, ultimately glabrescent. Leaves short-petiolate, the petiole usually ca 5 mm long, more or less densely stellate-puberulus and sometimes also hirsute, the stipules subulate, 5-10 mm long, more or less persistent; blade often more or less rhombic, narrowly ovate, narrowly oblong-elliptic, or narrowly oblong-obovate, cuneate to obtuse at the base, obtuse or acute at the apex, serrate or serrulate above the base at the margin, varying much in size, 1.5-8.5 cm long or sometimes shorter and 0.6-3.5 cm broad, 3(-5)-palminerved, discolor, shortly and sparsely stellate- puberulus or almost glabrous on the dark green upper surface, more or less densely and minutely stellate-puberulus to stellate-tomentellous and infrequently also hirsute especially along the main veins on the pale lower surface, the main veins prominent beneath. Flowers axillary and solitary, those toward the apex of the branches and branchlets often corymbose, the pedicel short to usually elongate and up to 3.5 cm long, filiform, articulated generally above the middle, minutely stellate-puberulus and sometimes also hirsute, the fruiting pedicel slightly longer; calyx campanulate, subplicate-5-angulate, ca 6(9) mm long, foliaceous, green, with the 5 midribs and 5 commissural ribs markedly thickened and yellowish at the base, minutely stellate-tomentellous, sometimes also hirsute especially on the ribs and along the margins, moderately accrescent, the lobes deltoid, acuminate, ca 3(5) mm long and broad at the base; petals broadly ovate, strongly oblique, unguiculate, slightly emarginate at the apex, 7-8.5(15) mm long and 5-6(13) mm wide, yellow or sometimes orange or white, the claw minutely tomentellous; androecium ca 5.5(9) mm long, the staminal tube ca 3.5(6) mm long, sparsely and minutely stellate-puberulus; styles ca 4(8) mm long, connate basally for ca l/2 of their length or less. Mericarps (7)8-12(14), triquetrous, 2.2-5.5 mm long (the beaks included), chartaceous, the dorsum with the lower part rugose-reticulate, and with the upper part with 2 longitudinal crests, each terminating into a beak 0.2-2.5 mm long, the lateral walls more or less rugose-reticulate, glabrous or with very minute stellate hairs on crests and beaks; seeds trigonous-subrotund, ca 2 mm long, smooth, glabrous but minutely whitish-pilose near the hilum.
