  claims:
    - subjectId: event:octopus-genome-innovation
      claimKind: scientific
      claimType: event-mechanism
      statement: The Octopus bimaculoides assembly and 12 RNA transcriptomes document expanded protocadherin and C2H2 zinc-finger families, extensive rearrangement and tissue-specific expression patterns. The study found no evidence for proposed whole-genome duplication, but did not rule out duplication followed by extensive gene loss.
      confidence: high
      confidenceRationale: Genome coverage, gene-family comparisons and tissue expression are documented datasets; causal language is bounded because these associations do not experimentally recreate cephalopod body-plan evolution.
      referenceLinks:
        - referenceId: albertin-et-al-2015-octopus-genome
          relation: supports
          pages: 220–224
          figure: Figures 1–3; Extended Data Figures 1–9; Supplementary Notes
          quoteLocator: Genome assembly; gene-family analysis; tissue transcriptomes; whole-genome duplication test
  claim-rationales.zh:
    - 基因组覆盖、基因家族比较与组织表达均有数据支持；这些关联不等于实验重建了头足类体制演化。
  claim-statements.zh:
    - 加州双斑蛸的基因组组装和 12 个 RNA 转录组显示原钙黏蛋白与 C2H2 锌指家族扩张、广泛重排和组织特异表达模式。研究未发现支持所提出的全基因组复制的证据，但未排除复制后发生大量基因丢失。
