  claims:
    - subjectId: event:tokummia-mandibulate-anatomy
      claimKind: scientific
      claimType: morphology
      statement: Holotype ROM 63823 and paratypes of Tokummia katalepsis preserve paired mandibles, maxillipeds and subdivided basipods; their recovery as stem mandibulates is a morphology-matrix result, not evidence that Tokummia is a direct ancestor of crustaceans, insects or myriapods.
      confidence: high
      confidenceRationale: Named specimens directly preserve the scored appendages, while the statement separately bounds the matrix-derived topology and ancestry claim.
      referenceLinks:
        - referenceId: aria-caron-2017-tokummia
          relation: supports
          pages: 89–92
          figure: Figures 1–4; Extended Data Figures 1–5
          quoteLocator: Diagnosis; Mandibles and maxillipeds; Phylogenetic results
  claim-rationales.zh:
    - 具名正模和副模直接保存被评分的附肢；档案把性状观察、矩阵拓扑与祖先关系明确分开。
  claim-statements.zh:
    - Tokummia katalepsis 的正模 ROM 63823 和副模保存了成对大颚、颚足及分节的基肢；形态矩阵将其恢复为有颚类干群，并不证明 Tokummia 是甲壳类、昆虫或多足类的直接祖先。
