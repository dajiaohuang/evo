  claims:
    - subjectId: event:asteriornis-holotype-crown-placement
      claimKind: scientific
      claimType: topology
      statement: CT-imaged holotype NHMM 2013 008 preserves a latest Maastrichtian skull and postcrania with galloanseran character combinations; parsimony and tip-dated Bayesian analyses place it differently near the crown, so membership is analysis-dependent rather than a directly observed global first modern bird.
      confidence: medium
      confidenceRationale: Specimen anatomy and locality are explicit, but the fossil is fragmentary and alternative analyses recover different crown positions. Medium confidence keeps occurrence separate from topology.
      referenceLinks:
        - referenceId: field-2020-asteriornis
          relation: supports
          pages: 397–401
          figure: Figures 1–4; Extended Data Figure 7
          quoteLocator: Holotype; Geological setting; Phylogenetic analyses
  claim-rationales.zh:
    - 标本解剖和地点明确，但化石残缺，替代分析恢复不同冠群位置；中等置信度把出现记录与拓扑分开。
  claim-statements.zh:
    - CT 扫描的正模 NHMM 2013 008 保存最晚马斯特里赫特期头骨与颅后骨骼，具有鸡雁小纲性状组合；简约法与尖端定年贝叶斯分析把它置于冠群附近不同位置，因此成员资格依赖分析，而不是直接观察到的全球最早现代鸟。
