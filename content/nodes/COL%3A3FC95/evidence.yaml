        usage:
          title: Gasteranthus imbricans (Donn.Sm.) Wiehler, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Terrestrial subshrubs or shrubs; stems erect, succulent when young, to 2 in tall, the apex minutely strigillose, soon becoming glabrous. Leaves subequal in a pair toward the apex of the branches, elliptic to broadly elliptic or ovate, 10-27 cm long, 5.3-16.7 cm wide, membranous, the apex acute, the base cuneate to obtuse, often oblique, subentire to irregularly serrate or dentate, above dark green, glabrous, below lighter green, strigillose along the veins; petioles 2-11 cm long, glabrate. Inflorescences in the upper axils, each several flowered, cymose or umbellate, irregularly compound; peduncles 7-17 cm long, glabrous; pedicels 0.8-1.8 cm long, glabrous. Flowers with the calyx zygomorphic, the lobes unequal, imbricate, distinct, broadly ovate, 0.7-1.2 mm long, membranous, entire to suberose, orange, glabrous, the anterior and the posterior lobes keeled; corolla orange, horizontal in the calyx, spurred, the tube ventricose but con- tracted somewhat in the throat, 1.5-2.2 cm long, the outside glabrous, limb of 5 short nearly equal lobes, each ca. 2-3 mm long; stamens not exserted, the filaments flattened, ca. 1 cm long, glabrous, the anthers ca. 2.5 mm long, coherent by their apices; disc thickened posteriorly, pubescent; ovary sub- globose, glabrous, the style ca. 8 mm long, glabrous, the stigma bibbed. Capsule broadly oblate, ca. 5 mm long, 8 mm wide, surrounded by the persistent calyx, orange; seeds oblong, light brown.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 6322
