          - text: Characterized by the persistently stellate-pubescent, small leaves, the mixed pubescence, some stellate hairs with thick walls (hard looking) but mostly thin- walled (soft looking) and single hairs with gland-tips intermingled, the flowers usually dark red (with pale calyx), cymes 1-, 2- or 3-flowered, terminal on the branchlets (some flowering branchlets very short).
