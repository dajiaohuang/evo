        claims:
          - text: Decumbent, succulent, annual herb, prostrate when in flower. Leaves cylindrical, linear, up to 70 mm long, 10 mm diam., epidermal bladder-cells much flattened. Flowers deeply funnel-shaped, up to 60 mm diam., straw-yellow, filamentous staminodes present, stamens and staminodes very numerous, stigmas shortly connate basally with ovary. Fruit 5-locular.
