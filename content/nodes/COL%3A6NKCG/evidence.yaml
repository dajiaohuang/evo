    facets:
      morphology:
        status: partially-supported
        claims:
          - text: An evergreen shrub about 0.9–1.3 m tall, with long, mostly straight stems and glaucous to pale-green leaves that may be densely papillose. The yellow tepals are about 42–48 mm long; the style ultimately projects about 3–4 mm beyond them.
            textZh: 常绿灌木，高约 0.9–1.3 m，茎长且多直立；叶呈带白粉至浅绿色，部分种群叶面密布乳突。黄色花被片长约 42–48 mm；花柱最终超出花被片约 3–4 mm。
            sourceIds:
