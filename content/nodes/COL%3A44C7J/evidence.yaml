    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, up to 350 mm tall, with numerous branches crowded in a rounded cluster. Leaves few, linear-lanceolate, margins undulate to crisped. Flowers enclosed in green spathes, pale yellow, greenish grey in centre, tepals with short clasping claws, limbs spreading, twisted, filaments in a slender column, style branches with short crests.
            textZh: Moraea knersvlaktensis Goldblatt 的 SANBI 物种条目记载了植株、叶片和花部形态。
            sourceIds:
              - sanbi_14562_0
            locator: Strelitzia 30; archive Morphology row 33311, source 14562.0
            placeTimeScope: Regional species account published 2013; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
          - text: Typically has slightly twisted leaves with undulate margins, and the outer inflorescence spathes are free distally and curve outward. The flowers of M. knersvlaktensis, which open early in the morning and fade after 12:30, are pale yellow with relatively prominent nectar guides bordered in pale grey-green, and the tepal claws, up to 2 mm long, clasp the base of the filament column. Closely related to M. schlechteri, the two species, as well as M. flexicaulis, are unusual for subg. Homeria in that every stem axil bears a foliage leaf, whereas other species bear attenuate, entirely sheathing leaves resembling the rhipidial spathes at the upper nodes. All three species have filaments with the apices free and diverging, and relatively well-developed style branches with relatively prominent crests.
            textZh: SANBI 条目提供了 Moraea knersvlaktensis Goldblatt 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: Strelitzia 42; archive Diagnostic row 94286, source 18638.0
