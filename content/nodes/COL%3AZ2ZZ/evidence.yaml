        usage:
          title: Coutoubea spicata Aubl., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Herb, annual to 1.2 m tall; the stem erect, simple or sparsely branched, sub- terete (obtusely tetragonous). Leaves opposite-decussate; blade narrowly ovate- triangular or narrowly oblong-ovate, rounded at the base, long and sharply acute at the apex, to 11 cm long and 3.5 cm wide, spreading, the costa somewhat prominent beneath, the basal leaves elliptic to subobovate and rounded at the apex. Inflorescences terminal or axillary, spicate, the spikes elongated, to 20 cm long, densely flowered. Flowers decussate, the bracts to 4.5 mm long, the bracteoles 2-2.5 mm long; calyx 6-7 mm long, 4-lobed, the lobes unequal, nar- rowly triangular-acuminate, carinate, 3.5-4.5 mm long; corolla 11.5-13.5 mm long, white or greenish-white, the tube cylindrical, 5-6.6 mm long, the lobes patent, ovate, acute at the apex, 6-7 mm long and 2.8-3 mm wide; stamens with the filaments ca. 2.5 mm long, the anthers sagittate, obtuse, 3-3.2 mm long; ovary narrowly ovate, ca. 4 mm long and 1.5 mm in diameter, the style ca. 3.5 mm long, enlarged towards the apex, the stigma lobes erect, at least 1 mm long. Capsule narrowly ovate, acuminate, about as long as the calyx; seeds globose, ca. 0.3 mm long, the testa reticulate.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 5971
