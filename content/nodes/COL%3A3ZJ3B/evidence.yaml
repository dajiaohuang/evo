          title: Meliosma occidentalis Cuatrec., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Tree 6-20 m tall; branchlets appressed puberulous when young, glabrescent, terete. Leaves elliptic to narrowly obovate, 6-26 cm long, 2.5-10.5 cm wide, acute to acuminate, cuneate to obtuse at the base, chartaceous, entire or with a few remote teeth towards the apex, drying dark above, brownish below, the midvein slightly impressed above, raised below, the secondary veins plane above and prominent below, tertiary venation prominulous below; puberulous on mid- vein above, below puberulous along the main veins and sometimes sparsely over the surface; petiole more or less puberulous, 1-3.5 cm long. Inflorescence arising from the branchlets below the leaves, paniculate, puberulous, 8-18 cm long, the flowers on short, ca. 1 mm long, pedicels or subsessile, mostly borne singly.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 12460
