    facets:
      morphology:
        status: partially-supported
        claims:
          - text: "Erect, glabrous, much-branched, low shrub up to 1 m high, fairly dense and rounded; branches ± straight, leafy in the upper parts, lower down defoliated and clothed with ± truncate, short remains of leaf-bases or nude and marked with leaf-scars; cortex light brown, eventually grey-blackish. Leaves closely set, often imbricated, erecto-patent-spreading, eventually ± reflexed, (lanceolate-)narrowly elliptic-oblong- elliptic -obovate and cuneate, 5-10 mm long, (1-)2-4 mm wide, flattened, entire or 2-3-lobed at the apex, coriaceous, bright-dark green, distinctly midveined, often somewhat keeled towards the apex, obtuse or subacute, shortly mucronate, with rigidly and shortly ciliolated margins; leaf-lobes erect, oblong-ovate, 1-3 mm long, 1-1.5 mm wide. Capitula terminal, sessile, solitary (or 2 together), with a woolly tuft at the base. Involucre bell- or cupshaped with rounded base, 6-12 mm high, 6-14 mm in diam., coriaceous, many veined, yellowish green. Involucral bracts 8-13, uniseriate, connate to 2/3-3/4; the free lobes ovate- lanceolate, 2-4 mm 1-3 mm wide wit partly wide overlapping margins, obtuse-subacute, with denticulate-puberulous margins and ciliate- puberulous blunt tips. Receptaple slightly convex -almost flat, distinctly alveolate. Ray-florest 8-15, bright yellow. Tube 1.5-3 mm long cylindrical. Lamina (narrowly) elliptic-oblong, 5-14 mm long, 2-3.5 mm wide, 4(- 6)-veined. Style terete with somewhat swollen base; style branches 0.5-1 mm long, obtuse, rounded at the apex. Disc-florets c. 13-35. Corolla (3.5-)4.5-5.5 mm long. Tube (1-)2-2.5 mm long, cylindrical. Limb narrowly campanulate, 2.3-3.5 mm long: lobes narrowly ovate, c. 1 mm long, with a distinct dark midvein. Anthers 1.5 -2 mm long incl. the (narrowly) ovate, acute or subacute appendage. Style terete with swollen base; stylophore short, ± indistinct; style branches 0.5-0.9 mm long, with truncate-slightly convex tips. Pappus bristles few, with very short, 0.2-0.5(-1) mm long, white, flexuous, densely barbellate. Achenes (narrowly) oblong-narrowly oblong-obovate or somewhat clavate, 3-5 mm long, brown, with c. 10 (8-11) thick ribs."
            sourceIds:
