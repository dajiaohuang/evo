      morphology:
        status: partially-supported
        claims:
          - text: "Cormous geophyte, up to 10 mm high. Leaves 2 or more, ± terete, produced after flowers, on a separate shoot. Flowers: solitary; perianth with tube 6-10 mm long, segments 14-22 mm long; pale pink to white inside, slightly to strongly marked purple to brownish outside; Oct."
            textZh: Hesperantha schelpeana Hilliard & B.L.Burtt 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_16273_0
            locator: "SANBI/WFO archive Morphology row 71838; source identifier 16273.0; cited publication: Retief, E; Meyer, NL. 2017. Iridaceae. In: E Retief & NL Meyer (eds), Plants of the Free State: Inventory and identification guide, Strelitzia 38: 934 - 956. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Crocus-like Hesperantha schelpeana typically flowers on a short stem, the leaves of which are dry or absent, and is distinguished in addition by the short-tubed, relatively small flowers that appear in dry grassland. The perianth tube is up to 10 mm long and the tepals 14-22 mm long, thus ± twice as long as the tube. The flowers are usually white or pale pink with the outer tepals feathered red-purple outside but plants from The Sentinel on the Free State-Lesotho Border in the Drakensberg, at the northern limit of the species, have pink flowers, shading darker at the tips of the tepals and with the throat dark brown, providing a stark contrast to the deep yellow anthers and pollen. The reverse of the outer tepals is so strongly feathered with brown as to appear nearly uniformly pigmented. New, green leaves are sometimes emergent at flowering, usually two in number and produced on a shoot separate from the flowers. The leaf blades are solid and oval in cross section when alive but appear flat with a prominent main vein when dry. The occasional presence of leaves at flowering time makes it possible to confuse Hesperantha schelpeana with H. candida, which flowers at the same time of year and has living, green leaves present on the flowering stem (unless destroyed by fire or grazing). Properly developed plants of H. candida have four leaves, two basal, a third subbasal and partly sheathing, and a short, sheathing leaf in the upper part of the stem. Hesperantha schelpeana, however, never has more than three leaves, the lowermost slender and exceeding the stem (when still present at flowering and then dry), the second much shorter, often largely sheathing, and a third, short, sheathing leaf usually present on the upper part of the stem. The leaf blades also differ, those of H. candida fairly broad and plane with thickened and raised margins and midrib.
            textZh: SANBI 条目提供了 Hesperantha schelpeana Hilliard & B.L.Burtt 的鉴别特征。
