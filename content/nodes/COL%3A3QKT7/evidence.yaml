    facets:
      morphology:
        status: partially-supported
        claims:
          - text: "Dwarf shrublet, stock stout, woody, up to c. 30 mm in diam., stems up to at least 350 mm long, erect or decumbent, well branched, either thickly clad in glistening glands or with varying degrees of development of glandular hairs up to c. 0.5 mm long, these sometimes predominating (see comments below), leafy. Leaves opposite becoming alternate on the inflorescence axes, pseudofasciculate, largest 10-30 x 5-17 mm, ovate, elliptic or oblong in outline with a broad petiolar part, blade divided to midrib, lobes elliptic or cuneate in outline, deeply cut, segments acute, subacute or obtuse, both surfaces clad in glistening glands, often with the addition of glandular hairs c. 0.1-0.6 mm long, their presence very variable in density. Flowers many, solitary in the axils of the upper leaves forming long crowded racemes. Pedicels up to 2-4 mm long (to c. 8 mm in some hybrids). Calyx tube (0.15-)0.3-0.5 mm long, lobes 2.3-4.5 x 0.3-2 mm at tips, spathulate, the tip broad and 2-5-toothed in the typical plant, narrowly spathulate to oblong in some specimens (possibly of hybrid origin), the lobes entire or with varying degrees of toothing, either glistening glands predominating or various degrees of development of glandular hairs up to 0.2-0.7 mm long, then glistening glands sometimes few. Corolla tube 8-11.5 x 1.5-2 mm in throat, cylindric, abruptly expanded near apex, mouth laterally compressed, limb oblique, bilabiate, c. 6.5-11 mm across the lateral lobes, posticous lobes 1.8-6 x 1.2-3.2 mm, anticous lobe 2.2-5.5 x 1.5-4.5 mm, all oblong, retuse, glandular-pubescent outside, hairs up to 0.25-0.6 mm long, glistening glands as well, broad transverse band of clavate hairs in throat extending briefly onto base of lower lip, lobes varying in colour from creamy white or yellowish to lilac-pink and shades of mauve, throat whitish to pale yellow often with dark purple radiating lines at base of lobes, tube often purplish outside. Stamens: posticous filaments 1-1.3 mm long, anthers 0.7-1.1 mm long, anticous filaments 0.3-1 mm long, anthers 0.4-0.8 mm long, all filaments minutely glandular at apex. Stigma 0.2-0.3 mm. Style 5.5-7 mmlong. Ovary 1.5-2 x 0.7-1 mm. Capsules 3.5-5 x 2-2.5 mm, glistening glands all over. Seeds 0.5-0.9 x 0.25-0.6 mm, sometimes as few as 6 in each loculus. Flowering principally between November and April."
            sourceIds:
              - sanbi_15191_0
            locator: "SANBI/WFO archive Morphology row 61066; source 15191.0; publication: Vollesen, KB. 2013. 126. Acanthaceae (Part 1), Fl. Zambes. 8(5): 1 - 184. Royal Botanic Gardens, Kew, London. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: It is very variable in indumentum, degree of toothing of the calyx lobes and colour of the corolla limb. A good deal of variation can probably be attributed to hybridization and subsequent backcrossing. This plant is characterized by the presence of big glistening glands on the stems and leaves almost to the exclusion of glandular hairs (a few tiny ones are present mainly on the petiolar part of the larger primary leaves), the leaves divided to the midrib, the lobes elliptic or cuneate in outline and deeply cut, and the calyx lobes, broadened at the tips and there deeply toothed (the epithet pristisepala is derived from the latin name for the sawfish and refers to the ragged sepals).
