    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Soft, cormous geophyte to 20 cm, corm capped with fine, pale brown fibres. Leaves 2 or 3, spreading, lanceolate, keeled, thin-textured. Flowers (1)2, stellate, yellow, with pale green beneath, ovary cylindrical, as long as tepals, anthers as long as filiform filaments, bracts 1 or 2, sheathing.
            textZh: Pauridia umbraticola (Schltr.) Snijman & Kocyan 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13877_0
            locator: "SANBI/WFO archive Morphology row 7541; source identifier 13877.0; cited publication: Snijman, DA. 2012. Hypoxidaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 115 - 119. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Based on vegetative similarities, this relatively poorly known species appears to be allied to Pauridia breviscapa, as discussed above, as well as to P. nana with which it shares a subcylindrical, 3- locular ovary topped by a solid beak. The beak, which is slightly more prominent than that of P. nana, reaches up to 2 mm long. Flowers are yellow whereas those of P. nana are white. Furthermore, the leaves are somewhat attenuate towards the base, thus they are insufficiently broad to form a sheathing neck other than that provided by the thin- textured cataphyll which sometimes persists into the flowering phase. Although the fruit is not yet known, the short terminal beak suggests that the capsule opens lengthwise along the walls. Clarity on the affinities of P.umbraticola awaits the discovery of fruiting material and insights from molecular phylogenetic studies.
            textZh: SANBI 条目提供了 Pauridia umbraticola (Schltr.) Snijman & Kocyan 的鉴别特征。
            sourceIds:
              - sanbi_15172_0
            locator: "SANBI/WFO archive Diagnostic row 58365; source identifier 15172.0; cited publication: Snijman, DA. 2014. A taxonomic revision of the genus Pauridia (Hypoxidaceae) in southern Africa. Phytotaxa 182(1): 1 - 114. [All rights reserved]"
