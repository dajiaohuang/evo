        claims:
          - text: "Rounded to spreading, many-stemmed shrub, up to 1 m high. Stems with prominently white, densely pustulate, hairy, young branches and spike-like branchlets, branchlets at first a nude spine which eventually becomes leafy or remains leafless; spines single or branched. Leaves bifoliolate; leaflets conduplicate or open, elliptic, base rounded, apex obtuse, sparsely glandular; petioles 3-4 mm long. Flowers: solitary, axillary; nectar disc fleshy, papillate, regularly 10-angled; petals obovate, 9-10 mm long, base with claw, apex obtuse, emarginate, deep yellow, unmarked; Oct.-Mar. Fruit a drooping, ovoid, 5-lobed capsule, each lobe with a prominent central ridge where splitting will occur, black when dried."
            sourceIds:
