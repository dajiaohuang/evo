    facets:
      morphology:
        status: partially-supported
        claims:
          - text: "Perennial herb (but will flower as a seedling), taproot developing into a woody stock up to c. 10 mm in diam., stems several tufted from the crown, c. 150-500 mm long, prostrate, ascending or erect, loosely branched, minutely puberulous on young parts, hairs up to 0.1 mm long, strongly recurved, closely leafy. Leaves opposite becoming alternate upwards, fascicled (sometimes weakly so), largest primary leaves 10-35 x 1-3.5 mm (axillary leaves similar but smaller), narrowly oblong-elliptic, linear-oblong or linear, apex acute, apiculate, base slightly narrowed, margins entire or very rarely an occasional minute tooth, thickened or plane, texture leathery, midrib slightly raised below, invisible or incised above, glabrous or with a few minute hairs on margins at base. Inflorescence a crowded terminal raceme becoming slightly lax in fruit, c. 35-100 x 6-8 mm in fruit, loosely associated with and often eventually overtopped by several subsidiary racemes. Bract adnate to pedicel and calyx tube, lowermost c. 4-5 x 1-1.8 mm (lowermost flowers sometimes subtended by a leaf, not a bract; these longer, narrow and without membranous margins), lanceolate, concave in lower half, apex long-acute, broad green keel, conspicuous white membranous margins, few hairs up to 0.1-0.15 mm long confined to lower margins. Pedicels up to 0.2-0.5 mm long. Galyx 1.8-2.6 mm long, obliquely campanulate, 3-lobed, 2 anticolateral lobes broadly deltoid, much larger than posticous lobe, hairs up to 0.1-0.15 mm long on margins of lobes, also on posticous side together with minute globular glands. Corolla tube 2-3.8 mm long (smaller when flowers female), tube broadly funnel-shaped, 3-4.7 mm across lateral lobes, posticous lobes 1-1.25 x 1.25 mm (or posticous lip sometimes entire), anticous lobe 1.7-2.3 x 1-1.7 mm, all lobes elliptic, white. Stamens: posticous filaments 1-1.5 mm long, anticous filaments 1.5-2 mm, all anthers exserted. Stigma and style c. 2-4.7 mm long, style glabrous. Ovary c. 0.8 x 0.7 mm. Cocci 1.25-2.2 x 0.8-1.4 mm, slightly rugulose, yellowish-brown."
            sourceIds:
