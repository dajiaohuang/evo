          - text: The species has been much confused with Selago nachtigalii from which it is easily distinguished by its glabrous leaves, different inflorescence, bracts that are longer, markedly acute, and have broad white membranous margins, and white, not violet, corollas. In the Prodromus Flora of South West Africa, S. albomarginata was confused with Walafrida schinzii, a synonym of S. alopecuroides, a species easily recognized by its long foxtail inflorescences composed of innumerable small glomerules, and long narrow leaves.
