    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Tufted perennial about 600 mm high; stolons horizontal; basal sheaths white, shiny, persistent; leaves basal; glands absent. Leaf blade to 300 x to 1.5 mm, rolled, rigid, glabrous; margins scabrid; sheath mouth with a ring of bristles. Inflorescence open, 60-110 x 50-80 mm, with ± 45-100 spikelets; pedicels glabrous; axils usually hairy. Spikelet 7.5-8.5 mm long; glumes acuminate, green, glabrous; lemma 3.5-5.0 mm long, sparsely hairy all over except apex usually glabrous; lateral awns 3-4 mm long, exserted from glumes; central awn 7-12 mm long, geniculate; palea hairy in upper third; anthers 2-3 mm long.
            textZh: Pentameris exserta (H.P.Linder) Galley & H.P.Linder 的 SANBI 物种条目记录了形态特征。
