  claims:
    - subjectId: event:tetrapods-on-land
      claimKind: scientific
      claimType: morphology
      statement: A synthesis of Devonian and Early Carboniferous evidence separates the acquisition of digit-bearing limbs, changes in locomotion and full terrestriality; these did not form one simultaneous fish-to-land event or a documented chain of direct ancestors.
      confidence: medium
      confidenceRationale: The open review integrates multiple body fossils, anatomical systems and environments, but it is a 2009 synthesis rather than a primary description of each specimen and predates important later finds. Medium confidence therefore applies to the mosaic framing, not to every historical age, topology or functional interpretation in the review.
      referenceLinks:
        - relation: supports
          referenceId: clack-2009-tetrapods
          pages: 213–223
          figure: Figures 1–10
          quoteLocator: Abstract; What Can We Learn from This Information?; Conclusions
  claim-rationales.zh:
    - 该开放综述整合了多种身体化石、解剖系统与环境，但它是 2009 年的综合，并非每件标本的原始描述，也早于多项后续发现。因此中置信度只适用于“镶嵌式转型”框架，不代表认可综述中每一个历史年代、拓扑或功能解释。
  claim-statements.zh:
    - 对泥盆纪和早石炭纪证据的综合将具趾肢的获得、运动方式变化与完全陆地化区分开来；它们并非一次同时发生的鱼—陆事件，也不是已证实的直系祖先链。
