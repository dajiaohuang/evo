        usage:
          title: Desmodium maxonii (Standl.) Standl., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrub to 2 m tall; stem terete, striate, finely uncinulate puberulent and when young long white pilose, glabrescent with pilosity only around nodes. Leaves trifoliolate, stipulate, petiolate; stipules obliquely lanceolate to ovate with long attenuate apex, striate, ciliate, puberulent and pilose on the abaxial surface, long persistent, 4.5-8 mm long, 3-4.5 mm wide; petioles sulcate, densely long pilose, 1-3.5 cm long; leaf rachis similar, 0.5-1 cm long; stipels subulate to linear lan- ceolate, striate, pilose and ciliate, 3-5.5 mm long; petiolules stouter than the leaf rachis, long spreading pilose, 2-3.8 mm long; leaflets ovate acute, rounded at the base, mucronate, dark green, puberulent and pilose and uncinulate puberulent on the adaxial surface, paler with prominent venation and long pilosity on the abaxial surface, the margins revolute, the terminal leaflet 3-6.5 cm long, 1.5-3.5 cm wide, the lateral leaflets 2.8-5.5 cm long, 1.2-2.5 cm wide. Inflorescence of many dense, short, terminal and axillary racemes, the crowded bracts at the apex with their tips prominent before flowering; rachis densely uncinulate puberulent and some- what pilose; primary bracts each subtending 2 pedicels, ovate long attenuate, striate, ciliate, pilose on the abaxial surface, 6-10 mm long, 2-5 mm wide; sec- ondary bracts each subtending 1 pedicel laterally, lance attenuate, ciliate, pilose on abaxial surface, 2.2-6 mm long, 0.2-0.6 mm wide; pedicels uncinulate puber- ulent and somewhat pilose, 6-12 mm long; calyx puberulent throughout, the teeth of both lobes ciliate, the central tooth of the lower lobe densely long pilose, the upper portion of the tube and the other teeth somewhat pilose, the central tooth of lower lobe 5-8 mm long, the lateral teeth 3-5.5 mm long, the upper lobe entire to bifid, 3-5.5 mm long; corolla with standard obovate to flabellate, rounded to retuse at the apex, narrowed to base, 1-1.3 cm long, 0.6-1.1 cm wide, the wings obliquely oblong, truncate at apex, short unguiculate, 7-12.5 mm long, 3.5-5 mm wide, keel petals broadly truncate at the apex, long unguiculate, 9.5-13 mm long, 4-5.2 mm wide above. Loment stipitate, 5-6-articulate; stipe 2.2-4 mm long; articles rhomboidal or appearing so because of alternately revolute margins, un- cinulate puberulent, isthmi central, 3.5-4.5 mm long, 2.5-3.5 mm wide; seed re- niform, ca. 2 mm long, 1 mm wide.
