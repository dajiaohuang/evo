          title: Pereskia aculeata Mill., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Clambering shrubs or lianas; branches terete, relatively slender, about 3-10 m. long, with pairs of stout reflexed spines 2-5 mm. long. Leaves shortly petiolate, ,the blade variable, usually elliptic to obovate, obtuse to acuminate, the base obtuse to cuneate, 3-8 cm. long, 1.5-4.0 cm. broad, the petiole 3-5 mm. long. Flowers usually few or several in terminal or axillary panicles about twice as long as the subtending leaves; pedicels about 0.5-1.5 cm. long, accrescent in fruit; perianth white, yellowish, or pink, rotate, about 3-5 cm. in diameter, the segments rather numerous, the inner obovate-oblong, the outer oblong-linear; stamens numerous, less than half as long as the perianth segments; style rather stout, slightly longer than the stamens. Berry globose, 1.5-2.0 cm. in diameter, with inconspicuous thornless areoles, yellow or orange when ripe.
          originalLanguage: en
          sourceField: general
