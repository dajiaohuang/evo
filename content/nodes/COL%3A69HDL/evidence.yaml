        usage:
          title: Centropogon floricomus McVaugh, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Herbs 0.4-0.6 (-1.0) m tall; stems erect to sprawling, hollow, glabrous below and sparsely appressed-puberulent above. Median cauline leaves with blades lance-ovate, (4-)6-10(-13) cm long, 1.5-3(-4.5) cm wide, ca. 2.3-2.8 times as long as wide, apically tapering into a narrow, caudate apex often 2-3 cm long, basally rounded to subcordate and occasionally somewhat asymmetric, marginally finely and shallowly serrate to denticulate with 5-6 callose-tipped teeth per cm, glabrous above except for the puberulence on the impressed, principal veins and puberulent beneath on the elevated, principal veins; petiole puberulent, (0.8-) 1.0- 2.5 cm long. Flowers solitary in the axils of the upper leaves, 6.5-7 cm long on sparsely puberulent, weakly spreading and flexuous pedicels 6-8 cm long; bracte- oles 2, minutely puberulent, linear, 1-3 mm long, borne 3-5 mm above the base; hy- panthium in anthesis campanulate to turbinate, basally acute, puberulent, 8-9 mm long, 6 mm in diameter with a free rim ca. 1 mm high; calyx lobes erect but arch- ing outward apically, acute, narrowly triangular to linear, 4-5 mm long, puberu- lent, entire or with a pair of glandular basal teeth; corolla bright pink, tipped with white lobes, the tube 4.04.6 cm long, externally minutely puberulent, internally glabrous, straight or slightly bent at the base, the basal portion constricted, cy- lindrical, 10-15 mm long, 2-4 mm in diameter, expanding above into a narrowly funnelform throat 6-9 mm in diameter, the lobes linear, the upper 2 lobes 16-18 mm long, erect, acute and often with stiff hyaline hairs near the tip, the 2 lateral lobes 12-13 mm long, reflexed, the lowermost lobe 10-12 mm long, curving down- ward; filament tube 50-55 mm long, longer than the corolla tube but not extend- ing beyond the corolla lobes, glabrous, the lower third basally distinct and there fused with the corolla tube; anther tube 7.5-8 mm long, glabrous except for the dense tuft of stiff hairs 1-2 mm long at the tip of the 2 shortest anthers. Berries leathery, pendent, strongly angled, somewhat inflated; seeds ovoid-lenticular, reticulate-pitted.
