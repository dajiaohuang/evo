        claims:
          - text: Acaulescent, cormous geophyte, 2-4 cm. Leaves linear to lanceolate. Flowers yellow, tepals cupped, style reaching anther apices, stigmas fringed.
            textZh: Moraea stagnalis (Goldblatt) Goldblatt 的 SANBI 物种条目记载了植株、叶片和花部形态。
            sourceIds:
              - sanbi_13878_0
            locator: Strelitzia 29; archive Morphology row 7418, source 13878.0
            placeTimeScope: Regional species account published 2012; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
          - text: The wet habitat is distinctive for Moraea stagnalis, which has flowers almost identical with those of other members of ser. Galaxia but with the filaments usually free in the upper third. The style divides opposite the anthers and the stigmatic fringes of the style branches are always in contact with the anthers and pollen. The narrow, shallowly channelled leaves have smooth to minutely ciliate margins. Moraea stagnalis is polyploid, 2n = 36, and in the laboratory is autogamous. The species is most easily confused with M. fugacissima, which has larger flowers with a perianth tube mostly 15-24 mm long, anthers up to 4 mm long, and the style usually exceeding the anthers rather than tangled among them. The filaments of M. fugacissima are usually completely united whereas those of M. stagnalis are typically, though not invariably, free in the upper third.
            textZh: SANBI 条目提供了 Moraea stagnalis (Goldblatt) Goldblatt 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: Strelitzia 42; archive Diagnostic row 95283, source 18638.0
            placeTimeScope: Regional species account published 2020; the archive excerpt does not give a dated sampling frame or population frequency.
