        claims:
          - text: "Perennial herb, minute, up to 60 mm high; growing singly. Rhizome subglobose, 10-15 x 4-10 mm. Leaves 4-6, wrapped at base in a membranous, white or brown tunic, loosely arranged in 3 ranks, blade linear, thick, 20-65 x 2-5 mm; not ribbed; sparsely hairy throughout; hairs mainly biramous, white. Flowers: inflorescence solitary, 1-flowered, appearing with and overtopping leaves; pedicels long, weak, 20-30 mm long; perianth segments 5-8 x 2-3 mm, ovate-elliptic, yellow; Nov. Fruit not seen."
