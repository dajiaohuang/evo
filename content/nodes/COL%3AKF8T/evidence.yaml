    facets:
      morphology:
        status: not-assessed
        claims: []
        gaps:
          - The foraging study does not document diagnostic morphology or anatomical variation.
      lifeHistory:
        status: not-assessed
        claims: []
        gaps:
          - Short tag deployments do not assess the full life cycle, reproduction, or lifespan.
      ecology:
        status: partially-supported
        claims:
          - text: In the California Current System, a 2016–2020 study using data from 10 tagged free-ranging blue whales selected from 23 deployments found that the whales foraged disproportionately within dynamic aggregative submesoscale surface-current features; estimated feeding rates also increased with feature strength. The result is bounded to the selected deployments and a modelled current-feature proxy, and does not establish a species-wide pattern across populations or seasons.
            textZh: 在加利福尼亚洋流系统，一项 2016—2020 年研究从 23 次标签部署中选取 10 头自由活动蓝鲸的数据；研究发现，这些鲸更常在动态聚集型亚中尺度表层洋流特征内觅食，估算摄食率也随特征强度增加。该结果仅适用于所选部署和模型化洋流特征指标，不能据此确立跨种群或跨季节的全物种规律。
            originalLanguage: en
            sourceIds:
              - fahlbusch2022BlueWhaleFineScaleForaging
            locator: Abstract; Results §§3(b) “Feeding site selection” and 3(c) “Influence on feeding rates”; Methods §2(a) for study period and tagged-individual selection.
            placeTimeScope: California Current System, 2016–2020; ten selected tagged individuals from 23 deployments, with mean deployment duration 7.1 ± 5.0 days; free-ranging blue whales. Feeding habitat features were represented by modelled finite-time Lyapunov exponent (FTLE) values derived from surface-current observations.
            lifeStatus: Free-ranging, tagged animals in a regional field study; captive, domesticated, and fossil evidence was not assessed.
        gaps:
          - This regional tag study does not establish feeding ecology across the species' global range, population-level prey availability, or a causal effect of surface-current features on prey density.
      evolution:
