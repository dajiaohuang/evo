        claims:
          - text: Cormous geophyte, up to 150 mm tall, with short, twisted branchlets, Leaves 3, upper one sheathing the stem, lower 2 falcate. Flowers pink-purple, yellow in centre, sweetly scented, stamens well exserted. Mainly Aug.
            textZh: Ixia parva Goldblatt & J.C.Manning 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_14562_0
            locator: "SANBI/WFO archive Morphology row 33266; source identifier 14562.0; cited publication: Goldblatt, P; Manning, JC. 2013. Iridaceae. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 94 - 124. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Readily distinguished from related I. latifolia by its small, red-purple flowers and low stature, up to 120 mm tall. Plants also have distinctive dark purple bracts and unusually long style branches, ± 3 mm long, unexpected in a small flower with tepals 10-12 mm long. The style divides at or slightly below the apices of the filaments and the style branches extend outward beneath the anthers where they are conspicuous. The flowers are strongly scented of sweet pea, a feature unique among the species of the I. latifolia group where scent is lacking or weakly developed.
            textZh: SANBI 条目提供了 Ixia parva Goldblatt & J.C.Manning 的鉴别特征。
