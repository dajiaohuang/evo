        claims:
          - text: Cormous geophyte, 3-9 cm, tunics woody, concentric. Leaves oblong, often prostrate. Flowers white.
            textZh: Geissorhiza ovalifolia R.C.Foster 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 6803; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: The diminutive and small-flowered Geissorhiza ovalifolia is distinguished by the stem prostate at the base and erect distally, and four or five plane leaves, at least the lower three or four prostrate and ovate to oblong. Plants often produce a cormlet in the axils of the basal and even cauline leaves. The flowers are white with a pale yellow throat and have a perianth tube 2-3 mm long and tepals 6-8 mm long. It is often confused with the more widespread and common G. bolusii, which occurs in similar habitats in the Western Cape mountains. Geissorhiza ovalifolia is evidently sexually fertile, and capsules develop rapidly after blooming whereas the triploid G. bolusii is sexually sterile and reproduces by the production of cormlets in all basal and cauline leaf axils as well as in the axils of the floral bracts after flowering. The two can sometimes also be distinguished by the number of cauline sheathing leaves, one in G. ovalifolia but usually several in G. bolusii, however the difference does not always hold.
            textZh: SANBI 条目提供了 Geissorhiza ovalifolia R.C.Foster 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 94666; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
