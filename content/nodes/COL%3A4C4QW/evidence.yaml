        usage:
          title: Palicourea montivaga Standl., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrubs or subshrubs to 2.5 m tall (fide Standley), the branchlets smooth, glabrous, the pith porate, the nodes crowded or not, occasionally swollen. Leaves elliptic or obovate elliptic, 4-10 cm long, 1.0-3.2(-4.0) cm wide, deltoid or obtuse at the apex, often abruptly acuminate, the acumen to 0.7 cm long, acute, usually vaguely falcate, basally cuneate to acute, the costa prominulous above and be- neath, the lateral veins 10-13, scarcely prominulous above, prominulous beneath, with 1-4 subparallel intermediate veins between a pair of lateral veins, these soon evanescent, the intervenal areas patulous reticulate, stiffly chartaceous, mem- branous ?, glabrous; petioles to 1.5 cm long, 0. 1-0.15 cm wide; stipules connate, the sheath ca. 2 mm long, each with 2 awns about the same length as the body or longer, to 2.5 mm long, scarious, glabrous. Inflorescences (in fruit) cymose paniculate, oblong, to 9 cm long, to 5 cm wide, rounded at the apex; peduncles to 3 cm long, the lowermost branches paired, strongly ascending, to 4 cm long, the upper branches several, well spaced, spreading, paired or ternate, glabrous or puberulent. Flowers sessile or on pedicels to 2.5 mm long; hypanthium ca. 1 mm long, the calycine cup ca. 0.6 mm long, the teeth triangular, ca. 0.3 mm long, obtuse or acute; corolla green or yellow, the tube ca. 7 mm long, ca. 2.5 mm wide, the lobes triangular, obtuse, ca. 1.5 mm long. Fruits obovate to obovate rotund, ca. 4.5 mm long, glabrous, each pyrene 5-costate, often one seed aborted and then the fruit subfalcate.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 11886
