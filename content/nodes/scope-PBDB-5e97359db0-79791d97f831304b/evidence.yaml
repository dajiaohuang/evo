  claims:
    - subjectId: taxon:rhaeticosaurus
      claimKind: scientific
      claimType: fossil-range
      statement: Rhaeticosaurus is anchored by holotype LWL-MFN P 64047 from a specific Rhaetian Exter Formation bed at Bonenburg; this secure specimen does not establish an exact global plesiosaur or genus origin.
      confidence: high
      confidenceRationale: The holotype and bed-level provenance are directly documented. High confidence is limited to the named sample, while phylogenetic implications remain separate.
      referenceLinks:
        - referenceId: wintrich-2017-rhaeticosaurus
          relation: supports
          pages: 3:e1701144
          figure: Figure 1; Supplementary Figure S1
          quoteLocator: Systematic paleontology; geological setting; holotype locality and horizon
    - subjectId: taxon:rhaeticosaurus
      claimKind: scientific
      claimType: taxonomy
      statement: Rhaeticosaurus mertensi is a new small-bodied plesiosaurian recovered within Plesiosauria as a basal Pliosauridae member in the published 35-taxon, 270-character analysis; that placement is matrix-dependent rather than direct ancestry.
      confidence: medium
      confidenceRationale: The paper directly defines the new taxon and reports the matrix result, but the topology is conditional on taxon sampling and characters; it is not presented as observed lineage descent.
      referenceLinks:
        - referenceId: wintrich-2017-rhaeticosaurus
          relation: supports
          pages: e1701144, Systematic paleontology; Phylogenetic relationships
          figure: Figures 2–3; Supplementary Tables S2–S3
          quoteLocator: Rhaeticosaurus mertensi diagnosis; 35-taxon, 270-character matrix; basal Pliosauridae placement
    - subjectId: taxon:rhaeticosaurus
      claimKind: scientific
      claimType: biogeography
      statement: "The Rhaeticosaurus holotype comes from clay pit #3 of the Lücking brick company, 1 km north of Bonenburg in Warburg, North Rhine-Westphalia, Germany, in Rhaetian dark marine mudstones of the Exter Formation; this is a locality record, not a complete distribution."
      confidence: high
      confidenceRationale: The locality-and-horizon section gives the named clay pit, distance, municipality, formation, lithology and Rhaetian age. The claim remains bounded to this documented occurrence.
      referenceLinks:
        - referenceId: wintrich-2017-rhaeticosaurus
          relation: supports
          pages: e1701144, Locality and horizon
          figure: Figure 1A–B; Supplementary Figure S1
          quoteLocator: "Lücking clay pit #3; 1 km north of Bonenburg; Exter Formation; Rhaetian dark marine mudstone; 21 m below Triassic–Jurassic boundary"
    - subjectId: taxon:rhaeticosaurus
      claimKind: scientific
      claimType: morphology
      statement: Holotype LWL-MFN P 64047 is a partial articulated subadult skeleton preserving the occiput, lower jaw, vertebral column, girdles and left limbs; its diagnosis includes ventrally concave V-shaped cervical neurocentral sutures and foreshortened zeugopodials.
      confidence: high
      confidenceRationale: The holotype inventory and diagnostic proportions are directly described and illustrated. The confidence applies to the specimen-level anatomy and does not imply an invariant condition across Plesiosauria.
      referenceLinks:
        - referenceId: wintrich-2017-rhaeticosaurus
          relation: supports
          pages: e1701144, Holotype specimen; Diagnosis; Brief anatomical description
          figure: Figure 2A–E; Supplementary Figures S1–S4; Supplementary Table S4
          quoteLocator: LWL-MFN P 64047; articulated anatomy; cervical sutures; foreshortened zeugopodials
    - subjectId: taxon:rhaeticosaurus
      claimKind: scientific
      claimType: ecology
      statement: Rhaeticosaurus preserves four similar pointed flippers and a short tail consistent with plesiosaurian hydrofoil and paraxial-locomotion comparisons, while histological growth and physiological implications remain interpretations rather than directly measured behaviour or metabolism.
      confidence: medium
      confidenceRationale: The paper reports the limb and tail anatomy and compares it with hydrofoil function, while the histology discussion interprets vascularized bone. The claim separates mechanical and physiological inference from direct preservation.
      referenceLinks:
        - referenceId: wintrich-2017-rhaeticosaurus
          relation: supports
          pages: e1701144, Abstract; Brief anatomical description; Bone histology
          figure: Figures 2 and 4; Supplementary Figures S8–S12
          quoteLocator: four flippers as hydrofoils; short tail and paraxial locomotion; sampled humeral and femoral histology
  claim-rationales.zh:
    - 正模和层位级出处有直接记录。高置信度仅限具名样本，系统发育含义另行保留。
    - 论文直接命名新属种并报告矩阵结果，但拓扑依赖取样和性状编码；该主张不把分析位置写成观察到的血缘。
    - 一手论文的地点与层位段落明确给出砖厂黏土坑、Bonenburg、Exter 组和瑞替期；主张只记录该具名地点。
    - 正模清单、颈椎诊断和肢骨比例均在正文图文中直接报告；高置信度不外推为蛇颈龙目的普遍体制。
    - 论文报告鳍肢、短尾和长骨组织，并讨论水翼、轴旁运动和生长解释；这些不是观察到的步态或直接测得的代谢。
  claim-statements.zh:
    - 莱提龙由博嫩堡埃克斯特组特定瑞替期层位的正模 LWL-MFN P 64047 锚定；该可靠标本不建立精确的全球蛇颈龙类或属级起源。
    - Rhaeticosaurus mertensi 是新命名的小型蛇颈龙类；已发表的 35 个分类单元、270 个性状分析将其恢复为蛇颈龙目中的基干上龙科成员，但该位置依赖矩阵而非直接祖先关系。
    - Rhaeticosaurus 正模来自德国北莱茵-威斯特法伦州 Warburg 的 Bonenburg 以北 1 公里、Lücking 砖厂 3 号黏土坑，产于 Exter 组瑞替期深色海相泥岩；这是地点记录，不是完整分布。
    - 正模 LWL-MFN P 64047 是部分关节相连的亚成体骨骼，保存枕部、下颌、脊柱、带部和左侧肢骨；其诊断包括腹侧凹陷的 V 形颈椎神经棘缝和缩短的前臂、胫部骨段。
    - Rhaeticosaurus 保存四个相似的尖端鳍肢和短尾，可用于蛇颈龙水翼与轴旁运动比较；组织学显示的生长及生理含义仍属解释，并非直接测量的行为或代谢。
