        usage:
          title: Croton pseudoniveus Lundell, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrub or tree 5-6 m high; monoecious; twigs densely and smoothly lepidote. Leaves thinly chartaceous; petioles lepidote eglandular, mostly 10-30 mm long; stipules subulate-lanceolate, lepidote, 5-6.5 mm long; blades ovate, 6-12.5 cm long, 4-9 cm broad, green and sparsely lepidote on both sides (paler beneath), copiously and minutely glandular-punctate, 5-veined at base, with 4 or 5 additional lateral veins per side, the base narrowly cordate, the margins entire, the apex abruptly acuminate. Inflorescences axillary, spiciform, very compact and abbreviated (1 cm long or less), bisexual or male, with usually only 1 female flower at base; bracts subtend- ing solitary flowers. Staminate flowers with lepidote pedicels 0.9-1.5 mm long; calyx-lobes 5, valvate, triangular, lepidote, ca 1.5-1.6 mm long; receptacle villose; petals oblong to obovate, ca 2 mm long, densely villose on the margins, glandular- pustulate on the back, not lepidote; stamens 10 or 11, the filaments glabrous, 2-2.3 mm long, the anthers elliptic, pustulate on the connective, 0.6-0.7 mm long. Pistil- late flowers with stout lepidote pedicels ca 1-2 mm long; calyx-lobes as in the male; disc ca 1.5 mm wide, irregularly segmented into 5 lobes, adnate to the calyx; ovary silvery-lepidote, the finely denticulate concave scales 0.7-0.8 mm wide, the styles free, spreading, ca 2.5-3 mm long, mostly 4 times bifid, the branches slender and glabrous. Capsules not seen; seeds (ex McVaugh, loc. cit.) 5.5 mm long.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 4524
          archiveSourceId: EC6C7D50-2F9B-43D9-8084-ED7559E6C62F
