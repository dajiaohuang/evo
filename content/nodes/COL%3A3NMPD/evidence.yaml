    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Tufted, delicate, graceful perennial, 0.6-2.0 m high; rhizomatous; fresh shoots not aromatic. Leaf blade up to 300 x 4 mm; ligule an unfringed membrane. Inflorescence of paired racemes, 10-12 mm long, enclosed by spatheoles, crowded into large, leafy, false panicle; raceme pairs with 2(-4) awns; raceme bases terete, unequal, with 2 pairs of homogamous spikelets at base of upper raceme. Sessile spikelets 5.5-7.0 mm long, dorsiventrally compressed, glabrous or white-villous. Florets 2; lower floret sterile, reduced to a lemma, awnless; upper floret bisexual, lemma less firm than glumes towards base, hyaline, 2-lobed, awns 30-55 mm long, with hairs up to 1.2 mm long; callus 1.8-3.0 mm long, tip visible on apex of internode. Pedicellate spikelets with an awn 1-5 mm long. Flowering time Nov.-Apr.
