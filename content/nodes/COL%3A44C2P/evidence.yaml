        claims:
          - text: Cormous geophyte, 20-30 cm. Leaf solitary, linear, trailing. Flowers yellow, tepal claws forming a narrow cup, anthers partly exserted.
            textZh: Moraea autumnalis (Goldblatt) Goldblatt 的 SANBI 物种条目记载了植株、叶片和花部形态。
            sourceIds:
              - sanbi_13878_0
            locator: Strelitzia 29; archive Morphology row 7382, source 13878.0
            placeTimeScope: Regional species account published 2012; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
          - text: Unusual in the genus in its early flowering time, April to June (autumn and early winter), Moraea autumnalis is recognised by the solitary foliage leaf inserted close to the base of the sparsely branched (rarely simple) and slightly flexuose stem, and yellow flowers with the tepal claws ± erect and forming a narrow cup 9-10 mm long enclosing the filament column and bases of the anthers. The filaments are entirely united in a cylindric column minutely papillate in the lower half, and the anthers, 5-7 mm long, are twice as long as the style branches and arch inward after dehiscence. The style branches bear short, horizontal crests. When described M. autumnalis was thought to be closely allied to M. pyrophila (as Homeria galpinii) because they have a similar vegetative morphology and broadly similar flowers, but the claws of the pale yellow tepals of M. pyrophila form a cup enclosing both filaments and anthers, and the shorter filaments, 4-5 mm long, are conspicuously pubescent in the lower half. The anthers are usually shorter than the style branches, which bear short crests as in M. autumnalis. It is probably significant that the flowering in M. pyrophila is also relatively early in the season, mostly in July and August but as early as March and April.
            textZh: SANBI 条目提供了 Moraea autumnalis (Goldblatt) Goldblatt 的鉴别特征。
            sourceIds:
