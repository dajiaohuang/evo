    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, 15-40 cm, with 1 or 2 sturdy, twisted or straight branches, flowers occasionally crowded distally. Leaves broad, often falcate. Flowers ascending or often facing the side, pink to mauve, occasionally red, tube narrowly funnel-shaped, 7-18 mm long, filaments exserted 6-8 mm from tube.
            textZh: Ixia latifolia D.Delaroche 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 7163; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: "Recognised by the relatively large, deep pink, purple, mauve-pink or blue-mauve flowers usually with a relatively well-developed perianth tube, (7-)10-18(-23) mm long that gradually widens toward the mouth, and spreading tepals 13-20(-23) long. The long stamens have filaments exserted 6-8 mm from the tube and anthers 3-5 mm long. The floral bracts are mostly 8-10 mm long and distinctive in having narrowly acute teeth. The two basal leaves are usually fairly broad, 10-18 mm, but occasionally only 5 mm wide. The third leaf sheaths the stem for its entire length. Plants with short, somewhat twisted, rather than straight, lateral branches and slightly smaller flowers, described by G.J. Lewis (1962) as var. curviramosa, are now included in I. latifolia. The degree of twisting and length of the branches is not consistently correlated with any other character, and is often difficult to determine because plants with shorter, ± straight branches, conform to neither taxon. Flower size is unusually variable. Both the northernmost populations of I. latifolia in the arid Tanqua Basin and the easternmost near Oudtshoorn are exceptional: the Tanqua populations, growing in perhaps the most arid habitat for the species, have the largest flowers with a tube 20-23 mm long and tepals up to 21 x 10.5 mm. In contrast, the Gamkaberg populations have flowers with a tube 7-8 mm long and tepals 13-15 x ± 7 mm, among the smallest in the species. But plants from several other localities have flowers almost as small. The plants from the Tanqua Karoo reverse the usual trend for smaller stature and flower size in the driest habitats and merit further study. Ixia latifolia is probably most closely related to I. divaricata, a plant of wet, sandstone habitats in the Cold Bokkeveld and surrounding mountains, which has long, slender, straight lateral branches with flowers crowded in the upper half and a smaller perianth with a tube 8-11 mm long, tepals 11-14 mm long, and filaments 4-5 mm long reaching 1-2 mm beyond the mouth of the perianth tube or sometimes only to the mouth of the tube. Ixia divaricata typically has pale pink or white flowers and narrow leaves, thus very different from the larger, deep pink-mauve or purple flowers with well-exserted filaments, and broad, fairly short leaves of I. latifolia. Plants with broader leaves may be the result of crossing with I. latifolia, and plants of that species with particularly long branches may be the result of occasional crosses with I. divaricata at sites where the habitats of the two are close together."
