        claims:
          - text: Perennial (short-lived) or annual, mat-forming and stoloniferous or tufted (loosely), up to 350 mm tall. Leaf blades 18-70 mm long, 1.6-4.5 mm wide. Culms rooting from lower nodes. Spikelets 1.2-1.6 mm long, 0.6 mm wide. Racemes 2 (or 3), digitate, 30-70 mm long, spikelets in pairs or threes and tending to bend outwards; rhachis winged with low rounded midrib; upper glume and lower lemma as long as spikelet and covered with hairs 0.2 mm long; female-fertile (upper) lemma grey to purplish.
