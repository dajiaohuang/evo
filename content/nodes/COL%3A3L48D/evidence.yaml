    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants mostly 150-350 mm high. Corm bell-shaped with flat base; tunics dark brown, softly woody, outer layers irregularly broken, margins minutely toothed. Stem unbranched. Leaves 3, lower 2 basal, falcate, blades 50-100 x 2-6 mm, bright green to slightly glaucous, with thickened, raised main vein, margins translucent-hyaline, uppermost leaf inserted shortly above ground, sheathing stem for most of its length with short blade up to 10 mm long. Spike flexuose, 1- or 2(3)-flowered, outer bract ± 12 mm long, pale green flushed red to purple at tip, inner slightly shorter, with 2 green keels, narrowed distally. Flowers crepuscular, rotate, white without darker colouring on reverse, dull yellow-green in throat and tube, tepals remaining cupped when fully open, with sweet, rose-like scent; perianth tube narrowly funnel-shaped, 5-6 mm long; tepals subequal, elliptic, 15-17 x 4-5 mm. Filaments ± 3 mm long, inserted ± 2 mm above base of tepals; anthers held horizontally, 7-8 mm long, pale yellow; pollen yellow. Style dividing 2 mm below mouth of tube, branches ± 12 mm long, diverging.
            textZh: Hesperantha eremophila Goldblatt & J.C.Manning 的 SANBI 物种条目记录了形态特征。
