            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: With a bell-shaped corm with a flat base, Hesperantha eremophila conforms to sect. Hesperantha, where it is distinguished by pure white flowers lacking dark colour on the reverse of the outer tepals, a funnel-shaped perianth tube 5-6 mm long, and tepals remaining cupped when fully open. The tepals, 15-17 mm long, are much longer than the perianth tube, and the long style branches, ± 12 mm long, are distinctive. The flowers are crepuscular, opening mid- to late afternoon and closing after midnight. Among the white-flowered species of the section and genus only H. dolomitica has similarly cupped tepals also without colouring on the outside of the tepals, which suggests a possible relationship with H. eremophila. Flowers of H. dolomitica are larger, with a perianth tube 12-14 mm long and tepals about the same length, and style branches ± 7 mm long, just over half as long as those of H. eremophila.
