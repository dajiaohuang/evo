        claims:
          - text: Tree, up to 18 m high, copiously, dichotomously branched. Leaves long, deeply channelled, sometimes reflexed, margins coarsely dentate. Flowers pink to blood-red.
            textZh: Aloidendron barberae (Dyer) Klopper & Gideon F.Sm. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_11118_0
            locator: "SANBI/WFO archive Morphology row 153; source identifier 11118.0; cited publication: Herman, PPJ; Retief, E. 1997. Plants of the northern provinces of South Africa: Keys and diagnostic characters. Strelitzia 6: 1 - 681. National Botanical Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: The tallest species of Aloe in southern Africa, A. barberae bears a superficial resemblance to A. eminens, which occurs in northern Somalia. A. eminens is not as tall as A. barberae and has smaller leaves, shorter racemes, larger bracts and more shortly exserted stamens and styles. There are also differences in the micro-scopical structure of the leaf epidermis in the two species. A. barberae could hardly be confused with A. dichotoma or A. pillansii , as its bright green, deeply channelled leaves are much larger than the leaves of either of those two species. A. barberae has erect, dense racemes of pink, not yellow, flowers and the flowers are not as fleshy as those of either A. dichotoma or A. pillansii. This species grows readily from truncheons, something that species in section Dracoaloe will not do at all.
            textZh: SANBI 条目提供了 Aloidendron barberae (Dyer) Klopper & Gideon F.Sm. 的鉴别特征。
            sourceIds:
              - sanbi_5961_0
            locator: "SANBI/WFO archive Diagnostic row 51269; source identifier 5961.0; cited publication: Glen, HF; Hardy, DS. 2000. Aloe. In: G Germishuizen & E du Plessis (eds), Aloaceae (first part), Fl. S. Africa 5(1,1): 1 - 167. National Botanical Institute, Pretoria. [http://www.biodiversitylibrary.org/item/209564#page/3/mode/1up]. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: A. bainesii is a very striking species, and could never be confused with either A. dichotoma or A. pillansii, the last mentioned being most distinctive with its well-branched inflorescence hanging downwards between the lowest leaves. The three are dichotomously branched and rebranched, but A. bainesii can always be recognised with its green deeply-channelled leaves, and dense cylindric racemes with rose-pink flowers.
            textZh: SANBI 条目提供了 Aloidendron barberae (Dyer) Klopper & Gideon F.Sm. 的鉴别特征。
