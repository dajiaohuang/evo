    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Bush 2-5 m tall; young branches stellate-pubescent, becoming glabrous, older stems four-angled and somewhat sulcate, sometimes scandent. Leaf-blade 40-120 x 20-85 mm, oblanceolate, obovate or oblong-lanceolate or occasionally almost orbicular, acute or acuminate at the apex, rounded or subcordate at the base, margins irregularly serrate, harshly pubescent, particularly below; petiole up to 7 mm long but usually shorter, pilose; stipules up to 10 mm long, subulate to oblong-lanceolate, somewhat keeled, pubescent on both sides. Inflorescences all axillary, on pubescent peduncles up to 15 mm long; pedicels up to 20 mm long, 2-3 per peduncle, pubescent; bracts about 3 mm long, entire, lanceolate to ovate-lanceolate, pubescent, especially on the back. Buds oblong with a slight swelling and then a constriction just above the base. Sepals 12-20 mm long, lorate, yellow inside, yellowish tomentose outside. Petals yellow, 6-8 x 1.5 mm, narrowly oblong with a nectariferous claw villous on the margins within and at the base outside. Androgynophore 1.5-2 mm long, glabrous, not elongated above the node.
            sourceIds:
