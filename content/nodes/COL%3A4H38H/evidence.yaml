        usage:
          title: Phyllanthus anisolobus Müll.Arg., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrub or tree, 3-8 m high, glabrous; monoecious; branches pale brown, smooth, scale-leaves inconspicuous. Deciduous branchlets mostly bipinnatiform, the pri- mary axis 2-3.5 dm long, obtusely or sharply angled, green, smooth, usually with 5-10 lateral axes, each 8-30 cm long with 10-20 leaves. Leaves thin; petioles smooth, 2-3 mm long; stipules triangular, 0.6-0.8 mm long, subpersistent; blades broadly elliptic, evenly narrowed to a blunt or subacute tip, obtuse at the base, ca 2-5 cm long, 1.3-2.5 cm broad, smooth on both sides. Cymules bisexual, on the lateral branchlet axes, y solitary, d' several. Staminate flowers with pedicels 3-7 mm long; calyx-lobes 6, 1.7-2.2 mm long, biseriate, the outer oblong, ca 0.7-0.8 mm broad, the inner elliptic, 1.2-1.8 mm broad (rarely lobes 5 and then subequal); disc of 6 massive rounded segments united by pairs into reniform glands ca 0.8 mm wide; stamens 3, the filaments connate into a column 0.8-1.2 mm high, the anthers deflexed atop the column, very deeply emarginate (anther-sacs stipitate), ca 0.4-0.5 mm in diam; pollen grains 3-colporate, reticulate. Pistillate flowers with smooth pedicels becoming 6-13 mm long; calyx-lobes 6, biseriate as in the male flowers; disc of 6 segments united by pairs as in male, these 3 reniform glands usually confluent to produce a 3-lobed cup; ovary smooth, the styles 0.7-1.1 mm long, erect or ascending, bifid, the branches slender. Capsules ca 3 mm long; seeds mostly 2-2.4 mm long, pale brown, smooth with slightly raised reddish swellings, sometimes with a rudimentary caruncle.
          originalLanguage: en
          sourceField: general
