    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Shrub 0.3-0.9 m tall, often with several stems arising from a woody rootstock; stems erect, sparingly branched, densely hispid. Leaves opposite or ternate, shortly petiolate; blade broadly ovate, ovate-oblong or obovate-elliptic, 40-90 x 20-35 mm, densely pubescent to subglabrous, apex acute to obtuse, base cuneate to obtuse, margin distinctly and regularly serrate; petiole 3-8 mm long. Inflorescence simple, 80-320 mm long; verticils 4-12-flowered, 10-30 mm apart; rhachis glandular-hispid; bracts ovate, acuminate, 6-10(-16) mm long. Calyx up to 15 mm long at fruiting stage, glandular-hispid. Corolla mauve to purple; tube straight, cylindrical, (6-)9-16 mm long; enlarging slightly towards the throat; upper lip erect, 6-7 mm long; lower lip concave, 5-6 mm long. Stamens exserted from the throat by 4-5 mm; upper 2 filaments attached near the base of the tube, pubescent below. Stigma bilobed, lobes spreading, 0.5 mm long.
            sourceIds:
