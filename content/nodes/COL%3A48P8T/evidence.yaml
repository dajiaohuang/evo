          title: Odontocarya truncata Standl., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: "Twining shrubs; stems striate, conspicuously verrucose-lenticellate, glabrous. Leaves petiolate, the lamina ovate, the apex acuminate, the base truncate or ob- scurely cordate, 7-12 cm. long, 5-9 cm. wide, at length subcoriaceous, glabrous, somewhat bullate above; petioles 3-4 cm. long, glabrous. Staminate inflorescence axillary, paniculiform, 8-24 cm. long, the rachis glabrous; bracts 1.0-1.5 mm. long, 0.5 mm. wide; bracteoles scarious, ovate to lanceolate, 0.5-1.0 mm. long. Staminate flowers: Sepals 6, glabrous, the 3 exterior obscurely coherent at the base, ovate to lanceolate, membranous, 0.5-0.8 mm. long, 0.3-0.6 mm. wide, the 3 interior con- spicuously larger, ovate to elliptic, the apex obtuse or rounded, the base truncate or rounded, 1.3-1.7 mm. long, 1.0-1.4 mm. wide; petals 6, cuneate, carnose, 0.7-1.2 mm. long, 0.5-0.8 mm. wide, glabrous; stamens 6, about 1 mm. long, the filaments coherent at the base. Pistillate flower not seen. Drupe ovoid, yellow about 1.5 cm. long, 1.0 cm. wide."
          originalLanguage: en
          sourceField: general
