    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Lax shrublet, up to 1 m tall. Leaves crowded towards branch tips, suberect, lanceolate to elliptic-oblong, 3-16 mm long, leathery, margins stiffly ciliolate. Flowerheads solitary in upper axils on peduncles 5-40 mm long, radiate, yellow, fragrant; involucre hemispherical, 5-10 mm diam., bracts 5 or 6, connate to 1/4. Cypselas densely hairy, mucilaginous when wet.
            sourceIds:
