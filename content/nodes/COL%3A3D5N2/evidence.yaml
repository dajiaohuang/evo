            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: This species is in herbaria and literature usually named E. sulcatus or E. sulcatus var. densifolius, sometimes even 'E. densifolius', although the latter name has never been combined in accordance with the rules. E. sulcatus is a different species, however, and the correct name, E. empetrifolius, has been neglected until now. The capitula of E. empetrifolius are usually radiate, but not seldom discoid forms occur. No other differences exist between these and the ligulate forms. The flowerheads are said to have a strong sweet scent.
