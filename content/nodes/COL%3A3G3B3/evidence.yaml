          - text: Genome resequencing of 545 sampled trees from 51 populations in nine countries was used to infer three refugia in China and multiple human-aided introductions from eastern China to other continents. These are study-level population-history inferences from the sampled trees, not a complete census or proof that every sampled tree was wild.
            locator: Abstract; Results, sections Four ancient genetic components and three refugia of ginkgo and Human-aided dispersal of ginkgo out of China; Methods, Sample collection and resequencing and Analysis of population genetics and phylogeny.
            placeTimeScope: Samples came from 51 populations in nine countries and were selected to represent most known localities of large Ginkgo trees. The cited methods locator does not establish collection dates or resolve wild versus planted status for every sampled tree.
