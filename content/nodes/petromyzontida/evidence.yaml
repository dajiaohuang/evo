    - subjectId: taxon:petromyzontida
      claimKind: scientific
      claimType: taxonomy
      statement: A genomics-era synthesis documents living lamprey diversity, life-history variation and comparative genomic resources. It provides a bounded modern taxonomic context, not a fossil range, exact order origin or ancestral life cycle.
      confidence: medium
      confidenceRationale: Confidence is medium because the cited systematic synthesis directly supports the bounded taxonomy statement at the supplied locator. The confidence does not extend beyond it provides a bounded modern taxonomic context, not a fossil range, exact order origin or ancestral life cycle.
      referenceLinks:
        - relation: supports
          referenceId: mccauley-2015-lampreys-genomics
          pages: 1046–1056
          figure: Figures 1–4; comparative tables
          quoteLocator: Lamprey diversity; genomic resources; model-organism comparison
    - subjectId: taxon:petromyzontida
      claimKind: scientific
      claimType: fossil-range
      statement: The reviewed record places undoubted fossil lampreys at about 358 Ma and living lampreys at the present, supporting a bounded 358 Ma–present evidence route but not a global order FAD.
      confidence: medium
      confidenceRationale: "Petromyzontida fossil-and-living evidence route: the cited primary study or systematic review directly supports the stated sample, calibration or withholding boundary at the supplied locator. Confidence is medium and does not extend to a global FAD, LAD, direct ancestor or unsampled interval."
      referenceLinks:
        - relation: supports
          referenceId: janvier-2008-cyclostome-origins
          pages: 1045–1050
          figure: Fossil lamprey comparison
          quoteLocator: Abstract and fossil-lamprey record
  claim-rationales.zh:
    - 置信度为中：所引系统综述在给定页码、图版或章节定位器处直接支持这一受限的分类表述；置信度不外推到文中明确排除的全群起源、全球首现、直接祖先或精确端点。
    - Petromyzontida fossil-and-living evidence route：所引一手研究或高质量系统综述在给定页码、图表或章节处直接支持此处的样本、校准或暂缓边界。置信度为中等。该置信度不外推至全球首现、全球末现、直接祖先或未采样区间。
  claim-statements.zh:
    - 基因组时代的综合记录了现生七鳃鳗多样性、生活史差异和比较基因组资源。它只提供限定的现代分类背景，不是化石延限、精确目级起源或祖先生活史。
    - 综述把无疑义化石七鳃鳗置于约 3.58 亿年前，并确认七鳃鳗延续至今；这支持 3.58 亿年前至今的有限证据路线，而不是该目的全球首现。
