    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Annual or perennial hygrophilous spreading herbs sometimes covering large stretches of ground, creeping stems forming short, erect side branches, rooting at nodes. Leaves linear to ovate or oblong, 50-140 x 15-25 mm, apex acuminate, glabrous or puberulous, margins often encrusted with white pustules. Spathes pedunculate, folded, broad and acute to long and attenuate. Upper cyme exserted on an erect, glabrous or pubescent peduncle, (l-)2(-3)-flowered, rarely aborted; lower peduncle pubescent, with 3-8 bisexual flowers. Sepals white, membranous. Petals blue or white. Stamens with yellow, red, blue or black filaments and anthers. Capsule quadrate; 2 ventral locules 2-seeded, dorsal locule indehiscent, fusiform, 1-seeded, or empty; seeds reniform, reticulate with tuberculate hexagonal areoles.
