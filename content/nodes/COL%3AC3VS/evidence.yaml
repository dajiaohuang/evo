    facets:
      morphology:
        status: partially-supported
        claims:
          - text: "Grass aloe. Stem up to 950 x 90 mm, decumbent to erect, branched mainly from base, forming robust offshoots along its length, without persistent dried leaves. Leaves deciduous, densely rosulate, erectly spreading, green, with numerous elongated, white, somewhat tuberculate spots on both surfaces, deltoid to ovate-lanceolate, up to 430 mm long, up to 135 mm wide at base; margin narrow, cartilaginous, whitish, with small whitish, deltoid, irregularly spaced teeth, 1-2 mm long, 2-5 mm apart; leaf exudate clear, drying clear, not bitter. Inflorescence 1 per rosette, 0.6-0.8 m high, erect, simple. Peduncle laterally compressed below, terete above, up to 25 mm wide at base, ± 10-15 mm diam. above, bright green; sterile bracts, ± 9, ovate-lanceolate, acuminate, 30-50 mm long, 15-20 mm wide at base, pale whitish with pinkish tinge, thin, subscarious, many-nerved. Raceme capitate, ± 120 x 100 mm, erect, dense; buds erect to erectly spreading, flowers spreading to nodding when open. Floral bracts lanceolate-acuminate, subamplexicaul, ± 30 x 7 mm, pale whitish, thin, subscarious to almost fleshy, many-nerved. Pedicels 30-45 mm long, pale yellowish to salmon-pink. Flowers: perianth salmon-pink, green-tipped, ± 45 mm long, 10-13 mm across ovary, slightly narrowed above ovary to 8-10 mm, slightly constricted to ± 7 mm just before flared mouth, cylindric-trigonous; outer segments free almost to base, tips spreading. Stamens with very pale greenish yellow, flattened filaments, not or only slightly exserted. Ovary ± 10 x 3-4 mm, light green; style very pale yellowish green, exserted to ± 5 mm. Fruit an oblong capsule, bright green to yellowish green, up to 40-45 x ± 22 mm. Seeds angular, black, 3 x 2 mm, with semi-transparent, light brownish wing, ± 1 mm wide. Flowering time: December to February. Chromosome number: unknown."
