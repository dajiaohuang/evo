            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Aloe neilcrouchii belongs to A. sect. Leptoaloe and represents the largest of the known species of this group. Its closest affinity appears to be A. boylei Baker, especially A. boylei subsp. major Hilliard & Burtt. However, it differs from that species by its long, sprawling, leafless stems that branch from the base or form offshoots along its length, its shorter but broader, elongated-deltoid leaves that are copiously covered with white tuberculate spots on both surfaces and its taller inflorescences.
