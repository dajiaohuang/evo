        usage:
          title: Phyla nodiflora (L.) Greene, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Perennial creeping herbs; stems prostrate, mostly rooting at the nodes, usually 30-90 cm long; branches slender, procumbent or ascending, densely appressed- strigillose to minutely puberulent or glabrate. Leaves with the blades thick- textured, fleshy when fresh, spatulate or oblanceolate to obovate, sometimes elliptic or cuneiform, 1-7.2 cm long and 0.6-2.5 cm wide, rounded or obtuse (rarely subacute) apically, narrowed into a long- or short-cuneate base, sharply serrate above the middle with sharply acute or acuminate mostly appressed or subappressed teeth, entire basally, minutely or densely strigillose-puberulent on both surfaces or glabrous, the venation usually indiscernible on both surfaces or at least inconspicuous; petioles 2-8 mm long or obsolete, often so broadly cuneate- margined as to appear as though a part of the blade. Spikes at first globose, cylindric and elongate in age, 1-2.5 cm long when mature and 6-9 mm in diameter, densely many-flowered; peduncles solitary in each axil, slender, often much elon- gate, usually much longer than the subtending leaves, 1-11.5 cm long, densely or sparsely appressed-puberulent or strigose with antrorse canescent trichomes, or glabrous; bractlets closely imbricate, obovate or subrhomboid-cuneate, subequal- ing the corolla-tube, often broadly membranous-margined apically, mucronate- acuminate or muticous, glabrous or finely ciliate. Flowers with the calyx hyaline- membranous, flattened, about equaling the corolla-tube, deeply 2-cleft, slightly 2-carinate, the keels puberulent, the lobes lanceolate; corolla purple or pink to white, 2-2.5 mm long, slightly surpassing the bractlets, the limb exiguous, slightly strigillose.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 13673
