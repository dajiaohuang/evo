    facets:
      morphology:
        status: partially-supported
        claims:
          - text: "Perennial herb. Stems decumbent, rooting at nodes. Leaves shortly petiolate or subsessile; blade spathulate, obovate to narrowly obovate, 8-72 x 4-25 mm, base cuneate, margins entire in basal half, sharply and coarsely dentate towards apex; petioles up to 8 mm long. Flowers: in short, dense spikes; peduncles much longer than subtending leaves; calyx deeply 2-lobed; corolla with tube 1.5-2.0 mm long, 2-lipped, upper lip 2-lobed, lower one 3-lobed, white with a yellow throat or mauve-pink; Jul.-Feb."
            sourceIds:
              - sanbi_16248_0
            locator: "SANBI/WFO archive Morphology row 72387; source 16248.0; publication: Retief, E; Meyer, NL. 2017. Verbenaceae. In: E Retief & NL Meyer (eds), Plants of the Free State: Inventory and identification guide, Strelitzia 38: 818 - 822. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
