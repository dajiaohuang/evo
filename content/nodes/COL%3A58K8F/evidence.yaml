        usage:
          title: Trichospermum mexicanum (DC.) Baill., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Tree, 6-15(-27) m. high, the trunk 18-50 cm. in diam., the bark smooth, gray- ish, the branches spreading, arachnoid to puberulous. Leaves with terete petioles (0.8-) 1-2.2 cm. long, puberulous to tomentose, the blade oblong or oblong-lanceo- late or oblong-obovate, rounded or obtuse at the base, long-acuminate at the apex, 7-20 cm. long and 2.5-9 cm. wide, chartaceous to subcoriaceous, discolor, the mar- gins remotely serrulate, the upper surface scatteringly short-puberulous, the lower surface spreading-puberulous or appressed-puberulous to tomentellous or with both tiers of hairs, often with long hirsute stellate hairs at the base of the 3 main nerves and in the axils of the lateral nerves, the secondary nervation reticulate and prominent beneath. Inflorescences unisexual or androgynous, of axillary or terminal, many-flowered panicles, shorter than the leaves, the axes shortly tomentellous. Flowers with a pedicel 3-9 mm. long, the sepals narrowly oblong to narrowly oblong-lanceolate, acute and cucullate, 9.5-14 mm. long and 2.5-3.2 mm. wide, pinkish, 3- to 5-nerved, minutely puberulous to tomentellous outside, glabrous or scatteringly puberulous inside; petals narrowly obovate-oblong to linear-oblong, rounded or emarginate or undulate to lobulate, 8-12 mm. long and 1-3 mm. wide, purplish, scatteringly puberulous with simple and stellate hairs without, velutinous around and above the gland within, the gland ca. 1 mm. in diam.; gonophore ca. 1.5-2 mm. long, glabrous, the urceolus ca. 3-4 mm. broad; stamens 15, the filaments unequal, 5-9 mm. long and hirtellous near the base in the male flowers, much shorter and ca. 1.5-3 mm. in the female ones; anthers suborbicular, ca. 0.5 mm. long in the male flowers and ca. 0.2-0.3 mm. in the female ones; ovary of the male flowers very small, ovoid, ca. 1-1.5 mm. long and 0.75 mm. broad, more or less glabrous to villous at the base, the style obsolete, the stigma obscurely bilobulate and papillate; ovary of the female flowers pyriform, ca. 2.5-3 mm. long and 2.2-5 mm. broad, densely long-sericeous, the style filiform, 2.5-4 mm. long, puberulous near the base, the stigma bilobulate, the lobes spreading and densely laciniate. Capsule depressed-obovate, truncate or sometimes somewhat cordate and apiculate at the apex, 10-18 mm. long and 17-22 mm. wide, densely provided with 2 tiers of stellate hairs; seeds broadly ellipsoid, ca. 2.5 mm. in diam., long-ciliate along the margins, the hairs simple and ca. 2.5-3 mm. long.
