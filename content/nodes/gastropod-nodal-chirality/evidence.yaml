  claims:
    - subjectId: event:gastropod-nodal-chirality
      claimKind: scientific
      claimType: event-mechanism
      statement: In Lottia gigantea and Biomphalaria glabrata embryos, nodal and Pitx expression occurs on opposite sides corresponding to adult chirality, and Nodal-pathway inhibition disrupts Pitx expression and shell coiling in the sampled system.
      confidence: high
      confidenceRationale: Expression localization, sequence accessions and perturbation phenotypes are directly reported; extrapolation to torsion, other gastropods or the molluscan ancestor is withheld.
      referenceLinks:
        - referenceId: grande-patel-2009-snail-nodal
          relation: supports
          pages: 1007–1011
          figure: Figures 1–4; Supplementary Figures 1–5
          quoteLocator: nodal and Pitx expression; pharmacological inhibition; sequence accessions
  claim-rationales.zh:
    - 表达位置、序列登录号和抑制表型均有直接记录；结论不外推到扭转、全部腹足类或软体动物祖先。
  claim-statements.zh:
    - 在巨帽贝 Lottia gigantea 和光滑双脐螺 Biomphalaria glabrata 的胚胎中，nodal 与 Pitx 在与成体手性相应的相反侧表达；抑制 Nodal 通路会扰乱该取样系统的 Pitx 表达和壳旋卷。
