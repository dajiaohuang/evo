        usage:
          title: Rondeletia hameliifolia Dwyer & M.V.Hayden, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrubs or trees to 8 m tall, the branchlets terete, diffusely white pilose, the nodes often somewhat swollen. Leaves elliptic or elliptic rotund, 5-18 cm long, 2.3-6.0 cm wide, deltoid and widely acuminate at the apex, basally subcuneate, the blade somewhat decurrent on the petiole, the costa prominulous, the lateral veins 6-9, strongly arcuate ascending, prominulous beneath, stiffly papyraceous, discolorous, tending to dry gray green beneath, pilose above and beneath, the hairs above few, white, appressed, densely crowded on the veins; petioles oc- casionally absent, 0.2-2.0 cm long; stipules triangular, 4-10 mm long, 2-4 mm wide, the cusp 2-5 mm long, sericeous inside and out, bearing several oblong glands within, these to 1 mm long, drying black. Inflorescences terminal, cymose paniculate, 4-13 cm long, to 10 cm wide, the peduncle 1-2 cm long, the primary branches paired, few, well spaced, 0.5-1.2 cm long, the branchlets ternately disposed above the middle of the branches, the cymules few flowered or often with the flowers solitary; bracts and bracteoles persistent, triangular subulate, golden pubescent. Flowers sessile or on pedicels to 3 mm long, golden pubescent; hypanthium rotund, ca. 2 mm long, densely golden pubescent, the calycine lobes 5, oblong or triangular subulate, subequal, ca. 1.5 mm long, obtuse at the apex; corolla white, the tube salverform, to 5 mm long, ca. 1 mm wide at the apex, yellow within, the mouth scarcely annular, thickened, the lobes 5, rotund, ca. 4 mm long, rounded or obtuse at the apex; stamens 5, the anthers linear oblong, ca. 2 mm long, the filaments short, attached near the middle of the tube. Fruits oblong rotund, to 0.8 cm long, loculicidally dehiscent, the ribs scarcely promi- nulous, puberulous.
