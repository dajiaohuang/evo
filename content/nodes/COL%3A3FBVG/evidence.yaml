            locator: "SANBI/WFO archive Morphology row 52626; source 15601.0; publication: Swelankomo, N. 2013. FSA Contribution 22: Asteraceae: Calenduleae: Garuleum. Bothalia 43(2): 167 - 178. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Distinguished from other species by recurved-spreading, bipinnati-partite leaves with sharply incised, pectinate lobes, and heads borne on a short, inconspicuous peduncle.
