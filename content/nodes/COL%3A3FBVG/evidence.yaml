    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Shrub with simple and leafless stem at the base, branched above. Leaves alternate, scabrid-glandular, sessile, very densely crowded at ends of branches, recurved-spreading, interruptedly bipinnatipartite with sharply incised lobes, and pectinate rachis on both sides. Capitula radiate, solitary, shortly pedunculate. Involucre campanulate, 10 mm in diam. Involucral bracts in 2-series, more-or-less equal, oblong, slightly acute with membranous margins; outer ±7.0 mm long; inner ±7.5 mm long. Ray florets (10-)12, female, fertile, dark purple, mauve, pale lilac or white, oblong-elliptic; corolla limb 12.0-12.5 mm long, narrowly linear; corolla tube up to 4 mm long, glandular. Style up to 5.5 mm long, linear, branched, style branches ±2 mm long. Ovary up to 2.2 mm long, glabrous, obovate in outline. Mature cypselae not seen. Disc florets functionally male, yellow, 5-lobed; lobes ovate, 0.2 mm long; corolla limb 2.5-3.0 mm long, glandular; corolla tube 1.2 mm long, glandular. Style 3.0-3.2 mm long, branched, style branches ±1 mm long, linear with pollen sweeping hairs. Anthers linear, minutely caudate, with ovate apical appendages. Ovary up to 2.5 mm long.
            sourceIds:
