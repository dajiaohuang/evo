    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Stems 9-34 cm tall, branched only at the base. Leaves opposite and decussate; lamina 27-46 x 6-26 mm, triangular, oblong-triangular or linear; petiole 2-8(-13) mm long. Inflorescences 3-8 per stem, 3-9-flowered; peduncles 12-50 mm long; pedicels 6-11 mm long. Calyx segments 2.5-4 x 1-1.5 mm. Corolla lobes 5.5-7.5 x 2.5-3.25 mm, flat, dorsally green with brown or purple markings towards the tip, ventrally white veined with brownish purple; dorsal surface glabrous or pubescent, ventral surface glabrous, margin sparsely ciliate. Corona 2-3 mm long, equalling to slightly exceeding the gynostegium, cream-coloured to bright yellow-green; each lobe subquadrate in dorsal view, bearing a short simple or longer bilobed ventral appendage, the lower half of the ventral surface united with the staminal column. Anthers with appendages 0.5-0.75 mm in diameter, circular, dull purple with white margin, appressed against the top of the gynostegial head; corpusculum 0.21-0.31 mm long, not flanged; pollinium attachment subapical; pollinia 0.46-0.54 mm long, compressed pyriform, the germination zone extending along 2/3 of the outer edge, almost meeting the point of attachment. Gynostegium pale green. Fruit c. 6.5 cm long; seed not seen.
