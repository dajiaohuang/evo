    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Acaulescent or short-stemmed, succulent perennial, to 50 cm, with persistent dried leaves; rosettes usually single, sometimes in small groups. Leaves reddish green, both surfaces usually copiously white-spotted, obscurely lineate, lanceolate-deltoid, up to 30 cm long, without spines or prickles; margin reddish brown, cartilaginous, with pungent, deltoid, reddish brown teeth. Racemes conical to cylindric, bicoloured, ± dense, erect to arcuate-erect, simple, 60-80 cm high. Flowers dull red in bud, yellowing with age, occasionally uniformly yellow or red, 25-30 mm long; stamens and stigma exserted.
            textZh: Aloe microstigma Salm-Dyck 的 SANBI 物种条目记录了形态特征。
            sourceIds:
