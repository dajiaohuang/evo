    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Perennial, tufted, up to 1.8 m high. Rhizome swollen, woody; culms brittle, often branched, with a waxy bloom below node, nodes occasionally hairy. Leaf blades 100-250 mm long, 5-9 mm wide. Spikelets 5-9 mm long, spikelets light or sienna brown; upper glume and lower lemma 3-nerved; lower lemma with 3 tufts of white hairs on either side above middle, lobes acute and 1.0-1.5 mm long, awns 7-12 mm long.
            textZh: Danthoniopsis pruinosa C.E.Hubb. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
