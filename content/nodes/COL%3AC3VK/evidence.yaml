          - text: A. mutabilis is closely allied to A. arborescens, and when not in flower the former can usually be distinguished by its longer much broader leaves, with marginal teeth much further apart, and smaller. When flowering they can hardly be confused, since in A. mutabilis the racemes are distinctly bicoloured, whereas in A. arborescens they are unicoloured reddish. A. mutabilis also differs in having shorter flowers which are often distinctly clavate, and basally more markedly stipitate. A. arborescens is also a much more branched and much taller plant, with erect stems up to 9-12 ft. high, while A. mutabilis is about one-quarter that size.
