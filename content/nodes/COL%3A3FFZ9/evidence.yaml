        claims:
          - text: "Perennial, dwarf shrub ± 0.10 m high; densely branched, caespitose. Leaves densely crowded, rigid, undivided, linear, 20-30 x 1.0-1.5 mm, margins ciliate with spinules 1 mm long, upper surface smooth and glabrous, lower surface glabrous tomentose except for midvein; tomentum often hidden beneath revolute margins. Capitula on peduncles 30-50 mm long; involucre subcampanulate; all scales terminal, 2- or 3-seriate; outer involucral scales linear-triangulate, 5 x 1.5 mm wide, acute, margins very slightly denticulate; inner involucral scales: ovate-triangulate, 7-8 x 2-3 mm wide, acuminate, margins entire. Ligules yellow. Flowering time all year, rainfall dependent."
            sourceIds:
