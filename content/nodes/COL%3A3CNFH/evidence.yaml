    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Monoecious, spineless, glabrous succulent, up to 300 x 300 mm, with a rosette of branches from a stout, obconic main stem, branches ascending, cylindrical, 8-10 mm thick, spineless, but with persistent woody peduncles, covered with low tubercles. Leaves soon deciduous, ovate, 1-2 mm long. Cyathia many around apex of each branch, each on a sometimes persistent peduncle in axil of tubercle, 6-7 mm diam., with 5 brown glands each with 5-7 finger-like processes on outer margin. Capsule sessile, 5-6 mm diam., glabrous.
            sourceIds:
              - sanbi_14858_0
            locator: "SANBI/WFO archive Morphology row 34769; source 14858.0; publication: Bruyns, PV. 2013. Euphorbiaceae. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 371 - 379. South African National Biodiversity Institute, Pretoria. [CC BY]"
