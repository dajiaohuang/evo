    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, 10-30 cm, with short, twisted branchlets, corm tunics of dark, wiry fibres. Leaves 3, lower two lanceolate to falcate, margins thickened, upper leaf entirely sheathing. Flowers 2-6 in a wiry, twisted spike, erect, blue-purple with yellow-green throat edged dark purple, unscented, tube funnel-shaped, 9-14 mm long, filaments included.
            textZh: Ixia contorta Goldblatt & J.C.Manning 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 7144; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Distinguished among species of sect. Morphixia with included filaments by the markedly flexuose spikes and by the main axis strongly flexed below the first flower, thus inclined to nearly horizontal. The purple flowers (also sometimes described as blue or lilac) have a yellow cup sometimes edged in dark purple, and are held upright on the spikes. The perianth tube is 9-13(-14) mm long and the tepals are 9-12 mm long. The very different appearance of the flowers suggests that these plants are not immediately allied to I. rapunculoides with which they were first associated and its relationship to the I. rapunculoides complex seems questionable. Plants from the north of the range near Alberta Farm, and in the Cederberg stand out in having a longer and sometimes wider perianth tube, 12-14 mm long. Plants are usually fairly short, seldom exceeding 150 mm, but collections from Gydo Pass (e.g. Leipoldt 3023) are taller, some reaching 300 mm. Typical Ixia contorta has also been collected on Gydo Pass and it seems likely that the taller plants with narrow leaves are not simply a local variant of the species but hybrids, the result of crossing with I. divaricata, which also grows there. The longer, narrower leaves, paler flower colour and slightly larger perianth in these plants may also reflect the influence of genes of I. divaricata.
            textZh: SANBI 条目提供了 Ixia contorta Goldblatt & J.C.Manning 的鉴别特征。
