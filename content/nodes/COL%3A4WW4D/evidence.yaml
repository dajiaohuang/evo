        usage:
          title: Serjania paniculata Kunth, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Lianas; stems weakly 5-ribbed, viscidulous, tomentulose when young, be- coming nearly glabrous on the ribs, weakly to densely pubescent in the sulci; wood composite with a central bundle surrounded by usually 5 smaller bundles. Leaves biternate, 8-30 cm long; petioles without wings, 1.8-10 cm long; rachis without wings, with marginal ribs and a medial rib, nearly glabrous except along the upper surface; leaflets elliptic to ovate or obovate, acuminate to obtuse at the apex with a minute apiculum, attenuate and inequilateral or equilateral at the base, (2-)3.5-11 cm long, (1-)1.8-5 cm wide, crenate to crenate-lobate in the outer half, glabrous on the upper surface except often strigillose on the raised midrib, the lower surface glabrous except for barbulate vein axils and sometimes strigillose veins. Inflorescences terminal and paniculate or axillary in the upper leaf axils, the thyrses unbranched, to ca. 12 cm long, viscidulous, tomentulose to villous, angulate; bracteoles deltoid, pubescent; pedicels tomentose, to ca. 2 mm long. Flowers white; calyx tomentose on both surfaces; petals oblong-obovate, 4.5-5.5 mm long, glabrous, sparsely glandular on both surfaces, the anterior scales 2/3-3/4 as long as the petals, the basal part elliptical, densely villous margin- ally, the scale deeply bifurcate, 1.1-1.8 mm long, equalling or exceeding the length of deflexed appendage, the lobes narrowly acute, thin, the deflexed ap- pendage deltoid to narrowly triangular, glabrous at the apex, densely villous otherwise; disc glands 4, as broad as or broader than long, glabrous, the anterior ones larger; filaments flattened, villous; staminate flowers with the stamens to 3.5 mm long, the ovary minute, trigonous, glabrous; bisexual flowers with the stamens to 2.5 mm long, the pistil to 4.8 mm long, the ovary oblong-obovate, hispidulous, trigonous, 2 mm long, the style 3-branched from near the middle, glabrous except on the stigmas. Fruits narrowly ovate-cordate, 2-2.7 cm long, 1.5-1.9 cm wide, viscidulous, shallowly cordate at the base, weakly constricted below the seed-bearing part, the latter densely whitish-hispidulous, the wings shiny, glabrous except sparsely hispidulous along the inner margin.
