            zh: Purus National Forest 的 2011 年样线调查、后续地点观察及形态和分子分类比较；所报样线记录不是密度估计，完整边界仍未确定。
            en: 2011 transect surveys, later locality observations and morphological and molecular taxonomic comparisons in Purus National Forest; transect counts are not a density estimate and complete boundaries remain unresolved.
