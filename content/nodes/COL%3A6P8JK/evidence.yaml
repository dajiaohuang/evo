            zh: 本地 MDD v2.5 源记录使用 Saguinus cruzlimai，置于 Saguinus 属、Leontocebus 亚属，并提供英文显示名 “Cruz Lima's Saddle-back Tamarin”；该记录与固定 COL26.8 ID 的交叉联接仍未命中，不能仅凭同一词尾改写分类身份。
            en: The local MDD v2.5 source row uses Saguinus cruzlimai under genus Saguinus and subgenus Leontocebus, with the English display name “Cruz Lima's Saddle-back Tamarin”. Its join to the pinned COL26.8 ID is unmatched; a shared epithet alone is not used to rewrite taxonomic identity.
