      claimType: taxonomy
      claimKind: scientific
      statement: CAGS 01-IG-1a,b was recovered as basal Eutheria in the original matrix, while later combined analyses can move Eomaia outside Theria; neither result is ancestry.
      confidence: contested
      confidenceRationale: The taxonomy field for eomaia is bounded to the named material and cited primary-study locator; that evidence type is not generalized to ancestry or a whole clade.
