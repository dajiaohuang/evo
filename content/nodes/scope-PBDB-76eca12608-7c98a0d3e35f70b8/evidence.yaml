  claim-rationales.zh:
    - 早白垩世兽类标本的分类表述只覆盖具名标本及所引主研究的分析范围；导航归属不表示直系祖先或普适系统树。
    - 早白垩世兽类标本的地理字段只投影主研究记录的具体产地，不外推为全球分布、起源中心或完整扩散路径。
    - 早白垩世兽类标本的生态字段区分保存事实与功能推断；未被标本直接记录的饮食、行为、栖息地或性能均明确保留不确定性。
    - 早白垩世兽类标本的形态字段限定于主研究列明的具名标本和精确页码、图版或补充材料，不外推到整个支系。
    - 早白垩世兽类标本的年代范围是主研究标本或地层背景的有界投影，不作为全球首现、末现、分化时间或连续谱系时长。
  claim-statements.zh:
    - CAGS 01-IG-1a,b 在原始矩阵中被恢复为真兽类基部成员，而后来的综合分析可将 Eomaia 移至兽亚纲之外；两种结果都不表示祖先关系。
    - 本资料限于辽宁义县组的产出，不能确定真兽类或兽亚纲的全球起源区域。
    - 牙齿和肢体比例支持食小动物及攀缘生活的推断，但摄食和运动行为并未被直接观察。
    - 这件关节连接的正模保存了颅骨、牙齿、躯后骨骼的大部分、足和爪，供解剖与系统发育比较使用。
    - 1.258 亿至 1.241 亿年前的区间是义县组样本背景，并非通用的兽亚纲首次出现、真兽类校准点或标本直接测年。
