    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Perennial, densely and coarsely tufted, or rhizomatous (rhizome oblique), up to 0.8 m high. Leaf blades 100-450 mm long, 2-14 mm wide, folded at first, pilose on upper surface, glabrous, shining and smooth below; ligule membranous, 2-10 mm long. Spikelets 5-9 mm long. Panicle 50-300 mm long; racemes closely spaced, lowest usually solitary, remote and bare at base; spikelets 3-5(-7)-flowered, laterally compressed; glumes and lemmas strongly keeled, keels finely or coarsely ciliate, tips acuminate, mucronate or awned, awn to 1.5 mm long.
