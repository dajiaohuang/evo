    facets:
      morphology:
        status: partially-supported
        claims:
          - text: The corresponding taxon account provides a species-level shell and soft-part/anatomical description and diagnostic treatment; the current dossier records the existence and scope of that account without extracting a full character matrix.
            originalLanguage: en
            sourceIds:
              - treatment
            locator: Species account, pp. 220–222; description/diagnosis and associated figures
            placeTimeScope: Account published 2025; taxon-specific specimens examined in the original treatment.
            lifeStatus: Wild species; treatment specimens only.
        gaps:
          - Measurements, sex/stage coverage, within-species variation, diagnostic character comparison, and specimen-by-specimen sampling have not been independently abstracted.
      lifeHistory:
        status: not-assessed
        claims: []
        gaps:
          - The paper’s species-description study was not a systematic life-history or reproductive-behavior search; no life-history claim is made.
      ecology:
        status: partially-supported
        claims:
          - text: "The account reports the following type locality and the treatment’s stated habitat/locality observations: Mislina spring, Neretva River Delta near Metković, Croatia (42°58′56″N, 17°36′24″E; 4 m); holotype NHMW-MO-113906, collected 2020-08-04. Besides the type locality, the treatment reports spring Studena (locality 13); it describes the known area as a very small area around the spring supplying Mislina lake."
            originalLanguage: en
            sourceIds:
              - treatment
            locator: Species account, pp. 220–222; type material, habitat and distribution paragraphs
            placeTimeScope: Only the account’s named collection localities; collection dates are account-specific and no unsampled sites are inferred.
            lifeStatus: Wild freshwater snails; localities and specimens reported by the authors.
        gaps:
          - No complete interaction network, host/resource use, population ecology, seasonal ecology, or habitat-wide survey has been assembled.
      evolution:
        status: partially-supported
        claims:
          - text: The study assigns this taxon to mitochondrial operational unit mOTU B and reports COI sequence accession(s) PX113142–PX113146; the paper cautions that COI data do not resolve deeper phylogenetic relationships. The mOTU label is not treated as a species-tree placement.
            originalLanguage: en
            sourceIds:
              - treatment
              - paper
            locator: Species account, pp. 220–222; molecular/mOTU assignment and cited GenBank accession(s); article discussion on limits of COI evidence
            placeTimeScope: Study-specific sequence sample and analysis published 2025; accession identifiers as reported in the taxon account.
            lifeStatus: Wild study specimens; molecular evidence from the reported samples only.
        gaps:
          - A species-level phylogenetic placement with broader loci, sampling, competing topologies and uncertainty has not been established here.
      distribution:
        status: partially-supported
        claims:
          - text: Besides the type locality, the treatment reports spring Studena (locality 13); it describes the known area as a very small area around the spring supplying Mislina lake.
            originalLanguage: en
            sourceIds:
              - treatment
            locator: Species account, pp. 220–222; type locality and distribution section
            placeTimeScope: Reported collection sites and dates in the cited study; geographic extent is limited to the named localities and study period.
            lifeStatus: Wild populations; no introduced/native range designation beyond treatment localities.
        gaps:
          - No current global checklist of localities, georeferenced range boundary, native/introduced assessment, or sampling-completeness study has been completed.
      fossil:
        status: not-assessed
        claims: []
        gaps:
          - No fossil database or paleontological literature search was performed; no absence-of-fossils conclusion is drawn.
      conservation:
        status: partially-supported
        claims:
          - text: The authors assess the species as Endangered (EN) in the treatment; the record here is only the authors’ assessment, not a verified current IUCN or national listing.
            originalLanguage: en
            sourceIds:
              - treatment
            locator: Species account, pp. 220–222; authors’ ecological/conservation status paragraph
            placeTimeScope: Author-assigned status in the 2025 taxonomic treatment; its assessment scope is limited to the account’s reported locality data.
            lifeStatus: Wild taxon; author assessment only, not an independently verified current formal assessment.
        gaps:
          - Assessment criteria, evaluator authority, assessment date/validity, population trend and current IUCN or national registry record have not been independently verified.
