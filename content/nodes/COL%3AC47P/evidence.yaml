    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants acaulescent or very shortly caulescent, stem simple, usually solitary, sometimes in small groups of 2-4 plants from division, never suckering and forming dense groups. Leaves about 45, densely rosulate, lanceolate-ensiform or narrowing gradually from the base, somewhat arcuate-incurved, 60-80 cm long, 11-12 cm broad at base; upper surface flat low down, slightly canaliculate upwards; lower surface convex; both surfaces coriaceous, dull grey-green or pale glaucous-green, without spots or lineation; margins armed with small deep brown to black deltoid pungent teeth 2 mm long, 2-10 mm distant, usually more crowded near base, more distant upwards, sometimes bifid, usually isolated and directed forwards. Inflorescence, 1-1.5 met. high, 2-3, simultaneous or consecutive, usually divaricately 3-4-branched from about the middle. Peduncle brown, bi-convex and 3-5 cm broad at base, terete upwards, the branches usually divaricately arcuate-erect, and subtended at base by thin scarious many-nerved pale brown ovate-acuminate bracts. Racemes cylindric-conical, densely flowered, about 20 cm long, distinctively bicoloured, the buds dark reddish, the open flowers bright chrome-yellow, the youngest apical buds somewhat globular and hidden by their longer bracts. Bracts ovate in lower half, acuminate, about 20 mm long, and 16 mm broad, very thin, sub-scarious, somewhat pellucid, pale brown, about 12-nerved. Pedicels lowest 20-25 mm long, 30 mm and more in the fruit. Perianth chrome-yellow, cylindric-carinate, somewhat trigonous, usually with the mouth distinctly upturned, averaging 35 mm in length; outer segments free to base, faintly pale nerved throughout, the 2 upper closely grouped, the lowest distinctly naviculate, with the apices sub-acute, spreading, somewhat brownish tipped; inner segments free, not cohering to the outer, broader than the outer, with thin white margins and 3-5 congested nerves in median line, the apices brownish, more obtuse and more spreading to revolute. Filaments lemon-yellow, much flattened, the 3 inner narrower and lengthening in advance of the 3 outer, with their anthers in turn exserted 2-4 mm Stigma at length exserted 5 mm. Ovary 9 mm long 4-5 mm diam., 6-grooved, green. Capsule about 25 mm long, 12 mm diam., cylindric-oblong, roundly 3-angled, for some time enwrapped with the dried remains of the perianth.
            textZh: Aloe wickensii Pole-Evans 的 SANBI 物种条目记录了形态特征。
