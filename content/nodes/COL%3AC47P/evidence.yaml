            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: When the plants are not in flower, those of A. Wickensii can be distinguished from A. Pienaarii by their paler green leaves which are distinctly incurved. The inflorescence differs markedly from that of A. Pienaarii. It is much less branched and much more open. As a rule there are not more than two lateral branches, whereas in A. Pienaarii there are usually about eight, some of which may again be branched. The racemes also are shorter and more conical than in A. Pienaarii. The flower-buds are at first morocco-red (R.C.S.), they then turn a dull green-yellow (R.C.S.) and finally the open flowers become a bright lemon chrome (R.C.S.). The perianth differs from A. Pienaarii in being distinctly carinate; it is about 7 mm. diam. towards the base and 13 mm. diam. at the widest portion.
