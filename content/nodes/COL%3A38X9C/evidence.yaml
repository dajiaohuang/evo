        usage:
          title: Elaeagia nitidifolia Dwyer, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Trees, to 6 m, the branchlets often drying green, glabrous, subterete, the petiole scars conspicuous, crowded, the terminal bud black, shiny, covered with a resinous exudate. Leaves ascending, oblong, 7-23 cm long, 4.0-8.5 cm wide, obtuse to widely cuneate above, acuminate, the acumen triangular, to 0.5 cm long, acute at the base, often ultimately slightly contracted, the costa prominulous above, prominent beneath, drying dull, shiny red, the lateral veins arcuate, 10- 14, prominulous above and below, the submarginal undulate vein obvious or not, the reticulate intervenal are-as small but conspicuous, the smaller veins pinnati- form, thin coriaceous or coriaceous, usually slightly discolorous, drying tan be- neath, glabrous, minutely farinose- punctate under magnification above and below, the margin thinly callose marginate; petioles 2.0-2.5 cm long, rigid, stout, shiny, rubescent; stipules persistent only at twiglet tips, connate, located immediately above the point of petiole attachment, perhaps eventually splitting, cylindrical, somewhat oblong in outline, to 0.5 cm long, truncate, coriaceous, glabrous, cov- ered with a glistening resin. Inflorescences terminal, cymose paniculate, some- what oblong in outline, 12-16 cm long, to 10 cm wide, glabrous, with 3 peduncles terminating the twiglet, or perhaps the peduncle suppressed and 3 branches aris- ing directly from the twiglet tip, the median peduncle or branch 7.0-8.5 cm long, rigid, ascending, plano compressed, somewhat twisted, drying shiny deep red, the lowermost branches 2.5-3.0 cm long, 7-9 cm between the first and second pair of branches, the smaller branches from these 2.5-3.0 cm long, opposite or subopposite, well spaced, the flowers usually 12-15 per branchlet, the cymes 3- 4-flowered, usually unilaterally disposed, the flowers occasionally solitary. Flow- ers pedicellate, the pedicels -reflexed, to 5 mm long, glabrous, stiff; hypanthium scarcely measurable, acute at the base, glabrous, the calyx cup bowl shaped, ca. 2 mm long, truncate, edentate, coriaceous, glabrous; corolla white, the tube cy- lindrical, ca. 1.5 mm long, glabrous outside, densely barbate within, the hairs thin, white, the lobes 5, oblong, ca. 2 times the length of the tube, obtuse, glabrous except densely barbate at the base within; stamens 5, exserted, the anthers ob- long, ca. 1.5 mm long, sub-basifixed, the filaments ca. 2.5 mm long, glabrous, affixed near the mouth; ovarian disc pancakelike, marcescent on drying; style ca. 4 mm long, glabrous, the stigmas 2, ca. 1.5 mm long, scarcely wider than the style. Fruits turbinate, to 6 mm long, truncate, glabrous, drying brown, withered reticulate on drying, loculicidally dehiscent, the orifice of the pericarp appearing gaping and bilabiate within the calycine cup, the latter arising slightly below the rounded apex of the pericarp, extending for ca. 1.5 mm, to 5 mm broad; seeds numerous, oblong to hemispherical, compressed, ca. 0.2 mm long, reticulate.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 11607
          archiveSourceId: EA2E2EC4-9039-43B1-93A0-B821F28AD328
