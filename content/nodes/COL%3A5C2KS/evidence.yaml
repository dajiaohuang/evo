          originalSourceText: Large herb or shrub to 5 m tall, twigs shaggy pubescent with long, erect, dendritic, somewhat viscid hairs. Leaves elliptic or ovate, apically acute or acuminate, basally obtuse or rounded, to 25 cm long; above with scattered erect dendritic hairs, beneath softly tomentose especially along the veins, lateral veins 3-5 on each side of the midvein, the lamina reticulate veined; petioles 2-4 cm long, shaggy pubescent; minor leaves 1/4 as large as the major leaves. Inflores- cences mostly fascicled on short, less than 4 mm long obscure peduncles, rarely on elongate, slender peduncles 30 cm long; the pedicels 8-18 mm long, elongating slightly in fruit, mostly pubescent. Flowers with the calyces tomentose to glabrous, entire, to 2.0 mm long, in fruit becoming as long as 3 mm long and some- This content downloaded from 192.104.39.2 on Tue, 14 May 2013 16:07:58 PMAll use subject to JSTOR Terms and Conditions1973] D'ARCY-FLORA OF PANAMA (Family 170. Solanaceae) 763 times splitting; corolla mostly 5-merous, 5-9 mm long, the tube much shorter than the lobes, outside puberulent with short simple hairs or pilose with elongate, some- times dendritic hairs, the lobes lanceolate, to 6 mm long, pubescent basally inside; filaments flattened, tomentose inside, almost as long as the anthers, the anthers elongoid, ca. 2 mm long, apiculate; the style slender, gently broadening upwards, glabrous, the stigma capitate. Fruit a red, mostly pubescent berry; seeds 1.4-1.6 mm long.
