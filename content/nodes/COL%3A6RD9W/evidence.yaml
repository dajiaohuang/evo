          - text: A compact, white-woolly shrublet to 60 cm, with narrowly triangular, untwisted leaves 2–6 mm long and axillary tufts; discoid heads are in dense rounded terminal clusters, five-flowered, with erect, slightly concave bracts and pink to white inner petaloid bracts.
