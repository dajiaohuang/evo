          title: Schultesia pohliana Progel, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Herb to ca. 35 cm tall; stems slender, terete to subangulate, smooth to slightly winged, unbranched or sparingly 2- to 3-branched above, the branches strongly ascending, the internodes exceeding the leaves. Leaves uniformly distributed along the stems, linear, 1-1.8 cm long and 2-3 mm broad, obtuse to acute at the apex, becoming amplexicaul at the base, the lateral veins inconspicuous, submem- branous. Inflorescences terminal, 1-flowered by reduction of simple dichasia; the pedicel 6-12 mm long. Flowers 1.4-1.8 cm long, rose; calyx tube 8-9 mm long, narrowly urceolate, the lobes 5-6 mm long, triangular, carinate, ? erect, the margins membranous; corolla 1.4-1.8 cm long, the lobes 4-6 mm long, stamens subequal, 4-5 mm long, inserted midway on the corolla tube, the filaments winged toward the base, the anthers linear, 1.5-2 mm long, minutely mucronate; ovary 2-3 mm long, the style 6-8 mm long, the stigma lobes oblong, ca. 1 mm long. Capsule unknown.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 5995
