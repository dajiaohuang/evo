          publishedAt: undated
          originalSourceText: Vines of open areas and forest edges; stems with canescent ferruginous pu- bescence. Leaves with leaflets broadly lanceolate, ovate to narrowly obovate, 7- 10 x 4-6 cm, the apex acute, usually glabrescent above with variable pubescence below, chartaceous, obtuse at the base, the laterals oblique, primary lateral veins in ca. 6 pairs; petioles 4-6 cm long, the rachis 4(-10) mm long, densely puberulent to strigose; stipels to 2 mm long; stipules triangulate, ca. 3 mm long, not produced. Inflorescences slender, to ca. 70 cm long, flowering about 1/2 the length, the tubercles subsessile to elongate, inflorescence indumentum canescent subtomen- tose to glabrescent; bracts triangulate rhombic, ca. 3 x 2 mm, persistent; brac- teoles sub-orbicular, 6-10 x 4-6 mm, caducous; pedicels (5-)7(-15) mm long. Flowers ca. 2.5 cm long, the calyx tube ca. 8 mm long, membranous, glabrous without, canescent velutinous within, the upper calyx teeth fused, entire, the upper lobe acute obtuse, ca. 8 mm long, the lateral lobes falcate, broadly lan- ceolate, ca. 6 mm long, the lower lobe lanceolate, ca. 8 mm long; standard or- bicular obovate, to ca. 25 mm long, membranous, puberulent apically, bicallose, biauriculate, the claw 7 mm long, the wings obliquely obovate, to 22 mm long, usually spurred, the claw 7 mm long, the keel obliquely oblong to nearly oblong, to ca. 20 mm long, ca. 10 mm wide distally, weakly auriculate, the claw ca. 5 mm long, the upper margin with 7-10 medial fimbriae, ca. 2 mm long; stamens 10, glabrous, anthers uniform; ovary ca. 11-ovulate, canescent velutinous, the style glabrous distally for ca. 7 mm. Fruits flat, oblong, usually obtuse basally, straight above, naviculate below, frequently with a falcate apex, to ca. 11.0 x 2.0 x 0.4 cm, dehiscent, with erect, stiff, ferruginous pubescence, the upper su- ture paralleled by thin wings, the lower swollen; seeds 7-12, flat, elliptic oblong, ca. 10 x 6 x 2 mm, hard, reddish brown, frequently maculate, the hilum encir- cling nearly ?2 the testa.
