            locator: "SANBI/WFO archive Morphology row 97752; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Aristea parviflora has well-branched stems (one or two orders of branching) and the smallest flowers in the genus, the tepals ± 6 mm long and the flower thus ± 12 mm diam., and correspondingly short filaments, ± 2.5 mm long. The globose capsules up to 4 mm long are also distinctive.
