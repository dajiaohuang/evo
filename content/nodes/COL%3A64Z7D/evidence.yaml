        claims:
          - text: Plants epiphytic; with woody stem 10-50 mm long; roots 1-2 mm in diameter; leaves 2-7, dark green, fleshy, up to 150 mm long and 30 mm wide, oblanceolate, apex dilated and unequally bilobed. Inflorescences arising below the leaves, 1-few, mostly pendulous and up to 170 mm long, with 2-6 flowers; bracts triangular, 4-8 mm long. Flowers with spreading perianth lobes, white with pink tinges in the spur. Median sepal acute, lanceolate, 18-25 mm long and 5-7 mm wide; lateral sepals similar but up to 28 mm long. Petals similar, 16-20 mm long and 5-6 mm wide. Lip oblong, apex acuminate, 16-20 x 7-8 mm; spur slender-filiform, pendulous and 60-75 mm long. Gynostemium c. 4 mm long; anther slightly beaked, pollinia globose with rather broad stipes; rostellum with straight beak.
