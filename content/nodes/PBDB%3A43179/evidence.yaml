  claims:
    - subjectId: taxon:metamynodon
      claimKind: scientific
      claimType: ecology
      statement: Comparative anatomy of Metamynodon planifrons—high orbits, reduced thoracic spines and limb-lever differences—together with channel-sandstone association supports a semi-aquatic locomotor inference, not direct observation or a family-wide amynodont ecology.
      confidence: medium
      confidenceRationale: The cited study explicitly tests locomotor characters against other amynodontids. Medium confidence separates measured anatomy and depositional association from behavior and keeps the inference at the sampled species level.
      referenceLinks:
        - referenceId: wall-heinbaugh-1999-metamynodon-locomotion
          relation: supports
          pages: 8–17
          figure: Figures 1–8; Table 1
          quoteLocator: Abstract, comparative characters and conclusions testing semi-aquatic locomotion in Metamynodon planifrons
    - subjectId: taxon:metamynodon
      claimKind: scientific
      claimType: taxonomy
      statement: Metamynodon is treated as an amynodontid genus, with the detailed locomotor profile restricted to M. planifrons specimens used in the comparative study.
      confidence: medium
      confidenceRationale: The primary comparative paper names its Metamynodon material and outgroups; genus-wide extrapolation is avoided.
      referenceLinks:
        - referenceId: wall-heinbaugh-1999-metamynodon-locomotion
          relation: supports
          pages: 8–17
          figure: Figures 1–8; Table 1
          quoteLocator: Abstract, comparative characters and conclusions testing semi-aquatic locomotion in Metamynodon planifrons
    - subjectId: taxon:metamynodon
      claimKind: scientific
      claimType: fossil-range
      statement: The atlas’s 40.4–23 Ma occurrence envelope remains provisional; the cited anatomical study independently anchors Orellan M. planifrons material but does not validate exact global endpoints.
      confidence: low
      confidenceRationale: Medium confidence separates a sampled North American interval from an occurrence-derived navigation envelope.
      referenceLinks:
        - referenceId: wall-heinbaugh-1999-metamynodon-locomotion
          relation: supports
          pages: 8–17
          figure: Figures 1–8; Table 1
          quoteLocator: Abstract, comparative characters and conclusions testing semi-aquatic locomotion in Metamynodon planifrons
    - subjectId: taxon:metamynodon
      claimKind: scientific
      claimType: morphology
      statement: Metamynodon planifrons combines high-set orbits, reduced thoracic neural spines and limb-lever proportions that differ from more terrestrial amynodontids.
      confidence: medium
      confidenceRationale: The comparative measurements and figures directly support these characters; broad-torso and soft-tissue claims were removed where the source did not measure them.
      referenceLinks:
        - referenceId: wall-heinbaugh-1999-metamynodon-locomotion
          relation: supports
          pages: 8–17
          figure: Figures 1–8; Table 1
          quoteLocator: Abstract, comparative characters and conclusions testing semi-aquatic locomotion in Metamynodon planifrons
    - subjectId: taxon:metamynodon
      claimKind: scientific
      claimType: biogeography
      statement: The detailed profile is geographically bounded to Orellan channel deposits of Badlands National Park, South Dakota; it is not a complete Asian–North American genus distribution.
      confidence: medium
      confidenceRationale: The cited primary study directly documents its sampled locality and sedimentary association.
      referenceLinks:
        - referenceId: wall-heinbaugh-1999-metamynodon-locomotion
          relation: supports
          pages: 8–17
          figure: Figures 1–8; Table 1
          quoteLocator: Abstract, comparative characters and conclusions testing semi-aquatic locomotion in Metamynodon planifrons
  claim-rationales.zh:
    - 引文研究明确用其他两栖犀科成员比较并检验运动性状。中等置信度区分了测得的解剖与沉积关联和行为推断，并把结论限制在取样物种。
    - 分类主张以所引主研究或系统综述中的明确分类与样本为界，不把导航父级写成直接祖先。
    - 化石范围主张把论文直接约束的区域或样本年代与图集的临时导航端点分开，端点不被当作精确起源或灭绝时刻。
    - 形态主张只保留引文图表或诊断直接支持的骨骼、牙齿性状，并把软组织、姿势或功能解释明确标为推断。
    - 生物地理主张按论文实际覆盖的地点和区域表述，不把区域样本扩写为完整全球分布。
  claim-statements.zh:
    - 对平额两栖犀的比较解剖——高位眼眶、较低的胸椎棘突和不同的肢体杠杆——连同河道砂岩产出，支持半水生运动方式的推断；这既不是行为的直接观察，也不是整个两栖犀科共有的生态。
    - 两栖犀属按所引系统研究采用当前分类层级；导航父级仅表示分类关联，不表示直接祖先。
    - 两栖犀属的图集数值范围仍是临时导航包络；主研究只独立约束其明确讨论的区域或样本年代，端点不是精确起源或灭绝时刻。
    - 两栖犀属的形态档案仅记录所引研究直接描述或测量的牙齿、颅骨或肢骨性状，功能解释另行标注。
    - 两栖犀属的地理档案只覆盖所引研究明确讨论的区域与地点，并非完整的全球产出分布。
