        claims:
          - text: Cormous geophyte, 12-30 cm, tunics woody, imbricate. Leaves linear. Flowers white to cream-coloured, tepals cupped.
            textZh: Geissorhiza geminata E.Mey. ex Baker 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 6780; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: "Recognised by the wetland habitat, white flowers, and corms with concentric tunics, Geissorhiza geminata also has an unusual branching pattern: when branched, the stem forks into two ± equal axes, thus in dichotomous fashion, the main stem then hardly different from the branch. Geissorhiza geminata is superficially similar to G. brehmii, which is also semi-aquatic and has fairly large white flowers, but G. brehmii has the imbricate corm tunics of subg. Geissorhiza and also differs in having terete leaves, whereas G. geminata has plane or possibly hollow terete leaves without visible or raised margins."
            textZh: SANBI 条目提供了 Geissorhiza geminata E.Mey. ex Baker 的鉴别特征。
            sourceIds:
