        claims:
          - text: Folia synanthia, c. 3, c. 35 x 1.3-1.8 cm, lorata, subobtusa. Pedunculus c. 16 cm longus. Bracteae spathae 4-4.5 cm longae, basi 7-8 mm latae, lanceolatae, acutae. Flores in inflorescentia c. 5-6. Pedicelli inaequales, 1-4.5 cm longi, post anthesin paulo elongati. Perianthium 2.6 cm longum, externe et interne ad lobos aurantiaco-rubrum, in tubo pallide flavum; tubus 10 mm longus; lobi omnes c. 16-18 mm longi, interiores 7 mm exteriores 6 mm lati. Stamina lobis exterioribus opposita filamentis 9 mm longis, ea interioribus opposita filamentis 10 mm longis; antherae dorsifixae, versatiles, 4 mm longae. Ovarium 6 mm longum; stylus 20 mm longus, apice in ramos 3 stigmaticos 2 mm longos recurvos divisus.
            textZh: Cyrtanthus brachysiphon Hilliard & B.L.Burtt 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_10697_0
            locator: "SANBI/WFO archive Morphology row 60661; source identifier 10697.0; cited publication: Burtt, BL; Hilliard, OM. 1986. Notes on some plants of southern Africa chiefly from Natal: XII. Notes Roy. Bot. Gard. Edinburgh 43(2): 189 - 228. [CC BY-SA]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: The current concept of the genus Cyrtanthus includes both Vallota Herb, and Anoiganthus Baker. The latter was originally separated on the anthers being sagittate and basifixed rather than dorsifixed. This has proved to be fictitious. Both Vallota and Anoiganthus differ from most species of Cyrtanthus in having the perianth tube shorter than the lobes. However, in C. guthrieae L. Bolus, C. thorncroftii C. H. Wright and C. bicolor R. A. Dyer tube and lobes are described as more or less equal in length, and in the recently published C. montanus R. A. Dyer the perianth is said to be divided for about two-thirds of its length. Clearly the reduction of Vallota and Anoiganthus is justified. Cyrtanthus brachysiphon is interesting because at first sight it looks more like the usual run of Cyrtanthus than do the plants previously placed in Vallota and Anoiganthus. The subsequent observation of its short perianth tube, which seems to place its affinity with these other short-tubed species, came as a surprise. It is thus fair to say that C. brachysiphon provides a final link justifying the current concept of the genus.In the recently published account of the genus (C. Reid & R. A. Dyer, A review of the southern African species of Cyrtanthus, 1984) C. brachysiphon runs down to C. bicolor R. A. Dyer, but differs from it, in addition to the shorter perianth tube, in having broader blunter leaves (in C. bicolor they are only 4-5 mm broad and gradually narrowed to an acute tip).
            textZh: SANBI 条目提供了 Cyrtanthus brachysiphon Hilliard & B.L.Burtt 的鉴别特征。
