          title: Gomphrena globosa L., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Erect or ascending pilose annual herbs, the branching stems to 60 cm. high. Leaves sericeous, occasionally glabrate, oblong to ovate or obovate, apically acute and mucronate, basally rounded to attenuate, 2-10 cm. long, 0.5-5 cm. broad; petioles 1-15 mm. long. Inflorescences of terminal and axillary reniform to cylindric variously colored heads or spikes, occasionally clustered, 10-25 mm. long, 15-25 mm. broad, subtended by ovate leaves 5-20 mm. long. Flowers perfect; bracts persistent, ovate, acuminate, 3-4 mm. long; bracteoles dentate-cristate, exceeding the sepals, 7-12 mm. long, 2-3.5 mm. broad; sepals 5, subequal, basally connate, cinereous- to rufous-lanate, ultimately indurate and closely embracing the fruit, 5-6.5 mm. long; stamens 5, the anthers sessile between the 5 2-lobate pseudostaminodia; stamen tube 4-8 mnm. long; ovary globose; style 1, 1-1.5 mm. long; stigmata 2, 1-1.5 mm. long. Fruit an indehiscent areolate utricle 1.5-2.5 mm. long; seeds cochleate-orbiculate, reddish brown, ocellate, 1.5-2 mm. broad.
          originalLanguage: en
          sourceField: general
