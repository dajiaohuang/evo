          title: Mezia includens (Benth.) Cuatrec., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Liana, the young branches angular, densely reddish-brown, appressed puber- ulent. Leaves opposite, coriaceous, stiff, ovate or elliptic, short-acuminate, ob- tuse to subrounded at the base, glabrous except for the midrib adaxially, scattered puberulous beneath with short-stalked, appressed T-shaped trichomes, 9-12(-21) cm long, 4.0-6.5(-8.5) cm wide, primary lateral veins 3-6 on each side; petioles 1.2-2.0 cm long, minutely pubescent, biglandular at the apex. Inflorescence ax- illary or terminal, cymose-paniculate, branching with umbels of 3 or 4 flowers; axis and branches densely reddish-brown villous-pilose with thick reddish, sub- appressed trichomes, angular and somewhat flattened; peduncles of each umbel thickened, angular, 5-10 mm long; basal bracts 2, oblong, 3-4 mm long, amplex- icaul glandular; individual floral peduncles stiff, terete, 10-14 mm long, appressed rufous villous, supporting an obsolete 0.5 mm long pedicel and a pair of floral bracts at the apex, these 2 bracts obovate-orbicular, subcoriaceous, concave, ca. 1 cm long and 1.2 cm wide, appressed rufous pubescent, enveloping each flower bud. Flowers with sepals 4, oblong, obtuse, ca. 4(-7) mm long, ca. 2 mm wide, densely reddish-brown villous outside, reddish and glabrous inside, sepals each with 2 large, elliptic-oblong glands, 2.5-3.0 mm long; petals yellow, the limb obovate, cuneate at base, 8-10 mm long and wide, the margin erose, the claw thick, ca. 2 mm long; stamens slightly unequal, the filaments flattened, 2.5-3.0 mm long, glabrous; anthers 1.5 mm long, oblong, glabrous, the connective thick- ened, ellipsoid; styles thick, stiff, pilose towards the base, enlarged and truncate at the apex, 2 of them with dorsal angles elevated and acute, the third style shorter with the angle rounded; ovary villous. Fruit with the seminiferous area ovate-oblong, 12-14 mm long, ca. 8 mm wide, the ventral areole oblong, 10-11 mm long; wings 4(or 5), membranaceous, the lateral wings suborbicular, contin- uous with the base, parted at the apex, to 3 cm wide, minutely puberulous; dorsal wing semiorbicular, ca. 2 cm long, 1 cm wide; intermediate wings reduced to the posterior part, obovate-orbicular, 7-8 mm long and wide.
          originalLanguage: en
