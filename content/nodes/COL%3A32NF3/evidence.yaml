    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, 25-40 cm. Leaves linear-lanceolate, smooth to finely or roughly hairy. Flowers in branched racemes, mauve, sometimes white, stamens bright yellow, fragrant, pedicels geniculate, with 5 upper and 1 larger lower stamen, filaments fused ± halfway.
            textZh: Cyanella hyacinthoides L. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13978_0
            locator: "SANBI/WFO archive Morphology row 12235; source identifier 13978.0; cited publication: Manning, JC; Goldblatt, P. 2012. Tecophilaeaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 255 - 255. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Cyanella hyacinthoides is distinguished by the moderately dense, branched racemes of mauve to blue (rarely white or pink) flowers with 5 + 1 arrangement of stamens with the filaments connate for ± half their length or more. The connate filaments and generally horizontally spreading pedicels serve to distinguish the species from pink-flowered forms of C. lutea, in which the stamens are ± free and the pedicels are mostly suberect.The species is closely allied to Cyanella pentheri.They are essentially alike in their inflorescence, although the flowers in C. pentheri are typically paler, mostly white to pale mauve, but they differ strikingly in their foliage. The leaves of C. pentheri are linear-aristate and canaliculate-involute with margins that are often crispulate and conspicuously ciliate only towards the base with shaggy hairs 2.0-3.0 mm long. Similar long cilia also fringe the upper cataphyll, which is funnel-shaped, and boldly pigmented with deep purple along the edges and veins, giving it a characteristic fenestrate appearance. Although C. hyacinthoides is highly variable in its foliage, the species only rarely produces similarly narrow, crispulate leaves and in such cases they are either glabrous or are ciliolate-pubescent along their entire length, with much shorter hairs 0.2-1.0 mm long, and the upper cataphyll is usually unmarked, very rarely purple-fenestrate. Although the two taxa have been recorded growing in close proximity in several localities, no intermediates between them have been found.
            textZh: SANBI 条目提供了 Cyanella hyacinthoides L. 的鉴别特征。
