        usage:
          title: Paullinia mallophylla Radlk., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Lianas; stems sharply 3-5-angled when young, viscidulous, puberulent to hispidulous on the angles, glabrate to puberulent elsewhere, terete to mostly 3-costate in age; wood composite or apparently simple (one or more of the three peripheral bundles small and difficult to see or possibly not developed). Leaves ternate-pinnately compound, 10-29 cm long, with 11 leaflets (2 sets above the ternate pair); petioles 0.8-10.5 cm long, without wings, narrowly canaliculate on the upper surface; lower rachis margined or narrowly winged, the upper rachis narrowly winged; petiole margins, petiolules, and medial ribs of rachises coarsely short-pubescent with stiff, acropetal or erect trichomes; leaflets oblong-lanceolate to oblong-elliptic or subrhombic, usually acuminate, sometimes bluntly acute at the apex, acute to attenuate at the base, 2-10 cm long, 1-5 cm wide, entire to re- motely serrate-dentate, viscidulous, sparsely to densely short-appressed-pubescent on the larger veins beneath and on the midrib above, glandular-dotted, the axils of the lower veins not noticeably barbulate; stipules linear-lanceolate, 8-11 mm long, appressed-pubescent. Inflorescences axillary, the thyrses sessile, glomerate; rachises sparsely villous, shorter than the pedicels; bracteoles narrowly deltoid, hirsute; pedicels 4-7 mm long, hispidulous, articulate near the base. Flowers white; outer sepals hispidulous, to 2 mm long; petals oblong-obovate, 4-4.5 mm long, glabrous, the anterior scales elliptical, about half as long as petals, villous along the margin, the crest short, bilobed, orange, the deflexed appendage 2 or 3 times longer than the crest, densely villous marginally, scales of the lateral petals with the crest simple; disc glands 4, stiffly whitish-hirsute, the 2 anterior smaller, semicircular, the lateral oblong; stamens glabrous, the filaments compressed; bi- sexual flowers with the stamens 2.2-2.5 mm long, the pistil to 3.4 mm long, the ovary densely stiff white-pubescent throughout, the style ca. 2 mm long, sparsely puberulent to hispidulous, 3-branched in the upper third. Capsules red to brown, globose to broadly ellipsoid, truncate to broadly emarginate at the apex, rounded to obtuse at the base, narrowly stipitate, densely pubescent with stiffly erect grayish trichomes outside, white-villous inside, the body of the fruit 10-15 cm long, 3-winged, 3-celled, only one cell functional, the wing broadest toward the apex, the stipe 4-12 mm long; seed 1, globose to broadly ovoid, black, shiny, ca. 7 mm diam., sparsely pubescent, white-arillate at the base.
