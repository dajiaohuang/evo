    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, (15-)40-70 cm, corm tunics of fine, wiry fibres, stem with short, twisted branchlets. Leaves usually 3, linear, soft, uppermost sheathing the stem. Flowers few in a wiry spike, nodding, white or flushed pale blue, sweetly scented, perianth tube funnel-shaped, 8-10 mm long, shorter than tepals, filaments included.
            textZh: Ixia mollis Goldblatt & J.C.Manning 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 7155; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Distinguished by the nodding, relatively small, white or pale blue flowers, Ixia mollis has tepals ± 14 x 3.4-4.5 mm, a perianth tube 7-9 mm long and anthers ± 2.5 mm long, half included in the tube. The corms bear small cormlets at the base and occasionally a slender stolon and the tunics consist of medium-textured to fine fibres. The nearly linear to narrowly sword-shaped leaves are soft-textured and these, as well as the white or pale blue flowers readily distinguish the species from the closely allied I. rapunculoides, which has blue to blue-mauve or sometimes pink flowers with a yellow cup. Ixia mollis was confused in the past with what is now I. sobolifera, which included pink-flowered plants from the Bokkeveld Plateau and white-flowered plants from the Little Karoo. These plants have soft-textured, short-lived tunics and produce long, ribbon-like stolons and also differ in the longer bracts, 6-10 mm long (vs. 5-6 mm long in I. mollis) and, in I. sobolifera subsp. carnea, a longer perianth tube 9-10 mm long and longer anthers 3-4 mm long.
            textZh: SANBI 条目提供了 Ixia mollis Goldblatt & J.C.Manning 的鉴别特征。
            sourceIds:
