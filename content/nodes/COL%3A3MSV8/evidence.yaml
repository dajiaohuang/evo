    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Tufted and succulent perennial herb, lower than 50 mm. Stems 4- or 5-angled, tuberculate-toothed. Corolla campanulate, ± 14 mm in diameter and long; tube concentrically lined inside (often broken lines or elongated spots arranged in lines). Inner corona lobes much exceeding anthers, subulate, dorsiventrally compressed towards 1 mm-wide gibbous base, tapering to small obtuse apex. Flowers with outside purplish mottled, inside cream, irregularly spotted and concentrically lined with purplish red.
            sourceIds:
              - sanbi_11118_0
            locator: "SANBI/WFO archive Morphology row 914; source 11118.0; publication: Herman, PPJ; Retief, E. 1997. Plants of the northern provinces of South Africa: Keys and diagnostic characters. Strelitzia 6: 1 - 681. National Botanical Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Although their circumstances in habitat usually prevent them from forming substantial clumps, this happens readily to plants of this species in cultivation. Huernia whitesloaneana is one of the smallest-stemmed species in the genus and especially among the summer-rainfall species, which are generally robust in habit. The stems have a distinctive purplish green colour which they often retain in cultivation. This and their small size enables them to be distinguished quite easily from most other Huernias that occur in the area. The flowers in H. whitesloaneana are small and may be only 10 mm long and 12 mm broad. They are quite variable in shape, from more or less cylindrical to quite widely gaping beyond the mouth of the tube, and this variation is present in most populations. They emit a slight, but sharp, bad odour. A distinctive feature of the flower is the manner in which the corolla lobes do not fold backwards much at their base, unlike in most other small-flowered species, and they continue the direction of the tube to their apices. The corolla is darkly spotted both inside and outside but these spots on the two surfaces are entirely independent of one another. On the inside the spots change to concentric lines in the lower half of the tube and coalesce into a dark patch around the corona. In many flowers this spotting is dense enough to make the whole inside appear dark but in some the spots are smaller and fewer and then the flower may be quite pale within. From about the middle of the tube to the tips of the lobes the inside of the corolla is covered with papillae. These have minute apical bristles, if any, and they decrease in length towards the tips of the lobes. The outer corona consists of very short, deep maroon lobes spreading on the base of the tube while the inner lobes are quite long and slender, tapering to obtuse, finely bristly tips. They are somewhat paler than the outer and are streaked with yellow.
