            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Herbs; stems herbaceous or suffrutescent, reclining or ascending, pubescent with spreading trichomes. Leaves oblong, elliptic-oblong or lanceolate, 1-2.5 cm long, mostly less than 1 cm wide, subsessile, acute to obtuse basally and apically, pubescent. Flowers on peduncles mostly equaling the leaves; sepals lanceolate, acute or acuminate, 2-3 mm long, pubescent; corollas mostly pale blue, sometimes white, 3-7 mm broad; ovary glabrous. Fruits capsular, globose, glabrous; seeds black, smooth.
