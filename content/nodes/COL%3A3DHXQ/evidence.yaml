          - text: Decumbent or erect annual or perennial herb, thinly or sometimes densely covered with long patent silky hairs. Leaves/elliptic, ovate-oblong, lanceolate to linear-oblong, mucronate. Inflorescence axillary, 1-few-flowered. Corolla shallowly lobed. Capsule 2-locular. Flowers blue, rarely white.
