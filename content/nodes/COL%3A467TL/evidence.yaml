        claims:
          - text: Annual, up to 300 mm tall. Leaves lanceolate, toothed to entire. Flowers in lax racemes, calyx lobes ovate, glandular-puberulent, corolla 16-20 mm long, upper lip yellow or pale blue-violet, with white or yellow patch and darker lines at base, lower lip with convex palate at base, palate 4.7-6.7 mm long, outwardly projecting, with 2 diverging bosses covered with yellow or orange clavate trichomes, spur ± 6-8 mm long, projecting back and curving downwards in distal third. Capsule wider than long, 5.8-6.2 x 6.3-7.7 mm.
