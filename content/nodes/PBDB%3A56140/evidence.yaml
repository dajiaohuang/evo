      statement: "Ginkgophyta is displayed at 165–0 Ma only as a dated Ginkgoxylon-sample-to-living navigation anthology: the 153–165 Ma wood specimen is not the phylum FAD, an unbroken species lineage or a direct ancestor of living Ginkgo."
      confidence: medium
      confidenceRationale: Jiang et al. (2016) directly dates the Tiaojishan Formation sample to 153–165 Ma and diagnoses Ginkgoxylon liaoningense. Medium confidence is restricted to that specimen envelope plus living Ginkgo, not the complete ginkgophyte range.
      referenceLinks:
        - relation: supports
          referenceId: jiang-2016-ginkgoxylon
          pages: Article 38191, pp. 1–8
          figure: Figures 1–3
          quoteLocator: 153–165 Ma Tiaojishan age and systematic palaeontology
  claim-rationales.zh:
    - 银杏类的分类字段只陈述所引研究与导航范围；不会把矩阵位置、数据库映射或样本相似性改写为直系祖先。
    - 银杏类的地理字段限于具名样本或明确模型范围，不外推为全球分布、起源中心或完整扩散路径。
    - 银杏类的生态字段区分保存事实与功能推断；未被直接记录的饮食、行为、栖息地偏好和性能均保留不确定性。
    - 银杏类的形态字段限于主研究列明的标本、样本或分析，并连接到精确页码、图版或补充材料。
    - Jiang 等（2016）直接把髫髻山组样本限定为 153–165 Ma，并鉴定辽宁银杏木。中等置信度仅限该标本年代包络与现生银杏，不代表银杏植物完整范围。
  claim-statements.zh:
    - Ginkgoxylon liaoningense 在银杏类语境中作为银杏样木材实例使用；不将其归为银杏（Ginkgo biloba）的直系祖先。
    - PB22285 来自辽西髫髻山组，不能确立完整的侏罗纪分布或银杏门范围。
    - 木材解剖支持陆生木本生长型；具体生境、生理和群落作用属于推断而非直接观察。
    - PB22285 保存了一组用于鉴定 Ginkgoxylon liaoningense 的次生木质部性状。
    - Ginkgophyta 的 165–0 Ma 仅作为“有测年约束的银杏木样本—现生类群”导航汇编：153–165 Ma 木材标本不是该门首现、连续物种谱系或现生银杏的直接祖先。
