          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: A somewhat nodose shrub, 4 m. tall; upper internodes glabrous, sparingly warty-papillate; leaves elliptic, apex acute, base obliquely cordate-auricled, one side about 5 mm. shorter at the petiole, the larger side about equaling the petiole, about 18 cm. wide X 28-30 cm. long, pinnately nerved from below the upper third, the nerves 6-8 on each side, submarginally loop-connected and with num- erous cross-connecting and anastomosing nervules, glabrous above, the nerves beneath puberulent or crisp-pubescent, marginal ciliation lacking, sparsely yellow- glandular-dotted on both sides, microscopically white-dotted above when dry, drying rather firm, subtranslucent; petiole 45 plus 5 mm. long, winged-vaginate to near the blade, sparsely warty; spikes 5 mm. thick X 25 cm. long; peduncle 2The base of the blade in many species of Piper is unequal on the two sides with one side some- what shorter at the petiole. The petiolar length is given plus the difference in length between the two sides.
