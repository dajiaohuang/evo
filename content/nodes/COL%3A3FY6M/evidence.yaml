          - text: Bulbous geophytes, 15-25 cm. Leaves 19-45, dry at flowering, erect, narrowly strap-shaped, spiralled, glabrous, basal sheaths paired, spotted. Flower large, widely cup-shaped, white to pink, anthers 35-60, arranged in 6 clusters. Berry fleshy, yellow with red spots.
