        usage:
          title: Erblichia odorata Seem., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Tree 7-30(40) m tall, the trunk up to 1 m in diam at the base, the branchlets glabrous (in the only Panamanian collection seen) to velutinous. Leaves with the petiole canaliculate above, up to 1 cm long, the stipules to 1 mm long, puberulous; blade narrowly elliptic to narrowly oblong-elliptic, acute and decurrent at the base, acute to long-acuminate at the apex, crenate to remotely crenulate-serrulate at the margins, to 14 cm long and 4 cm wide, chartaceous, lustrous and glabrous above, slightly paler, glabrous or nearly so, and with the costa prominent beneath. Flowers with the peduncles to 4.5 cm long, to 7.5 cm long in fruit, glabrous or nearly so, the prophylls subopposite, the pedicels to 2.5-3 cm long, glabrous to sparsely appressed-puberulous; sepals narrowly ovate to linear-ovate, long-acumi- nate, to 6 cm long, green or yellowish-green, some with yellow (or pale orange or salmon) margins, sparsely appressed-puberulous to glabrous outside; petals cuspidate to caudate at the apex, to 8 cm long and 4.5 cm wide, yellow (or reddish- orange); filaments to 4.5 cm long, glabrous or densely villosulous below, the anthers straight, to 6 mm long, appendiculate at the apex; ovary glabrous to densely velutinous; styles to 5 cm long, glabrous or sparely appressed-puberulous below. Capsules (according to Sprague & Riley, loc. cit.) ellipsoid, ligneous, to 3.3 cm long and 1.7 cm wide, glabrous; seeds obovoid, slightly curved, to 4.5 mm long, longitudinally striate.
          originalLanguage: en
          sourceField: general
