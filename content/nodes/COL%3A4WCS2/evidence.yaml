        claims:
          - text: Like S. pulchra but lowermost bracts 3-4 x 1.4-2.3 mm (vs. 2.3-3.0 x 1.0-1.3 mm), obtuse, with minute, glandular hairs on both surfaces, and cocci without spurious cells.
            sourceIds:
