            locator: "SANBI/WFO archive Morphology row 6164; source 14444.0; publication: Manning, JC; Goldblatt, P. 2012. Scrophulariaceae: Selago L. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 754 - 761. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: The relationship of S. adenodes lies with S. pulchra, with which it is sympatric. They differ in their bracts, lowermost 3-4 x 1.4-2.3 mm (not 2.3-3 x 1-1.3 mm), obtuse (not subacute), hairs 0.15-0.25 mm long on margins, minute glandular hairs all over both faces (not hairs up to 0.1 mm on margins otherwise glabrous), calyx with hairs 0.2-0.25 mm long on margins, minute glandular hairs all over outside (not hairs 0.1 mm long on margins, glabrous outside), cocci without spurious cells (versus cocci with two spurious cells).
            textZh: SANBI 条目提供了该种的鉴别特征。
