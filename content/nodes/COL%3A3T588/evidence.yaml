          title: Lennea viridiflora Seem., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Small trees; branchlets hairy with stiff hairs to glabrous, dull, tan to grayish. Leaves with 9-13 elliptic to ovate leaflets, the lateral leaflets mostly opposite or subopposite, obtuse or often retuse, 2-8 cm long, 1-4 cm wide, the first pair often the smallest on the leaf, thin in texture, dull above,, sometimes slightly paler beneath, when mature with appressed, fine, stiff, non-overlapping hairs beneath; stipules narrow, to 5 mm long, apparently deciduous, stipels obvious, setaceous, to 2 mm long, persistent, stiff, the petiolules 2-3 mm long. Inflorescence with raceme axis 2-5 cm long, the flowers close, subtended by ovate-triangular bracts, pedicels 2-3 mm long, the axis, bracts and the pedicels pubescent with stiff dark red brown or yellow brown tinged hairs. Flowers ca. 7-9 mm long with the petals extended, the hypanthium tube campanulate, ca. 3 mm long, the 5 teeth narrow triangular, acute, extending ca. 1 mm beyond the rim of the cup, the lowermost tooth longest, ca. 1.2-1.8(-2) mm long, the 2 uppermost united for about ?/2 of their length, the whole calyx pubescent with stiff hairs as on the inflorescence; petals of subequal length, the standard reflexed, circular, ca. 6 mm long, 6 mm wide, glabrous, the claw ca. 1 mm long, wings oblong, ca. 5 mm long, glabrous, the claw ca. 2 mm long, the keel petals fused for part of the length, ca. 7 mm long with scattered hairs or glabrous; stamens 10, the vexillary stamen leaving the sheath near the base, the 9 other stamens leaving the sheath in a regular series, the outermost with longer free filaments, the innermost with shorter fila- ments as seen when the sheath is opened at the position of the vexillary stamen;
