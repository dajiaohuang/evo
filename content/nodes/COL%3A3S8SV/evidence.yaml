    facets:
      morphology:
        status: partially-supported
        claims:
          - text: More-or-less tufted, cormous geophyte, 80-100 mm tall, branching at base, corm tunics brown, margins with minute, down-pointed teeth, stem compressed. Leaves linear, ribbed. Flowers in a dense, few-flowered spike, whitish with red markings on the lower tepals, brownish on the outside, perianth tube cylindrical, bracts large, with red, minutely serrate keels.
            textZh: Lapeirousia arenicola Schltr. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_14562_0
            locator: "SANBI/WFO archive Morphology row 33280; source identifier 14562.0; cited publication: Goldblatt, P; Manning, JC. 2013. Iridaceae. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 94 - 124. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Lapeirousia arenicola is distinguished by its small size, pale beige-pink, slender-tubed flowers with narrow tepals. Perhaps most easily confused with L. macrospatha which has similarly coloured flowers, L. arenicola has a uniformly narrow, cylindric perianth tube 17-33 mm long and tepals 10-11 x 3-4 mm whereas L. macrospatha has a wider tube, 25-35 mm long, expanded toward the apex and considerably larger tepals, the uppermost ± 20 x 7 mm.
            textZh: SANBI 条目提供了 Lapeirousia arenicola Schltr. 的鉴别特征。
