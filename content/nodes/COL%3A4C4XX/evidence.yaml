        usage:
          title: Palicourea vestita Standl., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrubs 1-2 m tall, the twiglets terete, becoming angular, the hairs webby, somewhat bulbous based, the nodes well spaced, somewhat turgid with remains of stipules, the pith white. Leaves ascending, elliptic, 7-22 cm long, 2.5-10.0 cm wide, obtuse to deltoid at the apex, acuminate, the acumen 1.0-1.5 cm long, ultimately obtuse or acute, obtuse to cuneate at the base, the costa prominulous above, prominent beneath, the lateral veins of larger blades to 30, prominulous beneath, widely arcuate, not forming a distinct submarginal vein, usually drying yellow, with 1-2 short and soon branching smaller veins parallel to the laterals, rigidly chartaceous, often concolorous, often drying green above, usually golden hirsute on the costa and veins above, more hairy beneath including the intervenal areas; petioles to 2 cm long, rigid, webby pubescent; stipules persistent, connate, densely pubescent, the sheath turgid, bowl shaped or barrel shaped, with a me- dian longitudinal groove or a plane glabrate area, giving a buttocks effect to each part, to 2.5 cm long, truncate, each part with 2 subulate, acute, often curved awns, these equal to or exceeding the body. Inflorescences yellow, usually drying yellow, terminal, paniculate, 8-18 cm long, 3.0-8.5 cm wide, the hairs dense, short, stiff; peduncle 3-9 cm long, 0.1-0.2 cm wide, the lowermost branches opposite or whorled, spreading, the uppermost branches relatively well spaced; bracts linear subulate or linear oblong, to 0.8 cm long, pubescent, curled. Flowers with pedicels ca. 0.5 cm long; hypanthium somewhat turbinate, ca. 1 mm long, densely golden pubescent, the calycine cup apparently absent, the lobes 4, tri- angular or ovate, ca. 0.5 mm long, somewhat spreading, densely pubescent; co- rolla yellow, the tube to 13 mm long, slightly expanded at the apex and base, petaloid, minutely pubescent outside, densely villose within below the middle, the lobes 5, triangular, ca. 1.5 mm long; anthers linear oblong, ca. 2 mm long, the filaments ca. 1 mm long, attached ca. 2 mm below the mouth; style to 1.5 mm long, barely exserted, the stigmas scarcely wider than the style. Fruits glo- bose, ca. 5 mm in diam., compressed laterally, pubescent, the 2 pyrenes each with 3 obtuse ribs.
