    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants deciduous herbs, acaulescent, 3-3.5 cm high, arising from solitary, dome-shaped tubers ca. 1.1 cm wide, with up to 6 downward-spreading roots; tubers brown, with membranous sheaths, becoming white when actively growing. Leaves usually 2 but occasionally with a central third, very fleshy, light dull green, with a microscopic, whitish, rough, sandpaper-like texture and 3 longitudinal veins, the outer 2 slightly falcate outwards, with a flat adaxial channel, distinctly truncate, up to 3 cm long and 4 mm broad, the central leaf, when present, terete, acute, up to 3 cm long and 1.5 mm broad; all leaves subtended by a tight sheath ca. 4 mm long. Inflorescence erect, solitary; peduncle purplish, slender, averaging ca. 5 cm long and 1 mm thick, raceme ca. 2.5 cm long. Flowers 6-8, spreading at right angles from the rachis, 1-3 opening at once well before sunrise; bracts narrowly triangular, membranous, 1.5 mm long, pedicels ca. 7 mm long; tepals brownish-orange, with a distinct broad, dark orange, central vein; outer whorl tightly reflexed against pedicel, elliptic, acuminate, obtuse, 7 x 1.8 mm, inner whorl not as tightly reflexed, obovate, with an undulate apical margin, obtuse, 7 x 4 mm. Filaments trimorphic, slender, bearded, ca. 6.5 mm long, with lower 3 decurved, the upper with a double cushion of hairs; hairs variously arranged, curving and matted together, clavate with spherical apex, 1.8 to 2 mm long; anthers spherical to oblong, ca. 1.2 mm long. Ovary green, elliptical, 2 mm long; style very slender, 5 mm long. Seed ca. 3 per capsule, black, deltoid, ruminate, 2 mm long.
