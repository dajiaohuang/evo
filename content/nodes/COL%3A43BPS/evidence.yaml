        usage:
          title: Mikania tysonii R.M.King & H.Rob., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Slender, decumbent to epiphytic vines or subshrubs, few to many branched; stems brown, terete to slightly hexagonal, usually glabrous, larger stems narrowly fistulose. Leaves opposite; blades elliptical to obovate, to 8 cm long and 3.5 cm wide, the base cuneate, the margins entire, the apex bluntly rounded to short- acuminate, the surface glabrous, usually with reddish glandular punctations, the surface of dried material finely wrinkled and sometimes hiding punctations, 2 pairs of parallel ascending secondary veins from near base; petioles slender, 0.5-1.5 cm long. Inflorescence a loose irregular, corymbose panicle, the ultimate branches 1.5-6.0 mm long, sparsely puberulous. Heads ca. 5 mm high; subinvolucral bract narrowly oblong, ca. 1.5 mm long, borne 0.5-2.0 mm below most heads; involucral bracts oblong with rounded tips, ca. 3.5 mm long, 1 mm wide, sparsely puberulous and usually with reddish glands outside; corolla white, 4-5 mm long, the tube short, indistinct, with glands on outer surface, the lobes about twice as long as wide; anther appendages firm, broadly oblong-ovate; style base slightly enlarged, glabrous, the style appendages with short papillae. Achenes with 4-5 ribs, 2-3 mm long, with many scattered glands, sometimes puberulous; pappus of ca. 50 slender bristles mostly in 1 series, the tips distinctly enlarged.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 1914
