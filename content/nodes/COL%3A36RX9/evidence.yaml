    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants slender, 100-240 mm tall; basal leaves 2-4, petiolate, blades spreading, elliptic, 15-45 mm long, cauline leaves lax to imbricate, sheathing, lanceolate and acuminate, 20-30 mm long, grading into the floral bracts. Inflorescences dense, 15-80 mm long, ovaries twisted through 180°; bracts overtopping the flowers. Flowers facing down, colour variable, petals and lip usually yellow or lime, sepals and spur varying from lime to purple; usually strongly scented. Median sepal acute, galea 4-5 x 3 x 2.5 mm deep; spur straight and somewhat ascending from the base, slender cylindrical, tapering, 5-6 mm long; lateral sepals spreading, often somewhat reflexed, narrowly oblong-acute, c. 5 mm long, apiculi small. Petals erect inside the galea, somewhat curved forwards, narrowly ovate, c. 4 mm long, apices curved inwards over the rostellum. Lip narrowly oblanceolate, obtuse, c. 4 mm long. Anther nearly globular; stigma pedicellate, concave, almost as tall as rostellum; lateral rostellum lobes square, a V-shaped notch between them, central lobe small, fleshy.
