        usage:
          title: Lonchocarpus sericeus (Poir.) Kunth ex DC., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Tree averaging 10-15 m. in height. Leaves 7- to 13-foliolate; leaflets oblong to ovate or obovate, 3-9 cm. long, 2-3.5 cm. wide, rounded at the base, rounded-obtuse or abruptly acuminate to an obtuse apex, coriaceous, minutely pubescent beneath, at least on the midrib and veins. Racemes solitary in the upper leaf axils, the rachis at first velutinous. Flowers with large and semipersistent bractlets; calyx cupulate, mostly 4 mm. long, subentire or very shallowly denticulate, densely ferruginous- pubescent; petals rose-pink; vexillum suborbicular, 14-15 mm. long, auriculate at the base, densely silvery-sericeous without; wing petals broadly oblong, very shal- lowly auriculate, the claw 4.5 mm. long, the blade 10 mm. long, somewhat sericeous without; carina densely sericeous toward the apex; filaments and anthers more or less setose. Legumes compressed but thick, 5-12 cm. long, 2.3 cm. wide, somewhat constricted between the seeds, more or less fulvous-pubescent, the vexillar margin carinate and much thickened opposite the 1-5 seeds.
          originalLanguage: en
          sourceField: general
