        usage:
          title: Pyrostegia venusta (Ker Gawl.) Miers, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Liana; branchlets somewhat angled, puberulous, without interpetiolar glan- dular fields; pseudostipules inconspicuous or oblanceolate and subfoliaceous. Leaves 2-foliolate, sometimes with a terminal tendril; leaflets ovate, acute, basally rounded, 4-6 cm long and 2.5-4 cm wide, chartaceous, lepidote to more or less puberulous; tendril shortly trifid; petiolules 1-1.5 cm long, petiole 1.5- 2.5 cm long. Inflorescence a terminal panicle. Flowers with the calyx cupular, subtruncate to 5 denticulate, scattered lepidote, the margin densely ciliate; corolla red-orange, tubular, the lobes narrow, valvate in bud, 5.5-6.5 cm long and 0.9-1.1 cm wide at the mouth, the tube 4.0-5.0 cm long, the lobes 1.0-1.5 cm long, the tube glabrous outside, the lobes conspicuously puberulous on margins and to some extent within, the tube pubescent inside at and below the level of stamen insertion; stamens exserted, the anther thecae not or very slightly divergent, ca. 4 mm long, the filaments 3.5-4.0 cm long, the staminode 3-4 mm long and inserted ca. 3 cm from base of tube, the filaments inserted 2.2-2.4 cm from base of tube; pistil 4.8-5.1 cm long, the ovary linear, lepidote, 4 mm long and 1 mm wide, the ovules 2-seriate in each locule but staggered so apparently 1-seriate in most cross sections; disc cupular-pulvinate. Capsule linear, acute at both ends, 25-30 cm long and 1.4-1.6 cm wide, the midrib slightly raised; seeds thin, bialate, 1.2-1.4 cm long and 4-4.5 cm wide, the wings brown with a hyaline tip.
          originalLanguage: en
          sourceField: general
