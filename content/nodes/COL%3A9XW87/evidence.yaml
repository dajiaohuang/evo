      ecology:
        status: partially-supported
        claims:
          - text: In a 30-day tank experiment, juvenile P. vannamei sourced from an aquaculture farm in Pingtan, Fujian, China, were stocked at 30 shrimp per tank in two triplicate groups. Tanks receiving Bacillus licheniformis strain FS051 in the water every five days (5 × 10^4 CFU/mL) had significantly higher reported length, weight, survival, and yield and lower feed conversion ratio than control tanks (p < 0.05). The result applies to this cultured stock, dose, and tank experiment, not to wild shrimp or aquaculture systems generally.
            textZh: 在一项为期 30 天的水槽试验中，来自中国福建平潭某养殖场的凡纳滨对虾幼体按每槽 30 尾分为两个各有三次重复的处理组。每五天向水中添加地衣芽孢杆菌 FS051（5 × 10^4 CFU/mL）的水槽，相较对照槽报告了显著更高的体长、体重、存活率和产量，以及更低的饲料系数（p < 0.05）。该结果仅适用于这批养殖个体、该剂量和水槽试验，不代表野生对虾或一般养殖系统。
            originalLanguage: en
            sourceIds:
              - zheng2025penaeusvannamei
            locator: Methods §§2.1.2–2.2 for juvenile source, tank replication, stocking density, trial duration, and treatment; Results §3.2 and Table 1 for growth indices and significance.
            placeTimeScope: Juveniles obtained from an aquaculture farm in Pingtan, Fujian, China; controlled tank experiment at approximately 13‰ salinity; 30 days; trial dates not reported.
            lifeStatus: Cultured juvenile shrimp; the experiment did not study wild populations.
        gaps:
          - A single 30-day tank trial with one source lot, one probiotic strain and dose, and three replicate tanks per group does not establish species-wide ecology or outcomes across farms and environments.
