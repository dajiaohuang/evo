        usage:
          title: Pisonia aculeata L., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Divaricately branched shrub or woody liana, usually armed with stout recurved axillary spines, glabrous to densely pubescent. Leaves opposite to irregularly approximate, the blade very variable in shape and size, usually obovate to obovate- elliptic, acute to acuminate, 2-10 cm. long, 1-5 cm. broad, the petiole 1-3 cm. long. Inflorescences usually borne at the tips of greatly condensed short shoots, umbelliform or densely corymbiform-thyrsiform, rather shortly pedunculate, 3-6 cm. long, greatly accrescent and expanded in fruit, many-flowered. Staminate flowers campanulate, greenish yellow, about 3 mm. long, about 2 mm. in diameter at the orifice of the limb, minutely puberulent-papillate without, the stamens widely exserted. Pistillate flowers tubular to somewhat urceolate, about 2.5 mm. long and 1 mm. in diameter, the limb erect, the stigma and style widely exserted. Anthocarps borne upon greatly elongate pedicels, pentagonal-clavate, 7-9 mm. long, 3-4 mm. broad, green, coriaceous, the stipitate glands uniseriate upon the five angles, the sides minutely and densely puberulent.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 8486
