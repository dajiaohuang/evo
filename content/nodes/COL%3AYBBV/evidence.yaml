          originalSourceText: Shrubs, to 3.5 m, the stems densely pubescent, the hairs simple, brown. Leaves ovate, sometimes + obovate, acuminate, revolute, the bases ? rounded, to 31 cm long and 13 cm wide, sparsely pubescent above, densely pubescent be- neath, coriaceous and conspicuously bullate; petioles 1-2 cm long, stout, pubescent. Inflorescences cymose, paniculate, densely flowered, the branches pubescent. Flow- ers perfect (?), ? sessile; calyx cupulate, densely strigose, the tube ca 4-5 mm long, 3-4-lobed, the lobes deltoid and ca 1.5-2 mm long; corolla salverform, color unknown, the tube 4-5 mm long, 5-lobed, the lobes oblong, 2.5-3 mm long and 2-2.5 mm wide; stamens 5, exserted, the filaments ca 7-8 mm long, pubescent basally, the anthers ca 1.5 mm long; ovary ovoid, the style ca 1.2 mm long, the stigmas clavate. Fruit unknown.
