        claims:
          - text: Cormous geophyte, 15-30 cm. Leaf solitary, linear, channelled. Flowers pale yellow with dark veins, inner tepals erect.
            textZh: Moraea thomasiae Goldblatt 的 SANBI 物种条目记载了植株、叶片和花部形态。
            sourceIds:
              - sanbi_13878_0
            locator: Strelitzia 29; archive Morphology row 7365, source 13878.0
            placeTimeScope: Regional species account published 2012; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
          - text: Superficially like Moraea angusta (subg. Monocephalae) in its pale yellow flowers with lanceolate, entire inner tepals, stamens united only near the base, and unbranched stem, M. thomasiae otherwise has a single channelled leaf inserted near the stem base and long-lasting flowers. These two features, as well as the chromosome number, 2n = 12, accord best with subg. Vieusseuxia and molecular phylogenetic studies also place M. thomasiae among the species of this subgenus but without close relatives. Most other species of the subg. Vieusseuxia have reduced inner tepals, most often with 3-lobed limbs, sometimes a linear cusp, or even lacking.
            textZh: SANBI 条目提供了 Moraea thomasiae Goldblatt 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: Strelitzia 42; archive Diagnostic row 94231, source 18638.0
            placeTimeScope: Regional species account published 2020; the archive excerpt does not give a dated sampling frame or population frequency.
