        claims:
          - text: Acaulescent, cormous geophyte. Leaves 3, lower 2 spreading, lanceolate to ovate, glaucous and often purple-spotted, 50-150 x 15-70 mm, margins thickened and cartilaginous, smooth, uppermost erect, bract-like; bracts ovate, margins smooth or ciliolate. Flowers 1-5, tepal claw 6-10 mm long, blade auriculate-cucullate, 10-14 mm long; filaments 9-12 mm long, anthers 5-7 mm long; styloids 7-12 mm long.
