        status: partially-supported
        claims:
          - text: Dwarf geophyte, 90-150 mm tall, tuber solitary, broadly oblong or rounded. Leaves ± 14, in a tight rosette pressed to the ground, boat-shaped, succulent, ± 5 mm wide, upper surface ± flat, grey-green with prominent white longitudinal and transverse veins interspersed with large pellucid patches, midvein often sparsely fringed, margin densely fringed, withering at flowering. Flowers in a wiry raceme, dull yellow. Capsule not known.
