      claimKind: scientific
      claimType: divergence-time
      statement: The 1KITE matrix of 1,478 protein-coding genes from 144 sampled insect species resolves many ordinal relationships and estimates calibrated divergence intervals, but its node ages depend on fossil assignments, clock priors, taxon sampling and sequence models.
      confidence: high
      confidenceRationale: The archived transcriptome matrix and model pipeline are documented, and the claim keeps topology and model time distinct from fossil observations.
      referenceLinks:
