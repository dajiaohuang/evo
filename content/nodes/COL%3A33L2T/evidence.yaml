    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Bulb oblong, 3-3.5 cm in diam. with an elongated neck, in all 9-11 cm long, with dark chestnut-brown membranous tunics. Leaves usually 2, contemporary with flowers, flat, linear from a long narrow base and tapering to the apex, 30-50 cm long, 1-2 cm broad, green on the face, slightly glaucous on the back with prominent midrib. Peduncle subterete, somewhat shorter than the leaves. Spathe-valves 2-3.5 cm long. Pedicels 1.5-2.5 cm long. Flowers 6-15 in an umbel, scarlet; perianth trumpet-shaped, slightly curved, 3-3.5 cm long; tube gradually widened from the base to a throat 8 mm wide; lobes suborbicular, obtuse, the outer ones apiculate, more or less recurved, 6-8 mm broad. Stamens biseriate, unequally long, inserted about 6-7 mm below the mouth of the corolla. Style filiform, shortly exceeding the anthers, shortly trifid. Capsule oblong, about 1.5 cm long. Seeds 6-7 mm long, 2.5 mm broad, winged, black.
