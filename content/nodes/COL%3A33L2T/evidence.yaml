        claims:
          - text: "Mr. Walter Haygarth who discovered the species in 1912, observed the plants growing on Podocarpus trees up to 20 m above ground, always in tufts of moss. The epiphytic habit is not altogether unusual in South African Amaryllidaceae: it is observed occasionally in Clivia caulescens R.A. Dyer."
