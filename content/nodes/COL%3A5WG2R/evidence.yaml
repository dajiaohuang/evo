          originalSourceText: peltate, broadly ovate, acuminate, 7-8-nerved, entire or dentate at the ends of the nerves, 2-12. 5 cm. long, nearly or quite glabrous above, rufous-pilose beneath especially on the nerves, fleshy, petioles 3-10 cm. long, rufous-pilose, stipules persistent, ovate, setose-acuminate, brown., glabrous or sparsely pilose. Peduncles much exceeding the leaves, to 15 cm. long, rufous-pilose. Cymes bisexual, strongly unilateral and often much longer than wide, few- to many-flowered. Bracts deciduous, small, lanceolate to obovate, entire, setose-ciliate. Pedicels 4-12 mm. long. Staminate tepals 2, suborbicular, 4-5 mm. long, entire, pink. Stamens few, free. Pistillate bracteoles elliptic, nearly equaling the ovary. Pistillate tepals 2, like the staminate. Ovary 3-celled, placentae bilamellate, ovuliferous -throughout, styles connate at base, stigmas lunate-capitate. Capsule erect, subglobose, wings slightly unequal, sublunate, angled near apex.
