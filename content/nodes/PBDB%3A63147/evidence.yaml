    - subjectId: taxon:pakicetidae
      claimKind: scientific
      claimType: taxonomy
      statement: Pakicetidae is reviewed as a separately sampled early Eocene cetacean family represented by incomplete and composite material; its placement helps test early whale relationships but does not make the family a direct ancestral stage for all later whales.
      confidence: medium
      confidenceRationale: The review supports family-level identification and comparative placement; the wording carries forward specimen and ancestry limits.
      referenceLinks:
        - relation: supports
          referenceId: uhen-2010-whale-origins
          pages: 195–200
          quoteLocator: Earliest whales; Pakicetidae anatomical and stratigraphic discussion
    - subjectId: taxon:pakicetidae
      claimKind: scientific
      claimType: fossil-range
      statement: pakicetidae is displayed at 50–47 Ma only as the review's sampled pakicetid interval, not a linear ancestral stage or exact endpoints. The interval is a source-bounded sample window, not a global FAD, LAD, divergence date, continuous occupancy claim or direct-ancestor assertion.
      confidence: medium
      confidenceRationale: pakicetidae uses Uhen, M.D. (2010) because the cited pages and locator expose the sampled taxon, specimen or living sequence set. Confidence is medium and applies only to Early Eocene pakicetid sample synthesized by Uhen; broader endpoints remain unclaimed.
      referenceLinks:
        - relation: supports
          referenceId: uhen-2010-whale-origins
          pages: 195–200
          quoteLocator: Earliest whales; Pakicetidae anatomical and stratigraphic discussion
        - relation: contextualizes
          referenceId: ics-2026-06
          pages: International Chronostratigraphic Chart v2026/06
          figure: Global chronostratigraphic scale
          quoteLocator: Numerical boundaries for named geological stages used to bound the source sample
  claim-rationales.zh:
    - 综述支持科级识别与比较位置；措辞保留标本和祖先关系限制。
    - pakicetidae 采用 Uhen, M.D.（2010）的论文，因为所引页码与定位符直接标示了研究采样的类群、标本或现生序列集合。中等置信度仅适用于 Early Eocene pakicetid sample synthesized by Uhen；更宽泛端点保持未声明。
  claim-statements.zh:
    - 巴基鲸科在综述中被视为由不完整及组合材料代表、独立取样的早始新世鲸类科；其位置有助于检验早期鲸类关系，但不使该科成为所有后期鲸类的直接祖先阶段。
    - pakicetidae 仅以 50–47 Ma 展示为综述所采样的巴基鲸科区间，而非线性祖先阶段或精确端点。该区间是来源限定的样本窗口，不是全球首现、末现、分化日期、连续占据或直接祖先断言。
