    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Annual herb 20-30 cm. tall, usually unbranched. Stem slender glabrous. Basal leaves sometimes crowded, 7-10 x 2-4 mm., elliptic-ovate, shortly petiolate; stem leaves opposite, 3-20 x 1-3.5 mm., linear or linear-lanceolate, sessile. Flowers blue or whitish, in terminal racemes; pedicel 1.5-3 mm. long, enlarged in fruit; bracts 4-5 mm. long, linear. Calyx tube 4-5 mm. long, equally and prominently 8-ribbed; lobes 1.5-2 mm. long, deltoid, acute. Corolla tube, 6-7 mm. long; lobes 1.5-3 mm. long, broadly ovate, obtuse. Filaments c. 3 mm. long, linear; anthers 0.4-0.5 mm. long, oblong-ellipsoid. Ovary 2-3 x 1.5 mm., obovoid-cylindric; style up to 6 mm. long, filiform; stigma c. 0.5-0.6 mm. long, linear. Capsule 3-4 x 1-1.5 mm., obovoid-cylindric. Seeds c. 0.5 mm. in diam., subglobose, testa faveolate.
            sourceIds:
