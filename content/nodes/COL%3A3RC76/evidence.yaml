        usage:
          title: Kohleria spicata (Kunth) Oerst., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: internodes giving the appearance of a raceme 5-35 cm long; peduncles lacking; pedicels to 2.5 cm long, reddish or brown, hirsute. Flowers with floral tube turbinate, 2-3 cm long, densely hirsute; calyx lobes erect, equal, thick triangular ovate to oblong, 2-5 mm long, green, red or brown, hirsute on both sides, the apex acute or obtuse; corolla deep red to orange red outside, the inside paler with red spots, red villous outside, the inside glandular, tubular, 1.2-1.8(-2.0) cm long, 4-5 mm wide at the slightly oblique base, ampliate or ventricose, 5-7 mm wide at the middle, then slightly contracted at the throat, the mouth oblique, the limb bilabiate of 5 lobes to 1 cm across, the lateral and the upper lobes spreading, the basal lobe reflexed, all nearly equal, obtuse or rounded, 2-4 mm long and wide, glabrous to pilose glandular, entire; stamens 4, not exserted, the filaments broad at the base and adnate to the base of the corolla tube, narrowed above, yellow, glabrous, the anthers oblong, ca. 2 mm long, pilose on back, staminode much reduced; glands 5, usually free or the 2 posterior glands more or less united; ovary apex conic, hirsute, the style curved, ca. 1 cm long, glandular pilose, the stigma bibbed. Fruit a globose capsule surrounded by the persistent floral tube, 5-7 mm in diam., red to brown, villous; seeds numerous, fusiform, ca. 0.5 mm long, reddish brown. Chromosomes 2n = 26 (Rogers, 1954).
