    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Woody climber or scrambler. Leaves compound, 3-foliolate, leaflets under 50 mm long; acarodomatia, if present, in axils of lower veins only. Inflorescence of broad lax cymes, terminal and axillary only in upper leaves. Calyx small, under 2 mm long. Flowers white.
            sourceIds:
              - sanbi_11118_0
            locator: "SANBI/WFO archive Morphology row 2479; source 11118.0; publication: Herman, PPJ; Retief, E. 1997. Plants of the northern provinces of South Africa: Keys and diagnostic characters. Strelitzia 6: 1 - 681. National Botanical Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: The two species J. fluminense and J. angulare are closely related and are best distinguished from each other by the very small calyx of J. fluminense, usually not over 2 mm long, its broad inflorescence borne clear of the leaves, and short pedicels. The distribution is distinct, J. fluminense being a tropical species reaching only as far south as the north eastern Transvaal and northern Zululand (Ingwavuma) whereas J. angulare occurs commonly in the Cape and as far north as Volksrust in the Transvaal and Utrecht in Natal.
            textZh: SANBI 条目提供了该种的鉴别特征。
            sourceIds:
              - sanbi_9227_0
            locator: "SANBI/WFO archive Diagnostic row 51568; source 9227.0; publication: Verdoorn, IC. 1963. Oleaceae, Fl. S. Africa 26: 100 - 128. Dept. Agric. and Technical Services, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
