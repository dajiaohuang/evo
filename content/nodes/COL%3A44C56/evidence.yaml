    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, 100-300 mm tall, stem branched, flexed above leaf sheaths. Leaves 3, linear, channelled. Flowers enclosed in green spathes, salmon with yellow nectar guides, occasionally yellow, tepals subequal, claws short, narrow at base, limbs spreading, filaments united in a slightly bulbous column, anthers coherent, concealing the style branches, crests vestigial.
            textZh: Moraea fenestrata (Goldblatt) Goldblatt 的 SANBI 物种条目记载了植株、叶片和花部形态。
            sourceIds:
              - sanbi_14562_0
            locator: Strelitzia 30; archive Morphology row 33308, source 14562.0
            placeTimeScope: Regional species account published 2013; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
          - text: Recognised by the flexuose stem, sharply flexed above the sheaths of the two to four leaves, the lowermost of these inserted well above ground level. All nodes of the stem bear foliage leaves except for the terminal which bears the inflorescence. The pink (rarely yellow) flowers have a yellow cup formed by the diverging tepals claws, often so narrow at the base that the edges are gapped, the cup thus windowed near the base. Plants from the Koedoes Mtns lack these windows but in other respects match the type except that some plants have uniformly yellow flowers. The flowers have filaments united in a slender column, only slightly wider toward the base, and contiguous anthers, with the stigmatic tips of the forked style branches extending between the anthers.
            textZh: SANBI 条目提供了 Moraea fenestrata (Goldblatt) Goldblatt 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: Strelitzia 42; archive Diagnostic row 94313, source 18638.0
