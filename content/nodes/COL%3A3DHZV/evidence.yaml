          originalSourceText: Annual herbs; stems erect to ascending, delicate, usually sparsely appressed pubescent. Leaves linear to narrowly lanceolate, 1-2.5 cm long and mostly 2-5 mm wide, sessile to subsessile, acute apically and basally, sparsely pilose above, slightly more pubescent beneath. Flowers on peduncles mostly equaling or longer than leaves; sepals lanceolate, 2-2.5 mm long, glabrous to pubescent outside, ciliate; corollas pale blue or white, 3-5 mm broad; ovary glabrous. Fruits capsular, globose or ovoid, reflexed; seed dark brown to black, smooth.
