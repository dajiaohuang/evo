  claim-statements.zh:
    - 唯一的 Gerobatrachus hottoni 正模 USNM 489135 兼具似蛙与似蝾螈性状，并在原始分析中落在蛙螈类干群；它既非冠群蛙螈类，也不是已证实的直接祖先或全球首次出现。
