  claims:
    - subjectId: event:kungurian-gerobatrachus-stem-batrachian
      claimKind: scientific
      claimType: topology
      statement: The sole Gerobatrachus hottoni holotype USNM 489135 combines frog-like and salamander-like characters and was recovered as a stem batrachian in the original analysis; it is neither crown Batrachia nor a demonstrated direct ancestor or global first appearance.
      confidence: medium
      confidenceRationale: A nearly complete articulated holotype and published character matrix support the morphology and proposed placement; medium confidence keeps the topology analysis-sensitive.
      referenceLinks:
        - relation: supports
          referenceId: anderson-2008-gerobatrachus
          pages: 515–518
          figure: Figures 1–4
          quoteLocator: Systematic palaeontology; phylogenetic analysis
