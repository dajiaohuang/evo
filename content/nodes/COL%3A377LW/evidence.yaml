          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Liana. Leaves with the blade elliptic to obovate, the apex shortly acuminate, the base obtuse, the margins entire to somewhat dentate toward the apex, 10-25 cm long, 5-10 cm wide, subcoriaceous, glabrous, the secondary veins 6-9; petioles 20-30 mm long, narrowly alate. Inflorescence caulifiorous or axillary, composed of few- flowered cincinni in fascicles. Flowers 7-9 mm broad, the pedicels 2-10 mm long; sepals 5, oblong to obovate, 5-6 mm long, 2-4 mm wide, glabrous to slightly pube- scent within and without; petals 3-4, white, obovate, 3-4 mm long, 2-3 mm wide; stamens 65-80, persistent, the filaments filiform, 5 mm long, the thecae 0.5 mm long, nearly parallel; carpels 1, glabrous to slightly pubescent, the styles terete, 1-2 mm long, the stigma peltate. Fruit dehiscent across the apex or indehiscent, glabrous to slightly pubescent, globose.
