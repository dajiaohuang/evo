        claims:
          - text: Acaulescent, cormous geophyte. Leaves 3, lower 2 spreading, lanceolate, 40-150 x 5-25 mm, uppermost erect, bract-like; bracts ovate. Flowers 1 or 2, unpleasantly scented, tepal claw 5-10 mm, blade auriculate-cucullate, green, 10-15(-20) mm long; filaments maroon, 6-11 mm long, anthers bluish, 5-10 mm long; stylodia 7-9 mm long.
