        claims:
          - text: Loosely tufted perennial 500-1400 mm high; basal internodes sometimes swollen; culms solitary, nodes glabrous or hairy. Leaf blade 100-190 x 2-5 mm. Inflorescence usually an open to sometimes a contracted panicle, branches filiform, conspicuously unequal. Spikelet 7-11 mm long; lower lemma awned from back towards the base, awn conspicuous, well developed, stout, geniculate; upper lemma awnless, or shortly awned or awned from middle; anthers 2.5-4.5 mm long.
