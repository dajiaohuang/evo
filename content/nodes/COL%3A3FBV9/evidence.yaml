        claims:
          - text: Twiggy, scabrid, aromatic shrublet to 30 cm. Leaves pinnatisect, segments filiform. Flower heads radiate, solitary or few in lax corymbs, with white or blue rays and yellow disc. Achenes ovate and wedge-shaped, slightly wrinkled, olive-green.
            sourceIds:
