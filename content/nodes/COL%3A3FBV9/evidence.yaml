            locator: "SANBI/WFO archive Morphology row 10491; source 14147.0; publication: Manning, JC; Goldblatt, P. 2012. Asteraceae: Garuleum Cass. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 379 - 379. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Garuleum bipinnatum is the only species where both ray and outer disc florets develop fertile cypselae; the leaves are twice-pinnate, decreasing in size and degree of lobing towards the inflorescence; inner bracts have whitish-scarious margins and often violet tips, and the plant is glabrous. It can be easily confused with Garuleum schinzii, but in G. schinzii the fruits develop from ray florets only, and the plant is glandular-hispid.
