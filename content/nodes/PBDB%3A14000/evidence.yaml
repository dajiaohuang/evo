  claims:
    - subjectId: taxon:ceratitida
      claimKind: scientific
      claimType: topology
      statement: Early internal-shell characters are used to infer relationships near the origin of sampled Ceratitida; this comparative inference is not a directly observed ancestor or a complete global first appearance.
      confidence: medium
      confidenceRationale: Internal shell structures provide explicit comparative characters, while preservation and taxon sampling keep the inferred origin hypothesis-dependent.
      referenceLinks:
        - referenceId: shigeta-2001-ceratitida-origin
          relation: supports
          pages: 201–213
          quoteLocator: Figures 1–8; internal-shell comparisons and phylogenetic inference
    - subjectId: taxon:ceratitida
      claimKind: scientific
      claimType: fossil-range
      statement: Shigeta et al. explicitly state that Ceratitida ranged from the Early Permian to the end of the Triassic; the atlas converts those named period bounds to 298.9–201.4 Ma with ICS v2026/06 without implying direct dates, continuous preservation or ancestry.
      confidence: medium
      confidenceRationale: The primary comparative study states both period-scale endpoints. Medium confidence reflects the coarse verbal bounds, changing numerical standards and the difference between a stated range and a global occurrence audit.
      referenceLinks:
        - relation: supports
          referenceId: shigeta-2001-ceratitida-origin
          pages: 201–213
          figure: Figures 1–8
          quoteLocator: "Introduction, pp. 201–202: ranged from early Permian to end of Triassic"
        - relation: contextualizes
          referenceId: ics-2026-06
          pages: International Chronostratigraphic Chart v2026/06
          figure: Global chronostratigraphic scale
          quoteLocator: Numerical boundaries for the named stages and periods used to bound the source sample
  claim-rationales.zh:
    - 内壳结构提供明确比较性状，但保存与类群取样使起源推断仍依赖假说。
    - 一手比较研究明确给出两个纪级端点。中等置信度反映文字界限较粗、数值标准会变化，也区分陈述延限与全球出现记录审计。
  claim-statements.zh:
    - 早期内壳性状被用于推断取样齿菊石目近起源关系；这一比较推断不是直接观察的祖先，也不是完整全球首现。
    - Shigeta 等明确陈述齿菊石目从早二叠世延续至三叠纪末；图谱依据 ICS 2026/06 将这些具名纪级界限换算为 2.989–2.014 亿年前，不暗示直接测年、连续保存或祖先关系。
