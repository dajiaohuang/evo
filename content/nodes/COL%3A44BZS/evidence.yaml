    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants 120-150 mm high, evidently without a collar of fibres at base. Corms obconic, ± 10 mm diam.; tunics of medium-textured, black fibres. Stem simple or rarely 1-branched, branch exserted from sheathing leaf, 3 aerial internodes long, bearing attenuate, partly dry sheathing leaves 15-18 mm long. Foliage leaf solitary, usually shortly exceeding stem, terete, ± 1 mm diam. when alive, straight below, loosely to tightly coiled in distal 1/3. Rhipidial spathes becoming dry at flowering time, often lacerated, inner 28-35 mm long, outer ± half as long to slightly less. Flowers fugaceous, white to creamy white, outer tepal limbs with yellow nectar guides at bases, evidently half reflexed; outer tepals ± 22 x 8 mm, limb ± as long as claw; inner tepals ± 15 mm long, limbs also half reflexed. Filaments 8-10 mm long, united in lower 3-4 mm; anthers ± 4 mm long; pollen ?white. Ovary subcylindric, ± 7 mm long, included, style branches ± 8 mm long, crests 6-8 mm long, wedge-shaped, ± 2 mm wide at base. Capsules ± ellipsoid, 8-9 mm long. Seeds unknown.
            textZh: Moraea acocksii Goldblatt & J.C.Manning 的 SANBI 物种条目记载了植株、叶片和花部形态。
            sourceIds:
              - sanbi_18638_0
            locator: Strelitzia 42; archive Morphology row 97813, source 18638.0
            placeTimeScope: Regional species account published 2020; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
          - text: The most striking feature of Moraea acocksii is the very slender, terete leaf, straight and ± erect for most of its length but with the distal third loosely to relatively tightly coiled and then straight again near the tip. Still poorly known, plants are usually unbranched but a few plants have a single branch, this relatively long and exserted from the subtending sheathing leaf. Plants are relatively low in stature, the tallest specimens up to 150 mm high, and the aerial part of the stem consists of four internodes, each node bearing an attenuate sheathing leaf up to 18 mm long. The white or creamy white flowers are relatively small for the M. saxicola complex with outer tepals ± 22 mm long (34-45 mm in M. saxicola), filaments 8-10 mm long and anthers ± 4 mm long.
