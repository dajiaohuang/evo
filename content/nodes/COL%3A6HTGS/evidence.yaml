        claims:
          - text: Open, tufted or sprawling slender perennial 500-1 000 mm high; rhizomatous; leaves cauline. Leaf blade 100-250 x 3-7 mm, expanded; auricles usually a large undulating flange with an ear-like extension on either side (this maybe absent as it breaks off easily) less than 1 mm wide; ligule shorter than 1 mm. Inflorescence narrow, to 300 mm long; branches smooth or with scattered prickles; spikelets borne either solitary on long pedicels or on short branches with up to five widely spaced spikelets. Spikelet (8)15-20 mm long, 5-8-flowered; glumes unequal, lower 1-nerved, upper 3-nerved; lemma acute or awned, awn 1-5 mm long; anthers 2-3 mm long.
