    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Bulb about 2 cm in diam., not sharply distinguished from the neck, 1-3 cm long. Leaves 2-3, contemporary with flowers, linear, obtuse, 15-20 cm long, about 5 mm wide, keeled on the lower surface, subglaucous. Peduncle about equalling the leaves, solid, glaucous. Spathe-valves lanceolate, 2.5 cm long. Pedicels shorter than the spathe-valves. Flowers 3-4 in an umbel, suberect to pendulous, red; perianth about 3.7 cm long; tube dilated gradually to a throat about 3-4 mm wide; lobes broadly ovate, obtuse, 3-4 mm long reflexed. Stamens biseriate, sub-sessile, included. Style slightly exserted, trifid.
