          - text: "E. verdoorniae can easily be distinguished from the other Southern African Eugenia species by the following combination of characteristics: (i) narrow flat leaves with the margin not revolute; (ii) the midrib flat on both sides in fresh material; (iii) the midrib only slightly concave above, but raised below in dried leaves; (iv) seeds globose, testa thick and tough; (v) the embryo not conspicuously glandular-punctate; (vi) stems in which the first-formed periderm originates in the primary external phloem."
