        usage:
          title: Ardisia guianensis (Aubl.) Mez, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrubs or small trees, the branchlets slender, subterete, finely lepidote. Leaves subsessile, the petioles thick, marginate, to 5 mm long; leaf blades membranaceous to chartaceous, entire or subentire to crenulate, oblanceolate, obovate, or oblanceolate-elliptic, 6-12 cm long and 2.5-5 cm wide, abruptly short acuminate apically, subcuneate basally, decurrent, lepidote on the under- surface, the costa plane above, prominent beneath, the primary nerves con- spicuous, 8-11 pairs, the veins reticulate. Inflorescences terminal, tripinnately paniculate, pyramidal with a rounded top, angulate, finely furfuraceous-lepidote, to 9 cm long; pedicels 3-4(-5-7) mm long. Flowers 4-5-merous in the same inflorescence, subcorymbose, numerous, crowded; buds slender, fusiform; calyx lepidote, the sepals thin, ovate, 1.3-1.4 mm long, rounded apically with a hyaline margin, obscurely ciliolate or erose at first, punctate with small round outer and inner oblongish orange glands, these usually dispersed; petals 4.5-5 mm long, revolute, connate ca. 1 mm basally, oblong-elliptic, lineate medially with orange glands, with small round orange glands bordering these; stamens 3-4.2 mm long, attached above the base of the corolla tube, the fila- ments slender, 1-1.5 mm long, the anthers often reddish-black when dry, finely rugose, slender, linear, 2.4-3.3 mm long, apiculate, dehiscent by small flaring apical pores; ovary small, glabrous, ovules small, (5-)8-12(-14) in several series, the style slender, 4.5 mm long. Fruit globose, 5-6 mm in diameter.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 8249
