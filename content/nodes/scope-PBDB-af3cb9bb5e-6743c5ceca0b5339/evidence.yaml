  claim-rationales.zh:
    - 白垩纪单孔类下颌的分类表述只覆盖具名标本及所引主研究的分析范围；导航归属不表示直系祖先或普适系统树。
    - 白垩纪单孔类下颌的地理字段只投影主研究记录的具体产地，不外推为全球分布、起源中心或完整扩散路径。
    - 白垩纪单孔类下颌的生态字段区分保存事实与功能推断；未被标本直接记录的饮食、行为、栖息地或性能均明确保留不确定性。
    - 白垩纪单孔类下颌的形态字段限定于主研究列明的具名标本和精确页码、图版或补充材料，不外推到整个支系。
    - 白垩纪单孔类下颌的年代范围是主研究标本或地层背景的有界投影，不作为全球首现、末现、分化时间或连续谱系时长。
  claim-statements.zh:
    - AM F66763 确立了 Steropodon galmani，并依据牙齿解剖被解释为单孔类材料；它不是直接祖先，也不能代表完整的单孔类体制。
    - 本资料仅限于 Griman Creek 组的 Lightning Ridge，不能确定 Steropodon 或单孔目完整的地理范围。
    - 臼齿形态只允许有边界的摄食推断；这件颌骨并未直接保存食性、栖息地利用或运动方式。
    - AM F66763 保存了一件带三枚臼齿的右齿骨碎片，论文将其与单孔类及三尖型牙齿条件作比较。
    - 1.10 亿至 1.00 亿年前的区间是正模所在组级背景的宽泛导航区间，并非直接测年、全球首次或末次出现，也不是单孔类冠群年龄。
