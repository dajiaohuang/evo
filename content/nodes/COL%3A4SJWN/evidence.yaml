        claims:
          - text: Shrub, up to 2 m high. Leaves simple, discolorous, glaucous, glabrous, with net-veining on undersurface prominent, leaf apex acute to obtuse, margin entire. Flowers greenish yellow.
            sourceIds:
              - sanbi_11118_0
            locator: "SANBI/WFO archive Morphology row 3279; source 11118.0; publication: Herman, PPJ; Retief, E. 1997. Plants of the northern provinces of South Africa: Keys and diagnostic characters. Strelitzia 6: 1 - 681. National Botanical Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Rhoicissus laetans is distinguished from all the other members of the genus by its shrubby habit and simple, glabrous, glaucous green leaves. In southern Africa R. tomentosa (Lam.) Wild & Drummond and R. microphylla (Turcz.) Gilg & Brandt also have simple leaves. The leaves of R. tomentosa are broadly transversely elliptic to reniform and the species is a high-climbing liane. R. microphylla, a small shrub, has ovate leaves with the undersurface of the lamina covered with reddish brown hairs. The other southern African species, namely R. digitata (L.f.) Gilg & Brandt, R. revoilii Planch., R. rhomboidea (E. Mey. ex Harv.) Planch., R. sessilifolia Retief and R. tridentata (L.f.) Wild & Drummond all have 3-foliolate leaves. For nearly twenty years it was thought that specimens of R. laetans belonged to R. microphylla, a species occurring only in the eastern Cape. The two taxa differ not only in their widely disjunct distribution but R. microphylla has ovate to elliptic leaves, with reddish hairs and hair-tuft domatia on the undersurface. R. laetans, on the other hand, has elliptic to obovate leaves which are glaucous green and glabrous when fresh, and prominently discolorous when dried.
            textZh: SANBI 条目提供了该种的鉴别特征。
            sourceIds:
