        claims:
          - text: Cormous geophyte, 10-30 cm, tunics woody, concentric. Leaves narrow, H-shaped in section, viscid on margins. Flowers white to pink, tube elongate, stamens and style unilateral.
            textZh: Geissorhiza tenella Goldblatt 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 6824; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Distinguished by the white or pale pink flowers with unusually narrow tepals 13-23 x 2.0-4.5 mm, Geissorhiza tenella has a perianth tube remarkably variable in length, mostly 30-40 mm long but as short as 20 mm and occasionally as long as 50 mm. The leaf blades are H-shaped in cross section with the margins raised into broad wings held at right angles to the blade. It is allied to the long-tubed Atlantic Coast species G. exscapa and to the Cape Peninsula endemic G. bonaspei, with which it shares the distinctive leaf with winged margins and H-shaped in cross section. Geissorhiza bonaspei has slightly larger, deep pink flowers with relatively broad tepals mostly 24-27 x 5-7 mm. Flower size is unusually variable in G. tenella. Plants from the east of its range, in the Caledon and Bredasdorp Districts as far east as Still Bay (as well as some from the Cape Flats), have a relatively short perianth tube, some 24-30 mm long and tepals 12-15 mm long. In contrast, most populations from the Cape Flats and along the Atlantic Coast usually have much larger flowers with a perianth tube 40-50 mm long and tepals up to 23 mm long. Such specimens approach G. exscapa in their flower size and this is probably related to their pollination biology.
            textZh: SANBI 条目提供了 Geissorhiza tenella Goldblatt 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 94700; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
