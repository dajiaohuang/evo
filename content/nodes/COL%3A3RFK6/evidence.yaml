    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Acaulescent, succulent perennial, usually suckering to form dense colonies. Leaves distichous, dull glaucous-green, without spots, lorate, apex obtuse to rounded, to 18 cm long; margins reddish, minutely crenate at apex. Racemes ascending, capitate, ± dense, to 45 cm high. Flowers scarlet, ± 38 mm long; stamens not exserted; stigma slightly exserted.
            textZh: Kumara haemanthifolia (Marloth & A.Berger) Boatwr. & J.C.Manning 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13850_0
            locator: "SANBI/WFO archive Morphology row 9008; source identifier 13850.0; cited publication: Klopper, RR; Smith, GF. 2012. Asphodelaceae: Aloe L. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 66 - 70. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: This is one of two species of Aloe (the other being A. fibrosa from Kenya) to have distinct fibres in the leaves. Its large, distichous, leathery, linear, obtuse leaves, stemless habit and capitate racemes of flowers with long perianths and included anthers and styles distinguish this species from all others in the genus. Evidently the leaves of this species reminded Marloth and Berger of those of a Haemanthus (a well-known genus of bulbous plants).
            textZh: SANBI 条目提供了 Kumara haemanthifolia (Marloth & A.Berger) Boatwr. & J.C.Manning 的鉴别特征。
