    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, 35-75 cm. Leaf solitary, occasionally 2, linear, channelled. Flowers yellow to orange or bicoloured, tepal claws forming a wide cup, filament column slender, anthers partly exserted.
            textZh: Moraea ochroleuca (Salisb.) Drapiez 的 SANBI 物种条目记载了植株、叶片和花部形态。
            sourceIds:
              - sanbi_13878_0
            locator: Strelitzia 29; archive Morphology row 7410, source 13878.0
            placeTimeScope: Regional species account published 2012; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
          - text: The large yellow or yellow and orange flowers of Moraea ochroleuca are distinctive in their wide cup formed by the tepal claws and spreading tepal limbs. The species is unusual in having nectar secreted from veins over the claw surface rather than from discrete nectaries at the tepal bases as in most other Moraea species. The style branches, relatively well developed and up to 6.5 mm long but only ± as wide as the anthers that are appressed to them, terminate in bilobed stigma lobes but lack discrete crests. The tall plants, up to 750 mm high, typically have a solitary foliage leaf but plants with two, or even three foliage leaves are known, these mostly from higher elevations. Flowers of M. ochroleuca last three days, opening in the morning on the first day and fading gradually during the third day. The flowers have a strong, rather sickly sweet, slightly fermenting odour.
            textZh: SANBI 条目提供了 Moraea ochroleuca (Salisb.) Drapiez 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: Strelitzia 42; archive Diagnostic row 94290, source 18638.0
