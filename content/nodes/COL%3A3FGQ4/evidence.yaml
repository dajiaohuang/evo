    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Shrubby perennial herb with semi-prostrate or ascending stems up to c. 35 cm long; stems branching, angular or subcylindric, striate, puberulent. Leaves coriaceous, sessile, up to c. 3.0 x 0.4 cm, narrowly oblanceolate or narrowly oblong, apex cuspidate and pungent ± narrowed to the base and briefly decurrent, margins entire or subdenticulate, glandular-punctate, glabrous. Capitula solitary, sessile in the axils or in apical congested cymes, involucres c. 0.5 cm in diam., involucral bracts c. 3-4-seriate, outer c. 0.5 cm long, ± recurved, lanceolate at the base, foliose and lorate above; inner slightly shorter, lanceolate-oblong, horny in texture, pale, apex cuspidate and pungent, ciliate on the margins. Female ray-florets yellow, ray elliptic, 3-dentate at the apex; hermaphrodite disk-florets yellow, 5 mm long, cylindric but narrower in the lower one-third, lobes linear acuminate puberulent-glandular. Cypsela c. 1 mm long, turbinate, villous, pappus biseriate, 1.3 mm long, oblanceolate, obtuse and serrulate near the apex, the inner aristate.
            sourceIds:
