        usage:
          title: Psychotria limonensis K.Krause, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Subshrubs or shrubs to 3 m tall, the branchlets terete, ultimately angular, glabrous, smooth, the nodes well spaced. Leaves widely oblong, often oblong rotund, regularly ca. 2 times longer than wide, 11-30 cm long, 3.5-12.0 cm wide, widely deltoid at the apex, rarely acute and falcate, vaguely acuminate, the acu- men deltoid, to 1.5 cm long, obtuse, basally cuneate, rarely truncate, often slightly inequilateral, the costa subplane or prominent beneath, often rubescent beneath, subperpendicular to widely arcuate, often rubescent, chartaceous, discolorous, fleshy, glabrous; petioles to 5 cm long, to 0.3 cm wide, glabrous; stipules free, compressed rotund, ca. 0.8 cm long, ca. 0.9 cm wide basally, coriaceous, gla- brous. Inflorescences solitary, terminal, paniculate, subrotund, to 5.5 cm long, usually slightly wider than long; peduncles 1.5-2.0 cm long; bracts ovate or tri- angular, ca. 1 mm long, pubescent. Flowers ca. 3 mm long; hypanthium ca. 0.8 mm long, glabrous to puberulent, the calycine cup short with a few appressed, round glands within, the teeth minute, triangular, acute; corolla white or cream colored, the tube ca. 2 mm long, glabrous outside, villose within; stamens 5, the anthers oblong, ca. 0.9 mm long, the filaments short, ca. 1 mm long, villose, attached near the mouth; style slender, ca. 1 mm long; stigmas linear, ca. 1 mm long, the ovarian disc subrotund, ca. 0.4 mm long. Fruits subglobose or oblong, 6-7(-10) mm in diam., red at maturity, the pyrenes hemispherical, to 4 mm long, the ventral face plane, the dorsal face convex, the ribs 5 per pyrene.
          originalLanguage: en
          sourceField: general
