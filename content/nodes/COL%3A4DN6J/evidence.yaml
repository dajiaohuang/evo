          title: Parkinsonia aculeata L., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Xerophytic shrubs or small trees to several m. tall, the branchlets subglabrous, more or less flexuous and gnarled. Leaves multifoliolate, twice compound as de- scribed for the genus; petiole and rachis modified into a spine 5-15 mm. long, bearing from the upper side 1-3 pairs of pinnae; pinnae multifoliolate, the rachis linear, 2-3 din. long and 1-2 mm. wide, flattened, green; ultimate leaflets about 25 pairs, linear-oblong, 2-8 mm. long and up to 2 mm. wide, often caducous. Racemes up to 2 dm. long, subglabrous; bracts lanceolate, about 1 mm. long; pedicels slender, 1-2 cm. long in age. Flowers yellow; calyx-tube turbinate, scarcely 2 mm. long; calyx-lobes ovate-lanceolate, 6-7 mm. long and about 3 mm. wide, subglabrous; petals 5, about 13 mm. long, the blade suborbicular. about 8 mm. long, claw pubescent at base, about 5 mm. long; stamens 8-9 mm. long, pubescent basally; ovary linear-oblong, about 4 mm. long, hispid; style linear, about equalling the stamens, glabrous; stigma terminal, minute. Legume linear, up to about 15 cm. long, nodose by constriction between the seeds, glabrous, striate-nerved; seeds about 1 cm. long.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 5606
