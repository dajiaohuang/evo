        usage:
          title: Panopsis suaveolens (Klotzsch) Pittier, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Trees to 12 m. tall, the young branches terete, ferrugineous-strigillose and glabrescent, conspicuously lenticellate. Leaves elliptic, oblong-elliptic or oblance- olate, 4-17 cm. long, 1.5-5.0 cm. broad, obtuse, mucronulate or sometimes retuse at the apex, cuneate to obtuse at the base, coriaceous, ferrugineous-strigillose and glabrescent above and below, the costa plane above, emersed below, the primary lateral veins numerous, extremely reticulate, conspicuously emersed; petiole 2-8 mm. long. Inflorescence racemose, terminal or axillary, multi-flowered, the rhachis 6-15 cm. long, ferrugineous-strigillose, the flowers borne singly or to 4 per cluster. Tepals linear-oblanceolate, 7-8 mm. long, 0.5-0.75 mm. broad, revolutely reflexed, strigillose without, glabrous within; stamens inserted at the base of the perianth, the anthers oblong, 1 mm. long, 0.5 mm. broad, the filaments liguliform, about 6.5 mm. long, 0.5 mm. broad, glabrous; pistil long-conical, the ovary to 2 mm. long, 0.5-0.75 mm. in diameter, densely hirsute, the style 4-5 mm. long, glabrous, the stigma narrowly clavate; pedicel 4-8 mm. long, ferrugineous- strigillose. Fruit ellipsoid to ovoid, 3.5-6.0 cm. long, 2-4 cm. in diameter.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 17277
