            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Among the long-tubed Hesperantha species of the Drakensberg, H. scopulosa stands out in its rocky habitat, curved and often trailing stems, falcate leaves and mauve to magenta-pink flowers. The perianth tube is typically 30-42 mm long and 1.5-2.0x as long as the tepals, 16-25 mm long. Seeds of H. scopulosa, are striking in the genus, ovoid, ± 1.3 mm long, with a pale, irregularly twisted persistent funicle several times longer than the seed body. The chalazal end of the seed has what appears to be a vestigial wing.
