    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants mostly 140-250 mm high. Corm ± globose, 15-20 mm diam.; tunics dark brown, fragmenting below into truncate sections and drawn into short cusps above. Stem usually simple, rarely 1(2)-branched, curving outward distally, sometimes pendent. Leaves (3)4, lower 2 ± basal, ± usually longer than stem, falcate, soft-textured, (2.5-)4.5-10.0 mm wide, upper leaves cauline, shorter, uppermost largely to entirely sheathing. Spike mostly (1)3- to 8-flowered; bracts green or flushed purple distally, outer 20-35 mm long, inner slightly shorter. Flowers diurnal, salver-shaped, mauve-pink to magenta- pink, white in throat, unscented; perianth tube cylindric, curved toward apex, expanded near mouth, mostly 30-42 mm long; tepals subequal, elliptic, spreading, 16-25 x 5.5-7.2 mm. Filaments ascending, 3.0-4.4 mm long; anthers 4.5-7.0 mm long, yellow; pollen yellow. Style branches laxly spreading, 10-14 mm long, exceeding anthers in closed flower. Capsules ellipsoid, 8-13 mm long. Seeds ellipsoid-fusiform, lightly angled, 1.25-1.50 mm long, golden-brown, with thread-like funicle 2-3 mm long, pendent after capsule dehiscence.
            textZh: Hesperantha scopulosa Hilliard & B.L.Burtt 的 SANBI 物种条目记录了形态特征。
