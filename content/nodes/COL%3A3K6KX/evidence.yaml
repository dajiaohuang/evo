    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Twiggy dwarf shrub up to 300 mm tall, old stems woody, up to 8 mm diam., main branches prostrate or decumbent, ultimate branches stiffly erect, densely leafy, they and the leaves enveloped in peculiar silvery grey felt with a 'tissue-paper' surface. Leaves rigid, up to 20 x 5 mm, narrowly to broadly spathulate, becoming smaller and oblong-spathulate or oblong upwards, apex obtuse to subacute, mucronate, hooked, base half-clasping. Heads heterogamous, cylindric, ±4 x 1 mm, many in tight clusters usually webbed together with woolly hairs, arranged in compact corymbose panicles up to 20 mm across at the branch tips. Involucral bracts in ±3 series, closely imbricate, about equalling flowers, not radiating, pellucid, silvery, the tips sometimes washed palest brown or palest yellow, Woolly hairs webbing the bracts in a thin skin. Receptacle smooth. Flowers 4-5(-6), 1-3 female, 3-4 homogamous, bright yellow. Achenes not seen, ovaries glabrous. Pappus bristles few (up to 8), scabridulous, shorter than corolla, bases with patent cilia, not cohering.
            sourceIds:
