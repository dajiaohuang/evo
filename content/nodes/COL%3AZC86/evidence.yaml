        usage:
          title: Cremosperma maculatum L.E.Skog, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Herbs, either terrestrial or epiphytic in the moss layer on tree trunks; stems somewhat stoloniferous with upright branches 10(-20) cm tall, slender, 1-2 mm in diam., green villous to sericeous. Leaves subequal in a pair, ovate or elliptic, 1.2-2.8 cm long, 0.6-1.4 cm wide, membranous, the apex acute, the base acute to cuneate, serrate, above dark bluish green, the midveins rarely silvery, bullate, furrowed along the impressed veins, long pilose between the veins, below lighter green, appressed pilose along the prominent veins; petioles 2-9 mm long, pilose. Inflorescences from the upper axils but appearing terminal, exceeding the leaves, shortly cymose racemose, 4-7 flowers; peduncles slender, erect, 1.5-2.3 cm long, ca. 1 mm in diam., green, long pilose; pedicels 1-4 mm long, green, densely pilose. Flowers small; calyx tube obconic to turbinate, ca. 2 mm long and wide, green, pilose to sericeous, 10-costate, the lobes ovate triangular, 1 mm long and wide, green outside, pilose, inside glabrous; corollas white with purple spots or pink in the throat on the lower side, the tube funnelform, 0.7-1.2 cm long, ca. 1.5 mm in diam. at the base, ampliate above, to ca. 3 mm in diam. at the throat, outside pilose to villous, inside glandular pubescent, the limb bilabiate, the lobes obovate, the upper lobes 3 mm long, 1.5 mm wide, the lateral and the basal lobes 4 mm long, 2 mm wide, crenulate; filaments adnate to the corolla tube for ca. 8 mm above the base, curved, reddish, glabrous, the anthers broader than long, ca. 0.5 mm long, ca. 0.75 mm wide, coherent; disc annular, 1 mm high, shallowly lobed, reddish; ovary ovoid, 2 mm long, glabrous, the style 1 cm long, glabrous, the stigma stomatomorphic. Mature fruit and seeds not seen.
          originalLanguage: en
          sourceField: general
