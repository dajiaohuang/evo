        usage:
          title: Justicia refractifolia (Kuntze) Leonard, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: 7 cm wide, apically acuminate, basally acute to attenuate, glabrous to strigose along the costa and the veins above, pilose beneath, the margins entire to undu- late; petioles 5-15 mm long, pilose. Inflorescences in terminal and axillary spikes, borne singly and in clusters, to 15 cm long, 1 cm wide, the rachis pilose to strigose; bracts ovate, to 10 cm long, 6 cm wide, imbricate, apically acute, drying brown, the veins prominent, pilose both surfaces, ciliate; bractlets lanceo- late, falcate, to 8 mm long, 2.5 mm wide, ciliolate. Flowers with 5-merous calyx, segments narrowly subulate, to 6 mm long, 0.5 mm wide, ciliate; corollas white to purple, to 11 mm long, puberulous, the tube cylindrical, 7 mm long, 1.5 mm broad, the upper lip erect, 4 mm long, 2 mm wide, apically bidentate; lower lip 4 mm long, 3-lobed, the lobes 2.5 mm long, apically obtuse, the middle lobe 2.5 mm wide, the lateral lobes 2 mm wide; stamens exserted to about the notch of the upper lip, the filaments attached just below the throat, pubescence of minute glandular hairs, the anther cells superposed; the lower cell spurred. Capsules clavate, 9 mm long, 2 mm broad, puberulous; seeds subtriangular, ca. 1.5 mm across, flattened, reddish brown, roughened.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 217
