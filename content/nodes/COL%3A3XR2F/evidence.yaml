          - text: Lavatera potiùs pro Malvarum sectione, quàm pro genere diverso haberi debet. Sectionem interea Candolleanam, Anthemam, Malvis charactere nullius momenti, bracteolis scilicet ad basin inter se leviter coalitis, artificialiter disjunctam, post sectionem Strongyliam, cui mirè consimilis, admisimus. A Malvà tollendae Chrysanthae, spicatae, aliaeque exoticae, longiùs facie et forma ab Europeis quàm Lavaterae ipsae decedentes. Lavaterae enim summa est affinitas, et naturalis quaedam habitus et stationis cum Malvis rotundifoliis cognatio. Haec tamen, dùm exoriatur Cavanillesius alter, qui totam de novo aptiùsque disponat familiam, nobis praeter-mittenda.
