          title: Vitex cymosa Bertero ex Spreng., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: firmly chartaceous or rarely subcoriaceous when mature, very lightly and ob- scurely pulverulent-puberulent above when immature, usually glabrescent and shiny when mature, puberulent to short-tomentellous (sometimes very densely so) beneath when immature, less so when mature; petioles 2.5-15 cm long, densely puberulent or short-pubescent; petiolules 1-17 mm long when mature, densely puberulent, margined, the lateral petiolules usually shorter than the central ones, often obsolete on immature leaves. Inflorescences axillary, cymose, abundant, much shorter than the subtending petioles, 2-9.5 cm long and 1-10 cm wide, 1-4 times dichotomous with wide-spreading branches, usually flowering before the leaves are completely mature, whitish- or yellowish-puberulent throughout, the hairs denser at all the joints; peduncles 0.7-4.5 cm long, the cyme-branches con- spicuously flattened; pedicels 1-2 mm long; foliaceous bracts often present, simple, obovate-spatulate or oblong-elliptic, stipitate 1-1.5 cm long, similar to the im- mature leaflets in pubescence; bractlets linear, 1-4 mm long; prophylls setaceous, ca. 1 mm long. Flowers with the calyx campanulate, 2-3 mm long and 2-5 mm wide, densely puberulent, 5-dentate, the teeth ovate, obtuse or acute, often re- curved or reflexed, often nigrescent on the inner surface; corolla blue or pinkish- blue to violet, lilac, or purple, rarely white, hypocrateriform, the tube 6-7 mm long, puberulent outside above the calyx, the limb conspicuously 2-lipped, the 4 small lobes ca. 4 mm long and 2 mm wide, obtuse, the fifth lobe much enlarged, rounded, ca. 7 mm long and 8 mm wide, the margins crisped. Fruit succulent, purplish- or violet-black, 1.1-2 cm long and 0.9-1.5 cm wide, glabrous, edible; fruiting cymes usually 4-6.5 cm long and lax, the pedicels 1-5 mm long, strigose- pubescent; fruiting-calyx flattened-campanulate, ca. 5 mm long and 12 mm wide, shallow, coriaceous, dark, finely short-strigose outside, 4- or 5-lobed, the lobes broadly triangular-ovate and often more or less obscurely toothed.
