          originalSourceText: Tree to 28 m tall; trunk to 60 cm in diameter 1.5 m above ground; branchlets gray to brownish, acutely or obtusely tetragonal, the pith small, the youngest parts densely puberulent with sordid-grayish or yellowish hairs. Leaves 3-7- foliolate, sometimes subopposite; leaflets usually unequal in size, the two lower- most usually considerably smaller, the central leaflet oblong or elliptic to oblan- ceolate-elliptic or obovate, rarely lanceoate, 4-23 cm long and 2.4-7.2 cm wide, apically acute to abruptly short-acuminate or even caudate-acuminate, the acumen itself blunt, basally acute or acuminate-attenuate, entire, green on both surfaces when mature or lighter beneath, brunnescent or nigrescent above when immature,
