    facets:
      morphology:
        status: partially-supported
        claims:
          - text: A dwarf-annual with very slender root-system and numerous densely set culms. Culms 1-12 cm long and 0.2-0.3 mm thick, angular, often curved. Sheaths 2 above the prophyll, the basal usually purple and truncate, the upper paler and ending in an arrow lanceolate lobe. Spikelet ovate to broadly lanceolate, 2-4 mm long and 1-2mm wide. Inflorescence-bract lacking and consequently all glumes are fertile. Glumes about 1 mm long, dark reddish brown (but lower glumes sometimes very pale) with a very distinct green midrib ending in or near the obtuse tip, with or without an arrow pale margin; the glumes much spreading at maturity to expose the nutlets. Perianth-bristles usually present, shorter than the nutlet, barbellate with recurved spine-like teeth, usually 4-5 but sometimes lacking. Stamens 2. Style-branches 2. Nutlet about 0.5 mm long and 0.4 mm wide, broadly obovate, flattened, smooth and very shiny; when young whitish-yellow or pale brown, when mature black; appendage greyish, minute, flattened.
            textZh: Eleocharis atropurpurea (Retz.) J.Presl & C.Presl 的 SANBI 物种条目记录了形态特征。
