            locator: "SANBI/WFO archive Morphology row 83991; source identifier 11883.0; cited publication: Haines, RW; Lye, KA. 1983. The sedges and rushes of East Africa. East African Natural History Society, Nairobi. [All rights reserved]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: This species is easily recognized by the black shiny nutlet with minute appendage, the 2-branched style and the presence of a perianth. It is somewhat similar to E. nigrescens, which has 3-ribbed nutlet and is lacking perianth. The fertility of the glumes is an exception to the usual generic description giving the lower two glumes empty.
