          originalSourceText: Lianas, twining, scandent, glabrous. Leaves alternate, variable cordate-hastate to sub-trilobate, membranous, ca. 15 cm. long, 12 cm. wide. Pseudostipules present. Flowers axillary, the calyx borne at an abrupt angle at the apex of the ovary, dark red, mottled and striped with lighter shades of red and yellow, the utricle ovate, 2 to 3.5 cm. long, the tube arising at a right angle from the side of the utricle, 1 5 to 2 0 mm. long, the limb thick, delicate, crenate, suborbiculate, 6 to 12 cm. diameter. Fruit cylindric to subfusiform, abruptly bent in a right angle at the apex, slightly curved, 1.5 cm. diameter, 4 cm. long, dehiscing acro- petally. Seeds numerous, horizontally com- pressed, 5 mm. diameter, 0.5 mm. thick.
