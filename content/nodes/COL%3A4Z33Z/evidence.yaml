        usage:
          title: Spigelia anthelmia L., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Herb, annual, 15 cm-1.3 m high, the roots usually shallow and fibrous; stems ascending, leafless below the apical leaf whorl (the apical whorl actually consists of 2 decussate and sometimes unequal leaf-pairs not separated by a manifest inter- nodal area) or with 1-2 cauline leaf-pairs reduced in size with respect to the apical whorl, simple or few-branched, glabrous or puberulent on the extreme distal por- tion with simple trichomes 0.1 mm long or less, becoming ? terete and suffrutescent at the base; branches and at least the distal 1/2 of the main stem compressed, green, weak, subsucculent, often faintly striolate. Leaves sessile or with petioles to 10(-20) mm long, the leaves of the terminal whorl often sessile or subsessile; blades 2-18 cm long, 0.8-6.5 cm broad, broadly ovate or rhombic-ovate to lance-oblong or lance-elliptic or lanceolate, apically acuminate or acute, basally acute to broadly rounded or sometimes approaching subtruncate, often decurrent long the petiole, paler green below, membranous, marginally usually ciliate with simple mammil- late trichomes 0.1 mm long or less, glabrous above or with minute scattered mam- millate trichomes, glabrous below or minutely puberulent along the main veins, the midvein and secondaries apparent on both surfaces, sometimes slightly raised below, the 6-14 secondaries arising pinnately from the midvein and arcuate-ascend- ing, the reticulation typically faint or obscure on both surfaces; stipules broadly deltoid, 1-3 mm long. Spikes 1-5, simple or infrequently branched, 3-18 cm long, 10 to 40-flowered, terminal but sometimes overtopped by floriferous branches. Flowers closely aggregated at the tip of the spike, soon separated by 2-7(-15) mm by internodal elongation, the pedicels obsolete to 1 mm long; calyx-lobes free to the base, linear-lanceolate, often dialated at the base, 2-6.5 mm long, unequal or subequal, minutely ciliate marginally and externally along the keeled midrib but otherwise glabrous; corolla rather narrowly funnelform or tubular-funnelform, white to pink or lavender, glabrous, soon fugaceous, the tube 6-16 mm long, 2-4.5 mm broad at the throat, 0.7-1.5 mm broad at the base, the lobes ovate-deltoid or virtually rhombic, 2-3 mm long; anthers included, 0.8-1.5 mm long, the free-portion of filaments ca 2 mm long, attached to corolla-tube somewhat above the middle; ovary ca 0.8 mm long, subglobose, the style extending to the opening of the corolla- throat, with the upper 1,2 (or slightly less) swollen and eventually deciduous, the stigmatic region pubescent. Capsules ca 4 mm long, 5-6 mm broad, compressed at right angles to the septum, conspicuously muricate except at the base, the persistent cupular base navicular, pointed at the ends; seeds brownish, ovoid to suborbicular, 1.5-2 mm long, carnose, externally conspicuously tuberculate.
