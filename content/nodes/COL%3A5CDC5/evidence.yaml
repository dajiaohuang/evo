        claims:
          - text: Dwarf shrub, up to 500 mm tall. Leaf blades densely hairy underneath or on both sides, linear-subulate, falcate. Ovary covered with long, soft, fascicled hairs. Flowers bluish purple.
            textZh: Xerophyta villosa (Baker) L.B.Sm. & Ayensu 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_11118_0
            locator: "SANBI/WFO archive Morphology row 3956; source identifier 11118.0; cited publication: Herman, PPJ; Retief, E. 1997. Plants of the northern provinces of South Africa: Keys and diagnostic characters. Strelitzia 6: 1 - 681. National Botanical Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Amphistomatic with deep opposite furrows; central bundle with small adaxial cap and large abaxial ascending crescentiform girder, and there is no additional sclerenchyma band between bundle sheath and abaxial epidermis; outer epidermis cell walls are almost not thickened and also not papillate; thin sclerenchyma bands, single layered in general, underline the adaxial and abaxial sides of the epidermis on either side of lateral bundles; aquiferous cells are present below adaxial furrows, topped by a sclerenchyma strand (knob) in only the two or three closest to the central bundle.
            textZh: SANBI 条目提供了 Xerophyta villosa (Baker) L.B.Sm. & Ayensu 的鉴别特征。
            sourceIds:
