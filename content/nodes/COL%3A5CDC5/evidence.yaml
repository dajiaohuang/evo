            locator: "SANBI/WFO archive Diagnostic row 74770; source identifier 14973.0; cited publication: Behnke, HD; Hummel, E; Hillmer, S; Sauer-Gurth, H; Gonzalez, J; Wink, M. 2013. A revision of African Velloziaceae based on leaf anatomy characters and rbcL nucleotide sequences. Bot. J. Linn. Soc. 172: 22 - 94. [All rights reserved]"
