        usage:
          title: Rudgea skutchii Standl., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Trees 2-5 m tall, the branchlets smooth, lustrous, glabrous, the nodes well spaced. Leaves oblong to obovate oblong, occasionally salicoid, 8.5-20.0 cm long, 3-10 cm wide, obtuse or rounded at the apex or occasionally truncate, the acumen narrowly deltoid, conspicuously falcate, to 2 cm long, to 0.25 cm wide in the middle, ultimately acute or obtuse, apiculate, the apiculum occasionally to 0.3 mm long, obtuse, rounded or truncate at the base, occasionally vaguely au- riculate, subequilateral, the costa plane to prominent above, to 0.2 cm wide, the lateral veins 7-9, arcuate, the larger veins to 2.5 cm apart, prominulous above and beneath, the intervenal areas reticulate, chartaceous to papyraceous, scarcely discolorous, often with minute subepidermal raphides above, glabrous beneath; petioles 0.3-0.8 cm long, ca. 0.3 cm wide, minutely puberulent; stipules free, appressed, oblong or rotund, 0.6-0.9 cm long, about as long as wide, obtuse with about 25 crassate, linear oblong, fimbriate excrescences at apex, these to 1 mm long, glabrous. Inflorescences terminal, solitary, glabrous, cymose paniculate, to 6 cm long, to 6 cm wide, the peduncle to 4.5 cm long, 0.1 cm wide, glabrous, often slightly curved, angular, the primary branches 2-3, to 1.5 cm long, the cymules few, 3-flowered. Flowers sessile or pedicellate, the median flower ses- sile, the lateral flowers on pedicels to 1 cm long, glabrous, the floral parts gla- brous, the hypanthium obconic, ca. 2 mm long, the calycine cup to 5 mm long, truncate or with 5 widely triangular teeth, to 0.4 mm long, the margin scarious; corolla white, the tube cylindrical, to 7 mm long, stiffly carnose, the lobes 5, narrowly oblong, 7-8 mm long, with a subapical adaxial projection, narrowly oblong, ca. 2 mm long, the stamens 5, the tips of anthers barely exserted, the anthers narrowly oblong, to 3.5 mm long, obtuse, the filaments short, inserted in the upper 2/3 of the tube, the stigmas included in tube, the style slender, the stigmas erect (at least in bud), subulate. Fruits not seen.
