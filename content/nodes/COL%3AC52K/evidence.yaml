          - text: Short-lived erect perennial 300-100 mm high; rhizomatous. Leaf blade to 400 x 3-10 mm; ligule truncate. Inflorescence spike-like, cylindrical. Spikelet 3.6-5.5 mm long; glumes connate near base, keels long hairy; apices divergent; lemma connate in lower 1/3, truncate to obtuse, awn 1.5-5.5 mm long; anthers 2.0-3.0 mm long.
