  claims:
    - subjectId: taxon:cosmoselachus
      claimType: taxonomy
      claimKind: scientific
      statement: Cosmoselachus mehlingi is a new symmoriiform chondrichthyan from the Late Mississippian, represented by the partial holotype AMNH FF 20509 and recovered in the cited analysis as a falcatid within Symmoriiformes.
      confidence: medium
      confidenceRationale: The paper provides a formal diagnosis and named specimen, while the higher placement is a sampled phylogenetic result rather than a universal topology.
      referenceLinks:
        - relation: supports
          referenceId: bronson-2024-cosmoselachus
          pages: 101–106, 113–117
          figure: Figures 1–4, 8
          quoteLocator: Systematic palaeontology; diagnosis; phylogenetic analysis
    - subjectId: taxon:cosmoselachus
      claimType: biogeography
      claimKind: scientific
      statement: Cosmoselachus mehlingi is recorded from the Fayetteville Shale near Cove Creek in Searcy County, Arkansas, United States; this holotype locality does not establish a global distribution.
      confidence: medium
      confidenceRationale: The type locality and formation are directly tied to AMNH FF 20509, but one partial specimen cannot establish geographic absence, endemism or a species-wide distribution.
      referenceLinks:
        - relation: supports
          referenceId: bronson-2024-cosmoselachus
          pages: 101–106
          figure: Figures 1–2
          quoteLocator: Abstract; locality and formation; Material; Systematic palaeontology
    - subjectId: taxon:cosmoselachus
      claimType: ecology
      claimKind: scientific
      statement: Cosmoselachus preserves teeth, branchial arches and partial pectoral fins in a marine Fayetteville Shale setting, but prey, habitat preference, locomotor performance, body size and trophic guild remain unresolved from the partial holotype.
      confidence: medium
      confidenceRationale: The paper supplies anatomical and depositional observations but does not directly observe behaviour or provide a complete body for ecological or performance estimates.
      referenceLinks:
        - relation: supports
          referenceId: bronson-2024-cosmoselachus
          pages: 101–113
          figure: Figures 1–7
          quoteLocator: Material; teeth and jaw description; branchial and pectoral anatomy
    - subjectId: taxon:cosmoselachus
      claimType: morphology
      claimKind: scientific
      statement: Cosmoselachus has small cladodont teeth in widely spaced families, scalloped Meckel cartilages, elongate fused pharyngeal rays forming an operculum and approximately fifteen to eighteen distal fin radials.
      confidence: medium
      confidenceRationale: The diagnosis and CT figures directly support the named dental, jaw, branchial and fin features, while CT resolution and partial preservation limit some anatomical identifications.
      referenceLinks:
        - relation: supports
          referenceId: bronson-2024-cosmoselachus
          pages: 104–113
          figure: Figures 3–7
          quoteLocator: Diagnosis; tooth families; Meckel cartilages; branchial rays; CT reconstruction
    - subjectId: taxon:cosmoselachus
      claimType: fossil-range
      claimKind: scientific
      statement: The displayed 326 Ma point is the Late Mississippian Fayetteville Shale holotype sample for Cosmoselachus mehlingi and is not a global species FAD, LAD, symmoriiform endpoint or complete range.
      confidence: medium
      confidenceRationale: The source fixes the Late Mississippian formation and holotype, but one partial specimen supports only a locality- and sample-scoped time point.
      referenceLinks:
        - relation: supports
          referenceId: bronson-2024-cosmoselachus
          pages: 101–117
          figure: Figures 1–8
          quoteLocator: Abstract; Material; Systematic palaeontology; phylogenetic analysis; Conclusions
  claim-rationales.zh:
    - 论文给出正式诊断和具名标本，但较高阶位置是取样系统分析结果，而非普遍拓扑。
    - 正模 AMNH FF 20509 与类型地点和地层组直接关联，但单个部分标本不能确定缺失、特有性或物种分布。
    - 论文提供解剖和沉积观察，却没有直接行为证据或完整身体来估计生态和性能。
    - 分类诊断和 CT 图件直接支持牙齿、颌部、鳃部与鳍部特征，但 CT 分辨率和部分保存限制了部分解剖鉴定。
    - 来源固定了晚密西西比世地层组和正模，但单个部分标本只能支持地点和样本限定的时间点。
  claim-statements.zh:
    - Cosmoselachus mehlingi 是晚密西西比世的新对称鳍鲨形软骨鱼，由部分正模 AMNH FF 20509 代表；所引分析将其恢复为对称鳍鲨形目中的镰鲨科成员。
    - Cosmoselachus mehlingi 记录于美国阿肯色州 Searcy 县 Cove Creek 附近的 Fayetteville 页岩；该正模地点不能确立全球分布。
    - Cosmoselachus 在海相 Fayetteville 页岩背景中保存牙齿、鳃弓和部分胸鳍，但从部分正模不能确定猎物、栖息地偏好、运动性能、体型和营养功能群。
    - Cosmoselachus 具有分布稀疏齿族中的小型枝齿型牙、具波状边缘的麦氏软骨、形成鳃盖的长而融合的咽弓辐条，以及约 15 至 18 根远端鳍辐条。
    - 显示的 326 Ma 点是 Cosmoselachus mehlingi 晚密西西比世 Fayetteville 页岩正模样本，不是该物种的全球首现、末现、对称鳍鲨形类端点或完整延限。
