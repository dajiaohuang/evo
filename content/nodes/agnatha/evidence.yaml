      claimType: fossil-range
      statement: The atlas begins the historical Agnatha navigation grade at a rounded 520 Ma to include the Chengjiang Myllokunmingia and Haikouichthys specimens described as agnathan-grade vertebrates; 0 Ma reflects living cyclostomes in the display group, not a monophyletic crown range, global first appearance or direct ancestry.
      confidence: medium
      confidenceRationale: The primary study names and figures both Cambrian specimens and tests their placement, but soft-tissue interpretation and basal-vertebrate topology remain debated, while Agnatha is explicitly a historical grade. Medium confidence applies only to this bounded navigation envelope.
      referenceLinks:
        - referenceId: shu-1999-cambrian-vertebrates
          relation: supports
          pages: 42–46
          figure: Figures 1–5
          quoteLocator: Systematic descriptions of Myllokunmingia and Haikouichthys; phylogenetic analysis
  claim-rationales.zh:
    - 一手研究命名、图示并分析两件寒武纪标本，但软组织判读和基干脊椎动物拓扑仍有争议，且 Agnatha 在本体中明确是历史等级；中等置信度只适用于这一有界导航范围。
  claim-statements.zh:
    - 图谱把历史性的无颌类导航等级从约 5.20 亿年前开始，以纳入澄江生物群中被描述为无颌脊椎动物等级的 Myllokunmingia 与 Haikouichthys 标本；0 Ma 只表示该显示组包含现生圆口类，不代表单系冠群范围、全球首现或直系祖先。
