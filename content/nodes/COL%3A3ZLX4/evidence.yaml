        usage:
          title: Melochia lupulina Sw., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Herb, undershrub or shrub, erect or sometimes procumbent, 0.60-2 m. high, the young stems and branches villous, the hairs simple or stellate. Leaves rather long-petiolate, the petiole slender, slightly canaliculate above, up to 5 cm. long, more or less densely villous, the stipules filiform, up to 4 mm. long; blade ovate, cordate at the base, acuminate at the apex, up to 10 cm. long and 7 cm. wide, chartaceous, the margins serrate-crenate, loosely to densely softly velutinous, the indumentum always denser on the lower surface, usually 5(-7)-nerved at the base, the nervation slightly prominent beneath. Inflorescences axillary, of solitary or mostly fascicled, umbelliform cymes, the cymes shortly pedunculate, the pedun- cles densely stellate-puberulous. Flowers 4-4.7 mm. long, heterostyled, shortly pedicellate, the pedicel 2.2-3 mm. long and densely stellate-puberulous, the bracts linear-subulate, 1.5-2.5 mm. long, stellate-puberulous and ciliolate; calyx globose-campanulate, ca. 4-4.5 mm. long and 4 mm. wide, the lobes triangular, acute or acuminate, ca. 1.8-3 mm. long and 1.5-2 mm. wide at the base, stellate- puberulous outside, glabrous inside, mucb-accrescent; petals obovate, shortly unguiculate and slightly adnate to the base of the staminal tube, rounded at the apex, ca. 4-4.7 mm. long and 1.7-2 mm. wide, white; long-styled flowers with a staminal tube ca. 2-2.5 mm. long and glabrous, the anthers sessile or nearly so and ca. 0.8-1. mm. long, the ovary shortly stipitate, ellipsoid to oblong, ca. 1-1.5 mm. long and 0.8-0.9 mm. in diam., shortly and densely sericeous, the styles free, ca. 2.5-2.8 mm. long, stellate-hirtellous near the base, the stigmas papillate; short- styled flowers with a staminal tube ca. 1.6-1-7 mm. long and glabrous, the filaments ca. 2-2.2 mm. long, the anthers ca. 0.8-0.0 mm. long, the ovary very shortly stipitate, ellipsoid, ca. 1-1.2 mm. long and 0.7-0.8 mm. in diam., shortly and densely sericeous, the styles free, ca. 1.7-1.9 mm. long, the stigmas papillate. Capsule surrounded by the accrescent calyx, depressed-globose, ca. 2.2-2.3 mm. long and 2.7-3 mm. in diam., shortly stellate-puberulous, each coccus ca. 1.3 mm. thick, opening along the inner angle; seed ca. 1.4-1.7 mm. long and 1.1 mm. thick.
          originalLanguage: en
