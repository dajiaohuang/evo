        usage:
          title: Adenocalymma arthropetiolatum A.H.Gentry, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: on the surface, with q. few scattered plate-shaped glands; tendril simple, to 14 cm long; petiolules 0.5-4.1 cm long, the petiole 1.1-6.4 cm long, puberulous, woody proximally and conspicuously jointed with the petiolules. Inflorescence an axillary or terminal raceme, a subtending glandular, deciduous bract enclosing each bud, the rachis and pedicels puberulous. Flowers with a faint musky odor, the calyx cupular, 5-toothed but more or less bilabiate, 5-15 cm long and 4-10 mm wide, puberulous with simple and thick-stellate trichomes, usually with conspicuous submarginal sunken cupular glands; corolla uniformly bright yellow, often a slightly deeper shade within, campanulate, 4.2-8.2 cm long and 1.1-2.1 cm wide at the mouth, the base cylindrical, 2.3-2.6 cm long and 0.6-0.7 cm wide, the tube 2.5-5.6 cm long, the lobes often folded or rolled, the upper shorter two lobes 1.2-1.7 cm long, extending horizontally in front of the tube, the longer three lobes 1.8-2.3 cm long, variously reflexed, outside and inside the lobes puberulent with simple and thick-stellate trichomes, the tube glabrous inside except for slender 2-3-celled gland-tipped trichomes at and just below the level of stamen insertion, the base of the lobes with plate-shaped glands outside; stamens slightly exserted, the anthers held underneath the hood formed by 2 projecting upper corolla lobes, the anther thecae more or less divergent, 5-6 mm long, the filaments more or less equal, the anterior pair 3.5-3.9 cm long, the posterior pair 3.3-4.0 cm long, the staminode 12-21 mm long, inserted 2.1-2.6 mm from base of corolla tube, pistil 5.0-5.9 cm long, the ovary narrowly cylindrical, 4-5 mm long and 1.5-2.0 mm wide, puberulent, the ovules 2-seriate; disc pulvinar-cupulate, 1.5-2.5 mm long, 4-6 mm wide. Capsule unknown.
          originalLanguage: en
