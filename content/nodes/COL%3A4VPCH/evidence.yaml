    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Erect or scandent shrub to 3(-4.5) m tall; young branches sparsely puberulous to pubescent. Leaves slightly anisophyllous, puberulous to pubescent or sparsely so along veins; petiole 1-5(-10) mm long; lamina ovate to elliptic, largest 3-7.5 x 1.3-3.5 cm; apex rounded and apiculate or retuse or drawn out into a short obtuse tip; reticulation distinctly raised on both sides. Raceme 2-14-flowered; peduncle 0-8 mm long, puberulous to pubescent; rachis up to 4 cm long. Bracts and bracteoles yellowish brown to dark brown or greenish, broadly ovate to oblong, abruptly apiculate (mucro 2-3 mm long, often recurved) with distinct shoulders, uniformly sericeous-puberulous, with broad scarious ciliate margin which often becomes frayed with age; bracts 5-8 mm long; pedicels 0-2 mm long; bracteoles 6-9 mm long. Sepals coloured as bracts (straw-coloured at base), puberulous or densely so, glandular ciliate, margin scarious, often frayed with age; dorsal 10-12 mm long, ovate, acute or apiculate; ventral and lateral ovate to oblong, abruptly apiculate with distinct shoulders, ventral 9-11 mm long, lateral 8-9 mm long. Corolla limb blue to purple; tube white, 7-10 mm long, band of hairs just below insertion of stamens; limb 15-22 mm long, deflexed, densely silvery sericeous below; lobes 5-8(-10) mm long. Filaments 8-10 mm long, glabrous; anthers 3.5-5 mm long, all bearded near middle or two ventral glabrous, two dorsal sparsely hairy on outer lateral side, without basal tufts. Capsule 14-18 mm long; seed c. 5 mm long, with indistinct or large pectinate scales.
