    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, 18-30 cm, tunics woody, concentric, stem shorter than leaves. Leaves linear, H-shaped in section, viscid on margins. Flowers creamy beige, fading pink, darker on veins, tube elongate, stamens and style unilateral.
            textZh: Geissorhiza exscapa (Thunb.) Goldblatt 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 6776; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Recognised by the leaves with winged margins held at right angles to the blade but the main vein hardly raised, the leaf thus H-shaped in cross section, and by the large, cream-coloured to pink flowers with perianth tube 40-80 mm long, usually well exserted from the bracts, and narrowly obovate tepals, 26-35 x 4.5-6.0 mm. The stems are sometimes short and entirely sheathed by leaf bases. Geissorhiza tenella has a similar leaf morphology but usually smaller flowers with a perianth tube 20-40(-50) mm long and slightly shorter, narrower tepals 13-23 x 2.0-4.5 mm. Plants from the Bokkeveld Mtns stand out in having bracts rather shorter than elsewhere, 30-35 mm long and matching those of Geissorhiza confusa but the leaves in these populations are quite typical of G. exscapa. Populations from the Pakhuis Mtns and some from the Piketberg have the perianth tube shortly exserted from the bracts, giving the specimens an unusual appearance. Again, the leaves are typical of the species and there seems no reason to treat them as separate taxa. In the absence of leaves, however, these plants can barely be distinguished from G. confusa, in which the tube may occasionally be up to 50 mm long.
            textZh: SANBI 条目提供了 Geissorhiza exscapa (Thunb.) Goldblatt 的鉴别特征。
