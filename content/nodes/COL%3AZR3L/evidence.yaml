        usage:
          title: Croton schiedeanus Schltdl., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Tree ca 5-15 m high, trunk ca 1-2.5 dm thick; monoecious; indumentum lepidote. Leaves chartaceous; petioles lepidote, eglandular, ca 0.5-4 cm long; stipules densely lepidote, linear, capitate, (1-) 2-4 mm long, caducous and thus often appearing to be absent; blades elliptic to oblong, ca 7-22 cm long, 3-9 cm broad, glabrate above, lepidote beneath with scattered scales ca 0.1-0.2 mm across (the blade appearing greenish beneath, not silvery), the venation distinctly pin- nate, the major lateral veins (ca 8-12 on a side) straightish, the base obtuse to rounded, the margins entire, the apex + abruptly contracted to a ? obtuse acumen. Inflorescences axillary, racemiform, ca 2-10 cm long, bisexual or male, often fascicled in the axils; female flowers 1 or 2 at the base; male flowers many, distal; bracts subtending solitary flowers, inconspicuous, eglandular, less than 1 mm long. Stami- nate flowers with lepidote pedicels becoming ca 2.5-3.5 mm long; calyx-lobes 5, valvate, densely lepidote, shorter than the petals; receptacle villose; petals ca 1.3- 2.1 mm long, glandular-punctate, densely villose-ciliate on the margins, glabrous on the back or with 1(-2) scales; stamens (9-) 10 or 11, the filaments glabrous, ca 1.5-2.5 mm long, the anthers elliptic, 0.6-0.8 mm long. Pistillate flowers with stiff straight lepidote pedicels becoming 10-25 mm long; calyx-lobes 5, equal, tri- angular or ovate, shorter than the petals; disc annular, more or less adnate to the calyx; petals ca 1.8-2.1 mm long, similar to the male; ovary densely lepidote, scales delicately denticulate, ca 0.3-0.4 mm in diam, the styles usually 3 times bifid, ca 3-3.5 mm long, the branches slender, glabrous, spreading. Capsules not seen entire; cocci lepidote, verrucose, ca 8.5-12 mm long, the columella slender, 6.5-8.2 mm long; seeds compressed, brownish, smooth, obtusely beaked, 6.2-7(-9.5) mm long, 4.4-5 (-5.4) mm broad.
          originalLanguage: en
