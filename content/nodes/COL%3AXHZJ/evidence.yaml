        usage:
          title: Compsoneura sprucei (A.DC.) Warb., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Glabrate shrubs or trees to 13 m., the sap reddish. Leaves chartaceous or sub- coriaceous, glabrous, oblong to obovate, apically acute to acuminate, basally atten- uate to rounded, 9-30 cm. long, 3.5-10.0 cm. broad; secondary veins (4-)6-10 (-12) on either side; tertiary veins parallel, conspicuously perpendicular to the midrib; petioles 7-30 mm. long, 1-3 mm. broad. Staminate fascicles 3- to 15-flowered, in subspicate racemes (in Panama), the racemes 1-5 per axil, 2-8 cm. long; pedi- cels 0.5-2.0 mm. long, perianth tardily 3(-4) parted, 1.5-3.0 mm. long, anthers 4-8, 1.0-1.5 mm. long, free or somewhat connate basally, the infra-antheral portion of the column less than 0.5 mm. long. Pistillate fascicles 2-8 cm. long, 1- to 8- flowered; pedicels 2-4 mm. long; perianth accrescent, tardily 3(-4) parted; ovary subglobose, with a subsessile 2-lobed stigma. Fruit somewhat fleshy, ellipsoid, the perianth splitting longitudinally into 2 valves, 20-37 mm. long, 13-21 mm. broad, the reddish aril entire except at the tip.
