    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Weak tufted perennial to 800(1200) mm high; erect or geniculate; culm without glands below nodes, internodes glabrous to hairy. Leaf blade 100-200 x 3-4 mm; blade and sheath often densely covered with long bulbous-based hairs. Inflorescence consisting of 2-8 dense, usually globose, ovoid to elliptic spikelet clusters, distant on main axis except near apex and at the base; lowest branches not whorled; pedicel short, hairy. Spikelet 3-10 x 1.2-2.0 mm, elliptic to narrowly oblong; breaking up from base upwards, rachilla fragile, breaking off above glumes soon after lemmas begin to fall; glumes subequal, lanceolate in side view; lowest lemma 1.5-2.0 mm long, acuminate, awn present (up to 0.5 mm long) or absent, lateral nerves distinct; palea persistent, keels slender, wingless, scaberulous to scabrid; anthers 3, 0.3-0.4 mm long; caryopsis elliptic.
