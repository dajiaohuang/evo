      ecology:
        status: partially-supported
        claims:
          - text: In the reported audience-manipulation experiments, fewer dance followers led dancers to perform fewer waggle circuits and encode direction and distance less precisely. This is a controlled social-behavior result from managed colonies, not a species-wide estimate or evidence about wild-colony behavior.
            sourceIds:
              - lin2026
            locator: "Experiment 1: Audience Effects on the Honey Bee Waggle Dance; Discussion."
            placeTimeScope: Managed observation colonies at the CAS Southwest Center for Biological Diversity apiary in Kunming, China; trials ran April through September 2023. Experiment 1 used 15 trials with manipulated dance-floor audience sizes.
            lifeStatus: Live workers and foragers from managed colonies; no wild colony was sampled.
            originalLanguage: en
        gaps:
          - One managed-apiary experiment does not establish behavior across wild colonies, subspecies, genotypes, or geographic populations; diet, habitat selection, and broader ecological interactions were not reviewed.
