    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Stemless, cormous geophyte, up to 50 mm tall. Leaves several, in a basal tuft, rigid, linear, channelled. Flowers enclosed in green, truncate spathes, deep yellow, outer tepals with black speckles in the centre, tepals united in a long perianth tube, unequal, the outer larger, both inner and outer tepals with lightly reflexed limbs, crests prominent, ovary concealed in the spathes.
            textZh: Moraea longiflora Ker Gawl. 的 SANBI 物种条目记载了植株、叶片和花部形态。
            sourceIds:
              - sanbi_14562_0
            locator: Strelitzia 30; archive Morphology row 33323, source 14562.0
            placeTimeScope: Regional species account published 2013; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
          - text: Distinctive in its acaulescent habit and yellow, long-tubed flowers. The combination of a flower with long perianth tube and underground stem is unique in subg. Umbellatae but the brown corm tunics, yellow flowers with brown-veined tepals, and outer rhipidial spathes free and diverging distally, are consistent with this placement. The species bears more than a passing resemblance to M. cooperi, also with a perianth tube but with a well-developed aerial stem.
            textZh: SANBI 条目提供了 Moraea longiflora Ker Gawl. 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: Strelitzia 42; archive Diagnostic row 95254, source 18638.0
            placeTimeScope: Regional species account published 2020; the archive excerpt does not give a dated sampling frame or population frequency.
