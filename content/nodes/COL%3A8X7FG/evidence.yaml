        claims:
          - text: Perennial herb, up to 2 m high; stem subterranean. Leaves oblong-lanceolate, ± 220 x 76 mm, deltoid at base, margins brown; petioles slender. Spathe 150 mm long, green with red edges. Sepals bright orange, lanceolate, ± 100 mm long. Petals blue; lower 50 mm long, with rounded basal auricles; upper broadly ovate, ± 10 mm long, mucronate. Ovary with style branches exserted. Flowering time July-Nov.
