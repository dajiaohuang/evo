        claims:
          - text: Slender, terrestrial herb, up to 320 mm tall. Spur 60-70 mm long, swollen towards apex. Lip with side lobes filiform, ± 20 mm long, midlobe very narrowly linear, almost filiform. Flowers green and white.
            textZh: Bonatea pulchella Summerh. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_11118_0
            locator: "SANBI/WFO archive Morphology row 537; source identifier 11118.0; cited publication: Herman, PPJ; Retief, E. 1997. Plants of the northern provinces of South Africa: Keys and diagnostic characters. Strelitzia 6: 1 - 681. National Botanical Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: B. pulchella is closely allied to B. polypodantha but has fewer, larger flowers in which the petal and lip lobes, spur and stigmatic arms are relatively longer. B. pulchella is mainly found in dune forest and riverine scrub in deep shade, and while B. polypodantha has a similar preference for shady riverine scrub, it is also found in grassland and thorn scrub habitats. The taxa sometimes occur sympatrically in Mpumalanga and Limpopo provinces. They flower at different times, with B. polypodantha flowering from January to April and B. pulchella from April to July.
            textZh: SANBI 条目提供了 Bonatea pulchella Summerh. 的鉴别特征。
            sourceIds:
              - sanbi_6866_0
            locator: "SANBI/WFO archive Diagnostic row 76902; source identifier 6866.0; cited publication: Ponsie, ME; Edwards, TJ; Johnson, SD. 2007. A taxonomic revision of Bonatea Willd. (Orchidaceae: Orchidoideae: Habenariinae). S. African J. Bot. 73: 1 - 21. [Copyright held by the South African Association of Botanists (2007); http://www.sciencedirect.com/science/journal/02546299]. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
