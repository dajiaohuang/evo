        claims:
          - text: Hairy, tufted, cushion-like annual to 5 cm. Leaves elliptic, slightly toothed. Flowers in heads rapidly elongating into racemes, tube very short, white possibly with yellow patch at base of upper lobes.
            sourceIds:
