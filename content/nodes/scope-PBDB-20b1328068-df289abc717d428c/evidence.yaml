  claim-rationales.zh:
    - 早期爪蝠的分类表述只覆盖具名标本及所引主研究的分析范围；导航归属不表示直系祖先或普适系统树。
    - 早期爪蝠的地理字段只投影主研究记录的具体产地，不外推为全球分布、起源中心或完整扩散路径。
    - 早期爪蝠的生态字段区分保存事实与功能推断；未被标本直接记录的饮食、行为、栖息地或性能均明确保留不确定性。
    - 早期爪蝠的形态字段限定于主研究列明的具名标本和精确页码、图版或补充材料，不外推到整个支系。
    - 早期爪蝠的年代范围是主研究标本或地层背景的有界投影，不作为全球首现、末现、分化时间或连续谱系时长。
  claim-statements.zh:
    - ROM 55351A 确立了 Onychonycteris finneyi，并在来源矩阵中被置于蝙蝠干群附近；这不是直接祖先主张。
    - 本资料代表怀俄明 Fossil Butte 段的产出，并不能界定蝙蝠的完整分布或起源中心。
    - 翼部解剖支持动力飞行，耳蜗大小用于检验特化回声定位；但食性、叫声、飞行表现和行为均未被观察。
    - ROM 55351A 保存了加长的翼、所有手指上的爪，以及相较所取样回声定位蝙蝠较小的耳蜗。
    - 5,250 万至 5,030 万年前的区间是有边界的绿河组背景，并非全球蝙蝠首次出现、该属末次出现或飞行—回声定位过渡持续时间。
