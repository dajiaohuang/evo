      ecology:
        status: partially-supported
        claims:
          - text: In a rain-fed multi-location field trial on smallholder fields across four districts in South Ethiopia during the 2022/23 main cropping season, 11 bread-wheat genotypes were tested. G11 had the highest reported mean grain yield (2.83 t/ha), but its yield was not statistically distinguishable from G8, G9, and G10. This result applies to those trial entries, sites, and season; it is not a global yield estimate or a species-wide ranking.
            textZh: 在 2022/23 年主要种植季于南埃塞俄比亚四个地区的小农田开展的一项雨养多地点田间试验中，研究测试了 11 个面包小麦基因型。G11 报告的平均籽粒产量最高（2.83 吨/公顷），但在籽粒产量比较中与 G8、G9 和 G10 无统计学显著差异。该结果仅适用于这些试验材料、地点和季节；它不是全球产量估计，也不构成物种层面的排名。
            originalLanguage: en
            sourceIds:
              - alemayehu2025wheat
            locator: Results §3.2, Table 7, mean grain yield across the four locations; Methods §§2.1–2.2 describe the 2022/23 rain-fed trial and 11 genotypes.
            placeTimeScope: Humbo, Sodo Zuria, Boloso Sore, and Damot Gale districts, South Ethiopia; rain-fed main cropping season 2022/23.
            lifeStatus: Cultivated bread-wheat genotypes grown in rain-fed field plots on smallholder farms; the trial did not study wild populations.
        gaps:
          - One season, four districts, and 11 trial genotypes do not establish yield across the species' global range, all cultivars, years, or production systems.
