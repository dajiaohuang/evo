          originalSourceText: Vine, the stem without phloem arms in cross section; branchlets terete, rough-barked, lenticellate, without interpetiolar ridges or glandular fields. Leaves opposite or ternate, simple, elliptic,'rounded at both ends, 30-45 cm long and 11-20 cm wide, extremely coriaceous, bullate, secondary veins 6-7 on a side, the main veins impressed above, conspicuously raised beneath, densely minute lepidote above and beneath, otherwise glabrous, with plate-shaped glands near base of the midvein beneath, drying olive, the petiole 2.4-3 cm long, lepidote, rough-barked. Inflorescence to 20-flowered, a contracted raceme 2-2.5 cm long subtended by a fascicle of subulate basal bracts, borne on older stems, the rachis and pedicels more or less lepidote and puberulous, each pedicel subtended by a light-drying subulate bract, 2-5 mm long, the pedicels 1.2-2.2 cm long. Flowers with the calyx cupular, truncate, 9-14 mm long and
