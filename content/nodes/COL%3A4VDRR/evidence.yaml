          originalSourceText: 9.0-13 mm wide, drying dark brown, glabrous with scattered plate-shaped glands; corolla white, tubular-campanulate, 5.4-6.2 cm long and 1.4-1.8 cm wide at the mouth, the tube 4.3-4.8 cm long, the lobes 0.8-1.1 cm long, minutely lepidote outside near the base, otherwise glabrous, inside the lobes glabrous apically, becoming pubescent near the base with glandular lepidote trichomes merging into the glandular-puberulous trichomes of the upper third of the tube, lower part of the tube glabrous except for simple, multicellular, gland-tipped trichomes at the level of stamen insertion; stamens didynamous, the anther thecae divergent, 3 mm long and 1.5-2.0 mm wide, the longer fila- ments 2.6-2.7 cm long, shorter filaments 2.0-2.1 cm long, the staminode 5 mm long, inserted 18-19 mm from the base of the tube; pistil 0.9 cm long, the ovary globose, 6 mm long and 6-7 mm wide, inconspicuously puberulous, the ovules multiseriate on 2 stalked parietal placentae in the upper 1 mm of ovary, these fused below so placentation is mostly axile with a single parietal placenta in each locule. Fruit unknown.
