    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Acaulescent, succulent geophyte, ± 75 mm tall. Bulb tunics acute at apex, rough, brown. Leaves basal, leaflets 3, broadly cuneate-obcordate, rough above, dark red with prominent veins beneath, margin thickened. Flowers 1 per peduncle with alternate bracts, large, pink to white, with a pale yellow to pinkish yellow tube. May-Sept., after rain.
            sourceIds:
              - sanbi_14917_0
            locator: "SANBI/WFO archive Morphology row 34935; source 14917.0; publication: Snijman, DA; Dreyer, LL; Oberlander, KC. 2013. Oxalidaceae. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 428 - 437. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Oxalis psammophila is very difficult to place due to multiple overlapping characters. However it seems to bear a number of characters in common with O. strigosa Salter. It is thus tentatively placed in Section Oppositae, Subsection Subintegrae. Oxalis psammophila differs from O. strigosa in that it does not possess large robust bulbs and display densely-hirsute strigose leaflets. The andraecium tends to have low tuberculae rather than densely hairy-pilose filaments, ovary and styles. The habitat is also completely different in that O. psammophila occurs under extremely arid sand conditions in the N.W. Cape whereas O. strigosa is a plant of wet montane places within the mountains of the S.W. Cape.
            textZh: SANBI 条目提供了该种的鉴别特征。
            sourceIds:
