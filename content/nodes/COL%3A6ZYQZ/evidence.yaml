    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Bulbous geophyte to 40 cm. Leaves dry at flowering, 2, spreading to prostrate, usually pubescent. Flowers (2-)6-14, star-shaped, pale lemon, rarely cream-coloured, tepals crisped, with a translucent swelling at the base.
            textZh: Strumaria gemmata Ker Gawl. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13845_0
            locator: "SANBI/WFO archive Morphology row 8817; source identifier 13845.0; cited publication: Snijman, DA. 2012. Amaryllidaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 53 - 62. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Strumaria gemmata is the only species in the genus with pale lemon flowers and distinctly crisped tepals. A novelty found nowhere else in the subtribe is the development of a solid, shining, translucent gibbosity which appears to mimic nectar, on the adaxial surface of each tepal beneath the filament attachment. The leaves are indistinguishable from those of other pubescent-leaved species of section Gemmaria but the covering is more variable. Collections from the extreme west often only have scabrid leaf margins, whereas elsewhere in its distribution range the leaves are more or less hairy.
            textZh: SANBI 条目提供了 Strumaria gemmata Ker Gawl. 的鉴别特征。
            sourceIds:
              - sanbi_4232_0
            locator: "SANBI/WFO archive Diagnostic row 44950; source identifier 4232.0; cited publication: Snijman, DA. 1994. Systematics of Hessea, Strumaria and Carpolyza (Amaryllideae:Amaryllidaceae). Contr. Bolus Herb. 16: 2 - 158. [All rights reserved]"
