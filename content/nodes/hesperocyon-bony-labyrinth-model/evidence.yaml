      claimKind: scientific
      claimType: event-mechanism
      statement: A 36-specimen μCT and morphometric dataset includes a Hesperocyon gregarius bony labyrinth and assigns it to a pounce category, but the assignment is a comparative proxy with 82.05% overall classification accuracy rather than observed behaviour.
      confidence: medium
      confidenceRationale: Hesperocyon bony-labyrinth hunting model uses explicit named specimens or disclosed datasets, but placement, function or ecology depends on a sampled matrix or comparative model and is kept separate from observation.
