            locator: "SANBI/WFO archive Morphology row 67343; source 9351.0; publication: Verdoorn, IC. 1981. Revision of Melhania in southern Africa. Bothalia 13(3 & 4): 263 - 273. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: This is the first known record of a species of Melhania with polygamous flowers. The essentially male flowers are more showy with longer petals, large stamens and an aborted style. The female flowers have short petals, small stamens and a style with long, stout branches. The broad ovate-trullate leaves, that is, leaves, which are usually broadest about a third of length above the base, are a distinguishing feature.
