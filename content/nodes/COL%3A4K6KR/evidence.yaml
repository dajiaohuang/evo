    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Perennial, caespitose, dwarf shrublet, up to 0.05 m high. Leaves highly succulent, semiglobose, appressed, flat above, rounded below, surface speckled. Flowers solitary, yellow to orange with paler centre. Flowering time May-July. Capsules dark brown, woody, 10-locular, closing bodies large, brown, covering membranes complete, valve wings broad, tapering to apex.
