          - text: Dem Pl, Bolusii im Habitus sehr ähnlichi, aber durch die fast eine Kugel bildenden, am Kinn glatten (nicht runzligen und grubig vertieften) Blätter verschieden. Die Kapsel besitzt viel dickere, bedeutend höher gekielte Klappen als Pl. Bolusii und Pl. simulans; Quelleisten am Ende nicht zerschlitzt wie bei diesen Arten, Beim Öffnen der Kapsel legen sich die Klappen wohl wegen ihrer viel bedeutenderen Dicke nicht alsobald zurück wie bei den anderen beiden Arten.
            textZh: SANBI 条目提供了该种的鉴别特征。
