            locator: "SANBI/WFO archive Morphology row 32948; source identifier 14541.0; cited publication: Snijman, DA. 2013. Asphodelaceae: Trachyandra. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 55 - 57. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Trachyandra sanguinorhiza is similar to T. thyrsoidea in its membranous bracts and upcurved styles, but the roots differ in that they are bulbous and have red inner tissues. In T. thyrsoidea the roots are white, finger-like and swollen towards the ends.
