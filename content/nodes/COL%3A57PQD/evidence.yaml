    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Rhizomatous perennial, 100-350 mm tall, roots few, bulbous, fused with short rhizome, staining purple when pressed. Leaves 4-20, filiform, rough, curled towards tips. Flowers pinkish white, spotted at base, in a panicle with several, suberect branches. Capsules globose, ± 3 mm diam.
            textZh: Trachyandra sanguinorhiza Boatwr. & J.C.Manning 的 SANBI 物种条目记录了形态特征。
            sourceIds:
