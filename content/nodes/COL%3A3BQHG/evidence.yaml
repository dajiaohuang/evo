    facets:
      morphology:
        status: partially-supported
        claims:
          - text: "Evergreen tree, 15-26 m high, with a moderately spreading crown. Bark persistent, entirely covering main trunk, dark grey to black, hard, corky, non-fibrous, deeply furrowed. Leaves opposite; drooping; blade narrowly ovate to broadly ovate, 60-110 mm long, apex acute, margins entire, greyish green, usually falcate. Flowers: in simple umbels; buds pendulous with conical or beaked lids, up to 12 mm long; stamens exserted; perianth cream-coloured, pink or deep rose-red; May-Oct. Fruit a round to oval capsule, valves deeply included, 8-10 mm long; often covered by a sub-persistent staminal ring."
            sourceIds:
