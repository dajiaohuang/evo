            lifeStatus: Regional flora account; native, naturalised, and cultivated status are not inferred beyond explicit statements in the cited passage.
          - text: This species is very similar to R. zwartbergensis, with which it is sympatric. The most striking difference is in the tufted habit of the plants. It is possible that the several florets in the male spikelet will also appear as a significant character, but more collections are required of both species to show that these characters are correlated.
