    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Succulent herb, up to 0.6 mm high, excluding inflorescence. Stems procumbent. Bracts 3-5-nerved. Inflorescence shorter than 1 m. Racemes secund, bicoloured, lax to sublax. Flowers deep dull red in bud, sulphur-yellow to ivory at anthesis.
            textZh: Aloe globuligemma Pole-Evans 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_11118_0
            locator: "SANBI/WFO archive Morphology row 165; source identifier 11118.0; cited publication: Herman, PPJ; Retief, E. 1997. Plants of the northern provinces of South Africa: Keys and diagnostic characters. Strelitzia 6: 1 - 681. National Botanical Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Aloe globuligemma is similar to A. guerrae and A. procera (both indigenous to Angola), A. ortholopha (indigenous to Zimbabwe) and A. mawii (indigenous to Malawi and Mozam-bique). In A. guerrae the flowers are somewhat laxer than in A. globuligemma, the inflores-cences are much taller and plants are solitary, not forming great masses. In A. procera the inflorescences are laxer and taller than in A. globuligemma, and the flowers do not change colour as they age. Plants of A. ortholopha are solitary, with very dense, unicoloured racemes in inflorescences which are only once or twice branched, and flowers on much longer pedicels than those of A. globuligemma. A. mawii is shortly (1-2 m) caulescent and has simple, very dense racemes in which the bracts are very small and obscurely veined. In A. globuligemma, unlike all the other members of this section, the flowers are clavate.
            textZh: SANBI 条目提供了 Aloe globuligemma Pole-Evans 的鉴别特征。
            sourceIds:
              - sanbi_5961_0
            locator: "SANBI/WFO archive Diagnostic row 51290; source identifier 5961.0; cited publication: Glen, HF; Hardy, DS. 2000. Aloe. In: G Germishuizen & E du Plessis (eds), Aloaceae (first part), Fl. S. Africa 5(1,1): 1 - 167. National Botanical Institute, Pretoria. [http://www.biodiversitylibrary.org/item/209564#page/3/mode/1up]. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: A. globuligemma ('globular buds') is a very distinctive and charming species. It occurs mostly in bushveld country, either in smaller groups under trees, or in larger dense patches in open country. Near Steelpoort, for example, very considerable quantities are found in colonies many yards across. Plants are stemless or almost so, but sometimes develop a slender procumbent stem up to 3 ft. long with numerous offshoots and suckers, and soon forms dense groups. The most striking feature of A. globuligemma is the much-branched inflorescence with racemes produced almost horizontally. The buds and flowers are secund, i.e. grouped along the top of the axis and all pointing backwards towards the base of the branch.
            textZh: SANBI 条目提供了 Aloe globuligemma Pole-Evans 的鉴别特征。
            sourceIds:
              - sanbi_13236_0
            locator: "SANBI/WFO archive Diagnostic row 78129; source identifier 13236.0; cited publication: Reynolds, GW. 1974. Aloes of South Africa, 3rd ed. A.A. Balkema, Cape Town. [All rights reserved]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: In the early stages of development the racemes are conspicuously furnished with widely separated spherical to globular flower-buds which develop with considerable slowness. The unopened flowers are a rich nopal red (R.C.S.) tinged with green at the tips; as soon as they open the flowers become a sulphur-yellow (R.C.S.). I think this Aloe must be referred to Berger's Pleurostachyae, and it would appear to show some relationships with A. secundiflora, Engl.
            textZh: SANBI 条目提供了 Aloe globuligemma Pole-Evans 的鉴别特征。
