        claims:
          - text: Rigid, much-branched, scabridulous shrub to 1 m. Leaves oblong-lanceolate, keeled, roughly ciliate on margins. Flower heads discoid, solitary at branch tips, cream-coloured or yellow, 25-35 x 8-12 mm; bracts brown with broad membranous, fringed margins.
            sourceIds:
