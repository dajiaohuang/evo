            locator: "SANBI/WFO archive Morphology row 10962; source 14208.0; publication: Manning, JC; Goldblatt, P. 2012. Asteraceae: Pteronia L. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 412 - 414. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: A very handsome species, of which I only know about a score of bushes in the one locality. The long brown and white involucres are characteristic. The paleae are unusual in the genus and so is the white colour of the florets, but the affinity with Pteronia is clear. The nearest relationship is with P. elongata Thbg. vand P. staehelinoides DC. I dedicate it to Mr. J. Hutchinson of the Kew Herbarium, the monographer (with Dr. Phillips) of the genus Pteronia, who gave me valuable assistance in my work.
