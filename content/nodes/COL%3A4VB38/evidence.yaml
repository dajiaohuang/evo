          - text: "Perennial, geophytic herb, 150-750 mm high; stems erect. Leaves with blade filiform, 1-20 mm wide, glabrous. Flowers: pedicels > 20 mm long; corolla lobes flat, spreading, with recurved margins or replicate, 2-4 mm long, glabrous outside, minutely puberulous inside, greenish; corona with needle-like projection extended over style head, lobes 15 mm long, thick and fleshy. Flowering time Oct.-Mar., June, Aug. Fruit a follicle, without bristles."
