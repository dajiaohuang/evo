    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous herb, up to 200 mm tall. Inner tepals reduced to tiny trifid or linear cusps, 3-6 mm long. Outer tepals 20-27 mm long, claw nearly erect. Flowers white to pale blue-mauve, inner tepals and style crests usually dark purple, nectar guides yellow.
            textZh: Moraea modesta Killick 的 SANBI 物种条目记载了植株、叶片和花部形态。
            sourceIds:
              - sanbi_11118_0
            locator: Strelitzia 6; archive Morphology row 2791, source 11118.0
            placeTimeScope: Regional species account published 1997; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
          - text: Readily recognised by its small, predominantly white flowers with outer tepals up to 27 mm long, and dark purple style branches and crests, Moraea modesta is a low-growing species, seldom reaching more than 200 mm in height. The vestigial inner tepals are 5-6 mm long, either hair-like cusps or obscurely 3-lobed at the apex. It is one of several species that flower after the foliage leaf, produced the previous summer, is dry and dead. The leaf is sometimes retained at flowering, still attached to the base of the flowering stem but more often has decayed and is no longer evident. A new, emergent leaf is sometimes present at flowering, extending well above the stem later in the growing season. Populations from near Machadodorp in central Mpumalanga have more-or-less free filaments, unusual for the species, and require additional study. In other populations the filaments are united for at least half their length.
            textZh: SANBI 条目提供了 Moraea modesta Killick 的鉴别特征。
            sourceIds:
