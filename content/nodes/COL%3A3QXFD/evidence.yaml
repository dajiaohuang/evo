    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Woody shrub, 0.36-1.50 m high. Branches often spinescent. Bark yellow-green becoming grey and cracked. Leaves with short, sparse to moderately dense pubescence, broadly obovate to ovate, apex obtuse, base cuneate or sometimes truncate, leathery, often 3-veined from the base, side veins usually visible; petiole broad, 1-3 mm long. Inflorescence of scattered cymes reduced to 1 or 2 shortly pedunculate axillary flowers. Bract and bracteoles reduced, lanceolate to triangular, 2.0-3.5 mm long. Corolla with a long cylindrical tube, 20-33 mm long, cream, may be brownish in throat, tube and back of lobes. Pollen 2-colporate, 53-68 µm long, sexine with entire margocolpus. Capsule with 1(-4)seeds, glabrous, clavate, up to 17 mm long.
            sourceIds:
