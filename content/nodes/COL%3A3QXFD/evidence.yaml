            locator: "SANBI/WFO archive Morphology row 49807; source 1111.0; publication: Immelman, KL. 1995. 5. Justicia. In: OA Leistner (ed.), Fl. S. Africa 30(3,1): 18 - 46. National Botanical Institute, Pretoria. [CC BY]"
