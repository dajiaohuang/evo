          originalSourceText: Trees 8-20 m. tall, the young branches relatively slender, glabrous. Leaves ovate- to oblong-elliptic, rather abruptly and bluntly subcaudate-acuminate to subcuspidate, the base obtuse to rounded, firmly membranaceous to subcoriaceous, entire, 9-15 cm. long, 3-5 cm. broad, glabrous or essentially so, the petiole 3-5 mm. long; stipules vary narrowly lanceolate, long-acuminate, 1-2 cm. long. Staminate heads usually paired, sessile or subsessile, about 8-10 mm. in diameter, the bracts broadly obtuse, minutely puberulent. Pistillate heads sessile, the flowers ovoid, about 2 mm. long, softly puberulent, the stigma lobes about equally long. Drupes broadly ovoid, fleshy, about 1 cm. long and broad.
