          title: Aristolochia arborescens L., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Lianas, with twining stems. Leaves alternate, cordate, apex acute to acuminate, membranous, 5 to 20 cm. broad, 8 to 30 cm. long, glabriusculus at maturity. Pseudostipules absent. Flowers immediately subtended by an orbiculate, perfoliate bracteole, axillary, solitary but occasionally in pairs, glabrescent, yellow, blotched with purple, the utricle broadly gibbous-clavate, ca. 30 cm. long, the tube sharply reflexed on the utricle, ca. 35 cm. long, widening into a throat distinguished by peculiar annular venation and constriction, ca. 5 cm. long, the limb obliquely funnelform, terminating in a struppate extension ca. 20 cm. long; the odor putrid. Fruit ovate-cylindric, ca. 10 cm. long, 6 cm. wide, dehiscing acropetally. Seeds numerous, horizontally compressed, 1 cm. diameter, 2 mm. thick.
