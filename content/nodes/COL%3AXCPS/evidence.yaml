        usage:
          title: Columnea microcalyx Hanst., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Epiphytic or rarely trailing woody-based herbs; stems pendent, slender, to 2 m long, ca. 1-3 mm in diam., branched, strigose hirsute with reddish or trans- parent hairs, becoming gray brown with age. Leaves subequal in a pair; ovate elliptic, 1.2-3.2 cm long, 5-13 mm wide, the young leaves thin, becoming thicker and reddish with age, the apex acute, rounded to cordate at the base, subentire to serrulate, occasionally reflexed, adaxially green, sparsely strigose to densely pilose, occasionally with reddish hairs, abaxially dark green with reddish or transparent hairs, densely pilose especially on the prominent veins; petioles 1-2 mm long, pilose. Inflorescences axillary, single flowered; bracts 1-2 mm long, pilose; pedicels 0.9-3.7 cm long, hirsute to pilose with reddish or transparent hairs. Flowers showy; calyx spreading, the lobes oblanceolate, 1.0-1.2 cm long, acute or obtuse at the apex, the margin entire to remotely serrulate, green or reddish, hirsute; corolla pink, orange red to deep purple, with or without yellow areas on the lower side, the tube funnel shaped, strongly zygomorphic, 6-7 cm long, the tube gibbous at the base, ca. 3 mm wide, becoming 10-11 mm wide at the throat, the lobed portion of the corolla 4.3-5.1 cm long, the lobes strongly unequal, the upper lobes truncate at the apex 1.0-1.9 cm long, the lower lobe reflexed, ca. 3 cm long, the outside reddish pilose, the inside glandular; stamens exserted, the filaments reddish, glabrous, the anthers coherent; ovary villous, the style yellow pilose, the stigma bilobed. Berry globose, ca. 1 cm in diam., at first white or transparent, becoming nearly black from the dark colored seeds within, surrounded by the persistent calyx.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 6180
