    - subjectId: taxon:protocetidae
      claimKind: scientific
      claimType: taxonomy
      statement: The synthesis recognizes Protocetidae as a diverse, geographically dispersed assemblage of middle Eocene whales with varying amphibious adaptations; it is not reduced to one ancestor, habitat or uninterrupted global range.
      confidence: medium
      confidenceRationale: The review’s family treatment integrates multiple taxa and localities, so the statement preserves diversity and sampling boundaries.
      referenceLinks:
        - relation: supports
          referenceId: uhen-2010-whale-origins
          pages: 202–207
          quoteLocator: Protocetidae diversity, distribution and locomotor discussion
    - subjectId: taxon:protocetidae
      claimKind: scientific
      claimType: fossil-range
      statement: protocetidae is displayed at 47–37.7 Ma only as the review's diverse protocetid sample, not uninterrupted global occupancy or exact endpoints. The interval is a source-bounded sample window, not a global FAD, LAD, divergence date, continuous occupancy claim or direct-ancestor assertion.
      confidence: medium
      confidenceRationale: protocetidae uses Uhen, M.D. (2010) because the cited pages and locator expose the sampled taxon, specimen or living sequence set. Confidence is medium and applies only to Middle Eocene protocetid sample synthesized by Uhen; broader endpoints remain unclaimed.
      referenceLinks:
        - relation: supports
          referenceId: uhen-2010-whale-origins
          pages: 202–207
          quoteLocator: Protocetidae diversity, distribution and locomotor discussion
        - relation: contextualizes
          referenceId: ics-2026-06
          pages: International Chronostratigraphic Chart v2026/06
          figure: Global chronostratigraphic scale
          quoteLocator: Numerical boundaries for named geological stages used to bound the source sample
  claim-rationales.zh:
    - 综述的科级处理整合多个类群与地点，因此表述保留多样性和取样边界。
    - protocetidae 采用 Uhen, M.D.（2010）的论文，因为所引页码与定位符直接标示了研究采样的类群、标本或现生序列集合。中等置信度仅适用于 Middle Eocene protocetid sample synthesized by Uhen；更宽泛端点保持未声明。
  claim-statements.zh:
    - 综述把原鲸科识别为一个多样、地理分散、具有不同两栖适应的中始新世鲸类组合；它不被简化为单一祖先、单一栖息地或连续全球范围。
    - protocetidae 仅以 47–37.7 Ma 展示为综述所采样的多样原鲸科记录，而非连续全球占据或精确端点。该区间是来源限定的样本窗口，不是全球首现、末现、分化日期、连续占据或直接祖先断言。
