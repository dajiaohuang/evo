        claims:
          - text: In the study's honey series, S. pombe was isolated from 49 of 386 honey samples (12.7%) collected from 43 countries. The authors discuss honeybee honey as a likely primary habitat, while the observed frequency varied among countries and depends on the study's sampling and enrichment methods; the result is not a universal habitat or prevalence estimate.
