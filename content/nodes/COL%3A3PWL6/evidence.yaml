            locator: "SANBI/WFO archive Diagnostic row 51564; source 5962.0; publication: Meeuse, ADJ; Welman, WG. 2000. Convolvulaceae, Fl. S. Africa 28(1): 1 - 138. National Botanical Institute, Pretoria. [http://www.biodiversitylibrary.org/item/209568#page/1/mode/1up]. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Vines with large trichomes, annual, densely to scattered pubescent throughout. Leaves ovate to suborbicular, 5-15 cm long, entire or 3 (-5) -lobed, basally cordate, the lobes apically acute to acuminate, pubescent. Flowers in 1-5-flowered, often dense cymose clusters of mature and developing buds and flowers, sepals long- lanceolate, 15-25 mm long, with linear-lanceolate apices, densely long-hirsute; corolla blue, purple or almost scarlet, throat often white, 3-5 cm long, the limb 4-5 cm broad. Fruits capsular, subglobose to globose, 8-12 mm in diameter; seeds pyriform, densely pubescent with short trichomes.
            originalLanguage: en
