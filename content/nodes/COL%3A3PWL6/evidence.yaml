    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Twining annual herb. Leaves ovate to circular in outline, 3-lobed, cordate at base; middle lobe ovate to oblong, acuminate; lateral ones obliquely ovate to broadly falcate, acuminate. Sepals linear-lanceolate, 23-28 mm long, long-attenuate at apex, basal part alone bristly. Corolla 55-70 mm long. Flowers magenta with paler tube.
            sourceIds:
              - sanbi_11118_0
            locator: "SANBI/WFO archive Morphology row 2431; source 11118.0; publication: Herman, PPJ; Retief, E. 1997. Plants of the northern provinces of South Africa: Keys and diagnostic characters. Strelitzia 6: 1 - 681. National Botanical Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Distinguished from the closely related I. purpurea and I. indica by its sepals with narrow elongate green tips much longer than the body and sepals which are hispid-pilose on the back, the hairs mostly with swollen bases.
            textZh: SANBI 条目提供了该种的鉴别特征。
            sourceIds:
