        claims:
          - text: Annual, up to 250 mm tall. Leaves ovate, entire, acute. Flowers in lax racemes, calyx lobes lanceolate, acute, glandular pilose, strongly reflexed, corolla 14-23 mm long; upper lip with narrowly linear or oblong lobes, white with purplish base; yellow patch with vertical purplish lines just above spur mouth, lower lip yellow with darker yellow palate, floor of corolla tube and palate glabrous, spur 9.5-12.3 mm, projecting back and downwards, tip strongly recurved. Capsule ovate, ± 7 x 5 mm.
