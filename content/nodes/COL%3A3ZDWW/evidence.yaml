    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Shrublet, 30-60 cm tall, with l or more erect or suberect stems from a woody base; branchlets long, erect or ascending, new growth stellate-tomentose with minute reddish stellate scales obvious in parts. Stipules subulate 5-10 mm long. Leaves variable in texture, shape and size, broadly to narrowly ovate-oblong or narrowly oblong, 2-7 cm long, 1-4.3 cm broad, from irregularly and coarsely crenate to finely and regularly toothed, rounded or obtuse at the base and sometimes obscurely cordate at the point of attachment, broadly rounded or slightly narrowing to an obtuse or acute apex, densely to subdensely stellate-tomentose or finely stellate-pubescent on both surfaces; petiole 1-2.5 cm long. Inflorescence axillary, 1-3-flowered; peduncle straight, persistent, 1.5-4.5 cm long, pedicels 0.5-1.5 cm long. Epicalyx- lobes lanceolate to broadly lanceolate-acuminate, acute, 7-11 mm long, 2.5-3 mm broad, tomentose with grouped hairs on both surfaces. Calyx-lobes lanceolate-acuminate, acute or narrowed into a subulate apical portion, 8-16 mm long, 3-3.5 mm broad, tomentose on the outer surface. Petals yellow, sometimes pale yellow, almost as long as the calyx or slightly longer, 7-20 mm long. Stamens with filaments about 2 mm long, anthers 5 mm long, ligulate, staminodes 6-11 mm long. Ovary subglobose, stellate-tomentose with short and long, creamy to pale yellow hairs; style 2-7 mm long, branches, 2-3 mm long; ovules 6 in a cell. Capsule globose to oblong-globose, stellate-tomentose, 5-12 mm long.
            sourceIds:
