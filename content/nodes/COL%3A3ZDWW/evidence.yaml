          - text: This species approaches M. suluensis from eastern Natal. M. damarana also resembles forms of M. ovata auct. found in tropical Africa with the type from South America, the principal distinguishing feature being the shape of the epicalyx-bracts, which are linear-subulate in M. ovata and lanceolate to broadly lanceolate in M. damarana.
