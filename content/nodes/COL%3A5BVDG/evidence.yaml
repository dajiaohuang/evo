    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous herb, up to 1 m high. Basal leaves 1 or 2, linear with heavily thickened margins, midribs raised and thickened, 3-6 mm wide. Perianth with lower part 8-9 mm long. Tepals oblanceolate, 10-18 x 5-7 mm. Flowers pale yellow to cream or maroon.
            textZh: Watsonia watsonioides (Baker) Oberm. 的 SANBI 物种条目记录了形态特征。
