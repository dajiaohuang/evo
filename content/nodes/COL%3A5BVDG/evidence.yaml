            locator: "SANBI/WFO archive Morphology row 3942; source identifier 11118.0; cited publication: Herman, PPJ; Retief, E. 1997. Plants of the northern provinces of South Africa: Keys and diagnostic characters. Strelitzia 6: 1 - 681. National Botanical Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: A distinctive species readily recognised by the one or two linear basal leaves and dense spikes of small flowers, the upper part of the perianth tube 7-9 mm long and the tepals 10-18 mm long. The flowers are typically and uniquely pale yellow to cream-coloured, but maroon-flowered populations occur around Mankayane in southwestern Eswatini.
