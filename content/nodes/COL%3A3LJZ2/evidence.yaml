            locator: "SANBI/WFO archive Morphology row 74104; source 16022.0; publication: Harvey, WH. 1860. Malvaceae Juss., Fl. Cap. (Harvey) 1: 157 - 177. Lovell Reeve & Co., London. [https://www.biodiversitylibrary.org/item/15231#page/213/mode/1up]. [All rights reserved]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: A slender shrub, with rodlike branches and a very close-pressed and short, but rigid pubescence. Leaves 1/2-3/4 inch long; petioles 1/4 inch. Peduncles about twice as long as the leaves; flowers bright crimson, 1 1/2 inch across, with narrow, cuneate petals. The leaves in the specimens seen can scarcely be called 3-lobed, but there is a tendency to such division and, notwithstanding the short petioles, the habit reminds us of some depauperated forms of H. pedunculatus.
            textZh: SANBI 条目提供了该种的鉴别特征。
