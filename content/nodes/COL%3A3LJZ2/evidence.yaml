        claims:
          - text: Shrubby, slender; branches straight, strigose with oppressed stellate bristles; leaves (small) on short petioles, 3-nerved, ovate-oblong, obtuse, unequally toothed and somewhat 3-lobed, the lateral lobes very short, appressedly stellato-pubescent; stipules setaceous, rigid; peduncles axillary, longer than the leaves, jointed below the flower; invol. of about 10 linear-subulate pubescent leaflets, shorter than the deltoid-acuminate calyx lobes; capsule puberulous, seeds smooth.
            sourceIds:
