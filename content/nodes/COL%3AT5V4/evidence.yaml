        usage:
          title: Cestrum scandens Vahl, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Scandent shrub, sometimes several m long; twigs slender, glabrous. Leaves to 10 cm long, ovate, apically acute, basally obtuse or rounded, the margins slightly revolute, veins 4-7 on each side, membranaceous, glabrous; petioles sub- sessile to 3.5 cm long; minor leaves sometimes present, rotund to lanceolate. In- florescences several, elongate open panicles, axillary or terminal, the peduncle tc 15 cm long, slender, glabrous, with foliaceous bracts near the base, the pedicels to 2 mm long, stout, the bracteoles linear, to 2 mm long. Flowers with the calyx 3 mm long, tubular-campanulate, green, puberulent in the upper half, strongly costate, the teeth short-deltoid and evenly pubescent within; corolla green, the tube 18-20 mm long, slender, expanding slightly below the apex, outside glabrous, inside pubescent at the base or glabrous, the lobes lanceolate, 7-9 mm long; stamens equal, the filaments free less than 0.5 mm, glabrous, straight, un- appendaged, the style pubescent on the upper 2 mm, the stigma laterally flattened. Fruit (Francey) blue, obovoid, 9 mm long, 8-seeded.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 13052
