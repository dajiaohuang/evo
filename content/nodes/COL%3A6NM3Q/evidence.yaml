        claims:
          - text: Perennial herb. Leaves 6-14 mm broad, soft-textured. Inflorescence bicolorous with a few red buds at apex, remainder of inflorescence lemon-yellow. Peduncle up to 0.6 m high. Perianth 30-42 mm long. Flowers lemon-yellow.
            textZh: Kniphofia porphyrantha Baker 的 SANBI 物种条目记录了形态特征。
