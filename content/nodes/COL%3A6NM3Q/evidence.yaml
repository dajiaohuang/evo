            locator: "SANBI/WFO archive Morphology row 2545; source identifier 11118.0; cited publication: Herman, PPJ; Retief, E. 1997. Plants of the northern provinces of South Africa: Keys and diagnostic characters. Strelitzia 6: 1 - 681. National Botanical Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: "K. porphyrantha is relatively small in stature with small racemes, pale to lemon-yellow in colour, tinged with red at the apex; the leaves are flaccid, yellow-green in colour with smooth margins. In the herbarium it is not always easy to distinguish it from certain other species with acute to acuminate bracts but, with fresh material, the above characters provide a basis for separating K. porphyrantha from the following: (a) K. triangularis subsp. ob-tusiloba, which has concolorous, coralred to orange-red racemes and spreading perianth lobes; (b) K. galpinii, with its predominantly scarlet racemes and narrower, grass-like leaves; (c) K. thodei with the unusual brownish red and white coloration of its racemes and the usually denticulate leaves; and (d) K. fluviatilis, which resembles K. porphyrantha in the colour of the raceme but has longer flowers (42-50 mm) and the leaves tend to be broader, more glaucous and are V-shaped in cross section."
            textZh: SANBI 条目提供了 Kniphofia porphyrantha Baker 的鉴别特征。
