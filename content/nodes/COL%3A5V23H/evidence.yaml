    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Densely tufted perennial 160-1000 mm high; basal sheaths distichous, keeled, flattened; culms 1-3 mm wide, much branched above, slender, reddish throughout. Leaf blade 50-300 x 1.5-3.0 mm, glabrous; ligule a fringed membrane. Inflorescence glabrous, racemes solitary, 30-40 mm long, in fascicles of 1-6; pedicels and internodes linear, short, rounded, glabrous; internodes ±1/5 the length of sessile spikelet. Sessile spikelet 4.0-4.5(5.3) mm long, awnless, a small crown of hairs present at base; glumes lack pits between nerves; lower glume flat on back; upper glume boat-shaped, sharply keeled; palea absent; anthers 2.0-2.5 mm long. Pedicellate spikelet larger, 4.0-5.3 mm long, male.
