        claims:
          - text: Robust shrub with branches nodding at tips and pendulous branchlets, to 2 m. Leaves ovate-lanceolate, compressed, hairy beneath, 2.5-4.0 mm long, bracts acuminate, furrowed. Flowers in spikes, tube ± 3 mm long, neck ± 1 mm. Fruits fleshy, orange.
            sourceIds:
