            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Passerina rigida is easily distinguished as a robust, rigid shrub, usually 1-2 m high. The ascending branches are conical in shape due to many branchlets that are pendulous when fertile. The flowers are yellow and membranous and bright yellow berries are borne subterminally. The leaves are narrowly lanceolate to ovate and the apex is acute, with the main vein visible as a blunt keel. The bracts are widely ovate with the apex acute. This species is easily distinguished from P. paleacea which occurs on secondary dunes and is distributed mainly along the southern coast of Western Cape.
            textZh: SANBI 条目提供了该种的鉴别特征。
