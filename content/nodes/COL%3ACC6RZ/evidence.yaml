    facets:
      morphology:
        status: partially-supported
        claims:
          - text: The species description reports dry apothecia 3.8–5.0 mm wide × 2.5–4.1 mm high (mean 4.8 ± 0.8 × 3.7 ± 0.8 mm, n=10); the sampled fruiting bodies were scattered, superficial when fresh, short-stipitate and glabrous. The description records brown receptacles and pastel-green to light-green discs.
            originalLanguage: en
            sourceIds:
              - li2024
            locator: Species treatment T. yunnanensis, Description and Notes; Figure 7; holotype HKAS 128273
            placeTimeScope: "The article reports two collections from Yunnan, China: Jingdong County, Puer City (1455 m, 2022-08-23) and Tengchong City (1714 m, 2022-08-16). The study’s localities do not establish a global range."
            lifeStatus: Claims apply to the field collections and taxonomic account identified by the cited voucher; do not infer beyond those specimens.
        gaps:
          - The account describes measured collection material, but a genus-wide diagnosis, additional populations, developmental stages, and within-species variation were not systematically assessed.
      lifeHistory:
        status: not-assessed
      ecology:
        status: partially-supported
        claims:
          - text: The authors describe T. yunnanensis as saprobic on decayed wood; the two listed collections were made from decayed wood.
            originalLanguage: en
            sourceIds:
              - li2024
            locator: Species treatment T. yunnanensis, Description and Material examined; vouchers HKAS 128273 and 128272
            placeTimeScope: "The article reports two collections from Yunnan, China: Jingdong County, Puer City (1455 m, 2022-08-23) and Tengchong City (1714 m, 2022-08-16). The study’s localities do not establish a global range."
            lifeStatus: Claims apply to the field collections and taxonomic account identified by the cited voucher; do not infer beyond those specimens.
        gaps:
          - The source describes substrate and saprobic habit, but interaction mechanisms, host identity for unidentified wood, seasonality, and population ecology remain unassessed.
      evolution:
        status: partially-supported
        claims:
          - text: In the combined LSU and ITS phylogeny, T. yunnanensis was sister to T. macrospora (98% maximum-likelihood bootstrap, 1.0 Bayesian posterior probability). The reported PHI value was Φw=1.0 for that pair.
            originalLanguage: en
            sourceIds:
              - li2024
            locator: Results, Phylogenetic analyses; Figure 2; Figure 3A; species treatment Notes
            placeTimeScope: "The article reports two collections from Yunnan, China: Jingdong County, Puer City (1455 m, 2022-08-23) and Tengchong City (1714 m, 2022-08-16). The study’s localities do not establish a global range."
            lifeStatus: Claims apply to the field collections and taxonomic account identified by the cited voucher; do not infer beyond those specimens.
        gaps:
          - The placements are specific to one study’s sampled taxa and loci; broader phylogenomic evidence, alternative topologies, and divergence times were not reviewed. The authors also note that genus placement remains provisional because the type species lacks genetic data.
      distribution:
        status: partially-supported
        claims:
          - text: The article lists the type from Jingdong County, Puer City, Yunnan (1455 m, 2022-08-23) and a paratype from Tengchong City, Yunnan (1714 m, 2022-08-16). These are the documented study localities.
            originalLanguage: en
            sourceIds:
              - li2024
            locator: Species treatment T. yunnanensis, Holotype and Material examined; vouchers HKAS 128273 and 128272
            placeTimeScope: "The article reports two collections from Yunnan, China: Jingdong County, Puer City (1455 m, 2022-08-23) and Tengchong City (1714 m, 2022-08-16). The study’s localities do not establish a global range."
            lifeStatus: Claims apply to the field collections and taxonomic account identified by the cited voucher; do not infer beyond those specimens.
        gaps:
          - Only the named Yunnan study collections were reviewed; no global occurrence search, georeferenced range boundary, or native/introduced assessment was completed.
      fossil:
        status: not-assessed
      conservation:
        status: not-assessed
