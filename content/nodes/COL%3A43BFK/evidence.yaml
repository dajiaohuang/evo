    facets:
      morphology:
        status: partially-supported
        claims:
          - text: A twining herb, wide-climbing, stems c. 3 mm diam., glabrous or pubescent. Leaves petioled, opposite, up to c. 10 x 7 cm but often much smaller, ovate, apex acuminate, base cordate to hastate, margins sub-entire, sinuate-dentate or denticulate, 5-nerved from the base, glabrous to thinly hairy above, glabrous to velvety below. Heads cylindric, c. 8-10 mm long, c. 4-flowered, shortly pedicelled to almost sessile, many in rounded, congested trichotomous corymbs on peduncles longer than the leaves and subtended by pairs of reduced leaves. Involucral bracts 4, equal, with a fifth, smaller, outer bract, lanceolate, acute to acuminate, a little shorter than the flowers, glabrous or hairy. Corolla white or whitish, style branches and anthers often purplish. Achenes c. 3 mm long, subcylindric, 5-angled, black dotted with golden sessile glands. Pappus whitish, of numerous scabrid bristles.Can be found in flower in any month, but most commonly from July to September.
            sourceIds:
