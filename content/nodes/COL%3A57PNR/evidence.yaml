    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants up to 60 cm. Roots uniform, fibrous, many. Rhizome small covered with leaf fibres. Leaves linear, up to 45 cm, triquetrous, each face 6 mm wide, herbaceous, softly and patently pilose with long hairs, margins, prominent. Inflorescence branched or simple, flowers somewhat congested near the apex, many flowered, with a few scattered stipitate glands; scape terete, pilose, bracts small, subulate; pedicels patent, up to 17 mm long. Flowers with a spreading white, dark keeled, maculate perianth, segments 9 mm long, filaments swollen and retrorsely scabrid above, glabrous below, the 3 inner situated in the furrows of the triquetrous ovary; ovary with 4 ovules per cell, globose, with minute papillate glands. Capsule unknown.
