    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Profusely branched perennial (?) herb forming mats up to 200 mm across, or tufted, stems prostrate or decumbent, very slender, greyish-white felted, closely leafy. Leaves imbricate with woolly-backed oblong bases as long as the blade webbed to the stem, blades mostly 4-10 x 3-7 mm, elliptic-oblong to oblong-spathulate, apex rounded, both surfaces closely greyish-white woolly-felted. Heads homogamous, very rarely heterogamous, cylindric, ±5 x 2 mm, many clustered at the branch tips closely surrounded by leaves. Involucral bracts in 4 series, soon caducous, outermost short, webbed with wool to 2-3 reduced surrounding leaves, others subequal, about equalling flowers, not radiating, all translucent, upper part light golden-brown, obtuse, extreme tip opaque or subopaque along the midline. Receptacle nearly smooth. Flowers 18-25, very rarely 1 female. Achenes spindle-shaped, ±1 mm long, glabrous in type material, with duplex hairs in other collections. Pappus bristles many, about equalling corolla, delicate, scabrid, bases cohering lightly by patent cilia.
            sourceIds:
