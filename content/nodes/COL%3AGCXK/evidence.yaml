        usage:
          title: Ardisia crassipes Lundell, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Trees, ca. 20 m high, branchlets thick, terete, lepidote at first. Leaves alternate, coriaceous, with thick marginate petioles 1-1.5 cm long and ca. 5 mm in diameter; leaf blades drying brownish, persistently appressed-lepidote on the lower surface with small brownish scales, oblong-elliptic, 21-25 cm long and 8-9.5 cm wide, subabruptly acuminate apically, acute and decurrent basally, entire, opaque, the costa shallowly sulcate above, large and elevated beneath, the primary lateral veins slender and inconspicuous on both surfaces, widely ascending. Inflorescences (complete) not seen, apparently paniculate, the main branches thick, furfuraceous, bearing the flowers on short thick reduced lateral spurs to 5 mm long; pedicels thick, 1-1.5 mm long, to 4 mm in diameter. Flowers 5-merous; sepals free, coriaceous, broadly sub- orbicular, ca. 2.5 mm long, asymmetrical, ciliate, rounded apically, punctate with a few small glands. Fruit (immature) obovoid, glabrous.
