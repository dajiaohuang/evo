        usage:
          title: Columnea nicaraguensis Oerst., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Suffrutescent, pendent herbs or shrubs, epiphytic; stems to 2 m or more in length, 2-7 mm in diam., more or less white sericeous. Leaves of a pair unequal, the larger leaf ovate, oblanceolate, lanceolate to narrowly lanceolate, 5.7-11.1 cm long and 0.6-3.5 cm wide, the apex acuminate, oblique at the base, entire, above green, sparsely strigose to almost glabrous, the hairs transparent or white, 2-3 celled, green or sometimes flushed pink or red below, sparsely sericeous, the hairs fine, transparent or reddish, 5-12 celled, more numerous especially on the veins, also 2-3 celled white adpressed hairs; petioles 1-4 mm long; smaller leaves ovate, oblanceolate, lanceolate to narrowly lanceolate, 1.0-4.7 cm long, and 4-16 mm wide, acuminate, oblique at the base, entire, vestiture as on the larger blades. Flowers solitary; bracts 4-9 mm long, lanceolate, creamy sericeous; pedicels 6-16 mm long, creamy sericeous; calyx lobes ovate lanceolate, 2.1-3.3 cm long, the apex long acuminate, entire or with 2-3 slight serrations near the base, green, reddish or red, sparsely sericeous, more hairy on the midrib; corollas brick red to coppery orange with yellow areas running from sinuses of the anterior lobe and at the base of the corolla, rarely concolorous red, funnel- form but strongly zygomorphic, 6.1-7.7 cm long, ca. 5 mm in diam. above the base, becoming ca. 10 mm in diam. at the throat, the outside white sericeous, the lobed portion of the corolla 3.2-4.9 cm long, the lobes strongly unequal, the posterior pair connate, emarginate at the apex, 1.5-2.3 cm long, the anterior lobe 2.1-4.0 cm long, spreading; filaments minutely pilose, red, the anthers exserted; ovary sericeous, the style minutely pilose glandular, yellow, the stigma bilobed. Fruits white, ca. 10 mm in diameter. Chromosomes 2n = 18 (Sherk, 1960).
