          title: Palicourea pauciflora Standl., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrubs, the twigs branching freely, terete, ultimately angular, the nodes well spaced. Leaves elliptic to obovate elliptic, to 7.5 cm long, to 2.5 cm wide, nar- rowly acuminate, the acumen to 1.5 cm long, ultimately acute, cuneate at the base, the lateral veins ca. 11, arcuate, stiffly chartaceous, concolorous; petioles ca. 1 cm long; stipules persistent, connate, turgid, ca. 0.5 cm long, each part with 2 triangular lobes, acute to obtuse. Inflorescences terminal, to 5 cm long, to 5 cm wide; peduncle to 3 cm long, the branches few, slender, opposite, few flow- ered, the bracts narrowly oblong, to 1 cm long; bracteoles narrowly oblong. Flowers with pedicels to 1 cm long; hypanthium short, the calycine cup and lobes to 0.8 cm long, the lobes longer than the cup, glabrous, 5.0-6.5 mm long; corolla greenish purple, large, 1.0-1.5 cm long, the tube about twice the length of the lobes. Fruits not seen.
          originalLanguage: en
          sourceField: general
