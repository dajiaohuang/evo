        usage:
          title: Batis maritima L., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Prostrate, glabrous, dioecious shrubs, the bark soon flaking off; rooting at the nodes, the branching alternate, the leafy short shoots with elevated, faintly 2-lobed leaf scars and immediately above them minute bud scars. Leaves suc- culent, linear, terete or approximately 3-4-angled in cross-section, to 2 cm long, apically acute or mucronate, basally clasping and drying with a basal, reflexed appendage; stipules inconspicuous, caducous. Inflorescences axillary, shortly pedunculate, congested, indeterminate catkins or syncarps subtended by an op- posite pair of scalelike bracts, not enlarging or enlongating much with age. Male inflorescence with 10-30 pairs of decussate flowers, each surrounded by a cam- panulate, 2-lobed perianth which is appendaged on the dorsal side just below the rim to give the appearance of imbricate bracts, the flower consisting of 4 stamens alternating with 4 minute spatulate, petaloid staminodes, the anthers ovoid, dorsi- fixed, versatile, introrse, dehiscing longitudinally, exserted on stout, glabrous fila- ments, the gynoecium wanting; female inflorescence an irregularly ellipsoidal syncarp to 5 mm long of 4-8 fused pistils which bear persistent, scalelike, 1 mm wide tepals near their apices, the style umbonate, the 2 stigmas capitate and connivent, the ovary with 4 unequal locules and one basal ovule in each locule. Fruits drupaceous syncarps with 1-several pyrenes, the outer tissue fleshy or leathery, the endocarp woody; seeds oblong, nearly straight.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 2135
