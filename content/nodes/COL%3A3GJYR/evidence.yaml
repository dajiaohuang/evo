        claims:
          - text: Erect or sprawling, densely leafy, white-woolly perennial to 40 cm. Leaves narrowly oblanceolate, ascending. Flower heads discoid, in small, terminal corymbs, outer bracts brown and woolly, inner white-tipped.
            sourceIds:
              - sanbi_14150_0
            locator: "SANBI/WFO archive Morphology row 10908; source 14150.0; publication: Manning, JC; Goldblatt, P. 2012. Asteraceae: Gnaphalium L. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 381 - 381. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Characterized by having the corymbs closely surrounded by leaves, heads with pale outer bracts loosely woolly on the backs, inner bracts with snow-white, oblong obtuse tips 2-4 times as long as broad and often recurved, and pappus present on all flowers. Can be confused with G. vestitum, but that species has the inner bracts buff or dirty white and generally acute or subacute. The leaves in G. vestitum are usually more closely imbricate than in G. capense, with the mucro generally hidden in wool.
            textZh: SANBI 条目提供了该种的鉴别特征。
