        usage:
          title: Boerhavia diffusa L., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Perennial herbs; stems decumbent to ascending, 4-12 dm. long, rather slender, more or less viscid-puberulent. Leaves opposite or subopposite, often unequal at the nodes, petiolate; blade orbicular to rhombic-ovate below, frequently grading to lanceolate above, obtuse to rounded or acute at the apex, obtuse to rounded at the base, undulate or sinuate, 2-6 cm. long, 2-5 cm. broad, more or less puberulent to glabrate, yellowish green above, paler beneath, not punctate; petiole 1-4 cm. long. Inflorescences paniculiform, lax and many-flowered, leafy-bracteate at least below, viscid-puberulent to glabrate. Flowers in pedunculate glomerulate clusters, sessile or subsessile, the perianth tube 0.7-1.0 mm. long, somewhat less than 0.5 mm. broad, herbaceous, minutely glandular, the perianth limb campanulate, about 0.5 mm. long, red to purple, rarely white; stamens 3, slightly exserted. Anthocarps obovoid to subellipsoid, obtuse to obscurely beaked, 3-4 mm. long, 1 mm. broad, glandular, sessile or subsessile.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 8489
