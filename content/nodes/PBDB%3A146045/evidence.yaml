  claim-rationales.zh:
    - 布尔吉斯页岩齿谜虫样本的分类字段只陈述所引研究与导航范围；不会把矩阵位置、数据库映射或样本相似性改写为直系祖先。
    - 布尔吉斯页岩齿谜虫样本的地理字段限于具名样本或明确模型范围，不外推为全球分布、起源中心或完整扩散路径。
    - 布尔吉斯页岩齿谜虫样本的生态字段区分保存事实与功能推断；未被直接记录的饮食、行为、栖息地偏好和性能均保留不确定性。
    - 布尔吉斯页岩齿谜虫样本的形态字段限于主研究列明的标本、样本或分析，并连接到精确页码、图版或补充材料。
    - 布尔吉斯页岩齿谜虫样本的年代范围是有界的标本、地层或模型投影，不作为全球首现、末现、分化时间或连续谱系时长。
  claim-statements.zh:
    - Odontogriphus omalus 在此作为受解释边界约束的软体动物起源档案；齿列同源性本身不能确立冠群归属或祖先关系。
    - 本档案限于布尔吉斯页岩样本，不据此推断全球分布。
    - 底栖爬行和摄食方式是根据足部及摄食器官推断的；实际利用的底质、食物和行为并未被直接观察。
    - 由 189 件标本组成的样本反复保存了成对横向齿列及其后部替换结构、宽阔的足和外套沟结构。
    - 508–505 Ma 包络是布尔吉斯页岩样本区间，并非该物种的全球延限或冠群软体动物的校准年代。
