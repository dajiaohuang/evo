  claims:
    - subjectId: taxon:aves
      claimKind: scientific
      claimType: fossil-range
      statement: "The 150–0 Ma Aves route is an avialan-to-living-bird navigation anthology: referred Archaeopteryx material supplies a Late Jurassic fossil anchor, but Archaeopteryx is outside crown Neornithes and the endpoint is not crown-Aves origination."
      confidence: medium
      confidenceRationale: The Painten specimen has explicit locality, horizon and anatomical locators. The atlas entity deliberately groups Archaeopteryx and Neornithes for browsing, so the range is labelled as an anthology rather than a single crown definition.
      referenceLinks:
        - referenceId: rauhut-2018-oldest-archaeopteryx
          relation: supports
          pages: 6:e4191
          figure: Figures 1–5; Table 1
          quoteLocator: Geological setting; Systematic palaeontology; specimen and locality catalogue; phylogenetic discussion
  claim-rationales.zh:
    - Painten 标本具有明确产地、层位与解剖定位；图谱实体为浏览而同时容纳 Archaeopteryx 与 Neornithes，因此范围明确标作证据选集，而非单一冠群定义。
  claim-statements.zh:
    - 150–0 Ma 的鸟类路线是从鸟翼类化石到现生鸟的导航选集：归入 Archaeopteryx 的材料提供晚侏罗世锚点，但 Archaeopteryx 位于现生鸟冠群之外，该端点不是鸟冠群起源。
  ranges:
    - entityId: aves
      rangeKind: global-composite
      taxonomicConcept: Aves avialan-to-living-bird navigation anthology
      geographicScope: Late Jurassic Bavarian lithographic limestones; living global continuation
      olderMa: 150
      youngerMa: 0
      status: available
      uncertainty:
        olderMa: null
        youngerMa: null
        note: 150 Ma is a rounded referred-Archaeopteryx envelope; the route groups a stem avialan with crown birds and therefore is not a crown-Neornithes origin or FAD.
      evidenceBasis: Referred Archaeopteryx material provides the fossil anchor while living birds supply the present endpoint; the two are an explicit browse anthology.
      confidence: medium
      claimIds:
        - claim:taxon:aves:root-range
      referenceLocators:
        - referenceId: rauhut-2018-oldest-archaeopteryx
          locator: Article e4191; Geological setting; Figures 1–5; Table 1
      evidenceLevel: literature-synthesized
