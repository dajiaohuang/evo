      ecology:
        status: partially-supported
        claims:
          - text: In one managed bag-cultivation experiment with the Hangxiu 1 strain, the A3 substrate treatment replacing 20% of cottonseed shell with camellia shell produced a reported total yield of 407.83 ± 24.93 g per bag and biological efficiency of 72.83 ± 4.45% (mean ± SD, n=3). The article reports no significant yield or biological-efficiency difference among the tested 0–20% replacement treatments. The result is limited to this cultivation experiment and strain.
            textZh: 在一项使用 Hangxiu 1 菌株的袋式人工栽培试验中，A3 基质以山茶壳替代 20% 棉籽壳，报告的总产量为每袋 407.83 ± 24.93 克，生物学效率为 72.83 ± 4.45%（均值 ± 标准差，n=3）。文章报告，在所测 0–20% 替代处理之间，产量或生物学效率差异均未达到显著水平。该结果仅适用于这一菌株和栽培试验。
            originalLanguage: en
            sourceIds:
              - huang2024pleurotus-camellia-shell
            locator: Methods §§2.1–2.2 for strain, substrate, and experimental design; Results Tables 1–2 for total yield, biological efficiency, and treatment comparisons.
            placeTimeScope: Trial location and dates are not stated; the Hangxiu 1 strain was supplied by Hangzhou Academy of Agricultural Sciences and camellia shells were sourced from Quzhou, Zhejiang, China.
            lifeStatus: Cultivated mushrooms grown in prepared substrate bags; wild populations were not studied.
        gaps:
          - One strain and managed substrate trial does not establish wild ecology, natural substrate use, or cultivation performance across strains, sites, seasons, and systems.
