          title: Polycarpaea corymbosa (L.) Lam., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Herbaceous, argentate-pubescent, erect virgate or tufted annuals or perennials to 1 m. high. Leaves verticillate, linear, aristate, 3-15 mm. long, mostly less than 1 mm. broad, villous or glabrate, the aristate, often lacerate, argentate stipules 2-5 mm. long. Flowers many in congested dichasial cymes, the puberulent pedicels 2-5 mm. long, mostly exceeded by the subtending bracts. Sepals usually 5, occasionally biseriate, lanceolate to ovate, attenuate to aristate, argentate or rarely rufous, often with a darker triangle at the base, 2-4 mm. long; petals 5, obovate, apically undulate, drying yellowish or brown, 0.5-1 mm. long; stamens 5, the flattened filaments 0.5-1 mm. long; ovary short-stipitate, obovoid, the style 0.25- 0.50 mm. long, the stigmata minute. Capsule ellipsoid, 1-2.5 mm. long, dehiscing longitudinally into 3 entire valves; seeds 2-6, ca. 0.5 mm. broad, cochleate, minutely corrugated, light brown, on basal placentae.
          originalLanguage: en
          sourceField: general
