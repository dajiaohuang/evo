      statement: Ctenosauriscus GZG.V.4191 from latest Olenekian strata near 247.2 Ma anchors the 247.2–0 Ma Archosauria route; its pseudosuchian placement and stratigraphic age provide a sampled crown minimum, not a global origin or complete early-archosaur record.
      confidence: medium
      confidenceRationale: The holotype, stratigraphic correlation and revised character matrix are explicit. The paper also documents sparse and geographically biased Early Triassic sampling, so the route cannot be interpreted as a global FAD.
