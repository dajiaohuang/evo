        - referenceId: butler-2011-ctenosauriscus
          relation: supports
          pages: e25693
          figure: Figures 1–16; Text S1; Materials S1
          quoteLocator: Holotype redescription; stratigraphic review; phylogenetic analysis; early-archosaur record discussion
  claim-rationales.zh:
