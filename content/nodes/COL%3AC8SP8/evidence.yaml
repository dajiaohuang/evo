    facets:
      morphology:
        status: partially-supported
        claims:
          - text: The species account diagnoses A. multicingulata against A. liquii by longer pileal-margin striations, lamellae color and drying response, smaller basidiospores, and subtropical Fagaceae-dominated forest occurrence; microscopic type characters are described.
            originalLanguage: en
            sourceIds:
              - cui2023
            locator: Section 3.2, Amanita multicingulata Y.Y. Cui, Q. Cai & Zhu L. Yang, Diagnosis and Description; Type
            placeTimeScope: Type from Huangshan, Anhui, China, collected 2018-07-13; the article lists additional July 2018 Huangshan vouchers. The stated eastern China range is the authors’ account, not a global range.
            lifeStatus: Wild fungal type collection described by the authors.
        gaps:
          - One taxonomic paper and its sampled material do not cover developmental variation, broad population variation, or a complete diagnostic synthesis.
      lifeHistory:
        status: not-assessed
      ecology:
        status: partially-supported
        claims:
          - text: The authors report solitary-to-scattered fruiting on soil in subtropical broad-leaved forests dominated by Fagaceae, sometimes mixed with Pinus.
            originalLanguage: en
            sourceIds:
              - cui2023
            locator: Section 3.2, Amanita multicingulata Y.Y. Cui, Q. Cai & Zhu L. Yang, Habitat
            placeTimeScope: Type from Huangshan, Anhui, China, collected 2018-07-13; the article lists additional July 2018 Huangshan vouchers. The stated eastern China range is the authors’ account, not a global range.
            lifeStatus: Wild field collections; the stated forest association does not establish a physiological host relationship.
        gaps:
          - The account does not establish interaction mechanisms, resource dependence, seasonality, or population-level ecology.
      evolution:
        status: partially-supported
        claims:
          - text: The combined multilocus phylogeny places A. multicingulata as sister to A. liquii.
            originalLanguage: en
            sourceIds:
              - cui2023
            locator: Results, phylogenetic relationships; Figure 1 and Figures S1–S4
            placeTimeScope: Type from Huangshan, Anhui, China, collected 2018-07-13; the article lists additional July 2018 Huangshan vouchers. The stated eastern China range is the authors’ account, not a global range.
            lifeStatus: Modern herbarium collections analyzed in the cited study.
        gaps:
          - Placement is limited to the study taxa, loci, sampling, and analyses; no divergence-time or broader phylogenomic synthesis was assessed.
      distribution:
        status: partially-supported
        claims:
          - text: The authors report A. multicingulata as known from eastern China and list the type and additional collections from Huangshan, Anhui, in July 2018.
            originalLanguage: en
            sourceIds:
              - cui2023
            locator: Section 3.2, Amanita multicingulata Y.Y. Cui, Q. Cai & Zhu L. Yang, Type, Additional specimens examined, and Distribution
            placeTimeScope: Type from Huangshan, Anhui, China, collected 2018-07-13; the article lists additional July 2018 Huangshan vouchers. The stated eastern China range is the authors’ account, not a global range.
            lifeStatus: Reported field-collected specimens; cultivated, introduced, and global range status not assessed.
        gaps:
          - The paper reports its known range and examined collections; no exhaustive global occurrence search or native/introduced assessment was completed.
      fossil:
        status: not-assessed
      conservation:
        status: not-assessed
