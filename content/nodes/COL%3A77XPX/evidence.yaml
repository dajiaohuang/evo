    facets:
      morphology:
        status: not-assessed
        gaps:
          - No diagnostic species-wide anatomical survey was assessed. A paper on fragmentary subfossil bones was located, but the version-of-record license and the broader taxonomic interpretation were not verified for claim use.
      lifeHistory:
        status: partially-supported
        claims:
          - text: "At Kirindy Forest/CNFEREF, the study measured development of 12 wild infants from two birth cohorts during the first six postnatal months, but follow-up differed by cohort: the 2017 cohort was monitored through February, while the 2018 cohort's observations ended in December before a full six-month window. Infants whose mothers had higher prenatal fecal glucocorticoid metabolite concentrations showed faster growth and more independent foraging and play. These are observational associations from one local population; they do not establish a causal effect or a species-wide developmental rate."
            sourceIds:
              - malalaharivony2021
            locator: Abstract; Methods > Study site and subjects; Results on maternal fecal glucocorticoid metabolites and infant development; Discussion on limits to distinguishing adaptive programming from infant-condition effects.
            placeTimeScope: Kirindy Forest/CNFEREF, central western Madagascar; two successive breeding seasons in 2017 and 2018; 12 infants in two birth cohorts with different follow-up windows. The 2018 cohort was observed only through December, before a full six-month postnatal window.
            lifeStatus: Wild, free-ranging mothers and infants from the monitored Kirindy population.
            originalLanguage: en
        gaps:
          - This study does not establish species-wide age at maturity, gestation, birth interval, adult survival, or lifespan; those parameters remain unassessed here.
      evolution:
        status: not-assessed
        gaps:
          - No species-level evolutionary or population-genomic claim is included; a comparative genome paper was located but its item-level license still requires publisher-page verification.
      ecology:
        status: partially-supported
        claims:
          - text: At Kirindy Mitea National Park, the authors reported M/LWS opsin genotype variation consistent with polymorphic trichromacy in one wild sifaka population. Individuals in groups containing trichromats had higher body-mass indices and more fruit-feeding time, with longer fruit-feeding bouts, than individuals in dichromat-only groups. These are study-specific associations; genotype is a proxy for color-vision phenotype, not a retinal anatomical measurement, and a proposed dry-season fruit-detection advantage is the authors' hypothesis.
            sourceIds:
              - veilleux2016
            locator: Abstract; Methods > M/LWS opsin genotyping and Feeding behavior; Results comparing group composition, body-mass index, and fruit-feeding measures; Discussion of the proposed mutual-benefit hypothesis.
            placeTimeScope: One wild population at Kirindy Mitea National Park, southwestern Madagascar; genotyped and behaviorally observed animals/groups from the study's nine-year research interval.
            lifeStatus: Wild, free-ranging animals; the claim is limited to the sampled population and observed groups.
            originalLanguage: en
          - text: In the 2017–2018 Kirindy study, maternal fecal glucocorticoid metabolite concentrations were higher during periods of low rainfall and during late pregnancy than in the early-to-mid prenatal period. The authors used rainfall as a local proxy for food availability; this observational result is limited to the study population and does not define the species' climate niche or demonstrate causation.
            sourceIds:
              - malalaharivony2021
            locator: Abstract; Methods > Phenology and climatic variables; Results > Predictors of variation in fGCM concentrations; Discussion. The model uses 359 hormone observations and rainfall as a proxy for food availability.
            placeTimeScope: Kirindy Forest/CNFEREF, central western Madagascar; two breeding seasons in 2017 and 2018; local rainfall and seasonal measurements for the monitored mothers.
            lifeStatus: Wild, free-ranging adult females in the monitored population.
            originalLanguage: en
        gaps:
          - The study does not show that group-level feeding patterns apply across the full range or establish a causal effect of color-vision genotype on fitness.
          - Rainfall was a local proxy in one study population; no range-wide habitat, climate envelope, or species-level environmental vulnerability assessment was conducted.
      distribution:
        status: not-assessed
        gaps:
          - Localities in the Kirindy studies are not a species-wide distribution estimate. A current, source-located range assessment was not completed.
      fossil:
        status: not-assessed
        gaps:
          - No species-level fossil occurrence or geological range extension is asserted. A published fragmentary subfossil comparison remains outside this dossier pending item-level license and taxonomic-scope verification.
      conservation:
        status: not-assessed
        gaps:
          - The current formal conservation category, assessment date, criteria, and rationale were not verified from the official item-level assessment record; a 2020 status statement in secondary study context is not treated as current status.
