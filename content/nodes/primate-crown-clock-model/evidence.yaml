      claimKind: scientific
      claimType: divergence-time
      statement: Under the cited autocorrelated-clock analysis and calibration strategy A, the posterior interval for crown Primates is 79.2–70.0 Ma; this model interval is not a fossil first appearance.
      confidence: medium
      confidenceRationale: Medium confidence reflects reproducible, explicitly sampled phylogenomic modelling while preserving the strong dependence of deep-node ages on calibration strategy, clock model and fossil priors.
      referenceLinks:
        - referenceId: dos-reis-2018-primate-clock
          relation: supports
          pages: 594–615
          figure: Figures 1–5; Table 3; Supplementary spreadsheet
          quoteLocator: "Results: A Timeline of Primate Evolution; Effect of calibration strategy and relaxed-clock model"
  claim-rationales.zh:
    - 中等置信度反映可复现且取样范围明确的系统发育基因组模型，同时保留深层节点年代对校准策略、时钟模型和化石先验的强依赖。
  claim-statements.zh:
    - 在所引自相关分子钟分析及校准策略 A 下，灵长目冠群的后验区间为 7,920 万至 7,000 万年前；这一模型区间不是化石首次出现时间。
