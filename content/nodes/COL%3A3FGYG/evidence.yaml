    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, 150-300 mm tall, tunics woody, imbricate, stem velvety. Leaves sword-shaped, margins and midrib lightly thickened. Flowers in a few-flowered spike, blue-violet, with white at tepal bases and in tube, perianth tube 18-25 mm, slightly longer than the tepals, tepals spreading, stamens usually slightly unequal.
            textZh: Geissorhiza kamiesmontana Goldblatt 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_14562_0
            locator: "SANBI/WFO archive Morphology row 33131; source identifier 14562.0; cited publication: Goldblatt, P; Manning, JC. 2013. Iridaceae. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 94 - 124. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Distinguished by its deep blue flowers, paler in the throat, with an elongate perianth tube, 18-25 mm long, shortly exceeding the long floral bracts. The style is relatively short, dividing opposite the lower third of the anthers. The stem and leaves have a heavy, almost velvety, pale pubescence. Both G. namaquensis and G. namaquamontana are vegetatively similar, with puberulous stems and leaves with raised and winged margins, but their flowers are paler blue to blue-mauve, with a shorter perianth tube only 6-11 mm long.
            textZh: SANBI 条目提供了 Geissorhiza kamiesmontana Goldblatt 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 94731; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
