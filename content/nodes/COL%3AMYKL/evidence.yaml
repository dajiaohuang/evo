        claims:
          - text: Perennial, culms straggling, slender, wiry, sometimes decumbent and rooting at lower nodes, up to 0.9 m high. Leaf blades 50-170 mm long, 2-8 mm wide, leaves mainly cauline, linear. Spikelets 12-44 mm long. Racemes 60-120 mm long, usually flexuous, with (3-) 5-9 spikelets spread along rhachis; lemma awn 4-8 mm long.
