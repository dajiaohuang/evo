            en: Supports the Masoala National Park study of nocturnal lemur taxonomy and the description of Moore’s woolly lemur; not an island-wide distribution census.
      - id: western2000
        referenceId: ref-5da80371-ee09-8434-a89b-f8849c3eb4cb
        fields:
