            en: Supports short telemetry and indirect observations in 1991, local call records, and locality information compiled by the authors in 2006; historical observations are not current range or abundance.
      - id: harcourt1991
        referenceId: ref-b7278ec2-94a8-883a-a034-727ec41c7c94
