            zh: 支持 2002—2006 年东部 14 处、西部 3 处共 55 只毛狐猴的细胞遗传与线粒体比较，以及三种东部分类单元的原始描述；不构成现今全种分布调查。
            en: Supports cytogenetic and mitochondrial comparisons of 55 woolly lemurs from 14 eastern and 3 western sites in 2002–2006 and the original descriptions of three eastern taxa; not a current range-wide survey.
      - id: avahi2007
