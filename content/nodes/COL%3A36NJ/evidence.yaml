            en: Supports geographic and pelage comparisons of western woolly lemurs and the description of A. unicolor; the taxonomic argument is tied to the sites and material available to that study.
      - id: cleesei2005
        referenceId: ref-c688eae4-e1bf-87a1-a014-c08fef94bc18
        fields:
