            zh: 支持约 3,000 bp 线粒体片段、形态与表型比较，以及该文对属内分类的解释；作者指出完整关系仍需更多样本。
            en: Supports the authors’ interpretation of roughly 3,000 bp of mitochondrial sequence together with morphological and phenotypic comparisons; the paper also calls for broader sampling.
      - id: avahi2008
        referenceId: ref-518b7023-475e-8a83-a47f-eeeb54fcc305
