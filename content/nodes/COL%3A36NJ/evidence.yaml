            zh: 支持 18 片未保护森林、97 条夜间样线（291.8 公里）和 208 次访谈的局地研究；样点约覆盖作者所述分布的三分之一，不等于全种现状普查。
            en: Supports a local study of 18 unprotected forests, 97 nocturnal transects (291.8 km) and 208 interviews; the sites represent about one third of the range described by the authors, not a full current census.
      - id: moore2016
        referenceId: ref-5b5386f3-7c07-8996-a316-bd0103b8a8d8
        fields:
