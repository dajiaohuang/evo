            en: Supports a one-month eastern Madagascar rainforest study centred on follows of one radio-collared male; not a species-wide behavioural rule.
      - id: laniger2026
        referenceId: ref-e394107b-d15a-8120-a9fe-69dc13ff5419
        fields:
          - id
          - title
          - url
          - scope
