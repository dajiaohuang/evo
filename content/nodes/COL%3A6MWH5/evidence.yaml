          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Vines; stems slender and herbaceous, lignescent especially near the base, probably a short-lived perennial, glabrous. Leaves ovate, 5-15 cm long, basally cordate, apically acuminate with an acute or obtuse mucronulate acumen, mostly entire, glabrous. Flowers in few- to several-flowered cymose groups terminating a peduncle that is often longer than the petiole; sepals ovate or the inner ovate- lanceolate, 5-10 mm long, apically acute, mucronulate, usually glabrous; corolla with a pink to lavender limb, the throat darker, 4-6 cm long. Fruits capsular, globose to depressed-globose, often 4-angled; seeds dark brown, rotund, glabrous.
