        claims:
          - text: SANBI lists the South African national assessment as Endangered D, assessed 2007-07-28 and shown in Red List version 2024.1. It describes a Kogelberg endemic with 10 subpopulations, each with fewer than 10 individuals, fewer than 250 mature individuals in total, and a stable recorded trend; groundwater extraction is a potential threat.
            textZh: SANBI 南非国家评估列为濒危 D，评估日期为 2007-07-28，页面列入 Red List 2024.1。评估记载其为 Kogelberg 特有种，有 10 个亚种群且每群少于 10 个个体，成熟个体总数少于 250，记录的趋势稳定；地下水抽取是潜在威胁。
