    facets:
      morphology:
        status: partially-supported
        claims:
          - text: A shrub about 0.5–1.2 m tall with dark-green, linear-lanceolate leaves, often somewhat sickle-shaped, and conspicuous crimson-red inflorescence bracts and orange-red tepals. The style exceeds the tepals by about 1–5 mm.
            textZh: 灌木高约 0.5–1.2 m，叶深绿、线状披针形，常略呈镰刀状；显著的花序苞片为深红色，花被片橙红色。花柱超出花被片约 1–5 mm。
