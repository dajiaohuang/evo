        usage:
          scope:
            en: "Radiotracking at Analamazaotra in 2007: one full four-adult sleeping group followed for eight months and one partial two-female group for three months; home-range values depend on MCP or kernel methods."
            zh: 2007 年在 Analamazaotra 开展无线电跟踪：一群四只成体的完整睡眠群观察八个月，另一组两只雌性的部分群体观察三个月；家域数值取决于 MCP 或核密度方法。
