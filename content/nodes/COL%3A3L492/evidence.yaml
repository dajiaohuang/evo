        claims:
          - text: Cormous geophyte, 18-20 cm, corm with a flat base. Leaves terete. Flowers white, pink on outside, bract margins united below around spike axis.
            textZh: Hesperantha juncifolia Goldblatt 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 6677; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Readily recognised by the smooth, terete leaves, outer bracts united around the spike axis in the lower half to one third, and white flowers with a straight perianth tube only 5-6 mm long. The flat-based corm and bracts united around the spike axis are typical of sect. Radiatae. Related H. radiata has plane and often somewhat succulent leaves, the outer bracts united for ± half their length, and a longer perianth tube mostly 7-15 mm long, curved in the upper half. Unusual for white-flowered species of the genus and section, the flowers open early in the morning and close at ± 16:00.
            textZh: SANBI 条目提供了 Hesperantha juncifolia Goldblatt 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 94887; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
