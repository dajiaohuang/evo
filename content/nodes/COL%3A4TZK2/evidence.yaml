    facets:
      morphology:
        status: not-assessed
        claims: []
        gaps:
          - The selected marker study does not assess diagnostic anatomy, measurements, or morphological variation.
      lifeHistory:
        status: not-assessed
        claims: []
        gaps:
          - The selected marker study does not assess development, reproduction, survival, or lifespan.
      ecology:
        status: not-assessed
        claims: []
        gaps:
          - The selected marker study does not assess habitat, behavior, food, predators, parasites, or ecological interactions.
      evolution:
        status: partially-supported
        claims:
          - text: Within the authors’ 32-individual squirrel-monkey DNA panel, 110 of 382 tested Alu insertion loci were polymorphic for insertion presence or absence; among these, 51 showed the study’s species-informative allele-frequency distributions between its S. sciureus and S. boliviensis groups. The authors note that two specimens labelled S. sciureus clustered more closely with S. boliviensis, so this result is limited to that marker panel and those study assignments and does not independently resolve species boundaries.
            sourceIds:
              - baker2018
            locator: Abstract > Results; Methods > DNA samples; Results > Species informative Alu polymorphisms, paragraph preceding Table 4; Table 4; identity caveat in Results > Population structure.
            placeTimeScope: Laboratory analyses of a 32-individual mixed-provenance DNA panel; the article does not state collection dates in the cited sections. The result is limited to study-labelled S. sciureus and S. boliviensis groups, with the authors’ specimen-identification caveat retained.
            lifeStatus: Tissue and DNA obtained from museums and research centres, with some captive-colony material reported; individual wild/captive status is not resolved for the full panel. No live field observations are used.
            originalLanguage: en
        gaps:
          - This single marker panel supports a narrow result about recent insertion polymorphisms and sample-group allele-frequency patterns; it does not supply a full species phylogeny, divergence-time estimate, or independently resolved species boundary.
      distribution:
        status: not-assessed
        claims: []
        gaps:
          - The study’s sample sources are not a range-wide distribution inventory; no native-range or change-through-time claim is made.
      fossil:
        status: not-assessed
        claims: []
        gaps:
          - No fossil evidence review or bounded fossil-record search was performed.
      conservation:
        status: not-assessed
        claims: []
        gaps:
          - The paper mentions potential relevance to conservation biology but does not provide a formal status, trend, or population-risk assessment.
