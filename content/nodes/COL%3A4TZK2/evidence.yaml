      method: Exact accepted COL26.8 usage 4TZK2 was verified in the release-pinned search registry for name, authorship, species rank, accepted status, and sourceDatasetId 2144; its accepted parent chain was followed by stable ID through the pinned hierarchy registry.
      scope: The dossier is keyed to accepted COL26.8 usage 4TZK2. The cited article compares author-labelled Saimiri sciureus and S. boliviensis sample groups and notes older or incomplete specimen labels; it does not independently establish the accepted species concept or override COL taxonomy.
      sourceIds:
        - col
    lifeStatusScope:
      wild: The cited sections do not establish field collection for the full DNA panel; no wild-population inference is made.
      domesticated: Domestication was not assessed.
      captive: The authors report some S. boliviensis samples from a captive breeding colony; individual-level captive status is not fully mapped here.
      fossil: No fossil material or geological time was studied.
