        claims:
          - text: Densely leafy shrub to 1 m. Leaves ascending, pinnatisect with linear to filiform lobes or sometimes entire, 60-90 mm long. Flower heads radiate, solitary on terminal peduncles woolly at base, yellow. Achenes glabrous, closely ribbed with terminal appendage.
            sourceIds:
              - sanbi_14144_0
            locator: "SANBI/WFO archive Morphology row 10380; source 14144.0; publication: Manning, JC; Goldblatt, P. 2012. Asteraceae: Euryops (Cass.) Cass. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 372 - 375. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: E. abrotanifolius can always be recognized on the achenes, which are glabrous, 10-nerved, and provided with a distinct apical appendage formed by the persistent stylophore. The well-developed stylophore is easily observed also in young florets. Similar (although smaller) achenes are found only in E. lasiocladus, which has lateral peduncles and is referred to a different section. Several other species have a superficial and sometimes very striking resemblance to E. abrotanifolius, e.g., E. pinnatipartitus, trilobus, inops, and rupestris, but they are readily distinguishable on examination of the floral parts, especially achenes and pappus. In vegetative characters E. abrotanifolius is highly variable, notably in shape and size of leaves and length of peduncles. This has led to the recognition by earlier authors of too many taxa, which have to be put into synonymy. The number of involucral bracts is usually about 13 but sometimes higher. The rays are sometimes red or coppery beneath. This character occurs in different parts of the distribution area, and since it is not constant within the populations or combined with other characters, I regard it as taxonomically unimportant.
