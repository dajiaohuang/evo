        claims:
          - text: "Perennial herb, up to 3 m high. Leaves sessile, lanceolate, glabrous with few silky hairs on and near midrib on abaxial surface, 600 x 110 mm, apex acuminate; ligule papyraceous, white or brown. Bracts green, ovate, subcoriaceous, overlapping, apex obtuse. Inflorescence with yellow and white or red and yellow, bisexual flowers. Calyx tubular, unilaterally splitting, glabrous. Corolla: tube up to 70 mm long, slender; petals 3, linear- lanceolate, equal, declined; labellum usually yellow-green in centre, deeply 2-lobed. Staminodes oblong-lanceolate; lateral petaloid. Stamens white, shorter than labellum; anthers 12 mm long. Ovary glabrous or hairy at flowering time, 5 mm long. Flowering time Dec.-Apr."
