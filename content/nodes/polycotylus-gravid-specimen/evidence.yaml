      claimType: ecology
      statement: Adult Polycotylus specimen LACM 129639 contains a large articulated conspecific fetus and therefore supports viviparity; maternal care, sociality and a K-selected life history are not directly preserved behaviours.
      confidence: high
      confidenceRationale: The adult-fetus association, anatomical position and taxonomic comparison are documented in a named specimen. The high confidence applies only to pregnancy and viviparity, not to the paper's broader life-history analogies.
