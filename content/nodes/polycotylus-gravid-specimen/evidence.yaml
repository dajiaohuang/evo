  claim-rationales.zh:
    - 成年个体与胎儿的关联、解剖位置和分类比较均记录于具名标本。高置信度仅适用于妊娠与胎生，不延伸至论文更广泛的生活史类比。
  claim-statements.zh:
    - 成年多椎龙标本 LACM 129639 含一具大型、关节相连的同种胎儿，因而支持胎生；母体照料、社会性和 K 选择生活史并非直接保存的行为。
