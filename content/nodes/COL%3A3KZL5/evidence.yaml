          - text: "Perennial herb, up to 1.2 m high; tufted. Stems erect. Leaves petiolate; blade ovate to elliptic, tending to fold, upper and lower surfaces with glabrescent hairs. Flowers: in 2- or 3-flowered cymes; cymes forming pseudo-panicles on short, lateral branches, interspersed with reduced but recognisable leaves; calyx deeply lobed; petals yellow, pale yellow; Jul.-Apr."
