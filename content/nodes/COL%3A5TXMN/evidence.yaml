        usage:
          title: Amaioua pedicellata Dwyer, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Trees 5-10 m tall, to 22 d.b.h., the branchlets terete, glabrous, the bark dis- colorous, the nodes well spaced. Leaves ovate-oblong, 6-19 cm long, 2.3-10 cm wide, widely deltoid toward the apex, attenuate-acuminate, the acumen to 1 cm long, falcate, ultimately acute, basally acute or cuneate, rarely obtuse, the costa prominulous above, prominent beneath, the lat-eral veins 12-14, rigid, especially prominent beneath, subcoriaceous, discolorous, above dark brown, yellow brown beneath, golden pilose with the veinlets pinnately disposed; petioles rigid, woody, to 1.5 cm long, the hairs golden, spreading or appressed; stipules not seen. In- florescences terminal (in fruit) radially-umbelliform, to 5 cm long, the peduncle absent, the pedicels to 1.5 cm long, rigid, puberulent. Flowers not seen except for a fragment of the calyx; calycine cup cylindrical, to 5 mm long, ca. 4 mm widej truncate, ciliate without and within, the hairs golden, appressed, the teeth 5, triangular-subulate, to 0.3 mm long, these arising from a thin keel on the body of the cup. Fruits ovate-oblong or oblong-rotund, to 1.5 cm long, black when dry, purple brown, lightly puberulent.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 11378
          archiveSourceId: 883E3E87-FA32-402E-9521-2749483FE76D
