          - text: E. spinescens is a robust shrub, up to 1 m high and in diameter, with rigid, strong spines. E. namaquensis, another closely related species, is a delicately branched shrub barely 400 mm tall and in diameter. The capitula of E. spinescens are relatively large, 4.5-5.2 mm long, and fairly shortly pedunculate, 0-3.5 (-5.0) mm long, to almost sessile, borne only terminally on brachyblasts. It is therefore easy to distinguish E. spinescens from the closely related E. karooicus and E. namaquensis, which are also spinescent, since E. karooicus has a small, but distinct ray lamina and sessile capitula and E. namaquensis has long-pedunculate capitula, solitary on brachyblasts, as well as in racemes borne terminally on dolichoblasts.
