        usage:
          title: Coccoloba padiformis Meisn., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Tree to 13 m. tall; branches terete, glabrous; ocreae membranaceous, obliquely truncate, 1 cm. long; petiole arising from the base of the ocreae, canaliculate above, glabrous, 10-18 mm. long; leaf blades oblong to oblong-obovate, apex short acuminate, base narrowed or rounded, 9.5 X 3.5, 13 X 6 to 18 X 8 cm. long and wide on normal shoots, to 26 X 12 cm. on vigorous shoots, glabrous, coriaceous when mature, margins slightly recurved, lateral veins 9-11 on each side, arcuate, leaves deciduous, the young leaves bright red to clear yellow, not turning black on drying; inflorescence solitary or to three in a cluster, racemose, 3-6 cm. long, basal ocreae one to several, coriaceous, slightly apiculate, glabrous, rachis terete, crispose puberulent, bracts minute to 1 mm. long, glabrous or puberulent, ocreolae mem- branaceous, conical or flaring, 1 mm. long, staminate flowers 1 or 2 at each nodule, pistillate flowers solitary at each nodule, pedicels horizontally divergent, 2 mm. long, puberulent or glabrous, hypanthium short, 0.5-0.75 mm. long, perianth lobes ovate-oblong, 1 mm. long, fertile stamens with subulate filaments 2 mm. long, fertile pistil 2 mm. long; fruiting pedicels 3-5 mm. long, fruit globose, 8-9 mm. in diameter when dry, perianth lobes imbricate and distinct for '4 to '3 the length of the fruit; achene pale green to tan, smooth and often shining, not coronate, hypanthium moderately veined when dry.
          originalLanguage: en
          sourceField: general
