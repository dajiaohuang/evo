        usage:
          title: Clibadium anceps Greenm., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Scandent shrub 3-6 m tall; stems at least 4 mm diam. (base not seen), antrorsely strigose with hairs 0.3-0.5 mm long. Leaves ovate to narrowly ovate, conspicuously 5-veined from near base; blades 10-15 cm long, 4.5-9 cm wide, acuminate, the base obtuse (sometimes shortly attenuate), the margin serrulate, both surfaces glabrate to sparsely strigillose with hairs 0.3 mm long, on midrib and major lateral veins markedly strigose with hairs up to 0.6 mm long; petioles 2-3.3 cm long, 0.7-1.5 mm diam., strigose (markedly so on adaxial side) with hairs up to 0.5 mm long. Inflorescence of 56-119 heads in a capitate panicle, with clusters of 3-6 sessile heads terminating all axes. Heads radiate; involucre funnelform, 3-4 mm tall, 3-5 mm across, the bracts 5-7, ovate, 3.5-4 mm long, 2-3 mm wide, abaxially strigose with hairs 0.3 mm long, the upper one-third of margin ciliate; paleas absent; ray florets 3-4, the corollas 2.2 mm long, 0.9 mm diam., the 4 lobes 0.2 mm long, the styles 3.3 mm long with the branches 1.8 mm long; disc florets 6-7, the corollas 3.3 mm long, the throat 2.3 mm long and 1 mm diam., the lobes 0.4 mm long, apically comose, the tube 0.4 mm diam., the anthers 2 mm long, the style 5 mm long, the ovary sterile, 2 mm long, 0.3 mm diam., villous (especially at apex) with hairs 0.6 mm long. Achenes 2 mm long, 1.2 mm diam., glabrous. Chromosome number unknown.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 1753
