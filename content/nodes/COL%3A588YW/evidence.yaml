        usage:
          title: Trichilia trifolia L., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrub or tree to 10 m. tall. Leaves 1-1.5 cm. long, 1- or 3-foliate; leaflets 1.5-7 cm. long, 1-4 cm. wide, obovate to elliptical, the base subacute, the apex emarginate to rounded, rarely obtusely short-acuminate, glabrous on both sides, rarely with the rachis, petiolules and principal veins scattered-puberulent. Inflorescences axillary, crowded-racemose and appearing to be fascicled, glabrous or scattered puberulent; bracts persistent, deltoid-naviculate. Flowers white, 4- to 6-merous, 2-3 mm. long; calyx cupulate, shallowly lobed, the lobes deltoid, glabrous; corolla glabrous; stamens twice as many as the petals, nearly the same height as the corolla, united for the basal 1/3; filaments broad, glabrous without, pilose within, tipped with 2 elongate, deltoid apicula which may nearly hide the anther from without; ovary densely sericeous; stigma sphaeroidal-capitate. Fruit an obovoid capsule 0.5- 0.75 cm. long, glabrate or scattered pilose, usually 3-valved, 1- to 2-seeded; seeds arillate.
          originalLanguage: en
          sourceField: general
