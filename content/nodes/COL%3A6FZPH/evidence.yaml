    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Tufted erect perennial, up to 600 mm high; geniculate, sometimes rooting at lower nodes; basal sheaths papery, nerves round, not close together or forming prominent ridges, glabrous or slightly hairy. Leaf blade up to 250 x 1.5-2.8 mm; ligule a fringe of hairs. Inflorescence an open, lax panicle, branches 1 or 2 at base, not whorled. Spikelets 4-8 x 1.0-1.5 mm, linear to oblong, laterally compressed, dark green, grey-green to red with yellow; rachilla subpersistent, fragile in upper portion; glumes shorter than spikelet, 1-nerved. Florets many; lemma entire, 3-nerved; palea margins wide apart, keels thin, narrow, glabrous or scaberulous; anthers 3, 1.0 mm long. Flowering time Nov.-June. Caryopsis oblong.
