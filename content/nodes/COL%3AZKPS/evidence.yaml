    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Perennial herb, geophyte, 0.5-0.8 m high; corm globose, tunics brown, fibrous, in superposed rows; stem suberect, branched. Leaves ± lanceolate-acuminate, plicate, up to 600 x 20-50 mm, base stalk-like. Bracts green, becoming dry on apex; outer apiculate; inner bifid and shorter than outer. Inflorescence a horizontally curved spike, usually simple, may have ascending branches; flowers orange-scarlet, zygomorphic, facing apex, secund on upper side; tube funnel-shaped, curving upwards; lower part smaller and cylindrical; lobes slightly unequal, spreading, dorsal larger, suberect. Stamens exserted, unilateral. Style exserted, often overtopping anthers; stigma slightly widened or shortly bifid, fimbriate. Flowering time Dec., Jan. Capsule depressed-globose; 3-lobed.
