          - text: Perhaps the loveliest of all Crocosmia species, C. masoniorum, the swan crocosmia, is recognised by the broad, pleated leaves, and the brilliant orange flowers borne on inclined stems with crowded spikes held horizontally. The flowers have a perianth tube 18-25 mm long and spreading, somewhat flaccid tepals, with the rather stiff, diverging stamens prominently displayed.
