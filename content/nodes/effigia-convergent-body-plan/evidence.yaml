  claim-statements.zh:
    - AMNH FR 30587 保存了近完整、无齿且体态纤细的主龙类骨架；论文的性状分析将其置于伪鳄类，和似鸟龙类兽脚类的相似性被解释为趋同，而非共同直系祖先或相同生态。
