  claims:
    - subjectId: event:effigia-convergent-body-plan
      claimKind: scientific
      claimType: topology
      statement: AMNH FR 30587 preserves a nearly complete edentulous, gracile archosaur skeleton that the published character analysis places within Suchia; resemblance to ornithomimid theropods is interpreted as convergence, not shared ancestry or identical ecology.
      confidence: medium
      confidenceRationale: The named skeleton and scored anatomy are direct evidence. Medium confidence keeps the matrix placement and convergence diagnosis distinct from unmeasured locomotion, diet and ancestry.
