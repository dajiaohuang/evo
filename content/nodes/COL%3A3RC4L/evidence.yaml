        usage:
          title: Kohleria allenii Standl. & L.O.Williams, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Woody herbs; stem round or angled, erect or ascending, 1.0-1.5 m tall, reddish above, brownish below, pilose. Leaves 2-4 at a node, reduced above. lanceolate to ovate, 5-8 cm long, 2.5-4.0 cm wide, acute to acuminate, serrulate, reddish, the base acute to subtruncate, above dark green, sparsely pilose to scabrous, below light green, densely pilose; petioles 0.5-2.0 cm long. Inflores- cences few flowered in the axils of the upper reduced leaves; peduncles not evident; bracts ovate, ca. 5 mm long, green, pilose; pedicels elongate, ca. 4 cm long, green or reddish, pilose. Flowers showy, the floral tube oblique, gibbous to 1 side, rounded, green or reddish, pilose; calyx 5-lobed, the lobes connate briefly at the base, triangular ovate, 5-8 mm long, accrescent in fruit, green with red margins, pilose; corolla cylindric campanulate, 25-30 mm long, ca. 5 mm wide at base, broadening to 1.5 cm broad at middle and above, yellow with red hairs outside, inside red maculate, glandular; stamens 4, equalling the corolla, the anthers coherent in 2 pairs; disc sublobate; ovary apex pilose, the style ca. 2 cm long, the stigma bilobate. Fruit many seeded enclosed in the persistent calyx; seeds fusiform, acuminate at both ends, ca. 0.25 mm long, striate.
          originalLanguage: en
          sourceField: general
