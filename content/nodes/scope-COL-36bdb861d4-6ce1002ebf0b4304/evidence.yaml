  claims:
    - subjectId: taxon:macaca_silenus
      claimType: taxonomy
      claimKind: scientific
      statement: COL26.8 dataset 316115 records accepted species usage 3WWP6 as Macaca silenus (Linnaeus, 1758), with Macaca usage 5HYC as its immediate parent. This records checklist identity and classification only.
      confidence: medium
      confidenceRationale: COL26.8 explicitly records accepted usage 3WWP6 and immediate parent usage 5HYC. The claim reports this checklist placement alone and makes no biological or phylogenetic inference.
      referenceLinks:
        - referenceId: col-2026-checklistbank-316115
          relation: supports
          pages: Accepted species usage 3WWP6; immediate parent usage 5HYC Macaca; accepted classification through Primates usage 3W7
    - subjectId: taxon:macaca_silenus
      claimType: biogeography
      claimKind: scientific
      statement: The selected studies sampled wild lion-tailed macaques at 15 named Western Ghats sites across Karnataka, Kerala and Tamil Nadu during 2010–2012, and observed one troop at Puthuthottam, Tamil Nadu, in 2016. These are study locations, not a complete current range inventory.
      confidence: high
      confidenceRationale: Both primary studies identify their sampled locations directly. The statement retains study-site scope and makes no full-range inference.
      referenceLinks:
        - referenceId: ram-2015-lion-tailed-macaque-western-ghats
          relation: supports
          pages: Methods, Study area and Sample collection; Figure 1
        - referenceId: dhawale-2020-lion-tailed-macaque-habitat-behaviour
          relation: supports
          pages: Methods, Study area and Study troop and individuals; Figure 1
    - subjectId: taxon:macaca_silenus
      claimType: ecology
      claimKind: scientific
      statement: From February to May 2016, researchers followed one habituated, free-ranging troop at Puthuthottam for over 480 hours across forest interior, forest edge, an open forest patch and human settlement. In this troop, active foraging was higher in the open patch and forest edge, and lower in the settlement than the forest interior; the activity budget differed between the interior and settlement. This single-troop dry-season study does not establish species-wide ecology or a causal effect of habitat modification.
      confidence: medium
      confidenceRationale: The article reports the study troop, dates, follow-hours, habitat classes and modelled behaviour comparisons directly. The observations concern one troop in one dry-season study and do not establish species-wide ecology or causal effects.
      referenceLinks:
        - referenceId: dhawale-2020-lion-tailed-macaque-habitat-behaviour
          relation: supports
          pages: Methods—Study area, Study troop and individuals, Field methods; Results—Ecological and behavioural responses; Figure 3
    - subjectId: taxon:macaca_silenus
      claimType: divergence-time
      claimKind: scientific
      statement: Ram et al. recovered north- and south-of-Palghat-gap mitochondrial clades among sampled lion-tailed macaques. A fossil-calibrated analysis of 893 mitochondrial bases estimated a mean time to their most recent common ancestor of 2.11 Ma; this is a regional marker-based model estimate, not a genome-wide species split date.
      confidence: medium
      confidenceRationale: The sampled clades and model estimate are reported directly, but the date comes from a fossil-calibrated analysis of 893 mitochondrial bases and is not a genome-wide species split estimate.
      referenceLinks:
        - referenceId: ram-2015-lion-tailed-macaque-western-ghats
          relation: supports
          pages: Results, Genetic structure and diversity; Figure 4; Table 2
    - subjectId: taxon:macaca_silenus
      claimType: fossil-range
      claimKind: scientific
      statement: The selected COL26.8 identity record and the cited living-population studies do not establish a numerical temporal fossil range or complete current geographic range for Macaca silenus; numerical range endpoints remain withheld.
      confidence: low
      confidenceRationale: The checklist establishes accepted identity and the selected sources study living populations or regional genetic history; none provides a reviewed temporal fossil-range endpoint or complete distribution inventory.
      referenceLinks:
        - referenceId: col-2026-checklistbank-316115
          relation: supports
          pages: Accepted usage 3WWP6; identity and classification only
        - referenceId: ram-2015-lion-tailed-macaque-western-ghats
          relation: supports
          quoteLocator: Regional mitochondrial study; no species fossil-range inventory
        - referenceId: dhawale-2020-lion-tailed-macaque-habitat-behaviour
          relation: supports
          quoteLocator: Living-troop field study; no temporal fossil-range estimate
  claim-rationales.zh:
    - 固定版 COL26.8 明确记录了接受用名与直接父级。本主张仅限于清单身份，不推断生物学特征或系统发育关系。
    - 两篇一手研究都直接列出了各自的取样地点；陈述保留研究地点范围，不扩展为完整分布区。
    - 论文直接报告猴群、时间、跟踪时长、栖息地分类和行为模型比较。观察仅来自一个猴群和一次旱季研究，不能确立全物种生态规律或因果效应。
    - 受采样的分支及模型估值由论文直接报告，但年代来自 893 个线粒体碱基的化石校准分析，并非全基因组物种分化日期。
    - 清单支持接受身份；所选来源研究现生种群或区域遗传史，均未提供经审查的化石年代端点或完整分布名录。
  claim-statements.zh:
    - COL26.8 数据集 316115 将 3WWP6 记录为接受的 Macaca silenus（Linnaeus, 1758）种级用名，直接父级为 Macaca 用名 5HYC。此陈述仅记录清单身份与分类位置。
    - 所选研究于 2010—2012 年在卡纳塔克邦、喀拉拉邦和泰米尔纳德邦的西高止山脉 15 个具名地点采集野生狮尾猕猴样本，并于 2016 年在泰米尔纳德邦普图托坦观察一个猴群。这些是研究地点，不是完整的当前分布区名录。
    - 2016 年 2 月至 5 月，研究者在普图托坦跟踪一群已习惯观察者、自由活动的狮尾猕猴，累计超过 480 小时，覆盖林内、林缘、开阔林地斑块和人类居住地。在该猴群中，开阔斑块和林缘的主动觅食高于林内，人类居住地低于林内；林内与居住地的活动时间预算也有差异。这项单群体旱季研究不能确立全物种生态规律或栖息地改变的因果效应。
    - Ram 等人在受采样的狮尾猕猴中识别出帕尔加特山口以北和以南的线粒体分支。基于 893 个线粒体碱基的化石校准分析，将其最近共同祖先的平均时间估为 2.11 Ma；这是区域性、基于标记的模型估计，不是全基因组物种分化日期。
    - 所选 COL26.8 身份记录和现生种群研究未确立 Macaca silenus 的数值化年代范围或完整当前地理分布；年代范围端点继续保留未定。
