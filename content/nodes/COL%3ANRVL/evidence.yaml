    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants epiphytic or epilithic, with stout rhizomes 3-4 mm in diameter; pseudobulbs ovoid to narrowly conical, 4-5 angled, pale green, 30-50 mm apart, 15-30 x 10-17 mm; leaves leathery, erect, narrowly oblong, rounded, emarginate, 25-80 x 15-20 mm. Inflorescence an erect, 90-260 mm tall spike with 24-40 flowers; peduncle slender, sheaths lax to imbricate, acute, 10-15 mm long; rhachis swollen, flattened; bracts acute, to 5 mm long. Flowers open, dull purplish-violet, the inner surface of the lateral sepals striped white and purple. Sepals unequal; median linear, concave, hooding the flower with the apex recurved, acute, 9 x 1 mm; laterals triangular, acuminate, 6 x 4 mm. Petals linear, tapering to an acute apex, 7 x 0.2 mm. Lip ovate, fleshy, ecallose, 4 x 2.5 mm. Gynostemium curved, 3 mm long. Capsules ellipsoid, 10 x 5 mm.
