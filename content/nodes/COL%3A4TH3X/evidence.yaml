        usage:
          title: Roupala montana Aubl., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Trees to 20 m. tall, the young stems terete, ferrugineous-strigillose and glabres- cent. Leaves heteromorphic; juvenile leaves pinnately compound, generally larger than the adult forms, the number of leaflets extremely variable even on a single branchlet, margin generally coarsely serrate or sometimes undulate, the veins con- spicuous; adult leaves ovate, 5-12 cm. long, 2-9 cm. broad, acute or acuminate at the apex, cuneate to more or less obtuse at the base and often decurrent upon the petiole, subcoriaceous or coriaceous, ferrugineous-strigillose and glabrescent above and below, the costa plane to immersed above, emersed below, the primary lateral veins numerous, conspicuous, the margin entire, undulate to variously dentate or serrate, often repand; petiole 1-6 cm. long. Inflorescence racemose, terminal or more often axillary, multi-flowered, the rhachis 6-15 (-18) cm. long, tomentose, the flowers borne singly or in pairs. Tepals linear-oblanceolate, 7.0-8.5 mm. long, about 1 mm. broad, widely reflexed, strigillose without, glabrous within; stamens inserted about at the middle of the perianth, the anthers linear-oblong, 2-3 mm. long, 0.5 mm. broad, the filaments about 0.5 mm. long, glabrous; hypogynous glands about 0.5 mm. tall, carnose, glabrous; ovary about 1 mm. long, 1 mm. in diameter, densely strigose, the style about 3 mm. long, glabrous, the stigma narrowly clavate; pedicel to 3 mm. long, strigillose. Fruit a flattened follicle, often minutely spurred at the base, 2.5-4.0 cm. long, about 1.5 cm. broad, glabrous, the winged seeds oval, 1.5 cm. long, 0.8 cm. broad.
          originalLanguage: en
          sourceField: general
