    facets:
      morphology:
        status: partially-supported
        claims:
          - text: The regional grass treatment describes a tufted perennial to about 400 mm tall, with a bulbous base in persistent woolly sheaths and a dense, clustered inflorescence. Its species account gives 3–5-nerved glumes, 7–12 mm lemmas and a geniculate central awn 6–16 mm long.
            textZh: 区域禾草志记载该种为高至约 400 mm 的丛生多年生草本，基部膨大并被持久的绵毛状叶鞘包围，花序密集成簇。物种账户记载颖片具 3–5 脉、外稃长 7–12 mm，中央芒长 6–16 mm 且膝曲。
            sourceIds:
              - sanbi-grasses
            locator: Printed pp. 357–358; SANBI archive Morphology row 80677 and Habitat row 80391; Strelitzia 29 p. 212 species account.
            placeTimeScope: Species account in a 2015 southern African grass treatment; measurements and diagnostic wording retain that account’s scope.
            lifeStatus: Wild flora description; cultivation is not covered.
        gaps:
          - Variation among populations and stages, full diagnostic comparison, and the range of applicable measurements have not been comprehensively reviewed.
      lifeHistory:
        status: partially-supported
        claims:
          - text: The flora account reports flowering September to December, and reports that flowering typically occurs in the first year after fire. Linder et al. describe Geochloa species as geophytes with swollen rhizomes; this supports only the cited growth-form and fire-timing observations, not a complete annual life cycle or reproductive system.
            textZh: 植物志账户记载花期为9–12 月，并称其通常在火后第一年开花。Linder 等将 Geochloa 物种描述为具膨大根茎的地生植物；这些材料仅支持所引生长型与火后开花观察，不构成完整年度生活史或繁殖系统说明。
            sourceIds:
              - sanbi-grasses
              - linder2010
            locator: Strelitzia 36, species-specific flowering statement on p. 357–358; Linder et al. 2010, p. 323.
            placeTimeScope: Regional southern African observations in publications from 2010 and 2015; site-level fire interval and population frequency are not generalized.
            lifeStatus: Wild flora observations; cultivated phenology is not covered.
        gaps:
          - Seed germination, dormancy, pollination, mating system, recruitment and a complete seasonal cycle remain unreviewed.
      ecology:
        status: partially-supported
        claims:
          - text: The regional account places it on sandy soils on mountain slopes in the southern and southwestern Cape and reports flowering in the first year after fire.
            textZh: 区域账户记载其生于 southern and southwestern Cape 的山坡砂质土壤，并报告其在火后第一年开花。
            sourceIds:
              - sanbi-grasses
              - sanbi-strelitzia29
            locator: Printed pp. 357–358; SANBI archive Morphology row 80677 and Habitat row 80391; Strelitzia 29 p. 212 species account.
            placeTimeScope: Habitat statements are limited to the cited southwestern/southern Cape flora treatments; no global niche or complete interaction network is implied.
            lifeStatus: Wild habitats only; cultivated ecology is not covered.
        gaps:
          - Species interactions, population-level responses, non-fire disturbance, and ecological variation beyond these regional accounts have not been reviewed.
      evolution:
        status: partially-supported
        claims:
          - text: Linder et al. erected Geochloa for three species formerly placed in Danthonia and Merxmuellera, using their Danthonioideae molecular phylogeny together with comparative morphology. The paper describes the genus as a geophytic clade and discusses its swollen, starch-storing rhizomes and woolly sheaths; no divergence date or species-level genomic result is inferred here.
            textZh: Linder 等依据 Danthonioideae 分子系统发育与比较形态，将此前置于 Danthonia 和 Merxmuellera 的三个物种归入 Geochloa。论文将该属描述为地生植物支系，并讨论其膨大、储存淀粉的根茎及绵毛状叶鞘；此处不推断分歧年代或种级基因组结果。
            sourceIds:
              - linder2010
            locator: Linder et al. 2010, pp. 322–324, discussion and included species; DOI 10.3417/2009006.
            placeTimeScope: The claim concerns the 2010 sampled Danthonioideae phylogeny and comparative analysis, not a current genome-wide species tree.
            lifeStatus: Wild taxa as treated in the study; no cultivated or fossil lineage claim is made.
        gaps:
          - Sampling details and support for this species’ exact position, later phylogenetic revisions, reticulation, and any divergence-time evidence have not been comprehensively assessed.
      distribution:
        status: partially-supported
        claims:
          - text: The regional treatment labels it endemic to the Western Cape; the 2012 Core Cape flora gives a regional range from the Bokkeveld Mountains to Hermanus.
            textZh: 区域植物志将其标为 Western Cape 特有；2012 年 Core Cape 植物志给出的区域范围为 Bokkeveld Mountains 至 Hermanus。
            sourceIds:
              - sanbi-grasses
              - sanbi-strelitzia29
            locator: Printed pp. 357–358; SANBI archive Morphology row 80677 and Habitat row 80391; Strelitzia 29 p. 212 species account.
            placeTimeScope: Regional distribution statements from 2012 and 2015; no global occurrence completeness, introduced range, or dated range change is inferred.
            lifeStatus: Wild regional distribution; cultivated and introduced occurrences are not assessed.
        gaps:
          - A dated, specimen-backed review across the entire native and any introduced range has not been completed.
      fossil:
        status: not-assessed
      conservation:
        status: not-assessed
