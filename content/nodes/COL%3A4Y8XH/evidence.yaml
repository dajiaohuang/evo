        usage:
          title: Sommera donnell-smithii Standl., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Trees to 40 ft tall, the branches terete, glabrous to puberulent drying black brown, often ultimately angular. Leaves oblong to obovate oblong, to 25.5 cm long, to 14 cm wide, cuneate at the apex, cuspidate, the cusp to 2 cm long, 0.3- 0.4 cm wide in the middle, acute or cuneate, often slightly inequilateral at the base, the costa prominulous above, prominent beneath, to 0.25 cm wide proxi- mally, the lateral veins 10-17, strict then arcuate, prominulous beneath, the in- tervenal areas lineolate, papyraceous, appressed strigose villose above, villose beneath, often densely so on the costa and secondary veins; petioles to 3.5 cm long, to 0.25 cm wide, pubescent; stipules connate, lanceolate, 1.5-3.5 cm long, acute, thin caducous. Inflorescences axillary, to 6 cm long, the peduncles to 2 cm long, strongly ascending, golden villose, the rachis often with 1-2 pairs of opposite branches, the flowers numerous in cymules, corymbs or racemes. Flow- ers on pedicels to 8 mm long; hypanthium broadly rotund, truncate, the 5 calycine teeth united into a short tube, unequal, oblong, to 7 mm long, obtuse, petaloid, venose, marginally pubescent; corolla white, the tube compressed cylindrical, to 4 mm long, ca. 2 mm wide, puberulent outside, the lobes oblong, as long as the tube, villose adaxially; stamens 5, the anthers small, oblong, to 0.8 mm long, obtuse, dorsifixed, the filaments short, attached above the middle of the tube; ovarian disc cushionlike, the style to 2.5 mm long, glabrous, the stigmas 2, sub- ulate, erect, crassate, pubescent, ca. 1.5 mm long, the ovary thickly walled, bilocular, the septum thin, the ovules numerous on 2 intrusive placentas. Fruits baccate, rotund or oblong, ca. 1 cm in diam., the calycine tube and lobes persis- tent, cylindrical, the pericarp densely villose, turning red or red black at maturity.
          originalLanguage: en
          sourceField: general
