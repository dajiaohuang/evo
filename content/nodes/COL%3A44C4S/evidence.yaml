          - text: Distinctive among the eastern southern African species of sect. Vieusseuxia in its attractive dark purple flowers with yellow nectar guides, and 3-lobed inner tepals, the linear central lobe shorter or sometimes longer than the lateral lobes which have rounded, expanded tips.
