    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants 200-300 mm high, often with a collar of fibres around base. Corm ± 10 mm diam.; tunics of fine, light brown fibres. Stem simple, rarely 1-branched, 3 internodes long, sheathing leaves 2, with dry, brown, attenuate apices, 35-55 mm long. Foliage leaf solitary, basal, linear, narrowly channelled, sometimes appearing ± terete but with adaxial grove, ± as long as stem, 2-3 mm wide. Rhipidial spathes with dry, brown, attenuate apices, inner ± 50 mm long, outer slightly < 1/2 as long. Flowers long-lived, purple, outer tepal limbs with yellow nectar guides at bases, half reflexed; outer tepals 25-30 mm long, limb 16-18 mm long, claws ± 2/3 as long; inner tepals 5-10 mm long, 3-lobed, lateral lobes linear with expanded apex, obtuse, inner lobe linear, acute, either shorter or longer than lateral lobes. Filaments 5-6 mm long, united in lower half; anthers ± 6 mm long, mauve; pollen yellow. Ovary cylindric-ellipsoid, 6-9 mm long; style branches ± 8 mm long, crests lanceolate, 5-6 mm long. Capsules ellipsoid, 9-11 mm long. Seeds angular-prismatic.
            textZh: Moraea dracomontana Goldblatt 的 SANBI 物种条目记载了植株、叶片和花部形态。
