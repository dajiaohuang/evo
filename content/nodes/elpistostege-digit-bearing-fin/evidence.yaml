  claims:
    - subjectId: event:elpistostege-digit-bearing-fin
      claimKind: scientific
      claimType: morphology
      statement: Computed tomography of articulated Elpistostege specimen MHNM 06-2067 reveals four proximodistal radial rows, branched carpals and two distal rows interpreted as digits or putative digits, while lepidotrichia show that the appendage remained a fin.
      confidence: medium
      confidenceRationale: A single exceptionally complete specimen and CT reconstruction directly document the internal skeleton and retained fin rays. Medium confidence preserves the interpretive status of digit homology and the analysis-dependent potential sister position of Elpistostege rather than treating either as permanent consensus.
      referenceLinks:
        - relation: supports
          referenceId: cloutier-2020-elpistostege-hand
          pages: 549–554
          figure: Figures 1–5; Extended Data Figures 1–2
          quoteLocator: Abstract; pectoral-fin description; comparative anatomy and phylogenetic analyses
  claim-rationales.zh:
    - 一件异常完整的标本和 CT 重建直接记录了鳍内骨骼及保留的鳍条。中置信度保留指同源性的解释属性，以及 Elpistostege 潜在姐妹群位置对分析方法的依赖，不把二者当成永久共识。
  claim-statements.zh:
    - 对关节保存的 Elpistostege 标本 MHNM 06-2067 进行 CT 扫描，显示四列近—远端辐骨、分支腕骨和两列被解释为指或候选指的远端骨列；而鳍条说明该附肢仍是鳍。
