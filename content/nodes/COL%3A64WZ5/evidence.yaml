          publishedAt: undated
          originalSourceText: Shrubs or small tree to 5 m tall, often with a disagreeable or nauseous odor; trunk to 15 cm in diameter; bark grayish, rugose; branches obsoletely tetragonal This content downloaded from 192.104.39.2 on Thu, 9 May 2013 15:26:14 PMAll use subject to JSTOR Terms and Conditions116 ANNALS OF THE MISSOURI BOTANICAL GARDEN [VOL. 60 or subterete, stout, hirsute-lanate or tomentose becoming fuscous in age; branch- lets obtusely tetragonal, mostly hirsute. Leaves opposite; chartaceous, usually drying dark, obovate-oblong or ovate-elliptic to elliptic, 6-19 cm long and 2-8.5 cm wide, attenuate-acuminate or acute, entire or with a few coarse, remote teeth above the middle, basally acute or acuminate and often narrowed into the petiole, sometimes inequilateral, mostly hirtellous above, more densely and softly canes- cent- or flavescent-pubescent beneath, the larger venation usually conspicuous beneath by its dense and divergent pubescence; petioles weak, 4-11 mm long, mostly densely pubescent. Inflorescences axillary cymes and terminal panicles, the cymes solitary, opposite, corymbose or paniculate, trifid-dichotomous, many- flowered, bracteate, 1/3-1/2 as long as the subtending leaves, divergent, sometimes gradually diminishing in size into the terminal panicle; the panicles thyrsoid, pyramidal or conic, to 17 cm long and 10 cm wide, often trichotomous, bracteate and foliose below, sometimes naked above, the sympodia tetragonal, decussately flattened at the nodes, fastigiate, densely pubescent, the branches divaricate, opposite or sometimes crowded, dichotomous, densely pubescent; peduncles terete or tetragonal, 1-5.5 cm long, densely yellowish-pubescent; pedicels 1-3 mm long, slender, pubescent; bracts large and foliaceous in pairs at the branches of the thyrse, lanceolate, stipitate, ca. 2 cm long and 6 mm wide, acute at both ends, sparsely pubescent on both surfaces; bractlets narrow or setaceous, 5 mm long; prophylls linear, minute. Flowers fragrant; calyx campanulate, 2-3.3 mm long and ca. 3.6 mm wide, subquadrangular, basally acute, veiny, densely pubescent out- side, lax around the corolla-tube, subtruncate, repand or 4-mucronulate with short acute mucros; corolla infundibular or hypocrateriform, white to yellow, the tube narrow-cylindric, 3.7-5.3 mm long, much ampliate above, the lobes 4, oblong or sometimes ovate-elliptic, ca. 4 mm long and 2 mm wide, pilose outside, acute or subacuminate; stamens 4, inserted ca. 1.3 mm below the mouth of the corolla- tubeJ long exserted in the staminate flowers, equaling the corolla-tube or included in the pistillate, the filaments 1-10 mm long, slightly compressed, pilose; pistil included in the staminate flowers or long-exserted in the pistillate, the style 1-8.7 mm long, glabrous, the stigma branches 1-4 mm long, the ovary subrotund or ovate, ca. 0.8 mm long and wide, apically flattened and 4-lobed, glabrous, 4-celled. Fruit oblong or obtusely ovate, orange, 2-4-seeded; fruiting-calyx greatly enlarged and indurated, cupuliform, pronouncedly tetragonal, truncate.
