          - text: Bulbine torsiva has a superficial resemblance to B. quartzicola but differs in possessing up to 4 or 5 basal leaf-sheaths and distinctly spiralled leaves, which are not simply curled towards the apex. The flowers are also very interesting in that they droop at approximately 45° and only open after midday.
