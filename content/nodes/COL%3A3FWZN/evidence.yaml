    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Shrub or tree up to 10 m high. Branches greyish-brown to brown, pubescent at ends. Leaf-blade elliptic, 2.6-6.5 cm long, 1-2.5 cm wide, apex acute to obtuse, base narrowly to broadly cuneate, margin callose-serrulate to serrate, sometimes only in upper 2/3, thickened, revolute, midrib prominent below, lateral nerves 9-13, subprominent below, tertiary nerves reticulate, immersed, glabrescent, coriaceous, pale green below; petiole 2-7 mm long. Inflorescence an axillary cyme; peduncles erect, 1-4 cm long, slender. Flowers 2-6 per cyme; pedicels 1-3 mm long. Calyx-lobes yellowish, unequal, margins entire or glandular-denticulate, faintly keeled; 2 outer rounded, c. 1.5 mm diam.; 3 inner elliptic to obovate-spathulate, 2-3 mm long, 2 mm wide. Petals elliptic, 2 mm long, 1.5 mm wide, deciduous. Stamens 1 mm long with filaments reddish distally; anthers c. 0.7 mm long. Disc shallowly 5-lobed, reddish-brown. Ovary depressed ovoid, 8-ridged radially above, 1-locular; ovules 4, pendulous; style 1 mm long, reddish distally; stigma capitate, faintly biolobed, free. Fruit bright red, a dry capsule with persistent style, globose, 5-6 mm diam.; seed 1, brown, ellipsoid-obovoid, 4 mm long, 2.2 mm wide, testa smooth, brown.
