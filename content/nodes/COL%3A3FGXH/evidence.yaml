        claims:
          - text: Cormous geophyte, 14-25 cm, tunics soft. Leaves sword-shaped to linear, soft. Flowers pink.
            textZh: Geissorhiza elsiae Goldblatt 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 6772; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Geissorhiza elsiae is distinguished by its large, purple flowers with tepals 15-20 mm long, 1- to 4-flowered spike, and few-branched habit; branches, when present, are produced from the upper nodes rather than from near the base. It is probably most closely allied to the more widespread southern Cape species, G. inconspicua which has smaller flowers, usually violet or white in colour.
            textZh: SANBI 条目提供了 Geissorhiza elsiae Goldblatt 的鉴别特征。
