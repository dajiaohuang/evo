        claims:
          - text: Erect or sprawling shrublet to 100(-200) cm. Leaves cauline, linear, rolled, deciduous to expose dark internode. Spikelets 15-30 mm long, in a narrow, interrupted panicle, all 3 awns distinctly plumose, spikelet callus pungent.
