    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Bulb up to about 12 cm tall and 7-8 cm in diam.; the neck of old leaf bases rising slightly above ground level. Leaves arising with the inflorescence, about 15 up to 50 cm long, 4-10 cm broad, distichous, lorate, green, shining, glaucous, with undulate margins. Peduncle slightly compressed, 4-5.5 x 2-2.5 cm broad, 30-45 cm tall, glaucous, spathe-valves reddish, oblong, 9.5 cm long, 5 cm broad. Umbel 35-80 flowered. Pedicels up to about 30 cm long, 7-8 mm thick near the base, tapering above, with 6 ribs, glaucous. Perianth claret-coloured, 4.5-5.5 cm long, united into a tube for 5-7 mm at the base, lobes recurved; the three outer with few glandular hairs within apex, 5-7 mm broad; inner lobes 6-9 mm broad. Filaments red, inserted in the perianth tube, about equalling the perianth. Ovary green, inconspicuously triangular, 1.5 cm long, 8-10 mm diam. Style red, slightly shorter than the stamens.
            textZh: Brunsvigia undulata F.M.Leight. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
