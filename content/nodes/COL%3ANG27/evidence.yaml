            locator: "SANBI/WFO archive Morphology row 60606; source identifier 337.0; cited publication: Dyer, RA. 1951. A review of the genus Brunsvigia Heist. Pl. Life 7(1): 45 - 64. [All rights reserved]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Unlike other members of the genus, B. undulata has fully developed undulate leaves at the time of flowering and the number of leaves is larger than is usually the case.The umbel in B. undulata is somewhat semi-globose, instead of the more usual globose form, and the ascending pedicels are remiscent of Nerine rather than Brunsvigia. The deep ruby-color of the flower, too, is unusual in the genus. A large specimen collected near Nottingham Road by Mrs. J. L. Smith had an umbel with 80 flowers. Specimens from the Estcourt district collected by J. Acocks showed considerable variability in the leaves. The margin varied from slightly undulate to markedly crisped.
