        usage:
          title: Macleania insignis M.Martens & Galeotti, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrubs often epiphytic 0.5-2 (-4) m tall; branchlets terete, light to dark brown; bark peeling, puberulous; young twigs glabrous to puberulous. Leaf blades ovate to lance ovate or rarely lance oblong to oblong, (2-)3-8(-12) cm long, (1-) 1.5-4 cm wide, basally subcordate, rarely rounded, apically obtuse to acute, entire and slightly revolute, glabrous on both surfaces; 3-5(-7)-pli- nerved with the secondary nerves originating near the base, ascending, the mid- vein slightly impressed above and elevated beneath; petioles subterete, rugose, glabrous or rarely puberulous, (1-)2-4 mm long. Inflorescence axillary, subfas- ciculate, (1-)2-3-flowered, basally circumscribed by a few, minute, ovate, ciliate bracts 1.5-2 mm long; pedicels rugose, glabrous or rarely puberulous, (4-)8-16 mm long, bracteoles basal, minutely ciliate, triangular, 1-2 mm long. Flowers with the hypanthium glabrous or minutely to moderately appressed short pu- bescent, prismatic, 3-S5 mm long, 3-4 mm in diameter, broadly winged from the base to the sinuses, the wings 0.3-0.5 mm wide; calyx limb ascendent to erect, 1.0-1.5 mm long, the lobes 5, apiculate, narrowly triangular to deltoid, (0.4-) 0.8-2.0 mm long, the sinuses either flat or acute, more or less contiguous; corolla elongate urceolate or prismatic, (14-)20-25 mm long, 4-5 mm in diameter, con- tracted at the throat, externally glabrous to slightly puberulous especially dis- tally, distally sparsely to densely villous internally, the lobes acute, spreading, 1.5-3.0 mm long; stamens 10, 8-12 mm long, the filaments dark brown, glabrous, connate 3-5(-7) mm long, the anther sacs 4.0-5.5 mm long, the single, cylindric- conical tubule 2-3 mm long opening by a broad introrse cleft more than 1/2 as long as the tubule; style exerted, the stigma peltate.
          originalLanguage: en
          sourceField: general
