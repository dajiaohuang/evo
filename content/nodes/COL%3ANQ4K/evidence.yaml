            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Bulbinella barkerae may be confused with B. caudafelis, but is separated from that species by a number of features, especially the spreading leaves with regularly ciliate margins, the smaller greyish green fruits, the seeds with a broadish wing extension and also the strong-smelling flowers. B. barkerae is easily separated from the other species with ciliate margins, B. ciliolata, on locality and also on the broader and fewer leaves.
