      morphology:
        status: partially-supported
        claims:
          - text: Like D. meyeriana but leaves adpressed, flowers larger, petals with few, long, weak hairs and fruit horns short and spreading (not erect).
            sourceIds:
              - sanbi_14402_0
            locator: "SANBI/WFO archive Morphology row 11419; source 14402.0; publication: Manning, JC; Goldblatt, P. 2012. Rutaceae: Diosma L. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 718 - 719. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: The presence of nectar in the flowers is a factor which would indicate that this species is insect pollinated and the style at first deflexed, perhaps would indicate that this plant is not self-pollinating. Ripe seeds are, as is normal, ejected by a catapult mechanism and regeneration takes place only from seed after fires. The leaves have a very faint smell when crushed. Recognised as a distinct species because it is single-stemmed at the base, has slender branches, adpressed leaves, petals with 2-7 long weak hairs, disc wine coloured and fruits with very short horns. It is nearest in appearance to Diosma meyeriana Spreng., but differs in having leaves with gland dots scattered on both sides of the midrib instead of one straight row of gland dots on either side of the midrib, flowers less numerous and much larger with petals bearing 2-7 long weak hairs, calyx lobes with much shorter cilia, and fruits with shorter horns spreading rather than erect. The name is an allusion to the long weak hairs on the petals.
            textZh: SANBI 条目提供了该种的鉴别特征。
            sourceIds:
