            locator: "SANBI/WFO archive Diagnostic row 64076; source 15396.0; publication: Williams, IJM. 1975. Studies in the genera of the Diosmeae (Rutaceae): 5. J. S. African Bot. 41(3): 167 - 186. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
