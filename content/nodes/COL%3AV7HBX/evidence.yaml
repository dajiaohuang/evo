      ecology:
        status: partially-supported
        claims:
          - text: "The account reports the following type locality and the treatment’s stated habitat/locality observations: Kotluša spring at Cviljane, Croatia (43°56′57″N, 16°23′56″E; 397 m); collected 2017-03-17; holotype NHMW-MO-113902. Treatment reports 10 localities (its locality numbers 3–12) in the upper Cetina Basin, central Croatia, and southern Livansko Polje in north-west Bosnia and Herzegovina; reported habitats include springs, the Cetina River, and interstitial habitats."
            originalLanguage: en
            sourceIds:
              - treatment
            locator: Species account, pp. 212–217; type material, habitat and distribution paragraphs
            placeTimeScope: Only the account’s named collection localities; collection dates are account-specific and no unsampled sites are inferred.
            lifeStatus: Wild freshwater snails; localities and specimens reported by the authors.
        gaps:
          - No complete interaction network, host/resource use, population ecology, seasonal ecology, or habitat-wide survey has been assembled.
      evolution:
        status: partially-supported
        claims:
          - text: The study assigns this taxon to mitochondrial operational unit mOTU D and reports COI sequence accession(s) PX113150–PX113167; the paper cautions that COI data do not resolve deeper phylogenetic relationships. The mOTU label is not treated as a species-tree placement.
            originalLanguage: en
            sourceIds:
              - treatment
              - paper
            locator: Species account, pp. 212–217; molecular/mOTU assignment and cited GenBank accession(s); article discussion on limits of COI evidence
            placeTimeScope: Study-specific sequence sample and analysis published 2025; accession identifiers as reported in the taxon account.
            lifeStatus: Wild study specimens; molecular evidence from the reported samples only.
        gaps:
          - A species-level phylogenetic placement with broader loci, sampling, competing topologies and uncertainty has not been established here.
      distribution:
        status: partially-supported
        claims:
          - text: Treatment reports 10 localities (its locality numbers 3–12) in the upper Cetina Basin, central Croatia, and southern Livansko Polje in north-west Bosnia and Herzegovina; reported habitats include springs, the Cetina River, and interstitial habitats.
            originalLanguage: en
            sourceIds:
              - treatment
            locator: Species account, pp. 212–217; type locality and distribution section
            placeTimeScope: Reported collection sites and dates in the cited study; geographic extent is limited to the named localities and study period.
            lifeStatus: Wild populations; no introduced/native range designation beyond treatment localities.
        gaps:
          - No current global checklist of localities, georeferenced range boundary, native/introduced assessment, or sampling-completeness study has been completed.
      fossil:
        status: not-assessed
        claims: []
        gaps:
          - No fossil database or paleontological literature search was performed; no absence-of-fossils conclusion is drawn.
      conservation:
        status: partially-supported
        claims:
          - text: The authors assess the species as Vulnerable (VU D2) in the treatment; this is an author assessment, and an independently verified current IUCN or national Red List record was not identified.
            originalLanguage: en
            sourceIds:
              - treatment
            locator: Species account, pp. 212–217; authors’ ecological/conservation status paragraph
            placeTimeScope: Author-assigned status in the 2025 taxonomic treatment; its assessment scope is limited to the account’s reported locality data.
            lifeStatus: Wild taxon; author assessment only, not an independently verified current formal assessment.
        gaps:
          - Assessment criteria, evaluator authority, assessment date/validity, population trend and current IUCN or national registry record have not been independently verified.
