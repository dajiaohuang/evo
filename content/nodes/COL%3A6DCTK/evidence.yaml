          title: Doliocarpus major J.F.Gmel., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Liana. Leaves with the blade elliptic to obovate, the apex acuminate, the base obtuse, the margins entire to serrate, 7-15 cm long, 2-8 cm wide, chartaceous, punctate, the puncti with a short simple hair arising from the center, the blades otherwise glabrous or pubescent with scattered simple hairs along the midvein above and the major veins beneath, the secondary veins 6-12; petioles 5-15 mm long, narrowly alate. Inflorescence axillary, fascicled. Flowers 20-30 mm broad, the pedicels 5-12 mm long at anthesis, to 10-20 mm long in fruit; sepals 4-5, broadly ovate, 3-6 mm long and wide, pubescent within and without; petals 2, white to pale yellow, obovate to obdeltoid, 15 mm long, 10 mm wide; stamens 75, deciduous, the filaments filiform, 5-7 mm long, the thecae 0.7 mm long, nearly parallel; carpels 1, pubescent, globose, the styles 6-8 mm long, the stigmas simple. Fruit berry-like and indehiscent or dehiscing across the apex, pubescent, globose.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 4045
