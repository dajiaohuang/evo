    facets:
      morphology:
        status: partially-supported
        claims:
          - text: "A much branched shrub, about 70 cm high, with rather slender, ascending branches. Branchlets slender, sparsely villous and shortly tomentose. Leaves 5-8 mm long: lamina erect-spreading, lanceolate, acute, rounded or slightly narrowed at base, with revolute margins covering about half of the lower surface; upper surface minutely tubercled, sparsely villous, becoming glabrous: petiole about 1 mm long. Flowers 3.5-4 mm long, shortly stipitate, covered outside with short, white tomentum, situated in the axils of the uppermost, reduced leaves, in few-flowered, capituliform spikes 5-7 mm wide. Bracteoles absent. Calyx-tube about 0.75 mm deep, cyathiform: sepals 1.5-1.75 mm long, ovate-lanceolate, subacutely angular-convex on the inner surface above the middle. Petals inserted at or shortly below the mouth of the tube, 0.75 mm long: lamina incurved-cucullate, ovate or elliptic, acute or obtuse, with incurved margins: claw about as long, linear. Anthers reniform, 1-celled. Ovary distinct from the calyx-tube, obconic. Style and stigma together 0.5 mm long, trigonous."
            sourceIds:
              - sanbi_2884_0
            locator: "SANBI/WFO archive Morphology row 81895; source 2884.0; publication: Pillans, NS. 1942. The genus Phylica, Linn. J. S. African Bot. 8(1): 1 - 164. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
