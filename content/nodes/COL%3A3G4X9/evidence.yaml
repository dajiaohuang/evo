        claims:
          - text: Cormous geophyte, 50-90 cm, tunics fibrous. Leaves cross-shaped in section. Flowers like G. watsonius , red.
            textZh: Gladiolus quadrangularis (Burm.f.) Ker Gawl. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 7225; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Distinguished from allied species in the series with similar flowers by the softer corm tunics and centric leaves, 2.5-4.0 mm diam., x-shaped in section with main vein raised on either side of surface into wing-like ridges. Gladiolus watsonius from the western lowlands has linear leaves, mostly 4-6 mm wide with two furrows on each surface, and G. teretifolius from the Overberg has terete leaves, 1-2 mm diam., with the main vein and margins heavily thickened and thus with four fine longitudinal grooves. Both of these species have hard, clawed corm tunics.
            textZh: SANBI 条目提供了 Gladiolus quadrangularis (Burm.f.) Ker Gawl. 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 94615; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
