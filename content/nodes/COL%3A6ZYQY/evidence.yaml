            locator: "SANBI/WFO archive Morphology row 32863; source identifier 14528.0; cited publication: Snijman, DA. 2013. Amaryllidaceae. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 33 - 42. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Of all the species of section Gemmaria, S. karooica has the most attractive flowers, due to the plane-surfaced, pink, widely-spreading tepals. The ovate to elliptical leaves arise from a yellow-fleshed bulb and are usually glabrous with minutely ciliate margins. Only rarely are the leaves softly pubescent adaxially. Previously the species was thought to have upright leaves, as shown in the illustration accompanying the original description (Barker 1935). Plants in the field however have leaves appressed to the ground. Closest allies are S. massoniella and S. merxmuelleriana.
            textZh: SANBI 条目提供了 Strumaria karooica (W.F.Barker) Snijman 的鉴别特征。
