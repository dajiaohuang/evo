    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Bulbous geophyte, 140-200 mm tall. Leaves 2, dry at flowering, prostrate, elliptical, both surfaces smooth or rarely sparsely hairy on upper surface, margin minutely fringed. Flowers in a spreading cluster, stellate, pink with darker pink median stripe on each tepal.
            textZh: Strumaria karooica (W.F.Barker) Snijman 的 SANBI 物种条目记录了形态特征。
            sourceIds:
