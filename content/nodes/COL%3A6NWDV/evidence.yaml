        claims:
          - text: Acaulescent, cormous geophyte, 5-10 cm. Leaf blades ribbed. Flowers actinomorphic, long-tubed, violet with cream-coloured and blackish markings.
            textZh: Lapeirousia oreogena Schltr. ex Goldblatt 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 7505; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: The acaulescent Lapeirousia oreogena is distinguished from its allies of similar habit by its large dark blue to violet flowers with slightly reflexed tepals and a perianth tube 50-60 mm long. The tepals are almost black at the base with white, triangular to arrowhead-shaped marks. The centrally placed purple anthers form a ring around the style and have dark purple pollen. Like some other acaulescent members of sect. Sophronia, the leafy outer bracts extend well above the flower buds and have wavy to crisped margins.
            textZh: SANBI 条目提供了 Lapeirousia oreogena Schltr. ex Goldblatt 的鉴别特征。
