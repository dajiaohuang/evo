        usage:
          title: Scoparia dulcis L., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Perennial herbs or weak shrubs to 1.5 m tall, conspicuously glandular punctate (under a lens), the branches slender, angled by the concaulescent leaf bases, mostly glabrous, sometimes ciliate at the nodes. Leaves opposite, sometimes obovate, saliently dentate and to 4 cm long and 1.8 cm wide, mostly much narrower and smaller, the teeth often inconspicuous, apically obtuse, basally cuneate, sometimes with a distinct petiolar region, the midvein prominent with ca. 3 ascending lateral veins on each side, the venation often obscure above. Inflorescence of 1-several flowers from the leaf axils, often paired; pedicels filiform, mostly ca. 5 mm long. Flowers small, the calyx 4-parted nearly to the base, the lobes oblong, obtuse or rounded apically, mostly glabrous, sometimes ciliate, apically rounded, 3 nerved; corolla white, rotate, 4-lobed nearly to the base, the lobes 21/2 mm long, only slightly exceeding the calyx, ovate, glabrous above but densely bearded with long white hairs in the lower '/8 within; stamens 4, the filaments glabrous, slender, inserted on the corolla tube, 1 mm long; anthers yellow, 1 mm long, ellipsoidal, exserted; ovary ellipsoidal, the style 1.5 mm long, only slightly exceeding the anthers, the stigma punctiform, exserted. Capsule globose, 1.5-2.0 mm across, exceeding the calyx, 4-sulcate, yellowish brown, glabrous, dehiscing apically, sometimes beaked by remnants of the style; seeds numerous, ca. 0.5 mm long, somewhat prismatic, coarsely reticulate.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 12838
