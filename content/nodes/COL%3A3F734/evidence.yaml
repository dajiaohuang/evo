        claims:
          - text: "Perennial herb, few- to many-stemmed, ('bisexual'), ('bisexual') ± ('female'), (female') or occasionally ('male'), ('bisexual') ± ('male') or ('male') ± ('bisexual') ± ('female'). Stems (0.3-)0.4-0.8(-1) m long, ascending to ± erect or ± prostrate and rooting at nodes, mostly densely covered with longish whitish or yellowish white hairs; often with short shoots bearing small leaves. Leaves: blades (27-)35-50(-62) x (15-)20-35 mm, broadly ovate-lanceolate or ovate, cuneate, truncate or ± subcordate at base, subacute to ± obtuse at apex, both surfaces (particularly midrib and prominent lateral veins) ± densely covered with longish yellowish to whitish spreading hairs, very rarely glabrescent; petioles (3-)4-6(-9) mm long; stipular sheath with 3(-5) setae, the longest (1.5-)2-4(-5) mm. Inflorescence pyramidal to ellipsoidal, (60-)100-200(-250) x (40-)70-150(-200) mm; peduncles and pedicels thin but ± stiff, hairy to subglabrous, divergent in fruit, elongating to (2-)3-6(-7) mm. Flowers: corolla greenish, greenish yellow or creamy yellow, sometimes reddish brown tinged outside, glabrous or papillate near tip ('bisexual'), ('male'): tube ± 0-0.4(-0.5) mm long, lobes 1.1-1.5(-1.7) x 0.4-0.6(-0.9) mm; anthers 0.9-1.2 mm long ('female'): tube 0-0.2(-0.3) mm long, lobes 0.6-0.9 x 0.1-0.2(-0.3) mm; stigmas (2.2-)3-4.5(-5) mm long; ovary c. 0.6-0.9 x 0.8-1.3 mm, ± wrinkled to ± warty. Fruit greenish brown, brown to brownish black; each mericarp (1-)1.2-1.8(-2) x 0.8-1.4(-1.6) mm, obovate to elliptic, ± smooth, wrinkled or ± warty."
            sourceIds:
