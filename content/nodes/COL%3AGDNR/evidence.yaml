        usage:
          title: Ardisia pulverulenta Mez, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrubs or small trees, the branchlets thick, covered at first with large ferruginous scales. Leaves subsessile, the stout marginate petioles 3-5 mm long, lepidote below; leaf blades large, membranaceous, elliptic or oblong- elliptic, 17-21 cm long and 6.5-7.5 cm wide, decurrent on the petiole basally, abruptly acuminate apically, crenulate, glabrous above except basally, densely covered beneath with large brown scales, the costa impressed above, prominent beneath, the primary lateral veins slender. Inflorescences terminal, paniculate, remotely branched from the base, the branches slender, densely furfuraceous; pedicels 2.5-3 mm long. Flowers 5-merous, furfuraceous, small, umbellate or subcorymbose; sepals narrowly ovate, 1.2 mm long, acutish, punctate with large rounded black glands; petals ovate, ca. 2.4 mm long, reflexed, connate ca. 0.5 mm basally, punctate with conspicuous orange and black glands, sparsely lepidote; stamens attached at the apex of the corolla tube, the filaments stout, ca. 0.5 mm long, the anthers ovate, 1.2 mm long, sharply apiculate, longitudinally dehiscent, conspicuously black-punctate dorsally; ovary ovoid, punctate, the ovules pluriseriate, large, 6 in the flower dissected, the placenta ovoid, apiculate, the style slender, ca. 2.5 mm long.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 8196
