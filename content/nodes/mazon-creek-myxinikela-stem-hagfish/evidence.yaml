  claims:
    - subjectId: event:mazon-creek-myxinikela-stem-hagfish
      claimKind: scientific
      claimType: taxonomy
      statement: Myxinikela siroka holotype FMNH PF15373 and paratype FMNH PF8472 from the Moscovian Francis Creek Shale, approximately 310–307 Ma, preserve a cyclostome–hagfish anatomical mosaic and support a stem or putative total-group hagfish interpretation; they do not set the crown-Myxini range or demonstrate modern hagfish habitat, slime production or ecology.
      confidence: medium
      confidenceRationale: The revision compares both accessioned specimens, reports measurements, locality and anatomy, and explicitly recovers a stem-hagfish mosaic. Medium confidence reflects different taphonomic histories, equivocal structures including cartilage in the paratype and the substantial correction of the original modernized reconstruction.
      referenceLinks:
        - relation: supports
          referenceId: miyashita-2020-myxinikela
          pages: 850–865, especially pp. 852–860
          figure: Figures 1–4 and 8; Table 1
          quoteLocator: Systematic palaeontology; material and locality; revised anatomy; taphonomy; Discussion
  claim-rationales.zh:
    - 修订研究比较了两件有编号标本，报告了尺寸、地点和解剖，并明确恢复出盲鳗干群镶嵌。中等置信度反映两件标本的埋藏史不同、副模软骨等结构存在歧义，以及原先过度现代化复原受到大幅修正。
  claim-statements.zh:
    - 约 310–307 Ma 莫斯科期 Francis Creek 页岩中的 Myxinikela siroka 正模 FMNH PF15373 与副模 FMNH PF8472 保存圆口类—盲鳗式解剖镶嵌，支持其为盲鳗干群或推定总群；它们不设定盲鳗纲冠群延限，也不能证明现代盲鳗的栖息环境、黏液产生或生态。
