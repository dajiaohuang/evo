    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte 5-12 mm, with stems arching outward. Leaves firm, erect, tightly plicate. Flowers several in an inclined spike, actinomorphic, violet with a deep red centre, pollen brown, inner bracts divided to base, ovary hairy.
            textZh: Babiana regia (G.J.Lewis) Goldblatt & J.C.Manning 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 6724; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Easily recognised by its actinomorphic flower with broad, ovate, overlapping tepals that form a shallow cup, and coloured dark blue with a deep red centre. The stamens are arranged symmetrically around the short style that divides below the level of the linear anthers and the anthers bear reddish brown pollen. It was initially regarded merely as a colour form of B. nervosa, but that species has a zygomorphic flower with blue to mauve, white or cream-coloured, spreading tepals, the lower distinguished from the upper by different markings, unilateral stamens, sagittate anthers with an expanded connective and a style dividing at the base of the anthers. Babiana rubrocyanea from Darling, also with bowl-shaped purple flowers with a red centre, is distinguished by its mostly unilateral stamens with the anthers facing the spike apex, and the unusually short style branches with very broad tips.
            textZh: SANBI 条目提供了 Babiana regia (G.J.Lewis) Goldblatt & J.C.Manning 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 94980; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
