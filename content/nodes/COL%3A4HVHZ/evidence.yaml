        usage:
          title: Pilostyles blanchetii (Gardner) R.Br., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Achlorophyllous parasites on various species of Bauhinia, the plants usually numerous and arranged in irregular rows along stems of the host. Inflorescence 1-flowered. Flowers 2-3 mm long, 2-3 mm wide, the fleshy receptacle subtended by a number of imbricate bracts, the bracts more or less obovate, the uppermost not differentiated into petaloid tepals, 1.5-2 mm long, 1-2 mm wide at base, inserted near top of the ovary; male flowers (Blanchet 2861) with a central stylar column terminating in a hemispheric, papillose cap, the basal row of papillae enlarged; anthers in a 2-seriate ring below the stylar cap; female flowers with a single pistil, the ovary inferior, subspherical, 2-3 mm diameter, unilocular with 2 or 4 irregular and poorly demarcated peripheral, parietal placentae, these some- times more or less meeting and the whole inner surface of the ovary appearing placentiferous, the ovules numerous, the style 0.5 mm long, its capitate apex 1 mm long and 1.5 mm wide, the stigma annular around the base of the style apex. Fruit a berry.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 11003
