          - text: Phymaspermum argenteum shares the fleshy, usually silvery sericeous leaves with the closely related P. comptonii, but can be readily distinguished by the narrowly campanulate involucres with closely appressed, deltoid to ovate involucral bracts with prominent dark margins.
