        claims:
          - text: Subshrub, up to 0.85 m high. Leaves sessile, entire or 1-3 times pinnate, segments filiform or linear, silvery hirsute. Heads narrowly cylindrical, 10-17-flowered, numerous, terminally corymbose. Flowers yellow.
            sourceIds:
