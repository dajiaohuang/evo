    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Perennial herb, up to 100 mm tall. Leaves up to 80 mm long, long acuminate, ending in a fine point. Capitula few, globose to semidiscoid, ± 8 mm in diameter, densely covered with short white setae. Flowers white.
            textZh: Eriocaulon sonderianum Körn. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_11118_0
            locator: "SANBI/WFO archive Morphology row 593; source identifier 11118.0; cited publication: Herman, PPJ; Retief, E. 1997. Plants of the northern provinces of South Africa: Keys and diagnostic characters. Strelitzia 6: 1 - 681. National Botanical Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Mr R. D. Meikle of Kew suggested that E. sonderianum could be a variety of E. dregei, and the ample collections available now support this view. E. dregei appears to be a polyploid. E. dregei var. sonderianum is the common variety in the Transvaal; in Natal both varieties occur but in the Eastern Cape the larger var. dregei becomes common whereas var. sonderianum is rare. At high altitudes, where ice and snow occur in winter, the dwarfed plants of var. sonderianum are found.
            textZh: SANBI 条目提供了 Eriocaulon sonderianum Körn. 的鉴别特征。
            sourceIds:
              - sanbi_3096_0
            locator: "SANBI/WFO archive Diagnostic row 51789; source identifier 3096.0; cited publication: Obermeyer, AA. 1985. Eriocaulaceae, Fl. S. Africa 4(2): 9 - 21. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Like E. dregei but E. sonderianum but leaf tips attenuated into long thread-like points, also it is usually smaller and has shorter leaves, rarely more than 8 cm long, the sheaths are usually longer than the leaves.
            textZh: SANBI 条目提供了 Eriocaulon sonderianum Körn. 的鉴别特征。
