      distribution:
        status: partially-supported
        claims:
          - text:
              page: en
              section: s-c88c4d2a2e
              part: body
            textZh: 一项四川省分布研究整合了野外调查、保护区记录和历史资料，并将当前时期界定为 2001–2023 年。作者报告，在该研究区域内，四川金丝猴当前分布限于邛崃山和岷山两大山系海拔 1,000–4,000 米范围；研究还报告四川东北部四个海拔低于 1,000 米的区域目前没有该猴分布。这是四川省范围内的区域评估，不代表川金丝猴（Rhinopithecus roxellana）在中国全境的分布。
            originalLanguage: en
            sourceIds:
              - dai2024sichuan-snub-nosed-range
            locator: Abstract for integrated evidence sources, period definitions, current mountain/elevation limits, and northeastern low-elevation areas; Methods for GIS period and regional scope.
            placeTimeScope: Sichuan Province, China; current distribution period 2001–2023, compared with 1980–2000 and a historical Mid-to-Late Pleistocene period; free-living monkeys.
            lifeStatus: Wild regional populations as represented by field surveys, protected areas, and historical records; captive, domesticated, and fossil evidence was not assessed by this distribution claim.
        gaps:
          - This GIS synthesis bounds a Sichuan regional range for selected periods; it does not establish the full China-wide species distribution, fine-scale occupancy, or current status of every local population.
      fossil:
        status: not-assessed
        claims: []
        gaps:
          - Although the paper compares historical distribution periods, this dossier claim does not assess fossil specimens, deposits, or geological evidence.
      conservation:
        status: not-assessed
        claims: []
        gaps:
          - The regional distribution summary is not an independent population trend or formal conservation-status assessment.
