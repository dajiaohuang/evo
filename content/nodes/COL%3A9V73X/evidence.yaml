          - text: Wurmbea viridiflora is similar to W. burrowsii and especially W. angustifolia, but differs from both and from W. elatior in that the flowers are uniformly greenish-cream and do not have the purple bilobed patch distal to the filament on the tepals. Neither W. viridiflora nor W. burrowsii have the numerous minute dots or bigger rounded oblong flecks that are usually present on the tepals of W. angustifolia. The tepals of W. viridiflora and W. burrowsii have more prominent claws than those of W. angustifolia and W. elatior. Wurmbea viridiflora is similar to W. angustifolia in stem height, the length of the leaves and number of flowers on the spikes, but the internodal distances between flowers is shorter in W. viridiflora and the pistil of W. viridiflora is nearly twice as long as that of W. angustifolia. In addition, W. viridiflora has a nectary with a central groove that touches the filament at the base and has a smooth surface, rather than a nectary with a central pocket that is separated from the filament at the proximal end and has a minutely papillate surface as in W. angustifolia.
