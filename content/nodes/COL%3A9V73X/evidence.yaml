        claims:
          - text: The vegetation type is Lydenburg Montane Grassland (Gm 18), where W. viridiflora grows in seasonal wetlands or seeps with either sandy soil over a sandstone substrate or humus rich loam at 2230-2250 m. It shares these habitats with mosses, sedges and moisture-loving grasses.
