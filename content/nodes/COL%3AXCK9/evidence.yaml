        usage:
          title: Columnea cruenta B.D.Morley, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Epiphytic herbs or shrubs; stems somewhat woody, to 1 m tall, 5-10 mm in diam., purple brown, densely hirsute. Leaves of a pair unequal; larger leaf oblanceolate, to 23 cm long and 2.0-5.5 cm wide, acuminate, oblique at the base, the margin serrate toward the apex, green above but suffused purple red near the margins and the tip, pilose, the hairs reddish, 4-5 celled, blotched red purple beneath at the tip, along the margins and towards the center, pilose, the hairs reddish, 5-6 celled, also 2-3 celled white adpressed hairs; petioles to 6 mm long; the smaller leaves ovate, ca. 1-4 cm long and 6-16 mm wide, acuminate, the margin serrate, vestiture as in larger leaves, leaf tip purple red beneath. Flowters 2 or more at a node; bracts not seen; pedicels 9-26 mm long, brown pilose to long villous; calyx lobes lanceolate, 0.9-1.8 cm long, the apex acuminate, 3-7 toothed, the teeth linear, to 3 mm long, green or cream colored, brown pilose; corollas yellow with the lower parts of the lobes red producing a red ring at the limb, funnelform but slightly swollen, 3.9-4.6 cm long, about ca. 3 mm in diam. above base, becoming ca. 7 mm in diam., slightly contracted at the throat to 5.5 mm in diam, the outside brown pilose, the lobes subregular, ca. 6 mm long, spreading; filaments remotely pilose at base, later coiled, yellow, the anthers included, 1 mm long and 1.5 mm wide; disc reduced to a bilobed gland; ovary pilose, the style, ca. 4 cm long, yellow, glabrous, the stigma bibbed to stomatomorphic. Fruits cream colored.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 6140
