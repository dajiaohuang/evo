    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Prostrate mat-forming subshrub, old stems woody, gnarled, up to 8 mm in diam., young stems very slender (±1 mm diam.), stoloniferous, leafy, giving rise to innumerable congested leaf rosettes, flowering stems terminal, erect, up to 120 mm tall, closely leafy. Rosette leaves obovate to subspathulate, up to 14 x 9 mm, densely appressed silvery silky-woolly; cauline leaves similar but lanceolate to subspathulate, bracteate below the heads and tipped with a coloured scarious scale. Heads heterogamous, campanulate, ±15 mm long, double that across the fully radiating bracts, solitary at the branch tips. Involucral bracts in ±10 series, graded, loosely imbricate, much exceeding flowers, glossy white, mostly tipped crimson or dark brown. Receptacle very shortly honeycombed. Flowers 138-233, 18-29 female, 120-208 homogamous. Achenes 1.5 mm, glabrous. Pappus bristles many, equalling corolla, barbellate above, bases not cohering.
            sourceIds:
