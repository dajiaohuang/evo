            locator: "SANBI/WFO archive Diagnostic row 76814; source 6797.0; publication: Steiner, KE. 2006. Two new species of Nemesia (Scrophulariaceae) from southern Africa. Bothalia 36(1): 39 - 44. [CC BY]"
