    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Annual, up to 280 mm tall. Leaves lanceolate-ovate to ovate, apex acute, base rounded to cuneate. Flowers in lax racemes, calyx lobes lanceolate, acute, sparsely glandular pilose, margins entire to toothed, corolla 10-16 x 10-15 mm, upper lip orange, lower lip orange with strongly convex yellow palate in lower half, spur projecting backwards, mostly 3.1-4.2 mm long, not strongly recurved apically. Capsule oblong, 4.5-13 x 3.6-7 mm, bilobed.
            sourceIds:
