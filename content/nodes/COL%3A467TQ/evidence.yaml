            locator: "SANBI/WFO archive Morphology row 35535; source 14771.0; publication: Steiner, KE. 2013. Scrophulariaceae: Nemesia. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 467 - 470. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Nemesia williamsonii is easily recognized by its bright orange and yellow flowers. It can be distinguished from the similar and related N. maxii by its colour (white vs violet), the difference in orientation of the spur, and the shape of the bracts. In N. williamsonii. the spur projects straight backwards or back and then downwards distally. whereas in N. maxii the spur projects straight downwards or down and forwards distally. The bracts of N. williamsonii are lanceolate with a truncate base, whereas those of N. maxii are triangular or cordate.
            textZh: SANBI 条目提供了该种的鉴别特征。
            sourceIds:
