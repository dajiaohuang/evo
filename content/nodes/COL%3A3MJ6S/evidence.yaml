            locator: "SANBI/WFO archive Morphology row 67534; source 10484.0; publication: Bruyns, PV. 2005. Stapeliads of southern Africa and Madagascar, Vol. 1. Umdaus Press, Hatfield. [All rights reserved]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: In H. grandis large plants up to 0.5 m in diameter have been seen and individual stems may reach a length of 0.6 m (though 0.3 m is more usual), so specimens may form quite substantial shrubs. Hoodia grandis is usually easily recognised and distinctive, especially in the northern part of its range, southwards to the Soutkloof area north of Laingsburg, in the populations east of Kruidfontein and on the Little Karoo near Calitzdorp. The flowers are usually fairly small, at between 8 and 12 mm in diameter. Inside they are pale yellow with a slight suffusion of pink along the margins of the lobes towards their tips. However, even in this area they may be up to 20 mm in diameter, so the size alone is not reliable for distinguishing it from H. pilifera. The corolla lobes are relatively narrow and the margins are recurved, giving them a convex shape. The corolla tube is fairly deep and cupular but there is usually no thickening around its mouth (i.e. no annulus is present). The bright yellow corona (which is a slightly different yellow to that of the corolla) has erect and scarcely diverging outer lobes. The flowers emit a striking odour that is reminiscent of fish in some cases and of socks that badly need a wash in others. West of the Rooinek Pass, H. grandis shows considerable variability. These plants are cut off from the main body of the distribution of H. grandis by populations with pinkish brown flowers around Laingsburg which are referable to (and discussed under) H. pilifera subsp. pilifera. In this area the flowers may be somewhat larger than is usual for H. grandis. The colour of the flowers in these plants ranges from yellow to greenish brown and through yellowish pink to quite bright pink. The flowers also may have more broadly deltate corolla lobes which are less convex and there may be a slight thickening around the mouth of the corolla tube, giving rise to faint traces of an annulus. The corona is usually pale yellow and has spreading-erect outer lobes which scarcely diverge, as is typical for H. grandis over the rest of its range. It is possible that some of the more darkly coloured flowers that are found in H. grandis here are a consequence of hybridisation with H. pilifera subsp. pilifera.
