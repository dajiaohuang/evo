        claims:
          - text: Shrub to 2 m. Leaves linear-oblanceolate. Flower heads obconic, 50-70 mm diam., involucral bracts shiny, cream-coloured to carmine, inner fringed or bearded, style 55-65 mm long.
            sourceIds:
              - sanbi_14383_0
            locator: "SANBI/WFO archive Morphology row 5542; source 14383.0; publication: Manning, JC; Goldblatt, P. 2012. Proteaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 657 - 681. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: There should be no difficulty in distinguishing P. burchellii from related species on account of its smooth, hairless involucral bracts (except for the bearded inner bracts) having a shiny almost greasy appearance, the rather short basally puberulous styles 60-70 mm long and the very narrowly oblong olivaceous leaves terminating in sharp black points at their apices.In addition, the styles and perianths are only two-thirds as long as the involucral bracts which results in the floral parts being rather deeply sunken within the inflorescence. Where P. burchellii and P. laurifolia grow in close association, hybrids are occasionally encountered. These may cause problems of identification if one is presented with only detached specimens although they are generally readily recognisable in the field.
