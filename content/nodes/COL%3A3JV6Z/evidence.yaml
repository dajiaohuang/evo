    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Succulent shrub developing erect, high branches from a compact centre. Leaves sharply triquetrous, glaucous, withering into long-lived, parchment-like dry leaves (persisting for many years on plant), up to 70 x ± 15 mm, up to 20 mm thick, epidermis smooth. Flowers in terminal cymes, bracteoles persisting over several years, 45-55 mm diam., petals white to pink, stamens in a central cone. Fruit flat-topped to forming a low cone, elongate funnel-shaped basally, valve wings broad, without closing body, 5-locular.
