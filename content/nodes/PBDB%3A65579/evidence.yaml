  claims:
    - subjectId: taxon:hipparionini
      claimKind: scientific
      claimType: fossil-range
      statement: The Old World hipparionin review places first dispersal at 11.4–11.0 Ma and the latest regional records around or below 1 Ma; those dates are distinct from the broader North American tribe-level history.
      confidence: medium
      confidenceRationale: Two systematic reviews cover complementary North American tribe-level and Old World genus-rank ranges. Medium confidence retains regional and taxonomic heterogeneity instead of treating one endpoint as global.
      referenceLinks:
        - referenceId: mc-horse-monodactyly-2019
          relation: supports
          pages: 1–5, 10–15
          figure: Figures 1–4
          quoteLocator: Review of Equinae foot transformation, persistent hipparionin tridactyly and North American radiation
        - referenceId: bernor-2021-hipparions
          relation: supports
          pages: 1–20
          figure: Figures 1–13
          quoteLocator: Abstract, genus-rank systematic review, regional occurrence synthesis and body-mass/diet results
    - subjectId: taxon:hipparionini
      claimKind: scientific
      claimType: taxonomy
      statement: Hipparionini is treated as a tribe of Equinae; Old World diversity is resolved into multiple genus-rank clades rather than a single broad genus Hipparion.
      confidence: medium
      confidenceRationale: The two systematic reviews directly support tribe context and the multi-genus Old World revision.
      referenceLinks:
        - referenceId: mc-horse-monodactyly-2019
          relation: supports
          pages: 1–5, 10–15
          figure: Figures 1–4
          quoteLocator: Review of Equinae foot transformation, persistent hipparionin tridactyly and North American radiation
        - referenceId: bernor-2021-hipparions
          relation: supports
          pages: 1–20
          figure: Figures 1–13
          quoteLocator: Abstract, genus-rank systematic review, regional occurrence synthesis and body-mass/diet results
    - subjectId: taxon:hipparionini
      claimKind: scientific
      claimType: morphology
      statement: Hipparionini remained tridactyl and many lineages were hypsodont, while body size and foot proportions varied substantially across the radiation.
      confidence: medium
      confidenceRationale: The foot-evolution review and Old World synthesis support the traits without treating them as uniform species diagnoses.
      referenceLinks:
        - referenceId: mc-horse-monodactyly-2019
          relation: supports
          pages: 1–5, 10–15
          figure: Figures 1–4
          quoteLocator: Review of Equinae foot transformation, persistent hipparionin tridactyly and North American radiation
        - referenceId: bernor-2021-hipparions
          relation: supports
          pages: 1–20
          figure: Figures 1–13
          quoteLocator: Abstract, genus-rank systematic review, regional occurrence synthesis and body-mass/diet results
    - subjectId: taxon:hipparionini
      claimKind: scientific
      claimType: ecology
      statement: Old World hipparionins ranged from browse-dominated and mixed feeders to grazers, with ecology varying by lineage, body size, region and time.
      confidence: medium
      confidenceRationale: The integrated review maps dietary preference and body mass by genus-rank lineage; medium confidence preserves heterogeneity.
      referenceLinks:
        - referenceId: bernor-2021-hipparions
          relation: supports
          pages: 1–20
          figure: Figures 1–13
          quoteLocator: Abstract, genus-rank systematic review, regional occurrence synthesis and body-mass/diet results
    - subjectId: taxon:hipparionini
      claimKind: scientific
      claimType: biogeography
      statement: The represented history distinguishes a North American tribe-level radiation from an Old World dispersal at 11.4–11.0 Ma and later regional Eurasian and African records.
      confidence: medium
      confidenceRationale: Complementary reviews support the regional scopes and prevent Old World genus dates from being applied to the entire tribe.
      referenceLinks:
        - referenceId: mc-horse-monodactyly-2019
          relation: supports
          pages: 1–5, 10–15
          figure: Figures 1–4
          quoteLocator: Review of Equinae foot transformation, persistent hipparionin tridactyly and North American radiation
        - referenceId: bernor-2021-hipparions
          relation: supports
          pages: 1–20
          figure: Figures 1–13
          quoteLocator: Abstract, genus-rank systematic review, regional occurrence synthesis and body-mass/diet results
    - subjectId: taxon:hipparionini
      claimType: fossil-range
      claimKind: scientific
      statement: "Hipparionini retains four distinct displays: a heterogeneous 17–0.6 Ma navigation composite, a 17–2 Ma North American review envelope, an 11.4–11 Ma Old World dispersal window, and a 1–0.6 Ma selected terminal regional window."
      confidence: contested
      confidenceRationale: Two systematic reviews directly support the separate regional markers, but their heterogeneous taxa, continents and purposes preclude one global lineage-duration interpretation.
      referenceLinks:
        - referenceId: mc-horse-monodactyly-2019
          relation: supports
          pages: 1–5, 10–15
          figure: Figures 1–4, especially Figure 3
          quoteLocator: North American review-matrix record from approximately 17 Ma through the Plio-Pleistocene
        - referenceId: bernor-2021-hipparions
          relation: supports
          pages: 1–20
          figure: Figures 10 and 13
          quoteLocator: Old World first dispersal at 11.4–11 Ma and selected MQ1 terminal regional records to 0.6 Ma
  claim-rationales.zh:
    - 两篇系统综述分别覆盖北美族级范围和旧大陆属级范围。中等置信度保留地区与分类异质性，不把单一端点当作全球端点。
    - 分类主张以所引主研究或系统综述中的明确分类与样本为界，不把导航父级写成直接祖先。
    - 形态主张只保留引文图表或诊断直接支持的骨骼、牙齿性状，并把软组织、姿势或功能解释明确标为推断。
    - 生态主张区分直接测得的磨耗或同位素信号与栖息地、行为推断，并保留物种、地点和时代边界。
    - 生物地理主张按论文实际覆盖的地点和区域表述，不把区域样本扩写为完整全球分布。
    - 两篇系统综述直接支持各自区域标记，但分类、洲域和用途异质，不能解释为单一全球谱系存续期。
  claim-statements.zh:
    - 三趾马族按所引系统研究采用当前分类层级；导航父级仅表示分类关联，不表示直接祖先。
    - 三趾马族的形态档案仅记录所引研究直接描述或测量的牙齿、颅骨或肢骨性状，功能解释另行标注。
    - 三趾马族的生态档案按取样物种、地点与方法限定食性和运动推断，不把局部结果推广为整个类群的固定生态。
    - 三趾马族的地理档案只覆盖所引研究明确讨论的区域与地点，并非完整的全球产出分布。
    - 旧大陆三趾马综述把首次扩散置于 1140–1100 万年前，把最晚区域记录置于约 100 万年前或更晚；这些年代不同于更广的北美族级历史。
    - Hipparionini 保留四条不同记录：17–0.6 Ma 异质导航合成、17–2 Ma 北美综述包络、11.4–11 Ma 旧大陆扩散窗口，以及 1–0.6 Ma 选定区域末端窗口。
