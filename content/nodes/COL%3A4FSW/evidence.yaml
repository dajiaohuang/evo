          - url
          - scope
        metadataVariant: 0
        usage:
          scope:
            en: One-year study of three wild Eulemur fulvus groups in Ankarafantsika, combined with non-invasive fecal DNA from 24 individuals and models of fruit visibility under different light conditions.
            zh: 支持 Ankarafantsika 三个野生 Eulemur fulvus 群体的一年研究，并结合 24 个个体的非侵入式粪便 DNA 与不同光照下果实可视度模型。
