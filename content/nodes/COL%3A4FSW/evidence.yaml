        fields:
          - id
          - title
          - url
          - scope
        metadataVariant: 0
        usage:
          scope:
            en: Three months of observations in 2018 of two habituated groups at Valohoaka, Ranomafana National Park; movement and dispersal results use those groups and models.
            zh: 支持 2018 年在 Ranomafana 国家公园 Valohoaka 对两个已习惯化群体进行的三个月观察；移动与传播结果基于这些群体和模型。
      - id: gudiel2017
