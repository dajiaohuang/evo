          - url
          - scope
        metadataVariant: 0
        usage:
          scope:
            en: Behavioral and feeding study comparing Mandena littoral-forest fragments with Sainte Luce; reported diets and group sizes remain tied to those sites and observation periods.
            zh: 支持 Mandena 沿海林碎片与 Sainte Luce 的行为和取食比较；食谱与群体大小仅适用于这些地点和观察时期。
      - id: volampeno2011
