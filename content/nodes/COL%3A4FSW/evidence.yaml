        fields:
          - id
          - title
          - url
          - scope
        metadataVariant: 0
        usage:
          scope:
            en: Preliminary 2012 dry-season line-census comparisons of three forest types in and near Ankarana; density estimates are local and the authors note limitations in comparing older estimates.
            zh: 支持 2012 年旱季 Ankarana 内外三类森林的初步样线普查比较；密度估计为局地结果，作者也指出与旧估计比较的限制。
