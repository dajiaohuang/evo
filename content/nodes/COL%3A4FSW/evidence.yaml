        fields:
          - id
          - title
          - url
          - scope
        metadataVariant: 0
        usage:
          scope:
            en: Marked-individual total count in part of Ankarafa Forest from September 2007 to February 2008; group and density figures describe that study area.
            zh: 支持 2007 年 9 月至 2008 年 2 月在 Ankarafa 森林部分区域进行的标记个体总计数；群体和密度数字仅描述该研究区。
      - id: colquhoun1998
        referenceId: ref-01ea71d3-b5c9-880a-a270-bbe56d89fde2
        fields:
          - id
          - title
          - url
          - scope
        metadataVariant: 0
        usage:
          scope:
            en: A 15-month study of the Ambato Massif subspecies; nocturnal activity was inferred indirectly from vocalizations and group movements and was described as preliminary.
            zh: 支持 Ambato Massif 亚种 15 个月的研究；夜间活动由叫声和群体移动间接推断，论文将其称为初步数据。
      - id: tonos2025
