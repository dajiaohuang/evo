          - scope
        metadataVariant: 0
        usage:
          scope:
            en: Diet and feeding observations from Manombo forest; the article also uses the name Eulemur albocollaris in its taxonomic note, and its observations are site-specific.
            zh: 支持 Manombo 森林的食谱与取食观察；文章分类说明也使用 Eulemur albocollaris 这一名称，观察结果限于该地点。
