          - url
          - scope
        metadataVariant: 0
        usage:
          scope:
            en: 2017–2022 transect surveys in Andranobe, Masoala; the E. albifrons density result is local, and canopy-gap associations are reported for lemur size/activity groups.
            zh: 支持 2017—2022 年 Masoala 的 Andranobe 样线调查；E. albifrons 密度结果限于当地，林冠空隙关联按狐猴体型与活动类型报告。
