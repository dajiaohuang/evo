        usage:
          title: Diospyros inconstans Jacq., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Small tree 5-8 m tall; branchlets sparsely and minutely strigillose. Leaves chartaceous, drying dull dark brown, paler beneath; lamina to 16 cm long and 7 cm wide, oblong-elliptic, the apex rounded to shortly cuspidate, the base rounded to obtuse, the lower surface sparsely and minutely setulose, the lateral nerves in 7-10 pairs, prominent beneath, paler than the lamina, the nerves and veins forming a close and conspicuous reticulum. Male flowers subsessile or shortly pedicellate in mostly 3-flowered, shortly pedunculate cymules; calyx to 0.7 cm long, strigillose-puberulous outside and inside, the lobes 3(4), imbricate, as long as the tube, suborbicular, apiculate; corolla ca. 1.5 cm long, subrotate, the tube ca. 1 cm long, densely strigose, lobes 3, 0.5 cm long, 0.45 cm wide, sub- orbicular-apiculate, glabrous except for the strigose mid-petaline lines; stamens ca. 10, to 0.4 cm long, attached to the base of the corolla tube, included, gla- brous, the connective long-apiculate; pistillode absent. Female flowers solitary in the axils of leaves or of reduced leaves towards the base of the current year's growth; pedicel to 0.4 cm long; calyx 0.4 cm long, 0.5 cm wide, shallowly cup shaped, sparsely strigillose outside, tomentellous inside, the lobes 3, 0.2 cm long, rounded, the margin reflexed; corolla similar to that in male flower but shorter and broader; staminodes 3, attached to the base of the corolla tube; ovary 0.25 cm long, 0.25 cm wide, subglobose, strigillose-tomentellous, the style 0.15 cm long, stout, undivided, ending in 3, fleshy, bi-lobed stigmas, the locules 6, uniovulate. Fruit ca. 2.5 cm long, 2.5 cm wide, subglobose, glabrous; seeds 6, or fewer by abortion, 1.5 cm long, 0.8 cm wide, 0.5 cm thick, brownish black; endosperm smooth; fruiting calyx ca. 1.2 cm long, saucer shaped, lobed to the middle, sparsely puberulous outside, tomentellous inside.
