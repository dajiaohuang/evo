    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Dwarf, cormous geophyte to 9 cm, with a membranous neck. Leaves 3-8(-11), tufted, suberect, linear, overtopping flowers. Flowers 1(2) per scape, white, unpleasantly scented, tube narrow, at least twice as long as lobes, anthers yellow, pedicels up to 2 mm long, bracts 2.
            textZh: Pauridia longituba M.F.Thomps. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13877_0
            locator: "SANBI/WFO archive Morphology row 7511; source identifier 13877.0; cited publication: Snijman, DA. 2012. Hypoxidaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 115 - 119. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Pauridia longituba is distinguished by an elongated perigone tube, at least three times longer than the tepals, and the virtual absence of a pedicel which contributes to its pronounced dwarfed habit. Both P. longituba and P. minuta occur on the Witteklip, a massive granite dome on the outskirts of Vredenburg where they superficially resemble one another. Plants of the two species, nevertheless, differ consistently in both pedicel and perigone tube length. Since the pedicel in P. longituba is either entirely lacking or extremely short (up to 2 mm), the flowers are only partially exserted above ground, mainly due to the presence of an elongated perigone tube. Conversely, the flowers in P. minuta are short-tubed and each is held aloft by a well-developed pedicel. Subtle differences in floral fragrances also separate the two species in this area. P. longituba has an unpleasant, acrid odour, whereas the scent in P. minuta is faint but sweet. Despite the distinctly long perigone tube, the various insects seen visiting the flowers of P. longituba are all short-tongued, mainly muscid flies, which apparently feed on the minute amounts of exudate that collects on the downwardly hooked style lobes within the perigone throat.
            textZh: SANBI 条目提供了 Pauridia longituba M.F.Thomps. 的鉴别特征。
