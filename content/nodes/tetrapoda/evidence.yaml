      taxonomicConcept: Tetrapoda limbed-trackmaker evidence and living navigation span
      geographicScope: Zachełmie quarry, Holy Cross Mountains, Poland; living global continuation
      olderMa: 390
      youngerMa: 0
      status: available
      uncertainty:
