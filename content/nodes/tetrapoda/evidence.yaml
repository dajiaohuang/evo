  claims:
    - subjectId: taxon:tetrapoda
      claimKind: scientific
      claimType: fossil-range
      statement: Digit-bearing trackways attributed to an unidentified limbed tetrapod at Zachełmie anchor the 390–0 Ma Tetrapoda evidence route; trace-maker attribution does not identify a body taxon, crown node, direct ancestor or global FAD.
      confidence: medium
      confidenceRationale: The track surfaces, digit impressions, stratigraphy and alternative locomotor interpretations are directly documented. The route therefore uses trace evidence without silently turning a trackmaker into a named taxon or crown calibration.
      referenceLinks:
        - referenceId: niedzwiedzki-2010-zachelmie-trackways
          relation: supports
          pages: 43–48
          figure: Figures 1–5; Supplementary Figures 1–25
          quoteLocator: Trackway and footprint descriptions; geological setting; phylogenetic implications
  claim-rationales.zh:
    - 足迹面、趾印、地层及不同运动解释均有直接记录；因此路线使用遗迹证据，但不会把足迹制造者暗中改写成具名类群或冠群校准点。
  claim-statements.zh:
    - Zachełmie 约 390 Ma 的具趾足迹被归于未定名的有肢四足动物足迹制造者，为 390–0 Ma 的四足动物证据路线提供锚点；遗迹归属不能识别身体化石类群、冠群节点、直系祖先或全球首现。
  ranges:
