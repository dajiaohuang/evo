        note: About 390 Ma is a rounded Eifelian trackway age; the maker is unnamed and the traces do not date crown Tetrapoda or a body-taxon FAD.
      evidenceBasis: Digit-bearing quadrupedal trackways establish a limbed-tetrapod trace minimum while preserving body-taxonomic and crown-node uncertainty.
