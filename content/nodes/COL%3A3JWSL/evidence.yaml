        claims:
          - text: Acaulescent succulent with small, solitary rosettes to 4 cm diam. Leaves dark green, finely pubescent, erect and incurved. Flowers white.
            textZh: Haworthia pubescens M.B.Bayer 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13856_0
            locator: "SANBI/WFO archive Morphology row 9095; source identifier 13856.0; cited publication: Bayer, B. 2012. Asphodelaceae: Haworthia Duval. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 75 - 77. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: H. pubescens resembles H. schuldtiana in size, colour and nature of surface excrescences but is more densely muricate and pubescent. It is nearer to H. herbacea, H. reticulata and H. maculata as regards leaf shape and arrangement, and also in floral structure and flowering time. The biarcuate bud and associated flare of the tips of the upper outer perianth segments appears most markedly in these species in the Robertson Karoo, and also in the H. mirabilis (including the H. triebneriana V. Poelln. varieties) complex of the South-Western Districts. Although floral morphology and its variation is not yet well understood in Haworthia, it is clear that H. pubescens shows several characters separating it from H. schuldtiana. The flower bud in H. pubescens is rather narrowly elongate and regularly biarcuate (albeit only partially) whereas in H. schuldtiana the bud is abbreviated and only the extreme tip is upcurved. The dorso-ventral flattening and distinct bifidity of the bud-tip in H. pubescens results in a flared arrangement of the segments as is found in H. herbacea (Mill.) Stearn, H. reticulata (Haw.) Duval and H. maculata (V. Poelln.) Bayer (ms.). The incurvature of the upper margin of the inner lower segments is comparable with that in the latter species. Another notable feature is that the upper, outer lobes are widely open, whereas in H. notabilis, H. guttata and H. schuldtiana the outer terminal margins of these segments are inclined forward and inward. This character is also observed in the eastern forms of H. reticulata at Bonnievale.
            textZh: SANBI 条目提供了 Haworthia pubescens M.B.Bayer 的鉴别特征。
            sourceIds:
              - sanbi_16002_0
            locator: "SANBI/WFO archive Diagnostic row 66127; source identifier 16002.0; cited publication: Bayer, MB. 1972. A new species of Haworthia (Liliaceae). J. S. African Bot. 38(2): 125 - 130. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
