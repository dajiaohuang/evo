        claims:
          - text: Shrub 0.3-2.0 m high. Bark pale grey to yellowish. Leaves glabrous or with a few minute hairs on margin, ovate, oblong-ovate, narrowly lanceolate or obovate, 10-52 x 4-22 mm, apex acute to obtuse, base slightly cordate, 3-or 5-veined from the base, often yellowish; petiole up to 2 mm long. Inflorescence of scattered axillary, many-flowered cymes. Bract and bracteoles subequal, broadly obovate to oblanceolate, 4.5-13.0 x 5-13 mm, apex truncate or acute, with a recurved apiculus, with broad membranous margins. Calyx lobes with apices recurved, with broad membranous margins. Corolla 8-12 mm long, white, palate with yellow and mauve markings. Pollen 2-colporate, 35-45 µm long, with entire margocolpus. Capsule 1(2)-seeded, clavate, hard, dark-coloured, up to 13 mm long.
