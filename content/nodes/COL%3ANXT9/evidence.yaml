          title: Burmeistera darienensis Wilbur, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Suffruticose epiphytic shrublet; branchlets glabrous. Principal leaves with blades narrowly elliptic to lanceolate, (9-)12-17 cm long, 3-5 cm wide, ca. 3-4 times as long as wide, apically acute, basally cuneate to somewhat rounded, mar- ginally indistinctly callose-serrulate with 1-2 shallow teeth per cm, glabrous above and sparingly to moderately microscopically puberulous on the principal veins beneath, appearing completely glabrous without good lighting and magnification; petioles 1.0-2.2 cm long, glabrous. Flowers ca. 4 cm long; pedicels solitary in the upper leaf axils, erect to ascendant, slender, glabrous, ebracteolate, 3-5 cm long; hypanthium in anthesis cylindric, glabrous, ca. 7 mm long, 4 mm in diameter; calyx lobes ovate to oblong, obtuse, entire, glabrous, 2-3 mm long, ca. 2 mm wide; corolla glabrous, dark red, the tube 10-12 mm long, 3 mm in diameter, the lobes linear-oblong, the 2 upper lobes 20-22 mm long, the 2 lateral lobes 12-14 mm long, the lowermost lobe ca. 10 mm long; filament tube distally slightly pilosulose, ca. 2.5 cm long, the anther tube externally glabrous, the 2 lower anthers with a thin pilose fringe. Berries globose, ca. 1.5 cm in diameter.
          originalLanguage: en
          sourceField: general
