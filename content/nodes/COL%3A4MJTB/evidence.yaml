    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Scrambling shrub or climber. Branchlets terete, with inconspicuous lenticels. Leaves opposite, papery; lamina elliptic to oblong, 40-92 x 20-50 mm, apex acute to bluntly acuminate, sometimes emarginate, base broadly cuneate, margins glandular-toothed; midrib yellowish, prominently raised below, reticulate venation very conspicuous on both sides; petioles short. Inflorescences 3-15-flowered, axillary cymes. Flowers yellowish green. Sepals 5, suborbicular, ± 1 mm long, margins fimbriate. Petals 5, oblong, ± 1.5-2.0 mm long, margins subentire, inrolled. Disc (4)5-lobed. Stamens 3, very short. Ovary globose; ovules 4(5) per locule. Fruit oblanceolate to obovate mericarps, united at base, 30-50 x 20-26 mm, apex acute to rounded, smooth, olive- to yellow-brown, striate. Seeds winged, up to 30 mm long, with marginal and submedian vein.
