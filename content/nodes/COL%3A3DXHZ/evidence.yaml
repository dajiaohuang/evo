    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Mehrjähriges kriechendes Kraut. Nur blühende Triebe aufrecht, bis 15 cm hoch. Blätter wechselständig, basal etwas gehäuft, an den blühenden Stengeln locker und nach oben an Grösse und Zahl abnehmend, linealisch, bis 10 x 1 mm, dicklich, am Rand lang abstehend behaart, Blattfläche kahl oder verkahlend. Köpfchen einzeln an den aufrechten Stengeln. Pedunkeln nur undeutlich abgesetzt, oben weisshaarig bis wollig. Involucrum ca. 4-reihig, bis 6 mm im Durchmesser. Hüllschuppen lanzettlich, haarig bis kahl, mit Harzstreifen, die äusseren 3 x 0.5 mm, die mittleren 4 x 0.8 mm, die inneren 5 x 1 mm. Zungenblüten ca. 30, Ligula 8 x 1 mm, blauviolett. Scheibenblüten zahlreich, Krone gelb, bis 4 mm lang, Griffelanhängsel breit dreieckig. Pappusborsten zahlreich, bis 3 mm lang, undeutlich gezähnt, weiss, ± persistent. Achänen obovat, 2.5 x 1 mm, braun, kurz und locker behaart.
            sourceIds:
              - sanbi_3197_0
            locator: "SANBI/WFO archive Morphology row 77933; source 3197.0; publication: Grau, HRJ. 1973. Revision der gattung Felicia (Asteraceae). Mitt. Bot. Staatssamml. München 9: 195 - 705. [All rights reserved]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Habituell erinnert sie an F. tenella ssp. longifolia, von der sie durch die unverbreiterten Achänenhaare, den nur kurz gezähnten Pappus, die kurzen basalen Blätter und den dicht rasigen Wuchs zu trennen ist.
            textZh: SANBI 条目提供了该种的鉴别特征。
