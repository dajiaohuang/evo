  claims:
    - subjectId: event:teleost-3r-model-age
      claimKind: scientific
      claimType: divergence-time
      statement: Molecular models fitted to 30 teleost ohnologue pairs estimated the 3R whole-genome duplication at 286.18–267.20 Ma and crown Teleostei at 254.36–234.16 Ma, making 3R older by 12.84–52.02 million years; both intervals are model outputs, not fossil first appearances or instantaneous observations.
      confidence: medium
      confidenceRationale: The analysed duplicate pairs, alternative models and posterior intervals are explicitly reported and the input files are public. Medium confidence preserves dependence on molecular models and calibrations, heterogeneous post-duplication rediploidization, and the paper's rejection of a simple one-event explanation for later teleost diversity.
      referenceLinks:
        - relation: supports
          referenceId: qi-2024-teleost-3r-dating
          figure: Figures 1–3; Supplementary Figure S1
          quoteLocator: Abstract; Results; Discussion
  claim-rationales.zh:
    - 所分析的复制基因对、替代模型与后验区间都有明确报告，输入文件也已公开。中等置信度保留分子模型和校准依赖性、复制后异质的再二倍化过程，以及论文对用单一事件解释后续真骨鱼多样性的拒绝。
  claim-statements.zh:
    - 对 30 对真骨鱼同源复制基因拟合的分子模型将 3R 全基因组复制估计为 286.18–267.20 Ma，将真骨鱼冠群估计为 254.36–234.16 Ma，因此 3R 早 1284 万至 5202 万年；两个区间都是模型输出，不是化石首现或瞬时观测。
