  claims:
    - subjectId: taxon:saurischia
      claimKind: scientific
      claimType: topology
      statement: Saurischia is represented by the sampled early-dinosaur matrix that places Tawa within Saurischia; the result is a phylogenetic hypothesis and does not make Tawa a direct ancestor or establish an exact clade range.
      confidence: medium
      confidenceRationale: The nearly complete skeleton and character matrix are direct primary evidence, while early dinosaur branching remains sensitive to taxon and character sampling.
      referenceLinks:
        - referenceId: nesbitt-2009-tawa-saurischian
          relation: supports
          pages: 1530–1533
          figure: Figures 1–3; Supplementary Information
          quoteLocator: Holotype; character analysis; early-dinosaur phylogeny
    - subjectId: taxon:saurischia
      claimKind: scientific
      claimType: fossil-range
      statement: Saurischia is displayed at 215–213 Ma only as the dated Late Triassic Tawa-bearing interval used in the sampled saurischian analysis, not a Saurischia origin date. The interval is a source-bounded sample window, not a global FAD, LAD, divergence date, continuous occupancy claim or direct-ancestor assertion.
      confidence: medium
      confidenceRationale: Saurischia uses Nesbitt, S.J.; Smith, N.D.; Irmis, R.B.; Turner, A.H.; Downs, A.; Norell, M.A. (2009) because the cited pages and locator expose the sampled taxon, specimen or living sequence set. Confidence is medium and applies only to Chinle Formation Tawa sample, Ghost Ranch, New Mexico; broader endpoints remain unclaimed.
      referenceLinks:
        - relation: supports
          referenceId: nesbitt-2009-tawa-saurischian
          pages: 1530–1533
          figure: Figures 1–3; Supplementary Information
          quoteLocator: Holotype; character analysis; early-dinosaur phylogeny
        - relation: contextualizes
          referenceId: ics-2026-06
          pages: International Chronostratigraphic Chart v2026/06
          figure: Global chronostratigraphic scale
          quoteLocator: Numerical boundaries for named geological stages used to bound the source sample
  claim-rationales.zh:
    - 近完整骨架和字符矩阵是直接主研究证据，而早期恐龙分支仍受类群与字符取样影响。
    - Saurischia 采用 Nesbitt, S.J.; Smith, N.D.; Irmis, R.B.; Turner, A.H.; Downs, A.; Norell, M.A.（2009）的论文，因为所引页码与定位符直接标示了研究采样的类群、标本或现生序列集合。中等置信度仅适用于 Chinle Formation Tawa sample, Ghost Ranch, New Mexico；更宽泛端点保持未声明。
  claim-statements.zh:
    - 蜥臀目表示把 Tawa 置于蜥臀目内的早期恐龙取样矩阵；该结果是系统发育假说，不把 Tawa 视为直接祖先，也不建立精确支系范围。
    - Saurischia 仅以 215–213 Ma 展示为系统分析所用 Tawa 含化石层的晚三叠世区间，而非蜥臀类起源日期。该区间是来源限定的样本窗口，不是全球首现、末现、分化日期、连续占据或直接祖先断言。
