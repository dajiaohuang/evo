  claim-rationales.zh:
    - 两项一手分析在不同数据和控制下都报告较强内部支持，因此对“存在冲突”高度可信，但单一拓扑仍有争议。
  claim-statements.zh:
    - 一项包含 1,719 个基因的分析在位点异质模型下支持多孔动物为其他动物的姐妹群，而另一项扩大栉水母取样的独立研究支持栉水母为姐妹群；动物根部位置仍对模型和取样敏感。
