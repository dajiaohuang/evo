    - subjectId: event:animal-root-competing-models
      claimKind: scientific
      claimType: topology
      statement: One 1,719-gene analysis supports Porifera-sister under site-heterogeneous models, whereas an independently expanded ctenophore sample supports Ctenophora-sister; the animal root remains model- and sampling-sensitive.
      confidence: contested
      confidenceRationale: Both primary analyses report strong internal support under different datasets and controls, so confidence in the existence of conflict is high while a single topology is contested.
      referenceLinks:
        - referenceId: simion-2017-porifera-sister
