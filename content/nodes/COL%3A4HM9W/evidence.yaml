    facets:
      morphology:
        status: partially-supported
        claims:
          - text: "Herbs or shrubs sometimes scrambling or trailing up to 10-13 m (20 m), semi-succulent, sometimes forming dense thickets. Stems usually glabrous, more rarely pubescent. Leaves: lamina 3-14 x 1.5-9.5 cm, ovate to broadly elliptic, base rounded to broadly cuneate, usually oblique, often slightly decurrent, apex acute or rounded with often recurved mucronate point or retuse, glabrous to pubescent; petioles 8-40 mm long, pubescent to glabrous. Inflorescences terminal and lateral racemes, leaf-opposed, 5-30 cm long, rhachis pubescent. Flowers dimorphic, usually functionally unisexual, whitish to yellowish green. Pedicels 5-8 (10) mm long, pubescent. Bracts 1-2.5 mm long, subulate, pubescent. Bracteoles usually on middle or upper part of pedicels, 0.5-1.5 (3) mm long, subulate, pubescent. Sepals 2-4 x 1-2 mm, narrowly triangular to oblong ovate, acute, pubescent outside, pubescent to glabrous inside, reflexed at anthesis. Disk 1.5-2 mm in diam., more or less fleshy. Stamens 10-20 in 1-2 whorls; filaments-filiform, broadening towards base, pubescent to glabrous. Long staminate flowers: usually functionally male but sometimes developing fruit; stamens 3-6.5 mm long; filaments 3-5 mm long; anthers 0.5-1 x 0.5-0.75 mm; carpels 4-5, 1-1.5 x 0.75-1 mm, ovoid, connate at base only; styles 0.5-1.0 mm long, linear, broadening at base, pubescent to glabrescent; stigmas linear. Short staminate flowers: functionally female; stamens 1.5-3.0 mm long; filaments 1-2.5 mm long; anthers 0.5-1.0 x 0.25-0.5 mm, circular to oblong; carpels 4-5, 1.5-2 mm tall, ovoid, connate at base only, pubescent; styles 0.75-2 mm long, widening towards base, turned outwards, pubescent to glabrescent; stigmas linear. Fruit usually developed in short-staminate flowers only, 4-5 (8) lobed, 5-10 mm in diam., ripening orange or red, each carpel 3.5-5 x 2.5-4 mm, fleshy, remains of style pointing outwards at apex of each carpel, pubescent to glabrous. Seeds 2-3 mm in diam., discoidal, sometimes with ridged edge around circumference; testa shiny black."
