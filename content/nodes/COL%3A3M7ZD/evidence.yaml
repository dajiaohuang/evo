        claims:
          - text: Perennial, loosely tufted, up to 1 m high. Leaf blades 1.5-8.0 mm wide. Leaves conspicuously woolly, greyish to blue-green. Spikelets 3-4 mm long; lower glume awn never exceeding 0.5 mm; upper glume awn to 1 mm long; upper floret male.
