        metadataVariant: 0
        usage:
          title: Drymonia macrophylla (Oerst.) H.E.Moore, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Terrestrial or epiphytic herbs or shrubs or rarely vines; stem lax or erect, to 1.5 m tall, to 1 cm thick, subquadrangular, strigillose to glabrate. Leaves equal to unequal in a pair, elliptic, ovate, oblong, or oblanceolate, sometimes falcate, 8.2-35 cm long, 3.5-14 cm wide, membranous to subcoriaceous, the apex acute to acuminate, the base cuneate or acute, sometimes unequal, denticulate to crenate or serrulate, above green, strigillose to scabrous, below light green or reddish, especially between the veins, strigillose, the veins prominent; petioles thick, 1-5 cm long, strigillose. Inflorescences in the upper leaf axils, 1-few flowered; peduncles lacking; bracts small; pedicels short, less than 1 cm long. Flowers with calyx lobes thin, subequal, ovate, 1.0-1.5(-2.8) cm long, green, or with red veins, or all red, strigillose, the margin comblike, fimbriate, dentate or serrate, the apex sometimes mucronate; corolla pale yellow or cream, usually more yellow inside and with a red or purple area on the lower surface in the throat, the tube waxy with a short spur, ampliate toward the limb, not contracted above, 3-6 cm long, densely puberulent outside, the inside glabrous or glandular, the limb of rounded lobes spreading, ca. 0.5 cm long, the lower lobe longer, minutely toothed; stamens included, the filaments adnate to the base of the corolla tube, glabrous, later coiling, the anthers 3-5 mm long, at first coherent, after anthesis separating; disc gland thick, glabrous; ovary nearly glabrous to pubescent, green, the style white, puberulent, the stigma stomatomorphic. Chromosomes 2n = 18 (Lee, 1962).
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 6279
