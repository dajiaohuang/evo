  claims:
    - subjectId: event:purgatorius-garbani-tarsals
      claimKind: scientific
      claimType: morphology
      statement: Isolated UCMP 197509, UCMP 197517 and related late Puercan tarsals preserve arboreal euarchontan ankle morphology and are attributed to Purgatorius in the cited comparative analyses, without demonstrating crown-Primate status.
      confidence: medium
      confidenceRationale: Medium confidence separates directly preserved ankle anatomy from an attribution based on size, abundance and morphology and from functional and phylogenetic interpretations.
      referenceLinks:
        - referenceId: chester-2015-purgatorius
          relation: supports
          pages: 1487–1492
          figure: Figures 1–3; SI Appendix Figures S1–S5 and Tables S1–S3
          quoteLocator: "Results and Materials and Methods: attribution regressions and three phylogenetic analyses"
  claim-rationales.zh:
    - 中等置信度把直接保存的踝部解剖，与基于大小、数量和形态的归属，以及功能和系统发育解释分开。
  claim-statements.zh:
    - 孤立的 UCMP 197509、UCMP 197517 及相关晚 Puercan 期跗骨保存了树栖真灵长总目式踝部形态，并在所引比较分析中归入 Purgatorius，但不能证明其属于灵长目冠群。
