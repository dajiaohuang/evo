        claims:
          - text: Twiggy shrub to 1 m. Leaves at branch tips and on short shoots, terete, linear or with 3-5 linear lobes, 2-30 mm long. Flower heads radiate, solitary on long peduncles in upper axils, yellow.
            sourceIds:
              - sanbi_14144_0
            locator: "SANBI/WFO archive Morphology row 10422; source 14144.0; publication: Manning, JC; Goldblatt, P. 2012. Asteraceae: Euryops (Cass.) Cass. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 372 - 375. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: E. subcarnosus in the present circumscription is the most widely spread and also the most variable of the South African species. It belongs to a critical group, which has suffered much confusion in literature and herbaria. The complex pattern in this group is partly due to the wide distribution in ecologically very diverse environments and partly to the occurrence of polyploidy. A full understanding of the group can be accomplished only by detailed cytological and experimental investigations, and the present taxonomic treatment should be regarded as preliminary. The considerable variation in, e.g., size of pollen grains indicates the urgency of further cytological studies. My attempts at a more natural classification have resulted in 1) the separation of several taxa as species distinct from E. subcarnosus (E. multifidus, cuneatus, pleiodontus, namaquensis, namibensis), and 2) the distinction of four subspecies within E. subcarnosus. The four subspecies are quite characteristic in their extreme forms, but they are apparently closely related and in some cases connected by transitional forms. There is considerable variation in length of style branches of the disc-florets between and within the subspecies, but the pistils are always functionally fertile. Size and shape of the florets are less variable.
            textZh: SANBI 条目提供了该种的鉴别特征。
            sourceIds:
