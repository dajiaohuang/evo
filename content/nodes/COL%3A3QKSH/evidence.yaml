          - text: It is easily recognized by its elliptic serrate leaves and flowery branches with a long filiform spreading pedicel in each leaf-axil. In foliage it much resembles J. phlogiflora (with flowers in terminal racemes) and the two species may hybridize where their areas meet somewhere north of East London; Winkler 57 (NBG, STE), collected between the Quinera (Kwerera) and Gonubie rivers appears to be just such a hybrid.
