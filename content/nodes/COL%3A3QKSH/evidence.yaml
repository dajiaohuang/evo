    facets:
      morphology:
        status: partially-supported
        claims:
          - text: "Perennial herb; stems c. 150-600 mm long, eventually several tufted from a woody caudex up to c. 20 mm in diam., but will flower when young and then single-stemmed, erect or diffuse, eventually well-branched, glandular-puberulous, hairs up to 0.1-0.7 mm long, glistening glands as well, very leafy. Leaves opposite becoming alternate upwards, pseudofasciculate, largest primary leaves 15-45 x 3-20 mm, narrowly to broadly elliptic, apex obtuse to subacute, base cuneate tapering into a short petiolar part, margins coarsely serrate, the teeth sometimes few-toothed, glandular-puberulous, hairs up to 0.1-0.5 mm long all over upper surface, hairy mainly on veins below, glistening glands as well mainly on lower surface. Flowers solitary in the leaf-axils. Pedicels mostly 12-27 mm long, filiform, often spreading and curved in an elongated S. Calyx tube 0.1-0.2 mm long, lobes 2-2.25 x 0.4-0.75 mm, oblong, acute or subacute, glandular-puberulous, hairs up to 0.15-0.4 mm long, glistening glands as well. Corolla tube 6.5-7 x 1.2-1.8 mm in throat, cylindric, abruptly expanded near apex, limb oblique, c. 8-9 mm across lateral lobes, posticous lobes 4-5 x 1.7-2.3 mm, anticous lobe 4.2-5 x 2-3 mm, all lobes oblong to cuneate-oblong, tips often ± truncate or retuse, glandular-puberulous outside, hairs up to 0.2-0.3 mm long, glistening glands as well mainly on backs of lobes, transverse band of clavate hairs in throat extending briefly onto lower lip, all lobes white or pale mauve, orange in throat. Stamens: posticous filaments 0.7-1 mm long, anthers 0.7-0.8 mm, anticous filaments 0.6-0.7 mm long, anthers 0.4-0.5 mm, all filaments glandular-puberulous. Stigma c. 0.2 mm long. Style 4.3-4.8 mm long. Ovary 1-1.4 x 0.7-0.8 mm. Capsules c. 2.5-5 x 2-2.5 mm, glistening glands and minute glandular hairs all over. Seeds c. 0.7-1 x 0.6-0.75 mm. Flowering has been recorded in all months."
            sourceIds:
