          - text: Distinguished from R. citrina by its bracts with pronounced brown streaks on the margins and tip, and from R. luteoflora by its corm and its ripe capsules which are on almost straight peduncles on an elongated stem.
            textZh: SANBI 条目提供了 Romulea pearsonii M.P.de Vos 的鉴别特征。
            sourceIds:
              - sanbi_12511_0
            locator: "SANBI/WFO archive Diagnostic row 51688; source identifier 12511.0; cited publication: De Vos, MP. 1983. Syringodea, Romulea, Fl. S. Africa 7(2,2): 1 - 76. Botanical Research Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: One of a small group of Namaqualand species with prominent, brown-flecked membranous apices to the outer bracts, distinguished by the stemless habit and yellow, funnel-shaped flowers. This group shares similar leaf anatomy, notably the development of sclerenchyma vascular girders and rib marginal fibre strands, and absence of phloem caps on the secondary bundles.
