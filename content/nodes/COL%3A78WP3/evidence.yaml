    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, mostly up to 100 mm tall, corm with a crescent-shaped basal ridge, stem branching below the ground. Leaves several, filiform, narrowly 4-grooved. Flowers pale yellow often fading cream; bracts green with narrow, brown-streaked hyaline margins.
            textZh: Romulea pearsonii M.P.de Vos 的 SANBI 物种条目记录了形态特征。
            sourceIds:
