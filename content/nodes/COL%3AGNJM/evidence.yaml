    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Perennial, rhizomatous herb, 0.25-1.20 m high, grows solitary; stem slender, robust. Leaves lanceolate-acuminate, with dense venation, apex brown, margins usually translucent-brown. Spathes lanceolate, finely veined, margins and apex rusty brown. Bracts usually ovate, with dark irregular triangle at base and brown streaks at margins, apex acuminate and deeply lacerated. Inflorescence unbranched or a lax panicle; 1- or 2-flowered rhipidia, sometimes binate, mostly sessile; outer tepals ± equal to inner tepals. Ovary with trilobed stigma, each lobe deltoid and finely crested. Flowering time Aug.-Jan. Capsule slightly oblong, tricarpellate.
