        usage:
          title: Serjania darcyi Croat, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Tendrilled lianas; stems terete to 6-costate, tomentose; wood simple. Leaves biternate; petioles 1-4 cm long, ribbed on the upper surface, glabrous and weakly viscidulous or villous at least on the upper surface; rachis terete to weakly winged; leaflets lanceolate to obovate-elliptic, viscidulous, hirtellous on both surfaces, especially dense on the midrib and veins above, the vein axils of the lower surface sometimes with tufts of trichomes, the midrib prominently raised, the margins subentire to weakly serrate or conspicuously crenate above the middle, the teeth and the tip of the acumen with a conspicuous gland. Thyrses narrow, borne on tendrils, 4-15 cm long. Flowers white, to 4.5 mm long; pedicels 2-3 mm long, articulate near the middle, the pedicel and calyx tomentose; sepals ovate, glabrate to tomentose within, ca. 3 mm long; petals narrowly obovate, 3 mm long, glabrous, sparsely glandular within, the scales to 2.6 mm long, the basal part rounded, cili- ate, weakly villous on the inner surface, the crest orange, thin along the upper margin, rounded, the deflexed appendage ca. 1.3 mm long, only slightly longer than broad, densely and finely white-villous in the lower 2/3; anterior disc glands as broad as long, much thickened at the base, glabrous; staminate flowers with the stamens to 3.5 mm long, the filaments flattened, finely short-villous, the pistil minute. Fruits not known.
          originalLanguage: en
          sourceField: general
