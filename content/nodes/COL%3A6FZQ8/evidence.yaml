    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Perennial, shortly rhizomatous and tufted (densely, erect), up to 1.2 m high. Leaf blades up to 250 mm long, 2-4 mm wide. Spikelets 5-10 mm long, 1.9-4,0 mm wide, with rhachilla persistent, lemmas and/or paleas breaking up from base upwards; lemma with hairs 0.3-1.2 mm long on lateral nerves and sometimes on median keel; palea keels with hairs 0.3-1.2 mm long which extend beyond lemma; anthers 3, 1.2 mm long.
            textZh: Eragrostis lappula Nees 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_11118_0
            locator: "SANBI/WFO archive Morphology row 1874; source identifier 11118.0; cited publication: Herman, PPJ; Retief, E. 1997. Plants of the northern provinces of South Africa: Keys and diagnostic characters. Strelitzia 6: 1 - 681. National Botanical Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: "Two varieties have been recognised: var. lappula with inflorescence branches adpressed to the central axis; var. divaricata with inflorescence branches lax. As intermediates have been found, the varieties have not been upheld in this treatment. Similar to E. hierniana, which has lemma lateral nerves glabrous, and E. inamoena, which has palea keels scabrid."
            textZh: SANBI 条目提供了 Eragrostis lappula Nees 的鉴别特征。
