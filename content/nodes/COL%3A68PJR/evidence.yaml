            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: The species is variable in the length of the perianth segments, especially the petal- and lip-lobes, and of the spur, which varies from 75-230 mm across its wide geographic range. The basal fusion of the lip with the stigmatic processes, lateral sepals and lower petal lobes is also variable, ranging between 7.0 and 17.5 mm. In northern KwaZulu-Natal, South Africa, the species is most likely to be confused with B. lamprophylla, which has spurs of comparable length, 92-131 mm long, and similar cucullate rostellum median lobe with incurved apex and ciliate margins. However B. steudneri has slightly smaller flowers and differs in its forward projecting, strongly deflexed lateral sepals and shorter lip lateral lobes (35.5-60.0 mm vs 106-135 mm).
