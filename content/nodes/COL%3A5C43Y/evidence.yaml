        claims:
          - text: Cormous geophyte, 4-15 cm. Leaves linear. Flowers white with dark margins, tube ± as long as tepals, 2-4 mm long.
            textZh: Wurmbea hiemalis B.Nord. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13859_0
            locator: "SANBI/WFO archive Morphology row 11063; source identifier 13859.0; cited publication: Manning, JC; Goldblatt, P. 2012. Colchicaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 80 - 83. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: May be confused with W. monopetala, which is sometimes rather similar and may be the closest relative. W. hiemalis differs from the latter by the denser spike with smaller and more campanulate flowers, shorter and closer perianth segments which are dark-margined from the base, and by the longer filaments, which are about half as long as the perianth segments.
            textZh: SANBI 条目提供了 Wurmbea hiemalis B.Nord. 的鉴别特征。
