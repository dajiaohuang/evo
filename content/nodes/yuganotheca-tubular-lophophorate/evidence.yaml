  claims:
    - subjectId: event:yuganotheca-tubular-lophophorate
      claimKind: scientific
      claimType: topology
      statement: The referred 710-specimen Yuganotheca elegans sample collectively supports a reconstruction combining paired agglutinated valves, a horseshoe-shaped lophophore, a bipartite tubular attachment structure and a long pedicle; no individual fossil is asserted to preserve this entire suite, and the mosaic supports comparison near the brachiopod–phoronid stem region without resolving exact ancestry.
      confidence: medium
      confidenceRationale: The character combination is reconstructed collectively from referred Chengjiang specimens, while homology of the tube and valves and its exact lophophorate position remain topology-dependent.
      referenceLinks:
        - referenceId: zhang-et-al-2014-yuganotheca
          relation: supports
          pages: Materials and Methods—Material; Description; Figures 1–3, 6
          figure: Figures 1–3, 6
          quoteLocator: Materials and Methods, Material (710 referred specimens); Description and Figures 1–3 (anatomical reconstruction); Figure 6 (phylogenetic comparison)
  claim-rationales.zh:
    - 澄江归入标本共同重建混合性状；管、壳瓣的同源性及确切触手冠动物位置仍依赖拓扑。
  claim-statements.zh:
    - 由 710 件归入标本组成的 Yuganotheca elegans 样本共同支持一项复原，其结合成对胶结壳瓣、马蹄形触手冠、二分式管状附着结构和长肉茎；并不声称任何单件化石保存这整套性状，该镶嵌支持与腕足动物—帚虫动物干群区域比较，但不能解决确切祖先关系。
