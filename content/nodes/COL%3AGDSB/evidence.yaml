        usage:
          title: Ardisia scheryi Lundell, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Trees, to 20 m high; branchlets reddish, stout, minutely lepidote at first. Leaves petiolate, the petioles narrowly winged, to 8 mm long; leaf blades entire, sparsely and minutely lepidote at first, coriaceous, drying reddish- brown, paler beneath, lanceolate or lanceolate-elliptic, 4.5-15 cm long and 1.6-5.4 cm wide, acuminate apically, acutish basally, decurrent, primary veins conspicuous on both surfaces, reticulate. Inflorescences terminal, pyramidal, 3-4-pinnately paniculate, to 20 cm long and 25 cm wide, sparsely lepidote, reddish-brown. Flowers 5-merous, pale pink, numerous, umbellate; pedicels slender, 2-3 mm long, glabrous; flower buds ovate-elliptic, ca. 3 mm long; sepals ovate, ca. 0.75 mm long and 0.6 mm wide, subentire, scarious, prominently orange-punctate; corolla 4 mm long, the petals short-connate basally ca. 0.75 mm, lanceolate-elliptic, acutish, orange-punctate, glabrous; stamens 3-3.5 mm long, the filaments attached at the base of tube, slender, 1.5 mm long, the anthers thick, oblong-elliptic, or ovate-elliptic, 1.5-2 mm long, rounded and shal- lowly notched apically; ovary smooth, globose, glabrous, the ovules small, numerous, pluriseriate, the style slender, 3.5 mm long.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 8294
