        usage:
          title: Rinorea squamata S.F.Blake, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrub or small tree, 2.5-6 (12) m high, the trunk to; 6.5 (20) cm in diam, the branchlets ferruginous-puberulous and sparsely hirsute. Leaves opposite, the petioles up to 8 mm long, puberulous and sparsely hirsute; blade usually slightly oblique, narrowly obovate-elliptic to obovate-elliptic, or narrowly elliptic, acute to obtuse at the base, rather abruptly long-acuminate at the apex, crenulate to ser- rulate to subentire at the margins, up to 13 cm long and 5 cm wide, chartaceous, puberulous and sparsely hirsute especially along the prominent midvein below. Racemes terminal, up to 6 cm long, the rhachis ferruginous-puberulous. Flowers with the pedicels up to 2.5 mm long, minutely ferruginous-puberulous, the bracteoles broadly ovate, ca 0.8 mm long, minutely ciliolate, ferruginous-puberulous especially along the thickened midvein; sepals subequal, broadly to very broadly ovate, acute to subobtuse, 1.1-1.6 mm long and 1.1-1.3 mm wide, minutely ciliolate, ferruginous-puberulous especially along the midvein; petals + oblong, obtuse and reflexed, 4-4.5 mm long and 1.1-1.3 mm wide, whitish or yellowish, minutely ciliolate; stamens 2.8-3 mm long, the filaments free, large, ca 1 mm long, the dorsal appendages oblong, about as long as or slightly shorter than the filaments, about as wide as the latter, free from near the middle; anthers 1-1.2 mm long, unap- pendaged, the connective dilated from the base into brownish, ovate, obtuse; to + acute, basally erosulose scales exceeding the anthers by ca 1-1.2 mm; ovary subglobose, densely hispid-pilose, the placentae 1-ovulate; style ca 2.5 mm long, glabrous. Capsule ovoid, 3-lobulate, narrowed at the base, acuminate-mucronate at the apex, ca 2 cm long, the valves cymbiform, the pericarp coriaceous, slightly reticulate, hirsute-hispid; seeds ca 6 mm long, glabrous.
