    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Roughly hairy shrublet to 1.5 m. Leaves oblong, 3-toothed above. Flowers solitary in upper axils, secund on horizontal racemes, bell-shaped, mauve with dark venation.
            sourceIds:
              - sanbi_14353_0
            locator: "SANBI/WFO archive Morphology row 8442; source 14353.0; publication: Manning, JC; Goldblatt, P. 2012. Malvaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 613 - 621. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: This woody much branched shrub is characterized by the linear leaves which are usually 3-toothed at the apex, although sometimes very shallowly so, and the drooping, bell-shaped flowers secund towards the apices of the branchlets. The petals are reminiscent of flies’ wings and fold together to give a truncate appearance to the flower. Often the filiform styles are shortly exserted. The short, broad, 5-lobed capsules, partly concealed by the persistent perianth, are made conspicuous by the pairs of pilose horns spreading horizontally from the apices of the lobes.
            textZh: SANBI 条目提供了该种的鉴别特征。
            sourceIds:
              - sanbi_815_0
            locator: "SANBI/WFO archive Diagnostic row 73306; source 815.0; publication: Verdoorn, IC. 1980. Revision of Hermannia subgenus Hermannia in southern Africa. Bothalia 13(1&2): 1 - 63. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
