        metadataVariant: 0
        usage:
          title: Warszewiczia coccinea (Vahl) Klotzsch, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Trees to 12 m tall, the branches stout, angular, drying brown or black brown, relatively smooth, rimose, minutely puberulent to appressed pilose. Leaves ob- long, 5-45(-60) cm long, 10-20(-23) cm wide, tapering acutely or deltoidly at the apex, acuminate, the acumen to 2 cm long, the costa plane or prominent above, prominent beneath, the lateral veins 15-24, widely arcuate or arising from the costa almost perpendicularly, stiffly papyraceous, glabrate above, puberulent on the veins beneath; petioles 2-5 cm long, 0.8-1.1 cm wide, acute, golden puber- ulent, striate. Inflorescences terminal, to 60 cm long, the cyme usually subrotund or flabellate in appearance, disposed as a racemiform panicle, the clusters 1.5- 5.5 cm apart; peduncles suppressed or to 2.5 cm long. Flowers with the hypan- thium compressed rotund, ca. 1 mm long, the hairs dense, tawny, appressed, the calycine cup somewhat shorter than the hypanthium, its hairs often deciduous, the lobes 5, rotund, ca. 0.5 mm long, at least 1 flower in the cyme with an enlarged lobe, the lobe red, foliose, long stipitate, elliptic calycine to 12 cm long, to 4 cm wide, the blade usually slightly longer than the stipe, venose, glabrescent; corolla orange red, yellow or orange, 6-8 mm long, the tube short, cylindrical, expanded toward the apex, a little longer than the lobes, thickly petaloid, glabrous or gla- brescent outside, pubescent within at the point of filament attachment, the lobes 5, oblong or oblong rotund, 3 mm long, rounded, truncate or attenuate toward apex; stamens 5, the anthers oblong, ca. 1.6 mm long, petaloid, acuminate at the apex, the filaments subulate, 3 mm long, villose at the base; style crassate, to 5.5 mm long, the stigmas 2, rotund, exserted from the corolla. Fruits capsular, septi- cidally dehiscent, pilosulose; seeds to 1 mm long.
          originalLanguage: en
          sourceField: general
