        status: partially-supported
        claims:
          - text: Acaulescent, cormous geophyte, 4-6 cm, stem very short. Leaves rigid, almost pungent, velvety hairy. Flowers zygomorphic, mauve with yellow markings, inner bracts forked to ± middle, ovary hairy.
            textZh: Babiana cedarbergensis G.J.Lewis 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 6699; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Superficially resembling the widespread and well-known Babiana ambigua in the narrow leaves and acaulescent habit, B. cedarbergensis has inner bracts divided only in the upper third, whereas B. ambigua has the inner bracts divided to the base. Other differences between these two species are the thick fibrous neck around the base of the stem, stiff, straight leaves, and hairy ovary of B. cedarbergensis, whereas B. ambigua has a poorly developed neck of fibres around the base, firm but not rigid leaves, and a hairless ovary. The resemblance to B. ambigua is presumably convergent. Babiana cedarbergensis is restricted to higher elevations in the Cederberg and is endemic to the Northwest Centre of the Cape Floristic Region. The hairy ovary of B. cedarbergensis is unusual in section Teretifolieae.
            textZh: SANBI 条目提供了 Babiana cedarbergensis G.J.Lewis 的鉴别特征。
