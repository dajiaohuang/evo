  claims:
    - subjectId: taxon:homoscleromorpha
      claimKind: scientific
      claimType: morphology
      statement: Gazave and colleagues distinguish Homoscleromorpha with small skeletal spicules (Plakinidae) from those without spicules (Oscarellidae); their revised diagnoses describe varied aquiferous organization, not a mineral skeleton shared by every member of the class.
      confidence: high
      confidenceRationale: The study's revised family diagnoses explicitly contrast spicule presence and absence, supported by the sampled molecular groups; the description does not infer a date or direction of skeletal evolution.
      referenceLinks:
        - referenceId: gazave-2010-homoscleromorph-subdivision
          relation: supports
          figure: Figure 6
          quoteLocator: "Discussion: subdivision into two clades; revised diagnoses and key for Plakinidae and Oscarellidae"
    - subjectId: taxon:homoscleromorpha
      claimKind: scientific
      claimType: taxonomy
      statement: Molecular and morphological evidence supports recognizing Homoscleromorpha as a fourth sponge class rather than retaining it within Demospongiae; this taxonomic revision is not an origin-time claim.
      confidence: high
      confidenceRationale: Independent character systems converge on the class-level revision, though rank assignment does not itself establish age or ancestry.
      referenceLinks:
        - referenceId: gazave-2012-homoscleromorpha
          relation: supports
          pages: 3–10
          quoteLocator: Evidence synthesis; formal class nomination; diagnosis
    - subjectId: taxon:homoscleromorpha
      claimKind: scientific
      claimType: fossil-range
      statement: "Homoscleromorpha has no supported scalar temporal range in the cited evidence: formal recognition of the living class supplies taxonomy but no fossil boundary, so the former 0–0 placeholder is withheld rather than presented as a range."
      confidence: low
      confidenceRationale: Gazave et al. (2012) supports class recognition and diagnosis, not temporal endpoints. Low confidence prevents a living-only taxonomic source from being misread as a 0 Ma origin.
      referenceLinks:
        - relation: supports
          referenceId: gazave-2012-homoscleromorpha
          pages: 3–10
          figure: Formal diagnosis
          quoteLocator: Evidence synthesis and formal class nomination
  claim-rationales.zh:
    - 研究修订的科级诊断明确区分骨针的有无，并得到所采样分子分组的支持；该描述不推断骨骼演化的年代或方向。
    - 独立性状系统共同支持纲级修订，但等级划分本身不确定年代或祖先关系。
    - Gazave 等（2012）支持纲的建立与鉴定，而不支持时间端点。低置信度避免把仅涉及现生类群的分类来源误读为 0 Ma 起源。
  claim-statements.zh:
    - Gazave 及同事区分了具有小型骨针的同骨海绵（Plakinidae）与没有骨针的同骨海绵（Oscarellidae）；其修订诊断描述了不同的水沟系组织方式，并不认为该纲所有成员都具有矿物骨骼。
    - 分子与形态证据支持把同骨海绵识别为海绵动物第四个纲，而不再置于寻常海绵纲；这一分类修订不是起源时间主张。
    - 现有引证不支持 Homoscleromorpha 的单一时间范围：现生纲的正式建立只提供分类学信息，没有化石边界，因此旧有 0–0 占位值被暂缓而不再作为范围展示。
