        usage:
          title: Lycianthes howardiana D'Arcy, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: High climbing shrub or vine, Por tree, stems puberulent with short, dense intertwined stellate hairs,4 the radii slender, whitish and intertwined. Leaves ovate, to 13 cm long, apically acuminate, basally rounded, slightly dimidiate, the margins slightly revolute, membranaceous, glabrescent above with a few hairs remaining on the major veins; beneath fine tomentose with short-stalked, slender- radiate hairs, the veins 5-8 on each side of the midvein, conspicuous beneath; petioles slender, puberulent, channelled above; minor leaves wanting. In- florescences terminal, becoming axillary on short shoots bearing one leaf, 1-5-flowered, congested; piedicels stout, tomentose, sometimes lanate, 5-6 mm long. Flowers with the calyx- lanate-tomentose with whitish stellate hairs, the teeth 10 mm long, appearing stout because of the dense tomentum, the sleeve 1-2 mm long, glabrescent, not much altering in fruit; corolla 13 mm long, glabrous at the base and on the ample plicae, the interplicae thickened and mostly densely white pubescent with sessile stellae which bear elongate, flattened radii; androecium and gynoecium not seen. Mature fruit a bright orange, juicy berry 20 mm long; seeds much compressed, yellow-orange, 3 mm long, broadly elliptical in outline.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 13249
          archiveSourceId: F2B48BD1-70B3-4F38-B25C-63E9429BF683
