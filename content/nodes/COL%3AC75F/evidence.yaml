        usage:
          title: Alseis blackiana Hemsl., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Trees to 75 ft tall; twigs terete, ultimately angular, the nodes well spaced or crowded, glabrous. Leaves obovate oblong, to 36 cm long, to 9.5 cm wide, cu- neate at the apex, often cuspidate, the cusp to 1 cm long, cuneate or rarely truncate at the base, equilateral, rarely subinequilateral, the costa prominulous above, prominent beneath, diffusely villose above, the hairs weak, these short and long, occasionally aggregated in the axils, the secondary veins ca. 25, the distal veins widely arcuate, the proximal veins perpendicular, chartaceous, usu- ally scarcely discolorous, glabrous except on the costa and the veins; petioles rigid, to 3 cm long, to 0.2 cm wide, angular, the blade decurrent on the upper part of petiole; stipules deciduous, subulate, to 1.5 cm long, ca. 0.12 cm wide, scarious, glabrous. Inflorescences usually several in the axils of the terminal leaves, spiciform-cylindrical, ascending, the peduncles unbranched, ascending, often falcate, shorter than or exceeding the leaves, to 12 cm long, to 0.3 cm wide, lignose, puberulent, usually lenticellate. Flowers with pedicels slender, pubes- cent, to 0.2 cm long, the bracts basal, linear, about as long as the pedicel; hy- panthium narrowly cuneate cylindrical, ca. 1.2 mm long and indistinguishable from the pedicel, minutely puberulent, the calycine tube obsolete, the teeth 5, erect, or spreading, oblong deltoid, subequal, to 0.5 mm long, obtuse; corolla white, or pale yellow, inflated, urceolate, ca. 2.2 mm long, often slightly con- stricted medially, densely white-villose within, glabrate outside, petaloid, the orifice wide, the lobes 5, much reduced, inflexed slightly, oblong, to 0.5 mm long, obtuse; stamens 5, exserted, the anthers oblong, ca. 1 mm long, versatile, the filaments subequal, ribbonlike, ca. 6 mm long, densely villose ca. 1 mm above the base, attached at base of tube; ovarian disc prominent, mound-shaped, 2-3- lobed, 0.3-0.6 mm long, the style slender, ca. 3 mm long, expanded apically, the stigmas 2, coiled, ca. 1.3 mm long, glabrous, the ovary thin walled, the septum thin, the placentas intrusive, thick, the ovules numerous. Fruits with pedicels to 0.2 cm long, before dehiscence narrow-oblong, 1.2 cm long, ca. 0.2 cm wide, often falcate, penis-like or operculoid at apex, attenuate at base, lignose, drying brown, delicately longitudinally veined, puberulent and farinose, dehiscing from apex to base, the valves 2, drying lustrous yellow within; seeds numerous.
