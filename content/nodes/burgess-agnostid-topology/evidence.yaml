          quoteLocator: Adult specimens; Appendage reconstruction; Phylogenetic analysis
  claim-rationales.zh:
    - 成体软解剖扩展了直接样本，但球接子类位置与生态仍对性状同源和类群取样敏感。
  claim-statements.zh:
    - 布尔吉斯页岩成体 Peronopsis 与 Ptychagnostus 标本保存软质附肢，并用于一套将球接子类恢复为多节三叶虫姐妹群的性状矩阵；该拓扑与游泳底栖生态属于分析解释，不是固有标签或直接祖先关系。
