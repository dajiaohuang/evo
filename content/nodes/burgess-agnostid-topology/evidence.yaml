  claims:
    - subjectId: event:burgess-agnostid-topology
      claimKind: scientific
      claimType: topology
      statement: Mature Burgess Shale Peronopsis and Ptychagnostus specimens preserve soft appendages used in a character matrix that recovers agnostinids as sister to polymeroid trilobites; the topology and nektobenthic ecology are analytical interpretations, not intrinsic labels or direct ancestry.
      confidence: medium
      confidenceRationale: Adult soft anatomy expands the direct sample, while agnostid placement and ecology remain sensitive to character homology and taxon sampling.
