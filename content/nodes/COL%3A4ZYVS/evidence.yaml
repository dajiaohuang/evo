        claims:
          - text: Slender, tuberous geophyte to 20 cm. Leaves basal, narrowly elliptic. Flowers few to many in a lax raceme, white to pink, lip 3-lobed, 5-9 mm long, spur 2-3 mm long.
            textZh: Stenoglottis woodii Schltr. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13882_0
            locator: "SANBI/WFO archive Morphology row 9986; source identifier 13882.0; cited publication: Kurzweil, H. 2012. Orchidaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 177 - 197. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: "Stenoglottis woodii is most morphologically similar to S. macloughlinii. They are, however, easily distinguished by differences in their floral spurs: S. woodii has short (0.4-1.5 mm), straight, sub-saccate, nectar-less spurs, whereas those of S. macloughlinii are longer (2.0-3.0 mm), usually curved, tapering and nectar-producing. The side lobes of S. woodii are rounded to truncate, and the apex of the midlobe is acute to obtuse; in S. macloughlinii all lobes tend to be wider and rounder than those of S. woodii. Stenoglottis woodii also flowers later than S. macloughlinii and has a more northeastern distribution."
            textZh: SANBI 条目提供了 Stenoglottis woodii Schltr. 的鉴别特征。
            sourceIds:
              - sanbi_18850_0
            locator: "SANBI/WFO archive Diagnostic row 104709; source identifier 18850.0; cited publication: Phillips, DP; Bytebier, B. 2020. A taxonomic revision of Stenoglottis (Orchideae, Orchidoideae, Orchidaceae). Phytotaxa 456(3): 219 - 243. [https://doi.org/10.11646/phytotaxa.456.3.1]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
