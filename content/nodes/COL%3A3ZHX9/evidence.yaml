        usage:
          title: Meliosma brenesii Standl., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Small to medium-sized tree 3-10 m tall; branchlets subterete, villous with reddish-brown trichomes, densely so when young, longitudinally striate. Leaves alternate, 9-27 cm long, 3-6 cm wide, oblanceolate or oblong oblanceolate, acu- minate, cuneate at the base, chartaceous, subentire to slightly and remotely ser- rate, drying dark olive gray above, olive with tannish main veins below, the lateral veins 12-15 on a side, the tertiary venation prominulous below and plane above, densely hirsute along the main vein above, less pubescent and glabrescent over the surface, below hirsute along the main veins, sparsely pubescent and glabrescent over the surface, more or less inconspicuously lepidote; petiole 0.3- 1 cm long, reddish hirsute. Inflorescence axillary, narrowly paniculate or almost racemose, the rachis rufous-hirsute, the flowers subsessile or with pedicels up to 3 mm long on 1-flowered secondary branches. Flowers with 4 sepals, broadly ovate, ca. 2 mm long and 3 mm wide, ciliate; outer petals white, falling explosively at anthesis (fide collector), suborbicular, 3-5 mm in diam., minutely ciliate, thin- ner only at extreme edge; stamens 2, the strap-shaped filaments 1.5-2 mm long, the basal appendages (reduced inner petals) also 1.5-2 mm long, the thecae thick, suborbicular, ca. 0.6 mm long, apically proximate, basally widely separated by the thickened connective; ovary conical, ca. 1 mm long, apically merging with the ca. 2 mm long style. Fruit subglobose, 1.8-2 cm in diam.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 12439
