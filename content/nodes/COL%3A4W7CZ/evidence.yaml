    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Slender, erect, annual herbs 5-20 cm high, simple or branched from the base; stems sometimes glandular or glandular-denticulate in the lower part. Leaves up to 1 cm long and 3 mm broad, linear-lanceolate to ovate-lanceolate, acute or acuminate, the lower ones reduced and often scale-like. Inflorescence a lax, 1-few-flowered cyme; bracts foliaceous, lanceolate or ovate-lanceolate, acuminate. Calyx of 5 segments, each 5.5-9 mm long, 1-2.25 mm broad, lanceolate to oblong-elliptic, acuminate, the sides hyaline, joined for up to 3 mm, with a keelwing 0.5-1.75 mm broad, broadest near the base. Corolla yellow; tube 5-6 mm long; lobes 5.5-8 mm long, 2.25-4 mm broad, ovate or broadly ovate, subacute or rounded, clawed. Filaments 1.3-2.75 mm long, inserted in the corolla-sinuses; anthers 1.5-2.5 mm long, each with a very small sessile apical gland or sometimes apparently eglandular. Style and stigma 5-7 mm long, without a stigmatic swelling or with a large swelling below the middle; stigma large, 2-lobed with very broad lobes.
            sourceIds:
              - sanbi_9228_0
            locator: "SANBI/WFO archive Morphology row 50314; source 9228.0; publication: Marais, W; Verdoorn, IC. 1963. Gentianaceae, Fl. S. Africa 26: 171 - 243. Dept. Agric. and Technical Services, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Closely related to S. filiformis, and with a similar distribution, but the floral differences appear to be constant. The sheet of Wilms 971 in the British Museum of Natural History is a mixture of S. bojeri and S. grandis.
