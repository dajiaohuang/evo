    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Annual herb, up to 450 mm tall. Leaves oblong to elliptic, base broad, clasping, margins entire; slightly fleshy; thinly cobwebby at first, glabrescent. Heads solitary, discoid; involucral bracts 6 or 7, 5.0-6.5 mm long. Achenes with white clavate hairs on angles. Flowers pink to lilac.
            sourceIds:
              - sanbi_11118_0
            locator: "SANBI/WFO archive Morphology row 1822; source 11118.0; publication: Herman, PPJ; Retief, E. 1997. Plants of the northern provinces of South Africa: Keys and diagnostic characters. Strelitzia 6: 1 - 681. National Botanical Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Although described in Senecio, S. transvaalensis is better placed in the tropical genus Emilia, and Mkuze is about as far south as this genus occurs in eastern Africa. Emilia is distinguished from Senecio by its shortly tailed style branches. This plant may prove to be S. lambomboensis Muschler, but there are several discrepancies with his description and the type specimen (Wilms 826, Olifantsriver, in den Lambombobergen) has not been traced.
            textZh: SANBI 条目提供了该种的鉴别特征。
            sourceIds:
              - sanbi_11711_0
            locator: "SANBI/WFO archive Diagnostic row 58681; source 11711.0; publication: Hilliard, OM. 1977. Compositae in Natal. Univ. Natal, Pietermaritzburg. [All rights reserved]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: This widespread species in the eastern regions of southern Africa is characterised by its grey-green, semi-succulent leaves and discoid capitula with pale pink or lilac florets. Its most southerly distribution is noted to be Mkuzi in KwaZulu-Natal. Bolus 12304 was selected as the lectotype because it has the most duplicates of the three syntypes, and the BOL specimen still has capitula attached whereas the PRE one does not.
            textZh: SANBI 条目提供了该种的鉴别特征。
            sourceIds:
              - sanbi_16005_0
            locator: "SANBI/WFO archive Diagnostic row 65884; source 16005.0; publication: Cron, GV. 2014. A synopsis of Emilia (Senecioneae, Asteraceae) in southern Africa. Phytotaxa 159(3): 195 - 210. [http://dx.doi.org/10.11646/phytotaxa.159.3.3]. [All rights reserved]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
