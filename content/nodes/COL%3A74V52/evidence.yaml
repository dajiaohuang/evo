          title: Ormosia cruenta Rudd, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Tree, to 30 m tall; stems reddish tomentose. Leaves imparipinnate, 5-11 fo- liolate, the rachis 8-10 cm long, velutinous, glabrescent; petioles ca. 2 cm long; leaflets subcoriaceous, elliptic to elliptic-oblong, 2-8 cm long, 1.0-3.5 cm wide, the apex acute, obtuse basally, glabrous above, shiny, glabrous below, somewhat shiny. Inflorescence racemose, terminal, axes reddish velutinous. Flowers 15-18 mm long; calyx reddish velutinous, ca. 10 mm long, 5-lobed, the teeth ca. 4 mm long; petals lilac; ovary subsessile, reddish villous, 3-5-ovulate. Fruit dehiscent, sublignous, glabrous, somewhat shiny, black, 1-seeded, 2.0-2.5 cm long, 1.5 cm wide, 1 cm thick; seeds red, 8-10 mm long, 9-10 mm wide, 7-9 mm thick, the hilum ca. 2 mm long, ca. 1.5 mm wide.
