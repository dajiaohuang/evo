  claim-statements.zh:
    - 超过 1,800 件 Waptia fieldensis 标本（包括具大颚的 ROMIP 56432 和离散标本 ROMIP 64294）记录了双瓣壳有颚类体制；其泛甲壳类位置和游泳捕食者生态仍是拓扑与功能解释。
