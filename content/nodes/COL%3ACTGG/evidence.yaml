    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Geophyte, up to 300 mm tall. Bulb ovoid, up to 160 mm in diameter, up to 250 mm long. Pedicels as long as, or longer than perianth tube. Apex of perianth lobes spirally recurved. Leaves strap-like, falcate. Umbel 3-56-flowered. Flowers pink to pinkish copper-brown.
            textZh: Ammocharis coranica (Ker Gawl.) Herb. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_11118_0
            locator: "SANBI/WFO archive Morphology row 212; source identifier 11118.0; cited publication: Herman, PPJ; Retief, E. 1997. Plants of the northern provinces of South Africa: Keys and diagnostic characters. Strelitzia 6: 1 - 681. National Botanical Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: "In both vegetative and floral characters A. coranica is extremely variable. The number and width of the leaves depends largely on the age and vigour of the bulb, whereas their length is dependent on the length of time the bulb has been in active growth. Similarly the number of flowers per umbel is dependent on the age and vigour of the bulb. The colour of the flowers varies in intensity and to some extent is correlated with age. The diverse way in which the colour has been defined by collectors can be accounted for partly by the difference in colour-judgment of the individual. The length of the perianth-tube is another variable character. In flowers taken from a herbarium sheet of a single gathering the variation was as from 0.8 to 2.0 cm. This figure is abnormally high, probably owing to the method of drying of the specimens concerned, although values from 0.8 to 1.6 cm are not infrequent. This clearly indicates that the length of the perianth-tube as a taxonomic character is of value only beyond fairly wide limits. Examination of a selection of specimens has shown that the number of ovules in each loculus is extremely variable: from 15 to 29 have been observed in a single gathering (Galpin's no. M 663), whereas in the type-specimen the number was as low as 6 ovules in a loculus. We have been unable to examine all the ovaries in any one umbel, a point which should be investigated when ample material becomes available."
            textZh: SANBI 条目提供了 Ammocharis coranica (Ker Gawl.) Herb. 的鉴别特征。
