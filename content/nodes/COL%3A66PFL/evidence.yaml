        claims:
          - text: Perennial, straggling, up to 0.6 m high. Leaf blades 80-150 mm long, 2-5 mm wide. Spikelets (sessile) 5-7 mm long (pedicellate longer). Racemes 2 or 3, pedicels linear; lower glume of sessile spikelets broadly rounded on either side of a deep deep central furrow, pitted between veins.
