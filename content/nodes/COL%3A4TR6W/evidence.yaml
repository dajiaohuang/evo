          - text: Shrub, with branches ± 300 mm long, internodes blackish grey. Leaves round to club-shaped, 20-35 x 5-8 mm, sea-green, tip blunt, surface long-papillate and velvety. Flowers solitary, 26-30 mm diam., sepals 6, petals 1 mm broad, magenta, filamentous staminodes and filaments arranged in pitcher-shape, apically purple, basally pink. Fruit 6-locular.
