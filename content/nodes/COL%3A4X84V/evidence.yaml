        usage:
          title: Sida linearifolia A.St.-Hil., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Herb, woody at the base, the stem erect, 60-90 cm high, simple or sparingly branched, stellate-subtomentose toward the apex. Leaves short-petiolate, the petiole 3-5 mm long, stellate-subtomentose, the stipules conspicuous, narrowly triangular, long-acuminate, about twice as long as the petiole, 7-8(-12) mm long and 1(-2) mm broad at the base, usually 3-nerved, ciliate at the margin, persistent even after the fall of the leaves; blade narrowly elliptic-rhombic to narrowly oblong, more or less rounded to subcordate at the base, acute at the apex, serrulate above the mid- dle along the margin, 1.5-3.5 cm long and 3.5-10 mm broad, discolor, 3- or sub-5- palminerved, the upper surface green, sparsely pilose, at length glabrate, the lower surface pale, minutely stellate-tomentellous to densely stellate-puberulus, and with the main veins prominent. Flowers axillary and mostly solitary, sometimes with a short accessory flowering branchlet in the same axil, the flowers toward the apex of the branches and branchlets subcorymbose, the pedicel terete, articulated above the middle, usually elongate and up to 1.7 cm long, densely and very mi- nutely stellate-puberulus; calyx campanulate, subplicate-5-angulate, lobed to about the middle, ca 7 mm long, foliaceous, green, with the 5 midribs and 5 commissural ribs markedly thickened and yellowish at the base, very minutely puberulus, hir- sute on the ribs and along the margins, persistent, the lobes broadly triangular, from the base long-acuminate; petals broadly obovate-cuneate, oblique, truncate at the apex, ca 7-8 mm long, white with usually a dark purple basal spot; androecium ca 4 mm long, the staminal tube ca 2 mm long, inconspicuously pilosulose, the filaments few; styles ca 3-3.5 mm long, connate halfway. Mericarps 5, trigonous, ca 2.5 mm long, chartaceous, glabrous, shortly 2-rostrate at the apex, dorsally and laterally more or less rugose-reticulate, apically dehiscent; seeds trigonous, ca 1.7-1.8 mm long, inconspicuously puberulus around the hilum.
