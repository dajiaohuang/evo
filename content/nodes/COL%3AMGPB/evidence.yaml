    facets:
      morphology:
        status: partially-supported
        claims:
          - text: In a controlled experiment on spinning Bombyx mori, temperature treatments affected cocoon morphology, stiffness, and strength, while relative humidity affected cocoon colouration. These are measured outcomes for the tested laboratory-reared silkworm groups, not species-wide or wild-population estimates.
            locator: Abstract; Methods, silkworm rearing and experimental design; Results on cocoon morphology and mechanical properties; Fig. 1.
            placeTimeScope: Ninety larvae from one four-way polyhybrid cross were assigned to nine temperature and humidity groups. The article does not report the experiment's location or dates in the cited methods locator.
            lifeStatus: Captive laboratory rearing of domesticated Bombyx mori larvae; no wild silkworms were studied.
            sourceIds:
              - offord2016
            originalLanguage: en
        gaps:
          - One laboratory cross and controlled environmental treatments do not establish species-wide cocoon variation across strains or wild populations.
