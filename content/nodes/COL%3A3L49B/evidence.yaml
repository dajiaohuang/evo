        claims:
          - text: Cormous geophyte mostly 8-14 cm. Leaves falcate or twisted, to 2 mm wide. Flower white, red on reverse of outer tepals, opening in late afternoon, tube 10-12. mm long.
            textZh: Hesperantha lithicola J.C.Manning & Goldblatt 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 6692; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Distinctive in its symmetrical, bell-shaped corm and narrow, often twisted or coiled leaves. It is evidently most closely allied to H. falcata, which it resembles in general appearance but from which it differs in its consistently narrower leaves, 1-2 mm wide vs. 4-8 mm in H. falcata, and longer perianth tube, 10-12 mm vs. 4-9 mm. The two species differ also in their habitats, with H. lithicola restricted to shallow soils on sandstone rock pavement, whereas H. falcata is a common and widespread species of seasonally moist, deeper clay or sandy soils. This ecological difference is evident at the type locality, where H. falcata occurs nearby on sandy flats not far from rocky outcrops where H. lithicola is found. Hesperantha lithicola is remarkably similar in general appearance to H. acuta but this species has a globose, asymmetrical corm with one side flattened and extended downward. Without corms, however, the two taxa are almost indistinguishable, although H. acuta does not occur on the Cold Bokkeveld and is typically found on clay soils, rarely limestone or in pockets of loam on sandstone outcrops.
            textZh: SANBI 条目提供了 Hesperantha lithicola J.C.Manning & Goldblatt 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 94875; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
