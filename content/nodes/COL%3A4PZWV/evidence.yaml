        claims:
          - text: Shrub or dwarf shrub, up to 0.6 m tall, with smooth, white bark. Leaves small, scattered, alternate, occasionally tufted, club-shaped, obtuse, narrowed at base, fleshy, glabrous. Flowerheads terminal, solitary, obconical; involucral bracts linear-lanceolate to lanceolate, long-acuminate, very acute, glabrous, margins membranous; disc florets yellow. Cypselas densely covered with long hairs.
