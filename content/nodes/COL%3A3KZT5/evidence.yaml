    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Tufted, evergreen perennial to 60 cm. Leaves in basal clusters, long-petiolate, lamina ovate, 65-120 mm long, both surfaces grey-felted, margins crenulate, base truncate to cordate. Flowers crowded in compound umbels on woolly peduncles, maroon. Fruit laterally compressed.
            sourceIds:
              - sanbi_14092_0
            locator: "SANBI/WFO archive Morphology row 8855; source 14092.0; publication: Magee, AR; Manning, JC; van Wyk, B-E; Tilney, PM. 2012. Apiaceae: Hermas L. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 327 - 328. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Hermas intermedia shares the large, adaxially felty leaves with H. gigantea and H. lanata. It can be distinguished from H. gigantea by the densely felty or lanate involucral bracts, involucellar bracts and penduncle, as well as having only the sepals maroon (entire umbels maroon in H. gigantea). It can be distinguished from H. lanata by the maroon sepals (cream in H. lanata), less rigid, adaxially short lanate leaves (rigid, long lanate, matted and shaggy in H. lanata) with usually truncate bases (prominently cordate in H. lanata).
            textZh: SANBI 条目提供了该种的鉴别特征。
