          title: Guapira costaricana (Standl.) Woodson, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Small dioecious trees to 10 m. tall. Branches moderately stout, glabrous, prominently lenticellate at maturity. Leaves rather crowded, petiolate, the blade predominantly elliptic to oblong-elliptic, acuminate, obtuse at the base, 2.5-10.0 cm. long, 1.5-4.5 cm. broad, subcoriaceous, glabrous, the petiole 0.5-1.0 cm. long. Inflorescences 3-6 cm. long, rather shortly pedunculate, many-flowered, minutely puberulent, conspicuously accrescent in fruit, the flowers sessile. Staminate peri- anth campanulate, about 3 mm. long, about 0.5 mm. in diameter at the base and 2 mm. at the orifice, minutely puberulent, greenish white or yellow, the stamens about half exserted. Pistillate flowers tubular-campanulate, the limb slightly spreading, about 2 mmn. long and 0.5 mm. in diameter, minutely puberulent- papillate. Anthocarps globose or subglobose, about 7-8 mm. long, black or purple when ripe.
