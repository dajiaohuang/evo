        usage:
          title: Stigmaphyllon puberum (Rich.) A.Juss., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Vine; moderately to densely appressed pubescent with T-shaped trichomes on most parts. Leaves opposite, oblong-ovate to ovate or lanceolate-ovate, long- acuminate, obtuse to rounded at the base, 8-17 cm long, 3-10 cm wide, glabrous above except for midrib, the lower surface glandular and densely appressed-pu- bescent throughout, with trichomes of 2 sizes, smaller closely appressed ones (type A) and larger shortly stalked ones (types B & D); glands sparse, dark stellate; the lateral veins of 7 or 8 pairs, the tertiary veins scarcely or not at all prominent; margin entire; petiole 1-4 cm long, with 2 sessile lateral glands at apex. Inflorescence a series of pseudo-umbels, axillary, to 12 cm long, divari- cately branched, usually with a sessile pseudo-umbel at each node; peduncle 2- 4 mm long, minutely bracteolate at the apex; pedicels pedunculate, 2-5 mm long; inflorescence branches, peduncles, pedicels and calyces densely pubescent. Flowers 8-16 per umbel; sepals to 4 mm long, ovate-oblong, rounded at the apex, appressed-pubescent on the outside, held against the stamens, all but 1 sepal bearing 2 glands, the fifth sepal sometimes with much reduced glands, glands broadly oblong, 2-3 mm long, with a thin, sticky covering; petals yellow, gla- brous, rounded, clawed, 7-9 mm broad, the margins fimbriate, 3 petals opposite the eglandular sepal spreading, usually tinged with brick red, 2 petals on either side of the eglandular sepal held erect, strongly concave, yellow or brick red at center outside; stamens unequal, 4 reduced, the styles 3, glabrous, thin and broad- ly spreading at the apex, 2 unilaterally winged, 1 bilaterally winged. Schizocarp of 3 samaras; samara pubescent especially on body, dorsally winged, the wing broadest at base, 2-3 cm long, to 1.2 cm wide at base, ca. 5 mm wide near the apex.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 17288
          archiveSourceId: A3CFF117-54ED-424E-8465-39677DF77259
