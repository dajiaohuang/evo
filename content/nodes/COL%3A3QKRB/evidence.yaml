          - text: Its area thus lies mainly south of that of its ally J. megadenia, but they are known to be sympatric between roughly Warmbad and Upington; Pockenbank lies west of the area of J. megadenia. Both species have a white corolla limb patterned round the mouth in orange and violet, but the corolla lobes are much more deeply notched in J. aridicola (c. 0.8-1.6 mm) than in J. megadenia (up to c. 0.3 mm), and J. aridicola lacks the relatively huge glands that are a notable feature of J. megadenia (care must be taken because sand and dust stick to glandular heads and may give a false impression of size).
