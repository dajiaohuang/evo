    facets:
      morphology:
        status: partially-supported
        claims:
          - text: "Annual herb, stem c. 25-600 mm tall, up to c. 5-7 mm diam. at base, erect, simple at first, soon. branched from the base and above, glandular-pubescent, hairs up to 0.8-2.0 mm long, some up to 0.2 mm diam. at base, heads less than 0.1 mm diam. Leaves opposite at base, soon alternate upwards, up to 25-75 x 10-40 mm, blade narrowly to broadly ovate, apex acute, base ± abruptly contracted to a petiolar part up to roughly half total leaf-length, margins coarsely serrate, teeth entire to few-toothed, both surfaces glandular-pubescent, hairs up to 0.3-1.5 mm long, longest on petiolar part, glistening glands as well particularly on lower surface. Flowers solitary in leaf axils almost from base of plant. Pedicels up to 15-56 mm long, glandular-pubescent, hairs up to 0.2-0.6 mm long, heads less than 0.1 mm across (though basal stalk cell can be very stout). Calyx tube 0.2-0.4 mm long, lobes 3.7-9 x 0.5-1 mm, slightly accrescent in fruit, narrowly oblong, + acute, glandular-pubescent, hairs up to 0.2-0.6 mm long. Corolla tube 16-21.5 x 1.8-2.5 mm in throat, cylindric, abruptly expanded near apex, mouth laterally compressed, limb nearly regular, c. 10-18 mm across lateral lobes, posticous lobes 4.2-7 x 3.2-6.5 mm, anticous lobe 4.5-6.5 x 3-6.5 mm, all lobes cuneate in outline, apex distinctly notched, sinus c. 0.8-1.6 mm deep, glandular-puberulous outside, hairs less than 0.1 mm long, broad band of clavate hairs in throat extending very briefly onto base of anticous lip, lobes white, throat orange/yellow, the colour radiating into 3 points at base of each lobe, the median point tipped with a violet streak (always?). Stamens: posticous filaments 1.5-2.1 mm long, anthers 1.2-1.7 mm, anticous filaments 0.5-1 mm, anthers 0.4-0.8 mm, all filaments minutely puberulous. Stigma 0.6-1 mm long. Style 12-19 mm. Ovary 2-4 x 0.8-1.4 mm. Capsules 7-10 x 3-4 mm, glandular-puberulous. Seeds 0.4-0.7 x 0.2-0.25 mm. Flowering has been recorded between March and October. Seed must germinate after a shower of rain and plants will flower when only a few centimetres tall, but can persist long enough to become tall and stout-stemmed."
            sourceIds:
