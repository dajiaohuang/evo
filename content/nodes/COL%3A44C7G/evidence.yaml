    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, 150-300 mm tall. Leaf usually 1, occasionally 2, usually clasping stem below. Flowers enclosed in green spathes, salmon with a yellow centre, tepal claws forming a shallow cup, anthers exserted on a slender filament column.
            textZh: Moraea karooica Goldblatt 的 SANBI 物种条目记载了植株、叶片和花部形态。
            sourceIds:
              - sanbi_14562_0
            locator: Strelitzia 30; archive Morphology row 33318, source 14562.0
            placeTimeScope: Regional species account published 2013; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
          - text: Broadly resembling the more common Moraea miniata, M. karooica may differ in leaf number, usually single (rarely two or three) vs. two or three in M. miniata, but more fundamentally in the flowers. Moraea karooica has ascending tepal claws that together form a shallow cup and a cylindric filament column, whereas in M. miniata the short tepal claws clasp the base of the bulbous filament column. Moraea karooica may be most closely allied to the rare M. fenestrata of the Tanqua Basin, which has a similar habit but consistently two or more leaves, and tepals conspicuously narrowed at the base, thus usually forming a windowed cup. Populations of M. karooica with more than one leaf are from the Koedoes Mtns and Verlatenkloof near Sutherland.
            textZh: SANBI 条目提供了 Moraea karooica Goldblatt 的鉴别特征。
            sourceIds:
