    facets:
      morphology:
        status: partially-supported
        claims:
          - text: "Soft, erect, sparingly branched, perennial herb, 1.0-1.5 m; stems purplish, becoming terete, basally swollen; strigose-pubescent, with scattered, long multicellular hairs. Leaves triangular-ovate, 40-70 x 35-50 mm, base rounded, apex acute, margins dentate; sparingly pubescent, glands colourless. Inflorescence: rachis 150-200 mm long; verticillasters 6-flowered. Flowers purplish, protandrous. Calyx 4 mm long, enlarging to 8 mm after flowering. Corolla 28-30 mm long; tube compressed, straight in distal half, narrowing to 1.5 mm wide at throat; upper lip 4-lobed, reflexed; lower lip reflexed, linear, boat-shaped. Flowering time Jan.-Mar. Fruit a black or dark brown nutlet."
            sourceIds:
              - sanbi_18344_0
