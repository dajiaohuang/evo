        usage:
          title: Sapindus saponaria L., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Trees 3-17(-23) m tall, to 18 cm d.b.h.; stems sulcate, glabrous to puberu- lent. Leaves pinnate, 10-30(-57) cm long; leaflets 5-10, narrowly lanceolate to oblong, unequal, obtuse to long-acuminate at the apex, acute or obtuse to attenuate at the base, entire, membranous to somewhat coriaceous, 5-13(-20) cm long, 3-5(-7.3) cm wide, glabrous or subglabrous; rachis sulcate, marginally ribbed or winged; petioles winged or wingless. Panicle terminal, 15-25 cm long, the branches and pedicels densely puberulent to tomentose; pedicels 0.5-1.5 mm long, articulate above the middle. Flowers white; sepals rotund or elliptic, puberu- lent, ciliolate, ca. 3 mm long; petals ca. 1.5 mm long, ciliolate, glabrous without, villous at base within; disc fleshy, spreading, glabrous; stamens exserted, to ca. 3 mm long, the filaments filiform, villous to about midway; ovary ovate, 3-lobed, glabrous. Fruit of 1-3 cocci; cocci brown to yellow, globose, glabrous, ca. 1.5 cm diam., shiny, often lenticellate at maturity, the surface smooth; seeds globose, 1.2 cm diam., set at the base of the carpel in a cottony mat of pubescence. Sapindus saponaria is distinguished from other Sapindaceae in Panama by be- ing arborescent, pinnately leaved, and having indehiscent 2- or 3-lobed fruits.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 12583
