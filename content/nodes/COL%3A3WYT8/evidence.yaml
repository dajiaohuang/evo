        usage:
          title: Machaonia martinicensis (DC.) Standl., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrubs, vines, or trees, to 10 m tall, the branchlets occasionally armed at the nodes with spines to 1.3 cm long, lignose, the twiglets terete, smooth, glabrate, the nodes 2-5 cm apart. Leaves opposite or rarely alternate, widely oblong, occasionally elliptic, 4-11 cm long, 1.8-4.5 cm wide, acute or rounded at the apex, usually contracted into a short acumen 0.3-1.0 cm long, basally widely cuneate to subobtuse, the costa slender, plane or prominulous above, prominu- lous to prominent beneath, the lateral veins 6-7, arcuate, the intervenal areas minutely mosaiclike, chartaceous, usually concolorous, glabrous above and be- neath except often minutely barbate in the axils; petioles to 1.2 cm long, 0.5-1.2 mm wide, glabrous or puberulent on the adaxial side; stipules minute, 2.5-3.0 mm long, the body compressed rotund to triangular, the subulate process longer than or shorter than the body. Inflorescences terminal, thrysoid paniculate, to 11 cm long, the branches plane or angular, pubescent, the lowermost 2-4 pairs of branches usually opposite, strict and divergent, mostly with 1 or 2 pairs of op- posite secondary branches; bracts usually linear, 5 mm long, sometimes larger and leaflike, the cymules terminal, densely flowered. Flowers 5.5-6.5 mm long, the buds usually 2.5 mm wide at the apex; hypanthium turbinate, the hypanthium and calyx ca. 2.5 mm long, glabrate, the hairs small and somewhat webby or larger and subulate, to 0.2 mm long, white, drying red, the calycine lobes 5, erect, unequal, to 1.2 mm long, obtuse, villosulose and often sparsely pubescent on the margins; corolla white or pale green, the tube turgid, compressed cylindrical, to 2.5 mm long, sparsely villose outside, densely villose at the mouth within; sta- mens 5, the anthers oblong, ca. 0.6 mm long, the stigmas 2, linear, to 1.2 mm long, the style ca. 3.5 mm long, frequently exserted. Fruits turbinate, to 6 mm long, glabrate.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 11841
