      statement: Combined supertree and supermatrix analyses of the extant perissodactyl sample recover Equidae—the living component labelled Hippomorpha—as sister to sampled Ceratomorpha; this extant topology neither resolves every fossil hippomorph nor dates the total group’s origin.
