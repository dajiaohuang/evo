          - text: Erect, glabrous, succulent shrub, with stems 90-180 mm long. Leaves free from each other towards bases, bluntly trigonous, up to 25 mm long, 3-5 mm thick. Flowers 1-3, 40-50 mm diam., pale rose, without filamentous staminodes. Fruit 5-locular, base funnel-shaped, expanding keels diverging.
