          title: Pera arborea Mutis, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Tree to 20 m, glabrous or strongly lepidote and glabrate; dioecious. Leaves somewhat coriaceous; petioles to 2 cm long, deeply channeled to obscurely winged; stipules obsolete; blade elliptic to obovate, 6-12 cm long, 3-5.5 cm wide, the base rounded to acute, the margin entire, the apex bluntly to sharply acuminate. Staminate flowers 5-10 in each involucre, the bracteoles unequal with the larger ca 1 mm long, the involucre 3 mm diam, dehiscence lateral; calyx to 1.5 mm long, strongly toothed; stamens 4-6. Pistillate flowers usually 3 per involucre, the peduncle rarely more than 6 mm long before anthesis, the bracteoles and involucre resembling c. Capsule ellipsoid to obovate, ca 12 mm long, on stalk to 4 mm long, the surface coarsely ruminate with rather sharp edged wrinkles; seed obovoid, somewhat compressed, ca 5 mm long, black, shiny, the caruncle obvious.
          originalLanguage: en
