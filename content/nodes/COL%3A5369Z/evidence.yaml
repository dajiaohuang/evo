    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Bulbous geophyte, 50-100 mm tall. Leaves 3 or 4, dry at flowering, erect, arranged in a fan, broadest at apex, smooth, slightly sticky. Flowers in an erect, compact cluster, campanulate, white to pale pink, stamens exserted, filaments thick in lower half.
            textZh: Strumaria bidentata Schinz 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_14528_0
            locator: "SANBI/WFO archive Morphology row 32852; source identifier 14528.0; cited publication: Snijman, DA. 2013. Amaryllidaceae. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 33 - 42. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: A diminutive species, distinguished by the erect, clustered habit of the inflorescence; the proximally thickened filaments with a ridge of irregular teeth midway along their length; and the style in the shape of a fluted disc for half its length. The leaves are typically broader towards the apex, firm and somewhat sticky. Vegetatively the species may be confused with the broad, blunt leaves of S. hardyana which also occurs in southern Namibia, but these have hyaline margins and slightly emarginate apices.
            textZh: SANBI 条目提供了 Strumaria bidentata Schinz 的鉴别特征。
