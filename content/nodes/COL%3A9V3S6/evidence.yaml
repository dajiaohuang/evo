    facets:
      morphology:
        status: partially-supported
        claims:
          - text: "Hypogenous bulbous plants, stoloniferous from base, stolons spreading forming new bulbs some distance from mother bulb. Roots white up to 2 mm in diameter. Bulb ovate to broadly ovate 25-28 x 17-24 mm; outer tunics dark brown, papery, forming a short indistinct neck of about 10 mm long; inner tunics white, fleshy. Leaf solitary, ascending spreading, linear-lanceolate 200-260 x 3.5-5.0 mm, green, lower portion terete, densely maroon-spotted, V-shaped when open, bearing thickened keel, slightly channelled at base; apex acute. Inflorescence 370-400 mm long, 5-7 mm in diam. at base and tapering to 3-4 mm wide just below umbel, densely purple-spotted in lower third. Umbel with 6-9 outward spreading flowers (secund). Scape bracts 2, opposite, linear-lanceolate, 30-50 x 3-8 mm, acuminate. Pedicles variable, 15-35 mm long, ±1.5 mm wide, dull brown. Flowers 45 mm long; tube straight or becoming slightly curved; tepals free for 15 mm, ±20 mm long, ovate-lanceolate; anthers yellow, oblong, 5 x 1 mm; ovary orange-red, 4 mm in diam. expanding to 6 mm (petals diverging) and 15 mm ultimately, triquetrous, oblong 8 x 3 mm; style 17 mm long, whitish, trilobate, style branches 1.0-1.2 mm long, spreading. Capsule and seed not seen. Flowering time: opening during the day and closing at dusk for the night."
