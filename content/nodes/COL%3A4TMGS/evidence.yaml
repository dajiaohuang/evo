          title: Rudgea isthmensis Standl., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Trees to 4 m tall, the branchlets slender, the nodes well spaced. Leaves lance oblong, 5-13 cm long, 1.5-7.5 cm wide, deltoid at the apex, acuminate, the acu- men usually falcate, cuneate basally, the lateral veins 6-8, the submarginal vein ca. 1 cm from the margin, stiffly papyraceous, drying yellow, glabrous; petioles slender, to 1.3 cm long, glabrous; stipules ca. 1 cm long. Inflorescence cymose paniculate, glabrous, to 3.5 cm long, much shorter than the terminal leaves, pedunculate, the rachis with 2 sets of widely divergent opposite or whorled branches. Flowers not seen. Fruits subsessile, large, oblong, to 1 cm long, round- ed at the apex and base, sulcate, glabrous.
