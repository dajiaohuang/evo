        usage:
          title: Elephantopus mollis Kunth, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Coarse perennial herbs mostly 30-150 (-200) cm tall, occasionally from a creeping rootstock; stem erect, leafy, usually hollow, villous, the trichomes to 1.5 mm long. Leaves cauline, rarely basal, more or less oblanceolate, basally attenuate, apically acute, crenate, mostly 7-22 cm long, 2-7 cm wide, less than 3?/ times longer than wide, chartaceous, green throughout, darker above, resin-dotted and densely soft-puberulent beneath, the trichomes to 0.5 mm long, slightly longer on the veins, above muricate and sparsely appressed-pubescent, somewhat obscurely veined above; petioles broadly expanded at the base, clasping. Inflores- cence solitary, terminal, a much-branched corymbose panicle, the branches sub- tended by oblong leaflike bracts to 6 cm long; peduncles appressed-pubescent; glomerules many, with ca. 40 heads, hemispheric, to 10 mm high and 20 mm across, subtended by 2 or 3 ovate bracts; bracts obtuse at base, slightly acuminate, 6-12 mm long, the venation arcuate-ascending, conspicuous beneath, obscure above. Heads with 4 florets; involucral bracts 8, in 2 decussate series, minutely sericeous towards the apex, usually resin-dotted, the outer 4 lanceolate, 4.5-5.0 mm long, the inner 4 lanceolate-oblong, acuminate, 5.5-7.5 mm long; corolla white or occasionally pinkish, the tube slender, 3.0-4.0 mm long, ca. 0.15 mm wide, the limb ca. 2.0 mm long, deeply divided on the adaxial side, 5-parted, the lobes linear, ca. 1.2 mm long, ca. 0.18 mm wide; anthers ca. 1.0 mm long, ca. 0.18 mm wide, basally sagittate, 0.12-0.15 mm long, the apical appendage ca. 0.1 mm long; style branches slender, terete, somewhat flattened adaxially, ca. 0.7 mm long, strigulose throughout, but less densely on the adaxial surfaces. Achenes obovoid, slightly flattened, 10-ribbed, 1.9-2.7 mm long, ca. 0.7 mm wide, brown in the sulci when mature, pale on the ribs, strigulose and resin-dotted; pappus in 1 series of 5(-8) straight bristles, 3.5-4.7 mm long, abruptly or somewhat gradually dilated at the base, to 0.25 mm wide, the dilated portion 0.2-0.6 mm long, the bristles appressed-puberulent, often ciliate at the base.
          originalLanguage: en
          sourceField: general
