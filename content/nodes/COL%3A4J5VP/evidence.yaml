          originalSourceText: Shrub (?), glabrous, strongly nodose; flowering internodes short and slender, smooth or somewhat scurfy-granular; leaves lance- or oblong-ovate, apex rather long and sharply acuminate, base equilateral, rounded, obtuse, 3-4.5 cm. wide X 9-12 cm. long, pinnately nerved below the upper third, the nerves 4-5 on each side, prominent beneath, with fine cross-connecting-anastomosing nervules, drying pale green, firm, narrowly revolute, scarcely glandular-dotted; petiole about 5 mm. long, channelled above, vaginate at the very base only; spikes 4 mm. thick X 3-4 cm. long when mature; peduncle 5-1 0 mm. long; bracts round-subpeltate, glabrous in the center, marginally somewhat ciliate; fruit obpyramidal-trigonous, puberulous toward the top, stigmas 3, sessile.
