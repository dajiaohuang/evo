          originalSourceText: Tree 12-30 m. high, the trunk 45 cm. or even more in diam., often strongly buttressed, the crown spreading, the pubescence of stellate hairs, the branches shortly puberulous. Leaves with a petiole 8-12 mm. long, shortly tomente]lous, the blade elliptic to oblong-elliptic, obtuse to rounded and asymmetric at the base, acuminate at the apex, 8-15 cm. long and 3.8-7.5 cm. wide, subcoriaceous, glabrous or nearly so above, very sparsely and shortly puberulous especially along the nerves beneath. Inflorescences terminal, of loose, paniculiform cymes, the axes shortly tomentellous. Flowers cream-white, the pedicel 5-13 mm. long; sepals 5, ovate to elliptic, acute 9-10 mm. long and 3.5-5 mm. wide, shortly tomentellous without, glabrous within; petals 5, elliptic, ca. 7 mm. long and 3 mm. wide; stamens glabrous, ca. 50, grouped into 5 phalanges of 10 stamens each, the fila- ments unequal, equalling or shorter than the anthers, shortly connate at the base for ca. 1 mm., the anthers unequal, 1.5-2 mm. long; ovary pyriform, ca. 3 mm. long and wide, shortly tomentellous; style ca. 3 mm. long, shortly tomentellous at the base. Capsule ligneous, more or less globulose, ca. 4 cm. long and broad, shortly tomentellous, 5-celled, each cell 2- to 3-seeded; seeds pyriform, ca. 10 mm. long and 6 mm. broad.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 13508
