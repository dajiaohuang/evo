        usage:
          title: Paullinia baileyi Standl., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Lianas; stems 6-ribbed with milky sap; wood simple; stems, petioles and mid- ribs of leaflets conspicuously pilose to hispid with yellowish brown trichomes 1-6 mm long. Leaves pinnately 5-foliolate, 13-40(-60) cm long; petioles 1-12(-19) cm long, without wings; rachis winged, 4-11(-15) mm wide, often broadest in the upper half; leaflets elliptic or elliptic-oblong to oblanceolate or obovate, gradually acuminate at the apex, acute to attenuate at the base, the lower pair often rounded or subcordate, 2.5-22(-30) cm long, 1.5-11(-15) cm wide, re- motely dentate; stipules paired, lanceolate, to 3 cm long, ciliate. Inflorescences short, densely glomerulate thyrses in the leaf axils or borne on tendrils. Flowers white, 5-5.5 mm long; sepals oblong, glabrous; petals ca. 4 mm long, oblong to obovate, acute, the scales ca. 3.5 mm long, the margins villous, the crests yellow, oblong, about as long as the basal part, thin, rounded to emarginate at the apex, the deflexed appendages only ca. half as long as the crest, truncate, villous, short- villous along the margin; disc glands erect, flattened, slightly longer than broad; staminate flowers with the stamens ca. 3 mm long, the filaments glabrate, fused into a basal tube, the ovary 3-angled, ca. 1 mm long, glabrous; bisexual flowers with 3 styles held above the staminal tube. Capsules reddish, suborbicular, 1-1.5 cm long, 3-celled, prominently 3-winged, glabrous; seeds 1 or 2, oblong-obovate, solitary, dark, shiny, the lower 1/3 covered with a white aril.
          originalLanguage: en
          sourceField: general
