    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Bulbous geophyte, 50-250 mm tall. Leaves 2, dry at flowering, recurved, narrowly strap-shaped, softly hairy on both surfaces. Flowers in a lax cluster, widely funnel-shaped, pale pink with a deeper pink median band on each tepal, stamens slightly exserted.
            textZh: Strumaria perryae Snijman 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_14528_0
            locator: "SANBI/WFO archive Morphology row 32857; source identifier 14528.0; cited publication: Snijman, DA. 2013. Amaryllidaceae. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 33 - 42. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: The 50-250 mm long, lorate, pubescent leaves and somewhat funnel-shaped flowers of S. perryae are characteristics also found in S. pubescens and S. aestivalis, and indicate a close affinity amongst these three species. The narrow leaves of S. perryae are diagnostic, being at most 5 mm across. In contrast, S. pubescens and S. aestivalis have leaves more than 10 mm wide and have the derived character state of yellow inner bulb tunics. The adnation of all the filaments to the style is well developed, reaching a length of 3.5 mm. This feature is paralleled in specimens of S. salteri and S. watermeyeri which occur further south on the escarpment from Nieuwoudtville towards Clanwilliam; and in S. aestivalis from near Loeriesfontein in the north. In S. perryae, S. salteri, and S. watermeyeri the inner filaments are closely adnate to the style and the efferent canals, which conduct nectar from the septal nectaries to the sinuses between the inner filaments and style are only microscopically visible. Strumaria aestivalis shows greater specialisation of this character, in that the nectar wells between the inner filaments and style are large and clearly visible. The species honours Miss Pauline Perry, who gave assistance on many expeditions to Namaqualand and the Roggeveld and who first discovered this species. She also nurtured the living collections of Amaryllideae at the Karoo National Botanic Garden, Worcester, and often provided valuable data on the family.
            textZh: SANBI 条目提供了 Strumaria perryae Snijman 的鉴别特征。
