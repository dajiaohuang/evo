  claims:
    - subjectId: event:scleractinian-paleozoic-clock
      claimKind: scientific
      claimType: divergence-time
      statement: A four-locus relaxed-clock analysis places deep-water scleractinian splits near 425 Ma, substantially before the approximately 240 Ma skeletal record, but this is a modelled divergence rather than a fossil occurrence.
      confidence: medium
      confidenceRationale: The sequence sample and clock result are explicit, while calibration, locus and taxon choices prevent treating the posterior as a direct Paleozoic coral skeleton.
      referenceLinks:
        - referenceId: stolarski-2011-scleractinia
          relation: supports
          pages: 1–10
          figure: Figures 1–4; Additional files 1–4
          quoteLocator: Four-locus sampling, relaxed-clock calibration and deep-water lineages
  claim-rationales.zh:
    - 序列样本和时钟结果明确，但校准、位点和类群选择使后验结果不能被视为直接的古生代珊瑚骨骼。
  claim-statements.zh:
    - 四个位点的松弛时钟分析把深水石珊瑚的分化置于约 4.25 亿年前，显著早于约 2.40 亿年前的骨骼化石记录；但这是模型估算的分化时间，并非化石产出记录。
