        claims:
          - text: Tufted, stoloniferous perennial, up to 450 mm tall, with glandular pedicels and glumes. Leaves linear, rolled, occasionally pungent; ligule a fringe of hairs. Inflorescence a contracted panicle, 80-120 mm long. Spikelets 6-7 mm long; glumes ± equal, as long as spikelet (excluding awns), 1-nerved; 2-flowered, both bisexual; lemma glabrous, lobe awns not exserted, central awn 6 mm long; anthers 3 mm long.
