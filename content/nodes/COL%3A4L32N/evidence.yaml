    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Shortly glandular-hairy annual to 20 cm. Leaves narrow and sparsely toothed. Flowers in small, terminal heads, yellow or upper lip white tipped yellow, tube short and glabrous, 3-6 mm long.
            sourceIds:
              - sanbi_14442_0
            locator: "SANBI/WFO archive Morphology row 5889; source 14442.0; publication: Manning, JC; Goldblatt, P. 2012. Scrophulariaceae: Polycarena Benth. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 752 - 752. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: In the southern part of its range, the flowers are wholly yellow. Around Middelpost and south east of it (3120CC and 3220AB) the flowers may be either wholly yellow or the limb may be white with only the tips of the posticous lobes tipped with yellow. Polycarena aurea is easily distinguished from P. pubescens, with which it is partly sympatric, by its larger limb (6-9.5 mm versus 3-5 mm), upper lip glabrous or very nearly so (not well bearded) and shorter indumentum (hairs on stem, bract and calyx up to 0.25-0.4 mm, versus 0.5-1 mm). It is distinguished from P. formosa by its shorter indumentum (longer hairs 0.25-4 mm versus 0.6-1.2 mm), leaves only obscurely toothed, differently shaped bracts (elliptic versus linear to oblong) adnate roughly halfway up the calyx tube (not nearly to the top) and often shorter - corolla tube (3-5.5 mm versus 5-6.5 mm). The area of P. aurea lies mainly west and south of ' that of P. formosa; they appear to be sympatric only in the neighbourhood of Niewoudtville.
            textZh: SANBI 条目提供了该种的鉴别特征。
            sourceIds:
              - sanbi_8611_0
            locator: "SANBI/WFO archive Diagnostic row 57352; source 8611.0; publication: Hilliard, OM. 1994. Manuleae, The: a tribe of Scrophulariaceae. Edinburgh University Press, Edinburgh. [All rights reserved]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
