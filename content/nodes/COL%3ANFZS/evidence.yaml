    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Bulbous geophyte, 20-40 cm. Leaves 4-6(-8), dry at flowering, prostrate, tongue-shaped, margin red or pale red. Flowers 20-40, in a dense, hemispherical head, tepals evenly spreading or flaring upwards, tube well-developed, pink to crimson. Capsules 3-angled, rounded above, heavily ribbed.
