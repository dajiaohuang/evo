          - text: The variations in nearly all characters of this group of plants, particularly floral and capsule size, is so wide that the group has defied clear classification. A general tendency is for the western plants from Port Elizabeth and Uitenhage divisions, possibly Humansdorp too, to be smaller than those from further west and inland.
