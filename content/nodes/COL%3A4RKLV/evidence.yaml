        claims:
          - text: The vegetation is typically a subtropical dry Lydenburgia cassinoides-Kirkia wilmsii savanna. Mountain and adjacent hills. Grows in full sunlight in well-drained, stony, dark brown loam soil with its tubers wedged tightly between rocks.
