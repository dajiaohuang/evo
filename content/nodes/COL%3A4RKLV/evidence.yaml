    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Erect herb of up to 0.3 m high. Tuber narrowly ovoid with tapering base, 0.2 x 0.1 m. Aerial stems solitary to few, erect, up to ±0.1 m long, 2-3 mm diameter, greenish-brown, puberulous to tomentose, branching lateral. Leaves ascending to spreading, subsessile; blade folded lengthwise, 60-70 x 2-3 mm, linear to linear-lanceolate, involute, tomentose on both sides, greyish-green, secondary veins arching, apex acute, base long-tapering. Inflorescences terminal and sub-terminal, racemose, few-flowered, tomentose to velutinous, peduncles 1-5 mm long, pedicels 15-25 mm long; bracts 1-2 mm long, acicular. Sepals 2-3 x 1 mm, narrowly triangular, outside tomentose, apex attenuate. Corolla outside tomentose, inside glabrous; tube 3-4 x 3 mm, broadly campanulate, inside maroon-violet, outside violet-green; lobes reflexed, 14-15 x 2 mm, linear to oblong-ovate, inside green with base maroon-violet, outside green, apex acute. Coronal feet narrowly deltoid, ±3 mm long, maroon-violet, free; lobes from apices of coronal feet, simple, 9-12 mm long, filiform, green, upper half villous. Stamens from inner face of coronal feet; filaments 3-4 mm long, filiform, maroon-violet; anthers 3-4 mm long, narrowly triangular-ovate with attenuate apices, creamy-white, sub-erect, full length slits, apex attenuate. Ovaries ±2 mm long; style 4-5 mm long, terete, maroon-violet, glabrous, glandular; style-head 4 x 2 mm, narrowly angular-ovoid with blunt apex, maroon-violet; translators ±3 mm long, spoon elliptic. Gynostegium elevated above corolla mouth. Follicles solitary, erect, ±100 mm long, 4-5 mm diameter, cylindrically ovoid, apex attenuate. Seeds unknown.
            sourceIds:
