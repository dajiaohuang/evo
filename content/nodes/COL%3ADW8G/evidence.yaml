        claims:
          - text: Perennial with long-trailing vegetative shoots. Roots thin, fibrous. Leaves spirally arranged, leaf-blades shortly petiolate, narrowly lanceolate to lanceolate-elliptic, lanceolate-ovate or ovate-elliptic, (25-)30-100(-130) x (7-)10-25(-35) mm. Inflorescences terminal or terminal and axillary, ovoid thyrses (20-)25-50(-80) x (15-)20-50(-70) mm with (1-)3-9 mostly ascending cincinni. Flowers perfect and staminate, (9-) 13-7.5 mm wide; pedicels recurved usually c. 180° in fruit; petals pale lilac, medial petal large, cup-shaped, usually obovate; lateral stamen filaments usually ± parallel, 7.7-8.5 mm long, glabrous. Capsules obovate-elliptic to obovate-oblong, oblong or oblanceolate, trilocular, dehiscent, (4-)4.5-6(-6.8) x (1,9-)2.3-3(-3.4) mm, dorsal locule 1-seeded, ventral locules 2-seeded. Seeds elliptic or ovate to trapezoidal, 1.5-2.9 x 1,35-2.2(-2.5) mm, testa shallowly scrobiculate.
