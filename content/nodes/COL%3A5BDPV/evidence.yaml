        usage:
          title: Vigna juruana (Harms) Verdc., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Slender vine, stems with long, sparse sturdy tawny hairs. Leaves pinnate trifoliolate, the leaflets ovate, mostly 4-10 cm long, 3-6 cm wide, apically acuminate, basally rounded or obtuse, thin, drying concolorous, with inconspicuous, scattered hairs on both sides, petiolules 3-4 mm long, drying angled, hispidulous; petioles often exceeding the terminal leaflets; stipels ovate, 1-2 mm long, glabrous, glandular; stipules linear lanceolate, 3-5 mm long, ciliate. Inflorescences 5-20 cm long, axillary; peduncle terete, retrorsely hispidulous pilose with tawny hairs, the rachis tomentose with whitish, somewhat curly hairs, ca. 2 mm long, the nodes prominent; bracteoles and bracts linear ascending pilose, ca. 4 mm long, deciduous; pedicels ca. 1 mm long, ca. 2 per node. Flowers yellow, the calyx cupular, 2-3 mm long, the 5 teeth obtuse deltoid, sparingly ascending pu- bescent; standard orbicular ca. 1 cm long, the keel spiralled. Legume linear, turgid, 3-4 cm long, 4-6 mm across maturing black, ascending pilose with tawny hairs; seeds subglobose, shiny, 3-4 mm long.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 5193
