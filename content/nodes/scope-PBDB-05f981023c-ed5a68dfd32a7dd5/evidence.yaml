  claims:
    - subjectId: taxon:purgatorius
      claimType: taxonomy
      claimKind: scientific
      statement: The Garbani Channel tarsals were attributed to Purgatorius by bounded comparative regressions and phylogenetic analyses; the isolated bones do not establish crown-Primate membership or ancestry.
      confidence: medium
      confidenceRationale: The taxonomy field for purgatorius is bounded to the named material and cited primary-study locator; that evidence type is not generalized to ancestry or a whole clade.
      referenceLinks:
        - referenceId: chester-2015-purgatorius
          relation: supports
          pages: 1487–1492; Figures 1–3; SI Appendix Figures S1–S5 and Tables S1–S3
    - subjectId: taxon:purgatorius
      claimType: biogeography
      claimKind: scientific
      statement: The profile represents the Garbani Channel fauna in Montana and does not convert that locality sample into a global Purgatorius distribution.
      confidence: medium
      confidenceRationale: The biogeography field for purgatorius is bounded to the named material and cited primary-study locator; that evidence type is not generalized to ancestry or a whole clade.
      referenceLinks:
        - referenceId: chester-2015-purgatorius
          relation: supports
          pages: 1487–1492; Figures 1–3; SI Appendix Figures S1–S5 and Tables S1–S3
    - subjectId: taxon:purgatorius
      claimType: ecology
      claimKind: scientific
      statement: Tarsal joint form supports an arboreal locomotor inference, while diet, habitual substrate use and behaviour remain unobserved.
      confidence: medium
      confidenceRationale: The ecology field for purgatorius is bounded to the named material and cited primary-study locator; that evidence type is not generalized to ancestry or a whole clade.
      referenceLinks:
        - referenceId: chester-2015-purgatorius
          relation: supports
          pages: 1487–1492; Figures 1–3; SI Appendix Figures S1–S5 and Tables S1–S3
    - subjectId: taxon:purgatorius
      claimType: morphology
      claimKind: scientific
      statement: UCMP 197509 and UCMP 197517 preserve ankle and inverted-foot features quantified against dentally associated euarchontans.
      confidence: medium
      confidenceRationale: The morphology field for purgatorius is bounded to the named material and cited primary-study locator; that evidence type is not generalized to ancestry or a whole clade.
      referenceLinks:
        - referenceId: chester-2015-purgatorius
          relation: supports
          pages: 1487–1492; Figures 1–3; SI Appendix Figures S1–S5 and Tables S1–S3
    - subjectId: taxon:purgatorius
      claimType: fossil-range
      claimKind: scientific
      statement: The 65.2–64.4 Ma envelope is the bounded late Puercan sample context, not a genus-wide FAD, LAD, crown-Primate age or uninterrupted duration.
      confidence: medium
      confidenceRationale: The fossil-range field for purgatorius is bounded to the named material and cited primary-study locator; that evidence type is not generalized to ancestry or a whole clade.
