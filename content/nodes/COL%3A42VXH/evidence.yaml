          - text: Perennial, much branched, 1-1 1/2 ft. high; branches puberulous; leaves in approximate fascicles, linear or slender, subobtuse, hispidulous or nearly glabrous, 4-5 lin. long; spikes ovoid or oblong, very dense, 1/2-1 1/2 in. long; bracts spreading, densely crowded, broadly ovate, often broader than long, apiculate or mucronate, glabrous and minutely puncticulate, sometimes crenulate, 2-2 1/2 lin. long; calyx oblong, somewhat curved, 2 lin. long, densely puncticulate; lobes triangular, subacute, denticulate, short; corolla-tube linear-oblong, 2-2 1/2 lin. long; lobes broadly oblong, about a quarter as long as the tube; fruit oblong, 1 lin. long, included within the calyx.
