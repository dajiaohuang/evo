        claims:
          - text: Sprawling caulescent succulent to 45 cm. Leaves smooth, pungent. Flowers secund in horizontal racemes, erect, orange-red with greenish tepals.
            textZh: Astroloba rubriflora (L.Bolus) Gideon F.Sm. & J.C.Manning 的 SANBI 物种条目记录了形态特征。
            sourceIds:
