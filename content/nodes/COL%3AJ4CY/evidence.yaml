          - text: On vegetative morphological grounds Poellnitzia shows affinities with some representatives of Aloe, Astroloba and Haworthia. However, the flower morphology of Poellnitzia is unique in the family Aloaceae in that the dark green, free portion of the segment lobes is connivent and reduplicate-valvate with the very tips of the segments scarcely separated.
            textZh: SANBI 条目提供了 Astroloba rubriflora (L.Bolus) Gideon F.Sm. & J.C.Manning 的鉴别特征。
