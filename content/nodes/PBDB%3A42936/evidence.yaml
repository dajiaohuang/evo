  claims:
    - subjectId: taxon:basilosauridae
      claimKind: scientific
      claimType: taxonomy
      statement: Basilosauridae is synthesized as a sampled late Eocene radiation of fully aquatic archaeocetes with several distinct genera; the family grouping does not imply that every basilosaurid lies on the direct ancestry of Neoceti.
      confidence: medium
      confidenceRationale: The systematic review supports family-level anatomy and diversity while separating the sampled side branches from direct ancestry.
      referenceLinks:
        - relation: supports
          referenceId: uhen-2010-whale-origins
          pages: 207–212
          quoteLocator: Basilosauridae and late Eocene whale synthesis
    - subjectId: taxon:basilosauridae
      claimKind: scientific
      claimType: fossil-range
      statement: Basilosauridae is displayed at 41–34 Ma only as the review's sampled late-Eocene radiation, not exact family FAD/LAD. The interval is a source-bounded sample window, not a global FAD, LAD, divergence date, continuous occupancy claim or direct-ancestor assertion.
      confidence: medium
      confidenceRationale: Basilosauridae uses Uhen, M.D. (2010) because the cited pages and locator expose the sampled taxon, specimen or living sequence set. Confidence is medium and applies only to Late Eocene basilosaurid fossil sample synthesized by Uhen; broader endpoints remain unclaimed.
      referenceLinks:
        - relation: supports
          referenceId: uhen-2010-whale-origins
          pages: 207–212
          quoteLocator: Basilosauridae and late Eocene whale synthesis
        - relation: contextualizes
          referenceId: ics-2026-06
          pages: International Chronostratigraphic Chart v2026/06
          figure: Global chronostratigraphic scale
          quoteLocator: Numerical boundaries for named geological stages used to bound the source sample
  claim-rationales.zh:
    - 系统综述支持科级解剖与多样性，同时将取样旁支与直接祖先关系区分开。
    - Basilosauridae 采用 Uhen, M.D.（2010）的论文，因为所引页码与定位符直接标示了研究采样的类群、标本或现生序列集合。中等置信度仅适用于 Late Eocene basilosaurid fossil sample synthesized by Uhen；更宽泛端点保持未声明。
  claim-statements.zh:
    - 综述将龙王鲸科概括为晚始新世完全水生古鲸类的一个取样辐射，包含多个不同属；该科级组合不表示每一种龙王鲸科成员都位于新鲸类的直接祖线上。
    - Basilosauridae 仅以 41–34 Ma 展示为综述所采样的晚始新世辐射，而非精确科级首末现。该区间是来源限定的样本窗口，不是全球首现、末现、分化日期、连续占据或直接祖先断言。
