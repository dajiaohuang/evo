        usage:
          title: Manettia flexilis Brandegee, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Vines, the stems flexuous, the hairs short, curled, white. Leaves oblong, ovate oblong or trapeziform, to 5(-7?) cm long, 1.5 cm wide or wider, acute or long attenuate (Standley) at the apex, acute to obtuse at the base, the costa subim- mersed above, prominulous to plane beneath, the lateral veins 7-8, arcuate, mem- branous, glabrous to villosulose above, short pilose or villosulose beneath; pet- ioles slender, to 1 cm long, to 0.5 mm wide, puberulent; stipules not seen. Inflorescences axillary, umbelliform, the peduncle reduced, the flowers conglom- erate. Flowers on short pedicels to 0.5 cm long; hypanthium to 0.5 mm long, densely villose, the calycine cup to 0.4 mm long, the calycine lobes 4, lanceolate, ca. 3 mm long, ca. 0.8 mm wide, venose, the hairs dense and curled outside, at least 1 erect oblong gland to 0.35 mm long at a sinus; corolla white, the tube (in bud) short, villose outside, glabrous inside, the lobes 4, to 3 mm long, ca. 0.7 mm wide, densely villose abaxially; stamens 4, the anthers ca. 0.7 mm long, the filaments short. Fruits turbinate, 5-7 mm long, sparsely villose.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 11851
          archiveSourceId: 68656905-2D2D-4F65-B75A-08E49358EBE0
