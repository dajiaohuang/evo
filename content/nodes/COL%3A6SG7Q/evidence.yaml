        usage:
          title: Ocimum gratissimum L., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Subshrubs, erect, to 2 m, glabrous to softly pubescent on the younger branches. Leaves ovate or elliptic, acute, crenate to subentire, the bases rounded and weakly attenuate or ? obtuse, to 7 cm long and 4.5 cm wide, resin-dotted, glabrous above and sparsely pubescent on the veins beneath; petioles to ca 4.5 cm long, pubescent. Inflorescences verticils, each ca 6-flowered, 0.5-1 cm distant, the false racemes 10-15 cm long, the bracts + deltoid, 2-3 mm long, pubescent. Flowers with pedicels ca 1-2 mm long; bracteoles not apparent; calyx 3-4 mm long, membranaceous, resin-dotted, pubescent on the veins and at the base, naked within, the upper lip entire, 3-veined, lateral margins decurrent only on upper 1/3 of tube, the lower lip 5-7-veined; corolla tubular, white and purple, ca 2.5 mm long overall; stamens exserted, lower filament pair with conspicuously pubescent appendages at the base, the anthers ca 0.6 mm long; ovary 4-lobed, gynobase weakly lobed, the style bifid near the-tip, the branches ? equal. Nutlets (3-)4, ? spherical or slightly elongated, ca 1.2 mm long, the pericarp warty.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 6567
