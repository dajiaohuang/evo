    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Tufted perennial about 1 700 mm high; basal sheaths pubescent; culm erect, nodes pubescent. Leaf blade 15-62 x 4.9-6.1 mm, involute to flat, glabrous; ligule 2-8 mm long, conspicuous. Inflorescence terminal, with 15-44 racemes, scattered up central axis; spikelets divergent, arranged in four rows, secund. Spikelet 2.0-2.5(3.0) x 0.9-1.3 mm, elliptic, yellowish-brown to straw-coloured often purple- tinged; lower glume triangular but usually absent; upper glume shortly pubescent, 3-nerved, occasionally minutely reddish-purple spotted; lower lemma glabrous or pubescent, 3-nerved; upper lemma rugose; anther about 1.9 mm long.
