  claim-rationales.zh:
    - 北极半水生鳍足形类的分类表述只覆盖具名标本及所引主研究的分析范围；导航归属不表示直系祖先或普适系统树。
    - 北极半水生鳍足形类的地理字段只投影主研究记录的具体产地，不外推为全球分布、起源中心或完整扩散路径。
    - 北极半水生鳍足形类的生态字段区分保存事实与功能推断；未被标本直接记录的饮食、行为、栖息地或性能均明确保留不确定性。
    - 北极半水生鳍足形类的形态字段限定于主研究列明的具名标本和精确页码、图版或补充材料，不外推到整个支系。
    - 北极半水生鳍足形类的年代范围是主研究标本或地层背景的有界投影，不作为全球首现、末现、分化时间或连续谱系时长。
  claim-statements.zh:
    - 来源矩阵将 NUFV 405 置于鳍足形类；这一结果不使 Puijila 成为海豹的直接祖先。
    - 本资料代表德文岛 Haughton 组的一处湖相产出，不能确立完整的北极扩散路线。
    - 牙齿和肢体比例支持捕食性和半水生解释，但淡水利用与游泳行为并未被直接观察。
    - NUFV 405 保存了约 65% 的关联骨架，包括颅骨、椎骨以及相当部分的前、后肢。
    - 2,400 万至 2,000 万年前的区间是 NUFV 405 所在早中新世地层的宽泛换算，并非鳍足形类首次出现、该属末次出现或过渡持续时间。
