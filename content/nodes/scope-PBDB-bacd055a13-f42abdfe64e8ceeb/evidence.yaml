          relation: supports
          pages: 1021–1024; Figures 1–4; Supplementary Information
    - subjectId: taxon:puijila
      claimType: biogeography
      claimKind: scientific
      statement: The profile represents one Haughton Formation lake occurrence on Devon Island and does not establish a complete Arctic dispersal route.
