        usage:
          title: Meliosma linearifolia A.H.Gentry, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Pachycaul tree 4-15 m tall, 4 cm d.b.h.; branchlets thick, somewhat angular, minutely puberulous, soon glabrate, elenticellate. Leaves alternate, clustered at the branch tips, 40-60 cm long, 2.5-7.5 cm wide, linear to narrowly oblanceolate, apices not seen, basally gradually attenuate, usually more or less auriculate at the extreme base, entire, coriaceous, strikingly bullate, the main veins impressed above and raised below, the surface densely minutely punctate, puberulous with minute, mostly gland-tipped trichomes along the veins and sparsely over the surface below and sometimes above; petiole puberulous, in part with gland-tipped trichomes, usually thick and less than 1 cm long, to 3 cm long on young branch- lets.- Inflorescence a large open terminal panicle 40-70 cm long, puberulous with erect reddish trichomes in part gland-tipped, the flowers with individual pedicels mostly ca. 1 mm long. Flowers cream with brown calyces; sepals 5, subequal, suborbicular, ca. 1 mm long, long ciliate, also with a few scattered simple tri- chomes and stalked glands; 3 outer petals broadly ovate, entire, ca. 1.5 mm long and 1.2 mm wide, with a broad thinner margin; fertile stamens 2, ca. 1 mm long, the anther thecae ovoid, contiguous at the middle but the bases separated by the thickened connective, the filament broad and strap-shaped; ovary ovoid-globose, ca. 0.6 mm long, the stigma short, ca. 0.1 mm long. Fruit pyriform-globose, 1.5- 1.8 cm long, 1.5-1.7 cm wide, glabrous.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 12457
