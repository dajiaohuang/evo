        claims:
          - text: Perennial herb, up to 0.6 m high. Leaves triangular-hastate, 170-300 x 50-150 mm, densely maculate with long, white, translucent spots. Spathe golden yellow.
            textZh: Zantedeschia jucunda Letty 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_11118_0
            locator: "SANBI/WFO archive Morphology row 3992; source identifier 11118.0; cited publication: Herman, PPJ; Retief, E. 1997. Plants of the northern provinces of South Africa: Keys and diagnostic characters. Strelitzia 6: 1 - 681. National Botanical Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Zantedeschia jucunda is most nearly related to Z. pentlandii and Z. albomaculata. It differs from the former in having triangular-hastate, copiously spotted leaves with upwardly spreading basal lobes and an acute apex, while the spathe is more cup-shaped, a deeper yellow without and within, where it is also slightly rugose, and the limb more spreading and tapering to a subulate tip; whereas Z. pentlandii has immaculate (or rarely maculate), oblong- lanceolate leaves with short rounded basal lobes, the spathe regularly funnel-shaped, limb erect, lighter in colour, greenish outside, terminating abruptly in a subulate tip. From the form of Z. albomaculata subsp. albomaculata occurring in the eastern Transvaal, Z. jucunda differs in its consistently brilliant yellow spathes, whereas the spathes of Z. albomaculata may be white, cream or pale-yellow with an occasional coral-pink variation.
            textZh: SANBI 条目提供了 Zantedeschia jucunda Letty 的鉴别特征。
            sourceIds:
              - sanbi_282_0
            locator: "SANBI/WFO archive Diagnostic row 78191; source identifier 282.0; cited publication: Letty, CL. 1973. The genus Zantedeschia. Bothalia 11(1): 5 - 26. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
