  claim-rationales.zh:
    - 石松类的分类字段只陈述所引研究与导航范围；不会把矩阵位置、数据库映射或样本相似性改写为直系祖先。
    - 石松类的地理字段限于具名样本或明确模型范围，不外推为全球分布、起源中心或完整扩散路径。
    - 石松类的生态字段区分保存事实与功能推断；未被直接记录的饮食、行为、栖息地偏好和性能均保留不确定性。
    - 石松类的形态字段限于主研究列明的标本、样本或分析，并连接到精确页码、图版或补充材料。
    - 石松类的年代范围是有界的标本、地层或模型投影，不作为全球首现、末现、分化时间或连续谱系时长。
  claim-statements.zh:
    - 本档案在演化支层级介绍石松类；Asteroxylon mackiei 仅作为物种层级的解剖实例，而非直系祖先。
    - 所举莱尼燧石标本来自苏格兰；它不能确定石松类的全球分布或起源中心。
    - Asteroxylon 的生根结构支持该植物具有陆地固着与吸收功能，但现生及化石石松类的生境和生长型差异很大。
    - 三维重建区分了 Asteroxylon 的带叶枝轴、承根轴和生根轴；生根轴出现在不等二叉分枝点。
    - 425–0 Ma 图集包络仍是取整后的演化支导航范围；所引 407 Ma 的 Asteroxylon 解剖证据本身不能确立石松类的全球首现。
