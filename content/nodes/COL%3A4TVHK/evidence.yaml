        usage:
          title: Sabicea panamensis Wernham, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrubs or sprawling woody vines, the stems terete, densely pubescent, the nodes well spaced. Leaves elliptic, 7-13 cm long, 3.0-5.5 cm wide, deltoid, rarely obtuse at the apex, often contracted and short acuminate, the acumen widely triangular, cuneate to occasionally obtuse at the base, the costa prominulous above and beneath, the lateral veins 10-14, arcuate, chartaceous, often stiffly so, not strongly discolorous above, the hairs in the intervenal areas stigillose, well spaced or absent, those on the costa and veins stiff, appressed, dense, the hairs in the intervenal areas beneath sometimes shorter than above, the costa and the veins with elongate, appressed hairs; petioles to 2 cm long, to 0.15 cm wide, densely hairy; stipules free, ovate rotund, rotund or compressed rotund, to 7 mm long, often as wide as long at the base, drying red, reflexed, strigose outside, glabrous within. Inflorescences axillary, the peduncle 0.5-1.5(-3.5) cm long, the flowers congested; bracteoles narrowly oblong. Flowers pedicellate, the pedicels slender, 0.3-1.0 cm long; hypanthium densely appressed golden hairy, the caly- cine cup short, the lobes 5, equal or unequal, narrowly ovate, to 4 mm long, the longest often exceeding the hypanthium in length, usually reflexed, glabrescent within; corolla white or yellow, occasionally red or purple pink, often turning brown with age, the tube narrowly funnel shaped or cylindrical, 5-6 mm long, ca. 1 mm wide in the middle, the hairs outside similar to those of the hypanthium, glabrous within, the lobes 5, subulate or narrowly triangular, equal or subequal, to 2.5 mm long; stamens 5, the anthers sessile or subsessile, oblong, ca. 2 mm long, attached above the middle of the tube; style linear, 2-10 mm long, the stigmas 2, each about as wide as the style, to 1 mm long. Fruits pedicellate, rotund to oblong, 0.5-0.9 cm in diam., pink or red at maturity, the hairs weak, elongate, well spaced, appressed strigose.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 12266
