    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Annual, tufted (erect to sprawling, occasionally rooting at nodes), up to 0.9 m high. Leaf blades up to 300 mm long, up to 20 mm wide. Lower sheaths glabrous or sparsely hairy at extreme base, leaves dark green. Spikelets 2.0-2.5(-3.5) mm long. Inflorescence well exserted from uppermost leaf, open, oblanceolate to narrowly obovate, profusely branched with many spikelets; spikelets blunt; tips of glumes not recurved; lower glume broadly ovate; upper glume and lower lemma 9-11-nerved; lower floret male or both male and sterile occurring in the same inflorescence, palea well developed; female-fertile (upper) lemma pale to yellow, shiny.
            textZh: Panicum schinzii Hack. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_11118_0
            locator: "SANBI/WFO archive Morphology row 2958; source identifier 11118.0; cited publication: Herman, PPJ; Retief, E. 1997. Plants of the northern provinces of South Africa: Keys and diagnostic characters. Strelitzia 6: 1 - 681. National Botanical Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Resembles P. simulans, which is yellowish green, inflorescence obovate to broadly obovate, spikelet acute and occurs in northern Namibia; and P. subalbidum, which has spikelets adpressed to inflorescence branches and lower palea conspicuously reduced in length.
            textZh: SANBI 条目提供了 Panicum schinzii Hack. 的鉴别特征。
            sourceIds:
