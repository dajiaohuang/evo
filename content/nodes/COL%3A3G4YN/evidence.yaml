            locator: "SANBI/WFO archive Morphology row 71659; source identifier 16273.0; cited publication: Retief, E; Meyer, NL. 2017. Iridaceae. In: E Retief & NL Meyer (eds), Plants of the Free State: Inventory and identification guide, Strelitzia 38: 934 - 956. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Distinctive in its large, nodding, scarlet flowers with horizontal to drooping dorsal tepal and strongly recurving lower tepals splashed with white on the lower half. The perianth tube is strongly curved, 33-37 mm long, and the anthers are well-exserted on filaments 30-50 mm long. The unusually long style branches, 7-8 mm long, are distinctive.
            textZh: SANBI 条目提供了 Gladiolus saundersii Hook.f. 的鉴别特征。
