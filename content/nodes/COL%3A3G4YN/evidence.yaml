    facets:
      morphology:
        status: partially-supported
        claims:
          - text: "Cormous geophyte, up to 0.6 m high, in colonies. Leaves firm, erect, in a fan, 15-25 mm wide, midrib thickened, veins prominent. Flowers: in a 4-9-flowered, erect spike; ± 60 mm wide, downward facing, strongly hooded; anthers 15-16 mm long, purple; perianth bright red with broad white mark and speckling on 3 lower segments; Jan.-Mar."
            textZh: Gladiolus saundersii Hook.f. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
