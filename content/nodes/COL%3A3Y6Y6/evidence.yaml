          title: Maripa panamensis Hemsl., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Lianas; stems terete, angled, light brown. Leaves ovate, elliptic to obovate, 7-15 cm long, the base cuneate to + rounded, the apex shortly acuminate to ob- tuse, coriaceous, with an obvious raised, rugose pattern below between the sec- ondary veins, dull above, glabrescent. Inflorescences terminal, paniculate- thyrsiform, covered with reddish glandular trichomes; bracts triangular, ca- ducous, densely covered with peltate glandular trichomes. Flowers with the pedicels 3-4 mm long; sepals ovate to broadly ovate, 7-8 mm long, coriaceous, the external lobes with reddish peltate glandular trichomes, the inner with ap- pressed trichomes or glabrous; corolla violet to pale lilac, 25-30(-37) mm long. Fruits ellipsoid to broadly ellipsoid, 17-25 mm in diameter, sulcate with 16-22 sulcae when dry, yellow turning light to dark brown; seeds ellipsoid to ovoid, 15-17 mm long, 9-10 mm in diameter.
