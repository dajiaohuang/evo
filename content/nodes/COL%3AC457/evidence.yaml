          - text: "Aloe suprafoliata differs from its nearest ally, A. thorncroftii, in the following ways: the leaves of young plants are always distichous and have smooth, glaucous surfaces; the flowers of this species, although long and showy, are not as long or as conspicuous as those of A. thorncroftii."
