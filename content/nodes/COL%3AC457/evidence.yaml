    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Acaulescent or shortly caulescent, succulent herb, up to 400 mm tall, excluding inflorescence. Leaves distichous in young parts (up to flowering size), smooth. Inflorescence 0.6-2.0 m high. Racemes shorter than 300 mm. Outer perianth segments free to base. Flowers brilliant pink.
