    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Low-growing annual or short-lived (?) perennial with a long woody taproot, branches many from the crown, mostly 50-200 mm long, prostrate or suberect, slender, subsimple or much branched in upper half, thinly white-woolly, glabrescent, leafy. Leaves 4-13 x 1(-2) mm, linear-oblong, narrowed in upper two thirds, obtuse, margins revolute, lower third broadened, half-clasping, margins flat, both surfaces glandular, thinly woolly-cobwebby, glabrescent. Heads homogamous, campanulate, ±3 x 2 mm, several in tight clusters up to 10 mm diam. at the branch tips closely surrounded by reduced leaves and webbed to them with wool, old clusters overtopped by several younger flowering branchlets. Involucral bracts in 3 series, subequal, equalling flowers, not radiating, pellucid, yellow or straw-coloured, glossy, tips obtuse, erose, soon caducous. Receptacle with flattened tubercles. Flowers 16-28, yellow. Achenes 0.75 mm long, elliptic, glabrous or with myxogenic duplex hairs. Pappus bristles many, equalling corolla, scabrid, bases with patent cilia not cohering. Probably flowers in any month, but most records are in spring (August to November) with others in December, February, March and May.
            sourceIds:
