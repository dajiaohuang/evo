  claims:
    - subjectId: event:haramiyavia-ct-crown-boundary
      claimKind: scientific
      claimType: topology
      statement: CT anatomy and dental wear from MCZ7/95A–B and MCZ10/G95 informed a rescored matrix that placed Late Triassic haramiyids outside crown Mammalia, while the postdentary trough supports rather than directly preserves a mandibular middle ear.
      confidence: medium
      confidenceRationale: Named specimens, tomographic observations, wear reconstruction and MorphoBank Project 2292 are available. Medium confidence keeps crown placement conditional on this character matrix and separates preserved jaw surfaces from inferred auditory anatomy.
      referenceLinks:
        - referenceId: luo-2015-haramiyavia
          relation: supports
          pages: E7101–E7109
          figure: Figures 1–4; Supplementary Figures S1–S8
          quoteLocator: Results; Phylogenetic analysis; Materials and Methods
  claim-rationales.zh:
    - 具名标本、断层扫描观察、磨耗复原和 MorphoBank 2292 项目均可核查。中等置信度把冠群位置限定于该性状矩阵，并区分保存的颌面结构与推断的听觉解剖。
  claim-statements.zh:
    - MCZ7/95A–B 与 MCZ10/G95 的 CT 解剖和牙齿磨耗用于重新评分的矩阵，该矩阵将晚三叠世贼兽类置于哺乳动物冠群之外；齿骨后沟仅支持下颌中耳解释，并未直接保存中耳。
