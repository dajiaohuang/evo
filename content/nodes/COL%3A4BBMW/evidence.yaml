    facets:
      morphology:
        status: partially-supported
        claims:
          - text: "Caulescent, 10-22 cm high, thinly villose, with glandular hairs admixed. Stem erect, with a few ovate-lanceolate semiamplexicaul scales on the lower part, leafy above. Leaves, the lower cauline or clustered on abortive branchlets, with short petioles, the topmost terminally clustered, with petioles 1-2.5 cm long: leaflets 3, sessile, 0.5-1 cm long, bilobed to rather below the middle, cuneate at the base with divergent lobes; pilose below, glabrous above, ciliate with glandular hairs: lobes obovate, up to 3 mm broad, with several calli towards the apex. Peduncles 1-fld., axillary on the upper part of the stem, 2-3.5 cm long, with 2 linear opposite bracts at an articulation a little above the middle. Sepals ovate or ovate-oblong, obtuse, 3.5-4 mm long, with 2 conspicuous apical calli. Corolla up to 1.3 cm long, ? white, pubescent. Filaments the shorter 1.5-3.5 mm, sparsely glandular, the longer 2-5 mm long, densely pubescent. Ovary pilose near the apex: styles rather densely pubescent, with glandular hairs admixed. (The shape and colour of the corolla cannot be determined from the dried specimens seen)."
            sourceIds:
