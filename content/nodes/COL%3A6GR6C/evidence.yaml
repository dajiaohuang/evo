        usage:
          title: Eriosema violaceum (Aubl.) G.Don, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Herb or subshrub, few to many branched; branches erect or ascending from a woody base; stems puberulent, villous. Leaves trifoliolate, the leaflets linear lanceolate, 4.7-8.0 cm long, 0.6-1.2 cm wde, apically obtuse, basally cuneate, the margins revolute, the upper and the lower surface strigose, the lower surface gland dotted, terminal leaflet 1/3 longer than the laterals; petioles 2.0-4.0 mm long, densely villous, appressed, the stipules lanceolate, striate, connate, pilose, per- sistent, 6.0-10.0 mm long, 2.0-3.0 mm wide. Inflorescence 4.7-7.0 cm long, multiflorate with 30-35 flowers, in loose clusters; peduncle 2.2-3.0 cm long; ped- icel 1.8-2.0 mm long; bracts subtending the flowers caducous, ovate, 2.5-4.0 mm long, 1.5 mm wide; bracts subtending the inflorescence lanceolate, 0.6 cm long, 0.2 cm wide, striate, puberulent. Flowers with the calyx 0.3-5 mm long, the lobes 1.5-3.0 mm long, the upper lobe slightly longer, externally glandular, villous; corolla yellow, 6.0-8.0 mm long, the standard obovate, 7.0-8.0 mm long, 4.0-5.0 mm wide, auriculate at the base, the wings oblong, 7.0-7.5 mm long, 2.5-3.0 mm wide, the claw 2.0 mm long, the keel 7.0-7.5 mm long, 2.5-3.0 mm wide, the claw 3.0 mm long; stamens 7.0 mm long.Truit ovate, 0.7-1.0 cm long, 0.4-0.6 cm wide, densely villous; seeds 3.5-4.5 mm long, oval black.
