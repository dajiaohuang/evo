    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Numerous thin, strapshaped roots up to 1 mm wide. Crown small and slender, apex fibrous, not typically tomentose, but the basal leaf stalks often densely villose or tomentose with whitish hairs. Leaves 4.4-20.8 cm long, 1-3.6 cm wide. Petiole 3-14.5(-18.5) cm long, 0.5-1 mm wide, very slender, almost glabrous to more or less covered with whitish, villose or woolly hairs, rarely hispid. Blade somewhat coriaceous, broadly ovate, subrotund or rotund, 1.1-3.5 cm long; apex rounded or broadly acute, base cordate, margin sharply dentate, usually bent backwards, ± pilose, ageing glabrous. Upper surface dark or fresh green, glabrous or very sparsely covered with rather long hairs; lower one cobwebby, soon glabrescent, both sides then covered with very small vesicles hardly visible to the naked eye. Nerves reticulate, hardly visible above, especially the midvein prominent below, brownish. Scapes 1-ca. 7, 10.5-31.5 cm long, 0.8-1.0(-1.5) mm wide, brownish, woolly, becoming almost glabrous, blackish above with a whitish tomentum continuing scattered on the outer involucral bracts. Scape with a few to about 12 small, subulate, pointed or subacute bracts, particular congregated in the uppermost part. Involucral bracts 2-11(-12) mm long, 0.5-1.0(-1.5) mm wide, lanceolate, long attenuate, often minutely dentate at the apex; outer bracts ± tomentose-pilose below, inner ones usually almost glabrous. Heads turbinate, 9-14 mm long, 10-15 mm wide. Tube of ray florets 3-4 mm long, very narrow, lower limb 5-9 mm long, 0.75-1.5 mm wide, upper limb 0-2.5 mm long; free part of style when fertile up to 2.5 mm long. Tube of disc florets 2.5-4.5 mm long, the 2 limbs equal, 1.5-3 mm long, often splitting into 5 lobes with age. Achenes 3.5-4.5(-5.5) mm long, sometimes apparently with a very short, obscure beak, never truly beaked. Pappus whitish, but not snow-white.
