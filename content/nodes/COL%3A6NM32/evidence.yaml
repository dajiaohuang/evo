            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Its nearest relative is K. breviflora from which it is distinguished mainly on perianth length which, in K. breviflora, is 7-11 mm. There are, however, occasional intermediates which suggest that K. buchananii might be better placed as a subspecies of K. breviflora. K. breviflora occurs more inland and at higher elevations than K. buchananii. For this reason K. parviflora var. albiflora A.Berger, based on J.M. Wood 4826 from Glencoe with flowers 6-7 mm long, is placed in synonymy under K. breviflora.
