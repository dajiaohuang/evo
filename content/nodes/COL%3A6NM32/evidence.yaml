    facets:
      morphology:
        status: partially-supported
        claims:
          - text: "Plants usually single-stemmed. Leaves narrow, grass-like, at first ascending, later recurving, 400-600 x 2.5-4.0 mm, keeled, triangular in cross section; margin smooth. Scape overtopping recurved leaves, 400-850 mm tall. Raceme oblong to cylindrical, 35-90 x 10-14 mm, dense at apex, often laxer below; buds erect, greenish cream or tinged with red; flowers ascending to deflexed, white. Bracts ovate-lanceolate to lanceolate, acute to acuminate, 4.0-5.5 mm long; margin entire or minutely eroso-denticulate. Pedicels 0.5-1.0 mm long, elongating to 2 mm in fruit. Perianth subcampanulate to oblong, 4.0-5.5 mm long; lobes broadly ovate, 1 mm long, not spreading. Stamens exserted by 1.0-1.5 mm at anthesis. Fruit globose to ovoid, 2.5 mm long. Flowering time: mainly February to March, with an occasional record as early as October and as late as April."
            textZh: Kniphofia buchananii Baker 的 SANBI 物种条目记录了形态特征。
