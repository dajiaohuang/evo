  claims:
    - subjectId: event:hamipterus-egg-assemblage
      claimKind: scientific
      claimType: ecology
      statement: The Hamipterus site preserves hundreds of three-dimensional eggs, including 215 exposed in one block and 16 containing embryonic remains across at least four levels; storm transport, colonial nesting, hatchling flight ability and parental care remain interpretations of context and development.
      confidence: medium
      confidenceRationale: Egg counts, embryo-bearing eggs, computed tomography and stratigraphic repetition are directly documented. Medium confidence preserves uncertainty in taphonomic reconstruction, embryo stage and behavioural extrapolation.
      referenceLinks:
        - referenceId: wang-2017-hamipterus-eggs
          relation: supports
          pages: 1197–1201
          figure: Figures 1–4; Supplementary Figures S1–S12
          quoteLocator: Egg accumulation; Embryos; Taphonomy
  claim-rationales.zh:
    - 卵数量、含胚胎卵、CT 与地层重复均有直接记录。中等置信度保留埋藏重建、胚胎阶段和行为外推的不确定性。
  claim-statements.zh:
    - 哈密翼龙地点保存数百枚三维卵，其中一个岩块暴露 215 枚，至少四个层位中有 16 枚含胚胎遗骸；风暴搬运、群体营巢、幼体飞行能力与亲代照料仍是对环境和发育的解释。
