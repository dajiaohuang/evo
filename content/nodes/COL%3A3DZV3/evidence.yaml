        claims:
          - text: Like F. crispa but leaves and branches spirally 2-ranked, leaves thickened toward middle, and flowers maroon, purple or dark brown.
            textZh: Ferraria foliosa G.J.Lewis 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 7488; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Vegetatively, Ferraria foliosa can be distinguished by the long, linear basal leaves much thickened in the midline, thus ± diamond-shaped in cross section, and sometimes dry by flowering time. The basal leaves differ markedly from the shorter, broader cauline leaves, the blades also thickened in the middle and arching outward, ultimately spreading horizontally. Successive leaves are opposed but collectively the leaves have a spirally two-ranked arrangement. This is also reflected in the short lateral branches, which are crowded in the upper half of the stem, the successive ones rotated slightly in a clockwise direction. The flowers differ little from those of closely related F. crispa in their darkly mottled pigmentation, broad tepal claws with large nectaries, and wide, shallow floral cup. Whereas the flowers of F. crispa are usually shades of dull yellow, buff-coloured and brown, those of F. foliosa are mottled dull purplish, or brownish maroon on a paler grey-purple background.
            textZh: SANBI 条目提供了 Ferraria foliosa G.J.Lewis 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 95223; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
