      statement: The 358.9–0 Ma Sauropsida route uses the Snowy Plains clawed trackway as a probable primitive-sauropsid minimum; because the trackmaker could lie near the amniote crown node, the endpoint is contested and not a body-fossil FAD or crown-birth date.
      confidence: contested
      confidenceRationale: The primary study identifies a sauropsid as the preferred interpretation but explicitly retains a near-crown alternative. Matching the route to that conditional minimum preserves the current evidence without overstating taxonomic certainty.
