        usage:
          title: Coccocypselum herbaceum P.Browne ex Aubl., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Prostrate herbs, the stems slender, glabrescent or pilose. Leaves ovate or ovate subrotund, 0.8-4.2 cm long, 0.5-2.5 cm wide, widely deltoid at the apex, rounded or truncate at the base, often slightly contracted at the junction with the petiole, often inequilateral, the costa prominulous above and beneath, the lateral veins 6-8, arcuate, membranous, glabrescent to pilose above, the hairs short or long, the latter often scraggly, golden, bulbous at the base, often much longer above than beneath, pilose beneath but the hairs often restricted to costa and veins and then appressed and elongate; petioles 0.5-2.5 cm long, ca. 0.1 cm wide; stipules small, 2.5-3.0 mm long, the awn often 5 times longer than the body. Inflorescences sessile or subsessile, the heads few flowered. Flowers with the calycine lobes subulate, to 4 mm long, pilose; corolla light blue, the tube to 9 mm long, short pilose. Fruits ovoid at maturity, subrotund to ovate rotund when immature, to 1.5 cm long, pilose, the hairs gradually deciduous, china blue.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 17205
