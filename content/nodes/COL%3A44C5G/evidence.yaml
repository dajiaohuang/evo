        claims:
          - text: Cormous geophyte, 12-30 cm, stem flexed outward above leaf sheath. Leaf solitary, linear, trailing. Flowers yellow with a greenish, speckled centre, tepal claws forming a short cup, anthers exserted on a slender filament column.
            textZh: Moraea flavescens (Goldblatt) Goldblatt 的 SANBI 物种条目记载了植株、叶片和花部形态。
            sourceIds:
              - sanbi_13878_0
            locator: Strelitzia 29; archive Morphology row 7396, source 13878.0
            placeTimeScope: Regional species account published 2012; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
          - text: Relatively poorly documented, Moraea flavescens is rather variable as circumscribed at present. Plants in the south have smaller flowers than those in the north of its range and specimens from this area bear the manuscript name H. klawerensis L.Bolus. The species is characterised by its pale, watery yellow flowers with a wide tepal cup and emarginate outer tepals, and flat style branches shorter than the anthers. Populations from the southern Cederberg have the unusual diploid number of 2n = 9, and form complex heterozygotes at meiosis. Moraea flavescens is closely related to a second Cederberg-Gifberg endemic, M. demissa, which also has unusual chromosome cytology with diploid numbers of 2n = 10, 9 or 8. Moraea demissa has smaller flowers, also pale yellow, but the tepal claws are suberect and form a narrow cup around the lower half of the filament column. Flowers of M. flavescens open in the morning while those of M. demissa open after midday and last through the late afternoon.
            textZh: SANBI 条目提供了 Moraea flavescens (Goldblatt) Goldblatt 的鉴别特征。
            sourceIds:
