    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, 6-25 cm, tunic fibres firm, often outwardly pointed at tips. Leaves 3-6(-9), spreading, lanceolate, keeled, soft-textured, occasionally undulate. Flowers (1)2(3), stellate, yellow, greenish to brownish beneath, bracts (1)2, lanceolate, membranous, pale to brownish.
            textZh: Pauridia flaccida (Nel) Snijman & Kocyan 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13877_0
            locator: "SANBI/WFO archive Morphology row 7532; source identifier 13877.0; cited publication: Snijman, DA. 2012. Hypoxidaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 115 - 119. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Pauridia flaccida can be recognized by a combination of characters. The often many-layered corm tunics have somewhat hard fibres, mostly with outspread, pointed tips. The two bracts, each clasping the base of a pedicel, are characteristically broad and thin-textured, displaying a prominent midrib and a few, lateral veins. The style is short (1-2 mm long) and supports large, often convoluted stigma branches, (2.5-)4.0-5.5(-6.5) mm long, which are characteristically broad-based (1.5-2.5 mm wide) with outspread basal lobes protruding between the filaments. In several regional Floras the circumscription of P. flaccida included collections from as far east as Humansdorp, Eastern Cape. After careful study, plants from the Langeberg, east of Swellendam, through the Outeniqua and Tsitsikamma Mountains to the Humansdorp area are now placed in P. maryae, which is distinguished from P. flaccida sensu stricto by the outer sheathing leaf bases forming a smooth, brown and papery to leathery neck and the narrowly oblong (2.0-3.5 mm) stigma branches lacking spreading basal lobes.
            textZh: SANBI 条目提供了 Pauridia flaccida (Nel) Snijman & Kocyan 的鉴别特征。
