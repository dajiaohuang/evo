    facets:
      morphology:
        status: partially-supported
        claims:
          - text: "Plants with subterranean, moniliformous rhizomes; leaves thin-tissued, up to 300-600 x 20-55 mm; flowering stem 200-800 mm tall. Inflorescences lax, 3-30-flowered; bracts lanceolate-acuminate, slightly shorter than the ovary. Flowers: sepals dark lime green on the outer surface, dark brownish purple with flecks of dull green within, petals and lip purple to white, with dark bluish-purple along the margins and veins, crests pale purple basally, to white and dark purple distally. Sepals spreading; median sepal (12-) 14-17 (-18) mm long, elliptic to oblong, apiculate; lateral sepals similar. Petals half the length of the median sepal, broadly ovate-rotund, obtuse to mucronate. Lip midlobe with fleshy crenulate margins, crests consisting of 3-5 undulate lamellae, tallest on the central veins in the distal part of the midlobe; mentum vestigial, broad; spur cylindrical, slightly longer than the gynostemium, often abruptly decurved near the apex. Gynostemium 4-5 mm long."
