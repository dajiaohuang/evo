      morphology:
        status: partially-supported
        claims:
          - text: Perennial herb, up to 0.6 m long; stems ± angular-flexuose, branching from below middle. Leaves ovate-oblong, base cordate, apex acute, margins ± subdenticulate; petioles shorter than lamina; upper cauline leaves few, smaller. Inflorescences branched, angularly reflexed or arcuate-divaricate. Flowers in many-flowered whorls, nearly all subtended by a leaf, uppermost whorls leafless; greenish; inner perianth segments toothed. Flowering time Aug.-Apr. Fruiting pedicels ± as long as valves. Fruiting valves leathery, narrowly or broadly ovate, apex ligulate or broadly acuminate, reticulation foveolate, margins grossly dentate, pale brown; callosity basal on main vein of each valve, fusiform, > 1/2 as long as wings, apex long attenuate. Fruit a nut, up to 4 mm long.
