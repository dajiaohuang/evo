  claims:
    - subjectId: taxon:dimetrodon
      claimKind: scientific
      claimType: topology
      statement: A sampled sphenacodontoid analysis places the included Dimetrodon species within Sphenacodontidae and recovers repeated dental-character changes; this is a character-matrix result, not evidence that Dimetrodon was a direct mammalian ancestor.
      confidence: medium
      confidenceRationale: The primary study directly scores Dimetrodon material and optimizes dental characters on a sampled tree. The wording preserves matrix dependence and excludes direct ancestry.
      referenceLinks:
        - relation: supports
          referenceId: brink-2014-dimetrodon-dentition
          pages: Article 3269
          figure: Figures 1–4
          quoteLocator: "Methods: phylogenetic analysis; Results: character distribution"
    - subjectId: taxon:dimetrodon
      claimKind: scientific
      claimType: taxonomy
      statement: This dossier is limited to the Dimetrodon and cf. Dimetrodon teeth and skull material explicitly sampled by Brink and Reisz; the study's sphenacodontid placement is a matrix result and not direct ancestry.
      confidence: medium
      confidenceRationale: Named museum specimens and the sampled analysis identify the evidence boundary, but species-level attribution of isolated material and higher placement remain analytical.
      referenceLinks:
        - relation: supports
          referenceId: brink-2014-dimetrodon-dentition
          pages: Article 3269; Figures 1–4
          quoteLocator: "Results: Morphology and histology of sphenacodontid teeth; Methods: Description of sphenacodontid teeth"
    - subjectId: taxon:dimetrodon
      claimKind: scientific
      claimType: biogeography
      statement: The profile maps only the Early Permian Texas and New Mexico sample, including Archer City, Mount Barry, Briar Creek, Rattlesnake Canyon and the Craddock bonebed; it does not assert a complete geographic distribution.
      confidence: medium
      confidenceRationale: The paper lists the sampled localities and associated Dimetrodon material, while its sampling design is not a global occurrence census.
      referenceLinks:
        - relation: supports
          referenceId: brink-2014-dimetrodon-dentition
          pages: Article 3269; Supplementary Table 1
          quoteLocator: "Methods: Description of sphenacodontid teeth"
    - subjectId: taxon:dimetrodon
      claimKind: scientific
      claimType: ecology
      statement: The authors interpret sphenacodontids, including the sampled Dimetrodon material, as fully terrestrial apex predators and relate dental-character change to feeding style and trophic interactions; direct prey use and locomotor performance were not observed for each specimen.
      confidence: medium
      confidenceRationale: Dental anatomy and the authors' ecological interpretation support a bounded predator inference, but they do not directly record behaviour, prey or performance.
      referenceLinks:
        - relation: supports
          referenceId: brink-2014-dimetrodon-dentition
          pages: Article 3269; Figures 1–6
          quoteLocator: "Abstract; Results: Phylogenetic analysis"
    - subjectId: taxon:dimetrodon
      claimKind: scientific
      claimType: morphology
      statement: MCZ 2779, MCZ 2028, ROM 64021 and UMMP 9722 document the sampled Dimetrodon snout and teeth, including enlarged anterior teeth, carinae and variation in lingual cusp morphology; these observations do not diagnose every species or individual of the genus.
      confidence: high
      confidenceRationale: The paper figures and describes the named specimens directly; scope is retained at the observed material rather than extrapolated to every Dimetrodon.
      referenceLinks:
        - relation: supports
          referenceId: brink-2014-dimetrodon-dentition
          pages: Article 3269; Figures 1–4
          quoteLocator: "Results: Morphology and histology of sphenacodontid teeth"
    - subjectId: taxon:dimetrodon
      claimKind: scientific
      claimType: fossil-range
      statement: Dimetrodon is displayed at 290.1–273 Ma only as the Early Permian species sample used for dental and phylogenetic analysis, not a complete global genus range. The interval is a source-bounded sample window, not a global FAD, LAD, divergence date, continuous occupancy claim or direct-ancestor assertion.
      confidence: medium
      confidenceRationale: Dimetrodon uses Brink, K.S.; Reisz, R.R. (2014) because the cited pages and locator expose the sampled taxon, specimen or living sequence set. Confidence is medium and applies only to Cisuralian Dimetrodon material sampled by Brink et al.; broader endpoints remain unclaimed.
      referenceLinks:
        - relation: supports
          referenceId: brink-2014-dimetrodon-dentition
          pages: Article 3269
          figure: Figures 1–4
          quoteLocator: "Methods: phylogenetic analysis; Results: character distribution"
        - relation: contextualizes
          referenceId: ics-2026-06
          pages: International Chronostratigraphic Chart v2026/06
          figure: Global chronostratigraphic scale
          quoteLocator: Numerical boundaries for named geological stages used to bound the source sample
  claim-rationales.zh:
    - 一手研究直接对 Dimetrodon 材料进行编码并在取样树上优化牙齿性状；措辞保留矩阵依赖性并排除直接祖先含义。
    - 具名馆藏标本与被采样分析界定了该档案的证据边界；孤立材料的种级归属和高阶位置仍属分析结论。
    - 论文逐项列出得州和新墨西哥州的采样地点及相关材料；这套采样并非全球出现记录普查。
    - 牙齿解剖及作者的生态解释支持有限的陆生捕食者推断，但并未直接记录每件标本的行为、猎物或运动表现。
    - 论文图示并描述了具名标本；主张只覆盖被观察的材料，不外推到异齿龙属的每个物种或个体。
    - Dimetrodon 采用 Brink, K.S.; Reisz, R.R.（2014）的论文，因为所引页码与定位符直接标示了研究采样的类群、标本或现生序列集合。中等置信度仅适用于 Cisuralian Dimetrodon material sampled by Brink et al.；更宽泛端点保持未声明。
  claim-statements.zh:
    - 作者将楔齿龙科（包括所采样的 Dimetrodon 材料）解释为完全陆生的顶级捕食者，并将牙齿性状变化与摄食方式及营养相互作用联系起来；并未对每件标本直接观察到猎物利用或运动性能。
    - MCZ 2779、MCZ 2028、ROM 64021 和 UMMP 9722 记录了所采样 Dimetrodon 的吻部和牙齿，包括增大的前部牙齿、切缘及舌侧齿尖形态差异；这些观察不能用于诊断该属的每个物种或个体。
    - 本档案限于 Brink 和 Reisz 明确采样的 Dimetrodon 及 cf. Dimetrodon 牙齿和头骨材料；研究中的楔齿龙科位置是矩阵分析结果，而非直系祖先关系。
    - 本档案仅映射得克萨斯州和新墨西哥州的早二叠世样本，包括 Archer City、Mount Barry、Briar Creek、Rattlesnake Canyon 及 Craddock 骨层，不声称代表完整地理分布。
    - 一项有明确取样范围的楔齿龙超科分析把纳入的 Dimetrodon 物种置于楔齿龙科，并恢复出多次牙齿性状变化；这是性状矩阵结果，不是 Dimetrodon 为哺乳动物直接祖先的证据。
    - Dimetrodon 仅以 290.1–273 Ma 展示为用于牙齿与系统分析的早二叠世物种样本，而非该属完整全球范围。该区间是来源限定的样本窗口，不是全球首现、末现、分化日期、连续占据或直接祖先断言。
