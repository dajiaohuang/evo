    facets:
      morphology:
        status: partially-supported
        claims:
          - text: "Cormous geophyte, up to 200 mm high. Leaves 4 or 5, lower 3 basal, weak and drooping. Flowers: anthers 4.5-5.5 mm long; style branches 10-12 mm long; perianth with tube 12-14(-15) mm long, segments 12-16 mm long, ± uniformly pale pink; Jan.-Apr."
            textZh: Hesperantha leucantha Baker 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_16273_0
            locator: "SANBI/WFO archive Morphology row 71833; source identifier 16273.0; cited publication: Retief, E; Meyer, NL. 2017. Iridaceae. In: E Retief & NL Meyer (eds), Plants of the Free State: Inventory and identification guide, Strelitzia 38: 934 - 956. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Recognised by its pale pink flowers with perianth tube usually 12-15 mm long and exserted from the bracts unless these are unusually long, and tepals 9-12(-15) mm long across its main range in interior Lesotho, eastern Free State and northern KwaZulu-Natal. The filaments are ± 5 mm long and inserted shortly within the tube. Related H. baurii also has pink flowers but shorter filaments 2.0-2.5 mm long inserted at the base of the outer tepals. Plants from north of the Vaal River, in Gauteng and Northwest Province, placed in H. leucantha (as H. candida) by Hilliard & Burtt (1986), are somewhat atypical in their greater height and slender habit, but are currently included there. Hesperantha leucantha is sometimes confused with H. glareosa, a species with deep pink flowers with a much shorter perianth tube, mostly 4-6 mm long, and tepals 10.0-14.5 mm long. Hesperantha glareosa also has four leaves, the lower three basal and with firm, narrow blades, mostly 1-2 mm wide.
            textZh: SANBI 条目提供了 Hesperantha leucantha Baker 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 94850; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
