        status: partially-supported
        claims:
          - text: Robust, perennial herb, up to 0.93 m high. Bracts with a raised midvein, dark rusty-brown. Scape transversely elliptic and slightly ancipitous. Margins of upper cauline leaves narrowly hyaline-margined. Flowers blue.
            textZh: Aristea schizolaena Harv. ex Baker 的 SANBI 物种条目记录了形态特征。
