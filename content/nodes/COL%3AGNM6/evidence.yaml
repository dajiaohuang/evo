            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: The relatively tall and slender Aristea schizolaena broadly resembles the more widespread A. torulosa in its few-branched or unbranched stem with several sessile lateral flower clusters but is distinguished by the spathes and bracts subtending the flower clusters, these membranous distally and red-brown even before the first flowers open.
