      claimType: morphology
      statement: Specimen MH 432 preserves scaleless skin layers, a subcutaneous blubber-like layer and eumelanin-bearing structures in Stenopterygius; countershading, thermoregulation and metabolic consequences are comparative interpretations rather than directly measured physiology.
      confidence: medium
      confidenceRationale: Microscopy, spectroscopy and molecular evidence converge on tissue identity in a named specimen, while preservation chemistry and analogy to living animals limit organism-wide physiological inference.
