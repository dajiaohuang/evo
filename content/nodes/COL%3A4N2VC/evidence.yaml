        claims:
          - text: Most populations consist of just a few dozen individuals. They occur an both north- and south-facing slopes but mainly in habitats of southerly aspect. P. namaquana occurs exclusively on granite-derived soils, in contrast to P. sulphurea which is restricted to Witteberg Quartzite and Table Mountain Sandstone.
