            locator: "SANBI/WFO archive Morphology row 43493; source 9580.0; publication: Rourke, JP. 1990. A new species of Protea (Proteaceae) from Namaqualand with comments on the Kamiesberg as a centre of. S. African J. Bot. 56: 261 - 265. [Copyright held by the South African Association of Botanists (1990); http://www.sciencedirect.com/science/journal/02546299]. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Protea namaquana is readily distinguished by its growth habit and foliage. Unlike P. sulphurea which assumes a procumbent, horizontally sprawling mode of growth, P. namaquana is an erect, compact, rounded shrub 1 to 2 m in height. The leaves are narrowly oblanceolate to linear-spathulate, 30-60 mm long and pale green in the live state, unlike the elliptic glaucous leaves, 11^40 mm long in P. sulphurea. The involucral bracts are dull carmine in contrast to the predominantly yellow bracts of P. sulphurea. Newly opened inflorescences emit a strong yeasty odour.
