    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Multistemmed deciduous shrub, generally ±2 m high. Bark granular, rufous, prominently lenticellate; branchlets tomentose to glabrous, somewhat pendulous in old specimens. Leaves trifoliolate, petiolate; petiole tomentose to glabrous, semiterete, shallowly canaliculate, (8-)24(-42) mm long; leaflets sessile, subcoriaceous, concolorous, olive-green above, slightly paler below, glabrous to slightly hirsute, hypostomatous; lamina oblanceolate to narrowly elliptic, rarely ovate to obovate, base narrowly cuneate, apex acuminate, mucronate; margin irregularly, grossly pauciserrate towards apex to entire; venation brochidodromous to semicraspedodromous, all veins dull yellow and prominent above, midrib and secondaries prominent below; terminal leaflets (25-)73(-121) x (4-)22(-26) mm, lateral leaflets (19-)58(-110) x (4-)12(-28) mm. Panicles sparingly branched, axillary and terminal, up to 90 mm long, generally within foliage, often drying blackish. Flowers often sub-glomerulate, calyx lobes hairy, otherwise normal. Drupes oblate, obloid, glabrous, shiny, light to dark brown, relatively small, 2.5 x 2.0 - 3.3 x 2.7 mm. Flowering recorded in November, January and April.
