          originalSourceText: Herbaceous vines; stems slender, glabrous. Leaves lanceolate to lanceolate- elliptic, acuminate apically, basally rounded to subcordate, discolorous, glabrous, mostly 5-10 cm long and 2-4 cm wide; petioles glabrous, 1.5-2.5 cm long. In- florescences umbelliform racemes, mostly 7-12-flowered, glabrate throughout; peduncles 10-12 mm long; pedicels 6-8 mm long. Flowers with the calyx lobes glabrous, lanceolate, 2-2.5 mm long and 1-1.5 mm wide; corolla rotate, green, 7-8 mm in diameter, the lobes ovate, 2.5-3 mm long and 2-2.5 mm wide, glabrous
