      morphology:
        status: partially-supported
        claims:
          - text: Tree 3-10 m tall; branches brown, becoming grey when mature; young shoots and leaves pinkish, densely whitish pilose, becoming glabrous with age. Leaves opposite, petiolate, coriaceous, green at maturity, gland-dotted, obovate to obovate-oblanceolate or elliptic, 6-12 cm long; 3-7 cm broad, cuneate at the base, apex abruptly acute or obtuse to rounded, margin revolute, midrib conspicuous, lateral nerves in 6-8 pairs, spreading, slightly prominent below, joined near the margin; petiole 2-6 mm long, blackish, rugulose. Male flowers sessile or subsessile, congested on abbreviated shoots which occasionally develop as leafy shoots; bracts 2-4 mm long, ciliate, caducous. Calyx united at base; tube broad, more or less saucer-shaped, 2 mm long, densely pubescent; lobes 4, subrotund, 3-3.5 mm long, sparingly pubescent below, subglabrous above. Petals 4, obovate, 6-7 mm long, glabrous, margin ciliate. Disc saucer-shaped, densely pubescent. Stamens numerous, arising from the disc; filaments of various lengths, 4-5 mm long, free to the base; anthers 2-thecous, versatile, 1-1.3 mm long, all fertile. Ovary abortive; style rudimentary, 1 mm long; stigma absent. Hermaphrodite flowers subsessile to shortly pedicellate (pedicels up to 8 mm long), usually solitary, axillary, occasionally on short abbreviated shoots; bracts 2.5 mm long, caducous; bracteoles 2, attached at the base of receptacle, 2.5 mm long, glabrous. Calyx and petals as in male flowers, but somewhat larger; calyx tube obconical, 4 mm long. Disc flat, fleshy, densely pubescent. Stamens numerous, arising from the disc; filaments of various lengths, 3-5 mm long, free to the base; anthers 2-thecous, 1 mm long, with white membranous fringe, broadly rectangular. Ovary immersed in the disc, 2-celled; ovules 2 per cell, 1 or 2 developing; style filiform, glabrous, 8 mm long; stigma small, discoid. Fruit obovoid to subglobose, 2-2.5 cm long, 1.8-2.5 cm diam., glabresccnt, with persistent calyx lobes at the apex. Seeds globose, 1-1.5 cm diam., brown.
