    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Species with well developed staminal appendages and very little or no pubescence. Small in stature, with scapes that are less than 25 cm in length. Filiform leaves, short (up to 25 cm), terete scape, complete absence of pubescence and a small flower, it is identified by the regular arrangement (actinomorphic) of the segments, a characteristic it shares with N. gracilis. N. hesseoides has a very well defined appendage to the base of the stamen filaments. The stamens and their attendant appendages are more deeply separated from each other than in N. frithii.
