        usage:
          title: Coccoloba lasseri Lundell, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Tree to 12 m. tall; branchlets thick, striate, puberulent; ocreae cylindrical and flaring at the top, to 1.5 cm. long, subtruncate, membranaceous above the petiole, densely puberulent when young, the petiole inserted at or above the middle; petioles minutely puberulent, stout, striate, 3-8 mm. long; blades obovate or oblanceolate- obovate, 12 X 5, 15 X 8, 19 X 10.5 cm. long and broad on fertile branches, chartaceous, glabrous above, puberulent below on the midrib and primary veins, apex rounded to obtusely-acute, attenuate from above the middle to the base, the base emarginate or rounded, primary veins 8-12 on each side; adventitious shoots and their leaves unknown; inflorescences terminating short lateral branches, rarely terminal, paniculate, the panicles sessile, composed of 3 or 4 racemes, the racemes to 30 cm. long, peduncles of racemes to 1.5 cm. long, the rachis densely puberulent, striate; staminate flowers borne in clusters of 3-6, pistillate flowers borne singly, bracts and ocreolae minute, less than 0.5 mm. long, the ocreolae multiple, mem- branaceous, pedicels 1-1.3 mm. long, puberulent, hypanthium about 1 mm. long, contracted into a short stipe, perianth lobes suborbicular, about 1 mm. in diameter, fertile stamens slightly exceeding the perianth lobes, functional pistil 2-3 mm. long, the styles 2 or 3, fruiting pedicels 1-1.3 mm. long, the mature fruit nearly spherical, the perianth lobes imbricate, about '3 the length of the fruit; the achene light brown, not coronate at the apex.
