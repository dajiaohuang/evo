        claims:
          - text: Plants epiphytic; stems to 30 x 5 mm; leaves imbricate, blades oblanceolate, unequally bilobed, lobes rounded to acute, 30-150 x 12-25 mm. Inflorescences of several horizontal or pendulous racemes, 100-200 mm long and with 4-15 flowers; peduncles with up to 3 sheaths 3-4 mm long. Flowers white; pedicel and ovary 10-15 mm long. Sepals subequal, narrowly elliptic, acute to apiculate, 7-13 x 2-5 mm; median arched over the gynostemium; laterals spreading, narrower than median. Petals narrowly oblong, acute, 6-13 x 2-5 mm, spreading to reflexed. Lip oblong-elliptic, acute to apiculate, 7-12 x 3-6 mm, deflexed; spur slender cylindrical, curved forwards, (35-) 50-80 mm long. Gynostemium 3-4 mm tall. Capsules cylindrical-elliptic, 25 x 7 mm.
