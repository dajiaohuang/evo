          title: Amphilophium paniculatum (L.) Kunth, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: angles, lepidote to strongly dendroid pubescent, especially on the ribs, interpetio- lar glandular fields lacking, a conspicuous ridge connecting opposite petioles; pseudostipules foliaceous, 3-10 mm long and 3-6 mm wide, early deciduous. Leaves 2-foliolate except on young plants, sometimes with a tendril; leaflets ovate to subrotund, acuminate to obtuse, truncate to asymmetrically cordate, 2.5-16 cm long and 2.1-10.7 cm wide, membranaceous, palmately veined at base, the sec- ondary veins 4-6 on a side, strongly lepidote above and beneath, variably den- droid pubescent, sometimes also with simple trichomes especially above, pubes- cence beneath restricted to midveins and nerve axils or scattered throughout, gray to brown when dry, lighter beneath; tendril trifid, 7-16 cm long to branching, the 3 arms 0.4-2.5 cm long, often unequal; petiolules 0.6-4.3 cm long; petiole 2.3-7.1 cm long; petiole, petiolules, and tendril all ? tetragonal to hexagonal, lepidote and dendroid pubescent. Inflorescence a caducously bracteate ? racemose termi- nal panicle on a short erect lateral branch, the branches lepidote and variably dendroid pubescent. Flowers with some odor, calyx double, the inner calyx 2-3- labiate, the outer calyx more or less 5-lipped, densely lepidote, sometimes den- droid pubescent, especially at the base, 0.7-1.2 cm long and 0.8-1.5 cm wide; corolla yellowish white when young, turning deep purple, tubular, bilabiate, 2.4-3.5 cm long and 0.7-1.6 cm wide, the upper 2 lobes fused, thick, 1 mm long, the lower 3 fused, 1.3-1.8 cm long, the tube split 1/3_2/3 its length, all 5 lobes re- maining loosely fused until forced apart by pollinator, viscid, glabrous to sparsely short simple pubescent outside, inside mostly glabrous, glandular-lepidote on the ridge at the level of stamen insertion, below this the epidermis highly convoluted and glandular; stamens didynamous, the anther thecae divaricate, 2 mm long, the longer filaments 1.7-1.8 cm long, the shorter filaments 1.4-1.5 cm long, the stami- node 3-5 mm long, inserted 4-5 mm from base of corolla tube; pistil 2.4-2.7 cm long, bent 0.7-0.8 cm from the base, the ovary ovate-cylindric, slightly contracted at base, 2-3 mm long, ca. 2 mm wide, short pubescent with simple and dendroid trichomes, the ovules more or less 10-seriate in each locule below to only 4-seriate distally; disc annular-pulvinate, 1 mm long, 3-4 mm wide. Capsule rounded oblong, somewhat flattened, 3.9-9.5 cm long and 2.5-3.8 cm wide, 1.4-2 cm thick, the surface dark, somewhat warty-lenticellate, densely lepidote; seeds 1-1.9 cm long and 2.7-3.0 cm wide, puberulous, the wings membranaceous, brownish, not sharply demarcated, irregularly hyaline only at extreme tips.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 2213
