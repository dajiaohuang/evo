        claims:
          - text: "Perennial 300-800 mm high; rhizome knotty, very slender, branching profusely; culm wiry, node glabrous. Leaf blade 150-300 x 3-4 mm, linear, flat. Inflorescence cylindrical, spike-like, 20-90 mm long; spike- lets subtended by 2-12 bristles; bristles up to 8 mm long, slender, scabrid, yellowish. Spikelet 2.2-3.0 mm long; lower glume 3-nerved; lower floret male or sterile, lemma deeply grooved, palea well devel-oped; upper lemma transversely rugose; anther 0.5-0.7 mm. Flowering: December, January and June."
