          title: Macrolobium pittieri (Rose) Schery, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Small tree. Leaves 2-foliolate, subsessile; leaflets broadly oblanceolate, 3-3.5 dm. long, sometimes 1 dm. broad, chartaceous, basally oblique, apically acute or acuminate. Inflorescence lateral, borne on older branches, 3-5 cm. long, short- pedunculate. Flowers pedicellate, the pedicels 4-6 mm. long, glabrous; sheath (fused bracteoles) 9-11 mm. long, glabrous, cleft for half its length; calyx gla- brous, the lobes imbricate in bud, linear-oblong to linear-obovate and about 2 cm. long in anthesis; petal 1, elliptic, about 4 cm. long and 13 mm. wide, thin, erose- undulate margined, glabrous, short-clawed; ovary lightly pubescent on margins, the style glabrous; legume oblong, 15 cm. long and 5 cm. wide, glabrous, the valves twisting in age; seed oblong, 2 cm. long, flattened, rugose.
