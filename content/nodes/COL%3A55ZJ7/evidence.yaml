      lifeHistory:
        status: not-assessed
      ecology:
        status: partially-supported
        claims:
          - text: Thalassodendron leptocaule occurs from the intertidal area to the subtidal fringe, usually in rocky pools, in crevices and creeks, and on calcareous sandstone, and is exposed to severe wave action. The species occurs in habitats that are permanently submerged or partially exposed at low water to ordinary spring tides and water temperature in the distribution area ranges between ca. 27°C (at Maputo latitude) and 26°C in the south (at Richards Bay latitude) during the warmest month (February).
