    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, 120-200 mm tall. Leaves nearly linear, cobwebby at base, pleated, loosely twisted, margins undulate, sparsely hairy. Flowers 5-10 in a dense, suberect spike, bilabiate, mauve marked with violet and cream, rose-scented, perianth tube 10-12 mm long, dorsal tepal 18-25 mm long, ovary smooth, bracts smooth, inner forked in upper third. July-mid Sept.
            textZh: Babiana fimbriata (Klatt) Baker 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_14562_0
            locator: "SANBI/WFO archive Morphology row 33058; source identifier 14562.0; cited publication: Goldblatt, P; Manning, JC. 2013. Iridaceae. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 94 - 124. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Distinguished by the hairless or nearly hairless stem and the woolly or cobwebby cataphylls and bases of the leaf sheaths, Babiana fimbriata has leaves 3-4 mm wide with the blades slightly twisted. The dark purple to almost brown flowers have greenish yellow lower lateral tepals with prominent auriculate lobes at the limb bases. The upper lateral tepals of B. fimbriata are directed forward or are slightly curved inward in the proximal half, a feature unique in the genus. Babiana spiralis, which has been confused with B. fimbriata, has smooth cataphylls and leaf sheaths, a velvety stem, and bright pink or blue flowers, also with auriculate lobes on the lower tepal limbs. The upper lateral tepals of B. spiralis curve outward shortly above the base in conventional subpatent orientation.
            textZh: SANBI 条目提供了 Babiana fimbriata (Klatt) Baker 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 94942; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
