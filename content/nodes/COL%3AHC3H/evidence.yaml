      lifeHistory:
        status: partially-supported
        claims:
          - text: "A controlled study of 15 Aspergillus fumigatus isolates found heterogeneous light responses in culture: most isolates showed light-associated hyphal pigmentation or conidiation, while at least one tested isolate showed no overt response. The outcomes varied among strain backgrounds and are limited to the reported culture conditions."
            locator: Abstract; Results, photopigmentation and photoconidiation sections; Fig. 1 and Figs. S1–S2; strain list in Table S1.
            placeTimeScope: Laboratory cultures incubated on GMM or RPMI 1640 under constant darkness or white light, with reported assays at 37°C for 48 hours or three days. Field location and collection dates for all isolates are not established by these experiment locators.
            lifeStatus: The article tested laboratory cultures from a mix of commonly used laboratory, clinical, and environmental isolates; no field community was observed in these experiments.
            sourceIds:
              - fuller2016
            originalLanguage: en
        gaps:
          - The culture assays establish strain-dependent responses under specified laboratory conditions, not a uniform response or phenotype frequency in natural populations.
