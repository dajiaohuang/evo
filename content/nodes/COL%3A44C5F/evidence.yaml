    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants 50-70 mm high, acaulescent. Corm ± globose, 10-15 mm diam.; tunics of pale straw-coloured, coarsely netted fibres with heavily thickened vertical ridges. Stem subterranean, bearing a single rhipidium. Leaves mostly 3 (including leaf-like outer spathe), ascending to spreading, loosely twisted below, often tightly so distally, channelled, grey-green, smooth, 40-80 mm long, margins thickened, undulate to crisped, usually minutely papillate, rarely ciliate. Rhipidia solitary, mostly 2(-4)-flowered; spathes smooth, inner 35-40 mm long. Flowers yellow or inner tepals and style crests pale yellow to white, outer tepal limbs with deeper yellow nectar guides at bases speckled with blue or black dots, spreading at ± 45°, inner tepal claws sometimes blue-grey and limbs often remaining suberect, scented of vanilla; outer tepals lanceolate, 18-28 x 6-8 mm, claws ascending, 9-11 mm long, channelled, shortly hairy in midline, inner tepals 18-28 mm long. Filaments 5-8 mm long, united for 1.5-2.0 mm, diverging distally; anthers 4.5-5.5 mm long, reaching to base of stigma lobes, pale blue; pollen white. Ovary elongate, fertile part oblong-cylindric, 5.0-7.5 mm long, partly included or exserted; style branches diverging, 7-10 mm long, crests erect, linear to narrowly wedge-shaped, 7-10 mm long. Capsules ovoid, 8-12(-15) mm long, retracted to ± base of spathes, near ground level. Seeds straw-coloured, angular-prismatic.
            textZh: Moraea flava Goldblatt & J.C.Manning 的 SANBI 物种条目记载了植株、叶片和花部形态。
            sourceIds:
              - sanbi_18638_0
            locator: Strelitzia 42; archive Morphology row 97802, source 18638.0
            placeTimeScope: Regional species account published 2020; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
          - text: Distinguished from M. ciliata by its consistently relatively low stature, seldom exceeding 65 mm, smooth, twisted leaves with crisped and thickened margins minutely papillate to ciliate, and moderately sized yellow or yellow and white perianth, the outer tepals 18-28 mm long with shorter claws 9-11 mm long. The relatively short capsules, 8-12 mm long contain small, angular seeds. The leaves are typically hairless with only the leaf margins sometimes minutely papillate to ciliate. The species is sympatric with M. ciliata in the southern Roggeveld and Klein Roggeveld where M. ciliata has larger (elsewhere the flowers may be smaller), consistently blue flowers, the outer tepals 28-32 mm long with claws 15-16 mm long, inner tepals 24-26 mm long, filaments 8-9 mm long, united for ± 1 mm, anthers 5-7 mm long and style branches ± 12 mm long with crests 11-12 mm long. Although usually a taller plant, typically with straight to undulate leaf margins, M. ciliata in the Roggeveld is occasionally only 50 mm high (most likely the result of a poor season) and may have crisped leaf margins, thus approaching M. flava in appearance, but the leaves are usually pubescent with the margins always ciliate, with hairs at least 0.5 mm long.
