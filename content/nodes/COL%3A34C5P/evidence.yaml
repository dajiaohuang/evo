        usage:
          title: Davilla aspera (Aubl.) Benoist, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Liana or small tree. Leaves with the blade elliptic to circular, the apex shortly acuminate to obtuse, the base obtuse to truncate, the margins subentire to serrulate, frequently somewhat revolute, 6-22 cm long, 4-11 cm wide, chartaceous to sub- coriaceous, scabrous above with simple hairs incrusted with silica, softly pubescent beneath with simple hairs, the secondary veins 14-29; petioles 10-30 mm long, narrowly alate. Flowers 8-15 mm broad, pedicellate; sepals broadly ovate to cir- cular, the inner 2 concave, to 8 mm long and wide, the outer 1-3 mm long and wide, scabrous, pubescent with simple hairs; petals 4-6, yellow, obovate, 4-9 mm long, 2-5 mm wide; stamens 55-85, the filaments 3-4 mm long, the thecae ca 0.5 mm long, almost parallel; carpels 1, glabrous, the style 3 mm long, the stigma peltate. Fruit indehiscent to irregularly dehiscent, glabrous, to 6 mm in diam, the persistent style to 4 mm long.
          originalLanguage: en
          sourceField: general
