        usage:
          title: Souroubea gilgii V.A.Richt., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Climbing epiphytic shrub or liana. Leaves large, chartaceous, short-petiolate or subsessile, the petiole 2-5 mm long and 2-3 mm wide, flattened or canaliculate above; blade obovate-oblong, 2-2.5 times as long as wide, 1 1-17 cm long and 4.5 -7.5 cm wide, often conspicuously asymmetric, acute to obtuse apically, the base cuneate and often slightly rounded at the petiole; the midrib sulcate to prominent above, prominent beneath, the lateral veins prominent or slightly prominent be- neath; hypophyllous glands small or minute, mostly numerous and in (1-) 2 (-3) often inconspicuous and irregular rows at varying distances from the margin, mostly a row 5-8(-12) mm from the margin and a row of more numerous and smaller glands 0.5-2 (-3) mm from the margin. Inflorescences dense, multi- florous racemes, the rachis 10-20 cm long, puberulent; nectaries tubular, 7-15 cm long, 1-2 mm in diameter, the opening with a short auriculate rim, the auricles to 5 mm long and 2 mm wide, the apex subglobose. Flowers small, the pedicels 10-18 mm long, ca. 1 mm in diameter; bracteoles ovate-suborbicular, 2-3 mm long and 2-3 mm wide; sepals broadly suborbicular, 2-4 mm long and 3.5-5 mm wide; corolla gamopetalous, ca. 8 mm long, the tube ca. 4 mm long and ca. 4 mm in diameter, the lobes in bud ca. 3 mm long, at anthesis the tube ruptured and the lobes ca. 5 mm long, reflexed; stamens 5, the filaments flattened, ca. 5 mm long, ca. 2 mm wide basally, narrowed apically, the anthers ovate-subglobose, 1-1.5 mm long; ovary ovate, 5-ribbed, ca. 2.5 mm long, 5- loculed, the stigma large, radially 5-lobed. Fruit not seen.
          originalLanguage: en
          sourceField: general
