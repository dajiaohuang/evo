    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Peduncles 25-60 mm long, fairly stout, bearing 1-2(3) umbels of 8-24 flowers; pedicels 10-11 mm long. Sepals subulate-lanceolate, 2-3 mm long. Corolla 14-16 mm long; tube 7-8 mm long, slightly globose-inflated at base, whitish to pale yellow to brown; lobes spreading-erect, united at tips. Corona with 5 small pockets spreading ±3 mm and ±1 mm wide, subtruncate or notched at apex, inner lobes linear-subulate, incum-bent on backs of anthers and nearly as long.
