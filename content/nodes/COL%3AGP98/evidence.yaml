        claims:
          - text: Annual, tufted (erect), up to 0.9 m high, scabrid, occasionally smooth. Leaf blades up to 200 mm long, up to 4 mm wide. Spikelets 35-50 mm long (including awns), coarse; lower glume usually slightly longer than upper glume, awn 0.8-3.5 mm long; lemma linear, laterally compressed, articulation absent; column absent; awns 3, laterals well developed; callus tip naked, broad, swollen, rounded.
