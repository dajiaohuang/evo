    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Perennial herbs with branched rhizomes; stems short with leaves crowded into rosettes; flowering branches almost naked, erect or ascending, up to 18 cm high, or stems more or less elongate and sprawling with leaves scattered in the lower half but smaller and more distant in the upper half, and then the stems terminating in an inflorescence. Leaves up to 4 cm long and 1.5 cm broad, elongate-obovate or more or less spathulate, rounded, cauline leaves smaller, obovate, rounded. Inflorescence of 1-several, few-flowered cymes; peduncle up to 15 cm tall, with a few pairs of small, obovate leaves, bracts obovate to linear, more or less spurred at the base (when dry), the lower ones somewhat fleshy. Calyx of 5 segments, each 4.5-7 mm long, 1.25-3 mm broad, linear-oblong to oblanceolate-oblong or obovate-oblong, acute or rounded, mucronate, the sides softly membranous, joined for 0.75-1 mm, with a thick keel or narrow, thick wing. Corolla yellow or white (fide Galpin); tube 6-7 mm long; lobes 5.5-7 mm long, 2.25-4 mm broad, obovate-elliptic to obovate, usually rounded at the apex, clawed. Filaments 0.25-1 mm long, inserted just below the corolla-sinuses rarely in the sinuses; anthers 1.5-2 mm long, each with a dark reddish-brown to almost black (when dry) oblong or orbicular-oblong apical gland 0.6-0.75 mm long, and two small red basal gland-dots. Style and stigma 3.5-5 mm long, with a small stigmatic swelling below the middle or near the base; stigma small, capitate, 2-lobed.
