    facets:
      morphology:
        status: partially-supported
        claims:
          - text: The 2003 Flora of North America account describes Pinus ponderosa seed cones as 5–15 cm long, symmetric to slightly asymmetric, conic-ovoid before opening and broadly ovoid when open; the apophyses are thickened, variably raised and transversely keeled.
            originalLanguage: en
            sourceIds:
