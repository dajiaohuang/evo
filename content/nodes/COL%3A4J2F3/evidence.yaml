            placeTimeScope: North American Flora of North America account cited as 2003; no dated population sampling frame, named sampling locality, or frequency estimate is supplied for this structural description. Cone sizes and shapes are account-level descriptors, not population means.
            lifeStatus: The account describes taxonomic structures but does not identify a sampled population or state whether the described material was wild or cultivated; neither status is inferred.
