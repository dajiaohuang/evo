        usage:
          title: Ruellia geminiflora Kunth, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Ascending herbs to ca. 30 cm high; stems quadrangular, sparingly to densely pilose. Leaves ovate to ovate elliptic, 2-5 cm long, 0.8-1.8 cm wide, apically acute, basally attenuate, the cystoliths densely distributed over the upper sur- face, glabrous to puberulous above, glabrous to densely puberulous beneath, the margins entire to crenulate; mostly sessile; pedicels axillary borne singly and in pairs, ca. 1.0 mm long. Flowers with the calyx lobes equal, subulate, to 8 mm long, ca. 0.8 mm wide at the base, mostly pilose to densely pilose; corolla mauve, funnelform, tube 25 mm long, 2 mm wide at the base, 8 mm wide at the mouth, puberulous outside, glabrous inside, the limb ca. 25 mm across, the lobes equal, suborbicular, ca. 10 mm in diameter, puberulous on both the surfaces; stamens included, the filaments glabrous; ovary and style puberulous. Capsule clavate, ca. 8 mm long, 3.5 mm wide and 2 mm thick, puberulous; seeds 4, orbic- ular, flattened, ca. 3 mm across.
