        claims:
          - text: Succulent, perennial herb. Stem up to 0.25 m high, erect or eventually sprawling, covered with leaves for whole length, proliferating from around base. Leaves in 5 straight rows, rarely imbricate, dark green, hard, smooth in texture, apex with sharp points, margins and keel with cartilaginous edge. Inflorescence lax, erect. Flowers green with creamy tinge. Flowering time all year, with peaks in Jan. and Sept.
