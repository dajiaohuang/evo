        claims:
          - text: Mat-forming subshrub, stock woody, up to 10 mm diam., main branches up to 300 mm long, many, prostrate, radiating from the crown, branching and giving rise to numerous very short (up to 5 mm) erect flowering branchlets, very closely felted, densely leafy, the whole forming a flowery mat. Leaves 3-8 x 0.5(-1.75) mm, not diminishing in size upwards, imbricate, linear, acute, base broad, half-clasping, margins generally revolute, both surfaces closely enveloped in closely woven, silky grey tissue-paper-like indumentum, glandular as well, rarely woolly. Heads heterogamous, narrowly campanulate, ±6 x 4 mm, sessile, solitary at the tips of the branchlets, these racemosely arranged. Involucral bracts in ±6 series, graded, loosely imbricate, inner exceeding flowers, all radiating, semi-pellucid, glossy, outer white, inner rose-red, tips more or less opaque, subacute, mostly white. Receptacle shortly honeycombed. Flowers 19-31, 3-10 female, 12-25 homogamous, yellow, tipped pink. Achenes not seen, ovaries with myxogenic duplex hairs. Pappus bristles many, equalling corolla, scabridulous, bases cohering strongly by patent cilia. Flowering between June and November, mainly August and September.
