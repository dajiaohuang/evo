    facets:
      morphology:
        status: partially-supported
        claims:
          - text: "Well-branched shrub up to c. 500 mm tall, young parts of branches thickly clad in glistening glands, minute glandular hairs as well towards tips of twigs, leafy. Leaves opposite, alternate upwards, pseudofasciculate, largest primary leaves c. 7-20 x 2-7 mm, elliptic in outline, apex acute, base tapering, distinctly petiolar in larger leaves, sharply toothed or lobed (usually 4 pairs, sometimes more) in upper half ± 1/2 way or less to midrib, lower surface thickly clad in glistening glands, upper surface similar or glands few or wanting. Flowers borne singly in the axils of the primary leaves towards the tips of all the twiglets. Pedicels up to 6-11 mm long, clad in glistening glands and glandular hairs less than ±0.1 mm. Calyx tube c. 0.15 mm long, lobes 2.6-3.4 x 0.6-0.7 mm, oblong, acute, glistening glands all over, glandular hairs as well less than ±0.1 mm. Corolla tube c. 7-8 x 1.8-2 mm in throat, cylindric, abruptly expanded near apex, limb c. 7-8 mm across lateral lobes, posticous lobes 34 x 1.8-2 mm, anticous lobe 34 x 1.8-2 mm, all lobes ± oblong, tips rounded, glandular-puberulous outside, hairs up to 0.1-0.15 mm long, glistening glands as well, transverse band of clavate hairs in throat, lobes pale yellow to cream. Stamens: posticous filaments c. 1 mm long, anthers 0.7-1 mm, anticous filaments c. 0.5 mm long, anthers 0.4-0.5 mm, all filaments minutely puberulous. Stigma 0.2 mm long. Style 4.5-5 mm. Ovary 2 x 1 mm. Capsules c. 5-5.5 x 2.5 mm, thickly clad in glistening glands all over. Seeds c. 1 x 0.4 mm. Drège first collected it there in 1829, in October, Long in August 1932, Johnson in September 1953, then Nordenstam found it in 1962, in June; in those months the plants were in flower and fruit."
            sourceIds:
