    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Stemless, cormous geophyte, up to 80 mm tall. Leaves linear to narrowly sword-shaped, spirally twisted or loosely coiled, hairy, the midrib and margins thickened, not evidently pleated, exceeding the flowers. Flowers 1-3 in a dense spike, bilabiate, white to pale mauve, sweetly scented, perianth tube 25-28 mm long, dorsal tepal 30-40 mm long, ovary smooth, bracts green with brown tips, smooth, inner forked apically.
            textZh: Babiana namaquensis Baker 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_14562_0
            locator: "SANBI/WFO archive Morphology row 33050; source identifier 14562.0; cited publication: Goldblatt, P; Manning, JC. 2013. Iridaceae. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 94 - 124. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Although surprisingly common in the Richtersveld, Babiana namaquensis is seldom seen for it flowers early in the season, mostly in June or July, when little plant exploration is undertaken. Leaf morphology of B. namaquensis is unusually variable. Younger plants produce narrow leaves, twisted or coiled above, while mature plants have narrowly lanceolate leaves loosely twisted distally. The leaf morphology recalls that of B. torta, a similarly acaulescent species of central and southern Namaqualand that also has coiled to twisted leaves. In B. torta the leaves are usually densely hairy, while the slate-blue or rarely white flowers have a perianth tube 20-22 mm long, and the bracts are prominently veined and silky hairy or rarely sparsely velvety. In contrast, B. namaquensis has sparsely hairy to smooth leaves, consistently smooth bracts, and a pale mauve to white perianth with a tube 25-28 mm long. Babiana torta appears to be confined to granitic substrates, mostly growing in cracks in granite outcrops, and it flowers mainly in May or early June, whereas B. namaquensis favours limestone substrates and flowers somewhat later, in late June or July.
            textZh: SANBI 条目提供了 Babiana namaquensis Baker 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 94911; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
