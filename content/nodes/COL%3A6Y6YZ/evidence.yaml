    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants 50-200 mm tall; leaves 7-14 with about 2h in a basal cluster, linear to narrowly oblanceolate, semi-erect, acute, 30-60 mm long, rest scattered on the stem and grading into the bracts. Inflorescences dense, cylindrical-oblong, to 40 mm long; bracts as long as the 4 mm long ovaries. Flowers 2-3 mm in diameter, sepals and petals white and lip yellow. Sepals subequal, 4-5 mm long; median broadly elliptic, galeate; laterals suboblique, narrowly ovate to ovate, obtuse to acute. Petals ovate, acute, 2 mm long. Lip 3.5-5 mm long, disc without calli; midlobe 1.5 mm long, acute; side lobes 0.8 mm long, acute; spur obtuse, c. 1 mm long.
