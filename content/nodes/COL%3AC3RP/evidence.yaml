        claims:
          - text: Plants acaulescent or with a stem up to 20 cm, sometimes solitary, usually in small groups. Leaves about 20, rosulate, narrowly lanceolate-attenuate, rather fleshy, about 40 cm long, 8-10 cm broad, erectly spreading and recurved in upper quarter; upper surface flat low down, slightly canaliculate towards apex, pale dull green, obscurely lineate and obscurely spotted throughout, the large dull white oval spots confluent and more or less arranged in a series of undulating interrupted transverse bands; lower surface convex, duller green, obscurely lineate, usually without spots; margins sinuate-dentate armed with deltoid pungent slightly deflexed teeth which are about 3-4 mm long, 10-15 mm distant. (The leaf sap dries purplish.) Inflorescence up to 2 met. high, usually branched above the middle, with about 8 arcuate-erect branches, the 1-3 lowest with 1-3 branchlets forming a rather compact panicle of about 12 racemes. Peduncle slightly flattened and about 3-4 cm diam. low down, coated with a greyish powdery substance. Racemes narrowly cylindric-acuminate, the terminal the highest and up to 40 cm long, 6-7 cm diam., rather laxly 40-50-flowered, the lateral shorter and fewer flowered. Pedicels the lowest of terminal racemes 6-9 mm, long. Bracts narrowly lanceolate-acuminate, sub-scarious, many-nerved, usually a little longer than their pedicels. Perianth pale dull brick-red, somewhat pruinose, 30 mm long, with a sub-globose basal swelling 9 mm diam., constricted above the ovary to 5.5 mm diam., thence decurved and enlarging towards the throat, the mouth wide open; outer segments free for 8 mm, very obscurely nerved, with a dull white 1 mm broad marginal border, and sub-acute spreading apices; inner segments broader than the outer and with broader white borders, the apices more obtuse and more spreading. Filaments pale lemon, filiform-flattened, the 3 inner narrower and lengthening in advance of the 3 outer, with their anthers in turn exserted 1-2 mm Stigma at length exserted 1-2 mm. Ovary light green, 8 mm long, 3 mm diam., finely 6-grooved, slightly tapering to the style.
