    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Bulbous plant with a cylindric basal butt about 7.5 mm in diameter. Roots few, fleshy, 5-6 mm thick, tapering. Bulb with few truncate membranous scales covering the inner comparatively loosely packed fleshy leaf-bases, ovoid-oblong, 3.5 cm tall, 2 cm broad, without any pronounced neck. Leaves up to 10, lengthening to about 15 cm long, 1-2 mm broad, linear, canaliculate at the base, becoming somewhat flattened towards the apex, usually once or twice twisted, with decurved hair-tipped teeth on the margin and back towards the base and on the margin above. Peduncle slender, up to 45 cm in total length with about 7-10 sterile bracts. Bracts mainly ovate-lanceolate, about 5 mm long. Raceme 5-20-flowered, 5-15 cm long, moderately dense; pedicels 3-4 mm long. Perianth 1.5 cm long, bilabiate; tube short; the segments linear-oblong with the outer ones 1.5 mm broad and with the inner ones 2 mm broad, united at the base only but cohering and tubular to about half their length, spreading above; the abaxial outer segment and the adaxial inner segment recurved. Filaments about 5 mm long attached at the base of the ovary. Ovary 2.5-3 mm long, obtusely triquetrous, obtuse and distinctly contracted into the style; style 1-5 mm long with an obliquely capitate stigma.
