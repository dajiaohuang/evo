  claims:
    - subjectId: taxon:teleoceras
      claimKind: scientific
      claimType: ecology
      statement: "Teleoceras ecology is locality- and species-dependent: Florida isotope data favor principally terrestrial populations, whereas the 11.86 Ma Ashfall T. major sample shows limited mobility and supports wet-habitat or semi-aquatic interpretation."
      confidence: contested
      confidenceRationale: Independent primary studies produce a genuine regional contrast. Contested confidence records that contrast and avoids choosing genus-wide behavior from barrel-shaped proportions alone.
      referenceLinks:
        - referenceId: macfadden-1998-teleoceras
          relation: supports
          pages: 274–286
          figure: Figures 1–5; Tables 1–3
          quoteLocator: Florida enamel-isotope results and discussion of principally terrestrial Teleoceras populations
        - referenceId: ward-2025-teleoceras
          relation: supports
          pages: 1–10
          figure: Figures 1–6; Supplementary Data
          quoteLocator: Abstract; Teleoceras major morphology and 12.5–10 Ma regional context; 13-adult isotope sample and limited-mobility results
    - subjectId: taxon:teleoceras
      claimKind: scientific
      claimType: taxonomy
      statement: Teleoceras is treated as a North American rhinocerotid genus, while the strongest Ashfall conclusions are restricted to T. major.
      confidence: medium
      confidenceRationale: The primary Florida and Ashfall studies identify genus and species samples explicitly.
      referenceLinks:
        - referenceId: macfadden-1998-teleoceras
          relation: supports
          pages: 274–286
          figure: Figures 1–5; Tables 1–3
          quoteLocator: Florida enamel-isotope results and discussion of principally terrestrial Teleoceras populations
        - referenceId: ward-2025-teleoceras
          relation: supports
          pages: 1–10
          figure: Figures 1–6; Supplementary Data
          quoteLocator: Abstract; Teleoceras major morphology and 12.5–10 Ma regional context; 13-adult isotope sample and limited-mobility results
    - subjectId: taxon:teleoceras
      claimKind: scientific
      claimType: fossil-range
      statement: The atlas displays a 12.5–10 Ma North American Clarendonian occurrence envelope for Teleoceras major, including the 11.86 ± 0.13 Ma Ashfall sample, rather than a global genus range.
      confidence: medium
      confidenceRationale: The primary study directly states the regional species interval and sampled-site age, while the geographic and taxonomic qualifiers prevent genus-wide extrapolation.
      referenceLinks:
        - referenceId: ward-2025-teleoceras
          relation: supports
          pages: 1–10
          figure: Figures 1–6; Supplementary Data
          quoteLocator: Abstract; Teleoceras major morphology and 12.5–10 Ma regional context; 13-adult isotope sample and limited-mobility results
    - subjectId: taxon:teleoceras
      claimKind: scientific
      claimType: morphology
      statement: Teleoceras is characterized by shortened limb and foot bones and hypsodont molars; the Ashfall T. major sample is short-legged and barrel-bodied, while a universal small nasal horn is not asserted.
      confidence: medium
      confidenceRationale: The cited primary study states these genus and sample characters; unsupported horn generalization was removed.
      referenceLinks:
        - referenceId: ward-2025-teleoceras
          relation: supports
          pages: 1–10
          figure: Figures 1–6; Supplementary Data
          quoteLocator: Abstract; Teleoceras major morphology and 12.5–10 Ma regional context; 13-adult isotope sample and limited-mobility results
    - subjectId: taxon:teleoceras
      claimKind: scientific
      claimType: biogeography
      statement: The evidence profile represents North American Florida and Nebraska study populations rather than a complete occurrence map for Teleoceras.
      confidence: medium
      confidenceRationale: The two isotope studies directly establish those localities and the intentionally bounded scope.
      referenceLinks:
        - referenceId: macfadden-1998-teleoceras
          relation: supports
          pages: 274–286
          figure: Figures 1–5; Tables 1–3
          quoteLocator: Florida enamel-isotope results and discussion of principally terrestrial Teleoceras populations
        - referenceId: ward-2025-teleoceras
          relation: supports
          pages: 1–10
          figure: Figures 1–6; Supplementary Data
          quoteLocator: Abstract; Teleoceras major morphology and 12.5–10 Ma regional context; 13-adult isotope sample and limited-mobility results
  claim-rationales.zh:
    - 独立主研究产生了真实的区域差异。争议置信度记录这种差异，并避免仅凭桶状体形为整个属选择一种生态。
    - 分类主张以所引主研究或系统综述中的明确分类与样本为界，不把导航父级写成直接祖先。
    - 主研究直接给出区域物种区间与采样地点年龄；地域和分类限定避免外推为全球属级范围。
    - 形态主张只保留引文图表或诊断直接支持的骨骼、牙齿性状，并把软组织、姿势或功能解释明确标为推断。
    - 生物地理主张按论文实际覆盖的地点和区域表述，不把区域样本扩写为完整全球分布。
  claim-statements.zh:
    - 短腿犀的生态随地点和物种而异：佛罗里达同位素数据倾向于主要陆生，而距今 1186 万年的 Ashfall 大短腿犀样本显示活动范围有限，并支持湿地或半水生解释。
    - 短腿犀属按所引系统研究采用当前分类层级；导航父级仅表示分类关联，不表示直接祖先。
    - 短腿犀属的形态档案仅记录所引研究直接描述或测量的牙齿、颅骨或肢骨性状，功能解释另行标注。
    - 短腿犀属的地理档案只覆盖所引研究明确讨论的区域与地点，并非完整的全球产出分布。
    - 图集显示北美 Clarendonian 阶段 12.5–10 Ma 的 Teleoceras major 区域记录包络，其中包含 11.86 ± 0.13 Ma 的 Ashfall 样本，而非该属的全球范围。
