    - entityId: teleoceras
      rangeKind: global-composite
      taxonomicConcept: Teleoceras major North American Clarendonian occurrence envelope
      geographicScope: North America, including Ashfall Fossil Beds
      olderMa: 12.5
      youngerMa: 10
      status: available
      uncertainty:
        olderMa: null
