        note: This is a regional species envelope; the Ashfall site itself is dated to 11.86 ± 0.13 Ma.
      evidenceBasis: The primary isotope study places North American Teleoceras major within the Clarendonian at 12.5–10 Ma and directly dates the sampled Ashfall site to 11.86 ± 0.13 Ma.
      confidence: medium
      claimIds:
        - claim:taxon:teleoceras:fossil-range
      referenceLocators:
