    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Perennial, sometimes stoloniferous or tufted and rhizomatous, up to 1.4 m high. Rhizomes knotty and unbranched. Leaf blades 50-400 mm long, 2-14 mm wide. Culms simple or branched, basal leaf sheaths silky and hairy. Spikelets 2.2-4.0 mm long, 1 mm wide. Racemes 3-15, digitate, 50-200 mm long; lower glume a membranous scale, ovate to acute; upper glume a third to two-thirds as long as spikelet; lower lemma as long as spikelet; upper glume and lower lemma covered with hairs 1 mm long, purple and silvery.
            textZh: Digitaria eriantha Steud. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_11118_0
            locator: "SANBI/WFO archive Morphology row 1681; source identifier 11118.0; cited publication: Herman, PPJ; Retief, E. 1997. Plants of the northern provinces of South Africa: Keys and diagnostic characters. Strelitzia 6: 1 - 681. National Botanical Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: A very variable grass with many forms; very closely related to and intergrading with D. natalensis, D. milanjiana and D. seriata and specimens lacking subterranean parts are often difficult to place.
