    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte to 4 cm, tunics woody, concentric, stem unbranched. Leaves thick, leathery, linear-falcate, to 1 mm wide. Flowers 1 or 2 per spike, white, outer tepals red outside, ± 6 x 2 mm, stamens symmetrical, erect.
            textZh: Geissorhiza lapidosa Goldblatt & J.C.Manning 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 6835; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: "Distinguished by its small size and underground stem, Geissorhiza lapidosa has a corm with concentric tunics and smooth, ± plane, falcate leaves. It differs from other dwarf species of subg. Weihea in its high mountain habitat and unusual leathery, falcate leaves at most 1 mm wide. The short-tubed, white flowers have an unusually short style dividing opposite the lower half of the anthers. Similar flowers are found in G. nana and G. setacea, both lowland species: G. nana occurs in renosterveld vegetation in the Overberg between Caledon and Swellendam and has broader, thin-textured leaves up to 2 mm wide and even smaller flowers with the tepals mostly 3-6 mm long, and very short filaments ± 2 mm long; G. setacea grows in seasonally wet places on flat sandy or loamy ground in Western Cape between Gouda and Caledon and has similarly narrow but linear leaves, 0.5-1(-2) mm wide but larger flowers with tepals 6-8 mm long, a longer tube ± 6 mm long, and the style branching opposite the tips of the anthers."
            textZh: SANBI 条目提供了 Geissorhiza lapidosa Goldblatt & J.C.Manning 的鉴别特征。
