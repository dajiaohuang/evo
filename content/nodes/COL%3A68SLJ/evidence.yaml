    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Slender terrestrial, (240-)290(-340) mm tall. Leaves cauline, 3(-4), glabrous, spirally arranged, narrowly lanceolate, underside with three obvious veins, 80-110 x 18-24(29) mm. Inflorescence elongate, densely 12-25-flowered. Flowers ±10 mm in horizontal diameter, immaculate (rarely spotted) bluish to lilac to dark lilac. Dorsal sepal 7-9 x 4 mm, broadly elliptic, attenuate, galea apex recurved. Spur 19-23 x 1 mm, mouth narrowing abruptly, straight to very gently upcurved, apex subclavate. Lateral sepals 9-11 x 5-6 mm, narrowly obovate, acuminate. Lip minute, 1 x 0.1 mm, narrowly spathulate from a broad, minutely toothed base, held erect on face of stigma.
            textZh: Brownleea graminicola McMurtry 的 SANBI 物种条目记录了形态特征。
