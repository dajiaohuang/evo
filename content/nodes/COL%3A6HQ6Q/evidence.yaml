        usage:
          title: Faramea ovalis Standl., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Trees 3-13 m tall, the twiglets slender, the nodes well spaced, glabrous. Leaves small, oval, oblong rotund, or lanceolate, 4-9 cm long, 1.2-4.8 cm wide, rounded, obtuse, or cuneate at the apex, abruptly short acuminate, the acumen 0.3-1.0 cm long, cuneate to obtuse at the base, the lateral veins 6-12, widely arcuate, thin coriaceous, concolorous, glabrous, callose marginate; petioles to 1 cm long; stipules hemispherical, 3-9 mm long, the terminal awn longer than the body. Inflorescences to 5 cm long, to 4 cm wide, few flowered, the pedicels umbelliform from the apex of a shorter peduncle. Flowers with the pedicels ca. 1 cm long; calycine cup undulate; corolla purplish or white, tinted pink, the tube ca. 12 mm long, the lobes 4-6 mm long. Fruits not seen.
