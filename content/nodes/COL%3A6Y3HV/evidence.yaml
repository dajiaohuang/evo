        usage:
          title: Sauvagesia erecta L., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Herbs, woody, rarely subshrubs, simple or branched. Leaves with the petioles up to 0.5 cm long; blades oblong-lanceolate, 1.2-6 cm long, 0.3-1.2 cm wide, acute at the apex, cuneate at the base, membranaceous, glabrous, the costa prominent, the lateral veins prominent above, 1-1.5 mm distant, spreading from the costa at a 300 angle; stipules linear-subulate, up to 5.5 mm long, the cilia elongate, up to 6.5 mm long. Inflorescences axillary, the flowers 1-3 per bostryx, the pedicels deflected, slender, up to 2 cm long. Flowers with the sepals lanceolate, 3.8-6 mm long, obtuse at -the apex, clawed at the base; segments of the exterior corona numerous, in 1-3 continuous whorls, rotund- to reniform-capitate, the filaments 1-2 mm long, up to 1/2 the length of the segments of the interior corona, the innermost the longest; segments of the interior corona obovate-oblong, 3-5 mm long, rounded or truncate at the apex, tapering toward the base, the median ridge conspicuous and expanded at the base; anthers oblong or linear-oblong, usually 2-2.5 mm long, up to 4/5 the length of the interior corona; ovary subrotund, up to 1.5 mm long, the style up to 3.5 mm long. Fruits often exceeding the sepals in length, 3.5-7 mm long.
          originalLanguage: en
          sourceField: general
