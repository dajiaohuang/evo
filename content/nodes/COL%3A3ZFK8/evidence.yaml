        claims:
          - text: Perennial up to 550 mm long, culm geniculate. Leaf blade 50-120 x 2.0-4.5 mm; hairy. Inflorescence contracted, hairy; pedicels pubescent. Spikelet 2.3-2.6 mm long, densely hairy; lower glume a tiny scale 0.3-0.4 mm long; upper glume awn 0.7 mm long; lower lemma awn ± 2.2 mm long, lower palea keels ciliate; upper lemma distinctly longer than palea.
