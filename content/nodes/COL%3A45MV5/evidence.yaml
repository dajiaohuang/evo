    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Like N. strictum but leaves usually reclining, petiole twice as long as blade, rachis refracted, pinnae ascending at obtuse angles to one another, leaflets refracted, flowers cream and fruit with dorsal ribs very prominent.
            sourceIds:
              - sanbi_14096_0
            locator: "SANBI/WFO archive Morphology row 9311; source 14096.0; publication: Magee, AR; Manning, JC; van Wyk, B-E; Tilney, PM. 2012. Apiaceae: Nanobubon Magee. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 329 - 329. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Nanobubon capillaceum differs from N. strictum in the reclining leaves and divaricate to geniculate pinnae with prominently refracted (curved) rachis and ultimate segments. The petals are cream-coloured in N. capillaceum (not yellow as in N. strictum) and the stylopodium dark purple (not greenish yellow). The median and lateral ribs in the fruit are also much more prominently raised than those of N. strictum.
            textZh: SANBI 条目提供了该种的鉴别特征。
