    - subjectId: event:placental-phenomic-kpg-model
      claimKind: scientific
      claimType: divergence-time
      statement: A matrix of 4,541 phenomic characters for 86 living and fossil species, combined with 27 nuclear genes, produced one parsimony tree with post-K–Pg crown-placental diversification and a reconstructed ancestral phenotype; both chronology and phenotype are model outputs rather than observations of an ancestor.
      confidence: medium
      confidenceRationale: The public MorphoBank-backed matrix and annotated images make inputs inspectable, while tree search, fossil ages, ghost lineages and ancestral-state optimization control the resulting dates and reconstruction.
