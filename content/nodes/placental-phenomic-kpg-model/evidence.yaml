          relation: supports
          pages: 662–667
          figure: Figures 1–2; Table 1; Tables S1–S8
          quoteLocator: Phenomic character matrix; Combined analysis; Ancestral phenotype reconstruction
  claim-rationales.zh:
    - 公开的 MorphoBank 矩阵与注释图像使输入可检查；树搜索、化石年代、幽灵谱系和祖先状态优化控制所得日期与复原。
  claim-statements.zh:
    - 一套包含 86 个现生与化石物种、4541 个表型性状的矩阵与 27 个核基因联合，产生一棵将胎盘类冠群辐射置于 K–Pg 之后并复原祖先表型的简约树；年代与表型都属于模型输出，而非对祖先的观察。
