      statement: The Porifera root display uses 551–0 Ma as a sampled navigation envelope from the older bound of the 551–539 Ma Helicolocellus-bearing Dengying interval to living sponges; its crown placement is morphology-matrix dependent and does not establish the phylum's origin.
      confidence: medium
      confidenceRationale: Multiple specimens and the dated formation constrain the sampled occurrence, while the organic-skeleton homology and crown placement depend on character coding and model choice. The endpoint is not generalized to an unsampled global FAD.
      referenceLinks:
        - referenceId: wang-2024-helicolocellus
          relation: supports
          pages: 905–911
          figure: Figures 1–4; Extended Data Figures 1–10
          quoteLocator: Dengying Formation age interval; specimen reconstruction; Bayesian morphology analyses
  claim-rationales.zh:
    - 多件标本及有年代约束的地层限定了采样记录，但有机骨架同源性和冠群位置取决于性状编码与模型，因此不能外推为未采样的全球首现。
  claim-statements.zh:
    - 多孔动物门根节点采用 5.51 亿年前至今的采样导航包络，从含 Helicolocellus 的 5.51–5.39 亿年前灯影组区间上界延伸到现生海绵；其冠群位置依赖形态矩阵，不能确定该门的起源。
