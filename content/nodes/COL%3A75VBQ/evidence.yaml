    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Delicate, cormous geophyte to 15 cm, corm tunics soft, brown. Leaves 5-8, spreading, narrow, keeled, thin-textured. Flowers 2(1), stellate, small, yellow, with pale green beneath, stigma branches slender, swollen at apex, with 3 slender downturned extensions from their base, bracts 2, linear.
            textZh: Pauridia trifurcillata (Nel) Snijman & Kocyan 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13877_0
            locator: "SANBI/WFO archive Morphology row 7540; source identifier 13877.0; cited publication: Snijman, DA. 2012. Hypoxidaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 115 - 119. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: This species is easily distinguished by the flower's unique stigma branches, which are mostly erect, slender and closely cohering. Furthermore, these are stigmatic only at the capitate apex and on the basal extensions from each branch cleft. Elsewhere the branches are smooth. The three basal, papillose lobes, which are grooved adaxially, are prominently outspread to down-turned, giving the style its distinctive three-pronged, fork-like appearance. The species is similar to Pauridia maryae with regard to the soft leaves and smooth, brown, papery basal sheath. Thus in the past, herbarium collections of the two taxa have often been confused with each other. P. maryae flowers later in the year, from late winter until early summer (July to November), and although the stigma branches are narrow like those of P. trifurcillata, these are papillose over their entire length.
            textZh: SANBI 条目提供了 Pauridia trifurcillata (Nel) Snijman & Kocyan 的鉴别特征。
            sourceIds:
              - sanbi_15172_0
            locator: "SANBI/WFO archive Diagnostic row 58358; source identifier 15172.0; cited publication: Snijman, DA. 2014. A taxonomic revision of the genus Pauridia (Hypoxidaceae) in southern Africa. Phytotaxa 182(1): 1 - 114. [All rights reserved]"
