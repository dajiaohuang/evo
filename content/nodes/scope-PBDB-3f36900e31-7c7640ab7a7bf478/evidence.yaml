  claims:
    - subjectId: taxon:gymnophionomorpha
      claimKind: scientific
      claimType: fossil-range
      statement: Funcusvermis gilmorei from the Norian upper Blue Mesa Member is a stem gymnophionomorph in the published analyses, extending the sampled caecilian total-group record to about 221 Ma without dating crown Gymnophiona.
      confidence: medium
      confidenceRationale: Named elements from at least 76 individuals and a U–Pb-bracketed bonebed directly support the occurrence; medium confidence retains isolated-element association and analysis-dependent topology.
      referenceLinks:
        - relation: supports
          referenceId: kligman-2023-funcusvermis
          pages: 102–107
          figure: Figure 1; Extended Data Figures 2–4
          quoteLocator: Systematic palaeontology; phylogenetic results; Methods
  claim-rationales.zh:
    - 该主张绑定具名标本或明确数据集及一手来源定位；置信度仅适用于所述样本、方法与边界，不外推为全球首次出现、直接祖先或完整类群覆盖。
  claim-statements.zh:
    - 诺利期上部蓝梅萨段的 Funcusvermis gilmorei 在已发表分析中属于无足类干群，把已取样的蚓螈总群记录延伸至约 2.21 亿年前，但不为冠群无足目定年。
