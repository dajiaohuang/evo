        claims:
          - text: Like S. capensis but leaves U-shaped in t/s, without a keel, flowers yellow or orange with a dark, non-iridescent centre, ovules and seeds J-shaped.
            textZh: Pauridia canaliculata (Garside) Snijman & Kocyan 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13877_0
            locator: "SANBI/WFO archive Morphology row 7529; source identifier 13877.0; cited publication: Snijman, DA. 2012. Hypoxidaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 115 - 119. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: "Pauridia canaliculata is superficially so like the highly variable P. capensis that the differences between the plants went unnoticed until Garside brought them to the fore. As the name suggests, the outer leaves of P. canaliculata are smoothly canaliculate and without a prominent midrib, thus differing from P. capensis which has carinate leaves characterized by a prominent midrib on the abaxial surface, at least distally. Even though the flowers of P. capensis vary hugely in colour and markings they never approach the diagnostic markings found in P. canaliculata. These form a non-iridescent, glaucous, brownish purple centre against orange or rarely deep yellow tepals. Other features distinguishing P. canaliculata are the uniquely J-shaped seeds and the heavily rugose testa. In contrast, the seeds of all other Pauridia species are ovoid to globose, with the testa ranging from colliculate to tuberculate, studded or rarely covered with blunt trichomes. Discussion: Garside (1942) postulated that the variation in specimens collected by W.F. Purcell on Bergvliet Farm, Cape Peninsula, in 1917 and 1918 reflected hybridization between Pauridia canaliculata and P. capensis. Unfortunately, populations of P. canaliculata on the Cape Peninsula are now believed to be extinct and the putative hybrids in the area have not been seen again. The richly coloured large flowers make P. canaliculata one of the most beautiful species in the genus. Despite its striking appearance the earliest collections of P. canaliculata date back only to 1917, even though botanical exploration of the southwestern Cape commenced as long ago as the seventeenth century."
            textZh: SANBI 条目提供了 Pauridia canaliculata (Garside) Snijman & Kocyan 的鉴别特征。
