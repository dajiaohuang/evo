      statement: New early Eocene material and a broad ceratomorph matrix place several sampled taxa within or near Rhinocerotoidea, while parsimony and Bayesian trees differ at basal nodes; the result does not make any one specimen the group’s ancestor or global first occurrence.
      confidence: medium
      confidenceRationale: Named specimens and matrices directly support the sampled placements; medium confidence reflects the reported criterion-dependent basal topology.
      referenceLinks:
        - relation: supports
          referenceId: bai-2020-ceratomorpha
          pages: Article 509
          figure: Figures 6–8
          quoteLocator: Systematic palaeontology; The phylogenetic analysis
