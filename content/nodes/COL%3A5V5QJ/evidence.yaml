        status: partially-supported
        claims:
          - text: In a controlled tissue assay, heat-shock-element binding activity in Anolis sagrei brain and heart extracts increased after 42°C for 1 hour and was reduced after 3 hours of recovery at 28°C. This molecular response does not establish a whole-animal thermal limit, field heat tolerance, or thermal adaptation.
            sourceIds:
              - takii2017
            locator: Results, HSE-binding activity in lizard tissues; Fig. 4A-B.
            placeTimeScope: "Laboratory assay: 42°C heat shock for 1 hour followed by recovery at 28°C for 3 hours. Methods describe Havana collections from 2009–2011 for RNA work and some females imported from the United States in 2013 for tissue extraction; the article does not link the plotted Fig. 4 tissue cohort to one exact collection subset."
            lifeStatus: Captive-held lizards during heat-shock treatment; not a measurement of free-ranging animals under natural temperatures. The paper does not report a sample size for the plotted tissue assay.
            originalLanguage: en
        gaps:
          - A tissue-level molecular response is not a measured survival threshold, performance curve, or field thermal-tolerance estimate.
          - The article does not link the plotted tissue samples to an exact collection subset or report the sample size for that assay.
          - Morphology, life history, broader ecology, evolution, distribution, fossils, and conservation remain unassessed; systematic search are incomplete.
      evolution:
        status: not-assessed
