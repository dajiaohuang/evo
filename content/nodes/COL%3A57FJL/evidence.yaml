        usage:
          title: Torenia fournieri Linden ex E.Fourn., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Decumbent or erect herb, to 30 cm tall or 60 cm long, freely branching; stem 4-angled and sulcate, often reddish, sparingly ascending pilose with white hairs. Leaves opposite, ovate, to 5 cm long, apically acute, basally obtuse or short cuneate, the margins serrate to crenulate, the venation pinnate with 5-6 arcuate veins on each side, sparingly pubescent on each side; petioles slender, 8-15 mm long. Inflorescences solitary flowers in the leaf axils, sometimes geminate, the pedicels sulcate, glabrate, sometimes broadening upwards, 10-20 mm long, each with a basal bract, sometimes linear, 1-2 mm long, sometimes foliose. Flowers showy, the lower lip 3-lobed, the lateral lobes deep purple, the middle lobe lighter colored with a large yellow eye, rotund, ca. 10 mm wide, sinuate or subentire, the upper (ventral) lip pale, often bluish, 1-lobed, somewhat larger than the lower lip, minutely puberulent outside, bearded in the throat; dorsal filaments arching above the style and ventral anthers, the anthers with the thecae oblong cuneate, ca. 1 mm long, strongly divaricate, subtended by the cuneate connective, the con- nectives coherent in pairs; style straight, the stigmas discoid ovate to deltoid, flattened together, ciliate and dorsally ascending pubescent near the margin, situated slightly above the ventral anthers.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 12847
