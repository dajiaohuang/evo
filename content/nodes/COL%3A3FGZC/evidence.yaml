        claims:
          - text: Cormous geophyte, 20-50 cm, tunics soft, stems often trailing. Leaves trailing. Flowers pink to purple.
            textZh: Geissorhiza outeniquensis Goldblatt 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 6802; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: "Evidently most closely related to Geissorhiza roseoalba, G. outeniquensis has, like that species, a zygomorphic flower with declinate stamens and style. The flowers have a perianth tube 10-13 mm long vs. 8-10 mm in G. roseoalba and it also differs in its riverine habitat, soft-textured corm tunics and four to several, soft-textured, often trailing leaves. Geissorhiza outeniquensis has an unusual caespitose habit: the main plants produce short runners which sprout to form new stems and leaf clusters close to the parent plant. It seems to have lost the deciduous habit of the genus and does not die back and become dormant during the later summer and autumn."
            textZh: SANBI 条目提供了 Geissorhiza outeniquensis Goldblatt 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 94647; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
