    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Annual forming small tufts. Leaves linear, 4-8(-15) cm long, 1-1.5 mm wide, glabrous, sometimes rugulose towards the base, gradually tapering to the weakly curved apex. Peduncles up to 35 cm long, 0.5 mm in diameter, weakly 2-ridged particularly towards the apex, sometimes weakly rugulose on the ridges; spike narrowly ovoid to narrowly ellipsoid, 4.5-6.5 mm long; sterile bracts 4, ovate, 3-4 mm long, 1.7-2.5 mm wide, acute, apiculate, pale brown or yellowish with a darker centre and apex, keeled towards the apex; fertile bracts similar but larger, ±5 mm long, 3 mm. Lateral sepals oblong, strongly keeled, ±5 mm long, 1.2 mm wide, pale brown, keel entire, brown, darker particularly towards the apex, third sepal membranous, forming a hood over the bud; corolla-tube ±2 mm long, lobes oblong, ±2 mm long, 1 mm. Filament ligulate, 0.5 mm long; anthers 0.5 mm long; staminodes much-branched. Style-branches ±1 mm long; stigmas much-branched and lobed. Seeds broadly ellipsoid, ±0.35 mm long, 0.2 mm in diameter, with 14-20 longitudinally ridges.
