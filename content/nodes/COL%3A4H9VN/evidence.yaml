        claims:
          - text: Glandular-hairy annual to 15 cm. Leaves elliptic-oblanceolate, toothed. Flowers in slender racemes on bare peduncles, tube very short, white or cream-coloured.
            sourceIds:
              - sanbi_14441_0
            locator: "SANBI/WFO archive Morphology row 5914; source 14441.0; publication: Manning, JC; Goldblatt, P. 2012. Scrophulariaceae: Phyllopodium Benth. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 750 - 752. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: "Phyllopodium micranthum may at once be distinguished from P. capillare, to which it seems allied, by its different indumentum: the upper part of the stem is clad in small patent glandular hairs to the total or almost total exclusion of retrorse eglandular ones, while the entire stem of P. capillare is clad in this type of hair, more or less masking tiny glandular hairs that may also be present. There are other differences too: in P. micranthum, the lower leaf surface in particular is puberulous while the hairs are confined to the midrib and margins in P. capillare, and the corolla tube of P. micranthum is mostly shorter (1.5-2.5 mm versus 2.5-3.5 mm). Phyllopodium capillare is a plant of the lowlands; P. micranthum is a plant of the inland plateau."
            textZh: SANBI 条目提供了该种的鉴别特征。
