    facets:
      morphology:
        status: partially-supported
        claims:
          - text: "Shrub or small tree up to 5 m high. Branches glabrous, conspicuously lenticillate with slender, sharp spines up to 5 cm long. Leafblade elliptic or ovate, 7-11 cm long, 3.5-5 cm wide, apex acuminate, base cuneate to rounded, margin serrulate or crenate-serrate, midrib and lateral veins sub-prominent above, prominent below, lateral veins 4-8 pairs, curved, glabrous, membranous to sub-coriaceous, dark green and shiny above, duller below; petiole 5-10 mm long, channelled above. Flowers solitary and terminal or lateral on short axillary shoots, scented; pedicels 1.5-2.7 cm long. Calyx globose in bud; sepals 4, joined at base, imbricate, elliptic, 1.5-1.8 mm long, c. 8 mm wide, strongly concave, green dorsally and white ventrally. Petals white, 7-13, spreading, whorled, elliptic to obovate, the outer 3-4 mm long, 1.3-1.7 cm wide, slightly narrowed to a claw, the inner narrower. Stamens: filaments 4-8 mm long; anthers yellow, linear, c. 2 mm long with the connective produced into a triangular or minutely lobed tip or appendage. Ovary broadly obovoid to subglobose, 4.5 mm long, 3.5 mm wide, longitudinally sulcate; style c. 1 cm long; stigma patelliform, lobed at margin. Fruit yellow, globose, c. 5 cm diam., smooth, marked with longitudinal lines, calyx and androecium persistent at base and gynoecium at apex, rind woody, hard, pulp yellow. Seeds numerous, ovoid-flattened, 6 mm long, 3 mm wide, testa shiny, brown."
