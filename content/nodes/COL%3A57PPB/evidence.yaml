    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants succulent up to 50 cm high, in clumps. Roots somewhat fleshy. Rhizome creeping, stout, without fibres. Leaves somewhat distichous, 10-12 per shoot, linear-lanceolate, triquetrous, up to 50 cm long, each face ca. 12 mm broad, tapering gradually to the apex, herbaceous, with a short, soft pubescence. Inflorescence a few-branched raceme or simple, varying in length, up to 150 cm high, glandular pubescent; scape pubescent; bracts small, ovate, acuminate, membranous; pedicels patent, up to 2 cm long, apex recurved in fruit. Flowers with perianth spreading, white, green-keeled, maculate, glandular pubescent on the outside, segments up to 15 mm long; stamens declinate, scabrid; ovary glandular, placed on a disk; ovules 2 in each cell. Capsule rough, glandular, producing lateral horns ca 5 mm long. Seed brownish with a well marked hilum.
