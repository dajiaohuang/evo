        claims:
          - text: "Shrub or dwarf shrub, 0.2-1.0 m. Stems: old stems nude, bark rough, grey, cracked, young stems smooth. Leaves sessile; bifoliolate; leaflets narrowly to widely obovate, 10-30 x 3-15 mm, base obtuse or narrowed, apex acute or obtuse. Stipules narrowly triangular, spinescent. Flowers solitary or 2 together, axillary. Sepals 5, ovate. Petals 5, obovate or broadly obovate, 10-18 x 6-11 mm, apex rounded, emarginate, base with a short claw, dull yellow, yellow or white, red, brownish red or brown marked at base. Flowering time May-Jan. Fruit drooping, subspheroid or oblong, 8-20 x 9-14 mm, 5-lobed, each lobe with a fine central ridge."
            sourceIds:
