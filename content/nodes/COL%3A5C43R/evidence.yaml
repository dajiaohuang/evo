            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Nearly always a tall plant with much attenuate leaves and a long and laxly many-flowered spike. The purple spots on the middle of the tepals are very conspicuous. In spite of some variation in size and shape of the perianth this is a characteristic and easily recognized species. The scent is peculiar, like horse dung, or according to other collectors reminiscent of naphthalene, vanilla, Tonquin-beans, or even a sewage farm. A vegetative shoot is often present contemporaneously with the flowering shoot. It carries two elongate narrowly linear leaves from a common basal sheath, and is clearly homologous to the conspicuous hysteranthous vegetative shoot of W. pusilla.
