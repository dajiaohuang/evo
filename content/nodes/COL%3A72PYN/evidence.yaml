        usage:
          title: Lundia puberula Pittier, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Liana to at least 2.5 cm in diameter; stems with 4 phloem arms in cross sec- tion; the branchlets terete, puberulous, nodes with interpetiolar glandular fields; pseudostipules inconspicuous, blunt. Leaves 3-foliolate or 2-foliolate with a ten- dril or tendril scar; leaflets ovate, long-acuminate, basally truncate to asymmetri- cally cordate, 7.4-9.2 cm long and 4.6-5.7 cm wide, membranaceous, palmately veined at the base, the secondary veins 3-5 on a side, sparsely subpuberulous at least on the main veins above and beneath with a few longer trichomes in the axils of lateral nerves beneath and scattered lepidote scales mostly beneath, the margins strongly ciliate, plate-shaped glands near the midvein beneath, lepidote- glandular basally, drying olive brown to reddish-brown; tendril simple, 5-10 cm long; petiolules 2-2.3 cm long, the petiole 2.4-2.9 cm long, puberulous. Inflores- cence an axillary or terminal panicle, the branches puberulous. Flowers with the calyx in young bud conical-pointed, at length truncate, the tip calypterate and evenly dehiscent, or 2 (-3) -labiate and the tip splitting, 4-6 mm long and 3-4 mm wide, subpuberulous; corolla pale pink or lavender to magenta, tubular- campanulate or infundibuliform, 3.1-5.8 cm long and 0.7-1.5 cm wide at the mouth, the tube 2.5-4.0 cm long, the lobes 0.8-2.1 cm long, densely simple puber- ulous outside, the lobes ciliate-margined, glandular-lepidote and puberulous with simple trichomes inside, the throat glabrous inside or with a few scattered gland- tipped trichomes at and below the level of stamen insertion; stamens didynamous, the anther thecae divaricate, 3-4 mm long, the longer filaments 1.5-2.1 cm long, the shorter pair 1.0-1.3 cm long, the staminode 1-2 mm long, inserted 11-15 mm from the base of corolla tube; pistil 2.9-3.2 cm long, the style somewhat puber- ulous at least toward the apex, the ovary cylindric, 2.5-3.0 mm long and 1 mm wide, strongly appressed puberulous, the ovules 4-seriate in each locule; disc absent. Capsule linear, the valves somewhat compressed, the midvein conspicu- ously raised, the margins raised but rounded, velvety pubescent, drying blackish, 25-45 cm long and 1.5-1.6 cm wide; the seeds thin, bialate, 0.9-1.2 cm long and 3.3-3.5 cm wide, the wings membranaceous, basally brown, dirty-hyaline at the tip, not clearly demarcated from the seed body.
