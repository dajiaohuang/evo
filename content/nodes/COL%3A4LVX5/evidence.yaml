        usage:
          title: Poraqueiba guianensis Aubl., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Trees to 25 m; bark ash gray. Leaves with petioles 1.2-1.5 cm long, canalicu- late, commonly twisted; blades oblong, 15-25 cm long, 6-8 cm wide, thinly coriaceous, lightly sericeous below, becoming glabrate, the apex long attenuate or acuminate, the base acute or rarely obtuse, veins 7-8 pairs, prominent. In- f lorescences paniculate; calyx with obtuse, ovate lobes 1 mm long and broad, pilose; petals ovate to lance-ovate, 3.1-3.4 mm long, 1.1-1.2 mm broad, fleshy, pilose outside, bearing 2 grooves in the upper half and 3 below which are sepa- rated by a strigose or pilose transverse ridge; stamens 2.7-2.8 mm long, the anther sacs noticeably marginal and not confluent; ovary globose, glabrous, 1.2-1.5 mm diam., the style short, 0.2-0.5 mm long. Fruits drupaceous, 2.5 cm long, 1.3-1.6 cm in diam., the mesocarp with oil-bearing cells; seed 1.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 6521
