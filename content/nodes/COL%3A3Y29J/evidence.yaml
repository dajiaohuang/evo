            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: This species is easily distinguished by the prominent, broadly to very broadly ovate scarious apical appendages on the outer, middle and inner involucral bracts. In all other species scarious apical appendages are present only on the innermost involucral bracts. The scarious appendages are often prominently undulate, so that they appear ruffled.
