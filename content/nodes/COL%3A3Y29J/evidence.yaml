        claims:
          - text: Ericoid shrublet to 30 cm. Leaves linear, suberect, 3-5 mm long. Flower heads discoid, obconic, solitary, 5-6 mm long, bracts with prominent scarious margins and tips, apically recurved, florets ± 16 per head, yellowish.
            sourceIds:
