          - text: Slender, grass-like, tuberous geophyte to 50 cm. Leaves dry at flowering, basal, linear. Flowers many in a lax raceme, greenish brown to white, spur to 1 mm long, subconical, lateral sepals elliptic-oblong, 3-6 mm long.
