    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte to 15 cm, neck softly fibrous. Leaves 2-5, suberect, subterete, spongy, shorter than inflorescence. Flowers (1)2, stellate, constricted into a short, solid beak above the ovary, white with maroon beneath, rarely yellow, sweetly scented, bracts 2, spreading, fruit beaked.
            textZh: Pauridia alba (Thunb.) Snijman & Kocyan 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13877_0
            locator: "SANBI/WFO archive Morphology row 7527; source identifier 13877.0; cited publication: Snijman, DA. 2012. Hypoxidaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 115 - 119. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Pauridia alba is most closely related to P. aquatica, a widespread species in the Greater Cape Floristic Region. Shared features are the somewhat spongy-textured, subterete leaves, comprising aerenchymatous mesophyll, and white flowers with a more or less cylindrical ovary. Characteristic of P. alba is a prominent ovary beak which is easily seen in dried specimens as a distinct constriction between the ovary and perigone. Like other autumn flowering species in the Cape, the inflorescence develops in advance of the leaves but coincides with the emergence of several prominent, sheathing cataphylls which form a somewhat loose neck of mostly unbranched, fine, brown fibres. The protologue of Hypoxis dubia, placed into synonymy, clearly states that the scape exceeds the leaves. In contrast, P. aquatica has well-developed leaves when flowering in spring, by which time the cataphylls have withered and a sheathing neck is formed only by the leaf bases, which taper upwards into subterete blades. In P. aquatica the inflorescence invariably remains shorter than the leaves and is mostly more than two-flowered. Moreover, the flowers have a nearly beakless ovary. As the name suggests, most plants of P. alba have white flowers. Nevertheless, several populations of yellow-flowered individuals are known from some areas between Tulbagh and Wellington. Florally these resemble P. umbraticola, from the Olifants River Valley which has distinctive carinate, pale green leaves with translucent veins.
