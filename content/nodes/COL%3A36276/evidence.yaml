    facets:
      morphology:
        status: partially-supported
        claims:
          - text: "Cormous herb, up to 1 m high; plants in large clumps. Leaves with blade up to 650 x 3-6 mm. Flowers: inflorescences pendulous, 2-4 branches with 2-5-flowered; bracts solid dark or red-brown, shoulders broad, 13-20 x 6-12 mm, white or heavily flecked, 5 main veins each side; stigmas 7-12 mm below top of perianth; perianth 19-29 mm long, tube 5-7 mm, segments 13-20 x 5-8 mm, light to dark rose-pink, coral-coloured or red, sometimes purple pink; Nov.-Feb."
            textZh: Dierama dracomontanum Hilliard 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_16273_0
            locator: "SANBI/WFO archive Morphology row 68685; source identifier 16273.0; cited publication: Retief, E; Meyer, NL. 2017. Iridaceae. In: E Retief & NL Meyer (eds), Plants of the Free State: Inventory and identification guide, Strelitzia 38: 934 - 956. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: A clump-forming species with pendulous (or rarely suberect) spikes of moderate-sized, mostly rose-coral-pink flowers with perianth 19-25(-29) mm long, the primary spike with 4 to 7 flowers. Dierama dissimile has the stems solitary or a few in small tufts, narrower leaves mostly 2.0-3.5 mm wide and smaller flowers with perianth 18-22 mm long, and flowers mainly August to October. Dierama floriferum has the clumped habit of D. dracomontanum but mostly smaller flowers with perianth 15.5-20.5 mm long, and 4 to 9 lateral spikes per stem with 4 to 9 flowers each.
            textZh: SANBI 条目提供了 Dierama dracomontanum Hilliard 的鉴别特征。
            sourceIds:
