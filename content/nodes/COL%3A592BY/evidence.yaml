        claims:
          - text: Tufted perennial to 600 mm high. Leaf blade 120-160 x 2.5-3.0 mm, expanded, hairy. Inflorescence 100-160 mm long, contracted. Spikelet 8-10 mm long (excluding awns), usually closely flowered; glumes almost equal, broadly lanceolate, acuminate; lower glume 1-nerved, glabrous, minutely scaberulous along the nerve; upper glume as long as spikelet, 3-nerved; rachilla internode 1.25 mm long, with hairs 3 mm long; lemma lanceolate, scabrid and with papillae; anther 1.3-2.5 mm long.
