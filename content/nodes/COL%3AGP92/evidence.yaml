    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Perennial, occasionally shortly rhizomatous and tufted (erect), up to 500 mm tall (usually shorter). Leaf blades up to 200 mm long, up to 1 mm wide. Basal leaf sheaths persistent, breaking up into fibres and forming a dense tuft at base of culms. Spikelets 10-12 mm long (including awns). Inflorescence contracted, branches erect or spreading less than 45° from main axis; spikelets brownish purple to deep purple; lower glume up to two-thirds the length of the upper, awned; lemma articulation absent; column absent, sometimes with a short beak; awns 3, subequal; callus very short, tip naked, large, swollen, rounded.
