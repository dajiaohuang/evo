            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: The broadly obconic corm with dark brown, rugose tunics spiny along the rim of Lapeirousia kamiesmontana are shared with L. dolomitica and L. lewisiana, from which it is distinguished by white flowers with distinctive red markings on the lower tepals, and a perianth tube mostly 45-60 mm long. The earlier-blooming L. lewisiana has dark red-purple to magenta flowers with white markings and a perianth tube (35-)40-48 mm long. The distinctive, somewhat woolly indumentum on the basal leaf is also shared in the genus only with L. lewisiana, but the ranges of the two species do not overlap, and the flowering times, even at the same elevation, are separated by at least two to three weeks in any particular year.
