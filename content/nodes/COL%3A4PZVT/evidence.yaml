    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Shrub, 1-2 m tall. Leaves opposite, in distant pairs or crowded on lateral short shoots, spathulate to narrowly oblong-obovate, base half stem-clasping, apex rounded, obscurely apiculate, margins regularly white-toothed, otherwise glabrous. Flowerheads discoid, terminal, solitary, shortly pedunculate, ± campanulate; involucral bracts leathery-cartilaginous, glabrous, pale golden-yellow to straw-coloured, brownish towards apex, obtuse or rounded apically; disc florets yellow. Cypselas densely short-haired; pappus brownish.
            sourceIds:
              - sanbi_14820_0
            locator: "SANBI/WFO archive Morphology row 34373; source 14820.0; publication: Herman, PPJ. 2013. Asteraceae: Pteronia. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 317 - 321. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: "This striking new species is very distinct, and I am unable to suggest any immediate allies. In the classification of Hutchinson and Phillips (1917) the species would belong to sect. Ciliatae Hutch. & Phill. The key designed by these authors leads to P. adenocarpa Harv., a species of the Upper Karroo, distributed from Worcester to Victoria West and eastwards to Albany. This is a very different species, however, with much larger capitula and glandular, glabrous achenes. The new species may have closer affinities to P. gymnocline DC. and P. lucilioides DC, both of which are known from the Richtersveld. These two species differ from P. elata by their narrower, linear to oblanceolate leaves, which are not obligately opposite, and by the pointed tips of the young involucres. By characters of leaf pubescence these three species belong to three different sections in the essentially artificial scheme proposed by Hutchinson and Phillips. The leaves are glabrous in P. gymnocline (sect. Glabratae), papillate in P. lucilioides (sect. Papillatae), and glabrous with ciliate margins in P. elata (sect. Ciliatae). In the modest vegetation of the desolate mountains near Stinkfontein (now: Ecksteinfontein), the tall and lanky shrubs of P. elata are a quite conspicuous feature."
