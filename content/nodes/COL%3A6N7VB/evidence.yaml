        usage:
          title: Indigofera lespedezioides Kunth, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Perennial herbs or shrubs, stems not much branched, at least above, stiffly erect, appressed strigose, ridged in narrow lines from the nodes when young, later terete, base stout and woody, the whole plant strigose. Leaves ascending, (1-)3-5(-7) foliolate, typically simple below and compound above; leaflets cu- neate at the base, widest toward the tip, mucronate, the largest simple leaflets to 28 mm long, 8 mm wide, other leaflets averaging 20 mm long, 6 mm wide, the smallest 10 mm long, 1.8 mm wide; petiolules to 1 mm long; petioles 1-3 mm long, rachis 3-15 mm long, stipels setaceous, inconspicuous, less than 1 mm long, stipules narrow triangular, acuminate, ca. 3 mm long. Inflorescence of axillary racemes, as long as or longer than the leaves when in full bloom or fruit, the axis to 4 cm long, the nodes 10-30, not all bearing mature flowers or fruits; pedicels single in the axils of narrow triangular caducous bracts, pubescent; bracts to 3 mm long. Flowers with pink or ?yellow corolla, 4-6 mm long, the hypanthium 2-3 mm long including the triangular teeth, campanulate, pubescent, teeth about equal to the cup, the lower longer than the upper; standard circular, ca. 5 mm long, short clawed, the wing petals oblong, ca. 5 mm long, to 1.5 mm wide, the claw about equal to the blade, the keel petals narrowly oblong, ca. 5 mm long, to 1.5 mm wide, the staminal sheath linear; pistil linear, pubescent, the style 2- 3 mm long, the stigma capitate. Fruits reflexed, linear, 12-20 mm long, 1.7-2.0 mm wide, beaked with persistent style base 1 mm long, 2-valved, the valves only slightly twisted on dehiscence, pubescent outside, septate within, 7-10 seeded, the calyx remnants persistent at the base, nonstipitate, fruiting pedicels 1-2 mm long; seeds oblong or subreniform, 1.5 mm long, dull brown, smooth.
          originalLanguage: en
          sourceField: general
