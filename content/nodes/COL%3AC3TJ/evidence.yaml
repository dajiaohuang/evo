          - text: Aloe maculata differs from A. branddraaiensis and A. swynnertonii in having fewer racemes per inflorescence than either of these species. Flowers of A. branddraaiensis are a shade of pale pink not found in A. maculata, whereas those of A. swynnertonii are often bicoloured, an arrangement not found in A. maculata. Flowers of A. swynnertonii are shiny, as if polished to a high gloss; the flowers of A. maculata, while not pruinose, are not as shiny. Characters separating A. mudenensis from A. maculata are discussed under that species.
