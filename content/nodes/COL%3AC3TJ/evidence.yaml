    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants stemless and suckering freely to short-stemmed and solitary, 200-500 mm tall excluding inflorescence. Leaves 12-20, spreading to slightly deflexed, narrowly to broadly lanceolate, 130-500 x 50-120 mm, upper surface flat to slightly channelled, dark green with many pale spots in irregular transverse rows, lower surface convex, paler green, lineate, with fewer spots or unspotted. Inflorescence with(1-)4-12 ultimate branches, 0.4-1.5 m tall; racemes capitate; bracts deltoid-acuminate, 7-16 x 2.5-3.5 mm, distinctly 3-nerved to obscurely many-nerved. Flowers yellow to pink, orange or red, 20-45 mm long, subclavate to clavate above basal constriction; outer segments free for 6-15 mm, inner segments free but dorsally adnate to outer; pedicels 10-45 mm long, lengthening to 35-75 mm in fruit. Anthers exserted 1-5 mm. Ovary 5-10 x 2-4 mm, pale green; style exserted 3-5 mm. Fruit 18-40 x 6-15 mm, bluish grey. Seeds charcoal-grey, ±6.0 x 2.5 x 1.5 mm, broadly winged.
