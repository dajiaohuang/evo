        claims:
          - text: A. macu-lata usually occurs in grassland, where the grass may be so dense as almost to choke any forbs out, or sparse, with much bare soil between the tufts. The soil varies from consolidated beach dunes to clay and stones, at altitudes from sea level to high mountains.
