  claims:
    - subjectId: taxon:lycophocyon
      claimKind: scientific
      claimType: fossil-range
      statement: Lycophocyon hutchisoni is bounded by holotype cranium UCMP 85202 and associated paratype skeletons from southern California within an approximately 46.2–42 Ma sample envelope; this is not a direct ancestry date or complete genus duration.
      confidence: medium
      confidenceRationale: Named specimens and comparative anatomy are direct; the basal caniform position and dietary interpretation remain matrix- and proxy-dependent.
      referenceLinks:
        - relation: supports
          referenceId: tomiya-2011-lycophocyon
          pages: Article e24146
          figure: Figures 2–7
          quoteLocator: Holotype and paratypes; Phylogenetic analysis
    - subjectId: taxon:lycophocyon
      claimKind: scientific
      claimType: taxonomy
      statement: Tomiya's Paleogene-only morphology subset recovers Lycophocyon hutchisoni on the caniform branch outside crown Canoidea, whereas the broader analysis does not resolve its nearby carnivoramorphan relationships.
      confidence: medium
      confidenceRationale: The named specimens and both analytical outcomes are explicit; placement is matrix- and sample-dependent.
      referenceLinks:
        - referenceId: tomiya-2011-lycophocyon
          relation: supports
          pages: 13–16
          figure: Figure 8; Appendix S3
          quoteLocator: Cladistic Analysis; 50-taxon and Paleogene-only analyses
    - subjectId: taxon:lycophocyon
      claimKind: scientific
      claimType: biogeography
      statement: The named Lycophocyon material is reported from member C of the Santiago Formation in San Diego County, California; these localities do not establish a genus-wide North American distribution.
      confidence: high
      confidenceRationale: The formation, county and specimen localities are directly listed, without extrapolating their geographic scope.
      referenceLinks:
        - referenceId: tomiya-2011-lycophocyon
          relation: supports
          pages: 2–3
          quoteLocator: Distribution; Holotype locality; Paratypes
    - subjectId: taxon:lycophocyon
      claimKind: scientific
      claimType: morphology
      statement: UCMP 85202 preserves craniodental material, while associated SDSNH specimens include cranial, mandibular and selected postcranial elements.
      confidence: high
      confidenceRationale: This is limited to the specimen list and does not infer whole-body performance.
      referenceLinks:
        - referenceId: tomiya-2011-lycophocyon
          relation: supports
          pages: 2–3
          figure: Figures 2–6
          quoteLocator: Holotype; Paratypes
    - subjectId: taxon:lycophocyon
      claimKind: scientific
      claimType: ecology
      statement: A six-variable discriminant classifier predicts carnivory for the holotype with 83% posterior probability, but this comparative model does not observe feeding, habitat, locomotion or an ecological guild.
      confidence: medium
      confidenceRationale: The paper reports the model and its probability, while the profile preserves its observational limits.
      referenceLinks:
        - referenceId: tomiya-2011-lycophocyon
          relation: supports
          pages: 13–14
          figure: Figure 7; Table 3
          quoteLocator: Dietary Inference
  claim-rationales.zh:
    - 具名标本和两项分析结果均有明确记录；系统位置依赖矩阵与取样。
    - 产地、地层与标本地点由原始研究直接列出，且未外推其地理范围。
    - 形态陈述限于已列出的颅齿、下颌和颅后标本，不推断整体运动能力。
    - 论文报告模型及其概率，而档案保留其非观察性限制。
    - 具名标本与比较解剖属于直接证据；基干犬型类位置和食性解释仍依赖矩阵与代理指标。
  claim-statements.zh:
    - Lycophocyon hutchisoni 由南加州的正模头骨 UCMP 85202 与关联副模骨架约束，处于约 4620 万—4200 万年前的样本区间；这不是直接祖先日期或完整属级延续。
    - Tomiya 的古近纪限定形态子集将 Lycophocyon hutchisoni 恢复在犬型类支系、犬总科冠群之外，而更广泛的分析未能解析其邻近的食肉形类关系。
    - 具名 Lycophocyon 材料报道自美国加利福尼亚州圣迭戈县圣地亚哥组 C 段；这些地点不能确立该属覆盖北美的完整分布。
    - UCMP 85202 保存颅齿材料，相关 SDSNH 标本则包括颅骨、下颌和若干颅后骨骼。
    - 六变量判别分类器以 83% 后验概率预测正模为食肉性，但该比较模型并未观察取食、栖息地、运动或生态类群。
