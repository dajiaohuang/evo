          originalSourceText: Slender shrubs, the young twigs minutely pubescent, soon glabrate, densely foliate. Leaves more or less distichous, elliptical, acute at the base, obtusely acuminate at the apex, 3-4 cm. long and 1-2 cm. wide, chartaceous, glabrous, finely reticulate, the midrib impressed above and prominent beneath, the lateral nerves several but distant, delicate, the marginal nerve very near the margin; petiole slender, 4-6 mm. long, glabrous. Flowers in axillary 6- to 15-flowered fascicles, the pedicels slender, sparsely pubescent, 4-6 mm. long, the peduncle practically absent. Sepals 4, the larger about 1.5 mm. long. Petals suborbiculate, about 2.5 mm. long. Style glabrous. Ovary glabrous, many-ovulate. Berry not seen.
