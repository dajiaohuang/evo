    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Perennial herb or shrub, up to 0.6 m high. Leaves 15-20 x 2.0-2.5 mm, linear-lanceolate, base broad, half-clasping, eared, margins revolute, upper surface cobwebby-woolly, lower more densely so. Heads campanulate, many in compact corymbose panicles. Flowers with light straw-coloured involucral bracts.
            sourceIds:
              - sanbi_11118_0
            locator: "SANBI/WFO archive Morphology row 2233; source 11118.0; publication: Herman, PPJ; Retief, E. 1997. Plants of the northern provinces of South Africa: Keys and diagnostic characters. Strelitzia 6: 1 - 681. National Botanical Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: "H. interjacens may be of hybrid origin between H. melanacme and H. polycladum: it is known from only a small geographical area where the ranges of these two species overlap, and may grow in close proximity to one or both of its putative parents. It closely resembles H. melanacme in general facies, but is readily distinguished by female flowers in a head far outnumbering homogamous; also, where these two species have been recorded together, H. interjacens has decidedly paler involucral bracts than H. melanacme. H. polycladum is easily distinguished from both by its much narrower leaves and white involucral bracts."
