    facets:
      morphology:
        status: partially-supported
        claims:
          - text: A decumbent, freely branched herb, with age becoming somewhat erect and rather woody, and tending to scramble if support is available, 15 to 20 cm high. Leaves ascending or erect, subterete or obtusely trigonous, obtuse or acute, 2.5 to 5.5 cm long, 3 to 6 mm in diameter, the sheath 3 to 4 mm long. Flowers usually 4 cm in diameter. Receptacle clavate, 5 to 6 mm in diameter at the apex. Sepals 4 to 5, the 2 longer 1 to 1.7 cm long, or after flowering often 2.2 cm long, the shorter ones with a membranous margin. Petals 1 to 2-seriate, rather lax, linear, tapering towards the base, obtuse or subacute, entire, clear yellow becoming croceous with age and finally turning black, 1.9 cm long, up to 2 mm broad. Stamens erect, 5 mm in diameter; filaments yellow, 2 to 4 mm long, the inner copiously bearded at base with white pellucid hairs. Disk inconspicuous, annular. Ovary slightly convex above, 8 to 10-celled. Stigmas 8 to 10, subacute, 1.5 to 2 mm long. Capsule expanded 1.2 cm in diameter; keels parallel below, slightly divergent upwards; membranous wings adnate to keel, semi-lanceolate, acuminate, equalling the valves in length; seeds obovate.
            sourceIds:
              - sanbi_859_0
            locator: "SANBI/WFO archive Morphology row 71439; source 859.0; publication: Bolus, L; Page, MM. 1927. Crocanthus thunbergii L.Bolus. Fl. Pl. South Africa 7t.255. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: It still remains to prove conclusively that M. luteum, Haw. is distinct from Crocanthus thunbergii, L. Bolus. The former is described as having 'an upright rigid stem,' and 'tumid nodes of the stem, from which on the side next the ground sprout swollen rootlets.' The latter statement at least implies some decumbent branches. But it seems advisable to complete observations on some growing plants, sent by Dr. Muir from the Riversdale Div. and on others received from the Division of Botany, before a satisfactory conclusion is reached. In order, therefore, to avoid a possible additional synonym, I refrain from placing M. luteum, Haw. at the moment in this genus.
