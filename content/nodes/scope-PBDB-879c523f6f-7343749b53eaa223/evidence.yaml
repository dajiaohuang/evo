  claim-rationales.zh:
    - 螺旋格状埃迪卡拉纪海绵候选的分类字段只陈述所引研究与导航范围；不会把矩阵位置、数据库映射或样本相似性改写为直系祖先。
    - 螺旋格状埃迪卡拉纪海绵候选的地理字段限于具名样本或明确模型范围，不外推为全球分布、起源中心或完整扩散路径。
    - 螺旋格状埃迪卡拉纪海绵候选的生态字段区分保存事实与功能推断；未被直接记录的饮食、行为、栖息地偏好和性能均保留不确定性。
    - 螺旋格状埃迪卡拉纪海绵候选的形态字段限于主研究列明的标本、样本或分析，并连接到精确页码、图版或补充材料。
    - 螺旋格状埃迪卡拉纪海绵候选的年代范围是有界的标本、地层或模型投影，不作为全球首现、末现、分化时间或连续谱系时长。
  claim-statements.zh:
    - 所引形态分析将 Helicolocellus cantori 恢复在六放海绵纲附近；这一采样拓扑不表示直系祖先关系，也不代表通用的动物系统树。
    - 本档案限于灯影组石板滩材料，不据此推断该属的完整分布。
    - 固着生活和悬浮摄食是根据所提出的海绵体制作出的功能推断，并非直接观察到的行为或生理活动。
    - NIGP-176531 及归入该种的其他标本保存了大型高脚杯状身体，由呈螺旋排列的嵌套方形网格构成。
    - 551–539 Ma 显示区间是采样材料的组级地层包络，并非全球首现、末现或冠群海绵年代。
