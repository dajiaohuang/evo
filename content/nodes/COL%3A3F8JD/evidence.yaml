        claims:
          - text: In laboratory microcosms, native Gammarus pulex processed leaf detritus faster than the two tested invasive Dikerogammarus species at the lower temperature treatments; the between-species differences decreased as the temperature treatments increased.
            sourceIds:
              - fincham2023
            locator: Abstract
            placeTimeScope: Laboratory microcosms compared treatments at 8, 14, and 20 C using oak, sycamore, and alder leaf diets; paper published in 2023. These conditions describe the experiment and not the species' realized field ecology.
            lifeStatus: Experimental animals in laboratory microcosms; the result is not generalized to wild population rates or to other environmental conditions.
            originalLanguage: en
        gaps:
