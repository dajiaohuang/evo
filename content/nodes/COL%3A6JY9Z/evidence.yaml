    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants acaulescent, decumbent to erect, 30-100 mm tall and 80-300 mm in diameter, proliferating from the base to form small to large groups, rarely solitary. Roots succulent, terete. Leaves distichous at first, becoming rosulate, 50-180 mm long, 15-40 mm broad at the base, firm but brittle, triangular, triangular-lanceolate or linear, erectly spreading or becoming recurved, adaxial surface channelled, plane towards apex; abaxial surface convex, with an excentric marginiform keel; both surfaces dark green with dense white spots arranged in transverse bands, distinctlv and densely rugulose-tuberculate, with larger and smaller green or white tubercles; the tubercles conical or subconical, often confluent forming ridges; margin cartilaginous, serrulate, rarely denticulate; apex acute, rarely obtuse, mucronate. Juvenile leaves lorate, densely tuberculate, apex obtuse, mucronate. Inflorescence racemose, erectly spreading and curved, 300-450 mm long bracts 6-12 mm long 2-5 mm broad at the base; pedicel 9 mm long. Perianth 35-40 mm long stipitate for 3-5 mm, gasteriform basally (narrow-elliptic) for half its length; the gasteriform portion 6-9 mm in diameter (often triangular in cross section), light pink, upper half white with green striations, inflated to the same diameter as lower portion (with a slight constriction in the middle); apices erect becoming erectly spreading obtuse, white with green median stripes; margins of inner segments free, canaliculate for the length of the ovary. Stamens 30-35 mm long anthers 2.5 mm long included or shortly exserted. Ovary 7 mm long, 3 mm in diameter, style 15 mm long, stigma included or exserted for up to 5 mm, curved upwards. Capsule 16-20 mm long. Seeds 4-6 mm long, 2-3 mm wide. Flowering time from October to December, but occasionally throughout the year.
