      ecology:
        status: partially-supported
        claims:
          - text: In hot, dry, frost-free river valleys in mountainous terrain. The habitat consists of shady southern and eastern aspects of wooded rocky ridges and krantzes, where it occurs in shallow, humus-rich soil. It has been recorded as occurring on rhyolite, sandstones and shales, quartzitic rocks, and dolomites. Near the Klipwal gold mine in the Pongola district, plants are found on a sheer south-facing rock face overlooking the river. They abound here in shallow pockets in quartzitic sandstone together with other xerophytic species, the vegetation forming a mosaic of valley bushveld and lowveld The plants proliferate to form small, dense groups.
