          - text: Gasteria batesiana is characterized by its small rosette of firm, brittle, triangular to linear, spreading to recurved, distinctly rugulose-tuberculate leaves, and its simple, racemose inflorescence bearing large flowers of 35-38 mm in length. The leaves are often very dark, almost a blackish green. It is closely related to G. croucheri, a much larger sister species (perianth similar) with smooth, often glaucous leaves and a paniculate inflorescence. In vegetative features G. batesiana closely resembles G. carinata var. carinata and G. ellaphieae from the southern and south-eastern Cape; these, however, have a much smaller and different perianth. G. carinata has leaves that are sparingly tuberculate (rarely smooth) and G. ellaphieae has leaves with dense, domed tubercles. G. batesiana is variable in the size, colour and shape of the leaves.
