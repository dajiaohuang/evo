    facets:
      morphology:
        status: partially-supported
        claims:
          - text: A small shrub with rather straggly elongated branchlets; branchlets with light-coloured bark, slightly pubescent when young. Leaves tufted, or when scattered alternate, linear or subspathulate-linear, obtuse at the apex, narrowed to the base, 0.5-1.5 cm long, 1-2 mm broad, fleshy, glabrous, nerveless. Heads few, solitary, terminal, subcampanulate, about 1.4 cm long, 1 cm in diam. Involucral bracts 4-seriate; the outermost linear-lanceolate, acute or subobtuse, about 2 mm long; the innermost linear, subobtuse, about 8 mm long and 1.75 mm broad, scaly membranous, shortly ciliate, otherwise glabrous. Receptacle convex, 2-5 mm in diameter, reticulate. Corolla 6 mm long; tube gradually widened upwards, slightly angular, glabrous; lobes triangular, scarcely 1 mm long. Achenes narrow, 4 mm long, shortly villous. Pappus 5 mm long, yellowish white.
            sourceIds:
