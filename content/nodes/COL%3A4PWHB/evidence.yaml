    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Perennial herb up to 150 mm high; branching at the top, the basal organ a swollen above ground caudex, 30-40 mm in diam., with underground numerous thin fusiform roots. Leaves very variable in shape and size, up to 60 mm long, 20 mm wide, sub-entire, strongly sinuate, usually with 4 pairs of lateral veins. Flowers pale yellow with throat slightly darker yellow; corolla tube cylindrical, 25-28 mm long; limb ±30 mm in diam., up to 4x the diam. of the throat; lobes sub-equal, oblate. Fruit usually rotund to circular in lateral view, 18 mm long, 15 mm wide; beak indistinct, 1 mm wide; wings of the two sides of the fruit not contiguous at the base of the fruit, hence base distinctly cordate. Seeds 1 in each locule.
            sourceIds:
              - sanbi_15294_0
            locator: "SANBI/WFO archive Morphology row 62705; source 15294.0; publication: Peckover, RG. 2016. Two new species of Pterodiscus (Pedaliaceae) from southern Africa. Aloe 52(1): 10 - 14. [All rights reserved]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Pterodiscus makatiniensis appears to be most closely related to P. ngamicus. Both species have a swollen aboveground caudex, and thin fusiform roots. However, the two species differ in several floral and fruit features. The flowers of P. makatiniensis are pale yellow overall, whilst those of P. ngamicus have contrasting red/brown corolla lobes and a greenish yellow corolla tube. In P. ngamicus the corolla tube opening is twice as broad as that of P. makatiniensis. The position of the stigma within the corolla tube of P. makatiniensis is situated a third from the base, whilst in P. ngamicus it is half-way up the tube. This relates to a style length of 10 and 20 mm respectively. The height of stamen insertion on the tube as measured from the base of the corolla is significantly less in P. makatiniensis than in P. ngamicus, at 2 and 5 mm respectively. The corolla tube is also significantly shorter in P. ngamicus. P. makatiniensis has mature fruit that are significantly smaller than those of P. ngamicus, as are also the seed contained therein.
