        usage:
          title: Hedyosmum brenesii Standl., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Monoecious shrubs 1-2 m. tall, the branchlets terete, smooth to rugose. Leaves narrowly lanceolate to narrowly elliptic, 5-16 cm. long, 1-3 cm. broad, attenuate at the apex, cuneate-attenuate to rounded at the base, glabrous to minutely scabrous above and below, margin coarsely serrate except at the smooth base, the primary lateral veins obscure, the petiolar sheath 5-10 mm. long, the petiole 1-6 mm. long; stipules fimbriate or erose. Staminate catkin spiciform, about 5 mm. long, elongating slightly at anthesis, the primary peduncle generally unbranched; staminate flowers with the anthers about 1 mm. long, sessile, the connective apiculate, produced beyond the anthers 0.25 (-0.5) mm. Pistillate inflorescence often falsely dichotomous and then cincinnoid, the primary peduncle often white- spotted; pistillate flowers borne singly, sessile, the perianth urceolate, about 1.5-2.5 mm. long, 1.0-1.5 mm. in diameter, white; the stigma shortly exserted, the bracts free, ovate, to 2.5 mm. long, 1.5 mm. broad; fruit ovoid, 3.0-4.5 mm. long, 2.5- 3.5 mm. in diameter, white.
          originalLanguage: en
          sourceField: general
