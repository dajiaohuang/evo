  claims:
    - subjectId: taxon:ostracodermi
      claimKind: scientific
      claimType: taxonomy
      statement: A craniate phylogenetic review separates traditional armored fossil ‘agnathans’ among several lineages on the jawed-vertebrate stem. Ostracodermi is therefore retained only as a historical navigation grade, not a monophyletic taxon, direct ancestor or globally bounded range.
      confidence: medium
      confidenceRationale: Confidence is medium because the cited systematic synthesis directly supports the bounded taxonomy statement at the supplied locator. The confidence does not extend beyond ostracodermi is therefore retained only as a historical navigation grade, not a monophyletic taxon, direct ancestor or globally bounded range.
      referenceLinks:
        - relation: supports
          referenceId: janvier-1981-fossil-agnathans
          pages: 121–159
          figure: Phylogenetic diagrams and character review
          quoteLocator: Fossil agnathan groups; craniate phylogeny; classification implications
    - subjectId: taxon:ostracodermi
      claimKind: scientific
      claimType: fossil-range
      statement: Ostracodermi is retained only as a historical navigation grade spanning several jawless stem-gnathostome lineages, so the former 485–359 Ma composite is withheld rather than treated as a clade range.
      confidence: medium
      confidenceRationale: "Ostracodermi historical navigation grade: the cited primary study or systematic review directly supports the stated sample, calibration or withholding boundary at the supplied locator. Confidence is medium and does not extend to a global FAD, LAD, direct ancestor or unsampled interval."
      referenceLinks:
        - relation: supports
          referenceId: janvier-2008-cyclostome-origins
          pages: 1045–1056
          figure: Review diagrams and fossil-group discussion
          quoteLocator: Abstract; fossil agnathans and cyclostome-origin discussion
