  claims:
    - subjectId: taxon:buriolestes
      claimKind: scientific
      claimType: fossil-range
      statement: Buriolestes is anchored by holotype ULBRA-PVT280 from the approximately 233.2 Ma Late Triassic assemblage; it is a sampled occurrence, not a global genus or dinosaur first appearance and not a direct ancestor.
      confidence: high
      confidenceRationale: The holotype, assemblage and radiometric context are directly reported. High confidence is limited to the named sample and age context.
      referenceLinks:
        - referenceId: cabreira-2016-buriolestes
          relation: supports
          pages: 3090–3095
          figure: Figures 1–4; Supplemental Information
          quoteLocator: Holotype and assemblage; radiometric context; systematic palaeontology
    - subjectId: taxon:buriolestes
      claimType: taxonomy
      claimKind: scientific
      statement: Buriolestes schultzi is based on articulated holotype ULBRA-PVT280, and the study recovers it among sauropodomorphs in its sampled morphology matrix; the matrix placement is not evidence of direct ancestry.
      confidence: medium
      confidenceRationale: The holotype is directly documented, while phylogenetic placement depends on character coding, taxon sampling and analysis settings.
      referenceLinks:
        - referenceId: cabreira-2016-buriolestes
          relation: supports
          pages: 3090–3095
          figure: Figures 1–2; Figure S3
          quoteLocator: Systematic palaeontology; phylogenetic analysis
    - subjectId: taxon:buriolestes
      claimType: morphology
      claimKind: scientific
      statement: Holotype ULBRA-PVT280 includes a partial skull, axial skeleton, forelimb and nearly complete left hind limb, and preserves recurved, serrated teeth; these observations are limited to the named specimen.
      confidence: high
      confidenceRationale: The specimen inventory and dental morphology are described and illustrated directly in the primary study.
      referenceLinks:
        - referenceId: cabreira-2016-buriolestes
          relation: supports
          pages: 3090–3095
          figure: Figures 1 and 3; Supplemental Experimental Procedures
          quoteLocator: Systematic palaeontology; tooth morphology and dietary character coding
    - subjectId: taxon:buriolestes
      claimType: biogeography
      claimKind: scientific
      statement: This profile's geographic statement is limited to the Candelária Sequence of the Santa Maria Formation in Rio Grande do Sul, Brazil, where the holotype was collected; it does not assert a global distribution.
      confidence: high
      confidenceRationale: The locality and formation of the holotype are recorded directly, but a single source-bounded occurrence cannot establish genus-wide distribution.
      referenceLinks:
        - referenceId: cabreira-2016-buriolestes
          relation: supports
          pages: 3090–3095
          figure: Figure 1; Figure S1
          quoteLocator: Locality, geological setting and holotype description
    - subjectId: taxon:buriolestes
      claimType: ecology
      claimKind: scientific
      statement: The recurved, serrated teeth of ULBRA-PVT280 are compatible with faunivory in the study's character-based reconstruction; habitat, locomotion, body size and guild remain bounded comparative interpretations rather than observed behaviour.
      confidence: medium
      confidenceRationale: Dental morphology is directly documented, while diet and the remaining ecological fields depend on comparative coding, reconstruction and the sampled topology.
      referenceLinks:
        - referenceId: cabreira-2016-buriolestes
          relation: supports
          pages: 3090–3095
          figure: Figure 3; Supplemental Experimental Procedures
          quoteLocator: Tooth morphology; character-state and diet reconstruction
  claim-rationales.zh:
    - 正模、组合和放射性年代背景均有直接报告。高置信度仅限具名样本及年代背景。
    - 正模有直接记录，而系统位置依赖性状编码、类群取样和分析设定。
    - 论文直接描述并图示了标本组成和牙齿形态。
    - 正模的地点和地层有直接记录，但单一受限出现不能建立属级的全球分布。
    - 牙齿形态有直接记录，而食性及其余生态字段依赖比较编码、重建和所采样的系统树。
  claim-statements.zh:
    - 布里奥龙由约 2.332 亿年前晚三叠世组合中的正模 ULBRA-PVT280 锚定；它是取样记录，不是全球属级或恐龙首现，也不是直接祖先。
