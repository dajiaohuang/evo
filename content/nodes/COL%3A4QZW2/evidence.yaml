        claims:
          - text: Like Q. cincta but corolla nodding, inside yellow at tips of lobes and deep red below, corona red with linear outer lobes.
            sourceIds:
              - sanbi_14722_0
            locator: "SANBI/WFO archive Morphology row 34093; source 14722.0; publication: Bruyns, PV. 2013. Apocynaceae. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 248 - 264. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Plants of Q. inversa may be quite substantial and can reach 300 mm in diameter. The stems are adorned with stoutly conical, often somewhat decurved tubercles which are joined into four neat angles. The tubercles are often a little stouter and have a more conspicuous, yellow tip than those in Q. incarnata or Q. parviflora, with which it frequently grows. Flowers of Q. inversa are probably the most beautiful in the genus. The original specimen of ‘Caralluma villetii’ had flowers 21 mm in diameter according to Lückhoff but mostly they are quite a lot smaller than this, although they are noticeably larger than in Q. parviflora. In most specimens the flower modestly hides its beauty by facing downwards and it has to be lifted up to be admired. However, a few specimens have been seen where the flower faces horizontally or even a little upwards. It usually opens to be more or less flat with a small, conical tube in the centre but again among recent collections plants have been seen where the tube is absent. On the inside, the upper part of each corolla lobe is generally pale yellow. The remainder of the lobe and the mouth of the tube is a deep wine-red to maroon (although a few with pale red have also been seen), mostly uniformly coloured but sometimes particularly attractively mottled with white. The tube or the centre of the flower (when the tube is absent) is white, often faintly and finely mottled with red. It has been found that the flowers emit a faint, fruity odour for a while after opening. When it is present, the tube contains the whole of the corona. In Q. inversa the corona is very variable in colour, from dark maroon to red or even pinkish and this is usually dependent on the darkness of the rest of the corolla. The outer lobes are more or less parallel with the sides of the tube. They may be linear, with an obtuse apex, or they may be slightly bifid at the apex with spreading lobules. The inner lobes mostly cover the anthers and they have an ascending to spreading, tooth-like dorsal projection. This dorsal projection is another very variable feature of the flower. It may be anything from conspicuous to nearly absent. In cases where it is conspicuous, it may almost equal the outer lobes so that the whole structure appears to have 10 outer lobes. This species is very similar to Q. cincta and, if one ignores the distinctive colouring that each has, there is little to separate them. Formerly I claimed that the two were separated by the orientation of the pedicel as well as other features but this character has subsequently proved to be variable in both. Thus the two are separated chiefly by their very different colouring and the more deeply channelled and deeply bifid outer corona lobes of Q. cincta. Vegetatively, they can be distinguished by the much more stoutly toothed stems of Q. inversa.
            textZh: SANBI 条目提供了该种的鉴别特征。
