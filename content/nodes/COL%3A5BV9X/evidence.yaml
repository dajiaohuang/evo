    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Perennial herb, geophyte, 0.25-0.50 m high; corm ± globose, tunics finely reticulate; stem simple. Leaves linear, half length of stem, 2.5-6.0 mm wide, margins and midribs hyaline and lightly thickened. Bracts green below, brownish apically, inner bifid. Inflorescence a spike; flowers orange, zygomorphic; perianth tube cylindric, 8-12 mm long; tepals obovate, often acuminate, spreading. Stamens unilateral, arched below upper tepal; filaments 10 mm long; anthers 7-9 mm long, white. Ovary 2.5 mm long; style arched over stamens. Flowering time July-Nov. Capsule obovoid.
