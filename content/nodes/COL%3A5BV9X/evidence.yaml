            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: A small, orange-flowered species up to 500 mm high, with the upper part of the perianth tube narrowly trumpet-shaped, 10-12 mm long and slightly shorter than the tepals, and short filaments ± 10 mm long just included in the tube.
