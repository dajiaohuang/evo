    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Herb, up to 200 mm tall. Leaves undivided to very shallowly lobed. Epicalyx bracts much narrower than sepals. Petals shorter than 15 mm, usually not more than twice as long as calyx. Mericarps 9-16, distinctly reticulately ridged on back, glabrous, edges often slightly raised but neither toothed nor overlapping adjoining mericarps. Flowers white or pale mauve.
