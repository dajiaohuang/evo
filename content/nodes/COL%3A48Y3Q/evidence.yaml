        claims:
          - text: Erect to somewhat decumbent, annual or biennial, 0.3-0.7 m high; forming a rosette, side branches arching; plants evidently erect-pubescent. Cauline leaves ovate, apex acute; bracts rounded at base, sessile, shorter than capsules they subtend. Floral tube up to 20 mm long, flecked red. Sepals flecked dark reddish brown, with slender, free tips ± 1.5 mm long, erect or divergent. Petals 3-6 mm long. Flowering time June-Jan. Fruit a capsule, up to 30 x 5 mm, valves often clearly separated at end. Seeds up to 1.5 mm long, ellipsoid.
