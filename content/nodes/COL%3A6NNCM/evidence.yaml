        metadataVariant: 0
        usage:
          title: Koanophyllon wetmorei (B.L.Rob.) R.M.King & H.Rob., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrubs or small trees 2-3 m tall with few to many branches; stems not fleshy, usually grayish-brown, terete to slightly ridged, densely minutely puberulous and sparsely glanduliferous. Leaves opposite; blades papyraceous, narrowly elliptical, mostly 12-20 cm long and 3.5-6.5 cm wide, the base narrowly cuneate, the margins serrulate to nearly entire, the apex slightly acuminate, long and narrow, the upper surface glabrate, the lower surface with a few hairs on veins and with many glandular punctations with 50 or more glands per mm2, the secondary veins pinnate, the reticulations of veinlets not prominent; petioles usually slender, 1.0-3.5 cm long. Inflorescence pyramidal, the branches broadly paniculate, the bracts narrow or with narrow bases, the ultimate branches 1-5 mm long, minutely puberulous. Heads 5-6 mm high with 12-23 florets; involucral bracts ca. 20, subimbricate, unequal, in ca. 3 series, lanceolate, the apex sharply acute, the outer surface sparsely puberulous and often sparsely glandular with ca. 3 striations, the inner bracts easily deciduous, reaching to level of middle of mature corolla; corolla white, 3.0-3.5 mm long, mostly glabrous, distinct cluster of capitate glands on outer surface of lobes. Achenes ca. 2.5 mm long, with many short bristles on ribs and upper surfaces, the achene base narrow with small short tapering carpopodium; pappus of 27-30 contiguous bristles, the apices mostly slender.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 1880
