    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants epiphytic or epilithic; stems short and stout, 30-80 x 7-10 mm; leaves conduplicate, lorate, rounded, fleshy or leathery, 60-110 x 12-20 mm. Inflorescences usually shorter than the leaves, racemose, 55-150 mm long and with 5-15 laxly arranged flowers; sheaths distant, rounded, 5-7 mm long; bracts very wide, dish-like, 2-6 mm long. Flowers white, star-like, 15-25 mm in diameter, sweetly scented; pedicel plus ovary 20-25 mm long. Sepals subequal, subacute, apices fleshy; median ovate, 8-11 x 5-6 mm; laterals narrowly ovate, 9-11 x 4-5 mm. Petals lanceolate, 7-10 x 3.5-4 mm. Lip rhomboid, acute, flat, 10-12 x 8 mm; spur cylindrical, 50-90 mm long. Gynostemium 5 mm tall; rostellum 2.5 mm long, tapering from a broad base.
