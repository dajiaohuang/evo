          title: Canavalia bicarinata Standl., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Trailing vine; stems sparingly pubescent with ascending weak, brownish or white hairs. Leaves pinnate trifoliolate, leaflets to 15 cm long, 9 cm wide, ovate, apically obtuse or short acuminate, basally rounded, chartaceous, drying slightly discolorous, sparingly pubescent to villose with short hairs on 1 or both sides. Inflorescence axillary, 4-15 cm long, bracteoles rotund, ca. 1 mm long, pedicels wanting or to 1.5 mm long. Flowers red or rose; calyx ca. 12 mm long, tubular, pubescent with short, straight hairs, the upper lip short, apiculate, the lowest tooth ca. 1.5 mm long, pointed, slightly longer than the lateral teeth; standard 3 cm long. Legume mostly less than 15 cm long, woody, oblong with a short downcurved beak, sessile or short stipitate, ca. 2 cm wide, longitudinally ridged on the sutures and each valve with 2 additional ridges almost equidistant, pilose when young, maturing with fine even gray pubescence between the ridges; seeds ca. 9 mm long, ovoid or ellipsoidal, dark brown, mottled, the hilum ca. 7 mm long, ca. 3/4 the length of the seed.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 4760
