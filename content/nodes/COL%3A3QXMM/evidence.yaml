          - text: Decumbent, rarely ascending or erect, dwarf, succulent shrub, up to 250 mm tall, internodes enclosed by leaf bases or very short. Leaves boat-shaped to pointed, < 30 x 20 mm, with a hard apical mucro and few very fine teeth along margins. Flowers 20-35 mm diam., petals white. Fruit 7-9-locular.
