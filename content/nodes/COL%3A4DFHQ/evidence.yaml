          originalSourceText: Shrubs or small trees, the twigs slender, covered with minute reddish and closely appressed tomentum. Leaves small, slender-petiolate, the petioles to 2 cm long, canaliculate, with fine appressed stellate tomentum beneath, glabrous above; leaf blades oblanceolate or oblanceolate-oblong, 7.5-11 cm long and 2.6-4 cm wide, acuminate basally, subabruptly acuminate apically, thin, paler beneath, essentially entire, pellucid-punctate with short horizontal linear glands, glabrous above, with fine stellate reddish tomentum on the lower surface in a narrow costal zone, the lateral veins fine on both surfaces. Inflorescences terminal, shorter than the leaves, pyramidal, slender-branched, to 7 cm long, covered with minute reddish closely-appressed tomentum. Flowers few, sub- corymbose, borne on slender finely reddish-tomentose pedicels 1.5-4 mm long; buds ovoid, ca. 3 mm long, the tomentum fine, reddish; calyx finely reddish- tomentose, black-punctate, the sepals ca. 1 mm long, connate basally; petals linear-punctate, narrowly triangular, ca. 3 mm long, connate basally, papillose- tomentose within along the edges and apically; stamens ca. 1.75 mm long,
