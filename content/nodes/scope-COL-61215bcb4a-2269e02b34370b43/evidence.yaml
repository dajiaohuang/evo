  claims:
    - subjectId: taxon:macaca_mulatta
      claimType: taxonomy
      claimKind: scientific
      statement: COL26.8 dataset 316115 records accepted species usage 3WWNQ as Macaca mulatta (Zimmermann, 1780), with Macaca usage 5HYC as its immediate parent. This records checklist identity and classification only.
      confidence: medium
      confidenceRationale: The pinned accepted usage and immediate parent are explicit in COL26.8. This statement is limited to checklist identity and does not infer biology or phylogeny.
      referenceLinks:
        - referenceId: col-2026-checklistbank-316115
          relation: supports
          pages: Accepted species usage 3WWNQ; immediate parent usage 5HYC Macaca; accepted parent chain through Primates usage 3W7
    - subjectId: taxon:macaca_mulatta
      claimType: biogeography
      claimKind: scientific
      statement: Buxa Tiger Reserve, West Bengal, India, is the site of the selected ecology study; Cayo Santiago, Puerto Rico, is the study population for the selected morphology analysis. These are study locations, not a species-wide distribution estimate.
      confidence: high
      confidenceRationale: Both primary studies identify their sampled location directly. The statement retains study-site scope and makes no full-range inference.
      referenceLinks:
        - referenceId: sengupta-2015-buxa-provisioning-rhesus
          relation: supports
          quoteLocator: Methods, Study Area and Study Troop
        - referenceId: kimock-2019-cayo-rhesus-morphology
          relation: supports
          quoteLocator: Methods, Study Population and Morphometric Data Collection
    - subjectId: taxon:macaca_mulatta
      claimType: ecology
      claimKind: scientific
      statement: At Buxa Tiger Reserve, West Bengal, one 64-individual troop was observed from October 2013 to September 2014; its home range included patches of natural forest, mixed-species plantations and residential settlements. Fruit accounted for 70.8% of recorded diet in the study-defined non-provisioning period (May–September) and 28.8% in the provisioning period (October–April); mean daily range was 4.72 km and 2.58 km respectively. These observational comparisons describe one troop and do not isolate provisioning as a controlled cause or estimate species-wide ecology.
      confidence: medium
      confidenceRationale: The paper directly reports the troop size, study period, diet percentages and mean daily ranges. It is an observational one-troop study and does not establish a controlled causal effect or species-wide ecology.
      referenceLinks:
        - referenceId: sengupta-2015-buxa-provisioning-rhesus
          relation: supports
          pages: Methods, Study Area and Study Troop; Results, Fruit availability, degree of provisioning and degree of frugivory; Sites of seed deposition; Table 3
    - subjectId: taxon:macaca_mulatta
      claimType: morphology
      claimKind: scientific
      statement: On Cayo Santiago, researchers measured 125 adult males and 21 related females captured in 2015. In the study pedigree models, most measured male morphometric traits showed heritable variation. This managed free-ranging cohort and model do not establish species-wide heritability.
      confidence: medium
      confidenceRationale: The source directly states its 2015 Cayo Santiago capture cohort, measured traits and pedigree-model results. The conclusion is bounded to the sampled population, pedigree and measured traits.
      referenceLinks:
        - referenceId: kimock-2019-cayo-rhesus-morphology
          relation: supports
          pages: Abstract; Methods, Morphometric Data Collection, Genetic Parentage Information and Dominance Rank; Results
    - subjectId: taxon:macaca_mulatta
      claimType: fossil-range
      claimKind: scientific
      statement: The selected COL26.8 checklist and the Buxa ecology and Cayo Santiago morphology studies do not estimate temporal fossil-range endpoints for Macaca mulatta; a numerical interval remains withheld.
      confidence: medium
      confidenceRationale: The checklist establishes classification and the cited papers study living populations; none supplies a temporal fossil-range endpoint. The numerical interval therefore remains withheld.
      referenceLinks:
        - referenceId: col-2026-checklistbank-316115
          relation: supports
          pages: Accepted usage 3WWNQ; identity and classification only
        - referenceId: sengupta-2015-buxa-provisioning-rhesus
          relation: supports
          quoteLocator: Living-troop ecology study; no temporal fossil-range estimate
        - referenceId: kimock-2019-cayo-rhesus-morphology
          relation: supports
          quoteLocator: Living-cohort morphology study; no temporal fossil-range estimate
    - subjectId: taxon:macaca_mulatta
      claimKind: scientific
      claimType: ecology
      statement: On an 11-km NH-7 segment through the Kanha–Pench corridor beside Pench Tiger Reserve in Madhya Pradesh, India, roadkill monitoring recorded 54 Macaca mulatta deaths from August 2009 to July 2010 (27 in summer, 19 in winter and 8 during monsoon). Within this single study, seasonal roadkill counts were positively correlated with traffic intensity, and the highest roadkill hotspot overlapped a location with frequent roadside feeding. These observations do not estimate a population-level mortality rate, establish causation, or describe present-day or range-wide conservation status.
      confidence: medium
      confidenceRationale: The primary article reports the monitoring period, road segment, carcass counts and observed correlations. It is a single local study without a population-level mortality estimate or formal conservation assessment.
      referenceLinks:
        - referenceId: pragatheesh-2011-nh7-rhesus-road-mortality
          relation: supports
          quoteLocator: Abstract; Methods, Roadkill data collection; Results, Roadkills
  claim-rationales.zh:
    - 固定版接受用名及直接父级由 COL26.8 明确记录。本陈述仅限清单身份，不推断生物学特征或系统发育。
    - 两篇一手研究均直接列出其取样地点；陈述保留研究地点范围，不扩展为全物种分布。
    - 论文直接报告群体规模、研究时段、食物比例和平均日移动距离。研究仅观察一个群体，不能证明受控因果效应或全物种生态。
    - 来源直接说明 2015 年卡约圣地亚哥取样群体、测量性状和谱系模型结果。结论仅适用于取样群体、谱系和测量性状。
    - 清单用于身份分类，所引论文研究现生群体，均未提供化石年代范围端点，因此数值区间保持隐藏。
    - 原始论文报告了监测期间、道路路段、尸体计数和观察到的相关性。这是一项局地单点研究，没有种群层面的死亡率估计，也没有正式保育评估。
  claim-statements.zh:
    - COL26.8 数据集 316115 将 3WWNQ 记录为接受的 Macaca mulatta（Zimmermann, 1780）种级用名，其直接父级为 Macaca 用名 5HYC。此陈述仅记录清单身份和分类位置。
    - 所选生态研究的地点是印度西孟加拉邦的布克萨虎保护区；所选形态分析的研究群体位于波多黎各的卡约圣地亚哥。这些是研究取样地点，不是全物种分布估计。
    - 2013 年 10 月至 2014 年 9 月，研究者在印度西孟加拉邦布克萨虎保护区观察了一个由 64 只猕猴组成的群体；其家域包括天然森林、混合树种种植林和居民点。研究记录的食物中，水果在研究划定的非投喂期（5–9 月）占 70.8%，在投喂期（10 月–次年 4 月）占 28.8%；群体平均日移动距离分别为 4.72 公里和 2.58 公里。这些观察比较仅描述一个群体，不能分离出投喂的受控因果效应，也不代表全物种生态。
    - 研究者在卡约圣地亚哥对 2015 年捕获的 125 只成年雄性和 21 只相关雌性进行了测量。在研究采用的谱系模型中，多数已测雄性形态性状表现出可遗传变异。该人工管理的自由活动群体及模型结果不能用于推断全物种的遗传率。
    - 所选 COL26.8 清单以及布克萨生态研究和卡约圣地亚哥形态研究均未估计 Macaca mulatta 的化石年代范围端点；数值区间继续隐藏。
    - 在印度中央邦、毗邻奔奇虎保护区并穿越 Kanha–Pench 廊道的 NH-7 一段 11 公里路段，研究人员于 2009 年 8 月至 2010 年 7 月的路杀监测中记录了 54 只恒河猴死亡（夏季 27 只、冬季 19 只、季风期 8 只）。在这项单点研究中，季节路杀数量与交通强度呈正相关，最高路杀热点与频繁路边投喂地点重合。这些观察不能估算种群死亡率、证明因果关系，也不代表现今或全分布区的保育状况。
