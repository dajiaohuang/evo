        claims:
          - text: Shortly glandular-hairy annual to 28 cm. Leaves narrow and often toothed. Flowers in corymbosely arranged heads, white or pale mauve with yellow patch at base of upper lip, salver-shaped, tube hairy, 13-16 mm long.
            sourceIds:
              - sanbi_14442_0
            locator: "SANBI/WFO archive Morphology row 5901; source 14442.0; publication: Manning, JC; Goldblatt, P. 2012. Scrophulariaceae: Polycarena Benth. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 752 - 752. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Polycarena lilacina var. difficilis has all the characters of P. lilacina except the very short indumentum; instead, the hairs are up to 0.25-0.4 mm long. To assign varietal rank to this plant is a matter of expediency, a means of drawing attention to a variation that may seem trivial, but it assumes significance in the context of Polycarena as a whole where small differences in indumentum can often be used to distinguish species that are/easily separable on other characters. Typical P. lilacina is notable for its very short indumentum, a character that, combined with markedly different floral details, serves to distinguish it from P. capensis with which it shares the character of corymbose branching and leafy habit.
