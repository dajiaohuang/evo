        claims:
          - text: Robust, glabrous herb, 0.5-0.7 m high. Leaves of flowering shoots glaucous, erect, linear-lanceolate to lanceolate-elliptic, ± 40 mm long; sheath length equal to leaf width. Inflorescences with peduncles simple or sparingly branched in upper half, with 2-5 flowers. Calyx with 3 or 4(5) pairs of bracts, up to one third of calyx length. Sepals united, cylindrical, 28-45 mm long. Petals pale pink to mauve; limb narrowly to broadly obovate or orbicular, not hairy, dentate to shortly fimbriate. Flowering time Sept.-Jan. Fruit a capsule, shorter than calyx.
