    - subjectId: event:early-trilobite-phylogenetic-clock
      claimKind: scientific
      claimType: topology
      statement: A reassessed early-arthropod morphology matrix supports a relatively short cryptic interval before the approximately 521 Ma appearance of widespread trilobites; topology and origin time are analytical outputs rather than a Precambrian absence test or a direct fossil date.
      confidence: medium
      confidenceRationale: The published matrix and model comparison are inspectable, while fossil incompleteness, character coding and time priors limit the inferred origin interval.
      referenceLinks:
        - referenceId: holmes-budd-2022-early-trilobites
