          title: Inga goldmanii Pittier, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Moderate-sized tree, the branchlets ferruginous-hirsute. Leaves large, mostly 8-foliolate; petiole usually about 1 cm. long, alate, hirsute except lightly pubescent on the wings; rachis up to 20 cm. long, similar to the petiole, the wing about 5 mm. wide from midrachis to margin, bearing short-stipitate, cupuliform glands between insertion of the petiolules; leaflets mostly 4 pairs, ovate to elliptic, up to 25 cm. long and 15 cm. wide, the terminal pair about twice as long as the basal pair, acute and short-acuminate apically, rounded and inequilateral basally, sub- glabrous above except on the midvein (midvein heavily pubescent and usually bear- ing 1-2 small glands basally), laxly pubescent below especially on the veins; stipules broadly ovate, caducous in age. Inflorescence a stout terminal or axillary spike, the peduncular portion about 8 cm. long and hirsute, the floriferous portion up to 6 or 7 cm. long; bracts broadly ovate, scarcely 4 mm. long, hirsute, deciduous in age. Flowers very broad and stout; calyx subcampanulate, about 13 mm. long and almost as wide (apically), densely hirsute-tomentose; corolla tubular-campan- ulate, 2 cm. long or longer, densely villous without; stamens about 6 cm. long, the staminal tube included. Legume flat, about 18 cm. long and 4 cm. wide?, some- what arcuate, stipitate, densely ferruginous-hirsute, the margins not unduly thickened.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 4868
