        usage:
          title: Delonix regia (Bojer ex Hook.) Raf., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Spreading tree, the branchlets subglabrous, lenticellate, corky in age. Leaves large; petiole usually about 10 cm. long, flattened and somewhat sulcate above, swollen basally; rachis up to 5 dm. long, somewhat nodose and cross-partitioned at insertion of the pinnae, tomentulose or puberulent; stipules sagittate-bifurcate (the lobes frequently dissected), caducous; pinnae up to about 20 pairs, spreading, the rachis about 12 cm. long, tomentulose; ultimate leaflets up to 40 pairs, oblong, usually nearly 1 cm. long and 3-4 mm. wide, inequilateral basally, rounded or obtuse apically, usually tomentulose or puberulent above and below especially along the veins, lighter below. Inflorescence as described for the genus; bracts ovate- lanceolate, about 6 mm. long; pedicels up to 10 or more cm. long in lowermost flowers. Flower red, very ornamental; calyx-tube from pedicellar articulation about 7 mm. tall, shallow within; calyx-lobes spatulate-lanceolate, 2.5-3 cm. long, valvate in bud, reflexed in age; petals large, about 6 cm. long, spreading, the claw about 3 cm. long, expanding apically, tomentulose within, the blade suborbicular,
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 5771
