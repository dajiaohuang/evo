        claims:
          - text: Like I. stohriae but flowers shell-pink, tube 10-12 mm long, stamens and style branches included in lower part of tube.
            textZh: Ixia recondita Goldblatt & J.C.Manning 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 7160; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: "Distinctive in having not only the filaments but also the anthers, style and style branches included within the narrow perianth tube, and in its soft-textured leaves. It broadly resembles I. stohriae, which also has short filaments, either included in the perianth tube or shortly exserted up to 1 mm and the bases of the anthers sometimes partly included in the tube, but is otherwise a more robust plant and most collections consist of plants with sturdy, erect stems with at least one branch (rarely up to 5 branches). The style in I. stohriae reaches at least to the middle of the anthers and sometimes exceeds them, thus always reaching the mouth of the perianth tube. This contrasts with the condition in I. recondita, in which the style, just 2-3 mm long, divides opposite the filament bases in the lower half of the perianth tube and the style branches barely reach the middle of the filaments. Like Ixia stohriae and closely related I. fucata, I. recondita usually has four leaves, sometimes three or five, the lower two or three with well-developed blades and the upper one or two partly to almost entirely sheathing. In the length of the perianth tube, ± 12 mm long, I. recondita is intermediate between its two relatives: the tube of I. stohriae is (12-)14-22 mm long, and that of I. fucata 10-15 mm long. Both I. fucata and I. stohriae are Langeberg endemics, the latter recorded from the mountains between Grootvadersbos and Swellendam, while I. fucata occurs further west from Montagu to Keeromsberg, as well as in the Hex River Mtns. The range of I. recondita thus lies between that of its two relatives."
            textZh: SANBI 条目提供了 Ixia recondita Goldblatt & J.C.Manning 的鉴别特征。
