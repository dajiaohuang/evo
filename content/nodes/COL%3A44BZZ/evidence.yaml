    facets:
      morphology:
        status: partially-supported
        claims:
          - text: "Cormous geophyte, up to 120 mm high. Leaf solitary, absent or emergent at flowering, not attached to current flowering stem, terete, 0.5 mm wide. Flowers: flowering stem simple or few branched; style crests 2-3 mm long; perianth with inner segments < 10 mm long, at least 1.5 mm wide, outer segments 12-16 mm long, dark blue to violet with yellow-orange nectar guides on outer segments; Oct.-Dec."
            textZh: Moraea alpina Goldblatt 的 SANBI 物种条目记载了植株、叶片和花部形态。
            sourceIds:
              - sanbi_16273_0
            locator: Strelitzia 38; archive Morphology row 72164, source 16273.0
            placeTimeScope: Regional species account published 2017; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
          - text: Most remarkable for its small size, Moraea alpina stands no more than 120 mm high and is distinguished by the solitary, terete basal leaf, which is absent or emergent from a separate shoot at flowering, as in M. stricta. That species blooms early in the season before the new leaf has emerged, and the leaf attached to the flowering stem is dry or absent. Moraea alpina has deep blue to violet flowers somewhat larger than those of M. stricta and ± globose capsules ± 5 mm long, whereas capsules of M. stricta are club-shaped and up to 10 mm long.
            textZh: SANBI 条目提供了 Moraea alpina Goldblatt 的鉴别特征。
