        usage:
          title: Matayba glaberrima Radlk., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrubs or small trees 4-11 m tall; stems terete, glabrous. Leaves pinnate, 8-25 cm long; leaflets 2-6, obovate-oblong to elliptic, obtuse to acute or bluntly acuminate at the apex, acute to attenuate at the base, 4.5-17 (-20) cm long, 1.3-6 (8) cm wide, entire, revolute, coriaceous, glabrous, often drying brownish at least beneath, the pits in the axils of the veins beneath barbulate. Panicles terminal or subterminal, 10-15 cm long, shorter than the leaves; pedicels appressed- pubescent. Flowers white, ca. 2.5 mm long; calyx lobed more than half way to the base, the lobes ovate to deltoid, less than 1 mm long, appressed-pubescent with a dense tuft of trichomes at the apex; petals deltoid or ovate, 0.5-1 mm long, /-2-2/3 as long as the scales, the scales ca. 0.5-1.5 mm long, divided to the base or nearly so, each obovate to rounded, glabrate to sparsely pubescent on the outer surface, densely pubescent inside; disc weakly lobed, glabrate on the marginal surface, densely short-villous on the upper surface; staminate flowers with the stamens ca. 1.5 mm long, the filaments densely villous in the lower half, the anthers ca. 0.5 mm long, as broad as long, the pollen tacky, pale yellow, the ovary ovoid, densely pubescent, minute; pistillate flowers with stamens ca. 1.3 mm long, the pistil ca. 3 mm long, the ovary and style equally long, the ovary 3-sided, ap- pressed-pubescent, the style weakly appressed-pubescent. Capsules reddish to purple violet, bluntly 3-lobed, ca. 1.5 cm long and 1 cm wide, abruptly long- stipitate, glabrous outside except on stipe, glabrous inside, the septae long- sericeous; stipe 3-4 mm long; seeds bluish, obovoid, shiny, white-arillate, ca. 1 cm long.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 12496
          archiveSourceId: 0526D559-C931-4E53-A95A-F4ACE91A89D5
