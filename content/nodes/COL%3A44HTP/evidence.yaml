        metadataVariant: 0
        usage:
          title: Muehlenbeckia tamnifolia (Kunth) Meisn., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Clambering glabrous lianas, the branches smooth and sulcate, often angulate. Leaves glabrous, ovate, apically usually abruptly acuminate, basally hastate or cordate to acute, the blades mostly 3-8 cm. long, 1.5-4 cm. broad; petioles mostly 8-20 mm. long, glabrous, terete or canaliculate. Inflorescences chiefly of axillary racemes or panicles, the rhachises glabrous, rarely with reduced leaves. Flowers short-pedicellate, the pedicels apically articulated, 0.5-3 mm. long; tepals mostly five, greenish white, ovate, apically subacute to rounded, slightly connate basally, 1.5-3 mm. long, 1-2 mm. broad, glabrous; staminate flowers with 8 (-10) mostly separate stamens about 1 mm. long attached to the lower half of the tepals, the anthers introrse and versatile, about 0.5 mm. long, the ovary a short 3-styled rudiment or absent; pistillate flowers with trigonous superior ovaries with ovate facies; styles 3, strongly arcuate; stigmata fimbrillate-flabellate; stamens reduced to subsessile staminodia. Achenes bluntly trigonous, usually included by the tepals and hardly separable from their bases, often capped by an amorphous mass of stylar
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 10898
