    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Perennial, procumbent, succulent herb, mat-forming; stems rooting at nodes, 4-angled, internodes 5-20 mm long, strigose with white, multicellular hairs; roots fibrous. Leaves ovate to broadly ovate, 12-15 x 10-15 mm, base cuneate, apex obtuse to acute, margins serrate to crenate-dentate, with 3 or 4 pairs of teeth; lower surface sparsely strigose, rubro-punctate. Inflorescence simple, rachis 30-100 mm long; verticillasters 1- or 2-flowered. Flowers white or mauve. Calyx 3-4 mm long at flowering, enlarging to 7 mm, densely strigose. Corolla 9-11 mm long; tube straight, basally saccate, constricted distally; upper lip 2-lobed; lower lip boat-shaped, margins strongly involute. Flowering time Mar.-May.
            sourceIds:
              - sanbi_18344_0
            locator: "SANBI/WFO archive Morphology row 102680; source 18344.0; publication: Bredenkamp, CL; Ngoepe, N. 2019. Lamiaceae. In: CL Bredenkamp (ed.), A Flora of the Eastern Cape Province, Strelitzia 41(2): 1125 - 1164. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: P. lucidus is closely related to P. verticillatus (L.f.) Druce and P. strigosus Benth. (section Plectranthus series Plectranthus), it is distinguished by its 2-flowered verticillasters and short corolla (9-11 mm) of which the lower lip margins are conspicuously inrolled. In both P. strigosus and P. lucidus the corolla is constricted at the throat, unlike P. verticillatus where the corolla is linear. It shares its habitat with other shade-loving coastal plant species such as P. madagascariensis and Scadoxus membranaceus.
