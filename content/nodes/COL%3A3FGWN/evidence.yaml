    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, 10-35 cm, tunics woody, imbricate, stem velvety. Leaves sword-shaped, margins and midrib slightly thickened. Flowers blue-violet, sometimes white, tepals spreading, stamens usually slightly unequal.
            textZh: Geissorhiza aspera Goldblatt 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 6755; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Often locally common, Geissorhiza aspera is recognised by the minutely puberulous stem, plane leaves with slightly thickened margins, and typically glistening, dark blue (sometimes white) flowers with a greenish yellow throat, usually with slightly unequal filaments. The floral bracts are green in bud but as the flowers open they become dry and turn rusty brown at the tips. Plants vary greatly in size depending on soil fertility and available moisture, and may grow up to or even over 300 mm high, or be stunted and less than 100 mm. Although most often blue, plants in the Olifants River Valley and to the north often have partly or entirely white flowers. The stamens are sometimes described as being equal, but careful examination of live plants shows that one filament is usually slightly shorter, and in populations in the north of its range the filaments are clearly unequa.
            textZh: SANBI 条目提供了 Geissorhiza aspera Goldblatt 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 94724; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
