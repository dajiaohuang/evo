    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Perennial, tufted, up to 1 m high. Leaf blades 100-250 mm long, 4-8 mm wide. Spikelets 4-5 mm long, 3 mm wide. Inflorescence a bristly false spike, 40-120 mm long, straw-coloured or purple; bristles mostly 5-10 mm long, inner bristles slender and plumose, outer bristles slender and scabrid, all bristles joined at base below spikelet cluster to form a small inconspicuous disc.
