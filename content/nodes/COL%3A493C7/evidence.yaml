        claims:
          - text: "Deciduous; cauline 3-10 mm long, ± filiform. Stipular sheath with 2 short teeth. Inflorescences terminal, few-flowered panicles in larger plants, lax; peduncles up to 28 mm long. Flowers: pedicels slender up to 38 mm long, heterostylous or isostylous, solitary or 2- or 3-grouped. Calyx: tube subglobose; lobes broadly triangular. Corolla white to pale purple; tube 1.2-3.6 mm long; lobes up to 2 mm long, oblong-ovate. Style 1.2 mm long in short-styled and 2.9 mm in long-styled forms; length intermediate in isostylous forms. Fruit subglobose capsule, not distinctly beaked, valves separated after dehiscence. Flowering time Dec.-Apr. Seeds black, angular, testa reticulate."
            sourceIds:
