    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Like I. paucifolia but corm tunics of fine netted fibres, leaves sword-shaped to sublinear, not falcate, flowers white or pink, yellow in tube, open at night and strongly scented, perianth tube mostly 16-25 mm long.
            textZh: Ixia cedarmontana Goldblatt & J.C.Manning 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 7152; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Recognised by a combination of a relatively long perianth tube, 20-25 mm long, and small to moderate-sized corms with finely fibrous corm tunics. Most populations have white flowers, pale yellow in the throat, but those with pale pink tepals have been recorded. Flowers are sweetly scented and remain open at night. Some white-flowered plants were included by Lewis (1962) in I. paucifolia but that species is distinguished by falcate leaves, coarsely fibrous corm tunics and typically beige flowers with a perianth tube mostly 25-35 mm long. Flowers of I. cedarmontana have ovate tepals 10-16 x 5-8 mm, thus about twice as long as wide, and filaments reaching the apex or exserted up to 4 mm from the perianth tube. The flowers of I. paucifolia are always unscented, have narrower tepals, 12-15 x 3.0-4.5 mm, thus about three to four times as long as wide, and the filaments are consistently exserted 2-3 mm. Because the flowers are scented and remain open at night, moth pollination is inferred for I. cedarmontana. In contrast, flowers of I. paucifolia, a plant of relatively dry, well-drained open clay and shale slopes, are unscented, close at night and are pollinated by long-proboscid flies. Relatively tall plants from the Great Winterhoek Mtns and Bokkeveld Tafelberg, up to 500 mm high, and with deep pink to pale cherry-red flowers and leaves 4-8 mm wide included in the past in Ixia cedarmontana are now regarded as a separate species, I. seracina.
            textZh: SANBI 条目提供了 Ixia cedarmontana Goldblatt & J.C.Manning 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 95072; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
