    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Dioecious, evergreen shrub or small tree to 4 m. Leaves trifoliolate, leaflets sessile, obovate. Flowers pale yellow. Drupes round, smooth, stone with lateral processes.
            sourceIds:
              - sanbi_14073_0
            locator: "SANBI/WFO archive Morphology row 9276; source 14073.0; publication: Moffett, RO. 2012. Anacardiaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 313 - 316. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Leaved morph as well as a glabrous, less revolute morph from inland may be recognized. Without fruit, the inland morph cannot, however, easily be separated from R. pentheri. Rhus refracta is diagnosed by its squarrose spines, the somewhat rugose, revolute and hairy leaflets and by the pruinose, blueish brown drupes with laterally ridged bony seed. A number of collections between the Alexandria Forest and the Great Fish River exhibit features of both this species and the sympatric R. crenata and it is suspected that they are fertile natural hybrids.
            textZh: SANBI 条目提供了该种的鉴别特征。
            sourceIds:
