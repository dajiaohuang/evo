            locator: "SANBI/WFO archive Diagnostic row 51581; source identifier 6616.0; cited publication: Codd, LEW. 2005. Asphodelaceae (First part): Kniphofia, Fl. S. Africa 5(1,2): 1 - 94. South African National Biodiversity Institute, Pretoria. [http://www.biodiversitylibrary.org/item/209560#page/3/mode/1up]. [CC BY]"
