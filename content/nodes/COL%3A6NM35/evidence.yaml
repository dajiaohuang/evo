        claims:
          - text: Rhizomatous perennial, 40-65 cm, forming clumps. Leaves strap-shaped, coarsely fibrotic. Flowers in globose racemes, yellow.
            textZh: Kniphofia citrina Baker 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13857_0
            locator: "SANBI/WFO archive Morphology row 9029; source identifier 13857.0; cited publication: Manning, JC; Goldblatt, P. 2012. Asphodelaceae: Kniphofia Moench. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 77 - 78. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: The affinity of K. citrina is with the K. uvaria complex, a variable group showing several evolutionary trends. One of these trends has been towards reduction in stature, size of inflorescence and length of perianth, combined with shorter and narrower leaves. Its distribution overlaps with K. uvaria and intermediate specimens are found, suggesting that separate species rank for K. citrina is scarcely justified.
            textZh: SANBI 条目提供了 Kniphofia citrina Baker 的鉴别特征。
            sourceIds:
