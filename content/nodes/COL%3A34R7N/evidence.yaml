        usage:
          title: Dendropanax sessiliflorus (Standl. & A.C.Sm.) A.C.Sm., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Trees, the branchlets stout. Leaves chartaceous or thin-coriaceous, broadly elliptic, 11-21 cm. long, 7-13 cm. broad, acute at the apex, obtuse at the base, undulate to serrate, the costa prominent, the primary lateral veins 6-10 per side, arcuate-ascending; petioles 1-7 cm. long. Inflorescences of 6-10 heads arranged in a condensed terminal raceme, the primary peduncle 0.5 cm. long, the primary rhachis 0.5 cm. long, the floriferous peduncles 3-4 cm. long, with several connate bracts at about the middle, articulated immediately above the bracts. Flowers 10-15 per head, 5 -merous; calyx 2-3 mm. long, about 2 mm. in diameter, the lobes deltoid, acute, about 0.7 mm. long; petals deltoid-lanceolate, 2.5-3.0 mm. long, 1.0-1.5 mm. broad, acute and inflexed at the apex; filaments 3 mm. long, the anthers subglobose-oblong, about 0.75 mm. long; styles connate, the stigmas more or less distinct.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 974
