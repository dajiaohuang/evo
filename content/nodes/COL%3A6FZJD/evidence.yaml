    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Tufted, erect, perennial up to 600 mm; rhizome short. Leaf blade 100 x 3 mm flat. Inflorescence lax, open, glandular, branches and pedicels slender, flexuous, nodding; pedicels 4-12 mm long. Spikelet 6-9 x 4-6 mm, ovate, purple; rachilla persistent, lemma and/or palea breaking up from base upwards; glumes subequal, lanceolate in side view, acute; lower glume nearly reaching to apex of lemma above; lemma 4-5 mm long, back rounded, membranous, apex obtuse to truncate; palea falling soon after lemma, keels smooth, wingless, margins not touching, narrowing upwards between keels and margins; anthers 2.5 mm long.
