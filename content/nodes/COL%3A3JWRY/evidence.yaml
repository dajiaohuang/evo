        claims:
          - text: Acaulescent succulent forming dense clumps. Leaves erect, incurved, purplish green, opaque, with reticulate markings, margins and keels with short spines, rarely smooth. Flowers in a slender raceme, white.
            textZh: Haworthia marumiana Uitewaal 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_14539_0
            locator: "SANBI/WFO archive Morphology row 32921; source identifier 14539.0; cited publication: Snijman, DA. 2013. Asphodelaceae: Haworthia. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 54 - 54. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: It is a distinctive species which is not readily confused with other Haworthias. Its nearest relative seems to be H. pulchella from which it may be distinguished by the small bristle-bearing tubercles on the upper side of the leaves, and the small marginal teeth; there are also small differences in the floral parts of the two species.
            textZh: SANBI 条目提供了 Haworthia marumiana Uitewaal 的鉴别特征。
