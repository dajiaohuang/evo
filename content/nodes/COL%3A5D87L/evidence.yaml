          title: Zornia thymifolia Kunth, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Perennial herb; stems prostrate, spreading, to 30 cm long, branched, puber- ulent to glabrous. Leaves 2-foliolate; lower leaflets lanceolate to ovate, obtuse to acute, glabrous to sericeous above, sparsely to densely sericeous below, usu- ally punctate, exstipellate; stipules peltate, 3- to 5-nerved, attenuate above, ob- tuse to acute below, usually punctate, glabrous. Inflorescence spicate, congested, several flowered; bracts ovate, acute, ciliate, glabrous to puberulent, punctate, 5- to 7-nerved, ca. 10 mm long, ca. 5 mm wide, attached basally or nearly so, auricle oblique. Flowers yellow. Fruit 2- to 4-articulate, the articles ca. 2 mm long, ca. 2 mm wide, reticulate, glabrous or rarely puberulent, the bristles gla- brous or retrorsely hairy, eglandular.
