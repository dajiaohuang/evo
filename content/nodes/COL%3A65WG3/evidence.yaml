    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Single-stemmed or branched succulent tree mostly to 4 m, covered below with persistent dry leaves. Leaves dull glaucous-green with slight bluish or reddish tinge, without spots, lanceolate-attenuate, 60-80 cm long; margins narrow, deep to pale pink, with small, pale red teeth. Racemes simple, broadly cylindric, dense, arcuate-erect, ± 0.5 m high. Flowers red in bud, greenish white at maturity, 30-35 mm long; stamens and stigma well exserted.
            textZh: Aloe speciosa Baker 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13850_0
            locator: "SANBI/WFO archive Morphology row 9016; source identifier 13850.0; cited publication: Klopper, RR; Smith, GF. 2012. Asphodelaceae: Aloe L. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 66 - 70. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: A striking feature of A. speciosa is that the rosettes of leaves are almost invariably oblique or tilted sideways, while the leaf margins have a very narrow deep pink to pale red edge, armed with very small teeth of the same colour, and only 1 mm long. When teeth 2-3 mm long are found, and especially if the inflorescence is branched, a hybrid should be suspected.
            textZh: SANBI 条目提供了 Aloe speciosa Baker 的鉴别特征。
