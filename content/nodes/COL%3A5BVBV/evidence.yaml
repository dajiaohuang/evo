    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Perennial herb, geophyte, 0.30-0.45 m high; corm globose, tunics grey-brown, finely reticulate; stem simple. Leaves ensiform, margins and midveins thickened, hyaline. Bracts flushed purple below, upper half becoming dry and brown, inner apically forked. Inflorescence a spike; flowers pale pink, zygomorphic; perianth tube flared above, 7-9 mm long; tepals obovate, 14-16 mm long, curving outwards. Stamens unilateral, arcuate; filaments 7-10 mm long, included; anthers 7 mm long, pale yellow. Ovary oblong; style arching over filaments. Flowering time Aug.-Oct. Capsule narrowly obovoid.
            textZh: Watsonia mtamvunae Goldblatt 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_18505_0
            locator: "SANBI/WFO archive Morphology row 91103; source identifier 18505.0; cited publication: Bredenkamp, CL; Magwaza, ZL. 2019. Iridaceae. In: CL Bredenkamp (ed.), A Flora of the Eastern Cape Province, Strelitzia 41(3): 1821 - 1882. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: One of three early flowering, locally endemic species with pink, funnel-shaped flowers restricted to the southeast coast around the Mtamvuna River Gorge, distinguished by its linear leaves, 3-4 mm wide and usually dry and broken at flowering, the plants thus sometimes apparently leafless, the ± dry bracts, and the small flowers with tepals 14-16 mm long. Watsonia pondoensis from marshy sites has leaves 4-14 mm wide, ± herbaceous bracts, and larger flowers with the lower part of the tube 15-20 mmm long and tepals 20-22 mm long.
            textZh: SANBI 条目提供了 Watsonia mtamvunae Goldblatt 的鉴别特征。
