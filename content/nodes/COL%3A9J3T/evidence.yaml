        claims:
          - text: Annual, tufted (culms erect or geniculately ascending), up to 0.8 m high. Leaf blades 120-200 mm long, 8-15 mm wide. Spikelets 6-9 mm long. Inflorescence with 5-10 spike-like racemes in 1-3 whorls; spikelets 10-15-flowered; glumes and lemmas extending into awns for a third to two-thirds of their length.
