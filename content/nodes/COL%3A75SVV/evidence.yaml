    facets:
      morphology:
        status: not-assessed
        claims: []
        gaps:
          - This handling-behavior study does not assess diagnostic morphology or species-wide morphological variation.
      lifeHistory:
        status: not-assessed
        claims: []
        gaps:
          - The short handling trial does not establish demographic rates, breeding success, or a complete life-history account.
      ecology:
        status: partially-supported
        claims:
          - text: In a post-hoc analysis separating the sexes, male great tits with pecking measurements had higher pecking rates at urban than at paired rural sites (likelihood-ratio test LRT=4.79, p=0.03); the corresponding habitat effect was not detected in females (p=0.95). The overall habitat effect in the full pecking model was not significant (p=0.10). Pecking was counted during a 15-second handling trial within five minutes after capture. This result describes acute handling responses in the sampled populations; it does not establish a global species pattern, local adaptation, or the cause of the difference.
            textZh: 按性别分开的事后分析显示，在有啄击数据的大山雀中，城市地点雄鸟的啄击率高于配对的乡村地点（似然比检验 LRT=4.79，p=0.03）；雌鸟未检测到相应的栖息地效应（p=0.95）。完整啄击模型中的总体栖息地效应并不显著（p=0.10）。啄击是在捕获后五分钟内的 15 秒手持测试中计数的。该结果描述的是所采样种群的急性手持反应，不能证明全球性的物种模式、局地适应或差异成因。
            originalLanguage: en
            sourceIds:
              - senar2017greattit
            locator: Results, male pecking-rate model and post-hoc sex-stratified analysis; Table 5; Methods, Behavioral tests.
            placeTimeScope: Paired urban and rural populations at European localities sampled during 2014–2016. The overall study quantified 1,539 birds at seven paired localities, but pecking/distress-call tests were not recorded in Montpellier and Munich, where only breath rate was measured; the pecking result applies to the sites with those measurements. Barcelona sampling was January–April; other sites were sampled during their local breeding seasons.
            lifeStatus: Free-living wild birds captured at study sites and briefly handled for measurements; captive or domesticated populations were not studied.
        gaps:
          - The handling experiment measures a short acute response in sampled European populations; it does not establish global variation, selection versus plasticity, causal urban mechanisms, or current behavior.
      evolution:
        status: not-assessed
        claims: []
        gaps:
          - The study does not resolve evolutionary history or distinguish genetic adaptation from phenotypic plasticity.
      distribution:
        status: not-assessed
        claims: []
        gaps:
          - Seven paired European locality samples are not a complete geographic range assessment.
      fossil:
        status: not-assessed
        claims: []
        gaps:
          - The study does not assess fossil occurrences or geological age.
      conservation:
        status: not-assessed
        claims: []
        gaps:
          - The behavior comparison does not establish current population trends, threats, or conservation status.
