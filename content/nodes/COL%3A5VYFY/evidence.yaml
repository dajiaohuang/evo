        usage:
          title: Bacopa axillaris (Benth.) Standl., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Erect, sometimes branched herbs, the stems stout, soft, villous with stout, white, weak, uniseriate hairs mostly ca. 0.5 mm long, also with inconspicuous white, sessile glands; roots stout and fibrous. Leaves opposite, oblong or oblanceolate, apically acute, bluntly serrate in the upper '/2, basally acuminate or cuneate to the slightly clasping insertion; to 5 cm long, 10 mm wide, the mid- vein prominent, the minor veins 3-5 on each side, obscure, strongly ascending, somewhat discolorous, dark green and inconspicuously punctate above, pale beneath and conspicuously glandular punctate with brown sessile discoid glands, usually glabrous on both sides except sometimes on the costa beneath. Inflores- cences geminate fascicles of 3-6 flowers in the leaf axils; pedicels 1-2 mm long, glabrous, sometimes with a few sessile glands, conspicuously broadening upwards; bracts 2, scalelike, narrowly ovate, 0.5 mm long at the pedicel apex. Flowers with the sepals distinct, the outer 3 broadly ovate, ca. 3 mm long, 2 mm wide, apically rounded or emarginate, entire or denticulate, the teeth sometimes with short, stout-based white hairs, otherwise glabrous, mostly with a few scattered white or brown sessile glands, palmately 5-nerved, the inner 2 sepals narrow, acute, prominently costate and reticulate, punctate with white and brown sessile glands, slightly shorter than the outer bracts; corolla white, ca. 3 mm long, slightly exserted from the calyx, tubular, contracted towards the middle, glabrous outside, pubescent at the contracted level inside, 4-lobed, the lobes short; stamens 4, the filaments glabrous, ca. 0.75 mm long, inserted at about the same level in the upper ?/2 of the tube, the anthers yellow, 0.5 mm long, the thecae separate; style 1.5 mm long, terete, the stigma horseshoe shaped, erose, peltate on the style. Capsule narrowly conical, 3 mm long, 4-valved, the valves 3-nerved; placentas flat, obtuse; seeds with a brownish, longitudinal reticulum, faboid rectangular, 0.5 mm long.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 12898
