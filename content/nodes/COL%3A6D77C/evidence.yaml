    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants 1.50-1.65 m high, forming clumps. Corm ± 30 mm diam. Stem with lowermost peduncle 45-90 mm long. Foliage leaves several, 800-900 x 6-12 mm; reduced sheathing leaves ± 5. Spikes erect, terminal densely 11- to 13-flowered, laterals ± 10, each 5- to 10-flowered; bracts lanceolate to elliptic, acuminate, 14-20 x 8 mm, 2 or more internodes long, basal 1/3-1/2 green drying brown, often flecked brownish, rest of bract membranous and whitish very sparsely flecked reddish brown or ochre-coloured with midline reddish brown to ochre-coloured, veins many, coalescing below in solid patch. Flowers subrotate, pale magenta-pink with conspicuous red and yellow diamonds at base of tepals; perianth tube (5-)7-8 mm long; tepals 18-19 x 7.0-8.5 mm. Anthers 6-7 mm long. Stigmas held 7-9 mm below top of perianth.
            textZh: Dierama erectum Hilliard 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Morphology row 98552; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: A clump-forming species with stems more than 1.5 m tall, leaves 6-12 mm wide, and erect spikes with partly solid bracts. The flowers are subrotate with a well-marked red and yellow eye at the base of each tepal. Dierama insigne, also with partly solid bracts, has the stems solitary or a few in small tufts, narrower leaves 2-6 mm wide, and pendulous spikes with fewer laterals, mostly 2 to 4.
