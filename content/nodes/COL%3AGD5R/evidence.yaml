        usage:
          title: Ardisia glomerata Lundell, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Trees, to 8 m high, branchlets thick, almost 1 cm in diameter, ferruginous- tomentose with dendroid trichomes, furfuraceous. Leaves with petioles broadly marginate to the base, stout, 2-3.5 cm long, essentially glabrous above; leaf This content downloaded from 192.104.39.2 on Tue, 7 May 2013 17:30:52 PMAll use subject to JSTOR Terms and Conditions326 ANNALS OF THE MISSOURI BOTANICAL GARDEN [VOL. 58 blades large, chartaceous, drying brown, paler beneath, oblanceolate-elliptic, to 36.5 cm long and 16 cm wide, subabruptly acuminate apically, subabruptly narrowed basally, decurrent, broadly marginate, entire, glabrous above, lep- idote beneath, the costa stout, bearing stalked dendroid trichomes, primary veins ca. 40 on each side, with intermediaries. Inflorescences terminal, large, py- ramidal, tripinnately paniculate, to 25 cm long; rachis and branches stout, the lateral and secondary branches short, densely ferruginous-tomentose with dendroid trichomes, and furfuraceous; bracts conspicuous, persistent. Flowers 5-merous, glomerate, numerous; pedicels stout, 1-5 mm long, furfuraceous; calyx coriaceous, furfuraceous, ca. 4 mm long, the sepals depressed orbicular, ca. 3 mm long and 4-5 mm wide, the margin hyaline, ciliate; corolla 7 mm long (in mature bud), the tube ca. 3 mm long, the petals coriaceous, punctate, oblong, ca. 3.5 mm wide, the margin hyaline; filaments wide, ca. 2 mm long, the anthers thick, 4 mm long, dehiscent by apical pores; ovary glabrous, the ovules numerous, large, in several series, the style 6-7.5 mm long, punctate with small black glands. Fruit globose, ca. 9 mm in diameter (dry).
