    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Bulb fairly small, about 7 cm long, 4 cm diam., narrowing into a neck 5 cm or more long, producing new bulbs laterally. Leaves linear, from 50 cm to over 1 m long, 14-25 mm wide near the base, canaliculate above, margins with a narrow cartilaginous edge and sparsely ciliate with cartilaginous hairs. Peduncle lateral, 30 cm or more long, about 1 cm broad near the base, 7 mm thick. Spathe-valves up to 6 cm long, overlapping in the lower half to appear united and encasing the bases of the flowers, (not early reflexing); bracteoles narrowly linear. Umbel few-flowered, 4-7-flowered; pedicels 1-4.5 cm long. Perianth with a cylindric, cernuous tube, crateriform at the apex, and about 5 cm long; segments 4-5 cm long, 1.5-2 cm broad in the j middle conniving to form a shallow cup in the lower half with only the apices spreading to somewhat recurved, white, mottled or suffused with shades of rose, becoming deep rose as they mature, usually with a green eye in the centre within. Stamens equally disposed, subarcuate erect, faintly suffused with rose. Style eventually overtopping the stamens, stigma capitate. Fruit subglobose, about 2.5 cm diam., not beaked.
