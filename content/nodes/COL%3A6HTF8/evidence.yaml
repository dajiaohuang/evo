        claims:
          - text: Perennial, rhizomatous, up to 0.8 m high. Leaf blades 80-200 mm long, 2-8 mm wide. Leaves cauline, blades expanded; ligules shorter than 1 mm. Spikelets 10-12 mm long. Panicle open, up to 250 mm long, branches flexuous, bare for the longest part, with 1-5 spikelets near tips; spikelets 3-7-flowered; lemmas awned, awn 2-4 mm long.
