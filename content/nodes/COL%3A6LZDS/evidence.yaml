    identity:
      method: Exact accepted COL26.8 usage verified in the release-pinned ChecklistBank search registry, then followed through every accepted parent node in the pinned hierarchy registry.
      scope: Exact accepted COL26.8 species usage 6LZDS. The evidence concerns survival after experimental releases of hatchery-cultured juveniles into four seagrass sea pens near Kavieng, Papua New Guinea; it does not estimate survival for wild-born sandfish or the whole species.
      sourceIds:
        - col
    lifeStatusScope:
      wild: Released juveniles occupied natural seagrass habitats in sea pens, but were hatchery-cultured and not a wild-born cohort.
      domesticated: The study concerns cultured juveniles used in a ranching experiment; it does not assess the history or breadth of domestication.
      captive: Juveniles were temporarily protected in open sea pens under three release treatments; this is not a captive life-history study.
      fossil: Fossil occurrence and geological age were not assessed.
