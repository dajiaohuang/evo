      ecology:
        status: partially-supported
        claims:
          - text: At the first recovery measurement after releases of hatchery-cultured juvenile Holothuria scabra into 100 m² seagrass sea pens near Kavieng, Papua New Guinea, overall survival was 93.5% at Limanak 1, 84.6% at Limanak 2, and 52.7% at Enuk; no juveniles were found at the fourth site, Ungakum. These site-level results combine the study's free-release, one-day cage, and seven-day cage treatments and describe this short ranching experiment only.
            textZh: 在巴布亚新几内亚卡维恩附近的 100 平方米海草围栏中放流人工孵化幼参后进行的首次回收测量显示，Limanak 1、Limanak 2 和 Enuk 的总体存活率分别为 93.5%、84.6% 和 52.7%；在第四个地点 Ungakum 未发现幼参。这些地点级结果合并了研究中的直接放流、笼护 1 天和笼护 7 天处理，仅描述这项短期海参牧场试验。
            originalLanguage: en
            sourceIds:
              - hair2016holothuria-release-survival
            locator: Abstract for hatchery origin, approximate juvenile size, sites, and total-loss limitation; §2.4 and Table 1 for release dates and protection treatments; §3.2 Results and Fig. 3 for first-recovery site survival and no recovery at Ungakum.
            placeTimeScope: Limanak 1, Limanak 2, Enuk, and Ungakum, seagrass meadows near Kavieng, New Ireland Province, Papua New Guinea; releases on 22 March, 15 May, and 15 July 2014; first recovery approximately two months after release.
            lifeStatus: Hatchery-cultured juveniles released into natural seagrass habitats within experimental sea pens; not wild-born individuals or an unmanipulated wild population.
        gaps:
          - Short-term recovery of hatchery juveniles at four experimental sites does not establish natural survival, long-term population recruitment, species-wide habitat suitability, or regional wild population status.
