        usage:
          title: Columnea illepida H.E.Moore, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Suffrutescent herbs; stems 4 mm in diam. (8-9 mm in cultivation), yellowish hirsute. Leaves of a pair strongly unequal; larger leaf lanceolate to oblanceolate, 6.9-12.5 cm long and 2.5-5.1 cm wide, the apex abruptly acute acuminate, oblique at the base, denticulate, above green, hirsute, hairs transparent or reddish espe- cially near the margins of the leaf, 6-9 celled, below red blotched or red concolor- ous, hirsute, the hairs transparent or reddish, 5-7 celled, more numerous on the veins, also 2-3 celled white adpressed hairs; petioles 4-21 mm long; smaller leaves ovate lanceolate, acute, ca. 1.0 cm long and 5 mm wide, caducous. Flowers solitary or several in each axil; bracts linear, ca. 2 mm long, hirsute; pedicels ca. 1.8 cm long, transparent hirsute; calyx lobes 3-5 toothed, the teeth 2 mm long, the lobes, 1.4-1.8 cm long, green, transparent hirsute; corollas yellow with dark red stripes arising from the margins of the lobes, ca. 5.3 cm long, funnel shaped but slightly swollen, the appendages between the lobes 1 mm long, yellow, the tube 3-4 mm in diam. above the base, becoming ca. 10 mm in diam. at the middle, contracted to about 8 mm at the throat, externally sparsely hirsute, the lobed portion of the corolla ca. 9 mm long, the lobes slightly unequal, 2 posterior lobes connate, the anterior lobe ca. 4 mm long; filaments pilose towards the base, the anthers included; ovary pilose, style slightly pubescent, yellow, the stigma bibbed. Fruits ovoid, gray white, pubescent.
          originalLanguage: en
          sourceField: general
