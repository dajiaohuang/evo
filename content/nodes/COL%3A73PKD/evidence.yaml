    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants 70-150 mm high. Corms 12-15 mm diam.; tunics wiry, dark brown, accumulating in a dense mass, becoming finely netted distally. Stem simple or 1- or 2-branched, branches usually shortly emerging from subtending sheathing leaf, ascending, bearing ± dry, attenuate sheathing leaves ± 20 mm long. Foliage leaf solitary, usually slightly longer than stem, channelled to ± flat, mostly 3-5 mm wide, laxly twisted, trailing to ± prostrate, margins pale, thickened, undulate to crisped. Rhipidial spathes becoming dry at flowering time, often lacerated, inner 25-30 mm long, outer ± 2/3 as long. Flowers fugaceous, pale blue-mauve to almost white, outer tepal limbs with large yellow nectar guides with white centre at bases, half reflexed; outer tepals 22-28 x ± 12 mm, limbs 15-18 mm long, claws 8-10 mm long (thus ± half as long as limbs); inner tepals 18-25 x ± 5 mm, limbs ultimately half reflexed. Filaments 8-9 mm long, united in lower half; anthers 3.5-5.0 mm long, pale mauve; pollen white. Ovary narrowly ellipsoid, ± 7 mm long, included; style branches ± 7.5 mm long, crests 8-12 mm long, lanceolate. Capsules ± ellipsoid, 8-9 mm long, with beak ± 1 mm long. Seeds unknown.
            textZh: Moraea quartzicola Goldblatt & J.C.Manning 的 SANBI 物种条目记载了植株、叶片和花部形态。
            sourceIds:
              - sanbi_18638_0
            locator: Strelitzia 42; archive Morphology row 97814, source 18638.0
            placeTimeScope: Regional species account published 2020; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
          - text: With a solitary, twisted and trailing leaf with undulate to crisped margins, Moraea quartzicola appears to be closely allied to the Namaqualand species M. saxicola but is distinguished by its smaller stature, up to 150 mm high, and smaller spathes and flowers, the outer tepals 22-24 mm long with short claws 8-10 mm long, the limbs thus almost twice as long. Moraea saxicola, always a taller plant, rarely < 250 mm high, has inner rhipidial spathes 40-60 mm long (vs. 25-30 mm), and outer tepals 30-40 mm long with the claws about as long as the limbs. Other floral parts of M. saxicola are likewise larger that those of M. quartzicola.
