          originalSourceText: Good-sized tree, the younger parts thinly furfuraceous but soon glabrescent. Petioles 1.5-3 cm. long. Leaf-blades oblong-elliptic, 10-15 cm. long, about half as wide, very abruptly acuminate, entire, minutely expanded at the obtuse base and bearing a median dorsal tubercle on the summit of the petiole, 5-nerved; panicle many-flowered, divergently branched, 1-3 dm. long, the flowers in ter- minal umbels on pedicels 5-10 mm. long; hypanthium and calyx together about 8 mm. wide; petals blood-red, 10-15 mm. long; anthers about 6 mm. long, the dorsal appendage white, rounded, nearly 4 mm. high.
