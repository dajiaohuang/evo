    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Annual herb with numerous prostrate or decumbent branches which are densely branched, up to 40 cm long, usually becoming somewhat woody. Leaves (0.8)3.5 x (0.5)1.5 cm; lamina narrowly obovate or ovate in outline with cuneate base, to broadly ovate with rounded base; margins irregularly crenate or serrate to pinnately lobed; petiole 0.6-1.0(2.0) cm long, lanate. Flowers showy; peduncles (3)5-8(14) mm long. Calyx c. 10 mm long, cinnamomeous-lanate; calyx-tube cyathiform, c. 2 x 3.5-4 mm, prolonged into a terete false tube 3-5 mm long as in N. austroafricana; calyx-lobes narrowly oblong, ending in a triangular point c. 4 x 1.3 mm. Petals c. 21 x 11 mm, obovate, unguiculate, lemon-yellow. Stamens dimorphous; the 5 oppositipetalous ones c. 5 mm long, the alternipetalous ones up to 12 mm; filaments glabrous. Styles hairy, of 2 sizes in each flower, c. 5 or c. 7 mm long. Fruit c. 10 mm in diameter, discoid, slightly depressed, crowned by the persistent styles and marcescent calyx-segments; upper part bearing 2 series of stout, usually straight prickles; inner series comprising 10 erect prickles 6-8 mm long; outer series comprising 5 prickles c. 5 mm long; lower part of fruit produced laterally into a circular wing 1-2 mm wide, the margin bearing spines (in 10 groups of 3) 2-3 mm long, which are extensions of the nerves of the wing.
