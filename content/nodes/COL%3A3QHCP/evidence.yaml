        usage:
          title: Ixora nicaraguensis Wernham, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrubs or trees, to 7.5 m tall, the twiglets drying grey, smooth, glabrous, somewhat twisted. Leaves elliptic, oblong or oblanceolate, 7-16 cm long, 2-7 cm wide, short to long acuminate at the apex, acute at the base, the lateral veins 10- 15, slender, arcuate, prominulous, the intervenal areas spreading reticulate, char- taceous, discolorous, glabrous; petioles 0.4-1.0 cm long; stipules free, triangular, 0.5-0.8 cm long, acuminate to caudate acuminate at the apex. Inflorescences cymose paniculate, spreading, sessile or pedunculate, the peduncles 5-9 cm long, the branches paired, few, well spaced, many flowered; pedicels to 5 mm long. Flowers with the hypanthium turbinate, ca. 1 mm long, puberulent, the calycine cup 0.5 mm long, stiffly carnose, rubescent, glabrous, eglandular within, the teeth absent or scarcely developed; corolla white, the tube cylindrical, 3--5 mm long, glabrous outside, glabrous within except villose at the mouth, the lobes 4, oblong, 3-4 mm long, rounded, rubescent, subcarnose; anthers 4, narrowly ovate oblong, 3 mm long, acuminate, the acumen petaloid, the filaments 1 mm long; ovarian disc ca. 0.3 mm long, the style linear, 3 mm long, the stigmas oblong, ca. 1.5 mm long. Fruits pink, rotund to oblong rotund, to 4 mm in diam., smooth, glabrous.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 17107
