        claims:
          - text: Acaulescent, cormous geophyte, 6-7 cm. Leaves lanceolate, hairy. Flowers zygomorphic, mauve with yellow and purple markings, stamens unequal, 1 longer, stigmas flattened and orbicular, ovary smooth, inner bracts divided to base.
            textZh: Babiana montana G.J.Lewis 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 6707; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Readily recognised by the unusual, coarsely fibrous corm tunics that form a distinctive hard, cylindric collar around the stem base, Babiana montana has blue-mauve flowers with unequal filaments, the median one longer than the other two. In addition, the style branches have prominent orbicular tips, a character rare in the genus. The smooth ovary also stands out in sect. Babiana but this feature is shared with a few other species, including B. ambigua and B. fourcadei. Babiana montana can also be distinguished from B. ambigua by the thick collar of fibres about the underground part of the stem, a feature lacking in the latter, as well as the unequal stamens. Plants from limestone habitats west of Bredasdorp have smaller bracts than is usual, 12-14 mm long, and smaller flowers about 40 mm long, but have the unequal stamens typical of the species.
            textZh: SANBI 条目提供了 Babiana montana G.J.Lewis 的鉴别特征。
