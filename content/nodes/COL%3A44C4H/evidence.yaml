    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants 300-450 mm high. Corm 9-12 mm diam.; tunics of pale, fine fibres. Stem simple, rarely 1-branched, sheathing leaves 45-55 mm long, green with dry attenuate apices. Foliage leaf solitary, linear, channelled but with margins folded together, 0.7-1.5 mm diam., exceeding stem, often trailing above, sometimes with cormlet in axil. Rhipidial spathes with dry, brown, attenuate tips, inner 35-40 mm long, outer ± half as long. Flowers long-lived, purple, outer tepal limbs with white, wedge- or V-shaped, minutely papillate nectar guides at bases, dark purple in centre, laxly spreading; outer tepals 20-23 mm long, claws 8-9 mm long, with wide, dark violet median stripe, limb 12-15 x 6-8 mm; inner tepals 7-10 mm long, ± erect, 3-lobed, lateral lobes rounded, central lobe 3-4 mm long, tapering to attenuate, laxly twisted apex. Filaments 3.5-4.0 mm long, united in lower ± 2 mm; anthers 4.5-6.0 mm long, sometimes shortly exceeding stigma lobe, dark purple-black; pollen orange-red. Ovary narrowly oblong, 7-9 mm long, usually exserted in mature flower; style branches 7-9 x 1-2 mm, crests narrowly wedge-shaped, ± 5 mm long, erect. Capsules narrowly ovoid, 8-11 mm long. Seeds angular, 1.2-1.5 mm long, angles forming raised, pale, ± spongy ridges.
            textZh: Moraea decipiens Goldblatt & J.C.Manning 的 SANBI 物种条目记载了植株、叶片和花部形态。
            sourceIds:
              - sanbi_18638_0
            locator: Strelitzia 42; archive Morphology row 97864, source 18638.0
            placeTimeScope: Regional species account published 2020; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
          - text: Named for the deceptive appearance of the flowers to those of the common and widespread M. tripetala, M. decipiens differs in having the inner tepal claws distinctly expanded distally, sometimes into three rounded lobes, with the limb linear-attenuate and curved inward distally. The inner tepals recall those of M. unguiculata and M. algoensis but unlike those species, the filaments of M. decipiens are ± 3.7 mm long and shortly united for ± 2 mm and the style branches diverge above the fused part of the filaments whereas in M. unguiculata and M. algoensis the filaments are united almost to their apices in a well-developed thick column. The style branches of M. decipiens are relatively short, ± 7 mm long, whereas those of M. tripetala are usually 9-12 mm long. The markings on the outer tepal limbs are also notable, consisting of a wedge- or V-shaped white zone surrounding a dark purple basal mark continuous as a wide, longitudinal purple streak on the claws. Typical M. tripetala occurs at higher elevations on the Piketberg but flowers some two to four weeks earlier.
