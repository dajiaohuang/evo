    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, 15-70 cm, stem with short lateral branchlets. Leaves 3, sword-shaped to falcate, uppermost leaf sheathing the stem. Flowers few in a straight spike, half nodding, white to pale mauve or pink, often sweetly scented, perianth tube funnel-shaped, 13-16 mm, filaments included.
            textZh: Ixia namaquana L.Bolus 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 7143; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Readily distinguished in the I. rapunculoides complex by the longer perianth tube, mostly 13-16 mm long, short branchlets bearing 1 or 2 flowers each, and corm with tunics of coarse, netted fibres. The flowers are relatively large with tepals mostly 14-16 mm long and anthers 3.5-4.5 mm long. The proximal halves of the tepals form a floral cup that fully encloses the stamens. The flowers are usually sweetly scented but are appear unscented in the Bokkeveld Mtns. Pink-flowered plants with a perianth tube 16-20 mm long from Hex River Pass and nearby identified in the past as I. namaquana are a different species, I. oxalidiflora, distinguished by the longer perianth tube, suberect rather than horizontally oriented flowers, fully included anthers, and most significantly by the corms with papery to finely fibrous tunics and bearing ribbon-like stolons. The type of Ixia namaquana from Klipfontein near Steinkopf in northern Namaqualand has particularly large flowers, with the tube up to 18 mm long, and the style divides opposite the anther tips with the branches extending above them. The northern populations need additional study.
            textZh: SANBI 条目提供了 Ixia namaquana L.Bolus 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 95079; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
