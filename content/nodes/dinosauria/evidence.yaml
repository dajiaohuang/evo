  claims:
    - subjectId: taxon:dinosauria
      claimKind: scientific
      claimType: fossil-range
      statement: Buriolestes ULBRA-PVT280 from the approximately 233.2 Ma assemblage anchors the 233.2–0 Ma Dinosauria route, with living birds extending the navigation span; the specimen does not establish a global dinosaur FAD or direct ancestry.
      confidence: medium
      confidenceRationale: The named specimen, assemblage context and morphology matrix are primary evidence. Living continuation belongs to the atlas navigation closure, while the fossil endpoint remains local and sample-bounded.
      referenceLinks:
        - referenceId: cabreira-2016-buriolestes
          relation: supports
          pages: 3090–3095
          figure: Figures 1–4; Supplemental Information
          quoteLocator: Holotype and assemblage; radiometric context; phylogenetic analysis
  claim-rationales.zh:
    - 具名标本、组合背景及形态矩阵属于一手证据；现生延续来自图谱导航闭包，而化石端点仍局限于当地样本。
  claim-statements.zh:
    - 约 233.2 Ma 生物组合中的 Buriolestes 正模 ULBRA-PVT280 锚定 233.2–0 Ma 的恐龙路线，现生鸟类把导航跨度延续至今；该标本不确立恐龙全球首现或直系祖先。
