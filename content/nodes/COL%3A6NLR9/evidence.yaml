    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants caulescent, 1-4-stemmed; stems up to 250 mm tall. Leaves recurved, stiff in texture, 0.6-1.0 m long, 22-45 mm broad, V-shaped in cross section; margin and keel finely serrulate. Scape 0.8-1.2 m tall, overtopping leaves. Raceme ovoid, 110-220 x 50-70 mm, dense; buds purplish orange; flowers pale yellow-green, sometimes tinged with orange. Bracts lanceolate to narrowly lanceolate, subacute to slightly obtuse, 18-22 mm long; margin minutely eroso-denticulate in upper half. Pedicels 2 mm long, increasing to 5-7 mm long in fruit. Perianth narrowly funnel-shaped, 30-35 mm long; lobes ovate, 2-3 mm long, not spreading. Stamens exserted by up to 5 mm at anthesis. Fruit ovoid, 11-13 mm long.
            textZh: Kniphofia albomontana Baijnath 的 SANBI 物种条目记录了形态特征。
