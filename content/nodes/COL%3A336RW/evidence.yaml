    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Glabrescent, twiggy shrublet to 60 cm. Leaves linear, often 3-5-lobed and hooked at tips, base often with 2 short lobes. Flower heads radiate, solitary on short terminal peduncles, often nodding, yellow with white rays.
            sourceIds:
              - sanbi_14131_0
            locator: "SANBI/WFO archive Morphology row 11318; source 14131.0; publication: Manning, JC; Goldblatt, P. 2012. Asteraceae: Cymbopappus B.Nord. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 368 - 368. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Cymbopappus adenosolen differs from its congeners by the absence of a distinct pedunculoid portion on the flowering branches. Thus the capitula appear sessile or nearly so. There is much variation in leaf-shape within the species, from lobed and short leaves (less than 1 cm long) to simple and filiform leaves (more than 2 cm long). The latter types have been distinguished as var. filifolium. The shrubs have a somewhat karroid appearance, resembling e.g. shrubby species of Pentzia, and in herbaria they are sometimes also confused with Phymaspermum leptophyllum (DC.) Bth.
