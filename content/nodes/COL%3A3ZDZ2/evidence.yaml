    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Suffrutex, main stem erect with many slender branches (no new growth from the base), 60-90 cm tall, new growth off-white tomentulose, stipules subulate, about 3 mm long, persistent. Leaves comparatively thin-textured, broadly ovate to ovate- oblong, sometimes broadly oblong, 1-4.5 cm long, 0.7-2.5 cm broad, very shortly stellate-tomentose on both surfaces, lower surface silvery-grey and sometimes with reddish brown stellate hairs from lepidote scales scattered on the raised nerves, upper surface darker and more uniformly stellate-tomentulose, rounded to shallowly cordate at the base, broadly rounded or rarely subacute at the apex, margins shallowly crenate-dentate; petiole 0.5-1.5 cm long. Inflorescence axillary 1-2-flowered, peduncles slender, 0.5-2 cm long, pedicels 0.3-1.2 cm long, in single-flowered inflorescence the peduncle and pedicel are indistinguishable and up to 2 cm long. Epicalyx-bracts lanceolate-acuminate to ovate-lanceolate (not broadest at the base), 6-9 mm long, 2.5-3.5 mm broad, felted on both surfaces with short off-white stellate tomentum. Calyx with lobes lanceolate-acuminate, about 9 mm long and 3 mm broad, dorsally stellate-tomentulose. Petals lemon-yellow, about 10 mm long, 5-8 mm broad at the apex. Stamens with filaments about 0.5 mm long, anthers about 2.5 mm, united portion, 1 mm long, staminodes ligulate, about 5 mm long. Ovary subglobose, stellate-tomentose; style 3-7 mm long, branches about 1.5 mm long; ovules about 5 in a cell. Capsule subglobose, about 6 x 6 mm, densely and shortly stellate-tomentose.
