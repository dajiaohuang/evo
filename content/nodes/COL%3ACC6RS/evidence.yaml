    facets:
      morphology:
        status: partially-supported
        claims:
          - text: In the species description, fresh apothecia were 1.3–3.5 mm wide (mean 2.5 ± 0.7 mm, n=13); dry apothecia were 0.9–1.3 × 0.6–0.9 mm (mean 1.1 ± 0.15 × 0.7 ± 0.12 mm, n=13). The sampled apothecia were gregarious, superficial, hourglass-shaped or cupulate, glabrous, and had a wide stipe.
            originalLanguage: en
            sourceIds:
              - li2024
            locator: Species treatment T. clepsydriformis, Description; Figure 5; holotype HKAS 128275
            placeTimeScope: The article reports a type collection from Jingdong County, Puer City, Yunnan, China (2455 m; 2022-08-23) and three other dated collections in Yunnan from 2021–2022. This is the study’s collection scope, not a global range.
            lifeStatus: Claims apply to the field collections and taxonomic account identified by the cited voucher; do not infer beyond those specimens.
        gaps:
          - The account describes measured collection material, but a genus-wide diagnosis, additional populations, developmental stages, and within-species variation were not systematically assessed.
      lifeHistory:
        status: not-assessed
      ecology:
        status: partially-supported
        claims:
          - text: The authors describe this fungus as saprobic on decayed oak branches; listed specimens were collected on decayed oak twigs or other decayed wood, including two records with ant nests.
            originalLanguage: en
            sourceIds:
              - li2024
            locator: Species treatment T. clepsydriformis, Description and Material examined; holotype HKAS 128275
            placeTimeScope: The article reports a type collection from Jingdong County, Puer City, Yunnan, China (2455 m; 2022-08-23) and three other dated collections in Yunnan from 2021–2022. This is the study’s collection scope, not a global range.
            lifeStatus: Claims apply to the field collections and taxonomic account identified by the cited voucher; do not infer beyond those specimens.
        gaps:
          - The source describes substrate and saprobic habit, but interaction mechanisms, host identity for unidentified wood, seasonality, and population ecology remain unassessed.
      evolution:
        status: partially-supported
        claims:
          - text: In the combined LSU and ITS phylogeny, the study collections of T. clepsydriformis clustered with T. griseoturcoisina (85% maximum-likelihood bootstrap, 0.96 Bayesian posterior probability). This is a placement in that study’s sampled tree, not a divergence-time estimate.
            originalLanguage: en
            sourceIds:
              - li2024
            locator: Results, Phylogenetic analyses; Figure 2; Figure 3C; discussion of provisional genus placement
            placeTimeScope: The article reports a type collection from Jingdong County, Puer City, Yunnan, China (2455 m; 2022-08-23) and three other dated collections in Yunnan from 2021–2022. This is the study’s collection scope, not a global range.
            lifeStatus: Claims apply to the field collections and taxonomic account identified by the cited voucher; do not infer beyond those specimens.
        gaps:
          - The placements are specific to one study’s sampled taxa and loci; broader phylogenomic evidence, alternative topologies, and divergence times were not reviewed. The authors also note that genus placement remains provisional because the type species lacks genetic data.
      distribution:
        status: partially-supported
        claims:
          - text: The treatment lists the type at Jingdong County, Puer City (2455 m, 2022-08-23), plus collections at Panlong District, Kunming (1920 m, 2022-05-29), Yeya Lake (1900 m, 2021-07-03), and Sanjian Mountain (1950 m, 2021-12-18). These are the documented study localities.
            originalLanguage: en
            sourceIds:
              - li2024
            locator: Species treatment T. clepsydriformis, Holotype and Material examined; vouchers HKAS 128275, 128266, 128264, 128267
            placeTimeScope: The article reports a type collection from Jingdong County, Puer City, Yunnan, China (2455 m; 2022-08-23) and three other dated collections in Yunnan from 2021–2022. This is the study’s collection scope, not a global range.
            lifeStatus: Claims apply to the field collections and taxonomic account identified by the cited voucher; do not infer beyond those specimens.
        gaps:
          - Only the named Yunnan study collections were reviewed; no global occurrence search, georeferenced range boundary, or native/introduced assessment was completed.
      fossil:
        status: not-assessed
      conservation:
        status: not-assessed
