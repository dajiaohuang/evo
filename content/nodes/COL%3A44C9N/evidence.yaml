    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Geophyte, up to 400 mm tall. Outer tepals 18-25 mm long, 5-9 mm wide. Corm 10-20 mm in diameter with black, reticulate tunics. Leaf solitary, basal, falcate or erect. Flowers yellow and dark yellow and green.
            textZh: Moraea pallida (Baker) Goldblatt 的 SANBI 物种条目记载了植株、叶片和花部形态。
            sourceIds:
              - sanbi_11118_0
            locator: Strelitzia 6; archive Morphology row 904, source 11118.0
            placeTimeScope: Regional species account published 1997; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
          - text: Despite its several synonyms, Moraea pallida is relatively uniform both in the small yellow flowers and low stature with a solitary leaf clasping the lower half of the stem. The flowers have spreading tepal limbs 16-24 mm long and erect claws, ± 3 mm long, clasping the lower part of the filament column. Somewhat unusually for the genus, the filaments are free and diverging distally for 1-2 mm, a feature shared with M. cookii to which it appears to be closely related. The relatively short style branches reach only to the middle of the anthers but have short crests, either erect or curving inward. Populations from KwaZulu-Natal differ somewhat in having numerous small cormlets around the base of the parent corm and even in the axils of the foliage and sheathing leaves. Plants bloom in spring to early summer usually at the end of the dry winter, before the onset of the summer-rainfall season.
