        usage:
          title: Cosmos crithmifolius Kunth, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Erect, branched perennial herb, sometimes woody near the base, to 1 m tall; stems slender, green, glabrate, the angles conspicuously lighter in color. Leaves to 10 mm long, pinnate, the segments and petiole linear, evenly 1-2 mm wide, the midvein conspicuous on both sides. Inflorescence of 1-4 heads at a terminal node; peduncle slender, angled, to 20 mm long, sometimes with 1 or 2 alternate or opposite, scalelike bractlets along their length. Heads radiate, showy; outer involucral bracts narrow, herbaceous, drying with the veins elevated, 4-8 mm long, the inner bracts almost twice as long, hyaline, broad, colored or not; ray florets ca. 5, bright pink, the limb broad, apically 3-dentate, conspicuously longitudinally sulcate or nerved with scattered, long white hairs near the base on the dorsal surface, the tube 2-3 mm long; disc florets numerous, the corolla yellowish or pinkish, cylindrical, ca. 10 mm long, the lobes dorsally puberulent, the anthers black, the appendages ca. 0.8 mm long, the style branches compressed, ?glandular, the apex and the caudex pilose. Achene brown, ascending-strigulose, with 1-5 stiff, erect, retrorsely strigose awns.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 1776
          archiveSourceId: F57BE69E-227F-4AF6-B59E-46EC73DB3B59
