      ecology:
        status: partially-supported
        claims:
          - text: In the captive open-diffusion experiment, two social groups included 23 Saimiri boliviensis overall; among 21 observers, 12 solved the apparatus task at least once. The paper reports that solvers preferentially used the response direction modeled by a demonstrator. This is a result from one captive task and does not establish wild social learning or a species-wide cognitive capacity.
