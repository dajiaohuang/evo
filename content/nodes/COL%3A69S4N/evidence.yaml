        usage:
          title: Chiococca alba (L.) Hitchc., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Vines or shrubs (trees?), the twiglets smooth, glabrous, usually ultimately wiry, the branchlets perpendicular, opposite. Leaves ovate oblong, oblong, rarely rotund, 2.2-13.5 cm long, 1.3-6.0 cm wide, tapering acutely, obtuse or somewhat rounded toward the apex, often acuminate, the acumen often arising from a con- tracted apex, 1.0-1.5 cm long, acute or obtuse, often falcate, basally acute, at- tenuate acute, obtuse or rounded, the costa slender, prominulous above and beneath, the lateral veins 4-5, arcuate, uniting to form a submarginal vein 4-5 mm from the margin in the larger blades, the intervenal areas smooth, the fine endings of the venules regularly evanescent, stiffly papyraceous to subcoriaceous, usually glossy above, glabrous; petioles to 0.8 cm long, glabrous; stipules often persistent, widely triangular to oblong, 1.5-5.0 mm long, acute or contracted at the apex into a median subulate awn, to 4 times the length of the body. Inflores- cences axillary, solitary, or often 2 per node, 2.5-8.0 cm long, racemiform or paniculate, the flowers occasionally solitary or in sessile cymules; peduncles slen- der, 0.7-7.0 cm long, ca. 0.35 mm wide, glabrous, the lowermost branches to 4.5 cm long. Flowers pedicellate, the pedicels 2-5 mm long; hypanthium subrotund, somewhat compressed, glabrous, the calycine cup ca. 1 mm long, the teeth acute, 5, about as long as the carnose, glabrous, eglandular cup; corolla white or yellow, urn shaped, 3-4 mm long, glabrous inside and out, petaloid, the lobes 5, oblong, slightly shorter than the tube, tapering obtusely; stamens 5, the anthers at first linear, then narrowly oblong, ca. 4 mm long at anthesis, the filaments slender, 1.2 mm long, pubescent, at the very base connate into a ring adnate to the corolla tube; style linear, 5-6 mm long, the stigmatic area turgid, to 1.3 mm long, the 2 lobes obtuse. Fruits white, fleshy, compressed, 4-8 mm in diam., the persistent calyx short.
          originalLanguage: en
          sourceField: general
