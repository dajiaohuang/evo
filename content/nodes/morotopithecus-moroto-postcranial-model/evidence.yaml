    - subjectId: event:morotopithecus-moroto-postcranial-model
      claimKind: scientific
      claimType: ecology
      statement: MUZM 60 and MUZM 80 preserve separate early Miocene shoulder and femoral anatomies used to reconstruct a mixed arboreal locomotor repertoire; they are not one individual or direct crown-hominoid ancestor.
      confidence: medium
      confidenceRationale: Medium confidence reflects detailed measurements and comparisons while preserving cross-locality association, taxonomic attribution and functional reconstruction as separate inference steps.
