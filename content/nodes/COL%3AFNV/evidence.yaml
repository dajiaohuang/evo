  atlas-node:
    name: Rhinocerotidae
    commonName: True Rhinoceroses
    commonNameZh: 真犀牛类
    rank: family
    taxonId: txn:43187
    firstAppearance: 40
    lastAppearance: 0
    extinct: false
    entityKind: taxon
    contentLevel: dossier
  claims:
    - subjectId: taxon:rhinocerotidae
      claimKind: scientific
      claimType: topology
      statement: The ceratomorph character analysis includes Rhinocerotidae within the sampled “true rhinocerotoid” branch, while the living-species data combination independently treats the family as one extant ceratomorph lineage; neither analysis supplies a complete fossil family range.
      confidence: medium
      confidenceRationale: Two primary analyses support the higher placement from fossil morphology and living data respectively. The claim explicitly withholds total duration.
      referenceLinks:
        - relation: supports
          referenceId: bai-2020-ceratomorpha
          pages: Article 509
          figure: Figure 7
          quoteLocator: "Phylogenetic analysis: true rhinocerotoids"
        - relation: supports
          referenceId: price-2009-perissodactyl-phylogeny
          pages: 277–292
          quoteLocator: Extant family-level supertree and supermatrix results
  claim-rationales.zh:
    - 两项一手分析分别以化石形态和现生数据支持高阶位置；主张明确不陈述总延续范围。
  claim-statements.zh:
    - Ceratomorpha 性状分析把犀科纳入取样的“真正犀总科”分支，而现生物种联合数据分析独立地将该科视为现生 Ceratomorpha 的一个谱系；两项分析都不提供完整的化石科级范围。
  ranges:
    - entityId: rhinocerotidae
      rangeKind: global-composite
      taxonomicConcept: Rhinocerotidae numerical range withheld pending a direct family-wide fossil synthesis
      geographicScope: No defensible global numerical scope established
      olderMa: 0
      youngerMa: 0
      status: withheld-pending-provenance
      uncertainty:
        olderMa: null
        youngerMa: null
        note: The available sources provide early-rhinocerotoid and living-family topology, not a complete family range.
      evidenceBasis: The former 40–0 Ma display is withheld because the cited studies address early rhinocerotoid relationships and extant species topology without validating a family-wide fossil first appearance.
      confidence: low
      claimIds: []
      referenceLocators:
        - referenceId: bai-2020-ceratomorpha
          locator: Article 509; Figure 7; true-rhinocerotoid topology and sampled fossil placements
        - referenceId: price-2009-perissodactyl-phylogeny
          locator: pp. 277–292; extant Rhinocerotidae results; no complete fossil family range
      evidenceLevel: withheld-no-range-evidence
