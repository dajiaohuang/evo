  claims:
    - subjectId: taxon:anthocerotophyta
      claimKind: scientific
      claimType: morphology
      statement: Li and colleagues illustrate sporophytes, gametophytes and stomata of Anthoceros agrestis Bonn; these named living materials provide a morphological example for hornworts, without establishing that every hornwort species has identical structures or resolving stomatal homology across land plants.
      confidence: high
      confidenceRationale: Figure 3b–c explicitly identifies the illustrated strain and structures; the developmental discussion separately notes that firm evidence for homology is scarce.
      referenceLinks:
        - referenceId: li-2020-hornwort-genomes
          relation: supports
          figure: Figure 3b–c
          quoteLocator: Figure 3 caption; Genes related to sporophyte development, opening paragraph
    - subjectId: taxon:anthocerotophyta
      claimKind: scientific
      claimType: topology
      statement: Two Anthoceros genome assemblies support hornwort comparative placement and reveal lineage-specific genomic features; two species cannot date Anthocerotophyta or represent every hornwort lineage.
      confidence: medium
      confidenceRationale: Chromosome-scale data strengthen the sampled comparisons, while species sampling and evolutionary models bound phylum-wide inference.
      referenceLinks:
        - referenceId: li-2020-hornwort-genomes
          relation: supports
          pages: 259–272
          quoteLocator: Figures 1–5; hornwort phylogenomics and comparative genomics
    - subjectId: taxon:anthocerotophyta
      claimKind: scientific
      claimType: fossil-range
      statement: "Anthocerotophyta has no supported scalar temporal range in the cited evidence: two living hornwort genomes inform phylogenomics but do not establish a 470 Ma fossil or calibrated phylum boundary, so the former 470–0 Ma display is withheld."
      confidence: low
      confidenceRationale: Li et al. (2020) directly supports living-genome comparisons and topology, not a fossil first appearance. Low confidence records the absence of range-fit support for the former 470 Ma endpoint.
      referenceLinks:
        - relation: supports
          referenceId: li-2020-hornwort-genomes
          pages: 6:259–272
          figure: Figures 1–5
          quoteLocator: Two hornwort genomes, phylogenomics and comparative genomics
  claim-rationales.zh:
    - 图 3b–c 明确标识所展示的品系和结构；发育讨论另外指出，同源性的确凿证据仍然不足。
    - 染色体尺度数据加强了取样比较，但物种取样与演化模型限制了门级外推。
    - Li 等（2020）直接支持现生基因组比较与拓扑，而非化石首现。低置信度表示旧有 470 Ma 端点缺少适合范围用途的证据。
  claim-statements.zh:
    - Li 及同事展示了 Anthoceros agrestis Bonn 品系的孢子体、配子体和气孔；这些具名现生材料提供了角苔的形态实例，但不能证明所有角苔物种具有完全相同的结构，也未解决陆生植物间气孔的同源性问题。
    - 两套角苔属基因组支持角苔的比较系统位置并揭示谱系特有基因组特征；两个物种不能为角苔门定年，也不能代表全部角苔谱系。
    - 现有引证不支持 Anthocerotophyta 的单一时间范围：两个现生角苔基因组可用于系统基因组学，却不能确立 470 Ma 化石或校准门级边界，因此旧有 470–0 Ma 展示被暂缓。
