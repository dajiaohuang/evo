    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Tufted annual herb with ascending, spreading branches up to c. 15 cm long; branches pubescent and sometimes densely so in the lower internodes, the upper with a line of hairs or all the internodes glabrescent or glabrous. Leaves 0.3-3 x 0.1-0.7 cm, opposite or subverticillate, often in unequal pairs, subsessile, oblanceolate, narrowly obovate, rarely elliptic or linear, obtuse or subacute at the apex, cuneate at the base, margins entire, pubescent with white hairs or glabrous; stipules whitish, 1-2 mm long, membranous, ovate to lanceolate. Inflorescences of terminal or axillary, many-flowered cymes; peduncles up to c. 0.5 cm long, with a line of hairs like the internodes or glabrous; bracts whitish, 1-2 mm long, membranous, lanceolate or ovate, acute; central flower sessile, laterals on pedicels up to 6 mm long. Sepals 5, 3-4 x 1.5 mm, lanceolate with a broad, green, somewhat keeled median zone and whitish, hyaline margins, apex blunt and hooked. Petals 5, sometimes 2-3 or rarely absent, c. 1.5 x 0.75 mm, membranous and transparent, elliptic, acute. Stamens 3-5, alternating with the petals; filaments whitish, c. 1 mm long, flattened, tapering upwards; anthers 0.2 mm in diam., orbicular. Ovary ellipsoid, multiovulate; style 0.25 mm long with 3 spreading stigmatic arms c. 0.2 mm long. Capsule ellipsoid, slightly shorter than the persistent sepals, with 3 membranous semi-transparent valves. Seeds many, 0.4-0.5 x 0.3 mm, subcylindric and slightly arcuate with a minute lateral hilum nearer one end than the other; testa smooth, brown.
