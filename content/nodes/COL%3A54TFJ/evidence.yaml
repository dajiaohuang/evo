        usage:
          title: Tapirira guianensis Aubl., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Tree 3-40 m high; branches developing gray bark, the young portions dotted with lenticels. Leaves clustered toward the branch-tips, with (1-)2-5(-7) pairs of leaflets, the rachis 5-35 cm long and minutely ferruginous-puberulent or glab- rous, the leaflets opposite, with petiolules 2-11 mm long (not including the petiolule of the terminal leaflet which is often longer); lamina of leaflets oblong or oblong- lanceolate to somewhat obovate or ovate, slightly oblique, acuminate or subacumi- nate apically (the acumen rounded or emarginate), rarely rounded or emarginate at the apex, basally cuneate to broadly obtuse and often somewhat assymetric, 5-20 cm long, 1.5-8 cm broad, glabrous or sparsely puberulent beneath (rarely above) along the main veins, membranous or slightly coriaceous, entire, paler beneath, often lustrous above, the secondary veins brochidodrome. Panicles axillary but aris- ing from the distal nodes of a branch, densely-flowered, 8-37 cm long, the branches at least sparsely ferruginous-puberulent (the trichomes ascending or appressed). Flowers functionally male (one sex well developed morphologically and the other ? vestigial), occasionally I, the pedicels 1-3 mm long, 0.2-0.5 mm broad (in flower), rather conspicuously hirtellous with ascending to appressed trichomes (rarely glabrate); calyx-segments deltoid to rotund-ovate, apically acute to rounded, sparsely appressed-hirtellous externally, 0.5-0.75 mm long; petals elliptic or oblong- elliptic to ovate-lanceolate or subovate, acute to obtuse or rounded, occasionally slightly erose-dentate apically, 1.5-2.5 mm long, ascending to spreading or reflexed, yellowish-white or greenish-white; stamens 10, 1.5-2.5 mm long (hypoplastic in functionally 9 flowers), the filaments rather slender, the anthers ovate, basally cordate or auriculate, 0.3-0.5 mm long; disc 10-crenulate occasionally tumid and subentire; ovary 1-1.5 mm long and oblong-ovoid to ovoid or slightly obovoid in functionally 9 flowers, rather sparsely puberulent, greatly reduced and concealed by the disc in functionally c flowers, the styles 5 (rarely 4 in functionally c' flowers), free and well spaced in functionally 9 flowers, connivent and free or lightly coalescent basally in functionally c flowers, stubby, 0.1-0.5 mm long, conspicuously pubescent, each surmounted by a slightly enlarged disciform stigma. Drupes ovoid to oblong or obovoid, 0.5-1.5 cm long, often showing remnants of the styles; seed pendulous from the locule apex or virtually so.
