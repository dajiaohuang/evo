    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte to 70 cm. Leaves linear. Flowers crowded terminally, pink to lilac with a purple centre outlined white, tube filiform.
            textZh: Ixia metelerkampiae L.Bolus 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 7120; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Recognised by the pale pink, lilac or pale to deep mauve flowers, the tepals with an irregularly shaped, small, dark red or purple mark or ring at the base surrounded by a white zone and a dark spot in the lower midline. The obovate tepals remain slightly cupped even when the flowers are fully open, showing pale, nearly white stamens with erect filaments enclosing the style, and divergent anthers. The style divides opposite the base or lower third of the anthers. Added to the flowers, which are unusual for sect. Ixia, the leaves are linear to narrowly lanceolate, up to 6 mm wide, and the plants may have a well-developed collar of fibres around the base (sometimes not collected when plants are not extracted with care from the ground). Plants produce one or more relatively large cormlets at the base of the main corm and/or thick, rhizome-like stolons that terminate in a large corm. Ixia metelerkampiae is closely allied to I. campanulata but differs in its taller stature, reaching up to 700 mm, and flowers differently coloured and marked (flowers usually ± uniformly red, less often white, in I. campanulata) and short, colourless bracts, 4-5 mm long, with inconspicuous cusps. Both also have an unusually short perianth tube for sect. Ixia, 2-4 mm long.
            textZh: SANBI 条目提供了 Ixia metelerkampiae L.Bolus 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 95036; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
