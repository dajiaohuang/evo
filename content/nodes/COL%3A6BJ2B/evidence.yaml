        usage:
          title: Croton hircinus Vent., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrub or small tree 1-4 m high; monoecious; twigs rather coarsely hispid- stellate. Leaves thinly chartaceous, petioles rather sparsely stellate (? glabrescent), ca (0.5-) 1-3(-5) cm long, the petiolar glands usually indistinct, sometimes capi- tate and up to 1 mm long, usually ? confounded with glandular teeth at base of blade; stipules linear to subulate, capitate-tipped and with 2 or more glandular- capitate lobes toward the base, mostly 1.5-7 mm long; blades ovate to elliptic, ca (3-)5-1 1 cm long, (1.5-)2-7 cm broad, sparsely stellate or stellate-hispid above with 6-10-radiate hairs, sparsely stellate (hairs ca 0.5-1.2 mm wide) and densely glandular-punctate beneath, 7 (-9) nerved at base, with ca 3-6 additional veins on either side, the base rounded to narrowly cordate, the margins distinctly and sometimes coarsely dentate or duplicidentate (teeth 15-40 on each side), the apex acute to mostly cuspidate-acuminate. Inflorescences terminal, bisexual, racemiform, 5-17 cm long, with 3-7 solitary 9 flowers at proximal axils, solitary c flowers at distal axils; bracts lanceolate to linear, glandular-tipped and lobed as the stipules, 2-7 mm long under the 9 flowers and shorter under the c. Staminate flcwers with stellate pedicels 1.5-4.7 mm long; calyx-lobes 5, triangular, stellate-pubescent, glandular-punctate, 2-2.8 mm long, 1.3-2 mm broad; receptacle nearly glabrous, glandular-punctate (hairs mostly on filaments and petals); petals elliptic to obovate or spathulate, 2.5-3.5 mm long, 1-2 mm broad, glandular-punctate, densely barbate- hirsute on the lower margins; stamens 10-12, the filaments densely hirsutulous in the lower third, (1.5-)2-3.5 mm long, the anthers ovate to elliptic, 0.7-1 mm long (sometimes reduced). Pistillate flowers subsessile, the pedicel even in fruit only 1-2 mm long, the calyx-segments 5, subequal, narrowly lanceolate to linear, coarsely glandular-toothed below, stellate-pubescent, 3.5-5 mm long, 1-3 mm broad; disc cut into 5 dark round segments ca 0.6-0.8 mm wide; petals subulate, capitate, 0.5-1.1 mm long; ovary densely stellate-tomentose, ? hispid at the apex, the styles free, ca 3-4 mm long, twice bifid (quadripartite), -+- stellate-hispidulous towards the base of the slender branches. Capsules subglobose, copiously stellate- pubescent, becoming ca 6 mm in diam, the columella slender, ca 3.5 mm long; seeds elliptic, slightly compressed, brownish, somewhat narrowed apically but not beaked, nearly smooth (minutely striolate), 3.8-4.2 mm long, 2.9-3.1 mm broad.
