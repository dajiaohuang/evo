        usage:
          title: Alchornea grandis Benth., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Tree ca 8 m high, trunk ca 1.5 dm in diam; twigs pubescent. Leaves char- taceous; petioles stout, 9-11 cm long, minutely stellate-pubescent; stipules not evident; blades ovate or elliptic, 24-27 cm long, 15-18 cm broad, 3-nerved at base with 3 or 4 additional strong veins on each side of midrib, the veins and veinlets corrugate-impressed above, conspicuously raised beneath; lamina copiously stellate- pubescent beneath, glabrate above, basal foliar glands mostly 2 on each side, plane beneath, raised above, the base rounded to subcordate, the margins shallowly toothed (glandular teeth ca 15-17 on a side) to the base, the tip rounded with an abrupt short acumen. Spikes ( 9, the c unknown) fascicled 2-4 on nodes below the leaves, 6-12 cm long, with ca 10-15 flowers, rachis densely stellate- pubescent. Staminate flowers unknown. Pistillate flowers subsessile (pedicels less than 1 mm long); calyx-lobes pubescent, ca 1 mm long or less; ovary stellate- pubescent, the styles 10-15 mm long, very slender, glabrous. Capsules (immature) glabrate, ca 7-9 mm in diam.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 4466
