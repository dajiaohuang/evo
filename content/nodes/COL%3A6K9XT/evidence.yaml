        claims:
          - text: Acaulescent succulent to 1 m. Leaves in a spiral rosette, smooth, margins and keels toothed. Flowers in an inclined, usually branched raceme, nodding, pink and green, elongate, barely inflated below.
            textZh: Gasteria acinacifolia (J.Jacq.) Haw. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13855_0
            locator: "SANBI/WFO archive Morphology row 9060; source identifier 13855.0; cited publication: Manning, JC; Goldblatt, P. 2012. Asphodelaceae: Gasteria Duval. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 74 - 75. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Gasteria acinacifolia is characterized by its large rosette of smooth, erectly spreading linear to linear-lanceolate leaves and its large perianth, which is 35-50 mm long and indistinctly gasteriform basally for half of its length. The juvenile leaves are usually distinctly tuberculate. It is at once distinguished from any other Gasteria species by its 35-43 mm long capsule, which is truncate at the top, and its 6-8 mm long seeds. Regarding these two characteristics it is larger than any other gasteria. It is further characterized by its large, flat-topped panicles. It is fairly widely distributed and, together with G. croucheri and G. batesiana, seems to be among the most primitive species in the genus. Its flowers are similar to those of these two species. The perianth of G. acinacifolia is usually not constricted in the middle (or if constricted, not markedly so), and the diameter of the upper portion is slightly less than that of the lower. G. batesiana is a smaller species with a distinctly rugulose-tuberculate leaf epidermis and a simple raceme. G. acinacifolia is distinguished from G. croucheri by its distinctly tuberculate juvenile leaves, taller inflorescence and large capsules and seeds. When not in flower, G. acinacifolia may be confused with G. excelsa, which is also a large robust species, but which has a smaller perianth, distinctly gasteriform basally for about two thirds of its length. The name G. acinacifolia has been wrongly applied in the past to large forms of G. pulchra of the Gamtoos valley. The latter is a smaller species with linear-triangular to ensiform, channelled leaves (apex acute), with a smaller perianth.
            textZh: SANBI 条目提供了 Gasteria acinacifolia (J.Jacq.) Haw. 的鉴别特征。
