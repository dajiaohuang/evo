        claims:
          - text: Arbuscula ramosa, omnino glaberrima, ad 15 m alta vel ultra. Rami adscendentes, cortice rudi. Folia patentia, petiolata, elliptica, utrinque angustata, acuminata, integra, tenuia, subrigida vix coriacea, marginibus leviter reflexis, venis primariis lateralibus crebris circiter 12-20 rectis marginem non attingentibus, interstitiis tenuiter reticulatis; petioli 0.3-0.5 cm longi; lamina 2.8-7.3 cm longa; stipulae caducae, lanceolatae, arcte involutae, gemmas involventes, circiter 1 cm longae. Flores axillares, saepius 2-3 glomerati, rarius solitarii; pedunculi ebracteati, 0.2-0.3 cm longi. Calycis segmenta erecto-incurva, ovata, acuta, crassa, coriacea, circiter 0.23 cm longa. Petala erecto-patentia, obtusa, 0.7-0.8 cm longa. Discus 0.05 cm longus. Filamenta erecta, circiter 0.85 cm longa. Stylus erectus, quam stamina paullo longior. Stigmatis lobi revoluti, acuti, glanduliferi. Ovarium ovatum, glabrum, circiter 0.2 cm longum.
            sourceIds:
