        usage:
          title: Bunchosia ternata Dobson, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrub or small tree, 2-7 m tall; stems with scattered T-shaped trichomes, glabrous in age. Leaves opposite, narrowly elliptic to oblong-elliptic or narrowly ovate, gradually to abruptly acuminate at the apex, rounded to attenuate at the base, (8-)10-22 cm long, (2.5-)5-12 cm wide, glabrous on the upper surface, sparsely and inconspicuously appressed-pubescent on the lower surface with one or more pairs of pale glands, at least the lowermost next to the midrib; primary lateral veins 5-7 on each side, prominently arcuate-ascending, the secondary veins moderately obscure; petioles 9-20 mm long, glabrous; stipules minute, gla- brous. Pseudoracemes axillary, few-flowered, divided near the base into 3 sub- equal branches, the branches 6-12 cm long, sparsely pubescent to glabrous, the trichomes sessile or short-stalked, the arms much flattened; bracts narrowly tri- angular, to ca. 1.5 mm long, sparsely pubescent; bracteoles minute, ovate-tri- angular; pedicels 2-9 mm long, densely pubescent. Flowers yellow, 14-21 mm in diam., the sepals with the lobes oblong to ovate, 4-5 mm long, rounded at the apex, almost glabrous, weakly ciliate, with 8-9 glands ca. 2 mm long; petals clawed, the blade more or less rounded, erose along the margin, the outermost 4 petals 7.0-9.5 mm long, the innermost 8-9 mm long; stamens 4-5 mm long, connate in basal ?3-?/2, the anthers 1.2-1.4 mm long, the connective yellow; ovary 3-locular, 1.5-2.0 mm long, glabrous or crustose-puberulent, the styles ca. 4 mm long, connate, thickened at the apex. Fruits subglobose, glabrous, 11-12 mm long, 13-15 mm in diam., orange, turning red at maturity.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 7126
