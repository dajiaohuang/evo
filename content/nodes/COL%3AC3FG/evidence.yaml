        claims:
          - text: "Succulent, perennial herb, grass aloe; caulescent. Stems short or up to 0.2 m long, simple or suckering to form dense groups, erect. Leaves with blade narrowly ovate-ensiform, 500600 mm long, up to 90 mm wide; margins white, with soft, white teeth, deep green, upper surface usually without spots, sometimes lineate or with few scattered spots near base, lower surface copiously white-spotted near base. Flowers: inflorescence simple, erect, 0.4-0.6 m high, with capitate, subcorymbose or slightly conic, dense racemes; stamens and stigma exserted; perianth ± 40 mm long, salmon-pink, greenish tipped, cylindrical, narrowing towards mouth; Dec., Jan."
