    facets:
      morphology:
        status: partially-supported
        claims:
          - text: A well-branched, very compact cushion-forming dwarf shrublet, 40-100 mm high, old main stems woody, gnarled, up to 15 mm diam., branches densely tufted, clothed below in dead dry leaves, upper leaves closely imbricate, appearing rosetted from above. Leaves ±5-40 x 1-4 mm, narrowly elliptic or oblong, apex subacute to obtuse, both surfaces enveloped in thick white indumentum, surface silky-smooth, drying like crumpled tissue paper, breaking down with age to felt. Heads homogamous, campanulate, ±5-7 x 8-12 mm across the radiating involucral bracts, solitary or 2-12 together on short or long (up to 100 mm) leafy peduncles terminating the branchlets. Involucral bracts in ±4-6 series, loosely imbricate, base woolly, lamina silvery translucent, sometimes crimson above the stereome, tips opaque milk-white, deltoid, acute, radiating, Receptacle scarcely honeycombed. Flowers ±20-38, yellow. Achenes 1.5 mm long, with elongated highly myxogenic duplex hairs. Pappus bristles many, about equalling corolla, scabrid, apical cells thickened, bases cohering by patent cilia.
            sourceIds:
              - sanbi_9268_0
            locator: "SANBI/WFO archive Morphology row 48918; source 9268.0; publication: Hilliard, OM. 1983. Gnaphaliinae (first part): Facelis - Edmondia, Fl. S. Africa 33(7,2): 1 - 317. Botanical Research Institute, Department Agriculture, Pretoria. [http://www.biodiversitylibrary.org/item/209547#page/5/mode/1up]. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Heads may be small and crowded (described as H. ernestianum) or larger and then solitary or few together, on short or long peduncles, peduncle length being a response to environmental conditions. But the tufts of narrow leaves with their thick white silky covering are unmistakable, and serve to distinguish H. sessile from H. sessilioides, which has the upper leaf surfaces clothed in thin 'tissue-paper' indumentum, the lower white-felted.
