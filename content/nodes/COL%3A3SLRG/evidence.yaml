    facets:
      morphology:
        status: partially-supported
        claims:
          - text: The authors describe L. nigriventer tadpole morphology as similar to that of its sister group Discoglossus.
            sourceIds:
              - binaperl2017
            locator: Abstract, article pages 11–12
            placeTimeScope: Comparative tadpole observations reported in the 2017 Hula Valley natural-history paper; the claim does not describe all morphology or all stages.
            lifeStatus: The observation concerns tadpoles; adult morphology and other developmental stages are not inferred.
            originalLanguage: en
            textZh: 2017 年呼拉谷自然史论文描述，Latonia nigriventer 的蝌蚪形态与其姊妹类群 Discoglossus 相似。这里仅指论文中的比较性蝌蚪观察，不能据此推断成体或其他发育阶段的完整形态。
        gaps:
          - The abstract supplies a comparative summary rather than a complete diagnosis or quantitative account of morphological variation.
      lifeHistory:
        status: partially-supported
        claims:
          - text: The authors characterize breeding phenology as opportunistic and report adults' extended annual presence in aquatic habitat.
            sourceIds:
              - binaperl2017
            locator: Abstract, article pages 11–12
            placeTimeScope: Natural-history surveys summarized in the 2017 paper; conclusions are limited to the authors' study period and Hula Valley field context.
            lifeStatus: Wild adult and tadpole observations; exact breeding dates or year-round population occupancy are not inferred beyond the source summary.
            originalLanguage: en
            textZh: 2017 年论文将调查中的繁殖时序描述为机会性的，并报告成体在水生栖地中具有较长的年度出现期。结论限于作者的呼拉谷野外研究时段；不能据此推定全年种群占据情况或论文未给出的精确繁殖日期。
        gaps:
          - The abstract does not establish precise breeding dates, age at maturity, longevity, survival or full seasonal variation.
      ecology:
        status: partially-supported
        claims:
          - text: The surveys describe L. nigriventer as localized and elusive; they detected Batrachochytrium dendrobatidis in the region and on sampled frogs but observed no signs of chytridiomycosis in this species.
            sourceIds:
              - binaperl2017
            locator: Abstract, article pages 11–12
            placeTimeScope: Hula Valley surveys summarized in the 2017 publication; the pathogen observation is restricted to that study's sampled place, time and frogs.
            lifeStatus: Wild survey observations; pathogen detection is not interpreted as clinical disease or a current population-wide condition.
            originalLanguage: en
            textZh: 2017 年呼拉谷调查将 Latonia nigriventer 描述为分布局部、难以发现；调查在该地区及所采样的蛙上检出 Batrachochytrium dendrobatidis，但未观察到本种的壶菌病症状。病原检出不能直接解释为临床疾病，也不代表当前整个种群的状态。
        gaps:
          - The abstract does not provide a complete distribution model, prevalence estimate, long-term trend or current disease assessment.
      evolution:
        status: not-assessed
      distribution:
        status: not-assessed
      fossil:
        status: not-assessed
      conservation:
        status: not-assessed
