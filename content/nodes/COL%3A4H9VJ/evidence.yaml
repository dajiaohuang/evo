            locator: "SANBI/WFO archive Morphology row 35554; source 14774.0; publication: Snijman, DA. 2013. Scrophulariaceae: Phyllopodium. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 471 - 472. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: "The species is closely allied to P. pumilum, with which it is sympatric in the Richtersveld. They closely resemble each other in habit and in their entire (or nearly so) leaves; they differ principally in indumentum, that of P. hispidulum being coarser and harsher than that of P. pumilum though difficult to define precisely. There may also be some difference in flower size, evident in the corolla lobes: posticuous lobes 0.5 mm long in P. hispidulum (versus 0.6-1 mm), anticous lobe 1.25-2 mm (versus 2-2.5 mm)."
