    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Annual, ± 35-80 mm tall, stems divaricately branched from base, hairs on stems mostly eglandular. Leaves elliptic to ovate-elliptic, smaller upwards, entire or few-toothed, hispid. Flowers few in crowded, capitate heads, all lobes mauve, stamens 4, seeds smooth, dark blue-grey.
            sourceIds:
