        usage:
          title: Porophyllum ruderale (Jacq.) Cass., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Stout, malodorous, tap-rooted, annual herbs; stems erect, 0.15-1.5 m tall, often much branched above, terete, striate, leafy, green or purplish, often glaucous, glabrous. Leaves opposite or alternate, slender-petiolate, simple, ovate, elliptical or obovate, cuneate, crisped-undulate or crenate, pinnately veined, glabrous, often glaucous, punctate with conspicuous, crescent-shaped or oblong marginal oil glands and sometimes with additional scattered glands. Inflorescence corymbi- form; peduncles 3-5 cm long, terminating leafy branches, glabrous, often glaucous. Heads discoid; involucres cylindric at anthesis, 13-22 mm long, 5-10 mm diam., the bracts 5, linear-oblong, acute, flat, glabrous, glaucous, streaked with elongate glands, the margin thin, hyaline; florets 30-60, the corollas greenish to purplish, 10-13 mm long, sparsely puberulent, the tube slender, 8-10 mm long, the throat short, abruptly expanded, equally Slobed, the anthers 1.5-2 mm long with short acute to acuminate, rhombic appendages, the style branches long, slender, curved. Achenes cylindric, black or brownish, densely hispidulous, 7-12 mm long; carpopodium conspicuous; pappus of many slender, scabrid, tawny bristles 7-11 mm long.
          originalLanguage: en
          sourceField: general
