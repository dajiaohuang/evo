        claims:
          - text: "Perennial herb, 200-500 mm high; stemless, from woody rootstock, crown woolly. Leaves in a basal rosette; blade linear to narrowly elliptic or narrowly obovate, apex acute, margins usually entire or rarely somewhat toothed, glabrous, thick, tapering to petiole-like base, flushed reddish purple at base. Heads radiate, up to 40 mm in diameter, solitary or in few-headed, open corymb, terminal; peduncles up to 400 mm long. Involucral bracts uniseriate, ovate, connate at base, ecalyculate. Flowers: ray florets ± 8, female or bisexual; disc florets functionally male, all florets yellow; Oct.-Jan. Fruit with cypsela oblong-elliptic, closely ribbed, silky, 10 mm long. Pappus of dirty white or buff-coloured scabrid bristles, persistent."
            sourceIds:
