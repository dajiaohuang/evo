        claims:
          - text: Perennial, dwarf shrublet, up to 0.1 m high; roots fibrous, stems woody, single at base becoming much branched at apex, grey with age, leaf scars prominent. Leaves trigonous, glaucous, epidermis covered by raised dots. Flowers solitary, yellow. Flowering time Feb.-May. Capsules 5-locular, closing bodies bifid, covering membranes complete, expanding keels widely diverging, valve wings distally narrow, broader at base.
