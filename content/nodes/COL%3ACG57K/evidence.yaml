        usage:
          title: Mimosa invisa Mart. ex Colla, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Herb or small shrub, prostrate, decumbent or scandent, the branchlets strongly angled, subtetragonal, usually lightly pilose (sparingly so on older twigs especially), copiously armed with recurved thorns. Leaves reportedly sensitive, moderate, bipin- nate, the pinnae mostly 4-7 pairs opposite on the rachis, the leaflets several to many (usually about 15-20) pairs per pinna; petiole elongate, 2-5 cm. long, characteristically exceeding the rachis, eglandular, pulvinate, aculeate; rachis equal- ling or almost equalling and similar to the petiole, bearing setiform appendages at insertion of the pinnae; pinnae comparatively remote, mostly 2-3 cm. long, bearing just above the pulvinus usually paired, setiform appendages; leaflets linear or linear- oblong, 2-5 mm. long and about 1 mm. wide, bluntly acute or subobtuse apically, inequilaterally rounded or subtruncate basally, lightly pubescent or subglabrous, the costa visible but secondary venation obscure; stipules setiform, about 4 mm. long. Inflorescence of pedunculate heads solitary to few-fasciculate from older foliate and subterminal non-foliate nodes; peduncles normally no more than 1 cm. long, aculeate and usually sparingly pubescent; heads compact, globular, several- to many-flowered; floral bractlets oblanceolate, about 1 mm. long, glabrous. Flow- ers sessile, pink; calyx cupular, much less than 1 mm. long, glabrous; corolla funnelform, 2-3 mm. long, glabrous, 4-lobed, the lobes about equalling the tube; stamens 8, about 6 mm. long, the filaments thickish, the anthers about I/? mm. long; ovary short, verrucose laterally, the style equalling the stamens, the stigma narrow. Legume oblong, usually less than 2 cm. long and about 5 mm. wide, flat, segmented, normally pilose, the persistent margins setose-spinose.
          originalLanguage: en
          sourceField: general
