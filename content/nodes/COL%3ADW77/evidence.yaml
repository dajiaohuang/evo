    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Decumbent perennial. Roots thin, fibrous. Leaves spirally arranged, leaf-blades with long to fairly short petioles, narrowly lanceolate or lanceolate-elliptic to ovate or ovate-elliptic, (20-)30-110(-150) x (6-)10-45 mm. Inflorescences terminal or terminal and axillary, moderately dense ovoid thyrses 20-55 x 10-35(-40) mm, with (8-)11-27, mostly alternate, ascending to patent cincinni. Flowers perfect and staminate, 9.5-4.5 mm wide; pedicels 3.5-8 mm long; sepals 2.3-4 mm long, sparsely puberulous; paired petals blue to blue-violet, (6-)7-9.5 x 5.5-6.5 mm, medial petal 3-4 mm long; lateral stamen filaments 6-11 mm long, finely bearded apically with minute white hairs; style 7-11 mm long, violet apically. Capsules shortly stipitate, bilocular, usually oblong-elliptic, (3.5-)5-7.5 x (2.8-)3.5-4.2 mm, locules 2-seeded. Seeds ovate to trapezoidal, 1.95-3 mm long, testa foveolate-scrobiculate.
            textZh: Aneilema dregeanum Kunth 的 SANBI 物种条目记录了形态特征。
            sourceIds:
