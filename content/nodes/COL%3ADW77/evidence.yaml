          - text: The southern African plants all belong to subsp. dregeanum. subsp. mossambicense Faden, which differs by its generally narrower, more shortly pctiolate leaves, laxer inflorescences, longer-bearded stamen filaments and rugose to scrobiculate seeds, is confined to northern Mozambique.
