      lifeHistory:
        status: partially-supported
        claims:
          - text: Using their controlled culture system, the authors raised mature Platynereis dumerilii that spawned and produced viable embryos for experiments and replenishing culture populations. This demonstrates reproduction in the reported laboratory cultures, not reproduction rates or reproductive timing in wild populations.
            textZh: 在受控培养系统中，研究者培育出了成熟的 Platynereis dumerilii 个体；这些个体能够产卵并产生可用于实验及补充培养群体的存活胚胎。这证明的是所报告实验室培养条件下的繁殖，不代表野外种群的繁殖率或繁殖时间规律。
            originalLanguage: en
            sourceIds:
              - kuehn2019
            locator: Abstract, final sentence; Methods, Water types and filtering, Collecting embryos for sustaining cultures, and Temperature control and monitoring.
            placeTimeScope: Laboratory cultures at the Marine Biological Laboratory in Woods Hole, Massachusetts, and experiments at Max Perutz Labs in Vienna; paper published 2019-12-05. No field reproductive observations or collection dates are established by these locators.
            lifeStatus: Laboratory-reared worms held in full-strength natural filtered seawater; salinity was 32–34 ppt at MBL and 34–35 ppt for Vienna experiments. No wild reproductive population was observed.
        gaps:
          - The study demonstrates successful reproduction in specified laboratory cultures only; it does not establish a complete natural life-history account, wild reproductive behavior or rates, or variation across wild populations.
