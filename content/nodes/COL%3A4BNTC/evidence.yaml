            locator: "SANBI/WFO archive Morphology row 67394; source 9195.0; publication: Harvey, WH; Sonder, OW. 1860. Ranunculaceae to Connaraceae, Fl. Cap. (Harvey) 1: 1 - 546. Lovell Reeve & Co., London. [http://www.biodiversitylibrary.org/item/15231#page/1/mode/1up]. [All rights reserved]"
