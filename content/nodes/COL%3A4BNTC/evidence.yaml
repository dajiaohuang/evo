    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Leaves simple, stalked, alternate, linear-oblong or oblong-obtuse, mucronate, with recurved margins, glabrous and shining above, silky-tomentose and penninerved beneath; axillary panicles shorter than the leaves, terminal ones longer, compound, many-flowered, canescent; pedicels, calyx, and petals silky; drupe sub-fleshy, reniform. Branches rugose. Branchlets as well as the (2 - 3 lines long) petioles thinly pubescent. Leaves 2.5 - 3 inches long, 8 - 12 lines wide, in the upper branches smaller (1 - 1.5 inches long, 4 - 6 lines wide), obtuse on both ends; middle nerve in the upper surface impressed, the mucro 1 line long. Terminal panicle about 3-uncial. Petals oblong, thrice longer than the obtuse calyx. Drupe somewhat smaller than in the preceding, rugose, shining.
            sourceIds:
