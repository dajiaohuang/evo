    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, 120-200 mm tall, stem subterranean or reaching up to 100 mm above ground, usually unbranched. Leaves oblong to lanceolate, twisted distally, margins thickened, hyaline. Flowers 4-7 in a short spike, radially symmetric, grey-green with yellow nectar guides streaked with purple, spicy scented, perianth tube 18-23 mm long, tepals unequal, dorsal 32-35 x 6.5-8 mm, ovary smooth, bracts velvety, inner forked apically. Late May-June.
            textZh: Babiana virescens Goldblatt & J.C.Manning 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_14562_0
            locator: "SANBI/WFO archive Morphology row 33057; source identifier 14562.0; cited publication: Goldblatt, P; Manning, JC. 2013. Iridaceae. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 94 - 124. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Babiana virescens accords with sect. Teretifolieae in its apically forked inner floral bracts but is unusual in its well-developed aerial stem. The bilabiate flowers stand out in having particularly narrow, ± linear tepals, the dorsal 32-38 x 6.5-8.0 mm and the remaining tepals 4-5 mm wide. Although quite large, the greenish flowers are not conspicuous but have a characteristic spicy-acrid, chemical odour that is common in the genus. Babiana virescens may be most closely allied to B. torta and B. namaquensis on account of the slightly coiled leaves and early flowering but it is easily distinguished from them by its greenish flowers with particularly narrow tepals, and by the subglabrous or very short-hairy leaves and the aerial stem up to 100 mm high. The slightly thickened leaf margins are most evident in herbarium specimens, drying whitish or pale. Both blue-flowered B. torta and pale mauve-white-flowered B. namaquensis have distinctly hairy leaves without conspicuous margins and typically occur in rock outcrops, granite in the former but often limestone in the latter, with their corms wedged in crevices. Babiana torta typically occurs in granite rock outcrops, whereas B. virescens always occurs in open ground and relatively deep, loamy gravel. Both species have been collected within a few kilometres of one another east of Bitterfontein.
            textZh: SANBI 条目提供了 Babiana virescens Goldblatt & J.C.Manning 的鉴别特征。
