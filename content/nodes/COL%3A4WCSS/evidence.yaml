        claims:
          - text: Like S. mundii but cocci with 2 large lacunae.
            sourceIds:
              - sanbi_14444_0
            locator: "SANBI/WFO archive Morphology row 6151; source 14444.0; publication: Manning, JC; Goldblatt, P. 2012. Scrophulariaceae: Selago L. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 754 - 761. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Selago bilacunosa derives its name from the two large lacunae (spurious cells) in the coccus; these are visible very soon after fertilization. Many of the specimens before me have been misdetermined as S. mundii, to which S. bilacunosa bears a strong superficial resemblance; S. mundii is easily recognized by the bract, adnate right to the apex of the calyx tube, both bracts and calyces very glandular, the corolla thinly puberulous outside, and the cocci without spurious cells. The relationship of S. bilacunosa lies with S. nigrescens and its allies. It has the lax habit of S. nigrescens but is easily distinguished by its mostly longer leaves, some of which may have a few small leaves in their axils, by its much less hairy calyces, and by its cocci each with two large spurious cells.
