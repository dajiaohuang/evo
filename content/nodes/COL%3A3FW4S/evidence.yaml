    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Acaulescent perennial herb. Leaves entire or rarely obscurely denticulate; lanceolate to narrowly elliptic, decurrent on petiole; glabrous or almost glabrous. Scapes not widened below head. Rays biseriate, prominent. Flowers with rays yellow or white, rarely tinged mauve, disc purplish, red, mauve or yellow.
            sourceIds:
              - sanbi_11118_0
            locator: "SANBI/WFO archive Morphology row 2074; source 11118.0; publication: Herman, PPJ; Retief, E. 1997. Plants of the northern provinces of South Africa: Keys and diagnostic characters. Strelitzia 6: 1 - 681. National Botanical Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Although G. galpinii seems closely allied to G. viridifolia, it is easily recognized by the rather rigid, entire, lancelote, glabrous leaves with hardly visible nerves and long, winged petiole. G. galpinii has a limited ecological range, being confined to moist habitats, places not occupied by any other species of the genus. It seems to be specialized to the moist habitats; the glabrous leaves may be an adaptation to this.
            textZh: SANBI 条目提供了该种的鉴别特征。
