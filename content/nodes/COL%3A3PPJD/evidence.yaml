          title: Inga densiflora Benth., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Large, spreading tree about 16 m. tall, the branchlets lightly or moderately cinereous-tomentose. Leaves moderately large, 8-foliolate; petiole scarcely 1 cm. long, terete, tomentose, swollen basally; rachis up to 10 cm. long, narrowly alate (sometimes obscurely so on lowermost rachial internode), tomentose along the axis, bearing above at the rachial nodes a sessile, patelliform gland; leaflets normally 4 pairs, elliptic to elliptic-lanceolate, 10-20 cm. long and 5-7 cm. wide in the terminal pair, usually short-acuminate apically, obtuse to blunt and somewhat in- equilateral basally, heavily pubescent on costa and chief veins, loosely appressed- strigose or subglabrous and "glandular" elsewhere; stipules linear, about 5 mm. long, caducous. Inflorescence of 1-2 pedunculate spikes borne from subterminal axils; peduncle 3-6 cm. long, pubescent; floriferous portion of spike usually 1-3 cm. long, the flowers very congested; bracts small, caducous. Flowers small, white, sessile; calyx tubular-funnelform, about 4 mm. long, subglabrous or sparsely stri- gose, striate; corolla tubular, 7-S mm. long, hirsute-strigose; stamens 15 or more mm. long, the staminal tube scarcely exserted. Legume broad, flat, up to 16 cm. long and 5 cm. wide, slightly margined, transversely striate, subglabrous in age, blackish, several-seeded.
