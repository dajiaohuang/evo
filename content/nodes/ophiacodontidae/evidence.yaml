  claims:
    - subjectId: taxon:ophiacodontidae
      claimKind: scientific
      claimType: taxonomy
      statement: Ophiacodontidae is one of the named early-synapsid families tracked in a sampling-standardized Permian diversity analysis, which reports its decline and disappearance from the sampled record without supplying an exact global family origin or extinction instant.
      confidence: medium
      confidenceRationale: Family identity and sampled diversity history are supported, while the claim refuses to promote analytical bins or incomplete occurrences to exact global endpoints.
      referenceLinks:
        - relation: supports
          referenceId: brocklehurst-2013-early-synapsids
          pages: 470–490
          quoteLocator: Abstract; family-level diversity analyses; discussion of the Kungurian–Roadian interval
    - subjectId: taxon:ophiacodontidae
      claimKind: scientific
      claimType: fossil-range
      statement: Ophiacodontidae is displayed at 308–272 Ma only as the family-level sampled record in the diversity analysis, not exact global endpoints. The interval is a source-bounded sample window, not a global FAD, LAD, divergence date, continuous occupancy claim or direct-ancestor assertion.
      confidence: medium
      confidenceRationale: Ophiacodontidae uses Brocklehurst, N.; Kammerer, C.F.; Fröbisch, J. (2013) because the cited pages and locator expose the sampled taxon, specimen or living sequence set. Confidence is medium and applies only to Ophiacodontid family occurrences analysed by Brocklehurst et al.; broader endpoints remain unclaimed.
      referenceLinks:
        - relation: supports
          referenceId: brocklehurst-2013-early-synapsids
          pages: 470–490
          quoteLocator: Abstract; family-level diversity analyses; discussion of the Kungurian–Roadian interval
        - relation: contextualizes
          referenceId: ics-2026-06
          pages: International Chronostratigraphic Chart v2026/06
          figure: Global chronostratigraphic scale
          quoteLocator: Numerical boundaries for named geological stages used to bound the source sample
  claim-rationales.zh:
    - 来源支持科级身份与取样多样性历史；该主张不把分析分箱或不完整出现记录提升为精确全球端点。
    - Ophiacodontidae 采用 Brocklehurst, N.; Kammerer, C.F.; Fröbisch, J.（2013）的论文，因为所引页码与定位符直接标示了研究采样的类群、标本或现生序列集合。中等置信度仅适用于 Ophiacodontid family occurrences analysed by Brocklehurst et al.；更宽泛端点保持未声明。
  claim-statements.zh:
    - 蛇齿龙科是二叠纪早期合弓类取样标准化多样性分析中单独追踪的具名科之一；研究报告其在取样记录中的衰退与消失，但并未给出精确的全球科级起源或灭绝时刻。
    - Ophiacodontidae 仅以 308–272 Ma 展示为多样性分析中的科级采样记录，而非精确全球端点。该区间是来源限定的样本窗口，不是全球首现、末现、分化日期、连续占据或直接祖先断言。
