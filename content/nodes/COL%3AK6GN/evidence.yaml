    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, mostly up to 150 mm tall, occasionally 1- or 2-branched. Leaves oblong to lanceolate, held at right angles to the sheaths, scarcely plicate, twisted above and erect, smooth. Flowers 7-10 in a horizontal spike, bilabiate, blue-mauve with yellow nectar guides, perianth tube 6-8 mm long, dorsal tepal 23-27 mm long, ovary smooth, bracts smooth, inner forked to about middle.
            textZh: Babiana tritonioides G.J.Lewis 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_14562_0
            locator: "SANBI/WFO archive Morphology row 33066; source identifier 14562.0; cited publication: Goldblatt, P; Manning, JC. 2013. Iridaceae. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 94 - 124. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: The short floral bracts, 6-8 mm long, strongly inclined, secund spike and flowers with narrow tepals suggest that Babiana tritonioides is closely allied to the Richtersveld species, B. lobata, and the two seem somewhat isolated taxonomically within sect. Antholyzoides. The species is especially distinctive in the ± horizontal and distally twisted leaf blades, but the lower tepals have auriculate lobes above the base characteristic of the section. Based on morphology, B. lobata and B. tritonioides appear closely related and evidently represent a northern species pair of sect. Antholyzoides. The short leaves of B. tritonioides with relatively broad blades, mostly 40-60 x 6-10 mm, held nearly at right angles to the sheaths and twisted or folded back on themselves in concertina fashion, and short stature make the species easy to distinguish from the taller B. lobata, which has stems 120-250 mm high and erect, linear to narrowly sword-shaped leaves 2.5-4.0 mm wide, only lightly twisted in the upper half.
            textZh: SANBI 条目提供了 Babiana tritonioides G.J.Lewis 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 94947; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
