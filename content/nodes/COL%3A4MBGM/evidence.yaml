        usage:
          title: Prestonia ipomaeifolia A.DC., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Lianas, stout, the stems generally pubescent, the hairs uniseriate, brown, ca. 1.5-2.5 mm long. Leaves ovate, sometimes broadly so, or elliptic to rarely obo- vate, acute, or sometimes acuminate, rounded and obscurely or definitely cordate basally, to 30 cm long and 14 cm wide, sparsely to densely pubescent above, mostly densely pubescent beneath, membranaceous, rarely chartaceous; petioles 2 6 cm long, generally pubescent, glandular in the axils. Inflorescences subum- bellate, densely-flowered, the peduncle ca. 2-5 cm long, ? pubescent, bracts ob- long-ovate to ? lanceolate, 7-15 mm long, pubescent. Flowers with the pedicels 2-9 mm long, ? pubescent; calyx-lobes ovate, 9-15 mm long, coarsely pubescent, bearing 1 lacerate squamella within; corolla salverform, yellow, densely and coarsely pubescent externally, the tube 17-18 mm long, the epistaminal ap- pendages barely exserted or reaching the orifice, the lobes obliquely obovate, 12- 14 mm long; stamens slightly exserted, the anthers ca. 5-6 mm long, glabrous; nectaries concrescent, fleshy basally, surpassing the ovary at anthesis, the stigma + fusiform. Follicles stout, widely diverging, pubescent, ca. 10 cm long and 2 cm in diameter at the widest point.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 769
