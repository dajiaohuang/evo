      values:
        - "Dermophiidae "
        - Schistometopum
        - Schistometopum ephele
        - Tropical & Subtropical Moist Broadleaf Forests
        - Terrestrial
        - Fossorial
        - "Schistometopum thomense (Barboza du Bocage) is an elongate,limbless, burrowing amphibian of the Order Gymnophiona(Dermophiidae, formerly Caeciliidae), generally regarded asendemic to the island of Sa ̃o Tome ́, though also represented by one specimen purportedly collected in the Ruwenzori region of theDemocratic Republic of the Congo. "
        - viviparous
        - Adults range in totallength from roughly 130 to 375 mm and exhibitviviparous reproduction that is not tied to water.
