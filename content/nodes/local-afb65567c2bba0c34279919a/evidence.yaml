        - "Stoelting RE, Measey GJ, Drewes RC (2014) Population Genetics of the São Tomé Caecilian (Gymnophiona: Dermophiidae: Schistometopum thomense) Reveals Strong Geographic Structuring. PLoS ONE 9(8): e104628. https://doi.org/10.1371/journal.pone.0104628"
