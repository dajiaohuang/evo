    lifeStatusScope:
      wild: The field claims concern free-ranging groups or fecal samples from Mayanghe, Dashahe, Encheng, Kuankuoshui, Nonggang, or mapped study populations as individually specified. Population-genetic evidence includes wild fecal/tissue material and some captive-institution hair/blood samples; it is not treated as a wild-only sample.
      domesticated: Domestication has not been assessed. Captive specimens in the 2013 genetic study are distinguished from the wild behavioral, feeding, and fecal-sample claims.
      fossil: Species-level fossil occurrences and geological ages have not been assessed; no fossil absence is inferred.
