    facets:
      morphology:
        status: partially-supported
        claims:
          - text: In the populations sampled for the mitochondrial phylogeography study, the authors report no observed variability in T. francoisi pelage coloration and describe the species as mostly black with white cheek sideburns. This is a qualitative, study-era pelage observation, not a sex-structured morphometric or anatomical survey.
            sourceIds:
              - liu2013
            locator: Introduction paragraph describing François' langur and Figure 1 caption; Abstract and Discussion paragraph on pelage variation in the sampled T. francoisi populations.
            placeTimeScope: "The geographic sampling framework published in 2013: Figure 2 lots 01–13 for T. francoisi across the study's southwestern China and northern Vietnam localities. The paper reports sample-population pelage consistency; it does not provide a complete anatomical diagnosis."
            lifeStatus: The paper's sample set mixes wild fecal/tissue material and some captive-institution hair/blood; the qualitative trait is reported for sampled T. francoisi populations, not for a life-status-separated cohort.
            originalLanguage: en
        gaps:
          - No comprehensive sex-, age-, and population-stratified morphometric dataset was assessed.
          - Pelage description is qualitative and should not be treated as a diagnostic key or species-wide anatomical survey.
      lifeHistory:
        status: partially-supported
        claims:
          - text: At Encheng National Nature Reserve, the single monitored wild group comprised six langurs at the start of the July 2019–June 2020 study (two adult males and four adult females) and eight by its end after two infants were born. This records two births in one group over the study period; it does not estimate a species-wide birth rate or interval.
            sourceIds:
              - yao2024
            locator: "Methods > Study Site and Subject: group composition at study start and two births before study end; Abstract and Methods > Field Data Collection for the 10-month study period."
            placeTimeScope: One free-ranging group at Encheng National Nature Reserve, southwestern Guangxi, China; July 2019–June 2020.
            lifeStatus: Free-ranging wild group; not a captive breeding cohort.
            originalLanguage: en
        gaps:
          - Development, age at maturity, reproductive intervals, survival, longevity, and life-history variation across populations remain unassessed.
      ecology:
        status: partially-supported
        claims:
          - text: In a 10-month study of one free-ranging Encheng group, the authors recorded consumption of 101 plant species plus cliff minerals and at least one insect species. During food-scarce periods, fruit and young-leaf consumption declined as availability declined, while mature leaves and seeds were used as alternative foods. These are local observations from one fragmented karst site and group.
            sourceIds:
              - yao2024
            locator: Abstract; Methods > Field Data Collection; Results > Diet Composition and Seasonal Changes; Discussion paragraphs interpreting seasonal food availability.
            placeTimeScope: Encheng National Nature Reserve, southwestern Guangxi, China; observations July 2019–June 2020; one monitored group.
            lifeStatus: Free-ranging wild group.
            originalLanguage: en
          - text: At Mayanghe and Dashahe reserves in Guizhou, dietary metabarcoding of 27 fresh fecal samples from four wild populations collected in March 2022 identified 134 plant families and 336 genera across the two sites; the authors found significant regional differences in composition. The same-season, two-reserve sample does not establish year-round or whole-range diet differences.
            sourceIds:
              - cao2026
            locator: Abstract; Methods > Study Area and Sample Collection; Results > Diet Diversity and Diet Composition in Different Regions, including Figs. 2–5.
            placeTimeScope: Mayanghe and Dashahe National Nature Reserves, Guizhou Province, China; 27 fresh fecal samples collected in March 2022 from four populations during the same season.
            lifeStatus: Wild populations; fecal samples collected at night-roosting sites.
            originalLanguage: en
          - text: At Kuankuoshui National Nature Reserve, one free-ranging group in high-altitude habitat (800–1400 m) was followed during April 2008–March 2009. The study's grid-cell estimator gave a 50.7 ha annual home range and seasonal estimates of 37.7 ha in winter–spring versus 27.7 ha in summer–autumn. The paper reports a larger annual minimum-convex-polygon estimate but gives 140.4 ha in the abstract/results and 150.6 ha in the discussion; this discrepancy remains unresolved, so only the grid-cell estimator is quoted here.
            sourceIds:
              - deng2023
            locator: Abstract and Results > Home-range Size, paragraphs reporting 102 observation days, 918 locations, and the grid-cell estimates; Discussion reports annual MCP 150.6 ha while Abstract and preceding Results report 140.4 ha.
            placeTimeScope: Kuankuoshui National Nature Reserve, Guizhou, China, 800–1400 m; April 2008–March 2009; one focal group. Estimates vary by estimator and the annual MCP figures conflict within the article.
            lifeStatus: Free-ranging wild group.
            originalLanguage: en
        gaps:
          - Diet, habitat use, activity, social organization, and seasonal responses have not been systematically compared across the full range.
          - Local reserve and group studies do not establish species-wide ecological values.
      evolution:
        status: partially-supported
        claims:
          - text: A 2013 mitochondrial control-region study sequenced a 395-bp fragment from 178 T. francoisi individuals sampled from forest lots 01–13 and identified 29 haplotypes. The authors' full 17-lot framework also included T. leucocephalus in lots 14–16 and T. poliocephalus in lot 17. Their mitochondrial phylogenies recovered T. francoisi as polyphyletic relative to the sampled T. leucocephalus and T. poliocephalus clades; the authors explicitly noted that a maternally inherited marker alone was insufficient and called for nuclear-locus studies. This is that study's phylogenetic result, not a revision of the pinned COL26.8 accepted taxonomy.
            sourceIds:
              - liu2013
            locator: Abstract; Methods > Sample Collection and Amplification and Sequencing of Mitochondrial DNA; Results > Phylogenetic Analysis and Divergence Time Estimation; Discussion paragraph noting nuclear loci are needed.
            placeTimeScope: The 178 T. francoisi individuals came from forest lots 01–13; the paper's full three-taxon framework includes T. leucocephalus lots 14–16 and T. poliocephalus lot 17. The sample set included wild fecal material and some captive-institution specimens. Single mitochondrial HVI marker only.
            lifeStatus: "Mixed provenance: wild samples plus some captive-institution hair/blood; not a wild-only demographic estimate."
            originalLanguage: en
        gaps:
          - Nuclear or genome-wide population data linked to comparable, range-wide wild sampling were not evaluated here.
          - The 2013 study's taxonomic interpretation predates the pinned COL26.8 release and is not treated as accepted-name evidence.
      distribution:
        status: partially-supported
        claims:
          - text: A 2013 phylogeography paper describes T. francoisi as endemic to karst hills in tropical and subtropical southwestern China (Guizhou and Guangxi) and northern Vietnam, and maps sampled forest lots 01–13. The authors sequenced 178 T. francoisi individuals; this is a publication-era range statement and sample frame, not a current complete range boundary.
            sourceIds:
              - liu2013
            locator: Introduction, paragraph beginning “The François’s langur”; Figure 2 caption and map of T. francoisi lots 01–13; Methods > Sample Collection and Amplification and Sequencing of Mitochondrial DNA.
            placeTimeScope: Range statement and sample framework published in 2013; southwestern China and northern Vietnam as described by the authors. The study represented 178 T. francoisi individuals from its sample locations.
            lifeStatus: Wild fecal and tissue samples plus captive-institution hair and blood samples were used; only identified wild localities support the geographic sample frame.
            originalLanguage: en
          - text: A 2026 mSphere introduction gives China, Vietnam, and Laos in a literature-based range sentence, but its field sampling covers only Mayanghe and Dashahe reserves in Guizhou. Its reference 5 is Duckworth et al. (2010), whose title explicitly concerns T. francoisi sensu lato in Lao PDR. The pinned COL26.8 registry lists T. laotum (57SDG), T. ebenus (7CKVK), and T. hatinhensis (7CL7K) as separate accepted species alongside T. francoisi (57SDB). Treating the Laos sentence as broad-complex context rather than a confirmed occurrence of 57SDB is an inference from the article's citation scope and the pinned taxonomy; this review did not verify either presence or absence of 57SDB in Laos.
            sourceIds:
              - cao2026
              - col
            locator: Cao et al. (2026), Introduction, opening range paragraph; Methods > Study Area and Sample Collection; References no. 5. Compare the pinned COL26.8 registry manifest and name-tra.jsonl.gz accepted rows for 57SDB, 57SDG, 7CKVK, and 7CL7K.
            placeTimeScope: The range sentence is literature context in a 2026 article; direct field data are from wild langurs in Mayanghe and Dashahe reserves, Guizhou, collected in March 2022. Taxon identities follow COL26.8 released 2026-08-20.
            lifeStatus: The article's country list refers to literature-described wild populations; its own samples were from wild populations at two Chinese reserves. No Lao specimen or field observation was collected by this study.
            originalLanguage: en
        gaps:
          - A current authoritative species-level range assessment and complete country-level occurrence inventory were not reviewed.
          - No direct occurrence evidence for COL26.8 usage 57SDB in Lao PDR was reviewed. Laos remains unconfirmed for this fixed species concept, not established as absent.
          - Neither the 2013 sample map nor the 2026 two-reserve study defines complete contemporary occupancy or population distribution.
      fossil:
        status: not-assessed
        gaps:
          - Species-level fossil occurrences, taxonomic identification, provenance, and geological ages have not been systematically searched or verified; no fossil absence is inferred.
      conservation:
        status: not-assessed
        gaps:
          - The current primary IUCN assessment, criteria, population trend, and threats were not verified. A 2026 study's introduction cites an earlier Endangered assessment, but that secondary citation is not treated as the current formal status.
          - No current range-wide population census or trend was established by the cited local studies.
