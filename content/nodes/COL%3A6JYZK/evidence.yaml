            locator: "SANBI/WFO archive Morphology row 98525; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Evidently allied to Geissorhiza leipoldtii and sharing with it a papillate to ciliate stem and three leaves, the lower two basal and the upper cauline and largely sheathing, G. ixioides is recognised by its mauve-pink flowers with a dark purple centre, relatively short, equal filaments, and short, purple style dividing opposite the middle third of the anthers. Geissorhiza leipoldtii has larger, pure white flowers with longer stamens with equal filaments 7-8 mm long and anthers 6.5-8.0 mm long.
