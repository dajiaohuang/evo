    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants (120-)160-300 mm high. Corm ovoid, symmetric, 5-8 mm diam.; tunics dark brown to blackish, imbricate, outer layers regularly notched below into sections. Stem sparsely ciliate, simple or 1(2)-branched. Leaves 3, lower 2 basal, linear to sword-shaped, usually shorter than stem, 3-5 mm wide, apparently plane, but margins raised at right angles to blade into wings ciliate along edges, main vein also slightly raised and winged, sparsely ciliate along edges, uppermost cauline, sheathing for at least 1/2 its length. Spike flexed at base, 2- to 6-flowered, flexuose; bracts ± membranous, dry and pale brown above, outer 10-12 x 4-4 mm, inner slightly smaller. Flowers actinomorphic, shallowly cupped, pale red-purple, dark in throat; perianth tube funnel-shaped, 1.5-2.0 mm long; tepals narrowly obovate, (10-)12-16 x 5-7 mm. Filaments erect, equal, 3.5-4.5 mm long; anthers 5-7 mm long (4 mm after anthesis), light purple; pollen dull yellow. Style dividing opposite middle 1/3 of anthers, pale mauve (drying dark purple), branches 3-6 mm long. Capsules globose, ± 5.5 mm long.
            textZh: Geissorhiza ixioides Schltr. ex R.C.Foster 的 SANBI 物种条目记录了形态特征。
            sourceIds:
