    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Bushy perennial herb or subshrub up to c. 400 mm tall, stems often decumbent at base and rooting, simple below, forking several times above, grey-woolly, branches erect, leafy in lower half becoming pedunculoid upwards. Leaves up to 90 x 30 mm, more or less spathulate, apex rounded or subacute, petiole-like base expanded below and half-clasping, both surfaces closely grey-woolly. Heads homogamous, campanulate, ±6 x 4 mm, many felted together at the base in a very congested, flattish corymbose cluster 20-25 mm across. Involucral bracts in ±3 series, loosely imbricate, about equalling flowers, not radiating, glossy, straw-coloured. Receptacle with pit margins thickened. Flowers ±15-28, yellow. Achenes 1.5 mm long, with duplex hairs. Pappus bristles copious, delicate, scabrid above, bases lightly cohering by patent cilia.
            sourceIds:
