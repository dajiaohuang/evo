        usage:
          title: Miconia lacera (Bonpl.) Naudin, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrub to 4 m. tall, the stems, petioles, and panicle more or less hirsute with purple hairs as much as 10 mm. long; petioles 1-3.5 cm. long; leaf-blades thin, lanceolate to oblong or ovate-lanceolate, up to 15 cm. long and 6 cm. wide, entire or serrulate, acuminate, conspicuously ciliate, obtuse or rounded at base, more or less pilose on both sides, especially on the veins, 3- to 5-nerved; panicle small and compact, commonly 4-8 cm. long, the sessile flowers secund along the branches; hypanthium cup-shaped, about 2 mm. long to the torus, glabrous; calyx-tube prolonged nearly 1 mm.; sepals broadly ovate or nearly semicircular, about 0.5 mm. long from the sinus, conspicuously ciliate with long hairs; exterior teeth triangular, almost completely adnate, the slender free tip about 0.4 mm. long; petals white to pink, oblong-obovate, about 4 mm. long, distinctly retuse; stamens isomorphic; anthers oblong, about 1.5 mm. long, 2-celled, the connective simple; style slender, bent or hooked at the summit, about 3 mm. long.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 7564
