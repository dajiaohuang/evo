      claimKind: scientific
      claimType: morphology
      statement: Rhaetian holotype LWL-MFN P 64047 preserves plesiosaur anatomy and highly vascularized long-bone tissue; its basal pliosaurid placement and implications for growth rate or metabolism remain topology- and histology-based inferences.
      confidence: medium
      confidenceRationale: The specimen, horizon, anatomy and sampled histological sections are explicit. Medium confidence retains incomplete preservation, phylogenetic sensitivity and the distinction between tissue pattern and unmeasured physiology.
