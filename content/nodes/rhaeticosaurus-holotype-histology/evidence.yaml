          figure: Figures 1–4; Supplementary Figures S1–S12
          quoteLocator: Systematic paleontology; Histology; Phylogeny
  claim-rationales.zh:
    - 标本、层位、解剖与取样组织切片均明确。中等置信度保留不完整保存、系统位置敏感性，并区分组织模式与未测量的生理。
  claim-statements.zh:
    - 瑞替期正模 LWL-MFN P 64047 保存蛇颈龙解剖及高度血管化的长骨组织；其基干上龙科位置以及对生长速率或代谢的含义仍是基于拓扑和组织学的推断。
