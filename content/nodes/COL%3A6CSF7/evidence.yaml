        usage:
          title: Dichapetalum nevermannianum Standl. & Valerio, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrub to 2.5 m, slender; young branches densely velutinous-pilose, the hairs ca 2 mm long,- light brown, spreading at right angles to branchlets, glabrate with age. Leaves with blades linear-oblong, 7-13 cm long, 1.5-3 cm wide, the apex narrowly attenuate, the base more or less unequal, broadly rounded or slightly cordate, velutinous-pilose above and below chiefly on the mid-vein and margin; petioles to 5 mm long, densely velutinous-pilose, the hairs spreading, light brown. Inflorescences usually terminal, few-flowered, densely ash-gray-tomentulose, the peduncle ca 5 mm long. Flowers X, white, the pedicel very short; sepals 5, oblong to oval, 2-3 mm long, glabrous within, ash-gray-tomentulose without; petals 5, ca equalling sepals in length, clawed, strongly revolute, bibbed by more than 1/2 length; sta- mens 5, somewhat longer than petals, subequal, the filament free, glabrous, the anther ca 0.5 m long; disk glands 5, ca 1-1.5 mm long, elongate, opposite the petals; ovary narrowly ovoid, densely pilose, ca 1.5 mm long; styles 2, 0.5 mm long, free, erect, the stigmas 2, rarely 3, ? capitate. Drupes ovoid, 12-15 mm long, densely brown-tomentulose; seed 1.
          originalLanguage: en
          sourceField: general
