          - text: Trachyandra aridimontana was recognized as distinct when it became apparent that the flowers opened at mid-morning and that the inner tepals were maculate. In contrast, flowers of T. involucrata opened in mid-afternoon and were without markings. In addition T. involucrata flowers mainly between May and June, some months before T. aridimontana.
