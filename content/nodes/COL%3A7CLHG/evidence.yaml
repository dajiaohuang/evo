    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Subwoody shrub, up to 450 mm tall. Leaves in apical tufts, somewhat succulent, smooth, greyish green, usually on short branches. Flowers in a simple or occasionally branched raceme, white, inner tepals spotted yellow at base. Capsule narrow, ± 10 mm long, held erect.
            textZh: Trachyandra aridimontana J.C.Manning 的 SANBI 物种条目记录了形态特征。
