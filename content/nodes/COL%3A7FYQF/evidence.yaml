        metadataVariant: 0
        usage:
          title: Xylophragma seemanniana (Kuntze) Sandwith, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Liana to at least 7 cm in diameter, often shrubby when young, the bark relatively smooth with conspicuous raised whitish lenticels, stem with 4 phloem arms in cross section; branchlets subtetragonal to subterete, more or less pubes- cent with dendroid trichomes, glabrescent, the nodes with iTterpetiolar glandular fields; pseudostipules inconspicuous or resembling minute bromeliads. Leaves 3-foliolate or 2-foliolate with a tendril or tendril scar (some leaves 5-foliolate in Gentry 1112, Costa Rica (MO)); leaflets rhombic-ovate to rhombic-obovate, acuminate to acute, truncate to broadly cuneate, 3.5-28 cm long and 1.5-14 cm wide, membranaceous to chartaceous, palmately 3-5-nerved from the base, secondary veins 5-7 on a side, variably lepidote and pubescent above and beneath, beneath with mostly dendroid trichomes, above often with simple tri- chomes over most of surface and dendroid trichomes on main veins, drying variably olive or brownish; tendril simple, 7-17 cm long; petiolules and petiole dendroid-pubescent, the terminal petiolule 2.1-7 cm long, the lateral petiolules 1.0-2.6 cm long, the petiole 6.4-12 cm long. Inflorescence a contracted, lateral raceme or panicle, each flower subtended by 2 narrow bracts, the branches dendroid-pubescent. Flowers fragrant with a sweet odor with musky over- tones; calyx cupular, 5-9 mm long and 3-5 mm wide, with 5 slender teeth, 1 mm long, pubescent with stellate or dendroid trichomes, especially dense in S lines terminating in the marginal teeth, eglandular; corolla lavender outside and on the lobes, the throat white inside, tubular-campanulate, 3.5-6.2 cm long and 1.2-2.0 cm wide at the mouth, the tube 2.2-3.6 cm long, its lower 6-9 mm narrowed to 2 mm wide, the lobes 1.2-2.2 cm long, thickly dendroid pubescent especially in bud outside and on its lobes inside, the tube within mostly glabrous with simple trichomes at and just below the level of stamen insertion; stamens didynamous, the anther thecae divaricate, 2.3-3.5 mm long, the longer filaments 1.6-2.1 cm long, shorter filaments 0.9-1.5 cm long, the staminode 1.5-3 mm long, inserted 7-10 mm from the base of the corolla tube; pistil 2.1-2.8 cm long, ovary tapered-cylindrical and somewhat flattened, 1.5-2.5 mm long and 1.5-2 mm wide, densely lepidote, the ovules 6-8-seriate in each locule; disc cupular-pulvinate, 0.5-1 mm long and 1.5-2 mm wide. Capsule rounded-oblong, flattened, 5.5-16 cm long and 3.4-5 cm wide, 1-1.5 cm thick, drying dark, inconspicuously lepidote, often with raised glandular areas; seeds
