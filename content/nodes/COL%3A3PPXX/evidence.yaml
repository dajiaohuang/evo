          title: Inga saffordiana Pittier, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Small, slender tree, the branchlets dark setose-villous. Leaves large, 8- or 10- foliolate; petiole about 2.5 cm. long, terete, setose or sparsely villous; rachis up to 20 cm. long, unwinged, pubescent like the petiole, bearing long-stipitate glands above at the rachial nodes; leaflets 4 or 5 pairs, oblong to obovate-lanceolate, about 14 cm. long and 4 cm. wide in terminal pair (lowermost pair only 1/4-1/5 this size), tapered but blunt basally and inequilateral, acuminate apically, glabrous above, sparsely setose on the margins and veins below, the veins moderately prominent below, the lateral ones arcuate and subconfluent; stipules subulate, up to 12 mm. long, setose-villous. Inflorescence axillary or borne on older defoliate wood, umbellate, pedunculate; peduncles up to 13 cm. long, villous-setose; pedicels sim- ilarly pubescent, almost 2 cm. long; floral bracts similar to the stipules, subper- sistent. Flowers incompletely known; calyx apparently 7-8 mm. long, setose- villous, the teeth elongate and narrow; corolla tubular, about 15 mm. long, setose-villous, especially apically. Legume broadly linear, about 30 cm. long and almost 3 cm. wide, cuneate basally, flat and thin, lightly margined, densely dark villous, about 18-seeded.
          originalLanguage: en
          sourceField: general
