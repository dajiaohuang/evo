            locator: "SANBI/WFO archive Morphology row 9057; source identifier 13853.0; cited publication: Manning, JC; Goldblatt, P. 2012. Asphodelaceae: Bulbine Wolf. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 71 - 73. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Bulbine meiringii is characterised by its oblong tubers bearing slightly fusiform roots and by the slender, linear-lanceolate, glaucous leaves. In contrast, B. cremnophila has shorter, much more fleshy leaves, and lacks the oblong tuber and fusiform roots. B. meiringii is also closely related to B. rupicola occurring towards Klipplaat in the north-east. The latter has ovoid tubers and short, ascending, green, somewhat channelled leaves.
            textZh: SANBI 条目提供了 Bulbine meiringii van Jaarsv. 的鉴别特征。
