    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Dwarf geophyte to 30 cm, clustered, rootstock a small tuber with fleshy roots. Leaves slender and fleshy, semi-terete, surrounded at base by a short fibrous neck. Flowers in a lax raceme, yellow. Capsules ovoid, erect.
            textZh: Bulbine meiringii van Jaarsv. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
