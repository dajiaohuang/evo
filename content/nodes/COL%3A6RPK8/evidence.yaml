    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, 300-600 mm tall. Leaf 1, linear, channelled, trailing above. Flowers enclosed in green spathes, cream to greenish, outer tepal limbs spreading, inner tepals 3-lobed with a long central cusp, filaments united below, style branches narrow, crests short.
            textZh: Moraea rivulicola Goldblatt & J.C.Manning 的 SANBI 物种条目记载了植株、叶片和花部形态。
            sourceIds:
              - sanbi_14562_0
            locator: Strelitzia 30; archive Morphology row 33341, source 14562.0
            placeTimeScope: Regional species account published 2013; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
          - text: Resembling Moraea unguiculata, M. rivulicola has larger, pale, creamy green, yellow-green or beige flowers, the outer tepals up to 28 mm long with limbs typically held at 60° below horizontal and smooth claws. The inner tepals are also distinctive in having the central lobe of the typically 3-lobed limb drawn into a slender, obliquely coiled cusp, while the lateral lobes are rounded and very short. The ovary is oblong-cylindric and 11-14 mm long, and gives rise to large cylindric capsules 25-32 mm long. Moraea unguiculata has smaller flowers with the outer tepals seldom exceeding 16 mm and with densely pubescent or bearded claws. The inner tepals, 7-10 mm long, are also 3-lobed but the long central cusp is coiled inward symmetrically. Flower colour in M. unguiculata ranges from white to creamy white, brownish, and even blue, and the outer tepal limbs may be half reflexed or, in some populations outside Namaqualand, may be completely reflexed. A population from the rocky hills west of Bitterfontein and south of Kotzesrus stands out in the particularly large flowers with the inner tepals ± 19 mm long, and with an ovate-attenuate limb. Other organs are also larger, with the filaments united in a column up to 10 mm long and free for an additional 2.5 mm and the anthers are 5.5-6.0 mm long. This population represents a significant variant and distinctive race, perhaps deserving of infraspecific recognition.
            textZh: SANBI 条目提供了 Moraea rivulicola Goldblatt & J.C.Manning 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
