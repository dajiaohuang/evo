    facets:
      morphology:
        status: partially-supported
        claims:
          - text: An erect herb, annual, closely branched, viscid-pubescent, 3-12 in. high; stem and branches tetragonous, leafy; branches opposite, spreading, ascending; leaves opposite, ovate or lanceolate, acute or obtuse at the apex, obtuse or somewhat wedge-shaped at the base, shortly petiolate or the upper sessile, entire or minutely denticulate, 1/2-1 1/4 in. long, 1/10-3/5 in. broad; racemes terminating the stem and branches, oblong or subcorymbose, 1/2-6 in. long, several- or many-flowered; bracts alternate, narrowly lanceolate or sublinear, acute, sessile, entire, smaller than the leaves, 1/6-2/5 in. long; pedicels 1/5-3/5 in. long, inserted in the axils of the bracts; calyx-segments lanceolate or sublinear, subacute, 1/12-1/6 in. long; corolla yellow; the upper lip about 1/6-1/5 in. long; lobes ovate, 1/8-1/6 in. long, very obtuse, scarcely exceeding the lower lip; palate subglabrous; spur straight, cylindrical, narrow, obtuse, about 1/10 in. long; capsules oblong, glabrous or nearly so, subtruncate at the apex, unequal and nearly rounded at the base, 1/3-2/5 in. long, 1/5-1/4 in. broad.
