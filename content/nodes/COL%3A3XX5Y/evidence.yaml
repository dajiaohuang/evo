    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Erect or decumbent annual, ± 30-150 mm tall. Leaves mostly crowded near base, elliptic to oblanceolate, tapering below, entire to serrate, glandular-pubescent. Flowers in racemes, ± regular, corolla tube 3-4.5 mm long, lobes bilobed or twice bilobed at apex, white (?to mauve in hybrids with M. silenoides), with yellow to orange star-shaped patch around mouth, extending into throat.
            sourceIds:
              - sanbi_14769_0
            locator: "SANBI/WFO archive Morphology row 35523; source 14769.0; publication: Snijman, DA. 2013. Scrophulariaceae: Manulea. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 465 - 467. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: "Manulea gariesiana and its close ally M. praeterita are often confused with M. silenoides: all three species have bifid corolla lobes. Manulea gariesiana can be distinguished from M. silenoides by the shorter hairs on the stem (up to 0.1 mm, not 0.15-0.3 mm), mostly shorter pedicels (seldom exceeding 9 mm, not often at least 10 mm), calyx pubescent mainly on the margins of the lobes, the hairs gland-tipped, up to 0.1-0.3 mm long (versus pubescent all over with a mixture of gland- and balloon-tipped hairs up to 0.2-0.5 mm), and often smaller corolla limb (5.5-7 mm versus 6-12 mm), which is white (not shades of blue and mauve, very rarely cream). The area of M. silenoides lies mainly north of that of M. gariesiana, but where they are sympatric around Garies they may hybridize."
