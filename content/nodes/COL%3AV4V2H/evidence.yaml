    facets:
      morphology:
        status: partially-supported
        claims:
          - text: The article provides scanning and transmission electron micrographs of strain 9FUS-T cells, including a flagellum and an ultrathin section. The microscopy caption states that the strain was grown in lactate/sulfate medium for seven days at 25 C.
            originalLanguage: en
            sourceIds:
              - paper
            locator: Figure 1 caption; microscopy of strain 9FUS-T
            placeTimeScope: One cultured type strain under the stated preparation and growth conditions.
            lifeStatus: Wild isolate; evidence is restricted to the named cultured type strain and the paper-reported observations.
        gaps:
          - No population-level morphology survey, developmental stages or environmental variation were assessed.
      lifeHistory:
        status: not-assessed
        claims: []
        gaps:
          - No life-history search was performed; reproduction, development, behavior and lifespan are not characterized.
      ecology:
        status: partially-supported
        claims:
          - text: Strain 9FUS-T was isolated from formation water at the Karazhanbas oil field in Kazakhstan and characterized as sulfate-reducing. The article discusses petroleum-industry sulfidogenesis; it does not measure field-scale activity of the species.
            originalLanguage: en
            sourceIds:
              - paper
            locator: Abstract; strain isolation and characterization sections
            placeTimeScope: One cultured isolate and the sampled formation-water context described in the paper.
            lifeStatus: Wild isolate; evidence is restricted to the named cultured type strain and the paper-reported observations.
        gaps:
          - No in-situ abundance, activity rate, ecological interaction or reservoir-wide survey was assessed.
      evolution:
        status: partially-supported
        claims:
          - text: The study compares 16S rRNA and a tree based on 120 conserved single-copy proteins, and reports ANI and dDDH comparisons supporting the authors' proposed distinct species placement. This is the study's taxonomic inference.
            originalLanguage: en
            sourceIds:
              - paper
            locator: Abstract; Figures 2 and 3; genomic relatedness results
            placeTimeScope: The strain and comparator genomes included in the 2024 paper.
            lifeStatus: Wild isolate; evidence is restricted to the named cultured type strain and the paper-reported observations.
        gaps:
          - Alternative broader taxon sampling, later revisions and independent phylogenomic review were not assessed.
      distribution:
        status: partially-supported
        claims:
          - text: The type strain was isolated from formation water at the Karazhanbas oil field, Kazakhstan.
            originalLanguage: en
            sourceIds:
              - paper
            locator: Title; abstract; strain isolation section
            placeTimeScope: The type-strain collection site only; no wider range is implied.
            lifeStatus: Wild isolate; evidence is restricted to the named cultured type strain and the paper-reported observations.
        gaps:
          - No additional localities, global range or sampling completeness were assessed.
      fossil:
        status: not-assessed
        claims: []
        gaps:
          - No fossil or paleontological literature/database search was performed; no fossil-presence or fossil-absence conclusion is made.
      conservation:
