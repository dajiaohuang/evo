  claims:
    - subjectId: taxon:brontotheriidae
      claimKind: scientific
      claimType: morphology
      statement: A species-level monograph diagnoses Brontotheriidae by an abbreviated face, elongate postorbital cranium and characteristic upper molars, while showing that giant size and frontonasal appendages occur in only part of the family.
      confidence: medium
      confidenceRationale: The monograph directly revises species and diagnostic characters. Medium confidence preserves species-level variation and uncertainty in the family’s deeper perissodactyl placement.
      referenceLinks:
        - referenceId: mihlbachler-2008-brontotheriidae
          relation: supports
          pages: 1–3, 409–454
          figure: Species-level phylogeny and biogeography figures in the concluding synthesis
          quoteLocator: Abstract diagnosis and concluding phylogenetic/biogeographic synthesis; horns and giant size explicitly do not characterize every species
    - subjectId: taxon:brontotheriidae
      claimKind: scientific
      claimType: taxonomy
      statement: Brontotheriidae is an Eocene perissodactyl family revised at species level; its deeper position within Perissodactyla remains less certain than the family’s internal membership.
      confidence: medium
      confidenceRationale: The monograph supplies explicit diagnoses and a species-level phylogeny, while acknowledging uncertainty outside the family.
      referenceLinks:
        - referenceId: mihlbachler-2008-brontotheriidae
          relation: supports
          pages: 1–3, 409–454
          figure: Species-level phylogeny and biogeography figures in the concluding synthesis
          quoteLocator: Abstract diagnosis and concluding phylogenetic/biogeographic synthesis; horns and giant size explicitly do not characterize every species
    - subjectId: taxon:brontotheriidae
      claimKind: scientific
      claimType: fossil-range
      statement: The atlas’s 53–34 Ma occurrence envelope is provisional; the systematic monograph independently supports an Eocene family record but does not make those numeric endpoints exact origination or extinction times.
      confidence: low
      confidenceRationale: Medium confidence distinguishes a literature-supported epoch range from the atlas’s occurrence-derived numeric navigation edges.
      referenceLinks:
        - referenceId: mihlbachler-2008-brontotheriidae
          relation: supports
          pages: 1–3, 409–454
          figure: Species-level phylogeny and biogeography figures in the concluding synthesis
          quoteLocator: Abstract diagnosis and concluding phylogenetic/biogeographic synthesis; horns and giant size explicitly do not characterize every species
    - subjectId: taxon:brontotheriidae
      claimKind: scientific
      claimType: ecology
      statement: Brontotheres were terrestrial Eocene herbivores with folivorous dental evidence and body sizes ranging from small early forms to rhinoceros-sized taxa; one habitat or gait is not generalized across the family.
      confidence: medium
      confidenceRationale: The monograph reviews dental function and size variation, but detailed habitat and gait differ among species and are intentionally withheld.
      referenceLinks:
        - referenceId: mihlbachler-2008-brontotheriidae
          relation: supports
          pages: 1–3, 409–454
          figure: Species-level phylogeny and biogeography figures in the concluding synthesis
          quoteLocator: Abstract diagnosis and concluding phylogenetic/biogeographic synthesis; horns and giant size explicitly do not characterize every species
    - subjectId: taxon:brontotheriidae
      claimKind: scientific
      claimType: biogeography
      statement: The revised family is recorded from North America and Asia and rarely eastern Europe; inferred intercontinental exchanges do not establish a single observed dispersal direction.
      confidence: medium
      confidenceRationale: The monograph’s species-level occurrence and phylogenetic synthesis directly supports the bounded distribution and the stated uncertainty.
      referenceLinks:
        - referenceId: mihlbachler-2008-brontotheriidae
          relation: supports
          pages: 1–3, 409–454
          figure: Species-level phylogeny and biogeography figures in the concluding synthesis
          quoteLocator: Abstract diagnosis and concluding phylogenetic/biogeographic synthesis; horns and giant size explicitly do not characterize every species
  claim-rationales.zh:
    - 该专著直接修订了物种和诊断性状。中等置信度保留种级差异以及雷兽科在奇蹄目深层位置上的不确定性。
    - 分类主张以所引主研究或系统综述中的明确分类与样本为界，不把导航父级写成直接祖先。
    - 化石范围主张把论文直接约束的区域或样本年代与图集的临时导航端点分开，端点不被当作精确起源或灭绝时刻。
    - 生态主张区分直接测得的磨耗或同位素信号与栖息地、行为推断，并保留物种、地点和时代边界。
    - 生物地理主张按论文实际覆盖的地点和区域表述，不把区域样本扩写为完整全球分布。
  claim-statements.zh:
    - 雷兽科按所引系统研究采用当前分类层级；导航父级仅表示分类关联，不表示直接祖先。
    - 雷兽科的图集数值范围仍是临时导航包络；主研究只独立约束其明确讨论的区域或样本年代，端点不是精确起源或灭绝时刻。
    - 雷兽科的生态档案按取样物种、地点与方法限定食性和运动推断，不把局部结果推广为整个类群的固定生态。
    - 雷兽科的地理档案只覆盖所引研究明确讨论的区域与地点，并非完整的全球产出分布。
    - 种级系统专著以缩短的面部、加长的眶后颅部和特征性上臼齿诊断雷兽科，同时显示巨型化和额鼻附属物只见于科内部分成员。
