    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Rhizomatous perennial, mostly 40-50 cm, forming small clumps, stems mostly unbranched. Leaves linear, tough and fibrous. Flowers pale pink to lilac, tepal bases deep lilac or violet, streaked dull brownish outside, outer tepals with a copper-brown mark in lower third. Capsules elongate.
            textZh: Aristea cistiflora J.C.Manning & Goldblatt 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 6633; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Aristea cistiflora is evidently most closely related to A. teretifolia, which also has the outer tepals with dark markings, the markings extending to the middle of the tepals in A. teretifolia versus close to the base in A. cistiflora. Aristea teretifolia is additionally distinguished by the leaves sometimes terete or linear and up to 2 mm wide, the flowering stem bearing at most two lateral flower clusters (versus up to six in A. cistiflora), and by the slightly smaller flowers with ascending tepals, the outer ± 20 mm long and the inner 24-28 mm long, thus substantially longer than the outer. In A. cistiflora the inner tepals are only 1-2 mm longer than the outer.
            textZh: SANBI 条目提供了 Aristea cistiflora J.C.Manning & Goldblatt 的鉴别特征。
