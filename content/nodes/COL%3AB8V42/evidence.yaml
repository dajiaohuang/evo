  claims:
    - subjectId: taxon:scyphozoa
      claimKind: scientific
      claimType: topology
      statement: An 18S–28S analysis sampling all 19 then-recognized scyphozoan families supports several clades but finds other families or suborders unresolved or non-monophyletic.
      confidence: medium
      confidenceRationale: Complete family-level sampling for the study's taxonomy is strong, while two loci and unresolved nodes require moderate confidence.
      referenceLinks:
        - referenceId: bayha-2010-scyphozoa
          relation: supports
          pages: 436–455
          quoteLocator: Figures 1–4; family sampling; phylogenetic results
    - subjectId: taxon:scyphozoa
      claimKind: scientific
      claimType: fossil-range
      statement: "Scyphozoa has no supported scalar crown range in the cited evidence: the living-taxon phylogeny does not establish a diagnostic 505 Ma crown scyphozoan, so the former 505–0 Ma display is withheld."
      confidence: low
      confidenceRationale: Bayha et al. (2010) supports relationships among sampled living Scyphozoa, not a Cambrian fossil assignment. Low confidence keeps the unverified class-level endpoint unpublished.
      referenceLinks:
        - relation: supports
          referenceId: bayha-2010-scyphozoa
          pages: 436–455
          figure: Figures 1–4
          quoteLocator: Family sampling and phylogenetic results
  claim-rationales.zh:
    - 按研究所用分类实现科级完整取样是一项优势，但仅有两个位点且若干节点未解析，因此采用中等置信度。
    - Bayha 等（2010）支持所采样现生钵水母的关系，而非寒武纪化石归属。低置信度使未经验证的纲级端点保持不发布。
  claim-statements.zh:
    - 一项覆盖当时认可的全部 19 个钵水母科的 18S–28S 分析支持若干支系，但另一些科或亚目仍未解析或并非单系。
    - 现有引证不支持 Scyphozoa 的单一冠群范围：现生类群系统树未确立可鉴定的 505 Ma 冠群钵水母，因此旧有 505–0 Ma 展示被暂缓。
  ranges:
