    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Stems 60-90 cm tall, sturdy, unbranched. Leaves, at least the upper ones, in ternate whorls or irregularly inserted; lamina 29-34 x 4-15 mm, oblong-triangular; petiole 1-3 mm long. Inflorescences 3-8 per stem, 4-7-flowered; peduncles 0-10 mm long; pedicels 5-10 mm long. Calyx segments 4 x 1.5 mm. Corolla lobes 8-10 x 5.5 mm, replicate, green with purple veins; dorsal surface glabrous, ventral surface glabrous except for a patch of pubescence at base, margin glabrous. Corona c. 5 mm long, exceeding the gynostegium, colour unknown; each lobe having an obtriangular basal part contracting abruptly into an erect narrowly oblong appendage 3 mm long, this appendage delimited from the lobe by a transverse dorsal ridge and having a longitudinal ventral groove and bilobed apex. Anthers with appendages c. 1.5 mm long, triangular, appressed against the side and top of the gynostegial head; corpusculum 0.4-0.52 mm long, not flanged; pollinium attachment subapical; pollinia 0.95-1.03 mm long, reniform, the germination zone occupying the outer half. Fruit unknown.
