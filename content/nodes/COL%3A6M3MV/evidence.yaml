    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants 250-500 mm high. Corm globose, ± 12 mm diam.; tunics woody, layers soon breaking into vertical segments tapering above into short points. Stem usually unbranched. Leaves usually 4, lower 2 basal, longest, reaching to between middle of stem and apex of spike, ± linear, 2-3 mm wide, firm, erect, main vein and margins lightly thickened, upper leaves smaller and partly to entirely sheathing. Spike (2-)4- to 8(-12)-flowered; bracts 18-24 mm long, green, becoming dry and brown near tips. Flowers bright pink, white in mouth of tube; perianth tube 45-60 mm long, cylindric, slightly curved or straight, barely expanded near mouth; tepals ascending, elliptic, 18-21 x 7-8 mm, subacute. Filaments suberect, ± 3 mm long; anthers diverging, 9-10 mm long, dark brown to ± black; pollen yellow. Style branches ± 8.5 mm long, reaching to just below anther tips in closed flower.
            textZh: Hesperantha stenosiphon Goldblatt 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Morphology row 98644; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Among the elongate-tubed and pink-flowered species of Hesperantha of eastern southern Africa, H. ste-nosiphon stands out in the radially symmetric flowers with a nearly straight perianth tube 45-60 mm long, and dark brown to nearly back anthers but yellow pollen. The filaments are comparatively short, ± 3 mm long whereas the anthers are 9-10 mm long. It is probably most closely allied to long-tubed H. grandiflora and H. woodii and shares with them linear leaves with lightly to moderately thickened margins and midribs as well as the pink perianth. Hesperantha grandiflora has nodding flowers with vertically oriented tepals and unilateral, declinate stamens and style branches, filaments 8-14 mm long, and red-brown to purple anthers and pollen; and H. woodii has similarly large, but nearly upright, radially symmetric flowers with filaments 6-8 mm long and yellow anthers and pollen.
