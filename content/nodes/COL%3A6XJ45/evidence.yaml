          publishedAt: undated
          originalSourceText: Perennial herb from a fleshy rhizome, glabrous, the stem usually solitary, 2-6 dm. tall, dichasially branched; leaves broadly cordate-orbicular to suborbicular, the blade 2.5-8 cm. long, 3.5-10 cm. broad, palmately 5-parted, the primary leaf- lets petiolulate, setose-crenate and incised, the petiole 5-23 cm. long; cauline leaves reduced upward; peduncles 5-45 mm. long, sterile and fertile flowers intermixed, the former pedicellate; flowers pale green, the calyx-teeth narrowly lanceolate, acuminate; styles longer than the fruit-prickles; fruit usually 2 or 3 in each head, subglobose, 2-4 mm. long, 2-4 mm. broad, stipitate, densely uncinate- bristly, the vittae small, several on the dorsal and lateral surfaces, 2 on the commissure; seed flattened dorsally, its face flat.
