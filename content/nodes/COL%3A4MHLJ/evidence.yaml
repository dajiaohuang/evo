          - text: Stiffly erect, shortly hairy shrublet to 1 m. Leaves linear-lanceolate, margins revolute and prickly toothed, often twisted and pungent; bracts broad and pinnatisect below, margins revolute. Flowers sessile, crowded in axillary glomerules, white to lilac, funnel-shaped with short lobes, 15-20 mm diam. Fruits ± 10 mm long.
