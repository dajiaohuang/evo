        status: partially-supported
        claims:
          - text: Hard, densely tufted perennial 500-1 000 mm high; culm node glabrous. Leaf blade 100-350 x 3-4 mm, rigid, apex pungent. Inflorescence spike-like; bristles obscure as only a few spikelets are subtended by a solitary bristle; bristle up to 10 mm long, scabrid, yellowish. Spikelet 4.0-4.6 mm long, disarticulating below glumes; lower glume 2-nerved; lower lemma middle nerve prominent, sunk in a deep narrow groove; upper lemma smooth; anther 2.0-2.4 mm long.
