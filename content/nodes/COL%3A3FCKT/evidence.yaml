    facets:
      morphology:
        status: partially-supported
        claims:
          - text: In the North Uist lagoon-resident clutches incubated at 14 degrees Celsius, daily observations recorded a visible heartbeat by day 5; by day 7 yolk-sac circulation and developing pectoral fins could be seen. This is an embryo-stage description under the study's incubation conditions, not a diagnostic description of adult morphology.
            sourceIds:
              - barnes2024
            locator: Results > Development of embryos, days 5 and 7; Figures 3–4; embryos staged from fertilisation at daily intervals.
            placeTimeScope: Laboratory observations of embryos from breeding crosses made with North Uist saltwater-lagoon fish collected 30 April–19 May 2023; incubation at 14 degrees Celsius.
            lifeStatus: Wild-bred parents; embryos incubated in laboratory dishes.
            originalLanguage: en
        gaps:
          - Only selected embryonic stages under one temperature and source population are described; adult diagnostic morphology, sexes, age classes, variation across populations, and identification limits remain unassessed.
      lifeHistory:
        status: partially-supported
        claims:
          - text: "At 14 degrees Celsius, embryos from six migratory and six lagoon-resident North Uist crosses hatched earlier in the migratory ecotype: mean first hatch was 11.7 versus 13.2 days after fertilisation, and mean 50-percent-clutch hatch was 12.2 versus 13.7 days. Hatching success did not differ significantly in this small clutch experiment; these timings do not establish a species-wide rate."
            sourceIds:
              - barnes2024
            locator: Methods > Fish collection and crosses; Results > Hatching success and time to hatch; Figure 1; Table 1.
            placeTimeScope: Crosses using breeding fish collected at Loch an Duin, North Uist, Scotland, 30 April–19 May 2023; embryos raised at 14 degrees Celsius; six clutches per ecotype.
            lifeStatus: Wild-bred parents; eggs and embryos were maintained under laboratory conditions.
            originalLanguage: en
        gaps:
          - The study covers embryonic development to hatching in two local ecotypes only; other life stages, reproduction in natural nests, survival, lifespan, and replication across environments remain unassessed.
      ecology:
        status: partially-supported
        claims:
          - text: The study collected breeding migratory and lagoon-resident three-spined stickleback from the same North Uist saltwater lagoon, Loch an Duin, during the 2023 breeding season, and established separate crosses for each ecotype. This establishes local co-occurrence at the collection site and period only; it is not a distribution estimate.
            sourceIds:
              - barnes2024
            locator: Methods > Fish collection and crosses; Abstract, description of two sympatric saltwater ecotypes.
            placeTimeScope: Loch an Duin, a saltwater lagoon in northeast North Uist, Scotland; fieldwork 30 April–19 May 2023.
            lifeStatus: Wild breeding adults were caught for crosses; embryos were subsequently incubated in laboratory dishes.
            originalLanguage: en
        gaps:
          - One breeding-season collection does not describe habitat breadth, diet, species interactions, migration routes, or other populations.
      evolution:
        status: not-assessed
        claims: []
        gaps:
          - No species-specific phylogenetic or comparative evolutionary analysis was assessed.
      distribution:
        status: not-assessed
        claims: []
        gaps:
          - The collection site is not a global or range-wide distribution assessment.
      fossil:
        status: not-assessed
        claims: []
        gaps:
          - No fossil evidence or bounded fossil-record search was assessed.
      conservation:
        status: not-assessed
        claims: []
        gaps:
          - No current assessment, population trend, or threat analysis was reviewed.
