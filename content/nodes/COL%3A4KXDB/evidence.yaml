        claims:
          - text: Much-branched, woody shrub to 4 m, leafless at flowering, with flexuose branches. Leaves mostly 5-digitate, leaflets obovate, toothed. Flowers in compound umbels, yellow. Fruit oblong to obovate, body of mericarps isodiametric, heteromorphic, one with 2 marginal and 1 median wing other with only 2 lateral wings, vittae absent, oil ducts hollow cavity in wings.
