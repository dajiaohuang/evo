        usage:
          title: Catalogue of Life COL26.8 — Cercopithecus Linnaeus, 1758
          url: https://www.checklistbank.org/dataset/316115/taxon/3L2F
          scope:
            zh: 固定 COL26.8 中的接受名、作者、等级和分类父链；不提供生物学证据。
            en: Pinned COL26.8 accepted name, authorship, rank and parent classification; not biological evidence.
      - id: bempah2021
        referenceId: ref-847128b0-11f1-8082-aad2-122e8dea6e60
        fields:
          - id
          - title
          - url
          - scope
        metadataVariant: 0
        usage:
          scope:
            en: 2017 feeding study of three groups at Ghana's 1.8-ha Duasidan Monkey Sanctuary, with 312 observation hours across wet and dry seasons; not a species-wide diet or population estimate.
            zh: 支持加纳 Duasidan 猴保护区 2017 年三个群体、湿旱季共 312 小时的取食研究；不代表全种食谱或种群估计。
      - id: curtin2004
        referenceId: ref-2a673d37-85bd-86ac-ab0e-d36e2db60de4
        fields:
          - id
          - title
          - url
          - scope
        metadataVariant: 0
        usage:
          scope:
            en: Feeding and ranging observations at Bia National Park, western Ghana, in 1976–1977; the chapter uses the period name C. diana roloway and does not establish current range.
            zh: 支持 1976—1977 年加纳西部 Bia 国家公园的取食与活动观察；章节采用当时的名称 C. diana roloway，不说明当前分布或全种食谱。
      - id: buzzard2006
        referenceId: ref-485cb000-7f19-86ec-a671-cfd4d106814a
        fields:
          - id
          - title
          - url
          - scope
        metadataVariant: 0
        usage:
          scope:
            en: 13-month Taï Forest comparison using two habituated groups for each of three guenon species; findings apply to sampled groups and dates.
            zh: 支持 Taï 森林 13 个月、每种两群的三种长尾猴比较；结果仅适用于研究群体和时期。
      - id: tutin1999
        referenceId: ref-e30b07d4-7f3d-84ca-a119-1f26debc1297
        fields:
          - id
          - title
          - url
          - scope
        metadataVariant: 0
        usage:
          scope:
            en: 17-month study of one resident C. cephus group in a 9-ha forest fragment in northern Lopé Reserve, Gabon; not a population survey.
            zh: 支持加蓬 Lopé 保护区北部 9 公顷林斑中的一个 C. cephus 常驻群及 17 个月观察；不是种群调查。
      - id: cronin2016
        referenceId: ref-ff30f646-c5c8-8c86-a47b-fd76e095d1da
        fields:
          - id
          - title
          - url
          - scope
        metadataVariant: 0
        usage:
          scope:
            en: Reconnaissance surveys compared primate abundance and hunting intensity across three areas of Bioko's Gran Caldera Scientific Reserve; relative tolerance is study-specific, not a current species status.
            zh: 支持比奥科岛 Gran Caldera 科学保护区三个区域的灵长类丰度与猎捕强度漫查；相对耐受性仅指该研究比较，不代表当前状态。
      - id: fournier2023
        referenceId: ref-0bf93335-b90e-8534-ab50-470749186594
        fields:
          - id
          - title
          - url
          - scope
        metadataVariant: 0
        usage:
          scope:
            en: Three systematic terrestrial camera-trap surveys in Lomami National Park and buffer zone (2013–2015), totaling 92 cameras, 5,960 camera-trap days and 598 independent events; events are detections, not animal counts.
            zh: 支持 Lomami 国家公园及缓冲区 2013—2015 年三轮系统性地面相机调查，共 92 台相机、5,960 相机日和 598 次独立事件；事件数不是个体数量。
      - id: takahashi2019
        referenceId: ref-fa1554d5-1847-817f-ae26-4dfbd834bca6
        fields:
          - id
          - title
          - url
          - scope
        metadataVariant: 0
        usage:
          scope:
            en: Nine months of dietary research in one Kakamega Forest population, using 371 all-day focal follows of 24 adult females from three groups; not all populations or age-sex classes.
            zh: 支持 Kakamega 森林一个种群的九个月食谱研究：24 只成年雌性、三个群体共 371 次全天焦点跟踪；不代表所有种群或年龄性别组。
      - id: struhsaker2017
        referenceId: ref-bd2b251d-64db-8acf-ae30-d7288fe59be6
        fields:
          - id
          - title
          - url
          - scope
        metadataVariant: 0
        usage:
          scope:
            en: Diet observations from six neighboring Ngogo groups and three hybrid monkeys over 12 years, plus one Kanyawara group in Kibale National Park; the paper uses C. a. schmidti.
            zh: 支持 Kibale 国家公园 Ngogo 六个邻群和三只杂交猴 12 年饮食观察，以及 Kanyawara 一个群体的比较；论文使用亚种名 C. a. schmidti。
      - id: zoffoun2022
        referenceId: ref-2f1b3bd7-9d87-8423-ae6d-dfb871348e4e
        fields:
          - id
          - title
          - url
          - scope
        metadataVariant: 0
        usage:
          scope:
            en: 2019 occurrence survey of 22 points across four previously surveyed forests and a MaxEnt habitat-suitability projection over a 1,997 km² southern Benin landscape; predictions are not confirmed presence.
            zh: 支持贝宁南部四片既有调查林地的 2019 年 22 个出现点及 1,997 平方公里景观上的 MaxEnt 适宜生境投影；模型结果不等于确认出现。
      - id: clark2023
        referenceId: ref-085a8b3f-b4a3-8f7b-a7b8-0aad7f196a51
        fields:
          - id
          - title
          - url
          - scope
        metadataVariant: 0
        usage:
          scope:
            en: Three months of 2017 observations in the Cyamudongo fragment, Nyungwe National Park; reported diet and vertical use are limited to that study population.
            zh: 支持 Nyungwe 国家公园 Cyamudongo 林斑 2017 年三个月观察；食谱与垂直空间使用仅适用于该研究种群。
      - id: easton2011
        referenceId: ref-5b6378a0-f5a3-809b-a468-c8a2d514ee9d
        fields:
          - id
          - title
          - url
          - scope
        metadataVariant: 0
        usage:
          scope:
            en: Repeated transect and camera-trap surveys in Nyungwe bamboo and mixed forest in 2008–2009; group counts are minimum observations from a difficult-to-detect, predominantly terrestrial monkey.
            zh: 支持 Nyungwe 竹林与混合林在 2008—2009 年的重复样线和相机调查；群体计数是对难以发现、主要地栖的猴所作的最小观察值。
      - id: olaleru2020
        referenceId: ref-5693da42-2676-8265-a563-cb17e602b27f
        fields:
          - id
          - title
          - url
          - scope
        metadataVariant: 0
        usage:
          scope:
            en: Preliminary feeding observations over 37 days in 2011–2013 in Okomu National Park, with opportunistic nutritional sampling; no reliable group density or composition was obtained.
            zh: 支持 Okomu 国家公园 2011—2013 年累计 37 天的初步取食观察及机会式营养样本；研究未可靠测得群体密度或组成。
      - id: haile2026
        referenceId: ref-7a0a9a83-5f78-8134-aa48-f218789be2e5
        fields:
          - id
          - title
          - url
          - scope
        metadataVariant: 0
        usage:
          scope:
            en: Scan samples from six groups across Bonga and Saja forests, June 2022–May 2023; the reported zone and feeding proportions are study-specific.
            zh: 支持 2022 年 6 月至 2023 年 5 月 Bonga、Saja 两片森林六群猴的扫描样本；分区比例与取食比例仅适用于该研究。
      - id: mehon2021
        referenceId: ref-8a7a5bf3-dfe1-8b5b-ae0a-b2e74e2570b8
        fields:
          - id
          - title
          - url
          - scope
        metadataVariant: 0
        usage:
          scope:
            en: Leopard-model experiment in 19 groups in Nouabalé-Ndoki National Park in 2019 and 2020; trial responses are not natural-attack rates.
            zh: 支持 2019、2020 年在 Nouabalé-Ndoki 国家公园对 19 群猴进行的豹模型实验；试验反应不是自然攻击率。
      - id: chapman2004
        referenceId: ref-16bdfba5-e98d-8611-a560-a10ee598278f
        fields:
          - id
          - title
          - url
          - scope
        metadataVariant: 0
        usage:
          scope:
            en: Comparative synthesis of diet records from Makokou, Lopé and Makandé populations of C. pogonias; percentages summarize different sites and underlying studies.
            zh: 支持对 Makokou、Lopé、Makandé 三地 C. pogonias 食谱记录的比较综合；比例汇总不同地点及基础研究。
      - id: tutin1997
        referenceId: ref-6f4dd1ce-d340-89e2-af8c-17a516758250
        fields:
          - id
          - title
          - url
          - scope
        metadataVariant: 0
        usage:
          scope:
            en: Ten-year qualitative and quantitative diet observations for diurnal primates at Lopé, including C. pogonias; local and seasonal evidence, not a range-wide estimate.
            zh: 支持 Lopé 昼行灵长类十年定性与定量食谱观察，包括 C. pogonias；属于局地及季节性证据，不是全分布区估值。
      - id: baker2011
        referenceId: ref-32fedafd-44b5-8315-adba-063175528761
        fields:
          - id
          - title
          - url
          - scope
        metadataVariant: 0
        usage:
          scope:
            en: Occupancy modelling across 58 plots and 125 surveys in the Niger Delta; observer effects and low detection counts limit population interpretation.
            zh: 支持尼日尔河三角洲 58 个样地、125 次调查的占域模型；观察者效应与较少检出限制种群解释。
      - id: mcgraw1994
        referenceId: ref-13e3c45d-47ca-8620-a3dc-0a7f567d17f5
        fields:
          - id
          - title
          - url
          - scope
        metadataVariant: 0
        usage:
          scope:
            en: Local multi-species census and association study that includes C. wolfi; group size and habitat findings are not a species-wide account.
            zh: 支持包含 C. wolfi 的局地多物种普查和混群研究；群体规模及生境结果不构成全种综述。
