        claims:
          - text: Cormous geophyte, 10-30 cm, tunics woody, concentric. Leaves sword-shaped to linear, plane. Flowers several per spike, white or purple, tepals spreading.
            textZh: Geissorhiza inconspicua Baker 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 6787; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Geissorhiza inconspicua can usually be distinguished by its 3 to 5 comparatively short leaves clustered at the base of the plant and typically well-branched stems with several-flowered spikes held well above the leaves. Flowers are either white or violet to purple. It is sometimes difficult to separate from the Langeberg species, G. foliosa, but this species has shorter and often relatively broad leaves in contrast to the longer, narrowly sword-shaped to linear leaves of G. inconspicua, and larger flowers with tepals 13-17 mm long and anthers 4-6 mm long vs. tepals mostly 8-11 mm long (rarely up to 15 mm) and anthers 3-4 mm long in G. inconspicua.
            textZh: SANBI 条目提供了 Geissorhiza inconspicua Baker 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 94644; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
