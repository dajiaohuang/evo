  claims:
    - subjectId: taxon:cryptodira
      claimKind: scientific
      claimType: topology
      statement: The Cryptodira route represents the sampled crown-side turtle clade in Joyce’s morphology matrix; relationships within Cryptodira are partly unresolved, and the analysis does not supply an exact crown origin or global first appearance.
      confidence: medium
      confidenceRationale: The study directly scores 45 fossil and 22 living species and discusses Cryptodira explicitly. Medium confidence preserves matrix and missing-data sensitivity and withholds any age claim.
      referenceLinks:
        - referenceId: joyce-2007-mesozoic-turtle-phylogeny
          relation: supports
          pages: 3–102
          figure: Figures 1–3; Appendices 1–3
          quoteLocator: "pp. 3–7 methods and taxon sample; p. 67 ‘Clade 25: Cryptodira’; pp. 52–86 phylogenetic results"
    - subjectId: taxon:cryptodira
      claimKind: scientific
      claimType: fossil-range
      statement: Joyce’s matrix defines and samples Cryptodira but does not validate 155.6 Ma as a crown-cryptodire minimum; the former borrowed display is withheld pending a node-specific calibration.
      confidence: low
      confidenceRationale: "Crown Cryptodira temporal range: the cited primary study or systematic review directly supports the stated sample, calibration or withholding boundary at the supplied locator. Confidence is low and does not extend to a global FAD, LAD, direct ancestor or unsampled interval."
      referenceLinks:
        - relation: supports
          referenceId: joyce-2007-mesozoic-turtle-phylogeny
          pages: 3–102
          figure: Figures 1–3; Appendices 1–3
          quoteLocator: "Clade 25: Cryptodira; fossil and living taxon sample; unresolved internal nodes"
  claim-rationales.zh:
    - 该研究直接编码了 45 个化石种和 22 个现生种，并明确讨论隐颈龟类。中等置信度保留矩阵与缺失数据敏感性，不作年代断言。
    - Crown Cryptodira temporal range：所引一手研究或高质量系统综述在给定页码、图表或章节处直接支持此处的样本、校准或暂缓边界。置信度为低。该置信度不外推至全球首现、全球末现、直接祖先或未采样区间。
  claim-statements.zh:
    - 隐颈龟类路线表示 Joyce 形态矩阵中取样的龟类冠群一侧支系；隐颈龟内部部分关系仍未解决，该分析并未给出精确的冠群起源或全球首现。
    - Joyce 的矩阵定义并采样了曲颈龟类，但不能把 1.556 亿年前验证为曲颈龟冠群下限；原先借用的显示暂缓，等待节点专属校准。
  ranges:
    - entityId: cryptodira
      rangeKind: global-composite
      taxonomicConcept: Crown Cryptodira temporal range
      geographicScope: Crown interval pending a node-specific fossil calibration
      olderMa: 0
      youngerMa: 0
      status: withheld-pending-provenance
      uncertainty:
        olderMa: null
        youngerMa: null
        note: The broad Mesozoic turtle matrix does not provide the former 155.6 Ma edge as a validated Cryptodira minimum.
      evidenceBasis: The former display is withheld rather than borrowing a Testudines calibration.
      evidenceLevel: literature-synthesized
      confidence: low
      claimIds:
        - claim:taxon:cryptodira:range-boundary
      referenceLocators:
        - referenceId: joyce-2007-mesozoic-turtle-phylogeny
          locator: "3–102; Figures 1–3; Appendices 1–3; Clade 25: Cryptodira; fossil and living taxon sample; unresolved internal nodes"
