        claims:
          - text: Rounded, grey-mealy shrub to 75 cm. Leaves cuneate, toothed above, pale-mealy beneath. Flowers in small clusters, yellow, calyx brownish velvety.
            sourceIds:
              - sanbi_14353_0
            locator: "SANBI/WFO archive Morphology row 8422; source 14353.0; publication: Manning, JC; Goldblatt, P. 2012. Malvaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 613 - 621. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: This species is characterized by the dense, lepidote- stellate tomentum on the calyx. The principle diagnostic characters are that in H. multiflora the leaves are discolorous with rounded apices and prominent, subflabellate nerves beneath and the flowers are disposed in cymose panicles with acuminate bracts whereas the leaves in H. cuneifolia are the same colour on both surfaces, with a silvery hue, truncate or emarginate at the apex and the nerves seldom prominent. The flowers are secundly arranged on short, cernuous pedicels and the bracts are broadly ovate and abruptly acute but not acuminate.
            textZh: SANBI 条目提供了该种的鉴别特征。
