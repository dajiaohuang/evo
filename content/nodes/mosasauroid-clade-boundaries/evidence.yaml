  claims:
    - subjectId: event:mosasauroid-clade-boundaries
      claimKind: scientific
      claimType: topology
      statement: "Mosasauroidea and Mosasauridae are not interchangeable: the former is a broader branch-defined mosasauroid clade, whereas the latter is a node-defined family; Dallasaurus anatomy shows that family placement and fully paddle-like limb specialization are separate character questions."
      confidence: high
      confidenceRationale: The clade definitions are explicit in Table 1, while the Dallasaurus skeletons directly preserve plesiopedal limbs. Basal branching remains analysis-sensitive, so the claim distinguishes definitions and anatomy from one universal topology.
      referenceLinks:
        - referenceId: madzia-cau-2017-mosasauroid-nomenclature
          relation: supports
          pages: Article e3782
          figure: Table 1; Figures 1–7
          quoteLocator: Phylogenetic definitions; sensitivity analyses
        - referenceId: bell-polcyn-2005-dallasaurus
          relation: supports
          pages: 177–194
          figure: Figures 1–13
          quoteLocator: Systematic paleontology; phylogenetic analysis
  claim-rationales.zh:
    - 表 1 明确列出两个支系定义，Dallasaurus 骨架直接保存较原始的步行型肢体；基部支序仍随分析变化，因此主张只区分定义与解剖，不把单一拓扑写成定论。
  claim-statements.zh:
    - Mosasauroidea（沧龙超科）与 Mosasauridae（沧龙科）不可互换：前者是范围更广的支系定义沧龙超科，后者是节点定义的科；Dallasaurus 的解剖还表明科级归属与完全鳍桨化肢体是两个不同问题。
