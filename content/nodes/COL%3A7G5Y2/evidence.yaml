    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Perennial herb, geophyte, 0.35-0.70 m high; corm globose, tunics grey-brown, fine to coarsely reticulate; stem simple. Leaves ensiform, 3-15 mm wide, margins and midribs thickened. Inflorescence a dense spike; flowers deep red with darker streak in lower half of lower tepal; perianth tube cylindric above, 20 mm long; tepals lanceolate, 20-22 mm long. Stamens unilateral, arcuate below upper tepal; anthers 9 mm long. Ovary globose; style arching over filaments. Flowering time Nov.-Feb.
            textZh: Watsonia gladioloides Schltr. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_18505_0
            locator: "SANBI/WFO archive Morphology row 91099; source identifier 18505.0; cited publication: Bredenkamp, CL; Magwaza, ZL. 2019. Iridaceae. In: CL Bredenkamp (ed.), A Flora of the Eastern Cape Province, Strelitzia 41(3): 1821 - 1882. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Recognised by the narrow leaves, 3-15 mm wide and unbranched stem of tubular, dark red flowers, the upper part of the tube subcylindric, (20-)25-30 mm long and slightly longer than the tepals, and dry, brown bracts. The filaments are 25-35 mm long, exserted 5-7 mm from the perianth tube. Watsonia latifolia from northern KwaZulu-Natal and southern Mpumalanga with similar long-tubed, red flowers has broad, bright green leaves, 30-60 mm wide, and the upper part of the perianth tube 18-24 mm long and slightly shorter than the tepals.
            textZh: SANBI 条目提供了 Watsonia gladioloides Schltr. 的鉴别特征。
