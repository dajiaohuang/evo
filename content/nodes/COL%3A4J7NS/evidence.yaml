        usage:
          title: Piqueria trinervia Cav., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Erect short-lived perennial herbs to 1.5 m high, with few or no branches; stems often pale, terete to slightly quadrangular, puberulous on internodes along opposite surfaces above leaf axils and on upper surfaces of branches, glabrescent. Leaves opposite; blades ovate to broadly lanceolate, to 8 cm long and 3.5 cm wide, the base rounded and trinervate, the margins with many coarse serrations, the apex acute to slightly acuminate, the surface glabrous or sparsely puberulous mostly on veins; petioles short but distinct, 2-10 mm long. Inflorescence a lax to rather dense panicle with cymose to subcymose branches, the ultimate branches 1-4 mm long, partly puberulous. Heads 3.54.0 mm high with 3-4 florets and 3-4 involucral bracts, the florets fragrant; involucral bracts eximbricate in 1 series, broadly oblong-elliptical with truncate to emarginate tip and distinctly excurrent mucronate midvein, the margins scarious, the outer surface glabrate; corolla white, ca. 2 mm long with distinct, short, densely pubescent tube, the limb short and broadly campanulate, the lobes ca. 1 mm long and 0.6 mm wide, with a few glands on outer surface, the inner surface of limb and the bases of filaments with short hairs. Achenes ca. 2 mm long, glabrous; carpopodium asymmetric with sigmoid trace; pappus lacking.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 1967
