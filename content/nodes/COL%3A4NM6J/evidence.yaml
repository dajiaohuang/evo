          originalSourceText: Erect, perennial stoloniferous herbs 10-80 cm tall; stem sometimes hollow, the branches few, ascending, generally with one branch distinctly dominant, the branches to 35 cm long, hispid, with trichomes 1.3-2.5 mm long. Leaves cauline, the lower obovate to oblanceolate, basally cuneate, acute or sometimes rounded at apex, sinuate and sparsely serrate, 2-7(-14) cm long, 1.2-2.0(-4.5) cm wide, chartaceous, resin-dotted beneath when young, merely punctate later, hispid or sometimes strigose on both surfaces, the pubescence at first yellowish, later whitish, persistent, the trichomes 2.0-3.5 mm long, shorter in depauperate individuals, the leaves becoming abruptly shorter, oblong-elliptic upwards; venation somewhat obscure above; petioles winged, basally broadly expanded, apically constricted. Inflorescences several racemose-spicate branches or solitary, the flowering nodes with oblong bracts mostly to 1.5 cm long, 2-10 mm apart; clusters of heads subsessile, solitary in the axils, generally overlapping, capitate, obconic, to 9 mm high and 12 mm across, dense, 5-10-headed, the individual heads overlapping and ? distinguishable. Heads with 4 florets; involucral bracts 8, similar, in 4 decussate pairs, the outer pairs progressively shorter, the inner 2 pairs subequal, oblong-lanceolate, boat-shaped, 7-8 mm long, 1-2 mm wide, mucronate, not keeled, scabridulous and somewhat greener toward the apex, hyaline basally and along the margins; corolla blue-violet, the tube slender, ca. 3.5 mm long, the limb ca. 2.5 mm long,- -deeply divided on the adaxial side, 5-parted, the lobes ca. 1 mm long; anthers ca. 1.2 mm long, basally sagittate, the lobes ca. 0.15 mm long, apically appendaged; style branches flattened and stigmatic adaxially, ca. 1.0 mm lcng, minutely strigulose on the abaxial side of the branches and slightly
