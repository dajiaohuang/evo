          originalSourceText: terminal leaflet 6-7 cm long, 4.5-5.6 cm wide, the laterals 5-5.5 cm long, 3-3.5 cm wide. Inflorescence composed of axillary and terminal racemes or highly branched panicles; rachises angulate, striate, densely uncinulate pubescent with stout, yellowish, hooked trichomes underlain by minute, white trichomes; pedi- cels borne in pairs, each pair subtended by a primary bract; secondary bracts each subtending a single pedicel only rarely seen; primary bracts ovate acuminate, striate, ciliate, puberulent on abaxial surface, early deciduous, 5-7 mm long, 2.5 mm wide40; pedicels uncinulate puberulent, 4-7 mm long. Flowers with the calyx appressed pilose on the teeth of both lobes, quickly reflexing almost completely at flower maturity, then disintegrating, central tooth of lower lobe 5 mm long, lateral teeth 3.4 mm long, upper bifid lobe 3 mm long4l; corolla42 magenta to white, the standard orbicular, scarcely clawed, 4.5 mm long and broad, the wings almost rectangular, short clawed and slightly auriculate, truncate at apex, 5.5 mm long, 4 mm wide, keel petals partially fused, each scythe shaped and tapering to a slender base, 5 mm long, 1.5 mm wide at apex. Loment stipitate, (1-)2-3- articulate, the stipe slightly pubescent, becoming glabrate, 3-4 mm long; articles nearly orbicular, with a narrowly V-shaped notch ca. 2.5 mm deep on the dorsal suture, shoulders becoming somewhat beaked, the articles often overlapping, ciliate with both hooked and tapering trichomes, puberulent to glabrous on sur- faces; seed reniform, reddish to brown, almost centrally placed in the article but not filling it, long funiculate, ca. 3.5 mm long, 2.5 mm wide.
