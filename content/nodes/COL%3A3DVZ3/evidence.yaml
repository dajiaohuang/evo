        claims:
          - text: Plants clumped or single. Leaves spreading, 4-8 per rosette, crowded, thick, ovate-rhomboid, 15-20 x 15-20 mm, keeled, with 3-6 short, whitish stout teeth on each margin, almost without bristles, some teeth may be rudtmentarily developed; surface with many epidermal whitish dots, sometimes confluent on leaf margins and keel; upper surface with blunt, whitish tooth-like tubercles (this may vary from a single tubercle to, very rarely, a complete tuberculate surface). Flowers yellow, as F. felina. Stigmas 5, filiform, free to the base. Nectaries yellow-brown, large. Fruits and seed as in F. felina subsp felina.
            sourceIds:
