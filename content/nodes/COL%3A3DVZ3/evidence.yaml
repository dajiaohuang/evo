            locator: "SANBI/WFO archive Morphology row 81813; source 5640.0; publication: Groen, LE; Van der Maesen, LJG. 1999. Revision of the genus Faucaria (Ruschioideae: Aizoaceae) in South Africa. Bothalia 29(1): 35 - 58. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: At a glance F. felina subsp. tuberculosa can be identified by the tubercles on the leaves which are unique in the genus. A typical plant is compact, with whitish dots and patches and resembles F. tigrina. Cultivated hybridised plants often show tubercles more prominent than in wild material.
