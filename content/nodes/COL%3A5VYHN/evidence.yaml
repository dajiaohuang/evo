        usage:
          title: Bacopa repens (Sw.) Wettst., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Aquatic or paludal herbs, stems stout but weak and prostrate, fistulose, drying flat, pubescent with spreading white hairs, glabrescent; roots fibrous, sometimes rooting at the nodes. Leaves obovate, elliptical or orbicular, apically obtuse or round, basally cuneate or slightly clasping, to 20 mm long, 15 mm wide, palmately many nerved, glabrous or pubescent, the margins entire or somewhat sinuate. Inflorescences 1(-3) flowers in the leaf axils, the peduncles slender, pilose, ca. 8 mm long, slightly longer in fruit, terete or drying angled, ebracteate. Flowers with 4-5 free sepals, the outer 2 sepals 2.5 mm long, 1.5 mm wide, entire, oblong, apically blunt acute, basally narrowed, nervose, glabrate or pilose, sometimes ciliate, the inner 2 sepals narrower, thin costate, ciliolate, shorter than the outer sepals; corolla white, the throat ?yellow, 3 mm long; stamens 4, the filaments glabrous, inserted at the top of the corolla tube, the anthers dark, broadly ellipsoidal, ca. 0.7 mm long, the thecae proximal; ovary glabrous, the style apically furcate, the stigmas 2-lobed, peltate, the style basally tapering gradually into the ovary, the style 1 mm long. Capsule globose, ca. 2 mm long, partly enclosed by the accrescent sepals, the sepals becoming 3-4 mm long.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 12883
