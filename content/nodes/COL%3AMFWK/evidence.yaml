    facets:
      morphology:
        status: not-assessed
      lifeHistory:
        status: partially-supported
        claims:
          - text: During 27 transect walks at Kew Gardens from October 2007 through March 2008, queens and workers of Bombus terrestris were observed throughout the winter. Worker observations rose in early December, peaked in January, and declined in late February or early March; males were observed only through early November. The observations establish winter activity at this site, but do not demonstrate successful reproduction or a second generation.
            sourceIds:
              - stelzer2010
            locator: Methods, Transect Walks; Results, Transect Walks and Fig. 4 caption; Discussion, limits on inferring a successful winter generation.
            placeTimeScope: Royal Botanic Gardens, Kew, Surrey, London, United Kingdom; 27 fixed-transect walks from 2007-10-01 through 2008-03-28. The version of record was published 2010-03-05.
            lifeStatus: Free-flying bees observed in the field. This claim excludes separately tested commercial B. terrestris dalmatinus colonies and does not describe captive or domesticated populations.
            originalLanguage: en
        gaps:
          - The evidence is a single-site, single-winter transect series and cannot establish species-wide phenology or population trends.
          - The authors caution that the observations do not establish whether winter activity produced new queens or males; reproductive success remains unassessed.
          - The article's foraging-rate experiments used commercial B. terrestris dalmatinus and are excluded from this species-specific claim.
