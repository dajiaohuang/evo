          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: A rather large, assurgent herb; stem 3-5 mm. thick below when dry, ascending to 30 cm. or more, villous toward the base, glabrescent upward, internodes 3-4 cm. long below, reduced upward; leaves alternate or sometimes 2 or 3 at a node, sub- rhombically oblanceolate, apex blunt, emarginulate, base cuneate, 1-2 cm. wide X 2.5-5 cm. long, rather obscurely palmately 3-nerved, glabrous on both sides, cilio- late toward the apex, dark-glandular-dotted, drying firm and opaque, paler beneath; petiole 5-10 mm. long, grooved above, glabrous, clasping-decurrent; spikes terminal and axillary, 1 mm. thick X 10-18 cm. long, closely flowered; peduncles 1-2 cm. long, glabrous; bracts round-peltate, glandular-dotted; fruit ovoid, about 0.5 mm. long, apex oblique, stigma subapical.
