          title: Tropaeolum emarginatum Turcz., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Tall, probably annual climber to 8 m long, glabrous or rarely (juvenile) sparsely pubescent around the base of the petioles; stipules small, usually per- sistent; petioles 6-9 cm. Leaves dark green, somewhat glaucescent below, sub- orbicular, 3-6 cm long, 4-7 cm broad, 5-lobed to sublobate, the lobes obtuse, emucronate, peltate, the principal nerves 3, the lateral nerves forked. Flowers on slender, often reddish peduncles, shorter than the petioles or of the same length; calyx lobes homomorphic, elliptic to almost suborbicular, 9-10 mm long, 7 mm broad, subacute, reddish or sometimes somewhat greenish yellow; spur 20-25 mm long, straight or slightly curved, the base conical to cylindrical, 12- 15 mm long, abruptly turning in a slender appendix, normally red but sometimes greenish near the apex; petals serrate-ciliate, yellow, the upper petals cuneate to spathulate, 8-9 mm long, 4 mm broad near the apex, often with a purple spot, the lower petals long unguiculate, 10-11 mm long, the lamina 5-6 mm long, 4-5 mm broad, not spotted. Fruiting carpels triangular, 5-6 mm long, ribbed.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 13548
