          title: Lonchocarpus velutinus Benth., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Tree 5-16 m. high. Leaves predominantly 7 (rarely 5-or 9-)-foliolate; leaflets oval or oblong, 4-15 cm. long, 2-5 cm. wire, acute at the base, short-acuminate to obtuse or retuse at the apex, velutinous. Racemes axillary, 11-20 cm. long; bractlets linear, caducous, distant from the calyx. Flowers with the calyx salverform, 5-den- tate; petals dark purplish-red; vexillum orbicular, 9 mm. long, minutely sericeous within; wing petals narrowly oblong, the claw about 2.5 mm. wide, the blade 5.5 mm. long; anthers sparsely and minutely hairy. Legumes thin and flattish, elon- gate- to linear-lanceolate, 8-11 cm. long, 1.5-1.7 cm. wide, submembranous, strami- neous or pale yellow, 1- or 2-seeded.
