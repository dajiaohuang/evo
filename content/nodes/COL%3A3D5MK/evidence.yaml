    facets:
      morphology:
        status: partially-supported
        claims:
          - text: A bushily branching erect shrub 0.5-2 m tall, glabrous except for some tomentum at peduncle-bases and in leaf-axils. Young branches closely leafy, soon becoming denuded. Leaves closely set, spreading, flat, herbaceous, shallowly-deeply pinnatilobate, 3-10 cm long, 1-3 cm wide, broadest above the middle, basally narrowed into a petiole-like portion, pinnately veined with a distinct midvein and thinner lateral veins; veins fine and impressed on the adaxial side, raised and prominent on the reverse; leaf-lobes 3-10 on each side, ovate-lanceolate, 2-20 mm long, up to 5 mm wide, subacute-obtuse and mucronate, the basal ones gradually smaller, acuminate-subulate. Peduncles terminal, often several together, erect, 5-20 cm long, 0.6-1 mm thick or slightly more, somewhat thickened below the capitula, striate-sulcate, with tufts of white wool surrounding the base. Involucre widely campanulate, 1-1.8 cm in diam. Involucral bracts subbiseriate, partly overlapping, 8-15, ovate-lanceolate, 5-8 mm long, 2-4 mm wide, green, faintly striate, basally connate (to 1/5-1/3), with obtuse-subacute puberulous tips. Receptacle convex-conical, alveolate. Ray-florets 11-20, yellow. Tube cylindrical, 1-2 mm long. Lamina narrowly obovate-oblanceolate(-linear), (8-)12-20 mm long, (2-)2.5-5 mm wide, 4(-7)-veined, usually widest above the middle. Style terete; style branches flattened, c. 1 mm long. Disc-florets c. 50-125. Corolla 4-5 mm long. Tube cylindrical, 1-1.5 mm long. Limb very narrowly campanulate, 3-3.5 mm long; lobes narrowly ovate, c. 1 mm long. Anthers (1.7-)2 mm long incl. the narrowly ovate acute appendage. Style terete; style branches c. 0.8(-1) mm long, with conical tips. Pappus 0. Achenes (narrowly) oblong-obovate to almost fusiform, 3.5-5 mm long, 1-2 mm wide, brown-black, glabrous, with 8-11 longitudinal ribs.
