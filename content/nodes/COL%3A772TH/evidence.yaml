          originalSourceText: A rather large, divaricately branching, tree-like, glabrous herb; stem "about 1 m. tall, green, conspicuously mottled with red," internodes 6 cm. or more long below, reduced upward; leaves alternate, lance-elliptic and rather long-acuminate, or lower leaves round-elliptic and abruptly and bluntly short-acuminate, base acute, 2-3 cm. wide X 6-7 cm. long, or lower leaves 4-5 X 6-7 cm., ciliate toward the apex, palmately 5- or faintly 7-nerved, the nerves prominent, drying thin, trans- lucent, rather densely glandular-dotted, "every dark, lustrous and satiny above; below very pate, non-lustrous and conspicuously ribbed" when living; petiole mostly 5-10 mm. long, grooved above, clasping-decurrent; spikes axillary and terminal, "dark red" when living, 2 mm. thick X 6-10 cm. long, moderately flowered; peduncle about 1 cm. long; bracts round-peltate; ovary obovoid, apex oblique, stigma subapical; fruit not matured.
