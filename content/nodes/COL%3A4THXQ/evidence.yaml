        claims:
          - text: Scrambling or climbing, slender, perennial herb, reaching up to 1.5-5.0 m high; stems 4-ribbed, often with recurved prickles. Leaves and stipules similar; blades cordate; upper surface glabrous, margins and veins below with recurved prickles; petioles 15-60 mm long. Flowers in several- to many-flowered, axillary and terminal cymes. Corolla subcampanulate, greenish to yellow; lobes ± triangular, long-acuminate. Flowering time Jan.-May. Fruit dark purple to black, of 2 mericarps up to 3.9 mm in diam.
