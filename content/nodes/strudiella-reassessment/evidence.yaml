      statement: The Strudiella case records a published insect diagnosis followed by a primary re-investigation that rejects the insect interpretation, making the specimen a useful example of contested Devonian arthropod evidence.
      confidence: high
      confidenceRationale: Both papers explicitly state their opposing interpretations of the same named specimen; the event describes the literature sequence and does not adjudicate an unobserved definitive placement.
