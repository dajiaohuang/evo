    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, up to 150 mm tall. Leaves lanceolate-falcate, in a dense fan. Flowers few, in a weakly 2-ranked spike, bilabiate, yellow flushed with orange, the tepals darkly veined, heavily scented, perianth tube 25-32 mm, exceeding the tepals, the lower 3 each with a thickened median ridge.
            textZh: Tritonia karooica M.P.de Vos 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_14562_0
            locator: "SANBI/WFO archive Morphology row 33392; source identifier 14562.0; cited publication: Goldblatt, P; Manning, JC. 2013. Iridaceae. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 94 - 124. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Recognised by its short stature, tight fan of usually falcate or strongly curved, leathery leaves with the cauline leaves seldom visible above the basal fan, and short, inclined spike of large, funnel-shaped flowers with a sharply bent perianth tube 25-32 mm long and about twice as long as the tepals. The stem is shortly exserted above the leaves and the fragrant flowers are pale creamy to dull orange, with conspicuous dark veins, and long, bright yellow ridge or crest-like calluses less than 1 mm high on the lower tepals extending into the throat. The congested fan of recurved, leathery leaves, short stem, and large, funnel-shaped flowers with long, crest-like calluses, and large capsules all suggest a relationship with Tritonia florentiae from the Tanqua and western Great Karoo. Flowering in the winter in May and June, acaulescent T. florentiae has bright yellow flowers without conspicuous veins and a perianth tube about as long as the tepals.
            textZh: SANBI 条目提供了 Tritonia karooica M.P.de Vos 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 94798; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
