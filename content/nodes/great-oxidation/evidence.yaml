  claims:
    - subjectId: event:great-oxidation
      claimKind: scientific
      claimType: event-mechanism
      statement: Sulfur-isotope and redox records support a prolonged oxygenation transition; U–Pb baddeleyite ages place its onset between about 2,460 and 2,426 Ma rather than at one instantaneous boundary.
      confidence: high
      confidenceRationale: The proxy transition is supported across a broad synthesis and the onset bracket comes from directly dated igneous units. High confidence applies to that bounded onset interval, not to a single universal oxygen threshold or trigger.
      referenceLinks:
        - relation: supports
          referenceId: gumsley-2017-goe
          pages: 1811–1816
          figure: Figure 1
          quoteLocator: Results; Table 1; SI Tables S1 and S4–S5
        - relation: contextualizes
