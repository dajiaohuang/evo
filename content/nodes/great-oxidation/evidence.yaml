          pages: 307–315
          quoteLocator: Great Oxidation Event synthesis and proxy discussion
  claim-rationales.zh:
    - 一手 U–Pb 测年把大氧化事件起始约束在约 24.60–24.26 亿年前，综合代用指标则说明变化是分阶段的；高置信度不等于存在单一全球氧阈值或唯一触发机制。
  claim-statements.zh:
    - 硫同位素与氧化还原记录支持一个持续的增氧转变；晶质铀铅测年把其起始置于约 24.60–24.26 亿年前之间，而不是一个瞬时界线。
