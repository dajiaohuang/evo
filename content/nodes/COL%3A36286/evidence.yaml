        claims:
          - text: Plants 0.65-1.35 m high, solitary. Corm ± 10 mm diam. Stem with lowermost peduncle 100-220 mm long. Foliage leaves 2 or 3, 300-750 x 1.0-2.5 mm; reduced sheathing leaves 2 or 3. Spikes pendulous, terminal densely 5- to 13-flowered, laterals 1 to 5, each 4- to 11-flowered; bracts obovate-elliptic, acute, 13-24 x 8-9 mm, 2 internodes long or longer, solidly coloured or heavily flecked dark reddish brown, paler toward margins, lateral veins ± 7 each side of main vein. Flowers bell-shaped with tepals suberect or scarcely flaring apically, pale creamy yellow; perianth tube 6.5-8.0 mm long; tepals 9-11 x 4-6 mm. Anthers 5-6 mm long. Stigmas held 4.0-6.5 mm below top of perianth.
            textZh: Dierama pumilum N.E.Br. 的 SANBI 物种条目记录了形态特征。
