          publishedAt: undated
          originalSourceText: Glabrous trees; twigs slender, much branched. Leaves ovate or oblong, acute at the base, long-acuminate at the apex, 4-8 cm. long and 2-4 cm. wide, membrana- ceous, glabrous, the midrib impressed above, prominent beneath, the lateral nerves up to about 12 pairs, delicate, inconspicuous, arcuate-anastomosing at about 2-4 mm. from the margin; petiole about 4 mm. long. Racemes glabrous or minutely puberulous, axillary, sometimes the flowers partly solitary, the fully developed ra- cemes 7- to 11-flowered, the rhachis 2-3 cm. long, the pedicels filiform, 3-5 (-10) mm. long, the uppermost flower usually sessile. Flowers white, small. Sepals up to 1.5 mm. long. Petals 3 mm. long, not covered by the calyx in the bud. Ovary glabrous, 1 mm. high. Berry globose, 1-seeded, crowned by the small calyx.
