          originalSourceText: A shrub or small tree, 2-3 m. tall, more or less nodose, twigs straight or some- what zig-zag, glabrous; flowering internodes short and rather slender; leaves lance- elliptic, 2.5-6 cm. wide X 10-18 cm. long, apex acuminate, base subequilaterally acute, pinnately nerved throughout, the nerves 5-8 or 10 on each side, loop-con- nected upward, glabrous or rather sparsely pubescent along the nerves beneath, drying thin, translucent, glandular-dotted; petiole from 5 mm. long above to 10-15 mm. long below; spikes 3-4 mm. thick X 5-9 cm. Iong; peduncle filiform, 1-2 cm. long; bracts triangular-subpeltate, sparsely marginally fringed; fruit trigonous, more or less granular-papillate, scarcely longer than thick, truncate-concave at apex; stigmas 3, short, sessile.
