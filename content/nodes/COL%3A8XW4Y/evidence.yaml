    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Caespitose, phyllopodic perennial graminoid. Often viscous on sheaths. Culms terete, robust, 449-848 x 0.3-1.7 mm. Leaves basal, usually flat, not channelled directly above sheath, up to half of culm height, margin serrate above sheath, 1-6, 40-177 x 0.2-1.6 mm. Sheaths dark red at base and ivory coloured above, firm, longitudinally striate. Ligule slightly membranaceous, 0.5-4.3 mm. Inflorescence a pseudolateral panicle, usually compact, 14-39 x4-11 mm, proximal rachis length 5-14 mm. Proximal primary inflorescence bracts firm, not channelled, apex acuminate, not widened at base, 36-128 mm long, exceeding length of inflorescence 1.5 times or more, longitudinal veins not prominent. Proximal and subproximal primary inflorescence bracts without membranaceous extensions at base. Spikes 2-4, 4.0-20.5 mm long, overlapping. Spikelets broadly lanceolate, can be relatively long, 5.8-12.6 x0.7-1.4 mm, pedicellate, 2-6 spikelets per spike, reddish-brown in colour with reddish-purple streaking evident on upper glumes, lower glumes thicker and firmer than upper glumes. Proximal spikelet prophyll 1-2 pervspikelet, often difficult to distinguish from lower glumes, with raised central vein extending to mucro, 1.4-4.0 mm long, prophyll mucro 1.3-4.9 mm long. Rachilla 1.0-2.4 mm long. Glumes 4-7 per spikelet, proximal glume 1.8-4.0mm long, subproximal glume 2.0-5.0 mm long, lower glumes with narrow hyaline margin, upper glumes longer and thinner than basal ones, apex acute. Glume mucros varying in length, proximal mucro length 0.1-1.2 mm, subproximal mucro length 0.1-1.1 mm. Stamens 2-4 per floret, anthers 1.7-1.8 mm long. Stigmas 3-branched, vestigial stigmas of second bisexual floret often observed. Perianth bristles not observed. Nutlet broad elliptic, trigonous, yellowish in colour, 3-5 x 1.2-1.8 mm (two measured). Nutlet beak, 0.5-1.8 mm long, hispid, slightly bulging over nutlet body.
