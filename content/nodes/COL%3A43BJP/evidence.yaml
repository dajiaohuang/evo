        usage:
          title: Mikania psilostachya DC., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Sparingly branched, woody vines; stems brownish to slightly reddish, terete to slightly quadrangular, slightly striate, densely short-puberulous, never fistulose. Leaves opposite; blades ovate to elliptical, to 15 cm long and 8 cm wide, the base narrowly rounded to shortly cuneate, the margins usually remotely subserrulate, the apex sharply acute to slightly acuminate, the upper surface scabrid, the lower surface distinctly short- usually brownish-puberulous and prominently glandular punctate, 2-3 pairs of strongly ascending secondary veins arising in the basal half of the blade, smaller vein reticulations prominent; petioles ca. 1 cm long, petioles of the largest leaves to 3 cm long. Inflorescence a panicle with elongate, strictly spicate or racemose branches, the ultimate branches 0-6 mm long, minutely puberulous. Heads 7-9 mm high; subinvolucral bract situated at the base of the pedicel, linear-lanceolate, 1.5-2.0 mm long, densely puberulous abaxially; involucral bracts oblong-lanceolate with short-acute tips, ca. 5 mm long, ca. 1 mm wide, brownish-puberulous and sparsely glandular-punctate outside; corolla white, 4.0-5.0 mm long, the tube narrow, 1.0-1.5 mm long, the limb narrowly campanulate to tubular, cleft 1/5-1/3 of the length into short- or elongate-triangular lobes, few to many glands and hairs on the outer surface, the corolla cells oblong, 15-25 JL wide, often with sinuous walls; anther appendages firm, ovate-triangular, half again as long as wide; style base glabrous, the style appendages usually slightly tapering, with short papillae. Achenes 4-5-ribbed, 2.5-3.0 mm long, with many glands and scattered hairs; pappus of ca. 40 slender bristles mostly in 1 series, the tips gradually enlarged.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 2081
