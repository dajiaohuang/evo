  claims:
    - subjectId: taxon:ichthyostega
      claimKind: scientific
      claimType: fossil-range
      statement: Ichthyostega is bounded here by specimens from Famennian Upper Devonian deposits of East Greenland used in the cited mobility study; this bounded sample context is not a global distribution or exact complete range.
      confidence: medium
      confidenceRationale: "Ichthyostega: Medium confidence applies to the named specimen or sampled analysis at the inherited concrete locator. The wording deliberately limits the claim to that evidence and does not promote a range-ledger display envelope into a global biological boundary."
      referenceLinks:
        - relation: supports
          referenceId: pierce-2012-ichthyostega-mobility
          pages: 523–526
          figure: Figures 1–3; Supplementary Figures 1–6
          quoteLocator: East Greenland specimen context
    - subjectId: taxon:ichthyostega
      claimType: taxonomy
      claimKind: scientific
      statement: The Ichthyostega mobility study analyses the genus as an early tetrapod and tests its limb mechanics against living analogues; the mechanical result is not a complete phylogenetic hypothesis.
      confidence: medium
      confidenceRationale: The genus-level study and comparison are explicit, but a mobility experiment cannot by itself resolve all early-tetrapod relationships; the claim is kept at the reported scope.
      referenceLinks:
        - referenceId: pierce-2012-ichthyostega-mobility
          relation: supports
          pages: 523–526
          figure: Figures 1–3
          quoteLocator: Study introduction and comparative mobility analysis
    - subjectId: taxon:ichthyostega
      claimType: biogeography
      claimKind: scientific
      statement: The Ichthyostega specimens reconstructed in the cited study are from East Greenland Upper Devonian deposits; this named sample does not establish a global range.
      confidence: high
      confidenceRationale: The specimen and locality context are explicit in the primary study. The claim does not infer distribution beyond the documented sample.
      referenceLinks:
        - referenceId: pierce-2012-ichthyostega-mobility
          relation: supports
          pages: 523–526
          quoteLocator: East Greenland specimen context
    - subjectId: taxon:ichthyostega
      claimType: morphology
      claimKind: scientific
      statement: Three-dimensional reconstruction of Ichthyostega limb joints found no long-axis rotations required for a typical lateral-sequence walk in the tested model, while retaining the possibility that this is a specialization of Ichthyostega.
      confidence: medium
      confidenceRationale: Micro-CT reconstruction and five living analogues quantitatively constrain feasible motion, but model assumptions and the distinction between feasible motion and observed behaviour remain material limitations.
      referenceLinks:
        - referenceId: pierce-2012-ichthyostega-mobility
          relation: supports
          pages: 523–526
          figure: Figures 1–3; Supplementary Figures 1–6
          quoteLocator: Comparative joint-mobility results and discussion
    - subjectId: taxon:ichthyostega
      claimType: ecology
      claimKind: scientific
      statement: The cited Ichthyostega mobility study constrains modeled limb motion but does not directly establish diet, habitat preference or observed locomotor behaviour for the genus.
      confidence: medium
      confidenceRationale: The primary evidence is a reconstruction of joint mobility, not direct observation of an extinct animal. Ecological and behavioural fields remain explicitly unresolved.
      referenceLinks:
        - referenceId: pierce-2012-ichthyostega-mobility
          relation: supports
          pages: 523–526
          quoteLocator: Methods, mobility reconstruction and discussion
  claim-rationales.zh:
    - 鱼石螈：置信度为中：继承的具体页码、图版或章节定位器支持具名标本或抽样分析的存在与范围；措辞有意把结论限制在该证据内，不把导航包络提升为全球生物边界、直接祖先或精确起源。
    - 关节活动研究明确以早期四足动物鱼石螈为对象，但运动实验不能解决全部早期四足动物亲缘关系。
    - 研究明确给出东格陵兰晚泥盆世标本背景；这一采样地点不构成全球属级分布估计。
    - 三维重建与五种现生类比对象限制了可行关节运动，但模型假设和行为差异仍然重要。
    - 论文提供的是关节运动重建而非灭绝动物的直接生态观察，因此食性、生境与行为字段不作臆测。
  claim-statements.zh:
    - 所引 Ichthyostega 运动能力研究约束了模型中的肢体运动，但未直接确定该属的食性、生境偏好或实际观察到的运动行为。
    - Ichthyostega 的运动能力研究将该属作为早期四足动物分析，并以现生类比对象检验其肢体力学；这些力学结果并非完整的系统发育假说。
    - 所引研究中重建的 Ichthyostega 标本来自格陵兰东部上泥盆统沉积；这些明确地点的样本不能确定其全球分布范围。
    - Ichthyostega 肢体关节的三维重建表明，受检模型无法完成典型侧序步态所需的长轴旋转；研究同时保留了这可能是 Ichthyostega 特化特征的解释。
    - Ichthyostega 在此由所引运动研究使用的东格陵兰法门阶晚泥盆世沉积物标本约束；这一有限样本背景不是全球分布或精确完整延限。
