        metadataVariant: 0
        usage:
          title: Matelea panamensis Spellman & Dwyer, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Vines; stems terete, densely pubescent, the pubescence of 2 types, the short, sometimes bulbous hairs overtopped by stiff, brown, spreading, multicellular ones 3-5 mm long. Leaves elliptic, basally obtuse, truncate, or shallowly cordate, discolorous, pubescent on both surfaces, 10-15 cm long and 7-10 cm wide; pet- ioles 3-6 cm long. Inflorescences umbelliform, pubescent as on the stems, ca. 10-flowered, but only 2 usually open at a time; peduncles ca. 2 cm long; pedicels ca. 1.5 cm long. Flowers greenish or purplish brown; calyx lobes lanceolate, densely brown pubescent outside, glabrous inside, 5-6 mm long and 2-3 mm wide; corolla rotate to shallowly campanulate, 2-3 cm in diameter, the lobes broadly ovate, 6-9 mm long and wide, with inconspicuous short pubescence inside and outside as on the stems, but with the long hairs mostly in a thin band at the base of the lobes, a faucal annulus present as a low thin ridge of tissue, ca. 0.1 mm high, densely but minutely white pubescent; corona carnose, 5-lobed, the lobes connected by a narrow annular band of tissue, the apically thickened part of the lobe broadly reniform, ca. 1 mm long and 1.5 mm wide; gynostegium ca. 2 mm high; stigma head broadly pentagonal, slightly depressed, covered by a prominent thick white membrane. Follicles subovoid, ca. 20 cm long, 9 cm in diameter, the exocarp woody with a low, short dorsal ridge.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 1332
