          title: Ipomoea hederifolia L., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Vines; stems slender and herbaceous, annuals, glabrous to sparsely pubescent. Leaves ovate to suborbicular, 2-15 cm long, entire, dentate, trilobate or rarely with 5 or 7 lobes, basally cordate, acute to acuminate apically, glabrous or re- motely pubescent. Flowers in few- to several-flowered cymes or solitary; sepals oblong to elliptic, 1.5-3 mm long, apically obtuse or truncate, the outer sepals with a 1.6-6 mm long subterminal arista, glabrous; corollas red or red-yellow, 2.5-4.5 cm long, the tube 1-2 mm in diameter, the limb 1.8-2.5 cm in diameter. Fruits capsular, subglobose, 6-8 mm in diameter; seeds dark brown or black, pyriform, with usually 2 lines of short dark trichomes on the dorsal face.
