    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, 20-35 cm, stem much branched. Leaves 2 or 3, linear, channelled and trailing. Flowers yellow, tubular below, inner tepals absent, ovary subsessile and capsules concealed in spathes.
            textZh: Moraea cooperi Baker 的 SANBI 物种条目记载了植株、叶片和花部形态。
            sourceIds:
              - sanbi_13878_0
            locator: Strelitzia 29; archive Morphology row 6918, source 13878.0
            placeTimeScope: Regional species account published 2012; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
          - text: Immediately recognised in Moraea by the yellow, finely veined flowers and perianth of only three tepals, united basally in a short perianth tube. In addition, the narrowly fusiform ovary is included within the spathes and the compressed seeds are winged at both ends. The relationships of M. cooperi remain puzzling and it is provisionally included in subg. Umbellatae, with which its brown corm tunics, pale yellow, finely veined tepals and chromosome number, n = 10 are consistent. A perianth tube is also found in M. longiflora of the subgenus and the two species were placed together in sect. Tubiflorae of subg. Moraea in earlier studies. Molecular phylogenetic studies do not place M. cooperi among other species of subg. Umbellatae but show it to be isolated, at least with the plastid DNA loci so far sequenced. The presence of a floral tube prompted Foster (1939) to transfer both Moraea cooperi and M. longiflora to Gynandriris (now sect. Gynandriris of Moraea) but the members of sect. Gynandriris do not actually have a perianth tube but rather a tubular extension of the ovary and are not closely related to M. cooperi.
            textZh: SANBI 条目提供了 Moraea cooperi Baker 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: Strelitzia 42; archive Diagnostic row 95253, source 18638.0
            placeTimeScope: Regional species account published 2020; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
        gaps:
