        usage:
          title: Faramea occidentalis (L.) A.Rich., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: wide, rounded or obtuse at the apex, acuminate, basally cuneate or truncate, the costa subplane to prominulous above, prominulous to prominent beneath, the lateral veins 8-10, widely arcuate, usually with 1-5 irregular and soon evanescent veinlets between adjacent lateral veins, the intervenal areas spreading reticulate, slightly marginate, papyraceous to thin coriaceous, glabrous above, sometimes sparsely pubescent on the veins beneath; petioles stiff, often twisted, to 1.5 cm long, to 0.2 cm wide, glabrate; stipules widely deltoid, 1-2 cm long, 0.5-0.8 cm wide at the base, the terminal awn linear, about the same length or twice the length of the body, glabrous. Inflorescences terminal, occasionally axillary, pa- niculate, spreading, shorter than the terminal leaves, glabrous, the peduncle oc- casionally absent, mostly 1-2.5 cm long, the primary branches usually 2(4), either strongly ascending or the branches strict arcuate, divergent or deflexed, the cy- mules few, sparsely flowered; pedicels 1-2 cm long. Flowers with the hypanthium oblong or rounded, the calycine cup cylindrical, ca. 2.2 mm long, stiffly carnose, glabrous with scattered glands within, these oblong, ca. 0.1 mm in diam., the teeth absent or evanescent; corolla white, the tube narrowly cylindrical, 1.7-2.2 cm long, carnose, glabrous, the lobes 4, lanceolate or ovate lanceolate, 1.1-1.8 cm long, ca. 0.45 cm wide; stamens 4, the anthers barely exserted, narrowly oblong, ca. 8 mm long, 0.8 mm wide, minutely apiculate, versatile, the filaments slender, ca. 2 mm long, inserted ca. 5 mm below the corolla mouth; ovarian disc prominent, ca. 0.5 mm long, the style slender, as long as the corolla tube or less than 1/4 the length, the stigmas 2, slender, erect, 2.5-5.5 mm long, obtuse, the ovarian wall very thick. Fruits rotund or occasionally compressed rotund, often wider than long, to 1.3 cm in diam., crowned with a cylindrical calycine cup, to 2 mm long, glabrous, drying black.
