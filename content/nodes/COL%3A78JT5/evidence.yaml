          originalSourceText: gray or reddish gray beneath, the margin slightly marginate; petioles to 1.5 cm long, wiry, glabrous; stipules connate but often splitting at maturity, narrowly triangular or ovate, 3 mm long or longer, each part terminating in 1 or 2 subulate awns about as long as the body. Inflorescences terminal or axillary, the flower mass emerging from an ovate aggregate of bracts, to 1 cm long; bracts to 1 cm long, often with 2-3 irregular lobes, glabrous or ciliate outside, with glands within. Flowers sessile, the hypanthium to 1 mm long, glabrous; calycine cup elongate, urceolate, to 4 mm long, scarious, glabrous, eglandular within, the teeth 5, erect, lanceolate, 2.0-3.5 mm long, ca. 1 mm wide at the base, acute; corolla white, the tube cylindrical, 7.5-9.5 mm long, to 1.2 mm wide, glabrous outside, glabrous within except densely villose at the mouth and point of filament attachment, the lobes 5, ovate oblong, 1.8-2.0 mm long, conspicuously galeate, villose basally within; stamens 5, the anthers oblong, 1.3 mm long, the filaments ca. 1.5 mm long, attached ca. 2 mm below the mouth; style included or slightly exserted, to 10.5 mm long, the stigmas small, the ovarian disc compressed rotund, 0.5 mm long. Fruits sessile, red, oblong rotund, 6-8 mm long, the pyrenes with 4 grooves on the dorsal face.
