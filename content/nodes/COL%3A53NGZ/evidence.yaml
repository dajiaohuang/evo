        usage:
          title: Symbolanthus pulcherrimus Gilg, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Tall woody herb or shrub, 1.5-4 m high, the branchlets tetragonous, occa- sionally winged, becoming subterete. Leaves with petioles to 1.5(-3) cm long; lamina elliptic to narrowly elliptic, long-attenuate into the petiole, acuminate at the apex, to 14.5(-22) cm long and 7(-9) cm wide, thin-chartaceous, the costa prominent and the lateral veins subprominulous beneath. Inflorescences of 5-7-flowered cymes at the apex of branches and branchlets or the flowers borne solitary. Flowers with the pedicels to 2.5 cm long, the bracts triangular, to 5 mm long; calyx to 2.6 cm long, the lobes united basally for ca. 0.7-0.8 mm, ovate, obtuse to acute apically, obtusely carinate dorsally, to 1 cm wide, cori- aceous to membranous along the margins; corolla deep pink, to 10 cm long, the tube cylindric-infundibuliform, to 1.8 cm in diameter at the throat, the lobes apparently erect, broadly ovate, acute-acuminate, 2-2.2 cm long; stamens equalling the corolla tube, the filaments inserted ca. 1-1.5 cm above the base of the corolla tube, filiform, enlarged-triangular at the base with 5 short, tri- angular, membranous scales opposite the filaments, (fide Gilg, not noticed in Panamanian material), the anthers to 5 mm long, 2-lobed at the base, mucronate at the apex; style slightly exserted, the stigma conspicuously and broadly 2-lobed, the lobes to 6 mm long. Capsule broadly ellipsoid, 3-3.8 cm long and 1.8-2.5 cm broad, conspicuously beaked by the persistent basal portion of the style; seeds cubical, ca. 1 mm square.
          originalLanguage: en
          sourceField: general
