          title: Eugenia biflora (L.) DC., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrubs 3-4 m. high; twigs terete, at first brown-tomentose intermixed with white hairs, later glabrate. Leaves lanceolate, acute at the base, long-acuminate and mucronate at the apex, up to 7 cm. long and 1.0-2.5 cm. wide, subcoriaceous or membranaceous, sparsely white-pilose on both sides, glabrescent, the midrib im- pressed above, prominent beneath, the lateral nerves numerous, inconspicuous on both sides. Inflorescence racemose, 3- to 7-flowered, tomentose. Flowers white. Bracts setaceous, 2 mm. long; bractlets also setaceous, longer than the ovary. Sepals ovate, apiculate, about 2 mm. long. Petals about 4 mm. long, sericeous outside. Ovary 2-celled, sericeous; ovules about 6-10 in each cell, arranged in a semicircle open above. Berry subglobose, 7 mm. long, smooth or faintly ribbed, edible.
