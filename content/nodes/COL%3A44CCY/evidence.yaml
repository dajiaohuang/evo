    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, 15-30 cm, stem flexed outward above leaf sheath. Leaf solitary, linear, channelled. Flowers yellow or pink with a yellow nectar guide outlined in dark colour, tepal claws forming a narrow cup, anthers partly exserted on a slender filament column.
            textZh: Moraea vallisbelli (Goldblatt) Goldblatt 的 SANBI 物种条目记载了植株、叶片和花部形态。
            sourceIds:
              - sanbi_13878_0
            locator: Strelitzia 29; archive Morphology row 7419, source 13878.0
            placeTimeScope: Regional species account published 2012; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
          - text: Recognised by the solitary foliage leaf inserted on the stem well above ground, main stem and branches flexed above the sheaths of foliage or sheathing leaves, and a pink or yellow flower with the tepal claws diverging to form a relatively wide cup that includes the filaments. The filaments are united in a narrow column that is velvety in the lower half, and the diverging anthers slightly exceed the style branches, the crests of which are vestigial. It is apparently related to the more widespread M. minor of the Western Cape Atlantic Coast and Olifants River Valley and the two are easily confused, especially when dried. However, in M. minor the tepal claws form a narrow cup including both filaments and anthers and the short style branches have larger, clearly visible crests. Both species are diploid but M. minor is autogamous and M. vallisbelli is self-incompatible.
            textZh: SANBI 条目提供了 Moraea vallisbelli (Goldblatt) Goldblatt 的鉴别特征。
            sourceIds:
