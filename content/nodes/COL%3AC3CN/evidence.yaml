        claims:
          - text: Arborescent succulent, up to 4 m high. Inflorescence simple, up to 1.3 m high. Racemes narrowly cylindrical, over 500 mm long. Perianth shorter than 12 mm. Flowers sessile, lemon-yellow.
            textZh: Aloe alooides (Bolus) Druten 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_11118_0
            locator: "SANBI/WFO archive Morphology row 150; source identifier 11118.0; cited publication: Herman, PPJ; Retief, E. 1997. Plants of the northern provinces of South Africa: Keys and diagnostic characters. Strelitzia 6: 1 - 681. National Botanical Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: A. recurvifolia is an imposing and distinctive species. Young stemless plants of A. recurvifolia closely resemble the Zululand A. vanbalenii with their deeply channelled recurved leaves, but they could never be confused when in flower. Large plants of A. recurvifolia with stems 1.8 m [as '6 ft.'] high, look very much like the Natal A. thraskii in general habit of growth, but the latter could never be confused with its much-branched inflorescence and entirely different flowers. The chief distinguishing characters of A. recurvifolia, are the deeply channelled much recurved leaves, with the apices of the lowest leaves almost touching the stem, the red marginal edge and teeth, and flowers only 9 mm long and almost as broad, which is the smallest known in the genus except for the 'lost' A. parviflora. The buds of A. recurvifolia are almost globular and are not covered by the apical bracts, while the ovary also is almost globular, being only 3 mm long and broad. The nectar is almost clear, but when viewed in the flower, the reflection of the orange-coloured ovary below, gives the nectar a darker appearance than it is.
            textZh: SANBI 条目提供了 Aloe alooides (Bolus) Druten 的鉴别特征。
            sourceIds:
              - sanbi_13236_0
            locator: "SANBI/WFO archive Diagnostic row 78152; source identifier 13236.0; cited publication: Reynolds, GW. 1974. Aloes of South Africa, 3rd ed. A.A. Balkema, Cape Town. [All rights reserved]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
