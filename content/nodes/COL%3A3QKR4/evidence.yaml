    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Sprawling, glandular-hairy shrublet to 45 cm. Leaves lobed. Flowers axillary, pink to mauve with orange throat.
            sourceIds:
              - sanbi_14433_0
            locator: "SANBI/WFO archive Morphology row 6017; source 14433.0; publication: Manning, JC; Goldblatt, P. 2012. Scrophulariaceae: Jamesbrittenia Kuntze. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 743 - 744. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: "Jamesbrittenia albanensis is characterized by its bluntly lobed leaves, glandular-pubescent on both surfaces, flowers borne in pseudoracemes, and mauve to magenta corolla limb. In foliage, it resembles forms of J. filicaulis, which differs in its leafy inflorescences and white corolla limb. In leaf cutting, inflorescence and flower colour, it resembles J. foliolosa, but that species is distinguished by the indumentum on the leaves: lower surface thickly clad in glistening glands, minute glandular hairs present or not, upper surface either glabrous or minutely glandular-pubescent. Jamesbrittenia foliolosa possibly hybridizes with J. albanensis in the Grahamstown area."
            textZh: SANBI 条目提供了该种的鉴别特征。
            sourceIds:
              - sanbi_15191_0
            locator: "SANBI/WFO archive Diagnostic row 58676; source 15191.0; publication: Vollesen, KB. 2013. 126. Acanthaceae (Part 1), Fl. Zambes. 8(5): 1 - 184. Royal Botanic Gardens, Kew, London. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
