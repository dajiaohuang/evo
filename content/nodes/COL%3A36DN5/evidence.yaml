          - text: Diosma sabulosa is recognised as distinct on account of its being a tall plant arising from a single stem, with leaves ovate, alternate, sessile, gland-dotted towards the midrib with thin translucent margins, without staminodes and with petals and ovary glabrous. It differs from D. echinulata, from the neighbouring limestone, which is a small scabrous plant with leaves closely spaced, setose-pubescent with a sharp mucro, thick margins and a short petiole, with petals pubescent and ovary crowned with short setose hairs.
