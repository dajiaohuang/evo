            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: The new species is much smaller than the widespread W. incurvata, and also lacking the rhizome so typical of the common species. Secondly, the male flowers of the new species are longer (3-4 mm instead of 2-2.5 mm). Finally, the nut is smaller (3-3.5 x 4-5 mm instead of 5-6 x 7-9 mm), and has a massive four-lobed cap. W. incurvata flowers in winter (April to June) while the new species flowers in summer (February to March). These differences are too big to include within one species, hence the new species status.
            textZh: SANBI 条目提供了 Willdenowia pilleata H.P.Linder 的鉴别特征。
