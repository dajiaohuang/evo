    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants with stems solitary or in small clusters. Leaves erect or somewhat falcate, rigid, 150-280 x 4-12 mm, shallowly keeled. Scape overtopping leaves, 250-650 mm tall. Raceme cylindrical, dense, 40-90 x 10-15 mm; buds erect, brownish; flowers erect to spreading, dull yellow to brownish, drying purplish brown, slightly scented. Bracts ovate to ovate-deltoid, acute, 4-5 mm long; margin eroso-denticulate. Pedicels up to 0.5 mm long. Perianth campanu-late to subturbinate, 4-5 mm long; lobes ovate, 1.0-1.5 mm long, not spreading. Stamens exserted by 2 mm at anthesis. Fruit globose, mature fruits not seen.
            textZh: Kniphofia brachystachya (Zahlbr.) Codd 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_6616_0
            locator: "SANBI/WFO archive Morphology row 49817; source identifier 6616.0; cited publication: Codd, LEW. 2005. Asphodelaceae (First part): Kniphofia, Fl. S. Africa 5(1,2): 1 - 94. South African National Biodiversity Institute, Pretoria. [http://www.biodiversitylibrary.org/item/209560#page/3/mode/1up]. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Related to the former species, K. typhoides, but smaller in stature with shorter and narrower leaves and somewhat smaller flowers, 4-5 mm long. The bracts are ovate, acute, whereas in K. typhoides they are rounded at the apex. The only other species with such small flowers is K. buchananii, but in this species the flowers are white, the bracts are lanceolate, acuminate, and the leaves are grass-like, 400-600 x 2.5-4.0 mm.
