        claims:
          - text: Plants slender, scape without bracts, hairy, growing horizontally on cliffs, up to 55 mm tall; leaves 2, basal, ovate, up to 35 x 25 mm, green at flowering time. Inflorescences dense, secund racemes; bracts ovate-lanceolate, hairy, about 2.5 mm long, with up to 15 flowers. Flowers white, non-resupinate. Sepals hairy, about 2 mm long. Petals entire, lanceolate, about 2.8 mm long. Lip with 3 + equal obtuse-triangular lobes, lobes about 1 mm long, basal undivided lip portion 2 mm long; spur recurved and 1 mm long; ovary 2.5 mm long. Gynostemium 1 mm tall.
