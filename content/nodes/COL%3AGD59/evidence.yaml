        usage:
          title: Ardisia geniculata Lundell, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Trees, 4-5 m high; branchlets slender, furfuraceous, ferruginous. Leaves petiolate, the petioles furfuraceous, canaliculate, 3-6 mm long; leaf blades narrowly elliptic or oblanceolate-elliptic, 5.8-11 cm long and 2.5-4.3 cm wide, subabruptly acuminate apically, the acumen obtusish, attenuate basally, decurrent, sparsely lepidote, entire, membranaceous, the costa plane above, prominent beneath, the primary veins 12-16 on each side, conspicuous beneath. Inflorescences terminal and axillary, lepidote, bipinnately paniculate, few- flowered, less than 4 cm long; pedicels slender, to 10 mm long. Flowers 5-merous, subumbellate, white; sepals broadly ovate, 1 mm long, prominently punctate, the margin scarious, subentire, rounded apically, obscurely emarginate laterally; petals linear-oblong, slightly wider above the middle, 5 mm long, connate 1 mm basally, acutish, orange-punctate; stamens ca. 3.5 mm long, the filaments ca. 1 mm long, the anthers linear-lanceolate, ca. 2.5 mm long, concolorous, abruptly apiculate, dehiscent by apical pores; ovary glabrous, the ovules 25, pluriseriate, the style slender, 4 mm long.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 8243
