        usage:
          title: Galphimia gracilis Bartl., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrubs, 0.6-2.0(-4.0) m tall, the branches dark to pale brown, usually sparsely to densely subappressed, reddish-brown hirsute, glabrate in age. Leaves oppo- site, lanceolate to ovate or elliptic-oblong, usually acute to obtuse at the apex, obtuse to acute at the base, 1-6(-8) cm long, 0.4-3.2 cm wide, subchartaceous to subcoriaceous, glabrous or nearly so above, beneath the midrib pubescent as the petiole, sometimes bearing 2 or 4 usually sessile glands near the base; petioles 2-15 mm long, pubescent; stipules triangular to subulate, 1.2-3.5 mm long. In- florescences terminal, pseudoracemose or corymbiform, usually pubescent like the stem; flowers each subtended by a lanceolate to subulate bract 1.4-3.1 mm long and 2 bracteoles 0.7-2.0 mm long; pedicels 6-17 mm long, pubescent. Flow- ers 1.4-2.2 cm diam.; calyx segments usually eglandular, usually 3-4 mm long, ca. 1 mm wide, obovate-oblong to lanceolate, obtuse to subacute at the apex, glabrous or somewhat ciliate; petals clawed, yellow, costate to subcarinate on the lower surface, the claw flattened, 1.3-3.0(-5.0) mm long, frequently reddish in age, the limb ovate to ovate-oblong, 5-9 mm long, subentire and frequently ciliolate, the anterior petal 5.5-7.5 mm long, the claw stouter, the limb broadly ovate to subdeltoid, the base sometimes cordate, the apex subcucullate; stamens with filaments flattened, subdistinct to connate, subequal, the anthers 2-3 mm long; ovary subglobose, 1.8-2.4 mm diam., usually glabrous, the styles slender, unequal, 4-7 mm long, the anterior style usually slightly shorter. Capsule subglo- bose, 4.5-6.0 mm diam., usually glabrous, the lobes tardily dehiscent; seeds ovoid to subglobose, reddish-brown.
