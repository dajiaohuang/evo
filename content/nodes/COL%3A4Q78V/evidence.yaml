        claims:
          - text: Plants slender, to 400 mm; leaves 2-10, ovate-lanceolate, acute, to 170 x 35 mm. Inflorescences fairly lax, to 160 mm long, 3-numerous-flowered; bracts lanceolate, acuminate, 16-18 x 6 mm. Flowers c. 18 x 12 mm, with green sepals, cream petals, and pale green lip appendage with dark green apex; ovaries c. 10 mm. Median sepal narrowly oblong-elliptic, shallowly concave, 8-9 x 3 mm, adnate to the petals; lateral sepals spreading, saccate, acute, terrninal '/3 incurved, 7-8 x 2 mm deep. Petals subrotund, outer margin involute, 6-7 x 8-9 mm. Lip reduced to 2 semi-circular lobes, c. 1-1.5 mm long, with a minute central projection; appendage c. 6 x 3 mm, topped by 2 rounded, down-curved, fleshy lobes. Stigma inconspicuous, at the base of the lip appendage; rostellum c. 2 mm tall, arms c. 2 mm long.
