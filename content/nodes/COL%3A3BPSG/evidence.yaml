        claims:
          - text: Tree to 8 m. Bark smooth throughout, grey-brown to grey. Juvenile leaves stellate hairy. Adult leaves elliptic to lanceolate, apiculate; lamina 4.5-8 cm long, 1.1-2.2 cm wide; lateral veins at 20°-30°; intramarginal vein up to 2 mm from margin; petiole flattened, 5-8 mm long. Umbels 19-35-flowered; peduncle flattened, recurved, 25-40 mm long. Buds horn-shaped, expanded at base; operculum horn-shaped, 30-35 mm long, 8-13 mm wide; hypanthia fused. Fruits fused into a globular head which is 2-5 cm long, 4-7 cm wide; disc narrow, ascending; valves 3, strongly exserted.
