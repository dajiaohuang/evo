        claims:
          - text: Cormous geophyte, 10-35 cm. Leaves linear. Flowers crowded terminally, white or bright red, tube short and filiform.
            textZh: Ixia campanulata Houtt. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 7108; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Very narrow, sword-shaped to almost linear leaves, an unusually sturdy stem, relatively few flowers crowded at the spike apex and usually with uniformly brilliant red, glossy tepals are diagnostic for I. campanulata. The perianth tube is unusually short, 2-3 mm long, even for sect. Ixia. Another aid to identification is the style, which divides opposite the middle to upper third of the anthers, sometimes even exceeding them. A white-flowered form is known, evidently occurring in uniform stands. The short floral bracts, up to 3 mm long, are half as long to almost as long as the spike internodes and the outer has three short, subequal teeth. Spikes typically have 2 to 4 flowers but there are examples of white-flowered plants with up to 8-flowered spikes. Lewis (1962) regarded I. campanulata as most closely related to I. metelerkampiae, which also has a short perianth tube, 3-4 mm long, narrow leaves and obovate tepals, these however, pale pink, lilac or blue-mauve but with a dark red to purple throat and markings, and is a taller plant, reaching up to 700 mm, and colourless bracts with inconspicuous cusps. In I. campanulata the bracts are white or deep pink and have prominent, dark veins and usually prominent cusps. Both species usually have a well-developed collar of fibres around the base.
            textZh: SANBI 条目提供了 Ixia campanulata Houtt. 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 95035; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
