          originalSourceText: shallowly cordate, or + obtuse basally, to 11 cm long and 5.5 cm wide, glabrous, firmly membranaceous; petioles 0.5-2.5 cm long. Inflorescences bostrychoid, 15- 25-flowered, the peduncles ca. 1.5-4 cm long. Flowers with the pedicels 3-11 mm long; bracteoles minute; calyx-lobes ? equal, deltoid, delicately fimbriolate, 2-4 mm long, the squamellae 7-10, + alternate; corolla green-white or green- yellow, the tube ca. 15-25 mm long, ? expanded at the level of stamen attach- ment, the lobes oblong or obovate, ca. 8-12 mm long and 5-6 mm wide, re- flexed; anthers ca. 4 mm long, the connective densely pilose; nectaries 5 and separate, or fewer and concrescent, the stigma fusiform-umbraculiform. Follicles 15-40 cm long, glabrous, narrowly terete; seeds linear, ca. 1 cm long, comose, the hairs 2-3 cm long.
