    facets:
      morphology:
        status: not-assessed
        claims: []
        gaps:
          - The cited studies do not document diagnostic body morphology, age- and sex-stratified measurements, or identification limits.
      lifeHistory:
        status: partially-supported
        claims:
          - text: In recordings from nine captive northern white-cheeked gibbons, researchers classified three intragroup call types—grunt, hoo, and long hoo—across multiple social, feeding, stress, and attention contexts. These observations cover a limited captive sample and do not establish the complete repertoire or wild age-specific behavior.
            originalLanguage: en
            sourceIds:
              - hradec2026CaptiveGibbonVocalizations
            locator: Methods, Study Subjects and Data Collection; Results, Qualitative Description of the Calls; Figs. 2–5 and Tables I–III.
            placeTimeScope: Nine northern white-cheeked gibbons in zoological parks in Czechia, France, Sweden, and Israel; recordings were made in 2015, 2017, and 2021–2024.
            lifeStatus: Captive animals; wild vocal behavior was not directly measured.
        gaps:
          - Reproductive behavior, development outside recorded call contexts, parental care, lifespan, survival, and wild population variation remain unassessed.
      ecology:
        status: partially-supported
        claims:
          - text: In a fecal 16S study of 56 captive northern white-cheeked gibbons at two Chinese zoos, gut-microbiome composition and diversity differed among age groups and between adult zoo groups under distinct captive conditions. The results do not establish microbiome composition in wild populations or isolate the effect of any one husbandry factor.
            originalLanguage: en
            sourceIds:
              - jia2018GibbonCaptiveMicrobiota
            locator: Abstract; Results, Composition of the GIT microbiota and Comparison of adult gibbons between the Nanning and Beijing groups.
            placeTimeScope: "56 captive animals: 36 from Nanning Zoo and 20 from Beijing Zoo; comparisons include adults and age groups at Nanning."
            lifeStatus: Captive gibbons sampled from zoological facilities.
        gaps:
          - Wild habitat use, diet and plant interactions in free-ranging populations, parasites, competitors, and microbiome variation across the natural range are not established.
