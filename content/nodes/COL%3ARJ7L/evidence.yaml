        usage:
          title: Caryodendron angustifolium Standl., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Tree 4-6 m high; twigs and foliage glabrous. Leaves chartaceous; petioles 1.2-3 cm long; stipules not seen [early deciduous, leaving an oblique scar]; blades elliptic- or oblanceolate-oblong, 19-26 cm long, 5-7 cm broad, with 2-4 glandular spots above near the base, the midrib and main primary veins (ca 6-8 on a side) raised beneath, the veinlet reticulum rather prominent on both sides, the base cuneate, the margins entire, recurved, with a truncate or emarginate acumen at the apex. Inflorescences terminal, unisexual; male spike compound, with main axis ca 7 cm long and 4.5 mm broad, bearing 2 lateral axes 8-14 cm long and 2-2.5 mm thick; rachis of male spike minutely antrorse-strigulose, the bracts minutely glandular punctate, subtending bracteolate clusters of several male flowers. Staminate flowers [not seen fully expanded] nearly sessile; calyx-segments 3, glabrous, ca 1.5-1.8 mm long; stamens 6 or 7, usually with 1 central, the filaments ca 0.8-0.9 mm high, the anthers ca 0.4-0.5 mm long; disc densely hirsute. Pistillate flowers not seen; fruiting pedicel massive (nearly 4 mm thick). Capsules not seen entire; cocci ca 2 cm long, 2-2.5 mm thick, densely and closely tomentulose outside, the columella ca 1.7 cm long; seeds spheroidal, smooth, pale brownish, prominently carinate dorsally, obscurely and obliquely costate ventrally, with prominent raphe, 15.8-16.5 mm long, 14.4-15 mm broad.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 4333
