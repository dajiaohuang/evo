            locator: "SANBI/WFO archive Morphology row 81815; source 5640.0; publication: Groen, LE; Van der Maesen, LJG. 1999. Revision of the genus Faucaria (Ruschioideae: Aizoaceae) in South Africa. Bothalia 29(1): 35 - 58. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Intermediate plants have been found between F.felina subsp. britteniae and F. subintegra. The leaf shape was that of F. subintegra, the number and shape of the teeth those of F. felina subsp. britteniae It is unknown if these intermediate populations are the result of natural hybridisation.
