    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants clump-forming, in older stages stem-forming; stems 4-7 mm diam. Leaves 4-8, crowded, very thick, spreading, ovate-rhomboid. 20-35 x 10-15 mm, bluntly keeled at top, margins with 0-8 very short conical teeth having short bristles on each side that disappear in older leaves; often shiny, glaucous, sometimes with a violet lustre, with minute white dots, margins and keels indistinctly whitish. Flowers with 80-92 linear petals; stamens 150-180. Nectaries yellowish green. Fruit stalk absent or 2-4 x 2-4 mm, 1.0-1.4 mm thick. Fruits tightly attached on plant, 7-10 x 9-12 mm, 6-9 mm thick; top of capsule flat, or in most fruits a raised centre. Seeds dark brown. 1.1-1.4 x 1.0-1.1 mm.
            sourceIds:
