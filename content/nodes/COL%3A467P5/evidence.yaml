        claims:
          - text: Softly hairy, short-lived perennial to 60 cm. Leaves opposite, ovate, sharply toothed, 5-veined from base. Flowers in racemes, saccate, white, lower lip with a yellow palate, upper lobes rounded. Capsules slightly longer than wide.
            sourceIds:
              - sanbi_14438_0
            locator: "SANBI/WFO archive Morphology row 6220; source 14438.0; publication: Steiner, KE. 2012. Scrophulariaceae: Nemesia Vent. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 748 - 750. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: There are several features that make Nemesia acornis distinctive. The most obvious of these is the absence of a spur at the base of the corolla tube as found in most Nemesia species. Approximately 10 other species (excluding N. hastata Benth. = Diascia cf. integerrima) have been described as lacking a true spur, but only two of these (N. pallida Hiern and possibly N. bodkinii H. Bol.) are perennial. The dark purple to nearly black broadly saccate flowers of N. bodkinii make this plant unmistakable. N. pallida differs from N. acornis in having linear leaves and lilac flowers with a densely bearded palate.
            textZh: SANBI 条目提供了该种的鉴别特征。
