      morphology:
        status: partially-supported
        claims:
          - text: Densely tufted perennial 70-300 mm high, delicate, fine; rhizome hardly branched; old dead leaves and sheaths form a hard, dense cushion below the new growth. Leaf blade 15-50 x 0.3-1.0 mm, filiform, rigid, erect. Inflorescence dichotomously branched, axils without hairs on a pulvinus; spikelets solitary at branchlet apices. Spikelet 0.8-1.4 mm long; glumes subequal, 2/3 as long as spikelet; lemma as long as spikelet; anther 1.1-1.5 mm long.
            textZh: Sporobolus nebulosus Hack. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
