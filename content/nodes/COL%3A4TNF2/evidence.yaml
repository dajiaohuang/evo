        usage:
          title: Ruellia pittieri Lindau, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Herbs, sometimes suffrutescent, to 1.5 m tall; stems quadrangular, winged, sparingly puberulous. Leaves elliptic to elliptic obovate, to 18.5 cm long and 5 cm wide, apically and basally attenuate, glabrous on both the surfaces or sericeous on the costa beneath, cystoliths prominent and dense on both the sur- faces, ca. 0.5 mm long; margins entire to crenulate; petioles to ca. 1 cm long. Inflorescences in axillary panicles, the peduncles to 18 cm long, quadrangular, glabrous to sparingly puberulous; pedicels 3-10 mm long, glabrous; bracts linear to spatulate 3-8 mm long, the bractlets subulate ca. 1 mm long. Flowers with the calyx lobes linear, ca. 4 mm long and 0.5 mm wide at base, glabrous to sparingly puberulous; corolla mauve, funnelform, tube 15-20 mm long, 2 mm wide at base, 8 mm wide at the mouth, puberulous outside, sparingly villous at the throat, the lobes suborbicular, ca. 5 mm long and 5 mm across, mostly glabrous; stamens included; ovary and capsule glabrous. Capsule clavate, to 1.5 cm long, ca. 5 mm wide at the widest point, 1.5 mm wide at the base; seeds 4, orbicular, flattened, 3 mm in diameter, reddish brown.
          originalLanguage: en
          sourceField: general
