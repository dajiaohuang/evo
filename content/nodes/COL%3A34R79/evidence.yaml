        usage:
          title: Dendropanax praestans Standl., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Small trees, the branchlets rugose, densely leafy at the tips. Juvenile leaves suborbicular, to 40 cm. in diameter, deeply 5- to 7-lobed, serrate; petioles 20-25 cm. long; mature leaves entire or deeply 3-lobed, the entire blades ovate-oblong, 6-13 cm. long, 2-6 cm. broad, acuminate at the apex, obtuse or cuneate at the base, irregularly sinuate-serrate, the teeth obtuse, frequently unequal, the 3-lobed blades 8-15 cm. long and broad, the lobes narrowly oblong, 1.5-3.0 cm. broad, attenuate at the apex, irregularly sinuate, the costa prominent, the primary lateral veins about 6 per side; petioles 1.5-8.0 cm. long. Inflorescences of 5-10 umbels arranged in an axillary compound umbel, the primary peduncle plus rhachis stout, 0.5-1.3 cm. long, the floriferous peduncles about 6 per inflor- escence, 1.0-2.5 cm. long, subtended by several more or less connate bracts form- ing a basal cupule; pedicels 3-5 mm. long, subtended by several more or less connate bracteoles. Flowers 6-15 per umbel, 5- to 7-merous; calyx obconic, some- what broader than long, 1.5-2.0 mm. long, about 3 mm. in diameter, the teeth apiculate; petals deltoid-oblong, 2-3 mm. long, about 1.5 mm. broad; filaments 1-2 mm. long, the anthers 1.25-1.5 mm. long, 1 mm. broad; styles basally connate. Fruit subglobose, 4-5 mm. in diameter, the styles recurved distally.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 967
