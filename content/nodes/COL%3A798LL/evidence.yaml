    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, 80-200 mm tall, corm rounded at base, with curved acuminate teeth. Leaves several, narrowly 4-grooved. Flowers yellow, tepals dimorphic, the outer broader; outer bract with membranous margins and tip and inner bract with wide membranous margins; fruiting peduncles curved.
            textZh: Romulea diversiformis M.P.de Vos 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_14562_0
            locator: "SANBI/WFO archive Morphology row 33374; source identifier 14562.0; cited publication: Goldblatt, P; Manning, JC. 2013. Iridaceae. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 94 - 124. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Readily recognised by its bright yellow, unmarked flowers with relatively broad, obovate tepals, the inner notably broader than the outer, and the long style, exserted 3-6 mm beyond the anthers. The numerous leaves and the whitish or colourless membranous margins to the inner and outer bracts are also distinctive. The species has been confused with Romulea luteoflora, but that species has fewer leaves (2 to 6), brown-flecked membranous margins to the inner and outer bracts, and a shorter style not exserted beyond the stamens.
            textZh: SANBI 条目提供了 Romulea diversiformis M.P.de Vos 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 95177; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
