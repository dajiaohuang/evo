  claims:
    - subjectId: taxon:tujiaaspis
      claimType: taxonomy
      claimKind: scientific
      statement: Tujiaaspis vividus is a galeaspid represented by articulated Huixingshao Formation material; its placement is a published phylogenetic interpretation and is not presented as direct ancestry to jawed vertebrates.
      confidence: medium
      confidenceRationale: "Tujiaaspis vividus: articulated specimens and a published phylogenetic analysis support this limited identification. Confidence remains medium because the placement is model-dependent and the historical Ostracodermi navigation grade is not a natural clade."
      referenceLinks:
        - referenceId: gai-2022-tujiaaspis
          relation: supports
          pages: 959–963
          figure: Figures 1–4; Extended Data Figures 1–6
          quoteLocator: Abstract; phylogenetic analysis and ancestral-state estimation
    - subjectId: taxon:tujiaaspis
      claimType: biogeography
      claimKind: scientific
      statement: The figured Tujiaaspis material comes from the Huixingshao Formation at Lianghe village, Yongdong town, Xiushan County, Chongqing Municipality, and Kapeng Reservoir in Baojing County, Xiangxi, Hunan, South China; these are sampled localities, not a global distribution.
      confidence: medium
      confidenceRationale: "Tujiaaspis vividus: the primary study maps the localities and identifies the fish-bearing horizon. A single formation sample cannot establish absence, endemism or global geographic extent."
      referenceLinks:
        - referenceId: gai-2022-tujiaaspis
          relation: supports
          pages: 959–963
          figure: Extended Data Fig. 1
          quoteLocator: Locality and horizon; Methods, Specimens and provenance; Extended Data Figure 1
    - subjectId: taxon:tujiaaspis
      claimType: ecology
      claimKind: scientific
      statement: The study reconstructs continuous ventrolateral fins and models their passive lift, but diet, life habitat, trophic guild and measured swimming performance remain unresolved.
      confidence: medium
      confidenceRationale: "Tujiaaspis vividus: the model result is explicitly bounded to reconstructed morphology and CFD assumptions. Medium confidence applies to that boundary, not to a full ecological reconstruction."
      referenceLinks:
        - referenceId: gai-2022-tujiaaspis
          relation: supports
          pages: 959–963
          figure: Figure 3; Extended Data Fig. 6
          quoteLocator: Computed fluid dynamics analysis
    - subjectId: taxon:tujiaaspis
      claimType: morphology
      claimKind: scientific
      statement: Holotype IVPP V26668 and paratypes IVPP V27410–V27411 preserve three unpaired dorsal fins, an approximately symmetrical hypochordal tail and continuous branchial-to-caudal ventrolateral fins.
      confidence: medium
      confidenceRationale: "Tujiaaspis vividus: the named specimens and figures directly support the recorded postcranial characters. Confidence is medium because preservation and reconstruction limit character completeness and variation."
      referenceLinks:
        - referenceId: gai-2022-tujiaaspis
          relation: supports
          pages: 959–963
          figure: Figures 1–2; Extended Data Figures 2–5
          quoteLocator: Holotype and postcranial anatomy
    - subjectId: taxon:tujiaaspis
      claimType: fossil-range
      claimKind: scientific
      statement: The displayed 438.6–432.9 Ma interval is the Telychian time-scale envelope for the Huixingshao Formation Tujiaaspis sample and is not a global genus range, FAD, LAD or divergence date.
      confidence: medium
      confidenceRationale: "Tujiaaspis vividus: the primary source and concrete geological locator support the source horizon. Confidence is medium because the numeric envelope is locality- and stage-scoped rather than a global first or last appearance."
      referenceLinks:
        - referenceId: gai-2022-tujiaaspis
          relation: supports
          pages: 959–963
          figure: Extended Data Fig. 1
          quoteLocator: Geological setting and fish-bearing Huixingshao Formation horizon
  claim-rationales.zh:
    - Tujiaaspis vividus：关节相连标本与已发表的系统发育分析支持这一有限鉴定。置信度保持中等，因为其位置依赖模型，且 Ostracodermi 在本导航中是非单系的历史等级。
    - Tujiaaspis vividus：一手研究绘制了地点并确定含鱼层位。单一地层样本不能确定缺失、特有性或全球地理范围，故置信度为中等。
    - Tujiaaspis vividus：模型结论明确受重建形态与 CFD 假设限制。中等置信度仅适用于这一边界，而不是完整生态重建。
    - Tujiaaspis vividus：具名标本与图件直接支持所记录的躯干性状。保存与重建限制性状完整性和变异，因此置信度为中等。
    - Tujiaaspis vividus：一手来源及明确的地质定位符支持该层位。数值包络限定于地点和阶，非全球首现或末现，故置信度为中等。
  claim-statements.zh:
    - Tujiaaspis vividus 是由回星哨组关节相连材料代表的盔甲鱼类；其系统位置来自已发表的系统发育解释，不被表述为有颌脊椎动物的直接祖先。
    - 图示 Tujiaaspis 材料来自华南回星哨组的重庆市秀山县涌洞镇凉河村，以及湖南湘西保靖县卡棚水库；这些是取样地点，不代表全球分布。
    - 研究复原了连续的腹外侧鳍，并模拟其被动升力；但食性、生活栖息地、营养功能群和实测游泳性能仍未解决。
    - 正模 IVPP V26668 与副模 IVPP V27410–V27411 保存三枚不成对背鳍、近对称的下脊索尾，以及从鳃区连续延伸至尾部的腹外侧鳍。
    - 显示的 438.6–432.9 Ma 区间是回星哨组 Tujiaaspis 样本的特列奇期时间标尺包络，不是该属的全球延限、首现、末现或分化时间。
