    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants one- to several-stemmed. Leaves erect or later bending over about the middle, soft-textured, 300-600 x 8-15 mm, dull glaucous-green, V-shaped in cross section; margin and keel smooth or sparsely toothed towards apex. Scape overtopping or subequal to leaves, 400-650 mm tall. Raceme globose, dense, 50-70 x 50-60 mm; buds spreading, flame-red; flowers pendulous, yellow to orange-yellow. Bracts broadly ovate to subrotund, 6-8 mm long, obtuse to rounded, chartaceous; margin almost entire to minutely eroso-denticulate. Pedicels 1-2 mm long. Perianth subcylindrical, somewhat arcuate, 28-32 mm long; lobes broadly ovate, 2 mm long, not spreading. Stamens reaching throat or just exserted at anthesis, finally withdrawn. Fruit globose, 6-8 mm long.
            textZh: Kniphofia coddiana Cufod. 的 SANBI 物种条目记录了形态特征。
