          figure: Figures 1–3
          quoteLocator: Description; reconstruction; discussion of mollusc-like characters
  claim-rationales.zh:
    - 具名白海组合中的体形与重复解剖区域是直接观察；同源性、进食器官和精确系统位置仍属解释。
  claim-statements.zh:
    - 三十五件以上白海 Kimberella 标本记录了两侧对称的底栖躯体、宽阔的足状区域和非矿化背盖；其与软体动物相似只是有边界的解释，并不等于冠群成员，也没有保存齿舌。
