  claims:
    - subjectId: event:kimberella-white-sea-morphology
      claimKind: scientific
      claimType: morphology
      statement: More than 35 White Sea Kimberella specimens document a bilaterally symmetrical benthic body with a broad foot-like region and a non-mineralized dorsal cover; resemblance to molluscs is a bounded interpretation, not crown membership or a preserved radula.
      confidence: medium
      confidenceRationale: Body outline and repeated anatomical regions are directly observed across a named assemblage, whereas homology, feeding apparatus and exact phylogenetic position remain interpretive.
