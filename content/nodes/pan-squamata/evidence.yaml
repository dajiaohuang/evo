  claims:
    - subjectId: taxon:pan-squamata
      claimKind: scientific
      claimType: topology
      statement: Pan-Squamata is a navigation route spanning sampled stem and crown squamates; the Megachirella analysis recovers one fossil on the squamate stem but does not identify a direct ancestor, crown FAD or complete route duration.
      confidence: medium
      confidenceRationale: CT anatomy and a combined morphology–molecule matrix support the stem placement. Medium confidence retains model sensitivity and limits the claim to route topology.
      referenceLinks:
        - referenceId: simoes-2018-megachirella
          relation: supports
          pages: 706–709
          figure: Figures 1–2; Extended Data Figures 1–8
          quoteLocator: CT description; combined-evidence analyses; divergence-time caveats
    - subjectId: taxon:pan-squamata
      claimKind: scientific
      claimType: fossil-range
      statement: Megachirella PZO 628 provides a roughly 240 Ma Middle Triassic Pan-Squamata stem anchor; a 240 Ma–present route is shown without treating the specimen as a direct ancestor or crown-Squamata FAD.
      confidence: medium
      confidenceRationale: "Megachirella-to-living Pan-Squamata evidence route: the cited primary study or systematic review directly supports the stated sample, calibration or withholding boundary at the supplied locator. Confidence is medium and does not extend to a global FAD, LAD, direct ancestor or unsampled interval."
      referenceLinks:
        - relation: supports
          referenceId: simoes-2018-megachirella
          pages: 706–709
          figure: Figures 1–2; Extended Data Figures 1–8
          quoteLocator: PZO 628 horizon, CT anatomy and combined-evidence stem placement
  claim-rationales.zh:
    - CT 解剖和形态—分子联合矩阵支持其干群位置。中等置信度保留模型敏感性，并把主张限制为路线拓扑。
    - Megachirella-to-living Pan-Squamata evidence route：所引一手研究或高质量系统综述在给定页码、图表或章节处直接支持此处的样本、校准或暂缓边界。置信度为中等。该置信度不外推至全球首现、全球末现、直接祖先或未采样区间。
  claim-statements.zh:
    - 泛有鳞类是连接取样干群与冠群有鳞类的导航路线；Megachirella 分析把一个化石恢复在有鳞类干群，但未识别直接祖先、冠群首现或完整路线时长。
    - Megachirella 标本 PZO 628 为约 2.40 亿年前的中三叠世泛有鳞类干群锚点；图谱展示 2.40 亿年前至今的路线，但不把该标本视为直接祖先或有鳞类冠群首现。
