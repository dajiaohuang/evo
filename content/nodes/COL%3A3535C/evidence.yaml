        usage:
          title: Desmodium distortum (Aubl.) J.F.Macbr., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Herbs or shrubs, to 3 m tall, branching mostly above, the stem slender, terete to subangulate, reddish, abundantly uncinulate puberulent and moderately long pilose with attenuate trichomes. Leaves trifoliolate, stipulate, and petiolate; stip- ules essentially amplexicaul, obliquely ovate attenuate, long ciliate, striate, pu- berulent and somewhat pilose on both the surfaces to glabrescent, soon reflexed, long persistent, 6-15 mm long, 3.5-6 mm wide; petioles sulcate, densely uncin- ulate puberulent and moderately pilose, 1.3-8 cm long; leaf rachis similar, 0.7-3 cm long; stipels elliptic attenuate, striate, ciliate, puberulent on abaxial surface, 4-11 mm long, to ca. 2 mm broad; petiolules somewhat stouter than the leaf rachis, densely pilose, 1.5-5 mm long; leaflets elliptic to ovate, mostly obtuse and apiculate, obtuse at the base, uncinulate puberulent and appressed pilose on the adaxial surface, prominently reticulate and abundantly soft pilose on the abaxial surface, rather densely ciliate, terminal leaflet 3.7-17 cm long, 2-6 cm wide, lateral leaflets 2-11 cm long, 1.5-5 cm wide. Inflorescence racemose pan- iculate, composed mostly of densely flowered slender, elongate racemes, the pairs of pedicels at maturity usually less than 1 cm apart; rachis ridged and grooved, densely patent pilose with slender trichomes glandular at the base and also un- cinulate puberulent; primary bracts each subtending 2 pedicels, each of these further subtended by a secondary bract, slenderly ovate attenuate, striate, pilose, ciliate, finely puberulent within, soon deciduous, 2.5-5 mm long, 0.5-1.2 mm wide, secondary bracts similar, slenderer, 1-1.7 mm long, 0.2-0.5 mm wide, also quickly deciduous; pedicels slender, ascending, glandular pilose, 6-10 mm long. Flowers with the calyx bilabiate, glandular puberulent throughout and somewhat pilose, the teeth finely ciliate, the upper lobe orbicular, slightly bifid, 2-2.5 mm long, the central tooth of the lower lobe deltoid acuminate with stout pilosity along its midrib, 2.5-3.5 mm long, the lateral teeth acute, 2.5 mm long; corolla rose purple to greenish purple, the standard obovate, acute at the base, 5-6 mm long, 3-4.5 mm wide, the wings oblong, obtuse, auriculate, 4.5-6 mm long, 1.5- 2.5 mm wide, the keel petals scythe shaped, long unguiculate, 5-7 mm long, 1- 2 mm wide. Loment stipitate, to 6-articulate, stipe 1.5-2 mm long; articles or- bicular or nearly so but often becoming variously involuted, 1.5-2.5 mm long, 1.5-2 mm wide; seeds quadrate, obtuse at the ends, reddish brown, 2 mm long, 1 mm wide.
