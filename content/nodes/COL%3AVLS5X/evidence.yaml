        usage:
          title: Canavalia brasiliensis Mart. ex Benth., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Vine trailing or climbing on herbs and shrubs, rarely high climbing; stems terete or drying slightly angled, puberulent with ascending white hairs. Leaves pinnate trifoliolate, the leaflets to 15 cm long, 11 cm wide, ovate, chartaceous, apically obtuse but often with a short acuminate and sometimes mucronulate tip, basally obtuse, truncate or rounded, mostly pubescent with short scattered hairs on both sides; petiolules 3-4 mm long, ascending pubescent; petioles mostly shorter than the leaflets. Inflorescences axillary racemes 10-20 cm long, the flow- ers mostly towards the apex; bracteoles rotund, ca. 1.5 mm long; pedicels 1-1.5 mm long. Flowers showy, pink, white or purplish, calyx campanulate tubular, 8- 12 mm long, drying with evident veins but seldom mottled, slightly oblique, the upper lip as long as the tube, entire or emarginate, deflected upwards, and the area behind compressed, the area behind this compression expanded into a small hump or bulge, the lower lip consisting of 2 round or pointed lateral teeth and 1 slightly longer, lower tooth 2-2.5 mm long, pointed and often ciliolate; standard 2.25 cm long. Legume woody, to 20(25) cm long and to 2.5 cm wide, oblong with a short downcurved beak, each valve with prominent sutural ribs and one addi- tional rib 4-6 mm from the sutural rib, usually quite glabrescent; seeds ca. 12, ellipsoidal, 12-15 mm long, brown, sometimes marbled, the hilum ca. 7 mm long, forming ca. 3/4 of 1 edge.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 5481
