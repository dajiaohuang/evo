    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants 120-250(-400) mm high. Corm conical, 8-10 mm diam., sometimes producing short stolons; tunics of fine to medium-textured fibres. Stem usually unbranched but with up to 3 widely spreading branches curved upwards distally. Leaves 3 to 6, narrowly lanceolate, 3-6 mm wide. Spike (2)4- to 7(12)-flowered; bracts pale-translucent, ± dry in upper half, outer ± 5 mm long, without dark veins when alive, when dry with a prominent, dark, median vein reaching upper margin and several more shorter veins, 3-toothed, inner as long or slightly shorter than outer, 2-veined, forked apically. Flowers clear pale yellow, sometimes slightly paler in centre, often red to brown on reverse; perianth tube filiform, 6-7 mm long; tepals subequal, elliptic, spreading, 12-18 x 5-7 mm. Stamens with filaments ± 3.5 mm long, erect, diverging slightly distally, ± white; anthers suberect, 4.5-7.0 mm long, elliptic and with elliptic connective visible on abaxial surface, latrorse, yellow; pollen yellow. Style yellow, dividing opposite base of filaments but branches held together below, only diverging opposite middle to upper half of filaments, branches arching outward to reach bases of anthers, 3-5 mm long.
            textZh: Ixia angelae Goldblatt & J.C.Manning 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Morphology row 98831; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Distinguished by the pale yellow flowers with nearly white, erect filaments held closely together for part of their length so that the style branches emerge between them halfway up their length, then arching outward, reaching to about the base of the anthers. Not clearly visible in dried specimens, the anthers are unusual, being elliptic with the connective visible between the thecae on the abaxial surface. The dehiscence is latrorse, unusual for Ixia although known in a few other species, none apparently closely related to I. angelae. The flowers have a relatively short perianth tube, 6-7 mm and tepals ± 12 mm long, about twice as long as the tube. The corms have tunics of fine, soft fibres and produce cormlets on stolons at the base. Ixia angelae stands out in sect. Ixia, especially among the short-styled species of the section in the uniformly coloured tepals without any hint of a dark centre.
            textZh: SANBI 条目提供了 Ixia angelae Goldblatt & J.C.Manning 的鉴别特征。
