    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Robust, few-branched, glaucous shrub to 3 m. Leaves 3-pinnate, concolorous, leaflets weakly pinnatisect or usually 3-sect, terminal lobes longer, subequal or shorter than adjacent lateral lobes, subterete, venation not visible. Flowers yellow, in large, orbicular, compound umbels, > 40. Fruit mostly rotund, mericarps dorsally compressed and slightly ribbed, marginally narrowly winged, homomorphic, vittae present, with additional rib vittae, rib oil ducts inconspicuous.
            sourceIds:
              - sanbi_14097_0
            locator: "SANBI/WFO archive Morphology row 9300; source 14097.0; publication: Magee, AR; Manning, JC; van Wyk, B-E; Tilney, PM. 2012. Apiaceae: Notobubon Magee. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 329 - 330. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: This species differs from N. tenuifolium in the weakly pinnatisect or 3-sect ultimate leaflet segments with subterete and needle-like lobes. It is easily distinguished from N. ferulaceum by the stout, shortly pedunculate inflorescence with at most two small secondary umbels, the very large and multiradiate primary umbel and the glaucous appearance of the entire plant. It differs furthermore from ferulaceum by having smaller, usually rotund fruit that are more narrowly-winged. The Kamiesberg form of N. capense is unusual in that the inflorescence may appear somewhat long-pedunculate, the primary umbel few-rayed and the ultimate leaflet segments longer and significantly thicker. This taxon was once considered a separate species (Peucedanum kamiesbergense). However, intermediate specimens collected in other localities in the Northern Cape Province suggest that it is merely an extreme northern form. It can however, as in the typical form, be distinguished from N. ferulaceum and N. pearsonii by the small, rotund fruit with narrow marginal wings and the combination of additional vittae below the vascular bundles in the ribs and broad commissural vittae.
            textZh: SANBI 条目提供了该种的鉴别特征。
            sourceIds:
              - sanbi_7160_0
            locator: "SANBI/WFO archive Diagnostic row 84473; source 7160.0; publication: Magee, AR; Van Wyk, B-E; Tilney, PM. 2009. A taxonomic revision of the woody South African genus Notobubon (Apiaceae: Apioideae). Syst. Bot. 34(1): 220 - 242. [All rights reserved]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
