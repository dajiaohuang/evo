    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Perennial herb, geophyte, 0.6-1.2 m high; corms depressed-globose, often 2 or more in vertical row or connected by slender stolons, tunics brown, papery. Leaves linear-lanceolate, with prominent midvein. Bracts membranous, reddish brown, ovate; outer obtuse or bluntly toothed; inner bidentate-acuminate, with papery margins. Inflorescence a lax panicle, with ascending faintly zigzag branches; flowers bright deep orange, distichous, zygomorphic; tube funnel-shaped, slightly curved, lobes unequal, obtuse; outer lanceolate, inner elliptical; posticous lobe erect, slightly longer than 5 other spreading lobes. Stamens slightly curved to posterior side; anthers contiguous, exserted. Style orange; stigma shortly bifid, fimbriate, overtopping anthers. Flowering time Dec.-Feb.
