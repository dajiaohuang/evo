        status: partially-supported
        claims:
          - text: Cormous geophyte to 20 cm, corms symmetrical, bell-shaped, basal rim fibrous, stem usually branched above ground. Basal leaves usually 2. Flowers yellow, sometimes white, with yellow cup.
            textZh: Romulea triflora (Burm.f.) N.E.Br. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 7329; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: "Closely related to R. hirsuta from which it differs as follows: Leaves filiform, glabrous, 0.5-1 mm diam., grooves narrow. Distinguished by its bell-shaped corm and bright golden yellow or rarely white flowers, without any red colouring. Some herbarium specimens are not easily distinguished from R. hirsuta var. cuprea which, however, has some anthocyanin in its perianth."
            textZh: SANBI 条目提供了 Romulea triflora (Burm.f.) N.E.Br. 的鉴别特征。
            sourceIds:
              - sanbi_12511_0
            locator: "SANBI/WFO archive Diagnostic row 51697; source identifier 12511.0; cited publication: De Vos, MP. 1983. Syringodea, Romulea, Fl. S. Africa 7(2,2): 1 - 76. Botanical Research Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Readily distinguished by its exserted stem, ± unmarked golden-yellow flowers (rarely white with a yellow cup), and bell-shaped corm. White morphs are known only from near Stanford, and the populations in the Overberg near Caledon are unusual in having the outer tepals flushed dark brown on the reverse - all other populations have the tepals yellow on both sides. Plants with ± bicoloured tepals in which the outer half is tinged salmon-coloured or orange are referred to Romulea hirsuta subsp. cuprea.
            textZh: SANBI 条目提供了 Romulea triflora (Burm.f.) N.E.Br. 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 95134; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
