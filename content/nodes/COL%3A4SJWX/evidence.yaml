            locator: "SANBI/WFO archive Morphology row 85262; source 6156.0; publication: Retief, E; Siebert, SJ; Van Wyk, AE. 2001. A new species of Rhoicissus (Vitaceae) from Sekhukhuneland, South Africa. S. African J. Bot. 67: 230 - 234. [Copyright held by the South African Association of Botanists (2001); http://www.sciencedirect.com/science/journal/02546299]. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: "Rhoicissus can be divided into two main groups: (a) leaves simple, and (b) leaves 3- or occasionally 5-foliolate. Rhoicissus sekhukhuniensis belongs to the latter group. It is easily distinguished from other compound-leaved species by its relatively large leaflets with prominently sinuate margins. It resembles R. tomentosa in the dense reddish brown indumentum of young growth and the coarsely toothed leaflet margins, but differs in having compound instead of simple leaves. It also differs in being essentially a scandent shrub and not a climber like R. tomentosa."
