      ecology:
        status: partially-supported
        claims:
          - text: Occurs in mountainous areas among boulders on dry, warm slopes descending towards non-perennial streams. It is found in dense to open savanna (Mixed Bushveld) dominated by the tree Kirkia wilmsii Engl. Rain occurs mainly in summer, and the average annual rainfall varies between 300 and 500 mm. Plants grow in clayey soils derived from ultramafic rocks (mainly norite, anorthosite and pyroxenite) of the Eastern Bushveld Igneous Complex (Rustenburg Layered Suite).
