    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Shrub up to 3 m high, occasionally branches scandent, densely hairy with reddish brown or silvery white hairs when young, glabrous with age. Tendrils present, leaf-opposed. Bark greyish white. Leaves 3(5)-foliolate, petiolate; lamina with midrib and principal lateral veins prominently raised, margins coarsely and bluntly toothed, densely fringed with hairs; terminal leaflet obovate, 70-85(-160) x 50-75(-130)mm, apex rounded, base cuneate, petiolule up to 10 mm long; lateral leaflets ± ovate 60-75(-150) x 45-60(-110) mm, apex rounded to acute, base unequally sub-cuneate to rounded, sessile or with short petiolules up to 5 mm long; petiole up to 50 mm long. Stipules early deciduous. Inflorescences leaf-opposed ± condensed thyrsoid cymes, bracteate. Flowers regular, bisexual, pedicellate subglobose in bud, densely hairy. Calyx cup-shaped, 2 mm long, 5-lobed; lobes broadly ovate, densely hairy. Petals 53 mm long. Stamens 5, curved inwards over disc; anthers ± 0.8 mm long. Fruit a subglobose berry, ± 16 x 13 mm, with four seeds, ripening through red to black. Seeds smooth with a conspicuous longitudinal dorsal furrow.
            sourceIds:
