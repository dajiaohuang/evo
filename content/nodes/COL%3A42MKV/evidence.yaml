          title: Miconia aeruginosa Naudin, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrub or small tree to 6 m. tall, the stems, petioles, both sides of the leaves, panicle, and hypanthia more or less hirsute with straight simple hairs, also (except the upper side of the leaf) more or less finely stellate-tomentulose; petioles stout, 1-3 cm. long, more densely hirsute on the upper side; leaf-blades ovate or oblong- ovate, up to 20 cm. long, half to two-thirds as wide, acuminate, commonly dentate, broadly rounded or subcordate at base, 7-nerved, the outer pair nearly marginal, sparsely hirsute above; panicle with a central axis up to 15 cm. long, with several simple branches bearing small sessile glomerules, often contiguous, of sessile flowers; hypanthium obconic, about 2 mm. long to the torus; calyx-tube prolonged about 0.5 mm., its lobes depressed-triangular, minute; exterior teeth subulate, barely surpassing the lobes; petals white, obovate-oblong, 3.5-4 mm. long; stamens di- morphic; anthers linear, about 2 or about 2.5 mm. long, connective of the smaller ones simple, that of the larger prolonged at base into two small lateral lobes; stigma truncate.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 7540
