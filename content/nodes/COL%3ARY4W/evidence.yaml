        usage:
          title: Cavendishia santafeensis Luteyn, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Epiphytic shrub, glabrous throughout; mature branches and twigs of the new growth subterete, smooth or striate, reddish brown when dry. Leaves elliptic, lance elliptic or oblong lanceolate, (8-)10-19 cm long, (2.5-)4.5-6.5 cm wide, basally rounded or narrowly obtuse, apically short acuminate; 3-5- plinerved, the midrib and the lateral nerves impressed above, raised and con- spicuous beneath, the outer pair of the lateral nerves anastomosing with the secondary nerves midway up the leaf, the veinlets slightly raised on both the surfaces but conspicuous only above; petioles terete, rugose, ridged, 7-10 mm long, 2-3 mm in diameter, dark brown when dry. Inflorescence 9-12-flowered, the lowest few nodes sterile; rachis subterete, stout, 1.5-2.5 cm long, ca. 5 mm in diameter at base; floral bracts thin and translucent when dry, spatulate, apically rounded and deeply emarginate, 33-45 mm long, 15-20 mm wide at the top, nar- rowing sharply to 2-6 mm at the base, pale reddish violet, lamina with tiny, red, clavate abaxial glands; pedicels striate, 8-13 mm long, 1-1.5 mm in diameter; bracteoles similar to the floral bracts but 36-44 mm long, 10-12 mm wide at the top, narrowing to ca. 1 mm at the base, conspicuously imbricate distally in bud, the margins without glandular fimbriae or callose thickenings. Flowers with the calyx 8-8.5 mm long, the tube cylindric, bluntly 5-angled, 3-3.5 mm long, shallowly enlarged basally, the enlargement undulate but not lobed, the limb cylindric, 5 mm long including the lobes, the lobes narrowly triangular, acute, 3-3.5 mm long, erect after anthesis, marginally glandular callose thick- ened with oblong glands extending marginally along each side of the lobe, sinuses obtuse; corolla glabrous ca. 42.5 mm long, 7 mm in diameter, white, the lobes 3 mm long, purple; stamens 37-38 mm long, the filaments alternately ca. 2.5 mm and 10.5 mm long, the long filaments puberulent, the anthers including the tubules alternately ca. 36 mm and 28.5 mm long, the thecae 14-15 mm long. Berry not seen.
