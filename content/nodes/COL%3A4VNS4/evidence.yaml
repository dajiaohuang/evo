          - text: Perennial, stout, aquatic with evergreen aerial parts. This species is distinguished from S. melanomphala by its leaves crowded towards the base of the culm, by its lax, copiously branched panicles, by its adaxially densely-hirsute female glumes and by its strongly-beaked achene which lacks a black apex.
