        usage:
          title: Pouteria subrotata Cronquist, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Tree 10-15 m high, the limbs and branchlets erect. Leaves with petioles 1.5- 3.3 cm long; blades obovate to elliptic-obovate, acuminate, 10-23 cm long, 5-11.5 cm broad, glabrous above, glabrous or sparsely strigulose below (the trichomes scattered and not concentrated along the main veins), not conspicuously reticulate- veiny, the primary lateral veins prominent, 8-11 pair, the secondary laterals nu- merous, fine, close, sinuous but regularly disposed and subperpendicular to the primary laterals except near the midrib (there strongly curved). Flowers subsessile (pedicels to 2 mm), clustered in leaf-axils and at defoliated nodes; sepals 5, ovate, 1.7-2 mm long, densely appressed-puberulent externally (the margins of the inner sepals glabrous), more sparsely pubescent within; corolla white, subrotate, 3.5-3.8 mm long, the lobes 5, 2.5-3.1 mm long, ovate-oblong, sparsely to moderately ap- pressed-sericeous externally except near the margins; staminodes linear-filiform, ca 2 mm long; staminal filaments 1.7-1.9 mm long, attached at the base of the corolla-lobes, the anthers ca 1 mm long; ovary densely appressed-white-sericeous, 5-locular, the style stout, 1.5-2.5 mm long, glabrous except at the base. Fruit green or yellow-green, turning red, oblong-ellipsoid, 2-2.5 cm long, ca 1.2 cm broad, 1-seeded, the flesh scant; seed ellipsoid, ca 2 cm long, filling the fruit, the scar 8-9 mm broad, extending the length of the seed.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 12797
