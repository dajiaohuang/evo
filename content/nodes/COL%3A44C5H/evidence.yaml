    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, up to 150 mm tall, branched. Leaves 2 or 3, linear, fairly short, channelled. Flowers enclosed in green spathes, yellow, tepal claws long, limbs shorter, outspread, filaments united in a slender column, style branches narrow, diverging, crests short, erect.
            textZh: Moraea flexicaulis Goldblatt 的 SANBI 物种条目记载了植株、叶片和花部形态。
            sourceIds:
              - sanbi_14562_0
            locator: Strelitzia 30; archive Morphology row 33329, source 14562.0
            placeTimeScope: Regional species account published 2013; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
          - text: So unusual is Moraea flexicaulis that when first described it was assigned to a separate sect. Flexuosae of subg. Moraea, but molecular studies have shown it to be deeply nested in subg. Homeria, in which its chromosome number, 2n = 12, and karyotype of exclusively acrocentric chromosomes are consistent, as are the largely united filaments forming a sturdy, cylindric column. Moraea flexicaulis is now considered to be most closely allied to two Namaqualand species of subg. Homeria, M. schlechteri and M. knersvlaktensis, all three with several leaves, even those in the upper part of the stem with free blades, and filaments free and diverging distally. The species remains a very distinctive member of the subgenus. Its particularly well-developed style branches and crests are exceptional in subg. Homeria but both its presumed close allies have style branches bearing moderately well-developed crests although they have much shorter style branches. Blooming early in the season, in late June and July, Moraea flexicaulis comes into flower three to four weeks after the first soaking autumn or winter rains fall in this arid area of the southern African northwest coast. As with many plants of arid areas, plant size is very variable depending on rainfall. Plants from the base of the Ploegberg in the Richtersveld are unusually robust compared to other collections, up to 150 mm tall (vs. < 100 mm elsewhere) and with larger rhipidial spathes (45-50 mm vs. 20-40 mm) and broader leaves, leaving open the possibility that they may be a separate species but this remains uncertain until more material is available.
            textZh: SANBI 条目提供了 Moraea flexicaulis Goldblatt 的鉴别特征。
