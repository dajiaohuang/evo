        usage:
          title: Sicyos polyacanthos Cogn., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: High-climbing vines; stems slender, scabrous or villous. Leaves cordate to suborbicular, 8-25 cm long, nearly as wide as long, shallowly 3- to 5-lobate, the apex of the lobes acute, the base deeply cordate, the margin undulate dentate, submembranaceous, the upper surface pustulate dotted, scabrous, pubescent on the veins, at least near the base, the lower surface villous pubescent on the veins; petioles 8-20 cm long, slender, pubescent, or villous, distinctly striate; tendrils 2- to 5-branched. Staminate flowers axillary, racemose, the rachis 10-30 cm long, sulcate, pubescent, villous, or glabrate, flowered in the upper part; calyx broadly campanulate, the lobes linear to triangulate, 2-3 mm long, sparsely villous; corolla yellowish green, the lobes spreading, triangular lanceolate, 5-7 nerved, 3-4 mm long, slightly glandular papillose on both the surfaces; stamens 3, con- nate, the anthers connate, capitate, the theca flexuous. Pistillate flowers in capi- tate clusters at the end of the peduncle; peduncle short; calyx and corolla as in the staminate flowers; stigma broad, 3- to 5-lobed, the ovary elliptic, setose. Fruits ovoid, compressed, ca. 1 cm long, 5-6 mm wide, the seta 2-3 mm long; seed ovoid, 4-6 mm long.
          originalLanguage: en
          sourceField: general
