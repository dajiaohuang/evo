  claims:
    - subjectId: event:haootia-muscle-interpretation
      claimKind: scientific
      claimType: morphology
      statement: Haootia preserves repeated aligned impressions in a tetraradial body, interpreted as muscle bundles and compared with Staurozoa, but fibre identity and detailed homology have competing primary assessments.
      confidence: contested
      confidenceRationale: The holotype impression is direct evidence; muscle tissue, orientation and crown-staurozoan placement are interpretations with published criticism and later reassessment.
