  claim-rationales.zh:
    - 正模印痕是直接证据；肌肉组织、方向及十字水母冠群位置是具有已发表批评和后续复核的解释。
  claim-statements.zh:
    - Haootia 的四辐射躯体保存了重复排列的印痕，被解释为肌束并与十字水母纲比较；但纤维性质及具体同源关系在一手研究中仍有不同判断。
