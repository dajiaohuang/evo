          - text: Polycarena fillformis is at once distinguished from P. tenella by its nearly sessile flowers with a well-developed bilabiate limb with rounded lobes and conspicuous dark anthers (versus pedicels 1.5-5 mm long, regular corolla with very pointed lobes, and minute pale-coloured anthers). They appear to be allopatric.
