        claims:
          - text: Delicate, glandular-pubescent annual, 120-250 mm tall, stem usually well-branched from base. Leaves oblanceolate to linear, decreasing in size upwards, few-toothed to entire. Flowers in terminal racemes, corolla tube 2.6-3.6 mm long, glabrous, white, ?with a yellow patch at base of upper lip.
            sourceIds:
