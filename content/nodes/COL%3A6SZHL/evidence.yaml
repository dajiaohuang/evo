      ecology:
        status: partially-supported
        claims:
          - text: In this controlled exposure experiment, fusion of secondary gill lamellae was reported in 33% of adult medaka exposed to polyester microfibers and 67% exposed to polypropylene microfibers at 10,000 fibers/L for 21 days; no fusion was observed in controls. Histology used six fish per treatment. The authors also noted minor petechiae and epithelial lifting in some control gills.
            sourceIds:
              - hu2020medaka
            locator: Methods §§2.3–2.6; Results §3.4 and Fig. 4, including the control comparison and histology sample description.
            placeTimeScope: Adults from a laboratory colony were exposed in a dedicated room at 24°C under a 14:10 light:dark cycle for 21 days. The article does not report calendar dates or a wild collection locality for the experimental fish.
            lifeStatus: Captive laboratory-colony adults; no wild fish or fossil material was assessed.
            originalLanguage: en
        gaps:
          - The histology sample was six fish per treatment from one laboratory colony, and the reported concentration is not an environmental threshold.
          - The study does not establish responses in wild populations, across strains, or at lower environmental exposure levels.
          - Morphology outside this exposure response, life history, other ecology, evolution, distribution, fossils, conservation, and independent review remain unassessed.
      evolution:
