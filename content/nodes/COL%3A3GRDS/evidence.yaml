        usage:
          title: Goethalsia meiantha (Donn.Sm.) Burret, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Tree 15-45 m. high, the trunk 0.35-1.5 m. in diam., often strongly buttressed, the young branchlets minutely puberulous. Leaves with a terete petiole 0.8-1.8 cm. long, shortly tomentellous, the blade elliptic to oblong-elliptic, acute to rounded at the base, acuminate at the apex, 6.5-18 cm. long and 2.5-7 cm. wide, chartaceous, discolor, the margins remotely serrate, the upper surface green and sparsely puberu- lous, the lower surface pale, densely and minutely appressed-puberulous, the nerva- tion prominent beneath. Inflorescences axillary or terminal, the cymes usually few- flowered, the axes shortly tomentellous. Flowers pale yellow, the pedicel ca. 8-9 mm. long, the bractlets ovate to broadly ovate, acute or obtuse at the apex, slightly un- equal, ca. 6-6.5 mm. long and 3.5-4 mm. wide, shortly tomentellous without, densely and minutely villous within; sepals narrowly lanceolate, acuminate, ca. 13-14 mm. long and 2-2.5 mm. wide, densely and shortly arachnoid outside, long-arachnoid especially on the upper half inside; petals oblong to narrowly obovate, unguiculate and gibbose at the base, obtuse at the apex, 5-6 mm. long and 1.2-2 mm. wide, the claw cuneate, ca. 1.5-2 mm. long, entirely glandular-thickened within, densely villous above the claw, elsewhere papillate and with scattered long stellate hairs; gonophore ca. 1.5-1.8 mm. long, the urceolus ca. 2 mm. in diam., densely villous except the base; stamens ca. 22-25, the filaments 5-7 mm. long and glabrous, the anthers ca. 0.5 mm. long; ovary ellipsoid, slightly 3-angled, ca. 2.5-3 mm. long and 1.5 mm. broad, densely appressed-villous; style ca. 3-5 mm. long, glabrous or slightly villous at the base; stigma obscurely 3-lobulate. Samaras broadly winged, the wings emarginate at both ends, 4-4.5 cm. long and ca. 2.2 cm. wide, puberulous to tomentellous on the outer surface; seeds ca. 2.8-4 mm. long and 1.8-2.5 mm. broad.
