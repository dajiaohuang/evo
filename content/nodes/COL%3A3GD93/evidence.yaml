    facets:
      morphology:
        status: partially-supported
        claims:
          - text: A climbing plant. Stems terete, glabrous. Leaves about 10 cm long, 4-8 cm broad, ovate, long-acuminate into a tendril, glabrous. Flowers solitary; buds ovate in outline, winged. Pedicel up to 13 cm long, terete, glabrous, sharply bent at the apex. Perianth-segments at first a pale yellow in colour, changing to red above and yellow beneath when more mature, at first horizontal and then strongly reflexed, 5 cm long, 2 cm broad, lanceolate, acuminate, with a deeply channelled claw, keeled in the channel. Stamens at first pointing downwards, at length becoming horizontal and radiating, 2-7 cm long; anthers 1-2 cm long, 3 mm broad, linear. Ovary 1-7 cm long, deeply 3-lobed; style bent at right angles to the ovary, 3-8 cm long; lobes 3 mm long.
