  claims:
    - subjectId: taxon:pan_troglodytes
      claimType: taxonomy
      claimKind: scientific
      statement: COL26.8 dataset 316115 records accepted species usage 4C92G as Pan troglodytes, with the parent path through Homininae and Pan. This establishes checklist identity and classification only.
      confidence: medium
      confidenceRationale: The pinned checklist usage and its accepted parent chain are explicit; this claim is limited to that release and makes no phylogenetic or biological inference.
      referenceLinks:
        - referenceId: col-2026-checklistbank-316115
          relation: supports
          pages: Accepted usage 4C92G; source dataset 2144; parent chain Homininae > Pan > Pan troglodytes
    - subjectId: taxon:pan_troglodytes
      claimType: biogeography
      claimKind: scientific
      statement: Bossou, Guinea, is the single locality represented by the selected ecology study; this study location is not a species-wide distribution claim.
      confidence: high
      confidenceRationale: The primary field study identifies Bossou as its site; the claim deliberately records only a sampled locality and not the species range.
      referenceLinks:
        - referenceId: bryson-morrison-2017-bossou-habitat
          relation: supports
          quoteLocator: Methods, Behavioral Observations; study site and focal community
    - subjectId: taxon:pan_troglodytes
      claimType: ecology
      claimKind: scientific
      statement: At Bossou, Guinea, daily behavioral follows of the local wild P. t. verus community (up to 6 h/day; April 2012–March 2013) found mature forest was the most selected habitat overall. Recorded feeding events in noncultivated habitat occurred more often than expected by chance more than 200 m from cultivated fields and less often than expected within 0–100 m and 101–200 m bands. The authors suggested field-associated risk may influence feeding locations. These results describe one site and community, not species-wide habitat use.
      confidence: medium
      confidenceRationale: The study directly reports habitat selection and feeding-event distances for one Bossou community. The observations do not represent other sites or establish species-wide habitat use.
      referenceLinks:
        - referenceId: bryson-morrison-2017-bossou-habitat
          relation: supports
          pages: Methods, Behavioral Observations and Feeding Event Locations; Results, Habitat Use and Preferences and Distance of Feeding Events in Noncultivated Habitat Relative to Cultivated Fields and Routes; Table II
    - subjectId: taxon:pan_troglodytes
      claimType: fossil-range
      claimKind: scientific
      statement: The selected COL26.8 checklist and Bossou habitat-use study establish checklist identity and one-site ecology, but do not provide a numerical temporal fossil-range estimate for Pan troglodytes.
      confidence: medium
      confidenceRationale: The selected checklist is taxonomic and the cited field study is ecological; neither source estimates a fossil or species-duration range, so the numerical interval remains withheld.
      referenceLinks:
        - referenceId: col-2026-checklistbank-316115
          relation: supports
          pages: Accepted usage 4C92G; identity and classification only
        - referenceId: bryson-morrison-2017-bossou-habitat
          relation: supports
          quoteLocator: Methods, Behavioral Observations; single study site and focal community
  claim-rationales.zh:
    - 固定清单中的接受用名和父级链记录明确；本主张仅限于该版本的分类身份，不推断系统发育或生物学特征。
    - 一手野外研究明确列出 Bossou 研究地点；本主张只记录取样地点，不将其扩展为全物种分布。
    - 研究直接报告了 Bossou 一个群体的栖地选择和取食事件距离；这些观察不代表其他地点，也不建立全物种栖地利用。
    - 所选清单用于分类，野外研究用于生态观察；两者均未估算化石或物种持续时间，因此数值范围继续隐藏。
  claim-statements.zh:
    - COL26.8 数据集 316115 将用名 4C92G 记录为接受的 Pan troglodytes 种级用名，其父级路径经过 Homininae 和 Pan。此记录只支持该清单版本中的分类身份与分类路径。
    - Bossou（几内亚）是所选生态研究唯一覆盖的地点；研究地点不等于该物种的完整分布。
    - 在几内亚 Bossou 对当地野生西部黑猩猩群体的每日行为跟踪（每天至多 6 小时，2012 年 4 月至 2013 年 3 月）发现，成熟森林在总体活动中是选择比例最高的栖地类型。在非耕地栖地记录的取食事件中，距耕地超过 200 米的次数高于随机预期，0–100 米和 101–200 米范围内的次数低于预期。作者提出，与耕地相关的风险可能影响取食地点。这些结果描述的是单一地点和群体，不能代表全物种的栖地利用。
    - 所选 COL26.8 清单和 Bossou 栖地利用研究分别支持清单身份和单一地点的生态证据，但没有提供 Pan troglodytes 的数值化地质时间范围。
