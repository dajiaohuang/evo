        usage:
          title: Ardisia darienensis Lundell, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Trees, 3-5 m high, branchlets thick, furfuraceous with closely appressed ferruginous scales. Leaves subsessile, the short thick broadly marginate pet- ioles to 1 cm long; leaf blades chartaceous, entire, paler and ferruginous below, the lower surface furfuraceous with appressed scales, obovate, obovate- elliptic, or oblanceolate, 11-23 cm long and 5-9.5 cm wide, abruptly short- acuminate apically, the acumen acute, rounded basally, decurrent on the petiole, the costa impressed above, prominent beneath, the primary lateral veins slender and widely arcuate, scarcely discernible above. Inflorescences treminal, tripinnately paniculate, to 25 cm long and wide, few-branched, the branches thick and flexuous, open, appressed-furfuraceous. Flowers 5- merous, racemose, the apical approximate or subglomerate, the lower remote in the racemes; fruiting pedicels thick, rigid, 3-6 mm long; sepals coriaceous, ovate, ca. 5 mm long, erose-ciliate, rounded apically, free nearly to the base, black-punctate, lepidote. Fruit globose, ca. 1 cm in diameter.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 8231
