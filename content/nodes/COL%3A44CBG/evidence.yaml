    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plant small, acaulescent 30-40 mm high. Corm spindle-shaped, ± 10 mm diam., tunics of grey-brown, wiry, reticulate fibres. Stem with 1 to 4 sessile branches clustered at ground level. Leaves 3, clustered at ground level, lowermost longest, inserted on stem at ground level, falcate, terete, 50-80 mm long, 0.8-1.0 mm diam., upper 2 leaves much shorter, recurved, bifacial, channelled or with short terete blade up to 20 mm long. Rhipidial spathes green, 25-30 mm long, outer leaf-like, spreading distally, ± as long as inner. Flowers rotate, pale to golden-yellow, limbs of all tepals with brown, spear- or lozenge-shaped nectar guide near bases, tepal claws ascending, forming a cup enclosing base of filament column, limbs spreading, inner usually twisted through 90º distally; tepals united for 2 mm, claws ± 1 mm long, limbs obovate-pandurate, truncate, outer ± 12 x 6 mm, inner slightly smaller. Filaments ± 5 mm long, connate in a smooth, cylindric column ± 4 mm long, free and diverging in upper 1 mm; anthers ± 3 mm long, arched, yellow; pollen yellow. Ovary cylindric, ± 10 mm long, included; style branches divided almost to base into paired terete arms extending either side of each anther, ± 1.5 mm long, stigmatic at apices, crests reduced, ± 1 mm long. Capsules and seeds unknown.
            textZh: Moraea singularis Goldblatt & J.C.Manning 的 SANBI 物种条目记载了植株、叶片和花部形态。
            sourceIds:
              - sanbi_18638_0
            locator: Strelitzia 42; archive Morphology row 99014, source 18638.0
            placeTimeScope: Regional species account published 2020; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
          - text: An acaulescent species, Moraea singularis also stands out in the short, terete leaf blades. The yellow flowers, with both inner and outer tepals limbs bearing brown nectar guides, have tepal claws only ± 1 mm long that form a narrow cup including the base of the smooth filament column. The tepal limbs are oblanceolate-pandurate, the inner three slightly smaller than the outer and twisted through 90º. The asymmetric corms with brown corm tunics accord best with subg. Umbellatae, as do the outer rhipidial spathes, which sheath the inner only in the lower half and arch outward distally, and also the yellow flowers with darkly veined tepals and brown nectar guides. Unique to the subgenus is the terete blade of the basal leaf, while the upper leaves are channelled entirely or for part of their length and terete distally.
            textZh: SANBI 条目提供了 Moraea singularis Goldblatt & J.C.Manning 的鉴别特征。
