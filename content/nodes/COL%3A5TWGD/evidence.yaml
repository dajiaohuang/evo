    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Short-stemmed, rosettes single, dense, ball-shaped, more often in groups of 10 or more, 200-300 mm tall. Leaves brownish green, narrow, triangular, ± 200 mm long, 40 mm wide at base, incurved, surface rough, keel and margins with large, black, thorn-like teeth up to 10 mm long. Flowers in usually unbranched, oblong racemes, bright red, yellowing with age.
            textZh: Aloe melanacantha A.Berger 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_14533_0
            locator: "SANBI/WFO archive Morphology row 30794; source identifier 14533.0; cited publication: Klopper, RR; Smith, GF. 2013. Asphodelaceae: Aloe. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 45 - 48. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Aloe melanacantha is similar in appearance to A. erinacea, but there are several characters that may be used to distinguish them. In A. melanacantha, plants are solitary and the leaf sap dries a rich golden colour. The flowers are distinctly incurved, the leaves are dark green and relatively flat, and plants flower freely both in nature and cultivation. In A. erinacea, on the other hand, plants usually sucker to form clumps, and the leaf sap dries lemon-yellow.
            textZh: SANBI 条目提供了 Aloe melanacantha A.Berger 的鉴别特征。
