    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte to 20 cm, tunics woody, concentric. Leaves several, plane, lanceolate to sword-shaped. Flowers on a 1-3-flowered spike, golden-yellow with glossy black-maroon central eye, yellow-green in tube, tepals spreading.
            textZh: Geissorhiza tricolor Goldblatt & J.C.Manning 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 6841; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Recognised by its deep yellow flowers with exceptionally broad tepals and a dark, maroon-black central eye. The perianth tube, 3-4 mm long, is relatively short in comparison to the tepals, 12-15 mm long. The species recalls G. inconspicua and G. foliosa in vegetative morphology, but the flowers are larger than in both of these species and very different in colour. Geissorhiza foliosa has pink to light purple flowers with a tube ± 5 mm long and tepals 13-17 mm long, and G. inconspicua has blue-violet, pink or white flowers with a perianth tube 4-6 mm long and tepals 8-11, rarely up to 15 mm long.
            textZh: SANBI 条目提供了 Geissorhiza tricolor Goldblatt & J.C.Manning 的鉴别特征。
            sourceIds:
