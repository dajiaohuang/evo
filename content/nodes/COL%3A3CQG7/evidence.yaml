          - text: Although E. caerulescens and E. radyeri are similar, they are easily separated. Branches around the perimeter of most plants of E. radyeri are usually rhizomatous and this phenomenon is unknown in E. caerulescens. The branches tend to have a more bluish green colour in E. radyeri than in E. caerulescens, though the colour varies greatly in the latter, with greener branches on plants from more sheltered habitats. The branches of E. radyeri are thicker, deeply articulated into almost spherical segments, while those of E. caerulescens are generally more slender and only indistinctly articulated into considerably longer, cylindrical segments. In E. radyeri the tubercles are often much longer and broader and the leaf-rudiments are somewhat larger than in E. caerulescens. Florally E. caerulescens and E. radyeri are very similar. In E. caerulescens the cyathia are often slightly narrower, becoming more abruptly narrow beneath the glands, while the female florets are borne on a slightly longer pedicel and are without the elongated calyx of E. radyeri.
