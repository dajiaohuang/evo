  claims:
    - subjectId: event:basilosaurus-hind-limb-specimens
      claimKind: scientific
      claimType: morphology
      statement: Egyptian Basilosaurus isis material preserves a tiny jointed pelvic limb and foot, and named specimen UM 93231 supplies measured femoral microstructure; terrestrial locomotion is excluded while a copulatory function remains inferred.
      confidence: medium
      confidenceRationale: Hind-limb anatomy and the UM 93231 femur measurement are direct specimen evidence. Soft-tissue position, copulatory use and whole-animal swimming effects are functional extrapolations.
      referenceLinks:
        - referenceId: gingerich-1990-basilosaurus-hind-limbs
          relation: supports
          pages: 154–157
          figure: Figures 1–3
          quoteLocator: Hind-limb description; Functional discussion
        - referenceId: houssaye-2015-eocene-whale-bone
          relation: supports
          pages: e0118409
          figure: Table 1; Figure 11
          quoteLocator: Materials; Basilosaurid femora
  claim-rationales.zh:
    - 后肢形态与 UM 93231 股骨测量是直接标本证据；软组织位置、交配用途和全身游泳效应属于功能外推。
  claim-statements.zh:
    - 埃及龙王鲸材料保存微小而具关节的骨盆肢和足，具名标本 UM 93231 还提供了实测股骨微结构；陆地运动可排除，而交配功能仍属推断。
