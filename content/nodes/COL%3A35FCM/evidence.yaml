        usage:
          title: Diastatea micrantha (Kunth) McVaugh, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Annual herbs 5-50 (-75) cm tall; stems simple or branched, often purplish, terete to angled, sometimes narrowly winged and chaffy-pubescent to glabrous. Principal leaves chartaceous to more typically membranous, lanceolate to ovate, sessile to distinctly petiolate, the petiole to 13 mm long with the pubescence, if present, mostly concentrated on the margins, on the veins of the lower surface and on the base of the upper surface, serrate, serrulate, sinuate or jagged-toothed; blades mostly 2.2-5.5 cm long, (0.5-) 1-3 cm wide. Inflorescences somewhat secund, few- to 30-flowered; pedicels (6-)15-30(-42) mm long, usually upturned distally, glabrous, ciliate or chaffy-hirsute. Flowers 4.5-6.5 (-8) mm long; calyx tube mostly glabrous, 0.5-1 mm high, the calyx lobes linear, entire or sparingly ciliate-toothed, 1.5-3.5(-5.5) mm long and less than 0.5 mm wide at the base, acute to acuminate apically; corolla dark purplish blue, pale lilac, blue, or rarely white, the tube 2.5-4 mm long, the 2 upper lobes broadly triangular, ca. 1.5 mm long, the 3 lower-lobes rounded-spatulate, ca. 2 mm long; filaments 3-4.5 mm long, the anther tube 0.5-1.5 mm long, the 3 longest anthers apically glabrous and ex- ternally often sparingly short-pubescent, the 2 shorter anthers with a dense fringe of short bristles ca. 0.2 mm long. Capsules 3-6(-8) mm long, 1.5-2.5 mm in di- ameter, narrowly ellipsoid.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 2992
          archiveSourceId: 5F0199D0-8AC2-4F68-A31D-B1E7BB8631DF
