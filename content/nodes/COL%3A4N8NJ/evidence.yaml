          originalSourceText: Large evergreen tree, up to 20 m. tall with trunk up to 50 cm. in diameter, entirely glabrous. Leaves coriaceous, entire, elliptic to lanceolate or ovate, 2.5-5.5 cm. wide, 6-13 cm. long, usually 2-2.5 times as long as wide, rounded at base, narrowed toward the apex from about the middle, with a short blunt acumen; petiole stout, 1-1.5 mm. in diameter, 1-1.5 cm. long; lateral veins often 5-7 pairs, inconspicuous, slender, arcuate-ascending, anastomosing well inside the mar- gin; glands usually present on the lower surface of the blade near base, round or oval, often about 0.5 mm. wide and 0.7 mm. long, 1-2 (rarely none, or 3) on each side of the midrib, mostly 5-10 mm. from the base of the blade and about 5 mm. from the margin, but sometimes as little as 1-2 mm. from base or margin; stipules very soon deciduous, not seen, probably narrowly linear, 2-4 mm. long. Flowers in leafless racemes 4-5.5 (-7) cm. long, these from the axils of the sub- persistent leaves of the preceding season; flowers 20-40, subtended by very small chartaceous bracts which are deciduous before the flowers open; pedicels naked, 3-7 mm. long (those at the base of the racemes the longest), 0.5-0.7 mm. in
