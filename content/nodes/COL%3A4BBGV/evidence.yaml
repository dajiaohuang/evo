    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Herb, up to 400 mm tall. Bulb with contractile root, bulb tunics smooth. Rhizome without runners. Sepals with rusty apical calli. Peduncles basal. Flowers purplish pink with yellow tube.
            sourceIds:
              - sanbi_11118_0
            locator: "SANBI/WFO archive Morphology row 2910; source 11118.0; publication: Herman, PPJ; Retief, E. 1997. Plants of the northern provinces of South Africa: Keys and diagnostic characters. Strelitzia 6: 1 - 681. National Botanical Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: "This species is only known to me from dried specimens. The name seems to cover a polymorphic group of plants which may possibly be divisible by the characters of the root-system, but the bulbs are almost invariably missing in herbarium specimens. If it is possible to classify the group, it can only be done after special study in the field. 1695, Kentani, Pegler 220: Griqualand E.; Tzitza Riv., Schltr. 6362, Tyson 1243, 2147: Natal; B.H. 20032, 20086, Wood 550 (double flowers): Zululand; Mogg 4414 ex pte.: Basutoland; Leribe, Dieterlen 6787: O.F.State; Caledon River, Burke & Zey. 440, 271 (type of 0. semiloba): Griqualand W.; B.H. 15023, 15024: Transvaal; Rogers 18090: Bechuanaland; Harber (Herb. Rogers): Southern Rhodesia; Eyles 4421, Teague 340, 476, Rogers 5773, 13675: Lourenço Marques; Weintroub (B.H. 21160), Howard 76. In the absence of the bulbs, some forms are very difficult to distinguish from O. tragopoda Salter. The type is a form with smallish leaflets. It is possible that the species O. angustiloba R. E. Fries from Rhodesia and O. uhuhensis Engler from Tropical Africa, both with very deeply lobed leaflets, merge into this group. In many South African herbaria it has been confused with O. latifolia H.B. & K., an introduction from Mexico."
            textZh: SANBI 条目提供了该种的鉴别特征。
            sourceIds:
              - sanbi_11510_0
            locator: "SANBI/WFO archive Diagnostic row 74981; source 11510.0; publication: Salter, TM. 1944. The genus Oxalis in South Africa: A taxonomic revision. J. S. African Bot. 1 Suppl.: 1 - 355. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Differs from O. bowiei in having smaller leaves and apical calli on sepals, otherwise the two species are similar.
            textZh: SANBI 条目提供了该种的鉴别特征。
            sourceIds:
