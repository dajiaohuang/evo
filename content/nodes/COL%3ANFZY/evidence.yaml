    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Bulbous geophyte, 30-150 mm tall. Leaves (2)3 or 4, dry at flowering, ± strap-shaped, spreading on ground, upper surface pustulate, bearing straw-coloured bristles, rarely smooth. Flowers 4-8, in a small compact head, tepals flared upwards or occasionally one remaining basal, pink, stamens and style usually descending and longer than tepals.
            textZh: Brunsvigia namaquana D.Müll.-Doblies & U.Müll.-Doblies 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_14528_0
            locator: "SANBI/WFO archive Morphology row 32808; source identifier 14528.0; cited publication: Snijman, DA. 2013. Amaryllidaceae. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 33 - 42. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: The species is most easily recognised by its (2)3(4) leaves with long (1.5-5.5 mm), pliable, straw-coloured bristles arising from widely scattered pustules on the longitudinal veins of the adaxial surface. In herbarium specimens the bristles become appressed to the leaf surface, often in overlapping ranks along the veins. The leaf margins are thin-textured and mostly outlined with a row of micropapillae without bristles. As recircumscribed here, the species is more variable florally than was previously known. Although long (±1.5 times as long as the tepals), declinate stamens were treated as diagnostic of the species, these characters are confined to just a few plants in populations that otherwise have filaments spreading only slightly below the horizontal plane. The stamens vary in length at anthesis, even in an individual flower, with the shortest ± equal to the tepals and the longest exserted by up to ±8 mm. Also variable are the lateral appendages, which are occasionally present as wings or teeth near the base of the filaments.
            textZh: SANBI 条目提供了 Brunsvigia namaquana D.Müll.-Doblies & U.Müll.-Doblies 的鉴别特征。
            sourceIds:
              - sanbi_7635_0
            locator: "SANBI/WFO archive Diagnostic row 58116; source identifier 7635.0; cited publication: Snijman, DA. 2012. A revision of the Brunsvigia radula-group (Amaryllidaceae: Amaryllideae) of species in South Africa, including the description of Brunsvigia gariepensis a new species from Bushmanland in Northern Cape. S. African J. Bot. 79: 106 - 116. [Copyright held by the South African Association of Botanists (2012); http://www.sciencedirect.com/science/journal/02546299]. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
