            locator: "SANBI/WFO archive Morphology row 2480; source 11118.0; publication: Herman, PPJ; Retief, E. 1997. Plants of the northern provinces of South Africa: Keys and diagnostic characters. Strelitzia 6: 1 - 681. National Botanical Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: In the Flora Capensis this species is partly confused with J. glaucum (L.f) Ait., and the type number of J. multipartitum, Krauss 458, is cited under J. glaucum. J. multipartitum is also closely related to the subtropical species J. stenolobum Rolfe. The main difference between these species is the obvious pubescence of J. stenolobum and the less conspicuous but characteristic short dense pubescence of J. multipartitum. Among the tropical species, J. multipartitum is nearest to J. meyeri-johannis Engl, as defined in the Flora of Tropical East Africa (1952). The main difference is the constantly 3-flowered inflorescence of the tropical species, and there is a slight difference in the size, texture and venation of the leaves. The fruits of J. multipartitum were tested at the laboratories of the Division of Veterinary Services, Pretoria, where 2 doses of 20 grams each were given to rabbits with negative results.
