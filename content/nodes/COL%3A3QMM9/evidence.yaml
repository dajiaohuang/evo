    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Shrub, 0.45-3.00 m high. Twigs shortly, densely and persistently puberulous. Leaves unifoliolate, rarely 3 times as long as broad, petiole articulate in lower half. Calyx lobes almost as long as to much longer than calyx tube. Flowers single on short pedicels, white, pink-flushed or lobes dorsally brick-red.
            sourceIds:
