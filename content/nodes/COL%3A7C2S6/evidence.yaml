        claims:
          - text: Perennial, up to 0.9 m tall. Leaves linear; ligule a fringe of hairs. Inflorescence a loosely contracted panicle, slightly nodding. Spikelets 20-25 mm long, many-flowered; glumes equal, longer than spikelet (excluding awns), 3-5-nerved, 1-keeled near base; lemmas with tufts of hairs on margins at base and below central awn, lobes shortly awned, central awn 10-15 mm long, bent, twisted below; callus thick, truncate to rounded.
