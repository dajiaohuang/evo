        claims:
          - text: Shrub, up to 300 mm tall, becoming cushion-shaped with age, spiny due to aborted or discarded fruit. Leaves 3-sided, papillate. Flowers without petals, filamentous staminodes numerous, white, stamens white. Fruit 5-locular, 8-12 mm diam., closing bodies hook-shaped, closing rodlets present, valve wings very narrow.
