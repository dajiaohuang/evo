    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Perennial 60-400 mm high; extensively stoloniferous, forming dense swards; sheaths strongly flattened, often grouped in fan-shaped arrangements. Leaf blade 50-80 x 8-12 mm, folded when young, keeled, obtuse and rounded at apex. Inflorescence spike-like, compact, compressed, central axis thickened, not corky, flat on one side, hollowed out on the other, each cavity is borne alternately on either side of a wavy, winged midrib, wing at the edge of the cavity is formed into a broad acute tooth (at least on upper part of the inflorescence); racemes short, ending in a narrow, sharp, naked projection, 3-7 spikelets per raceme. Spikelet 4-5 mm; lower glume 1.0-1.5 mm long, shorter than spikelet, nerveless, obtuse; upper glume 4-5 mm long, as long as spikelet, 7-9-nerved, acute or acuminate; lower lemma 4-5 mm long, 5-7-nerved, broadly convex or flat on back; upper lemma not hardened, 5-nerved; lower palea acuminate; anthers 1.7-2.2 mm long.
