    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Tufted subshrub to 30 cm, russet silky or woolly. Leaves in basal tufts, oblanceolate, margins crenate and revolute, russet silky or woolly beneath, glabrescent above but not discolorous. Flower heads radiate, solitary, subscapose, yellow with mauve-pink rays, ray florets without staminodes.
            sourceIds:
