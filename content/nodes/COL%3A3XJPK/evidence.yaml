            locator: "SANBI/WFO archive Morphology row 12306; source 14177.0; publication: Manning, JC; Goldblatt, P. 2012. Asteraceae: Mairia Nees. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 393 - 394. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: "M. hirsuta can be distinguished by the regularly crenate to dentate leaf margins, the long ray florets (limb 20-29 mm long) and the absence of staminodes in the ray florets. M. hirsuta can be confused with M. robusta, which has similar looking leaves, long ray florets and staminodes absent in ray florets. However, the indumentum on the abaxial leave surfaces of M. hirsuta differs from that of M. robusta: in M. hirsuta, the indumentum is densely to sparsely lanate with the surface visible through the indumentum, appearing whitish scale-like, with shiny, honey-coloured glands, whereas in M. robusta the indumentum of the abaxial leaf surfaces consists of 2 layers of hairs: densely and persistently softly white or pinkish canescent-cobwebby overlaid with longer lanate hairs, the leaf surface not visible through the indumentum, distinctly discolorous. The involucral bracts in M. hirsuta are imbricate with the outer bracts smaller than the inner bracts, but in M. robusta the involucral bracts are more or less equal in size. M. hirsuta can also be confused with M. crenata-see discussion under that species."
