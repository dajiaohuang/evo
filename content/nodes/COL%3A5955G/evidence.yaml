    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, 18-35 cm. Leaves sword-shaped with undulate and crisped margins. Flowers in secund spikes, long-tubed, cream-coloured with red markings, pink on outside, bracts small, obtuse, brown-edged.
            textZh: Tritonia undulata (Burm.f.) Baker 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 6865; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Distinguished in sect. Pectinatae by the plane, lanceolate to sword-shaped leaves with closely crisped and undulate, often ciliate margins. The only other species with crisped leaves and long-tubed flowers, Tritonia tugwelliae from the western Great Karoo, has plane, falcate leaves and uniformly pale bracts, thus evidently not immediately related to the species of sect. Pectinatae in which it was once included. The length of the perianth tube in Tritonia undulata varies widely across its range, with a trend for longer tubes, 60-85 mm long, in populations in the north and west, from the Olifants River Valley along the coast to the Cape Peninsula, and shorter tubes, 22-50 mm, inland and to the south, from Tulbagh to Gordon’s Bay.
            textZh: SANBI 条目提供了 Tritonia undulata (Burm.f.) Baker 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 94805; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
