        usage:
          title: Crotalaria maypurensis Kunth, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrub or suffrutescent herb to 1.5 m tall, stem striate, strigulose. Leaves trifoliolate, the terminal leaflets narrowly elliptic to elliptic, the apex acute, acu- minate or mucronulate, the base cuneate, 4.5-5.5 cm long, 1.1-1.5 cm broad, the margins entire, above glabrous, beneath sparsely strigulose, the veins 8-10 on each side of the midvein, the lateral leaflets similar, but slightly smaller; petiole 3-4 cm long, the stipules absent. Inflorescences terminal, lax racemes bearing up to 20 flowers; bracts linear triangular, 1-2 mm long, caducous; pedicels 5-6 mm long; bracteoles linear, 1 mm long, strigulose, located at the base of the calyx tube, caducous. Flowers yellow, 15-18 mm long; calyx 8-9 mm long, the tube truncate, the lobes about 1.5 times as long as the tube, strigulose; corolla yellow or tinged with violet, 15-18 mm long, the standard 13-14.5 mm long, 14.0-15.5 mm broad, retuse, the wings 13-14 mm long, the claws 2-3 mm long, oblong obovate, oblique, the keel 14-15 mm long, the non-twisted beak prolonged; sta- mens dimorphic, the long anthers 3.3-3.5 mm long, the short anthers 0.7-0.8 mm long; style with a pubescent stigma, curved geniculate, 9.5-12.0 mm long. Le- gume inflated, 2.5-3.1 cm long, strigulose; seeds ca. 20, brown, oblique cordi- form, to 3.0 mm long.
          originalLanguage: en
          sourceField: general
