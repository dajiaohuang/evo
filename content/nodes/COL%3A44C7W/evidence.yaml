    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, 15-30 cm, stem flexed outward above leaf sheath. Leaf solitary, linear, channelled. Flowers yellow or salmon, tepal claws forming a deep cup including the stamens, style branches usually united in lower half.
            textZh: Moraea longistyla (Goldblatt) Goldblatt 的 SANBI 物种条目记载了植株、叶片和花部形态。
            sourceIds:
              - sanbi_13878_0
            locator: Strelitzia 29; archive Morphology row 7402, source 13878.0
            placeTimeScope: Regional species account published 2012; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
          - text: Specialised in subg. Homeria in having the branches of the style almost or entirely suppressed, the style either dividing near the apex of the anthers, with very short branches, 1-2 mm long, or essentially undivided with three apical stigmatic lobes. In other respects the species broadly resembles M. collina and particularly M. minor in the tepal claws forming a narrow cup including the stamens. In M. minor the style divides at or below the midline of the anthers, and the well-developed style branches are fairly broad and at least 3 mm long, bearing distinct crests. The ovary and capsules of M. longistyla are usually well-exserted from the spathes, while those of M. minor are typically enclosed, at least during development, although the ripe capsules are usually exserted. Moraea longistyla and M. minor have complementary distribution ranges, with M. minor always in sandy soils from the Cape Peninsula northward along the west coast into the Olifants River Valley.
            textZh: SANBI 条目提供了 Moraea longistyla (Goldblatt) Goldblatt 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
