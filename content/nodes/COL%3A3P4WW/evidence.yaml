          title: Hyptis atrorubens Poit., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Herbs, slender, prostrate, rooting at the nodes, stems to 3 m long, lightly pubescent. Leaves ovate, acute, crenate-serrate, the bases rounded and attenuate, 2.5-3.5 cm long and 1-1.5 cm wide, sparsely pubescent, resin-dotted; petioles ca 0.5-1.5 cm long, narrowly margined. Inflorescences capitula, axillary, hemis- pheric, 8-10 mm in diam, the peduncles ca 0.5-2.5 cm long, the bracts obovate, 4-.6 mm long, ciliate. Flowers sessile, tufts of hair at the bases; calyx tubular, ca 3.5-4 mm long at maturity, naked within, the teeth acicular to setaceous, ca 1-1.2 mm long, pubescent between; corolla ca 4-5 mm long, white, the lower lip ca 1 mm long, pubescent; stamens shortly exserted, the filaments lightly pubescent, the anthers ca 0.2 mm long; gynobase weakly lobed, the style ca 4-5 mm long, minutely bifid near the tip. Nutlets 4, ovoid-oblong, ca 0.6-0.8 mm long, the pericarp verrucose.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 6603
