        claims:
          - text: "Perennial herb, up to 0.3 m high; not spinescent. Stems erect, slender, several from a woody rootstock, densely leafy; glabrous. Leaves sessile, ± appressed to stem; blade linear, up to 20 x 2 mm, apex acute. Flowers: in few-flowered, terminal or lateral racemes; wings narrowly ovate, 5 mm long, apices acute to acuminate, greenish; petals purplish pink; Oct.-Mar."
