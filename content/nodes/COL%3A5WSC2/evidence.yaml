          - text: Bulbine thomasiae is immediately distinguished by its pendent clusters of soft, fragile, linear-lanceolate to triangular-lanceolate, glaucous leaves and densely flowering racemes. Bulbine cremnophila has similar soft, fragile, glaucous leaves, but that is where the resemblance ends. The dense racemes, secundly arranged flowers, pendent capsules and papillate epidermis of B. thomasiae distinguish it from all other Bulbine species.
