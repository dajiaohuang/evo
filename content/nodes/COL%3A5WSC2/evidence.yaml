    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants short-stemmed, with pendent dividing rosettes forming clusters of up to 8 heads. Rosettes up to 150 mm in length and height, 150 mm diam. Tuber ovoid, up to 20 x 18 mm, tapering slightly towards neck, sparsely covered with few soft fibres. Roofs terete, up to 2 mm diam., grey-brown. Leaves very soft, up to 7, drawn together, pendent or curving downwards, linear-lanceolate to triangular-lanceolate, 80-170 x 14-20(-30) mm; base clasping, with few soft fibres, channelled to flattened above, rounded below, glaucous, becoming reddish pink during dry winters, faintly translucent and striated, covered with short pointed papillae, apex acute, mucronate, base slightly fibrous, margins acute, translucent, minutely ciliate. Inflorescence 250-290 mm long; racemes subcapitate, 40-80 mm long, pointed, densely flowered; flowers secundly arranged; peduncle flattened at base, 4-6 mm diam., lower half biconvex, minutely ciliate, subterete higher up; bracts deltoid-ovate, cymbiform, 4-5 x up to 3 mm, apex acuminate, keel and margins minutely ciliate, clasping. Perianth becoming reflexed, spreading, + 15 mm diam. when fully expanded, stellate. Tepals orange-yellow, slightly channelled and incurved at the tips; outer tepals oblong-obovate, up to 8 x 3 mm; inner tepals ovate-lanceolate, up to 7.5 x 2 mm, obtuse; pedicels 15-20 mm. Stamens up to 6 mm long, bearded in upper quarter; anthers versatile, up to 1 x 0.8 mm. Ovary globose, up to 1.5 mm long. Capsule obovoid, up to 5 x 4 mm, pendent. Seed up to 2 mm diam., black.
