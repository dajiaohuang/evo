        usage:
          title: Isertia hypoleuca Benth., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Trees to 20 m tall, the branches stout, grooved, densely puberulent. Leaves oblong, to 40 cm long, to 27 cm wide, deltoid at the apex, shortly cuspidate, the cusp slender, to 2.5 cm long, often falcate, obtuse, deltoid to cuneate at the base, the costa subplane to prominulous above, slender, prominent, especially proxi- mally beneath, the secondary veins ca. 22, strict, subcoriaceous, discolorous, usually chocolate brown above, grey green, drying grey or tan brown beneath, glabrate above except puberulent on the costa and the veins, densely puberulent beneath; petioles to 0.9 cm long, to 0.4 cm wide, stout, often curved, puberulent, delicately winged on the adaxial side; stipules oblong lanceolate, 1-2 cm long, acute, coriaceous, pubescent marginally. Inflorescences terminal, solitary, pu- berulent, shorter than or as long as the terminal leaves, to 35 cm long, to 15 cm wide, oblong, ovate or subrotund in outline, thyrsiform; peduncles stout, to 7(-8?) cm long, to 0.7 cm wide, lignose, angular, the branches alternate or subverticillate except the lowermost which are often disposed as 2 opposite pairs, stiff, well spaced; bracts and bracteoles minute, widely subulate. Flowers sessile or con- spicuously pedicellate; hypanthium oblong, truncate, 2.0-3.5 mm long, coria- ceous, glabrous, marcescent, the teeth scarcely evident or absent, with small patches of obtuse glands within the cup, corolla white, turning brown to red, the tube narrow cylindrical, to 50 mm long, 2.0-3.5 mm wide at the middle, puber- ulent outside, densely villose within above the middle, coriaceous, the lobes 5, oblong, 9-15 mm long, cucullate, subcoriaceous, villose within below the middle; stamens 6, the anthers oblong, ca. 7.5 mm long, acute, minutely apiculate, dor- sifixed, the surface honeycomb-like, the filaments short, attached a few mm below the mouth; style linear, 25-27 mm long, ca. 0.7 mm wide, ciliolate at the apex; the stigmas 2, erect, oblong, ca. 5.5 mm long, 1.8-2.5 mm wide, the ovary oblong rotund in cross section, the wall thick, replete with reddish glands, the septum thick, 2-loculate, the placentas T-shaped, crassate, the ovules minute. Fruits rotund or oblong, to 1.5 cm in diam., smooth, glabrescent, drying black.
