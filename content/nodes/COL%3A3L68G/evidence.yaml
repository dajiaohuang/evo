        claims:
          - text: Like H. stellaris but leaves to 1 vs. 1-7 mm wide, filament tube 2 vs. < 1.5 mm long and narrowing rather than widening upwards, filaments spreading horizontally from tube rather than spreading upwards.
            textZh: Hessea pusilla Snijman 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13845_0
            locator: "SANBI/WFO archive Morphology row 8756; source identifier 13845.0; cited publication: Snijman, DA. 2012. Amaryllidaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 53 - 62. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Hessea pusilla is the most diminutive species of the genus. Distinguishing features are the narrowly lorate, glabrous leaves (less than 1 mm wide); the widely funnel-shaped, glistening flowers, with slightly recurved uncrisped tepals; and filaments connate basally into a distally narrowed tube reaching to 2 mm above the perigone throat, becoming free and abruptly outspread above. Although sometimes approaching H. stellaris in size, it nevertheless remains distinguishable by androecial characters. In H. stellaris the filament tube is shorter (up to 1.5 mm above the perigone throat) and distally widened, while the free portion of the filament remains erecto-patent at anthesis and only becomes outspread when withering.
            textZh: SANBI 条目提供了 Hessea pusilla Snijman 的鉴别特征。
            sourceIds:
              - sanbi_4232_0
            locator: "SANBI/WFO archive Diagnostic row 44919; source identifier 4232.0; cited publication: Snijman, DA. 1994. Systematics of Hessea, Strumaria and Carpolyza (Amaryllideae:Amaryllidaceae). Contr. Bolus Herb. 16: 2 - 158. [All rights reserved]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
