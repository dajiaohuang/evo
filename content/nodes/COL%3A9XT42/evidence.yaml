        usage:
          title: Castilla tunu Hemsl., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Trees 5-20 m. tall, the young branches densely hirsute with appressed rather dingy-brown hairs, eventually glabrate. Leaves broadly elliptic to oblong-obovate, subcuspidate-acuminate at the tip, obtuse to acuse and very strongly inequilateral at the base, 15-40 cm. long, 7-15 cm. broad, minutely and closely ciliate- denticulate to subentire, membranaceous, appressed-hirsute above and below to glabrate, the petiole about 1 cm. long; stipules 4-5 cm. long. Inflorescences paired or solitary in the upper leaf-axils. Staminate heads conduplicate-reniform, about 2 cm. long and 2.5 cm. broad, sessile or subsessile. Fruiting heads oblate-globose, 2-3 cm. in diameter, quite sessile, the component flowers coherent only toward the base, greenish and nearly dry at maturity.
