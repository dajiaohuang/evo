    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Sprawling succulent shrublet, branched at base with stems to 3 m, with persistent dried leaves. Leaves glaucous green, occasionally with few, scattered, whitish, subtuberculate spots above, spots more numerous and mostly in lower half beneath, lanceolate, to 15 cm long, with 2-4 spines at tip of keel; margins with deltoid, golden-yellow teeth. Racemes capitate, dense, branched, 40-60 cm long. Flowers dull scarlet, ± 40 mm long; stamens and stigma slightly exserted.
            textZh: Aloe distans Haw. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13850_0
            locator: "SANBI/WFO archive Morphology row 9003; source identifier 13850.0; cited publication: Klopper, RR; Smith, GF. 2012. Asphodelaceae: Aloe L. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 66 - 70. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: In some localities where large dense groups of A. distans occur, stems are shorter and the rosettes support each other, but when solitary plants are found, stems lie along the ground and reach 2-3 metres in length, only the terminal 50 cm being foliate and upturned. A. distans is closely related to A. mitriformis but differs in being a smaller plant, with smaller leaves, although similar in pedicels and flowers.
