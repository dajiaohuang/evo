      morphology:
        status: partially-supported
        claims:
          - text: "Perennial herb; flowering stems up to 100 mm high, leafy, lateral; mat-forming, young parts densely clothed in a greyish white silky-woolly indumentum, many dwarf branches. Leaves crowded in basal rosettes; blade spathulate, up to 20(30) x 10 mm, apex rounded, base broad, half-clasping, both surfaces closely greyish white-woolly felted. Heads discoid, subcylindric, 5-6 x 3 mm, many in a subglobose terminal cluster, their bases felted together with grey wool. Involucral bracts in ± 4 series, subequal, very loosely imbricate, ± equalling florets, spreading at top but not radiating, glossy, bright canary-yellow, outermost sometimes brownish, stereome divided. Receptacle epaleate, pit margins slightly produced. Flowers: disc florets 4-6; corolla narrowly funnel-shaped, yellow; Feb.-Apr., Jul., Aug. Fruit with cypsela (and ovary) glabrous. Pappus of many, slightly flattened bristles, tips subplumose, bases cohering lightly by patent cilia."
            sourceIds:
