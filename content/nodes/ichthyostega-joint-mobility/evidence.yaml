  claims:
    - subjectId: event:ichthyostega-joint-mobility
      claimKind: scientific
      claimType: morphology
      statement: A three-dimensional reconstruction and comparative analysis found that Ichthyostega lacked the limb long-axis rotations required for a typical lateral-sequence walk; this may reflect restricted early mobility or a specialization of Ichthyostega itself.
      confidence: medium
      confidenceRationale: Micro-CT reconstruction and explicit comparison with five living analogues quantitatively constrain joint range of motion. Medium confidence preserves modelling assumptions, the difference between feasible motion and observed behaviour, and the authors' alternative that Ichthyostega may be unusual rather than representative of all early tetrapods.
      referenceLinks:
        - relation: supports
          referenceId: pierce-2012-ichthyostega-mobility
          pages: 523–526
          figure: Figures 1–3; Supplementary Figures 1–6
          quoteLocator: Abstract; methods; comparative joint-mobility results; discussion
  claim-rationales.zh:
    - 微 CT 重建与五种现生类比对象的明确比较，定量限定了关节活动范围。中置信度保留建模假设、可行动作与实际行为的差别，以及作者提出的另一可能：Ichthyostega 可能具有特化性，而非代表全部早期四足动物。
  claim-statements.zh:
    - 三维重建和比较分析显示，Ichthyostega 缺少典型侧序步态所需的肢长轴旋转；这可能反映早期活动度受限阶段，也可能是 Ichthyostega 本身的特化。
