          originalSourceText: Coarse vines with few branches; stems and leaves densely yellowish-villous; stems brownish, terete, striate, not fistulose. Leaves opposite; blades broadly ovate to ovate-lanceolate, to 18 cm long and 10 cm wide, the base rounded to cordate, the margins entire or with remote denticulations, the apex acute to narrowly short-acuminate, the surface densely villous with stout hairs, without glandular punctations, pairs of secondary veins prominent near the base and near the basal fourth; petioles rather stout, to 2 cm long. Inflorescence a pyramidal panicle with paniculate branches, the ultimate branches 1-4 mm long, densely hirtellous. Heads 7-9 mm high; subinvolucral bract ovate to obovate, 2.5-4.0 mm long with few to many abaxial hairs; involucral bracts broadly oblong with rounded tips, 3-5 mm long and 1 mm wide, glabrate; corolla whitish or pinkish, 4.5-5.0 mm long, the tube 2 mm long, the limb abruptly broadly campanulate, the lobes triangular, 1.0-1.5 mm long, 0.7-1.0 mm wide, with a few apical hairs; anther appendanges firm, oblong-ovate, 1? times as long as wide; style base slightly thickened, glabrous, the style appendages with only short papillae. Achenes with 5 ribs, 3-4 mm long, with a few long hairs along the costae, the base of achene
