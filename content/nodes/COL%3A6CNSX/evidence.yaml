        usage:
          title: Desmodium macrodesmum (S.F.Blake) Standl. & Steyerm., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Scandent herb to many meters in length, stem terete and ridged and grooved, long uncinulate pubescent and shorter spreading pilose. Leaves trifoliolate, stip- ulate, stipules early deciduous, only the broad scars seen; petioles adaxially sul- cate, angulate, uncinulate puberulent, 2-5 cm long; leaf rachis similar 1-2.5 cm long; stipels narrowly elliptic, long acuminate, striate, ciliate, puberulent on abax- ial surface 3.5 mm long, 0.5 mm wide, early deciduous, few seen; petiolules stouter than the leaf rachis, densely stiff pilose 1.5-4 mm long; leaflets acute, the lateral leaflets somewhat obliquely so, the adaxial surface somewhat lustrous, moderately pilosulous, abaxial surface finely silky tomentose with reticulation prominent, terminal leaflet 5.5-10.6 cm long, 3-8.3 cm wide, lateral leaflets 3.2- 7 cm long, 1.9-4.9 cm wide. Inflorescence of axillary and terminal racemes or developing into much branched panicles; rachis angulate, ridged and grooved, moderately to densely uncinulate pubescent; pedicels in pairs, each pair sub- tended by 1 primary bract, secondary bracts occurring rarely if at all; primary bracts ovate acuminate, striate, puberulent and ciliate, 4.5-6 mm long, 1.5 mm wide; pedicels uncinulate puberulent and somewhat pilose, 2.5-5(-12) mm long. Flowers with the calyx finely puberulent and long stiff pilose, the teeth of both lobes ciliate, also stiffly short pilose at least on the teeth within, the central tooth of the lower lobe 4-5 mm long, the lateral teeth 3.5-4 mm long, the upper lobe semiorbicular, slightly bifid, 3-4 mm long; corolla exceeding the calyx, violet to purple, standard obovate, deeply retuse, remotely clawed at the base, 5.5-6.8 mm long, 4-5 mm wide, the wings trapeziform, obscurely auriculate, unguiculate at the base, 5.5-6.3 mm long, 3-4 mm wide, the keel petals scythe shaped, long unguiculate (ca. 2/3 their length), 5-6.5 mm long, 1.5-2.5 mm wide at apex. Lo- ment stipitate, usually 2-articulate, stipe densely white pilose, 4-7 mm long; ar- ticles almost orbicular, shallowly notched above, the seed slightly above the center, the body of the article flat and papyraceous, reticulate, somewhat pilose on surfaces and velvety to the touch, long spreading pilose on sutures, 2.4-2.9 cm long, 2-2.5 cm wide, the isthmus connecting the 2 articles narrow; seed dark reddish brown, reniform (somewhat immature), 3 mm long, 1.5-2 mm wide.
