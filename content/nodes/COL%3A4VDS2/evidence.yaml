        usage:
          title: Schlegelia nicaraguensis Standl., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: conspicuously so, inconspicuously lepidote (often deciduously) above and be- neath, sparsely puberulous along main veins beneath, otherwise glabrous, plate- shaped glands scattered over the leaf surface beneath, congested at the base of the blade, each gland surrounded by a raised epidermal papilla, drying brown to gray brown, petiole 0.8-1.6 cm long, slightly lepidote, flat-topped, incon- spicuously puberulous along the angles. Inflorescence a few-flowered, axillary fascicle on older branchlets below the leaves, the pedicels puberulous. Flowers with the calyx cupular, truncate to slightly lobed, 1 cm long and 1 cm wide, when fresh violet with white spots, dark brown when dry, lepidote, puberulous mostly near rim and base with immersed plate-shaped glands mostly toward the apex; corolla cream or yellowish at base, the lobes magenta, tubular- campanulate, 3.9-4.7 cm long and 1.1-2.1 cm wide at the mouth, the tube 3.1-3.7 cm long, the lobes 0.5-0.8 cm long, glabrous outside and at the tips inside, lepidote near the middle and base, the pubescence merging into the simple multicellular trichomes of the upper third of the tube, lower part of tube glabrous except for simple gland-tipped trichomes at the level of stamen insertion; stamens didynamous, the anther thecae thick, slightly divergent, 3 mm long and 1.5-2.0 mm wide, longer filaments 2.0-2.2 cm long, shorter fila- ments 1.5-1.7 cm long, staminode 3-5 mm long, inserted 5 mm from base of corolla tube; pistil 0.5-0.7 cm long, the ovary truncately spherical, glabrous, 3 mm long and 3 mm wide, the ovules multiseriate on 2 bifid, stalked, parietal placentae in upper 2/3 of ovary, these fused in the lower third and placentation axile with a single central placenta in each locule; disc thin, sunken into the base of the ovary. Fruit spherical, hard-shelled, glabrous, ca. 4 cm in diameter, subtended by the persistent calyx, the seeds small, angular, 2-3 mm long and 1 mm wide, borne on an incompletely fused septum.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 2270
