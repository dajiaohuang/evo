        claims:
          - text: Plants (200-) 380-810 (-1070) mm tall; leaves usually 2, borne on a sterile shoot, nearly erect to partly spreading, ovate to lanceolate-oblong, acute, 40-320 mm long. Inflorescences slender, dense, (11-) 17-79 (-100) -flowered; bracts lanceolate, 1.3-3.3 times the length of the 8-12 mm long, curved ovary. Flowers pink to deep rose, sometimes yellowish. Sepals and petals fused to the lip for lh their length, curved in the distal 1h; sepals elliptic, 7-10 mm long; petals obovate. Lip spurs 6-19 mm long. Stigma transversely oblong to subquadrate, c. 1 mm long; rostellum often emergent from the galea, oblong, 1-2 mm long, with an appendix.
