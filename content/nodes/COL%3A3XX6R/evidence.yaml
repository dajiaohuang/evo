    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Minutely glandular-hairy annual to 30 cm. Leaves crowded basally, usually toothed. Flowers in racemes or cymules, somewhat bilabiate, tube short and inflated above, lobes rounded, white with a yellow centre.
            sourceIds:
              - sanbi_14436_0
            locator: "SANBI/WFO archive Morphology row 6049; source 14436.0; publication: Manning, JC; Goldblatt, P. 2012. Scrophulariaceae: Manulea L. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 745 - 747. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Manulea minor has been much confused with M. exigua, from which it is easily distinguished by its scapose stems, much less markedly toothed leaves and glandular pubescence. Its relationship seems to lie with M. praeterita, from which it is distinguished by the longer hairs on the stems (up to 0.2-0.3 mm versus 0.1 mm) and leaves (up to c. 0.3-0.4 mm versus 0.25 mm), and the entire corolla lobes (not distinctly lobed).
            textZh: SANBI 条目提供了该种的鉴别特征。
            sourceIds:
