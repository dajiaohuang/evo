        claims:
          - text: Sprawling, glabrescent perennial to 60 cm. Leaves in whorls of 6-8, linear-lanceolate, margins ciliate. Flowers in pairs in axils, anthers well exserted, yellowish.
            sourceIds:
              - sanbi_14394_0
            locator: "SANBI/WFO archive Morphology row 6541; source 14394.0; publication: Manning, JC; Goldblatt, P. 2012. Rubiaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 700 - 704. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: "Var. dregeanum seems to be much rarer than var. mucroniferum. G. mucroniferum and G. subvillosum constitute a very closely related species pair sharing, among others, the following characters: tetraploidy, very pronounced protandry, flowers with stamina nearly as long as the corolla lobes (long, thin filaments), and reduced snyflorescences consisting of few groups of 3 flowers (G. subvillosum) or 2 flowers (G. mucroniferum) on the paracladia. All these characters distinguish this group from the remaining Southern African Galium species. The two species, however, are, in addition to synflorescence differences, easily kept apart by their leaves (short, wide: G. subvillosum vs. long, narrow: G. mucroniferum). They may virtually grow side by side in the field [cf. Puff 760908-6/2 (NU, WU) and -6/3 (WU)], but, according to my field observations, do not hybridize."
            textZh: SANBI 条目提供了该种的鉴别特征。
