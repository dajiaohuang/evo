        usage:
          title: Dicliptera trifurca Oerst., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Herbs, sometimes suffrutescent, to 2 m tall; stems branching, glabrous. Leaves ovate elliptic, to 12 cm long, 4 cm wide, apically acuminate, basally attenuate, glabrous to sparingly puberulous along the costa and the veins beneath, the cystoliths more prominent beneath, the margins undulate; petioles to 3.5 cm long, glabrous to sparingly puberulous along 2 lines. Inflorescences in axillary cymes of 3 flowers each; peduncles to 8 cm long, mostly glabrous; bracts subtend- ing the cymes, leaflike, frequently exceeding the calyx; floral bracts oblong to oblong spatulate, unequal, the larger one to 11 mm long, 2 mm wide, the smaller one to 7 mm long, 1.5 mm wide, both apically rounded and apiculate, glabrous; bractlets oblong lanceolate, to 5 mm long, 1 mm wide, sparingly puberulous; pedicels to 3 mm long, glabrous to sparingly puberulous. Flowers with the calyx 5-merous, 6 mm long, the segments subulate, 4 mm long, 0.6 mm wide, puberulous; corolla red violet or purplish, 3.5-5.5 cm long, puberulous, the tube to 4 cm long, 2 mm broad basally, expanding to 7 mm wide at the mouth, the lips oblong to ca. 1.5 cm long, the upper lip 7 mm wide, apically acute, lower lip 3-lobed, the lobes subequal, ca. 0.75 mm long; stamens exserted to the tip of the upper lip, the filaments sparingly puberulous, the anther cells parallel, ca. 3 mm long, basally apiculate. Capsules stipitate, to 18 mm long, 4 mm wide, 2 mm thick, puberulous; seeds 4, flattened, suborbicular, ca. 4 mm in diameter, papillose.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 34
