    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Long white segments, 2-5 to 3-5 cm, by 6 to 7 mm wide, filaments nearly as long as the segments and with pronounced basal appendages; pubescence on scape, pedicels and ovary; leaves at base 2 mm. wide. These characters give this newly described species a look which is quite distinct from any other Nerine. The scape varies from 14 to 25 cm in length and the pedicels usually number 4, 5 or 6. In a population in which well over a hundred flowers were examined one had only 3 pedicels and one had 9. Pedicel length varied from a bare 0-9 cm up to 3-2 cm. The pedicels are all ascending unlike N. pudica in which some at least tend to be horizontal.
