        status: partially-supported
        claims:
          - text: A spreading, white-woolly shrub sometimes to 1 m, with reflexed, scarcely twisted leaves 3–20 mm long and axillary tufts; discoid heads are fused in dense terminal clusters, five-flowered, with petaloid, usually glandular bracts, the inner ones spreading and pink or white.
