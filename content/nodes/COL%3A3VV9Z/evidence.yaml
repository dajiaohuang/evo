    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Liane or scandent shrub, 2-15 m. high; stems pale green or olive green, 4-lined or subterete and glabrous or slightly puberulous when young, becoming terete and reddish to purple-brown, with numerous lenticels varying in prominence. Leaf-lamina greyish-green to yellowish-green, sometimes ± shining above, concolorous, 3-10(20) x 2-5.5(10) cm, ovate to oblong or elliptic-oblong, rounded to obtuse or obtusely acuminate (rarely acutely acuminate) at the apex, with margin obtusely glandular-denticulate to entire, cuneate to rounded at the base, papyraceous to coriaceous, glabrous, with (5)6-8(9) lateral nerves and reticulate venation varying in density and prominence, equally prominent on both sides; petiole (2)3-7(10) mm long, glabrous; stipules 1.5-2 mm long, linear-lanceolate, entire, pubescent, deciduous, the opposite pairs not united but sometimes connected by ridges. Flowers 3-? in simple axillary dichasial sometimes corymbose cymes with pubescent or glabrescent branches; buds 2-7 mm long, subglobose to elongate-conic; pedicels 1-6 mm long, pubescent; bracts 0.5-1 mm long, triangular, acute, entire, pubescent, persistent. Sepals greenish, pubescent, convex, sometimes rugose outside, c. 1 mm long, subequal, ovate-triangular, obtuse or rounded, free. Petals greenish, 3-6 mm long, lanceolate-triangular, acute or subacute, often with subapical cusp, plane or with ± undulate margin, wholly glabrous or puberulous outside, slightly imbricate in bud. Disk single, ± undulate or 5-lobed, concave (free or united to the petals) or ± convex (i.e. surrounding the ovary) with or without a free margin. Stamens 3, with filaments broad or narrow at the base, glabrous; anthers extrorse, circular, 2-thecous, with orange-red pollen. Ovary glabrous, with style elongated, glabrous; stigmas united; ovules 6-14 per loculus. Mericarps green or brownish-green, 3.5-5.5 x 2.3-3.9 cm, oblong or elliptic to oblanceolate or obovate, rounded or retuse at the apex, glabrous, 6-14-seeded, striate or smooth. Seeds winged, with veins marginal and intramarginal to sub-median, the thickened marginal one surrounding the embryo or not.
