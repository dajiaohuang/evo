          - text: A very variable species which in this concept comprises several taxa with distinct but overlapping distributions. The numerous intermediate forms between these taxa, however, appear to preclude their treatment as subspecies or species, at least until a detailed study is made of the whole group. In our area the specimens from northern and lowland areas tend to have a ± convex disk with a flat or upturned margin (i.e. they agree with H. obtusifolia var. fischerana Loes.), whereas in those from further south and inland the disk tends to be without such a margin (as in var. richardiana (Cambess.) N. Robson); but the other characters said by Wilczek (loc. cit.) to be correlated do not appear to be so in our area. It therefore appears to be impossible to recognise var. fischerana as distinct.
