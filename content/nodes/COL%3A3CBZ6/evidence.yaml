        claims:
          - text: Terrestrial herb, up to 2 m high. Sepals acute to apiculate, slightly shorter than subrotund petals. Midlobe with wavy margins, purple, with 3 mm-tall blades of crests white. Flowers with sepals green, tinged with brownish purple, petals pale purple to white.
