          - text: Eulophia horsfallii may be distinguished from other species of Eulophia in southern Africa by its tall crenulate crest lamellae reaching more than 3 mm high on the midlobe, the rotund to elliptic-oblong petals, the bilobed operculum, and the generally tall scape and leaves.
