      morphology:
        status: partially-supported
        claims:
          - text: Like D. obtusa but flowers white and magenta, spur not longer than broad, and stigma well in front of galea.
            textZh: Disa albomagentea E.G.H.Oliv. & Liltved 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13882_0
            locator: "SANBI/WFO archive Morphology row 9972; source identifier 13882.0; cited publication: Kurzweil, H. 2012. Orchidaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 177 - 197. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: "Distinguished on a number of characters: Flowers white and magenta, not spotted versus purple brown in the rear half and white to cream to green in the front half and variously purple spotted; Flowers noticeably larger than those of D. obtusa subsp. hottentotica and subsp. picta, the galea 7-9 mm long versus 4-7 mm long; Spur 1-1.5 mm long and as long as to broader than long, parallel sided, emarginate, always 2-tubed versus spur variable in shape and length, 0.2-2.2. mm long but distinctly longer than broad, when short then V-shaped, obtuse, straight to strongly decurved, 1-tubed or only slightly 2-tubed; Lower point of attachment of spur to galea indented versus rounded and convex; Rostellum arms prominent, erect, parallel in a U-shaped arrangement, 1 mm long versus divaricate in a V-shaped arrangement and shorter, 0.5-0.6 mm long; Dorsal sepal deeply and narrowly canaliculate forming almost a partition on the inside of the galea versus dorsal sepal shallowly and broadly canaliculate; Lateral sepals more spreading at an angle of 60-80o between lip and sepal versus 45o or less; Galea opening suberect and patent versus galea mostly facing downwards; Stigma positioned in front of the galea versus stigma included in the galea; Raised front margin of stigma purple versus colourless/white; Flowers mildly scented versus pungently scented Plants at first compact and conical with densely packed flowers, the lower whorls just opening, elongating later on with the flowers becoming more spaced versus tightly packed and elongated inflorescences."
            textZh: SANBI 条目提供了 Disa albomagentea E.G.H.Oliv. & Liltved 的鉴别特征。
            sourceIds:
              - sanbi_15030_0
            locator: "SANBI/WFO archive Diagnostic row 76895; source identifier 15030.0; cited publication: Oliver, EGH; Liltved, WR; Bytebier, B. 2011. Disa albomagentea (Orchidaceae), a new species from the Hottentots Holland Mountains in the Cape Floristic Region, South Africa. S. African J. Bot. 77(2): 313 - 318. [https://doi.org/10.1016/j.sajb.2010.08.010]. [Copyright held by the South African Association of Botanists (2011); http://www.sciencedirect.com/science/journal/02546299]. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
