          scope:
            zh: 支持 2014 年修订中相关物种的描述、博物馆材料与名称处理；历史分类不等于当前种群调查。
            en: Supports the relevant 2014 species account, museum material and name treatment; historical taxonomy is not a current population survey.
      - id: irrorata2019
