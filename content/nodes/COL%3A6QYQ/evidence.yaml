          - title
          - url
          - scope
        metadataVariant: 0
        usage:
          scope:
            zh: 比较九个科学收藏的 54 张皮张及毛色变化；作者保留 P. irrorata 与 P. vanzolinii 两组，并把 P. rylandsi、P. pissinattii、P. mittermeieri 处理为 P. irrorata 异名。
            en: Compares pelage across 54 skins from nine scientific collections; the authors retain P. irrorata and P. vanzolinii and treat P. rylandsi, P. pissinattii and P. mittermeieri as synonyms of P. irrorata.
      - id: inusta2024
