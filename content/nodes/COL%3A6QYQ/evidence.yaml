        fields:
          - id
          - title
          - url
          - scope
        metadataVariant: 0
        usage:
          scope:
            zh: 作者重读 Spix 原始描述，讨论 P. inusta 的模式地点、异名关系及 Ucayali/上 Juruá 种群归属；这是分类论证。
            en: The authors reread Spix's original description and discuss the type locality, synonymy and placement of Ucayali/upper Juruá populations; this is a taxonomic argument.
