        usage:
          title: Gibsoniothamnus mirificus A.H.Gentry, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Epiphytic shrub, the twigs stout, angled, drying yellow, hispid pilose with stout, curved or straight tawny many-celled hairs on scarcely elevated, many- celled bases, branches gray, scabridulous but soon glabrescent and becoming subterete. Leaves ovate, elliptical or obovate, often broadly so, apically short acuminate, blunt, basally obtuse or rounded, to 8 cm long, 4 cm wide, the veins impressed above, elevated and contrasting beneath, ca. 3 pinnate veins on each side, strongly ascending and arcuate, the basal pair close to the margin, the loop connected near the margin, some short intermediate veins sometimes present, pilose with long, weak, slender, multicellular hairs overall, sometimes glabrescent except beneath on the major veins, inconspicuously glandular punctate above, more noticeably so beneath; petiole 7-9 mm long, flat or slightly channeled above, hispid pilose with tawny hairs, pinkish (Whieler), usually drying dark. Inflo- rescence terminal, fasciculate or umbellate, sometimes reduced to a solitary flower, the peduncles 3-5 mm long, glabrous or pubescent, persistent, subtended by minute linear to deltoid pubescent bracts; pedicels reddish (Whieler), articu- lating at the base, 10-15 mm long, slender but broadening upwards, hispid pilose with tawny hairs 1-2 mm long. Flower with the calyx merging into the pedicel, pinkish, ca. 3 cm long (including teeth), the teeth narrowly deltoid, ca. 2 mm wide at the base, 2.0-2.5 cm long, continuous with the ribs of the cup, the sinuses obtuse or acute, much broader and subtruncate in fruit, pilose overall with weak whitish hairs 2-3 mm long; corolla tubular, red or pink, 3-4 cm long, slightly curved and slightly contracted in the upper half, the lobes short, rotund, 3 mm long, subequal but forming a definite lip, ciliate but otherwise glabrous outside; androecium and gynoecium not examined. Fruit not seen.
          originalLanguage: en
