    facets:
      morphology:
        status: partially-supported
        claims:
          - text: An evergreen shrub up to about 1 m, arising from a woody base, with deep-green, narrowly lanceolate leaves about 90–120 mm long and generally 3–5 mm wide. Its dark blackish-purple tepals are unusually long (about 55–64 mm); the style is shorter than or nearly as long as the tepals.
            textZh: 常绿灌木，高至约 1 m，基部木质；叶深绿、狭披针形，约长 90–120 mm、宽 3–5 mm。花被片呈深黑紫色，长度约 55–64 mm；花柱短于或近等长于花被片。
            sourceIds:
