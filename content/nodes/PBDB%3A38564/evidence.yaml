      status: available
      uncertainty:
        olderMa: null
        youngerMa: null
        note: This display is limited to the Campanian specimen interval for IGM 100/981, not the full range of Velociraptor; numerical stage conversions follow ICS v2026/06 where applicable.
      evidenceBasis: Feather Quill Knobs in the Dinosaur Velociraptor directly anchors the sampled window; the display does not extrapolate it into a global taxon duration.
      confidence: medium
      claimIds:
