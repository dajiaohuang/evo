        usage:
          title: Jasminum grandiflorum L., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Sprawling shrubs to several m long; branches slender, weak, terete, ridged or grooved, mostly solid. Leaves pinnate, lobed or dissected, mostly 5-7-foliolate, to 8 cm long, 3-6 cm wide; leaflets ovate, apically acute, obtuse or rounded, sometimes mucronulate, basally obtuse, rounded or truncate, glabrate, the mid- vein prominent, the minor venation obscure; petiole 1-4 cm long, glabrous, the rachis sometimes narrowly winged; petiolules short or wanting, basally pubescent in the axil. Inflorescences few-flowered, terminal cymes, the terminal peduncle shorter than those subtending it, sometimes with entire, foliaceous bracts; pe- duncles 1-2 cm long, slender, demarcated from the similar, 5-15 mm long pedicels by minute bractlets. Flowers fragrant; calyx cup 1-3 mm long, glabrous, the lobes linear, glabrate, to 10 mm long; corolla white, drying yellowish, salverform, the tube 15-20 mm long, slender, sometimes curved, the lobes mostly 5, narrow, 15-25 mm long. Fruits not seen.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 8590
          archiveSourceId: 5E050F67-7D8C-47DF-BB28-0C487ED144EF
