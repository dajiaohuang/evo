        usage:
          title: Pavonia oxyphyllaria Donn.Sm., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Herb or shrub up to 1 m high, the stem flexuous, whitish-stellate-puberulus and copiously hispid with up to 4 mm long, mostly simple, fulvous hairs. Leaves very short-petiolate, the petiole stout, up to 9 mm long, densely fulvous-hispid, the stipules subulate; blade generally slightly asymmetrical, narrowly elliptic or nar- rowly oblong-ovate, usually slightly oblique at the base, gradually long-acuminate at the apex, serrate at the margin, up to 17 cm long and 5.5 cm wide, chartaceous, 3(-4)-palminerved, abundantly hispid on both surfaces, the venation prominent beneath. Flowers solitary (or sometimes binate?) in the upper leaf axils, long- pedicellate, the pedicel slender, 2-8.5 cm long, whitish-stellate-puberulus and densely fulvous-hispid; epicalyx of 11-13 bractlets, these distinct, linear-subulate, 15-20 mm long, fulvous-hispid; calyx cupuliform, shortly and broadly dentate, 2.5-4 mm long, stellate-tomentellous and with a few, long setae near the apex; petals obovate-cuneate, 10-12 mm long, white; staminal tube ca 6 mm long, lobu- late, antheriferous below the apex, the filaments very short; style branches exceeding the staminal tube, the stigmas capitate and minutely fimbrillate. Mericarps broadly triquetrous-obovoid, ca 6 mm long and 4-5 mm wide, rigid-chartaceous, the back convex, prominently reticulate, glabrous and with 3 longitudinal ribs, 1 central and 2 marginal, each bearing a long, retrorsely hispidulous awn, the awns apical or nearly so, not proximate, 9-12 mm long; seeds trigonous-reniform, ca 4-4.5 mm long, minutely puberulus.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 7375
