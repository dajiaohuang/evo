    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Coarse, glandular-hairy, softly woody shrub to 1 m, with ridged, spreading branches. Leaves sharply toothed. Flowers in panicles, tube inflated above, lobes rounded, white with yellow tube.
            sourceIds:
              - sanbi_14436_0
            locator: "SANBI/WFO archive Morphology row 6059; source 14436.0; publication: Manning, JC; Goldblatt, P. 2012. Scrophulariaceae: Manulea L. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 745 - 747. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: The salient features of M. rigida are its divaricately spreading branches, often nearly at right angles to the main axis of the panicle, these conspicuously leafy or bracteate, the leaves broad-based and coarsely and irregularly toothed. The whole plant is minutely glandular-puberulous without any development of the coarse, broad-based glandular hairs that give rise to the scabrid projections commonly seen in its allies, though some long eglandular hairs may be present on the lower part of the stem; the basal parts are unknown to me. In M. cephalotes on the other hand, the indumentum is coarser and longer and some hairs become scabrid with age, the leaves are less conspicuously toothed, the bracts much smaller, and the inflorescences generally denser. The flowers of M. rigida may always be white (those of M. cephalotes are yellow to orange-brown).
            textZh: SANBI 条目提供了该种的鉴别特征。
            sourceIds:
