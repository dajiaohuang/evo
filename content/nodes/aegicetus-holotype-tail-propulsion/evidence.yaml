  claims:
    - subjectId: event:aegicetus-holotype-tail-propulsion
      claimKind: scientific
      claimType: event-mechanism
      statement: Aegicetus holotype CGM 60584 records loss of a weight-bearing sacroiliac joint, posterior vertebral elongation and limb reduction; a shift toward mid-body-and-tail propulsion is inferred, not directly observed, and a fluke is not preserved.
      confidence: medium
      confidenceRationale: The associated skeleton provides unusually extensive anatomy, but swimming mode is reconstructed and the paper discloses conflicting evidence for placement immediately around the Bartonian–Priabonian boundary.
      referenceLinks:
        - referenceId: gingerich-2019-aegicetus
          relation: supports
          pages: e0225391
          figure: Figures 2–18 and 22–26
          quoteLocator: Holotype; Geological age; Vertebral column; Swimming mode
        - referenceId: plos-2020-aegicetus-correction
          relation: contextualizes
          pages: e0230596
          figure: Correction notice
          quoteLocator: Corrected table and figure material
  claim-rationales.zh:
    - 关联骨架提供异常丰富的形态信息，但游泳方式是复原结果，且论文公开了巴尔顿期—普里阿邦期界线附近相互冲突的年代证据。
  claim-statements.zh:
    - 盾鲸正模 CGM 60584 记录了承重骶髂关节消失、后段椎骨加长和四肢缩小；向躯干中段与尾部推进转变属于推断，并非直接观察，且未保存尾鳍。
