  claims:
    - subjectId: event:eocene-oligocene-transition
      claimKind: scientific
      claimType: event-mechanism
      statement: Pacific marine records resolve stepwise earliest Oligocene ice growth, while the Hampshire Basin mammal record separates regional turnover, a roughly 350 kyr hiatus and later Asian immigrant appearances; the records are complementary, not proof of one simple causal chain.
      confidence: high
      confidenceRationale: High confidence applies to the independently measured marine and mammal sequences. The wording is deliberately agnostic about a single cause because neither study experimentally attributes all European turnover to glaciation or immigration alone.
      referenceLinks:
        - referenceId: coxall-2005-eot
          relation: supports
          pages: 53–57
          figure: Figures 1–4
          quoteLocator: Pacific isotope and carbonate records; two-step earliest Oligocene ice-growth result
        - referenceId: hooker-2004-grande-coupure
          relation: supports
          pages: 161–172
          figure: Figures 2–4; mammal range chart
          quoteLocator: Results and conclusions distinguish pre-turnover loss, the sequence hiatus and later first Asian-immigrant records
  claim-rationales.zh:
    - 高置信度针对两套独立测量的海洋与哺乳动物序列。措辞刻意不指定单一原因，因为两项研究都未将欧洲全部更替实验性地归因于冰川化或迁入竞争。
  claim-statements.zh:
    - 太平洋海洋记录识别出早渐新世冰量的阶梯式增加；汉普郡盆地哺乳动物记录则区分了区域更替、约 35 万年的沉积间断以及其后亚洲迁入类群的首次记录。两类证据相互补充，但不能证明一条简单的单因果链。
