        usage:
          title: Mendoncia litoralis Leonard, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Suffrutescent vine, young sterns quadrangular, densely strigose, hairs 1-2 mm long. Leaves elliptic to 12 cm long, 6.5 cm wide, apically acuminate often with apiculate tip ca. 1 mm long, basally acute, sparingly strigose to near gla- brous above, hairs mostly along the costa, the hairs with obscure stellate bases, more sparingly strigose beneath with most hairs restricted to the costa, the margins entire; petioles to 2 cm long, densely strigose. Inflorescences axillary, the pedicels borne singly or in pairs, to 2 cm long, densely pilose, the hairs to 2 mm long; bracts elliptic, to 1.8 cm long and 1 cm wide, apiculate, basally acute to rounded, the pilose hairs outside not appressed, to 2 mm long, glabrous inside; calyx entire, glabrous, ca. 1 mm long; corolla purple, oblique to 3 cm long, tube 1.5 cm long, 4 mm wide at base, 7 mm wide at the throat, glabrous outside, puberulous glandular inside at the base of the stamens and at the throat just above the stamens, lobes ca. 5 mm wide and 4.5 mm broad, emarginate, glabrous; the anthers and the upper portion of filaments glandular puberulous; style 1.6 cm long, glabrous. Fruits ovoid, 1.5 cm long, ca. 1 cm wide, glabrous.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 69
