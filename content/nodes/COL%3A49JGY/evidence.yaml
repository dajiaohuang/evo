    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Much-branched, aromatic annual to 50 cm. Leaves bi- to tripinnatisect. Flower heads discoid, many in dense corymbs, yellow.
            sourceIds:
              - sanbi_14187_0
            locator: "SANBI/WFO archive Morphology row 11379; source 14187.0; publication: Manning, JC; Goldblatt, P. 2012. Asteraceae: Oncosiphon Källersjö. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 401 - 401. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Oncosiphon suffruticosus is readily confused with Oncosiphon piluliferus, with which it shares bipinnatisect leaves and glabrous involucral bracts, but is distinguished by the dense, compound corymbs with ?10 heads (solitary or in simple corymbs with ?6 heads in O. piluliferus), smaller campanulate heads, 3-5 mm diam. (larger, hemispherical head, 5-10 mm in diameter, in O. piluliferus), and involucral bracts that are only slightly deflexed and so obscure the receptacle (involucral bracts strongly deflexed, not obscuring the base of the receptacle in O. piluliferus). Occasional hybrids between O. suffruticosus and O. grandiflorus were observed throughout the West Coast where the two species commonly co-occur. The hybrid individuals have intermediately sized (±6 mm diam.), sparsely pilose to pilose heads, in lax simple corymbs (Kolokoto & Magee 3, NBG; Boucher 4073, NBG).
            textZh: SANBI 条目提供了该种的鉴别特征。
            sourceIds:
              - sanbi_18918_0
            locator: "SANBI/WFO archive Diagnostic row 105178; source 18918.0; publication: Kolokoto, R; Magee, AR. 2018. Cape stinkweeds: Taxonomy of Oncosiphon (Anthemideae, Asteraceae). S. African J. Bot. 117: 57 - 70. [https://doi.org/10.1016/j.sajb.2018.04.020]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
