        claims:
          - text: Like D. caespitosa but flowers pale greenish brown with paler centre, < 18 mm diam. and petal margins deflexed only in outer part.
            sourceIds:
              - sanbi_14102_0
            locator: "SANBI/WFO archive Morphology row 9823; source 14102.0; publication: Bruyns, PV. 2012. Apocynaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 331 - 343. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Plants of subsp. pubescens are usually small, with many densely packed, often very small stems which, especially in Namibia and the Richtersveld, are frequently not much more than 15 mm long and even less in diameter. However, they are quite variable and the stems are not uncommonly 30-40 mm or longer on plants in the Kamiesberg, especially if they are sheltered. The flowers of subsp. pubescens are often fairly pale, dull pink-brown rather than the usual chocolate, especially in the northern areas (Namibia and Richtersveld) but towards the south they become darker and more shiny. The annulus shows exactly the same variation in colour found in subsp. caespitosa, from yellowish to speckled with brown to dark brown. The lobes are usually tightly folded but, in a few cases, have been found with broader, deltate bases. This taxon is particularly characterised by the pubescence of the corolla which is covered, at least in the centre and often over the whole surface, with fine hairs.
            textZh: SANBI 条目提供了该种的鉴别特征。
