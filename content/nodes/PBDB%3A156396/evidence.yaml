  claims:
    - subjectId: taxon:triadobatrachus
      claimType: taxonomy
      claimKind: scientific
      statement: Triadobatrachus massinoti is known from the unique holotype MNHN.F.MAE.126 and is treated as a stem salientian, not crown Anura.
      confidence: medium
      confidenceRationale: "Triadobatrachus massinoti: Named material and a published systematic or phylogenetic treatment support this bounded identification. Confidence remains medium because the profile does not turn a sampled placement into direct ancestry or universal consensus."
      referenceLinks:
        - referenceId: ascarrunz-2016-triadobatrachus
          relation: supports
          pages: 201–234, especially 204–228
          figure: Figures 1–11
          quoteLocator: Material; anatomy; trunk evolution; calibration and provenance review
    - subjectId: taxon:triadobatrachus
      claimType: biogeography
      claimKind: scientific
      statement: MNHN.F.MAE.126 comes from Sakamena-equivalent beds near Betsiaka, Madagascar; historical provenance limits finer geographic inference.
      confidence: medium
      confidenceRationale: "Triadobatrachus massinoti: The primary study reports the named locality and horizon directly. Confidence is medium because one study sample cannot establish absence, endemism or a global geographic range."
      referenceLinks:
        - referenceId: ascarrunz-2016-triadobatrachus
          relation: supports
          pages: 201–234, especially 204–228
          figure: Figures 1–11
          quoteLocator: Material; anatomy; trunk evolution; calibration and provenance review
    - subjectId: taxon:triadobatrachus
      claimType: ecology
      claimKind: scientific
      statement: The skeleton does not directly establish diet or habitat preference, and its retained tail and long trunk do not support specialized frog-like jumping.
      confidence: medium
      confidenceRationale: "Triadobatrachus massinoti: The evidence boundary is explicit: depositional or anatomical context is retained while unsupported behaviour and niche claims are withheld. Medium confidence applies to that bounded negative statement, not to a reconstructed ecology."
      referenceLinks:
        - referenceId: ascarrunz-2016-triadobatrachus
          relation: supports
          pages: 201–234, especially 204–228
          figure: Figures 1–11
          quoteLocator: Material; anatomy; trunk evolution; calibration and provenance review
    - subjectId: taxon:triadobatrachus
      claimType: morphology
      claimKind: scientific
      statement: Micro-CT of MNHN.F.MAE.126 reveals fifteen presacrals, retained caudal vertebrae and possible mentomeckelian elements in a stem-salientian body.
      confidence: medium
      confidenceRationale: "Triadobatrachus massinoti: The cited figures and descriptions directly document the named anatomical observations. Confidence is medium rather than universal because preservation and specimen sampling limit character completeness and variation."
      referenceLinks:
        - referenceId: ascarrunz-2016-triadobatrachus
          relation: supports
          pages: 201–234, especially 204–228
          figure: Figures 1–11
          quoteLocator: Material; anatomy; trunk evolution; calibration and provenance review
    - subjectId: taxon:triadobatrachus
      claimType: fossil-range
      claimKind: scientific
      statement: The displayed 251.902–247 Ma interval is a broad Early Triassic envelope for MNHN.F.MAE.126 and is not a crown-frog FAD.
      confidence: medium
      confidenceRationale: "Triadobatrachus massinoti: The primary source and concrete locator support the displayed sample interval. Confidence is medium because the envelope is explicitly specimen- or locality-scoped and not a global first or last appearance."
      referenceLinks:
        - referenceId: ascarrunz-2016-triadobatrachus
          relation: supports
          pages: 201–234, especially 204–228
          figure: Figures 1–11
          quoteLocator: Material; anatomy; trunk evolution; calibration and provenance review
  claim-rationales.zh:
    - Triadobatrachus massinoti：具名材料和已发表的系统或系统发育处理支持这一有限鉴定。置信度保持中等，因为画像不会把取样位置转化为直接祖先或普遍共识。
    - Triadobatrachus massinoti：一手研究直接报告了具名地点与层位。置信度为中等，因为单一研究样本不能确定缺失、特有性或全球地理范围。
    - Triadobatrachus massinoti：证据边界是明确的：保留沉积或解剖背景，同时不填补无依据的行为与生态位。中等置信度针对这一有限的否定性陈述，而非重建生态。
    - Triadobatrachus massinoti：所引图件与描述直接记录了具名解剖观察。由于保存与标本取样限制了性状完整性和变异，置信度为中等而非普遍结论。
    - Triadobatrachus massinoti：一手来源与具体定位符支持显示的样本区间。置信度为中等，因为该包络明确限定于标本或地点，而非全球首现或末现。
  claim-statements.zh:
    - Triadobatrachus massinoti 仅由正模 MNHN.F.MAE.126 所知，被视为无尾类干群而非无尾目冠群。
    - MNHN.F.MAE.126 来自马达加斯加 Betsiaka 附近的 Sakamena 相当地层；历史产地信息限制了更精细的地理推断。
    - 该骨架不能直接确定食性或栖息地偏好，其保留的尾部和长躯干也不支持特化蛙式跳跃。
    - MNHN.F.MAE.126 的微型 CT 揭示了 15 枚荐前椎、保留的尾椎和可能的颏麦氏软骨元素。
    - 显示的 251.902–247 Ma 区间是 MNHN.F.MAE.126 的宽泛早三叠世包络，并非蛙类冠群首现。
