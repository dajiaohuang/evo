  claims:
    - subjectId: taxon:bivalvia
      claimKind: scientific
      claimType: morphology
      statement: Pojetaia shell sections document a laminar inner microstructure in one Cambrian bivalve sample; they do not establish the global Bivalvia first appearance or continuous class range.
      confidence: medium
      confidenceRationale: Shell fabrics are imaged directly, while mineral identity and the taxonomic reach of one genus limit class-wide chronology.
      referenceLinks:
        - referenceId: vendrasco-et-al-2011-pojetaia
          relation: supports
          pages: 825–850
          figure: Figures 1–12; Tables 1–2
          quoteLocator: Pojetaia material; shell microstructure; discussion of foliated aragonite and nacre
    - subjectId: taxon:bivalvia
      claimKind: scientific
      claimType: fossil-range
      statement: The cited Pojetaia shell material comes from probably Botomian Ajax Limestone and lowermost Botomian Erkeket Formation units, supporting a Cambrian Stage 4 study-sample envelope of 514.5–506.5 Ma for this Bivalvia route, not a global class FAD, LAD or continuous duration.
      confidence: medium
      confidenceRationale: The paper directly identifies the sampled units but qualifies one regional correlation as probable. Medium confidence applies only to the conservative Stage 4 envelope and not to the full temporal range of Bivalvia.
      referenceLinks:
        - relation: supports
          referenceId: vendrasco-et-al-2011-pojetaia
          pages: 825–850
          figure: Plate 1
          quoteLocator: "Materials and methods: Ajax Limestone probably Botomian; Erkeket Formation lowermost Botomian"
        - relation: contextualizes
          referenceId: ics-2026-06
          pages: International Chronostratigraphic Chart v2026/06
          figure: Global chronostratigraphic scale
          quoteLocator: Numerical boundaries for the named stages and periods used to bound the source sample
  claim-rationales.zh:
    - 贝壳织构有直接成像，但矿物身份和单一属的分类覆盖限制了纲级年代推断。
    - 论文直接标明取样地层，但把其中一项区域对比限定为“可能”。中等置信度只适用于保守的第 4 期包络，不适用于双壳纲完整年代范围。
  claim-statements.zh:
    - Pojetaia 贝壳切片记录了一例寒武纪双壳类样本的层状内微结构；它不确立双壳纲全球首现或连续纲级范围。
    - 所引 Pojetaia 壳体材料来自“可能为 Botomian”的 Ajax 石灰岩和最下部 Botomian 的 Erkeket 组，因此可为该双壳纲路线提供 5.145–5.065 亿年前的寒武纪第 4 期研究样本包络，而不是该纲的全球首现、末现或连续延限。
