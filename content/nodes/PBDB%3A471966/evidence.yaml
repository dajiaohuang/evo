          pages: 102–107
          figure: Figure 1; Extended Data Figures 2–7
          quoteLocator: Systematic palaeontology; locality and geochronology; phylogenetic analyses and origin discussion
    - subjectId: taxon:funcusvermis
      claimType: biogeography
      claimKind: scientific
      statement: The represented Funcusvermis sample comes from the Thunderstorm Ridge bonebed in the upper Blue Mesa Member of Arizona; one bonebed does not establish global distribution.
      confidence: medium
      confidenceRationale: "Funcusvermis gilmorei: The primary study reports the named locality and horizon directly. Confidence is medium because one study sample cannot establish absence, endemism or a global geographic range."
      referenceLinks:
        - referenceId: kligman-2023-funcusvermis
          relation: supports
          pages: 102–107
          figure: Figure 1; Extended Data Figures 2–7
          quoteLocator: Systematic palaeontology; locality and geochronology; phylogenetic analyses and origin discussion
    - subjectId: taxon:funcusvermis
      claimType: ecology
      claimKind: scientific
      statement: The disarticulated bones permit limited functional inference but do not directly establish diet, burrowing behaviour, locomotor performance or habitat preference.
      confidence: medium
      confidenceRationale: "Funcusvermis gilmorei: The evidence boundary is explicit: depositional or anatomical context is retained while unsupported behaviour and niche claims are withheld. Medium confidence applies to that bounded negative statement, not to a reconstructed ecology."
      referenceLinks:
        - referenceId: kligman-2023-funcusvermis
          relation: supports
          pages: 102–107
          figure: Figure 1; Extended Data Figures 2–7
          quoteLocator: Systematic palaeontology; locality and geochronology; phylogenetic analyses and origin discussion
    - subjectId: taxon:funcusvermis
      claimType: morphology
      claimKind: scientific
      statement: Three-dimensional jaws, vertebrae and femora preserve a character combination used to place Funcusvermis on the caecilian total-group stem.
      confidence: medium
      confidenceRationale: "Funcusvermis gilmorei: The cited figures and descriptions directly document the named anatomical observations. Confidence is medium rather than universal because preservation and specimen sampling limit character completeness and variation."
      referenceLinks:
        - referenceId: kligman-2023-funcusvermis
          relation: supports
