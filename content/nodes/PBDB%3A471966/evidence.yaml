  claim-rationales.zh:
    - Funcusvermis gilmorei：具名材料和已发表的系统或系统发育处理支持这一有限鉴定。置信度保持中等，因为画像不会把取样位置转化为直接祖先或普遍共识。
    - Funcusvermis gilmorei：一手研究直接报告了具名地点与层位。置信度为中等，因为单一研究样本不能确定缺失、特有性或全球地理范围。
    - Funcusvermis gilmorei：证据边界是明确的：保留沉积或解剖背景，同时不填补无依据的行为与生态位。中等置信度针对这一有限的否定性陈述，而非重建生态。
    - Funcusvermis gilmorei：所引图件与描述直接记录了具名解剖观察。由于保存与标本取样限制了性状完整性和变异，置信度为中等而非普遍结论。
    - Funcusvermis gilmorei：一手来源与具体定位符支持显示的样本区间。置信度为中等，因为该包络明确限定于标本或地点，而非全球首现或末现。
  claim-statements.zh:
    - Funcusvermis gilmorei 由至少 76 个个体的孤立构件代表，在分析中位于蚓螈形类干群并处于无足目冠群之外。
    - Funcusvermis 样本来自美国亚利桑那州上 Blue Mesa 段 Thunderstorm Ridge 骨床；一个骨床不能确定全球分布。
    - 离散骨骼只允许有限功能推断，不能直接确定食性、掘穴行为、运动性能或栖息地偏好。
    - 三维保存的颌、椎骨和股骨构成用于将 Funcusvermis 置于蚓螈总群干支的性状组合。
    - 显示的 223.036–218.043 Ma 区间是 U–Pb 约束的诺利期骨床包络，并非无足目冠群或现生两栖类全球首现。
