  claims:
    - subjectId: taxon:funcusvermis
      claimType: taxonomy
      claimKind: scientific
      statement: Funcusvermis gilmorei is represented by isolated elements from at least seventy-six individuals and was recovered as a stem gymnophionomorph outside crown Gymnophiona.
      confidence: medium
      confidenceRationale: "Funcusvermis gilmorei: Named material and a published systematic or phylogenetic treatment support this bounded identification. Confidence remains medium because the profile does not turn a sampled placement into direct ancestry or universal consensus."
      referenceLinks:
        - referenceId: kligman-2023-funcusvermis
