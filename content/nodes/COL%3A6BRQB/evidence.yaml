        usage:
          title: Cupania cinerea Poepp. & Endl., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Trees to ca. 8(-10) m tall; stems terete, conspicuously lenticellate, often flexuose, young stems tomentose, glabrescent. Leaves pinnately 3-7-foliolate; petioles 1-6 cm long, tomentose to glabrescent; petiolules ca. 5 mm long; leaflets obovate, rounded to truncate or emarginate at the apex, acute at the base, 6-17 cm long, 3.5-7 cm wide, glabrate above, usually densely white-tomentose below, the pubescence all directed inward toward centers of the areoles, sometimes the lower surface dark, the pubescence moderately sparse on the reticulate veins, the actual surface then visible, the margins serrate-dentate to conspicuously serrate. Panicles dense, terminal or subterminal, racemose. Flowers white; sepals 5, ovate, tomentose, greenish; petals 5, + obovate, to 2 mm long, clawed, villous, the blade laterally fused to the scale and deeply divided in the middle; stamens ca. 3 mm long, inserted on inner edge of the disc, the filaments villous below the middle; disc fleshy, ca. 0.7 mm high, tomentose; staminate flowers with the stamens ex- serted, 2.5-3 mm long, the ovary abortive, pubescent, lacking a style; bisexual flowers with the stamens 1.5-2 mm long, only slightly exserted, the ovary ovoid, obtusely 3-angulate, with a stout style about as long as the ovary, the style and ovary together ca. 3 mm long, the stigmas 3, recurved, the ovary, style and stigma tomentose. Capsules obovate, rounded to 3-lobed, short-stipitate, ca. 1.5 cm long and 1 cm wide, pale greenish- or brown-tomentose outside, woolly within; seeds oblong, more than 1 cm long, shiny black, the lower half covered with an orange aril.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 12484
          archiveSourceId: ADE5881A-87CA-41EB-9242-B8BD9D17176C
