        usage:
          title: Barbieria pinnata (Pers.) Baill., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Woody wine, twining, trailing, or suberect, branchlets hirsute. Leaves alter- nate, imparipinnate; leaflets (9-)15-21(-23), elliptic with base and apex rounded, the apex mucronate, 1.5-7.0 cm long, 0.6-2.0 cm wide, surface glabrous to pu- bescent with minute scattered hairs above, the midrib hairy above, densely hairy and lighter bene'ath; paired stipels to 4 mm long, narrow; stipules 6-10 mm long, narrow; petiolules 1-3 mm long; petioles 1-4 cm long, hirsute, grooved. Info- rescence racemes, occasionally branched, to 25 cm long; flowers 2-3 from paired stipulelike bracts and a third bract between these on the rachis; pedicels ca. 5 mm long; bracteoles ca. 1 cm long at the base of the hypanthium. Flowers large, to 5.5 cm long, red; hypanthium ca. 3 cm long, 6 mm broad, densely pubescent and with scattered longer hairs, the 5 teeth ca. ?2 as long as the tube, ca. 1 cm long, narrow lanceolate acuminate; petals glabrous, standard to 5.5 cm long, ca. 1.5 cm wide, wedge shaped at the base, clawed, wings and keel petals all ca. 4.5 cm long, abruptly contracted to a claw, keel oblong; staminal column ca. 5 cm long, open above, glabrous; ovary sessile, ca. 7 mm long, terete, silvery pilose, ovules several, the stigma capitate, the style ca. 4 cm long, heavily bearded on upper margin. Fruit linear, ca. 5 cm long, 0.6 cm wide, compressed, pubescent, septate inside and indented on the outside between the seeds, 2 valves coiling in dehiscence; seeds 4-9, small, dark brown or black.
          originalLanguage: en
          sourceField: general
