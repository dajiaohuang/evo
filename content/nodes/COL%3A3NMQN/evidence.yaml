    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Tufted slender perennial 300-600 mm high, lax and rambling; rhizomatous. Leaf blade 50-110 x 2-4 mm. Peduncle 9-30 mm long, raceme exserted from spatheole; raceme bases subequal or the upper somewhat longer (to 1.5 mm), flattened, shortly appendaged; raceme pairs with 6-7 awns. Sessile spikelet 4 mm long; glabrous or with very short white hairs; awn 7-17 mm long; callus oblong or square. Pedicellate spikelet 4.0-4.5 mm long, glabrous or shortly pilose between nerves and margins, awnless or awn up to 1.5 mm long; anther 1.6 mm long.
