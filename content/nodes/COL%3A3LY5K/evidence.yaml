          title: Himatanthus articulatus (Vahl) Woodson, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Trees, to 10 m, ? glabrous. Leaves obovate, acute, obtuse to attenuate basally, to 25 cm long and 9 cm wide, glabrous, firmly membranaceous, lustrous above and dull beneath; petioles ca. 1.5-3 cm long. Inflorescences thyrsiform, regularly branched, terminal. Flowers with the pedicels 3-6 mm long; bracts broadly ovate, abruptly subcaudate-acuminate, 12-18 mm long; calyx-lobes 1-3, unequal, 0.5- 2 mm long on the same flower; corolla-tube ca. 18-20 mm long, pubescent with- in, the lobes obovate-oblong, 22-25 mm long; stamens included, attached near the base of the corolla tube, the anthers ca. 2 mm long. Follicles stout, compressed laterally, ca. 20 cm long; seeds ca. 7 cm long.
