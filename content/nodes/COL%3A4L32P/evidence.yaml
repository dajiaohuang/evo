        claims:
          - text: Glandular-hairy annual to 18 cm. Leaves obscurely toothed. Flowers in terminal heads, cream-coloured to white with yellow patch at base of upper lip, salver-shaped, tube mostly glabrous, 10-17 mm long.
            sourceIds:
              - sanbi_14442_0
            locator: "SANBI/WFO archive Morphology row 5890; source 14442.0; publication: Manning, JC; Goldblatt, P. 2012. Scrophulariaceae: Polycarena Benth. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 752 - 752. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: P. capensis, which is allied to P. batteniana, but usually has the limb coloured yellow (pale on the Cape Peninsula and nearby) and marked with a deeper yellow or orange, bearded star in the mouth (the mouth of the corolla in P. batteniana is glabrous or nearly so, and has an orange-yellow patch only below the posticous lip). The two species are further distinguished by the corolla tube being glabrous or very nearly so in P. batteniana, pubescent in P. capensis, which is always corymbosely branched and very leafy right up to the inflorescence, partly because of the strong development of leafy dwarf axillary shoots; the branching in P. batteniana is more divaricate than corymbose; in other words, the axillary shoots develop into spreading branches. Polycarena batteniana has a more northerly distribution than P. capensis, and grows at higher altitudes.
            textZh: SANBI 条目提供了该种的鉴别特征。
            sourceIds:
