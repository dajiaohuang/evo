          - text: For one subadult female Ateles geoffroyi at Barro Colorado Island, movement-step selection was positively associated with canopy height, distance from canopy gaps using an 8-m vegetation cutoff, and crown thickness. The spider-monkey model had a mean cross-validation Spearman correlation of 0.94; this is an individual-level model result, not a species-wide estimate.
