    facets:
      morphology:
        status: partially-supported
        claims:
          - text: A comparative CT study found smaller nasal-turbinate surface area in 15 Ateles geoffroyi specimens than in eight Alouatta palliata specimens (Dunn post hoc p = 0.0001); the difference persisted after adjustment for skull size. The Ateles specimens' geographic provenance, collection dates and wild/captive status were not reported, so this sample does not establish species-wide anatomical variation.
            sourceIds:
              - melin2022
            locator: Methods §2(c)(i); Results §3(a)(ii), “Sensory anatomy”; Fig. 2b and Fig. S3a. The study measured CT scans from 15 A. geoffroyi, eight A. palliata and two Cebus imitator specimens.
            placeTimeScope: Comparative CT specimen sample identified as Ateles geoffroyi; locality, collection dates and provenance of the 15 specimens are not reported in the article.
            lifeStatus: Museum CT specimens; the study does not report whether the source animals were wild or captive.
            originalLanguage: en
        gaps:
          - Only a comparative nasal-turbinate measure is supported. Specimen provenance and life status, diagnostic morphology, age-sex variation and broader anatomical variation remain unassessed; this sample is not a species-wide survey.
      lifeHistory:
        status: not-assessed
        gaps:
          - Reproduction, development, lifespan and other life-history traits have not been assessed.
      ecology:
        status: partially-supported
        claims:
