    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, 80-150 mm tall, corm with oblique flat base. Leaves linear, thickened in midline. Flowers 3-6 in a flexuous spike, nodding, white to cream, brown or red outside, open at night, then fragrant, perianth tube curving downward, tepals weakly recurving, bract margins united in lower half around the spike axis.
            textZh: Hesperantha decipiens Goldblatt 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_14562_0
            locator: "SANBI/WFO archive Morphology row 33232; source identifier 14562.0; cited publication: Goldblatt, P; Manning, JC. 2013. Iridaceae. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 94 - 124. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Poorly collected and often confused either with the widespread Hesperantha radiata or the related western Karoo species H. marlothii, H. decipiens is distinguished by the few-flowered, flexuose spike with the outer bract margins united around the axis only near the base, and corms without prominent lateral spines. Hesperantha decipiens has the flexuose, few(or several)-flowered spike of H. marlothii but the outer bract margins in that species are united for up to 4 mm, ± a third of their length. The corms in H. marlothii bear prominent lateral spines, whereas those of H. decipiens closely resemble H. radiata in their scalloped, lightly fringed lobes. Close examination of the flowers shows that the style branches of H. decipiens usually exceed the anthers by 1-2 mm and the anthers are 5-7 mm long. Robust specimens of H. marlothii have anthers 6-8 mm long and the style branches reach only to about the middle of the anthers. Less robust specimens have anthers 4.5-6.0 mm long but the style branches are still slightly short of the anther apices. Hesperantha radiata has the outer bract margins united for ± half their length, and a straight spike usually bearing >8 flowers.
            textZh: SANBI 条目提供了 Hesperantha decipiens Goldblatt 的鉴别特征。
