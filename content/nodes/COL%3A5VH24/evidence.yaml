    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Tufted rhizomatous perennial 150-220 mm high; leaves crowded at the base. Leaf blade to 37.5 x 5.6 mm, short, broad, apex blunt. Inflorescence contracted, spike-like, 30-40 mm long. Spikelet 7 mm long; glumes sub-acuminate, glabrous or scabrid on the back, keels smooth or scaberulous; lower glume 5 mm long, 1-nerved, subhyaline; upper glume 7 mm long, 3-nerved, longer than and enfolding the spikelet; lower lemma 5.5 mm long, 5-nerved, light brown, hairs not dense but somewhat shaggy or pilose; anther 2.4 mm long.
            textZh: Anthoxanthum brevifolium Stapf 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_15410_0
            locator: "SANBI/WFO archive Morphology row 84039; source identifier 15410.0; cited publication: Mashau, AC. 2015. Anthoxanthum L. In: L Fish, AC Mashau, MJ Moeaha & MT Nembudani (eds), Identification guide to the southern Africa grasses. An identification manual with keys, descriptions and distributions, Strelitzia 36: 80 - 83. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: This species is known only from the type collection. Except for the very short, broad leaf blades and sub-acuminate glume, this specimen is difficult to distinguish from A. ecklonii, which has glumes acute to acuminate.
