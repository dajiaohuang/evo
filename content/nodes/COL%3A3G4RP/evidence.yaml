            locator: "SANBI/WFO archive Morphology row 7211; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Diagnosed by the linear lower leaf with heavily thickened and raised margins and midrib, and relatively large, dull, trumpet-shaped flowers with upper tepals 37-45 mm long and perianth tube 40-53 mm long. The lowermost bracts are conspicuously attenuate. Similar Gladiolus hyalinus has smaller flowers, the upper tepals 23-30 mm long and the perianth tube 25-36 mm long, with the lower laterals obliquely twisted away from the median. Gladiolus tristis has X-shaped leaves and mostly cream-coloured to yellowish flowers with shorter, acute to obtuse bracts up to 50 mm long.
            textZh: SANBI 条目提供了 Gladiolus liliaceus Houtt. 的鉴别特征。
