    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, 35-70 cm, tunics woody. Leaves linear with thickened margins and midribs, bracts attenuate. Flowers long-tubed, funnel-shaped, brown to russet or beige, turning mauve in the evening and then fragrant.
            textZh: Gladiolus liliaceus Houtt. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
