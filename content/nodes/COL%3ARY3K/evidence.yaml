        usage:
          title: Cavendishia morii Luteyn, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Epiphytic shrub, mature branches and twigs of the new growth terete, striate, glabrous, tan to reddish brown when dry, sometimes glaucous. Leaves oblong, elliptic, ovate elliptic, (7-)10-14(-16) cm long, (3-)4-6 cm wide, basally rounded, obtuse or subtruncate, apically long acuminate or abruptly short acuminate, brown or olive brown when dry, glabrous; 5(7)-plinerved, midrib and lateral nerves slightly impressed above, raised and prominent beneath, the veinlets slightly raised but obscure on both the surfaces; petioles terete, striate, (4-) 7-10 (-14) mm long, 2-2.5 mm diameter, sparsely pilose when young, glabrous at maturity, dark reddish brown. Inflorescence 15-25-flowered; rachis bluntly angled, smooth or slightly striate, glabrous, (2.5-) 7-9 cm long, 2-4 diam- eter at base; floral bracts smooth, glabrous, elliptic, 15-20 mm long, 8-10 mm broad, basally obtuse, apically rounded to obtuse, reddish; pedicels swollen distally, striate, glabrous, 8-10 mm long, 1 mm diameter at anthesis, later length- ening to 17 mm long; bracteoles ovate lanceolate, ca. 1.5 mm long, 0.7 mm broad, apically acute, glandular callose thickened marginally and for the distal '/2. Flowers with the calyx glabrous, ca. 5 mm long, the tube short cylindric, coarsely ribbed, ca. 1.5 mm long, strongly enlarged basally, the limb erect and spreading to slightly campanulate, rugose, ca. 3.5 mm long including the lobes, the lobes broadly triangular to somewhat ovate apiculate, 1 mm long, erect after an- thesis, completely glandular callose thickened, the sinuses obtuse; corolla slightly narrowed at the base and the throat, 18-20 mm long and ca. 4.5 mm in diameter, glabrous, the lobes triangular or oblong, obtuse, ca. 1 mm long, the tips callose thickened; stamens 18.5-19 mm long, the filaments pilose in the distal '/2, al- ternately ca. 2 mm and 4 mm long, the anthers including tubules alternately ca. 18 mm and 16 mm long, the thecae 5.5-6.5 mm long; style ca. 19 mm long. Berry spherical, glabrous, ca. 11-12 mm diameter.
