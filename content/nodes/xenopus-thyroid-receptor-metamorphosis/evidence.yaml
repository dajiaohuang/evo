  claims:
    - subjectId: event:xenopus-thyroid-receptor-metamorphosis
      claimKind: scientific
      claimType: event-mechanism
      statement: "Xenopus tropicalis knockout experiments separate thyroid-receptor subtype effects: TRβ loss delays tail regression and extracellular-matrix degradation, whereas TRα loss advances hindlimb development with a largely normal tail trajectory; the result is model- and organ-specific."
      confidence: high
      confidenceRationale: Controlled knockout comparisons, histology and expression assays directly support subtype-specific effects; high confidence does not extend the result to every amphibian species or organ.
      referenceLinks:
        - relation: supports
          referenceId: nakajima-2018-xenopus-metamorphosis
          pages: 733–743
          figure: Figures 1–6
          quoteLocator: Methods; Results; Discussion
  claim-rationales.zh:
    - 该主张绑定具名标本或明确数据集及一手来源定位；置信度仅适用于所述样本、方法与边界，不外推为全球首次出现、直接祖先或完整类群覆盖。
  claim-statements.zh:
    - 热带爪蟾敲除实验区分了甲状腺激素受体亚型效应：TRβ 缺失延迟尾部退化与细胞外基质降解，而 TRα 缺失使后肢提前发育但尾部轨迹大致正常；结果限于模型与器官。
