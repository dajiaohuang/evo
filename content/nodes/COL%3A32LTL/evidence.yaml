    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Stems of medium thickness to rather stout, yellowish to orange. Flowers 4-6 mm long, wide, pale cream-coloured, in few-flowered cymes on pedicels shorter than flowers, somewhat coriaceous when dried. Calyx cupulate; lobes ovate-orbicular, obtuse, overlapping at base, rather thick and often ± carinate. Corolla campanulate-cylindric; tube longer than ovate-orbicular, obtuse to rounded and often somewhat revolute lobes. Stamens shorter than corolla lobes; filaments ± as long as anthers. Scales triangular or oblong, apex often truncate, edge irregularly and unevenly fringed to almost entire, usually reaching bases of stamens, but sometimes smaller or reduced. Ovary globose; stigmas shorter than ovary, often flattened with convolute edges. Capsule globose, intrastylar aperture large, irregularly circumscissile near base. Seeds 2-4, ovoid, 1.5-3.0 mm long, somewhat attenuate at base, pale yellow-brown or blackish when dry; hilum oblong.
            sourceIds:
