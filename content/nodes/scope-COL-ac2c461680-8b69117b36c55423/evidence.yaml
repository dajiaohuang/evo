    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Across the study's three captive settings, adult zoological and research chimpanzees had greater body mass than African sanctuary chimpanzees in both sexes; sanctuary chimpanzees also had slower estimated growth rates. The cohorts included mixed or unknown subspecies, and care-setting differences cannot be treated as wild-species morphology or as a subspecies comparison.
            textZh: 在该研究比较的三类圈养环境中，动物园和研究机构的成年黑猩猩（雌雄均如此）体重高于非洲野生动物救护中心个体；救护中心个体的估计生长速度也较慢。队列包含不同或未知亚种，照护环境差异不能当作野生全种形态或亚种间比较。
            originalLanguage: en
            sourceIds:
              - curry2023
            locator: Abstract; Results, §3.1.1 Adult body mass and §3.1.2 Growth parameters; Tables 2–3 and Figure 1.
            placeTimeScope: "Three captive cohorts: 298 chimpanzees from African sanctuaries, 1,030 zoological chimpanzees, and 442 research-facility chimpanzees. Adult comparisons were adjusted for age; the research data repository was accessed in November 2020."
            lifeStatus: Captive and sanctuary-housed animals only; no free-ranging wild body-mass cohort is measured in this comparison.
        gaps:
          - The source measures body mass and growth in captive settings only; wild body size, skeletal and external morphology, geographic variation, and subspecies-specific patterns remain unassessed.
      lifeHistory:
        status: partially-supported
        claims:
          - text: Among 36 known-age wild female chimpanzees studied at Gombe National Park, mean age at sexual maturity was 11.5 years (range 8.5–13.9), and mean age at first birth was 14.9 years (range 11.1–22.1). First-birth estimates came from a smaller, censored subset and were likely biased low because non-dispersing females were overrepresented; these are population-specific estimates, not fixed species constants.
            textZh: 在贡贝国家公园研究的 36 只已知年龄野生雌性黑猩猩中，性成熟平均年龄为 11.5 岁（范围 8.5–13.9 岁），首次生育平均年龄为 14.9 岁（范围 11.1–22.1 岁）。首次生育估计来自更小且包含删失记录的子样本；由于未迁出的雌性比例偏高，估计值可能偏低。这些是特定种群的估计，不是全物种固定常数。
            originalLanguage: en
            sourceIds:
              - walker2018
            locator: Abstract; Results, §3 Maturation milestones, Table 2 and Figure 1; Discussion.
            placeTimeScope: Gombe National Park, western Tanzania; known-age wild females followed across long-term community records. The study sample contained 36 females for maturation analysis; first-birth timing was known for fewer animals and includes censored observations.
            lifeStatus: Free-ranging wild females; no captive reproductive cohort or fossil inference is included.
          - text: In a cross-sectional video sample of 70 wild western chimpanzees (Pan troglodytes verus) from three neighboring Taï National Park communities, 1,460 stick-use events were recorded in 135 videos collected from November 2013 to April 2020. The model for stick-insertion grips predicted that the multi-digit grip became predominant at about 5.2 years of age and had a 98% predicted probability of use by age 15. Only three females from one group contributed observations above age 45; this task-specific age pattern does not establish a universal species-wide developmental trajectory or a cognitive cause.
            textZh: 在对 Taï 国家公园三个相邻野生西部黑猩猩群体（Pan troglodytes verus）进行的横断面视频研究中，研究者在 2013 年 11 月至 2020 年 4 月采集的 135 段视频里记录了 70 只个体的 1,460 次棍棒使用事件。棍棒插入动作的模型预测，多指握法约在 5.2 岁成为最常见握法，到 15 岁时预测使用概率为 98%。45 岁以上的数据仅来自一个群体的 3 只雌性；这一特定任务的年龄模式不能证明全物种普遍的发育轨迹或认知成因。
            originalLanguage: en
            sourceIds:
              - malherbe2024
            locator: Abstract; Methods §(b); Results, Development of hand grips, especially model predictions for ages 5.18 and 15 years; Discussion; limitation on observations above 45 years.
            placeTimeScope: Three neighboring communities (North, East, South) of habituated wild western chimpanzees at Taï National Park, Côte d’Ivoire; November 2013–April 2020. The 135 coded videos represented 70 individuals aged 1–54 years and 1,460 stick-use events; age data are cross-sectional, and only three females in one group contributed observations above 45 years.
            lifeStatus: Free-ranging wild Pan troglodytes verus in three Taï communities; no captive, domesticated, or fossil observations are included.
        gaps:
          - The study is one long-term population and focuses on females; male development, interbirth intervals, longevity, and cross-population variation require additional source review.
          - Tool-use ontogeny evidence is cross-sectional and restricted to selected stick-based foraging tasks in three neighboring Taï communities; other populations, tools, tasks, and longitudinal skill development remain unassessed.
      ecology:
        status: partially-supported
        claims:
          - text: At Bossou, Guinea, daily behavioral follows of the local wild P. t. verus community (up to 6 h/day; April 2012–March 2013) found mature forest was the most selected habitat overall. Recorded feeding events in noncultivated habitat occurred more often than expected by chance more than 200 m from cultivated fields and less often than expected within 0–100 m and 101–200 m bands. The authors suggested field-associated risk may influence feeding locations. These results describe one site and community, not species-wide habitat use.
            textZh: 在几内亚 Bossou 对当地野生西部黑猩猩群体的每日行为跟踪（每天至多 6 小时，2012 年 4 月至 2013 年 3 月）发现，成熟森林在总体活动中是选择比例最高的栖地类型。在非耕地栖地记录的取食事件中，距耕地超过 200 米的次数高于随机预期，0–100 米和 101–200 米范围内的次数低于预期。作者提出，与耕地相关的风险可能影响取食地点。这些结果描述的是单一地点和群体，不能代表全物种的栖地利用。
            sourceIds:
              - brysonMorrison2017
            locator: Methods, Behavioral Observations and Feeding Event Locations; Results, Habitat Use and Preferences and Distance of Feeding Events in Noncultivated Habitat Relative to Cultivated Fields and Routes; Table II.
            placeTimeScope: Bossou, Guinea, West Africa; community-level observations from April 2012 to March 2013, with up to six hours of daily follows and 10 adult focal individuals. Distance analyses concern feeding events in noncultivated habitat.
            lifeStatus: Wild Pan troglodytes verus observed in a free-ranging community; no captive or fossil observations are included.
          - text: For stick insertion during natural extractive-foraging events in the Taï sample, models using 1,386 observations from 68 individuals estimated 37% fewer insertion attempts with the full-hand-thumb grip and 31% fewer with the multi-digit grip than with the full-hand grip. The study defines attempt count as an operational proxy for accuracy; no substantial age effect was detected in this measure. This result concerns the sampled stick-insertion task and does not establish broad feeding efficiency or species-wide behavior.
            textZh: 在 Taï 样本的自然觅食棍棒插入事件中，基于 68 只个体的 1,386 条观察所建模型估计：与全手握法相比，全手拇指握法的插入尝试次数少 37%，多指握法少 31%。研究将尝试次数定义为准确性的操作性指标；该指标未显示明显年龄效应。结果仅涉及所采样的棍棒插入任务，不能证明广义取食效率或全物种行为规律。
            originalLanguage: en
            sourceIds:
              - malherbe2024
            locator: Methods §(d), Video coding (number-of-attempts definition); Results, Accuracy of stick insertion depending on hand grip type used; Fig. 3 and Table 5.
            placeTimeScope: Taï National Park, Côte d’Ivoire; 1,386 stick-insertion observations from 68 individuals aged 1–54 years. The outcome is the study-defined number of attempts to insert a stick into a cavity during natural foraging; events without an ascertainable attempt count were excluded.
            lifeStatus: Free-ranging wild Pan troglodytes verus observed during natural stick-based extractive foraging; no captive or domesticated observations are included.
        gaps:
          - This is one community at one site over one year. Other chimpanzee populations and subspecies, range-wide habitat use, and long-term ecological trends remain unassessed.
          - The added behavioral evidence concerns stick insertion in one Taï study system; it does not cover the full ecological repertoire, other subspecies, or population-wide feeding efficiency.
      evolution:
        status: partially-supported
        claims:
          - text: Brand et al. analyzed whole-genome site patterns from 18 central, 19 eastern, 10 Nigeria–Cameroon, and 11 western chimpanzees, alongside bonobos. Their best-fitting model estimated western-to-eastern chimpanzee introgression and placed the shared ancestor of the four sampled chimpanzee lineages at about 987,000 years ago; the authors identify the estimate as model-based and discuss competing histories.
            textZh: Brand 等人分析了 18 只中部、19 只东部、10 只尼日利亚—喀麦隆和 11 只西部黑猩猩的全基因组位点模式，并纳入倭黑猩猩。拟合最佳的模型估计了西部向东部黑猩猩的基因渗入，并将四个受采样黑猩猩谱系的共同祖先时间估为约 987,000 年前；作者说明这是模型估计，并讨论了其他历史模型。
            sourceIds:
              - barrie2022
            locator: Methods, “Genomic Data”; Abstract; Results, “Introgression from Western into Eastern Chimpanzees”; Table 1.
            placeTimeScope: Whole-genome samples from the five extant Pan lineages; dates and introgression proportions are demographic-model estimates with uncertainty, not directly dated specimens.
            lifeStatus: Wild chimpanzee and bonobo genomic samples; no captive or fossil samples in the focal analysis.
        gaps:
          - This is one model-comparison study. Its lineage history has not been reconciled here with later genome-wide analyses, fossil evidence, or every chimpanzee population; no general phylogenetic placement or trait-evolution synthesis is claimed.
      distribution:
        status: partially-supported
        claims:
          - text: The 2016 IUCN assessment described a discontinuous chimpanzee range of more than 2.6 million km² from southern Senegal across the forest belt north of the Congo River to western Tanzania and western Uganda, between about 13°N and 7°S. It described four subspecies ranges; this is the assessment's dated range account, not a current range map.
            textZh: 2016 年 IUCN 评估记载，黑猩猩分布区不连续，面积超过 260 万平方公里，从塞内加尔南部沿刚果河以北的森林带延伸至坦桑尼亚西部和乌干达西部，约介于北纬 13° 至南纬 7°。评估分别描述了四个亚种的分布；这是有明确年代的范围记述，不是当前分布图。
            originalLanguage: en
            sourceIds:
              - humle2016
            locator: Geographic Range, Range Description (assessment PDF p. 2).
            placeTimeScope: Global species assessment, 2016 version with errata published in 2018; mapped range and four-subspecies treatment reflect that assessment version.
            lifeStatus: Geographic range of the extant species; not a captive-distribution inventory or fossil occurrence claim.
        gaps:
          - The range account is an older assessment snapshot; current boundaries, local extirpations, and within-range occupancy have not been reassessed here.
      fossil:
        status: not-assessed
        gaps:
          - No fossil evidence was reviewed or assigned to this species in this revision.
      conservation:
        status: partially-supported
        claims:
          - text: A spatial model estimated 128,760 weaned central chimpanzees (Pan troglodytes troglodytes) in Western Equatorial Africa in 2013 (95% CI 114,208–317,039). The study estimated that 80.7% of this subspecies in the modeled region occurred outside the protected-area network. These are regional model results for one subspecies, not a current abundance or conservation-status estimate for all Pan troglodytes.
            textZh: 一项空间模型估算，2013 年西赤道非洲的中部黑猩猩亚种（Pan troglodytes troglodytes）有 128,760 只已断奶个体（95% 置信区间：114,208–317,039）；研究还估算该模型区域内 80.7% 的该亚种个体位于保护区网络之外。这些是针对一个亚种的区域模型结果，不代表整个 Pan troglodytes 物种的当前数量或保育等级。
            originalLanguage: en
            sourceIds:
              - strindberg2018
            locator: Abstract; Results, Abundance estimates and Table 1; Discussion, protected-area network estimate; Methods, nest surveys and spatial models.
            placeTimeScope: The model estimates 2013 abundance across the central chimpanzee range in Western Equatorial Africa. Survey data came from 59 sites in five countries during 2003–2013; the modeled region also included Angola (Cabinda), where the paper reports no survey data.
            lifeStatus: The estimates concern free-ranging, weaned central chimpanzees inferred from nest-survey data. They do not include captive populations.
          - text: The 2016 IUCN assessment (errata version published in 2018) classified Pan troglodytes as Endangered and expected declines to continue. This is a historical, assessment-version-specific category and rationale; it is not asserted here as the current 2026 Red List status.
            textZh: IUCN 2016 年评估（2018 年发布勘误版）将 Pan troglodytes 列为濒危（Endangered），并预计下降趋势会持续。此处记录的是特定版本的历史评估类别及依据，不将其宣称为 2026 年当前红色名录等级。
            originalLanguage: en
            sourceIds:
              - humle2016
            locator: Assessment Information; assessment record e.T15933A17964454.
            placeTimeScope: Global species-level Red List assessment, version 2016-2; errata version published in 2018. The assessment rationale concerns declines reported for the preceding 20–30 years and projected over the following 30–40 years at publication time.
            lifeStatus: Wild species conservation assessment; no captive population or fossil status is implied.
        gaps:
          - This source covers only the P. t. troglodytes subspecies in one Western Equatorial Africa model and estimates conditions in 2013. It does not establish a current status, a global population estimate for all P. troglodytes subspecies, or an updated IUCN assessment.
          - The IUCN category is a historical 2016 assessment version. A current global assessment, current population trend, and current threat synthesis were not verified in this revision.
