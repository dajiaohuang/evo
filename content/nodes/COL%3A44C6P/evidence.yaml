        claims:
          - text: Cormous geophyte, 40-60 cm. Leaves 2 , linear, trailing, margins inrolled. Flowers dark blue, inner tepals reflexed, opening late afternoon.
            textZh: Moraea hesperantha (Goldblatt) Goldblatt 的 SANBI 物种条目记载了植株、叶片和花部形态。
            sourceIds:
              - sanbi_13878_0
            locator: Strelitzia 29; archive Morphology row 7400, source 13878.0
            placeTimeScope: Regional species account published 2012; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
          - text: "One of the tallest and most robust species of sect. Gynandriris, stems of Moraea hesperantha may reach up to 650 mm high and bear several, short lateral branches. The two long, suberect, channelled leaves trail distally. The dark violet flowers recall those of M. pritzeliana but have suberect inner tepals vs. reflexed in M. pritzeliana, which has characteristically coiled leaves and is a much shorter plant. Moraea hesperantha stands out in particular in being evening blooming: the flowers open at 16:00-16:30, about the time that flowers of M. pritzeliana begin to fade, and the flowers last till well after dark, usually collapsing by 19:30. The evening blooming habit is unique in sect. Gynandriris."
            textZh: SANBI 条目提供了 Moraea hesperantha (Goldblatt) Goldblatt 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: Strelitzia 42; archive Diagnostic row 94195, source 18638.0
            placeTimeScope: Regional species account published 2020; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
