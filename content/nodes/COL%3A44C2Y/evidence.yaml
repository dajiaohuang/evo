    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, 50-100 cm, stem willowy. Leaf solitary, linear, channelled and trailing. Flowers yellow, inner tepals trifid with a short, obliquely twisted, central cusp.
            textZh: Moraea bellendenii (Sweet) N.E.Br. 的 SANBI 物种条目记载了植株、叶片和花部形态。
            sourceIds:
              - sanbi_13878_0
            locator: Strelitzia 29; archive Morphology row 6911, source 13878.0
            placeTimeScope: Regional species account published 2012; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
          - text: Closely allied to Moraea tricuspidata and often difficult to distinguish from it as dry specimens, M. bellendenii is a taller plant often exceeding 1 m in height with yellow flowers darkly spotted in the centre. The flowers have broad outer tepal limbs laxly spreading and curving upward distally, and 3-lobed inner tepals. As in white- to pale creamy yellow-flowered M. tricuspidata, the inner tepals have short, obtuse lateral lobes and a linear central cusp-like lobe that curves inward obliquely. The inner tepals of M. bellendenii are 8-10 mm long, whereas those of M. tricuspidata are 10-12 mm long. The two may also be distinguished by the filaments, 6-7 mm long in M. tricuspidata vs. 3-5 mm in M. bellendenii.
            textZh: SANBI 条目提供了 Moraea bellendenii (Sweet) N.E.Br. 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: Strelitzia 42; archive Diagnostic row 94252, source 18638.0
            placeTimeScope: Regional species account published 2020; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
