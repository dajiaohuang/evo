    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Extensively rhizomatous, geoxylic suffrutex; stems nearly always less than 30 cm tall, exceptionally (only in S Mozambique and Natal) up to 1-2(?5) m tall. Leaf-lamina from 9 x 1.2 to 10.5 x 4 cm, more or less elliptic or oblanceolate-elliptic, usually gradually tapering to the acute (very rarely subacuminate) or subacute apex and base, lower surface whitish; petiole 0.2-0.5 cm long; stipules c. 1.5 x 0.4 cm, papery, caducous. Inflorescence terminal and axillary, up to 6.5 x 4 cm; inflorescence-axes and outside of flowers whitish-tomentose. Receptacle-tube 0.35 cm long. Sepals, petals and stamens 0.2 cm long; staminodes 0.05 cm long. Style 0.3 cm long. Drupe ellipsoid, up to 3 x 2 cm.
            sourceIds:
