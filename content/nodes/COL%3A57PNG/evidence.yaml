    facets:
      morphology:
        status: partially-supported
        claims:
          - text: "Plants up to 1 m high, variable in size and amount of glandular pubescence. Roots many, firm, sometimes slightly fusiform near the tips. Rhizome compact, woody, sometimes forming a very short, woody stem, covered with fibres from old leaf-bases. Leaves many, filiform, linear and keeled or triquetrous 20-40 cm long. 1-5 mm broad, glabrous or minutely glandular pubescent and with some sparse setae in some; with minutely papillate ridges, soft, glabrous, long tapered to the apex, base membranous, tubular, the dorsal nerve bundle persisting as fibres. Inflorescence a divaricately branched raceme, often with unequal accessory branches or vestiges of these in the lower axils, seldom simple through reduction, overtopping the leaves: scape terete, glabrous or sparsely glandular scabrid or with some sparse setae; bracts small, deltoid, subulate; pedicels up to 12 mm long, erect, patent, recurved or contorted in fruit, usually glabrous. Flowers with a spreading perianth, white or pink, dark keeled, maculate with green spots, these occasionally faint, sometimes sparsely glandular outside, segments 1 cm long; filaments scabrid, the same colour as the perianth; ovary verrucose, each wart capped with a rod-like, unicellular gland; with 4-6 anatropous ovules (embedded in a fold of the placenta) in each loculus. Capsule 5 mm globose or obtriangular, with some transverse ridges, constricted below, sparsely to densely covered with simple, elongated, gland-tipped tubercles. Seeds verrucose, grey, ridges winged."
