    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Bulbous geophyte, 5-20 cm. Leaves 2, dry at flowering, suberect, narrowly strap-shaped, channelled, twisted, barred with red near base beneath. Flowers slightly spreading, pink to white, bracts 4-6, pale to dark pink, thin-textured.
            textZh: Haemanthus pumilio Jacq. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13845_0
            locator: "SANBI/WFO archive Morphology row 8787; source identifier 13845.0; cited publication: Snijman, DA. 2012. Amaryllidaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 53 - 62. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Haemanthus pumilio is one of a number of species with pink, slightly spreading inflorescences surrounded by 4-6 thin-textured spathe valves, but it is easily distinguished vegetatively. The bulbs consist of loose, fleshy distichous cream-coloured tunics without accumulated layers of dark brown papery remains. The leaves which are suberect, glabrous, shiny green and slightly barred with red on the abaxial surface, are characteristically narrow (2.5-15 mm across), fleshy and somewhat twisted.
            textZh: SANBI 条目提供了 Haemanthus pumilio Jacq. 的鉴别特征。
