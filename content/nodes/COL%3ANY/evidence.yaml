      rangeKind: global-composite
      taxonomicConcept: Ammonoidea — Permian–Triassic boundary study-sample window
      geographicScope: Middle and Late Permian through Induan ammonoids sampled by McGowan and Smith
      olderMa: 274.4
      youngerMa: 250.8
      status: available
      uncertainty:
        olderMa: null
        youngerMa: null
        note: This Roadian-to-end-Induan envelope is the cited cladistic sample window, not the full Ammonoidea range, a divergence estimate or uninterrupted global occupancy.
      evidenceBasis: The paper directly analyzes Middle–Late Permian and Induan ammonoids across the Permian–Triassic boundary; current ICS boundaries convert that named interval to numerical ages.
      evidenceLevel: literature-synthesized
      confidence: medium
      claimIds:
