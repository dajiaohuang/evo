  claim-rationales.zh:
    - 瓦普塔虾标本系列的分类字段只陈述所引研究与导航范围；不会把矩阵位置、数据库映射或样本相似性改写为直系祖先。
    - 瓦普塔虾标本系列的地理字段限于具名样本或明确模型范围，不外推为全球分布、起源中心或完整扩散路径。
    - 瓦普塔虾标本系列的生态字段区分保存事实与功能推断；未被直接记录的饮食、行为、栖息地偏好和性能均保留不确定性。
    - 瓦普塔虾标本系列的形态字段限于主研究列明的标本、样本或分析，并连接到精确页码、图版或补充材料。
    - 瓦普塔虾标本系列的年代范围是有界的标本、地层或模型投影，不作为全球首现、末现、分化时间或连续谱系时长。
  claim-statements.zh:
    - Waptia fieldensis 有大量标本记录，并被置于有颚类之中；其在泛甲壳类中的具体位置是分析结果，不表示祖先关系。
    - 本档案代表布尔吉斯页岩材料，不据此推断 Waptia 的完整分布。
    - 游泳和摄食方式是根据附肢与大颚推断的；猎物、速度及惯常行为并未被直接观察。
    - 包括 ROMIP 56432 和 ROMIP 64294 在内的超过 1,800 件标本记录了双瓣甲壳、大颚及成列的附肢。
    - 508 Ma 显示点是布尔吉斯页岩样本背景，并非该物种的全球延续时长或泛甲壳类冠群年代。
