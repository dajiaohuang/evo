        usage:
          title: Drymonia lanceolata (Hanst.) C.V.Morton, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Terrestrial herbs or subshrubs; stems quadrangular, succulent to 2 m tall, green, minutely strigillose toward the apex. Leaves opposite, equal in a pair, broadly elliptic, 9.6-34.4 cm long, 4.6-14.4 cm wide, membranous, the apex acuminate, the base cuneate, crenulate, above dark green, sparsely strigose, below lighter green, densely tomentose at the prominent veins, strigose between the veins; petioles elongate, to 14.4 cm long with small stipulelike outgrowths on the stern at the base of the petiole. Inflorescences of 1-3 flowers in a cluster per axil; peduncles lacking; bracts linear, ca. 0.5 cm long, green, strigose; pedicels 1-5 cm long, angled, green strigose. Flowers showy; calyx somewhat oblique, the lobes unequal, the posterior lobe smaller, all lanceolate to ovate, 2.3-4.6 cm long, 0.7-1.7 cm wide near the cordate base, the apex long acuminate, entire, light green, strigose; corolla white outside, yellow inside and on the lobes, oblique in the calyx, the tube with a short spur and curved, 3.5-4.5 cm long, ca. 1 cm wide above the base, slightly broader above, sparsely strigose, the limb 2-lipped, the basal lobe erect, others spreading, the lobes fimbriate; filaments broad at the base above insertion, glabrous, coiled, the anthers oblong, ca. 5 mm long, curved; disc gland suborbicular, fleshy, thick, ca. 2 mm long; ovary and style puberulent, the stigma deeply bilobed, papillate. Capsule ovoid; seeds not seen.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 6272
