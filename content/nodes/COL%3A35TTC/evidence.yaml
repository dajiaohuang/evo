        claims:
          - text: Densely branched, succulent shrub, main branches ascending to erect from a short trunk of ± 10 mm diam., up to 150 x 200 mm. Leaf-pairs dissimilar in shape, papillate, first leaf-pair of a season 4-6 x 4-5 mm, second leaf-pair connate for ± half its length, 7-10 mm long, connate part 3-4 mm diam. Flowers with a cup-shaped structure underneath calyx, sepals 4, petals and filamentous staminodes white. Fruit (5)6(7)-locular.
