        claims:
          - text: Cormous geophyte, 8-15 cm, corms rounded at base with coarse, bent teeth. Basal leaves several. Flowers yellow with brown streaks or blotches.
            textZh: Romulea luteiflora (M.P.de Vos) M.P.de Vos 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 7342; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Very closely related to R. atrandra.
            textZh: SANBI 条目提供了 Romulea luteiflora (M.P.de Vos) M.P.de Vos 的鉴别特征。
            sourceIds:
              - sanbi_12511_0
            locator: "SANBI/WFO archive Diagnostic row 51659; source identifier 12511.0; cited publication: De Vos, MP. 1983. Syringodea, Romulea, Fl. S. Africa 7(2,2): 1 - 76. Botanical Research Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Distinguished from allied species in the series with herbaceous outer bracts with prominent membranous margins by its yellow flowers, sometimes streaked or blotched with brown, and style not exserted above the anthers. Plants from the Roggeveld have thicker, shorter leaves. The fruiting peduncles coil up when ripe Romulea luteoflora may be confused with R. diversiformis but the latter is readily identified by the longer style well exserted beyond the anthers, more numerous (6 to 12) leaves, and preference for marshy soils in seepages and around seasonal pools. It has also been confused with R. monticola from the Bokkeveld Mtns and R. obscura from the Cold Bokkeveld, both of which have the outer bracts less firmly herbaceous below and the inner bracts with finely brown-speckled membranous margins. The fruiting peduncles in Romulea monticola are slender and reddish brown, and remain suberect or are curved in fruit, whereas they are typically thicker in R. obscura and spread widely in fruit. Both species differ from R. luteoflora anatomically in lacking rib marginal veins in the leaves.
            textZh: SANBI 条目提供了 Romulea luteiflora (M.P.de Vos) M.P.de Vos 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 95176; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
