        claims:
          - text: Acaulescent geophyte to 20 cm, bulb shortly beaked with ridged tunics. Leaves trifoliolate, leaflets obcordate. Flowers 3-7 per peduncle, lilac with greenish tube.
            sourceIds:
              - sanbi_14370_0
            locator: "SANBI/WFO archive Morphology row 7733; source 14370.0; publication: Bayer, B. 2012. Oxalidaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 633 - 640. South African National Biodiversity Institute, Pretoria. [CC BY]"
