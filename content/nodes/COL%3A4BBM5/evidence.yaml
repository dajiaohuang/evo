            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Closely resembling O. caprina, L., but more robust. It differs in having a much larger pale bulb with longitudinally ridged tunics, narrower petals and sepals, the latter with much longer apical calli and the capsule, with only 2-4 ovules in each chamber, is not exserted.
