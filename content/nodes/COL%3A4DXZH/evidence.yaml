            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Passerina comosa and P. quadrifaria both have abaxially hairy bracts and are easily confused. However, these two species are geographically segregated, with P. comosa considered as a ‘north-western endemic’ of the Cape flora (Weimarck 1941), whereas P. quadrifaria is endemic to the Karoo Mountain and Southeastern Centres. Morphologically P. comosa is less robust, internodes are longer, leaves adhere closely to the stem and are generally more hairy and the bracts often have extended wings that are abaxially setose to villous.
