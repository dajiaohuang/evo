        claims:
          - text: Willowy shrublet, branches often pubescent. Leaves linear, softly hairy beneath with apical tuft, 3 mm long, bracts broadly ovate, hairy beneath, larger. Flowers in spikes, tube 3 mm long, neck 1 mm long. Fruits dry.
            sourceIds:
