    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants 25-45 mm high, including flowers. Corm ovoid, asymmetric with an oblique flat side below, extending downward shortly, 4-7 mm diam.; tunics brown, concentric. Stem single or 2 or 3 produced from base, partly or entirely concealed by leaf bases. Leaves usually 4, basal, coiled or twisted distally, uppermost sometimes straight and usually sheathing part or all of stem, 0.5-2.0 mm wide, margins and main vein lightly thickened. Spike 1-flowered; bracts 10-13 mm long, membranous, pale green flushed purple above, inner slightly shorter than outer. Flowers actinomorphic, shallowly cup-shaped, purple to deep pink with white heart-shaped markings at tepal bases edged with dark red-purple, throat and tube pale yellow; perianth tube funnel-shaped, 4-5 mm long; tepals broadly ovate, 13-15 x 8-10 mm, outer wider than inner. Filaments erect, equal, ± 4 mm long; anthers 5-6 mm long, yellow. Style 6-7 mm long, dividing near base of anthers; branches ± 5 mm long, laxly spreading.
            textZh: Geissorhiza spiralis (Burch.) de Vos ex Goldblatt 的 SANBI 物种条目记录了形态特征。
