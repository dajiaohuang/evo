            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Distinguished by its four (rarely three) twisted leaves, solitary-flowered spikes, and style dividing opposite the base of the anthers. These features are also characteristic of G. corrugata, which has bright yellow flowers with a perisanth tube ± 3 mm long whereas G. spiralis has purple to deep pink flowers marked white and red-purple at the base of the tepals and a perianth tube 4-5 mm long.
