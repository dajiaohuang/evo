    facets:
      morphology:
        status: not-assessed
      lifeHistory:
        status: not-assessed
      ecology:
        status: partially-supported
        claims:
          - text: Across 75 prey-presentation trials involving 22 adult rescued greater slow lorises, the study recorded brachial-gland licking five times; four observations occurred during grooming. In the only non-grooming instance, a male approached a caterpillar, withdrew to a perch, and licked its brachial gland without attempting to capture the caterpillar. This describes one captive rescue-center sample and experimental setting and does not establish how wild slow lorises use venom during prey capture.
            sourceIds:
              - fuller2024slowlorisvenom
            locator: Results §3.2, first paragraph, and Figure 2/caption for the five observations, grooming context, and caterpillar trial; Methods §§2.1 and 2.3 for the study subjects and 75 prey-presentation trials; limitations in Methods §2.3 and Discussion §4.1.
            placeTimeScope: Cikananga Wildlife Center (PPSC), West Java, Indonesia; 22 adults (11 male, 11 female) admitted in October 2013 after wild capture and confiscation; 75 home-cage prey trials conducted February-April 2014. Hunger was not controlled and the trials were not field observations.
            lifeStatus: Originally wild-caught, confiscated adults housed in a wildlife rescue center during artificial home-cage trials; this is not evidence of free-ranging behavior.
            originalLanguage: en
        gaps:
          - The claim describes rescued adults in one center and an artificial prey-presentation setup, not natural prey capture in the wild.
          - The authors note limitations affecting motivation and prey behavior; the observations do not establish the general function of venom use across populations.
          - Morphology, life history, evolution, distribution, fossils, conservation, systematic evidence search, remain unassessed.
      evolution:
        status: not-assessed
      distribution:
        status: not-assessed
      fossil:
        status: not-assessed
      conservation:
        status: not-assessed
