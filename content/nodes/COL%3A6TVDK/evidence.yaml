    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Like S. scullyi but flowers white to pink, style branches short and broad, ovary broadly top-shaped.
            textZh: Pauridia etesionamibensis (U.Müll.-Doblies, Mark.Ackermann, Weigend & D.Müll.-Doblies) Snijman & Kocyan 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_14561_0
            locator: "SANBI/WFO archive Morphology row 33016; source identifier 14561.0; cited publication: Snijman, DA. 2013. Hypoxidaceae. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 92 - 94. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Pauridia etesionamibensis can be recognized by the delicate, often flaccid leaves and the two-flowered inflorescence with two lanceolate bracts which are similar in texture to the leaves. The white or pink flowers are distinguished by a contrasting orange-yellow eye or dark pink central ring and an ovary with a raised, minutely papillate apical dome that bears both stamen whorls a short distance from the tepals. The corm is covered by brown, unusually fine, herringbone-patterned fibrous tunics that separate from the old, disc-like corms which remain temporarily attached at the base.
            textZh: SANBI 条目提供了 Pauridia etesionamibensis (U.Müll.-Doblies, Mark.Ackermann, Weigend & D.Müll.-Doblies) Snijman & Kocyan 的鉴别特征。
            sourceIds:
              - sanbi_15172_0
            locator: "SANBI/WFO archive Diagnostic row 58353; source identifier 15172.0; cited publication: Snijman, DA. 2014. A taxonomic revision of the genus Pauridia (Hypoxidaceae) in southern Africa. Phytotaxa 182(1): 1 - 114. [All rights reserved]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
