    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Stemless, cormous geophyte, mostly 80-100 mm tall, stem branched below ground. Leaves crowded basally, abruptly truncate, finely hairy, exceeding the flowers. Flowers 5 or 6 in a dense decumbent spike, violet with white nectar guides, perianth tube elongate, slender, straight, 40-60 mm long, tepals subequal, spreading horizontally, bracts green, minutely hairy, inner forked apically.
            textZh: Babiana praemorsa Goldblatt & J.C.Manning 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_14562_0
            locator: "SANBI/WFO archive Morphology row 33027; source identifier 14562.0; cited publication: Goldblatt, P; Manning, JC. 2013. Iridaceae. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 94 - 124. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: One of five species of Babiana with abruptly truncate, wedge-shaped leaves, B. praemorsa is recognised by its flowers with a straight, cylindric perianth tube 40-60 mm long and firm, narrow, spreading tepals, 18-22 mm long. The perianth is deep violet rather than blue as in the apparently related long-tubed B. pubescens of the central Namaqualand. Babiana praemorsa can be distinguished from it and B. cuneata, the other long-tubed species with wedge-shaped leaves, by its short filaments, 8-9 mm long, exserted 4-5 mm from the perianth tube, tepals spreading at right angles from the nearly straight tube of uniform diameter, and short style branches ± 3 mm long.
            textZh: SANBI 条目提供了 Babiana praemorsa Goldblatt & J.C.Manning 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 94917; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
