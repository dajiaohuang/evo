        usage:
          scope:
            en: Combines field counts, drone and satellite imagery, and historical records to compile 398 sites; estimates 3.42 million breeding pairs across 375 extant colonies. Trend comparisons remain unavailable for about 35% of colonies, and the estimate mixes survey dates and precision levels.
            zh: 综合地面计数、无人机与卫星影像及历史记录，整理 398 个地点；估计 375 个现存繁殖群共有 342 万对。约 35% 的繁殖群缺少可用趋势比较，估值的调查年份与精度并不一致。
          license: CC BY 4.0
          licenseEvidenceLocator: Article copyright and licence statement specifies Creative Commons Attribution 4.0 International.
          licenseAppliesTo: Article text; no figures or third-party materials are reused.
          licenseUrl: https://creativecommons.org/licenses/by/4.0/
          licenseAssessment: item-level-verified
          attribution: Strycker, N. et al. (2020), A global population assessment of the Chinstrap penguin (Pygoscelis antarctica), https://doi.org/10.1038/s41598-020-76479-3
