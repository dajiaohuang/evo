        usage:
          title: Hippocratea volubilis L., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Liana up to 25 m. long, the young parts densely and minutely brown-tomen- tellous-papillate, the branches often stout, terete, subterete or distally quadrangular, inconspicuously lenticellate. Leaves with the petiole slender, canaliculate or narrowly winged distally, 4-10 mm. long; blade ovate to elliptic or oblong- elliptic, rounded or acute at the base, rounded or obtusely cuspidate or short- acuminate at the apex, subentire, crenate or serrate at the margins, 4-17 cm. long and 2-8 cm. wide, chartaceous or rarely thin-coriaceous, the costa slightly or sharply elevated above, prominent beneath. Inflorescences 3-15 cm. long, the axes densely and minutely brown-tomentellous-papillate. Flowers 4-8 mm. in diam., the pedicel slender, 1-3 mrm. long, tomentellous-papillate, the bracteoles about 0.5 mm. long and caducous; sepals broadly ovate to deltoid, rounded, obtuse or obscurely apiculate at the apex, erose or irregularly ciliolate at the margins, 0.5-1.2 mm. long and 0.6-1.4 mm. broad, papyraceous, minutely tomentellous-papillate; petals oblong or elliptic-oblong, subacute at the apex, minutely ciliolate at the margins, 2.5-4 mm. long and 1.3-2.6 mm. broad, minutely tomentellous-papillate especially out- side, transversely barbellate inside about 1 mm. below the apex; disc 0.8-1.7 mm. high, often subpentagonous and sometimes expanded at the base; filaments ligulate, broadly expanded and often contiguous at the base, membranous or submem- branous, sometimes minutely puberulus; anthers about 0.3-0.5 mm. long and 0.5-0.7 mm. broad; ovary about 1 mm. in diam., the style 0.8-1.3 mm. long. Mericarps obovate-elliptic or narrowly elliptic, obtuse and slightly swollen at the base, rounded or emarginate at the apex, subacute and entire at the margins, 4-8 cm. long, 1.5-5 cm. broad and 2-4 mm. thick before delhisccnce, the pericarp usually densely and finely flabellate-costate without, smooth within; seeds with the embry- oniferous portion obliquely ellipsoid, 13-25 mm. long and 4-7 mm. broad, the wing obovate-oblong, slightly falcate, 2-4 cm. long and 1-1.5 cm. wide.
