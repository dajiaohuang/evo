    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Perennial, tufted, up to 0.9 m high, growing in a tangled mass. Leaves spreading and reflexed, leaf blades up to 500 mm long (light green); 4 mm wide. Spikelets 4-7 mm long. Panicle open, up to 140 mm long; spikelets with a whorl of hairs at base; glumes and lower lemma bright brown and tips transparent; female-fertile lemma with 2 conspicuous tufts of white hairs, side awns 2-3 mm long, central awns slender, 4-7 mm long.
            textZh: Trichopteryx dregeana Nees 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_11118_0
            locator: "SANBI/WFO archive Morphology row 3838; source identifier 11118.0; cited publication: Herman, PPJ; Retief, E. 1997. Plants of the northern provinces of South Africa: Keys and diagnostic characters. Strelitzia 6: 1 - 681. National Botanical Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Habit similar to Eragrostis volkensii, which can be distinguished vegetatively by the blades being blue-green, wider (up to 8 mm) and stiff.
