            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Very similar to Gladiolus woodii and co-occurring with it at the type locality but taller, 550-700 mm high, with sparsely villous or glabrous lower leaf sheaths and slightly larger, blue-mauve flowers with the upper tepals 28-30 mm long. The tunics accumulate in a mass around the stem base. Gladiolus woodii is usually less than 500 mm tall, often with more densely villous leaves, and smaller, lilac, yellow or brownish flowers with the upper tepals 17-27 mm long. The corm tunics do not accumulate.
