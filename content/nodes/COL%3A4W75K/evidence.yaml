        claims:
          - text: Plant dioecious, dwarf, rhizomatous, evergreen shrublet, 10-20 cm high; shoots arising from subterranean woody branches of a central swollen axis; aerial branches chestnut brown, glabrous to pubescent on young shoots, lenticellate, bark sometimes peeling, leaves crowded, trifoliolate, petiolate; petiole glabrous, convex below, shallowly canaliculate above, 2-7 mm long; leaflets sessile, coriaceous, glabrous, concolorous, grey-green, amphistomatous; lamina linear to lanceolate, occasionally oblanceolate, base narrowly cuneate, apex acuminate, prominently cuspidate; margin entire, thickened, pale cream, venation simple craspedodromous, midrib prominent above and below, secondaries prominent below, 6-8 per cm; terminal leaflets 16-47 mm long, 1-3.5 mm wide, lateral leaflets 14-42 mm long, 1-3 mm wide. inflorescence axillary, much reduced, cymose, up to 10 flowers in males, up to 6 flowers in females, flowers pedicellate, bracteolate, 5-merous, unisexual, discoid; calyx segments free, imbricate, glabrous, grey-green, ovate, 1 mm long, 0.5 mm wide; corolla segments free, imbricate, glabrous, yellowish-green, narrowly ovate, 2 mm long, 1 mm wide; disc patelliform, 10-crenate; male flowers with 5 interpetalous stamens, filaments linear, anthers introrse, dorsifixed, 2-thecate, pistillode conical; female flowers with 5 short staminodes, ovary oblique to subglobose, styles 3, very short, persistent, stigmas minutely capitate, fruit asymmetric, slightly compressed, glabrous drupe, red above, green below when fresh, brown, wrinkled when dry, 7 mm wide, 4 mm thick, styles remaining as 3 minute tubercles.
