        claims:
          - text: Sprawling, single-stemmed shrublet to 0.7 x 1 m. Leaves lanceolate to elliptic. Flower heads solitary, white to cream-coloured, 10-15 mm diam., involucral leaves usually becoming brown and papery.
            sourceIds:
              - sanbi_14383_0
            locator: "SANBI/WFO archive Morphology row 5661; source 14383.0; publication: Manning, JC; Goldblatt, P. 2012. Proteaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 657 - 681. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: This species is closely allied to D. divaricata ssp. montana but may be distinguished from that species by its suberect to erect growth habit and the creamy-white colour of the styles and perianths. Although their distribution ranges are almost contiguous no hybridization appears to take place between the two taxa. In some populations of D. fraterna the involucral bracts are particularly distinctive, becoming brown and papyraceous with age.
            textZh: SANBI 条目提供了该种的鉴别特征。
