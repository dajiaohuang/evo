    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Small annual, forming loose tufts. Leaves distichous, 2-6(-14) cm. long, 1-1.5 mm. wide, glabrous, rugulose, apex solid, acuminate to aristate. Peduncle 8-20(-30) cm. long, 0.5 mm. in diameter, rugulose, 2-winged, particularly toward the apex; spike subglobose, ± 3 mm. in diameter; lowest bracts broadly elliptic, 1.3 mm. long, 1 mm. wide; sterile bracts broadly spathulate, ±1.8 mm. long, 1.3 mm. wide, apiculate, smooth, vinous-red to reddish-brown; fertile bracts broadly elliptic, ± 2.7 mm. long, 2.4 mm. wide, keeled, pale red-brown with a darker keel, smooth, apiculate. Lateral sepals arcuate, folded, pale brown, 2.2 mm. long, 0.5 mm. wide, apiculate, keel smooth; corolla-tube 2 mm. long, lobes suborbicular, ±1.8 mm. in diameter. Stamens 0.8 mm. long; filament 0.4 mm. long; anthers 0.4 mm. long, divergent at the base; staminodes bifurcate, ± 0.5 mm. long. Ovary obovoid, 1.5 mm. long; style 1 mm. long, branches 1 mm. long; stigma branches recurved. Seeds ellipsoid, 0.3 mm. long, 0.15 mm. in diameter, with 12-14 longitudinal ridges.
