          - text: Erectum glabrum, diffuse ramosum, ca. 20 cm. altum; rami saepe 15-20 cm. longi, ad 3 mm. diam., internodiis saepe 1-1.5 cm. longis, cuticula canescente, demum polita pallideque brunnea; ramuli hornotini 4-6-foliati, cum flore 2-3.5 cm. longi, internodiis vaginalis; folia superne carinata compressaque, lat. visa oblique truncata, apiculata, apice carinae et rarius marginibus minute 1-2-denticulata, glauce viridia, punctis sat magnis, leviter prominentibus, 5-9 mm. longa sine vagina quasi ad 4 mm., 2-3 mm. lata diametroque, linea impressa ad 2 mm. longa; pedunculus saepius ad 8 mm. longus; receptaculum cum apice pedunculi clavatum, 4 mm. longum, ad 4 mm. diam.; sepala 5, acuta vel acuminata, 4-5 mm. longa, basi 2-3 mm. lata, exteriora 2 superne compressa carinataque, prope apicem minute 1-denticulata, mar ginibus 3 amplis; petala 3-seriata, exteriora saepius obtusa, interne vix angustata, purpureo rosea, ad 7 mm. longa, ad 0.75 mm. lata, interiora pauca, intima pallida, in staminodia transeuntia interdumque eis breviora; staminodia acuminata, stamina parum superantia, pallide rosea; filamenta mox erecta, ad 5 mm. longa, intima parum snpra basin papillata, polline aureo; ovarii lobi leviter compressi, obtusi approximati, per 0.75 mm. elevati, discum attingentes; stigmata 5, gracilia, apice breviter caudata, 5 mm. longa.
