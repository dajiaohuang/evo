        claims:
          - text: Delicate, erect or decumbent, greyish white-woolly, annual herb, 0.05-0.12 m high or long. Leaves alternate, oblanceolate or narrowly spathulate, decreasing in size upwards, entire. Capitula disciform, in small glomerules terminating the branchlets; involucral bracts in ± 3 rows, pale buff-coloured. Female florets filiform, outnumbering disc florets, whitish. Disc florets bisexual, whitish. Flowering time Dec. Pappus of many barbellate bristles in 1 row, bases fused in a smooth ring. Cypselae small, oblong, minutely hairy.
