          quoteLocator: Holotype; Osteohistology; Body mass; Quadrupedality analyses
  claim-rationales.zh:
    - 具名不完整骨架和组织学是直接输入，而年龄、体重与四足性依赖生长线、尺度回归及比较肢骨指标。
  claim-statements.zh:
    - 正模 BP/1/7120 是一件不完整颅后骨架，肢骨组织学指示成年；基于骨围的模型估计约 12 吨并支持习惯性四足行走，尽管四肢弯曲而非柱状；体重与姿态均为比较模型输出。
