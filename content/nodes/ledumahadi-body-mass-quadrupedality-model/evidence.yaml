    - subjectId: event:ledumahadi-body-mass-quadrupedality-model
      claimKind: scientific
      claimType: morphology
      statement: Holotype BP/1/7120 is a partial postcranial skeleton whose limb histology indicates an adult and whose circumference-based model estimates about 12 tonnes with habitual quadrupedality despite flexed, non-columnar limbs; mass and posture are comparative model outputs.
      confidence: medium
      confidenceRationale: The named partial skeleton and histology are direct inputs, while age, body mass and quadrupedality depend on growth marks, scaling regressions and comparative limb metrics.
