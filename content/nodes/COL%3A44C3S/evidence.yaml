            placeTimeScope: Regional species account published 2017; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
          - text: Among the smallest of the southern Africa species of subg. Grandiflorae, Moraea carnea stands no more than 500 mm high. It is also the only pink- to creamy pink-flowered species of the subgenus and is also unusual in having darker pink to purple style crests and sometimes darker inner tepals. Moraea ardesiaca is a larger plant up to 700 mm tall with larger, slate-blue to blue-mauve flowers. The two species also differ in relative anther length, shorter than the filaments in M. carnea but longer than the filaments in M. ardesiaca.
            textZh: SANBI 条目提供了 Moraea carnea Goldblatt 的鉴别特征。
