      morphology:
        status: partially-supported
        claims:
          - text: "Cormous geophyte, up to 0.5 m high; cataphylls of mature plants brown to black, entire or irregularly broken, but not forming rigid vertical bristles. Leaf solitary; 3-6 mm wide, channelled. Flowers: style crests deep pink; perianth with outer segments up to 60 mm long, inner segments entire with an expanded blade, cream-coloured, veined and flushed purple to pale red-brown; Nov., Dec."
            textZh: Moraea carnea Goldblatt 的 SANBI 物种条目记载了植株、叶片和花部形态。
