          originalSourceText: Shrub or small tree, 2-3 (-6) m. tall, with slender pubescent branchlets 1-1.5 mm. in diameter below the inflorescence; hairs of two types, those of the young foliage and branchlets yellowish, appressed or erect, straight and slender, pointed, multicellular, 0.5-1.5 mm. long, these also abundant in the inflorescence but there mixed with tiny erect white hairs mostly 0.2-0.3 mm. long. Leaves elliptic to oblong, lanceolate, or ovate, glabrate, only a few long yellow hairs persistent on the veins (at least of the lower surface), a few of the hairs with papillose bases; blades subcoriaceous,'lustrous, 1.5-4 cm. wide, 3-8 cm. long, usually 2-3 times as long as wide, narrowed from the middle or above to a broad blunt or pointed acumen 1 cm. long or less, narrowed and rounded at base (or obtusely narrowed, with the extreme base rounded abruptly into the petiole); petiole short, stout, about 0.7
