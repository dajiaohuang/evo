    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, 20-40 cm. Leaf solitary, linear, channelled, hairy beneath. Flowers blue, rarely white or orange, inner tepals trifid with a long, straight, central cusp.
            textZh: Moraea gigandra L.Bolus 的 SANBI 物种条目记载了植株、叶片和花部形态。
            sourceIds:
              - sanbi_13878_0
            locator: Strelitzia 29; archive Morphology row 6927, source 13878.0
            placeTimeScope: Regional species account published 2012; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
          - text: With one of the largest and most striking flowers in the genus, Moraea gigandra has dark blue-purple, or rarely white or orange flowers with broad, shortly clawed outer tepals up to 45 mm long and 30-35 mm wide, the limbs spreading horizontally and with dark blue to turquoise, crescent-shaped nectar guides. The flowers are distinctive not only in size but also for their extraordinarily long anthers, 13-15 mm long and exceeding the style branches. The style crests are barely developed and are about as long as the stigmatic lobes. The single, channelled leaf is usually hairy on the abaxial surface and the stems are velvety. Like other species in the M. villosa alliance the inner tepals are 3-lobed, with an elongate spreading to trailing central lobe. The species is comparatively late-flowering. Moraea gigandra was evidently once common north of the Berg River but is now on the verge of extinction.
            textZh: SANBI 条目提供了 Moraea gigandra L.Bolus 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: Strelitzia 42; archive Diagnostic row 94277, source 18638.0
            placeTimeScope: Regional species account published 2020; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
