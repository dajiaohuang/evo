        usage:
          title: Saurauia rubiformis Vatke, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrub or multiple-trunked tree to 15 m, copiously pubescent. Leaves with the blade broadly to narrowly obovate to elliptic, the apex shortly acuminate to acute, rarely obtuse, the base obtuse, rarely acute or cordate, the margins serrulate, 13-30 cm long, 4-16 cm wide, chartaceous to subcoriaceous, the secondary veins 15-25 pairs, the tertiary veins elevated, more prominent than the lesser reticulation, scabridulous with- trichomes usually shorter than 1 mm between the veins above, sparingly to abundantly tufted-, clustered-, or stellate-pubescent between the veins beneath; petioles ca 1.5-7.0 cm long, 2-4 mm in diam. Inflorescence 15- to 55-, rarely 190-flowered, 15-25, rarely to 33 cm long, 4-10, rarely to 18 cm wide, the primary peduncle 5-16 cm long, the bracts linear, triangular to foliaceous, 2-30 mm long. Flowers 15-30 mm broad, the buds to 5-8 mm in diam, the pedicels 3-25 mm long; sepals 5, 4-8 mm long, 4-6 mm wide, the pubescence usually shorter than 1 mm, the inner 2 medially densely heterotrichous, laterally densely clustered- pubescent, the imbricate sepal densely heterotrichous on the exterior half, densely clustered-pubescent on the interior half, the outer 2 densely heterotrichous, all densely clustered-pubescent within; petals 5, white, oblong, 6-12 mm long, 3-7 mm wide, obtuse to incised at the apex; stamens 26-41, the filaments 2-3 mm long, the anthers 2-3 mm long; ovary 5-locular, globose, 5-sulcate, glabrous, the styles obsolete to 4 mm, the stigmas simple. Fruit not seen.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 328
