            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: The salient features of the species are the finely pubescent leaves, bracts and calyces (almost velvety in the western part of the range, coarser in the eastern), the conspicuously pedunculate racemes loosely panicled, narrow bracts, and the corollas usually mauve.
