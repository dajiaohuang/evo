          originalSourceText: Shrub or small tree, up to 5 m. high, the branches densely hirsutulous to nearly glabrous; leaves elliptic-lanceolate to broadly lanceolate-ovate, 7-15 cm. long, 3-9 cm. wide, acuminate at apex, cuneate or rounded at base, entire, appressed- pubescent above with stiff scattered hairs, more or less pilosulous beneath, especially on the nerves and at the margin; petioles slender, 2-8 cm. long; glomerules androgynous, rarely unisexual, few-flowered, the staminate flowers 4-merous.
