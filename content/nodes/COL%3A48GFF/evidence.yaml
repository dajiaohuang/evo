    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Twiggy shrub 0.6-0.9 m tall; branches ascending, pubescent with numerous multicellular hairs. Leaves petiolate; lamina broadly ovate to subrotund, 10-15(-20) x 10-14(-18) mm, pubescent on both surfaces, under-surface greyish with long interwoven multicellular hairs and yellowish gland-dots, apex rounded, base truncate, margin finely crenate; petiole 5-10 mm long. Inflorescence simple, 70-140 mm long; verticils 2-6-flowered, 10-15 mm apart; rhachis glandular-hispidulous; bracts ovate, acuminate, 4-6 mm long. Calyx up to 9 mm long at fruiting stage. Corolla mauve or pink; tube decurved, widening towards the throat, 8-9 mm long; upper lip erect to recurved, 5 mm long; lower lip boat-shaped, 8-9 mm long. Stamens exserted from the throat by 9 mm; upper 2 filaments attached near the base of the tube, slightly thickened and pubescent below. Stigma not thickened, entire.
            sourceIds:
              - sanbi_15388_0
            locator: "SANBI/WFO archive Morphology row 49969; source 15388.0; publication: Codd, LEW. 1985. Lamiaceae: 36. Orthosiphon. In: OA Leistner (ed.), Fl. S. Africa 28(4): 229 - 236. Botanical Research Institute, Department of Agriculture and Water Supply, Pretoria. [http://www.biodiversitylibrary.org/item/209555#page/9/mode/1up]. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Closely related to O. labiatus but has smaller, more tomentose leaves and smaller flowers. From O. pseudoserratus it may be distinguished by the more rotund leaves with crenate margins and longer petioles, and the longer corolla lobes.
            textZh: SANBI 条目提供了该种的鉴别特征。
