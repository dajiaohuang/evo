          originalSourceText: puberulent to glabrous above, lightly pubescent below; petiolules up to 1 cm. long. Inflorescence a large, graceful, pendent, many-flowered raceme; pedicels slender, usually 3-4 cm. long. Flowers large, showy, yellow; sepals 5, comparatively small (usually about 6 mm. long), ovate or oblong, puberulent; petals 5, large, about 2 cm. long or longer, ovate-orbicular, short-clawed, venose; stamens 3-morphic; the 3 lowermost almost 3 cm. long, the anthers ovate-oblong, 4-5 mm. long, glabrous, dehiscent apically and basally; the 4 median stamens about 1 cm. long, the anther ovate-oblong, sagittate, about 4 mm. long, dehiscent from the basal lobes (and apical pores); 3 uppermost stamens shorter and smaller, somewhat unequal, the anthers similar to the median ones; ovary slender, lightly pubescent. Legume (reported) cylindric, about 50 cm. long, indehiscent, with horizontal seeds.
