        usage:
          title: Crescentia alata Kunth, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Small tree to 25 cm d.b.h. and 6 m tall, the branches crooked, the crown open; branchlets essentially lacking, the smaller branches thick, subterete, with alternate condensed, short-shoot projections each bearing a fascicle of leaves from its center. Leaves both compound and simple from each fascicle, the com- pound leaves 3-foliolate with sessile oblanceolate leaflets 1.0-4.5 cm long and 0.3-1.2 cm wide, round-tipped or slightly emarginate, lepidote but otherwise glabrous, rigid-chartaceous, the petiole winged, 2.7-11.5 cm long and 3-15 mm wide, lepidote, oblanceolate, rigid chartaceous as the leaflets, the simple leaves much smaller, 1.9-3.2 cm long and 0.5-1.0 cm wide, similar to single leaflets or petioles of compound leaves. Inflorescence one or 2 cauliflorous flowers borne on larger branches or trunk, pedicels lepidote, 0.5-0.8 cm long. Flowers with a musky odor, calyx split nearly to the base into two subequal lobes, each 1.4- 1.9 cm long and 0.7-1.4 cm wide, mostly glabrous, slightly lepidote at the base, usually with sunken plate-shaped glands; corolla off-white, tubular-campanulate with a horizontal pleat midway across the lower side of throat, fleshy, 4.0-6.5 cm long and 1.8-2.5 cm wide at the mouth of tube, the tube 2.8-4.2 cm long, the lobes 1-1.5 cm long, more or less triangular and fused at the bases, mostly glabrous, sparsely glandular-lepidote outside; stamens subexserted, the anther thecae ca. 2 mm thick, only partially divergent, 5-7 mm long, the anterior filaments 2.1-3.4 cm long, inserted 0.8-1.7 cm from the base of the tube, the posterior filaments 2.3-3.8 cm long, inserted 1.1-1.5 cm from the base of tube, the staminode 3-4 mm long, inserted 0.9-1.0 cm from the base of the tube; pistil 4.3-5.8 cm long, the ovary rounded-conical, lepidote, 5-6 mm long and 4-5 mm wide, the ovules multi-seriate on 4 parietal placentae; disc pulvinate, 2-3 mm long and 0.9-1.4 mm wide. Fruit a pepo or calabash, more or less spherical, 7-10 cm in diameter; seeds small, thin, wingless, 6-7 mm long and 7-9 mm wide, scattered through the pulp of the fruit.
