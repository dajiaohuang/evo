    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, 3-10 cm, tunics woody, concentric. Leaves lanceolate to ovate, often prostrate. Flowers small, white, tepals spreading, buds often aborted and replaced by cormlets, never producing capsules.
            textZh: Geissorhiza bolusii Baker 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 6757; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Diminutive, white-flowered Geissorhiza bolusii is unusual in the genus mainly in the several plane, more-or-less sword-shaped leaves usually prostrate or arching toward the ground, the several, small cauline, sheathing leaves, and the presence of two kinds of stems. Some produce no flowers but develop a cormlet in the axil of each flower bract, while others bear small white flowers but no capsules, and a cormlet later develops in place of each aborted bloom. Most populations comprise plants of both kinds, and it never reproduces by seed. Reproduction is exclusively by the small axillary cormlets. Geissorhiza bolusii is probably most closely related to G. ovalifolia, which grows in similar habitats and also has small, white flowers but usually has none or only one cauline leaf or bract and produces one or few cormlets in its leaf axils. Fruit development is evidently fairly rapid and immature capsules can be seen in some collections in which fading blooms are present at the tips of spikes.
            textZh: SANBI 条目提供了 Geissorhiza bolusii Baker 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 94667; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
