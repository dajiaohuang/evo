        claims:
          - text: Perennial, 450-700 mm tall, densely tufted. Leaves lanceolate; ligule a minutely fringed membrane. Inflorescence of 1-4 semi-sessile spikelets. Spikelets up to 30 mm long, many-flowered; glumes unequal, shorter than spikelet; lemma awn 4-8 mm long; anthers 2-3 mm long.
            textZh: Brachypodium bolusii Stapf 的 SANBI 物种条目记录了形态特征。
            sourceIds:
