            locator: "SANBI/WFO archive Morphology row 33433; source identifier 14572.0; cited publication: Fish, L. 2013. Poaceae: Brachypodium. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 134 - 134. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Very similar to B. flexum, which usually has straggling culms, cauline leaves, flexuous racemes with (3-)5-9 spikelets. Intermediates between these two species are common and very difficult to place.
