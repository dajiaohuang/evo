          title: Episcia cupreata (Hook.) Hanst., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Stoloniferous creeping terrestrial herbs 5-20 cm tall; stems slender and terete, ca. 5 mm in diam., hirsute, the young stems reddish, the stolons to 50 cm long, reddish or green, hirsute with few branches. Leaves grouped at the apex of stolon or branch, equal or subequal in a pair, somewhat bullate, broadly elliptic to oblong ovate, 2.6-8.9 cm long, 1.1-5.0 cm wide, membranous, the apex acute, obtuse or acuminate, the base obliquely rounded to acute or subcordate, crenate to serrate, above dark green, reddish green or with pale green or silvery variegation along the impressed main veins, hirsute, trichomes erect or appressed, below lighter green with prominent veins, the petioles 0.7-4.1 cm long, usually reddish, hirsute. Inflorescences of 1-4 flowers; peduncles short, 1-2 mm long, bibracteate; pedicels 1.1-4.5 cm long, reddish, hirsute. Flowers showy, usually red; floral tube short, rounded, hirsute; sepals lanceolate, slightly connate at base, 4 sepals erect, the fifth curved around corolla spur, 5-12 mm long, 1-3 mm wide, sparsely pilose, the apex acute, subentire, the outside green or reddish, the inside green; corolla scarlet, bright red, orange, at least on the upper side, yellow and sometimes spotted on the lower side, or rarely all yellow, inside yellow with red or purple spots, the throat with colorless papillae, limb orange
          originalLanguage: en
          sourceField: general
