  claims:
    - subjectId: taxon:staurozoa
      claimKind: scientific
      claimType: taxonomy
      statement: A five-marker analysis sampling about half of known stalked-jellyfish species rejects the traditional Cleistocarpida–Eleutherocarpida split and proposes a phylogenetic Staurozoa classification.
      confidence: high
      confidenceRationale: The combined dataset and explicit revision strongly support the sampled classification, while unsampled species and homoplastic morphology bound completeness.
      referenceLinks:
        - referenceId: miranda-2016-staurozoa
          relation: supports
          pages: e1951
          quoteLocator: Figures 3–8; Table 1; systematic revision
    - subjectId: taxon:staurozoa
      claimKind: scientific
      claimType: fossil-range
      statement: "Staurozoa has no supported scalar crown range in the cited evidence: extant systematics does not date the crown and the Haootia comparison is contested, so the former 562–0 Ma display is withheld."
      confidence: low
      confidenceRationale: Miranda et al. (2016) supports living staurozoan systematics, while Miranda et al. (2015) shows that Haootia is not a secure crown calibration. Low confidence prevents transfer of that contested fossil to the class boundary.
      referenceLinks:
        - relation: supports
          referenceId: miranda-2016-staurozoa
          pages: Article e1951
          figure: Figures 3–8; Table 1
          quoteLocator: Extant systematic revision
        - relation: contradicts
          referenceId: miranda-2015-haootia
          pages: Article 20142396
          figure: Figure 1
          quoteLocator: Reassessment of the staurozoan comparison
  claim-rationales.zh:
    - 联合数据集与明确修订强力支持取样分类，但未取样物种和趋同形态限制了完整性。
    - Miranda 等（2016）支持现生十字水母系统学，而 Miranda 等（2015）表明 Haootia 不能作为稳固冠群校准。低置信度避免把争议化石转移为纲级边界。
  claim-statements.zh:
    - 五标记分析取样约一半已知十字水母物种，否定传统闭囊亚目—开囊亚目划分，并提出系统发育式十字水母分类。
    - 现有引证不支持 Staurozoa 的单一冠群范围：现生系统学未测定冠群年代，Haootia 的比较归属亦有争议，因此旧有 562–0 Ma 展示被暂缓。
