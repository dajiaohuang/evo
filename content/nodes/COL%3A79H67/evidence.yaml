        usage:
          title: Salvia pteroura Briq., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Herbs or subshrubs, the branches ? glabrous, to 2 m. Leaves ovate to ellip- tic, acute, serrulate, the bases obtuse to rounded, sometimes extended along the petiole, to 11 cm long and 5 cm wide, + glabrous, resin-dotted, petioles ca 1.5-3.5 cm long. Inflorescences verticils, 6-12-flowered, arranged in a spike-like raceme, ca 7-10 long, the bracts broadly awl-shaped, ? saccate at the base, long- acuminate, ca 3-5 mm long, deciduous. Flowers with pedicels 2-4 mm long; calyx tubular, ca 5.5-8 mm long, membranaceous, sometimes slightly pubescent, the upper lip entire and ? 5-ribbed, the lower lip divided and ca 5-7-ribbed; corolla tubular, 7-10 mm long, blue, with 2-4 papillae near base, the upper lip extended and ca 5-7 mm long, the lower ca 4-5 mm long, pubescent near the distal portion; filaments with a retrorse tooth below the middle, the anthers slender, ca 1.5-1.8 mm long; style long, slender, pubescent near the tip. Nutlets 2-4, ovoid, ca 1.5 long, pale brown.
          originalLanguage: en
          sourceField: general
