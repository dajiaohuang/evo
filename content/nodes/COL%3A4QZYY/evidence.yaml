          title: Quararibea pterocalyx Hemsl., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Tree 6.5-13 m. tall, the trunk up to 22 cm. in diarn., the pubescence of stellate hairs (sometimes of tufted hairs?), the young branchlets whitish-gray-tomentellous to puberulous. Leaves with a terete petiole 1.5-2.5 cm. long, often slightly genic- ulate near the middle, tomentellous especially when young; blade elliptic to ovate-elliptic, rounded and sometimes unequal at the base, rounded or caudate- obtuse or long-acuminate at the apex, 14-30 cm. long and 6-13.5 cm. wide, sub- coriaceous, the margins sometimes slightly recurved, bright and glabrous or nearly so above, whitish-gray-tomentellous beneath, penninerved, the nerves prom- inent beneath. Flowers axillary or oppositifolious, solitary, the pedicel short, narrowly 10-winged, ca. 1-1.3 cm. long, shortly tomentellous, bracteolate, the bracteoles ca. 2.5 mm. long, shortly tomentellous, long persistent; calyx tubiform, longitudinally 10-winged, 3-lobate, 3.5-4 cm. long and ca. 1.2 cm. wide, shortly tomentellous without, appressed-sericeous within, the lobes irregular, obtuse to rounded and ca. 1 cm. long; petals linear-spatulate, emarginate, 9.5-14 cm. long and 1.2-1.4 cm. wide, white, sparsely puberulous on both sides; staminal column cylindric, somewhat 5-angular, slightly enlarged and shortly 5-dentate at the apex, 8-13 cm. long and ca. 0.3 cm. wide, shortly tomentellous except the base, the upper part of ca. 2 cm. antheriferous; anthers numerous, subsessile, the thecae paired, free and parallel or more or less confluent at the apex, ca. 1.5 mm. long; ovary narrowly pyriform, ca. 5 mm. long and 3 mm. in diam. at the base, shortly tomentellous, 4-celled; style filiform, slightly enlarged near the apex, as long as the staminal column, shortly tomentellous; stigma disk-shaped, ca. 4 mm. in diam. Capsule subglobose, mammillate, ca. 3.2-3.8 cm. long and 3.6-4.5 cm. in diam., tomentellous, (1-)2-celled, each cell 1-seeded, the fructiferous calyx cupuliform and ca. 4-5 cm. in diam.; seeds 2-2.6 cm. long.
