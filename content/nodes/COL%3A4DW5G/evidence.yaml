    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Perennial, hydrophyte (rooting at nodes), or rhizomatous or stoloniferous (mat-forming), up to 300 mm tall. Leaf blades 20-220 mm long, 3-8 mm wide. Spikelets 2.5-3.5 mm long, 1.3-1.5 mm wide. Racemes usually 2; spikelets arranged in 2 rows, glabrous, lanceolate, tips acute; lower glume usually developed into a small triangular scale or sometimes absent.
            textZh: Paspalum distichum L. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
