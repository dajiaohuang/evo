            locator: "SANBI/WFO archive Morphology row 2973; source identifier 11118.0; cited publication: Herman, PPJ; Retief, E. 1997. Plants of the northern provinces of South Africa: Keys and diagnostic characters. Strelitzia 6: 1 - 681. National Botanical Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Very similar to P. vaginatum, which has the lower glume absent or reduced to a rim, upper glume glabrous and leaves less than 3 mm wide. Conflicting opinions exist about the nomenclature and status of these two species, but leaf anatomical differences were found by Ellis (1974).
            textZh: SANBI 条目提供了 Paspalum distichum L. 的鉴别特征。
