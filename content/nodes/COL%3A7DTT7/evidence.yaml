    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Annual, coarsely tufted (usually erect with few flowering culms), up to 1.7 m high. Leaf blades 50-300 mm long, 5-20 mm wide. Spikelets 2.5-5.5 mm long. Racemes 3-20, 10-140 mm long; spikelets ovate; lower glume two-thirds the spikelet length, 3-nerved, tip broadly rounded or truncate with a tuft of 1-5 stiff hairs on middle nerve, a third of the way from tip; upper lemma with mucro 0.5-1.0 mm long.
