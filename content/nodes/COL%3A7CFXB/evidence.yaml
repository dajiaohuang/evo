        usage:
          title: Tobagoa maleolens Urb., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Herbs to 1 m tall, the stems strawlike, glabrous, angular, delicately winged, the nodes well spaced. Leaves lanceolate or ovate lanceolate, 6.5-10.0 cm long, 1-2 cm wide, attenuate at the apex, ultimately acute, cuneate at the base, the costa plane to immersed above, prominulous beneath, the lateral veins ca. 7, scarcely evident above, prominulous beneath, at first leaving the costa widely and arcuately then toward margin strongly ascending, the submarginal vein ca. 1 mm from the margin, inconspicuous, the margin delicately revolute, the inter- venal areas smooth, the veinlets not evident, chartaceous, sometimes discolo- rous, glabrous; petioles slender but rigid, to 1 cm long, glabrous, attached but not conspicuously so to the stipular sheath; stipules connate, to 3 mm long, each part of the sheath with 3 setas exceeding its length. Inflorescences compressed capitate, axillary, to 0.5 cm long. Flowers with the hypanthium and calycine cup short, the calycine lobes 4, ovate triangular, 1 mm long, acute, glabrous, with a minute gland in the sinus; corolla white, the tube and lobes 3 mm long, the tube puberulent outside, villose upwards within, the lobes 4, longer than tube; stamens 4, the anthers oblong, 1 mm long, obtuse, minutely apiculate, the filaments short; style 2 mm long (in bud), papillose, the stigmas 2, curved and reflexed, to 0.4 mm long. Fruits dry, indehiscent, oblong, ca. 2 mm long, vaguely didymous, glabrate, the calyx persistent; seeds ventrally concave, finely reticulate.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 12294
