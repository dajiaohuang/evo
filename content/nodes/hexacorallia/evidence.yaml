  claims:
    - subjectId: taxon:hexacorallia
      claimKind: scientific
      claimType: taxonomy
      statement: A systematic synthesis recognizes Hexacorallia within Anthozoa while reviewing competing internal relationships and uneven diversity knowledge; it supplies a classification framework, not a precise origin date.
      confidence: medium
      confidenceRationale: Broad taxonomic coverage supports the framework, but the review explicitly retains unresolved phylogenetic questions.
      referenceLinks:
        - referenceId: daly-2007-cnidaria-review
          relation: supports
          pages: 127–182
          quoteLocator: Hexacorallia classification and phylogenetic-pattern sections
    - subjectId: taxon:hexacorallia
      claimKind: scientific
      claimType: fossil-range
      statement: "Hexacorallia has no supported scalar crown range in the cited evidence: the classification review does not justify transferring a 425 Ma Paleozoic coral occurrence to crown Hexacorallia, so the former 425–0 Ma display is withheld."
      confidence: low
      confidenceRationale: Daly et al. (2007) supports classification and comparative morphology, not a crown-specific temporal boundary. Low confidence blocks grade-to-crown age transfer.
      referenceLinks:
        - relation: supports
          referenceId: daly-2007-cnidaria-review
          pages: 127–182
          figure: Hexacorallia classification
          quoteLocator: Classification and phylogenetic-pattern sections
  claim-rationales.zh:
    - 广泛分类覆盖支持这一框架，但综述明确保留了未解决的系统关系问题。
    - Daly 等（2007）支持分类与比较形态，而不支持冠群专属时间边界。低置信度阻止把形态级年代转移到冠群。
  claim-statements.zh:
    - 系统综述把六放珊瑚识别为珊瑚虫纲内部类群，同时回顾相互竞争的内部关系和不均衡的多样性知识；它提供分类框架，而非精确起源年代。
    - 现有引证不支持 Hexacorallia 的单一冠群范围：分类综述不足以把 425 Ma 古生代珊瑚记录转移为冠群六放珊瑚，因此旧有 425–0 Ma 展示被暂缓。
