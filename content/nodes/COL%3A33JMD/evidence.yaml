        usage:
          title: Cyrilla racemiflora L., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Trees (in Panama) with thick, rough, brown bark; diam ca 45 cm; branches glabrous, terete; branchlets subterete to angulate, glabrous. Leaves crowded towards the ends of the branches, the blade oblanceolate, narrowly cuneate at base, acute to subobtuse at apex, recurved marginally, coriaceous, glabrous, the midvein prom- inent beneath, densely reticulate, 2-9 cm long, 1-2.4 cm broad; petiole to! 4 mm long, glabrous. Racemes 3.5-1.0 cm long, borne in the upper axils, erect to pendu- lous, glabrous; peduncles 4-10 mm long, glabrous; bracts 0.5-1.5 mm long, lance- olate, glabrous, persistent, ascending in bud, spreading to descending after anthesis. Flowers ascending in bud, spreading at anthesis, pedicellate, the pedicel 1-2 mm long, glabrous; bracteoles paired, alternate to opposite, 0.5-1 mm long, lanceolate, basally thickened, usually persistent, borne above the middle of the pedicel, spread- ing after anthesis; sepals 5, free, ovate-lanceolate to deltoid, acute at apex, 0.4-0.7 mm long, imbricate in bud; petals 5, inserted on a small glandular disk, o0blong- lanceolate to oblong-elliptic, acute at apex; stamens opposite the petals, 1.5-2 mm long, the filaments terete, the anthers versatile; ovaries sessile, 2-3(-4) -locular, the style persistent, the stigma 2-4-lobed. Fruits dry, globose, ovoid to oblong- ovoid, 1.6-2.7 mm in diam; seeds elongate; cotyledons short, inferior; radicle superior.
          originalLanguage: en
          sourceField: general
