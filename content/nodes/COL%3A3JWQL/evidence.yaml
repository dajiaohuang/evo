    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plant stemless, simple, about 7 cm diam., with numerous leaves, glaucous green in color. Leaves oblong-lanceolate, acuminate, 3-4 cm long, 10-15 mm broad towards base, terminating in a simple about 10 mm long pellucid bristle, younger leaves more or less erect-incurving, the older more or less spreading; face of leaf in the upper part somewhat convex becoming somewhat concave towards base; back of leaf convex, the keel never ciliate or toothed, glaucous green; both sides of leaf from the base to midleaf with many deep green reticulated lines, the upper pellucid part on both sides with many green more or less long lines, the middle one of which may reach the apex; the upper margins irregularly fimbriated with pellucid, remote slender teeth, 1.5-2.5 mm long. Occasionally 1 or 2 solitary teeth may be found on the keels of a few leaves.
            textZh: Haworthia decipiens Poelln. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
