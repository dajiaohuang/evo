            locator: "SANBI/WFO archive Morphology row 67844; source identifier 16000.0; cited publication: Brown, JR. 1965. Notes on Haworthias. Cact. Succ. J. (Los Angeles) 37(5): 127 - 128. [All rights reserved]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Differs from Haw. arachnoidea by the shorter leaves, the smooth keels and the slender remote teeth of the margins.
            textZh: SANBI 条目提供了 Haworthia decipiens Poelln. 的鉴别特征。
