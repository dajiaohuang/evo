    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, 15-30 cm, stem flexed outward above leaf sheath. Leaf solitary, linear, channelled, apex often flattened. Flowers yellow, tepal claws forming a narrow cup including the stamens.
            textZh: Moraea pyrophila Goldblatt 的 SANBI 物种条目记载了植株、叶片和花部形态。
            sourceIds:
              - sanbi_13878_0
            locator: Strelitzia 29; archive Morphology row 7414, source 13878.0
            placeTimeScope: Regional species account published 2012; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
          - text: Recognised by the solitary foliage leaf inserted well above the ground, sparsely branched (rarely simple), flexuose stem, and yellow flower with the erect tepal claws forming a narrow cup ± 10 mm long completely enclosing the stamens. The filaments are entirely united in a cylindric column 4-5 mm long relatively densely hairy in the lower half, and the anthers, 5-8 mm long, are usually slightly shorter than the style branches. The nearly erect style branches, ± 5 mm long, bear short, horizontal crests, hardly visible in pressed flowers. Moraea pyrophila may be most closely related to M. autumnalis, which has the foliage leaf inserted close to ground level, and deeper yellow flowers with a floral cup including the filaments and only the bases of the anthers. Moraea pyrophila may also be confused with M. collina but that species has a longer leaf, usually trailing distally in contrast to the very short, apically thickened leaf of M. pyrophila, which seldom exceeds the stem.
            textZh: SANBI 条目提供了 Moraea pyrophila Goldblatt 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: Strelitzia 42; archive Diagnostic row 94293, source 18638.0
            placeTimeScope: Regional species account published 2020; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
