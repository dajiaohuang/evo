        usage:
          title: Psychotria panamensis Standl., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Trees to 14 m tall, the branchlets smooth, drying gray, glabrous, the nodes well spaced. Leaves lanceolate or ovate lanceolate, rarely oblong rotund, occa- sionally narrow, 5-20 cm long, 1-9 cm wide, tapering acutely or obtusely toward the apex, occasionally with a cusp to 2 cm long, acute, cuneate or occasionally obtuse at the base, often slightly inequilateral, the lateral veins 7-15(-18), widely arcuate, the costa prominulous above, prominent and often angular beneath, oc- casionally with domatia in the axils of the lateral veins beneath, chartaceous to subcoriaceous, usually drying deep brown or chocolate brown above, reddish brown beneath, glabrate above and beneath; petioles 1.0-4.5 cm long, slender to somewhat stout, glabrous; stipules connate basally, ovate oblong, to 1 cm long, to 0.65 cm wide at the base, obtuse, appressed, stiff, ciliolate. Inflorescences terminal, occasionally axillary, often not solitary but 2 or 3 together, cymose paniculate, to 12 cm long to 10 cm wide, puberulent or glabrate; peduncles to 6 cm long, 0.1-0.2 cm wide, often stiff, lignose, 4-angled, the branches often stiff, lignose, 4-angled, opposite or occasionally ternate, the lowermost branches to 6.5 cm long, the upper branches disposed in 4-5 sets; bracts and bracteoles ovate subulate, to 1 mm long, ferrugineous villose especially adaxially, the pedicels bearing an apical bracteole ca. 0.5 mm long. Flowers (immature) usually sessile or subsessile; calycine cup to 1 mm long, glabrous, eglandular within, the teeth 5, irregular, subtriangular, to 0.5 mm long; corolla white or yellow green, to 4 mm long, thickly petaloid, glabrous outside, densely villose near the mouth, the lobes 5, oblong, 1.2-2.2 mm long, slightly cucullate, villose at the base; stamens 5, the anthers oblong, ca. 1.1 mm long, obtuse, the filaments short, attached near the mouth; stigmas 2, unequal, narrowly oblong, ca. 1 mm long, the style ca. 3.2 mm long. Fruits on pedicels shorter than the fruit; oblong to subrotund, to 1.2 cm long, drying dark, often rusty red, glabrous, fleshy, the 2 pyrenes often giving the persistent fleshy surface a ribbed effect or flesh deciduous, pyrenes glabrous, ribbed.
          originalLanguage: en
          sourceField: general
