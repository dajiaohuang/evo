          title: Casearia grandiflora Cambess., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: "Small tree (?), the branchlets densely tawny-tomentellous. Leaves shortly petiolate, the petiole to 4 mm long, densely tawny-tomentellous, the stipules linear, fugaceous; blade oblong, obtuse or ? acute and sometimes slightly inequilateral at the base, rather long-acuminate at the apex, crenulate-serrulate at the margins, up to 10 cm long and 3 cm wide, chartaceous, obscurely pellucid-punctate, markedly discolorous, the- upper surface dark green when fresh, dark brown when dry, ? shining and glabrous or with the costa puberulous, the lower surface dull, densely tawny-tomentellous and with the costa and lateral veins prominent. Inflorescences sessile or nearly so, fasciculate, 10-20-flowered, the bracts rather large, subcircular, tawny-tomentellous outside, glabrous inside. Flowers shortly pedicellate, the pedicel articulated close to the base, tawny-tomentellous; calyx ca 7 mm long, the tube ? 5-costate and ca 2-2.5 mm long, the lobes 5, rather broadly elliptic, rounded at the apex, ca 3.5 mm wide, tawny-tomentellous without, puberulous within; stamens 10, inserted near the apex of the calyx tube, scarsely united at the base among themselves and with the staminodes, the filaments unequal, up to 2.5 mm long and glabrous, the anthers didymous, subglobose, ca 0.5 mm long, with a dorsal, apical, barbate gland; staminodes 10, interstaminal, ca 1.8-2 mm long, tomentose- barbate; gynoecium 5.5-6 mm long, .the ovary ca 1.5-1.8 mm in diam, glabrous at the base, densely whitish-pilose at the. apex, gradually attenuate into the style, the latter densely whitish-pilose below to glabrous apically, the stigma capitate and densely papillate. Capsule (acc. to Eichler in Mart., Fl. Bras.. 13(1): 479, 1871) turbinate-ellipsoid, 6-angulate, apiculate, 7-8 mm long, glabrous; seeds 3-4, oblong, ca 2.5 mm long, the testa glabrous, minutely- reticulate-foveolate, the aril small, fimbriate-lacerate."
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 5858
