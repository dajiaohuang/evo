  claims:
    - subjectId: event:xianguangia-body-plan-test
      claimKind: scientific
      claimType: topology
      statement: Eighty-five new specimens plus type material unite three named forms as Xianguangia. Ou et al. recover a suspension-feeding stem-cnidarian body plan, whereas Zhao et al. recover Dinomischidae on the ctenophore stem in their main Bayesian analysis and a polytomy under alternative coding.
      confidence: contested
      confidenceRationale: The expanded specimen sample strongly constrains reconstruction, but column/tentacle identity and matrix placement remain disputed between primary analyses.
      referenceLinks:
        - referenceId: ou-2017-xianguangia
          relation: supports
          pages: 8835–8840
          figure: Figures 1–4; Supplementary Figures
          quoteLocator: 85 new specimens, synonymy, reconstruction and phylogenetic analysis
