  claim-rationales.zh:
    - 扩大的标本样本有力约束复原，但柱体/触手身份和矩阵位置在一手分析间仍有争议。
  claim-statements.zh:
    - 对 85 件新标本和模式材料的研究把三个曾命名的形态统一为 Xianguangia。Ou 等恢复悬浮摄食的刺胞动物干群体制；Zhao 等的主贝叶斯分析把 Dinomischidae 恢复在栉水母干群上，而替代编码产生多分支。
