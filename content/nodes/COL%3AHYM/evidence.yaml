  claims:
    - subjectId: taxon:hymenoptera
      claimKind: scientific
      claimType: topology
      statement: Transcriptomic sampling across hymenopteran lineages resolves many relationships and supplies fossil-calibrated divergence estimates. Those estimates depend on sampled taxa, loci, calibrations and clock models and do not equal a global Hymenoptera FAD.
      confidence: medium
      confidenceRationale: Confidence is medium because the cited primary study directly supports the bounded topology statement at the supplied locator. The confidence does not extend beyond those estimates depend on sampled taxa, loci, calibrations and clock models and do not equal a global Hymenoptera FAD.
      referenceLinks:
        - relation: supports
          referenceId: peters-2017-hymenoptera-history
          pages: 1013–1018
          figure: Figures 1–3; supplemental phylogenies
          quoteLocator: Phylogenomic dataset; topology; fossil-calibrated dating
    - subjectId: taxon:hymenoptera
      claimType: fossil-range
      claimKind: scientific
      statement: The 242–0 Ma Hymenoptera display begins at the older edge of the 242–237 Ma oldest-undisputed xyelid fossil interval and is a fossil minimum, not an origin estimate.
      confidence: medium
      confidenceRationale: The systematic divergence-dating review explicitly distinguishes the oldest undisputed fossil calibration from inferred deeper order ages.
      referenceLinks:
        - referenceId: zhang-2025-hymenoptera-divergence-dating
          relation: supports
          pages: 1–31
          figure: Figure 2; Tables S2–S3
          quoteLocator: Brief History of Divergence Dating, oldest undisputed Xyelidae at approximately 242–237 Ma
    - subjectId: taxon:hymenoptera
      claimKind: scientific
      claimType: biogeography
      statement: Peters et al. sample transcriptomes across major hymenopteran lineages and Zhang et al. compile named fossil occurrences including Triassic xyelids; the combined evidence is a study-bounded sample, not a complete geographic map of Hymenoptera.
      confidence: medium
      confidenceRationale: The primary phylogenomic sampling and systematic fossil review state their included lineages and records, but neither source is a global presence–absence census.
      referenceLinks:
        - referenceId: peters-2017-hymenoptera-history
          relation: supports
          pages: 1013–1018
          figure: Figures 1–3; supplemental phylogenies
          quoteLocator: Transcriptomic taxon sampling across major hymenopteran lineages
        - referenceId: zhang-2025-hymenoptera-divergence-dating
          relation: supports
          pages: 1–31
          figure: Figure 2; Tables S2–S3
          quoteLocator: Fossil calibrations and named hymenopteran occurrences
    - subjectId: taxon:hymenoptera
      claimKind: scientific
      claimType: ecology
      statement: The sampled Hymenoptera include parasitoid, predatory and pollinating life-history contexts discussed by Peters et al.; those guild examples document ecological diversity in the sample and are not traits assigned to every hymenopteran.
      confidence: medium
      confidenceRationale: The study discusses ecological roles in relation to sampled lineages, but the transcriptomic design does not measure behaviour, habitat use or the full order-wide guild distribution.
      referenceLinks:
        - referenceId: peters-2017-hymenoptera-history
          relation: supports
          pages: 1013–1018
          figure: Figure 1 and supplementary taxon table
          quoteLocator: "Introduction and taxon sampling: parasitoid, predator and pollinator lineages"
    - subjectId: taxon:hymenoptera
      claimKind: scientific
      claimType: morphology
      statement: Zhang et al. identify the oldest undisputed xyelid fossils using preserved hymenopteran body and wing characters; that Triassic fossil morphology is a bounded example and does not define one body plan shared by all Hymenoptera.
      confidence: medium
      confidenceRationale: The systematic review records the fossil evidence and its diagnostic context, while the sample is too narrow to support an order-wide anatomical generalization.
      referenceLinks:
        - referenceId: zhang-2025-hymenoptera-divergence-dating
          relation: supports
          pages: 1–31
          figure: Figure 2; Tables S2–S3
          quoteLocator: "Brief History of Divergence Dating: oldest undisputed xyelid fossil morphology and 242–237 Ma record"
    - subjectId: taxon:hymenoptera
      claimKind: scientific
      claimType: taxonomy
      statement: Peters et al. infer relationships among sampled hymenopteran lineages from transcriptomes and fossil calibrations, while Zhang et al. review competing fossil and molecular interpretations; the atlas retains this as a sampled, revisable classification rather than a single definitive tree.
      confidence: medium
      confidenceRationale: The phylogenomic matrix and systematic review directly support the bounded classification statement, but backbone relationships and calibration choices remain sensitive to sampling and model assumptions.
      referenceLinks:
        - referenceId: peters-2017-hymenoptera-history
          relation: supports
          pages: 1013–1018
          figure: Figures 1–3; supplemental phylogenies
          quoteLocator: Transcriptomic matrix, inferred topology and fossil-calibrated relationships
        - referenceId: zhang-2025-hymenoptera-divergence-dating
          relation: supports
          pages: 1–31
          figure: Figure 2; Tables S2–S3
          quoteLocator: Review of competing fossil and molecular interpretations in Hymenoptera systematics
  claim-rationales.zh:
    - 置信度为中：所引主研究在给定页码、图版或章节定位器处直接支持这一受限的拓扑表述；置信度不外推到文中明确排除的全群起源、全球首现、直接祖先或精确端点。
    - 分化测年系统综述明确区分最早无争议化石校准与推断的更深目级年龄。
    - 系统基因组取样和化石综述均说明了纳入的谱系与记录，但两者都不构成膜翅目的全球存在—缺失普查。
    - 研究讨论了样本中的寄生、捕食和传粉生活史背景，但转录组设计不能测量整个目级的行为或生态分布。
    - 综述记录了三叠纪木蜂类化石的保存形态和鉴别背景，但单一有界样本不能概括所有膜翅目的体制。
    - 系统基因组矩阵与系统综述支持有界分类结论，但骨干关系和校准选择仍会随取样和模型假设改变。
  claim-statements.zh:
    - 膜翅目各谱系的转录组抽样解决了多项关系，并提供化石校准的分歧估计。这些估计依赖类群、位点、校准和时钟模型，不等同于膜翅目的全球首现。
    - 242–0 Ma 的膜翅目显示以 242–237 Ma 最早无争议广腰类化石区间的老端为起点，是化石最低界而非起源估计。
