          - text: "Erecta glabra rigida, ca. 20 cm. alta copiose ramosa; rami primarii ad 5 mm. diam., internodiis saepe 0.5-1 cm. longis; ramuli floriferi saepe 1-6-foliati; folia suprema (bracteae) ad 8 mm. longa. fere ad 2 mm. diam., vagina impresse lineata, linea 4-6 mm. longa, interiora 5-6 mm. longa, 1.5 mm lata diametroque, supra plana, obtuse carinata vel dorso fere rotundata, lat. visa superne vix attenuata, obtusa vel fere truncate, apice leviter uncinata, sordide viridia, punctis crebris, sat magnis; flores solitarii diurni; pedunculi per 4-6 mm. exserti, fructiferi ad 1 cm. longi; receptaculum medio subconstrictum, cum pedunculo superne ampliato clavatum complanatumque, lateribus leviter convexis, 3 mm. longum, ad 4 mm. diam.; sepala 5, subaequilonga acuta rubra, exteriora superne compressa, ad 3 mm. longa, 3 late marginata; petala 2-seriata, subaequilonga, inter angustissima in genere, acuta vel subobtusa. inferne vix angustata, albida, ad 4 mm. longa, 0.25 mm. lata: staminodia linearia glandulifera albida, in stamina incumbentia eisque saepius parum breviora; filamenta conice conferta, alba, interiora medio vel infra parce longe papillata, ad 3 mm. longa, antheris pollineque aureis; discus conspicuus crenulatus; ovarii lobi obtusi approximati, per 0.5 mm. elevati; stigmata 5, anguste subulata, e basi superne gradatim attenuata, 3 mm. longa; capsula 6 mm. longa, supra per 2 mm. elevata, lobis valde compressis. 5 mm., expansa 8 mm., diam., valvis suberectis exalatis, carinis divergentibus, dimidium attingentibus, tuberculo sat magno, in ore loculi processibus 2 de tecto dependentibus."
