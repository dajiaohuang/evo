    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte to 18 cm, neck of long blunt bristle-like fibres. Leaves 3(-5), fewer at early flowering, linear. Flower 1, stellate, yellow, with green beneath, faintly scented, stigma branches slender, often shorter than stylar column, bract 1, sheathing.
            textZh: Pauridia curculigoides (Bolus) Snijman & Kocyan 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13877_0
            locator: "SANBI/WFO archive Morphology row 7531; source identifier 13877.0; cited publication: Snijman, DA. 2012. Hypoxidaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 115 - 119. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Pauridia curculigoides is distinguished by a combination of unusual features. Narrowing upwards from a flat-based corm, the tunics are frequently protracted into a neck of thick, rigid, blunt, brown fibres that partially cover two distinctive long, membranous cataphylls present in the early stages of flowering. Only later in the growing season are the cataphylls less obvious after splitting open. Specimens collected at this growth stage were described as Spiloxene declinata, which I regard as conspecific with P. curculigoides. Each inflorescence is one-flowered with the pedicel incompletely sheathed by a conspicuous, long, leathery bract. The typically narrow (3-5 mm across) tepals are plain yellow with pale green backs on the outer tepals and reminiscent of those in Empodium plicatum (Thunberg) Garside, previously Curculigo plicata (Thunb.) Dryand. ex Aiton, thus prompting the choice of epithet. To date, P. curculigoides and P. capensis are the only species known to have an additional vascular bundle below the central vascular strand of the leaf. In addition, both species have similar, partially sheathing bracts and shiny, black seeds in which the outer periclinal cell walls of the testa are colliculate and surrounded by a narrow, flat rim. Unlike P. curculigoides, the flowers in P. capensis vary considerably in size and colour, ranging from yellow to white and rarely cream or pale pink, often with contrasting colours in the centre. Despite this variability P. capensis has consistently short filaments (ca. 2 mm) in both whorls, unlike the unequal staminal filaments in P. curculigoides, 1.0-2.5 mm long in the outer whorl and slightly longer (1.5-3.0 mm) in the inner whorl. In addition, P. capensis lacks a pronounced cataphyll when flowering, most often a few months later in the year than for P. curculigoides.
