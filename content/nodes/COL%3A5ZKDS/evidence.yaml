    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Corm ovoid, 25 mm [as '1 in.'] diam.; tunics nearly black, firm in texture; stem 25-152 mm [as '1-6 in.'] long above ground; leaves 2-3, linear or lanceolate, the lower 15-20 cm [as '6-8 in.'] long; capitulum globose, many-flowered, 1/2-1 in. diam.; bracts 4-8, ovate, acute, the inner whitish, scariose, 25-76 mm [as '1-3 in.'] long, distinctly striped with green or brown, the outer more like the leaves in texture and furnished with a leafy point; pedicels 1/4-1/2 in. long; perianth whitish, 3/8-1/2 in. long; claw shorter than the ovate- cucullate blade; stamens as long as or a little longer than the blade; anthers yellowish, 1/12-1/6 in. long; capsule as long as the perianth; styles 1/6 in. long.
