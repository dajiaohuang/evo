        usage:
          title: Cayaponia granatensis Cogn., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Dioecious vines; stems glabrous. Juvenile leaves simple, mature 3-lobate or 3-foliolate, the blade of the juvenile leaves elliptic to narrowly ovate, 10-20 cm long, 5-10 cm wide, the apex long acuminate, the base rounded to cuneate, 1-nerved, the mature leaves broadly ovate, 14-25 cm long and wide, the apex of the lobes or the leaflets caudate, the base truncate to cordate, 3-nerved, all leaves with the margins entire and minutely denticulate, chartaceous to coriaceous, both the surfaces glabrous, eglandular or with a few small, sessile glands near the petiole; petiole 2.5-9.0 cm long, stout, glabrous; tendrils 3-branched near the base. Staminate flowers in short, axillary, fasciculate racemes, the rachis 1-2 cm long, puberulent; pedicels 1-3 mm long, stout; calyx campanulate, ca. 2 mm long; corolla white, the lobes ovate lanceolate, 1.0-1.5 cm long, the outer sur- face scabrous pubescent, crisp villous on the margins, the inner surface crisp villous; filaments 5-7 mm long, slender, the anthers complicate, forming an irregular head 8-10 mm long; nectaries pouchlike on hypanthium wall near base, a cuplike nectary disc present at the base of the hypanthium. Pistillate flowers similarly disposed as the staminate flowers; mature flowers not seen. Fruits reddish orange, drying orange, globose, ca. 1.5 cm in diameter, obscurely alveolate, glabrous; seeds 3, broadly elliptic to suborbicular, 12-15 mm long, 7-12 mm wide, light tan, testa smooth or nearly so.
          originalLanguage: en
          sourceField: general
