        claims:
          - text: Decumbent to erect, perennial herb, up to 300 mm high, with milky latex. Leaves in a rosette, oblong in outline, narrowed to broad, winged, petiole-like base, runcinate-pinnatifid; cauline leaves similar but sessile and coarsely dentate. Capitula ligulate, several in sparingly branched, corymbose panicle, long-pedunculate; involucre oblong-cylindrical or campanulate; bracts in several rows, thinly white-cottony on backs. Receptacle paleate; paleae linear, acuminate. Florets bisexual; corolla white, strap-shaped. Flowering time Dec. Pappus of long plumose bristles in 1 row. Cypselae reddish brown, cylindric with several ribs and transversely wrinkled, tapering into a long beak.
