          title: Mikania amblyolepis B.L.Rob., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Slender, sparingly branched vines with numerous reddish glands on leaves, branches of inflorescence, and involucral bracts; stems yellowish to reddish, mostly terete, slightly striate, slightly puberulous, usually fistulose. Leaves opposite; blades broadly ovate, to 6 cm long and 4.5 cm wide, the base cordate to deeply cordate, the margins with few to many blunt dentations, the apex bluntly acute to narrowly long-acuminate, the surface glabrous except for numerous reddish glandular punctations, strongly trinervate from the base; petioles slender, 1.0-3.5 cm long. Inflorescence a corymbose panicle with subeymose branches, the heads often in clusters of 3; ultimate branches to 2 mm long, short-puberulous and reddish glandular-punctate. Heads 4.5-5.0 mm high; subinvolucral bract narrowly elliptical to lanceolate, ca. 2 mm long, the subinvolucral and outer involucral bracts puberulous and reddish glandular-punctate; involucral bracts oblong with rounded somewhat fimbriate tips, ca. 4 mm long, ca. 1 mm wide; corolla white, 2.0-2.5 mm long, the tube short, 0.5-0.8 mm long, the limb narrowly funnelform with scattered papillae on the lower inside surface, the lobes about as long as wide and partially recurved when old, the outer surface with scattered reddish glands, the corolla cells oblong, 25 ,. or less wide; anther appendages firm, triangular-ovate; style bases densely papillose, the style appendages with short papillae. Achenes 4-5-ribbed, ca. 1.5 mm long, with many scattered yellowish glands; pappus of ca. 30 slender bristles in 1 series, the tips scarcely enlarged.
          originalLanguage: en
