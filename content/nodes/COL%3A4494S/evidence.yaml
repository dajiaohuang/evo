    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Caules e radice plures, ascendenti-erecti vel erecti, 5-16 cm lati, rigidi, striati, puberuli vel glabri, dense foliosi. Folia imbricata, alterna, sessilia, linearia, calloso-acuta, remote callose pinnatifido-dentata, superiora passim longiora, 6-20 mm longa 0.5-1 mm lata, inferiora integra, saepe intus et margine ad basin tantum vel superne quoque pilosa. Flores pauci in vertice caulium, sessiles. Prophylla 2 subulata, folio florali triplo breviora, basi calycis inserta. Hypanthium oblongo-obconicum, villosum; lobi eius subulati, integri, erecti, glabrescentes, 4 mm longi. Corolla flava, ca. 12 mm longa, extus minute hirtella vel glabrescens, in nervis mediis petalorum parce hirsuta, bilabiata; lobi 2 superiores lanceolato-lineares, circiter 3 mm supra basin corollae soluti; labium inferius tripartitum lobis ovato-oblongis acutis. Filamenta 6 mm longa, extus glabra, ad fissuras pilosula. Antherae fuscae albido-striatae, apice omnes pilosae. Stigma parum exsertum.
