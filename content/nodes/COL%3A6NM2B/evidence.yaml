    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants several-stemmed. Leaves recurving ± at middle, 0.4-1.2 m long, 4-14 mm broad, channelled above, keeled below; margin smooth to sparsely serrulate, often only towards apex. Scape overtopping recurved leaves, 0.25-1.0 m tall. Raceme oblong to narrowly cylindrical, usually tapering towards apex, 90-350 x 28-38 mm, dense or lax; buds ascending, whitish tinged with pink, to yellow or orange; flowers at first spreading, later deflexed, whitish, cream-coloured or yellow. Bracts broadly ovate to oblong, 4.0-6.5 mm long, obtuse to rounded, rarely acute; margin minutely serrulate. Pedicels 1.5-2.0 mm long. Perianth subcylindrical to narrowly funnel-shaped, (11-)13-20 mm long, widening gradually to throat, or ± abruptly about middle; lobes ovate, 2.0-2.5 mm long, often somewhat spreading. Stamens exserted by 0-2 mm at anthesis. Fruit ovoid-triquetrous, 5.75 x 4.5 mm, stipitate.
