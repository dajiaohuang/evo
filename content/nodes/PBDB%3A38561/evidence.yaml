  claims:
    - subjectId: taxon:dromaeosauridae
      claimKind: scientific
      claimType: topology
      statement: Dromaeosauridae is represented by Turner and colleagues’ specimen review and large paravian morphology matrix; recovered subclades and unstable taxa are analysis results, not a resolved ancestor chain or exact global duration.
      confidence: medium
      confidenceRationale: The monograph documents extensive first-hand scoring and sensitivity, while several placements remain unstable. Medium confidence mirrors the reported support.
      referenceLinks:
        - referenceId: turner-2012-dromaeosaurid-systematics
          relation: supports
          pages: 1–206
          figure: Figures 1–3 and 65–69; Appendices 1–3
          quoteLocator: Specimen review; character matrix; phylogenetic results; unstable placements
    - subjectId: taxon:dromaeosauridae
      claimKind: scientific
      claimType: fossil-range
      statement: Dromaeosauridae is displayed at 167–66 Ma only as the review's sampled Jurassic–Cretaceous envelope, not exact global family endpoints. The interval is a source-bounded sample window, not a global FAD, LAD, divergence date, continuous occupancy claim or direct-ancestor assertion.
      confidence: medium
      confidenceRationale: Dromaeosauridae uses Turner, A.H.; Makovicky, P.J.; Norell, M.A. (2012) because the cited pages and locator expose the sampled taxon, specimen or living sequence set. Confidence is medium and applies only to Dromaeosaurid specimens reviewed and matrix-sampled by Turner et al.; broader endpoints remain unclaimed.
      referenceLinks:
        - relation: supports
          referenceId: turner-2012-dromaeosaurid-systematics
          pages: 1–206
          figure: Figures 1–3 and 65–69; Appendices 1–3
          quoteLocator: Specimen review; character matrix; phylogenetic results; unstable placements
        - relation: contextualizes
          referenceId: ics-2026-06
          pages: International Chronostratigraphic Chart v2026/06
          figure: Global chronostratigraphic scale
          quoteLocator: Numerical boundaries for named geological stages used to bound the source sample
  claim-rationales.zh:
    - 专著记录大量第一手编码与敏感性分析，而若干位置仍不稳定；中等置信度对应已报告支持度。
    - Dromaeosauridae 采用 Turner, A.H.; Makovicky, P.J.; Norell, M.A.（2012）的论文，因为所引页码与定位符直接标示了研究采样的类群、标本或现生序列集合。中等置信度仅适用于 Dromaeosaurid specimens reviewed and matrix-sampled by Turner et al.；更宽泛端点保持未声明。
  claim-statements.zh:
    - 驰龙科由 Turner 等人的标本综述和大型近鸟类形态矩阵表示；恢复的亚支系与不稳定类群是分析结果，不是已解决的祖先链或精确全球时长。
    - Dromaeosauridae 仅以 167–66 Ma 展示为综述所采样的侏罗纪—白垩纪包络，而非精确全球科级端点。该区间是来源限定的样本窗口，不是全球首现、末现、分化日期、连续占据或直接祖先断言。
