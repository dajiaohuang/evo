    facets:
      morphology:
        status: partially-supported
        claims:
          - text: The taxonomic account describes reticulated carapace markings and light-grey coloration in living Syspira longipes, and provides male and female specimen descriptions with measurements and reported within-sample variation. These are account-level characters and specimen observations, not estimates of all species variation.
            originalLanguage: en
            sourceIds:
              - valdez_jimenez_palacios_cardiel_2025
              - plazi_syspira_archive
            locator: Plazi description-extension row 7 (diagnosis), row 8 (description); treatment https://treatment.plazi.org/id/03B039019222AE2A88E7FE4973A12A48; original article p. 303; figures 1–30 and 65–66, DOI 10.11646/zootaxa.5722.3.1; archive SHA-256 8b095aa0880e8b281b2e1de8d903e854553f6118e917b786e512ef099a1b9f54.
            placeTimeScope: Species account on p. 303, with figures 1–30 and 65–66; morphology and measurements are limited to the specimens described in the 2025 treatment.
            lifeStatus: The description distinguishes live coloration from preserved specimen descriptions; no population-wide life-status or variation inference is made.
        gaps:
          - These are selected characters and descriptions from one taxonomic treatment, not a complete character matrix or assessment of variation across all populations. S. tigrina embolus and cymbial-groove statements conflict between diagnosis and description and are deliberately excluded from an unqualified claim.
      lifeHistory:
        status: not-assessed
        claims: []
        gaps:
          - No systematic reproductive, developmental, lifespan, or full behavioral life-history search was performed.
      ecology:
        status: partially-supported
        claims:
          - text: The authors report Syspira longipes from xeric areas of the Baja California Peninsula and list several microhabitats, including bare soil, fallen wood, leaf litter, gravel, cobbles, above-ground vegetation, beach areas, and sites near oases. This records the treatment's literature-based habitat observations, not an exclusive or complete niche.
            originalLanguage: en
            sourceIds:
              - valdez_jimenez_palacios_cardiel_2025
              - plazi_syspira_archive
            locator: Plazi description-extension row 10 (biology_ecology); treatment https://treatment.plazi.org/id/03B039019222AE2A88E7FE4973A12A48; original article p. 303; figures 1–30 and 65–66, DOI 10.11646/zootaxa.5722.3.1; archive SHA-256 8b095aa0880e8b281b2e1de8d903e854553f6118e917b786e512ef099a1b9f54.
            placeTimeScope: Natural-history account on p. 303; reported Baja California Peninsula microhabitats in the cited treatment and literature only.
            lifeStatus: Wild habitat observations as reported by the authors; cultivated, escaped, and unobserved populations were not assessed.
        gaps:
          - Evidence is limited to the treatment's reported microhabitats, activity statement, and cited pitfall-trap samples; interactions, seasonal ecology, environmental tolerances, and sampling completeness remain unassessed.
