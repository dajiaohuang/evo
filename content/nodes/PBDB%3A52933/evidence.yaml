  claims:
    - subjectId: taxon:pteranodontidae
      claimKind: scientific
      claimType: taxonomy
      statement: Pteranodontidae is represented by Kellner’s specimen-based reassessment and named taxonomic sample; the revised assignments and two new taxa are study-bounded and do not constitute a complete family-wide range audit or ancestor sequence.
      confidence: medium
      confidenceRationale: The paper directly compares named skulls, diagnoses and stratigraphic context across the pteranodontid sample. Medium confidence preserves competing genus and species interpretations and withholds family-wide endpoints.
      referenceLinks:
        - referenceId: kellner-2010-pteranodontidae
          relation: supports
          pages: 1063–1084
          figure: Figures 1–6
          quoteLocator: pp. 1063–1065 abstract and taxonomic scope; pp. 1067–1078 systematic descriptions; pp. 1079–1082 species recognition and stratigraphic discussion
    - subjectId: taxon:pteranodontidae
      claimKind: scientific
      claimType: fossil-range
      statement: Kellner’s specimen-based revision samples pteranodontids from Coniacian–Campanian Western Interior units, supporting an 89.8–80.5 Ma study window rather than a complete family range.
      confidence: medium
      confidenceRationale: "Pteranodontid specimens reassessed by Kellner 2010: the cited primary study or systematic review directly supports the stated sample, calibration or withholding boundary at the supplied locator. Confidence is medium and does not extend to a global FAD, LAD, direct ancestor or unsampled interval."
      referenceLinks:
        - relation: supports
          referenceId: kellner-2010-pteranodontidae
          pages: 1063–1084
          figure: Figures 1–6
          quoteLocator: Systematic descriptions and stratigraphic discussion, especially pp. 1067–1082
  claim-rationales.zh:
    - 论文直接比较无齿翼龙科取样中的具名头骨、诊断与地层背景。中等置信度保留竞争性的属种解释，并不推定科级端点。
    - Pteranodontid specimens reassessed by Kellner 2010：所引一手研究或高质量系统综述在给定页码、图表或章节处直接支持此处的样本、校准或暂缓边界。置信度为中等。该置信度不外推至全球首现、全球末现、直接祖先或未采样区间。
  claim-statements.zh:
    - 无齿翼龙科由 Kellner 基于标本的重新评估和具名分类样本表示；修订归属与两个新类群受研究范围限制，不构成完整科级范围审计或祖先序列。
    - Kellner 的标本修订采样西部内陆科尼亚克期至坎潘期的无齿翼龙科材料，支持 8980–8050 万年前的研究窗口，而不是完整科级延限。
