  claim-rationales.zh:
    - 痕迹化石与摄入骨骼直接支持食骨行为，而咬合力、压力与尸体处理性能依赖解剖重建和力学假设。
  claim-statements.zh:
    - 三角龙髂骨 MOR 799 上约八十处齿痕与粪化石 SMNH P2609.1 中的骨骼，直接记录啃骨与摄入；8,526–34,522 牛顿咬合力和齿压则是以 BHI 3033 及另六件成年头骨建立的肌肉—杠杆模型结果。
