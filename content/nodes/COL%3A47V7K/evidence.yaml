    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Slender shrub to 3 m. Leaves 3-pinnate, concolorous, usually bright green, occasionally glaucous, leaflets decreasingly pinnatisect, terminal lobe 2 or 3 times longer than adjacent lateral lobes, venation visible. Flowers yellow, in large, orbicular, compound umbels, > 30 rays. Fruit mostly rotund, < 4.5 mm long, mericarps dorsally compressed and slightly ribbed, marginally narrowly winged, homomorphic, vittae present, with additional rib vittae, rib oil ducts inconspicuous.
            sourceIds:
              - sanbi_14097_0
            locator: "SANBI/WFO archive Morphology row 9309; source 14097.0; publication: Magee, AR; Manning, JC; van Wyk, B-E; Tilney, PM. 2012. Apiaceae: Notobubon Magee. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 329 - 330. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Both this species and N. gummiferum are large shrubs or even small trees bearing shortly pedunculate, large and multiradiate primary umbels, and as such are easily distinguished from N. sonderi (see notes under the latter). It differs from N. sonderi and N. gummiferum in that the leaves are concolorous and the fruit smaller and more rotund, 3.0-4.5 (-5.0) mm long. It is often confused with N. ferulaceum but is easily distinguished by the shortly pedunculate, large and multiradiate primary umbel, the smaller, narrowly-winged fruit (broadly-winged in N. ferulaceum) and the ultimate leaflet segments with the terminal lobes 2-3 times longer than the adjacent lateral lobes. Notobubon tenuifolium differs from N. capense in having prominently pinnatisect ultimate leaflet segments with flat laminate lobes.
