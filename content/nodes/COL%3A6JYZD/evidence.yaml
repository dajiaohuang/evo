    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants mostly 150-240 mm high. Corm ovoid, symmetric, 5-8 mm diam.; tunics dark brown to blackish, imbricate, outer layers regularly notched below into sections. Stem sparsely ciliate, simple or 1-branched from axil of cauline leaf. Leaves 3, lower 2 basal, linear to sword-shaped, usually shorter than stem, 3-6 mm wide, apparently plane but margins with narrow, ascending wings ciliate along edges, main vein also slightly raised and winged, sparsely ciliate along edges, uppermost leaf cauline, sheathing for at least half its length. Spike flexed at base, 2- to 5-flowered, flexuose; bracts ± membranous, dry and pale brown above, outer 10-16 mm long, inner smaller than outer. Flowers zygomorphic with unilateral, decumbent stamens and style, shallowly cupped, white flushed mauve on reverse of outer tepals (often becoming pink or mauve with age); perianth tube funnel-shaped, 1.5-2.0 mm long; tepals narrowly obovate, 14-16 x 3-6 mm. Filaments unilateral, horizontal, unequal, two longer 5-7 mm long, shorter one ± 3 mm long; anthers 4.5-6.0 mm long, creamy white. Style dividing opposite upper 1/3 of anthers, branches 3-4 mm long. Capsules globose, ± 5 mm long.
            textZh: Geissorhiza nutans Goldblatt & J.C.Manning 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Morphology row 98526; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Previously included in Geissorhiza leipoldtii, largely due to the limited material then available, G. nutans is readily distinguished from that species by the somewhat smaller flowers with narrower tepals 14-16 x 3-6 mm long vs. 18-26 x 5-11 mm in G. leipoldtii and shorter, markedly unequal stamens. Vegetatively the two are almost indistinguishable, having sparsely and minutely ciliate stems, and three leaves, the lower two basal and the upper one cauline and largely sheathing and the leaf blades with narrowly winged, ciliate margins and main vein. The flowers are nodding with the stamens unilateral and horizontal to drooping with white anthers 4.5-6.0 mm long and the filaments are markedly unequal, the longer two 5-7 mm long and the shorter ± 3 mm long. Geissorhiza leipoldtii has larger, upright to half nodding flowers with tepals 19-26 mm long and stamens symmetrically arranged with anthers 7-8 mm long and filaments ± 7 mm long (or one up to 0.5 mm shorter). The differences in the filament length in G. nutans are striking, the upper filament about half as long as the lower two, thus unmistakable. The anthers and pollen of G. nutans are white whereas those of G. leipoldtii are bright yellow.
