        claims:
          - text: Herba perennis, dense caespitosa, glabra. Caules inferne vaginis atro-brunneis saepissime nitentibus haud fimbriatis vel cancellatis obtecti, teretes, graciles, usque ad 3.5 dm. alti, 0.75 mm. diametro, inter fere ad basem et bracteam haud nodosi. Folia basalia vel subbasalia, lamina angustissime lineari apice acuta usque ad 8 mm. longa sed saepe breviora 0.5 mm. lata subplana margine leviter serrulata, vagina clausa arta. Inflorescentia spiculis 1-5 instructa, circiter 1-2 cm. longa; bracteae foliis similes sed haud vaginatae, saepissime inflorescentia longiores. Spiculae 7-8 mm. longae, complanatae, sessiles vel pedunculo usque ad 2 mm. longo instructae. Glumae acutae, infimae 6-7 vacuae, 2-5 mm. longae, floriferae 6 mm. longae. Flos inferior hermaphroditus sed ovar o probabiliter infertile, superior hermaphroditus, staminibus 3, filamentis 4 mm. longis, ovario obovoideo 1 mm. alto 0.75 mm. diametro leviter complanato, stylo 4 mm. longo, ramis 2-3 stigmatosis circiter 4 mm. longis.
