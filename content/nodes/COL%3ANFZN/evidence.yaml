    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Bulbous geophyte, 50-100 mm tall. Leaves 3 or 4(5), dry at flowering, flat on ground, upper surface smooth. Flowers ± 4-19, widely spreading, tepals flared upwards or one remaining basal, pale pink with dark veins, stamens and style outspread, as long as the tepals. Capsule rounded, not ribbed.
            textZh: Brunsvigia comptonii W.F.Barker 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_14528_0
            locator: "SANBI/WFO archive Morphology row 32806; source identifier 14528.0; cited publication: Snijman, DA. 2013. Amaryllidaceae. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 33 - 42. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: B. comptonii is distinguished by the densely macropapillate upper surface of its few, small leaves, its small inflorescence with short pedicels, 10-25 mm, obsolete perigone tube, <0.5 mm long, and upwardly flared tepals, 15-27 mm long. Other features of the flower are variable. Plants from the inselbergs between Ghaamsberg and Pofadder have filaments that are more markedly declinate than elsewhere. Plants from northern Bushmanland and central Bushmanland also occasionally have translucent, lateral wings (up to 5 mm long) near the base of both filament whorls. These may be apically pointed or ± smoothly tapering towards the apex. In southern Bushmanland , near Langberg , in the Tanqua Karoo and near Matjiesfontein, appendages are occasionally present near the base of the filaments as minute, lateral thickenings.
            textZh: SANBI 条目提供了 Brunsvigia comptonii W.F.Barker 的鉴别特征。
            sourceIds:
              - sanbi_7635_0
            locator: "SANBI/WFO archive Diagnostic row 58115; source identifier 7635.0; cited publication: Snijman, DA. 2012. A revision of the Brunsvigia radula-group (Amaryllidaceae: Amaryllideae) of species in South Africa, including the description of Brunsvigia gariepensis a new species from Bushmanland in Northern Cape. S. African J. Bot. 79: 106 - 116. [Copyright held by the South African Association of Botanists (2012); http://www.sciencedirect.com/science/journal/02546299]. [CC BY]"
