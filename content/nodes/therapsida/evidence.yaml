        youngerMa: null
        note: This display is limited to the sampled diversification interval in that analysis, not the origin, survival or full duration of Therapsida; numerical stage conversions follow ICS v2026/06 where applicable.
      evidenceBasis: The early evolution of synapsids, and the influence of sampling on their fossil record directly anchors the sampled window; the display does not extrapolate it into a global taxon duration.
