    facets:
      morphology:
        status: partially-supported
        claims:
          - text: "Plants 3-11 cm tall. Corm ovoid-globose to somewhat depressed-globose, 60-110 mm diam., covered by fine, brown, fibrous tunics; fibres pectinate proximally and firmly attached to basal disc, reticulate in distal half, tips shortly acuminate; roots slender, mostly straight, arising from proximal half of corm. Cataphylls membranous, persisting as a dark brown, papery neck up to ca. 20 x 2-5 mm. Leaves 3-8, sheathing proximally up to ca. 30 mm from base, lowermost often spreading, uppermost suberect to slightly recurved, narrowly lanceolate, 50-120 x 2.7-5.0(-8.5) mm, shallowly carinate, grass green, thin-textured, margin minutely papillate. Inflorescences 2 or more in flower at a time, 1-flowered, slightly shorter to longer than leaves; scape 30-40 x 0.75 mm, subterete, pale green; bract 1, at most half-clasping pedicel base, linear-lanceolate, 7-8 x 0.2 mm, translucent to pale green, reddish near base. Flower pedicellate, stellate, yellow, rarely with a small greenish centre, backed with pale green in both whorls, unscented; pedicels suberect, subterete, 30-40 x ca. 0.75 mm, deflexed to spreading when fruiting, pale green, later tinged pale pink; tepals 6, sometimes slightly reflexed, narrowly elliptic-lanceolate to oblong- lanceolate, 6-7 mm long, outer 2.0-2.5 mm wide, mucronate apically; inner 1.5-2.0 mm wide. Stamens 6, subequal or outer sometimes slightly shorter than inner, suberect to slightly spreading, yellow; filaments inserted on ovary rim, outer 2.0-2.5 mm long, inner 2.2-3.5 mm long, slightly shorter to longer than anthers; anthers oblong, latrorse, 2.5-3.0 mm long, basal lobes up to 0.75 mm long, apex emarginate, yellow; pollen yellow. Ovary narrowly obconical, ca. 3.5 x 2.0 mm, 3-locular; style 2-3 mm long; stigma branches erect, slender, 1-2 x 0.7 mm long, ca. shorter than or equalling stamens, without basal lobes or rarely with 1 or 2 minute projections, yellow, papillose. Capsule obconical, 4 x 2 mm, dehiscence circumscissile. Seeds depressed ovoid, 0.5 mm diam., brownish, densely colliculate. Flowering period: March-April(-June)."
