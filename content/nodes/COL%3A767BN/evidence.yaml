          - text: This species is most similar to the Western Cape Pauridia aemulans, with which it shares a solitary-flowered inflorescence bearing a single, linear-lanceolate bract at the articulation between the scape and pedicel. P. pudica is distinguished by relatively thin-textured, carinate leaves, in which the epidermis appears honey-combed in dried specimens, and a style (2-3 mm long) which equals or exceeds the stigma branches (1-2 mm long). In contrast, the leaves in P. aemulans are canaliculate and the style is just 1.5-2.0 mm long and distinctly shorter than the stigma branches which are 3-4 mm long. When first collected by Winsome Barker and Joyce Lewis in 1952, the specimens were identified as P. ovata, presumably based on the one-flowered inflorescence and solitary bract. Nevertheless, P. ovata is characterized by a corm encircled by a mass of thickened roots, unlike the fibrous corm in P. pudica, which has spreading roots confined to the corm's base.
