        usage:
          title: Desmodium cajanifolium (Kunth) DC., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Herbs or shrubs, not much branched, 2-4 m high; stem terete, striate, densely uncinulate pubescent and pilose. Leaves trifoliolate, stipulate, short petiolate; stipules obliquely ovate, long attenuate, striate, ciliate, pilose and puberulent, early deciduous, ca. 4 mm long and 2 mm wide; petioles narrowly sulcate, densely uncinulate pubescent and pilose, 0.7-1 cm long; the leaf rachis similar, 0.6- 0.7 cm long; stipels lance attenuate, striate, ciliate, to 3.5 mm long; petiolules densely pilose to 2.5 mm long; leaflets narrowly ovate, obtuse and mucronate at the apex, cuneate to obtuse at the base, lustrous on the adaxial surface, pilose along the midrib and with scattered puberulence, duller and rather densely pilose abaxially; terminal leaflets 5-9 cm long, 1.6-3.3 cm wide, lateral leaflets 3.3-6 cm long, 1.3- 2.5 cm wide. Inflorescence terminal and axillary, racemose to racemose pani- culate, much branched and densely flowered; rachis somewhat angulate, uncin- ulate pubescent; bracts early deciduous, primary bracts ovate acumi- nate, striate, puberulent, ciliate, each subtending 2 pedicels, 2-3.5 mm long, 0.5- 1.5 mm wide; secondary bracts each subtending 1 pedicel (laterally), subulate, ciliate, to 1 mm long; pedicels slender, ascending, short spreading pilose, 5-6 mm long. Flowers with the calyx bilabiate, pilose and puberulent throughout, the teeth of both lobes ciliate; central tooth of lower lobe lanceolate to lance atten- uate, 3-4 mm long, lateral teeth acute to obtuse, 2.5-3.5 mm long, the upper lobe only slightly bifid, 2.5-3.5 mm long; petals, especially the standard, papillate, the standard obovate, retuse, narrowed to the cuneate base, 5.5-8 mm long, 2-3 mm wide, the wings oblong, auriculate, unguiculate, equalling standard in length and width (above claw), the keel petals obliquely oblong, long unguiculate, equalling standard in length, 1.5-2 mm wide. Loment to 6-articulate, stipitate, stipe pilose to 3.5 mm long, but not exceeding calyx, articles obtusely triangular, isthmi narrow and eccentric, margins pilose, surfaces uncinulate puberulent and pilose, 5-6 mm long, 4-4.5 mm wide; seed obtusely oblong, 2 mm long, 1.3 mm wide.
