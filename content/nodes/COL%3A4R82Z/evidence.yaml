    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Leaves in 3 or 4 pairs to a growth, spreading, 10-15 lines long, 4-5 lines broad at the middle, thence rapidly narrowing to an acute point, flat on the face, rounded on the back at the basal part and keeled and compressed at the apical part, and the keel in side view abruptly rounded into the apex, which has a recurved mucro, greyish-green, thickly marked with small, whitish pustules or raised dots, especially on the edges and keel; but the dots are sometimes greenish under cultivation. Flowers sessile or nearly so. Calyx produced above its union with the ovary so as to form with the concave top of the ovary a shallow cup, subequally 5-lobed above; two of the lobes acute and rather longer than the other three, which are obtuse, with whitish, membranous margins. Corolla 1 1/4-1 1/2 inch in diameter; petals in about 3 series, irregularly arranged and recurved, 6-8 lines long, 1/2-3/4 line broad, linear, very obtuse or subtruncate and toothed at the apex, yellow. Stamens erect in a cylindric mass, with the basal part partly hidden from view in the cup of the corolla which closely surrounds them, yellow, with darker yellow anthers. Stigmas 9 or 10, much shorter than the stamens and about 1 line long, subulate. Capsule 5-6 lines in diameter when closed, obconic, flattish-conical and with raised sutures on the top, with 9 or 10 valves and cells; valves reflexed when expanded, pallid within; expanding-keels closely contiguous for half their length then more or less diverging, dark brown, with broad, pallid, membranous marginal wings; cells roofed with membranous cell-wings, which in old cells become inrolled so as to appear as if incompletely covering the cells; no placental tubercle. Seeds nearly 1 line long, compressed-ovoid, microscopically tuberculate, dark brown.
            sourceIds:
