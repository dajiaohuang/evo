        usage:
          title: Ageratum conyzoides L., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Annual or short-lived perennial erect herbs or subshrubs to 1.5 m tall, sparingly branched; stems becoming brownish to slightly reddish, terete, slightly striate, usually fistulose, sparsely to densely long-pilose, usually also slightly puberulous. Leaves mostly opposite; blades ovate to broadly ovate, to 10 cm long and 7 cm wide, the base rounded to cuneate, strongly trinervate from the base, the margins usually crenate, the apex short-acute to narrowly rounded or obtuse, the upper sur- face dull green, sparsely long-pilose, the lower surface slightly paler green, promi- nently glandular-punctate, sparsely pilose on the veins and veinlets; petioles to 2.5 mm long. Inflorescence cymose to subcymose with compact corymbose to sub- umbellate branches, the branches somewhat densely puberulous with few to many longer hairs, the ultimate branches 3-10 mm long, often slightly enlarged distally. Heads ca. 4.0-4.5 mm high with ca. 50 florets; involucral bracts 25-30, eximbricate, in 2 series, mostly 3-4 mm long, oblong-lanceolate, prominently bicostate, with prominent antrorsely angular or lacerate scarious margins, the apex shortly to very sharply acute, usually not scarious near tip, the outer surface with usually few long hairs; receptacle naked; corolla white or blue, ca. 1.7 mm long, narrowly funnelform, with few hairs on the outer surface, the tube narrow, ca. 1 mm long, with scattered small short-stalked glands, the lobes 0.2-0.3 mm long, with papillae moderately developed inside, at tip and on margins, 1-2 hairs on outer surface; style branches extremely slender, sometimes short, with crowded blunt papillae
