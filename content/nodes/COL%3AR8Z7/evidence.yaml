    facets:
      morphology:
        status: partially-supported
        claims:
          - text: A perennial 12-17 cm tall, caespitose or forming loose tufts. Bladeless sheaths in new growth greyish brown, c. 2 cm. Stem terete, grooved, c. 0.8 mm in diameter, smooth, triquetrous below the inflorescense; several of the higher stem leaves subtending inflorescense branches. Leaves green, about as tall as stem; sheath scarious on one side, margin U-shaped, light brown ligule c. 0.25 mm; leaf blade straight or slightly falcate, acute, 1.5-2.5 mm wide; leaf margin flat, smooth, but apically ± triangular with barbs; adaxial sides of leaf papillose, abaxial side smooth. Inflorescence a panicle, topmost part of inflorescence c. 2.5-3.0 cm; brown, narrowly elliptic; lowermost lateral branches 10-13 mm long, narrow, with 2-1 tristigmatic basal female flowers and with several male flowers at top. Subtending bracts of lateral inflorescence branches long, the lowermost up to 3 cm long, setaceous. Bracts brown, acute, 3-4 mm long, middle vein green, margins widely scarious, equal in length with the utricle. Utricles 3.5-4.0 x 0.7-0.8 mm, with a very short stipe (c. 0.3 mm), beak not clearly delimited, brown, c. 0.8 mm, apex with scarious margins; body of the utricle green, more conspicuously veined abaxially, mouth cleft on adaxial side, wide. Rhachilla green, with barbed margins, two veins, and a scale on its tip, slightly longer than the nutlet. Nutlet (not completely mature) narrowly oblong, trigonal, 2.5-2.8 x c. 0.6 mm.
