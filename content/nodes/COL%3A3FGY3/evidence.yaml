    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte to 15 cm, tunics woody, concentric, stems usually simple. Leaves linear, margins and central vein thickened and winged, wing edges ciliate, viscid with sand adhering. Flowers in a 7-10-flowered spike, pink, stamens symmetrically arranged.
            textZh: Geissorhiza helmei Goldblatt & J.C.Manning 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 6834; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: In its general aspect Geissorhiza helmei recalls species of sect. Engysiphon, most members of which have fairly large corms with concentric tunics that fragment into sections that taper above into short bristles, and a single long basal leaf, always with thickened and winged margins and central vein, and with the surface of the margins glandular and with sand adhering to them. It and G. adriaani stand out in the section in having actinomorphic flowers, whereas other species have zygomorphic flowers with decumbent stamens and style. Most other members of the section also have flowers with a longer perianth tube although G. brevituba has a short tube, ± 8 mm long, thus comparable to the tube of G. helmei, ± 6 mm long. Geissorhiza brevituba, also endemic to the Piketberg, has larger flowers with tepals 25-30 mm long and spikes typically with only one to three flowers with the style dividing well beyond the anther tips. The main spikes of G. helmei have up to 10 flowers with tepals ± 10 mm long.
            textZh: SANBI 条目提供了 Geissorhiza helmei Goldblatt & J.C.Manning 的鉴别特征。
            sourceIds:
