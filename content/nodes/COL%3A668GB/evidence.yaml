    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Trees 2-4(-10) m tall; stems simple. Leaves 40-50, arcuate-incurved to spreading or slightly recurved with age, 750-1500 x 75-250 mm, channelled to D-shaped in section, glaucous, usually with irregular prickles on both surfaces, these normally fewer on upper surface. Inflorescence of spreading to rarely erect, usually secund, rarely cylindric racemes, with up to 30 branches; bracts ovate-acute, 4-9 x 2-5 mm, 3-5-nerved. Flowers yellow to red in bud, yellow to orange at flowering, cylindric to ventricose, 22-35 mm long; outer segments connate for one third to half their length, inner segments adnate to outer in basal third; pedicles 3-5 mm long. Anthers exserted 8-20 mm. Ovary 5.0-9.0 x 1.5-5.0 mm, green; style exserted 6-20 mm. Fruit 19-21 x 10-12 mm, grey.
            textZh: Aloe marlothii A.Berger 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_5961_0
            locator: "SANBI/WFO archive Morphology row 49064; source identifier 5961.0; cited publication: Glen, HF; Hardy, DS. 2000. Aloe. In: G Germishuizen & E du Plessis (eds), Aloaceae (first part), Fl. S. Africa 5(1,1): 1 - 167. National Botanical Institute, Pretoria. [http://www.biodiversitylibrary.org/item/209564#page/3/mode/1up]. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: This species and A. mawii are the only arborescent members of this section. In A. marlothii the inflorescence is a much-branched panicle with up to 30 racemes of orange to yellow flowers subtended by bracts 4-9 mm long. In A. mawii the inflorescence is a simple raceme of red to orange flowers subtended by minute bracts no more than 1 mm long. The leaves of A. excelsa are slightly shorter, narrower and more spreading than those of A. marlothii, tend to be slightly more purplish in colour when affected by cold, and have somewhat inrolled margins.
            textZh: SANBI 条目提供了 Aloe marlothii A.Berger 的鉴别特征。
            sourceIds:
              - sanbi_5961_0
            locator: "SANBI/WFO archive Diagnostic row 51302; source identifier 5961.0; cited publication: Glen, HF; Hardy, DS. 2000. Aloe. In: G Germishuizen & E du Plessis (eds), Aloaceae (first part), Fl. S. Africa 5(1,1): 1 - 167. National Botanical Institute, Pretoria. [http://www.biodiversitylibrary.org/item/209564#page/3/mode/1up]. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: In its diverse geographical stations, A. marlothii is variable in shape, size and colour of flowers, also in the angle of the racemes. In the form most typical of the species, the racemes are horizontally disposed; in some localities the racemes are sub-oblique, but never erect. A. marlothii is nearest allied to A. spectabilis, and the two can hardly be distinguished in general habit of growth, tall stem bearded with old dry leaf remains, and large rosettes with copiously spiny leaves. The difference between them lies in the inflorescence and flowers. In A. marlothii the racemes are 30-50 cm long, horizontally disposed (or almost so) with the flowers secund, grouped along the top of the branch and all pointing towards the base of their branch; in A. spectahilis the racemes are mostly 25 cm long, erect or sub-erect, and with the flowers more or less evenly distributed around the axis. There are also marked differences in the flowers. In A. marlothii the flowers are larger and broader, 30-35 mm long, with the inner segment apices deep purple; in A. spectahilis the flowers are more slender, and slightly smaller, with the inner segment apices glossy black, almost as if an artist had tipped them with black enamel. Another interesting difference is that in A. marlothii the exserted portion of the filaments is deep purple, whereas in A. spectahilis they are orange-coloured. A. marlothii is a striking and remarkable species, readily recognised by its large panicle of horizontal racemes.
