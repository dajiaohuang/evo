          originalSourceText: Herb, 20-60 cm tall, unbranched or sparingly branched; stemn terete at the base, becoming 4-angulate above, inconspicuously winged. Leaves considerably exceeding the internodes; the lamina narrowly ovate to ovate-elliptic, acuminate to subacute at the apex, gradually attenuate and amplexicaul at the base, charta- ceous, with 3(-5) strongly ascending inconspicuous veins. Flowers in dense, axillary, verticillate clusters, usually 4-8 flowers per cluster, 6-8 mm long, white, sessile, bracteate, the bracts linear, 4-6 mm long; calyx 4-6 mm long, urceolate, the lobes subulate to narrowly linear-lanceolate, 2-4 mm long, flaring to re- curved at the apex, the margins membranous; corolla 6-8 mm long, ? infundib- ular, white or yellow, the lobes ovate, narrowly acute at the apex, 1.5-2 mm
