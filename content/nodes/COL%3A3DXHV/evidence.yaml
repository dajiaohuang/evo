    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Shrub or dwarf shrub, up to 1.5 m tall. Leaves alternate, elliptic to obovate, cuneate, dentate, hairy and occasionally glandular-pubescent, petiolate or subsessile, becoming smaller, entire and lanceolate above. Flowerheads radiate, solitary, pedunculate; involucral bracts in 3 or 4 rows, imbricate, hairy and glandular pubescent; ray florets blue-purple; disc florets yellow. Cypselas with long hairs; pappus bristles similar and equally long.
            sourceIds:
              - sanbi_14776_0
            locator: "SANBI/WFO archive Morphology row 30957; source 14776.0; publication: Herman, PPJ. 2013. Asteraceae: Felicia. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 290 - 293. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: F. brevifolia ist eine relativ variable Sippe, wobei hauptsächlich Blattgrösse und -form variieren sowie die Behaarung von Pflanze zu Pflanze wechseln kann. Pflanzen bei denen die Achänen stärker verkahlt sind, wurden als ‘Aster grossedentatus’ beschrieben, können jedoch, da der Behaarungsgrad nicht fixiert ist, nicht gesondert behandelt werden. Ebenso sind die Pflanzen mit auffälliger filziger Behaarung -als F. dregei ? dentata zuerst von DE CANDOLLE unterschieden - nicht als eigene Sippe zu betrachten. Alle Behaarungstypen treten nebeneinander auf und sind mit keinem weiteren Merkmal korreliert.
            textZh: SANBI 条目提供了该种的鉴别特征。
            sourceIds:
              - sanbi_3197_0
            locator: "SANBI/WFO archive Diagnostic row 76919; source 3197.0; publication: Grau, HRJ. 1973. Revision der gattung Felicia (Asteraceae). Mitt. Bot. Staatssamml. München 9: 195 - 705. [All rights reserved]"
