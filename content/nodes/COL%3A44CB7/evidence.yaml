    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, 150-400 mm tall, mostly branching above. Leaves 3 or more, linear, channelled, glaucous. Flowers enclosed in green spathes, pale yellow, tepals with short, clasping claws, limbs spreading, filaments in a slender column, style branches with short, erect crests. Mostly Aug.-Sept.
            textZh: Moraea schlechteri (L.Bolus) Goldblatt 的 SANBI 物种条目记载了植株、叶片和花部形态。
            sourceIds:
              - sanbi_14562_0
            locator: Strelitzia 30; archive Morphology row 33313, source 14562.0
            placeTimeScope: Regional species account published 2013; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
          - text: Evidently one of the least specialised species of subg. Homeria, Moraea schlechteri has several foliage leaves, the lower longest, but even those on the upper nodes normally have expanded blades. The flowers are pale yellow and have small darker yellow nectar guides on all tepals, these with short, poorly differentiated claws ± 1 mm long. The filaments are united in a slender column but are free in the upper 0.5-1.0 mm, and the well-developed style branches are slightly wider than the anthers and have prominent crests 2 mm long. Closely related M. knersvlaktensis has a similar vegetative form, though with broader, undulate leaves, the lowermost inserted well above the ground and even the outer rhipidial spathes are somewhat leafy, sheathing the inner spathes only in the lower half. The flowers of the two species are structurally nearly identical but the nectar guides are more prominent in M. knersvlaktensis, the tepals claws 2 mm long, and the filament column sparsely and shortly hairy. Both M. schlechteri and M. knersvlaktensis have morning flowers that fade soon after midday.
            textZh: SANBI 条目提供了 Moraea schlechteri (L.Bolus) Goldblatt 的鉴别特征。
