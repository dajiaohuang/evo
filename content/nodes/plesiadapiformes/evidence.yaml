  claims:
    - subjectId: taxon:plesiadapiformes
      claimKind: scientific
      claimType: taxonomy
      statement: The primate-origins synthesis treats Plesiadapiformes as a diverse Paleogene assemblage whose relationship to crown Primates remains central and contested; the atlas label is not a claim that all included families form one crown-primate ancestor group.
      confidence: medium
      confidenceRationale: A systematic review supports the diversity and competing membership hypotheses. The statement preserves disagreement instead of selecting one ancestry narrative.
      referenceLinks:
        - relation: supports
          referenceId: silcox-lopez-torres-2017-primate-origins
          pages: 113–137
          quoteLocator: Plesiadapiform relationships; definition and diagnosis of Primates
    - subjectId: taxon:plesiadapiformes
      claimKind: scientific
      claimType: fossil-range
      statement: plesiadapiformes is displayed at 66–34 Ma only as the review's heterogeneous sampled assemblage, not a monophyletic crown-primate range. The interval is a source-bounded sample window, not a global FAD, LAD, divergence date, continuous occupancy claim or direct-ancestor assertion.
      confidence: medium
      confidenceRationale: plesiadapiformes uses Silcox, M.T.; López-Torres, S. (2017) because the cited pages and locator expose the sampled taxon, specimen or living sequence set. Confidence is medium and applies only to Paleogene plesiadapiform record synthesized by Silcox and López-Torres; broader endpoints remain unclaimed.
      referenceLinks:
        - relation: supports
          referenceId: silcox-lopez-torres-2017-primate-origins
          pages: 113–137
          quoteLocator: Plesiadapiform relationships; definition and diagnosis of Primates
        - relation: contextualizes
          referenceId: ics-2026-06
          pages: International Chronostratigraphic Chart v2026/06
          figure: Global chronostratigraphic scale
          quoteLocator: Numerical boundaries for named geological stages used to bound the source sample
  claim-rationales.zh:
    - 系统综述支持多样性及相互竞争的成员假说；表述保留分歧，而非选择一种祖先叙事。
    - plesiadapiformes 采用 Silcox, M.T.; López-Torres, S.（2017）的论文，因为所引页码与定位符直接标示了研究采样的类群、标本或现生序列集合。中等置信度仅适用于 Paleogene plesiadapiform record synthesized by Silcox and López-Torres；更宽泛端点保持未声明。
  claim-statements.zh:
    - 灵长类起源综述把 Plesiadapiformes 视为一个多样的古近纪组合，其与冠群灵长类的关系仍属核心争议；图谱标签并不主张所有所含科构成一个冠群灵长类祖先群。
    - plesiadapiformes 仅以 66–34 Ma 展示为综述所采样的异质组合，而非单系冠群灵长类范围。该区间是来源限定的样本窗口，不是全球首现、末现、分化日期、连续占据或直接祖先断言。
