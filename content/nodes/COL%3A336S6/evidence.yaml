        usage:
          title: Cymbopetalum brasiliense (Vell.) Benth. ex Baill., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: A small tree with shortly puberulous branchlets, soon glabrescent. Leaves on petioles 3-4 mm. long, membranaceous, glabrous and densely pellucid-punctate, obovate, oblanceolate, or lanceolate-elliptic, cuneate-angustate toward the base, 15-30 cm. long and 6-10 cm. broad. Pedicels 5-9 cm. long, glabrous. Sepals con- nate at the base, rounded-reniform, obtusely acuminate, 4-6 mm. long and 6-9 mm. broad. Petals tomentellous on both sides, the outer ovate or rotundate, flat, 2.0-2.5 cm. long and 2-3 cm. broad, the inner thick, rounded-elliptic, obtuse, 2.5 -3.5 cm. long and 1.8-2.3 cm. broad, the margins involute. Stamens 4.0-4.5 mm. long. Monocarps numerous, oblong-cylindric, and more or less curved, torulose, rounded at both ends, up to 3.5 cm. long and 1.5 cm. broad. Seeds up to 6, but generally fewer.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 541
          archiveSourceId: null
