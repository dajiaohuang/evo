          - text: Tufted annual or weak perennial up to 900 mm high; sometimes stoloniferous; culms decumbent, rooting at the lower nodes. Leaf blade 60-120 x 10-25 mm, broadly lanceolate, apex acuminate, base cordate; margins scaberulous; cross-veins conspicuous. Inflorescence 100-350 mm long, open; pedicel up to 25(35) mm long.Spikelet 7-15 mm long; anther up to 1.5 mm long.
