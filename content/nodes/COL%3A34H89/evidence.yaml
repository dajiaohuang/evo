          - text: "Glaberrimum, 10-12 cm. altum; rami decumbentes, sat rigidi, albidi, ad 3 mm. diam., internodiis 1.5-2 cm. longis; folia fere erecta, nunc fere semi-teretia acuta, nunc obtuse carinata, supra plana, obtusa, abrupte inconspicueque apiculata, levia, sat luteo-viridia, 1.5-2 cm. longa, saepius ad 3 ram. lata diametroque; flores diurni. petalis saepius in calyce subinciusis, 3-nati vel rarius 2-ternati: pedunculi intermedii bracteati, ad 8 mm. longi, laterales medio bracteati, ad 5 mm. longi; sepala acuminata, 3 longiora ad 8 mm., post anthesin valde accrescentia ad 1.3 cm., longa, breviora 2, ad 5 mm. longa, late membranaceo-marginati; petala 2-seriata, inferne parum angustata. obtusa vel minute denticulata, purpurea, 7-8 mm. longa, ad 1 mm. lata: filamenta alba, interiora medio longe papillata, ad 3 mm. longa, staminodiis ad 4.5 mm. longis, antheris pallidis; glandulae 5, fere contiguae, conspicue crenulatae; ovarium supra medio elevatum; stigmata anguste subulata, acuminata, fere ud 2 mm. longa; capsula 7 mm., vel expansa 1.1 cm., diam., loculis alis angustis onustis, alis in medio stellatim positis, baud tegeutibus semina ovalia, pallide brunnea, minute areolata."
