    facets:
      morphology:
        status: partially-supported
        claims:
          - text: "Annuals up to c. 0.16 m. Capitula globose, light to dark brown and shiny, c. 4 mm in diam., with ovate involucral and floral bracts; receptacle cylindrical with long fine silky hairs. Female flower: sepals 2, linear, c. 2-3 mm long, dark, glabrous; petals 3, narrowly spathulate, white with a black spot at apex, margin with long cilia; ovary sessile, 3-locular, style with 3 stigmas. Male flower: sepals 2, free, broadly linear-acuminate, dark; petals white with an apical gland; stamens 4, anthers black. Capsule 3-locular; testa of seed with c. 8 longitudinal ridges."
