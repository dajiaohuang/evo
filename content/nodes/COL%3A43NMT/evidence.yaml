    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Annual herb, up to 0.6 m high; stems erect or ascending, mostly unbranched. Leaves up to 30 x 3 mm, linear to lanceolate or elliptic, ± sessile, entire. Flowers in a loose raceme or lower ones single and axillary. Calyx 5-lobed; lobes narrowly linear, of unequal length, longest equal to or overtopping corolla tube. Corolla 7-9 mm long, bilabiate; tube ± cylindrical, mouth wide but not gaping; pale or reddish pink to mauve with darker veins, throat with long yellow hairs. Flowering time Apr., Sept. Fruit an ovoid capsule, opening with 2 terminal pores.
