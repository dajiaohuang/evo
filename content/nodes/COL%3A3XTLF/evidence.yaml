    sourceDatasetId: "2144"
    identity:
      method: Exact COL26.8 dataset 316115 nameusage search for Mandrillus leucophaeus returned the single accepted species usage 3XTLF, source checklist 2144. The pinned release search registry confirms the verbatim name and authorship, rank, accepted status, and classification; every parent was then resolved by id in its pinned hierarchy registry.
      scope: The dossier describes the nominal accepted COL26.8 species usage 3XTLF. The biological claim is limited to one observed behavior case in a captive-born zoo group and is not generalized to wild drills or the species as a whole.
      sourceIds:
        - col
    lifeStatusScope:
      wild: No wild-born animals were studied. The sole reported case involved a captive-born drill group at Safari Park Dvůr Králové, Czech Republic; observations were made August–October 2020.
      domesticated: Domestication has not been assessed. The observed animals were captive-born zoo residents, which is not evidence of domestication.
      fossil: Fossil occurrence has not been assessed.
