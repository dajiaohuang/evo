          attribution: Casetta G, Nolfo AP, Palagi E (2023). Record of thanatology and cannibalism in drills (Mandrillus leucophaeus). Primates 64(5):475–481. https://doi.org/10.1007/s10329-023-01075-8. Claims paraphrased.
    facets:
      morphology:
        status: not-assessed
        gaps:
          - Morphology and diagnosis were not assessed in the selected behavioral observation.
      lifeHistory:
        status: not-assessed
        gaps:
          - One infant-death case does not assess typical reproduction, development, lifespan, or life-history variation.
      ecology:
        status: partially-supported
        claims:
          - text: In one captive-born drill group, the mother continued post-mortem care of her infant for about two days and then consumed the corpse; no sharing with other group members was observed. This is a single zoo observation, not evidence that the behavior is typical of drills. The authors could not determine motivation or potential benefits and did not exclude a role for captivity.
            sourceIds:
              - casetta2023
            locator: Abstract; Methods, Study group and Behavioral observations; Results, post-mortem and post-mortem cannibalism phases; Discussion.
            placeTimeScope: Safari Park Dvůr Králové, Czech Republic; one captive-born group observed August–October 2020. The reported infant survived eight days after birth.
            lifeStatus: Captive-born zoo group; no wild-born subjects or field observations in this case.
            originalLanguage: en
        gaps:
          - One captive group and one infant-death event cannot establish the frequency, causes, or species-wide pattern of social and post-mortem behavior, especially in wild groups.
      evolution:
        status: not-assessed
        gaps:
          - No phylogenetic, population-genetic, or comparative evolutionary analysis was conducted.
      distribution:
        status: not-assessed
        gaps:
          - A single zoo group does not provide geographic occurrence or range evidence.
      fossil:
        status: not-assessed
        gaps:
          - No fossil or paleontological evidence was assessed.
      conservation:
        status: not-assessed
        gaps:
          - The captive behavioral observation is not a conservation assessment, population trend, or viability estimate.
