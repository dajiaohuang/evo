    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Erect or straggling, innocuous, pale yellow-green, hard suffrutex up to ±1 m high with stout basal stems and lax divaricate branches, often entangled above. Rhizome and roots not seen. Stems minutely and densely striate-papillate, glabrous with age. Branches and branchlets laxly spreading or deflexed, occasionally clustered on a swollen node. Spines absent or poorly developed at base of stem. Cladodes in fascicles of 2-6, filiform, variable in size, up to 25 mm long, deciduous. Flowers appearing before or contemporary with cladodes, few to several in terminal umbels on short branchlets, occasionally some on the peduncle below; tepals ±3 mm long, cream with a green keel; stalk ±3-7 mm long, articulated near the base, occasionally with 2 nodes. Stamens with yellow or orange anthers. Ovary with ±6 ovules per locule; globose, brown; style and stigmatic branches short. Berry ±10 mm in diameter, blue to black.
