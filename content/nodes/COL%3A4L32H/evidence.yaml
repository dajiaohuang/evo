        claims:
          - text: Glandular-hairy annual to 13 cm. Leaves broad and coarsely toothed. Flowers few in lax racemes, often small and autogamous, cream-coloured with yellow patch at base of upper lobes, flushed purple on back and on tube, salver-shaped, tube hairy, 7-16 mm long.
            sourceIds:
