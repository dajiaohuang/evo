            locator: "SANBI/WFO archive Morphology row 5888; source 14442.0; publication: Manning, JC; Goldblatt, P. 2012. Scrophulariaceae: Polycarena Benth. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 752 - 752. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: The specific epithet, aemulans, draws attention to the close resemblance of this species to P. exigua. It is particularly those plants with the smallest flowers and reduced stamens that resemble P. exigua, but they can at once be distinguished by the corolla tube, pubescent and purplish in P. aemulans, glabrous or nearly so in P. exigua and drying ochre-yellow (white when fresh?). The flowers of P. aemulans resemble those of P. gilioides in both pubescence and colouring. However, the limb is mostly smaller in P. aemulans (3-9 mm across the lateral lobes versus mostly 7.5-11 mm), the upper lip only is bearded in the larger flowers (not bearded all round the mouth) and the capsules are smaller (3-3.5 mm long versus 5-6 mm). The two species differ markedly in foliage, the leaves of P. aemulans being broad in relation to their length (spathulate, mostly 1-3 mm broad), those of P. gilioides narrow (linear, mostly 0.5-1 mm broad; the 2-4 lowermost leaves should be ignored as they are broad in many species of Polycarena). Plants of P. gilioides look leafier than those of P. aemulans because of the presence of dwarf axillary shoots (absent in P. aemulans).
