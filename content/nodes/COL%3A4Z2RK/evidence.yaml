        usage:
          title: Sphyrospermum buxifolium Poepp. & Endl., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Epiphytic or terrestrial shrublets mostly 1.5-4 dm tall; branches slender, pen- dent to ascendent, glabrate; branchlets brownish and minutely pale puberulous, glabrescent. Leaves coriaceous, suborbicular to oblong ovate, (7-) 9-15 ( -18) mm long, 8-20 mm wide, basally subcordate or rounded, apically rounded or obtuse, marginally entire and slightly recurved, sparsely and inconspicuously pilosulose on both the surfaces but becoming glabrate, also usually inconspic- uously glandular strigillose beneath, obscurely 3- to 5-nerved from the base, the veins flush with the surface or slightly raised, obscurely reticulate above; petioles ca. 1 mm long, puberulous to glabrate. Pedicels glabrous to sparingly pilose, slightly and gradually swollen distally, (5-)10-18 mm long. Flowers with the hypanthium pilose to glabrate, subglobose, 1-1.5 mm in diameter; calyx limb suberect, short, ca. 0.5 mm long including the lobes, the lobes 4, apiculate and separated by rounded sinuses with a tuft of pilosulose trichomes or glabrous; corolla white to pinkish, submembranous, 4-6 mm long, 1-1.5 mm in diameter, sparsely pilose to glabrous, the corolla lobes 4, narrowly triangular, minute, 0.8-1 mm long; stamens 4, equal, slightly shorter than the corolla, the filaments either sparsely villose or glabrous, 1.8-3 mm long, the anthers smooth, 1.8-2.5 mm long, the tubules about as long as the thecae. Berry subglobose, pilose or glabrous, 4-6 mm in diameter, succulent and whitish with a violet or lavender tinge.
          originalLanguage: en
          sourceField: general
