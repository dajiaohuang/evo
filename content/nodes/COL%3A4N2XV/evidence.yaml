        claims:
          - text: Shrub to 4 m. Leaves ovate-obovate, glabrescent, glaucous. Flower heads bowl-shaped, 20-25 mm diam., involucral bracts pink or white, silky and fringed, style ± 50 mm long.
            sourceIds:
              - sanbi_14383_0
            locator: "SANBI/WFO archive Morphology row 5584; source 14383.0; publication: Manning, JC; Goldblatt, P. 2012. Proteaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 657 - 681. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Populations on moister sites such as those in the Tulbagh and Riviersonderend mountains, produce larger, more robust leaves, rather similar to the foliage of P. lacticolor. However, when in bloom, P. punctata is unmistakable as the involucral bracts of each flower-head spread outwards almost at right angles to the bud position, leaving the floral parts apparently everted and the whole flower-head having a water lily-like form. The species' most reliable diagnostic character is that the pollen presenters are uniformly filiform with no trace of an apical swelling. Moreover, in the fruiting stage the filiform pollen presenters turn outwards and curl over.
            textZh: SANBI 条目提供了该种的鉴别特征。
