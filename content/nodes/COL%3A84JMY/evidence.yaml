records:
  atlas-node:
    name: Calcarea
    commonName: Calcareous Sponges
    commonNameZh: 钙质海绵
    rank: class
    taxonId: txn:3603
    firstAppearance: 535
    lastAppearance: 0
    extinct: false
    entityKind: taxon
    contentLevel: dossier
    parentRelationshipKind: navigation-parent
  claims:
    - subjectId: taxon:calcarea
      claimKind: scientific
      claimType: morphology
      statement: Calcarea build calcite spicules and exhibit varied aquiferous-system organization; Voigt and colleagues illustrate asconoid, syconoid, sylleibid and leuconoid examples, rather than one body plan shared unchanged by every species.
      confidence: high
      confidenceRationale: The paper explicitly describes calcite spicules and illustrates contrasting aquiferous systems in named examples; no single illustrated organization is generalized to every species.
      referenceLinks:
        - referenceId: voigt-2012-calcarea-phylogeny
          relation: supports
          figure: Figure 1
          quoteLocator: Introduction; The aquiferous system of Calcarea; Figure 1 caption
    - subjectId: taxon:calcarea
      claimKind: scientific
      claimType: topology
      statement: Expanded ribosomal-gene sampling rejects several traditional internal Calcarea groups and tests character evolution; the recovered trees are sample-dependent and do not date the class.
      confidence: medium
      confidenceRationale: The study explicitly compares classifications against molecular trees, while marker and taxon sampling limit deep resolution.
      referenceLinks:
        - referenceId: voigt-2012-calcarea-phylogeny
          relation: supports
          pages: e33417
          quoteLocator: Figures 1–7; phylogenetic tests and character reconstructions
    - subjectId: taxon:calcarea
      claimKind: scientific
      claimType: fossil-range
      statement: "Calcarea has no supported scalar temporal range in the cited evidence: the sampled extant phylogeny does not establish a 535 Ma fossil occurrence or crown boundary, so the former 535–0 Ma display is withheld."
      confidence: low
      confidenceRationale: Voigt et al. (2012) directly supports relationships among sampled living Calcarea, not a fossil-age boundary. Low confidence records the absence of range-fit support for 535 Ma.
      referenceLinks:
        - relation: supports
          referenceId: voigt-2012-calcarea-phylogeny
          pages: Article e33417
          figure: Figures 1–7
          quoteLocator: Extant sampling, phylogenetic tests and character reconstructions
  claim-rationales.zh:
    - 论文明确描述了方解石骨针，并以具名实例展示不同水沟系；未将其中任何一种组织方式推广至所有物种。
    - 研究明确以分子树检验分类方案，但标记与类群取样限制了深层解析度。
    - Voigt 等（2012）直接支持所采样现生钙质海绵的关系，而非化石年代边界。低置信度表示 535 Ma 缺少适合范围用途的证据。
  claim-statements.zh:
    - 钙质海绵形成方解石骨针，水沟系组织方式多样；Voigt 及同事展示了 asconoid、syconoid、sylleibid 和 leuconoid 等类型的实例，而非所有物种均以不变形式共享的一种体制。
    - 扩展的核糖体基因取样否定了若干传统钙质海绵内部类群并检验性状演化；所得系统树依赖样本，不能为该纲定年。
    - 现有引证不支持 Calcarea 的单一时间范围：现生样本系统树不能确立 535 Ma 化石出现或冠群边界，因此旧有 535–0 Ma 展示被暂缓。
  ranges:
    - entityId: calcarea
      rangeKind: global-composite
      taxonomicConcept: Crown Calcarea temporal range
      geographicScope: Temporal interval pending fossil-range evidence
