  claims:
    - subjectId: taxon:papio_anubis
      claimType: taxonomy
      claimKind: scientific
      statement: COL26.8 dataset 316115 records accepted species usage 6TM9B as Papio anubis (Lesson, 1827), with Papio usage 6DGR as its immediate parent. This records checklist identity and classification only.
      confidence: medium
      confidenceRationale: The pinned accepted usage and immediate parent are explicitly recorded in COL26.8. This statement is limited to checklist identity and classification.
      referenceLinks:
        - referenceId: col-2026-checklistbank-316115
          relation: supports
          pages: Accepted species usage 6TM9B; immediate parent Papio usage 6DGR; parent chain through Papionini L4C and Primates 3W7
    - subjectId: taxon:papio_anubis
      claimType: biogeography
      claimKind: scientific
      statement: The selected studies sampled a captive cohort at the CNRS Primatology Station in Rousset-sur-Arc, France, wild baboons at Gombe National Park, Tanzania, and road-transect populations at Lake Manyara National Park, Tanzania. These study locations do not define the species’ geographic range.
      confidence: high
      confidenceRationale: Each cited primary study directly identifies its sampled location and captive or wild study status. The statement explicitly does not infer a geographic range.
      referenceLinks:
        - referenceId: druelle-2017-olive-baboon-growth
          relation: supports
          quoteLocator: Materials and methods, Study site and subjects
        - referenceId: bailey-2021-gombe-baboon-reproduction
          relation: supports
          quoteLocator: Methods, Study area and population
        - referenceId: kiffner-2022-lake-manyara-baboon-distance
          relation: supports
          quoteLocator: Methods, Study site
    - subjectId: taxon:papio_anubis
      claimType: morphology
      claimKind: scientific
      statement: In a seven-year longitudinal study of 14 female and 16 male captive olive baboons at the CNRS Primatology Station in Rousset-sur-Arc, France, measured size and shape were similar at birth; later differences in growth rate and duration produced substantial size differences while measured body shape remained similar. This result is limited to that cohort, not wild populations.
      confidence: medium
      confidenceRationale: The source describes its captive cohort, seven-year longitudinal design, measured segment morphometrics, and age- and sex-related results directly. The conclusion is restricted to that cohort.
      referenceLinks:
        - referenceId: druelle-2017-olive-baboon-growth
          relation: supports
          pages: Abstract; Materials and methods, Study site and subjects; Results, Changes in morphotypes with age; Discussion, Sex-related differences
    - subjectId: taxon:papio_anubis
      claimType: ecology
      claimKind: scientific
      statement: At Lake Manyara National Park, Tanzania, road-transect distance sampling from 2011–2019 produced an abundance estimate more than three times the upper-limit estimate derived from sleeping-site counts and average group size. The authors identify baboons’ use of roads as a possible source of bias and caution against inferring density from constrained road transects; this is a site- and method-specific result, not a species-wide density estimate.
      confidence: medium
      confidenceRationale: The paper reports the survey years, constrained road design, sleeping-site comparison, and possible road-use bias. It reports poor detection-model fit, so this selected result remains method- and site-specific.
      referenceLinks:
        - referenceId: kiffner-2022-lake-manyara-baboon-distance
          relation: supports
          pages: Abstract; Methods, Line distance surveys and abundance maximum; Results and Discussion; Tables 1–3
    - subjectId: taxon:papio_anubis
      claimType: ecology
      claimKind: scientific
      statement: In Gombe National Park, Tanzania, records from 1972–2002 covered 732 pregnancies among 175 females of known rank, including 65 miscarriages. In a time-dependent analysis, higher-ranking pregnant females exposed to immigrant males that reached top rank within a year had higher miscarriage hazards outside drought conditions; the rank pattern largely disappeared when two-year mean rainfall was below about 1,100 mm. Exposure to new immigrants overall did not show the same association. This conditional result from one wild population is not a species-wide rate or proof of deliberate male-caused pregnancy loss.
      confidence: medium
      confidenceRationale: The primary study reports the Gombe observation period, pregnancy sample, rank and rainfall interaction, and difference between rapid-rising males and immigrant males overall. It is observational and conditional; it does not show a species-wide rate or prove deliberate causation.
      referenceLinks:
        - referenceId: bailey-2021-gombe-baboon-reproduction
          relation: supports
          pages: Abstract; Results, rank, rainfall and miscarriage interaction; Methods, Study area and population and Miscarriage data and analyses
    - subjectId: taxon:papio_anubis
      claimType: fossil-range
      claimKind: scientific
      statement: The selected COL26.8 checklist and the cited living-population studies do not estimate geographic-range limits or temporal fossil-range endpoints for Papio anubis; numerical ranges remain withheld.
      confidence: medium
      confidenceRationale: The checklist establishes identity and classification, while the selected biological papers concern living populations and do not estimate a complete geographic range or temporal fossil endpoints. Those ranges therefore remain withheld.
      referenceLinks:
        - referenceId: col-2026-checklistbank-316115
          relation: supports
          pages: Accepted species usage 6TM9B; identity and classification only
        - referenceId: druelle-2017-olive-baboon-growth
          relation: contextualizes
          quoteLocator: Captive living-cohort morphometry study; no range endpoint estimate
        - referenceId: bailey-2021-gombe-baboon-reproduction
          relation: contextualizes
          quoteLocator: Wild Gombe reproductive study; no range endpoint estimate
        - referenceId: kiffner-2022-lake-manyara-baboon-distance
          relation: contextualizes
          quoteLocator: Wild Lake Manyara monitoring study; no range endpoint estimate
  claim-rationales.zh:
    - 固定版 COL26.8 明确记录该接受用名及直接父级。此陈述仅限清单身份与分类。
    - 所引一手研究均直接列出其取样地点与圈养或野生研究状态；陈述明确不推断完整地理分布。
    - 来源直接说明圈养群体、七年纵向设计、测量的身体分段形态及年龄和性别相关结果。结论限定于该研究群体。
    - 论文报告调查年份、受道路限制的设计、夜宿地点比较及道路使用可能造成的偏差。检测模型拟合较差，因此该结果保留地点和方法范围。
    - 一手研究报告贡贝观察时段、妊娠样本、等级与降雨交互，以及快速升至最高等级的移入雄性与一般移入雄性的差异。研究为观察性且有条件，不能证明全物种流产率或故意因果。
    - 清单仅支持身份和分类；所选生物学论文研究现生种群，没有估计完整地理分布或化石年代端点，因此数值范围保持隐藏。
  claim-statements.zh:
    - COL26.8 数据集 316115 将接受的种级用名 6TM9B 记录为 Papio anubis（Lesson, 1827），其直接父级为 Papio 用名 6DGR。此陈述仅记录清单身份和分类位置。
    - 所选研究分别采样了法国鲁塞特-苏尔-阿克 CNRS 灵长类研究站的圈养群体、坦桑尼亚贡贝国家公园的野生狒狒，以及坦桑尼亚曼雅拉湖国家公园道路样线上的种群。这些研究地点不能界定该物种的地理分布。
    - 在法国鲁塞特-苏尔-阿克 CNRS 灵长类研究站开展的一项为期七年的纵向研究中，14 只雌性和 16 只雄性圈养橄榄狒狒出生时的测量体型与身体形状相近；此后生长速度和持续时间不同，形成明显体型差异，而测量的身体形状仍相近。该结果仅适用于该研究群体，不代表野外种群。
    - 在坦桑尼亚曼雅拉湖国家公园，2011 至 2019 年道路样线距离抽样所得数量估计值，超过按夜宿地点计数和平均群体规模推得的数量上限三倍。作者指出，狒狒使用道路可能造成偏差，并提醒不要直接用受道路约束的样线推断密度；这是特定地点和方法的结果，不是物种层面的密度估计。
    - 在坦桑尼亚贡贝国家公园，1972—2002 年的记录涵盖 175 只已知等级雌性的 732 次妊娠，其中 65 次以流产告终。时变分析显示，在非干旱条件下，接触到移入后一年内升至群体最高等级雄性的高等级孕雌，其流产风险较高；两年平均降雨量低于约 1,100 毫米时，这种等级相关模式基本消失。一般移入雄性的接触未显示相同关联。这是单一野生种群中的条件性结果，不代表全物种流产率，也不能证明雄性有意造成妊娠损失。
    - 所选 COL26.8 清单和所引现生种群研究均未估计 Papio anubis 的地理分布边界或化石年代范围端点；数值范围继续隐藏。
