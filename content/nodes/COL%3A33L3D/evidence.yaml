          - text: West of the main centre of distribution there occurs a form with darker salmon-pink flowers. This group (C. clavatus, C. loddigesianus, C. speciosus, C. helictus and C. smithiae) are, apart from relative differences in size and the presence of spirally twisted leaves in the latter two species, very similar. Here, population studies are essential to determine whether the differences are merely environmentally induced or whether they remain stable in cultivation.
