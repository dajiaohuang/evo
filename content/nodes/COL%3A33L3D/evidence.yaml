        claims:
          - text: Bulbous geophyte, 8-30 cm. Leaves 1-3, sometimes dry at flowering, strap-shaped. Flowers 1-5, suberect, funnel-shaped, cream-coloured to pale yellow, keels pink or green, stamens exserted from throat.
