            locator: "SANBI/WFO archive Diagnostic row 47454; source 1296.0; publication: Balkwill, K; Balkwill, M-J; Getliffe Norris, FM. 1996. Systematic studies in the Acanthaceae; Dicliptera in southern Africa. Kew Bull. 51(1): 1 - 61. [All rights reserved]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
