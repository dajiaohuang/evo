    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Dwarf shrub, up to 1.5 m high, sometimes to 2.0 m high. Inflorescence axis longer than 5 mm so that inflorescence does not appear to be contracted. Tertiary bracts 2.5 mm or narrower. Corolla tube 6-10 mm long, lip in lower position 12-20 mm long. Capsule (8.0-)8.6-10.7 (-11.4) mm long. Flowers cobalt-violet.
            sourceIds:
              - sanbi_11118_0
            locator: "SANBI/WFO archive Morphology row 1641; source 11118.0; publication: Herman, PPJ; Retief, E. 1997. Plants of the northern provinces of South Africa: Keys and diagnostic characters. Strelitzia 6: 1 - 681. National Botanical Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Dicliptera fruticosa resembles D. eenii, but differs by its suffruticose habit, smaller leaves subtending flowering branches (primary bracts), smaller tertiary bracts and its exserted capsules. The bushy habit and woody stem bases of D. fruticosa are very unusual in the genus in southern Africa and thus make it easy to recognise this species.
            textZh: SANBI 条目提供了该种的鉴别特征。
            sourceIds:
