        claims:
          - text: Cormous geophyte, 25-60 cm, tunics papery. Leaves sword-shaped. Flowers funnel-shaped, pink or white, often with dark pink markings on lower tepals.
            textZh: Gladiolus carneus D.Delaroche 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 7189; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: A polymorphic species, varying in most features, especially flower shape, colour and markings but recognised by the moderately soft-textured leaves and the large, white to pink flowers with the perianth tube ± as long as the dorsal tepal and usually slightly exserted from the bracts. Plants from the Langeberg and Outeniqua Mtns have paler flowers with more strongly crisped tepals, whereas those from the west are usually pink with less undulate tepals. Populations from coastal marshes between Rooi Els and Kleinmond have unmarked flowers with the lower tepals spooned, although similar floral morphs occur elsewhere as well. Gladiolus carneus is especially difficult to distinguish from forms of G. pappei, a slender species with narrow, superposed leaves and 2 to 4 dark pink flowers, and from G. undulatus, a hygrophilous species with cream-coloured, attenuate and crisped tepals, and a perianth tube longer than the dorsal tepal.
            textZh: SANBI 条目提供了 Gladiolus carneus D.Delaroche 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 94493; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
