    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Bulbous geophyte to 40 cm. Leaves 2 or 3, dry or green at flowering, linear. Flowers 4-7, spreading horizontally, small, funnel-shaped, vermilion to scarlet, with darker stripes leading into throat, stamens shortly exserted, style included in tube, broadly 3-lobed.
            textZh: Cyrtanthus wellandii Snijman 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13845_0
            locator: "SANBI/WFO archive Morphology row 8811; source identifier 13845.0; cited publication: Snijman, DA. 2012. Amaryllidaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 53 - 62. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Cyrtanthus wellandii is unique in the genus in having a style that remains included in the lower half of the perigone tube, ±4-5 mm short of the lowermost filament insertion. Many protandrous flowers are known to have short styles in the early stages of floral development. The style of C. wellandii, however, remains short through all its stages. As yet, little is known about the species' breeding biology. However, in the absence of hand-pollination, the few plants that have been grown under cover have not produced seeds. Although these observations are preliminary, they suggest that the short, included style of C. wellandii is not associated with selfing.
            textZh: SANBI 条目提供了 Cyrtanthus wellandii Snijman 的鉴别特征。
