        usage:
          title: Alchornea latifolia Sw., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Tree ca 5-15 m high; twigs glabrous. Leaves coriaceous; petioles nearly or quite glabrous, mostly 2-5 cm long; stipules very inconspicuous; blades ovate or elliptic, typically 8-20 cm long, 3-8 cm broad (to 30 X 20 cm on sprout-shoots), completely glabrate except for scattered stellate hairs beneath and barbate tufts of long hair in axils of major veins, foliar glands usually 2-4, near base on upper side and often paired on lower side, the major veins ca 5-8 on a side, the basal ones strongly raised beneath, extending nearly or quite half the blade length, the veinlets forming an irregular and usually very distinct reticulum, the base rounded to subcordate, the margins crenate-dentate (typically with 11-14 glandular teeth on a side), the apex obtuse to short-acuminate. Spikes axillary; 3' spikes mostly compound, main axis typically 5-15(-30) cm long, with ca 15-25 nodes, the 4-10 lateral axes ca 0.5-3 cm long; 9 spikes simple or with 1 or 2 basal branches, 3-20 cm long, with 8-20 flowers. Staminate flowers subsessile, ca 1.5 mm broad in bud; calyx-lobes 2-4, ca 1.5 mm long or less, glabrous except for a few apical hairs; stamens 8, the anthers ca 0.7-0.8 mm long. Pistillate flowers with pedicels very stout, in fruit ca 1-1.5 mm long and almost as thick, glabrous; calyx-lobes 4, lanceolate, acute or acuminate, ca 2-2.8 mm long, sparsely pubescent; ovary stel- late-pubescent, the styles mostly 10-20 mm long. Capsules usually dicoccous, 5-7 mm long, 8-10 mm in diam; seeds stramineous, tuberculate, ca 5.8-6.3 mm long, 4.8-5.6 mm broad.
          originalLanguage: en
          sourceField: general
