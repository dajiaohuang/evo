  claim-statements.zh:
    - 系统综述整合牙形石软体、摄食器和性状证据，以评估其脊椎动物与脊索动物亲缘。该综合支持生物亲缘框架，但不提供唯一精确的起源日期、直接祖先或完整延限。
    - 系统综述在不断变化的生物学概念下讨论牙形石化石，但不能把图谱原先的 5.20–2.014 亿年前端点证明为一个经过审计的类群延限；该全球显示现予暂缓。
