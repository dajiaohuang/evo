      ecology:
        status: partially-supported
        claims:
          - text: Aloe aristata occurs in a wide variety of habi-tats, including sandy soil in hot, dry karoo areas, deep shade on humus-rich soil in riverine forest and grassland on high mountains in Lesotho. In dry karroid areas the leaves are greyish, erect, longer and narrower than usual, with more pronounced tubercles. In grassland in wetter areas the leaves are bright green, broad-er than usual and spreading, sometimes even slightly reflexed in very damp shade.
