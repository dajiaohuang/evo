    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants stemless, ±100 mm tall excluding inflorescence, usually in dense clusters. Leaves 254-381 cm a rosette, lanceolate, arcuate-incurved, 50-110 x 10-17 mm, greyish green to blue-green, with white subtuberculate to subspinescent spots on both surfaces, those on lower surface sometimes forming transverse bands, lower surface with soft prickles in median rows, margins with soft white teeth, apices apiculate. Inflorescence 300-500 mm high, usually 2-6-branched; peduncles without sterile bracts; floral bracts narrowly deltoid-acuminate, ±12 x 3 mm, obscurely ±5-nerved. Flowers brownish orange above, much paler below, 30-40 mm long, arcuate-nutant at anthesis, slightly constricted above ovary; outer segments connate for most of their length, inner segments adnate to outer; pedicels 21-35 mm long. Anthers not or hardly exserted. Ovary 6.0-8.0 x 1.0-2.5 mm, olive-green; style exserted 1-2 mm. Fruit 25-30 x 8-10 mm, grey to greenish brown. Seeds grey, ±6.0 x 3.0 x 1.5 mm, narrowly winged.
