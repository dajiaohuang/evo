    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Shrublet to 30 cm. Leaves alternate to subopposite, lanceolate-ovate, white-dotted, pilose on margins and beneath when young; involucral leaves similar. Flowers few at branch tips, rose-pink to magenta, hypanthium hairy, petaloid floral scales 4, membranous, deeply and narrowly laciniate, hairy, upper stamens often abortive.
            sourceIds:
              - sanbi_14457_0
            locator: "SANBI/WFO archive Morphology row 10196; source 14457.0; publication: Beaumont, A. 2012. Thymelaeaceae: Gnidia L. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 769 - 772. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: This species resembles G. penicillata Licht. ex Meisn. rather closely but differs in having more flowers in a head, thicker calyx-lobes which are usually densely pubescent inside, and leaves ± pilose on the lower surface and only sparingly ciliate on the margins. The shape of the calyx-lobes and petals are also quite different. G. linearifolia also superficially resembles G. scabrida and nana vegetatively but differs from both in shape of leaves. From G. scabrida it also differs in size of flowers and type of petals and from nana in its petals having fewer laciniations than those of nana and being all in one plane.
