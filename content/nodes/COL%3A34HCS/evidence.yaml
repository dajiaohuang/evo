          - text: Fructiculus glaber, compactus vel laxe ramosus, ca. 25 cm. altus; rami senecti robusti nodosi, ad 5 mm. diam., patentes vel decumbentes, rami ramulique hornotini adscendentes vel erecti, saepe 9-20 cm. longi, internodiis saepius ad 2.5 cm., rarius ad 4 cm., longis; folia fere erecta imbricataque vel, gemmis evolutis, patentia, carina acuta, centrali vel eccentrica, supra leviter concava, lateribus planis vel leviter convexis, lateraliter visa e parum infra medium leviter ampliata, acuta vel acuminata, apiculata, apiculo erecto, levissima politaque, viridia, 1.5-2.5 cm. longa, medio ad 8 mm. lata, ad 5 mm. diametroque, vagina 1 mm. longa; flores 1-3-nati vel irergulariter ternati, corolla vix late expansa, ad 1.4 cm. diam. vel ultra in luxuriantibus; pedunculi ad 3 mm., vel in cultis ad 1.2 cm., longi; receptaculum breviter turbinatum, apice 6 mm. diam., post anthesin crateriforme apiceque 5-gibbosum; sepala 5, valde inaequilonga, 2 longiora 8 mm. vel demum ad 1.1 cm., cetera 3-5 mm. longa; petala 15-17, 1-2-seriata, subacuta vel obtusa, purpureorosea, 7-8 mm. longa, 1 mm. lata; staminodia 3 mm. longa, staminibus sat paucis, ad 2.5 mm. longis, adpressa; glandulae inconspicuae; ovarium supra per 1.5 mm. elevatum, obtuse 5-lobatum; stigmata subulata, 1.5 mm. longa; capsula expansa 8 mm. diam., seminibus fere orbicularibus, inconspicue muricatis, pallide brunneis, 0.75 mm. diam.
