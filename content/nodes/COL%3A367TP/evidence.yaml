        claims:
          - text: Roughly hairy, tufted perennial to 20 cm, from woody base. Leaves linear, usually sharply toothed. Flower heads radiate, solitary on elongate peduncles, purple with white rays brown on reverse. Ray achenes trigonous and warty, ± 3 mm long, disc florets sterile.
            sourceIds:
              - sanbi_14136_0
            locator: "SANBI/WFO archive Morphology row 11371; source 14136.0; publication: Manning, JC; Goldblatt, P. 2012. Asteraceae: Dimorphotheca Vaill. ex Moench. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 368 - 370. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: In habit it may be quite similar to the narrow-leaved forms of D. acutifolia. It differs mainly from this species by its small achenes, only c. 3 mm long, whose angles are crenatetuberculate and not swollen at the base. In contradistinction to this, the achenes of D. acutifolia are twice as long, with entire and smooth angles swollen at the base. D. dregei seems besides to be smaller, and it has even narrower leaves than D. acutifolia usually has. On one and the same specimen there are often entire, sparsely dentate as well as pinnatifid leaves. D. acutifolia, on the other hand, seems never to have any pinnatifid leaves.
            textZh: SANBI 条目提供了该种的鉴别特征。
