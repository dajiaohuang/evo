      ecology:
        status: partially-supported
        claims:
          - text: In an eight-day chemotherapy mouse model, tongue samples from 6–9-week-old female C57BL/6 mice receiving 5-fluorouracil plus daily Candida albicans SC5314 had higher endogenous bacterial loads than samples from mice receiving 5-fluorouracil alone. Both CFU and 16S rRNA gene-copy assays showed the difference at day 8 (p=0.008; 4–10 mice per group across 1–2 experiments). This is specific to the laboratory strain and perturbed mouse model; it does not establish natural fungal ecology or human clinical outcomes.
            textZh: 在为期八天的化疗小鼠模型中，接受 5-氟尿嘧啶并每日给予白色念珠菌 SC5314 的 6–9 周龄雌性 C57BL/6 小鼠，其舌部样本的内源细菌负荷高于仅接受 5-氟尿嘧啶的小鼠。CFU 和 16S rRNA 基因拷贝数检测均显示第 8 天存在差异（p=0.008；每组 4–10 只小鼠，来自 1–2 次独立实验）。该结果仅适用于这一实验室菌株和受扰动的小鼠模型，不能据此推断自然真菌生态或人类临床结局。
            originalLanguage: en
            sourceIds:
              - bertolini2019candida
            locator: Figure 1D caption and Results describing oral bacterial loads; Methods, animal model and C. albicans inoculation.
            placeTimeScope: Eight-day laboratory chemotherapy mouse experiment; the article reports no study-facility location for this model.
            lifeStatus: Laboratory strain SC5314 was administered in drinking water to laboratory mice; no wild fungal population or human clinical cohort was studied.
        gaps:
          - One chemotherapy-perturbed mouse model with strain SC5314 does not establish natural fungal ecology, other host contexts, geographic distribution, or human clinical outcomes.
