          title: Ficus nymphaeifolia Mill., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Trees 7-3 5 m. tall, glabrous. Twigs 4-13 mm. in diameter, glabrous or minutely puberulent. Stipules to 40 mm. long, lanceolate or deltoid, glabrous or minutely puberulent, or glaucous. Lamina 6.5-20 cm. wide X 9-30 cm. long, ovate or ovate-rotund; apex acute, broadly acute, rounded, or sometimes shortly acumi- nate; base cordate; lateral veins (4-) 5-11 pairs, departing from the midrib at an angle from 100-400; basal veins departing from the midrib at an angle of 200 or less; inter- costals not prominent. Petiole 30-200 mm. long, 1/2-1/4 the length of the lamina. Figs 15-25 mm. in diameter, globose, minutely puberulent or glaucous, borne among the leaves; color greenish, with purple spots; peduncle obsolete to 5 mm. long; basal bracts 4-19 mm. long, deltoid or ovate, connate, minutely puberulent or glaucous; ostiole 2-3 mm. in diameter, probably plane with the surface, but in dried material fre- quently raised, or surrounded by a more or less distinct ring of receptacular tissue.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 8075
