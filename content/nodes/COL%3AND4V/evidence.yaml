        claims:
          - text: Perennial, tufted, up to 1.5 m high. Leaf blades 100-300 mm long, 5-13 mm wide. Spikelets 10-30 mm long, 2-6 mm wide. Panicle open, pedicels scabrid; spikelets open or with flowers closely arranged; lower glume 1-3-nerved, upper 3-5-nerved; lemmas 8-12 mm long, awns up to 5 mm long.
