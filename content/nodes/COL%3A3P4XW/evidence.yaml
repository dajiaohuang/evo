          title: Hyptis capitata Jacq., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Herbs, perennial, sparsely pubescent, to 2 m. Leaves ovate to ? rhomboid, acute, irregularly serrate, the bases obtuse to ? attenuate, to 12 cm long and 6 cm wide, glabrous to sparsely pubescent; subsessile to petioles ca 2-3 cm long. Inflorescences capitula, densely-flowered, axillary, 2-3 cm in diam, the peduncles ca 2-7 cm long; the bracts ovate-lanceolate, ca 5-7 mm long, sparsely pubescent, frequently reflexed and hidden at maturity. Flowers sessile; calyx tubular, ca 6-8 mm long at maturity, membranaceous, pilose-annulate within above the nutlets, sometimes only sparsely so, teeth spinulose, ca 1.5-2 mm long; corolla tube ca 3-3.5 mm long, white, the lower lip larger, ca 1 mm long, pubescent; stamens exserted, the filaments ? glabrous, the anthers ca 0.2 mm long. Nutlets (3-)4, ovoid, the lobes of the gynobase adhering, ca 1-1.2 mm long, pale to dark brown, the pericarp ? smooth.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 6604
