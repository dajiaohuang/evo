        usage:
          title: Aegiphila cephalophora Standl., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Vine, often high-climbing; branchlets slender, tetragonal, densely appressed- pubescent with long white antrorse hairs; leaf-scars projecting conspicuously; buds woolly. Leaves opposite, subcoriaceous, entire, ovate or ovate-oblong, 9-13.5 cm long and 4.5-7.5 cm wide, abruptly rounded to an acuminate point ca. 1 cm long, basally subacute or rounded, dark and shiny above, lighter and densely tomentose beneath, more sparsely so above, especially along the midrib; midrib prominent and pubescent on both surfaces; secondary veins in ca. 7 irregularly placed pairs, anastomosing near the margins; petioles stout, 5-7 mm long, densely long pubescent. Inflorescences, axillary and terminal, cymes, opposite, capitate, dense-flowered, the uppermost pair usually short pedunculate and much like a single terminal one; peduncles densely long-pubescent, the upper ones ca. 5 mm long, the lower ones 1.5-2.5 cm long; pedicels, bractlets and prophylls hidden by the long matted white pubescence. Flowers with the calyx thin, obconic, ca. 2.5 mm long and wide, densely pubescent outside with white hairs 2.3-2.6 mm long, glabrous within, apically 4-mucronulate or subentire; corolla white, infundibular, the tube ca. 3.1 mm long, glabrous or slightly granular-pulverulent, the lobes (3-)4, broadly ovate- or elliptic-lingulate, acute, ca. 3.1 mm long and 2.3 mm wide, glabrous; stamens 4 inserted just beneath the mouth of the corolla-tube, long-exserted in staminate flowers, the filaments ca. 4.7 mm long, glabrate; pistil equaling the corolla or slightly exserted in staminate flowers, the style ca. 2.1 mm long, glabrous, stigma-branches ca. 2 mm long, the ovary depressed-globose, ca. 0.5 mm long and wide, glabrous, 4-lobed, 4-celled. Fruit orange, 1.5 cm diameter; fruiting clusters pendent.
          originalLanguage: en
