        usage:
          title: Nymphaea ampla (Salisb.) DC., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Rhizomatous, aquatic, perennial herbs. Leaves alternate, large and coarse, long-petiolate, the petioles glabrous, the blades suborbicular, sinuate-dentate, green above, purplish and often mottled below, 10-45 cm. long, 10-45 cm. broad, the sinus 5-15 cm. deep; venation coarse, of about 13-29 main veins, these ultimately dichotomizing and trichotomizing and reticulate. Flowers long-pedunculate, usually emersed, opening by day, white, 8-16 cm. broad, the peduncles glabrous; sepals 4, lance-oblong, obtuse to acute, green with purplish striations, 6-10 cm. long; petals several, lance-oblong, obtuse, white, the outermost occasionally yellow- green; stamens numerous, 1-5 cm. long, the outermost longer and broader, the anthers about half as long as the filaments, the filaments conspicuously produced beyond the anthers; carpels ca. 20, laterally connivent, the wall between carpels being double, the styles short, stout and more or less acute, 4-6 mm. long. Fruits 2-3 cm. broad, 1.5-2.5 cm. high, probably maturing under water, pulpy, ir- regularly dehiscent, many-seeded, the seeds dull gray, operculate, subglobose, ca. 1 mm. broad, slightly longer than broad, strigillose in rows.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 8505
          archiveSourceId: 2F27DB1E-E7A9-47B8-B7B4-3F0BD355DB63
