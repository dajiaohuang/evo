    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Annual, up to 400 mm tall. Leaves ovate to elliptical, margins entire. Flowers in lax racemes, calyx lobes linear to oblanceolate, acute, densely glandular pilose, corolla 13.1-18.8 mm long, upper lip orange distally and pale yellow with brownish streaks at base, lower lip deep orange with dark brown, densely villous, bilobed palate at base, base of corolla tube broadly saccate, ± 1 mm long. Capsule 3.8-8.3 x 4.5-7 mm, apex bilobed.
            sourceIds:
              - sanbi_14771_0
            locator: "SANBI/WFO archive Morphology row 35531; source 14771.0; publication: Steiner, KE. 2013. Scrophulariaceae: Nemesia. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 467 - 470. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Nemesia aurantia is most closely related to N. versicolor, but has orange rather than blue or yellow flowers, lacks a conspicuous spur, and has a bilobed palate on the lower lip that is less prominent. The only other saccate Nemesia species with orange flowers is N. strumosa Benth. Plants of N. aurantia are typically shorter than N. strumosa (up to 410 mm vs up to 730 mm) with smaller flowers (corolla limb 13-19 mm vs 17-35 mm long). The sac of the corolla in N. aurantia is less than half the length, on average, of N. strumosa and the raised palate and divergent bosses on the lower lip of N. aurantia are absent in N. strumosa.
            textZh: SANBI 条目提供了该种的鉴别特征。
            sourceIds:
