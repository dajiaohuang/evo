    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Perennial, up to 200 mm tall; fresh shoots not aromatic. Leaves linear, rolled, sparsely hispid; ligule a fringe of hairs. Inflorescence a contracted panicle. Spikelets 5-7 mm long, often flushed purple, many-flowered; glumes longer than spikelet (excluding awns), 3-7-nerved; lemma lobes truncate, hair tufts ± 2 mm long, central awn 3-4 mm long, bent, lower part or column twisted.
            textZh: Tribolium purpureum (L.f.) Verboom & H.P.Linder 的 SANBI 物种条目记录了形态特征。
            sourceIds:
