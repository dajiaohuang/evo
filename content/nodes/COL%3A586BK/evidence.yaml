            locator: "SANBI/WFO archive Morphology row 33538; source identifier 14651.0; cited publication: Fish, L. 2013. Poaceae: Tribolium. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 152 - 153. South African National Biodiversity Institute, Pretoria. [CC BY]"
