  claims:
    - subjectId: taxon:cretophasmomima
      claimType: taxonomy
      claimKind: scientific
      statement: Cretophasmomima melanogramma was described as a stem-Phasmatodea insect on the basis of one female and two male Yixian specimens with diagnostic operculum and wing characters.
      confidence: medium
      confidenceRationale: The primary study names the species and explicitly uses the female abdominal operculum and forewing shoulder pad for its stem-Phasmatodea assignment; broader phasmatodean relationships are not inferred here.
      referenceLinks:
        - referenceId: wang-2014-cretophasmomima
          relation: supports
          pages: e91290
          figure: Figures 1–5
          quoteLocator: Systematic palaeontology, specimen sample and stem-Phasmatodea diagnosis
    - subjectId: taxon:cretophasmomima
      claimType: biogeography
      claimKind: scientific
      statement: The profiled Cretophasmomima material is from the Yixian Formation of the Jehol biota in Inner Mongolia, China; this records the sampled locality rather than a complete species distribution.
      confidence: high
      confidenceRationale: The primary description gives the formation, Jehol biota context and Inner Mongolia locality for the three specimens. High confidence is confined to those records.
      referenceLinks:
        - referenceId: wang-2014-cretophasmomima
          relation: supports
          pages: e91290
          figure: Figures 1–3
          quoteLocator: Yixian Formation, Jehol biota and Inner Mongolia specimen provenance
    - subjectId: taxon:cretophasmomima
      claimType: ecology
      claimKind: scientific
      statement: Dark longitudinal wing veins were interpreted as possible leaf mimicry associated with a contemporaneous plant organ; the described specimens measure approximately 47–56 mm, suggesting a plant-associated crypsis context without directly observing diet or behaviour.
      confidence: medium
      confidenceRationale: The paper explicitly proposes crypsis from wing coloration and plant comparison, but the fossil does not directly record feeding, behaviour or a population-level ecological guild.
      referenceLinks:
        - referenceId: wang-2014-cretophasmomima
          relation: supports
          pages: e91290; Systematic Palaeontology, General description and specimen descriptions; Leaf mimicry discussion
          figure: Figures 2–4, 6–7
          quoteLocator: "General description and specimen descriptions: female approximately 56 mm and males approximately 47–51 mm; Leaf mimicry discussion: wing coloration, Membranifolia comparison and proposed crypsis"
    - subjectId: taxon:cretophasmomima
      claimType: morphology
      claimKind: scientific
      statement: Cretophasmomima melanogramma preserves a female abdominal operculum, a forewing shoulder pad and dark longitudinal veins that diagnose the described stem-stick-insect morphology.
      confidence: high
      confidenceRationale: These structures are directly described and figured for the named female and male specimens; the profile does not generalize their preservation to all phasmatodeans.
      referenceLinks:
        - referenceId: wang-2014-cretophasmomima
          relation: supports
          pages: e91290
          figure: Figures 1–5
          quoteLocator: Diagnosis, forewing shoulder pad, abdominal operculum and wing venation
    - subjectId: taxon:cretophasmomima
      claimType: fossil-range
      claimKind: scientific
      statement: The displayed 130–122 Ma window converts the Yixian Formation age of approximately 126 ± 4 Ma for the three specimens; it is not a global species range or Phasmatodea origin date.
      confidence: medium
      confidenceRationale: The primary paper supplies the approximately 126 ± 4 Ma formation age, while the numerical window is a transparent uncertainty conversion limited to that deposit and sample.
      referenceLinks:
        - referenceId: wang-2014-cretophasmomima
          relation: supports
          pages: e91290
          figure: Figures 1–3
          quoteLocator: Yixian Formation age of approximately 126 ± 4 Ma and specimen context
  claim-rationales.zh:
    - 一手研究明确报告三件义县标本，并以腹盖和前翅肩垫支持枝叶虫类干群鉴定；更高阶关系不由此推断。
    - 描述研究直接给出义县组、热河生物群和内蒙古地点；高置信度只适用于这三件标本的取样地点。
    - 拟叶与植物关联是翅色和同期植物器官比较产生的功能假说，化石未直接记录摄食、行为或种群生态。
    - 腹部腹盖、前翅肩垫与深色纵脉均在一手图版中描述和绘出；其直接观察不外推到所有枝叶虫类。
    - 130–122 Ma 是把约 126 ± 4 Ma 义县组年龄转换后的透明窗口，只适用于该沉积样本而非全球物种延限。
  claim-statements.zh:
    - Cretophasmomima melanogramma 根据一件雌性和两件雄性的义县标本及其诊断性的腹盖和翅部特征，被描述为枝叶虫类干群昆虫。
    - 档案中的 Cretophasmomima 材料来自中国内蒙古热河生物群的义县组；这记录取样地点，而不是完整物种分布。
    - 深色纵向翅脉被解释为可能与同期植物器官相关的拟叶现象；所描述标本体长约 47–56 毫米，提示植物关联的隐蔽背景，但没有直接观察到食性或行为。
    - Cretophasmomima melanogramma 保存雌性腹部腹盖、前翅肩垫和深色纵向翅脉，这些特征构成所描述的枝叶虫干群形态诊断。
    - 显示的 130–122 Ma 区间把三件标本所在义县组约 126 ± 4 Ma 的年龄转换为时间窗口；它不是全球物种延限或枝叶虫类起源时间。
