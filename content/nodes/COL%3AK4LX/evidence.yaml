        usage:
          title: Ayapana amygdalina (Lam.) R.M.King & H.Rob., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Coarse perennial herbs or subshrubs mostly 1.5-2.0 m high, unbranched or mostly branched at base; stems becoming brownish to reddish, terete or somewhat hexagonal, glabrate to densely puberulous or stipitate glandular. Leaves slightly to distinctly imbricated, sessile or very short-petiolate, oblong to obovate, mostly 5-10 cm long and 2-3 cm wide, the lower leaves to 16 cm long and 5.5 cm wide, the base cuneate, sometimes with slight auricles, the margins entire to crenate- serrate, the apex rounded to short-acute, the upper surface obscurely and the lower surface more prominently glandular punctate, the surfaces glabrate to densely hirsute or stipitate glandular, the venation pinnate with ascending secondary veins. Inflorescence openly corymbose-paniculate with corymbose to subcymose branches, the branches glabrate to densely stipitate glandular, the ultimate branches 1-20 mm long. Heads 7-10 mm high with 30-40 florets; involucral bracts usually partly reddish, ca. 30-40, subimbricate, in 4-5 series, 1-9 mm long, mostly narrowly oblong to linear with little or no scarious margin, the apex short-acute or apiculate to long-attenuate, the outer surface puberulous to densely stipitate
          originalLanguage: en
          sourceField: general
