        claims:
          - text: Shrub, up to 3 m high. Leaves densely ciliate along both sides of midrib; margin entire or irregularly and grossly dentate. Flowers solitary in axils of ordinary leaves, not scented. Bracteoles 4-6 mm long; sepals 6.0-9.5 mm long, subequal; bracteoles and sepals with scarious margin. Flowers blue, mauve, lilac or purple.
