  claims:
    - subjectId: event:raranimus-basal-therapsid-snout
      claimKind: scientific
      claimType: topology
      statement: A 71-character morphology analysis of partial-snouted holotype IVPP V15424 recovered Raranimus as sister to the other sampled therapsids; the result is a matrix-dependent topology, not observed ancestry or a precise therapsid first appearance.
      confidence: medium
      confidenceRationale: The holotype, characters and four shortest trees are published, but the specimen is fragmentary, topology depends on the sampled matrix, and the authors report inadequate radiometric control for the Dashankou sequence.
      referenceLinks:
        - referenceId: liu-2009-raranimus
          relation: supports
          pages: 393–399
          figure: Figures 1–3
          quoteLocator: Systematic palaeontology; Description; Phylogenetic analysis; Discussion
  claim-rationales.zh:
    - 正模标本、性状与四棵最短树均已发表，但材料残缺，拓扑依赖所取样矩阵，而且作者指出大山口层序缺乏可靠放射性年代控制。
  claim-statements.zh:
    - 对残缺吻部正模 IVPP V15424 的 71 性状形态分析将 Raranimus 恢复为其余已取样兽孔类的姐妹群；该结果是依赖矩阵的拓扑，不是已观测祖先关系或精确的兽孔类首现。
