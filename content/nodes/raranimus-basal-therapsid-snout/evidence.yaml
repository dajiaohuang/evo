            quoteLocator: Phylogenetic analysis; Discussion
      - statement: The 274.4–264.28 Ma display envelope is a broad current Middle Permian stage translation; the source explicitly reports no reliable radiometric dates for the Dashankou sequence, so it cannot establish a precise therapsid first appearance.
        relation: contextualizes
