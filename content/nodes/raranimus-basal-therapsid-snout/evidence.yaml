            quoteLocator: Systematic palaeontology; Description; Phylogenetic analysis
    uncertaintyItems:
      - statement: The recovered sister position belongs to one morphology matrix and its taxon-character sampling; it is not direct observation of ancestry, and the paper's Laurasian-origin interpretation remains a biogeographic hypothesis.
        relation: contextualizes
        claimIds:
