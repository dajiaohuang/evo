    evidenceItems:
      - statement: IVPP V15424 is a roughly 100 mm partial, slightly crushed snout with a combination of cranial and dental characters; four shortest PAUP trees from the published 71-character matrix placed Raranimus immediately outside the remaining sampled Therapsida.
        relation: supports
