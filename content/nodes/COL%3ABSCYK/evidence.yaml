        usage:
          scope:
            en: Systematic comparison using cytochrome-b, ddRAD and museum pelage evidence. The five sequences labelled C. calvus novaesi follow the paper-era subspecies assignment; two earlier sample identifications are specifically questioned in the article. This is taxonomic evidence, not a field census.
            zh: 研究结合细胞色素 b、ddRAD 与博物馆皮毛证据；列为 C. calvus novaesi 的 5 条序列沿用论文当时的亚种归属，文中还特别质疑了两个早期样本鉴定。该研究提供分类证据，不是野外普查。
      - id: silva2021bald_uakari_distribution
        referenceId: ref-792c12d0-9f5d-4b34-8a72-b2a0ac413d06
