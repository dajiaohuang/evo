          - title
          - url
          - scope
        metadataVariant: 0
        usage:
          scope:
            en: Silva et al. (2021), published under Cacajao calvus novaesi, reports a multi-year survey, occurrence records and range limits in the Gregório–Tarauacá interfluvium. Supports regional occurrence and habitat context, not current abundance or a species-wide ecological account.
            zh: Silva 等（2021）以 Cacajao calvus novaesi 发表，报告 Gregório–Tarauacá 河间地的多年调查、出现记录与分布边界。支持区域出现记录和栖地背景，不支持当前丰度或全种生态综述。
      - id: salve2025novaesi
