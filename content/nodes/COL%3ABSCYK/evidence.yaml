        metadataVariant: 0
        usage:
          scope:
            en: Official ICMBio SALVE assessment published in 2025; the Near Threatened category date is 2019. Supports the accepted species-level name, summarized distribution, habitat and threat evidence, assessed status and explicit unknowns. Some threat detail derives from interviews and personal communication; it is not a population census.
            zh: ICMBio SALVE 官方评估于 2025 年发布，“近危”类别日期为 2019 年。支持种级接受名、评估汇总的分布、栖地与威胁资料、类别和明确未知项。部分威胁细节来自访谈与个人通信；该评估不是种群普查。
