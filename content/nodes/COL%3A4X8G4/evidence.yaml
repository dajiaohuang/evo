        usage:
          title: Sida spinosa L., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Herb or suffrutex, annual or perennial, the stem erect, up to 1.2 m high, slender and sparingly branched, densely and minutely stellate-puberulus, at length glabrescent. Leaves with the petiole slender, 3-15 mm long, sometimes with 2 more or less spinose, infrapetiolar callosities, minutely stellate-tomentellous, the stipules subulate-filiform, 4-6 mm long, hirtellous, at length caducous; blade polymorphic, lanceolate, linear-lanceolate or linear-oblong, seldom narrowly elliptic, rounded or truncate or infrequently shallowly subcordate at the base, acute or obtuse at the apex, crenate-serrate at the margin, 2-6 cm long and 0.3-1.8 cm broad, markedly discolor, 3- or 5-palminerved, the upper surface dark green (brownish when dry), minutely stellate-puberulus, and with the venation impressed, the lower surface pale, minutely and softly stellate-tomentellous, and with the venation prominent. Flowers axillary, solitary, often with a very short accessory flowering branchlet in the same axil, the flowers toward the apex of the branches and branchlets sub- corymbose, the pedicel slender, articulated mostly above the middle, 2-9 mm long, minutely stellate-tomentellous; calyx cupuliform, 5-angulate, ca 5-5.5 mm long, 10-ribbed, minutely stellate-tomentellous, very moderately accrescent, the lobes deltoid, acute to acuminate, ca 2-2.5 mm long and broad at the base; petals strongly oblique, ca 6-7 mm long, orange (or yellow?); androecium ca 3.5-4 mm long, the staminal tube ca 3 mm long, minutely pilosulose, the filaments relatively few; styles ca 3.5-4 mm long, connate basally. Mericarps 5, trigonous, ca 2.5 mm long, shortly 2-aristate at the apex, the awns ca 0.5-0.8 mm long, antrorsely pilosu- lose as is the dorsal upper part, the dorsal lower part membranous, the lateral walls membranous-chartaceous and striate-reticulate, apically dehiscent but the seed escaping thru the disintegrated base; seeds trigonous, ca 1.5 mm long, glabrous.
          originalLanguage: en
          sourceField: general
