    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Stems 60-200 cm x 2-4 mm, smooth. Leaf blades 7-21 mm wide; ligule 5-25 mm, hyaline, subacute or emarginate; basal sheaths subcoriaceous, keeled, dark brown. Inflorescence with six to nine pendulous spikes, the uppermost spike mostly with female flowers, with male flowers scattered and diversely mixed between the female ones, rarely entirely male, the rest of the spikes entirely female or rarely androgynous; lowermost bract leaf-like, equal to or slightly shorter than the inflorescence. Spikes 60-220 x 5-10 mm, cylindrical, pendulous when mature, with peduncles up to 16 cm long, smooth. Staminate glumes (3.0)4.0-6.0 x 0.5-1.2(1.8) mm, lanceolate, apex acute, frequently, shortly awned, brown with a pale midrib. Pistillate glumes 2.65.4 x 0.9-1.5 mm, deltoid-lanceolate, oblong-lanceolate or lanceolate-elliptical, acute, subulate, mucronate or awned, longer and narrower than the utricles, brownish with a distinct midrib. Utricles 2.2-3.4 x 0.9-1.5 mm, ovate or elliptical, green yellowish green or blackish, with a short bidentate beak. Achenes (1.0)1.4-1.9(2.1) x (0.3)0.7-1.1 mm, from obovate to elliptical, yellowish brown to brown, sometimes with dark spots.
