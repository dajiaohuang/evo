          - text: It has been much confused with M. bellidifolia, from which it is easily distinguished by its perennial habit, less deeply divided calyx, yellow corolla limb, and much shorter, included, stigma. However, its relationship lies with M. platystigma whose area lies roughly 180km north east of that of M. dregei, in the mountains of eastern Lesotho. Manulea platystigma is distinguished by its flowers being mostly in 2-3-flowered cymules, and having longer calyx lobes, larger corolla limb and shorter, broader and less tapered stigma.
