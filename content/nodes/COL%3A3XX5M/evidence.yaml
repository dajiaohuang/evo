    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Perennial herb, stock carrot-like, up to c. 10 mm diam. at apex, crowned with one to several leaf rosettes, stems several to many, scapose, c. 70-300 mm tall, erect, simple, puberulous, hairs up to 0.1 mm long, both balloon- and gland-tipped. Leaves opposite, bases connate, crowded in radical rosettes, c. 15-75 x 5-13 mm, oblanceolate, apex obtuse, base narrowed to a long flat petiolar part, margins obscurely to distinctly serrate, occasionally almost lobulate, both surfaces minutely glandular-puberulous, occasional balloon-tipped hairs also present. Flowers many in long lax terminal racemes, usually solitary, occasionally paired. Bracts (lowermost) 2-7 x 1-1.6 mm, lanceolate. Pedicels (lowermost) 2-5 mm long. Calyx bilabiate, tube 1 mm long, anticous lobes c. 1.8-3.1 x 0.8-1 mm, posticous lobes slightly smaller, oblong-lanceolate, minutely glandular-puberulous all over, balloon-tipped hairs up to 0.1-0.2 mm long also present. Corolla tube 6-7.5 x 1.2-1.5 mm in throat, cylindric, inflated in upper part, limb bilabiate, 6-7 mm across lateral lobes, posticous lobes 2.2-4 x 1.2-1.8 mm, anticous lobes 2.5-4.5 x 1-1.5 mm, all lobes elliptic-oblong, margins ± revolute, dull mustard yellow, back of throat yellow/orange with a dark purplish patch, puberulous outside, hairs balloon-tipped, very small, inside with 4 longitudinal bands of hairs in throat, these often dark in colour. Stamens 4, anticous anthers 0.5-0.75 mm long, tips visible in throat, posticous anthers 1.4-1.75 mm long, included, posticous filaments bearded. Stigma 2.4-3.1 mm long, much longer than style, included. Style 0.5-0.8 mm long. Ovary 1-2 x 0.6-1 mm. Capsules c. 5-6 x 2.5-3 mm. Seeds c. 0.7-0.8 x 0.3-0.4 mm, pallid.
            sourceIds:
