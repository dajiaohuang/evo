          title: Desmodium affine Schltdl., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Procumbent woody herb with erect peduncles; stem uncinulate puberulent and moderately long spreading pilose. Leaves trifoliolate, stipulate, petiolate; stipules obliquely ovate acuminate, striate, puberulent on abaxial surface, ciliate, persistent, 4-6.5 mm long, 2-2.5 mm wide; petioles sulcate on adaxial surface; pubescence similar to that of stem, 2.6-3.2-cm long; the leaf rachis similar, 1/4 or less the length of petiole; stipels lance attenuate, striate, puberulent and ciliate, persistent, 2.5-4 mm long; petiolules stouter than the leaf rachis, densely spread- ing pilose, 1-2.5 mm long; leaflets thin, uncinulate puberulent and sparsely scat- tered pilose on adaxial surface, paler and with veins more prominent on the sparsely uncinulate puberulent and pilose abaxial surface, the margins ciliate at least near base, the terminal leaflet ovate, acute to obtuse, the base rounded to deltoid, 3.6-4.8 cm long, 2.3-3.2 cm wide, lateral leaflets obliquely oval, acute, 2.9-4 cm long, 1.7-2.5 cm wide. Inflorescences axillary and terminal; the rachis angulate, uncinulate puberulent, remotely if at all pilose; primary bracts ovate acuminate, striate, puberulent and ciliate, not long persistent, 1.5-3 mm long, 1 mm wide; secondary bracts similar, 1-1.5 mm long, 0.5 mm wide; pedicels borne singly, each subtended by 1 primary bract and 2 secondary bracts (borne later- ally), densely uncinulate puberulent, 8-11 mm long. Flowers with the calyx bi- labiate, uncinulate puberulent, pilose on the teeth of both lobes, the teeth of lower lobe acuminate, almost equal, 3.5-4 mm long, the upper bifid lobe 3.5-4 mm long; corolla somewhat longer than the calyx, standard obovate, narrowly cuneate at base, 5.5 mm long, 4 mm wide, wings oblong, unguiculate, 6 mm long, 1.5 mm wide, keel petals oblong to remotely scythe shaped, long unguiculate, 5.5-6 mm long, 1.5-2 mm wide. Loments short stipitate, the stipe 1.5-2 mm long, to 5-articulate, articles oblong, the upper suture straight, the lower curved, con- stricted at the isthmi, articles densely uncinulate puberulent, 5.5-6 mm long, 2.5- 3 mm wide; seed transversely elliptical, 3 mm long, 1.5 mm wide, the funicle short.
