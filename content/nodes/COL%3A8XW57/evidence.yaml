        claims:
          - text: Closely related to Bulbine wiesei from the Knersvlakte, which occurs in open quartzitic pebbly places. Bulbine hallii grows under and between shrubs on sheltered, mainly south-facing mountain slopes. B. hallii also possesses longer, thinner, less succulent leaves.
