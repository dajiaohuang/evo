    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Small perennial, acaulescent herb with tuberous base; tuber solitary, deltoid, branching downwards, c. 20 mm long and 15 mm broad. Leaves succulent, up to 20 arising from a tight bundle of fine sheaths, erect to suberect, lightly channelled on adaxial surface towards the base and terete towards the upper third, acute, surface shiny, finely granulate, longest c.45 mm long and 2 mm broad. Inflorescence erect, solitary; peduncle brownish-purple, terete, 50-70 mm long; raceme 30-50 mm long. Flowers 20-25, bract membranous, triangular, 1.5 mm long; pedicel 11 mm long, horizontal; tepals light yellow with dark green central vein, all reflexed with outer whorl clasping pedicel; outer whorl elliptic 8 x 2.5 mm, inner obovate with crinkled undulate obtuse apex, 8 x 6 mm. Filaments slender, bearded c. 7 mm long outer with single circular group of hairs towards the anther, inner with hairs situated in middle third, mainly facing outwards; hairs yellow, glandular, clavate with apical bulb, c. 1.5 mm long; anthers oblong, 2 mm long; ovary dark green, oblong, 2 mm long; style fine, 5 mm long. Capsule dark green, broadly ellipsoid, 3 x 2 mm; seed black, deltoid with raised contorted ridges and microscopic granulate surface, 1.2 x 1.2 mm.
