        claims:
          - text: Cormous geophyte, 25-50 cm, tunics papery. Leaves sword-shaped. Flowers funnel-shaped, cream-coloured to greenish, sometimes with darker median streaks on lower or all the tepals.
            textZh: Gladiolus grandiflorus Andrews 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 7261; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Separated from short-tubed Gladiolus rudis by the slightly longer perianth tube, usually 27-35(-50) mm long, the longer filaments, 14-22 mm long, and the different markings on the lower tepals, reddish median streaks rather than yellowish spade-shaped blotches outlined with red or purple. The white mottling on the cataphylls is not raised. Gladiolus grandiflorus may be difficult to separate from shorter-tubed forms of G. floribundus but that species usually has a longer perianth tube, 40-70 mm long, with the lower tepals markedly shorter than the upper. Populations from calcareous sands along the coast near Stilbaai have pink flowers with crispulate tepals. Populations from near Port Elizabeth have almost actinomorphic flowers.
            textZh: SANBI 条目提供了 Gladiolus grandiflorus Andrews 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 94507; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
