        usage:
          title: Utricularia foliosa L., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Perennial, freely suspended aquatic herbs; stolons robust, to several meters long, distinctly flattened, to 4 mm wide, mucilaginous, the internodes 2-15 cm long. Photosynthetic organs large and conspicuous, alternate on the stolons, broadly ovate in outline, to 15 cm long, + dimorphic, some bearing numerous traps, others bearing few or none, repeatedly pinnately dissected into capillary + terete segments, the ultimate segments setulose. Traps lateral on the segments, obliquely ovoid, 1-2 mm long, shortly stalked, the mouth lateral, the upper lip with 2 simple or sparsely branched setiform appendages. Inflorescences erect, emergent, 7-45 cm long, usually 10-20-flowered, initially congested, the in- florescence axis elongating with age; peduncle straight, terete, 1-3 mm thick; bracts basifixed, broadly ovate or orbicular, 2-4 mm long, the sterile scales absent or 1-2 just below the lowermost flower; pedicels at first erect, spreading and eventually + strongly recurved in fruit, to 16 mm long. Flowers with the calyx lobes subequal, broadly ovate, 3-4 mm long, + connate at the base, scarcely ac- crescent; corolla yellow, 8-15 mm long, the upper lip + orbicular, the lower lip larger, oblate to subreniform, the apex rounded, entire or emarginate, the palate much raised and spurred, the spur narrowly conical, as long as or slightly shorter than the lower lip. Capsules globose, to 8 mm in diam., indehiscent, becoming detached and floating when ripe; seeds few, lenticular, 2-2.5 mm in diam. with a narrow regular hyaline wing.
          originalLanguage: en
          sourceField: general
