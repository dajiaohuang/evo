        usage:
          title: Lindernia dubia (L.) Pennell, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Paludal herbs, often branched, sometimes rooting at the nodes, the branches slender or stout, drying angled, glabrate. Leaves opposite, elliptical or ovate, to 30 mm long, apically rounded, obtuse or occasionally acute, the upper leaves rounded, truncate or cordate and clasping the stem, the lower leaves narrowed into a distinct, petiole-like region, the margins entire or denticulate, the margins not thickened, glabrate, scarcely punctate, the veins ca. 3 from near the base, 1 or more lateral veins often inserted higher on the costa. Inflorescence solitary or paired flowers in the leaf axils, the pedicels variable in length, those near the apex much exceeding the leaves, those near the base of the stems much shorter than the leaves, slender, drying angled, glabrate, thickening near the flower. Flowers with the calyx divided nearly to the base, the lobes subequal, oblong, acute, ca. 3 mm long, corolla white with a blue or purplish throat, 5-10 mm long, sometimes cleistogamous and hardly exceeding the calyx lobes; stamens 2, inserted in the throat, the anther thecae divaricate, narrow, connate; style slender, ca. 3 mm long, the stigmas compressed, rotund. Capsule about equaling the calyx lobes, broadly ellipsoidal, ca. 4 mm long, dehiscing septicidally.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 12880
