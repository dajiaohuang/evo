    identity:
      method: Exact accepted COL26.8 usage verified in the release-pinned ChecklistBank search registry, then followed through every accepted parent node in the pinned hierarchy registry.
      scope: Exact accepted COL26.8 species usage 4S9ML. The biological evidence concerns age-specific body-mass observations of wild monkeys in one monitored reserve population in Yunnan; it does not establish range-wide sexual dimorphism or population-level survival and behavior.
