  claim-statements.zh:
    - 一组 10,000 棵合成后验树呈现 7,238 个现生两栖物种，但仅 4,061 种具有分子数据，其余使用软性分类位置；这些模型时间不是化石、COL26.8 覆盖或每种的直接序列证据。
