    - subjectId: event:extant-amphibian-7238-species-timetree
      claimKind: scientific
      claimType: divergence-time
      statement: A posterior set of 10,000 synthetic trees represents 7,238 extant amphibian species, but only 4,061 have molecular data and unsampled species use soft taxonomic placement; these model times are not fossils, COL26.8 coverage or direct sequence evidence for every species.
      confidence: medium
      confidenceRationale: The paper and archived Dryad dataset expose taxon sampling and inference procedure; medium confidence preserves model, taxonomy and unsampled-placement dependence.
      referenceLinks:
        - relation: supports
          referenceId: jetz-2018-amphibian-tree
          pages: 850–858
          figure: Figures 1–3
          quoteLocator: Methods pp. 856–857; Supplementary Information
