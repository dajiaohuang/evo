    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous herb, up to 1.5 m high. Bracts with a solid patch of hard tissue at least near base, this often drying uniform pale buff or brown. Perianth (20-)22-36 mm long. Flowers light pink to magenta-pink, occasionally white.
            textZh: Dierama insigne N.E.Br. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_11118_0
            locator: "SANBI/WFO archive Morphology row 1664; source identifier 11118.0; cited publication: Herman, PPJ; Retief, E. 1997. Plants of the northern provinces of South Africa: Keys and diagnostic characters. Strelitzia 6: 1 - 681. National Botanical Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Growing as solitary plants or in small tufts with stems mostly less than 1.5 m tall, leaves 2-6 mm wide, and pendulous spikes with partly or mostly solid bracts. The flowers are bell-shaped and pale to magenta-pink. Dierama erectum from Ngome, also with partly solid bracts, is a clump-forming species with taller stems 1.50-1.65 m tall, leaves 6-12 mm wide, and erect inflorescences with more numerous coflorescences, and subrotate flowers with conspicuous red and yellow markings at the base of the tepals.
            textZh: SANBI 条目提供了 Dierama insigne N.E.Br. 的鉴别特征。
