          title: Hyptis lantanifolia Poit., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Herbs, perennial, procumbent to ? erect, to 1.5 m, incanous in the upper parts. Leaves ovate-elliptic, acute, crenate-serrate, the bases attenuate, sparsely pubescent above, the hairs appressed on veins beneath; sessile to petioles ca 0.5 cm long. Inflorescences capitula, densely-flowered, axillary, the peduncles to 4 cm long, the bracts ovate, sometimes broadly so, 5-7 mm long, the margins crenate. Flowers sessile, tufts of hair at the bases; calyx funnelform-tubular, the tube ca 1.5-1.8 mm long, pilose-annulate within above the nutlets, the teeth spinulose, ca 2.5-3.0 mm long; corolla tube ca 4-5 mm long, white or sometimes pale pink, the lower lip ca 2 mm long, pubescent; stamens ? included in the lower lip, the filaments pubescent near the base, the anthers ca 0.3 mm long; style exserted or included in the lower lip. Nutlets (3-)4, ovoid, pale brown, ca 1 mm long.
          originalLanguage: en
          sourceField: general
