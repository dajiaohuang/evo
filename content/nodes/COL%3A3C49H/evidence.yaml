          publishedAt: undated
          originalSourceText: Slender shrubs 2-3 m. high, the young twigs densely and minutely pubescent, densely foliate. Leaves more or less distichous, oblong or lanceolate-oblong, attenu- ate at both ends, up to 4.5 cm. long and 1-2 cm. wide, membranous, glabrous, the midrib flat or slightly elevated above, prominulous beneath, the lateral nerves several but distant, diverging at an angle of about 600 from the midrib, the marginal nerve very near the margin, the reticulation obscure throughout; petiole about 2 mm. long. Flowers axillary, in a 1- to 4-flowered abbreviated raceme, the peduncle and pedicels minutely pubescent, the pedicels slender, 4-10 mm. long. Petals not seen. Fruit a small globose berry, green to purple, about 6 mm. in diameter, crowned by the 4 persistent semi-orbiculate sepals.
