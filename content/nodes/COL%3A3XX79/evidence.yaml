    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Glandular-hairy annual to 40 cm. Leaves toothed. Flowers laxly racemose, tube narrowly funnel-shaped, white to lilac with yellow tube.
            sourceIds:
              - sanbi_14436_0
            locator: "SANBI/WFO archive Morphology row 6054; source 14436.0; publication: Manning, JC; Goldblatt, P. 2012. Scrophulariaceae: Manulea L. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 745 - 747. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: One of the most easily observed differences between M. annua and M. paucibarbata is the weak bearding around the corolla mouth of the latter species (hairs sparse, up to 0.2 mm long versus plentiful, 0.4-0.6 mm long). The epithet laxa was also apt, because the terminal flowers in the inflorescence are never crowded as they are in M. annua and the racemes are very lax with the axis usually markedly flexuous (straight or weakly flexuous in M. annua). These characters, together with the mostly longer pedicels and larger flowers, as well as the glabrous filaments, combine to separate M. paucibarbata from M. annua at species, not varietal, level. It should be pointed out that the corolla tube in the type material of M. paucibarbata is short, c. 4.75 mm long, but the only flowers are either depauperate or young ones at the tips of fruiting axes. Manulea paucibarbata is also allied to M. arabldea. They share the characters of short hairs bearding the mouth and glabrous filaments, but M. arabidea has the flowers initially crowded in the inflorescence and the axis is never flexuous; also, the flowers are much smaller (e.g. corolla tube 2.75-4 mm long versus 5.5-9 mm).
            textZh: SANBI 条目提供了该种的鉴别特征。
            sourceIds:
              - sanbi_15191_0
            locator: "SANBI/WFO archive Diagnostic row 58426; source 15191.0; publication: Vollesen, KB. 2013. 126. Acanthaceae (Part 1), Fl. Zambes. 8(5): 1 - 184. Royal Botanic Gardens, Kew, London. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
