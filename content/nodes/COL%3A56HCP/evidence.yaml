        usage:
          title: Thinouia myriantha Triana & Planch., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Lianas; trunks to 12 cm diam., involuted; tendrils watchspring-like; stems terete, minutely appressed ferruginous pubescent and lenticellate, soon glabrous. Leaves 3-foliolate; petioles 2-4 cm long; terminal petiolule mostly 2-2.5 cm long, the lateral ones about half as long; blades mostly ovate to ovate-elliptic, acute to acuminate, obtuse to rounded, rarely subcordate at the base, (3.5-)6-12(-15) cm long, (2-)2.5-7(9) cm wide, the midrib arched, the sides folded somewhat upward along the midrib, sparsely pubescent when young, glabrous in age except on the midrib above and in the vein axils of the lower side, 3-veined at the base, the margin undulate, entire or crenate near the apex, the teeth blunt, usually glandular. Inflorescences of umbellate thyrses 3-4 cm diam., borne on short axillary or termi- nal branches to 7 cm long, these often bearing tendrils, the branches, peduncles, pedicles, and calyces appressed-puberulous; pedicels mostly 2.5-3.5 mm long. Flowers ? subactinomorphic, minute, greenish; calyx bowl shaped, the lobes 5, uniform, acute, 0.7-1 mm long; petals 5, uniform, obovate, ca. 0.4 mm long, each bearing from the base within a deeply bifid, pubescent scale ca. 1 mm long; disc prominent, ca. l.I mm broad, glabrous; stamens 8, actinomorphic, in a tight clus- ter around the pistil at the center of the flower, 3 erect and held closely together, 5 somewhat divergent, the filaments villous in the lower half, attached to the anthers midway, the anthers about as broad as long, the thecae usually separate below the middle; pollen tacky; staminate flowers with the stamens ca. 2.7 mm long, the pistil minute, the styles absent; bisexual flowers with the stamens less than 2 mm long, the pistil stipitate, to 3 mm long, 3-angled, weakly to densely appressed-pubescent, the style short, the stigmas 3, ca. 1 mm long, pubescent, recurved. Fruits narrowly ovate-cordate, to 6.5 cm long, brown, glabrous, stipitate, the stipe ca. 5 mm long; samaras to 1.9 mm wide, the seed-bearing part lunate, sub- marginal, ca. 1.5 cm long, the veins prominulous.
