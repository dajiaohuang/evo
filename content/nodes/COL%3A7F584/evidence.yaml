          title: Utricularia pusilla Vahl, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Annual or perhaps sometimes perennial terrestrial herbs; stolons filiform, subterranean, bearing photosynthetic organs and traps. Photosynthetic organs obovate-spatulate, 1-nerved, sometimes numerous and conspicuous but often ? decayed at anthesis, to 10 mm long and 3 mm wide. Traps obliquely ovoid, stalked, ca. 0.5 mm long, the mouth lateral, the upper lip with 2 subulate densely ciliate appendages. Inflorescences to 7 cm long; peduncle filiform, 1-15-flowered; bracts peltate, ? orbicular, the sterile scales similar to the bracts, numerous on the peduncle below the raceme and also alternating with fertile bracts on the raceme axis; pedicels spreading, 1.5-2.5 mm long. Flowers with the calyx lobes ovate, unequal, the lower lobe slightly larger; corolla yellow, ca. 6 mm long, the upper lip narrowly ovate, entire, the lower lip descending, 3-lobed, the palate gibbous, the spur subulate, acute, descending, 2-3 times as long as the lower lip. Capsules globose, ca. 1.5 mm long, considerably exceeded by the accrescent lower lobe of the calyx; seeds ovoid, ca. 0.35 mm long with about 11 longitudinal stria- tions.
          originalLanguage: en
          sourceField: general
