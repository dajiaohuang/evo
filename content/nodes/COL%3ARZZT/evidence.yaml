        usage:
          title: Cedrela odorata L., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Tree to 40 m.; branchlets generally glabrous, occasionally conspicuously lenti- cellate, more often with small lenticels. Leaves with 5-11 pairs of leaflets 8-17 cm. long by 2.5-5.5 cm. wide, broadly lanceolate to ovate, the base acute to rounded, often markedly oblique, the apex acuminate obtuse, rarely acute, sometimes mucro- nulate, generally glabrous, occasionally puberulent or short pubescent along the veins beneath. Inflorescences open, variable in size, often shorter than the leaves, usually glabrous, rarely puberulent, the bracts caducous. Flowers 6-9 mm. long; calyx cupulate and split on one side, 1.5-3 mm. deep, the margin generally shal- lowly and irregularly toothed, glabrous, rarely puberulent, light to dark in color; petals elliptical to subspatulate, puberulent without, uniformly light in color; filaments of the stamens thick but usually of uniform diam., the anthers short apicu- late, 0.75-1.5 mm. long; ovary hemispherical to ovoid, usually glabrous, 1-2 mm. long, style 1.5-2 mm. long, the capitate stigma about 0.5 mm. thick. Fruit 2.5-4.5 cm. long, the valves thin, the central column with wings extending to the base of the broadened apex.
          originalLanguage: en
          sourceField: general
