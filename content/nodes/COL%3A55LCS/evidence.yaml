          title: Tetracera portobellensis Beurl., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Liana or shrub. Leaves with the blade elliptic to obovate, the apex shortly acuminate to obtuse, the base attenuate, the margins serrate to serrulate, 10-18 cm long, 4-8 cm wide, chartaceous, pustulate, the pustules heavily incrusted with silica and giving rise to many-rayed stellate hairs, the secondary veins 15-25; petioles 3-10 mm, rarely to 15 mm long, alate. Flowers 5 mm broad, subsessile; sepals 5, obovate, 2-3 mm long and wide, densely pubescent without, glabrous to slightly pubescent within; petals 2-4, white to greenish, narrowly obovate, 5 mm long, 2 mm wide; stamens 50-80, the filaments 4 mm long, the thecae 0.2-0.3 mm long, basally divergent; carpels 1, pyriform, the style 1-2 mm long, the stigma some- what expanded and flattened. Follicle 1, glabrous, dark brown, 5-7 mm long, 3-4 mm wide, the persistent style 2-3 mm long.
