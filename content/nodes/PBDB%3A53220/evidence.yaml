  claims:
    - subjectId: taxon:mosasauroidea
      claimKind: scientific
      claimType: taxonomy
      statement: Mosasauroidea is retained as the broader branch-defined mosasauroid navigation clade and is not interchangeable with node-defined Mosasauridae; the nomenclatural analysis does not provide a global range, ancestor chain or first appearance.
      confidence: high
      confidenceRationale: The primary study explicitly tests clade definitions and tree sensitivity. High confidence applies to the scoped nomenclatural distinction only.
      referenceLinks:
        - referenceId: madzia-cau-2017-mosasauroid-nomenclature
          relation: supports
          pages: Article e3782
          figure: Table 1; Figures 1–7
          quoteLocator: Phylogenetic definitions; sensitivity analyses; Conclusions
    - subjectId: taxon:mosasauroidea
      claimKind: scientific
      claimType: fossil-range
      statement: Dallasaurus turneri from the middle Turonian Arcadia Park Shale supports a 93.9–89.8 Ma named mosasauroid sample window; it does not establish a global Mosasauroidea FAD or LAD.
      confidence: medium
      confidenceRationale: "Dallasaurus turneri mosasauroid sample: the cited primary study or systematic review directly supports the stated sample, calibration or withholding boundary at the supplied locator. Confidence is medium and does not extend to a global FAD, LAD, direct ancestor or unsampled interval."
      referenceLinks:
        - relation: supports
          referenceId: bell-polcyn-2005-dallasaurus
          pages: 177–178, 189–190
          figure: Figures 1–13
          quoteLocator: Age and geological context; systematic palaeontology; phylogenetic analysis
    - subjectId: taxon:mosasauroidea
      claimType: biogeography
      claimKind: scientific
      statement: The profile's named mosasauroid samples include Dallasaurus turneri from the middle Turonian Arcadia Park Shale of north-central Texas and a latest Maastrichtian Mosasaurus occurrence from the Maastricht type area of the Netherlands; these records do not establish a global Mosasauroidea distribution.
      confidence: high
      confidenceRationale: The primary studies identify the specimens and geological contexts directly. High confidence is limited to those occurrences and does not infer absence or a complete geographic range.
      referenceLinks:
        - referenceId: bell-polcyn-2005-dallasaurus
          relation: supports
          pages: 177–178
          figure: Figures 1–2
          quoteLocator: Age and geological context; two Dallasaurus skeletons from the middle Turonian Arcadia Park Shale
        - referenceId: jagt-et-al-2008-youngest-mosasaurus
          relation: supports
          pages: 73–77
          figure: Figures 1–2
          quoteLocator: NHMM 2007 093 from the highest metre of the Meerssen Member, within one metre below the regional K/Pg boundary
    - subjectId: taxon:mosasauroidea
      claimType: morphology
      claimKind: scientific
      statement: Dallasaurus preserves cranial, axial and plesiopedal limb anatomy in two incomplete skeletons, while the cited nomenclatural analysis distinguishes the broader Mosasauroidea branch from node-defined Mosasauridae; limb grade is not treated as the clade definition.
      confidence: high
      confidenceRationale: The named specimens, anatomical description and explicit clade definitions are directly reported. High confidence applies to this scoped anatomy-and-definition distinction, not to one universal basal topology.
      referenceLinks:
        - referenceId: bell-polcyn-2005-dallasaurus
          relation: supports
          pages: 177–194
          figure: Figures 5–13
          quoteLocator: Systematic paleontology; pectoral and pelvic girdles; plesiopedal limb description; phylogenetic analysis
        - referenceId: madzia-cau-2017-mosasauroid-nomenclature
          relation: supports
          pages: Article e3782
          figure: Table 1; Figures 1–7
          quoteLocator: Phylogenetic definitions and sensitivity analyses
    - subjectId: taxon:mosasauroidea
      claimType: ecology
      claimKind: scientific
      statement: Schulp et al. report tooth-enamel carbon-isotope, body-size and resource-partitioning results for five named mosasaurs in one type-Maastrichtian fauna; the study-bounded marine sample does not establish a single diet, body-size distribution or guild for all Mosasauroidea.
      confidence: medium
      confidenceRationale: The isotope and size measurements are direct sample data, while resource partitioning and ecological grouping are interpretations limited to five taxa in one fauna. No global ecological extrapolation is made.
      referenceLinks:
        - referenceId: schulp-et-al-2013-mosasaur-resource-partitioning
          relation: supports
          pages: 165–169
          figure: Figure 1
          quoteLocator: Tooth-enamel carbon isotopes, reconstructed body sizes and resource-partitioning interpretation for five named taxa
        - referenceId: bell-polcyn-2005-dallasaurus
          relation: contextualizes
          pages: 177–194
          figure: Figures 5–13
          quoteLocator: Dallasaurus sampled anatomy and limb-grade context
  claim-rationales.zh:
    - 主研究明确检验了支系定义和树敏感性。高置信度仅适用于这一有边界的命名学区分。
    - Dallasaurus turneri mosasauroid sample：所引一手研究或高质量系统综述在给定页码、图表或章节处直接支持此处的样本、校准或暂缓边界。置信度为中等。该置信度不外推至全球首现、全球末现、直接祖先或未采样区间。
    - 研究直接识别标本和地质背景；高置信度仅限所列出现记录，不推断缺失或完整地理范围。
    - 具名标本、解剖描述和明确支系定义均有直接来源；高置信度限于这一解剖—定义区分，不选定唯一基部拓扑。
    - 同位素与体型数据来自单一动物群的五个类群；资源分割是取样范围内解释，不外推为整个沧龙超科的统一生态位。
  claim-statements.zh:
    - 本档案所列沧龙超科样本包括得克萨斯州中北部土仑期中期 Arcadia Park 页岩中的 Dallasaurus turneri，以及荷兰马斯特里赫特阶标准地区的一条最晚马斯特里赫特期 Mosasaurus 产出记录；这些记录不能确定沧龙超科的全球分布。
    - Dallasaurus 的两具不完整骨架保留了头骨、中轴骨骼及原始型肢体结构；所引命名分析则区分了范围较广的沧龙超科分支与按节点定义的沧龙科，不以肢体形态等级作为演化支的定义。
    - Schulp 等报告了马斯特里赫特阶标准地区一个动物群中五种已命名沧龙的牙釉质碳同位素、体型和资源分配结果；这一受研究范围限定的海生样本不能确定全部沧龙超科统一的食性、体型分布或生态功能类群。
    - 沧龙超科保留为较宽的分支定义沧龙类导航支系，不能与节点定义的沧龙科互换；该命名分析不提供全球范围、祖先链或首现。
    - 中土仑期 Arcadia Park 页岩中的 Dallasaurus turneri 支持 9390–8980 万年前的具名沧龙超科样本窗口；它不能确定沧龙超科的全球首现或末现。
