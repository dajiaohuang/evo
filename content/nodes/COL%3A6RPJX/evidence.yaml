    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants 450-700 mm high, solitary, rarely in small clumps, possibly evergreen. Corm up to 20 mm diam.; tunics of medium-textured fibres. Stem sheathed below by pale fibrous cataphyll up to 200 mm long forming a basket-like network, unbranched (rarely with a sessile lateral rhipidium), covered by 3 or 4 overlapping sheathing leaves, 120-150 mm long, green or becoming dry distally. Foliage leaf solitary, linear, channelled to ± flat, much exceeding stem, 12-15 mm wide, suberect, later trailing distally. Rhipidial spathes green with dry brown tips, inner 120-150 mm long, outer slightly shorter. Flowers long-lived, bright yellow, outer tepal limbs with large, orange nectar guides at bases, reflexed to ± 45º; outer tepals 65-70 x 25 mm; inner tepals 50-60 x 15 mm, ± erect. Filaments ± 13 mm long, united in lower 1/2; anthers ± 15 mm long, white; pollen white. Ovary cylindric, 20-30 mm long; style branches ± 20 mm long, crests 15-18 mm long. Capsules cylindric-3-lobed, 30-40 mm long. Seeds flattened, discoid.
            textZh: Moraea reticulata Goldblatt 的 SANBI 物种条目记载了植株、叶片和花部形态。
            sourceIds:
              - sanbi_18638_0
            locator: Strelitzia 42; archive Morphology row 84350, source 18638.0
            placeTimeScope: Regional species account published 2020; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
          - text: Allied to the widespread Moraea spathulata, the flowers of M. reticulata are almost identical in size and general aspect but the plants themselves differ in being almost invariably solitary. Moraea spathulata occurs in the same areas as M. reticulata but blooms from November to January, whereas M. reticulata flowers later, from March to May. The species is also recognised by the distinctive cataphylls, the uppermost of which extends well above the ground as a grey or brown basket-like network around the base of the leaf and stem. Occasionally also seen in M. spathulata, the cataphylls are never as prominently developed.
