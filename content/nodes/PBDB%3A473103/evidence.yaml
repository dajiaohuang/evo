  claim-rationales.zh:
    - 托昆米亚正模与副模的分类字段只陈述所引研究与导航范围；不会把矩阵位置、数据库映射或样本相似性改写为直系祖先。
    - 托昆米亚正模与副模的地理字段限于具名样本或明确模型范围，不外推为全球分布、起源中心或完整扩散路径。
    - 托昆米亚正模与副模的生态字段区分保存事实与功能推断；未被直接记录的饮食、行为、栖息地偏好和性能均保留不确定性。
    - 托昆米亚正模与副模的形态字段限于主研究列明的标本、样本或分析，并连接到精确页码、图版或补充材料。
    - 托昆米亚正模与副模的年代范围是有界的标本、地层或模型投影，不作为全球首现、末现、分化时间或连续谱系时长。
  claim-statements.zh:
    - 所引形态矩阵将 Tokummia katalepsis 恢复为干群有颚类；这不表示它是甲壳类、昆虫或多足类的直系祖先。
    - 本档案限于 Marble Canyon 的布尔吉斯页岩材料，不能据此确立全球分布。
    - 大颚和附肢支持摄食与运动假说，但猎物、惯常利用的底质及运动性能并未被直接观察。
    - ROM 63823 及副模标本保存了成对的大颚、颚足和进一步分节的基肢。
    - 508 Ma 显示点是该产地样本的年代，并非该物种的全球延限或有颚类起源年代。
