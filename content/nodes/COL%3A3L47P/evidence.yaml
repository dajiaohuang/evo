    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Perennial herb, geophyte, 0.1-0.3 m; corm turbinate with concentric tunics; stem simple or rarely 1-branched, erect. Leaves 4, lower 2 basal, the other sheathing, straight or falcate, (sub)acute, margins thickened; midrib raised, secondary veins visible on both surfaces. Bracts green, often reddish at apex. Inflorescence a 5-15-flowered spike; flowers bright magenta-pink; perianth tube 6.0-12.5 mm long, dilated in throat; tepals subequal 12-16 x 4.5-5.0 mm, open in sunlight. Stamens exserted; filaments 3-4 mm long; anthers 6.0-8.5 mm long. Flowering time Dec.-Mar. Capsule oblong.
            textZh: Hesperantha baurii Baker 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_18505_0
            locator: "SANBI/WFO archive Morphology row 91015; source identifier 18505.0; cited publication: Bredenkamp, CL; Magwaza, ZL. 2019. Iridaceae. In: CL Bredenkamp (ed.), A Flora of the Eastern Cape Province, Strelitzia 41(3): 1821 - 1882. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: The tallest and most robust of the short-tubed, eastern southern Africa species of the genus, Hesperantha baurii is unusually variable. Populations from high elevations in the Drakensberg, with four (occasionally three) leaves, and spikes of up to 4(-6) large, deep pink (also described as magenta) flowers with tepals 12-21 mm long, up to 3 times as long as the tube, are recignised as subsp. formosa. Typical H. baurii has four or five leaves, and spikes of up to 12(-18) flowers with tepals 12-18 mm long, up to 1.5 times as long as the tube. The stems of subsp. baurii are up 400 mm tall and sometimes branched but those of subsp. formosa seldom reach 300 mm and are always unbranched. Populations at lower elevations in the Drakensberg may be intermediate between the two subspecies, a situation not unexpected in subspecies. Hesperantha baurii can be recognised by the relatively short perianth tube, mostly 7-12 mm long, tepals 12-18(-21) mm long, and (three) four (five) leaves, the lower two largest and basal, the third leaf sheathing in the lower half, and the uppermost leaf usually short, inserted in the middle of the stem and entirely sheathing. Only the most robust individuals may have a single branch. The spike ranges from weakly to markedly flexuose and in subsp. baurii bears up to 15 flowers, occasionally more, and spikes with as many as 18 flowers have been recorded. Hesperantha baurii is most easily confused with pale pink-flowered H. leucantha, but this is a more slender, often trailing plant, with spikes of 2 to 6 flowers, the the filaments inserted just below the mouth of the perianth tube and 4-5 mm long, ± as long as the anthers. In H. baurii the filaments are inserted at the base of the outer tepals and ± 2.5 mm long, thus less than half as long as the anthers, 6-8 mm long.
