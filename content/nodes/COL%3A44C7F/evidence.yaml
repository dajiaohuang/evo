    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Stemless, cormous geophyte, 20-50 mm tall. Leaves 3 or 4, slender and terete, falcate, flattened on the upper surface. Flowers in a basal tuft, pink with yellow cup, tubular below, tepals cupped, filaments in a column, style exceeding anthers, style lobes entire.
            textZh: Moraea kamiesmontana (Goldblatt) Goldblatt 的 SANBI 物种条目记载了植株、叶片和花部形态。
            sourceIds:
              - sanbi_14562_0
            locator: Strelitzia 30; archive Morphology row 33289, source 14562.0
            placeTimeScope: Regional species account published 2013; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
          - text: Moraea kamiesmontana stands out in subg. Galaxia not only in its particularly small size but in the structure of its flowers. In other species of the subgenus the flowers have flaccid, widely cupped tepals that lack distinct claws, but in M. kamiesmontana the ascending tepal claws form a narrow cup enclosing the filaments and the limbs are sharply flexed at right angles to the cup, thus extended horizontally. The chromosome number, 2n = 18, is the ancestral number for the subgenus, and we interpret Moraea kamiesmontana as a relict species, surviving in specialised, seasonally moist, montane habitats.
            textZh: SANBI 条目提供了 Moraea kamiesmontana (Goldblatt) Goldblatt 的鉴别特征。
