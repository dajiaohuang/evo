    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Perennial herb, geophyte, 0.45-0.50 m high; corm turbinate with concentric tunics; stem erect, simple or branched. Leaves 4, straight or slightly falcate, acute, margins thickened, midrib raised, lower 2 basal, uppermost sheathing. Bracts green, sometimes with red apex. Inflorescence a 4-14-flowered spike; flowers creamy yellow; perianth tube 21-27 mm long, dilated in throat; tepals 14-20 x 4-6 mm, elliptic, subacute, open in sunlight. Stamens exserted; filaments (3-)4 mm long. Flowering time Nov., Dec. Capsule oblong.
            textZh: Hesperantha lactea Baker 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_18505_0
            locator: "SANBI/WFO archive Morphology row 91005; source identifier 18505.0; cited publication: Bredenkamp, CL; Magwaza, ZL. 2019. Iridaceae. In: CL Bredenkamp (ed.), A Flora of the Eastern Cape Province, Strelitzia 41(3): 1821 - 1882. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: A relatively tall species sometimes up to 500 mm high or more, with pale, creamy white to pale yellow flowers with a tube 6.0-8.5 mm long, and spreading tepals 14-20 mm long. The anthers, 5-7 mm long, are discolorous, usually brown or dull yellow, an unusual feature among white-flowered species of the genus. Like other white to pale yellow-flowered Hesperantha species of eastern southern Africa, the flowers are diurnal, with records of opening 11:45-12:30 and closing 16:40-17:15. This contrasts sharply with most white-flowered species of the genus from the southern African winter-rainfall zone, the flowers of which are crepuscular to nocturnal, opening in the late afternoon and closing after dark.
            textZh: SANBI 条目提供了 Hesperantha lactea Baker 的鉴别特征。
