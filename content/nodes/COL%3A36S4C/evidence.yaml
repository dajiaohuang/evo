          - text: Flexuose to erect, tuberous geophyte to 60 cm, stoloniferous. Leaves clustered below, narrowly lanceolate. Flowers 1-few in a lax raceme, carmine-red to orange, spur 10-15 mm long, lateral sepals narrowly ovate, 35-65 mm long.
