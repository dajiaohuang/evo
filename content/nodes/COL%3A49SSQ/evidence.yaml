    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Researchers measured skin reflectance in 255 live Oophaga pumilio from six populations in Costa Rica and Panama between December 2008 and June 2011. Their visual models found population differences in color and brightness contrast among sampled dorsal and ventral coloration. These measurements describe the sampled populations; they do not establish that selection caused the divergence or characterize every population of the species.
            sourceIds:
              - dreher2015
            locator: Methods, Reflectance Measurements and Visual Modeling; Results, Color Contrast, Brightness Contrast, and Overall conspicuousness.
            placeTimeScope: "Six populations: Sarapiquí and Hitoy Cerere in Costa Rica; Río Gloria, Tierra Oscura, Isla Colón, and Isla Solarte in Panama. Field measurements were collected between December 2008 and June 2011; the article was published 2015-06-25."
            lifeStatus: Live, free-living frogs were measured in the field and released at their capture sites. No captive or domesticated frogs support the claim.
            originalLanguage: en
            textZh: 研究者于 2008 年 12 月至 2011 年 6 月，在哥斯达黎加和巴拿马六个种群测量 255 只活体 Oophaga pumilio 的皮肤反射率。视觉模型显示，所采样背部和腹部颜色的色彩与亮度对比在种群之间不同。样地为 Sarapiquí、Hitoy Cerere、Río Gloria、Tierra Oscura、Isla Colón 和 Isla Solarte。蛙在野外测量后原地放回；这些结果不证明差异由选择造成，也不代表本种全部种群。
        gaps:
          - The study measures color and brightness contrasts, not all morphological traits or within-population variation across the species range.
          - A population comparison does not by itself establish the evolutionary causes of coloration differences.
      lifeHistory:
        status: not-assessed
      ecology:
        status: partially-supported
        claims:
          - text: In 20-day experiments at six sampled populations, researchers deployed 1,600 standardized clay frog models per population. Attack rates varied among populations and were higher at the two sampled Panama island populations than at several mainland populations; local versus non-local model origin had no significant overall effect. These are predator interactions with clay models, not mortality or survival measurements of live frogs.
            sourceIds:
              - dreher2015
            locator: Methods, Predation experiments; Results, Predation experiments and Fig. 2 caption.
            placeTimeScope: The six model-placement populations were Sarapiquí, Hitoy Cerere, Río Gloria, Tierra Oscura, Isla Colón, and Isla Solarte in Costa Rica and Panama. The main article gives the live-frog field-work period as December 2008 to June 2011 but does not date each model experiment separately; exact experiment dates remain unknown.
            lifeStatus: The focal frogs are free-living; attacks were recorded on non-toxic clay models placed in their habitat, not on live or captive frogs.
            originalLanguage: en
            textZh: 研究者在哥斯达黎加和巴拿马的六个样地分别进行 20 天实验，每处放置 1,600 个标准化黏土蛙模型。模型受攻击率在样地间不同，所采样的两个巴拿马岛屿样地高于若干大陆样地；模型属于本地或非本地型的总体效应不显著。这是捕食者与黏土模型的相互作用，不是活蛙死亡率或存活率测量。样地为 Sarapiquí、Hitoy Cerere、Río Gloria、Tierra Oscura、Isla Colón 和 Isla Solarte；正文没有逐一给出模型实验日期，因此精确实验日期仍未知。
        gaps:
          - Clay-model attacks cannot estimate live-frog mortality, survival, or realized predator selection on natural populations.
          - Some imprints were classified only as potential bird marks; other predator classes had few observations, and the result is limited to six populations.
      evolution:
        status: not-assessed
      distribution:
        status: not-assessed
      fossil:
        status: not-assessed
      conservation:
        status: not-assessed
