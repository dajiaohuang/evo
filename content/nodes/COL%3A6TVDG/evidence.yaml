    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, 3-10 cm, corm tunics finely netted. Leaves 2-5, suberect, narrowly lanceolate, smooth. Flower 1, stellate, yellow, backed with pale green, stamens unequal, anthers oblong, inner face of anther connective convex, bract 1, linear, inconspicuous.
            textZh: Pauridia aemulans (Nel) Snijman & Kocyan 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13877_0
            locator: "SANBI/WFO archive Morphology row 7526; source identifier 13877.0; cited publication: Snijman, DA. 2012. Hypoxidaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 115 - 119. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Unusual within Pauridia aemulans are the distinctly biseriate stamens in which the inner and often the outer filaments clearly exceed the anthers in length. This character is also found in Pauridia maryae and seems to suggest a close relationship between the two species. P. aemulans is distinguished by a solitary, linear bract (1.5-7.5 x ca. 0.2 mm) at the base of a short pedicel (12-20 mm long) and by a broad anther connective which is somewhat thickened on the ventral surface. P. maryae sometimes has a thickened anther connective but invariably has two, narrowly lanceolate bracts (10-16 x 2-3 mm) that clasp the base of long (56-80 mm) pedicels. The only other species with a distinctly thickened anther connective is the autumn flowering P. monophylla, inferred by Nel to be closely related to P. aemulans. Nevertheless, the connective in P. monophylla is dorsally rather than ventrally thickened, which is unlike any other species in the genus, hence the dehiscence is introrse. Both species initiate flowering earlier than most of the other yellow-flowered taxa, but a close alliance between the two seems unlikely. A phylogenetic anaylsis of all species within Pauridia is still needed to fully resolve this. The slender, cohering stigma branches, which extend into three shortly spreading caudate basal lobes, are reminiscent of P. trifurcillata but this species has two bracts per inflorescence and the apices of the stigma branches are somewhat capitate and not tapered as in P. aemulans.
