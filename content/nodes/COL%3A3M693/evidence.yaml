        usage:
          title: Hoffmannia manussatani Dwyer, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: depression, prominulous beneath, ca. 0.2 mm wide proximally, the lateral veins ca. 18, arcuate, the submarginal vein inconspicuous and proximate to the margin, the veinlets pinnatiform, chartaceous, concolorous, drying reddish, glabrous; stipules widely triangular, to 0.6 cm long, wider than long, thickly chartaceous, glabrous. Inflorescences axillary, elongate pedunculate, the pedunform, to 30 cm long, twisted, angular, puberulent, 1.6-2.3 mm wide basally, with 4 pairs of bracts, the basal bracts much reduced, rotund, to 3.5 mm long, the other 2 pair well spaced, one pair at the apex of the lower 1/3 of the peduncle, the other at the base of the upper 1/3, rotund or ovate rotund, 1.6-2.5 cm long, obtuse or rounded at the apex, stiffly chartaceous, ascending, the costa and veins evi- dent, disposed as in the leaves, the flowers few, loosely aggregated in a terminal rotund or compressed rotund head, to 2.5 cm in diameter, presumably of few cymules; bracts oblong or ovate oblong, 7-9 mm long, stiff, ciliolate marginally and on the keel, usually narrowing toward the apex. Flowers sessile (in bud), the hypanthium turbinate, ca. 2 mm long, densely ferrugineous villosulose, the ca- lycine cup short, the calycine lobes 4, narrowly triangular, ca. 3 mm long, ca. 1 mm wide, obtuse, thickly carnose especially dorsally, ferrugineous ciliolate at the base outside and marginally, glabrous within; corolla lobes 4, oblong, ?4 mm long, carnose; stamens sessile, the anthers 4, rectangular oblong, to 4 mm long, to 1.2 mm wide; style slender, to 5.5 mm long, ca. 0.4 mm wide, obtuse at the apex, the stigmas not distinct, the ovarian disc compressed, to 1.8 mm wide, the ovules numerous, subrotund, ca. 0.05 mm wide, compressed, reticulate.
