          title: Mitracarpus breviflorus A.Gray, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Herbs to 1.5 dm, branched, the stems slender, angular, sparsely hairy. Leaves sessile, usually opposite, occasionally 4-several per node, lanceolate, ovate lan- ceolate, to 2 cm long, to 0.4 mm wide, the lateral veins few, vague, the blades stiff, scabrid above, otherwise glabrous, glabrous beneath, the margin revolute. Inflorescences with heads to 1 cm wide. Flowers white. Fruits to 3 mm long, glabrous below the line of dehiscence, pubescent above, the horns to 2 mm long, unequal, pubescent, the seeds oblong, ca. 0.5 mm long, with 2 diagonally crossed grooves on the ventral surface.
