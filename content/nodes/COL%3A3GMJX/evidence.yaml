        claims:
          - text: "Perennial shrub or dwarf shrub, 0.2-0.5 m high; densely branched; branches short, slender, reddish, at first hirsute, soon glabrescent, leaf scars small. Leaves opposite, ovate or ovate-oblong, acuminate, coriaceous, finely verrucose on margins of upper part, otherwise glabrous, 3-5-nerved beneath. Flowers few at ends of branches. Hypanthium: pubescent outside; tube narrowly funnel-shaped; sepals ovate-lanceolate, acute and thick at apex. Petaloid floral scales 4, membranous. Anthers oblong, obtuse, upper exserted on filaments. Ovary ovoid, hairy at top. Style longer than hypanthium tube, stout. Stigma papillose. Flowering time July-Dec."
            sourceIds:
