        sectionEvidence:
          - sectionOrdinal: 0
            topic: fossil
            heading:
              en: An apparently lost type limits comparison at Orsberg
              zh: 模式似已遗失，限制 Orsberg 比较
            referenceId: ref-e2e04022-53dd-4a54-a9de-957c7d568588
            sourceKey: primary-fossil-pmc4589347-ogygius
            locator: PMC4589347 XML sec007 paragraphs 2, 5; sec009 paragraph 2; sec008 paragraph 0
            locatorPrecision: manually-recorded-section-and-paragraph-label
            evidenceSummary:
              en: The 2015 authors state that ogygius came from the same locality as MB.Am.45, but comparison is hampered by the apparent loss of its type and only known specimen. The old specimen was illustrated in ventral view, whereas MB.Am.45 preserves dorsal anatomy. Shared locality is therefore not proof of shared species identity, and MB.Am.45’s new cast is not a replacement ogygius type. The bounded empty occurrence query in the database reader does not erase this historical literature record; neither source proves a complete geographic or temporal range.
              zh: 2015 年作者记 ogygius 与 MB.Am.45 来自同一地点，但模式及唯一已知标本似已遗失，限制比较。旧标本图为腹面，MB.Am.45 保存背面解剖。共享地点不证明同种，新 MB.Am.45 翻模也不是替代 ogygius 模式。数据库读本限定查询未返出现记录，不消除这一历史文献记录；二者都不证明完整地理或时间范围。
            scope:
              en: Published specimen or comparative scope only; database concept equivalence, species-wide biology and full phylogenetic placement are not independently certified.
              zh: 仅限出版标本或比较范围；数据库概念等同性、全物种生物学及完整系统位置未经独立认证。
          - sectionOrdinal: 1
            topic: morphology
            heading:
              en: A historical vertebral count is an estimate from incomplete material
              zh: 历史椎骨数是部分材料估计
            referenceId: ref-e2e04022-53dd-4a54-a9de-957c7d568588
            sourceKey: primary-fossil-pmc4589347-ogygius
            locator: PMC4589347 XML sec007 paragraph 5; sec009 paragraph 2
            locatorPrecision: manually-recorded-section-and-paragraph-label
            evidenceSummary:
              en: "The paper recounts an older estimate of twelve presacral vertebrae for ogygius: the first ten were preserved, with presumed sacral and proximal tail vertebrae separated by a gap. This remains a historical reconstruction, rather than a new verified count or invariant species character. Other Chelotriton material was reported with different sacral positions, and the authors note vertebral variation even among living salamanders. Without comparable type material, the 2015 study neither resolves ogygius identity nor supplies its feeding, reproduction or growth chronology."
              zh: 论文转述 ogygius 较早荐前椎十二枚估计：前十枚保存，推定荐椎及近端尾椎之间有缺口。这是历史重建，不是新核实计数或恒定物种性状。其他 Chelotriton 材料有不同荐椎位置报告，作者提醒现生蝾螈也有椎数变化。缺少可比模式材料，2015 年研究未解决 ogygius 身份，也未提供取食、繁殖或生长年代。
            scope:
              en: Published specimen or comparative scope only; database concept equivalence, species-wide biology and full phylogenetic placement are not independently certified.
              zh: 仅限出版标本或比较范围；数据库概念等同性、全物种生物学及完整系统位置未经独立认证。
