        claims:
          - text: Tree or shrub, 0.5-4.0 m high; bark smooth, branches glabrous, armed or unarmed. Leaves petiolate, trifoliolate; leaflets sessile, membranous to subcoriaceous, shiny dark green above, paler below, obovate to broadly elliptic, margins entire. Inflorescence axillary panicles, forming exposed sprays among foliage, ± 70 mm long; females ± 400 flowers, terminal, ± 20 mm long; males ± 1600 flowers. Flowers minute, yellowish; calyx lobes < 0.25 mm long; corolla lobes ± 1 mm long; rarely 6-merous. Flowering time Feb.-May. Fruit a drupe, circular, glabrous, shiny, dull yellow to reddish, drying brown. Green above, paler below, obovate to broadly elliptic, margins entire. Inflorescence axillary panicles, forming exposed sprays among foliage, ± 70 mm long; females ± 400 flowers, terminal, ± 20 mm long; males ± 1600 flowers. Flowers minute, yellowish; calyx lobes < 0.25 mm long; corolla lobes ± 1 mm long; rarely 6-merous. Flowering time Feb.-May. Fruit a drupe, circular, glabrous, shiny, dull yellow to reddish, drying brown.
