          originalSourceText: Twining, glabrous lianas. Leaves alternate, spiral, subpalmate, 3-lobate, trun- cate at the base, glabrous, ca. 6 cm. wide, 6 cm. long. Pseudostipules present. Flowers axillary, ca. 15 to 20 cm. long, red-brown with purple stripes, the utricle elliptic, ca. 5 cm. long, 3 cm. wide, curving abruptly at the apex with slight nar- rowing into the tube, ca. 5 cm. long, 2 to 3 cm. wide, ending in the bialate limb which terminates in a long filiform extension. Seeds numerous, horizontally compressed, 6 mm. diameter, 0.75 mm. thick.
