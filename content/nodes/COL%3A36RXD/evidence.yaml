    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants flexuose, 80-300 mm tall; basal leaves spathulate, apiculate, 6-16 x 3-7 mm, cauline leaves 1-4, lanceolate, the upper half free and distant from the scape. Inflorescences 1-6-flowered. Flowers white to rarely rose-red, the lip pale green; pedicels mostly well exserted from the bracts. Median sepal linear, acuminate, recurved, convex, basal part forming a hood over the petals, 7-12 x 1.5-2 mm; spur 5-10 mm long, straight or slightly decurved, bifid; lateral sepals linear-lanceolate, acuminate, recurved, 12-18 mm long. Petals 3-5 mm long, apex bifid, anticous lobe reduced to a fold. Lip apical tooth (2-) 8 (-13) mm long, subulate, mesochile margin often undulate, hypochile small. Rostellum short and broad.
