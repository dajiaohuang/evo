    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Delicate, cormous geophyte to 12 cm, tunics woody, imbricate, stem puberulous below, rarely branched. Leaves linear-falcate, margins and central vein narrowly winged, smooth. Flowers in a 1- or 2-flowered spike, white, veins tinged blue below, outer tepals flushed blue outside, stamens symmetrical, filaments unequal.
            textZh: Geissorhiza demissa Goldblatt & J.C.Manning 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 6832; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Closely allied to the common and widespread Geissorhiza aspera, G. demissa is a smaller plant rarely reaching 120 mm in height. It has the plane leaves with margins and main vein only lightly thickened, puberulous stem, and unequal stamens consistent with G. aspera but the smaller flowers have tepals only 7-10 mm long and anthers 2-3 mm long. The variable G. aspera typically has dark blue to violet flowers although northern populations from the Cederberg and Gifberg have white or bicoloured white and blue flowers. Geissorhiza aspera is typically larger in all respects and almost invariably branched, with leaf blades 2-7 mm wide, 2- to 7-flowered spikes, and stems that are puberulous up to the base of the spike, even in the northern, white-flowered populations. The unbranched stems of G. demissa are subglabrous below the spike and the leaves are never more than 1 mm wide. The flowers of the two species are similar in shape, but those of G. aspera are larger and nodding with horizontally oriented stamens and tepals 11-15 x 4-6 mm and anthers 2-5 mm long.
            textZh: SANBI 条目提供了 Geissorhiza demissa Goldblatt & J.C.Manning 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 94725; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
