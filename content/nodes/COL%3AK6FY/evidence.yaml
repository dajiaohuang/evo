    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Acaulescent, cormous geophyte, 5-14 cm, stem usually underground, shorter than leaves. Leaves lanceolate, hairy. Flowers zygomorphic, blue to purple with white markings, usually fragrant, tube elongate, straight, inner bracts forked apically, ovary smooth.
            textZh: Babiana sambucina (Jacq.) Ker Gawl. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 6752; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Recognised by the smooth spike borne at ground level, a distinctive lowermost outer floral bract that is extended upward into a short blade, and flowers with a long, straight perianth tube and nearly equal tepals. The leaves and bracts are often almost hairless or at best velvety but are sometimes sparsely long-hairy, and with silky pubescence at the top of the leaf sheaths. The perianth is pale to deep blue or violet and the lower lateral tepals each have a prominent white mark edged in dark blue and sometimes red. The tepals are relatively large, usually 30-35 mm long, only slightly shorter than the tube, mainly 35-55 mm long, or sometimes equalling the tube. Flowers of most populations are strongly and sweetly scented of violets, a particularly characteristic feature of the species Babiana sambucina can be confused with the widespread B. bainesii (long misidentified as B. hypogaea) of summer-rainfall southern Africa. The latter differs most significantly in the spike being borne just below the ground so that the flowers arise at about ground level, whereas in B. sambucina the spike is carried slightly above the ground. The leaves of B. bainesii are longer and normally narrower than in B. sambucina, usually 3-10 mm wide, and roughly hairy, but the degree and type of leaf pubescence is variable in both species. The perianth tube of B. sambucina, normally 35-55 mm long, is similar to that of B. bainesii, but the tepals, 20-60 x 6-12 mm, are proportionally narrower than in B. sambucina and do not overlap one another in the lower half as in B. sambucina. In addition, the perianth tube of B. bainesii has a wide throat and the lower tepals are joined to the upper laterals, forming a prominent lip not found in B. sambucina, which has the tube cylindric or gradually expanded from the base and the tepals arise at more-or-less the same level. Among the species of the southern African winter-rainfall zone, Babiana sambucina may be most closely allied to B. framesii of the Bokkeveld Plateau and we find it difficult to separate the two when dry. Babiana framesii has, like B. sambucina, a long straight perianth tube, although somewhat curved below the throat, but the somewhat smaller tepals are proportionally narrower and spread almost at right angles to the tube, and the flowers are at most only lightly scented.
