    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants to 200 mm tall; roots fasciculate, swollen, brown, hairy; stems erect without creeping rhizomes, with a few reduced sheaths at the base; leaves numerous, imbricate, erect, linear-lorate, acute, to 60 x 5 mm, grading apically into the sheaths. Inflorescences cylindrical, with numerous, imbricate flowers; bracts linear-lanceolate, acute, overtopping the flowers. Flowers 3 mm long, white with a yellow lip. Sepals apically cu-cullate, narrowly ovate, 1-nerved; median 3 x 1.5 mm; laterals suboblique, 2.5 x 1 mm. Petals rounded, 2-nerved, flat, 2.8 x 1 mm. Lip pandu-rate, 2.2 mm long, basally saccate with a couple of calli, apical third swollen, finely papillate, margins somewhat incurved. Gynostemium 1 mm tall; stigma broad; rostellum lobes 0.5 mm long, spreading.
