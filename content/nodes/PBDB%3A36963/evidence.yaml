          relation: supports
          pages: 66–69
          quoteLocator: Abstract and comparative discussion of Devonian tetrapod limb material
    - subjectId: taxon:acanthostega
      claimType: biogeography
      claimKind: scientific
      statement: The Acanthostega limb material cited here comes from East Greenland Upper Devonian deposits; the locality is a documented sample, not a global distribution estimate.
      confidence: high
      confidenceRationale: The geographic context is explicitly reported with the described limb specimens. No absence or wider range is inferred from the locality.
      referenceLinks:
        - referenceId: coates-1990-polydactyly
          relation: supports
          pages: 66–69
          quoteLocator: East Greenland specimen descriptions
    - subjectId: taxon:acanthostega
      claimType: morphology
      claimKind: scientific
      statement: Described Acanthostega forelimb material preserves eight digits, demonstrating a non-pentadactyl Devonian limb condition; digit count alone does not demonstrate habitual terrestrial walking.
      confidence: high
      confidenceRationale: The digit count is a direct observation in the primary description. The locomotor boundary is retained because the paper does not make digit number equivalent to observed terrestrial behaviour.
      referenceLinks:
        - referenceId: coates-1990-polydactyly
          relation: supports
          pages: 66–69
          figure: Figures 1–3
          quoteLocator: Forelimb digit descriptions and discussion of digit number
    - subjectId: taxon:acanthostega
      claimType: ecology
      claimKind: scientific
      statement: The cited Acanthostega limb study does not directly establish diet, habitat preference or observed locomotor behaviour; ecological fields therefore remain unresolved apart from the bounded depositional context.
      confidence: medium
      confidenceRationale: The primary evidence is limb anatomy and comparative interpretation, not direct ecological observation. The profile leaves unsupported ecological fields unresolved.
