    - subjectId: taxon:acanthostega
      claimType: taxonomy
      claimKind: scientific
      statement: The Acanthostega limb study treats the material as an early tetrapod and compares its digit number with Ichthyostega and Tulerpeton; this package does not convert that comparison into a universal phylogenetic tree.
      confidence: medium
      confidenceRationale: The cited primary study provides the taxonomic context and explicit comparative sample, but the profile intentionally avoids extending a limb comparison into an unreported complete topology.
      referenceLinks:
