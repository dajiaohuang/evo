          quoteLocator: Specimen context and discussion of aquatic adaptation
  claim-rationales.zh:
    - 棘螈：置信度为中：继承的具体页码、图版或章节定位器支持具名标本或抽样分析的存在与范围；措辞有意把结论限制在该证据内，不把导航包络提升为全球生物边界、直接祖先或精确起源。
    - 一手研究提供早期四足动物的分类语境和比较样本，但肢体比较不能单独构成完整系统树。
    - 东格陵兰晚泥盆世产地与标本描述相互对应；声明不从该样本推断全球分布或缺失。
    - 八趾是描述标本的直接观察；论文并未把趾数等同于已观察到的陆地行走行为。
    - 研究重点是肢体解剖与比较解释，不是食性、生境偏好或直接行为观察；这些字段保持未解析。
  claim-statements.zh:
    - Acanthostega 的肢体研究将这些材料视为早期四足动物，并将其指趾数量与 Ichthyostega 和 Tulerpeton 比较；本内容包不把这种比较转换为通用系统发育树。
    - 此处引用的 Acanthostega 肢体材料来自格陵兰东部上泥盆统沉积；该地点是有记录的采样地点，并非全球分布估计。
    - 已描述的 Acanthostega 前肢材料保留八个指，展示了泥盆纪非五指型的肢体状态；仅凭指的数量不能证明其惯常在陆地行走。
    - 所引 Acanthostega 肢体研究未直接确定食性、生境偏好或实际观察到的运动行为；因此，除研究限定的沉积背景外，生态字段仍未确定。
    - Acanthostega 在此由来自东格陵兰法门阶晚泥盆世沉积物的已描述肢材料约束；这一有限样本背景不是全球分布或精确完整延限。
