  claims:
    - subjectId: event:ediacaran-biota
      claimKind: scientific
      claimType: fossil-range
      statement: CA–ID–TIMS U–Pb ages bracket the Gaskiers glaciation, and Avalon fossils appear in younger strata by about 571 Ma; this directly dates a regional assemblage, not the origin of animals or a global Ediacaran first appearance.
      confidence: high
      confidenceRationale: High-precision zircon ages and measured stratigraphic order securely bound the Newfoundland succession. High confidence is regional and horizon-specific; correlation to global biological origins remains a separate inference.
      referenceLinks:
        - relation: supports
          referenceId: pu-2016-gaskiers-ediacara
          pages: 955–958
          figure: Figures 1–3
          quoteLocator: Geologic setting; U–Pb geochronology; GSA Data Repository
        - relation: contextualizes
          referenceId: narbonne-2005-ediacara
          pages: 421–442
          quoteLocator: Global Ediacaran assemblage synthesis
  claim-rationales.zh:
    - 高精度锆石测年和实测地层顺序牢固约束纽芬兰剖面；高置信度仅适用于区域层位，并不把约 5.71 亿年前误写成动物起源或全球首现。
  claim-statements.zh:
    - CA–ID–TIMS 铀铅测年约束了加斯基尔斯冰期，阿瓦隆化石在其上覆地层中于约 5.71 亿年前出现；这直接测定的是区域组合，而非动物起源或全球埃迪卡拉生物群首现。
