  claims:
    - subjectId: event:ostracod-phylotranscriptome-topology
      claimKind: scientific
      claimType: topology
      statement: Nine new ostracod transcriptomes combined with morphology, fossils and existing sequence partitions support major pancrustacean groupings in selected analyses, but ostracod monophyly and several deep nodes change with gene-rate filters, outgroups and data combination.
      confidence: high
      confidenceRationale: The datasets and sensitivity analyses are explicit; the claim reports conditional support rather than promoting one tree to uncontested fact.
      referenceLinks:
        - referenceId: oakley-2013-ostracod-phylotranscriptomics
          relation: supports
          pages: 215–233
          figure: Figures 1–5; Tables 1–5
          quoteLocator: Transcriptome sequencing; Data subsets; Fossil placement; Discussion
  claim-rationales.zh:
    - 转录组、形态矩阵和敏感性分析均明确公开；结论保留基因速率筛选、外群和数据组合造成的拓扑差异。
  claim-statements.zh:
    - 九个新介形类转录组与形态、化石及既有序列分区结合后，在部分分析中支持主要泛甲壳类分组；但介形类单系性和若干深层节点会随基因速率过滤、外群和数据组合而改变。
