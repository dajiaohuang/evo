        usage:
          title: Carpotroche platyptera Pittier, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrub 1.50-2.40 m high, or small tree up to 6 m high, the trunk to ca 7.5 cm in diam, the young branchlets inconspicuously puberulous. Leaves on petioles to 5 cm long, thick, and inconspicuously puberulous; blade obovate to narrowly obovate, long-attenuate towards the base, obtuse at the base, acuminate at the apex, coarsely serrate to serrulate along the margins, to 50 cm long and 18 cm wide, chartaceous, inconspicuously puberulous mainly along the costa and lateral veins beneath, the costa very prominent and the lateral veins prominent below. Staminate flowers fasciculate in the leaf-axils (or on the trunk?), the pedicels short, puberulous; sepals 2, concave, to 6.5 mm long, puberulous outside, glabrous inside; petals 4 or more (5 or 6 in Panamanian material), oblong-elliptic to nar- rowly oblong-elliptic, the apex involute at least in bud, to 6.5 mm long and 1.7-2.7 mm wide, sparsely appressed-pilose in the middle especially outside; stamens co (21-26 counted in Panamanian material), the filaments ca 0.5 mm long, densely barbate, the anthers to 3.5 mm long, appressed-pilose. Pistillate flowers (not seen; description acc. to Pittier, loc. cit. 179), solitary, to 30 mm in diam; sepals as in staminate flowers but larger; petals 8, elliptic-obovate, more or less obtuse; ovary ovoid, longitudinally 8(-10)-ribbed, pilose, with 4(-5) placentas, the styles 4(-5), distinct, very short. Capsule ? globose, reddish or purplish, 2.5-4.5 cm long (wings in- cluded), ligneous, with 8-10 broad, vertical, undulate-margined wings, these 0.8-2 cm broad in the middle, rigid-chartaceous, inconspicuously puberulous; seeds ovoid, angulate, to 0.8 cm long.
