        usage:
          title: Oxalis latifolia Kunth, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: "Apparently stemless herb; roots deep, vertical, the branches fibrous; bulbs ovoid or globose to 25 mm long, 20 mm diam., outer scales papyraceous, large, sometimes absent; scales (nutritious) brown, elliptic, acute, narrow, 7-15 mm long, 4-6 mm wide, strongly 3-nerved, 1-2 lateral pairs of nerves thinner, excep- tionally yet another shorter lateral pair present; bulbils ovoid, acute, ca. 1 cm, young, protected by several hyaline bracts similar to those described above, smaller. Leaves with the leaflets green, violaceous below, triangular, cuneate 10- 45 mm long, 20-75 mm wide, the distal margin straight, rarely incised to '/5-'/4 the length, short mucronate or broken in a broad, obtuse angle and the lobes divergent, small calli of various shapes often nearby, the distal angles obtuse, glabrous or sparse hairy below on the nerves or rarely overall; the margin with some cilia; petioles ascendent 5-15 cm long, glabrous or somewhat pilose; petio- lules fleshy, ca. 1 mm long, pilose; stipules connate to the petioles, hyaline- papyraceous, rusty-brown, ovate or rectangular, the apex auriculate, ciliate with long, viscid rusty hairs, the margins glandular, 3 prominent nerves arising from the base and with orange calli converging just below the apex, lateral pairs gen- erally 2, thinner and shorter, not reaching the apex: the inner pair sometimes bifurcate. Inflorescences umbelliform cymes commonly twice as long as the fo- liage, to 30 cm long, loosely 5-20-flowered; peduncles 10-25 cm long, similar to the petioles; bracts ca. 2 mm long, 2 mm wide, and bracteoles ca. 1 mm, all at the base of the inflorescence, hyaline, broadly ovate to rhombic or elliptic, acute, clasping the peduncle or the pedicel, ciliate, 1-nerved, softly crenate; pedicels thin, 14-20 mm long. Flowers with the sepals green, the margin hyaline, glabrous, uneven, linear-elliptic to oblong, narrowed to the apex, obtuse or subacute, 3-5 mm long, 0.5-1.5 mm wide, with orange or violaceous calli at the apex, 0.3-0.8 mm long, 2-lobate, convergent at the top end, sometimes entire, ovate, the base irregular; petals white at the base, pink to purplish at the limb, 2.5-3.5 times the length of the calyx, obovate, spathulate, clawed; stamens with filaments enlarged towards the base, pilose on the upper half, the longer stamens ca. 4 mm long with an obtuse sometimes inconspicuous ligule near the middle; the shorter stamens ca. 3 mm long, connate 1/4 way up; pistils micro- or rarely macrostylous, 4.5-5.5 mm long, the ovary ovoid, glabrous, the carpels 4-8-ovuled, the styles fine, gla- brous, the stigma bifid, papillose. Capsule oblong, acute, glabrous 4-8.5 mm long, the calyx to l/4-?/2 its length, the styles 1.5-2 mm long, the carpels 4-8- seeded, the hairs inside sometimes inconspicuous; seeds brownish, ellipsoid, slightly flattened, ca. 1-1. 1 mm long, 8-9-ribbed in zig-zag with 12-13 transversal striae."
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 9738
          archiveSourceId: 855A9DC6-A00B-40E9-B0BE-EDDBC374394F
