    facets:
      morphology:
        status: partially-supported
        claims:
          - text: A slender tree up to 8 m tall or a shrub with light brown, slightly rough bark, not flaking; branchlets with the epidermis peeling off in narrow membranous strips; lenticels many, scattered; woody ovoid galls often present. Leaves shed before flowering or shortly after, narrowly elliptic to elliptic, 3-5 cm long and 1.2-1.5 cm broad (in S. African material seen), apex rounded, base acute, margin indistinctly serrulate (appearing smooth), coriaceous, with distinct reticulate venation; petiole 1 mm; stipules intrapetiolar, fused, entire. Flowers scented, terminating short spurs, solitary; pedicels c. 4 mm long at anthesis, up to 1(-2) cm in fruit, erect, articulated at the base. Sepals about 9 mm long at anthesis, about 2 cm long and pink or red in fruit, enclosing young drupelets, spreading when fruit is ripe. Petals yellow, obovate-cuneate, c. 12 mm long and 8 mm broad. Stamens c. 50, filaments c. 2.5 mm; anthers 1.5 mm, biporose. Carpels 5, attached basally to receptacle; styles fused, terete, with free apical, recurved stigmatic tips or completely fused with stigma apically, discoid, 5-lobed. Drupelets oblong-globose, 1 cm long, black.
            sourceIds:
