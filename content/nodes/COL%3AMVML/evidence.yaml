        claims:
          - text: Plants erect, to 240 mm, slender; leaves 4-8, cauline, lax, to 45 x 6 mm, lanceolate, acute, glabrous. Inflorescences lax to dense spikes to 80 mm. Flowers numerous, c. 15 x 7 mm, sepals and petals yellow-green, lip with purple spots; ovaries c. 10 mm long, dark purple. Sepals subequal, free, shallowly concave, obtuse, subacute, c. 4 x 2.5 mm, 1 mm deep. Petals shielding gynostemium, triangular, obtuse, c. 4 x 2 mm, 1 mm deep. Lip spathulate, c. 5 mm long, strongly reflexed; limb with short, fleshy, parallel keels, saccate; blade flat, broadly cuneate, bilobed to trilobed with a very small triangular midlobe, c. 5 x 4 mm. Rostellum less than 1 mm tall, 3-lobed, lateral lobes bearing the viscidia, central lobe reduced; anther c. 2 mm tall.
