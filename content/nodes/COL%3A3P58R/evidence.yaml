        usage:
          title: Hyptis obtusiflora C.Presl ex Benth., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Herbs, ? suffrutescent at the base, to 1.5 m. Leaves ovate, the upper + elliptic, acute, serrate, the bases obtuse to attenuate, to 8 cm long-and 3.5 cm wide, sparsely pubescent on both surfaces, more so on the veins beneath, resin- dotted; subsessile to petioles 0.5-1 cm long. Inflorescences capitula, dense, axil- lary, sessile to peduncles ca 1 cm long; bracts ovate-lanceolate, ca 3-4 mm long. Flowers sessile; calyx short-tubular, ca 1-1.5 mm long, ? naked within, teeth + deltoid, ca 0.7-1 mm long, saccate at maturity and distended by the nutlets; corolla tube 2-3 mm long, white, slightly pubescent, the lips ca 1 mm long; stamens slightly exserted, the filaments pubescent, the anthers 0.3 mm long; style long exserted. Nutlets (3-)4, ovate, ca 0.6-0.7 mm long, dark brown, pubescent at the distal portion.
          originalLanguage: en
          sourceField: general
