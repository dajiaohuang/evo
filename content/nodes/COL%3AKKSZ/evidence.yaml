        usage:
          title: Banisteriopsis muricata (Cav.) Cuatrec., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Liana; stems densely cinereous appressed-pubescent when young, glabrate in age. Leaves opposite, thin, ovate to ovate-elliptic, acute to acuminate at the apex, apiculate, obtuse to rounded at base, 3-10 cm long, 1.3-6 cm wide, mod- erately appressed-pubescent above, silvery-sericeous beneath, entire; petioles slender, narrowly canaliculate, densely appressed-pubescent, 5-13 mm long. In- florescences cymose-paniculate, axillary and terminal, many-flowered; branches, pedicels and calyces sericeous; pedicels slender, 3-10 mm long. Flowers pink or white; sepals narrowly ovate, to 2 mm long, glands oblong-linear, ca. 1 mm long; petals ca. 6 mm long, with a broad, usually white claw bearing thick glands at the apex, the blade suborbicular, ca. 3 mm wide, finely lacerate, usually pink; stamens with filaments glabrous, ca. 2.2 mm long, free to the thickened base, the anthers ellipsoid, ca. 9 mm long; ovary villose, the styles slender, equal, glabrous, to 2.5 mm long, the stigma truncate. Samaras 2.5-3.5 cm long, oblong to obovate- lunate, subsericeous, becoming reddish, the ventral margin thick, sigmoid, the dorsal margin nearly straight to broadly rounded, the seminiferous area sericeous, tuberculate-muricate, the projections to 3 mm long.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 7114
