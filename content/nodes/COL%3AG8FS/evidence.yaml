        usage:
          title: Archibaccharis schiedeana (Benth.) J.D.Jacks., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrub or woody vine festooning in thickets to 10 m tall, the branching divaricate; sterns leafy, puberulent with weak granular hairs, drying evenly striate, fistulose. Leaves to 10 cm long, elliptical or ovate, basally acute or short- acuminate, apically acute or acuminate, mostly mucronate, the margins denticulate with toothlike, callose mucros, ca. 5 pinnate veins ascending on each side from near the base of the midvein, puberulent on both sides with short weak hairs and subsessile glands; petioles to 10 mm long, slender, tomentose. Inflorescences numerous, slightly congested ternately divided panicles or cymes, often round topped; peduncles tomentose; bracts similar to reduced leaves; pedicels to 8 mm long, filiform; bracteoles scalelike. Heads disciform, 4-5 mm tall, the staminate heads slightly shorter; involucral bracts imbricate in several unequal series, indurate, stramineous, the innermost narrowly lanceolate, 4-5 mm long, the outer series shorter, broader and dorsally puberulent, the green midvein prominent, the apices erose, often purplish; outer florets 4 mm long, the corolla white, sub- cylindrical, narrowed upward, apically truncate, oblique or erose, glabrous or sparingly pubescent near the top, the style exserted for more than half its length, its branches ensiform, ca. 1 mm long, smooth; inner florets 2.5-4 mm long, the corolla white, crateriform, the tube pubescent upwards, the limb basally pubescent, deeply lobed, the lobes ensiform, marginally thickened, the anthers exserted, 1.5 mm long, basally auricled, the appendages narrow, the style scarcely exserted from the anther appendages, its branches flattened-fusiform, dorsally glandular papillose, the ovary much reduced in length, the pappus sometimes flattened basally or expanded apically. Achene a flattened wedge, the three angles thickened by prominent veins, copiously pubescent and with a ring of bristles at the base; pappus of fine strigose bristles in one series.
          originalLanguage: en
          sourceField: general
