          - text: This species is easily recognized on its urn-like nutlets. Without fruit forms with less angular stems are easily confused with E. marginulata, while forms with distinctly triangular or 4-angular stem (i.e. E. calocarpa Cherm.) can be confused with E. acutangula. The form with depauperate or no bristles possibly deserves varietal rank
