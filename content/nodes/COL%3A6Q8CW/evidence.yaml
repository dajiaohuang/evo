          title: Licaria excelsa Kosterm., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Large tree to 60 m. high, the trunk erect; branches gray, glabrous; branchlets thick, glabrous, with lenticels rather numerous, often somewhat shining, sulcate. Leaves alternate; petioles stout, glabrous, up to 23 mm. long; blades glabrous, rigidly coriaceous, almost shining, elliptic or subovate-elliptic, 20 (-24) cm. long and 5 (-~8) cm. broad, the base shortly acute, the apex acuminate, the costa broad above, flattened beneath, prominulous and broadly flattened towards the base, the lateral nerves at least 10 pairs, filiform, prominulous above and beneath, erect- spreading, arcuate, the reticulation prominulous, very densely and minutely areo- late. Inflorescence axillary and subterminal, paniculate, before anthesis densely ferruginous-sericeous-tomentellous, becoming glabrous. Infructescence stout, to 15 cm. long. Fruit ellipsoid-ovoid, glabrous, 2.5 X 2 cm., the subtending cupule almost hemispheric-cylindrical, conspicuously verruculose, 20 mm. long, 25 mm. in diameter, and 16 mm. deep, the margin obscurely double, the outer entire and thickened, the inner extending less than 2 mm. above the outer, thinner, exhibiting a tendency to split at intervals towards the base, the pedicel enlarged to 15 mm. long and 10 mm. in diameter at the apex.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 6742
          archiveSourceId: D054347C-363A-4C91-96C7-9C4C9EA47CC4
