  claims:
    - subjectId: taxon:pakicetus
      claimKind: scientific
      claimType: fossil-range
      statement: Pakicetus is anchored here only by the H-GSP Locality 62 sample from Ganda Kas, including separately catalogued cranial and postcranial material within an approximately 50–48 Ma locality envelope; this is not a global genus range or first appearance.
      confidence: medium
      confidenceRationale: The primary study identifies the locality and catalogued material directly. Medium confidence reflects composite association and locality-level dating.
      referenceLinks:
        - relation: supports
          referenceId: thewissen-2001-pakicetid-skeletons
          pages: 277–281
          figure: Figures 1–4
          quoteLocator: Locality and specimen descriptions
    - subjectId: taxon:pakicetus
      claimKind: scientific
      claimType: taxonomy
      statement: Thewissen et al. report Pakicetus attocki as a wolf-sized early Eocene pakicetid cetacean and use its skeletons in a morphology-based analysis; the sampled placement is a matrix result, not a demonstrated direct ancestor.
      confidence: high
      confidenceRationale: The primary paper names the species, family-level context and analysis directly; the ancestry boundary is explicit because the result compares sampled taxa rather than observing lineage descent.
      referenceLinks:
        - referenceId: thewissen-2001-pakicetid-skeletons
          relation: supports
          pages: 277–281
          figure: Figures 2–4
          quoteLocator: Abstract; Pakicetidae and Pakicetus descriptions; cladistic analysis
    - subjectId: taxon:pakicetus
      claimKind: scientific
      claimType: biogeography
      statement: The profiled Pakicetus material is bounded to H-GSP Locality 62 at Ganda Kas in the Kala Chitta Hills, Punjab, Pakistan, within the early Eocene Kuldana Formation; this single-site sample does not establish a complete geographic distribution.
      confidence: high
      confidenceRationale: The primary paper directly reports the single site, formation and multiple-individual collection. The claim does not extrapolate that locality to the genus-wide range or a dispersal route.
      referenceLinks:
        - referenceId: thewissen-2001-pakicetid-skeletons
          relation: supports
          pages: 277–278
          figure: Figures 1–2
          quoteLocator: Early Eocene Kuldana Formation; single Pakistani site; Locality 62/Ganda Kas specimen context
    - subjectId: taxon:pakicetus
      claimKind: scientific
      claimType: ecology
      statement: The described Pakicetus locomotor skeleton is interpreted as terrestrial and running-adapted, while the paper cautions that auditory specializations do not by themselves imply aquatic life; diet, behaviour and performance are not directly observed.
      confidence: medium
      confidenceRationale: The authors explicitly infer terrestrial locomotion from the anatomy and discuss the limits of sensory evidence. Ecological details beyond that locomotor interpretation remain unrecorded by the composite sample.
      referenceLinks:
        - referenceId: thewissen-2001-pakicetid-skeletons
          relation: supports
          pages: 278–279
          figure: Figures 1–2
          quoteLocator: Running adaptations; auditory specializations; terrestrial interpretation
    - subjectId: taxon:pakicetus
      claimKind: scientific
      claimType: morphology
      statement: Skull H-GSP 96231 and separately catalogued postcranial elements including humerus H-GSP 92042 and calcaneum H-GSP 96420 document the Pakicetus reconstruction; the skull retains a cetacean-like ear region and the postcrania show weight-bearing and running features.
      confidence: high
      confidenceRationale: The named specimens, preserved regions and functional character descriptions are directly illustrated and described in the primary paper. Confidence is restricted to those catalogued elements and not a complete individual.
      referenceLinks:
        - referenceId: thewissen-2001-pakicetid-skeletons
          relation: supports
          pages: 277–279
          figure: Figures 1–3
          quoteLocator: Postcranial osteology; H-GSP 96231 skull; H-GSP 92042 humerus; H-GSP 96420 calcaneum
  claim-rationales.zh:
    - 一手研究直接识别地点和编号材料；中等置信度反映组合关联与地点级定年。
    - 分类与矩阵位置由 Thewissen 等直接报告，但形态分析的取样拓扑不等于直接祖先关系。
    - 论文直接给出 H-GSP 62 号地点、Ganda Kas、Kala Chitta 山和库尔达纳组；单一地点的复合材料不能外推为属级分布或扩散路线。
    - 论文明确根据运动骨架解释陆生和奔跑适应，并限制听觉证据的水生含义；食性、行为和运动表现超出直接观察。
    - 具名头骨、肱骨和跟骨及其图版定位直接支持这些形态字段；高置信度仅适用于列出的材料，不适用于一具完整个体。
  claim-statements.zh:
    - 此处 Pakicetus 仅由 Ganda Kas 的 H-GSP 62 号地点样本锚定，其中包括分别编号的头骨与头后材料，处于约 5000 万—4800 万年前的地点区间；这不是全球属级范围或首现。
    - Thewissen 等把 Pakicetus attocki 报告为狼大小的早始新世巴基鲸科鲸类，并将其骨架用于形态分析；该取样位置是矩阵结果，不是已证实的直接祖先。
    - 本档案中的 Pakicetus 材料限定于巴基斯坦旁遮普省 Kala Chitta 山 Ganda Kas 的 H-GSP 62 号地点，位于早始新世库尔达纳组；单一地点样本不能确立完整地理分布。
    - 论文将所描述的 Pakicetus 运动骨架解释为陆生并适应奔跑，同时指出听觉特化本身不能推出水生；食性、行为和表现并未被直接观察。
    - 头骨 H-GSP 96231 以及单独编目的颅后骨骼（包括肱骨 H-GSP 92042 和跟骨 H-GSP 96420）共同记录了 Pakicetus 复原；头骨保留类似鲸类的耳区，颅后骨显示承重和奔跑特征。
