        claims:
          - text: Shrub, up to 1.5 m high. Inflorescence terminal, sub-capitulate, with 4 flowers. Bracts often keeled and subacute, usually thin and coloured, longitudinally veined, glabrous on back. Flowers creamy yellow to pink, red or brown.
            sourceIds:
              - sanbi_11118_0
            locator: "SANBI/WFO archive Morphology row 2978; source 11118.0; publication: Herman, PPJ; Retief, E. 1997. Plants of the northern provinces of South Africa: Keys and diagnostic characters. Strelitzia 6: 1 - 681. National Botanical Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Hilliard & Burtt (1988) noted two rather distinct forms of P. montana in KwaZulu-Natal. The first form is characterized by plants on rock platforms that are low, rounded bushes, 0.3-1 m high, with the tips of the branches erect, whereas those of the second form inhabit valleys and are riverside bushes of up to 2 m high, with open branches and pendulous branchlets. The present study, taking the whole distribution range of P. montana into consideration, recognizes two forms. One, centred in the God's Window area of Mpumalanga, are rounded shrubs 0.5-2 m high, with many branchlets covered with smaller, decussate, imbricate leaves, bluish green in colour. The second form dominates in the Free State. Lesotho, KwaZulu-Natal and Eastern Cape. These plants are more robust, with open branches and larger, yellowish green leaves and inflorescences, which are tinged pink. However, the two forms are not geographically distinct and intermediates are common. Both forms unequivocally show the specific characters and therefore we do not propose to give them formal taxonomic recognition.
