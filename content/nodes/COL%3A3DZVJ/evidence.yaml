    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Acaulescent, cormous geophyte, up to 80 mm tall. Basal leaves short, more-or-less thick and finger-like, upper leaves short, bifacial, broadly ovate, concave. Flowers white and pale yellow, speckled with brown, tepal claws narrowed in lower third forming a windowed cup, nectaries prominent, in centre of claw, with raised and lobed ridge at distal edge. Capsule not beaked.
            textZh: Ferraria ornata Goldblatt & J.C.Manning 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_14562_0
            locator: "SANBI/WFO archive Morphology row 33071; source identifier 14562.0; cited publication: Goldblatt, P; Manning, JC. 2013. Iridaceae. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 94 - 124. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Stemless and with the tepal claws unusually narrow in the lower part, thus forming a windowed cup, Ferraria ornata is easily recognised by these features, as well as its small size, flowering individuals standing only 50-80 mm high. The apparently scentless flowers are unique in the fleshy crests bordering the distal margins of the nectaries, which are situated in the middle of the tepal claws and secrete miniscule quantities of sticky, sweet nectar. The short, concave cauline leaves of flowering plants contrast with the long, cylindric leaves of juvenile and non-flowering individuals. Both the early flowering and unusual, concave cauline leaves of flowering plants suggest it is most closely allied to F. ovata, which has a similar growth strategy of early flowering and small, concave cauline leaves on a taller flowering stem. Replacement corms of flowering individuals are absent at flowering and develop later as the capsules ripen.
            textZh: SANBI 条目提供了 Ferraria ornata Goldblatt & J.C.Manning 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 95227; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
