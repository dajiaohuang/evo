          - text: Distinguished from yellow-flowered forms of Gladiolus woodii by the glabrous lower leaf sheaths and the strongly clawed upper tepals. Non-flowering plants ultimately develop three leaves, unlike the solitary leaf developed in G. woodii. The two species are allopatric, with G. woodii occurring east and south of the range of G. pardalinus.
