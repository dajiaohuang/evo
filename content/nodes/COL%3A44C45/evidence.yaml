    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, 20-50 cm, stem flexed outward above leaf sheath. Leaf solitary, linear, channelled. Flowers yellow or salmon, tepal claws forming a cup including the stamens, faintly scented.
            textZh: Moraea collina Thunb. 的 SANBI 物种条目记载了植株、叶片和花部形态。
            sourceIds:
              - sanbi_13878_0
            locator: Strelitzia 29; archive Morphology row 7390, source 13878.0
            placeTimeScope: Regional species account published 2012; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
          - text: Distinguished by the solitary leaf inserted on the stem well above ground, the stem flexed above the sheath of the foliage leaf, and yellow or pink flowers with the tepal claws forming a narrow cup including both filaments and anthers. The capsules are unusually long, even for sect. Homeria, typically 30-40 mm long and have a short blunt beak ± 1 mm long. It is often difficult to distinguish in herbaria from several other solitary-leaved species of sect. Homeria, in particular M. minor and M. flaccida. In M. minor the shorter anthers are 3-5 mm long, the style branches are 5-6 mm long and divide 2-3 mm above the anther bases, the ovary is shorter, up to 10 mm long, with capsules 18-28 mm long. Taller, more robust M. flaccida has tepals 35-40 mm long with claws that diverge to form a wide cup, elongate capsules, typically 30-55 mm long, with an acute beak ± 2 mm long. Natural hybrids between Moraea collina and M. flaccida have been recorded from the Cape Peninsula.
            textZh: SANBI 条目提供了 Moraea collina Thunb. 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: Strelitzia 42; archive Diagnostic row 94292, source 18638.0
            placeTimeScope: Regional species account published 2020; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
