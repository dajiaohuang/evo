  claims:
    - subjectId: taxon:yuganotheca
      claimKind: scientific
      claimType: topology
      statement: The referred Chengjiang Yuganotheca sample collectively supports a reconstruction of paired agglutinated valves, lophophore, tube and pedicle; no individual fossil is asserted to preserve every feature, and its exact brachiopod–phoronid stem position remains topology-dependent rather than direct ancestry.
      confidence: medium
      confidenceRationale: The anatomical mosaic is reconstructed collectively from named referred specimens, while homology and placement remain analytical.
      referenceLinks:
        - referenceId: zhang-et-al-2014-yuganotheca
          relation: supports
          pages: Materials and Methods—Material; Description; Figures 1–3, 6
          figure: Figures 1–3, 6
          quoteLocator: Materials and Methods, Material (710 referred specimens); Description and Figures 1–3; Figure 6
    - subjectId: taxon:yuganotheca
      claimKind: scientific
      claimType: fossil-range
      statement: Zhang et al. place a referred sample of 710 Yuganotheca specimens in the Eoredlichia–Wutingaspis zone of the Yu’anshan Member and correlate it with late Atdabanian/Botoman Cambrian Stage 3, supporting a 521–514.5 Ma sample envelope rather than a global genus range or lophophorate divergence date.
      confidence: medium
      confidenceRationale: The formal stratigraphy and locality section states the unit, zone and Stage 3 correlation directly. Medium confidence is limited to the enclosing stage and does not convert the morphology-based placement into ancestry.
      referenceLinks:
        - relation: supports
          referenceId: zhang-et-al-2014-yuganotheca
          pages: Materials and Methods—Material; Systematic palaeontology—Stratigraphy and locality
          figure: Figures 1–6
          quoteLocator: Materials and Methods, Material (710 referred specimens); Systematic palaeontology, Stratigraphy and locality, Yu’anshan Member and Eoredlichia–Wutingaspis zone
        - relation: contextualizes
          referenceId: ics-2026-06
          pages: International Chronostratigraphic Chart v2026/06
          figure: Global chronostratigraphic scale
          quoteLocator: Numerical boundaries for the named stages and periods used to bound the source sample
    - subjectId: taxon:yuganotheca
      claimType: taxonomy
      claimKind: scientific
      statement: Yuganotheca elegans is represented by a referred 710-specimen Chengjiang sample whose combined evidence supports a reconstruction of paired agglutinated valves, a lophophore, tube and pedicle; no individual fossil is asserted to preserve every feature, and the mosaic supports comparison near the brachiopod–phoronid stem region without resolving exact homology or direct ancestry.
      confidence: medium
      confidenceRationale: The referred material and its character evidence are directly described, while their combination across specimens and the exact affinities of valves and tubular structures depend on reconstruction and phylogenetic interpretation.
      referenceLinks:
        - referenceId: zhang-et-al-2014-yuganotheca
          relation: supports
          pages: Materials and Methods—Material; Description; Figures 1–3, 6
          figure: Figures 1–3, 6
          quoteLocator: Materials and Methods, Material (710 referred specimens); Description and Figures 1–3; Figure 6 phylogenetic analysis
    - subjectId: taxon:yuganotheca
      claimType: biogeography
      claimKind: scientific
      statement: The profiled Yuganotheca material comes from the Yu’anshan Member of the Heilinpu Formation at the Chengjiang Lagerstätte in Yunnan, China; this defined occurrence does not establish a complete species distribution or geographic origin.
      confidence: high
      confidenceRationale: The formal stratigraphy and locality section names the member, formation and Chengjiang locality. High confidence applies only to the reported occurrence context.
      referenceLinks:
        - referenceId: zhang-et-al-2014-yuganotheca
          relation: supports
          pages: Systematic palaeontology—Stratigraphy and locality; Figure 1
          figure: Figure 1; Supplementary Figure S1
          quoteLocator: Systematic palaeontology, Stratigraphy and locality; Yu’anshan Member, Heilinpu Formation, Chengjiang Lagerstätte
    - subjectId: taxon:yuganotheca
      claimType: ecology
      claimKind: scientific
      statement: Yuganotheca is interpreted as an attached suspension feeder in a marine Chengjiang setting because the referred sample’s reconstruction includes a lophophore and long pedicle; movement, population-wide guild and behaviour are not directly observed.
      confidence: medium
      confidenceRationale: The lophophore and pedicle are reconstructed across the referred specimen sample, but feeding and attachment are functional interpretations bounded to that reconstruction rather than direct behavioural observations.
      referenceLinks:
        - referenceId: zhang-et-al-2014-yuganotheca
          relation: supports
          pages: Description; Figures 1–3
          figure: Figures 1–3
          quoteLocator: Description and Figures 1–3, lophophore, pedicle and tubular-body reconstruction; discussion of functional comparison
    - subjectId: taxon:yuganotheca
      claimType: morphology
      claimKind: scientific
      statement: Across the referred Yuganotheca specimens, paired agglutinated valves surrounding a lophophoral chamber, a median collar above a conical tube, and a long pedicle with inferred coelomic space support a combined reconstruction; no individual fossil is asserted to preserve the entire combination, and homology remains interpretive.
      confidence: medium
      confidenceRationale: The named structures are illustrated across Chengjiang specimens and combined in a reconstruction, while their exact homologies are assessed through comparative phylogenetic analysis.
      referenceLinks:
        - referenceId: zhang-et-al-2014-yuganotheca
          relation: supports
          pages: Description; Figures 1–3; corrected Supplementary Figures S4–S6
          figure: Figures 1–3; Supplementary Figures S4–S6
          quoteLocator: Description and Figures 1–3, valve pair, lophophoral chamber, collar, tube and pedicle; corrected Supplementary Figures S4–S6
        - referenceId: zhang-et-al-2014-yuganotheca-erratum
