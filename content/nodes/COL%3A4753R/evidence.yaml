    facets:
      morphology:
        status: partially-supported
        claims:
          - text: A small nerine with a scape of about 30 cm in length, 8 to10 pedicels 2-5 to 3-8 cm long, perianth segments 2.5 to 3 cm long and 3 to 4 mm in width. The filiform leaves are very slender, about 1 mm in diameter. The pubescence on the scape and pedicels is very conspicuous. The filaments are about the same length as the segments, or slightly shorter. The segments, whilst twisted and undulate for about a third of their length are not strongly recurved as in N. filamentosa. No staminal appendages. The segments tend to curve sideways and upwards.
