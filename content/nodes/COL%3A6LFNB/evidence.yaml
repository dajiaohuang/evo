            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Its nearest relative is H. fasciata with which it is occasionally, but somewhat unaccountably, confused; it is distinguished from that species by its longer and more attenuate leaves, and the smooth upperside of the leaves.
