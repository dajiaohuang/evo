          title: Miconia rubens (Sw.) Naudin, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrub or tree, reported to 18 m. tall, glabrous or essentially so throughout; petioles slender, 1-2 cm. long; leaf-blades thin, elliptic or oblong, varying to obovate-oblong, 3-10 cm. long, a third to half as wide, conspicuously acuminate or caudate to a blunt point, entire, acute, obtuse, or cuneate at base, 3-pli-nerved; panicle small, 3-6 or rarely 10 cm. long, many-flowered; hypanthium cup-shaped, 1.5-2 mm. long to the torus; calyx-tube scarcely prolonged, its lobes semicircular or depressed-triangular, about 0.5 mm. long; exterior teeth varying from a minute thickening to conic, subulate, and 0.5 mm. long; petals white, suborbicular, about 2 mm. long; stamens isomorphic; anthers oblong, about 0.7 mm. long; thecae about 0.4 mm. long, opening by a large ventro-terminal pore; connective conspicuously prolonged below the thecae, more or less dilated, not lobed.
