            locator: "SANBI/WFO archive Morphology row 67719; source 2702.0; publication: Adamson, RS. 1958. The South African species of Aizoaceae: IV. Mollugo, Pharnaceum, Coelanthum and Hypertelis. J. S. African Bot. 23: 11 - 65. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Distinguised by the lax habit, the soft green not crowded leaves, the stipules, and the small flowers with distinctly connate perianth. Occasionally there is a continuation of the leafy stem from the first node of the inflorescence.
