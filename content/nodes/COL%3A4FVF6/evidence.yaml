        claims:
          - text: Diffuse. Stems 25-30 cm long, laxly branched, erect or sprawling, woody at the base, leafy at the tips only. Leafy part of the stem 3-5 cm long, white. Leaves bright green, alternate, not crowded, 0.7-1.2 cm long, flat or partly revolute, with a short deciduous hair point. Stipules 2 mm long, adnate to the leaf-base, with a loose fringe of short hairs. Peduncles 4-8 cm long. Inflorescence umbellate, with slender ascending branches 1-1.5 cm long. Pedicels 0.4-0.6 cm long. Perianth segments about 2 mm long, green externally, obtuse, distinctly connate at the base. Anthers white, broadly oblong. Disc of 3 broad thick truncate yellow or orange lobes. Stigmas white, flat, very slightly revolute. Fruit rounded, about as long as the perianth.
            sourceIds:
