        status: partially-supported
        claims:
          - text: "Perennial, mat-forming herb, 0.1-0.2 m high; stems glabrous to hairy, often rooting at nodes. Leaves up to 37 x 19 mm, ovate, base ± rounded, apex acute; scabridulous above, glabrous beneath; petioles up to 5 mm long. Stipular sheath up to 1 mm long; lobes 5-7, ± 3 mm long. Flowers heterostylous, in terminal triads; pedicels ± 2.5 mm long. Calyx: tube 1 mm long, obconic; lobes broadly triangular. Corolla white, pale blue, lilac; tube up to 7 mm long, hairy in throat; lobes ± triangular. Style ± 3 mm long in short-styled and 8 mm in long-styled forms; stigma lobes ± 0.3 mm long. Flowering time Dec.? Fruit a subglobose capsule, beak slightly raised. Seeds blackish, testa cells coarsely granulate."
            sourceIds:
