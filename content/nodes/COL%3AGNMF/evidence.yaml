        claims:
          - text: Rhizomatous perennial, 20-40 cm, stem rounded, unbranched, lateral flower clusters sessile. Leaves linear or terete. Flowers lilac to cream-coloured, inner tepals with a large, dark mark below, spathes green. Capsules elongate.
            textZh: Aristea teretifolia Goldblatt & J.C.Manning 的 SANBI 物种条目记录了形态特征。
            sourceIds:
