            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Aristea teretifolia is distinguished in subg. Pseudaristea by the narrow, fibrous leaves either terete or plane and up to 2 mm wide, and by its relatively large flowers, 50-58 mm diam., and largely pale lilac, mauve or creamy yellow, with the outer tepals marked with a dark bronze-brown blotch in the lower half edged in pale blue or turquoise. The outer tepals are obovoid and relatively small, ± 20 mm long, compared with the inner which are fiddle-shaped and 24-28 mm long.
            textZh: SANBI 条目提供了 Aristea teretifolia Goldblatt & J.C.Manning 的鉴别特征。
