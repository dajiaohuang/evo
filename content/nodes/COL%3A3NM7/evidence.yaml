        usage:
          scope:
            en: Compared four groups—two in continuous Odobullu Forest and one in each of two southern Ethiopian forest fragments; diet and food availability findings are group- and site-specific.
            zh: 比较四群猴——两群位于连续的 Odobullu 森林，另两群分别位于埃塞俄比亚南部的两处森林残片；食谱与食物可用性结论限于这些群体和地点。
