            en: Institutional scoping report describing ten field visits across Angola and Zambia during 2019–2024, systematic camera trapping and interviews; the species section reports camera-trap events and relative encounter indices.
            zh: 机构范围界定报告，介绍 2019—2024 年在安哥拉和赞比亚开展的十次野外访问、系统相机陷阱调查与访谈；物种章节报告相机事件和相对遇见指数。
