          scope:
            en: Three semi-habituated troops and 164 fecal samples at Ngel Nyaki Forest Reserve, Nigeria; seed sampling emphasized the dry season and the paper's dispersal rates depend on local density and captive defecation-rate measurements.
            zh: 在尼日利亚 Ngel Nyaki 森林保护区研究三群半习惯化猴群并采集 164 份粪样；种子取样侧重旱季，文中的传播率依赖局地密度和圈养排便频率测量。
