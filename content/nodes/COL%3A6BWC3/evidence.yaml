    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Bulbs up to 10 cm tall and 4-6 cm diam., more or less gradually tapered from near base to neck, with membranous tunic. Leaves 2-4, developing at same time or slightly later than the inflorescence, strap-shaped, 20-60 cm long, 2-6 cm wide, central midrib prominent on under surface, margin red in lower third of blade. Scape 20-50 cm tall, 1-1.5 cm diam., hollow. Spathe-valves 2, subtending umbel, 4-7 cm long, 1.5-2 cm wide, the outer appreciably larger than the inner. Umbel 9-15-flowered; pedicels varying in length, but rarely more than 5 cm long (elongating to 7 cm in fruit), erect or suberect. Perianth pink, 3-4 cm long, with one of the uppermost inner perianth segments very slightly less spreading than all the others and with the style arching somewhat under it. Tube 8-10 mm long, campanulate; lobes curved, spreading, 2-3 cm long, oblong-lanceolate; outer lobes 6.5 mm broad with small tuft of hairs within apex; inner lobes 6 mm broad with few hairs at apex. Stamens 6, 3 attached to the throat of the perianth opposite the outer segments and 3 on the inner segments just below their base; anthers versatile. Ovary 6 mm long, 4-5 mm diam. Loculi many-ovuled, in 2 ranks. Stigma trifid, the lobes recurved with the margins slightly revolute. Capsule 2.5 cm long, 1.7 cm broad; seeds compressed, shiny, black.
