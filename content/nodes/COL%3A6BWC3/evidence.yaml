            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: The author of C. erubescens was faced with the problem of where to place the species-in Cyrtanthus or Anoiganthus. The characters used by authors to distinguish the two genera, namely relative length of the perianth tube to the segments (Phillips, 1951), and position of insertion of the anthers (Baker, Handb. Amaryllid. ix. 1888), did not hold, and consequently he placed the species in Cyrtanthus, sensu lato. In addition, Gouws (1949) and Wilsenach (1963), found that the ideograms of the two genera were more or less identical. Anoiganthus was eventually sunk by Gordon-Gray and Wright (1969).
