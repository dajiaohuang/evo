    facets:
      morphology:
        status: partially-supported
        claims:
          - text: An erect, much-branched, often dense shrub, up to 1.5 m high, glabrous in all parts (except peduncle-bases). Stems 2-5-forking with erect branches, closely leafy at the branch ends, becoming nude lower down and marked with leaf-scars. Leaves close-set, often imbricated, erecto-patent-spreading, 1-3 cm long, 2-8 mm wide, elliptic-(narrowly) elliptic-oblong-narrowly oblong, entire, with smooth or laxly denticulate margins, flattened, coriaceous or somewhat cartilaginous, with a distinct midvein and fainter lateral veins, acute. Peduncles lateral in the upper leaf-axils, erect-erecto-patent, usually many on the same branch, 1.5-4 cm long, 0.5-0.8 mm thick, terete or striate, with a small woolly tuft and 2 lateral reduced leaves in the axil; these subulate, 2-6 mm long. Involucre cupshaped-narrowly campanulate with rounded-truncate base, 4-7 mm high and wide. Involucral bracts 5-7, uniseriate, connate to c. 4/5, obtuse-subacute, distinctly 3-7-lined (resiniferous veins); the free lobes deltoid-(broadly) ovate, 1-2 mm long and wide, with puberulous or smooth margins, puberulous-tipped. Receptacle flat or somewhat convex, deeply alveolate with denticulate pit-margins. Ray-florets 5-8, yellow. Tube 1.3-2 mm long, cylindrical. Lamina elliptic-narrowly oblong, 6-10 mm long, 2.5-5 mm wide, 4(-5)-nerved. Style terete; style branches 1-1.2 mm long, obtuse-truncate. Disc-florets c. 13-30. Corolla 4-5 mm long. Tube 1.5-2 mm long, cylindrical. Limb campanulate, 2.5-3 mm long; lobes narrowly ovate, 1-1.2 mm long, 0.6-0.9 mm wide. Anthers 1.8-2.2 mm long incl. the ovate, obtuse-subacute appendage. Style terete with swollen base; stylophore distinct, c. 0.5 mm long; style branches 0.5-0.9 mm long, truncate. Pappus bristles numerous-copious, 2-3 mm long, white, erect, some shorter and reflexed over the ovary. Achenes narrowly oblong-(narrowly) elliptic-oblong, 2.5-3.5 mm long, 1-1.5 mm wide, glabrous, with 5-8 low and often indistinct ribs, brown or yellowish brown.
            sourceIds:
