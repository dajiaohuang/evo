          - text: E. tysonii resembles in habit E. lateriflorus, with which it is often confused in the herbaria, but has a very different involucre with the scales connate high up and further glabrous achenes. Besides, it has a more handsome appearance, on account of the often many-flowered branches and the well-developed ligules.
