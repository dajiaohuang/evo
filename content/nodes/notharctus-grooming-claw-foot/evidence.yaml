      claimKind: scientific
      claimType: morphology
      statement: AMNH 143612/143640 preserves a semi-articulated Notharctus foot in which AMNH 143612-03 can be assigned to digit two and exhibits the cited study’s comparative grooming-phalanx morphology.
      confidence: high
      confidenceRationale: High confidence concerns the documented association and preserved morphology; behaviour and broader anthropoid implications remain bounded interpretations.
