        metadataVariant: 0
        usage:
          title: Hebeclinium costaricense R.M.King & H.Rob., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrubs or small trees to 7 m tall; stems terete, faintly striate, puberulous to hirtellous. Leaves opposite; blades papyraceous, broadly ovate, mostly 9-16 cm long and 6-9 cm wide, the base broadly cuneate, the margins slightly crenulate, the apex slightly acuminate, the veins hirtellous, the venation pinnate, the secondary veins ca. 5 pairs, ascending at ca. 450 angle; petioles mostly 3-4 cm long. Inflorescence a loose cyme, the ultimate branches 1-20 mm long, hirtellous. Heads mostly in clusters of 3, ca. 6 mm high with ca. 40 florets; involucral bracts ca. 40, imbricate, strongly unequal, in 4 series, narrowly oblong, the apices obtuse, the outer surface with ca. 3 striae, puberulous above; receptacle hemispherical, nonparenchymatous, pilose; corolla white, ca. 3.4 mm long, narrowly tubular, slightly funnelform above, glabrous below and within, the lobes oblong-ovate, ca. 0.4 mm long and 0.3 mm wide with cluster of hairs on outer surface. Achenes ca. 1.5 mm long-, sparsely glanduliferous; pappus of ca. 27 bristles, ca. 2.5 mm long, the apex distinctly dilated, the apical cells acute to subacute.
          originalLanguage: en
          sourceField: general
