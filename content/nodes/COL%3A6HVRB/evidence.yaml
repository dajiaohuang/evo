          title: Ficus costaricana (Liebm.) Miq., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Trees 12-15 m. tall. Twigs 3-5 mm. in diameter, pubescent or glabrate, developing a rather thin brownish grey periderm. Stipules 12-25 mm. long, broadly deltoid, glabrous, persistent. Lamina 3-7.5 cm. wide X 6-18 cm. long, oblanceolate or oblong-elliptic, frequently somewhat inequilateral, glabrous; apex rounded, acute, or shortly blunt acuminate; base rounded or rounded cuneate, emarginate; lateral veins 5-12 pairs, departing from the midrib at an angle from 20%-30%; basal vains departing from the midrib at an angle of 500-600; inter- costals prominent. Petiole 5-30 mm., 1/6-1/9 the length of the lamina. Figs 10- 12 mm. in diameter, depressed globose; glabrous, borne among the leaves; color reddish with darker spots; peduncle obsolete; basal bracts 5-10 mm. broadly deltoid, glabrous.
