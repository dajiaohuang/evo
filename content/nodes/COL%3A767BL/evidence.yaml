      morphology:
        status: partially-supported
        claims:
          - text: Small, cormous geophyte, 4-9 cm, corm tunics finely netted, pale brown. Leaves 1(2), spreading, firm, channelled, immature at flowering. Flower 1, stellate, held close to the ground, yellow, with pale green beneath, bract 1, sheathing, membranous, partially exposed above ground.
            textZh: Pauridia monophylla (Schltr. ex Baker) Snijman & Kocyan 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13877_0
            locator: "SANBI/WFO archive Morphology row 7537; source identifier 13877.0; cited publication: Snijman, DA. 2012. Hypoxidaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 115 - 119. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: As its name suggests, Pauridia monophylla is easily recognized by a solitary leaf at flowering time, although a second leaf may be produced later. Since the scape is seldom exserted above ground, the solitary, sheathing bract is often only partially visible. Distinguished by a narrow throat, holding six tightly clustered stamens, the solitary, yellow flower is unusual in having outspread outer tepals and only slightly spreading inner tepals. Unique within the genus is the smooth, convex dorsal surface of the anther that contrasts with the two, close-set, oblong to triangular anther thecae which are prominent on the more or less concave ventral surface. Anther dehiscence is thus introrse, which suggests that the flowers of P. monophylla may be autogamous, possibly an adaptation to the absence of suitable pollinators soon after fires. In comparison with many other species within the genus, the shallowly cup-shaped capsule holds only a few seeds. Based only on its unusual floral morphology, the position of P. monophylla within the genus is not readily evident. The thick, narrow, leathery leaves, solitary flowered inflorescence and single sheathing bract, nevertheless, suggest a close relationship with P. affinis.
            textZh: SANBI 条目提供了 Pauridia monophylla (Schltr. ex Baker) Snijman & Kocyan 的鉴别特征。
