    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, 40-100 cm, leafy and much branched. Leaves sword-shaped with raised midvein. Flowers dull yellow to brown, often speckled, often putrid-smelling, tepals margins buff, anther lobes parallel; capsules ovoid.
            textZh: Ferraria crispa Burm. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 7494; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Recognised by the growth habit, with stems produced well above the ground and bearing numerous branches crowded in the upper half, Ferraria crispa has a flower with a wide, shallow cup and an ovoid to ellipsoid capsule rounded or acute at the apex and lacking a beak. The sword-shaped lower leaves and shorter cauline leaves have a definite main vein and form two opposed ranks. The strongly scented flowers have tepals speckled or blotched dark brown to dull purple on a cream-coloured to pale yellowish background, or occasionally predominantly dark brown, always with pale crisped margins, these sometimes almost golden yellow when the tepals are otherwise brown. The tepal claws each bear a large, glistening nectary, often covering almost half the surface. The nectaries produce minute droplets of concentrated nectar scattered over the entire surface.
            textZh: SANBI 条目提供了 Ferraria crispa Burm. 的鉴别特征。
