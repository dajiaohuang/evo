        usage:
          title: Cecropia longipes Pittier, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Trees to about 10 m. tall with stout seldom-branching trunks, the young branches very stout, densely gray-hispid to glabrate. Mature leaves divided about midway to the center or less, scabridulous above, paler and subarachnoid-puberulent beneath, the lobes 9-13, not contracted toward the base or scarcely so, broadly obtuse to rounded at the tip, the petioles very stout, densely gray-hirtellous, with the ferruginous velamen of the basal pulvinus more or less concealed by inter- spersed white longer hairs; stipules about 9 cm. long, ferruginous-hirtellous with interspersed longer white hairs. Staminate spadices in clusters of 50-60, 4-12 cm. long and about 2 mm. in diameter, with slender gray-hirtellous stipes about 2 cm. long, the spathes unknown, the common peduncle about 10-12 cm. long, gray- hirtellous after anthesis. Pistillate spadices in clusters of 8-12, at anthesis about 8-9 cm. long and 5 mm. in diameter, in fruit about 10-12 cm. long and 1 cm. thick, very shortly stipitate, the spathes about 5-6 cm. long, gray-hirtellous, the common peduncle 5-6 cm. long, rather irregularly but conspicuously gray- hirtellous, somewhat accrescent in fruit.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 8048
