          - text: "Cormous geophyte, up to 120 mm high. Leaf solitary, falcate, produced after flower, on a separate shoot. Flowers: solitary; perianth with tube 20-27 mm long, segments 14-22 x 6-9 mm, whitish cream-coloured; Oct."
            textZh: Hesperantha altimontana Goldblatt 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_16273_0
            locator: "SANBI/WFO archive Morphology row 71827; source identifier 16273.0; cited publication: Retief, E; Meyer, NL. 2017. Iridaceae. In: E Retief & NL Meyer (eds), Plants of the Free State: Inventory and identification guide, Strelitzia 38: 934 - 956. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Evidently allied to the two other southern African Drakensberg species that flower early in the season at which time the foliage leaves are dry or withered, with the new season’s leaves appearing on separate shoots later in the year, Hesperantha crocopsis and H. schelpeana. It is most like H. schelpeana in its fairly large flowers but differs in having a perianth tube 20-27 mm long and uniformly creamy white perianth, whereas H. schelpeana has whitish or pink flowers with the outer tepals flushed to uniformly darker pink to purple on the outside, and a perianth tube 5-10 mm long. Hesperantha crocopsis has smaller flowers, the tepals only 6-7 mm long but a perianth tube 9-14 mm long, and like H. schelpeana, the outer tepals are red to purple on the outside. Foliage leaves are lacking on flowering specimens, but plants from ridges west of Thaba Ntlenyana in Lesotho that appear to be H. altimontana have a distinctive, falcate leaf with a plane blade like no other known member of the genus.
            textZh: SANBI 条目提供了 Hesperantha altimontana Goldblatt 的鉴别特征。
