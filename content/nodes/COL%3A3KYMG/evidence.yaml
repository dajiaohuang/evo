        claims:
          - text: Perennial, caespitose, dwarf shrublet, up to 0.05 m high, stems reduced, forming small dense clumps, roots succulent. Leaves subfalcate to incurved, epidermis rough, cells of keel and margins almost denticulate. Flowers pedicellate, solitary, yellow. Flowering time winter and spring. Capsules 5-locular, dark brown, woody.
