        claims:
          - text: Hoary, perennial herb, up to 130 mm tall, stems in a tuft from a woody rootstock, with balloon-tipped hairs. Leaves opposite, basally crowded, elliptic, toothed. Flowers in racemes, corolla tube 5.5-7 mm long, limb bilabiate, lobes oblong, entire, yellow with a dark reddish patch at back of throat.
            sourceIds:
