            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: It is allied M. dregei and M. platystigma, also montane in their distribution, but occurring much further east in the Drakensberg massif. The grey indumentum will at once distinguish M. incana, but it differs further in floral detail, particularly in its longer calyx tube and the disposition of the clavate hairs in the throat.
