          relation: supports
          pages: E7102–E7108; Figures 1–4; Supplementary Figures S1–S8
    - subjectId: taxon:haramiyavia
      claimType: ecology
      claimKind: scientific
      statement: Complex teeth and reconstructed wear facets support plant-processing and palinal-chewing inferences, while actual diet and behaviour were not observed.
      confidence: medium
      confidenceRationale: The ecology field for haramiyavia is bounded to the named material and cited primary-study locator; that evidence type is not generalized to ancestry or a whole clade.
      referenceLinks:
