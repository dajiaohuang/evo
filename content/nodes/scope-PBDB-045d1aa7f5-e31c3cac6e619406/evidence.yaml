    - subjectId: taxon:haramiyavia
      claimType: morphology
      claimKind: scientific
      statement: CT data from MCZ7/95A–B and MCZ10/G95 document the dentary condyle, postdentary trough, tooth rows and occlusal wear geometry.
      confidence: medium
      confidenceRationale: The morphology field for haramiyavia is bounded to the named material and cited primary-study locator; that evidence type is not generalized to ancestry or a whole clade.
