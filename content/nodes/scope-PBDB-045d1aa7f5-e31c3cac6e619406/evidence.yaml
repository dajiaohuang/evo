  claim-rationales.zh:
    - 晚三叠世哈拉米亚兽的分类表述只覆盖具名标本及所引主研究的分析范围；导航归属不表示直系祖先或普适系统树。
    - 晚三叠世哈拉米亚兽的地理字段只投影主研究记录的具体产地，不外推为全球分布、起源中心或完整扩散路径。
    - 晚三叠世哈拉米亚兽的生态字段区分保存事实与功能推断；未被标本直接记录的饮食、行为、栖息地或性能均明确保留不确定性。
    - 晚三叠世哈拉米亚兽的形态字段限定于主研究列明的具名标本和精确页码、图版或补充材料，不外推到整个支系。
    - 晚三叠世哈拉米亚兽的年代范围是主研究标本或地层背景的有界投影，不作为全球首现、末现、分化时间或连续谱系时长。
  claim-statements.zh:
    - 已命名的 Haramiyavia 颌骨在已发表的形态矩阵中被重新编码，该矩阵将所取样晚三叠世 Haramiyida 置于哺乳纲冠群之外；这一结果受矩阵限制，并非祖先关系。
    - 本资料所述材料来自东格陵兰 Tait Bjerg 层，并不能确定 Haramiyida 的完整地理分布。
    - 复杂牙齿和重建的磨耗面支持植物加工及下颌后向咀嚼的推断，但真实食性和行为并未被观察。
    - MCZ7/95A–B 和 MCZ10/G95 的 CT 数据记录了齿骨髁、后齿骨沟、齿列和咬合磨耗几何形态。
    - 2.057 亿至 2.014 亿年前的区间，是对这些具名颌骨所在瑞替期地层背景的换算，并非全球 Haramiyida 首次或末次出现，也不是哺乳纲冠群年龄。
