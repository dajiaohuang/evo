  claims:
    - subjectId: taxon:haramiyavia
      claimType: taxonomy
      claimKind: scientific
      statement: Named Haramiyavia jaws were rescored in a published morphology matrix that placed sampled Late Triassic haramiyids outside crown Mammalia; the result is matrix-bounded and not ancestry.
      confidence: medium
      confidenceRationale: The taxonomy field for haramiyavia is bounded to the named material and cited primary-study locator; that evidence type is not generalized to ancestry or a whole clade.
      referenceLinks:
        - referenceId: luo-2015-haramiyavia
          relation: supports
          pages: E7102–E7108; Figures 1–4; Supplementary Figures S1–S8
    - subjectId: taxon:haramiyavia
      claimType: biogeography
      claimKind: scientific
      statement: The profiled material comes from the Tait Bjerg Beds of East Greenland and does not establish the complete geographic distribution of Haramiyida.
      confidence: medium
      confidenceRationale: The biogeography field for haramiyavia is bounded to the named material and cited primary-study locator; that evidence type is not generalized to ancestry or a whole clade.
      referenceLinks:
