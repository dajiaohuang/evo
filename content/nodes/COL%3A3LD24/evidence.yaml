          originalSourceText: Liana; stems densely pale reddish-brown, pubescent when young, glabres- cent, weakly lenticellate. Leaves opposite, elliptic to lanceolate, gradually to abruptly acuminate at the apex, obtuse to rounded at the base, (4-)8-15 cm long, (2.5-)4-7 cm broad, firmly coriaceous, glabrous and semi-glossy above, pale and tan or golden sericeous beneath, the lower surface sometimes with glands near the base; petioles 5-11 mm long, canaliculate, densely and obscurely appressed- pubescent, bearing 1 or 2 pairs of conspicuous plate-shaped glands on the mar- gins. Inflorescence terminal or upper axillary, paniculate, the branches to 15 cm long, the branches, peduncles, pedicels and calyces reddish-brown, tomentose;
