      morphology:
        status: partially-supported
        claims:
          - text: Geophyte, up to 0.6 m high. Usually repeatedly branched. Perianth tube long, usually up to 34 mm, cylindric. Tepals subspathulate. Inflorescence a pseudo-panicle, branching divaricate, with 1 or rarely 2 flowers. Perianth white or pale mauve with pink to red markings near base of lower tepals.
            textZh: Afrosolen bainesii (Baker) Goldblatt & J.C.Manning 的 SANBI 物种条目记录了形态特征。
