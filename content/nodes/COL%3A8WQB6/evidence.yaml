            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: The divaricately branched inflorescence with branches bearing 1 or rarely 2 flowers, long perianth tube 25-35(-45) mm long, and ± white perianth with pink to red markings near the base of the lower tepals are diagnostic for Afrosolen bainesii. The flowers open in the late afternoon and last through the night and into the following day but rapidly become wilted in the dry and hot daylight conditions.
