    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Perennial herb, tufted, up to 0.5 m high. Leaf blades 450 x 7-9 mm, flat, glabrous. Culm nodose, 3-angled, 1.5-2.0 mm in diam. Inflorescence a raceme of spikes, 200-330 mm long. Bracts 1 at each node, leaf-like. Spikes 7 or 8, erect or suberect, the largest 35-45 x 6-7 mm. Pistillate bracts (glumes) same length as and narrower than perigynium, lanceolate, 4-5 x 1.5 mm, keel excurrent into 0.5-1.0 mm long scabrid awn. Perigynium suberect, stalked, 4.5-4.7 x 1.3 mm, 3-angled with rounded base in cross section, not inflated, green or golden-brown, membranous, glabrous; rostrum 2 mm long, apex shallowly bidentate. Flowering time Nov., Jan. Nutlet elliptic, 2.3-2.4 x 1.3-1.4 mm, 3-angled, dark brown with lighter angles, surface smooth.
