    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Eine ausdauernde, meist einstengelige, schlanke, bis 60 cm große Staude mit mehreren Köpfen. Stengel regelmäßig, ziemlich dicht beblättert, achselstandige Kurztriebe sehr dicht beblättert, stark drüsig und ± spinnwebig-filzig behaart, basal verkahlend, schuppig durch die Basen abgefallener Blätter. Blätter langlich-linealisch, 10 x 1.5 mm bis 85 x 5 mm, sitzend, Basis öhrelig verbreitert, leicht stengelumfassend, 1-nervig, ganzrandig, Rand ± nach unten gebogen, oberseits stark drüsig, unterseits ± filzig, am Mittelnerv zusätzlich drüsig behaart. Köpfchen ein bis mehrere (6) am Ende des Stengels bzw. beblätterter Zweige. Involucrum halbkugelig, 4 bis 6-reihig, 6-9 mm hoch, ± spinnwebig-filzig behaart. Die äußeren Hüllschuppen schmal eiformig, zugespitzt, nach innen hin lanzettlich bis linealisch, die außersten (3.2-4.0) x (0.6-0.9) mm, die inneren (8.2-9.0) x (1.1-1.4) mm, die innersten (7.5-8) x (0.79-0.92) mm, besonders die äußeren grünlich, alle ± stark drüsig behaart, Spitzen violettbraun. Zunqenblüten 20-30, Ligula langlich-linealisch, (13-17) x (2.0-2.6) mm,violett bis rosa; 4 bis 7-nervig, ± drüsig behaart. Scheibenblüten 80-120, Krone 5.2-5.7 mm lang, gelb, ± drüsig behaart. Pappus 25-32, bis 6 mm lange, bizarr gezähnte bis subbarbellate Haare in 2 Kreisen, die äußeren z. T. sehr kurz (minimal 0.5 mm) und schwach. Achänen (noch nicht reif), zylindrisch, (1.8-2.1) x (0.4-0.6) mm, 6-8 schwache Rippen, stark drüsig behaart, gelegentlich auch mit einigen steifen Zwillingshaaren besetzt.
