        claims:
          - text: On hillsides under low Karoo scrub at an altitude of about 900 m. This area has a dry climate with very hot summers and cold winters, while the average autumn rainfall varies from 125 to 200 mm per annum. H. semiviva favours clayey soil with pH 6.8.
