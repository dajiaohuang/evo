    facets:
      morphology:
        status: partially-supported
        claims:
          - text: "Plants acaulescent, with leaves in a basal rosette which is about 5 to 6 cm diam., proliferous from the base and leaf axils, and forming small clusters. Leaves numerous, the young erect, incurved, the old ascending, somewhat spreading, incurved, 35 to 40 mm long, about 12 mm broad, up to 3 mm thick, elongate to lanceolate; upper surface flat to slightly rounded, smooth, pellucid, with 6 to 7 green reticulate longitudinal lines, these becoming brown near the apex; lower surface flat to rounded, smooth, pellucid near the apex, the remainder green, with 8 or 9 reticulate lines in the lower part of the leaf, the upper portion translucent, the leaf-tip becoming necrotic during the resting period; keel 1, indistinct, toothed with a few 3 to 4 mm long translucent bristles; margins acute, armed with 6 to 7 mm long pellucid lanceolate bristles near the apex, becoming shorter in the middle; end-awn up to 12 mm long, ciliate, persistent, pellucid. Inflorescence about 36 cm tall; peduncle simple, terete, about 2.5 mm diam., about 22 cm long, bracteate, sterile bracts membranous, ovate, acuminate, about 5 mm long, erect, keeled; raceme about 14 cm long, lax, with about 20 spirally arranged flowers and buds, 6 to 10 open simultaneously; floral bracts membranous, 5 mm long, deltoid, acute, keeled with light brown veins, clasping the pedicels, (longer than the pedicels); pedicels 3 mm long, 1 mm diam.; perianth brownish-white with brown keels to the segments, 13 mm long, compressed at base, funnel-shaped, tube more or less 4 mm across, constricted to 3 mm above, curved; segments free to the base, limb 2 lipped; posterior segments recurved, not spreading, white with brown veins; exterior part recurved, spreading, white with green veins; stamens 6 of two lengths 7 and 8 mm long, inserted within the perianth tube; ovary 6 mm long, 2 mm diam., green; style 2 mm long, curved, capitate. Flowering: October through November, often into December."
