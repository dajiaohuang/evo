        usage:
          title: Serjania insignis Radlk., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Tendrilled lianas; stems terete with ca. 6 weakly raised ribs, grayish strigose and with a grayish waxy bloom on the epidermis; wood composite, the peripheral bundles 3 or 4, moderately large, irregular, flattened to terete in larger stems. Leaves biternate; petioles terete, 2.5-7 cm long; petiole and rachis without wings; leaflets obovate to oblanceolate, rarely elliptic to subrhombic, acuminate at the apex, acute to attenuate at the base, 4-15 cm long, 2-7 cm wide, subentire to ob- tusely and remotely crenate in the distal half, glabrate to strigose, especially on the veins and with obscure glandular dots on both surfaces. Thyrses solitary in upper leaf axils or on tendrils but usually in a terminal panicle 15-20 cm long, densely strigose, becoming tomentose on the smaller branches and pedicels; bracteoles acute; pedicels 0.5-2.5 mm long, articulate at about the middle, vil- bous to tomentose. Flowers white, 2-3 mm long; sepals ovate, strigose to villous, densely ciliate; petals oblong to spatulate, glabrous, ca. 2.5 mm long, glandular within, the scales of the anterior petals shorter than the petals, the crest bifid- emarginate (at least sometimes deflexed); the deflexed appendage densely vil- bous, about as broad as long; filaments villous; ovary 3-sided, glandular, glabrous except on the upper angles. Fruits ovate-cordate, 2-3 cm long, as wide as long, constricted slightly at the seed-bearing part, the wings yellowish brown, glabrous, the veins prominulous, the seed-bearing part dark brown, glabrous except for a few trichomes, these usually restricted to the angles, the veins raised.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 12555
