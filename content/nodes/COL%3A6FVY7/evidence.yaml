          originalSourceText: Although Episcia lilacina was originally described from Costa Rica, it is much more common in Panama, particularly in the provinces along the Carib- bean coast. The northern limit of the species is in Nicaragua, and to the south E. lilacina reaches Choco and Antioquia in Colombia.
