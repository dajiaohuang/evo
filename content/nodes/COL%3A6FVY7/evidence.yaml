        usage:
          title: Episcia lilacina Hanst., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Prostrate or decumbent terrestrial herbs often forming large spreading colonies from stolons; stems succulent, usually short, seldom to 20 cm tall, stout, terete, green to dark red purple, hirsute with spreading hairs, rooting at the nodes. Leaves opposite, oblong ovate or elliptic oblong, 3-14 cm long, 1.5-9.0 cm wide, the apex broadly acute or obtuse, the base cordate to acute, occasionally oblique, crenate dentate, above bullate to areolate, dark green or reddish green usually with lighter green near the impressed veins, hirsute, below usually red purple, sometimes light green, pilose; petioles slender, subsulcate, 0.6-2.1(-5.0) cm long, pilose to hirsute with spreading hairs. Inflorescences cymose, of 1-6 flowers in the leaf axils; peduncles short when present; bracts 2, lanceolate to spathulate, to 1 cm long, green; pedicels 0.8-2.5 cm long, pilose. Flowers showy; floral tube short; calyx of 4 erect anterior sepals 0.8-1.1 cm long, 2-3 mm wide, 1 posterior sepal curved around the spur, slightly shorter and narrower, all spathulate, green to reddish purple, pilose, the apex entire to dentate, somewhat recurved; corolla tube white to pale lavender outside, the inside yellow in the throat, white to purple on the limb, the tube 2.0-3.5 cm long, the base 4-7 mm wide, with a rounded spur ca. 5 mm long on the upper side at the base, gradu- ally wider toward the narrow laterally compressed throat which then broadens to a flat subbilabiate limb, the outside pilose, the inside a band of translucent papillae on the upper side to the base of the 2 upper lobes of the limb, the oblique limb composed of 5 orbiculate lobes, to 3 cm wide, 1.5-2.0 cm long, 1.3- 1.6 cm wide, denticulate; stamens adnate to base of the corolla for up to 5 mm, the filaments connate for a short distance above the adnation before becoming separate, glabrous, the anthers at first coherent, oblong, 2 mm long, 1.5 mm wide, glabrous, the filaments coiled after anthesis; disc gland 1, emarginate, ca. 1 mm long, yellow, glabrous; ovary apex conic, 3-5 mm long, pilose, the style curved, reaching the corolla throat, nearly glabrous, the stigma capitate. Capsule fleshy, globose, ca. 8 mm in diam., pilose; seeds ellipsoid, ca. 0.5 mm long, obliquely striate, reddish brown, shiny. Chromosomes 2n = 18 (Rogers, 1954).
