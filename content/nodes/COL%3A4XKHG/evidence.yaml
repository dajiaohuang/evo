        usage:
          title: Sinningia incarnata (Aubl.) D.L.Denham, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Herbs or somewhat suffruticose; tuber woody, to 8 cm in diam., ca. 4 cm thick; stems erect, to 1 m tall, green or reddish with reddish longitudinal lines in the internodes, villous, especially toward the apex, with patent and appressed hairs, the internodes to 10 cm long; branches numerous, but often short. Leaves opposite, oblong, obovate, or elliptic, 4.5-9.5 cm long, 1-4 cm wide, thickened from dense vestiture, the apex acute, the base attenuate into the petiole or acute, crenate, above green, densely villous or hirsute, with broad based trichomes, below lighter or yellowish green, more densely pubescent; petioles 1-4 cm long, villous. Inflorescernces axillary, but appearing racemiform and terminating the stem, leafy below, the leaves reduced to bracts above; peduncles 1-5 short or lacking; bracts 2, small; pedicels ca. 1 cm long, elongating in fruit, ascending, green or reddish, villous. Flowers showy; calyx campanulate, green or reddish, the tube 3-4 mm long, ca. 7 mm wide, the lobes broadly triangular, erect, 4-7 mm long, 2-5 mm wide, the apex acute, pilose and glandular on both sides; corolla red or red orange outside, often yellowish within, the tube 3-4 cm long, the base gibbous, ca. 7 mm wide, then narrowing to ca. 4 mm wide, broader at the middle, before narrowing just below the limb, the outside hirsute, the inside glabrous, the limb oblique, bilabiate, the upper lobes united, erect, ca. 1 cm long and wide, the lateral and the basal lobes somewhat reflexed, ca. 2 mm long, ca. 7 mm wide; stamens nearly equalling the upper corolla lobes, the filaments curved, adnate to the base of the corolla tube, 3-4 cm long, glabrous to pubescent, the anthers coherent at the apices, 1.5-2.5 mm long; disc glands 4 or 5, with 2 posterior glands large and connate; ovary conic, pubescent, the style curved, equalling the stamens, pilose. Capsules ovoid, ca. 1 cm long, apex acuminate; seeds fusiform or oblong, ca. 1 mm long, light brown, striate, twisted. Chromosomes n = 13 (as Rechsteineria warszewiczii from cultivation; Clayberg, 1967).
