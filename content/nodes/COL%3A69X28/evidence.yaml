    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Perennial, rhizomatous and stoloniferous, up to 1 m high. Leaf blades 100-300 mm long, 4-7 mm wide, acuminate. Culms wiry, usually erect. Spikelets 2.0-2.5 mm long. Spikes 4-6, 50-80 mm long; spikelets ± their own length apart; lower glume 2.0-2.5 mm long; lowest lemma 3.5 mm long, with awn 2-8 mm long.
            textZh: Chloris diluta Renvoize 的 SANBI 物种条目记录了形态特征。
            sourceIds:
