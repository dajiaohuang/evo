        usage:
          title: Ceiba pentandra (L.) Gaertn., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Tree up to 40 m. high, the trunk cylindric, often with strong buttresses, 0.8-2 m. in diam., aculeate; or not, the crown spherical to pyramidal, the branches usually aculeate, the bark smooth and fibrous. Leaves 5- to 9-foliolate, glabrous, the petiole 5-23 cm. long; leaflets with a petiolule 0.5-1.2 cm. long, the blade oblong-lanceolate, slightly narrowed at the base, acuminate at the apex, 10-21 cm. long and 2.3-4.2 cm. wide, the margins sometimes denticulate near the apex. Inflorescences fasciculate, few- to many-flowered. Flowers 2.5-4 cm. long, the pedicel 2.5-3 cm. long, glabrous; calyx campanulate, 4- to 5-lobate and with more or less rounded lobes, 1-1.2 cm. long and 0.9-1.2 cm. wide, glabrous outside, silky-villous inside; petals obovate- oblong, rounded, 2.5-4 cm. long and 1-1.5 cm. wide, light yellow, villous to tomen- tose outside except the base, pubescent near the apex inside; staminal column con- ical, 5-5.5 mm. long, glabrous, the filaments ca. 2.5 cm. long, each bearing 2-3 anfractuose anthers, the anthers 1-thecate; ovary slightly subinferior, globose, glabrous; style filiform at the base, suddenly obliquely enlarged above the staminal column, slightly longer than the stamens; stigma capitate. Capsule subligneous, ellipsoid or fusiform, acute at both ends, 10-26 cm. long and 3-4 cm. in diam., dehiscent or not on the tree, the valves ca. 2 cm. wide; seeds numerous, subglobose, 5.5-7 mm. long and 4.4-5.5 mm. wide; kapok copious, grayish.
          originalLanguage: en
          sourceField: general
