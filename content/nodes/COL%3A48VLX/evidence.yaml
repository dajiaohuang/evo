        claims:
          - text: Similar to O. genistifolia but leaves obovate, recurved and mucronate at tips, young leaves 4-ranked.
            sourceIds:
              - sanbi_14184_0
            locator: "SANBI/WFO archive Morphology row 10745; source 14184.0; publication: Manning, JC; Goldblatt, P. 2012. Asteraceae: Oedera L. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 399 - 400. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: This species is closely allied to R. genistifolia. Specimens of R. squarrosa are usually distinguished from the former in the typically squar-rose-recurved, elliptic, larger leaves and the campanulate, wider involucres, which often have a distinctly spotted appearance. Furthermore, young vegetative shoots often have a decussate leaf-arrangement, not expressed in R. genistifolia. Specimens without the last character and spreading, more irregularly bent leaves and uniformly coloured involucres might look very similar to R. genistifolia. They can be distinguished by the more slender achenes with shorter pappus, less than 1/5 of the length of the achene. Lastly, achenes of ray-florets are almost always glabrous, only occasionally pilose and then much more sparsely than in R. genistifolia. Another closely related species is R. conferta, which however is smaller and easily distinguished. As evident from the description this species varies considerably in foliage. Only in one case is this correlated with distribution. Specimens from Piketberg and even more noticeably just north thereof, have wider, almost orbicular leaves.
            textZh: SANBI 条目提供了该种的鉴别特征。
