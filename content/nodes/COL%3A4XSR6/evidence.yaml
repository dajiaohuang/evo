          originalSourceText: Small caespitose herbs usually forming grass-like turfs, not greatly discoloring in drying; roots slender and fibrous; leaves linear-ensiform, 4-9 cm. long, 0.1-0.3 cm. broad, both basal and sparse upon the flowering stems; flowering stems almost invariably branching at least once, 7-2 0 cm. long, slender and only slightly ancipitous; inflorescence simple, few- to several-flowered; spathe valves very un- equal, foliaceous, compressed, the outer 1-3 cm. long; perianth- blue to pinkish lavender, usually yellowish at the base, rather narrow, 0.7-0.8 cm. long, minutely puberulent to glabrous at the base without; stamen filaments completely connate to the anthers, about 0.1 cm. long; capsules globose, about 0.3 cm. in diameter; seeds somewhat angular, about 0.1 cm. in diameter, conspicuously reticulate- foveolate.
