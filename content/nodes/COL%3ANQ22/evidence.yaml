            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: B. lavrani is distinguished from other Bulbine species by the coal-black, carrot-shaped tubers and single succulent, 3-4 mm broad, erect, terete to subterete leaf. At present, of the known species, only B. monophylla is unifoliate but differs from the new species in that the tuber is almost ovoid, there are at least two basal leaf bracts, the leaf is much longer, ca. 180 mm and proportionately narrower and the inflorescence is more robust. B. lavrani flowers during the hottest summer months, end of February into March, before the leaves develop. The flowers open before the sun rises and remain open all day. In horticulture the leaf elongates unnaturally and occasionally a second leaf appears. An interesting feature is the strongly carnation-scented flowers.
