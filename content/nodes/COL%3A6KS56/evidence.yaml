          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Lianas, or scandent to arching shrubs, the tendrils at the bases of the inflorescences, the younger stems pubescent, the trichomes grey to brown. Leaves inconspicuously 3-nerved at the base, ovate or sometimes elliptic, acute, serrate, the teeth mostly glandular and remote, rounded to shallowly cordate basally, to 11(-13) cm long and 7(-9) cm wide, glabrous to sparsely pubescent above, more or less glabrous, appressed-pubescent on the veins to densely pubescent beneath; petioles 0.5-1.5(-2) cm long, pubescent, the stipules minute, deciduous.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 11025
