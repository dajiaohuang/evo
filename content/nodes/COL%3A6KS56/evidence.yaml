        usage:
          title: Gouania lupuloides (L.) Urb., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Inflorescences glomerules, sessile or subsessile, 5-8-flowered, arranged in "spikes" 8-18 cm long, each glomerule subtended by a bract, deltoid, 2-3 mm long, pubescent, the rachis pubescent. Flowers mostly bisexual, sometimes functionally carpellate or staminate by reduction; subsessile or with pedicels 1-2 mm long; floral tube more or less obconic, pubescent; sepals deltoid, ca. 0.6-1 mm long, keeled on the inner surface, densely pubescent on the outer surface; petals white, ca. 0.8-0.9 mm long; stamens functional or reduced, the filaments ca. 0.5-0.8 mm long, the anthers ca. 0.15-0.2 mm long; nectariferous disc 1- or 2-lobed between the stamens, generally 10-ridged, sparsely pubescent near the emergence of the styles; ovary functional or sometimes reduced, the styles 3, ca. 0.6-0.9 mm long. Schizocarps sparsely pubescent on the body, rarely densely so, the body brown to green-black, ca. 3-4 mm high, the wings paler, dolabriform, ca. 5-6 mm high and 4-5 mm wide; seeds 3, brown, ca. 2 mm. long.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 11027
