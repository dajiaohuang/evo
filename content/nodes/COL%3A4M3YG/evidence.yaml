      morphology:
        status: partially-supported
        claims:
          - text: "Perennial, aquatic herb, up to 1 m high. Leaves with petioles of two kinds: submerged leaves disappearing early, not present in mature plant; floating or aerial leaves with blade elliptic to oblong-ovate, margins smooth, leathery, veining indistinct, usually with a discoloured section at junction of petiole and blade. Flowers: in many-flowered spikes; Nov.-Mar. Fruit 4-5 mm long."
