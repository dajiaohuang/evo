    - subjectId: taxon:haootia
      claimType: biogeography
      claimKind: scientific
      statement: The Haootia holotype NFM F-994 comes from the Fermeuse Formation on the Bonavista Peninsula of Newfoundland, Canada; this named occurrence does not establish a complete geographic distribution or origin centre.
      confidence: high
      confidenceRationale: The formation, peninsula and holotype provenance are documented in the primary literature. High confidence is limited to the represented locality and does not infer absence elsewhere.
      referenceLinks:
        - referenceId: mcilroy-2024-haootia
          relation: supports
          pages: "1096"
          figure: Figures 2–3
          quoteLocator: Holotype NFM F-994, plastotype OUM ÁT.424/p and Fermeuse Formation provenance
    - subjectId: taxon:haootia
      claimType: ecology
      claimKind: scientific
      statement: Haootia is associated with a marine Ediacaran depositional setting and an attached or sessile interpretation, but the holotype preserves no direct diet, behaviour or feeding-guild evidence.
      confidence: medium
      confidenceRationale: The depositional context and interpretation of an attached impression are supported by the primary description, whereas feeding and locomotion beyond that interpretation are not directly observed.
      referenceLinks:
