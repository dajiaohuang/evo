          relation: supports
          pages: "20141202"
          figure: Figures 1–4
          quoteLocator: Fossil surface context, body orientation and discussion of a muscular cnidarian interpretation
    - subjectId: taxon:haootia
      claimType: morphology
      claimKind: scientific
      statement: The Haootia holotype preserves a roughly quadrate body impression with repeated aligned internal structures; muscle identity and their orientation remain competing interpretations rather than observed histology.
      confidence: contested
      confidenceRationale: The impression geometry is direct fossil evidence, while tissue identity and orientation are explicitly reassessed in primary literature with materially different conclusions.
