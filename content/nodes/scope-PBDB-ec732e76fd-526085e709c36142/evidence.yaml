  claims:
    - subjectId: taxon:haootia
      claimKind: scientific
      claimType: morphology
      statement: Haootia preserves repeated aligned impressions in one Ediacaran holotype, but muscle identity, orientation and staurozoan comparison have competing primary interpretations; the specimen does not set a Staurozoa or Cnidaria range.
      confidence: contested
      confidenceRationale: The holotype impression is direct evidence, whereas tissue identity and phylogenetic placement remain explicitly disputed among the inherited sources.
      referenceLinks:
        - referenceId: liu-2014-haootia
          relation: supports
          pages: "20141202"
          figure: Figures 1–4; Supplementary Information
          quoteLocator: Plastotype OUM ÁT.424/p and original muscular-cnidarian reconstruction
        - referenceId: miranda-2015-haootia
          relation: contradicts
          pages: "20142396"
          figure: Figure 1
          quoteLocator: Reassessment of muscle orientation and staurozoan comparison
        - referenceId: mcilroy-2024-haootia
          relation: contextualizes
          pages: "1096"
          figure: Figures 2–8
          quoteLocator: Holotype re-examination and crown-staurozoan hypothesis
    - subjectId: taxon:haootia
      claimKind: scientific
      claimType: fossil-range
      statement: Haootia is displayed at approximately 560 Ma only as the age estimate for its type material used by competing muscular-cnidarian interpretations; it is not a crown-Staurozoa FAD, direct ancestor or global genus duration.
      confidence: contested
      confidenceRationale: Liu et al. (2014) documents the type material and original interpretation, while Miranda et al. (2015) and McIlroy et al. (2024) expose competing character readings and McIlroy et al. identify holotype NFM F-994 and plastotype OUM ÁT.424/p. Contested confidence is restricted to the approximately 560 Ma specimen age estimate.
      referenceLinks:
        - relation: supports
          referenceId: liu-2014-haootia
