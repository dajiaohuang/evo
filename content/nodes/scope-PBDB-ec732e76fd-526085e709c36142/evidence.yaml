    - subjectId: taxon:haootia
      claimType: taxonomy
      claimKind: scientific
      statement: Haootia quadriformis is retained as an Ediacaran cnidarian candidate because the holotype was described in a muscular-cnidarian framework, while later primary studies dispute the staurozoan comparison and keep its precise placement open.
      confidence: contested
      confidenceRationale: The name and holotype are directly documented, but independent primary reassessment changes the interpretation of the repeated impressions and the strength of the cnidarian placement.
      referenceLinks:
        - referenceId: liu-2014-haootia
