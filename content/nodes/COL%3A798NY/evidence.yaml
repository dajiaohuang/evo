    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, 5-8 cm, corms rounded at base with coarse, bent teeth. Basal leaves 1-several. Flowers yellow with dark streaks.
            textZh: Romulea monticola M.P.de Vos 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 7314; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Closely related to R. obscura and distinguished chiefly by its bright golden-yellow flowers on brownish subterete peduncles which remain suberect or bend only slightly in the fruiting stage. The flower can be confused with that of the sympatric R. montana but R. monticola differs in its corm, less green bracts, leaf anatomy with fibre bundles along the margins of the leaf ribs, and in chromosome number.
            textZh: SANBI 条目提供了 Romulea monticola M.P.de Vos 的鉴别特征。
            sourceIds:
              - sanbi_12511_0
            locator: "SANBI/WFO archive Diagnostic row 51682; source identifier 12511.0; cited publication: De Vos, MP. 1983. Syringodea, Romulea, Fl. S. Africa 7(2,2): 1 - 76. Botanical Research Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Distinguished from other members of sect. Roseae with rounded corms by the golden-yellow flowers, usually with dark veins in the cup, dark reddish brown, subterete peduncles not spreading or coiling in fruit, and subherbaceous outer bracts with relatively narrow, finely brown-speckled margins. Closely resembling yellow-flowered forms of Romulea obscura from the Olifants River Valley but distinguished by its brighter yellow flowers with proportionally shorter bracts less than half as long as the perianth, inner bracts with broader membranous margins ± as wide as the central green portion, and the peduncles remaining suberect or curved in fruit. The flowers in R. obscura are mostly dull yellow (to salmon-pink) with the bracts more than half as long as the flowers, the membranous margins of the inner bracts distinctly narrower than the central green portion, and peduncles widely spreading in fruit. Romulea monticola may also be confused with R. luteoflora, which typically has more strongly herbaceous bracts with whitish margins and apices marked with larger, dark flecks, and peduncles that ultimately coil up in fruit. Neither R. obscura nor R. luteoflora have been recorded from the Bokkeveld and Matsikamma-Gifberg. It is also superficially similar to R. montana (sect. Romulea), which usually has dark markings on the tepals, bracts without visible membranous margins, and corms with a crescent-shaped basal ridge.
            textZh: SANBI 条目提供了 Romulea monticola M.P.de Vos 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 95170; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
