    facets:
      morphology:
        status: partially-supported
        claims:
          - text: "Annual, 0.1-0.6 m high. Stems erect, well branched, tufted at base, leafy, herbaceous and glabrous above; plant with foetid smell. Leaves shortly petiolate to sessile; blade linear-lanceolate, 12-38 x 1.5-12.0 mm, apex acute, lower leaves with margins dentate, upper ones entire. Flowers: in many-flowered, capitate racemes, longer in fruit, apex obtuse, base narrowed or obtuse, covered with minute hairs, 12-230 mm long, sessile and globular or dot-like; bracts entire; spur 3-4 mm long, cylindric, obtuse, somewhat curved; corolla with upper lobes oblong; white, pink or mauve with purple veins, palate bi-convex, yellow-orange; Aug.-Dec. Fruit an oblong to ovoid capsule, 4-14 x 4.0-8.5 mm, apex slightly contracted, not horned, valves obliquely truncate."
            sourceIds:
              - sanbi_16229_0
            locator: "SANBI/WFO archive Morphology row 72205; source 16229.0; publication: Bester, SP; Retief, E; Meyer, NL. 2017. Scrophulariaceae. In: E Retief & NL Meyer (eds), Plants of the Free State: Inventory and identification guide, Strelitzia 38: 755 - 793. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: See 2b N. foetens. Description based on Latin diagnosis in Ventenat (1804) and specimens identified as ‘N. capensis (Thunb.) Kuntze var. linearis (Vent.) Grant’ (ined.) by A.L. Grant.
            textZh: SANBI 条目提供了该种的鉴别特征。
            sourceIds:
