        claims:
          - text: Like H. falcata but leaves always 3, crowded at the base, flowers pale yellow and perianth tube 12-16 mm long, exceeding the tepals.
            textZh: Hesperantha sufflava Goldblatt 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 6691; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Hespernatha sufflava at first appears to be intermediate between the common, usually white-flowered H. falcata and the rarer H. spicata, but at the type locality H. spicata grows together with H. sufflava and is obviously quite different in its secund spike of small, pure white flowers with slightly curved perianth tube 4-6 mm long and smaller tepals 4-7 mm long. Moreover, flowers of H. spicata open at about 18:30 when they release a strong, sweet, narcissus-like scent with a strong clove component. Flowers of H. sufflava are pale yellow and open at about 15:00 and have a quite different, slightly acrid, pyrethrum-like odour. Particularly unusual are the long style branches about 12 mm long that divide in the middle of the perianth tube, with only the upper 7 mm exserted. In nearly all Hesperantha species the style divides just below the mouth of the tube and not within its narrow part. Although easily confused with Hesperantha falcata the flowers of H. sufflava are somewhat smaller, with tepals 7-10 mm long but a substantially longer perianth tube, usually 12-16 mm long, and always longer than the tepals. In H. falcata the tepals are usually 12-18 mm long, exceptionally only 9-11 mm in southern Cape coastal populations, and the perianth tube is 4-9 mm long, thus usually shorter than the tepals. Apart from the flowers, H. sufflava is distinctive in always having only three leaves, all basal or the uppermost one subbasal, and the stem often has a branch produced from the axil of the upper leaf. Most populations of both H. spicata and H. falcata have three (rarely more) foliage leaves and one short, largely or entirely sheathing upper leaf.
            textZh: SANBI 条目提供了 Hesperantha sufflava Goldblatt 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 94874; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
