          - text: Inflorescence similar to S. ludwigii, which is mat-forming, has a horizontally creeping rhizome and shorter leaf blade, 10-30 x 2-3 mm; and to S. rangei, which is seldom stoloniferous and has a shorter and narrower leaf blade, 30-140 x to 3 mm.
