    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Perennial (often mat-forming), rhizomatous and stoloniferous up to 1 m high. Leaf blades 20-300 mm long, 2-12 mm wide, flat, basal leaf sheaths papery. Culms geniculate. Spikelets 1.5-2.5 mm long. Panicle whorled; lower glume a quarter to a third the spikelet length; upper glume as long as, or longer than spikelet.
