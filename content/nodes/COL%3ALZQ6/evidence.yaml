          title: Blakea pauciflora Gleason, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Small tree 6-7 m. tall, glabrous throughout. Petioles 8-10 mm. long. Leaf- blades broadly elliptic-obovate, up to 5 cm. long and 3 cm. wide, rounded above to an apiculum 6-10 mm. long, broadly cuneate at base, 5-nerved. Flowers solitary in the axils on pedicels about 2 cm. long. Bracts separate to the base, broadly triangular, the outer 2.5 mm. long, the inner a little longer. Hypanthium 3 mm. long. Calyx widely flaring, almost truncate, its lobes reduced to minute tubercles. Petals white, semi-obovate, 9 mm. long. Anthers broadly oval, 2.5-3 mm. long, the connective neither elevated nor spurred.
