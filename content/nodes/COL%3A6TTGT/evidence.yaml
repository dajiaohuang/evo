        usage:
          title: Paullinia buricana Croat, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Lianas; stems 3-sided when young, sparsely bispidulous to villous, viscidulous, glabrous and terete in age; wood simple. Leaves ternate-pinnately compound, 8-25 cm long, li-foliolate, the lowermost set of leaflets biternate with two addi- tional sets of leaflets; petioles without wings, 1.5-4.5 cm long, prominently cana- liculate above, the upper margins of the petiole and medial ridge of the rachis coarsely pubescent; lower rachis margined, the upper rachis margined or nar- rowly winged especially toward the apex; leaflets oblong-lanceolate to narrowly elliptic or ovate-lanceolate, sharply acuminate or rarely acute to rounded at the apex, attenuate to acute at the base, 2.2-12 cm long, 1-4.2 cm wide, entire or nearly so, somewhat shiny and glabrous but scabrid on the prominently raised upper midrib and on the major veins below, the vein axils often barbulate beneath, the major lateral veins 5-8 pairs, faintly loop-connected near the margin; stipules linear-lanceolate, brown, 5-10 mm long, glabrous except for the long-ciliate mar- gins. Inflorescences of usually 2-several (rarely 1), slender thyrses 5-10 cm long, at least sometimes at leafless nodes; rachis puberulous; bracteoles narrowly lanceolate-linear, pubescent, to 1 mm long; pedicels 0.5-1.5 mm long, puberulent. Flowers greenish white; outer sepals puberulent, ciliate, 1.5-2 mm long; petals oblong-obovate, to 3.5 mm long, the scales nearly as long as the petals, the basal part elliptical, ca. 1.3 mm long, long-ciliate, the crest linear, much longer than the basal part, glabrous, the deflexed appendage densely bearded throughout, the lateral scales also bearing a simple linear crown; disc glands 4, subequal, small, closely clustered, puberulent on the inner surface; staminate flowers with the stamens to 2.5 mm long, the filaments villous, flattened, united briefly at base, the pistil minute, the ovary sharply trigonous, very sparsely hispid on the mar- gins; bisexual flowers unknown. Fruits unknown.
          originalLanguage: en
          sourceField: general
