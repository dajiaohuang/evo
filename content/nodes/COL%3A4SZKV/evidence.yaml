          originalSourceText: above and beneath, more so on the lateral veins; petioles to 5 mm long; stipules with the sheath ca. 2 mm wide, the marginal setae to 5 mm long. Inflorescences terminal, capituliform, the flowers numerous, to 20, the involucral leaves in 2 pairs, the larger pair widely ovate and estipulate. Flowers with the hypanthium rotund, the calycine tube 0.35-0.50 mm long, the lobes 5-6, unequal, subulate or linear oblong, 1.7-2.3 mm long, acute to subobtuse, the margin ciliate, the hairs to 0.7 mm long; corolla white, occasionally lavender, the tube funnel shaped, ca. 4.5 mm long, constricted below the middle, glabrous, the lobes 5, oblong, 0.5-2.5 mm long; stamens 6, the anthers subrotund, 0.5 mm in diam.; stigmas 3, slender, ca. I mm long, the style ca. 4 mm long, the ovary 3-loculate. Fruits with mericarps 3, the adaxial face closed, with a narrow groove, the abaxial face papillose, more or less strigose.
          originalLanguage: en
          sourceField: general
