    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Straggling woody climbers up to 3 m high, glabrous. Leaves 4-8 cm long, 0.7-3 cm broad, lanceolate to broadly elliptic above the narrow petiole, acute or obtuse, mucronulate. glabrous, fleshy, the margin often revolutc in dried specimens, minutely stipulate. Racemes terminal, leafless, short and corymbose in flower, laxer in fruit, or rarely intercalary. Pedicels about 1 cm long in flower, 1.2-2 cm long in fruit, erect or ascending, subtended by 2 minute bracts. Sepals 4.8-6.5 mm long, 1.5-3 mm broad; outer 2 narrowly oblong, cucullate; inner 2 ovate with broad membranous margins. Petals 8.5-14 mm long, 3-8 mm broad, obovate-oblong to circular-obovate, clawed. Filaments 3-3.8 mm and 3.8-4.8 mm long, stout. Anthers 2 mm long. Ovary shortly stipitate, obovate or broadly oblong; style slender, long; stigma capitate; ovules 2. Fruits 2.5-4 cm long, 0.8-1.3 cm broad, elliptic-lanceolate to elliptic, sometimes oblique, shortly stipitate, the valves flat, 1-nerved, net-veined; style 2.5-6 mm long, tapering. Seeds 3.5-5 x 4-6.5 mm, subcir-cular, narrowly margined. Flowers are mostly produced during June and July, but one specimen with both flowers and fruit was collected in mid-September.
            sourceIds:
