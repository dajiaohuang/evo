        usage:
          title: Burmeistera chiriquiensis Wilbur, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Epiphytic suffrutescent herbs or shrublets; stems glabrous. Principal leaves with blades narrowly linear, 10-12.5 cm long, 7-10 mm wide, ca. 10-15 times as long as wide, apically acuminate and tapering into an elongate, caudate tip 2-3 cm long, basally gradually tapering, marginally shallowly dentate with 1-2 in- conspicuous teeth per cm, glabrous on both surfaces; petioles slender, glabrous, 0.5-1 cm long. Flowers solitary in the upper leaf axils, 3-3.5 cm long; pedicels spreading to ascendant, glabrous, ebracteolate, ca. 3 cm long; hypanthium in anthesis obconic, 5-6 mm long, 3 mm at its broadest diameter, glabrous; calyx lobes narrowly linear, 7-9 mm long, 0.5-0.8 mm wide, acute, inconspicuously cal- lous-denticulate; corolla glabrous, greenish to dark purplish, the tube ca. 14 mm long, basally ca. 4 mm in diameter and tapering above to ca. 2 mm in diameter, the throat flaring ca. 7 mm in diameter, the lobes broadly oblong-falcate with the 2 upper lobes 11-13 mm long, the 2 lateral lobes ca. 7 mm long, the lowermost lobe ca. 5 mm long; filament tube ca. 23 mm long, glabrous throughout or very sparsely and inconspicuously puberulent distally, the longer anthers ca. 4.5 mm long, the shorter anthers ca. 2 mm long, all glabrate except for puberulence in the sutural grooves and the dense tangle of pilose trichomes on the upper edge of the lower anthers. Berries and seeds unknown.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 2921
