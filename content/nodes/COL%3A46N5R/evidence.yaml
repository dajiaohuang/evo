        usage:
          title: Neomortonia rosea Wiehler, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Epiphytic or saxicolous herbs; stems pendent, repent, or scrambling, to 1 m long, slender, 1-2 mm in diam., green or reddish, strigillose, becoming gray brown in older branches; branches frequent. Leaves opposite decussate, rarely 3 at a node in a whorl, nearly equal in a pair; blades ovate or elliptic, 0.5-1.5 cm long, 0.5-1.0 cm wide, membranous, the apex acute to rounded, the base obtuse to acute, crenulate or serrulate, above green, puberulous, interspersed with scattered longer hairs, below green or pinkish, sparsely strigose; petioles 2-5 mm long, short pilose. Inflorescences axillary, of a single flower, the pedicels slender, ca. 5 cm long, green or reddish, sericeous. Flowers showy; calyx lobes distinct, lanceolate, 4-6 mm long, 1-2 mm wide, serrulate, green, pilose to seri- ceous; corolla white, with the upper part of the tube reddish pink, the inside orange or brown maculate, the tube oblique in the calyx, spurred at the base, funnel-shaped, ca. 1.5 cm long, narrowed above the spur, ca. 2 mm wide, then broader above to ca. 7-8 mm wide at the throat, the outside long pilose, the inside glandular pubescent, the limb slightly oblique, the lobes spreading to patent, suborbicular, each 5-6 mm long and wide, laciniate, glandular; stamens included, the filaments curved, 5-8 mm long, adnate to the base of the corolla tube, and briefly connate in a tube around the ovary, the anthers coherent in 2 pairs, each ca. 1 mm long, dehiscing by a longitudinal slit; disc reduced to a dorsal bibbed gland, white, glabrous; ovary pilose, the style glabrous, as long
