        claims:
          - text: Tufted perennial 500-2000 mm high. Leaf blade to 300 x 4-6 mm. Inflorescence narrow; spatheoles linear, green to purplish; homogamous spikelet pairs 1 at base of lower raceme, usually olive-green. Sessile spikelet 6.5-12.0 mm long, dark brown; upper glume awn 6-18 mm long; upper lemma awn 30-50 mm long; callus pungent; anther up to 4 mm long. Pedicellate spikelet 6-10, ± as long as sessile spikelet; anthers as long as sessile ones.
