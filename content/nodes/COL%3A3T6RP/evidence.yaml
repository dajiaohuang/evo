        usage:
          scope:
            zh: 线粒体细胞色素 b 与 D-loop 分析，样本主要来自秘鲁野生狨猴粪便；支持多个 nigricollis 类群谱系作为独立种的分类假说，不单独解决属级名称采用。
            en: Mitochondrial cytochrome-b and D-loop analysis, using mainly fecal samples from wild Peruvian tamarins; supports species-level hypotheses for several nigricollis-group lineages but does not alone settle genus-level naming.
      - id: garbino2018
        referenceId: ref-668595a3-edf1-8232-ac1f-07fd0aa2ae4e
        fields:
          - id
          - title
          - url
          - scope
        metadataVariant: 0
        usage:
          scope:
            zh: 结合遗传、骨骼、毛色与发声资料提出 Callitrichinae 分类方案；该方案把 Leontocebus 置于 Saguinus 的亚属层级，代表与 COL26.8 不同的属级处理。
            en: Combines genetic, osteological, pelage and vocal evidence in a Callitrichinae classification that treats Leontocebus as a subgenus of Saguinus, a genus-level treatment differing from pinned COL26.8.
