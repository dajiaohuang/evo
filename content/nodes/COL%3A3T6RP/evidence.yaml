          scope:
            zh: 本地 MDD v2.5 源记录使用 Saguinus tripartitus，置于 Saguinus 属、Leontocebus 亚属，并提供英文显示名 “Golden-mantled Saddle-back Tamarin”；该记录与固定 COL26.8 ID 的交叉联接仍未命中，不能仅凭同一词尾改写分类身份。
            en: The local MDD v2.5 source row uses Saguinus tripartitus under genus Saguinus and subgenus Leontocebus, with the English display name “Golden-mantled Saddle-back Tamarin”. Its join to the pinned COL26.8 ID is unmatched; a shared epithet alone is not used to rewrite taxonomic identity.
      - id: matauschek2011
        referenceId: ref-28c6f691-9686-8d2f-a46f-ed8c5b7b2cf0
