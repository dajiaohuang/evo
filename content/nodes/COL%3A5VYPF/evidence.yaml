    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, up to 120 mm tall, stem occasionally branched, densely hairy. Leaves lanceolate to ovate, densely long hairy. Flowers 3-6 in an ascending spike, bilabiate, pale pink to purple with pale yellow nectar guides, perianth tube 12-15 mm long, dorsal tepal 28-30 mm long, ovary smooth, bracts green, densely hairy, inner forked apically. Aug.-early Sept.
            textZh: Babiana rubella Goldblatt & J.C.Manning 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_14562_0
            locator: "SANBI/WFO archive Morphology row 33052; source identifier 14562.0; cited publication: Goldblatt, P; Manning, JC. 2013. Iridaceae. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 94 - 124. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Distinctive both in the densely long-hairy stem and leaves, and in the pink to light purple perianth with pale yellow lower lateral tepals. The flowers are of moderate size with a perianth tube 12-15 mm long, a dorsal tepal 28-30 mm long, and have a pleasant sweet, rose-like scent and the leaves have short, oblong-ovate blades held nearly horizontally to the sheaths. Superficially B. rubella resembles a second Namaqualand endemic, B. horizontalis, in the unusual pink flower colour, but that species has almost hairless leaves and bracts, and the stem reaches only shortly above ground. Babiana pilosa also has pink flowers and is densely hairy, though with retrorse hairs. Both B. nana, a species of coastal sandveld in Western Cape, and B. rubella may have a branched aerial stem, suberect to weakly inclined spikes, and relatively short, broad leaves, often held nearly at right angles to the sheaths but the flowers of B. nana are usually blue to violet with white markings.
            textZh: SANBI 条目提供了 Babiana rubella Goldblatt & J.C.Manning 的鉴别特征。
