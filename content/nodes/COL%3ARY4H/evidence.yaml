        usage:
          title: Cavendishia pubescens (Kunth) Hemsl., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Epiphytic and terrestrial shrubs, 1-3 m tall; mature branches subterete or bluntly angled, ridged, moderately short pilose, reddish brown when dry; im- mature branches and twigs of the new growth flattened and coarsely angled, ridged, densely short pilose with whitish or grayish trichomes ca. 0.5 mm long. Leaves elliptic to lanceolate, (5.5-) 14-20 cm long, (1.5-)3.5-9 cm broad, basally cuneate, obtuse or rounded, apically long acuminate with a blunt tip or rarely acute, grayish green when dry, densely puberulent on both the surfaces with soft, white trichomes, persistent beneath, often glabrate above; 5 (-7)- plinerved, the midrib impressed above and prominently raised beneath, the lateral nerves impressed above but plane distally, raised and prominent be- neath, the veinlets plane to slightly raised but obscure on both sides; petioles subterete, rugose, coarsely ridged, (6-)9-15 mm long, 2-3.5 mm in diameter, densely short pilose. Inflorescence 7-11-flowered, encircled at the base by densely short-pilose bracts; rachis bluntly angled, striate, rugose, short pilose with persistent, densely white hairs, sometimes fimbriate, 1-2.5(-4.5) cm long, 2-3 mm in diameter, pink, rarely with basal cartilaginous teeth; floral bracts muricate, short pubescent both abaxially and marginally with densely white hairs, elliptic to oblanceolate, basally narrowed, apically rounded, 17-30 mm long, 7-13(-17) mm wide, pale pinkish green or whitish green, usually with small, red, clavate glands abaxially; pedicels bluntly angled, densely short pilose, often fimbriate, 6-14 mm long, 1-1.5 mm in diameter, pink but turning green; bracteoles linear to aristate, rarely oblong, 2-4.5 mm long, to 1 mm wide, densely pubescent and glandular fimbriate. Flowers with the calyx pubescent with densely matted white or tan trichomes, glandular fimbriate, 5.5-6.5(-9) mm long, the tube cylindric, 2.5-4 mm long, not basally enlarged, green, the limb cam- panulate or spreading, (2.5-)3.5 mm long, whitish to pinkish green, the lobes ob- long, broadly triangular, obtuse or broadly rounded and apiculate, 1.5-2(-3) mm long, connivent after anthesis, pinkish green, the sinuses obtuse; corolla cylindric or bottle-shaped, slightly constricted basally, narrowed to the throat, (14-)17-19 (-22) mm long, 8 mm in diameter, white or in age tinted with pink, densely short pilose with white or tawny trichomes, the lobes triangular, wide spreading at anthesis; stamens 11-15.5 mm long, the filaments alternately 2.5-4 mm and 3.5-6 mm long, white, the anthers including the tubules alternately 8-11 mm and 9.5-13 mm long, brownish orange, the thecae 2.5-4 mm long; style glabrous or rarely distally pilose, 13.5-17 mm long. Berry densely puberulent, 8-14 mm in diameter.
