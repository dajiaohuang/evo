        claims:
          - text: It occurs mainly on dolomite or the quartzitic outcrops adjacent to the dolomite formations. This very robust plant, with 3 m long stems, grows on rocky ledges, or among rocks in leaf litter. It is principally confined to vegetation type SVcb 25, Poung Dolomite Mountain Bushveld.
