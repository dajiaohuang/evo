        usage:
          title: Tetrapterys subaptera Cuatrec., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Liana, the branches appressed ferruginous-pubescent, becoming eventually glabrous. Leaves opposite, coriaceous, lanceolate to ovate-lanceolate or oblong- lanceolate, acute to acuminate at apex, obtuse to acute at base, 5-13 cm long, 2- 5.5 cm wide, glabrous and shiny above, glabrous or sometimes minutely ap- pressed-pubescent below, minutely and obscurely glandular, usually also with 1 or 2 pairs of plate-shaped glands along the midrib near the base; primary lateral veins 6-9 pairs; petioles 5-10 mm long, eglandular, appressed-pubescent, gla- brous in age; stipules interpetiolar, deciduous. Inflorescence terminal, cymose- paniculate, equalling the uppermost leaves, the axis and branches angular, ap- pressed, ferruginous-pubescent. Flowers 1.8-2 cm diam., often 4-umbellate, bracts ovate, obtuse at apex, ca. 1.5 mm long; peduncle thickened, 3-5 mm long, densely appressed-pubescent; pedicels 2-4 mm long; bracteoles paired, opposite, clasping, ovate, subacute, ca. 1 mm long; sepals 2-2.5 mm long, rounded at the apex, glabrous or subglabrous, densely ciliate; calyx glands 8, oblong, ca. 3 mm long; petals yellow, glabrous, the limb suborbicular or ovate-orbicular, 5.5-8 mm long, emarginate at base, the margin denticulate, the claw thick, 1.5-2.5 mm long; stamens somewhat unequal, united at the base into a tube, villous outside at the base, 1.5-2 mm long; anthers oblong-ellipsoid, ca. 1.5 mm long, the connective glabrous, thickened dorsally; ovary hirsute; style glabrous, broadly flattened sub- apically, recurved at apex. Samara with vestigial wings, ovate, rugose, drying 6-11 mm long, sparsely to densely subappressed pubescent, the lateral wings reduced, 2-8 mm long, deltoid and rounded at apex, the dorsal wing about equal to lateral wings but forming a sharp crest on the fruit body; inferior wings lacking altogether, the body ca. 8 mm diam.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 7205
          archiveSourceId: 2B1688D4-E8AF-45A2-9DE6-4C783D696D73
