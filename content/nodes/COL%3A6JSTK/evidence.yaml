            locator: Abstract; Results, Population genomic structure; Figure 1 and its legend
            placeTimeScope: Whole-genome data from 60 cereal-crop isolates sampled across North America; group assignments follow the authors' 2018 analyses.
            lifeStatus: Molecular evidence from archived crop-associated isolates; no current population status is inferred.
        gaps:
          - The study is geographically limited and does not establish a global species phylogeny, divergence dates, or the present distribution of each population.
