      ecology:
        status: partially-supported
        claims:
          - text: "The study's population-genomic panel comprised 60 F. graminearum isolates collected from cereal crops in the northern United States and southern Canada: 20 NA1/15ADON, 20 NA2/3ADON, and 20 NX-2 isolates. This describes the source and structure of that sample, not their prevalence across the species' range or all host plants."
