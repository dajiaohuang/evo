        gaps:
          - This selected population-genomic panel is not a comprehensive host, habitat, or geographic survey; the broader ecological niches and field prevalence remain unassessed.
      evolution:
        status: partially-supported
        claims:
          - text: Bayesian clustering and phylogenomic analyses of the 60 sampled isolates supported three North American populations (NA1, NA2, and NA3); eight NX-2 isolates had admixed ancestry across the groups. This is population structure in the study panel, not a species-wide phylogeny or global evolutionary history.
            originalLanguage: en
            sourceIds:
