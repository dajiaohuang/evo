    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Acaulescent, cormous geophyte, 5-9 cm, stems shorter than leaves. Leaves lanceolate, hairy, narrow and twisted when young. Flowers few on a short, erect spike, zygomorphic, pale blue to lilac with white or yellow and purple markings, fragrant, inner bracts divided to base, ovary hairy.
            textZh: Babiana scabrifolia W.Brehmer ex Klatt 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 6744; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Most easily recognised by the underground stem, often branched at ground level, and usually forming small tufts, and the fairly large, pale blue to blue-mauve flowers, which have a pleasing sweet scent and contrast both in the scent and large size with those of B. mucronata, which is also common in the Olifants River Valley. That species typically has an erect, usually well-developed aerial stem, while the flowers have a densely hairy ovary and produce a rather harsh acrid-spicy odour. Young plants do not have the narrow, twisted to coiled immature leaves of B. scabrifolia that surround the parent plants. It reproduces amply by cormlets and it is common to see mature flowering plants with their broad, soft-textured leaves surrounded by the linear, twisted to coiled leaves produced by immature plants.
            textZh: SANBI 条目提供了 Babiana scabrifolia W.Brehmer ex Klatt 的鉴别特征。
