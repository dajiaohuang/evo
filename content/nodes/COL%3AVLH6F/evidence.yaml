        metadataVariant: 0
        usage:
          title: Koanophyllon solidaginoides (Kunth) R.M.King & H.Rob., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrubs or subshrubs often with long arching or subscandent branches; stems slender, to 2 m long, terete, scarcely striate, minutely puberulous. Leaves opposite; blades rather membranaceous, ovate, 5-12 cm long and 3-6 cm wide, the base truncate to cordate, the margins serrate-crenate, the apex caudate-acuminate, the upper surface sparsely pilose, the lower surface with numerous glandular puncta- tions, puberulous to subtomentellous on veins, the base prominently trinervate; petioles slender, 1-2 cm long. Inflorescence pyramidal, the branches compact, rather spicate, the ultimate branches 1-3 mm long, densely puberulous. Heads 4-6 mm high with 10-15 florets; involucral bracts ca. 15, sometimes purple tinged, eximbricate, mostly subequal, in 2-3 series, narrowly oblong or lanceolate, the apex narrowly acute, the outer surface minutely puberulous and glandular- punctate, a few outer bracts more densely puberulous, the inner bracts persistent; corolla white, 2-3 mm long, with scattered capitate glands, many glands on outer surface of lobes. Achenes 2-3 mm long with many bristles on sides and ribs, the base narrow with a small short tapering carpopodium; pappus of ca. 30 slender scarcely contiguous bristles.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 1876
