        usage:
          title: Gonolobus edulis Hemsl., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Herbaceous or subligneous vines; stems pilose when young, becoming glabrate with age. Leaves lanceolate to narrowly ovate, long acuminate apically, deeply cordate basally, puberulent on both surfaces, mostly 4-9 cm long and 2-4 cm wide; petioles pilose, 2-4 cm long. Inflorescences racemiform, mostly 5-10- flowered, puberulent and sparsely pilose; peduncles 1-4 cm long; pedicels 2-3 cm long. Flowers with the calyx pubescent outside, glabrous within, the lobes lanceolate, 5-8 mm long and 4-6 mm wide; corolla rotate, green, 1.7-2.7 cm in diameter, puberulent outside, barbellate within, especially at the base of the lobes, the lobes lanceolate-ovate to ovate, 7-10 mm long and 4-6 mm wide, the faucal annulus a low 5-angled ridge of tissue, ciliate but the cilia hidden by the barbellate hairs of the corolla limb; corona fleshy, thin, 5-lobed, the lobes smooth, apically rounded to broadly angular; the anther appendages when expanded are rounded apically, drying to truncate, ca. 0.9 mm long and 1.5 mm wide; gyno- stegium pentagonal; stigma head slightly depressed. Follicles said to be fusiform, smooth with S longitudinal wings, 10-12 cm long, 5 cm in diameter.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 1290
