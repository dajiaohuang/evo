  claims:
    - subjectId: taxon:ankylosaurus
      claimKind: scientific
      claimType: taxonomy
      statement: Ankylosaurus is bounded here by Carpenter’s redescription of referred Upper Cretaceous western North American material; the revised diagnosis does not make every isolated ankylosaurid remain part of the genus or define exact global endpoints.
      confidence: high
      confidenceRationale: The study directly compares the type and referred specimens and states a revised diagnosis and distribution. High confidence is restricted to accepted material.
      referenceLinks:
        - referenceId: carpenter-2004-ankylosaurus-redescription
          relation: supports
          pages: 961–986
          figure: Figures 1–19; Tables 1–3
          quoteLocator: Holotype and referred material; revised diagnosis; stratigraphic and geographic occurrence
    - subjectId: taxon:ankylosaurus
      claimKind: scientific
      claimType: fossil-range
      statement: Ankylosaurus is displayed at 72.1–66 Ma only as the stratigraphic coverage of the redescribed type and referred material, not a global genus FAD or LAD. The interval is a source-bounded sample window, not a global FAD, LAD, divergence date, continuous occupancy claim or direct-ancestor assertion.
      confidence: medium
      confidenceRationale: Ankylosaurus uses Carpenter, K. (2004) because the cited pages and locator expose the sampled taxon, specimen or living sequence set. Confidence is medium and applies only to Upper Cretaceous Western Interior material reviewed by Carpenter; broader endpoints remain unclaimed.
      referenceLinks:
        - relation: supports
          referenceId: carpenter-2004-ankylosaurus-redescription
          pages: 961–986
          figure: Figures 1–19; Tables 1–3
          quoteLocator: Holotype and referred material; revised diagnosis; stratigraphic and geographic occurrence
        - relation: contextualizes
          referenceId: ics-2026-06
          pages: International Chronostratigraphic Chart v2026/06
          figure: Global chronostratigraphic scale
          quoteLocator: Numerical boundaries for named geological stages used to bound the source sample
    - subjectId: taxon:ankylosaurus
      claimType: morphology
      claimKind: scientific
      statement: Carpenter's redescription documents a long, low skull with prominent cranial horns, a large cervical half-ring and a large, low tail club in the type and referred Ankylosaurus material; the claim is limited to those specimens.
      confidence: high
      confidenceRationale: These are specimen-based anatomical observations illustrated and tabulated in the redescription, without extending them to every isolated ankylosaurid remain.
      referenceLinks:
        - referenceId: carpenter-2004-ankylosaurus-redescription
          relation: supports
          pages: 961–986
          figure: Figures 1–19; Tables 1–3
          quoteLocator: Redescription and revised diagnosis; armor and tail-club description
    - subjectId: taxon:ankylosaurus
      claimType: biogeography
      claimKind: scientific
      statement: This profile is geographically limited to the type and referred Upper Cretaceous Western Interior material from the Hell Creek, Lance and Scollard formations in Montana, Wyoming and Alberta; it does not claim a complete genus range.
      confidence: high
      confidenceRationale: The redescription lists the sampled material and formations directly; a complete geographic range cannot be inferred from that bounded sample.
      referenceLinks:
        - referenceId: carpenter-2004-ankylosaurus-redescription
          relation: supports
          pages: 961–986
          figure: Figures 1–19; Tables 1–3
          quoteLocator: Holotype and referred material; stratigraphic and geographic occurrence
    - subjectId: taxon:ankylosaurus
      claimType: ecology
      claimKind: scientific
      statement: Carpenter's anatomical redescription does not directly establish diet, habitat preference, locomotion, body size or ecological guild for Ankylosaurus; those profile fields are explicitly withheld.
      confidence: high
      confidenceRationale: The primary evidence is a taxonomic and anatomical redescription, not direct observation or testing of the listed ecological attributes.
      referenceLinks:
        - referenceId: carpenter-2004-ankylosaurus-redescription
          relation: supports
          pages: 961–986
          figure: Figures 1–19; Tables 1–3
          quoteLocator: Scope of redescription, revised diagnosis and specimen inventory
  claim-rationales.zh:
    - 研究直接比较模式与归入标本，并给出修订诊断和分布。高置信度仅限被接受材料。
    - Ankylosaurus 采用 Carpenter, K.（2004）的论文，因为所引页码与定位符直接标示了研究采样的类群、标本或现生序列集合。中等置信度仅适用于 Upper Cretaceous Western Interior material reviewed by Carpenter；更宽泛端点保持未声明。
    - 这些是论文插图和表格所记录的标本解剖观察，不能外推至每一件孤立的甲龙类遗骸。
    - 重描述直接列出了采样材料和地层；完整地理范围不能由该受限样本推断。
    - 一手证据是分类和解剖重描述，而不是对所列生态属性的直接观察或检验。
  claim-statements.zh:
    - Ankylosaurus 仅以 72.1–66 Ma 展示为重描述的正模与归入材料的地层覆盖，而非该属全球首现或末现。该区间是来源限定的样本窗口，不是全球首现、末现、分化日期、连续占据或直接祖先断言。
