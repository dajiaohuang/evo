          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Small trees to about 10 m. tall, with rather slender and scarcely flexuose hispidulous to glabrate branches. Leaves oblong-elliptic, subcaudate, acuminate to abruptly subcuspidate at the tip, the base broadly obtuse to rounded, usually more or less conspicuously undulate-serrate toward the tip, infrequently subentire, 8-28 cm. long, 3-9 cm. broad, rather inconspicuously appressed-puberulent beneath to nearly glabrous, the petiole about 5 mm. long; stipules lanceolate, 5-10 mm. long. Staminate heads about 5 mm. in diameter, sessile or subsessile. Pistillate heads usually with about 5-10 flowers about 5 mm. in diameter, the peduncle rather slender, 3-5 mm. long, fruiting heads subsessile, about 1 cm. in diameter, the achenes to about 1 cm. long.
