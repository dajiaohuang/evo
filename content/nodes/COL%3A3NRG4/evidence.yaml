    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Dwarf, rigid shrublet, 100-300 mm tall, woody at base. Leaves in whorls of 6 or 7 along stem, terete, succulent, glaucous, stipules of basal leaves with a knobshaped to falcate projection on upper margin, those adnate to stem leaves without projections. Flowers 3 or 4(-6) in umbels on slender peduncles, pedicels smooth, spreading or deflexed on fading, sepals white to pink, stamens 20-30.
            sourceIds:
