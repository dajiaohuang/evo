          title: Physalis minuta Griggs, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Erect or spreading herb, glabrate to the naked eye but mostly evenly covered with minute, stiff, perhaps glandular hairs. Leaves small, ovate or elliptic, mostly less than 2 cm long, apically acute or obtuse and basally obtuse, the margin serrate; petioles sometimes longer than the leaves. Flowers inconspicuous on short, filiform pedicels 3-10 nm-1 long and puberulent with minute antrorse hairs; calyx 2-4 mm long, ca. 1.5 mm across, evenly fine-puberulent, the lobes 1 mm wide at the base and 1-2 mm long; corolla 4-8 mm long, with or without markings in the eye; the filaments stout and unequal; the anthers blue or yellow, 1.3-2.5 mm long, curling somewhat on drying. Fruit on slender pedicels, 4-10 mm long, the fruiting calyx 15-18 mm long, 5-angled, minutely puberulent, the berry ca. 7 mm across.
          originalLanguage: en
          sourceField: general
