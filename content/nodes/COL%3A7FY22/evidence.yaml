        claims:
          - text: Perennial herb, up to 200 mm tall. Leaf blades persistent, slowly and irregularly disintegrating with age. Stigmas shorter than style base. Flowers pinkish white.
            textZh: Xerophyta schlechteri (Baker) N.L.Menezes 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_11118_0
            locator: "SANBI/WFO archive Morphology row 3955; source identifier 11118.0; cited publication: Herman, PPJ; Retief, E. 1997. Plants of the northern provinces of South Africa: Keys and diagnostic characters. Strelitzia 6: 1 - 681. National Botanical Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Amphistomatic, dorsiventral with (2-)3-(4) layers of palisade cells; upper surface slightly undulated, lower surface with deep and narrow furrows widening into oval area; epidermis with thickened walls, strong beneath lateral vascular bundles, and in furrows with coronulate papillae; stomata mainly restricted to inner parts of furrows, but a few found also on adaxial surface; hypodermis cells small, slightly thickened; rectangular crystals in palisade cells and cubical crystals in small cells next to bundle sheath.
            textZh: SANBI 条目提供了 Xerophyta schlechteri (Baker) N.L.Menezes 的鉴别特征。
