            locator: "SANBI/WFO archive Diagnostic row 74970; source 1514.0; publication: Burtt, BL; Hilliard, OM. 1986. Notes on some plants of southern Africa chiefly from Natal: XIII. Notes Roy. Bot. Gard. Edinburgh 43(3): 345 - 405. [CC BY-SA]"
