    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Perennial herb, up to 0.75 m high, glandular hairy. Leaves opposite, lamina 20-45 x 10-20 mrn, broadly lanceolate to ovate, margin coarsely dentate. Calyx lobes linear to narrowly elliptic, posticous calyx lobes mostly 3.0-3.5 mm long at anthesis. Flowers often clustered, white, pink or light violet, palate yellow.
            sourceIds:
              - sanbi_11118_0
            locator: "SANBI/WFO archive Morphology row 2821; source 11118.0; publication: Herman, PPJ; Retief, E. 1997. Plants of the northern provinces of South Africa: Keys and diagnostic characters. Strelitzia 6: 1 - 681. National Botanical Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Nemesia rupicola has hitherto been confused with both N. melissifolia and the plant now described as N. silvatica, but it differs from N. silvatica in particular by a number of characters in addition to the lack of bosses at the entrance to the shorter spur. The inflorescence never becomes flagelliform in N. rupicola, as it does in N. silvatica, the inflorescence bracts are mostly larger and leafier, and the flowers are often clustered; those of N. silvatica are always white, whereas in N. rupicola they may be white, pink or light violet and the palate is yellow (white or only faintly tinged yellow inside in N. silvatica)', posticous calyx lobes mostly 3-3.5 mm long at anthesis (not 2-2.5 mm).
            textZh: SANBI 条目提供了该种的鉴别特征。
            sourceIds:
