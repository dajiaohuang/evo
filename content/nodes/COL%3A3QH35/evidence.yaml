        usage:
          title: Ixora finlaysoniana Wall. ex G.Don, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrubs or trees, to 4.5 m tall, the twigs terete, smooth, glabrous, ultimately angular, the pith porate, the nodes 1.5-5.0 cm apart. Leaves narrowly obovate to oblong, occasionally subfalcate, 7-18 cm long, 2.5-6.5 cm wide, obtuse to cuneate at the apex, occasionally rounded, basally cuneate, often attenuate acute, the costa prominulous or immersed above, subprominent beneath, especially proximally, the lateral veins ca. 9, arcuate, thinly coriaceous, concolorous, gla- brous; petioles to 2 cm long, 0.10-0.22 cm wide; stipules free or occasionally connate, oblong or hemispherical, 0.4-0.7 mm long, with 1-2 subulate awns long- er than the body, arising from 1-3 scarcely elevated longitudinal ridges on the body. Inflorescences terminal, capitate, to 4.5 cm long, ca. 9 cm wide, rounded. Flowers glabrous; hypanthium short, the calycine cup ca. 0.5 mm long, eglan- dular, the calycine lobes foliaceous, widely elliptic, to 3.5 mm long, to 2 mm wide, acute, thickly petaloid; corolla white, the tube narrowly cylindrical, to 32 mm long, 1 mm wide, petaloid, the lobes 4, spreading or reflexed, oblong, 8 mm long, to 3 mm wide; stamens 5, exserted, the anthers linear ovate, 1.8 mm long, acuminate at the apex, sagittate at the base, the filaments short, attached at the mouth; ovarian disc doughnut shaped, compressed, the style linear, as long as the corolla tube, the stigmas narrowly oblong, to 2 mm long. Fruits not seen.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 11103
          archiveSourceId: 76182765-56D2-45DA-943D-FAF5130F8CC9
