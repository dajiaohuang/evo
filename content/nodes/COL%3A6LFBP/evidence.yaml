    facets:
      morphology:
        status: partially-supported
        claims:
          - text: "Plants caulescent, up to 200 mm high, about 50-70 mm diam., proliferous from the base and forming clusters. Leaves about 60, ascending, incurved, firm, coriaceous, up to 45 mm long, up to 21 mm broad, about 10 mm thick below the middle, ovate to lanceolate, acute to acuminate, reddish-brown or greenish-yellow; upper surface flat to convex, smooth, with a concolorous longitudinal middle line; lower surface rounded, with 6 to 16 vertical rows of slightly raised greenish to white tubercles, often smooth, keeled in the upper half. Inflorescence about 28 cm tall; peduncle about 13 cm long, simple, terete, up to 1.15 mm diam., bracteate; sterile bracts membranous, erect, keeled; raceme sub-lax flowered, with about 15 spirally arranged flowers and buds, 2 to 3 open simultaneously; floral bracts membranous, up to 3 mm long, deltoid, acute, keeled with broad dark brown or reddish-brown veins, clasping the pedicels, (longer than the pedicels); pedicels 2.5 mm long, 1 mm diam., light brown, erect; perianth white with green keels to the segments, 17 mm long, compressed at base, funnel-shaped; tube more or less 4 mm across, constricted to 3 mm above; segments not free to the base, limb 2 lipped, posterior segments very slightly recurved, white with green veins, spreading; exterior part recurved, spreading, with pale green veins; stamens 6 of two lengths 6 mm and 7 mm long, inserted within the perianth tube; ovary 3 mm long, barely 2 mm diam.; style 1.25 mm long, straight, capitate. Flowering: November through December, or occasionally into January."
