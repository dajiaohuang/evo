      ecology:
        status: partially-supported
        claims:
          - text: It grows on steep grassed slopes or rocky outcrops, in exposed positions, but it is sometimes found in open Acacia Savannah, growing in close association with Aloe. It occurs at altitudes of between 800 and 1000 m. The annual rainfall over its distribution area varies from about 500 to 700 mm, with the heaviest falls occurring during the summer months. The summers are hot and the winters cold, often with frost. H. coarctata prefers a firm hard soil with pH 6.6.
