    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Tufted perennial to 900 mm high, erect to geniculate; rhizome long; culm much branched. Leaf blade to 120 x to 2 mm. Spikelet 18-25 mm long (including awns); lower glume longer than upper glume, long tapering to an acuminate apex (this often breaks very early, giving a false idea of the length), no awn or mucro present; lemma without articulation, but a beak or short, twisted column present; awns three, two laterals shorter than central; callus apex naked, rounded to truncate; anther 1.9-3.2 mm long.
            textZh: Aristida monticola Henrard 的 SANBI 物种条目记录了形态特征。
            sourceIds:
