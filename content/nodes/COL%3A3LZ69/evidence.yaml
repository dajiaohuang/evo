          - text: "Caule: bulbo(s) subterrâneo(s); rizoma(s) ausente(s). Folha: forma lorifoliada(s); ápice(s) da folha(s) obtuso(s). Inflorescência: número de flor(es) 2 à 4. Flor: forma do perigônio infundibuliforme(s); cor do ápice(s) das tépala(s) branco/branco a(s) creme/branco esverdeado/tesselado(s) de vermelho/tesselado(s) de rosa escuro; cor da base das tépala(s) branca amarelada/verde claro a(s) amarelada/vinácea/difuso(s) pela(s) base; compr. do tubo do hipanto longo(s) 6.5 a(s) maior(es) que 12 cm compr.; tamanho das sépala(s) pouco mais larg. as pétala(s); forma das sépala(s) oboval(ais)/estreitamente oboval(ais)/largamente elíptica(s); sépala(s) lateral(ais) inferior(es) pouco diferente(s) da sépala(s) superior(es); forma das pétala(s) estreitamente elíptica(s)/estreitamente oboval(ais); pétala(s) inferior(es) pouco menor que as superior(es); corona ausente(s); filete(s) fasciculado(s)/menor que compr. das sépala(s) e pétala(s); cor das antera(s) amarela ou creme; estigma(s) capitado(s) com lobo(s) triangular(es)/trilobado(s). Fruto: cor das cápsula(s) castanha internamente. Semente: número e forma numerosa(s) discoide(s) achatada(s)."
