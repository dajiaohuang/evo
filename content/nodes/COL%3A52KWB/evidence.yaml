        usage:
          title: Stigmaphyllon lindenianum A.Juss., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Liana; moderately pubescent throughout with small, appressed, T-shaped tri- chomes, these sparse between the veins on the upper leaf surface. Leaves op- posite or subopposite, ovate to suborbicular, obtuse to broadly acuminate, cor- date or truncate to abruptly acute at the base, 5-16 cm long, 4-11 cm wide, entire to variably irregularly toothed, with a few marginal glands, deeply lobed when juvenile, bicolorous, palmately veined at the base, drying dark, the upper surface glabrous or nearly so, the lower surface diluted-sericeous with appressed T- shaped trichomes (type A) and fewer, scattered, stalked trichomes (type B), the free ends straight, acicular; petioles 1-5 cm long, with 2 sessile lateral glands at apex. Inflorescence usually consisting of several pseudo-umbels, often 1 sessile umbel at each node of the inflorescence with the ultimate branches bearing 2 pedunculate umbels; pedicels pedunculate, short or to 6 mm long; peduncles 2- 5 mm long, with 2 small bracteoles at the apex. Flowers 5-parted; sepals acute to acuminate, appressed-pubescent, held inward at the apex, each bearing 2 thick glands ca. 2 mm long; petals yellow, soon falling, rounded at the apex, narrowed to a claw at the base, ca. 8 mm long, the margin revolute and irregularly dentic- ulate; petal opposite the glandless sepal with a thickened claw, the blade some- times marked with orange at base, held erect; lateral petals with the lower margin upturned and cupulate; stamens unequal, 2 or 3 elongating into hoods of styles, the anthers dehiscing inward, the connective much thickened; styles 3, to 4 mm long, petaloid and hooded at the apex, divergent. Schizocarp of 3 samaras, often becoming reddish, appressed-pubescent, especially on seminiferous area, the wing dorsal, 3-4 cm long, ca. 5 mm wide at base, broadened to ca. 9 mm near apex.
          originalLanguage: en
          sourceField: general
