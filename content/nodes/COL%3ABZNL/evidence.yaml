    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Tufted perennial; old basal leaf sheaths usually with veins, 0.3-1.1 mm wide. Leaf blade 1-12 mm wide; ligule a fringed membrane or a fringe of hairs. Inflorescence digitate or subdigitate; racemes secund; spikelets 2- or 3-nate, unequally pedicelled, tightly packed and dark-coloured or loosely arranged and light-coloured. Spikelet 5-8 mm long, dorsiventrally compressed; glumes unequal; lower glume shorter than spikelet, pubescent, 3-5-nerved, usually awnless; upper glume equalling lemma, 5-nerved, hairy on margins. Florets 2; lower floret male or sterile, lemma resembling upper glume but not hairy, indurated, 3-5-nerved; palea shorter than lemma, deeply 2-lobed with marginal flaps, awnless; upper floret bisexual, lemma similar in texture to glumes, membranous to chartaceous, margins flat and exposed on palea, covering most of palea, 5-nerved, awned or mucronate; awn 1.5-3.0 mm long, straight. Flowering time Sept.-Mar.
