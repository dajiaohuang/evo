          title: Inga ruiziana G.Don, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Tree to 20 or more m., the branchlets conspicuously lenticellate and fer- ruginous-puberulent towards the tip. Leaves large, even-pinnate, generally 12- foliolate; petioles 1-2 cm. long, terete or nearly so, ferruginous-puberulent, swollen basally; rachis about 15 cm. long, like the petiole except margined laterally above, bearing disc-like, sessile, generally depressed glands 1-2 mm. in diameter between insertion of the petiolules; leaflets usually 6 pairs, mostly elliptic, the uppermost often obovate-elliptic and up to 25 cm. long and 8 cm. broad, the lowermost usually only 1/3 or I/4 this size and somewhat ovate, short-acuminate apically, obtuse and somewhat inequilateral basally, the veins prominently reticulate and puberulent below, lightly indented above, the leaflet subglabrous and drying darker above; stipules caducous. Inflorescence terminal and subterminal, tomentulose, of 2-3 pedunculate spikes fasciculate from each of several nodes or axils, the spikes 3-4 cm. long, the floriferous portion ovate and about 1 cm. long. Flowers con- gested, white, subsessile; calyx subturbinate, 3-4 mm. long, contracted gradually baseward, densely puberulent; corolla 7-8 mm. long, strigose-puberulent; stamens many; filaments almost 2 cm. long, united below for at least half their length, the tube slightly exceeding the corolla; anthers minute. Legume reported 10-15 cm. long and 2-2.5 cm. wide, flat, rounded apically and basally, somewhat pubescent, the margins elevated.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 5023
