    facets:
      morphology:
        status: partially-supported
        claims:
          - text: "Much-branched woody shrub usually about 2 m high (one specimen reaching 5 m). Similar to R. erosa from which it differs as follows: less bushy habit; leaves with a longer petiole, widely lanceolate leaflets and rarely a 4th leaflet; margins only toothed in upper 2, 3 of lamina, latter neither parted nor divided, base cuneate, apex mucronate, teeth mucronulate; male flowers often with a smaller 6th petal. Petiole (13-)19(-29) mm long; terminal leaflets (26-)41(-59) x (3-)10(-23) mm, lateral leaflets (17-)29 (-47) x (3-)8(-21) mm. Drupe 4.8 x 4.3 to 4.5 x 4.3 mm."
            sourceIds:
              - sanbi_9808_0
            locator: "SANBI/WFO archive Morphology row 50124; source 9808.0; publication: Moffett, RO. 1993. Rhus, Fl. S. Africa 19(3,1): 1 - 123. National Botanical Institute, Pretoria. [http://www.biodiversitylibrary.org/item/209553#page/1/mode/1up]. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Specimens of R. bolusii are mostly solitary when collected, indicating that they might be natural hybrids of the sympatric R. erosa and R. dentata. Morphological deviations include a small sixth petal in some male flowers and fourth leaflets in one specimen. More detailed work is required to ascertain whether this species should be regarded as R. x bolusii. For the present I am retaining it as a species as it is often fertile and in at least two localities has been recorded as quite plentiful. Without its globoid fruit, larger specimens of this species may be confused with R. leptodictya.
            textZh: SANBI 条目提供了该种的鉴别特征。
