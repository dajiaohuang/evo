        usage:
          title: Bursera tomentosa (Jacq.) Triana & Planch., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Small trees, 5-10 m high; bark on the branches red, glabrate; branchlets tomentose, yellowish. Leaves odd-pinnate, grayish- or yellowish-tomentose, be- coming less so with age, 5-20 cm long; petioles not winged, 10-44 mm long; leaflets (5-) 7-11, elliptic to ovate elliptic or lanceolate-elliptic, slightly in- equilateral, the laterals rounded to acute apically and obtuse basally, the termin- als acute apically and basally, coriaceous, the margins crenate, tomentose and lighter beneath, less pubescent above with shorter trichomes, 27-62 mm long and 14-25 mm wide, the middle pairs usually largest, sessile or with petiolules to 1 mm long; rachis winged, the wing elliptic to oblanceolate, to 9 mm wide. Inflorescences tomentose, the staminate 1 cm long, the carpellate 2-6.5 cm long in fruit. Flowers 4-merous, with tomentose pedicels 3-6 mm long; staminate flowers with the sepals 4, connate basally, ovate, tomentose, ca. 1 mm long, the petals 4, ovate, pubescent, 1.5 mm long and less than 1 mm wide, thickened slightly and incurved apically, the stamens 8, the filaments less than 1 mm long, those opposite the sepals longer, the disc 8-lobed; carpellate flowers with the sepals 4, acute, 2-3 mm long, persistent in fruit, the stamens often persistent in fruit, the stigma 2-lobed, persistent in fruit. Fruits obovoid, glabrous, green, ma- turing copper-red and drying brown, 7-8 mm long and 5-7 mm in diameter, dehiscing by 2 valves; pyrenes 1, 1-seeded, bony, whitish, ovoid, convex, 6-8.5 mm long and 5-8 mm wide; seed coat black.
          originalLanguage: en
          sourceField: general
