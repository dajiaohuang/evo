        claims:
          - text: Acaulescent succulent. Leaves distichous or multifarious, withdrawn to ground-level, grey-green, truncate, windowed, spineless, rarely piliferous. Flowers white.
            textZh: Haworthia truncata Schönland 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13856_0
            locator: "SANBI/WFO archive Morphology row 9102; source identifier 13856.0; cited publication: Bayer, B. 2012. Asphodelaceae: Haworthia Duval. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 75 - 77. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: It is a very distinctive and interesting species, as it is the only Haworthia presently known to have a bifarious arrangement of leaves, growing well submerged with only a very small portion of the upper rugose part of the leaves exposed. There is a strong cuticle, especially thick in the upper third covering the whole leaf. To a certain extent the small tubercles in the upper truncate portion impede the light entering the leaf. The greater part of the interior is occupied by a thin-walled, transparent water storing tissue. The roots are contractile, and draw the plant gradually into the ground as the stem elongates at the top, while the older part dies off, so further protecting the plant from the desiccating sun.
            textZh: SANBI 条目提供了 Haworthia truncata Schönland 的鉴别特征。
            sourceIds:
              - sanbi_11888_0
            locator: "SANBI/WFO archive Diagnostic row 66170; source identifier 11888.0; cited publication: Scott, CL. 1985. The genus Haworthia (Liliaceae): a taxonomic revision. Aloe Books, Johannesburg. [All rights reserved]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
