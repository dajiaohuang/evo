          originalSourceText: Sprawling, ascendant, somewhat suffrutescent herbs; stems to 1 m long and minutely puberulent, glabrate below. Principal leaves with blades ovate, mostly (4-)6-11.8 cm long, 2.5-4(-7.5) cm wide, usually 1.5-2 times as long as wide, apically acute to abruptly short-acuminate, basally rounded or somewhat taper- ing, marginally sharply and irregularly 1-2 times serrate with 2-4 larger teeth per cm, each of these with 1-4 smaller teeth, minutely puberulent on the veins beneath and to a lesser extent on the principal veins above, shiny and glistening green above and beneath; petioles 1.2-3 cm long. Flowers solitary in the axils of the upper leaves, 5-6.5 cm long; pedicels ascending, later widely spreading, puberulent, 4.5-9.5 cm long (in fruit), bearing 2 filiform basal bracteoles 1-2.5
