          originalSourceText: mm long; hypanthium in anthesis turbinate to campanulate, puberulent, basally acute; calyx lobe-s linear-attenuate, puberulent, entire to indistinctly toothed, (4-)7-9(-12) mm long, erect or apically slightly spreading, light green; corolla bright red or scarlet, the lobes sometimes paler, roseate to pinkish externally, white internally, externally puberulent or minutely spiculate, internally glabrous, the tube (3.6-)4-4.8 cm long, slightly arching, narrowest just above base where 3-4 mm in diameter, gradually enlarging above to 7-10(-13) mm in diameter and somewhat constricted again towards the apex, the lobes acute with the 2 upper lobes elliptic to oblong, 4.5-9 mm long, the 2 lateral lobes asymmetrically triangular, 5-7 mm long, the ventral lobe 6-10 mm long; filament tube glabrous, white, (35-)40-43 mm long, not exserted from the corolla tube, the anthers 6-7.5 mm long, the 2 shorter anthers apically and bristly white-tufted with dense tri- chomes 0.5-1 mm long, the other 3 anthers sparingly to moderately pilose apically with trichomes 0.5-1.5 mm long. Berries globose to broadly ellipsoid, mostly 1.5- 2.5 cm long, 1.2-2.0 cm in diameter, white; seeds light brown, lenticular, nearly orbicular, foveate-reticulate, 0.4-0.5 mm in diameter.
