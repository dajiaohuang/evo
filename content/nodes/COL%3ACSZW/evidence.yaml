          title: Ammannia coccinea Rottb., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Erect slender herbs to 4 dm. tall, glabrous throughout, the stems angular. Leaves sessile, narrowly oblong, acute at the apex, auriculate-amplexicaul at the base, 1.5- 6.5 cm. long, 0.2-1.3 cm. wide, the veins obscure. Inflorescence spiciform, leafy- bracted, the flowers in subsessile 1- to 3-flowered minutely bracteate cymes. Hy- panthium urceolate, exappendiculate, becoming globose in fruit, 2.5-3.5 mm. long, about 2 mm. broad at the orifice, the calyx lobes generally unequal. Petals as many as calyx lobes, about 1.5- mm. long, 1.25 mm. wide, violet. Stamens exserted, the filaments glabrous, the anthers about 0.5 mm. long. Ovary ovoid, about 1.5-2.5 mm. long, 1.5 mm. in diameter, glabrous; style 1.5-2.5 mm. long.
