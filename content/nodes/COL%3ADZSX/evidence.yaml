            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: The leaf colouration, the uneven coloured venation, the sharp points of the bilobed leaf apices, and the salmon-pink flower colour make this species unique in southern Africa. The southern African material has shorter spurs (14-15 vs. 20-25 mm long) and marginally smaller flowers than the East African collections.
