    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants slender; stems to 250 mm long, slender, 2-3 mm in diameter; leaf sheaths laterally compressed, c. 10 mm long, blades flat, linear-lorate, ensiform, very unequally and acutely bilobed, dull green, often suffused with yellow-bronze, 50-60 x 5-8 mm. Inflorescences opposite leaves, with 1-4 flowers; peduncle slender; bracts papery, 3 mm long. Flowers pinkish-beige. Sepals equal, somewhat reflexed, lanceolate, acute, 6.5-10 x 2.5-3 mm. Petals like the sepals. Lip narrowly ovate, acute, apiculate, deeply concave with the margins and apiculus reflexed, 7x3 mm; spur 14-15 mm long, clavate, funnel-shaped at the entrance. Gynostemium stout, 1 mm tall.
            textZh: Angraecum cultriforme Summerh. 的 SANBI 物种条目记录了形态特征。
