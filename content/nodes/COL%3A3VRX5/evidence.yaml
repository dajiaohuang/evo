        usage:
          title: Lobelia longicaulis Brandegee, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Perennial herbs; caudex short, woody; stems ascendant to decumbent, spar- ingly chaffy-pubescent, 15-50 cm long. Principal cauline leaves with blades ovate to broadly lanceolate or elliptic, apically acute or short-acuminate, basally rounded to more typically cuneate, marginally coarsely and irregularly serrate, with 2-5 teeth per cm, sparingly chaffy-pubescent, especially on the principal veins, 2.5-8 cm long, (0.5-)1.0-4.2 cm wide, 2-6(-9) times as long as wide, nearly sessile or on narrowly winged petioles to 1 cm long. Flowers few -25, solitary in the axils of the upper leaves or bracts; pedicels glabrous or minutely prickly to sparsely chaffy-pubescent, ebracteolate, 0.8-2.0(-3.0) cm long; hypanthium conical, often 10-nerved, glabrous to minutely prickly or chaffy-pubescent; calyx lobes linear, entire, stiffly ciliate on both margins and often on the midvein beneath or nearly glabrous, (1.6-)3.0-4.0 mm long; corolla pale lavender to nearly white, glabrous to minutely pubescent externally, the tube 3-4 mm long, nonfenestrate but with a dorsal slit, the 2 upper lobes narrowly linear from a triangular base, 2.0-3.2 mm long, the 3 lower lobes elliptic to oblong, 2-3.5 mm long; filaments pubescent below and usually glabrous above, (2.5-)3.54.5 mm long, connate for about the upper third and adnate to the corolla tube for ca. 0.7 mm, the anther tube 1.0-1.6 mm long, the 2 shorter anthers minutely white-tufted, the 3 longer anthers ex- ternally stiffly and sparingly short-pubescent. Capsules ca. 1/32/3 inferior, 5.5-10 mm long; seeds ellipsoid, smooth, shining.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 3007
          archiveSourceId: B4F0C278-9BD1-4AF9-9E53-2448F2827D57
