        usage:
          title: Adenocalymma apurense (Kunth) Sandwith, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Liana to 10 cm in diameter, the bark smooth, gray, often 4-furrowed; twigs subterete, glabrous to slightly lepidote, usually drying black with whitish lenticels when young; pseudostipules small, pointed, usually ? ovate. Leaves 3-foliolate or 2-foliolate with a tendril or tendril scar; leaflets ovate to elliptic ovate, acute to acuminate, basally rounded, truncate or almost subcordate, 4.5-17 cm long and 2.2-8.8 cm wide, membranaceous to chartaceous, secondary veins 5-7 on a side, the nerve axils beneath with inconspicuous glandular fields, somewhat lepidote, at least beneath, usually puberulous at base of midvein above, drying shiny dark gray or dark olive with a conspicuous narrow cartilaginous margin; tendril sim- ple, 4-13 cm long; petiolules 0.9-4 cm long, petioles 3.2-6.5 cm long, petiole and petiolules flattened above, inconspicuously lepidote, slightly puberulous above at least at base and apex. Inflorescence an axillary raceme, an enclosing deciduous bract ca. 1 cm long and 1 cm wide with conspicuous sunken glands subtending each bud, the rachis and pedicels puberulous. Flowers with the calyx cupular, minutely 5-toothed but bilabiately split for 1-2 mm, 5-8 mm long and 4-6 mm wide, puberulous, usually with plate-shaped glands; corolla bright yellow, 2.5-6.9 cm long and 0.9-1.9 cm wide at the mouth, the base cylindric, 6-7 mm long and 4-5 mm wide above, infundibuliform-campanulate, the tube often bent somewhat anteriorly, 1.8-5.0 cm long, the lobes all ? reflexed, 1.0-2.0 cm long; puberulous outside with simple and thick-stellate trichomes, glandular-lepidote inside on the lobes and sparsely so in the tube, with longer 1-2-celled trichomes at the level of stamen insertion; stamens didynamous, included, the anther thecae slightly di- vergent, slender, 2-3 mm long, the connective with a 1 mm apicule, the longer filaments 1.4-1.7 cm long, the shorter filaments 0.9-1.3 cm long, staminode 4-5 mm long, inserted 4-7 mm from the base of the corolla tube; pistil 2.4-2.5 cm long, ovary cylindric, 3-3.5 mm long and 1.5-2 mm wide, lepidote, the ovules 2-seriate, disc pulvinate, 2 mm long and 3 mm wide. Capsule oblong, rounded at both ends, not compressed, the valves woody and somewhat thickened, the midrib
