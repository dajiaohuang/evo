        claims:
          - text: Cormous geophyte, 18-30 cm, tunics woody, concentric. Leaves linear. Flowers mauve, tepals spreading.
            textZh: Geissorhiza purpurascens Goldblatt 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 6808; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Distinguished by the hard, woody, concentric corm tunics, three narrow leaves, the lower two with thickened margins and main vein, and ciliate edges, and light to dark purple flowers borne on an inclined, flexuose spike. The leaves are ± oblong in cross section with two broad channels on each surface between the margins and main vein. It is perhaps most closely related to G. juncea, but that species has somewhat smaller, white to yellow flowers and terete leaves. Plants from well-drained, stony, south-trending slopes of the Piketberg appear to belong here but are unusual in having broader leaves, up to 5 mm wide, and flowers with a somewhat longer perianth tube, ± 6 mm long, compared to populations to the south and west, which have leaves only 2-3 mm wide and a perianth tube 3-4 mm long.
            textZh: SANBI 条目提供了 Geissorhiza purpurascens Goldblatt 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 94677; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
