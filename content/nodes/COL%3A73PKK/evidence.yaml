    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, 15-60 cm, stem often much branched. Leaves several, linear, channelled. Flowers blue or white, tepals cupped below, style crests vestigial.
            textZh: Moraea polyanthos L.f. 的 SANBI 物种条目记载了植株、叶片和花部形态。
            sourceIds:
              - sanbi_13878_0
            locator: Strelitzia 29; archive Morphology row 7359, source 13878.0
            placeTimeScope: Regional species account published 2012; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
          - text: Recognised by the branched stem bearing two to four foliage leaves, and moderate-sized, blue to blue-mauve, violet or rarely white flowers with style branches as narrow and as long as or slightly longer than the anthers and lacking style crests. The ascending tepal claws diverge slightly to form a relatively narrow cup that includes the filaments and the lower part of the anthers or all of the anthers, and the tepal limbs spread more-or-less horizontally. The filaments are united in a slender, smooth column usually 7-9 mm long. A notable variant of the species from near Albertinia and Herbertsdale in southern Western Cape has slightly smaller, white or pale blue flowers with the filaments only 5-6 mm long, and both filaments and anthers are included in the floral cup whereas the anthers are usually fully excluded from the cup in typical M. polyanthos. The species is closely allied to M. bipartita, which has conventional Moraea-type flowers with broad style branches with prominent crests but the two are identical in vegetative features. Hybrids between these two species have been recorded where they co-occur.
            textZh: SANBI 条目提供了 Moraea polyanthos L.f. 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: Strelitzia 42; archive Diagnostic row 94200, source 18638.0
            placeTimeScope: Regional species account published 2020; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
