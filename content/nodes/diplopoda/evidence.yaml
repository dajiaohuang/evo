      claimType: topology
      statement: Reassessed morphology and modern imaging recover a sampled phylogeny for major millipede lineages. The topology does not itself delimit the fossil range, origin or global first appearance of Diplopoda.
      confidence: medium
      confidenceRationale: Confidence is medium because the cited primary study directly supports the bounded topology statement at the supplied locator. The confidence does not extend beyond the topology does not itself delimit the fossil range, origin or global first appearance of Diplopoda.
      referenceLinks:
        - relation: supports
          referenceId: blanke-wesener-2014-diplopoda
          pages: 63–75
          figure: Figures 1–8; supplementary character matrix
          quoteLocator: Imaging and character reassessment; phylogenetic analysis
    - subjectId: taxon:diplopoda
      claimType: fossil-range
      claimKind: scientific
      statement: The Diplopoda display uses the 425.5 ± 4.5 Ma Kampecaris age with uncertainty stored separately and does not inflate the error margin into a hard 430 Ma edge.
      confidence: medium
      confidenceRationale: A recent geological synthesis provides the numerical age and uncertainty, while the earlier systematic review rejects less secure pre-Pridoli assignments.
      referenceLinks:
        - referenceId: brookfield-2025-kampecaris-age
          relation: supports
          pages: Article 6
          figure: Geological-age synthesis
          quoteLocator: Abstract and section 1 date Kampecaris obanensis to 425.5 ± 4.5 Ma
        - referenceId: almond-lawson-1985-paleozoic-millipedes
          relation: supports
          pages: 227–237
          figure: Systematic review
          quoteLocator: Pre-Pridoli claims are questionable; reliable Diplopoda occur in the latest Silurian–Lower Devonian
  claim-rationales.zh:
    - 置信度为中：所引主研究在给定页码、图版或章节定位器处直接支持这一受限的拓扑表述；置信度不外推到文中明确排除的全群起源、全球首现、直接祖先或精确端点。
    - 近期地质综述给出数值年龄与误差；更早系统综述排除了可靠性较低的前 Pridoli 归属。
  claim-statements.zh:
    - 重新评估的形态性状与现代成像恢复了主要千足虫谱系的抽样系统树。该拓扑本身不能限定倍足纲的化石延限、起源或全球首现。
    - 倍足纲显示采用 Kampecaris 的 425.5 ± 4.5 Ma 年龄并单独保存不确定度，不把误差扩张成 430 Ma 的硬边界。
