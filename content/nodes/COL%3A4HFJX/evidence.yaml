        usage:
          title: Physalis philadelphica Lam., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Erect, short-lived herb to 80 cm tall; stems weak although sometimes stout, pilose near the base, glabrate above with minute appressed hairs. Leaves to 10 cm long, ovate, apically acuminate, basally obtuse and mostly oblique or dimidi- ate, the margins dentate or repand, thin and sparingly pubescent with short simple hairs; petioles half as long to as long as the blade. Pedicels 3-7 mm long, about equaling the flowering calyces, pilose with spreading hairs. Flowers with the calyx 3-8 mm long, relatively broad, lobed about halfway, the lobes deltoid and sometimes caudate, pubescent with short spreading hairs mostly on the angles; corolla with a contrasting eye, 8-15 mm long, sometimes reflexing open to 18 mm across; filaments slender, perhaps unequal, the anthers purple or blue, twisting after anthesis, 2-3 mm long. Fruits on recurved pedicels 3-10 mm long, fruiting calyces slightly 5-angled and 10-ribbed, 20-50 cm long with some scattered hairs; berry globose, ca. 10 mm long, oily or viscid, fleshy.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 13288
