        usage:
          title: Sesuvium portulacastrum (L.) L., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Herbaceous perennials, glabrous throughout, the branches trailing and often rooting at the nodes, sometimes rather stout. Leaves linear, elliptic or narrowly obovate, 1-5 cm. long, 0.2-1.0 cm. broad, subacute to acute at the apex, gradually tapered to the base; petiole 1-5 mm. long, dilated at the base and clasping the stem but the sheaths not connate. Inflorescence axillary, the flowers solitary, pink; pedicel 2-11 mm. long. Flowers with the perianth tube obconic to subcampanu- late, 1.5-3.0 mm. long, the lobes ovate, 4-7 mm. long, 3.0-4.5 mm. broad, some- what auriculate at the perianth tube orifice, persistent and somewhat reflexed in fruit, appendage horn-like, 1.0-1.5 mm. long; stamens numerous, inserted at the orifice of the perianth tube, free or subconnate, the filaments 1.5-3.5 mm. long, gradually tapering to the apex, the anthers oblong, 0.5-0.75 mm. long, 0.25-0.5 mm. broad; ovary ovoid to subglobose, 3.0-3.5 mm. long, 2.5-3.0 mm. in diameter, the styles 3 or 4, 1.5 3.5 mm. long spreading or erect. Capsule ovoid or obovoid, about 6.5 mm. long, 3 mm. in diameter, circumscissile below the middle; seeds 8-30, lenticular-reniform, about 1.0-1.5 mm. in diameter, the testa smooth, black.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 337
