    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Bulb solitary, deep-seated, subglobose, 25-60 mm diam., covered with several layers of cream-coloured cottony fibrous tunics, extended into a stout neck 100-170 mm long. Leaves absent at anthesis, 2, recurved, lorate, up to 120 x 4-6 mm, plane, glabrous, dark green and flushed with red towards the base; amplexicaul cataphyll remaining subterranean; prophyll unknown. Inflorescence dense, hemispherical to spherical, 70-120 mm across; scape erect to somewhat flexuose, 60-160 mm long, 3-5 mm diam., initially green, breaking off at the base in fruit; spathe valves linear-lanceolate, 20-40 x 3-7 mm; bracteoles up to 25 mm long. Flowers (20-)30-65, spreading, stellate, white to delicate pink with deep pink or greenish median stripes on the undersurface, ageing to light brown, with a heavy coconut-like scent; pedicels straight, 20-50 mm long, becoming straw-coloured. Tepals almost free to the base or very shortly adnate to the staminal tube for up to 0.25 mm, otherwise outspread, oblong-lanceolate, 8-15 x 2-4 mm, with plane edges. Stamens equalling or up to 2 mm longer than the tepals, becoming outspread; filaments connate proximally into a tube protruding (1.0-)1.5-4,0 mm above the perigone throat, subulate above, occasionally shortly toothed in the axils between adjacent filaments; anthers centrifixed, 3 mm long and dark wine-red before opening; pollen cream-coloured. Style up to 15 mm long, narrow throughout, with nectar collecting in a well around the base. Seeds unknown.
