            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Diagnostic features are the deep-seated bulb with a long neck (up to 170 mm); the somewhat spherical inflorescence and the very short perigone tube (0.25 mm or less). Hessea speciosa is most closely allied to H. pilosula and H. incana, with which it shares the very short perigone tube and plane tepals. It is distinguished from these species by its glabrous leaves and the relative length of the stamens to the tepals, The stamens equal or extend up to 2 mm longer than the tepals in H. speciosa, whereas they are distinctly shorter than the tepals (by 3 mm or more) in H. pilosula and H. incana. It is one of the few Hessea species recorded with white flowers. However, flower colour is not constant and pink forms also occur. A further novelty is the occasional presence of small teeth in the axils between adjoining filaments.
