    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, up to 50 mm tall, corm globose, tunics concentric. Leaves 3, lower 2 falcate, uppermost sheathing the stem, sparsely hairy on margins and veins. Flowers 1-3 per spike, bright magenta, tepals spreading, exceeding perianth tube, open mornings, unscented.
            textZh: Hesperantha glabrescens Goldblatt 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_14562_0
            locator: "SANBI/WFO archive Morphology row 33225; source identifier 14562.0; cited publication: Goldblatt, P; Manning, JC. 2013. Iridaceae. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 94 - 124. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Closely related to the widespread Hesperantha pilosa and initially appearing to be a depauperate form of that species, H. glabrescens can be distinguished from its ally in several features. The leaves are sparsely hairy, unlike the fairly densely hairy or even downy leaves of H. pilosa, and the spikes are mostly 1- or rarely 2-flowered, whereas H. pilosa typically has several, sometimes up to 10 flowers per spike. Notable is the small size of the plants, only 30-50 mm high, shorter than recorded in H. pilosa. The flowers are magenta and quite small, with a perianth tube ± 3.5 mm long and tepals ± 8 mm long. Flowers of H. pilosa are always larger, usually white (subsp. pilosa) or blue or rarely deep pink (subsp. bracteolata), with a perianth tube mostly 6-8 mm long and tepals 9-16 mm long. The decision to recognise H. glabrescens was made in part because of the consistently different morphology from H. pilosa and because H. pilosa subsp. bracteolata grew nearby and was always taller, up to 120 mm high, and with 2 to 4 flowers per spike. These plants had plane, densely pilose leaf blades, in contrast to those of H. glabrescens. The flowers of the two species were, however, nearly identical in pigmentation and almost so in size at this site, although they could be distinguished by differences in perianth tube length.
            textZh: SANBI 条目提供了 Hesperantha glabrescens Goldblatt 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 94820; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
