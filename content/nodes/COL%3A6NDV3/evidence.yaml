        usage:
          title: Jatropha integerrima Jacq., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrub ca 2-4 m high; branches and foliage glabrous or sparsely hirsutulous. Leaves entire or often with a pair of small acute lobes below the middle; petioles mostly 3-7 cm long; stipules nearly obsolete, not evident on mature leaves; blades ovate to elliptic, abruptly short-acuminate, palmatinerved with 5(-7) main veins at the rounded or subcordate base, 5-15 cm long, 2.5-8(-13) cm broad. Dichasia terminal or pseudo-axillary, often bisexual; peduncles ca 5-10 cm long; lower bracts lanceolate, mostly 2-5 mm long, entire or obscurely glandular-dentate. Staminate flowers with pedicels mostly 5-8 mm long, articulate near the top; calyx ca 2.5-3.5 mm long, lobed about halfway, the lobes blunt, entire, not imbricate; petals elliptic-obovate, bright red, adaxially hirsute at base (glabrous over most of inner face), 15-22 mm long; disc-segments 5, rounded, reddish, ca 0.5-0.7 mm wide; stamens 10, the filaments ca 5-7 mm long, connate over halfway into a column, the anthers linear to oblong-lanceolate, mostly 2.5-3 mm long; pistillode absent. Pistillate flowers with pedicels becoming 5-9 mm long, glabres- cent; perianth similar to the d; ovary glabrous, the styles ca 2.5 mm long, slender, bifid, the stigmata linear. Capsules subglobose-cylindric (truncate), trisulcate, ca 12-13 mm long and broad; seeds fuscous, mottled with dark specks, slightly com- pressed, 9.6-10 mm long, 5.1-5.8 mm broad, the caruncle bipartite, flabellate-lacini- ate, ca 2 mm long, 3 mm broad.
          originalLanguage: en
          sourceField: general
