          - text: Bulbine muscicola is unifoliate with an occasional short second leaf produced just before flowering and can be distinguished from all other single-leafed species by the terete linear leaf which becomes clavate and truncated late in the season. The leaf epidermis is covered with minute shiny granules. Further interesting characters are the severely reflexed outer whorl of tepals covering the pedicel and the non-decurved, upright and horizontally facing inner tepals. The lowest filament curves backwards to lie within the lower tepals and possesses a larger anther than the other filaments. The seed has papyraceous webbing membranes towards the apical third.
