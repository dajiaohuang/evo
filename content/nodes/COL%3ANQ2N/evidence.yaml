    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants arising from perennial dome-shaped tubers 6-10 mm broad x 3-8 mm high, with several spreading wedge-shaped roots. Leaf erect, translucent light green, linear terete when young becoming broader, lanceolate, 35 x 4 mm, eventually clavate, truncate, late in the season ca. 25 mm x 5 mm broad at truncate apex; occasionally before anthesis a second vestigial, narrowly linear, terete leaf appears, ca. 12 mm long. The leaves wither completely before the flowers open. Flowers hysteranthous, 6-10 in a lax, solitary raceme ca. 40 x 15 mm; peduncle plus inflorescence 60-80 mm, rising from a narrow cylindrical sheath 10-25 mm long x 1-1.5 mm wide, which elongates as the leaf withers; flower bract triangular, 2.5 x 0.8 mm with an acuminate apex, basal portion brown enveloping the pedicel base, pedicel ca. 8 x 0.3 mm. Flower with outer whorl swept immediately backwards towards the pedicel, narrowly ovate, 6 x 2 mm, inner whorl ovate,6 x 3 mm, upper segment vertical with margins folded inwards, laterals horizontal, flat outer surface facing filaments, occasionally with a notch towards apical lower border, all tepals very light greenish yellow with a faint green mid-vein. Filaments slender, bearded, all ca. 5.5 x 0.5 mm, outers with a single cushion of glandular hairs towards the anther, central lowest curved backwards in a u-shape, anther 0.8 mm, situated behind and below inner tepals, rest curved forwards; inner filaments with a double cushion of glandular hairs, anthers 0.5 mm, glandular hairs1.4 mm long with a bulbous apex. Ovary greenish, ovoid, 1 mm in diameter; style slender, projecting slightly beyond anthers, 6 x 0.3 mm; stigma minute rugose. Capsule 3 x 2 mm, brownish-bronze, with almost horizontal pedicel 13 x 0.3mm. Seed narrowly pyramidal, brownish black, overall texture rough, margins wavy, remains of placental attachment prominent, upper third of apex with a broad to narrow papyraceous membrane on either keel, 1.3 x 0.5 x 0.3 mm.
