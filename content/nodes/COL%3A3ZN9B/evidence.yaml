        usage:
          title: Melothria scabra Naudin, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Vines; stems scabrous, short pilose, or glabrate. Leaves cordate, entire, or shallowly 3- to 5-lobate , 3-7(10) cm long, up to as wide as long, the apex acu- minate to caudate, the base cordate, the margin undulate or dentate, minutely and remotely toothed, chartaceous, the upper surface scabrous with white pustu- late based trichomes, short pilose on the veins, the lower surface short pilose, at least on the veins; petioles 2-4 cm long, short pilose, scabrous, or glabrate; tendrils simple, glabrate. Staminate flowers in axillary, long pedunculate ra- cemes, the rachis 2-4 cm long, filiform, short pilose or glabrate, 2- to 7-flowered; pedicels 2-3 mm long; calyx campanulate, the lobes triangular, ca. 1 mm long, short pilose or glabrate; corolla yellow, the lobes ovate oblong, rounded to slightly emarginate, spreading, the outer surface appressed pubescent, the inner surface glabrate; anthers subquadrate, ciliate; pistillode globose, glabrous. Pis- tillate flowers solitary; peduncles 1-3 cm long, glabrate; calyx and corolla as in the staminate flowers; ovary ellipsoid, glabrate, smooth; staminodia minute, an- theriferous. Fruits green with darker green stripes, 2.5-4.0 cm long, 1.5-2.5 cm in diameter, smooth, glabrous, baccate; seeds white sericeous, ovoid, 2-4 mm long, 2.0-2.5 mm wide.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 3760
