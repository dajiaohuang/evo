    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Diffuse, glabrous succulent, up to 300 x 600 mm, stems leafless, obtusely 4-angled, obscurely tuberculate, up to 15 mm diam. Flowers 1-3, opening in succession, in many, sessile groups in grooves of stem, pedicels 2-8 mm long. Corolla rotate, 7-13 mm diam., inside dark maroon, tube absent, lobes spreading, deltoid, 3-5 x 2.5-3 mm. Corona black, outer lobes erect, shallowly bifid, inner adpressed to anthers, with short, dorsal appendage.
            sourceIds:
              - sanbi_14722_0
            locator: "SANBI/WFO archive Morphology row 30938; source 14722.0; publication: Bruyns, PV. 2013. Apocynaceae. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 248 - 264. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Specimens of Q. pruinosa are quite remarkably distinctive in their growth form and they can usually be recognised without flowers. The plant is almost always rooted by the primary stem only, although, unlike in some species with this habit, cuttings are quite easy to root in cultivation. Although initially erect, the stems tend to spread out horizontally after some distance, often all tending to point in a particular direction, giving the plant an odd, ‘windswept’ appearance. This strange growth habit is usually quite obvious in large plants which project from their protective shrub, exposing their upper parts fully to the elements and eventually looking much like old, weathered twigs. It is similar to the growth habit of many species of Rhytidocaulon. Large specimens may be anything between 0.5 m and even 0.75 m in diameter but the branching is relatively sparse and they do not form dense shrubs as do some of the other larger species. Unlike all other species in Namaqualand, Q. pruinosa has relatively slender, 4-angled stems that are rounded and the tubercles are obscure, each tipped by only a small, often nearly obsolete tooth. Young stems are usually very dark, often nearly black (as in Q. linearis) and later tend to become purple-grey with a thick covering of wax. In Q. pruinosa the flowers are fairly small (usually around 10 mm across) and flat and are held slightly away from the stems. They emit a remarkably strong, lemon-like scent for a few hours after they open (usually for less than six hours) but after this passes, they are odourless. On the inside, the background colour of the corolla is usually dark maroon to almost black, although in some specimens this dark colour becomes paler maroon around the base and changes to a ring of white around the corona. In many plants this dark background colour dominates the flower so that they are not very conspicuous against the stems. Their interior is covered (in most cases) with a dense, entangled mat of fine, white, crinkled hairs which, depending on their length and denseness, can lighten the basic colour to grey and sometimes give it the ‘frosted’ appearance that caused Masson to name this species Stapelia pruinosa. This hairiness bears some resemblance also to a dense covering of mildew. Some of these hairs seem to cling to the sides of the corona, which might be slightly sticky, and in so doing they form a spiderweb-like covering of the small space around the gynostegium. The corona is mostly a dull black, contrasting quite strongly with the yellow of the anthers and pollinia and the white style-head. It consists of short outer lobes and inner lobes which just cover the anthers.
