    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Tubers ±0.5 cm in diameter. Leaves submerged, spindle-shaped, slightly flattened, 5-10 cm long, 3.5-4.5 mm wide, base and tip very narrowly tapering. Scapes up to 200 cm long, threadlike, not thickened below the inflorescence. Inflorescence of 1 spike; spike strongly shortened with very densely arranged flowers (resembling a Ranunculus flower), up to ±0.5 cm long, ±2.5 cm in diameter; spathe up to 1.3 cm long, splitting below the equator, base persisting, tip falling early. Flowers facing in all directions on each spike, the lowermost ones sterile. Perianth segments 2 on the lower flowers, 1 or absent at the top of the inflorescence, petal-like, ovate to oblong, 8-10 mm long, 2.5-4.5 mm wide, white, 5-, 7- or 9-veined. Stamens 6 or absent in lowermost flowers; filaments white, widened towards the base; pollen yellow. Follicles 3, 2- or 3-seeded, up to 4 mm long including a short terminal beak. Seeds 1.5-1.75 mm long, with a single coat; germinating embryo ellipsoid; plumule attached near the base.
            textZh: Aponogeton ranunculiflorus Jacot Guill. & Marais 的 SANBI 物种条目记录了形态特征。
