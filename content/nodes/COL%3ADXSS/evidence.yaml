        usage:
          title: Anemopaegma chrysanthum Dugand, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: tenuation at the petiole apex, 9.4-19.5 cm long and 4.7-12.5 cm wide, chartaceous, the secondary veins 4-7 on each side, strongly minute-lepidote beneath, especially in the lower vein axils, usually minutely and inconspicuously scabrous at the base of the main vein above, sometimes beneath, olive when dry, slightly paler be- neath, above shiny and varnished-looking under a lens; tendril usually trifid, 6-13 cm long to branching, the arms 0.1-1.2 cm long; petiolules -+- terete, often twisted, 0.8-3.7 cm long, petiole 2.9-3.9 cm long, somewhat lepidote or minutely subpu- berulous. Inflorescence a 4-8-flowered, ebracteate axillary raceme; rachis and pedicels somewhat glandular-lepidote, glabrous to minutely subpuberulous at the nodes. Flowers with inconspicuous musky odor, calyx cupular, coriaceous, truncate to shallowly 5-lobed, -+- lepidote with plate-shaped glands in the upper part, 5-9 mm long and 5-9 mm wide; corolla uniformly bright yellow, tubular- campanulate, 5.2-7.1 cm long and 1.2-2.2 cm wide at mouth of the tube 4.5-5.8 cm long, the lobes 1.1-1.3 cm long, the lobes glandular-lepidote outside and in, the tube glabrous outside, inside sparsely glandular-lepidote near the mouth and pubescent with simple, several-celled, mostly gland-tipped trichomes at the level of stamen insertion; stamens didynamous, the anther thecae divaricate, 3-4.5 mm long, the longer filaments 2.5-3.2 cm long, shorter filaments 1.9-2.3 cmi long, the staminode 6-15 mm long, inserted 11-13 mm from base of corolla tube; pistil 4.2-4.6 cm long, the ovary flattened-cylindric, 6-7 mm long and 2.5 mm wide, 1.5-2.0 mm thick, lepidote, the ovules 2-seriate in each locule; disc annular-pulvi- nate, 2-2.5 mm long and 6-7 mm wide. Capsule oblong-elliptic, flattened, 14-20 cm long and 7.2-8.3 cm wide, the basal stipe 1-2 cm long, drying tan, glabrous; seeds thin, suborbicular, 4-5.5 cm long and 4-5.5 cm wide, the wing not sharply demarcated, membranaceous, marginally hyaline, basally brown, surrounding the seed body.
          originalLanguage: en
          sourceField: general
