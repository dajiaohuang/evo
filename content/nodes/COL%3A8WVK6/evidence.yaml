    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Perennial, short rhizome to 10-30 mm diameter. Culms 25-200 mm tall, 0.9-1.2 mm thick, but ca. 2.0 mm thick across the rim of the leaf sheath, glabrous. Leaf sheath 7-58 mm long, glabrous, not papery, wine-red, not sticky, lacking ligule. Leaf blade 15-82 mm long and 0.4-1.5 mm wide, glabrous, canaliculate. Involucral bracts 3-5, leaf-like and erect, 5-29 mm long, glabrous. Inflorescence capitate, 5.0-8.0 mm diameter, each with over 10-15 spikelets. Spikelets 2.3-5.5 x 1.0-3.0 mm, terete, dark brown, florets bisexual. Glumes 2.1-5.0 mm long, boat-shaped with a mucro to 0.5 mm long; margins entire. Stamens 3, anthers crested. Style trifid. Nutlets 0.7-2.0 x 0.5-1.5 mm, dark brown, papillose; hypogynous disc to 0.2 mm long, cupular, 6-9-lobed.
            textZh: Ficinia montana Tshiila & Muasya 的 SANBI 物种条目记录了形态特征。
