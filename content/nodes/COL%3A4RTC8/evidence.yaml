      ecology:
        status: partially-supported
        claims:
          - text: On well-drained soils, often described as rocky. Several collections are from shale bands, and the first author has seen the species grow next to renosterveld, where sandstone meets shale, as well as on typical dry TMS soils. The species appears to prefer hot, dry, well-drained localities. Plants appear to be killed by fire, regenerating from seed.
            textZh: 区域植物志记载 Restio cedarbergensis H.P.Linder 的生境为：On well-drained soils, often described as rocky. Several collections are from shale bands, and the first author has seen the species grow next to renosterveld, where sandstone meets shale, as well as on typical dry TMS soils. The species appears to prefer hot, dry, well-drained localities. Plants appear to be killed by fire, regenerating from seed.
