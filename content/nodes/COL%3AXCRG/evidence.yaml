        metadataVariant: 0
        usage:
          title: Columnea pulchra (Wiehler) L.E.Skog, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Epiphytic herbs or subshrubs; stems erect or ascending, to 1 m tall, commonly ca. 50 cm long, 5-10 mm in diam., more slender and often zig-zag toward the apex, the internodes green, pilose with reddish hairs. Leaves unequal in a pair, the larger leaf elliptic to oblanceolate, 6.5-9.8 cm long, 1.5-2.9 cm wide, fleshy, the apex rounded acute, the base cuneate, unequal, the margin nearly entire, above dark green, pilose, below pale green, suffused with pink, long hirsute; petioles 0.5- 1.4 cm long, green or reddish, long pilose; smaller leaves caducous, lanceolate, to 1 cm long. Inflorescences in the upper leaf axils, cymose, few flowered; peduncles short or lacking; bracts small, ca. 3 mm long, lanceolate; pedicels slender, 1.0-1.5 cm long, red, hirsute. Flowers showy; calyx conic at the base, the lobes free nearly to the base, nearly equal, broadly elliptic to oblanceolate, 1.5-2.0 cm long, 0.5-1.0 cm wide, the apex acute, rarely or sparsely serrulate, red or orange red, hirsute; corolla light yellow, unspotted, more or less erect in the calyx, the tube nearly straight, ca. 3.5 cm long, gibbous at the base on the upper side, ca. 3 mm wide above the spur, ca. 5 mm wide at the middle, narrowing slightly at the throat, outside hirsute, inside puberulent, the limb oblique, the lobes equal, ovate, concave, 3-5 mm long, the stamens included, the filaments briefly adnate to the corolla base but connate with each other for ca. 5 mm, each ca. 3.5 cm long, yellow, glabrous, the anthers rotund; disc reduced to a bilobed dorsal gland and minute ventral glands; ovary apex pilose, the style equalling length of the stamens, glabrous, stigma stomatomorphic. Berry (Wiehler) globose ca. 9 mm in diam., white, pilose; seeds oblong, 1.2 mm long, striate.
          originalLanguage: en
