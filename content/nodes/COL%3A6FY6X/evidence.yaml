            locator: "SANBI/WFO archive Morphology row 758; source identifier 13915.0; cited publication: Manning, JC; Goldblatt, P; Linder, HP. 2012. Poaceae: Eragrostis Wolf. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 210 - 211. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Barely distinguishable from E. truncata and a detailed study is needed in this group. Resembles E. annulata, which has glandular hairs with swollen tips and a broadly oblong to broadly ovate caryopsis; and E. barrelieri and E. minor, which have oblong caryopses and narrower spikelets.
