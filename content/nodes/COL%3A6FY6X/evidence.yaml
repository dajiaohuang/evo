        claims:
          - text: Creeping perennial to 10 cm. Leaves linear, basal sheaths densely woolly. Spikelets in a lax panicle, densely clustered on side branches, straw-coloured and pink, 4-8 x 2-4 mm, lowest lemma obtuse, lateral nerves conspicuous.
            textZh: Eragrostis bergiana (Kunth) Trin. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
