        usage:
          title: Justicia crenata (Leonard) Durkee, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrub to 5 m tall; stems terete, glabrous. Leaves elliptic, to 24 cm long, 9.5 cm wide, apically acuminate, basally attenuate, glabrous, numerous cystoliths clearly visible on both surfaces, the margins crenate; petioles to 5 cm long, glabrous. Inflorescences in terminal, loosely spicate panlicles, the spikes to 6 cm long, the internodes of the spikes ca. 5 mm long, the peduncles and the rachises puberulous; bracts elliptic, to 7 mm long, 2 mm wide, sparingly glandular puberulous, apically rounded to acute, soon deciduous; bracteoles similar but smaller. Flowers with 5-merous calyx, the segments linear lanceolate, to 7 mm long, 1.25 mm wide at base, sparingly glandular puberulous, the margins minutely ciliolate; corollas red with yellow tip, to 5 cm long, bilabiate, puberulous glandu- lat, the tube narrow, 3 mm wide at the base narrowing to 2 mm wide above the ovary, 6 mm wide at the mouth, the lips erect, each to 2.5 cm long, 6 mm wide, gradually narrowing from the base to tip, the upper lip apically notched, the lower lip with 3 small lobes at the apex, the lobes each ca. 2 mm long, rounded and hooded at the tip; stamens exserted to the tip of the lobes, the anther cells unequal, each to 2.5 mm long, each basally slightly spurred, the lower cell more so. Capsules (Leonard, 1938) clavate, 1.5 cm long, glabrous or with a few glandular hairs at the tip.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 200
          archiveSourceId: F9EB396F-5223-42CE-B4D2-9D86B0FCAA6A
