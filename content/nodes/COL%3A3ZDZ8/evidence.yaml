    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Shrublet, up to 300 mm tall. Flower stalk short, 4 mm long, shorter than petiole, usually 1-flowered. Epicalyx bracts linear-subulate. Flowers bright yellow.
            sourceIds:
              - sanbi_11118_0
            locator: "SANBI/WFO archive Morphology row 2738; source 11118.0; publication: Herman, PPJ; Retief, E. 1997. Plants of the northern provinces of South Africa: Keys and diagnostic characters. Strelitzia 6: 1 - 681. National Botanical Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: The confusion that existed between this species and M. rehmannii is understandable for, until one has recognized the features that distinguish them, these species look very much alike. The specimen on which Bolus based the greater part of his description of M. griquensis, i.e. Orpen sub Bolus 6015, is a mixed gathering. Four of the portions have the linear-subulate epicalyx bracts as described by Bolus, and the fifth, on the left hand side of the sheet, the ovate bracts of M. rehmannii. The distribution of these two species overlap in the northern Cape and parts of the Transvaal. A further distinguishing feature is that the peduncles in M. virescens are short (usually shorter than the petiole) and suberect and the pedicels, if present, are also short and suberect, whole in M. rehmannii the peduncles are somewhat longer (about as long as or longer than the petiole) and the pedicels, if present, longer, thinner and cernuous. With regard to the distribution, as mentioned above, these species overlap in the northern Cape and the Transvaal, but M. virescens extends further westward in South West Africa. According to collectors’ notes M. virescens is restricted to limy soil, while M. rehmannii is not so restricted and is much more widespread. The specimens added by N. E. Brown to Bolus’s original description of M. griquensis, namely Burchell 2385, Holub s.n. Rehmann 5220 are all M. rehmannii.
            textZh: SANBI 条目提供了该种的鉴别特征。
            sourceIds:
              - sanbi_9351_0
            locator: "SANBI/WFO archive Diagnostic row 66068; source 9351.0; publication: Verdoorn, IC. 1981. Revision of Melhania in southern Africa. Bothalia 13(3 & 4): 263 - 273. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
