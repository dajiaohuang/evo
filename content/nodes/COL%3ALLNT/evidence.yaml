        usage:
          title: Bernardia macrophylla Standl., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrub to 3 m high; dioecious; young stems subterete, pubescent with straight, unbranched, mostly antrorse hairs. Leaves thin; petioles densely pubescent, 5-10 mm long; stipules subulate-lanceolate, (1-) 1.7-2.1 mm long, 0.5-1 mm broad, densely pubescent; blades obovate or oblanceolate, mostly 12-20 cm long, 3.5-7.5 cm broad, with sharp unicellular hairs on both faces, the basal glands usually 2, inconspicuous above, the midrib and veins prominently raised beneath, the pri- mary veins mostly 9-12 on a side, straight, the veinlets at right angles to primaries, the base narrowed, acute, the margins shallowly crenate-dentate, with ca 30-60 teeth per side, the apex acuminate. Inflorescences unisexual; d flowers in con- tracted racemes, 9 flowers in contracted pseudoterminal spiciform racemes. Staminate flowers with calyx splitting into 4 or 5 unequal segments; calyx-lobes lanceolate, 3-veined, sparsely pubescent, 1.6-1.8 mm long, 0.7-1.1 mm broad; disc of minute dark clavate interstaminal processes; stamens 14, the filaments free, 0.9-1 mm long, the anthers ca 0.4 mm broad. P~istillate flowers sessile; calyx-lobes 5, subequal, ovate, acute, 5-veined, 1.6-1.8 mm long, 0.8-1.3 mm broad, densely pubescent outside; disc thin, cupuliform, 0.25-0.35 mm high, nearly glabrous; ovary pubescent, the styles bifid, the lobes entire or again bifid, slightly over 0.5 mm long. Fruits not seen.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 4484
