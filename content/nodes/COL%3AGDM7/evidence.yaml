        usage:
          title: Ardisia pleurobotrya Donn.Sm., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Trees, to 15 m high, the branchlets rufescent, densely lepidote, the inter- nodes short. Leaves petiolate, the petioles 5-15 mm long, lepidote; leaf blades coriaceous, oblanceolate or oblong-elliptic, 4-12 cm long and 1.5-3.7 cm wide, subabruptly acuminate apically, the acumen usually obtusish, acute basally, sometimes attenuate, revolute and decurrent on the petiole, the margin entire, glabrous above, rufescent beneath and densely covered with scales, the lateral nerves somewhat remote, prominent only on the lower surface. Inflorescences axillary, lepidote, rufescent, tripinnately paniculate, to 14 cm long, the peduncles to 7 cm long; pedicels slender, 6-10 mm long. Flowers 5-merous, 5 mm long, umbellate; sepals lepidote dorsally, free, ovate, 2.5 mim long, coriaceous, emarginate, the margin hyaline and ciliolate; petals connate basally ca. 2 mm, broadly ovate, ca. 4 mm long, oblique and asym- metrical apically, acute; stamens inserted at the middle of the corolla tube, ca. 2.5 mm long, the filaments short, the anthers lanceolate, sharply acute, shorter than the petals, concolorous, not punctate; ovary subglobose, punctate, pluriovulate, the style 3-4 mm long. Fruit subglobose, to 1 cm in diameter at maturity.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 8285
