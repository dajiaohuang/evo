        usage:
          title: Drymonia rubra C.V.Morton, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Terrestrial or epiphytic shrubs or lianas; stern lax, succulent when young, be- coming woody, to 2 m tall, subterete to quadrangular, strigillose at the apex, glabrescent below. Leaves often unequal in a pair, elliptic to obovate, 6.8-20.2 cm long, 2.8-8.8 cm wide, subcoriaceous, the apex acuminate, the base cuneate, entire, above dark green, sparsely strigillose, below lighter green or reddish, sparsely strigillose; petioles 1-4 cm long. Inflorescences axillary, of 1 or few flowers; peduncles lacking; bracts linear, strigillose; pedicels 0.5-5 cm long, stri- gillose. Flowers showy; calyx large, oblique, the lobes lanceolate to ovate, 3.5-5.0 cm long, 1.1-2.8 cm wide, the apex acuminate, the base rounded or cordate, subentire, green to creamy white, glabrous; corolla dark red, or with longitudinal light streaks or white at the base, a band of red at the middle and lighter toward the limb, or with a yellow area on the lower limb, oblique in the calyx, the tube curved, broader above from a gibbous or a saccate base, not contracted at the limb, 3-6 cm long, strigillose outside, the limb spreading, the lobes suborbicular, erose; anthers oblong, ca. 5 mm long; ovary strigillose. Capsule ovoid, 1.5-2.0 cm long, 1.2 cm wide, white at maturity; seeds not seen.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 6290
