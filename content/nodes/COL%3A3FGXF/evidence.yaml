    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, 20-45 cm, tunics woody, imbricate, stems divaricately branched. Leaves sword-shaped, margins and veins thickened and ciliate. Flowers small, blue or white, rarely pale mauve, dark mauve on reverse, tepals spreading.
            textZh: Geissorhiza divaricata Goldblatt 的 SANBI 物种条目记录了形态特征。
            sourceIds:
