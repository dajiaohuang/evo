            locator: "SANBI/WFO archive Morphology row 6771; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Geissorhiza divaricata is apparently very closely allied to G. subrigida, also restricted to the Bokkeveld Mtns. The two are distinctive in having a sheath of fibres around the stem base, smooth stems, ciliate to pubescent and ribbed leaves, divaricate branching, and brown, membranous stem bracts. These shared similarities have tended to obscure their differences. Geissorhiza divaricata has small white to pale mauve or blue flowers with a perianth tube 1-2 mm long and tepals ± 10 mm, while G. subrigida, a shorter plant, has larger blue to violet flowers with perianth tube 3-4 mm long and tepals 12-17 mm long. Both grow in rocky sandstone ground but have not been recorded growing together. Plants included in G. divaricata from the Gifberg collected to date have either simple or 1-branched stems and lack the distinctive dry stem bracts found in those from the Bokkeveld Mtns.
            textZh: SANBI 条目提供了 Geissorhiza divaricata Goldblatt 的鉴别特征。
