        claims:
          - text: Like D. subulata but leaves alternate, sessile, with recurved tip.
            sourceIds:
              - sanbi_14402_0
            locator: "SANBI/WFO archive Morphology row 11406; source 14402.0; publication: Manning, JC; Goldblatt, P. 2012. Rutaceae: Diosma L. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 718 - 719. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Diosma awilana is recognised as distinct on account of its having alternate leaves, sessile, broadly lanceolate with the mucro sharply reflexed and margins crisped ciliate; without any staminodes and with the ovary glabrous. It is probably most closely related to Diosma subulata which occurs both to the west near Walker Bay and to the east along the base of the Soetanysberg and at Cape Agulhas. D. subulata however has leaves that are frequently opposite, petiolate and falcate with a straight point. It also differs from Diosma sabulosa, which occurs much further to the east from the Potberg to Albertinia, which has smaller leaves with less hairy margins, with a smaller point at the apex and with smaller flowers. The name refers to the farm where the type material was collected.
