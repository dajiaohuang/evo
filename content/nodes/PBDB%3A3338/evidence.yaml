  claims:
    - subjectId: taxon:stromatoporoidea
      claimKind: scientific
      claimType: taxonomy
      statement: Comparative skeletal anatomy supports interpreting stromatoporoids as sponge-grade organisms in the reviewed material, but affinity and character homology remain historical systematic inferences rather than a fixed crown placement.
      confidence: medium
      confidenceRationale: The review directly compares diagnostic skeletal structures, but its age and the absence of soft anatomy warrant bounded confidence in affinity.
      referenceLinks:
        - referenceId: stearn-1975-stromatoporoid-animal
          relation: supports
          pages: 89–100
          quoteLocator: Comparative anatomy; affinity discussion; concluding synthesis
    - subjectId: taxon:stromatoporoidea
      claimKind: scientific
      claimType: fossil-range
      statement: "Stromatoporoidea has no published scalar range here: the reviewed record comprises a Palaeozoic Ordovician–Late Devonian episode and a separate Late Triassic–Cretaceous, rarely Cenozoic, stromatoporoid-grade episode, so the former 485–359 Ma continuous display is withheld."
      confidence: low
      confidenceRationale: Kershaw and Jeon (2024) explicitly describe two separated stromatoporoid-grade episodes. Low confidence applies to any attempt to collapse that discontinuous, grade-sensitive record into one taxon-wide scalar interval.
      referenceLinks:
        - relation: supports
          referenceId: kershaw-jeon-2024-stromatoporoids-extinctions
          pages: 252:104721
          figure: Review synthesis of the two major episodes
          quoteLocator: Abstract; conclusions
  claim-rationales.zh:
    - 该综述直接比较诊断性骨骼结构，但研究年代较早且缺少软体解剖，因此对亲缘判断保持有限置信度。
    - Kershaw 与 Jeon（2024）明确区分两个彼此分离的层孔虫形态级阶段。低置信度针对把这种不连续且受形态级分类影响的记录压缩为单一类群区间的做法。
  claim-statements.zh:
    - 比较骨骼解剖支持把综述材料中的层孔虫解释为海绵型生物，但其亲缘与性状同源仍是历史系统学推断，而非固定的冠群位置。
    - Stromatoporoidea 在此不发布单一数值范围：综述所示记录包含古生代奥陶纪—晚泥盆世阶段，以及分离的晚三叠世—白垩纪、极少延续至新生代的层孔虫形态级阶段，因此旧有 485–359 Ma 连续展示被暂缓。
