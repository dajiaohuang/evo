          - text: It approaches M. alopecuroides closely in the southern part of its area of distribution, where it is sometimes difficult to distinguish the species. Over most of its area the characteristic features are the rather fleshy leaves in scattered tufts, the small forwardly projecting crest and the rather short claw of the carina.
