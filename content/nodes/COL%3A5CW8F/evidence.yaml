    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Deciduous perennial herb, up to 0.8 m high. Leaves narrowly lanceolate, 150-400 x 20-70 mm. Peduncle up to 0.6 m long. Spathe 110-120 mm long, 15-20 mm broad, white-pink-dark maroon.
            textZh: Zantedeschia rehmannii Engl. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_11118_0
            locator: "SANBI/WFO archive Morphology row 3994; source identifier 11118.0; cited publication: Herman, PPJ; Retief, E. 1997. Plants of the northern provinces of South Africa: Keys and diagnostic characters. Strelitzia 6: 1 - 681. National Botanical Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: The character that separates Z. rehmannii from all other species is its lanceolate leaves which are cuneate at the base, not lobed. The colour range of the spathe, from ivory-white, through pink to dark maroon, also seems to be unique. The plants are not as robust as the majority of species; the spathe is more tightly folded into a narrow tube with the limb tapering into a recurved apiculus. The maturing fruits enlarge and their weight bends the withering peduncle until the spathe tip touches the ground where the seeds germinate and sometimes disappear underground.
            textZh: SANBI 条目提供了 Zantedeschia rehmannii Engl. 的鉴别特征。
