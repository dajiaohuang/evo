    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants 300-900 mm tall; tubers testicular, 15-30 mm long; no separate sterile shoots seen; cauline leaves imbricate, 40-80 mm long and 10-15 mm wide, lanceolate, acute, sheathing, rarely the basal leaves up to 300 mm long and 15 mm wide, with a free blade; inflorescence (50-)100-250 mm long, cylindrical, flowers numerous, imbricate, ovary c. 10 mm long; bracts narrowly ovate to lanceolate, acuminate, 15-20 mm long, overtopping the flowers or the more rarely the apex deflexed. Flowers facing down, base colour white, sepals with green and purple spots, especially along the veins; dorsal sepal subacute, galea elliptical-ovate, 5.5-6.5 mm tall, 4-4.5 mm wide and c. 2 mm deep, facing down; spur horizontal from a small conical base, soon decurved, cylindrical, rounded, 9-11 mm long; lateral sepals patent, oblong, obtuse, 5-5.5 mm long and 3-3.5 mm wide, shortly apiculate; petals oblong, obliquely acute, swollen midvein curved falcately, 4.5-5 mm long and 1.5-2 mm wide, erect, included in the galea. Lip elliptical-spathulate, subacute, 3-5 mm long and 1.3-2 mm wide, rostellum 1.5-2 mm tall, lateral lobes parallel, anther 1.5-2 mm long; stigma stipitate.
