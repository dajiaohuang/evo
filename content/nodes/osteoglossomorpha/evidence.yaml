  claims:
    - subjectId: taxon:osteoglossomorpha
      claimKind: scientific
      claimType: topology
      statement: A 546-exon phylogenomic sample spanning all six living osteoglossomorph families supports a detailed extant topology. The extant family sample does not delimit the whole fossil range or provide a direct origin date for Osteoglossomorpha.
      confidence: medium
      confidenceRationale: Confidence is medium because the cited primary study directly supports the bounded topology statement at the supplied locator. The confidence does not extend beyond the extant family sample does not delimit the whole fossil range or provide a direct origin date for Osteoglossomorpha.
      referenceLinks:
        - relation: supports
          referenceId: peterson-2022-osteoglossomorpha-phylogenomics
          pages: 1032–1044
          figure: Figures 1–4; supplementary matrices
          quoteLocator: Exon and taxon sampling; topology; biogeographic analyses
    - subjectId: taxon:osteoglossomorpha
      claimKind: scientific
      claimType: divergence-time
      statement: The sampled Elopomorpha–Osteoglossomorpha split was estimated between 239.12 and 213.05 Ma; this model interval bounds the represented crown route but is not an osteoglossomorph fossil FAD.
      confidence: medium
      confidenceRationale: "Crown Osteoglossomorpha molecular-clock interval: the cited primary study or systematic review directly supports the stated sample, calibration or withholding boundary at the supplied locator. Confidence is medium and does not extend to a global FAD, LAD, direct ancestor or unsampled interval."
      referenceLinks:
        - relation: supports
          referenceId: qi-2024-teleost-wgd-dating
          pages: Article evae128
          figure: Figure 1; Supplementary Table S1
          quoteLocator: "Results: Elopomorpha–Osteoglossomorpha divergence 239.12–213.05 Ma"
  claim-rationales.zh:
    - 置信度为中：所引主研究在给定页码、图版或章节定位器处直接支持这一受限的拓扑表述；置信度不外推到文中明确排除的全群起源、全球首现、直接祖先或精确端点。
    - Crown Osteoglossomorpha molecular-clock interval：所引一手研究或高质量系统综述在给定页码、图表或章节处直接支持此处的样本、校准或暂缓边界。置信度为中等。该置信度不外推至全球首现、全球末现、直接祖先或未采样区间。
  claim-statements.zh:
    - 覆盖六个现生骨舌鱼总目科的 546 个外显子系统基因组样本，支持细致的现生拓扑。现生科级样本不能限定完整化石延限，也不能提供骨舌鱼总目的直接起源日期。
    - 采样的海鲢形类—骨舌鱼形类分化被估计在 2.3912–2.1305 亿年前；该模型区间约束所代表的冠群路线，但不是骨舌鱼形类的化石首现。
