      statement: Stegosauria is displayed at 174.7–100.5 Ma only as the review's stage-level body-fossil coverage, not exact origination or extinction instants. The interval is a source-bounded sample window, not a global FAD, LAD, divergence date, continuous occupancy claim or direct-ancestor assertion.
