          title: Siphocampylus maxonis E.Wimm., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Straggly, little-branched, suffrutescent herbs or slender shrublets 30-60(-100) cm tall; stems glabrous below and throughout most of the length, sparsely to moderately pubescent above with soft, spreading hairs. Medium leaves with blades thinly membranous when dry, ovate to lance-ovate, apically long-acumi- nate, basally cordate, (4-)6-10 cm long, 2.5-5 cm wide, usually 2-2.5 times as long as wide, glabrous above and sparsely short-pubescent on the principal veins beneath, the hyaline trichomes spreading at right angles from the veins and paral- leling the surface, marginally sharply serrate to somewhat dentate, the teeth cal- lose-tipped and 0.2-0.4 mm long; petioles sparingly spreading short-pubescent, 1.5-4 cm long. Flowers solitary in the axils of the upper leaves, 3.8-4.5 cm long; pedicels solitary, sparsely spreading short-pubescent, 3-4.5 cm long; bracteoles basal, filiform, 2 or lacking, hypanthium obconic or turbinate! at anthesis, moder- ately to densely spreading short-pubescent with hyaline trichomes 0.2-0.5 mm long; calyx lobes narrowly linear, subulate, the pubescence mostly restricted to marginal cilia and along the midvein, 4-7 mm long with 2-4 slender marginal, appressed, basal teeth; corolla red or rose purple, externally sparsely to moder- ately spreading short-pubescent, the trichomes 0.1-0.2 mm long, internally gla- brous, the tube straight, 25-30 mm long, the base 6-8 mm long, narrowly cylindric, 1.5-2 mm in diameter, the upper portion expanding to 4-7 mm in diameter, the 2 upper lobes 8-12 mm long, the 3 lower lobes 7-9 mm long; filament tube 30-34 mm long, glabrous, slightly exserted, slightly adherent to the base of the corolla, the anther tube 4-5 mm long, the 2 shorter anthers apically white-tufted with trichomes ca. 1 mm long, the other anthers glabrous or with a few scattered tri- chomes or a line of hairs in the commissures. Capsules ca. 2/%3_/4 inferior, ca. 8 mm long; seeds plumply cylindric to subglobose, shallowly pitted with isodiametric de- pressions, 0.5-0.7 mm long.
