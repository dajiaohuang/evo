    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants epiphytic; stems 2-4 mm in diameter, frequently branched, to 150 mm long; roots produced opposite the leaves, to 300 mm long, branching; leaves lorate, unequally bilobed, rounded, 35-80 x 4-10 mm. Inflorescences several per stem, arcuate, 30-70 mm long and 6-25-flowered; bracts amplexicaul. Flowers beige, pale-brown or greenish-yellow; pedicels 2-2.5 mm long. Sepals unequal, shallowly concave, rounded; median oblong, 3-3.5 x 1.5-2 mm; laterals lorate, 3-4 x 1-1.5 mm. Petals broadly elliptic, rounded, 2.5-3 x 2.5 mm, forming a hood over the gynostemium with the sepals. Lip very broadly obtriangular, flat, 3-4 mm long and 5-6 mm wide, apical margin emarginate; spur cylindrical, subacute, curved forwards, 4.5-6 mm long and c. 1 mm in diameter, tissue firmer than that of the rest of the perianth. Gynostemium erect, 2 mm tall. Capsules cylindrical, 13 x 3 mm.
