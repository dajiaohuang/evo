    - subjectId: taxon:brachiosauridae
      claimKind: scientific
      claimType: taxonomy
      statement: Brachiosauridae is represented by Taylor’s character-by-character separation of Brachiosaurus altithorax from Giraffatitan brancai; that genus-level revision does not define the complete family range or every brachiosaurid member.
      confidence: high
      confidenceRationale: The type and referred material are compared in detail and diagnoses are explicit. High confidence is restricted to the revised genera and characters.
      referenceLinks:
        - referenceId: taylor-2009-brachiosaurus-giraffatitan
          relation: supports
          pages: 787–806
          figure: Figures 1–16; Tables 1–3
          quoteLocator: Type-material review; comparative diagnosis; generic separation
    - subjectId: taxon:brachiosauridae
      claimKind: scientific
      claimType: fossil-range
      statement: Brachiosauridae is displayed at 154.8–145 Ma only as the Late Jurassic type-material comparison for Brachiosaurus and Giraffatitan, not the complete family range. The interval is a source-bounded sample window, not a global FAD, LAD, divergence date, continuous occupancy claim or direct-ancestor assertion.
      confidence: medium
      confidenceRationale: Brachiosauridae uses Taylor, M.P. (2009) because the cited pages and locator expose the sampled taxon, specimen or living sequence set. Confidence is medium and applies only to Morrison and Tendaguru type-material comparison in Taylor; broader endpoints remain unclaimed.
      referenceLinks:
        - relation: supports
          referenceId: taylor-2009-brachiosaurus-giraffatitan
          pages: 787–806
          figure: Figures 1–16; Tables 1–3
          quoteLocator: Type-material review; comparative diagnosis; generic separation
        - relation: contextualizes
          referenceId: ics-2026-06
          pages: International Chronostratigraphic Chart v2026/06
          figure: Global chronostratigraphic scale
          quoteLocator: Numerical boundaries for named geological stages used to bound the source sample
  claim-rationales.zh:
    - 模式与归入材料得到详细比较，诊断明确。高置信度仅限修订后的属和字符。
    - Brachiosauridae 采用 Taylor, M.P.（2009）的论文，因为所引页码与定位符直接标示了研究采样的类群、标本或现生序列集合。中等置信度仅适用于 Morrison and Tendaguru type-material comparison in Taylor；更宽泛端点保持未声明。
  claim-statements.zh:
    - 腕龙科由 Taylor 对高胸腕龙与布氏长颈巨龙逐字符分离的研究表示；该属级修订不定义完整科级范围或每个腕龙科成员。
    - Brachiosauridae 仅以 154.8–145 Ma 展示为Brachiosaurus 与 Giraffatitan 晚侏罗世模式材料的比较区间，而非完整科级范围。该区间是来源限定的样本窗口，不是全球首现、末现、分化日期、连续占据或直接祖先断言。
