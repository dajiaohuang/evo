    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, 15-25 cm. Leaf solitary, linear, channelled. Flowers tiny, violet, tepals subequal, style branches narrow and crests vestigial.
            textZh: Moraea verecunda Goldblatt 的 SANBI 物种条目记载了植株、叶片和花部形态。
            sourceIds:
              - sanbi_13878_0
            locator: Strelitzia 29; archive Morphology row 7374, source 13878.0
            placeTimeScope: Regional species account published 2012; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
          - text: Recognised by the combination of small, pale blue-violet flowers with subequal tepals 10-13 mm long, all bearing yellow nectar guides, and short tepal claws ± 1.8 mm long diverging to form a wide, shallow cup around the filament bases. The filaments are united in a smooth column and diverge only near the tips. In general the flowers resembles those of M. crispa and its close allies, both in form and in the short style branches that lack crests and are appressed to the subtending anthers but it differs from that species in having sessile lateral rhipidia and unusual capsules, ± spindle-shaped with a short sterile beak, unique in sect. Pseudospicatae. The solitary foliage leaf is linear, narrowly channelled and usually more-or-less trailing distally, thus typical of the section.
            textZh: SANBI 条目提供了 Moraea verecunda Goldblatt 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: Strelitzia 42; archive Diagnostic row 94212, source 18638.0
            placeTimeScope: Regional species account published 2020; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
