    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Erect, bushy shrub, up to ± 600 mm tall. Leaves broadly ovate to suborbicular, truncate or cuneate at base, stellate-tomentose, strongly corrugated towards margins, nerves prominent beneath. Flowers 1-3 in axils of upper leaves and at branch tips, orange to lemon yellow.
            sourceIds:
              - sanbi_14904_0
            locator: "SANBI/WFO archive Morphology row 35068; source 14904.0; publication: Snijman, DA. 2013. Malvaceae. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 416 - 420. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Characterized by the dense tomentum covering most parts of the plant; the broadly ovate leaves, which are only slightly longer than they are broad in the lower half with the base truncate or broadly cuneate and the margins crenate and usually wavy, the subinflated and somewhat urceolate calyx, and the rays of the grouped hairs, which are longer in parts than on the rest of the plant. In these features H. vestita resembles H. minutiflora. As the name implies, the flowers are consistently small, under 5 mm long on herbarium specimens, as against 5.5-10 mm in H. vestita. The calyx does not appear to be subinflated in H. minutiflora, also the majority of the leaves is more suborbicular or oblate than in our species. For a comparison of the areas of distribution see notes under H. minutiflora.
            textZh: SANBI 条目提供了该种的鉴别特征。
