        usage:
          title: Alchornea glandulosa Poepp., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Tree to 15 m high; twigs stellate-puberulent. Leaves membranous to thinly chartaceous; petioles stellate-puberulent, 1-8 cm long; stipules 0.4-0.6 mm long, basally puberulent; blades elliptic to ovate, ca 5-15 cm long, 3-11 cm broad, early glabrate above, minutely stellate-pubescent beneath especially along the veins, with several (mostly 6-10) elliptical glandular spots near the base above, 3-veined at the base with 1-3 additional pairs of lateral veins, the veinlet reticulum prominulous beneath, the 3 major veins barbate in axils with minor laterals, the base rounded to subcordate, the margins shallowly and remotely serrulate with 6-10 glandular thickened ? incurved teeth on each side, the apex rather abruptly acuminate. Spikes stellate-puberulent; 3' spikes mostly compound, ca 5-14 cm long, mostly with 3-5 lateral axes; 9 spikes unbranched, 3-10 cm long. Staminate flowers subsessile, ca 1 mm broad in bud; calyx-lobes 2 or 3, acute, glabrous, less than 1 mm long; stamens 7 or 8, the anthers 0.5-0.6 mm long, blunt. Pistallate flowers subsessile; calyx-lobes 4, lanceolate, acute, ca 1-1.5 mm long, pubescent; ovary stellate-tomentulose, the styles stellate-pubescent, mostly 9-11 mm long. Capsules and seeds not seen.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 4327
