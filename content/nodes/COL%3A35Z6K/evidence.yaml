    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants terrestrial, pale brown to white; tubers several, to 30 x 10 mm; stems slender, to 100 mm tall; leaves reduced to a few scattered scales. Inflorescences with several, terminally aggregated flowers; bracts membranous, triangular, to 2 mm long. Flowers opening sequentially, remaining open only for a few hours, white, tinged with brown, lip callus yellow. Sepals equal, rounded, fused for basal 1 mm with the petals, 6-9 x 3-5 mm. Petals similar, 5-6 x 2-5 mm. Lip shortly stalked, obscurely 3-lobed, 5-6 mm long and 8-9 mm wide, lobes rounded, callus a strip of papillae along the midline; lateral lobes porrect. Gynostemium erect, 4 mm long, with a short foot, with well-developed lateral wings. Capsules to 20 mm long, pedicel erect and at maturity c. 90 mm long.
