        usage:
          title: Stachytarpheta jamaicensis (L.) Vahl, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Herbs, 6-12 dm high, shiny, often purplish throughout, sparingly pubescent or glabrate throughout, sometimes slightly woody basally; stems and branches dichotomous, subtetragonal, usually glabrate except for the lanuginous-pilose nodes. Leaves alternate or opposite, rather fleshy when fresh, thin-chartaceous or membranous in drying, oblong to oval or ovate (rarely rounded), 2-8 cm long and 1.2-5 cm wide, obtuse or acute apically, coarsely serrate along the margins with acute and spreading or appressed teeth and more or less ciliate-scabrous, cuneate-narrowed basally and prolonged into the margined petiole, which is as long as the blade or shorter, glabrous on both surfaces or slightly pilosulous on the veins beneath, not usually blackening in drying. Spikes terete, stout, stiff, often flexuous, 1.5-5 dm long, glabrous throughout; rachis conspicuously incras- sate, the deep furrows much narrower than the rachis itself, especially at maturity. Flowers at first erect, later immersed in the thickened rachis; bracts medium-size or comparatively small, lanceolate or oblong-lanceolate, 5-8 mm long and ca. 2 mm wide, aristate-acuminate apically, striate, scabridous, the margins scarious and obscurely ciliolate; calyx compressed, ca. 5 mm long or about as long as the subtending bract, the rim bifid, the teeth triangular or triangular-ovate, com- pletely immersed in the furrows of the rachis in fruit; corolla hypocrateriform, blue or violet to purple, 8-11 mm long, the tube slightly curved, the limb ca. 8 mm wide; style included.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 13716
