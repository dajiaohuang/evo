    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Perennial herb, geophyte, 0.25-0.80 m high; corm depressed-globose to ovoid, tunics of elongated reticulate fibres; stem simple or 1-3-branched, sometimes slightly flexuose. Leaves linear to linear-lanceolate, (sub)erect, acute to acuminate, with strong midline vein, turning darker when dry. Bracts membranous, golden-brown, margins papery; outer tridentate; inner bidentate. Inflorescence with red, pink or orange-red, zygomorphic flowers; perianth tube funnel-shaped; tepals elliptical, obtuse, spreading, subequal in length, lower with yellow blotch in throat. Stamens curved; filaments 7-12 mm long; anthers curved, pink or yellow. Flowering time Aug.-Apr. Capsule subglobose or obovoid.
            textZh: Tritonia disticha (Klatt) Baker 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_18505_0
            locator: "SANBI/WFO archive Morphology row 91086; source identifier 18505.0; cited publication: Bredenkamp, CL; Magwaza, ZL. 2019. Iridaceae. In: CL Bredenkamp (ed.), A Flora of the Eastern Cape Province, Strelitzia 41(3): 1821 - 1882. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Recognised by its lanceolate leaves (5-)8-12(-20) mm wide with a prominent submarginal vein and funnel-shaped, red, orange-red or pink flowers, sometimes darkly veined, lacking well-developed calluses. The lower tepals, especially the median, are marked at the base with a small yellow blotch outlined with red. It is closely allied to and largely sympatric with T. gladiolaris, which blooms earlier, mainly August to November (rarely into December), and has cream- to straw-coloured or pale yellow flowers, sometimes flushed pale apricot-coloured, usually with prominent dark veins. Plants with ± 3-toothed or irregularly toothed bracts, the lower bracts sometimes acute, were separated as subsp. rubrolucens from typical T. disticha with obtuse to acuminate or sometimes 3-toothed bracts, recorded mainly from the coastal Eastern Cape and KwaZulu-Natal.
            textZh: SANBI 条目提供了 Tritonia disticha (Klatt) Baker 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 94784; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
