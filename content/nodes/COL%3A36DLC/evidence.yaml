        claims:
          - text: Finely leafy, aromatic shrub to 1 m, sometimes branched from base. Leaves sessile, ascending, linear-lanceolate, sharply mucronate. Flowers in small, terminal clusters on short racemes, white.
            sourceIds:
              - sanbi_14402_0
            locator: "SANBI/WFO archive Morphology row 11414; source 14402.0; publication: Manning, JC; Goldblatt, P. 2012. Rutaceae: Diosma L. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 718 - 719. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Diosma meyeriana is recognised as a distinct species being a shrub arising from a single main stem, entirely glabrous; with leaves linear-lanceolate, sessile, alternate, adpressed erect with a small straight point; with flowers small, crowded, sub-sessile with petals glabrous, closing again after anthesis and persisting; with fruits not oily and with matt seeds. It looks very like D. hirsuta which however has leaves petiolate and D. acmaeophylla which has the petals pubescent.
            textZh: SANBI 条目提供了该种的鉴别特征。
            sourceIds:
              - sanbi_2849_0
            locator: "SANBI/WFO archive Diagnostic row 64071; source 2849.0; publication: Williams, IJM. 1982. Studies in the genera of the Diosmeae (Rutaceae): 14. A review of the genus Diosma L. J. S. African Bot. 48(3): 329 - 407. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
