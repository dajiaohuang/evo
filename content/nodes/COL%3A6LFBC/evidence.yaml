            locator: "SANBI/WFO archive Diagnostic row 64166; source identifier 2665.0; cited publication: Smith, GG. 1948. Some new species and varieties in the genus Haworthia, VI. J. S. African Bot. 14: 41 - 54. [CC BY]"
