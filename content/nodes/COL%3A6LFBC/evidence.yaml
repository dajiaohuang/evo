        claims:
          - text: Acaulescent succulent, forming robust rosettes. Leaves often curving sideways from base, slender, rigid, light green, nearly smooth. Flowers white.
            textZh: Haworthiopsis longiana (Poelln.) G.D.Rowley 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13856_0
            locator: "SANBI/WFO archive Morphology row 9073; source identifier 13856.0; cited publication: Bayer, B. 2012. Asphodelaceae: Haworthia Duval. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 75 - 77. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Of the many plants of this species examined in the field, at the type and other localities, and in gardens, the tubercles on back of leaf are concolorous or at the most only slightly whitish. In the new variety the tubercles are conspiculously large and bluish white. In the shade the plants become very tall and in general appearance are not as white looking as the smaller ones in the sun. The fully exposed plants have the appearance of being covered with white scale.
            textZh: SANBI 条目提供了 Haworthiopsis longiana (Poelln.) G.D.Rowley 的鉴别特征。
            sourceIds:
