    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte to 10 cm, corm with an oblique basal ridge, basal ridge fibrous, stem branching above ground. Basal leaves 1 or 2. Flowers blue to white with yellow cup, often blotched on reverse, sometimes fragrant, inner bracts membranous.
            textZh: Romulea tabularis Eckl. ex Bég. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 7327; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Varying in the length of the stem, number of basal leaves, flower colour, and length of the style but generally recognised by the lavender-blue (rarely white) flowers with orange or golden-yellow cup extending onto the basal half of the tepals, mostly solitary basal leaf, and often somewhat submembranous inner bracts with brown-flecked membranous margins. The species is closely allied to Romulea leipoldtii, which is distinguished by its invariably two basal leaves, generally larger, white or cream-coloured flowers with tepals 18-35 x 5-8 mm, the outer tepals not marked on the reverse, and inner bracts that are green and leathery in the centre. Specimens with two basal leaves may also be confused with Romulea schlechteri from drier situations, which has the yellow pigment restricted to the cup itself and not extending onto the lower half of the tepals, and inner bracts without brown flecks on the membranous margins.
            textZh: SANBI 条目提供了 Romulea tabularis Eckl. ex Bég. 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 95115; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
