    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Stout succulent herb, sometimes woody at the base, up to 3 m tall, well branched, glabrous except for minute hairs on the midribs and margins of young leaves; stems usually somewhat reddish. Leaves 2-13 x 0.5-3.5 cm, lanceolate or broadly elliptical, narrowly cuneate at the base, the apex subacute; main veins on each side of midrib 13-22; petiole 2-20 mm long. Flowers clustered on short axillary shoots also bearing reduced leaves. Sepals 4, 1.7-3 x 0.4-1 mm, lanceolate-ovate, mucronate, usually with reddish margins. Petals 1.5-3.5 x 1.2-2.6 mm, nearly circular in outline. Stamens 4; filaments 0.8-1.2 mm long; anthers c. 0.5 x c. 0.8 mm, weakly attached to the filament, shedding pollen directly on the stigma at anthesis. Pollen shed in tetrads. Disk elevated c. 0.5 mm, with a depressed nectary fringed with short hairs surrounding the base of each petal. Style 0.5-0.8 mm long; stigma c. 1 mm thick, c. 0.5 mm high, depressed-globose. Capsule 10-20 x 1.2 mm, relatively thin-walled, glabrous, terete, light brown, at first thin-walled and torulose, but as the endocarp swells and hardens, becoming smooth; pedicels 0.5-3 mm long. Seeds 0.6-0.75 x 0.4-0.5 mm, uniseriate in each locule of the capsule, diagonal, brown, obovoid; raphe inconspicuous, each seed loosely but completely embedded in an easily detached piece of soft powdery endocarp 0.6-1 mm long, 0.5-0.7 mm wide.
