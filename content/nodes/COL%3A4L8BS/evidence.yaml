        claims:
          - text: "Perennial herb or dwarf shrub, up to 0.5 m high; not spinescent. Stems erect, much branched at base, greyish; glaucous. Leaves subsessile, few and distant; blade linear-obovate, 10-13 x 1.0-1.5 mm, apex recurved, mucronate. Flowers: in terminal racemes; wings obovate-elliptic, 6-8 x 2.5-3.5 mm, apex acute, green midrib prominent; petals deep purple-mauve; Nov.-Feb."
