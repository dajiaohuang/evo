    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Annual, up to 400(-600) mm tall, usually purple; culms unbranched to much branched in upper nodes, older plants wiry. Leaves linear, sparse; ligule a fringe of hairs (if ligule a fringed membrane see Stipa capensis). Inflorescence an open panicle. Spikelets 18-22 mm long (including awns), 1-flowered; glumes unequal; lemma 1-awned, awn up to 20 mm long, bent, column present, glabrous (if long hairs present at base of column see Stipagrostis anomala), articulation between lemma apex and column base.
            textZh: Aristida parvula (Nees) De Winter 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_14569_0
            locator: "SANBI/WFO archive Morphology row 33428; source identifier 14569.0; cited publication: Fish, L. 2013. Poaceae: Aristida. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 133 - 134. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: In the past this species has been included in Stipa because of the single awn, but Stipa has a membranous ligule and detailed studies shown it to be an Aristida with the lateral awns missing.
            textZh: SANBI 条目提供了 Aristida parvula (Nees) De Winter 的鉴别特征。
