            locator: "SANBI/WFO archive Morphology row 83008; source 6658.0; publication: Edwards, TJ. 2005. Two new Plectranthus species (Lamiaceae) and new distribution records from Pondoland Centre of Plant Endemism, South Africa. Bothalia 35(2): 149 - 152. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
