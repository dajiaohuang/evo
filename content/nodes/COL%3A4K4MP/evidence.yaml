    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Semisucculent, erect, decumbent or scandent herb, 0.4-0.6 m tall. Stems rigid, 10-15 mm thick below, initially pale green becoming dark purple; sericeous, rubro-punctate; nodes prominently ciliate. Leaves semisucculent, round to ovate, 50-80 x 40-80 mm, base obtuse to cordate, adaxial surface sparsely rubro-punctate, sessile colourless glands dense, filiform trichomes erect; abaxial surface densely rubro-punctate, filiform trichomes erect; midrib purple; margin serrate in upper two thirds, teeth in 5-8 pairs; petiole purple, 15-25 mm long, rubro-punctate. Synflorescence terminal, 150-250 mm long; cymes 3-flowered; basal branches 2-4, verticels often secund, alternately 3- and 6-flowered; rhachis strigose, rubro-punctate; bracts persistent, lanceolate, 4-5 x 1-2 mm, glabrescent above, sparsely strigose and rubro-punctate below; margins entire, ciliate; pedicels purple, 3-4 mm long. Calyx green to purple, rubro-punctate; upper sepal ovate, 3-4 x 3-5 mm; lower sepals partially fused, 4 mm long, lateral lobes subulate, 1 mm long, posticous lobes 2-3 mm long; tube 1-2 mm long. Corolla 9-11 mm long, white, with dense, erect, glandular trichomes outside; tube laterally compressed, 8-9 x 3.5-4.0 mm, broadest in the proximal third, throat constricted, 2 mm wide; upper lip 4-lobed, obovate 8-9 x 7-8 mm, white with pale mauve nectar guides, sparsely rubro-punctate outside, lateral auricles 4 mm long; lower lip navicular with inrolled sides, 4-5 x 2 mm, white, densely rubro-punctate outside. Stamens 4; filaments free, 2.5-3.0 mm long, adnate to corolla throat; anthers 1 mm long, purple, connective rubro-punctate. Ovary 4-lobed, glabrous; style white, filiform, 8-9 mm long; stigma shortly bifid. Nutlets ovoid, 1.0-1.25 x 0.8-1.0 mm, glossy, pale to dark brown.
            sourceIds:
