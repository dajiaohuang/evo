          - text: Plectranthus stylesii strongly resembles P. verticillatus but is distinguished from this procumbent species by its thick, rigid, erect stems and bushy habit; plants grow up to 0.6 m tall without support from adjacent vegetation. The leaves of P. stylesii are much larger (50-80 x 40-80 mm) than those of P. verticillatus (16-40 x 12-40 mm). The corolla of the new species is distinctly constricted at the throat, whereas that of P. verticillatus is only slightly narrowed.
