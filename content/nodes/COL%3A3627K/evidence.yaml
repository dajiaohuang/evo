    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Perennial herb, geophyte, 0.80-0.95 m high, tufted; corm 30 mm in diam. Leaves linear, acute; venation slightly pronounced; radical leaves 450-650 x 4.5-7.0 mm; reduced sheathing leaves 4. Flowering stems 0.80-0.95 m high. Inflorescence a raceme of spikes, pendulous, with 3-5 lax branches. Bracts 15-19 x 8-11 mm, broadly obovate, acute, flecked, with broad white margins, sometimes flecked along midline. Perianth pale mauve, 25-28 mm long; tube 6-9 mm long; tepals 18-23 x 8-12 mm. Anthers 6.0-8.5 mm long. Flowering time Sept., Oct.
            textZh: Dierama jucundum Hilliard 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_18505_0
            locator: "SANBI/WFO archive Morphology row 90723; source identifier 18505.0; cited publication: Bredenkamp, CL; Magwaza, ZL. 2019. Iridaceae. In: CL Bredenkamp (ed.), A Flora of the Eastern Cape Province, Strelitzia 41(3): 1821 - 1882. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: A clump-forming species with pendulous spikes of moderately large, widely funnel-shaped, pale lilac flowers with perianth 25-28 mm long and broad tepals 8-12 mm wide. Dierama dracomontanum has slightly smaller, pink to almost red flowers with perianth 19-25 mm long and tepals 5-8 mm wide.
            textZh: SANBI 条目提供了 Dierama jucundum Hilliard 的鉴别特征。
