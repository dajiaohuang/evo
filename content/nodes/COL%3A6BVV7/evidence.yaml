          publishedAt: undated
          originalSourceText: Tree with slender puberulent branches. Leaves 1-jugate, short-petiolate; leaf- lets 2, subovate, 2.5-4 cm. long, up to 2 cm. wide, glabrous, submembranaceous, obtuse, somewhat inequilateral, 2- to 3-nervate, pubescent on the nerves. In- florescence fasciculate, axillary, short-pedunculate; bracts about 1 mm. long. Flowers pedicellate; pedicels pubescent, about 8 mm. long, ovate-bracteate basally; sepals 4, about 3 mm. long, membranaceous, deciduous; petals 5, contracted basally, unequal, inserted upon the disc-like receptacle; ovary pubescent; style glabrous, inflexed; stigma capitate. Legume small, plane-convex, fleshy, verrucose and pubescent without.
