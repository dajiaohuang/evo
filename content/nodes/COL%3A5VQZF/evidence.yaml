    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Robust perennial, short rhizomatous and tufted (erect), up to 1.4 m high. Leaf blades up to 800 mm long; 2-3(-6) mm wide. Culms 5-6 mm in diameter, unbranched, lower internodes woolly-hairy or glabrous. Spikelets 25-30 mm long (including awns); lower glume half the length of the upper, mucro or awn absent; lemma articulation absent; lemma narrowed into a beak or very short twisted column; awns 3, subequal; callus tip small, naked, swollen and rounded.
            textZh: Aristida sciurus Stapf 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_11118_0
            locator: "SANBI/WFO archive Morphology row 310; source identifier 11118.0; cited publication: Herman, PPJ; Retief, E. 1997. Plants of the northern provinces of South Africa: Keys and diagnostic characters. Strelitzia 6: 1 - 681. National Botanical Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Resembles A. pilgeri, which has a lemma articulation; A. spectabilis, with the lower glume membranous for the upper 1/3-2/3; and A. canescens subsp. canescens, a more slender plant with a culm diameter of 1.5-3.0 mm.
            textZh: SANBI 条目提供了 Aristida sciurus Stapf 的鉴别特征。
