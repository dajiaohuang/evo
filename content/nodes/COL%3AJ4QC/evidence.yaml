        usage:
          title: Astronium graveolens Jacq., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Tree to 35 m high. Leaves 2-7-jugate, the rachis 7-21 cm long (the petiole portion often elongate), the deciduous leaflets opposite (occasionally some alter- nate), with petiolules 1-6 mm long which are glabrous to pilosulous or villosulous; lamina of leaflets lance-oblong, less frequently ovate, acute or more often acumi- nate at the apex (the acumen obtuse to rounded or emarginate), basally obliquely acute to rounded or subtruncate, 4-14 cm long, 1.7-5 cm broad, membranous or subcoriaceous, entire or obscurely and irregularly crenate to serrate, glabrous to conspicuously pilosulous along the main veins below and often also above, occasion- ally generally pilosulous beneath, the secondaries often branching + equally near the margin (dichotomous), the reticulation faint to prominent. Panicles terminal, 7-25 cm long. Flowers male female (staminodes are present in female flowers but a pistillode is absent in male flowers), the pedicels 1-15 mm long, articulated; sepals orbicular or infrequently ovate, 1-1.5 mm long in flower, becoming 9-14 mm long and elliptic to obovate or oblanceolate as the fruit matures, scarious in fruit; petals 1.5-3 mm long, oblong-ovate to elliptic, acute or rounded, ascending to spreading or reflexed; stamens 2-3 mm long, the filaments compressed and subulate, the anthers 1-1.5 mm long; disc flattened (not tumid); ovary ovoid-oblong, 1.5-2 mm long, the styles 0.5-1 mm long, persistent or deciduous, the stigmas small and disciform. Fruit narrowly oblong, 10-15 mm long at maturity, 2-4.5 mm broad, subterete, the mature seed filling the lumen.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 467
