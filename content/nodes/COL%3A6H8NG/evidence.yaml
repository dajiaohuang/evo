        usage:
          title: Eugenia chrysophyllum Poir., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrubs or trees; young twigs brown-tomentose, soon glabrate. Leaves oblong to lanceolate-oblong, long acuminate at the apex, acute at the base, 7-15 cm. long and 3-5 cm. wide, chartaceous to coriaceous, the young leaves densely golden brown-sericeous on both sides, soon glabrescent above, with hairs closely appressed, the adult leaves discolorous, glabrate above and paler and appressed-pubescent beneath, the midrib flat, prominulous toward the apex above, prominent beneath, the lateral nerves in about 12-16 pairs, prominulous on both sides; petiole 3-7 mm. long. Flowers fasciculate or shortly racemose (the rachis up to 5 mm. long), in clusters of 3-8, axillary; pedicels 2-7 mm. long, brown-tomentose; bractlets minute, narrow. Sepals tomentose, very unequal, the 2 outer suborbiculate, about 1.5 mm. long, the 2 inner ovate, about 3 mm. long. Petals obovate or oblong, about 5 mm. long, glandular. Ovary tomentose, 2-celled, many-ovulate. Berry ellipsoid, about 15 mm. long and 9-12 mm. wide in our specimens (up to 2.5 cm. in diameter according to Cooper), grayish-puberulent, 1-seeded, the embryo homogeneous.
          originalLanguage: en
          sourceField: general
