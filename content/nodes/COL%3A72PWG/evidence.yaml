        usage:
          title: Lunania parviflora Spruce ex Benth., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Tree to 20 m tall, the branchlets glabrous or inconspicuously puberulous. Leaves with the petioles to 2.2 cm long; blade inequilateral, ovate to elliptic, or ovate-oblong, sometimes narrowly so, oblique and acute to rounded at the base, long-caudate-acuminate at the apex, the acumen to 3 cm long and blunt, the margins entire or nearly so, to 19 cm long and 7.5 cm wide, thin-chartaceous to chartaceous, somewhat lustrous above, dull beneath, 3- to 4- to 5-nerved from the base, glabrous above, inconspicuously puberulous and hirtellous along the main veins to glabrous below, the main veins somewhat impressed above and prominent below, the veinlets scarcely prominulous and loosely reticulate on both sides. Racemes pendulous, to 40 cm long, the rachis inconspicuously puberulous. Flowers yellowish-green to cream-colored, the pedicels 1.5-2 mm long; buds subglobose, inconspicuously puberulous; calyx splitting into 2-3 lobes, these 1.5-2 mm long, reflexed and curled after anthesis, long persistent; stamens 10-12, the filaments very short and ca 0.2-0.3 mm long, glabrous, the anthers narrowly deltoid, to 1.5 mm long, apiculate; disc ca 0.5 mm high, tomentellous; ovary ca 1 mm long, tomentellous, the styles 3, to 1 mm long, at first close together, later on spreading, glabrous, the stigmas papillate. Capsule when young puberulous, mature one not seen.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 5873
