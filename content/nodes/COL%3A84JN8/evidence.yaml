        note: The 635 Ma edge is a contested biomarker attribution, not a demosponge body-fossil FAD, crown divergence date or uninterrupted occupancy claim.
      evidenceBasis: Love et al. report Cryogenian 24-isopropylcholestanes, while Nettersheim et al. demonstrate non-sponge precursor production; the present endpoint denotes living demosponges.
      evidenceLevel: literature-synthesized
