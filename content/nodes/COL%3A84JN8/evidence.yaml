  claims:
    - subjectId: taxon:demospongiae
      claimKind: scientific
      claimType: taxonomy
      statement: Cryogenian sterane records used on the Demospongiae route are a contested geochemical attribution to sponge-grade sources; they do not establish a demosponge crown origin, body fossil or global first appearance.
      confidence: contested
      confidenceRationale: Published support and counterarguments address biomarker source specificity directly, so contested confidence is retained and no taxonomic endpoint is inferred.
      referenceLinks:
        - referenceId: love-2009-sponge-steranes
          relation: supports
          pages: 718–721
          figure: Figures 1–3; Supplementary Tables 1–4
          quoteLocator: MRM sterane measurements and stratigraphic context
        - referenceId: nettersheim-2019-rhizaria-steranes
          relation: contradicts
          pages: 577–581
          figure: Figures 1–3; Supplementary Tables
          quoteLocator: Rhizarian sterol assays and biosynthetic interpretation
    - subjectId: taxon:demospongiae
      claimKind: scientific
      claimType: fossil-range
      statement: "Demospongiae is displayed at 635–0 Ma only as a contested biomarker-to-living navigation anthology: Cryogenian 24-isopropylcholestanes are not taxonomically exclusive to demosponges and do not establish a body-fossil FAD, crown origin or continuous global occupancy."
      confidence: contested
      confidenceRationale: Love et al. (2009) directly document the South Oman steranes and age context, whereas Nettersheim et al. (2019) directly weaken their taxonomic specificity. Contested confidence is therefore attached to the 635 Ma assignment, not to the existence of living demosponges.
      referenceLinks:
        - relation: supports
          referenceId: love-2009-sponge-steranes
          pages: 457:718–721
          figure: Figures 1–3; Supplementary Tables 1–4
          quoteLocator: Sterane measurements and Cryogenian stratigraphic context
        - relation: contradicts
          referenceId: nettersheim-2019-rhizaria-steranes
          pages: 3:577–581
          figure: Figures 1–3; Supplementary Tables
          quoteLocator: Rhizarian sterol assays and biomarker-specificity discussion
  claim-rationales.zh:
    - 已发表支持与反对意见直接讨论生物标志物来源专一性，因此保留争议置信度，不推断分类端点。
    - Love 等（2009）直接记录阿曼南部甾烷及其年代背景，而 Nettersheim 等（2019）直接削弱其分类专一性。因此争议置信度针对 635 Ma 的归属，而非现生寻常海绵的存在。
  claim-statements.zh:
    - 寻常海绵路线采用的成冰纪甾烷记录，是对海绵型来源存在争议的地球化学归因；它不确立寻常海绵冠群起源、体化石或全球首现。
    - Demospongiae 的 635–0 Ma 仅作为有争议的“生物标志物—现生类群”导航汇编：成冰纪 24-异丙基胆甾烷并非海绵纲专属，不能确立实体化石首现、冠群起源或连续全球占据。
  ranges:
