    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Several trailing or twining stems from a perennial tuberous root-stock; stems olive green, hispid. Leaf-lamina 7-9 x 5-7 cm, very variable in shape, ovate-triangular to subpentagonal, subentire to deeply 3-5(7)-lobed, lobes rounded or subacute and mucronulate, deeply cordate to sagittate-cordate at the base, hirsute above, densely hirsute below, basal nerves 3-5(7)-palmate, secondary nerves mostly ending in well-marked ovoid hydathodes (1 mm long with annular edge); petiole 4-6 cm long. Inflorescences pedunculate, borne at the nodes and appearing before the often abortive subtending leaves; peduncles hispid. Male spikes 3-4 cm long, very dense, on slender peduncles 4-12 cm long; flowers numerous, sessile, subtended by bracteoles. Female spikes 1-1.5 cm long, subcapitate; flowers fewer, sessile; rhachis bracteolate. Fruits 1.8-2 x 1.1-1.3 x 0.6-0.8 cm, yellow-orange at maturity, hirsute, crowded in spikes up to 6 cm long and 3.5 cm broad, on robust peduncles up to 2.5 cm long.
            sourceIds:
