          - text: Distinguished from related species with similar small flowers by the relatively longer perianth tube, 18-30 mm long and ± as long as or longer than the dorsal tepal. This character serves to separate it from species such as Gladiolus crassifolius, G. densiflorus and G. serpenticola.
