        claims:
          - text: Cormous herb, up to 1.25 m high. Perianth up to 50 mm long, erect, obliquely funnel-shaped with a narrow tube and erect, somewhat spreading lobes. Leaves glaucous, coriaceous, 18 mm broad with fine close-set nerves. Flowers pale pink, finely speckled and lined with red.
