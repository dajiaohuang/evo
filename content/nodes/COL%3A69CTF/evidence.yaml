        usage:
          title: Cassia grandis L.f., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Tree to 30 m., the branchlets pubescent towards the tip, later glabrous. Leaves large, many-foliolate; petiole short, eglandular, tomentose, canaliculate above; rachis up to 30 cm. long, like the petiole; stipules small, linear, caducous; leaflets up to 20 pair, oblong, 3-6 cm. long and up to 1.5 cm. wide, rounded or obtuse apically and basally, somewhat inequilateral basally, entire, tomentose below, more lightly pubescent and darker above, with about 20 pairs of lateral veins; petiolules tomentose, 1-2 mm. long. Inflorescence of several- to many-flowered racemes, axillary from older wood to subterminal; racemes to 20 cm. long, tomentose, the bracts caducous; pedicels slender, about 2 cm. long in lower flowers. Flowers showy, reported pink to white; sepals 5, unequal, oblong, the larger about 8 mm. long and 5 mm. wide, rounded apically, canescent-tomentulose without; petals ovate-orbic- ular, to 12 mm. long, short-clawed, glabrous; stamens 3-morphic, the anthers lightly pilose, the filaments glabrous; 3 lowermost stamens about 2 cm. long, the filaments gracefully arcuate and thickened towards the middle, the anthers basi- fixed, short-oblong, about 3 mm. long and 2 mm. wide, subsagittate below, de- hiscent both apically and basally; 5 median stamens about 1 cm. long, the filaments linear, the anthers ovate-orbicular, about 1.5 mm. long, more or less versatile and dehiscing basally; remaining 2 stamens rudimentary or obsolete; ovary linear, arcuate, tomentose. Legume very large, up to several dm. long and 5 cm. broad, subterete but margined, indehiscent, ligneous, transversely rugose.
          originalLanguage: en
          sourceField: general
