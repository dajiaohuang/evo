      statement: The living-primate supermatrix samples the great-ape family Hominidae within Hominoidea and supports its included relationships, but the analysis neither samples extinct hominids comprehensively nor dates the family from a fossil first occurrence.
      confidence: medium
      confidenceRationale: The molecular sample supports the living family-level topology; explicit fossil and temporal exclusions prevent overreach.
      referenceLinks:
        - relation: supports
          referenceId: springer-2012-primate-supermatrix
          pages: Article e49521
          figure: Figures 1–2
          quoteLocator: Hominoidea and Hominidae taxon sampling and topology
  claim-rationales.zh:
    - 分子样本支持现生科级拓扑；明确排除化石与时间外推以防过度解释。
  claim-statements.zh:
    - 现生灵长类超级矩阵在 Hominoidea 内取样大猿科 Hominidae 并支持其所含关系，但该分析既未全面取样灭绝人科成员，也未以化石首现测定该科年代。
