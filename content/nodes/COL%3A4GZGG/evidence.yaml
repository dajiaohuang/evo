        claims:
          - text: "Much-branched, rigid shrub, 0.2-1.5 m high. Leaves dense, lower ones spreading, shortly petiolate; blade narrowly ovate or linear, 7-9 mm long, apex obtuse, margins strongly revolute, covering lower surface, upper surface scabrid. Flowers: in heads, 10-14 mm wide, surrounded by leaves and bracts; densely covered with white hairs; stipitate; calyx tube widely campanulate with an annular ring within, lobes 2 mm long; petals inserted in mouth of tube, blade rotundate, cucullate, claw cuneate-linear; Dec.-Feb. Fruit a rotundate capsule, 5-6 mm long, wrinkled, villous."
