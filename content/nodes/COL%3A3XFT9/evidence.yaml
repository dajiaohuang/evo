    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Shrub, up to 3 m high. Leaves (1)3-foliolate, shortly petiolate, glabrous; leaflets linear or narrowly elliptic, 1.2-3.2 cm long, 2-4 mm wide, the middle leaflet longer than the laterals, apex obtuse, mucronulate, base cuneate, margin somewhat revolute, midrib depressed above, prominent below; petiole 0.5-7 mm long; petiolule 1-1.5 mm long. Inflorescence of few-flowered terminal racemes; pedicels 4-10 mm long. Receptacle campanulate, 4 mm long, 4 mm wide at mouth; disc annular, fimbrillate with erect and some incurved fimbrillae, semi-carnose, 0.6-1 mm long. Sepals broadly ovate, somewhat boat-shaped, 7 mm long, 5 mm wide, apex slightly uncinate, margin somewhat revolute, ciliolate. Petals reduced, ovate, 1.4 mm long, 0.5 mm wide, clawed. Androphore 3 mm long. Stamens about 30, white; filaments 1.2 cm long; anthers oblong, 1.3 mm long. Gynophore 1.4 cm long. Ovary oblong, 2 mm long; stigma capitate. Fruit ellipsoid-cylindric, 1.8-2.5 cm long, 0.9-1.1 cm diam.; colliculate. Seeds subglobose, c.3 mm diam.
            sourceIds:
              - sanbi_9744_0
            locator: "SANBI/WFO archive Morphology row 49895; source 9744.0; publication: Killick, DJB. 1970. Maerua, Fl. S. Africa 13: 159 - 171. Dept. Agric. and Technical Services, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: "M. brevipetiolata differs from M. rosmarinoides, its nearest ally, in the following respects: it is always a thin-stemmed scrambler whereas M. rosmarinoides can be a tree, shrub or sometimes a scrambler or climber; the leaves are Cerro green (Ridgeway) and arranged in one plane instead of very dark green and pendulous, and the leaflets are shorter and broader; the petioles are much shorter; the receptacle is campanulate rather than cylindric; the petals are reduced and the disc is annular and fimbrillate instead of lobed and unequally laciniate."
