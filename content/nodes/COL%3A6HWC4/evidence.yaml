    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Perennial, rhizome to 8.0-10.0 mm diameter. Culm 350-765 mm tall, 0.9-1.2 mm thick, but c. 2.0 mm thick across the rim of the leaf sheath, glabrous. Leaf sheath 70-140 mm long, glabrous, not papery, wine-red, sticky. Leaf blade reduced to lobe, 1.0-13.0 mm long, glabrous, canaliculate. Involucral bract 1, leaf-like and erect or deflected to one side, 7.0-9.0 mm long, margin glabrous. Inflorescence globose, 8.0-10.0 mm diameter, each with over 20 spikelets. Spikelets 4.0-5.5 x 2.0-2.5 mm, terete, dark brown. Glumes 2.3-2.6 mm long, boat-shaped with a mucro 0.5 mm long; margins serrated. Style trifid. Stamens 3, anthers crested. Nutlets 1.5-1.7 x 0.9-1.0 mm, dark brown, weakly reticulate; hypogynous disc to 0.5 mm long, cupular, 6 to 9-lobed.
