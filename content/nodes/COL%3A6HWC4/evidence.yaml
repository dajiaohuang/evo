          - text: Ficinia jardinei is most similar to F. nodosa, sharing gross morphological similarities (well-developed rhizome, absent or reduced leaf blades, globose inflorescence). F. jardinei is characterised by its sticky leaf sheaths and glumes with serrate margins.
