        claims:
          - text: Ficinia jardinei is currently known from seepages and stream banks at 1000-1200 m in the Swartruggens and Witteberg quartzite ranges at the arid edge of the Fynbos biome. All known localities occur in the transition zone between the Fynbos and Succulent Karoo biomes.
