        claims:
          - text: Geophyte, up to 1.5 m high. Flowers secund, funnel-shaped, with only anthers and style branches exserted. Inflorescence a large, laxly branched panicle. Flowers reddish orange.
            textZh: Crocosmia mathewsiana (L.Bolus) Goldblatt ex M.P.de Vos 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_11118_0
            locator: "SANBI/WFO archive Morphology row 1458; source identifier 11118.0; cited publication: Herman, PPJ; Retief, E. 1997. Plants of the northern provinces of South Africa: Keys and diagnostic characters. Strelitzia 6: 1 - 681. National Botanical Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Crocosmia mathewsiana is readily identified by the combination of strongly pleated leaves, multibranched flowering stem, drooping, flexuose spikes, and relatively short-tubed, brilliant orange-scarlet flowers. We assume its relationships lie with the three other pleated-leaved species of the genus, and it is perhaps most closely allied to C. paniculata, which also has a multibranched flowering stem and strongly flexuose spikes. Vegetatively the two are almost indistinguishable, although the stem and branches of C. mathewsiana are more slender and strongly nodding in bud. The spikes are also less prominently flexuose and the flowers of the two species differ considerably, those of C. paniculata having an elongate perianth tube 33-40 mm long (vs. 20 mm).
            textZh: SANBI 条目提供了 Crocosmia mathewsiana (L.Bolus) Goldblatt ex M.P.de Vos 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 94640; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
