    - subjectId: taxon:diprotodontia
      claimKind: scientific
      claimType: topology
      statement: Diprotodontia is represented as one constrained branch in a mammal-wide 31-gene phylogenetic framework, but many DNA-missing species in the completed trees were added by taxonomic constraints; the result is not direct sequence evidence for every diprotodontian or a fossil first appearance.
      confidence: medium
      confidenceRationale: The primary study clearly distinguishes DNA-only and taxonomically completed trees. The claim preserves that evidence gradient.
      referenceLinks:
        - relation: supports
          referenceId: upham-2019-mammal-tree
          pages: Article e3000494
          figure: Figures 1–3
          quoteLocator: Global maximum-likelihood tree; taxonomy completion and TopoCons methods
  claim-rationales.zh:
    - 一手研究清楚区分仅 DNA 树与分类补全树；主张保留这一证据梯度。
  claim-statements.zh:
    - 在一套哺乳动物全局 31 基因系统发育框架中，Diprotodontia 被呈现为一个受约束分支，但完整树中许多缺少 DNA 的物种通过分类约束加入；该结果不是每一种双门齿类的直接序列证据，也不是化石首现。
