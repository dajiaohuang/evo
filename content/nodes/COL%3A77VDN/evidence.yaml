        usage:
          title: Pouteria stipitata Cronquist, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Tree to 10 m. Leaves with petioles 4-17 mm long; blades narrowly obovate to elliptic, acuminate, 5.5-13 cm long, 2-4.5 cm broad, glabrate or appressed- pubescent along the main veins beneath, the primary laterals 7-11 pair, the sec- ondary laterals conspicuous but often irregularly anastomosing, sometimes be- coming ? perpendicular to the primary laterals toward the margin, the reticula- tion fine. Flowers fasciculate at defoliated nodes; pedicels 2-5 mm long; sepals 4-5, suborbicular or broadly ovate, 2-2.5 mm long, finely strigulose to glabrate; corolla thin, 2.4-3.2 mm long, the lobes 4, subrectangular, 0.7-1.2 mm long, fringed- hairy on the margin; staminodes oblong-spatulate, 0.3 mm long, marginally fringed-hairy (especially near the tip); staminal filaments attached at the middle of the corolla-tube; ovary 4-locular, densely ascending-hirsute externally 'with pale trichomes, the style glabrous, 1-1.5 mm long. Fruit yellow, finely warty- roughened, the body ellipsoid or obliquely-ellipsoid, 2-12.5 cm long, ca 1.6 cm broad, constricted basally to a stipe ca 7 mm long and 3 mm broad; seed 1, ellipsoid, ca 1.5 cm long, not compressed, the scar elliptic-obovate, 8-10 mm broad, extend- ing the length of the seed.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 12789
