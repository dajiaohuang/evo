    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, 200-350 mm tall. Leaves linear. Flowers on suberect pedicels, pink to mauve, fragrant, tepals 10-12 mm; anthers bicoloured yellow and grey, 3 upper and 3 lower, filaments connate ± halfway into a tube; style ± as long as lower stamens. Capsule subglobose, 7-10 mm long.
            textZh: Cyanella marlothii J.C.Manning & Goldblatt 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_14659_0
            locator: "SANBI/WFO archive Morphology row 33560; source identifier 14659.0; cited publication: Manning, JC. 2013. Tecophilaeaceae. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 161 - 162. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: This distinctive species has the 3+3 arrangement of stamens that characterizes sect. Trigella but is distinguished from other members in the section by having the filaments of all six stamens connate for half to two thirds of their length into a cylindrical or conical tube that completely encloses the ovary. Although the species is based on just a single collection, this comprises three essentially identical individuals. These plants were included in C. orchidiformis until now, despite their unique androecium. In this context it is sigificant that Marloth, who also collected true C. orchidiformis from Steinkopf on the same trip as C. marlothii, correctly identified the former but treated the latter as C. capensis (now C. hyacinthoides), a clear indication that he considered the Ploegberg collection to be distinct from C. orchidiformis, although he was misled by the connate filaments into misidentifying it as C. hyacinthoides. The latter does not occur in the Richtersveld and is in any event immediately distinguished by its 5 + 1 arrangement of anthers and by the spreading-geniculate pedicels.Among the members of sect. Trigella, Cyanella marlothii resembles C. ramosissima in its narrow leaves, 2-6 mm wide, pale mauve or blue flowers with darker veins, and apparently ± globose capsules but is separated from it by its smaller flowers with tepals 10-12 vs 13-20 mm long, bicoloured vs plain yellow anthers, and shorter style, ± 6 mm long and only slightly longer than the anthers vs 10-15 mm long and ± twice as long as the anthers.
            textZh: SANBI 条目提供了 Cyanella marlothii J.C.Manning & Goldblatt 的鉴别特征。
            sourceIds:
              - sanbi_7651_0
            locator: "SANBI/WFO archive Diagnostic row 47562; source identifier 7651.0; cited publication: Goldblatt, P; Manning, JC. 2012. A revision of Tecophilaeaceae subfam. Tecophilaeoideae in Africa. Bothalia 42(1): 21 - 41. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
