    facets:
      morphology:
        status: partially-supported
        claims:
          - text: An erect little-branched shrub with straight branches, glabrous throughout, closely leafy in the upper parts, becoming nude below and marked with leaf-scars; cortex brown. Leaves imbricated, erect-erecto-patent, elliptic-elliptic-ovate, 11-18 mm long, 6-13 mm wide, entire or sometimes laxly serrate, flat, coriaceous, with distinctly ciliolate or denticulate-ciliolate margins, ± distinctly midribbed, short-acuminate and apiculate. Peduncles lateral in the uppermost leaf-axils, erect-erecto-patent, 1-3 cm long, 0.5-1 mm thick, terete. Involucre widely campanulate-hemispherical, 7-12 mm wide, 4-7 mm high, probably completely connate when young, splitting into 4-6 segments; these connate to about 1/2-2/3, thin, herbaceous or submembranous, 4-8 mm long, 3-7 mm wide, indistinctly many-nerved, obtuse. Receptacle flat, indistinctly alveolate. Ray-florets 8-15, yellow. Tube 1.5-2 mm long, cylindrical. Lamina narrowly elliptic-oblong, 6-8 mm long, 2-3 mm wide, 4-nerved. Style terete with swollen base; style branches 0.5-0.7 mm long, truncate. Disc-florets c. 30-50. Corolla 4-5 mm long. Tube 1.2-1.7 mm long, cylindrical. Limb campanulate, 2.7-3.5 mm long, 3-5(-6)-lobed; lobes ovate-narrowly ovate, 1.2-1.5 mm long, 0.7-1.5 mm wide. Anthers 2-2.2 mm long incl. the ovate obtuse appendage. Style terete with swollen base; stylophore distinct, c. 0.3 mm long; style branches 0.5-0.8 mm long, with somewhat convex tips. Pappus bristles fairly numerous, 2-4 mm long, white, erect. Achenes narrowly elliptic-oblong, 5-6 mm long, c. 1 mm wide, glabrous, dark brown, with 10 light brown, distinct ribs.
            sourceIds:
