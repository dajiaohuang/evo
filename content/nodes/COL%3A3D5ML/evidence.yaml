            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: E. ciliatus resembles in foliage E. sulcatus and E. lateriflorus, but the involucre comes closest to that of E. spathaceus. From all these three species it differs by the glabrous achenes. The often four- or even three-lobed disc-florets are unusual but probably only occasional aberrations, evidently caused by a connation of adjacent corolla lobes.
