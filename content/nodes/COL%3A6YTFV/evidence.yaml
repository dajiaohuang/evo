          originalSourceText: Epiphytic shrub or vine; branches 30-35 cm long, slender, pilose, rooting at the nodes. Leaves 3 cm long, distichous, rhombic-ovate, somewhat oblique, This content downloaded from 192.104.39.2 on Tue, 14 May 2013 16:07:58 PMAll use subject to JSTOR Terms and Conditions1973] D'ARCY-FLORA OF PANAMA (Family 170. Solanaceae) 757 gradually diminishing in size to the apex of the branch, entire or slightly repand, basally rounded, truncate or sub-cordate, above densely pilose on the midvein, glabrate on the lamina, the lateral venation obscure, beneath glabrous; petioles diminishing from 5 mm to 1.5 mm long near the apex of the branch, pilose; minor leaves minute, 1-2 mm long, caducous. Inflorescence terminal on leafy branches or on nearly leafless, short, axillary spurs, several- to many-flowered, an open pendulous panicle or short raceme, the peduncle an extension of the twig, pilose with conspicuous pedicel scars; pedicels filiforrm, thickening and becoming turbinate in fruit, glabrate, 1.5-2 cm long. Flowers small, calyx 2 mm long, in bud craterform with acerose teeth, becoming lobed 1/3 the way down, the lobes rotund- mucronate, glabrous; corolla pink, rotate, ca. 8 mm across, lobed to near the base, the lobes narrow, acuminate, in bud forming a pointed apex; anthers 3 mm long, opening by very large terminal pores which continue to the base of the thecae; ovary glabrous (Greenman). Fruit sub-globose, slightly apiculate, 8 mmn across; seeds 2.5 mm long (Greenman).
          originalLanguage: en
