        usage:
          title: Parathesis fusca (Oerst.) Mez, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrubs, the branchlets stout, densely appressed ferruginous-tomentose. Leaves with slender petioles, the petioles 5-15 mm long, canaliculate, tomen- tose on the undersurface; leaf blades elliptic, oblong-elliptic, or rarely obovate- elliptic, 6-17 cm long and 2.5-6 cm wide, acuminate and decurrent on petiole basally, subabruptly acuminate apically, thinly chartaceous, obscurely bizonal, pubescent on the undersurface with appressed or subappressed sessile stellate trichomes, the marginal zone glabrescent, sparingly papillose above at first along the costa, rarely sparingly pubescent, the margin finely crenulate, the costa ele- vated and stellate-pubescent beneath, plane above, the lateral veins slender but conspicuous and reticulate on the undersurface, sparsely punctate. Inflorescences terminal, paniculate, to 15 (-22) cm long, ferruginous-pubescent or tomentose with short sessile stellate trichomes, papillose. Flowers corymbose or subrace- mose-corymbose, the calyx and corolla ferruginous-tomentose with short sessile stellate fine bristly trichomes, papillose; pedicels slender, 2.5-6 mm long; bud before anthesis ovoid, 4-5 mm long or sometimes slightly longer; sepals narrowly triangular, 1-1.6 mm long, attenuate-acuminate, the apex usually cuspidate and often recurved after anthesis, usually orange-punctate, but sometimes black-punctate; petals linear-lanceolate, 4-5 mm long or some- times slightly longer, acuminate, connate basally, papillose-tomentose within along margins and above the middle; stamens 2.5-3.5 mm long, the fila- ments stout, glabrous, ca. 1.4 mm long, the anthers erect, lanceolate, 1.8-2 mm long, dorsifixed one-third above the base, with a conspicuous oblong- triangular punctate area above the attachment and with glands extending down into the lobes, obtuse or rounded and minutely apiculate apically; ovary and style glabrous, the ovules 6-8, erect, uniseriate, enclosed, the placenta broadly obovoid, the style slender, 3.5-4.5 mm long. Fruit black-purple, globose, 7-9 mm in diameter (dry).
          originalLanguage: en
