        claims:
          - text: Bulbous geophyte, 22-30 cm. Leaves 2-4, emergent at flowering, strap-shaped. Flowers 4-10, erect to spreading, narrowly funnel-shaped, sulphur-yellow, sometimes with green median keels, stamens shortly exserted from throat.
            textZh: Cyrtanthus aureolinus Snijman 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13845_0
            locator: "SANBI/WFO archive Morphology row 8813; source identifier 13845.0; cited publication: Snijman, DA. 2012. Amaryllidaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 53 - 62. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: In its floral characters, particularly the form, position and colour of the flowers, Cyrtanthus aureolinus resembles C. ochroleucus from the Langeberg, Western Cape, and to a lesser degree the Eastern Cape and KwaZulu-Natal species, C. mackenii. All three species have somewhat tubular flowers with ñ equally long perigone tubes that widen gradually from the base to the throat and have small tepal lobes. Although the flowers of C. mackenii and C. ochroleucus vary in colour from yellow to cream-coloured or rarely white, they resemble the clear yellow flowers of C. aureolinus in being upright to somewhat spreading, and are seldom horizontally spreading. Despite their many similarities, these species can be distinguished florally mainly by the shape, size and position of the tepals, and by the length of the filaments. The narrowly ovate to oblong tepals in Cyrtanthus aureolinus and C. ochroleucus are more than twice as long as broad and slightly spreading, unlike those of C. mackenii which are ovate, less than twice as long as broad and patent or rolled back at anthesis. The filaments, however, are most diagnostic. In C. aureolinus both the outer and inner whorls of filaments (5 and 7 mm long respectively) extend beyond the perigone throat. Those of C. ochroleucus are slightly shorter (ñ 2 and ñ 4 mm respectively) and only the inner filaments extend beyond the throat. In contrast, both the outer and inner filaments in C. mackenii are very short (ñ 1 and ñ 1 mm respectively) and the stamens remain included in the perigone throat or within the upper part of the tube. If the features of the tepals and stamens that characterize the species are also significant for determining affinities, then Cyrtanthus aureolinus is closest to C. ochroleucus. The perigone throat of C. aureolinus, however, is wider than that of C. ochroleucus and its leaves are broad and smooth, unlike the narrow leaves of C. ochroleucus which are minutely papillate on the margin and midvein. Both species are found in the fynbos of the Western Cape where they occupy different habitats and display dissimilar flowering habits.
