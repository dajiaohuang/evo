          - text: Gasteria croucheri is a very variable but distinct species, characterized by its large perianth 35-40 mm long inflated in the lower and upper half, and slightly constricted in the middle. It is further characterized by its rosette of spreading triangular-lanceolate or triangular (rarely linear), often glaucous leaves. The juvenile leaves may be asperulous or smooth. Its inflorescence and habit vary. In floral characters it is closest to G. batesiana and G. acinacifolia, the former a smaller sister species (perianth similar) with a distinctly rugulose-tuberculate leaf epidermis and a simple raceme. G. acinacifolia is a larger species with taller panicles and larger bracts (20 mm long) It is also clearly distinguished by its tuberculate juvenile leaves, larger capsules (30-43 mm) and seeds of up to 8 mm in diameter. G. croucheri can also be confused with G. excelsa, which is also a large robust species, but the latter has a smaller perianth that is distinctly gasteriform basally for more than half of its length.
