      lifeHistory:
        status: not-assessed
      ecology:
        status: partially-supported
        claims:
          - text: It is found in dry, hot, rocky and wooded river valleys, and is almost always associated with quartztitic sandstone. The habitat usually consists of sheer cliffs and the plants occur in the shade of the northern variation of valley bushveld. They are also found on rocks in coastal forest and thornveld. The soil is shallow and humus-rich, and the plants seem to be confined to southern and eastern aspects. Precipitation is mainly in summer and ranges from 500 to 1000 mm per annum. The climate is hot during summer and mild in winter. Populations of this species at Oribi Gorge (southern Natal) occur on sheer cliffs, where they grow in the shade of short xer phytic trees and shrubs.
