    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous herb, up to 1 m high. Bracts 10-18 x 4-8 mm, main veins 5 each side of midvein, white to lightly flecked, tip of each bract not reaching base of second bract above it. Perianth 19-27 mm long. Stigma held 5-12 mm below top of perianth. Flowers mauve to magenta-pink.
            textZh: Dierama mossii (N.E.Br.) Hilliard 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_11118_0
            locator: "SANBI/WFO archive Morphology row 1667; source identifier 11118.0; cited publication: Herman, PPJ; Retief, E. 1997. Plants of the northern provinces of South Africa: Keys and diagnostic characters. Strelitzia 6: 1 - 681. National Botanical Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: A tufted species with stems up to 1000 mm tall and leaves 1.5-4.5 mm wide, and relatively lax spikes of mauve to magenta-pink flowers with perianth 18-25 mm long. The bracts are very delicate and usually speckled but sometimes pure white. Dierama medium, which is sympatric with D. mossii in southeastern Mpumalanga and Eswatini, has more crowded spikes of mostly smaller flowers, the perianth mostly 13-18 mm long with anthers 4.5-6.0 mm long.
            textZh: SANBI 条目提供了 Dierama mossii (N.E.Br.) Hilliard 的鉴别特征。
