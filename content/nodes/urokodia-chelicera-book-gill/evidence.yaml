      statement: Micro-CT reconstructions of Chengjiang Urokodia aequalis reveal pincer-like short great appendages, overlapping exite flaps and a seven-segmented head; their interpretation as intermediates toward chelicerae and book gills and the upper stem-chelicerate placement are morphology-matrix results.
