    - 三维附肢解剖得到直接成像，而体节同源与分支位置取决于复原和评分。
  claim-statements.zh:
    - 澄江 Urokodia aequalis 的显微 CT 复原揭示钳状短大附肢、重叠外叶片与七节头部；把它们解释为通向螯肢和书鳃的中间构型，以及其螯肢动物上部干群位置，均为形态矩阵结果。
