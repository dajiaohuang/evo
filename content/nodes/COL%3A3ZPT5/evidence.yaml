        usage:
          title: Mendoncia brenesii Standl. & Leonard, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Stem a suffrutescent vine, scandent, subquadrangular, grooved, glabrous to sparingly and minutely strigose. Leaves elliptic to 12 cm long, blunt tip with a mucro 1-2 mm long, basally rounded, glabrous except for sparingly and mi- nutely strigose on the costa, the margins entire; petioles to 2.5 cm long, sparingly strigose. Flowers in axillary umbels of 5-10 flowers, radiating from short, flat, rounded, axillary spurs; pedicels ca. 1 cm long, sparingly strigose; bracts ovate, to 14 mm long, 7 mm wide, the apex acuminate, the base rounded sparingly strigose without; corolla white, to 1.5 cm long, glabrous, the tube ca. 8 mm long and 3 mm in diameter, slightly expanded at the base, the lobes obcordate, ca. 7 mm in diameter; stamens included, the filaments ca. 1.5 mm long.
