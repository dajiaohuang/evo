        claims:
          - text: Repent, often mat-forming perennial. Roots thin, fibrous. Leaves distichous, sessile, succulent, ovate to ovate-elliptic or occasionally elliptic, 10-35(-40) x 5-20 mm, puberulous, often mottled with maroon above, veins contrastingly pale above. Inflorescences axillary, perforating the sheaths and largely hidden beneath leaves, consisting of 1(-2) short, few-flowered cincinnus. Flowers perfect, 7-10 mm wide; petals all pale lilac, paired petals 4-5.7 x 3.1-4.5 mm, medial petal cup-shaped, 3.5-4.7 x 2.7-4 mm; filaments fused basally, lateral stamen filaments 3-3.5(-4.5) mm long; style 2.7-3.2(-3.6) mm long. Capsules obovate-elliptic, indehiscent or partially dehiscent, trilocular, 3-4 x 2,1-2.5(-3) mm, dorsal locule 1-seeded, ventral locules 2-seeded. Seeds 1.25-1.8 mm long, testa shallowly reticulate.
