    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Scandent shrub or semi-climber, 1-6 m tall; stem ribbed, densely or more sparsely appressed pubescent when young, glabrescent, glandular. Leaves usually opposite or suboppposite, rarely alternate, deltoid-ovate or rhombic to hastiform, (10-)20-50 x (10-)15-40 mm, strongly 3-nerved from base, margins coarsely or sinuous-toothed, rarely entire, subacute to obtuse, base cuneate, decurrent on petiole, appressed puberulous and conspicuously gland-pitted, glabrescent, drying dark above and paler beneath, petiole 5-10 mm long. Capitula in cymose panicles on weakly ascending branches in upper axils, sweetly scented, ±10-flowered. Involucre campanulate, 4-5 mm diam., bracts 3- or 4-seriate, imbricate, thinly villous and glandular with membranous margins, ciliate, outer bracts narrowly ovate, acute, 2-3 mm long, inner elliptic-lanceolate, obtuse, 4-6 mm long, 3-veined. Florets pale mauve, lilac or pale pink to creamy white, 5.0-6.5 mm long, corolla tube narrowly funnel-shaped, lobes linear, up to 3 mm long. Anthers sagittate, ±2 mm long. Style up to 7 mm long, branches, ±3 mm long, pubescent on back. Cypselas narrowly turbinate, sharply 5-ribbed, 1.5-2.5 mm long, pilose and glandular; pappus biseriate, white, scales ±0.8 mm long, bristles ±5 mm long, acute.
            sourceIds:
              - sanbi_16036_0
            locator: "SANBI/WFO archive Morphology row 74015; source 16036.0; publication: Swelankomo, N; Manning, JC. 2014. The genus Distephanus (Asteraceae: Vernonieae) in southern Africa. S. African J. Bot. 94: 238 - 248. [http://dx.doi.org/10.1016/j.sajb.2014.07.007]. [Copyright held by the South African Association of Botanists (2014); http://www.sciencedirect.com/science/journal/02546299]. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Usually readily distinguished from other southern African species by its opposite or subopposite (rarely alternate) leaves with deltoid-ovate and sinuate-dentate or hastiform blade. The leaves and young stems are roughly pubescent with ± appressed eglandular hairs and sessile glands. The 5-ribbed cypselas with slender, white pappus bristles are also characteristic. Occasional specimens with alternate, entire leaves may be confused with the slightly later-flowering D. anisochaetoides where the two co-occur around Durban but that species has the young leaves and stems whitish felted with shaggy, eglandular hairs that persist on the older stems as a tissue-paper like indumentum between the ribs, exposing the prominent, sessile glands; stiffly divaricate and ± flexuous or zigzag inflorescence branches; capitula with shorter inner bracts ±3 mm long, and more numerous, ±15 florets; and 8- to 10-ribbed cypselas with a buff pappus with the inner bristles ± clavate.
