        usage:
          title: Salvia occidentalis Sw., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Herbs, annuals, prostrate, the branches ca 30-40 cm long, finely pubescent with small ? curved hairs, or glabrous. Leaves ovate to ? deltoid, acute, crenate- serrate along the distal margins, the bases obtuse, some truncate or rarely attenuate, to 6 cm long and 3 cm wide, glabrous, or the lower surface pubescent with short hairs; subsessile to petioles ca 1 cm long on lower leaves. Inflores- cences verticils, 6-10-flowered, pubescent with glandular-capitate hairs, the bracts broadly ovate and long-acuminate, or rhomboid, ca 2-3 mm long, pubescent. Flowers with pedicels ca 1-2.5 cm long; calyx tubular, ca 2-4 mm long at maturity, with glandular-capitate hairs, bilabiate, the upper lip mostly 5-9-veined; corolla tubular, ca 2.5 mm long, blue with white streaks, naked within, the upper lip ca 1.2-1.8 mm long, the lower lip weakly 3-lobed, ca 1.5-2 mm long; stamens mounted on the corolla throat, the anthers slender, ca 1 mm long; style slender, the stigma 2-lobed, the lobes flattened. Nutlets smooth, ca 1.5 mm long, usually only 1 maturing.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 6623
