    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Perennial. Rhizome elongate, 5-17 mm thick; scales brown. Culms 1.3-1.8(-2) m tall, glabrous. Leaves mostly crowded towards base of culm, 20-40 mm broad, bases sometimes corky, up to 5 mm thick, glabrous; sheaths usually split almost to the base from concave mouths. Inflorescence a single terminal panicle without (very rarely with) foliaceous bract, 100-200 x 50-120 mm. Male spikelets sessile, 3.5-4.5 mm long; glumes reddish-brown, glabrous or hispidulous. Female glumes similar, 3.5-5 mm long. Achene broadly ovoid to subglobose, 1-3.5 x 2.5-2.8 mm, glabrous, smooth, grey-brown; hypogynium small, trilobed, lobes short, broadly triangular, white or finely red-brown striate.
            textZh: Scleria poiformis Retz. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_9620_0
            locator: "SANBI/WFO archive Morphology row 79710; source identifier 9620.0; cited publication: Hennessy, EF. 1985. The genus Scleria in southern Africa. Bothalia 15(3 & 4): 505 - 530. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Perennial, stout, aquatic, with evergreen aerial parts. This species is unlikely to be confused with any other. It is very robust, forms dense, almost pure stands in shallow coastal pans, has leaves which are broader and thicker than those of any other local species and is the only southern African species other than S. lacustris with a very small hypogynium with three obtusely triangular lobes. The two species are allopatric and differ in habit.
            textZh: SANBI 条目提供了 Scleria poiformis Retz. 的鉴别特征。
