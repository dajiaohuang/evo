    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Tufted and succulent perennial herb, ± 35 (occasionally up to 80) mm tall. Stems 4-angled. Corolla campanulate, tube short, wider than long, widening at mouth, densely concentrically lined. Inner corona lobes much exceeding anthers, regularly clavate, up to 2 mm long, apex knob-like. Flowers buff to brownish outside, inside brownish ground colour marked with brown to dark crimson, broken transverse lines and spots.
            sourceIds:
              - sanbi_11118_0
            locator: "SANBI/WFO archive Morphology row 908; source 11118.0; publication: Herman, PPJ; Retief, E. 1997. Plants of the northern provinces of South Africa: Keys and diagnostic characters. Strelitzia 6: 1 - 681. National Botanical Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Specimens of H. loeseneriana form dense mats, quite often up to 0.5 m in diameter and even larger on occasion. In these clumps the 4-angled stems are mostly very short (averaging 15-25 mm tall) and are packed extremely tightly.The flowers are small and quite inconspicuous, with a slightly nodding habit. This often keeps them among the stems so that they are somewhat hidden, partially constricted by the surrounding stems and are unable to open fully. When the flowers are able to open properly, they consist of a short, cupular tube with the lobes spreading from its mouth. Their rather unattractive, pinkish exterior belies the striking markings on the inside. These are usually narrow, broken maroon lines on cream which become concentric lines on the tube and solid red around the corona. The flower emits a faint odour of excrement. The inside of the tube is covered with papillae from halfway up the tube (where they are longest) and they then become much smaller on the lobes.The corona has the usual dark maroon outer lobes adpressed to the base of the corolla tube and somewhat paler inner lobes which end abruptly in bristly, rather swollen apices. Huernia loeseneriana is probably closest to H. stapelioides, which grows at lower altitudes in flat areas. In H. stapelioides the corolla lobes are considerably longer than broad, whereas they are about as wide as long in H. loeseneriana and this makes the flower somewhat larger in H. stapelioides. Furthermore, the papillae inside the flower are longer in H. stapelioides than in H. loeseneriana. The inner corona usually has a much more elaborate, foot-shaped apex in H. stapelioides, though this has been found to be variable.
