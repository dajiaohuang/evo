        claims:
          - text: Cormous geophyte, 8-15 cm, tunics woody, imbricate, stem velvety. Leaves sword-shaped. Flowers blue, tepals spreading, stamens unequal.
            textZh: Geissorhiza inaequalis L.Bolus 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 6786; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Geissorhiza inaequalis is evidently closely related to common and widespread Western Cape species G. aspera, and they can be difficult to distinguish when dry. Both have a similar habit, flat, sword-shaped leaves and minutely velvety stems. Geissorhiza aspera typically has deep blue-violet, less often white or purple flowers, and at flowering time the upper parts of the floral bracts are often dry and rusty brown. The stamens are only slightly unequal or nearly equal, whereas G. inaequalis has larger, pale purple flowers, and green or pale, membranous bracts at flowering time, the brown colouration developing only after the flowers fade. It also has one filament about half as long as the others and even one anther may be slightly shorter than the other two. Geissorhiza inaequalis may also be confused with G. heterostyla, which is similar in habit and has one short filament. The latter, however, has leaves that are ciliate along the raised margins and main vein, and a short, dry scale-like bract in the upper part of the stem. Dry material must be examined carefully to avoid misidentification.
            textZh: SANBI 条目提供了 Geissorhiza inaequalis L.Bolus 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 94726; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
