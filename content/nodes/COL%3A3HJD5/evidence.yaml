        usage:
          title: Guarea kunthiana A.Juss., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Tree to about 25 m. tall, frequently shrubby at higher elevations in Central America. Leaves approximately 18-40 cm. long; leaflets 2-3(-5) pairs, broadly elliptical, occasionally broadly obovate, the base obtuse to acute, the apex obtuse to obtusely long-acuminate, the veins frequently darker than the blade beneath, glabrous above and beneath, rarely minutely puberulent along the veins beneath. Inflorescences shorter than the leaves (rarely elongate in specimens from the upper Amazon drainage), often cauliflorous, 3-18 cm. long (in specimens seen from Panama), paniculate, rarely nearly racemose, glabrous, infrequently minutely puberulent. Flowers white or cream, sometimes tinged with rose, 4 (rarely 5)- merous; calyx cupulate, frequently split at one side, the lobes rounded to very short minutely puberulent without; staminal tube usually entire, glabrous; anthers 8 (-10); ovary glabrous, borne on a thick gynophore. Capsule dull red, glabrous, usually 4-valved, the largest capsule seen about 4 cm. in diam., usually definitely 4-lobed, shorter than broad, sometimes lenticellate, 4-celled, with 1 or 2 seeds per cell; seeds 4/5 covered by a red aril, the remaining 1/5 covered by a white caruncle on the axial side.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 7857
          archiveSourceId: A26E74AD-C616-4352-B93E-487179240901
