    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Dwarf shrub, erect, up to 400 mm tall, diam. c. 700 mm, with a tangled habit. Branches articulated, cortex green and succulent but not persistent on older internodes, falling off to reveal dark bark. Internodes cylindrical to rounded, epidermal bladder cells xeromorphic, isodiametric (equal-sided), in longitudinal rows, in cross-section, cells tall, distinguishable as a thick white layer around the green cortex. Leaves semi-cylindrical, shortly connate when young, with mesomorphic epidermal bladder cells, sometimes with microscopic cilia at the base, deciduous. Inflorescences are few-flowered dichasia, diam. 5-10 mm. Calyx with 4 lobes, lobes shortly connate and erect during anthesis. Flowers Petaloid staminodes ('petals') white, free (not joined), some longer ones recurving over calyx lobes, filamentous staminodes absent. Ovary semi-inferior, placentation axile. Fruit a hygrochastic capsule with 4 locules, diam. 2-3 mm, valve wings in-flexed over the expanded valves, expanding keels connate in pairs, without seed bags, seeds D-shaped, cream-coloured or light brown with a darker rim.
            sourceIds:
              - sanbi_3482_0
            locator: "SANBI/WFO archive Morphology row 104698; source 3482.0; publication: Pierce, SM; Gerbaulet, M. 1997. Brownanthus Schwantes (Mesembryanthemoideae, Aizoaceae): Two new species and a new combination from the Richtersveld and southwestern Namibia. Aloe 34(1-2): 42 - 44. [All rights reserved]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Brownanthus neglectus is similar to B.arenosus (Schinz) Ihlenf. & Bittrich in lacking conspicuous cilia at the leaf bases and having young leaves connate or joined at the base. However, B. neglectus differs in being much more finely branched and tangled in appearance, and the succulent green cortex does not persist for long, with the result that older branches have a dark, blackish bark. The 4-locular capsule lacks seed bags.
