            locator: "SANBI/WFO archive Morphology row 35544; source 14771.0; publication: Steiner, KE. 2013. Scrophulariaceae: Nemesia. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 467 - 470. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Nemesia hemiptera is easily recognized by its small, white flowers with a tiny spur and its seed that is winged on only one side. It can be distinguished from the related N. maxii by its colour (white vs violet), the size of the corolla < 10 mm long, the smaller spur (< 1 mm vs > 3 mm).
