    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Wiry-stemmed annual, up to 310 mm tall. Leaves lanceolate to ovate, sub-glabrous to sparsely glandular puberulous, entire to shallowly dentate. Flowers small, axillary or in lax racemes, calyx lobes narrowly lanceolate, acute, glandular pilose, corolla 6.2-9.6 mm long; white with brown rectangular spot above mouth, spur nib-like, 0.5-0.8 mm long. Capsule ovate to oblong, ± as wide as long, 3.4-4.6 x 3.5-4.5 mm.
            sourceIds:
