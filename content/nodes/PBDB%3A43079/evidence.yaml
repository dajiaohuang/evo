  claims:
    - subjectId: taxon:chalicotherium
      claimKind: scientific
      claimType: morphology
      statement: Southern German chalicotheriine material identified as Chalicotherium goldfussi and the historical combination Chalicotherium (Anisodon) grande preserves large ungual phalanges and shortened hind limbs, while claw use and upright feeding posture remain functional reconstructions.
      confidence: medium
      confidenceRationale: The primary study reviews the relevant postcranial anatomy and clearly labels its historical taxonomy. Medium confidence preserves the distinction between observed bones and reconstructed posture or behavior.
      referenceLinks:
        - referenceId: schulz-2007-chalicothere-feeding
          relation: supports
          pages: 5–23
          figure: Figures 1, 5 and 6; Tables 2–7
          quoteLocator: Sample definition, dental-wear results and discussion of browse, bark/twig abrasion and reconstructed posture
    - subjectId: taxon:chalicotherium
      claimKind: scientific
      claimType: taxonomy
      statement: Chalicotherium is retained at genus rank, but the evidence profile distinguishes C. goldfussi from material published under the historical combination Chalicotherium (Anisodon) grande.
      confidence: medium
      confidenceRationale: The primary study’s own specimen labels prevent obsolete combinations from being silently treated as current genus membership.
      referenceLinks:
        - referenceId: schulz-2007-chalicothere-feeding
          relation: supports
          pages: 5–23
          figure: Figures 1, 5 and 6; Tables 2–7
          quoteLocator: Sample definition, dental-wear results and discussion of browse, bark/twig abrasion and reconstructed posture
    - subjectId: taxon:chalicotherium
      claimKind: scientific
      claimType: fossil-range
      statement: The atlas’s 15.97–5.33 Ma occurrence envelope is provisional; the cited wear study samples southern German MN5–MN9 material and does not establish exact genus-wide first or last appearances.
      confidence: low
      confidenceRationale: Medium confidence applies to the study’s dated locality set, not the occurrence-derived global display endpoints.
      referenceLinks:
        - referenceId: schulz-2007-chalicothere-feeding
          relation: supports
          pages: 5–23
          figure: Figures 1, 5 and 6; Tables 2–7
          quoteLocator: Sample definition, dental-wear results and discussion of browse, bark/twig abrasion and reconstructed posture
    - subjectId: taxon:chalicotherium
      claimKind: scientific
      claimType: ecology
      statement: Sampled chalicotheriines show browse-dominated feeding with unusually abrasive bark or twig components; reconstructed claw use and posture remain functional interpretations.
      confidence: medium
      confidenceRationale: Dental wear directly supports diet, while limb function is explicitly treated as interpretation rather than behavior observed in fossils.
      referenceLinks:
        - referenceId: schulz-2007-chalicothere-feeding
          relation: supports
          pages: 5–23
          figure: Figures 1, 5 and 6; Tables 2–7
          quoteLocator: Sample definition, dental-wear results and discussion of browse, bark/twig abrasion and reconstructed posture
    - subjectId: taxon:chalicotherium
      claimKind: scientific
      claimType: biogeography
      statement: The detailed evidence is bounded to sampled Miocene localities in southern Germany; it is not used as proof of a complete Europe–Asia genus distribution.
      confidence: medium
      confidenceRationale: The source’s specimen and locality list directly supports the narrower geographic wording.
      referenceLinks:
        - referenceId: schulz-2007-chalicothere-feeding
          relation: supports
          pages: 5–23
          figure: Figures 1, 5 and 6; Tables 2–7
          quoteLocator: Sample definition, dental-wear results and discussion of browse, bark/twig abrasion and reconstructed posture
  claim-rationales.zh:
    - 主研究综述相关的颅后解剖，并清楚标明历史分类。中等置信度保留了所观察骨骼与所重建姿势或行为之间的区别。
    - 分类主张以所引主研究或系统综述中的明确分类与样本为界，不把导航父级写成直接祖先。
    - 化石范围主张把论文直接约束的区域或样本年代与图集的临时导航端点分开，端点不被当作精确起源或灭绝时刻。
    - 生态主张区分直接测得的磨耗或同位素信号与栖息地、行为推断，并保留物种、地点和时代边界。
    - 生物地理主张按论文实际覆盖的地点和区域表述，不把区域样本扩写为完整全球分布。
  claim-statements.zh:
    - 爪兽属按所引系统研究采用当前分类层级；导航父级仅表示分类关联，不表示直接祖先。
    - 爪兽属的图集数值范围仍是临时导航包络；主研究只独立约束其明确讨论的区域或样本年代，端点不是精确起源或灭绝时刻。
    - 爪兽属的生态档案按取样物种、地点与方法限定食性和运动推断，不把局部结果推广为整个类群的固定生态。
    - 爪兽属的地理档案只覆盖所引研究明确讨论的区域与地点，并非完整的全球产出分布。
    - 德国南部被鉴定为金氏爪兽及历史组合“爪兽（Anisodon）grande”的爪兽亚科材料保存了大型末端趾骨和缩短的后肢；爪的用途与直立取食姿势仍属功能重建。
