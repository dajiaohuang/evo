          title: Brosimum utile (Kunth) Oken, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: "Trees 20-25 m. in height, with young twigs rather stout and with rather close internodes, minutely and indefinitely puberulent when young, eventually develop- ing a rather thick periderm. Leaves rather broadly oblong, abruptly and acutely acuminate, rounded at the base, 10-25 cm. long, 3-10 cm. broad, subcoriaceous, sparsely puberulent to glabrate, the petioles stout, 5-15 mm. long; stipules amplex- icaul, lanceolate, long-acuminate, 2-3 cm. long, pilosulose, leaving oblique scars nearly encircling the stem. Inflorescences globose, monoecious, about 1 cm. in diameter, the peduncle of about equal length, rather stout, staminate flowers: without an obvious perianth and with a single stamen with a broadly oval anther"
          originalLanguage: en
          sourceField: general
