      claimType: biogeography
      statement: Hadrosauridae is represented by the taxa and areas sampled in Prieto-Márquez’s event-based historical-biogeographic analysis; inferred dispersal routes are model results, not observed migrations or a complete global range.
      confidence: medium
      confidenceRationale: The analysis explicitly combines a sampled phylogeny with geographic areas and time slices. Medium confidence preserves dependence on topology, coding and fossil sampling.
      referenceLinks:
        - referenceId: prieto-marquez-2010-hadrosaurid-biogeography
          relation: supports
          pages: 503–525
          figure: Figures 1–5; Tables 1–2
          quoteLocator: Methods; area coding; event-based results; Discussion
    - subjectId: taxon:hadrosauridae
      claimKind: scientific
      claimType: fossil-range
      statement: Hadrosauridae is displayed at 100.5–66 Ma only as the source's global historical-biogeography sample, not an exhaustive family record or exact endpoints. The interval is a source-bounded sample window, not a global FAD, LAD, divergence date, continuous occupancy claim or direct-ancestor assertion.
      confidence: medium
      confidenceRationale: Hadrosauridae uses Prieto-Márquez, A. (2010) because the cited pages and locator expose the sampled taxon, specimen or living sequence set. Confidence is medium and applies only to Hadrosaurid fossil areas and intervals sampled by Prieto-Márquez; broader endpoints remain unclaimed.
      referenceLinks:
        - relation: supports
          referenceId: prieto-marquez-2010-hadrosaurid-biogeography
          pages: 503–525
          figure: Figures 1–5; Tables 1–2
          quoteLocator: Methods; area coding; event-based results; Discussion
        - relation: contextualizes
          referenceId: ics-2026-06
          pages: International Chronostratigraphic Chart v2026/06
          figure: Global chronostratigraphic scale
          quoteLocator: Numerical boundaries for named geological stages used to bound the source sample
  claim-rationales.zh:
    - 分析明确联合取样系统树、地理区域与时间片；中等置信度保留对拓扑、编码和化石取样的依赖。
    - Hadrosauridae 采用 Prieto-Márquez, A.（2010）的论文，因为所引页码与定位符直接标示了研究采样的类群、标本或现生序列集合。中等置信度仅适用于 Hadrosaurid fossil areas and intervals sampled by Prieto-Márquez；更宽泛端点保持未声明。
  claim-statements.zh:
    - 鸭嘴龙科表示 Prieto-Márquez 事件型历史生物地理分析中取样的类群和区域；推断扩散路线是模型结果，不是被观察到的迁徙或完整全球范围。
    - Hadrosauridae 仅以 100.5–66 Ma 展示为论文历史生物地理分析所采样的全球记录，而非穷尽的科级记录或精确端点。该区间是来源限定的样本窗口，不是全球首现、末现、分化日期、连续占据或直接祖先断言。
