    facets:
      morphology:
        status: partially-supported
        claims:
          - text: In a micro-CT and geometric-morphometric analysis of 13 selected Macaca fascicularis mandibular second molars (M2s), molars with accessory cusps were larger and had shorter relative cusp heights than molars without accessory cusps; peripheral-cusp presence was associated with more centrally positioned primary cusps. These sample patterns were broadly consistent with the patterning-cascade model, but the authors state that the model did not explain every form of accessory-cusp expression in this sample.
            textZh: 一项对 13 颗经筛选的长尾猕猴下颌第二臼齿（M2）进行的微型 CT 与几何形态测量研究发现，带附加牙尖的臼齿体积较大、相对牙尖高度较短；周缘牙尖的出现与主要牙尖位置更居中相关。样本中的这些模式总体符合模式级联模型，但作者指出，该模型无法解释本样本中所有附加牙尖的表现。
            sourceIds:
              - chapple2024patterning
            locator: Abstract—Design, Results and Conclusions; Methods §2.1—Study sample.
            placeTimeScope: Specimen-based study from a single primate-centre collection; the cited abstract does not provide specimen collection dates. The article first appeared online 2024-08-08 and was published in the November 2024 issue.
            lifeStatus: Specimen-based rather than a live field-population sample; the cited abstract does not establish the wild or captive history of each specimen.
            originalLanguage: en
        gaps:
          - The evidence is limited to 13 selected mandibular second molars from one research collection; it does not establish variation across populations, ages, dental positions, or the full species range, and it does not resolve all accessory-cusp expression.
      lifeHistory:
        status: not-assessed
        gaps:
          - No life-cycle, reproductive, growth, survival, or longevity evidence was assessed.
      ecology:
        status: partially-supported
        claims:
          - text: At Mt Calebasses, Mauritius, one group of 19–23 long-tailed macaques had a 34.9-ha total home range during the study. Its mean monthly range was 10.6 ± 3.0 ha during the high-fruit period (February–June 2020) and 17.8 ± 5.6 ha outside that period; monthly range was negatively correlated with fruit availability (r = −0.65, adjusted p = 0.037). This is a one-group, one-site seasonal result, not a species-wide estimate.
            sourceIds:
              - reinegger2023
            locator: Results, Effects of Fruit Availability on Home Range; paragraphs beginning ‘Our study group had a total home range’; Figure 3.
            placeTimeScope: Mt Calebasses, Mauritius; one study group observed from December 2019 to December 2020, with the high-fruit period defined as February–June 2020.
            lifeStatus: One free-ranging introduced (non-native) group; not representative of native-range populations.
            originalLanguage: en
          - text: At this site, invasive plants accounted for 98% of plant-feeding scans and 97% of fruit-feeding scans. In the scan-based fruit-feeding observations, recorded dietary proportions were concentrated in invasive Litsea sp. (40.2%), Psidium cattleyanum (39.3%), and Flacourtia indica (9.5%). The authors discuss possible seed-dispersal effects, but these observations do not measure germination, seedling recruitment, or realized plant-invasion rates.
            sourceIds:
              - reinegger2023
            locator: Results, Effects of Food Availability on Diet; paragraphs beginning ‘The macaques spent the largest percentage’ and ‘Macaques consumed plant parts’; Table S2.
            placeTimeScope: Mt Calebasses, Mauritius; feeding observations of one study group during the December 2019–December 2020 field study.
            lifeStatus: One free-ranging introduced (non-native) group; no inference to other populations or the native range.
            originalLanguage: en
        gaps:
          - One field study covers one introduced group at one Mauritius site; species-wide habitat use and diet, population variation, and causal or realized effects on plant invasion remain unassessed.
      evolution:
        status: partially-supported
        claims:
          - text: Bailey et al. compared whole-genome data from allopatric and parapatric rhesus and cynomolgus macaque sample groups. They reported 184 candidate genes consistent with reinforcement-related patterns and Y-chromosome introgression from M. mulatta into M. fascicularis populations, while describing the results as consistent with, rather than proof of, reinforcement. This is a study-specific comparative result, not a complete species phylogeny.
            sourceIds:
              - bailey2023
            locator: Abstract; Results; Figures 1 and 3.
            placeTimeScope: Comparative samples grouped as allopatric or parapatric; study published 2023. The claim reports genomic analysis, not a dated natural event or geographic range assessment.
            lifeStatus: Biological sample provenance and group definitions are limited to those in the comparative whole-genome study; not a species-wide census.
            originalLanguage: en
        gaps:
          - One comparative genomic study does not resolve the species' full phylogeny, divergence history, or all introgression events.
      distribution:
        status: not-assessed
        gaps:
          - Study sample group origins and a referenced range map do not constitute a reviewed current or historical range inventory.
      fossil:
        status: not-assessed
        gaps:
          - The selected study does not assess the fossil record.
      conservation:
        status: not-assessed
        gaps:
          - No formal conservation assessment, global population trend, or risk category was reviewed.
