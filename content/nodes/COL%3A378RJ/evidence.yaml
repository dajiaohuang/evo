    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Shrub or small tree, up to 5 m high. Branchlets slender, leafy. Leaves orbicular, 15-50 x 10-50 mm. Cymes in axils of upper leaves often overtopping them, 25 mm long. Flowers white, turning cinnamon-rufous with age.
            sourceIds:
              - sanbi_11118_0
            locator: "SANBI/WFO archive Morphology row 1759; source 11118.0; publication: Herman, PPJ; Retief, E. 1997. Plants of the northern provinces of South Africa: Keys and diagnostic characters. Strelitzia 6: 1 - 681. National Botanical Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: D. autumnalis differs from the form of typical D. rotundifolia, which occurs in the eastern and central areas of southern Africa, in that it flowers in late summer and autumn together with its leaves, and not in early spring only, on more or less leafless branches. From all forms of D. rotundifolia, including those in South West Africa/Namibia, D. autumnalis differs mainly in that its slender stems do not develop a rough bark. This feature can be determined by the examination of a cross-section of a branchlet. The outer layer of D. autumnalis is thin and solid, whereas that of D. rotundifolia is thick and porous. A further diagnostic character is that the pubescence on the ovary of D. rotundifolia is setose as well as stellate-tomentellous, whereas in D. autumnalis it is stellate-tomentose without setae. In the slender peduncles and pedicels, the comparatively thin leaves, and the habit, our species resembles D. cymosa, from which it can be readily distinguished by the leaf shape. In D. cymosa the leaves are acuminate in the upper third, not suborbicular, and more or less rounded at the apex.
            textZh: SANBI 条目提供了该种的鉴别特征。
