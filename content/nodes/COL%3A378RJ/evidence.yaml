            locator: "SANBI/WFO archive Diagnostic row 65760; source 178.0; publication: Verdoorn, IC; Herman, PPJ. 1986. Revision of the genus Dombeya (Sterculiaceae) in southern Africa. Bothalia 16(1): 1 - 9. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
