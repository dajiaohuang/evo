  claims:
    - subjectId: taxon:archaeopteryx
      claimKind: scientific
      claimType: fossil-range
      statement: The Painten specimen extends referred Archaeopteryx material into the earliest Tithonian; the 150–148 Ma atlas interval is a formation- and specimen-bounded envelope, not the origin of Avialae or crown birds.
      confidence: medium
      confidenceRationale: A referred specimen and geological setting directly support the extension, but numerical endpoints summarize correlated horizons and referral is taxonomic; medium confidence prevents a false exact FAD.
      referenceLinks:
        - referenceId: rauhut-2018-oldest-archaeopteryx
          relation: supports
          quoteLocator: Geological setting; Systematic palaeontology; Figures 1–5; Table 1
    - subjectId: taxon:archaeopteryx
      claimKind: scientific
      claimType: biogeography
      statement: All securely referred Archaeopteryx specimens discussed here come from Late Jurassic Bavarian lithographic limestones; that observed concentration does not demonstrate global absence elsewhere.
      confidence: high
      confidenceRationale: Named specimens and quarries directly establish the Bavarian record. High confidence concerns occurrence locations only and explicitly avoids an absence or endemism claim.
      referenceLinks:
        - referenceId: rauhut-2018-oldest-archaeopteryx
          relation: supports
          quoteLocator: Geological setting; Figure 1; specimen and locality catalogue
    - subjectId: taxon:archaeopteryx
      claimKind: scientific
      claimType: taxonomy
      statement: Archaeopteryx is a Late Jurassic avialan outside crown Neornithes; substantial anatomical variation among referred specimens does not make it the direct ancestor of living birds.
      confidence: high
      confidenceRationale: Specimen anatomy and repeated phylogenetic placement support avialan affinity, while crown definition excludes the genus. High confidence applies to that scope, not to one immutable internal avialan topology.
      referenceLinks:
        - referenceId: rauhut-2018-oldest-archaeopteryx
          relation: supports
          quoteLocator: Systematic palaeontology; phylogenetic discussion; Table 1
    - subjectId: taxon:archaeopteryx
      claimKind: scientific
      claimType: ecology
      statement: Wing-bone geometry is compatible with short-burst active flight in comparative models, but the evidence does not directly observe behaviour, endurance or a modern crown-bird flight stroke.
      confidence: medium
      confidenceRationale: Synchrotron cross-sections provide direct geometry, while locomotor category comes from comparison with living birds. Medium confidence preserves that model boundary.
      referenceLinks:
        - referenceId: voeten-2018-archaeopteryx-flight
          relation: supports
          figure: Figures 1–4
          quoteLocator: Voeten Figures 1–4; comparative bone-geometry analysis; Supplementary Data 1–2
    - subjectId: taxon:archaeopteryx
      claimKind: scientific
      claimType: morphology
      statement: Referred Archaeopteryx skeletons preserve toothed jaws, a long bony tail and feather associations, while wing-bone cross-sections differ from those of specialized soaring birds.
      confidence: high
      confidenceRationale: The listed hard-tissue and feather associations are specimen observations, and synchrotron sections are repeatable measurements. High confidence does not assign one flight performance to every specimen.
      referenceLinks:
        - referenceId: rauhut-2018-oldest-archaeopteryx
          relation: supports
          figure: Figures 2–32
          quoteLocator: Specimen description
        - referenceId: voeten-2018-archaeopteryx-flight
          relation: supports
          figure: Figures 1–3
          quoteLocator: Synchrotron cross-sections
  claim-rationales.zh:
    - 归入标本及其地质背景直接支持延长记录，但数值端点概括相关层位且归属本身是分类判断；中等置信度避免虚假的精确首现。
    - 具名标本和采石场直接确立巴伐利亚记录；高置信度只涉及出现地点，并明确避免缺失或特有性主张。
    - 标本解剖和重复系统位置支持鸟翼类亲缘，而冠群定义排除该属；高置信度只适用于这一范围，不代表鸟翼类内部只有一个固定拓扑。
    - 同步辐射截面提供直接几何数据，而运动类别来自与现生鸟类比较；中等置信度保留这一模型边界。
    - 所列硬组织和羽毛关联是标本观察，同步辐射截面是可复测数据；高置信度不把同一种飞行性能强加给每件标本。
  claim-statements.zh:
    - 派恩滕标本把归入 Archaeopteryx 的材料延伸到提通期最早期；图谱 1.50–1.48 亿年前区间是地层组和标本限定的包络，而非鸟翼类或冠群鸟类起源。
    - 这里讨论的可靠 Archaeopteryx 归入标本均来自晚侏罗世巴伐利亚石版灰岩；这种观察到的集中分布不能证明其他地区全球性缺失。
    - Archaeopteryx 是位于冠群今鸟类之外的晚侏罗世鸟翼类；归入标本间的显著解剖变异也不使它成为现生鸟类的直系祖先。
    - 翼骨几何在比较模型中与短时主动飞行相容，但证据没有直接观察行为、耐力或现代冠群鸟类的飞行拍动。
    - 归入 Archaeopteryx 的骨骼保存有齿颌、长骨质尾和羽毛关联，其翼骨截面也不同于专门滑翔鸟类。
