        claims:
          - text: Tufted perennial to 60 cm. Leaves setaceous-involute. Spikelets 13-18 mm long, in an open panicle with short, scattered hairs on branches and pedicels, upper glumes two thirds as long as spikelet, lemmas scaberulous, rachilla internodes hairy.
