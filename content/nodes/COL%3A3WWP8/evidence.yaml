      ecology:
        status: partially-supported
        claims:
          - text: In Gouraya National Park, Algeria, observations from April 2007 through March 2008 reported higher annual dietary species diversity for the peri-urban Les Oliviers group (13.8) than for the non-urban Cap Carbon group (10.4; F=5.51, df=1, P<0.05). This comparison concerns those two observed groups and that annual cycle; it does not establish a species-wide diet pattern or explain the difference causally.
            textZh: 在阿尔及利亚古拉亚国家公园，2007 年 4 月至 2008 年 3 月的观察报告称，城郊 Les Oliviers 群体的年度食物物种多样性（13.8）高于非城郊 Cap Carbon 群体（10.4；F=5.51，df=1，P<0.05）。该比较仅涉及这两个观察群体和这一年度周期，不能代表整个物种的饮食模式，也不能据此解释差异成因。
            originalLanguage: en
            sourceIds:
              - maibeche2015
            locator: Results, Dietary composition—Dietary species richness and diversity; Methods, Study sites, macaque groups and periods of observation; Data collection and analyses.
            placeTimeScope: Gouraya National Park, eastern Algeria; two groups observed between April 2007 and March 2008. The peri-urban and non-urban groups were reported as 31–34 and 40–46 individuals, respectively. Dietary analysis excluded unweaned infants.
            lifeStatus: Free-ranging wild macaques in two observational groups; not captive, domesticated, or fossil evidence.
        gaps:
