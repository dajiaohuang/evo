    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous herb, up to 1 m high. Bracts boat-shaped, large, somewhat inflated, equalling or longer than perianth. Perianth porrect with a short tube. Leaves linear, up to 700 mm long. Flowers white, speckled with maroon.
            textZh: Gladiolus vinosomaculatus Kies 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_11118_0
            locator: "SANBI/WFO archive Morphology row 2087; source identifier 11118.0; cited publication: Herman, PPJ; Retief, E. 1997. Plants of the northern provinces of South Africa: Keys and diagnostic characters. Strelitzia 6: 1 - 681. National Botanical Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Recognised by the narrow, glaucous leaves 4-12 mm wide, forming a pseudostem at the base, large glaucous bracts up to 120 mm long partly concealing the flowers, pale tepals spotted of blotched red or purple and short filaments, 7-11 mm long and anthers 10-13 mm long. Gladiolus ecklonii, with similarly but often more finely spotted flowers, has a basal fan of bright green leaves and often smaller flowers with longer filaments, 12-15 mm long, and shorter anthers, 7-10 mm long.
