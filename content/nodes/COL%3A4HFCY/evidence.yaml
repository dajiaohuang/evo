    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Glabrous or sparsely hairy annual herb, 0.25-1.00 m high. Leaves ovate to ovate-lanceolate, deeply and irregularly incised-toothed to undulate-toothed, sometimes entire, 50-110 x 35-80 mm, petiolate. Corolla lobes spreading to 10 mm diam. Anthers 1.0-2.5 mm long, bluish or violet. Fruiting calyx 10-angled or 10-ribbed and nearly terete. Flowers yellowish, sometimes with indistinct spots.
            sourceIds:
