          title: Physalis angulata L., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Sprawling or erect herb to 1 m tall, stems angled, glabrous except for minute appressed hairs on the youngest parts. Leaves to 10 cm long, ovate or elliptic, apically acute or acuminate, basally' acuminate and often oblique, the margins entire, sinuate, dentate or irregularly incised, glabrate; petioles l/3-/2 as long as the leaves. Pedicels 5-12 mm long, mostly longer than the calyces, puberulent with fine antrorse hairs. Flowers with the calyx 3-5 mm long, 2-4 mm across at the base of the lobes, glabrous except at the margins and tips of the lobes, the lobes broadly acute; corolla usually without a contrasting eye, 4-10 mm long, sometimes reflexing backwards when fully open; stamens sometimes unequal, the filaments slender, the anthers bluish, sometimes fading yellow or drying or curling at maturity, 2-2.5 mm long. Fruits on slender pedicels mostly 10-25 mm long; fruiting calyx 10-angled or terete, 20-30 mm long, glabrous, often drying reticulate-veined or with a purplish cast; berry globose, 10-12 mm across.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 13000
