        usage:
          title: Desmodium sericophyllum Schltdl., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Perennial herb, sometimes procumbent to ascending, becoming 1 m or more long; stems angulate, ridged and grooved, densely white tomentose. Leaves tri- foliolate, stipulate, petiolate; stipules obliquely ovate attenuate, striate, puberu- lent and pilose on the abaxial surface, abundantly ciliate, usually becoming re- flexed, often early deciduous, 5-7.5 mm long, 2-3.5 mm wide at the base; petioles sulcate, densely tomentose, 1.3-2 cm long; leaf rachis similar to petiole, 0.4-1 cm long; stipels linear attenuate, pilose, and ciliate, to 3.5 mm long; petiolules stout, densely tomentose, 2-4 mm long; leaflets softly appressed pilose and dark on adaxial surface, paler and tomentose on the abaxial surface with some retic- ulate venation evident, the leaflets ovate to elliptic, acute to obtuse and mucron- ulate at the apex, rounded to cuneate at the base, the terminal leaflet 3.5-6 cm long, 2-3.5 cm wide, the lateral leaflets 3-5 cm long, 1.5-2.5 cm wide. Inflores- cence racemose to racemose paniculate; rachis subangulate, finely ridged and grooved, uncinulate puberulent throughout; pedicels borne in pairs, each pair subtended by an ovate acuminate, striate, ciliate primary bract, puberulent and somewhat pilose on the abaxial surface, 8-9.5 mm long, 3-5 mm wide; secondary bracts minute, if present, not persistent; pedicels densely uncinulate puberulent, becoming reflexed soon after anthesis, 2.5-4 mm long. Flowers with the calyx minutely puberulent throughout, the teeth of both the lobes somewhat ciliate, especially at the apex, and with at least scattered pilosity along the central tooth of the lower lobe and on the upper lobe; central tooth of the lower lobe 4-5 mm long, the lateral teeth 3-3.5 mm long, the upper bifid lobe 3 mm long; standard obovate, slightly retuse, cuneate at the base, 5.5-9 mm long, 4-6 mm wide, the wings oblong, obtuse at the apex, unguiculate at the base, 5.5-10 mm long, 1.5- 3 mm wide, the keel petals scythe shaped, curved and truncate at the apex, long unguiculate, 5.5-10 mm long, 1.5-3 mm wide. Loment stipitate; stipe 1-2.5 mm long, to 7-articulate; articles suborbicular to subrhombic in outline, with the upper suture usually slightly curved, the lower almost angulate, surfaces uncinulate puberulent throughout, 3-4 mm long, 3 mm wide, the isthmi at least slightly eccentric, ca. 1.5 mm wide; seed subreniform, 2 mm long, 1.5 mm wide.
