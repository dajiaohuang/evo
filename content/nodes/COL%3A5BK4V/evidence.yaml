        usage:
          title: Virola guatemalensis (Hemsl.) Warb., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Dioecious trees to 30 m., the younger branchlets puberulent with evanescent ferruginous or cinereous hairs. Leaves glabrous above, sparsely puberulent with fugaceous sessile-stellate hairs below, coriaceous, oblong to narrowly obovate, apically acuminate or cuspidate, basally attenuate to obtuse, 13-25 cm. long, 4-8 cm. broad; secondary veins 14-21 per side, the tertiary veins rather obscure; petioles canaliculate, 5-14 mm. long, 1-3 mm. broad. Staminate fascicles in many-flowered panicles 5-12 cm. long and nearly as broad; pedicels 0.5-1.5 mm. long, subtended by a conspicuous discoid expansion of the peduncle; bracts deciduous, 2-3 mm. long; perianth tardily 3-parted, ca. 2 mm. long; anthers 3, 0.6-0.8 mm. long, connate to apex, the infra-antheral portion of the androecium 0.4-0.7 mm. long. Pistillate flowers in few-flowered racemes 5-9 cm. long; tepals densely tomentose with fer- ruginous stellate or branched, fugaceous hairs; ovary 1-carpellate with a subsessile obscurely 2-cleft stigma. Fruits 1-5 per inflorescence; pedicels 5-10 mm. long, the glabrescent, ligneous pericarp ultimately dehiscing longitudinally into 2 valves, ovoid-ellipsoid, 27-36 mm. long, 21-27 mm. broad; aril deeply laciniate, the seed ellipsoid.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 8150
