  claims:
    - subjectId: event:eloposteoglossocephala-genome-structure
      claimKind: scientific
      claimType: topology
      statement: Across 955 single-copy gene trees and 3,041 chromosome-adjacency markers from seven new elopomorph and 18 public genomes, sequence and genome-structure analyses support Elopomorpha plus Osteoglossomorpha as sister to Clupeocephala; this is an extant-sample topology, not a complete species tree or fossil event.
      confidence: medium
      confidenceRationale: Multiple sequence- and chromosome-based analyses converge on the same deep teleost split and the supporting genome dataset is archived. Medium confidence limits the result to sampled living lineages, acknowledges the absence of an exclusive unambiguous morphological character, and treats the ancestral fusion as reconstruction rather than direct observation.
      referenceLinks:
        - relation: supports
          referenceId: parey-2023-teleost-genome-structures
          pages: 572–575
          figure: Figures 3A–D and 4; Supplementary Figures S7–S9
          quoteLocator: Results; Discussion; Supplementary Materials
  claim-rationales.zh:
    - 多种序列和染色体方法收敛到同一深层真骨鱼分支，支撑基因组数据也已归档。中等置信度把结果限定于所取样现生谱系，承认缺少唯一且无歧义的形态性状，并把祖先染色体融合视为重建而非直接观测。
  claim-statements.zh:
    - 基于 7 个新测海鲢总目基因组和 18 个公开基因组的 955 棵单拷贝基因树与 3,041 个染色体邻接标记，序列和基因组结构分析共同支持海鲢总目与骨舌鱼总目组成一支、并与鲱头鱼类互为姐妹群；这是现生样本拓扑，不是完整物种树或化石事件。
