  catalogue-dossier:
    scientificName: Macaca silenus (Linnaeus, 1758)
    rank: species
    sourceDatasetId: "2144"
    identity:
      method: Exact accepted COL26.8 species usage 3WWP6 verified against ChecklistBank dataset 316115 search and taxon endpoints; verbatim name, authorship, species rank, accepted status, sourceDatasetId 2144, and Primates parent classification were checked. The complete accepted parent path through Primates was verified from the immutable COL26.8 hierarchy archive.
      scope: COL26.8 usage 3WWP6 only. Existing mitochondrial evidence is regional to sampled Western Ghats populations. Dhawale et al. (2020) concerns one free-ranging troop at Puthuthottam in February–May 2016. Bindu et al. (2024) is a separate bioRxiv v1 study of four troop groups at Puduthottam during four months of one dry season; its field year is not reported and it was not certified by peer review.
      parentChain:
        - id: 5HYC
          name: Macaca
          authorship: Lacépède, 1799
          rank: genus
          status: accepted
