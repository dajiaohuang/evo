    facets:
      morphology:
        status: not-assessed
        gaps:
          - The mitochondrial-DNA study does not assess species-level anatomical morphology.
      lifeHistory:
        status: not-assessed
        gaps:
          - No life-cycle, reproductive, growth, survival, or longevity evidence was assessed.
      ecology:
        status: partially-supported
        claims:
          - text: From February to May 2016, researchers followed one habituated, free-ranging troop of lion-tailed macaques at Puthuthottam in the Valparai plateau, Tamil Nadu, recording over 480 follow-hours across forest interior, forest edge, an open forest patch, and a human settlement. In this troop, active foraging was higher in the open patch and forest edge, and lower in the human settlement, than in the forest interior; its time-activity budget also differed between the interior and settlement. This dry-season study of one troop does not establish a species-wide response to human-modified habitat.
            textZh: 2016 年 2 月至 5 月，研究者在泰米尔纳德邦瓦尔帕赖高原的普图托坦，跟踪观察了一群已习惯观察者、自由活动的狮尾猕猴，在林内、林缘、开阔林地斑块和人类居住地四种栖息地累计记录了 480 多小时。在这群猴中，与林内相比，开阔斑块和林缘的主动觅食更多，人类居住地的主动觅食更少；林内与居住地之间的活动时间预算也有差异。这项旱季单群体研究不能证明该物种对人为改造栖息地具有普遍反应。
            sourceIds:
              - dhawale2020
            locator: Methods—Study area, Study troop and individuals, and Field methods; Results—Ecological and behavioural responses of lion-tailed macaques to habitat types; Fig. 3.
            placeTimeScope: One Puthuthottam troop on the Valparai plateau, Anamalai Hills, Tamil Nadu, southern Western Ghats; observations in four habitat types during February–May 2016, the dry season; over 480 follow-hours.
            lifeStatus: Free-ranging wild troop; one troop and dry-season observations only.
            originalLanguage: en
          - facet: ecology
            text: During the recorded foraging observations, the study troop consumed plant parts from 19 plant species and also non-plant foods; recorded diet composition differed among habitats, with more invertebrate consumption in the Open Forest Patch than in the Forest Interior and more plant matter in the Forest Interior than in the Forest Edge. These are observations of one troop during the study period, not a complete species-wide diet or population-wide resource-use estimate.
            textZh: 在该研究的觅食观察中，这群狮尾猕猴食用了 19 种植物的部分，也摄食非植物性食物；记录到的食物组成随栖息地而异：在开阔林地斑块中摄食的无脊椎动物多于林内，而林内的植物性食物多于林缘。这些观察仅来自研究期间的一群猴，不是物种完整食谱或种群范围内资源利用估计。
            originalLanguage: en
            locator: Results, Ecological and behavioural responses of lion-tailed macaques to habitat types; Table 2 and accompanying text comparing plant matter and invertebrate consumption among habitats.
            placeTimeScope: One free-ranging troop at Puthuthottam, Valparai plateau, Anamalai Hills, Tamil Nadu, India; dry-season observations from February through May 2016 across forest interior, forest edge, open forest patch, and human settlement.
            lifeStatus: One free-ranging wild troop; no captive, domesticated, or fossil observations are included.
            sourceIds:
              - dhawale2020
          - facet: ecology
            text: Across four troop groups, 375.9 hours of focal-animal watches were distributed among adult males, adult females, and subadult males. The bioRxiv v1 abstract reports that sampled subadults consumed a greater diversity of native and non-native fruits than adult females and males and dispersed fewer Ficus seeds than females. These are preliminary, group-, site-, and season-specific results; the preprint was not certified by peer review.
            textZh: 在四个猴群中，研究将 375.9 小时的焦点动物观察分配给成年雄性、成年雌性和亚成年雄性。bioRxiv v1 摘要报告：受观察的亚成体摄食的本地及非本地水果种类多样性高于成年雌性和雄性，传播的榕属种子少于雌性。这些是限定于猴群、地点和季节的初步结果；该预印本未经同行评审。
            originalLanguage: en
            locator: Methods §§2.1–2.2 (92-ha study site, four troop groups, 375.9 focal-watch hours, and adult/subadult sampling); Abstract (age/sex differences in fruit diversity and Ficus seed dispersal); bioRxiv version 1, not certified by peer review.
            placeTimeScope: Four free-ranging troop groups at the 92-ha Puduthottam rainforest fragment on the Valparai plateau, Anamalai Hills, Tamil Nadu, India; 375.9 focal-watch hours spanned four months in one dry season. Calendar sampling dates and year are not reported; these groups, site, and season do not establish species-wide patterns.
            lifeStatus: Free-ranging wild macaques in four troop groups; this claim does not include captive, domesticated, or fossil observations.
            sourceIds:
              - bindu2024preprint
        gaps:
          - Dhawale et al. (2020) diet and habitat evidence concerns one troop at one forest fragment during one dry season. Bindu et al. (2024) adds observations from four troop groups at one fragment during one dry season; annual variation, other populations, and species-wide resource use remain unassessed.
          - Competition, predation, mutualism, and broader parasite interactions remain unassessed.
          - Age- and sex-stratified fruit and seed-dispersal evidence comes from 375.9 focal-watch hours across four troop groups at the Puduthottam fragment over four months in one dry season. It is reported in a bioRxiv v1 preprint not certified by peer review; it does not establish species-wide patterns or annual variation. Exact field dates and year are not reported.
      evolution:
        status: partially-supported
        claims:
          - text: Ram et al. recovered north-of-Palghat-gap and south-of-Palghat-gap mitochondrial clades among sampled lion-tailed macaques. A fossil-calibrated analysis of 893 mitochondrial bases estimated a mean time to their most recent common ancestor of 2.11 million years; this is a model-based estimate from mitochondrial markers, not a genome-wide species split date.
            textZh: Ram 等人在受采样的狮尾猕猴中识别出帕尔加特山口以北和以南的线粒体分支。基于 893 个线粒体碱基的化石校准分析，将其最近共同祖先的平均时间估为 211 万年前；这是线粒体标记的模型估计，不是全基因组物种分化日期。
            sourceIds:
              - ram2015
            locator: Results, “Genetic structure and diversity of lion-tailed macaques in the Western Ghats”; Figure 4; Table 2.
            placeTimeScope: Sampled Macaca silenus populations north and south of the Palghat gap in the Western Ghats; divergence time is a fossil-calibrated mitochondrial-model estimate.
            lifeStatus: Primarily wild fecal samples collected in 2010–2012; 23 captive blood samples were separately identified in the study.
            originalLanguage: en
        gaps:
          - The short mitochondrial markers and regional samples do not establish a complete species phylogeny or genome-wide population history.
      distribution:
        status: partially-supported
        claims:
          - text: The study collected wild fecal samples at 15 named locations in Karnataka, Kerala, and Tamil Nadu in the Western Ghats. The sampling map documents this study's sites and is not a complete current range inventory.
            textZh: 该研究在西高止山脉的卡纳塔克邦、喀拉拉邦和泰米尔纳德邦 15 个具名地点采集了野生个体粪便样本。采样图记录的是本研究的地点，并非当前完整分布区名录。
            sourceIds:
              - ram2015
            locator: Methods, “Study area”; Figure 1 and its caption; “Sample collection”.
            placeTimeScope: Western Ghats study localities in three Indian states; wild samples were collected during 2010–2012.
            lifeStatus: Wild-origin fecal samples; captive blood samples are separately described and are not treated as range records.
            originalLanguage: en
        gaps:
          - Study localities do not establish complete current occupancy or a full distribution boundary.
      fossil:
        status: not-assessed
        gaps:
          - Fossil occurrence and the broader geological record were not reviewed; fossil calibrations in a molecular model are not a fossil inventory.
      conservation:
        status: partially-supported
        claims:
          - text: Within the sampled Anamalai hills, HVR-I diversity was lower in eight forest fragments than in the adjacent continuous Nelliyampathy population. The comparison is based on mitochondrial markers from these sites and does not itself estimate current population viability or a formal conservation category.
            textZh: 在受采样的阿纳马莱丘陵地区，八个森林碎片中的 HVR-I 多样性低于邻近连续分布的内利亚姆帕蒂种群。该比较基于这些地点的线粒体标记，不能据此估算当前种群存续能力或正式保育等级。
            sourceIds:
              - ram2015
            locator: Results, “Genetic diversity in the fragmented population of Anamalai hills”; Table 3; Discussion, “Effect of fragmentation on genetic diversity of lion-tailed macaques in Anamalai hills”.
            placeTimeScope: Eight Anamalai forest fragments compared with the continuous Nelliyampathy population in the Western Ghats; samples collected in 2010–2012.
            lifeStatus: Wild-origin fecal samples from free-ranging troops.
            originalLanguage: en
        gaps:
          - This local genetic comparison is not a current species-wide conservation assessment, abundance trend, or viability analysis.
