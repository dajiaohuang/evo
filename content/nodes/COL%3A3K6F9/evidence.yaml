    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Perennial herb with 1 or a few leaf rosettes crowning a woody rhizome, flowering stems terminal, but lateral to the new rosettes, 1 or 2 from a rosette, decumbent then erect to ±150(-300) mm, loosely greyish-white woolly, closely leafy. Radical leaves up to 150 x 20 mm, but commonly not more than 50 x 15 mm, lanceolate-spathulate or lanceolate-elliptic, membranous, glandular-pilose, margins white-woolly particularly when young; cauline leaves similar but smaller and diminishing in size upwards. Heads heterogamous, campanulate, ±15 mm long, double that across the radiating bracts, solitary, very rarely paired. Involucral bracts in ±10 series, graded loosely imbricate, much exceeding the flowers, acute, snow-white. Receptacle nearly smooth. Flowers 287-544, 31-67 female, 256-478 homogamous. Achenes 1.5 mm, ellipsoid, strongly 5-ribbed, glabrous. Pappus bristles many, about equalling corolla, scabridulous, bases sometimes lightly cohering by patent cilia.
            sourceIds:
