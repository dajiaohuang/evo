        usage:
          title: Humiriastrum diguense (Cuatrec.) Cuatrec., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Large tree, 25-30 m tall, the branchlets irregularly subangulate, puberulous. Leaves rigid-chartaceous, crenate, elliptic, acuminate, the base cuneate, 3.5-9.5 cm long and 2.2-5.2 cm wide, glabrous above, below with a few scattered incon- spicuous trichomes; petiole 1-2 mm long, thickened at base. Inflorescence sub- terminal or terminal, cymose-paniculate, trichotomously branched, with the branches puberulous. Flowers with the sepals glabrous (in Panama) except for the ciliate margins, orbicular, ca. 1 mm long; petals oblong, obtuse, sparsely ap- pressed puberulous outside; stamens 20, glabrous, the filaments connate at base, unequal, longer ones ca. 1.2 mm long, alternating with shorter series ca. 0.8 mm long, the anthers 0.7-0.8 mm long, connective very thick, ovoid-lanceolate, ob- tuse, the 2 thecae elliptic, basal; disc formed by 0.2 mm scales; ovary conical, 1 mm long, pubescent, the style short, the stigma 5-lobate. Drupes (previously undescribed) elliptic-obovoid, obtuse at base and apex, 2.1-2.6 cm long and 1.1-1.5 cm in diameter, the exocarp coriaceous when dry, about 1 mm thick, the endocarp 2.0-2.5 cm long and 1.2-1.4 cm in diameter, woody, with small resiniferous cavities, surface fibrous, 5 deep holes at apex, these 3-5 mm long and alternating with 5 oblong descending opercula 6-8 mm long; usually 2 seeds developed.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 6468
