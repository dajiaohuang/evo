        usage:
          title: Pterocarpus officinalis Jacq., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Trees, medium-sized to large. Leaves with 8-12 leaflets, these alternate, ovate- oblong to oblong, 7.5-15 cm. long, 3.5-7 cm. wide, the acumen falcate, up to 2 cm. long, vaguely decurrent on the petiolule, chartaceous to thinly coriaceous, lustrous, reticulate, glabrous, the costa plane or immersed above, the main veins 10-20, arcu- ate, the margin somewhat crisp; petioles 2.5-7 cm. long, swollen basally; rachises up to 17 cm. long. Panicles terminal, often equal to the leaves in length, the rachises up to! 0.3 cm. wide at the base, drying black, scattered ferruginous-villose, the lower- most branches spreading, up to 7 cm. long, the flowers mostly persistent at the tips of the branches; bracts lanceolate, about 2 mm. long, the bracteoles up to 0.6 mm. long; pedicels slender, about 3 mm. long. Flowers with the hypanthium turbinate, about 1.3 mm. long, thickly carnose, glabrous; vexillum reflexed, suborbicular to obreniform-orbicular, about 8 mm. long, glabrous, the claw cuneate, up to 5 mm. long; wing petals obliquely rotund, up to 11.5 mm. long, up to 6 mm. wide, trun- cate at the base, glabrous, the claw about 4 mm. long; staminal sheath 2.5-4 mm. long, about 0.7 mm. wide, glabrous, the filaments often slightly longer than the sheath, the anthers about 0.5 mm. long; ovary stipitate for 3.5 mm., about 3 mm. long, glabrous, the subulate style up to 2.5 mm. long. Fruits stipitate for about 3 mm., flat, the winged body inequilateral, subrotund, oblong or ovate, 2-5 cm. long, 3-3.5 cm. wide, obtuse to acuminate at the apex, very oblique at the base, smooth, lustrous, the veins usually prominent and flabellate.
