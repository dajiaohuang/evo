          title: Sauvagesia tenella Lam., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Herbs 0.3-0.7 dm tall; branches absent or occasionally few at the apex or base, glandular, smooth. Leaves sessile, elliptic, 3-8 mm long, 1.8-3 mm wide, subacute or obtuse at the apex, subcuneate at the base, delicately carnose, the margin entire or depressed-serrate above the middle, the tips of the cilia minutely falcate-dentoid the lateral veins evanescent; stipules linear or oblong, 1-3 mm long, the cilia well- spaced and exceeding the corpus in length. Inflorescences with the bostryces termi- nal, solitary or rarely paired; bracts stipuloid, minute; pedicels slender, 6-7 mm long. Flowers with the sepals lanceolate to ovate, 3.2-4 mm long, setose-aristate at the apex, the margins usually scarious, the veins ca 3; petals pink, white or yellow, obovate, 3-5 mm long, equal to or exceeding the sepals in length, usually unguicu- late at the base, the veins evanescent; segments of the exterior corona absent; seg- ments of the interior corona usually oblong, rarely narrowly obovate, usually slightly shorter than the stamens, rounded or obtuse, the median vein evanescent, the dorsal furrow absent, the veins 1-2, ascending; stamens up to 2 mm long, the anthers oblong, obtuse, often longer than the filaments; ovary ellipsoid or rotund, ca 1 mm long, exceeding the style in length. Fruit equal to or exceeding the sepals in length, mostly turgid at the base.
          originalLanguage: en
          sourceField: general
