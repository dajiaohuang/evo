    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Acaulescent succulent to 1 m. Leaves in a spiral or distichous rosette, smooth, triangular, margins and keels smooth. Flowers in an inclined, simple or branched raceme, nodding, reddish, inflated below.
            textZh: Gasteria nitida (Salm-Dyck) Haw. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13855_0
            locator: "SANBI/WFO archive Morphology row 9063; source identifier 13855.0; cited publication: Manning, JC; Goldblatt, P. 2012. Asphodelaceae: Gasteria Duval. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 74 - 75. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Gasteria nitida is immediately recognized by its striking erect to erectly spreading bright reddish pink racemes. The perianth is yellowish at the throat, a distinct feature not found in any other species of this genus. It is further characterized by its acaulescent rosette of short triangular to triangular-lanceolate, distinctly keeled, erect to erectly spreading leaves. The plants may be solitary or proliferate to form small groups. The inflorescence may be simple or with ascending side branches. The vegetative parts have a chameleon nature (phenotypic plasticity), depending on the prevailing environmental conditions. When frequent veld fires occur, plants are smaller and tend to remain in the juvenile phase. The leaves are lorate, densely tuberculate and lie flat on the gound and the plants are very difficult to detect. Without annual fires the leaves grow into a rosette. This is, however, not always the case and a variation exists where the leaves remain distichous (see var. armstrongii). This variation is continuous, however, and it grades into the typical G. nitida. G. nitida is closely related to G. ellaphieae, G. carinata and G. vlokii but these differ by having simple racemose inflorescences, the perianth not being yellow at the apex, and the epidermal texture of the juvenile and adult leaves remaining the same. The leaf is asperulous in G. vlokii, tuberculate in G. ellaphieae and tuberculate or smooth in G. carinata. In floral and vegetative features G. nitida comes close to G. ellaphieae and G. vlokii. These three species flower during December and January and have similar bright red-pink inflorescences. (G. carinata flowers during spring.) The distribution of these four related species is clearly allopatric. G. nitida is also related to G. pulchra and G. excelsa, having similar juvenile leaves, but the last-named differs in having leaves with very sharp, serrulate leaf margins and large panicles with light pink flowers. G. excelsa occurs in shady, forested river valleys. The flowering times of G. pulchra and G. excelsa coincide and where they grow close together, natural hybrids have been recorded [Van Jaarsveld 8653). G. pulchra has linear-triangular leaves.
