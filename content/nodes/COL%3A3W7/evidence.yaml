  claims:
    - subjectId: taxon:primates
      claimKind: scientific
      claimType: divergence-time
      statement: A 372-species relaxed-clock analysis estimates crown Primates at 79.2–70.0 Ma under its selected autocorrelated model and calibration strategy A, whereas another calibration strategy is younger; neither posterior interval is a fossil occurrence or exact crown-origin observation.
      confidence: medium
      confidenceRationale: The model, calibration strategy and posterior interval are explicit in the primary study. Medium confidence reflects strategy sensitivity rather than poor execution.
      referenceLinks:
        - relation: supports
          referenceId: dos-reis-2018-primate-clock
          pages: 604–608
          figure: Figures 1 and 5
          quoteLocator: Supplementary time-estimate spreadsheet; calibration strategies A and B
  claim-rationales.zh:
    - 一手研究明确给出模型、校准策略与后验区间；中等置信度反映策略敏感性，而非研究执行不足。
  claim-statements.zh:
    - 一项覆盖 372 个物种的松弛时钟分析，在所选自相关模型与校准策略 A 下估计冠群灵长类为 7920 万—7000 万年前，而另一校准策略更年轻；两个后验区间都不是化石出现记录或冠群起源的精确观测。
  ranges:
    - entityId: primates
      rangeKind: global-composite
      taxonomicConcept: crown Primates model interval and living continuation
      geographicScope: 372-species phylogeny; global living continuation
      olderMa: 79.2
      youngerMa: 0
      status: available
      uncertainty:
        olderMa: 9.2
        youngerMa: null
        note: The older endpoint is the upper end of one model posterior. Calibration strategy B spans 71.4–63.9 Ma; neither interval is a fossil occurrence.
      evidenceBasis: Bayesian relaxed-clock posterior under the selected autocorrelated model and calibration strategy A, combined with living crown membership.
      evidenceLevel: literature-synthesized
      confidence: medium
      claimIds:
        - claim:event:primate-crown-clock-model
      referenceLocators:
        - referenceId: dos-reis-2018-primate-clock
          locator: pp. 604–608; Figures 1 and 5; Supplementary time-estimate spreadsheet
