    facets:
      morphology:
        status: partially-supported
        claims:
          - text: An erect herb, annual, slender, simple or but little branched, 1/6-1 ft. high or rather more, leafy at the base, distantly leafy above; stem straight, nearly glabrous, shining; lower leaves opposite, upper alternating or opposite, patent or spreading, linear or lanceolate, somewhat acute or obtuse, more or less distinctly dentate or denticulate; lowest leaves subpetiolate, glabrous, ranging nearly up to 2 1/2 in. long by 2/5 in. broad; uppermost leaves gradually passing into the bracts; racemes loosely several- or many-flowered, elongating; deflexed or spreading bracts and elongating pedicels glandular-puberulous; calyx-segments oblong or lanceolate, somewhat obtuse, glandular-puberulous, 1/12-1/6 in. long; upper lip of the corolla normally white; lobes linear or oblong-linear, obtuse, equal, about 1/4-2/7 in. long, scarcely 1/12 in. broad; lower lip rounded, emarginate at the apex, bigibbous at the base, about 1/4 in. long, yellow; spur deflexed, cylindrical, very blunt at the apex, about 1/3 in. long, somewhat incurved at the tip; capsule obovate-oblong, broadly notched at the apex, glabrous, 1/4-1/3 in. long and broad, unequal at the nearly rounded base, not horned.
            sourceIds:
