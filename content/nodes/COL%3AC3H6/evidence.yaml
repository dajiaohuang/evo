        claims:
          - text: A. chabaudii var. mlanjeana is re-stricted to Malawi and therefore not treated here. A. chabaudii usually grows on bare rock on granitic domes, or in shallow soil pockets. It is very variable in climatic requirements, but it is frost-sensitive.
