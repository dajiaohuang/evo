            locator: "SANBI/WFO archive Morphology row 156; source identifier 11118.0; cited publication: Herman, PPJ; Retief, E. 1997. Plants of the northern provinces of South Africa: Keys and diagnostic characters. Strelitzia 6: 1 - 681. National Botanical Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: The nearest relatives of A. chabaudii are probably A. milne-redheadii and A. mzimbana, both of which occur in northern Zambia and Malawi. A. chabaudii is at once distinguished from A. suffulta by its stoloniferous habit, usually unspotted or only obscurely spotted, spreading to incurved leaves and relatively short (up to 1 m tall) nonclimbing inflorescence.
