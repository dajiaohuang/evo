    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Acaulescent or shortly caulescent, succulent herb, up to 500 mm tall. Leaves unspotted, 60-170 mm wide. Inflorescence a much-branched panicle (± 20 branches). Racemes lax, erect. Perianth trigonously indented, subclavate. Flowers scarlet to brick-red.
            textZh: Aloe chabaudii Schönland 的 SANBI 物种条目记录了形态特征。
            sourceIds:
