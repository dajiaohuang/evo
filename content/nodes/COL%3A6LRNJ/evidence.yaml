    facets:
      morphology:
        status: partially-supported
        claims:
          - text: "Cormous geophyte, up to 160 mm high. Leaves 4 or 5, lower 3 or 4 basal; blade 2-4 mm wide, firm; midrib and margins slightly raised. Flowers: 1-4 in a spike; anthers 2.5-4.0 mm long; pollen white; style branches ± 6 mm long; perianth with tube 7-9 mm long, segments 7-8 mm long and pale pink, outer ones pale greenish towards base, with darker green longitudinal veins; Feb., Mar."
            textZh: Hesperantha brevistyla Goldblatt 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_16273_0
            locator: "SANBI/WFO archive Morphology row 71829; source identifier 16273.0; cited publication: Retief, E; Meyer, NL. 2017. Iridaceae. In: E Retief & NL Meyer (eds), Plants of the Free State: Inventory and identification guide, Strelitzia 38: 934 - 956. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: With small, pale pink flowers, the outer tepals pale greenish pink on the outside and veined dark green, Hesperantha brevistyla has unusually small white anthers, 2.2-4.0 mm long and remarkably short, suberect style branches that reach only to the base or middle of the anthers, unlike the longer, spreading style branches typical of the genus Hesperantha brevistyla may be most closely allied to a second small-flowered Drakensberg species, H. exiliflora, which has pink flowers with a perianth tube 3.5-5.0 mm long, tepals 6-8 x ± 2.5 mm, yellow anthers 2.5-3.3 mm long, and style branches 3.0-3.5 mm long, reaching to between the middle of the anthers or just beyond their tips in the closed flower. The flowers of H. exiliflora dry purple whereas those of H. brevistyla dry pale pink.
            textZh: SANBI 条目提供了 Hesperantha brevistyla Goldblatt 的鉴别特征。
