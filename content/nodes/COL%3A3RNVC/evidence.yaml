    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Felted, compact, rounded shrublet to 40 cm. Leaves decussate, adpressed, narrowly elliptic or lanceolate. Flowers apparently solitary in capitula, 3-4 mm diam., cream-coloured, stigma capitate, long papillate.
            sourceIds:
              - sanbi_14458_0
            locator: "SANBI/WFO archive Morphology row 10258; source 14458.0; publication: Beyers, JBP. 2012. Thymelaeaceae: Lachnaea L. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 772 - 775. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: "Lachnaea penicillata superficially resembles L. funicaulis, but its inflorescence and flower structure differ. In L. penicillata the bracteate umbel, which has been interpreted as a single-flowered inflorescence in the past, produces one mature flower at a time; it protrudes beyond the involucral bracts. The immature flowers, fruits and pedicels remain tightly enclosed inside the involucral bracts. In L. funicaulis the bracteate umbel has 3-6 mature (open) flowers at a time and the floral scales are enclosed, arising midway to four-fifths way down the upper portion of the hypanthium, whereas in L. penicillata they arise at the mouth of the hypanthium and are exserted. Lachnaea penicillata is a sister species of L. pendula based on two shared characters: inflorescence borne on the main flowering branches and a pubescent style. It can easily be distinguished from L. pendula by the erect inflorescences and the leaf margins which are lanate-ciliate, later glabrescent."
            textZh: SANBI 条目提供了该种的鉴别特征。
            sourceIds:
              - sanbi_6132_0
            locator: "SANBI/WFO archive Diagnostic row 103944; source 6132.0; publication: Beyers, JBP. 2001. The Cape genus Lachnaea (Thymelaeceae): A monograph. Strelitzia 11: 1 - 115. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
