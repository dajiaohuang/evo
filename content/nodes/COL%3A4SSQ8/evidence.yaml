          originalSourceText: Herbaceous to suffruticose vine, stems angular becoming terete with age, strigose. Leaves trifoliolate, the leaflets ovate to rhomboid, 4.0-10.0 cm long, 4.0-9.0 cm wide, apically acuminate to acute, basally cuneate to obtuse, glabrous to villosulose above, gland dotted and tomentose to villosulose beneath; terminal petiolule 1.5-3.0 cm long, the lateral petiolule 0.2-0.3 cm long; petiole 3.0-8.0 cm long, strigose; stipules lanceolate 0.4-0.6 cm long, caducous; stipels ca. 1.0 mm long, caducous. Inflorescence equal to or exceeding the leaves, branching, ca. 8.5 cm long; peduncles 1.5-3.5 cm long; pedicels ca. 5.0 mm long; bracts lanceolate to ovate, 2.0-5.0 mm long, caducous. Flowers with the calyx not exceeding the corolla, 3.0-4.0 mm long, the lobes 2.0-3.0 mm long, the vexillary lobes united ca. ?2 to apex, the calyx strigose to villous; corolla yellow streaked with maroon, the standard obovate, puberulose, gland dotted, auriculate, 7.0- 10.0 mm long, 4.5-8.5 mm wide, the claw ca. 1.0 mm long, the wings oblong, 6.0-10.0 mm long, 2.0-4.0 mm wide, the claw ca. 1.5 mm long, the keel falcate, 7.0-10.0 mm long, ca. 3.0 mm long, the claw ca. 2.0 mm long; stamens 7.0-9.0 mm long. Fruits oblong ovate, heavily strigose, viscid, gland dotted, greenish brown but not black, 2.8-4.0 cm long, 0.8-1.0 cm wide, the beak 3.0-4.0 mm long; seeds ovoid to subglobose, red and black with equal areas of coloration, 4.0-5.0 mm long, 3.0-4.0 mm wide, the hilum ovate, ca. 2.0 mm long, strophiole lobes narrow.
