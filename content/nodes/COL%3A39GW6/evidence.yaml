      morphology:
        status: partially-supported
        claims:
          - text: Leafy stems weakly crispate-pubescent to glabrous in middle part. Basal leaves oblanceolate-linear to narrowly elliptic or linear-lanceolate, cuneate to attenuate at base. Heads 1-4 in each inflorescence, lax, discoid. Involucres 4.5-6.5 mm long. Achenes glabrous to sparsely hairy. Flowers pink to purple.
            sourceIds:
              - sanbi_11118_0
            locator: "SANBI/WFO archive Morphology row 1821; source 11118.0; publication: Herman, PPJ; Retief, E. 1997. Plants of the northern provinces of South Africa: Keys and diagnostic characters. Strelitzia 6: 1 - 681. National Botanical Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: This species appears to be very similar to or the same as E. integrifolia Baker which occurs in the DRC, Congo, Kenya, Uganda, Tanzania, Malawi, and Madagascar. Emilia integrifolia has more capitula than E. limosa, as many as 14 in lax or congested terminal corymbs and the capitula are smaller. However, intermediate specimens exist, e.g. Fanshawe F7937 (SRGH) from Broken Hill, Zambia and Robinson 2645 (SRGH) from Mkushi, Zambia are like E. integrifolia with many capitula, but of the larger size seen in E. limosa. Similarly, Gilbert & Mesfin Tadesse 6455 (PRE) from Kenya has the larger capitula typical of E. limosa but more than 3 or 4 per corymb, whereas Robinson 3597 (SRGH) from Kalenda Plain in the Mwinilungu District of Zambia has slightly smaller capitula but few (2 or 3) per stem branch.
