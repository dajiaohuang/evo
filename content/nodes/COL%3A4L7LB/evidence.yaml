    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Arbustos o subarbustos. Hojas alternas, mas raramente opuestas. Flores en racimos terminales o laterales y patentes. Sepalos libres, persistentes, los externos carinados; alas grandes, cubren la capsula. Petalo superior profundamente bilobado a subentero; quilla ampliamente crestada. Estambres fertiles ocho. Capsula aplanado elipsoide o aplanado obovoide, alada. Semillas carunculadas, pubescentes. Hierbas muy ramificadas desde la base, 8-10(15) cm; hojas 6-10 x 2-2.5 mm, elipticas, obtusas o agudas; racimos paucifloros, 3-4 flores.
