    facets:
      morphology:
        status: partially-supported
        claims:
          - text: The diagnosis describes a three-stripe dark carapace pattern and sand-colored living specimens of Syspira tigrina. This claim is restricted to those non-palpal characters; the diagnosis and description differ on embolus and cymbial-groove traits, which are not synthesized here.
            originalLanguage: en
            sourceIds:
              - valdez_jimenez_palacios_cardiel_2025
              - plazi_syspira_archive
            locator: Plazi description-extension row 14 (diagnosis); treatment https://treatment.plazi.org/id/03B03901922AAE3088E7FC7E72BE2854; original article p. 311; figures 31–64 and 67–68, DOI 10.11646/zootaxa.5722.3.1; archive SHA-256 8b095aa0880e8b281b2e1de8d903e854553f6118e917b786e512ef099a1b9f54. Diagnosis/description conflict was checked against Plazi row 15 (description); conflicting embolus and cymbial-groove wording is excluded.
            placeTimeScope: Species account on p. 311, with figures 31–64 and 67–68; diagnosis-level characters in the 2025 treatment only.
            lifeStatus: Live coloration is attributed to living specimens; broader life-stage, population, and geographic variation were not assessed.
        gaps:
          - These are selected characters and descriptions from one taxonomic treatment, not a complete character matrix or assessment of variation across all populations. S. tigrina embolus and cymbial-groove statements conflict between diagnosis and description and are deliberately excluded from an unqualified claim.
      lifeHistory:
        status: not-assessed
        claims: []
        gaps:
          - No systematic reproductive, developmental, lifespan, or full behavioral life-history search was performed.
      ecology:
        status: partially-supported
        claims:
          - text: The authors describe Syspira tigrina as mainly active at night and cite pitfall-trap collections at study locations where it represented up to 50% of the cursorial spiders collected. The percentage is a local, method-specific sample result, not a species-wide abundance estimate.
            originalLanguage: en
            sourceIds:
              - valdez_jimenez_palacios_cardiel_2025
              - plazi_syspira_archive
            locator: Plazi description-extension row 17 (biology_ecology); treatment https://treatment.plazi.org/id/03B03901922AAE3088E7FC7E72BE2854; original article p. 311; figures 31–64 and 67–68, DOI 10.11646/zootaxa.5722.3.1; archive SHA-256 8b095aa0880e8b281b2e1de8d903e854553f6118e917b786e512ef099a1b9f54.
            placeTimeScope: Natural-history account on p. 311; nocturnal activity and pitfall-trap result are limited to the locations and sampling context reported or cited by the treatment.
            lifeStatus: Wild-origin pitfall-trap samples and author-reported activity; no captive or species-wide behavior inference is made.
        gaps:
          - Evidence is limited to the treatment's reported microhabitats, activity statement, and cited pitfall-trap samples; interactions, seasonal ecology, environmental tolerances, and sampling completeness remain unassessed.
