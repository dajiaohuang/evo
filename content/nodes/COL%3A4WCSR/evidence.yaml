            locator: "SANBI/WFO archive Morphology row 34964; source 14942.0; publication: Snijman, DA. 2013. Scrophulariaceae: Selago. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 473 - 476. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Selago beaniana resembles S. singularis in its velvety pubescence with a strong component of dendroid hairs but is at once distinguished by its distinctly petiolate leaves with much less markedly revolute margins, bracts oblong, not elliptic, and plane (not concave) on the inner face, and corolla tube longer (c.3-3.4 mm versus 1.7-2.8 mm). Also, the panicles are laxer, but this is difficult to quantify.
