    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Dense, rounded shrublet, ± 0.4-1.5 m tall, pubescent on young parts with minutely stellate or branched hairs. Leaves tufted, elliptic to narrowly spathulate, thick, velvety. Flowers in narrow, loose panicles, mauve, calyx 5-lobed, velvety outside.
            sourceIds:
