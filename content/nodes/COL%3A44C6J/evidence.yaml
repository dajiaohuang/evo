          - text: Moraea hainebachiana shows several unusual features in the M. tripetala group. The first of these is the cluster of small, dark grey or bluish cormlets in the foliage leaf axil and at the base of the corm, the latter feature especially pronounced in non-flowering individuals. The foliage leaf is always inserted on the stem above ground level. Flowers are consistently pale violet to deep blue and have inner tepals 5-6 mm long, somewhat longer than is typical for M. tripetala and unusual in being expanded in the middle, thus spindle-shaped or sometimes oblanceolate and obscurely 3-lobed. More significantly, the filaments are as long as or slightly longer than the anthers, whereas the anthers are slightly longer than the filaments in M. tripetala and in some closely related species, often considerably so. The nectar guides are also somewhat unusual, consisting of lines of dots on a whitish background with the edges not clearly defined as they are in M. tripetala in which the yellow or white nectar guides are typically edged in darker blue to violet. Vegetative reproduction does not occur in M. tripetala and the production of multiple cormlets in leaf axils and at the base of the corm is unknown elsewhere in the M. tripetala complex. Moraea hainebachiana is sterile and all capsules are shed soon after the flowers fade and seeds are not developed, thus it is evidently a vegetative apomict and propagation is effected by cormlets that plants produce liberally.
