        usage:
          title: Columnea maculata C.V.Morton, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Epiphytic shrubs; stems woody, to 8 mm or more in diam., yellowish ginger pilose. Leaves of a pair strongly unequal; larger leaf oblong oblanceolate, to 23 cm long and 8.7 cm wide, acute, oblique at base, entire, above green, pilose, the hairs transparent, 7-8 celled, suffused pink beneath with deeper red tip, pilose, the hairs transparent or reddish, more numerous on the veins, 5-8 celled, also 2-3 celled white appressed hairs; petioles ca. 2 mm long; smaller leaves not seen. Flowers solitary; bracts ca. 5 mm long; pedicels ca. 3 mm long, gingery pilose; calyx lobes ovate lanceolate, ca 1.7 cm long, the apex long acuminate, laciniately toothed, the teeth to 2 mm long, the lobes green or pinkish to dark red, gingery pilose; corolla greenish yellow or yellow with red to black striping and spotting, funnel shaped but strongly zygomorphic, ca. 7.1 cm long and 4 mm in diam. above the base, becoming ca. 7 mm in diam. at throat, externally pale yellow pilose to sericeous, the lobed portion of the corolla ca. 3.3 cm long, the lobes strongly unequal, the posterior pair connate, bibbed at the apex ca. 1.7 cm long, the anterior lobe ca. 2.1 cm long, reflexed; filaments reddish, minutely pilose glandular, the anthers exserted; ovary sericeous, the style yellow, minutely pilose glandular, the stigma stomatomorphic. Fruits white.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 6177
