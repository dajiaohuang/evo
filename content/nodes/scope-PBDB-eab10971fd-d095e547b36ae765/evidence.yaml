  claim-rationales.zh:
    - 劳氏兽科骨层样本的分类表述只覆盖具名标本及所引主研究的分析范围；导航归属不表示直系祖先或普适系统树。
    - 劳氏兽科骨层样本的地理字段只投影主研究记录的具体产地，不外推为全球分布、起源中心或完整扩散路径。
    - 劳氏兽科骨层样本的生态字段区分保存事实与功能推断；未被标本直接记录的饮食、行为、栖息地或性能均明确保留不确定性。
    - 劳氏兽科骨层样本的形态字段限定于主研究列明的具名标本和精确页码、图版或补充材料，不外推到整个支系。
    - 劳氏兽科骨层样本的年代范围是主研究标本或地层背景的有界投影，不作为全球首现、末现、分化时间或连续谱系时长。
  claim-statements.zh:
    - 具名骨层材料被归入 Indohyus 和 Raoellidae，并在来源分析中恢复为鲸类的姐妹群；它既不属于鲸类冠群，也不代表直接祖先。
    - 本资料仅限于 Kalakot 附近 Sindkhatudi 骨层，不能确定 Indohyus 或 Raoellidae 的完整地理范围。
    - 骨密度和稳定同位素支持水生或涉水生活，但食性、步态和惯常行为仍是依据离散材料作出的推断。
    - RR 207–208 记录了耳骨内卷，RR 157 和 RR 42 记录了致密长骨，另有牙齿提供同位素样本。
    - 4,800 万至 4,700 万年前的区间代表有边界的骨层背景，并非全球 Indohyus 首次或末次出现、鲸类起源日期或谱系延续时间。
