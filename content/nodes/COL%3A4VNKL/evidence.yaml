          - text: Perennial. S. achtenii is distinguished from S. unguiculata by its broader leaves, fewer lateral panicles, very faintly reticulate-lacunose, sparsely white-hirsute achenes and by its small trilobed hypogynium with the lobes often 2-3-fid. not unguiculate.
