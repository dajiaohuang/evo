            locator: "SANBI/WFO archive Diagnostic row 51092; source 6083.0; publication: Muller, MAN; Herman, PPJ; Kolberg, HH. 2001. Eriocephalus and Lasiospermum, Fl. S. Africa 33(4,1): 1 - 75. National Botanical Institute, Pretoria. [http://www.biodiversitylibrary.org/item/209557#page/1/mode/1up]. [CC BY]"
