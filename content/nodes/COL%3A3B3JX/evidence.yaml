    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Slender shrub, 0.5-1.5 m tall. Leaves alternate on flowering stems and short-shoots, linear-lanceolate, 4-12 mm long, ± succulent, silvery to bright green, densely silky to glabrous with sunken glands. Flowerheads solitary or racemose on peduncles 6-12 mm long, radiate, 3-6 mm long; involucral bracts 4 or 5, ± entirely membranous with narrow green centre; ray florets white, up to 6 mm long; marginal paleae ± connate, densely woolly.
            sourceIds:
              - sanbi_14753_0
            locator: "SANBI/WFO archive Morphology row 34208; source 14753.0; publication: Manning, JC. 2013. Asteraceae: Eriocephalus. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 286 - 288. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: E. scariosus is probably the most aromatic species of Eriocephalus. The leaves are semisucculent and, like those of the related E. africanus, have a very variable indumentum. The plants occurring furthest north in Namibia, thus within the summer-rainfall zone, are relatively sparsely sericeous to glabrescent.
            textZh: SANBI 条目提供了该种的鉴别特征。
            sourceIds:
