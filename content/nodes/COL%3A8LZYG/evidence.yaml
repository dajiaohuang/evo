          scope:
            en: Systematic revision based on genetic and morphological sampling of more than 400 African pipistrelle-like bats; its p. 47 current-taxonomy table provisionally places Parahypsugo macrocephalus as (Nycticeinops macrocephalus), with genetic confirmation needed for the parenthesized generic placement.
            zh: 基于 400 多只非洲伏翼类蝙蝠遗传和形态采样的系统分类修订；论文第 47 页的现行分类表将 Parahypsugo macrocephalus 暂列为（Nycticeinops macrocephalus），括号内的属级归属仍需遗传证据确认。
          locator: Abstract; author manuscript p. 47, current-taxonomy table, Parahypsugo macrocephalus / Nycticeinops macrocephalus row; taxonomic conclusions
