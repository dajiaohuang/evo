            en: Primary species description based on a female holotype from Kabogo Forest, DR Congo, and one male paratype from Nyungwe Forest, Rwanda; its taxonomic concept is described in the paper as Parahypsugo macrocephalus.
            zh: 基于刚果民主共和国卡博戈森林雌性正模和卢旺达纽恩圭森林雄性副模的原始物种描述；论文中的分类概念为 Parahypsugo macrocephalus。
