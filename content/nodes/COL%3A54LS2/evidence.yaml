        usage:
          title: Talisia princeps Oliv., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Polygamodioecious or polygamous trees to 6 m tall; trunk slender, to ca. 3 cm wide, prominently ribbed. Leaves pinnately compound, to 1 m long or more, sparsely to densely puberulous except on the blade surfaces; petiolules pulvinate; leaflets 6-14 pairs, opposite or alternate, oblong to oblong-obovate, abruptly acuminate, obtuse to acute at the base, slightly inequilateral, 7-28 cm long, 2.5-6 cm wide, subentire; uppermost leaves (called Kataphylls by Uittien) often re- duced or aborted, 20-30 cm long, the petiole and rachis flattened, acicular, the leaflets narrowly oblong to linear, brown, dry, achlorophyllous, less than 2 cm long, these reduced leaves having fascicles of still further reduced leaves in their axils in the manner of the adult leaves. Thyrses arranged in large terminal panicles to 70 cm long, the lower branches to ca. 40 cm long, the branches ribbed; bracteoles linear-lanceolate, 8-19 mm long; branches, bracteoles, pedicels, and calyces pu- berulous. Flowers white; calyx coriaceous, 2.5-4 mm long, deeply 5-lobed, the lobes ovate, thin and ciliate; petals 5, regular, narrowly obovate, ca. 7 mm long, rounded at the apex, spreading and concave in the upper half, sericeous near the base without, glabrous within, the scale fused to lower third of the petal within, the free part erect, densely white-velutinous, about equalling the petal; disc prominently 5-lobed, the lobes densely villous at the apex; stamens 8, the fila- ments glabrous (weakly pubescent in Venezuela), longer than the anthers, the anthers ca. 1.5 mm long, the connective beaked at the apex; staminate flowers with stamens 8, ca. 5 mm long, sometimes in 2 obviously differing series, the 5 outer each subtending a large pubescent disc lobe, these alternating with petals, the 3 inner stamens surrounding the pistil, the ovary 0.6-2 mm long, densely' sericeous, the trichomes obscuring the 3 triangular stigmatic lobes; bisexual flow- ers with the stamens ca. 3 mm long, the ovary, style, and stigma together to 6 mm long, the ovary ovoid, 2.5-3 mm long, gradually tapered onto a stout thick style, the style ca. 1.5 mm long, the stigmas 3, short, triangular, usually obscured by the pubescence of the style. Fruits glabose, to 4 cm long and 3.8 cm wide, short- apiculate, lightly rugose, 1-seeded (fide Radlkofer).
