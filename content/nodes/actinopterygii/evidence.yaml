        usage:
          scope:
            en: The evidence-linked Actinopterygii navigation envelope starts at 390.4 Ma, the older edge of the late Eifelian interval represented by CT-scanned Cheirolepis trailli specimens, and extends to living ray-finned fishes at 0 Ma; it is not a global class FAD or a claim that Cheirolepis was a direct ancestor.
            zh: 有证据绑定的辐鳍鱼导航年代从 390.4 Ma 延伸到现生成员的 0 Ma；390.4 Ma 是经 CT 扫描的 Cheirolepis trailli 标本所对应晚艾菲尔期区间的较老边界，不是全纲的全球首现年代，也不表示 Cheirolepis 是直接祖先。
          locator: Sample locality, material and geology, printed p. 851; anatomical description and CT material, pp. 852–862; Figures 2–4 and 9–11.
      - id: braasch-2016-spotted-gar-genome
