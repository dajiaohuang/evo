        fields:
          - id
          - referenceId
          - title
          - url
          - scope
          - locator
          - doi
        usage:
          scope:
            en: A phylogeny from 243 one-to-one proteins in 25 jawed vertebrates, including a spotted-gar genome and bowfin transcriptome data, supports living Holostei (gars plus bowfin) as sister to Teleostei; this is a topology inferred from the sampled living genomes, not a fossil date or a complete sample of Actinopterygii.
            zh: 25 种有颌脊椎动物的 243 个一对一直系同源蛋白分析，包括斑点雀鳝基因组和弓鳍鱼转录组，支持现生全骨鱼类为真骨鱼类的姐妹群；这是取样现生基因组的拓扑推断，不是化石年代或辐鳍鱼的完整取样。
          locator: "pages: 427–437; figure: Figure 1b; Supplementary Figure 6; quoteLocator: Results: The gar lineage evolved slowly; Online Methods: spotted-gar genome sample"
      - id: qi-2024-teleost-3r-dating
        referenceId: qi-2024-teleost-3r-dating
        fields:
          - id
          - referenceId
          - title
          - url
          - scope
          - locator
          - doi
        usage:
          scope:
            en: A molecular-clock analysis of 30 teleost ohnologue pairs estimated the 3R whole-genome duplication at 286.18–267.20 Ma and crown Teleostei at 254.36–234.16 Ma; these are modelled 95% highest-posterior-density intervals, not fossil occurrences or an instantaneous observation.
            zh: 30 对真骨鱼复制同源基因的分子钟分析估计，3R 全基因组复制为 286.18–267.20 Ma，真骨鱼冠群为 254.36–234.16 Ma；这些是模型的 95% 最高后验密度区间，不是化石记录或瞬时事件的直接观察。
          locator: "pages: 16(7):evae128; figure: Figures 1 and 3; quoteLocator: Results: The age of Ts3R; Discussion: Molecular Dating Suggests an Early–Middle Permian 3R"
