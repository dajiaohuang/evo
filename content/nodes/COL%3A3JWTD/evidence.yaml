      ecology:
        status: partially-supported
        claims:
          - text: In this area environmental conditions vary and this has a direct influence on the plants. In the eastern part the distribution is largely associated with flat pan-like areas, while further west the plants grow in stony positions. H. springbokvlakensis occurs in fairly dry habitats where it grows in close association with other Haworthia spp. in exposed positions. The soil is well drained and the plants grow level with the ground during the cooler months, but during the hot summer months they withdraw completely below the surface of the ground. H. springbokvlakensis grows in a firm hard soil with pH 6.8.
