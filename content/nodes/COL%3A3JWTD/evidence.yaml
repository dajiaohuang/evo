    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants acaulescent, with leaves in a basal rosette which is about 7 cm diam., not (or slowly) proliferous from the base. Leaves about 9, about 37 mm long, up to 18 mm broad, and 4 mm thick at the base of the end-area, oblong, ovate; face below end-area concave, the upper area reddish-brown, the lower yellow-green; end-area refused, 17 mm long, 18 mm broad, convex, with many minute concolorous tubercles, also with a few oblong, longitudinally arranged whitish flecks, pellucid, reddish, with 4 long and 5 short, very reticulate lines, none reaching the tip; lower surface convex, smooth below, tubercled in the upper third, dull, with about 15 greenish indistinct parallel lines; keel 1, centrally positioned in the upper third; other leaves may have a rounded keel which is obliquely placed near the margin, resulting in the distortion of the spherical angle of the retused area; margins acute below, rounded above, with 0.5 mm long pellucid teeth, becoming minute towards the base of the leaf. Inflorescence about 33 cm tall; peduncle simple, terete, about 2 mm diam., 17 cm long, bracteate; sterile bracts membranous, ovate, acuminate, about 6 mm long, erect, keeled; raceme about 16 cm long, lax, with about 35 spirally arranged flowers and buds, 2 open simultaneously; floral bracts 4 mm long, membranous, deltoid, acuminate, keeled with fine dark brown veins, clasping the pedicels, (longer than the pedicels); pedicels 3 mm long, 1 mm diam., dark green, erect; perianth white with fine dark brown keels to the segments, 14 mm long, compressed at base, funnel-shaped, curved, tube more or less 4 mm across, constricted to 3 mm above; segments free to the base, limb 2 lipped; posterior segments with lobes free, erect, slightly recurved, pinkish-white with broad veins; exterior part strongly recurved, pinkish-white with fine brown veins; stamens 6 of two lengths, 5 and 6 mm long, inserted within the perianth tube; ovary 4 mm long, 2 mm diam., green; style white, 1 mm long, curved, capitate.
