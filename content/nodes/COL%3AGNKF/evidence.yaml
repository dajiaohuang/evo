    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants 200-350(-500) mm high. Stem oval in section and prominently 2-winged, 2.5-3.0 mm wide, normally unbranched, with (2)3 or 4 sessile lateral flower clusters or lowermost shortly stalked. Leaves clustered basally, with 2 cauline leaves, linear to narrowly sword-shaped, (2.5-)4.0-6.0 mm wide, firm to leathery, with narrow hyaline margins. Flower clusters 3 to 5, terminal cluster 2-flowered, lateral clusters 1- or 2-flowered; spathes green with membranous, hyaline or brown margins, (25-)30-38 mm long; bracts green to dry, 1/3 as long as spathes. Flowers pale blue, outer tepals with broad green stripe on reverse; tepals unequal, outer 16-18 x ± 7 mm, inner ± 16 x ± 9 mm. Filaments ± 3 mm long; anthers ± 3 mm long. Ovary cylindric, 3-lobed, 12-16 mm long, on pedicels up to 3 mm long; style ± 6.5 mm long; stigma lobes fringed. Capsules cylindric, deeply 3-lobed, (20-)24-30 mm long. Seeds ellipsoid, many per locule in single row, often oriented obliquely to capsule axis, smooth, surface cells ± plane to weakly domed.
