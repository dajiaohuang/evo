        usage:
          title: Bunchosia lindeniana A.Juss., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrub or small tree 2-8 m tall; stems sparsely appressed-pubescent with ses- sile T-shaped trichomes when young, glabrous in age. Leaves opposite, elliptic to oblong-elliptic, gradually to abruptly acuminate at the apex, rarely acute, acute to attenuate at the base, 5.5-20.5 cm long,,2-7 cm wide, subcoriaceous, glabrous or nearly so on both surfaces, usually with a pair of plate-shaped glands near the base, major lateral veins ca. 7 pairs, not prominent; petioles 4-8 mm long, sparse- ly appressed-pubescent to glabrous; stipules minute, appressed-pubescent. Pseu- doracemes axillary, 5-10 cm long, the rachis sparsely appressed-pubescent, the trichomes more or less translucent, sessile or stalked; bracts narrowly triangular, 1.0-1.5 mm long, more or less glabrous to appressed-pubescent; bracteoles del- toid, to ca. 1 mm long, in part glandular. Flowers 10-15 mm in diam.; sepals rounded at the apex, glabrous, the margin ciliate, the glands 10; petals yellow, clawed, the limb ovate-cordate to spatulate, 2-5 mm long; stamens exserted to Ca. 4 mm long, the filaments flattened and connate at the base, glabrous, the anthers subrounded, ca. 7 mm long, the connective swollen; ovary 2- or 3-car- pellate, globose, densely sericeous, the style ca. 2.5 mm long, pubescent. Drupe spheroid, 2- or 3-lobed, 10-12 mm long, glabrous, orange becoming red at ma- turity.
          originalLanguage: en
          sourceField: general
