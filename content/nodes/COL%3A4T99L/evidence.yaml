    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Stems up to 50 cm. high, glabrous, ridged, woody below, erect, branched mostly from the base. Leaves numerous but not crowded, 0-5-1-5 cm. long, 2-4 mm. wide, soft, flat, spreading or ascending, entire or with occasional teeth, ciliate at the extreme base otherwise glabrous, with or without axillary fascicles of small leaves. Flowers in dense heads, on the main stem and on long or short lateral branches, many-flowered, 1-5-3 cm. long and about as wide. Bracts broad, clasping, glabrous, acutely 3-7-toothed or lobed at the top, slightly thickened at the edges, the outer with the central lobe longer than the others, the inner with almost equal teeth. Calyx lobes longer than the bracts, glabrous, acute or acuminate, about half as long as the corolla. Corolla white, pale blue, mauve or pinkish, 1-2 cm. long, the lobes longer than the tube. Ovary glabrous.
            sourceIds:
              - sanbi_914_0
            locator: "SANBI/WFO archive Morphology row 82002; source 914.0; publication: Adamson, RS. 1951. A revision of the genera Prismatocarpus and Roella. J. S. African Bot. 17: 93 - 166. [CC BY]"
