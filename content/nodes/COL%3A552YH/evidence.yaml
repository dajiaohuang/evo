        usage:
          title: Tecomaria capensis (Thunb.) Spach, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrub or subshrub, the branches flexuous. Leaves opposite, pinnately com- pound, usually 7-11-foliolate; the leaflets elliptic to suborbicular, apically and basally rounded or abruptly cuneate, sessile, ca. 1.5 cm long and 1.0 cm wide, serrate, membranaceous, puberulous at least along main veins, the axils usually with tufts of branched trichomes. Inflorescence a raceme or racemose panicle. Flowers with the calyx cupular, 5-toothed, 5-7 mm long and 4-5 mm wide, more or less puberulous, cilate with scattered plate-shaped glands in the upper half; corolla orange to orange-scarlet, tubular, curved, 3.5-5 cm long and 0.6- 0.7 cm wide at the mouth, mostly glabrous, the lobes ciliate; stamens more or less equal in length, anthers exserted, the thecae ca. 3 mm long, slightly divergent for 1/2-%/. of their length, the slender filament attached ca. 1 mm from the fused end of the thecae; pistil 5.5-6.5 cm long, the ovary oblong, glabrous; disc cupular-pulvinate. Fruit rarely set in Central America, the capsule linear, 5-11 cm long and 7-8 mm wide; seeds in two rows, thin, bialate with hyaline membranaceous wings.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 2239
          archiveSourceId: F3677F02-DA29-4B48-BB0C-284453D88171
