    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, 20-45 cm, neck softly fibrous. Leaves 2-5, erect, subterete, hollow, equalling or exceeding the inflorescence. Flowers 2-7, stellate, white with green or red stripes beneath, without a solid beak, bracts 2-7, broad, spreading.
            textZh: Pauridia aquatica (L.f.) Snijman & Kocyan 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13877_0
            locator: "SANBI/WFO archive Morphology row 7528; source identifier 13877.0; cited publication: Snijman, DA. 2012. Hypoxidaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 115 - 119. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Pauridia aquatica is recognized by a horizontally growing, often partially fibreless corm and by more or less terete leaves which are frequently free of sheathing cataphylls at flowering. The inflorescence has two to seven soft-textured bracts which support the same number of white flowers, often in a loose, umbel-like cluster and the flowers characteristically appear nipped-in between the subcylindrical ovary and perigone by a short ovary beak of less than 0.6 mm. Its closest relative, P. alba, flowers earlier in the season, from late April to June, often slightly in advance of the leaves which are clearly sheathed by two or three cataphylls. P. alba never has more than two flowers per inflorescence and the flower is characterized by a conspicuous constriction formed by an ovary beak, 2-19 mm long, between the subcylindrical ovary and perigone. Plants of Pauridia aquatica vary greatly in size depending on local conditions that affect their aquatic habitats-water levels in pools or dams and the strength of currents in seasonal streams. Some especially small specimens come from the Agulhas Plain, where in years of less than average rainfall the vleis remain shallow and soon dry out. Like many other aquatic plants, P. aquatica has long, straight, erect leaves with aerenchymatous mesophyll, which enables the plants to cope with diminished levels of gas exchange during periods of seasonal inundation.
