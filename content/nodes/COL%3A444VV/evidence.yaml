        usage:
          title: Monnina xalapensis Kunth, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Herbs, shrubs or even small trees to 6 m high; branches striate, short-strigose or becoming ? glabrescent. Leaves oblanceolate, elliptic, or obovate-elliptic, acute to acuminate, sometimes cuspidate or falcate apically, acute to acuminate basally, 3-10 cm long, 1-3.5 cm wide, membranaceous to chartaceous, rather sparsely pubescent on both sides, usually more densely so along the costa and veins be- neath, sometimes glabrescent, the costa prominulous beneath with 5-7 pairs of lateral veins; petioles 3-12 mm long, pubescent. Racemes not at all comose, to 3.5 cm long and 1.5 cm wide, terminal or axillary; peduncles to 1.5 cm long, the axis 10 cm or less, conspicuously pubescent; bracts triangular-ovate, acute or obtuse, ciliate and pubescent, deciduous, 1.4-2.2 mm long. Flowers purple or blue; pedicels 1-2.4 mm long, pubescent; outer sepals free, triangular- or oblong- to suborbicular-ovate, acute to obtuse, sometimes mucronate at the obtuse apex, margin ciliate, short-pubescent or glabrescent outside, 2.5-3.2 mm long, usually all 3 ca equal, sometimes the upper sepal slightly longer and concave, usually the lower 2 with a small lateral lobe; wings suborbicular, hooded, broadly rounded apically, cuneate basally, usually ciliate on the margin, sparsely pubescent within, 5-6.2 mm long, 4.5-6 mm wide; keel orbicular, plicate laterally, emarginate apically, 5.5-6.5 mm long, 5-7.8 mm wide, rarely ciliate on the lower part of the margin, glabrous within; upper petals yellow, spatulate, pubescent within, sparsely pubescent or glabrous on the outside, 3.4-4.8 mm long; staminal sheath pilose apically, the free part of the filaments 0.8-1.2 mm long; ovary ellipsoidal to ovoid, 1.3-2 mm long, 0.8-1 mm wide, pubescent or glabrous, the style geniculate, 2.5- 3.5 mm long, the stigma 2-lobed, the outer acute, the inner tubercled. Drupe ellipsoid-ovoid, obtuse, rugose-reticulate, glabrous, 6-7.5 mm long, 3.5-4 mm wide.
