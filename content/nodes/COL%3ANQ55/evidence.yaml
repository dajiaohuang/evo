        claims:
          - text: Rhizomatous geophyte to 65 cm. Leaves linear, channelled, margins finely toothed. Flowers in a narrowly cylindrical raceme, white.
            textZh: Bulbinella graminifolia P.L.Perry 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13854_0
            locator: "SANBI/WFO archive Morphology row 8985; source identifier 13854.0; cited publication: Manning, JC; Goldblatt, P. 2012. Asphodelaceae: Bulbinella Kunth. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 73 - 74. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Bulbinella graminifolia is closely related to B. caudafelis, but separated from that species by its considerably finer, reticulate, fibrous sheath, and its smaller more narrowly cylindrical inflorescence with flowers purer white and faintly salmon-coloured in bud, but tepals not pink-veined. The fruit and the seeds of B. graminifolia are barely half the size of those of B. caudafelis.
            textZh: SANBI 条目提供了 Bulbinella graminifolia P.L.Perry 的鉴别特征。
