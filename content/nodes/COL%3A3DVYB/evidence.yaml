    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants clump-forming, very short-stemmed. Leaves erect, ovate-lanceolate, 21.5-35.0 x 16.5(-20.0) mm; leaf margins irregular, sometimes undulating or with (0-)2-5(-7) obscure, normal to coarse teeth, without or with few bristles of 0.1-4.0 mm long; shiny green, often with a reddish lustre, base reddish, with many small white crowded dots, margins and keel whitish. Flowers yellow; sepals 5, 8-10 mm long, base 2.5-5.0 mm broad, unequal; petals 70-84, emarginate to acuminate. 15.0-21.0 x 1.0-1.75 mm; stamens 8-9 mm long; filaments white. Nectaries brown-orange. Stigmas 8-11 mm long, shorter than longest stamens. Fruit stalk absent or up to 1 x 3 mm wide, 1 mm thick. Fruits sessile, when closed with rounded top, 0.65-9.0 x 0.5-0.8 mm, 0.6-0.9 mm thick. Seeds 0.85-1.0 x 1.15-1.30 mm.
