    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Ein meist einstengeliges, 40-60 cm grosses, ausdauerndes Kraut mit mehreren nickenden Köpfchen. Stengel bräunlich-grün, behaart, dicht beblättert, kaum verzweigt. Blätter verkehrt eiförmig, bis 20 x 8 cm, sitzend, geöhrt, beiderseits behaart (Drüsenhaare, fädige Gliederhaare), Rand flachbuchtig gezähnt. Köpfchen bis zu 5, an bis 4 cm langen, leicht gekrümmten Köpfchenstielen. Involucrum halbkugelig, 4- bis 5-reihig, 11-16 mm hoch, wenig kompakt erscheinend. Hüllschuppen blassgrün, krautig, ± stark behaart (Drüsenhaare, fädige Gliederhaare, ± steife Haare), die äussersten schmal dreieckig, 5 x 1.4 mm, vom Mittelnerv ± deutlich Seitennerven abzweigend, die inneren und innersten linealisch-lanzettlich, 12.8 x 1 mm und 12 x 0.8 mm, Rand hyalin, zerschlitzt, Spitzen gefranst, rotbraun. Zungenblüten 10-18, Ligula löffelförmig, 2.5 x 1.5 mm, blassgrün, 2- bis 3-zähnig oder 3-zipfelig, 4- bis 5-nervig, unterseits behaart (Drüsenhaare, steife Haare), stets Staminodien, gelegentlich Kronzipfelrudimente vorhanden - oder als Randblüten zygomorphe Röhrenblüten, 5-zipfelig, mit zurückgebildeten, funktionslosen Antheren. Scheibenblüten 36-69, Krone 8.30-11 mm lang, blassgrün, behaart (Haarformen der Zungenblüten). Pappus bestehend aus 38-45, bis 10.1 mm langen, barbellaten Borstenhaaren in 2-3 Kreisen, Borsten des äusseren Kreises teilweise kürzer und schwächer, zerschlitzt bis gezähnt. Achänen (noch nicht ganz reif) länglich, zylindrisch, 4.2 x 0.9 mm, braun, mit 9-10 Rippen, mit Drüsenhaaren und steifen Zwillingshaaren besetzt.
            sourceIds:
