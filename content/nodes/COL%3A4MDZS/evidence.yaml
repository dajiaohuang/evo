          - text: P. nutans ist das einzige Kraut der Gattung, ausserdem fällt die Pflanze durch die grossen, weichen Blätter sowie durch die Randblüten auf, die eine löffelförmige Ligula haben oder röhrenförmig und schwach zygomorph sind.
