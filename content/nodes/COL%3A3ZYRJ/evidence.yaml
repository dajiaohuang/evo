          - text: Einjährig, von der Basis an stark verästelt, Endzweige abstehend. Internodien bis zu 3 cm lang. Größte Blattlänge 2 cm mil am Grunde 6 mm breiter und 3 mm dicker Spreite. Die Blütenstiele sind 8 mm lang, die Kelchzähne wie auch der Kelchtubus werden 3 min lang, die Blumenblätter (von goldgelber Farbe und wohlriechend) sind 6 mm lang. Diese Art gehört in die Gruppe der Nodiflora und ist verwandt mit M. nodiflorum, von demselben jedoch dadurch verschieden, daß die Kelchzipfel kürzer sind als die Blumenblätter.
