        claims:
          - text: Annuum, e basi ramosissimum, ramulis tenuibus erectis, extimis patentibus, internodiis quamfolia plerumque multo longioribus. Folia patentia, lanceolata, subacuta, subtus medio longitudinaliter carinata, supra concava. Flores longiuscule pedicellati; calycis dentes elongato-triangulares, lalitudinesua duplo longiores; petala laneeolata quam calycis dentes 1 1/2-plo longiora, ovarium vertice convexum.
