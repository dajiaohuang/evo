        usage:
          title: Parathesis panamensis Lundell, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Trees, the branchlets stout, red-puberulent and papillose at first, glabrescent. Leaves slender-petiolate, the petioles to 1.5 cm long; leaf blades oblanceolate or oblanceolate-oblong, 6.5-11.5 cm long and 2-4.2 cm wide, subabruptly short- acuminate apically, the acumen obtuse, acuminate basally, decurrent, entire, black-punctate, thin, at first minutely pubescent on the lower surface with sessile stellate red subappressed trichomes, glabrescent, the costa elevated be- neath, nearly plane above, the veins fine and reticulate. Inflorescences terminal, paniculate, 4-7 cm long and to 4 cm wide at the base, densely and minutely pubescent with reddish trichomes. Flowers papillose and puberulent with minute trichomes, corymbose, the buds at anthesis slender, pyriform, ca. 5 mm long; pedicels 4-6 mm long; calyx small, densely black-punctate, the sepals subulate, 1.7-2 mm long; petals lanceolate-linear 5 mm long, black-punctate in lines; stamens 4 mm long, the anthers versatile, dorsifixed medially, lanceolate- oblong, 1.5 mm long, black-punctate dorsally with glands extending into the basal lobes, the filaments slender, 3-3.5 mm long, black-punctate in lines; ovary puberulent apically with minute reddish trichomes, the ovules 5 or 6, erect, enclosed, uniseriate, the placenta depressed-globose, minutely apiculate.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 8325
