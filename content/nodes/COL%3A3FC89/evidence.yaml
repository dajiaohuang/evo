        usage:
          title: Gasteranthus acropodus (Donn.Sm.) Wiehler, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Terrestrial subshrubs or shrubs; stems erect, to 1(-5) m tall, the younger stems strigillose, the older stems glabrescent. Leaves subequal in a pair, more or less elliptic, 7-20 cm long, 3-7 cm wide, membranous, the apex acuminate, the base obtuse to attenuate and decurrent, serrulate or crenulate to remotely serrate, above dark green and glabrous, below pale green and sparsely strigillose; petiole 1-3 cm long, strigillose. Inflorescences axillary but appearing terminal by re- duction of the main axis, umbellate or cymose, few flowered; peduncles 1.8-5.5 cm long, sparsely strigillose; pedicels 0.5-2.0 cm long, sparsely strigillose. Flowers with a broad receptacle, the calyx zygomorphic, the sepals distinct, un- equal, serrate to nearly entire, whitish, pale green or purplish, the posterior lobe ovate or rhombic, keeled, 9-15 mm long, the 2 lateral lobes obliquely ovate, 8-15 mm long, the 2 anterior lobes lanceolate, slightly keeled, 6-15 mm long; corolla oblique in the calyx, mainly yellow, but varying from cream white to lemon yellow, with or without reddish lines, spots or patches, the tube ventricose and broad from a spurred base, 2.2-2.8 cm long, the spur 6-8 mm long, the tube to 1.5 cm broad at the middle, slightly narrowed just below the limb, sparsely pilose outside the limb, slightly bilabiate, ca. 1.5 cm broad, the lobes ca. 2-5 mm long; stamens 4, included, the staminode short, attached to the corolla base below the nectary, the filaments flattened, curved, the anthers 1-2 mm long, con- nate; disc thickened posteriorly, pubescent; ovary glabrous to sparsely pilose, style ca. 7 mm long, pubescent, stigma bilobed. Fruit oblate globose, ca. 5 mm long, 8 mm wide; seeds oblong, light brown, obliquely striate.
          originalLanguage: en
          sourceField: general
