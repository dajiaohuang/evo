        claims:
          - text: Like D. oppositifolia but leaves adpressed, short, to 4 mm long, with apical callus and fruits without horns.
            sourceIds:
              - sanbi_14402_0
            locator: "SANBI/WFO archive Morphology row 11408; source 14402.0; publication: Manning, JC; Goldblatt, P. 2012. Rutaceae: Diosma L. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 718 - 719. South African National Biodiversity Institute, Pretoria. [CC BY]"
