            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Diosma dichotoma is recognised as distinct being a dense shrub up to 0.6 m tall, spreading to 1 m in diam. with leaves 1.5-4 mm long, lanceolate-acute, sessile, adpressed, opposite, with anthers tipped with a sub-stipitate reflexed gland and with fruits truncate, hornless. D. oppositifolia, the only other species of Diosma with opposite leaves and no staminodes, is distinguished by having much larger leaves and a sessile apical anther-gland.
