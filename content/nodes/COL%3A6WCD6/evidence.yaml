    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Soft slender perennial or annual (often mat-forming), up to 400 mm tall. Leaf blades 10-80 mm long, up to 14 mm wide. Culms prostrate. Spikelets 3.5-5.0 mm long (reduced spikelets often present), burr-like; upper glume usually with stiff hooked hairs.
            textZh: Pseudechinolaena polystachya (Kunth) Stapf 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_11118_0
            locator: "SANBI/WFO archive Morphology row 3210; source identifier 11118.0; cited publication: Herman, PPJ; Retief, E. 1997. Plants of the northern provinces of South Africa: Keys and diagnostic characters. Strelitzia 6: 1 - 681. National Botanical Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Inflorescences appear different with time as the hooks only develop after fertilisation and the delayed maturation of the sessile spikelets causes an extended flowering period. These conditions are regarded as adaptations to animal dispersal in a forest environment as the hooks on the upper glume aid in dispersing the mature spikelets. Similar in habit to other forest grasses such as Panicum and Oplismenus species, but these all lack the hook-like hairs on the upper glume.
