        usage:
          title: Cupania livida (Radlk.) Croat, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Trees to 18 m tall and 30 cm d.b.h.; stems densely rufous-tomentose, weakly sulcate when young, terete in age, glabrescent. Leaves pinnately 4-9-foliolate, 19-44 cm long; petioles 4-15 cm long; petiolules 3-10 mm long, swollen especially toward the base; petioles, rachises and petiolules densely rufous-tomentose; leaf- lets oblong-elliptic to oblong-oblanceolate, acuminate to long-acuminate at the apex, acute at the base, sometimes inequilateral and one side to 7 mm shorter than the other, 7-33 cm long, 3.5-10 cm wide, entire or nearly so, the upper sur- face glabrous or minutely and obscurely puberulent on the midrib, the lower surface densely rufous-tomentose on the major veins, less densely rufous-pubes- cent over the surface, the major lateral veins 10-13 pairs, ascending sharply near the margin, the secondary lateral veins extending between the primary laterals, the reticulate venation not prominent. Inflorescences terminal or from the upper axils, to 20-25 cm long; rachis and pedicels rufous-tomentose. Flowers not seen; calyx persistent in fruit, 5-lobed to near the base, the lobes acute, tomentose with- out, glabrous within Fruits obcordate, 2-lobed, sometimes also with a medial stylar ridge, 1.3-1.7 cm long, about as wide as long, 2-valved, brown to some- what violet purple, densely short-tomentose without, densely sericeous within, sessile or short-stipitate; seeds ellipsoid, ca. 1 cm long, black, shiny, glabrous, covered with a thin red aril, at least before maturity.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 12606
          archiveSourceId: 816A62CF-5CC2-4E7A-A2A4-43308EEC8295
