  claims:
    - subjectId: event:famennian-priscomyzon-oral-disc
      claimKind: scientific
      claimType: morphology
      statement: The Priscomyzon riniensis holotype AM5750, described as a little over 4.2 cm long, from the Famennian Witpoort Formation (Witteberg Group) at Waterloo Farm near Grahamstown, South Africa, preserves a large oral disc supported by annular cartilage, fourteen simple circumoral teeth and a branchial basket; the article's Figure 1 caption gives an approximate age of 360 Ma. The fossil is total-group lamprey evidence and does not directly establish a crown-Petromyzontida FAD, a feeding act, migration or an ammocoete lifecycle.
      confidence: medium
      confidenceRationale: The holotype anatomy, locality and Famennian assignment are described in the author-uploaded full-text rendering of the primary 2006 article. Medium confidence preserves the single-specimen boundary, the article's approximate numerical age and the absence of preserved lifecycle stages or a feeding act. The author's online proof pagination is recorded separately from the final journal pages.
      referenceLinks:
        - relation: supports
          referenceId: gess-2006-priscomyzon
          pages: author-uploaded proof pages 1–2; published article Nature 443, 981–984
          figure: Figure 1; Figure 3
          quoteLocator: Systematic palaeontology and Description for specimen/anatomy/locality; Figure 1 caption for 42 mm and annular cartilage; Abstract and phylogenetic discussion for interpretation. Proof pagination is distinct from the printed journal pagination.
  claim-rationales.zh:
    - 2006 年一手论文的作者上传全文呈现版本描述了正模解剖、地点和法门期归属。中等置信度保留单标本边界、论文采用的近似数值年代，以及未保存完整生命周期阶段或实际摄食过程的限制。作者在线校样式页码与期刊最终印刷页码分别记录。
  claim-statements.zh:
    - 法门期南非 Waterloo Farm Witpoort 组（Witteberg 群）的 Priscomyzon riniensis 正模 AM5750 长略多于 4.2 厘米，保存由环状软骨支撑的大型口盘、14 枚简单口周齿和鳃篮；2006 年论文图 1 图注给出约 360 Ma。该化石属于七鳃鳗总群证据，不能直接确立冠群首现、摄食行为、洄游或沙隐幼体生命周期。
