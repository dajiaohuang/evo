  claims:
    - subjectId: event:famennian-priscomyzon-oral-disc
      claimKind: scientific
      claimType: morphology
      statement: The 4.2 cm Priscomyzon riniensis holotype AM5750 from the Famennian Witpoort Formation at Waterloo Farm, approximately 360 Ma, preserves a large oral disc, fourteen circumoral teeth and a branchial basket; it is total-group lamprey evidence and does not directly establish a crown-Petromyzontida FAD, parasitic feeding, migration or an ammocoete lifecycle.
      confidence: medium
      confidenceRationale: The holotype anatomy, locality and Famennian assignment are described and illustrated in the primary study. Medium confidence preserves the single-specimen boundary, the source's approximate numerical age and the absence of preserved lifecycle or behavioural stages.
      referenceLinks:
        - relation: supports
          referenceId: gess-2006-priscomyzon
          pages: 981–984
          figure: Figures 1–3
          quoteLocator: Abstract; holotype description and reconstruction; phylogenetic hypotheses
  claim-rationales.zh:
    - 一手研究描述并图示了正模解剖、地点和法门期归属。中等置信度保留单标本边界、来源采用的近似数值年代，以及缺少生命周期阶段和行为直接保存的事实。
  claim-statements.zh:
    - 约 360 Ma 法门期 Waterloo Farm Witpoort 组的 Priscomyzon riniensis 正模 AM5750 长 4.2 厘米，保存大型口盘、14 枚口周齿和鳃篮；它是七鳃鳗总群证据，不能直接确立七鳃鳗冠群首现、寄生摄食、洄游或沙隐幼体生命周期。
