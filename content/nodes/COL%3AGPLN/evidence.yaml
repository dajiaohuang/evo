          originalSourceText: Lianas, with slender stems. Leaves alternate, spiral, oblong-ovate, cordate, 7 to 10 cm. broad, 10 to 15 cm. long, glabrous. Pseudostipules usually present. Flowers axillary, rectilinear, ca. 2.0 to 2.5 cm. long, mottled purple, the utricle gib- bous, 0.9 cm. long, narrowing abruptly into the tube, ca. 1.0 cm. long, which widens gradually into a funnelform, un- equally monolobate limb. Fruit cylindric, 3 cm. long, 1.5 cm. wide, dehiscing acropetally. Seeds numerous, horizontally compressed, 0.4 cm. diameter, 1 mm. thick.
