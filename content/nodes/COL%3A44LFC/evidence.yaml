        claims:
          - text: Spreading, much-branched shrub, up to 0.6 m tall, with puberulous young stems. Leaves clustered or solitary, linear or linear-lanceolate, 7-12 mm long, spine-tipped and hooked, margin scabrous, secondary ones smaller. Flowers sessile, white or pale pink, sepals two thirds as long as side petals. Capsule sparsely to minutely hispid, with prominent horns.
