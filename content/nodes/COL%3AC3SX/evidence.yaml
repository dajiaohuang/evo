            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: It is characterized by its robust spreading leaves, dichotomously branched inflorescence, erect racemes, and extremely long bracts. The bracts at the base of the branches are remarkable in that they attain a length of 10-11 cm. Those in the lower portion of the racemes are from 45-47 mm. long while those in the upper portion measure 25 mm. The flowers are a rich strawberry-pink (K.C.S.). This Aloe would appear to be closely related to A. affinis Berg., which also occurs in the same locality, but it differs from it in possessing shorter and more triangular leaves which are conspicuously spotted. Moreover, the leaves of A. affinis are distinctly erect, whereas those of A. longibracteata are almost always horizontal. The inflorescence usually bears 2 or 3 erect branches which spring from below the middle of the peduncle, while those of A. affinis arise well above the middle. The brightly coloured racemes make it a distinct and attractive ornamental plant.
