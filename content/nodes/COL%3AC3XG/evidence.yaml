    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Large, much-branched shrub, 1-2 m tall. Stem erect, carrying leaves for most of their length. Leaves dull blue-green, often reddish especially during drought, almost triangular, neatly arranged in vertical rows, curved backwards. Flowers in branched, capitate panicles, red to orange-red or yellow.
            textZh: Aloe pearsonii Schönland 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_14533_0
            locator: "SANBI/WFO archive Morphology row 32896; source identifier 14533.0; cited publication: Klopper, RR; Smith, GF. 2013. Asphodelaceae: Aloe. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 45 - 48. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: The leaves of A. pearsonii are smaller than those of any species in section Aloe except A. arenicola. In that species the stems are decumbent, and the leaves are incurved, with white spots and cartilaginous margins. In A. pearsonii the stems are rigidly erect, the leaves are reflexed and unspotted and the margins are not cartilaginous. A. dabenorisana is similar to A. pearsonii in having reflexed leaves, but in that species the leaves are larger, the plant is pendent not erect, and the anthers and style are not or hardly exserted. This is one of the slowest-growing of all aloes, and some of the large shrubs in the Richtersveld are probably several hundred years old.
            textZh: SANBI 条目提供了 Aloe pearsonii Schönland 的鉴别特征。
            sourceIds:
              - sanbi_5961_0
            locator: "SANBI/WFO archive Diagnostic row 51311; source identifier 5961.0; cited publication: Glen, HF; Hardy, DS. 2000. Aloe. In: G Germishuizen & E du Plessis (eds), Aloaceae (first part), Fl. S. Africa 5(1,1): 1 - 167. National Botanical Institute, Pretoria. [http://www.biodiversitylibrary.org/item/209564#page/3/mode/1up]. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: A striking character of A. pearsonii is the reddish leaves which are strongly deflexed, and when viewed from above are more or less arranged in 4-5 vertical ranks.
