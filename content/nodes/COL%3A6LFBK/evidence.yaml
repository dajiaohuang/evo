          - text: This species appears to be most closely related to H. herrei, but it differs from that species by the shorter and narrower, smooth leaves, as compared with the tubercled leaves of H. herrei; the two species may also be separated by the distinct differences in their floral characters. H. herrei has a longer peduncle and a shorter raceme than H. glauca.
