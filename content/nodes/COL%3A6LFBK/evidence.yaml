    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants caulescent, 50-80 mm high, 25-40 mm diam. Leaves about 60, crowded, ascending, tips incurved, 25-30 mm long, 8-10 mm broad, up to 4 mm thick, oblong-lanceolate, the young pale green, the old bluish green; upper surface flat, smooth; tower surface rounded, smooth, with 5-7 indistinct darker green lines; margins rounded, smooth; keel 1, central positioned in the upper half, smooth. Inflorescence about 31 cm tall; peduncle simple, about 1.5 mm diam., 160 mm long, bracteate; sterile bracts membranous, ovate, 8-11 mm long, erect, keeled; raceme about 180 mm long, with about 15 flowers and buds, 1 to 2 open simultaneously; floral bracts membranous, 5 mm long, deltoid, acute, keeled with fine brown veins, clasping the pedicels, (equal in length to the pedicels); pedicels 5 mm long, 1 mm diam., green, erect; perianth greyish-white with brown keels to the segments, 15 mm long, compressed at base, funnel-shaped, tube more or less 4 mm across, constricted to 2 mm above, straight; segments not free to the base; limb 2 lipped; posterior segments recurved, white with brown veins; exterior part recurved, spreading, white with brown veins; stamens 6 of two lengths 7 and 8 mm long, inserted within the perianth tube; ovary 4 mm long, 3 mm diam., green; style 2 mm long, straight, not capitate.
