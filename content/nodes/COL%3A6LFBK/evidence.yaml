        claims:
          - text: It forms a component of several different communities ranging from Renosterbos, Aloe and Euphorbia, or other vegetation. The rainfall is mainly in summer and varies between 126 and 250 mm per annum. The summers are hot and winters very cold, often with frost. H. glauca prefers a firm hard soil with pH 7.
