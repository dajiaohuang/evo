  claim-rationales.zh:
    - 争议置信度反映了可复现但对拓扑设定敏感的一手分析；性状编码、外群与类群取样会改变根部关系。
  claim-statements.zh:
    - 所引 457 性状分析恢复兽脚类与鸟臀类组成鸟跖类，而已发表的重编码与增补类群检验恢复传统拓扑；二者是竞争性的矩阵结果，并非直接观察到的祖先关系或已经定论的恐龙定义。
