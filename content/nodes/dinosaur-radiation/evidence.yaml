      claimKind: scientific
      claimType: topology
      statement: The cited 457-character analysis recovers Theropoda plus Ornithischia as Ornithoscelida, whereas the published rescoring and taxon-addition test recovers the traditional topology; these are competing matrix results, not directly observed ancestry or a settled definition of Dinosauria.
      confidence: contested
      confidenceRationale: Contested confidence records reproducible but topology-sensitive primary analyses; character coding, outgroups and taxon sampling change the recovered root relationships.
