        usage:
          title: Sida linifolia Cav., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Herb, annual or biennial, the stem erect, simple or more or less branched above, up to more than 1 m high, the branches suberect, pubescent with simple and/or stellate hairs. Leaves short-petiolate, the petiole 3-10 mm long, pilose, the stipules filiform to narrowly lanceolate, 4-7 mm long, pilose; blade linear or nar- rowly lanceolate, rounded or truncate or infrequently shallowly subcordate at the base, acute at the apex, entire-margined, 2-14 cm long and 2-15 mm broad, 3-nerved from the base, pubescent with simple and/or stellate hairs, the indumentum usually denser beneath, the main veins prominulous beneath. Inflorescences termi- nal, corymbiform or short-racemose, 8- to 20-flowered. Flowers with the pedicel 6-15 mm long, articulated 2-3 mm below the apex, hirtellous; calyx campanulate, subterete, 4.8-7 mm long, hirtellous to hirsute, persistent, the lobes triangular, acute, ca 2-4 mm long and 2.5-3 mm broad at the base; petals obovate, 8-15 mm long and 4-5 mm wide, cream-colored or whitish, usually with a maroon or dark purple center; staminal tube ca 2-3 mm long, minutely hyaline-puberulus near the apex, the filaments 0.5-1.0 mm long; styles 5-6 mm long, connate basally. Mericarps (5-)7-9, trigonous, shortly 2-apiculate, 2.5-3.5 mm long, papyraceolus, dull, brownish-black, glabrous, the lateral walls fragile and fragmenting at ma- turity; seeds ca 2 mm long, dull, dark brown, glabrous except for a few minute hairs around the hilum.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 7247
