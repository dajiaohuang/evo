        claims:
          - text: Tree, 2-10 m high, terminal buds present; winter buds with several unequal outer scales. Leaves alternate; broadly ovate-triangular, margins coarsely toothed and fringed with hairs, glands at junction of petiole and blade. Inflorescences pendulous, odourless catkins, appearing before leaves. Flowers unisexual, anemophilous; borne in axil of a serrate or laciniate bract; perianth reduced to a cup-like disc. Male flowers with 4-30 or more stamens; filaments free; anthers 2-thecous, oblong to ovate, red. Female flowers ovary sessile or subsessile, 1-locular; ovules many; style very short, 2-4-branched. Fruit a 2-4-valved capsule.
            sourceIds:
