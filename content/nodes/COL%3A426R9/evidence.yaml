    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Annual or short-lived perennial herb 0.6-2.3 m tall, softly woody at the base. Leaves petiolate; blade ovate to narrowly ovate, 15-45 x 10-30 mm, sparingly pubescent above, paler and usually softly white-tomentose beneath, apex obtuse, base truncate, margin finely and irregularly crenate-dentate; petiole 15-40 mm long. Inflorescence terminal, often branched, usually of horizontal, densely placed flower-clusters (scorpioid cymes), or sometimes lax; cymes usually in pairs from a common peduncle, many-flowered, secund, pectinate (comb-like); bracts leaf-like below, becoming smaller towards the apex; bracteoles linear-filiform, setose, 3 mm long. Calyx 2.5 mm long at flowering, increasing to 5 mm long, densely pubescent in the throat. Corolla whitish to mauve, 3.5 mm long.
