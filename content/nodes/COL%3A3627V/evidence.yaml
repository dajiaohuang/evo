    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants 0.50-1.05 m high, solitary or few in small tufts. Corm ± 20 mm diam. Stem with lowermost peduncle (70-)100-230 mm long. Foliage leaves few, 350-650 x 3.0-4.5 mm; reduced sheathing leaves ± 4. Spikes pendulous, terminal 7- to 12-flowered, laterals 2 to 5, each 4- to 9-flowered; bracts elliptic-lanceolate, acuminate, 15-25 x 6-9 mm, ± 2 internodes long, membranous, pure white or with a few flecks along main vein, lateral veins ± 5 each side of main vein. Flowers bell-shaped with tepals suberect or scarcely flaring apically, creamy white to pale yellow, rarely tinged pink or lilac; perianth tube (4.5-)5.0-6.0(-)7.0 mm long; tepals 9-12 x 4-5 mm. Anthers 5-6 mm long. Stigmas held 3-6 mm below top of perianth.
            textZh: Dierama pallidum Hilliard 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Morphology row 98560; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Occurring as solitary stems or small tufts with acuminate, pure white bracts, and small, rather closed, creamy white to pale yellow (rarely tinged pink or mauve) flowers, the perianth 14-18 mm long. Dierama sertum from northern coastal KwaZulu-Natal has similar flowers but bracts well flecked in the lower part and along the midline. Dierama argyreum, also with white bracts, has larger, bell-shaped white or ivory-coloured flowers, and the perianth 18-35 mm long with flaring tepals.
