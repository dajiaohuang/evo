            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: H. lockwoodii is a distinctive species with leaf-tips which dry up, becoming papery during the resting period and withdrawing into the ground with only the dry leaf tissues visible. Its nearest affinity is with H. mucronata, a species which is widely distributed in the Little Karoo. The leaves of H. mucronata are very similar to those of H. lockwoodii but lack the ability to allow the leaf-tips to dry under stress; there are also small differences in the inflorescences and flower parts.
