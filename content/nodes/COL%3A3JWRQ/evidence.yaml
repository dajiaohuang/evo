        claims:
          - text: The area receives scant rainfall of 125 to 250 mm per annum, which is mainly during the autumn or winter. The summer months are very hot and the winters very cold with snow on the higher areas. Plants are usually found growing between large stones or under Karoo scrub in quartzite soils. H. lockwoodii prefers a firm hard soil with pH 7.
