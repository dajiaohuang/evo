    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants acaulescent, with leaves in a basal rosette which is up to 100 mm diam., (not or) slowly proliferous from the base, 50 to 80 mm high. Leaves about 50, the young erect, ± incurved, the old somewhat spreading with tips slightly recurved, about 60 mm long, up to 3 mm broad, up to 3 mm thick, oblong to lanceolate, yellow-green, falcate; upper surface slightly convex or concave, flat below, the pellucid part about 18 mm long with about 8 green lines, smooth, with a paper-like tip appearing when dormant; tower surface slightly convex, smooth, the pellucid part about the same length as that of the upper surface, with about 8 reddish-brown longitudinal lines, smooth; keel 1, not distinct in the upper quarter, smooth; margins acute, smooth; end-awn about 6 mm long, smooth. Inflorescence about 220 mm tall; peduncle simple, terete, about 2 mm diam., 80 mm long, bracteate, greenish-brown; sterile bracts membranous, abruptly long acuminate, keeled with fine brown veins; raceme about 240 mm long, lax, with about 35 spirally arranged flowers and buds, 11 open simultaneously; floral bracts membranous, 8 mm long, deltoid acute, keeled with green veins, clasping the pedicels, (longer than the pedicels); pedicels 1 mm long, 1.5 mm diam., green; perianth white with green and brown keels to the segments, about 14 mm long, compressed at base, funnel-shaped, tube more or less 3 mm across, constricted to 2 mm above, curved; segments free to the base, limb 2 lipped; posterior segments erect, not spreading, tips recurved, white with green veins; exterior part strongly recurved, spreading, white with green veins; stamens 6 of two lengths 6 and 7 mm long, inserted within the perianth tube; ovary 4 mm long, 2 mm diam., light green; style 2 mm long, curved, capitate.
            textZh: Haworthia lockwoodii Archibald 的 SANBI 物种条目记录了形态特征。
