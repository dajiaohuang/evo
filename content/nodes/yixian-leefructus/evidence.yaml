  claims:
    - subjectId: event:yixian-leefructus
      claimKind: scientific
      claimType: fossil-range
      statement: Leefructus mirus from a 125.8–122.6 Ma bed in the Lower Yixian Formation preserves deeply trilobate leaves and an axillary reproductive axis ending in five long, narrow, partly united carpels, supporting an Early Cretaceous eudicot assignment without fixing Ranunculaceae affinity or the global eudicot first appearance.
      confidence: medium
      confidenceRationale: The dated bed, holotype, whole-plant reconstruction and diagnostic vegetative and reproductive characters are directly illustrated. Medium confidence retains the authors' proposed rather than definitive Ranunculaceae affinity and prevents a single locality from defining global origin, first appearance or diversity.
      referenceLinks:
        - relation: supports
          referenceId: sun-2011-leefructus
          pages: 625–628
          figure: Figures 1–5
          quoteLocator: Abstract; fossil description and discussion
  claim-rationales.zh:
    - 有年代约束的层位、正模、整株重建及诊断性的营养和生殖性状均有直接图示。中等置信度保留作者提出但未确定的毛茛科亲缘，并防止单一地点定义全球起源、首现或多样性。
  claim-statements.zh:
    - 义县组下部 125.8–122.6 Ma 层位中的 Leefructus mirus 保存了深三裂叶，以及末端具有五枚狭长、部分联合心皮的腋生生殖轴，支持其为早白垩世真双子叶植物，但不能确定毛茛科亲缘或全球真双子叶植物首现。
