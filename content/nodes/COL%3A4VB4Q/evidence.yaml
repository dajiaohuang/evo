        claims:
          - text: "Perennial, geophytic herb, 180-500 mm high; stems unbranched, erect. Leaves decussate, blade linear to narrowly ovate, 40-70 x 2-9 mm; petioles 1-3 mm long. Inflorescences 2-5 per stem, 3-6-flowered. Flowers: corolla lobes flat, 6-9 x 2.5-3.5 mm, deep red, maroon or purplish brown; corona lobes simple, erect, exceeding gynostegium tip, narrowly triangular in dorsal view, ventral side with median longitudinal groove, green or yellow with purple apex. Pollinia with germination zone extending across top of pollinium, edge distinctly thickened. Flowering time Oct.-Jan. Fruit a follicle, 45-55 mm long. 45-55 mm long."
            sourceIds:
