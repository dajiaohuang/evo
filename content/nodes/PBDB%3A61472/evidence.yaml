  claims:
    - subjectId: taxon:octocorallia
      claimKind: scientific
      claimType: topology
      statement: Mitochondrial protein-coding sequences from 103 genera and 28 families test octocoral relationships, but weak deep resolution leaves the root and several higher groups unsettled.
      confidence: medium
      confidenceRationale: Wide generic sampling supports many local clades, while limited mitochondrial variation constrains deeper topology.
      referenceLinks:
        - referenceId: mcfadden-2006-octocorallia
          relation: supports
          pages: 513–527
          quoteLocator: Figures 1–4; taxon sampling and phylogenetic results
    - subjectId: taxon:octocorallia
      claimKind: scientific
      claimType: fossil-range
      statement: "Octocorallia has no supported scalar crown range in the cited evidence: the mitochondrial phylogeny samples living octocorals but supplies no fossil or calibrated crown boundary, so the former 0–0 placeholder is withheld."
      confidence: low
      confidenceRationale: McFadden et al. (2006) directly supports extant octocoral topology, not an origin date. Low confidence records the absence of range-fit evidence for numerical endpoints.
      referenceLinks:
        - relation: supports
          referenceId: mcfadden-2006-octocorallia
          pages: 513–527
          figure: Figures 1–4
          quoteLocator: Living-taxon sampling and phylogenetic results
  claim-rationales.zh:
    - 广泛属级取样支持许多局部支系，但有限的线粒体变异限制了深层拓扑。
    - McFadden 等（2006）直接支持现生八放珊瑚拓扑，而非起源日期。低置信度表示数值端点缺少适合范围用途的证据。
  claim-statements.zh:
    - 来自 103 个属、28 个科的线粒体蛋白编码序列检验了八放珊瑚关系，但深层解析度较弱，根部及若干高级类群仍未定。
    - 现有引证不支持 Octocorallia 的单一冠群范围：线粒体系统树采样了现生八放珊瑚，却未提供化石或校准冠群边界，因此旧有 0–0 占位值被暂缓。
