  claim-statements.zh:
    - 包含 FMNH PR 2081 在内的编目暴龙科标本序列，其生长线提供组织学观察；年龄、渐近体重及霸王龙约每日 2.1 千克的峰值生长速率，都是受缺失生长线与体重方程制约的拟合估计。
