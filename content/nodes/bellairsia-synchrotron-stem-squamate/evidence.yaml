  claims:
    - subjectId: event:bellairsia-synchrotron-stem-squamate
      claimKind: scientific
      claimType: morphology
      statement: Synchrotron-scanned NMS G.2022.1.1 preserves a Jurassic mosaic of squamate-like and retained skeletal states and is recovered on the squamate stem in cited matrices; proposed kinesis and crown timing are not directly observed.
      confidence: medium
      confidenceRationale: A near-complete named skeleton, specified ESRF scans and referred comparison material support the anatomical record. Functional mechanics and topology remain conditional on reconstruction, character coding and molecular-backbone constraints.
      referenceLinks:
        - referenceId: talanda-2022-bellairsia
          relation: supports
          pages: 99–104
          figure: Figures 1–4; Extended Data Figures 1–10
          quoteLocator: pp. 99–104, Figs. 1–4 and Extended Data Figs. 1–10; NMS G.2022.1.1 from the Middle Jurassic Kilmaluag Formation, Skye (Extended Data Fig. 1), with Kirtlington elements treated as separate referred comparison material in Extended Data Fig. 4; Description, Computed tomography, Phylogenetic analysis and Discussion
  claim-rationales.zh:
    - 近完整具名骨骼、明确的 ESRF 扫描与归入比较材料支持解剖记录；功能力学和拓扑仍取决于复原、性状编码与分子骨架约束。
  claim-statements.zh:
    - 同步辐射扫描的 NMS G.2022.1.1 保存侏罗纪有鳞类样与保留型骨骼状态的镶嵌组合，并在所引矩阵中被恢复到有鳞类干群；所提出的运动性与冠群时间均非直接观察。
