    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, up to 150 mm tall, with branched stem. Leaves linear, channelled, all crowded at first aerial node, well above ground level. Flowers pale yellow with deep yellow nectar guides speckled with green at bases of all tepal limbs, tepal limbs spreading, claws very short, filaments united in a thickened column much exceeding tepal claws, anthers and pollen red, ± 5 mm long prominently displayed.
            textZh: Moraea intermedia Goldblatt & J.C.Manning 的 SANBI 物种条目记载了植株、叶片和花部形态。
            sourceIds:
              - sanbi_14562_0
            locator: Strelitzia 30; archive Morphology row 33331, source 14562.0
            placeTimeScope: Regional species account published 2013; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
          - text: The asymmetric corm with brown, ± woody corm tunics, relatively blunt, brown-tipped rhipidial spathes, and yellow, darkly veined tepals place Moraea intermedia in subg. Umbellatae. The long basal internode with leaves clustered at the first aerial node recalls M. nana of the subgenus, but the flowers have typical Moraea-like style branches with terminal, transverse stigma lobes and prominent, paired petaloid style crests. Unlike the typical Moraea flower, however, all six tepals of M. intermedia have short claws clasping the base of the filament column, the claws all bearing basal nectaries, and the limbs each have a nectar guide at the base. Other Moraea-type flowers have inner tepals lacking both nectaries and nectar guides. The similarly marked inner and outer tepals recall the Homeria-type flower as found in subg. Umbellatae in M. maximiliani and M. umbellata, whereas M. cooperi, M. linderi, M. longiflora and M. margaretae have more-or-less typical Moraea-type flowers. The remaining member of the alliance, M. nana, has spreading, subequal tepals with short claws clasping the base of the filament column but the style branches are reduced to paired filiform arms extending between the anthers. At the type locality, Moraea intermedia is parapatric with the closely related M. margaretae, which favours somewhat wetter sites, and a range of hybrids between the two species occurs there.
            textZh: SANBI 条目提供了 Moraea intermedia Goldblatt & J.C.Manning 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: Strelitzia 42; archive Diagnostic row 95252, source 18638.0
