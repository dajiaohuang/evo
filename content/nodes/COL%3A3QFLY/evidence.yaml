        claims:
          - text: Cormous geophyte, 12-30 cm. Leaves lanceolate in outline, margins undulate and crisped or entire blade undulate. Flowers pink, tube filiform, short, anthers oblong, unilateral and horizontal.
            textZh: Ixia erubescens Goldblatt 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 7114; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: "A relatively small species, Ixia erubescens is immediately recognized by the fine corm tunics, the 4-6 narrow, deeply undulate and crisped leaves, usually unbranched stem, and the vertically oriented flower with the stamens unilateral and slightly pendent when fully open. Both Lewis (1962) and De Vos (1999) regarded the flowers as fundamentally actinomorphic with symmetrically arranged stamens and noted that only late in anthesis do the anthers become unilateral and pendulous, simply due to gravity. Our own observations counter this: the stamens are unilateral immediately the flower buds open. We assume that I. erubescens is most closely allied to I. scillaris, which typically has medium to coarse corm tunic fibres, broader leaves, usually with plane margins, and somewhat to substantially larger flowers, also with unilateral stamens, but with a perianth tube up to 4.5 mm long and tepals up to 14 mm long (vs. tube 2-3 mm long and tepals 11-12 mm long). Occasional populations of I. scillaris with undulate or crisped leaves are readily distinguished from I. erubescens by their broader leaves, larger flowers, and coarser corm tunic fibres. The conservation status of I. erubescens is listed by Raimondo et al. (2009) as (LC), least concern, although its range has been historically much reduced through agriculture, especially in the Swartland and Boland."
            textZh: SANBI 条目提供了 Ixia erubescens Goldblatt 的鉴别特征。
            sourceIds:
              - sanbi_15933_0
            locator: "SANBI/WFO archive Diagnostic row 84453; source identifier 15933.0; cited publication: Goldblatt, P; Manning, JC. 2012. Systematics of the southern African genus Ixia (Iridaceae): 4. Revision of sect. Dichone. Bothalia 42(2): 87 - 110. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: A relatively small plant, Ixia erubescens is immediately recognised by the fine corm tunic fibres, 4 to 6 narrow leaves with deeply undulate and crisped margins, usually unbranched stem, nodding, pink flowers with vertically oriented tepals and the stamens unilateral and slightly pendent when fully open. Ixia erubescens is evidently closely allied to I. scillaris, which typically has medium to coarse corm tunic fibres, broader leaves, usually with plane margins, and somewhat to substantially larger flowers, also with unilateral stamens, but with a perianth tube up to 4.5 mm long and tepals up to 14 mm long (vs. tube 2-3 mm long and tepals 11-12 mm long). Occasional populations of I. scillaris with undulate or crisped leaves are readily distinguished from I. erubescens by their broader leaves, larger flowers, and coarser corm tunic fibres.
