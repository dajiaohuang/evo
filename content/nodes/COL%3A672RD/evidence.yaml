        usage:
          title: Anemopaegma puberulum (Seibert) Miranda, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Liana, branchlets subterete, puberulous or glabrate, the nodes without inter- petiolar glandular fields; pseudostipules small, inconspicuous, paired in each axil. Leaves 2-foliolate with a tendril or tendril scar; leaflets ovate-elliptic, acute, the base rounded, 8-13 cm long and 5.6-7.5 cm wide, chartaceous, the secondary veins 3-5 on each side; strongly puberulous beneath, glabrous and shiny above; tendril trifid; petiolules terete, 2.5-3.0 cm long, petiole 2.2-3.1 cm long. Inflores- cence a several-flowered ebracteate puberulous raceme. Flowers with the calyx cupular, subcoriaceous, truncate, puberulous with glands in the upper part, 6-8 mm long and 8-9 mm wide; corolla yellow, tubular-campanulate, 5-5.4 cm long and 1.5-1.6 cm wide at the mouth of tube, the tube 4-4.3 cm long, the lobes 0.8-1.0 cm long, glandular-lepidote inside and out, the tube glabrous except inside
