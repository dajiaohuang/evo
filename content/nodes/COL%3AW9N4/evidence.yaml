        claims:
          - text: Leaves 10-12, 1orate, distichous, bright green, 1 1/2-2 1/2 ft. long, 1-1 1/2 in. broad, narrowed gradually to the apex, but hardly at all below the middle; peduncle ancipitous, 1-1 1/2 ft. long; flowers 12-20 in an umbel; pedicels 1-1 1/2 in. long; spathe-valves several, linear or lanceolate, greenish, 1 1/2 in. long; perianth reddish-yellow, curved; tube infundibuliform, 1/3-1/2 in. long; segments all oblanceolate, obtuse, 1 1/4 in. long, 1/4-1/3 in. broad, tipped with green; stamens as long as the perianth-segments; anthers oblong, yellow, 1/8 in. long; ovary globose, 1/6 in. diam.; style finally much exserted; fruit ovoid, bright red, an inch long.
