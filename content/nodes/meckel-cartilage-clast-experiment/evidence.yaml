  claims:
    - subjectId: event:meckel-cartilage-clast-experiment
      claimKind: scientific
      claimType: event-mechanism
      statement: c-Fos mutant mice and clast-cell inhibition in Monodelphis show that blocking cartilage resorption can retain or ossify Meckel's cartilage and preserve a jaw–ear connection, but these living perturbations do not directly reveal the mechanism in any fossil.
      confidence: medium
      confidenceRationale: Two living-mammal experimental systems reproduce related persistence phenotypes and identify a clast-cell role. Medium confidence excludes literal recapitulation, acknowledges additional remodelling pathways and leaves ancient cellular mechanisms unobserved.
      referenceLinks:
        - referenceId: anthwal-2017-meckel-breakdown
          relation: supports
          pages: Article 0093
          figure: Figures 1–4
          quoteLocator: Results; Discussion; Methods
  claim-rationales.zh:
    - 两个现生哺乳动物实验系统重现了相关的持续连接表型，并识别破骨细胞作用。中等置信度排除字面重演，承认其他重塑途径，并把古代细胞机制保留为不可直接观测。
  claim-statements.zh:
    - c-Fos 突变小鼠与 Monodelphis 破骨细胞抑制实验表明，阻断软骨吸收可使麦氏软骨保留或骨化并维持颌—耳连接，但这些现生扰动不能直接揭示任何化石中的机制。
