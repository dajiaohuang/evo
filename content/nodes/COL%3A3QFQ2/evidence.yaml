    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, 12-30 cm, with corm tunics of coarse, wiry fibres. Leaves linear to lanceolate, sometimes falcate. Flowers white to beige, tube 24-34 mm long, cylindrical, filaments exserted 2 mm from tube.
            textZh: Ixia paucifolia G.J.Lewis 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 7126; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: "Recognised by the pale beige to creamy white flowers (sometimes described as pale yellow), a cylindric perianth tube (22-)25-35 mm long, and narrow tepals 11-15 x 3.0-4.5 mm, spooned at the tips. The filaments are ± 3 mm long and exserted ± 2 mm from the tube, and the style divides close to or opposite the anther tips so that the style branches arch over the anthers. The species is readily distinguished from I. dolichosiphon in herbaria by the very coarse-textured corm tunics, longer floral bracts, (6-)8-9 mm long, longer perianth tube (15-18 mm in I. dolichosiphon, which has bracts 5-6 mm long, white flowers flushed pale lilac, and veined purple outside). The shorter style divides opposite the middle of the anthers with the style branches extending between them. The two species also differ in flowering time and habitat: I. dolichosiphon blooms in August and early September and favours south-facing sandstone slopes, whereas I. paucifolia grows on clay and shale slopes and blooms in late September and October."
            textZh: SANBI 条目提供了 Ixia paucifolia G.J.Lewis 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 95070; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
