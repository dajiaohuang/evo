    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Perennial herb, up to 0.6 m high. Leaves sessile, linear to ovate, sometimes scabrid or armed with prickles. Flowers solitary. Perianth segments 6, forming a short tube, spreading. Stamens attached to perianth segments at throat of tube; anthers yellow with blue or purple tips. Flowers pink, mauve or pale blue.
            textZh: Walleria nutans J.Kirk 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_11118_0
            locator: "SANBI/WFO archive Morphology row 3933; source identifier 11118.0; cited publication: Herman, PPJ; Retief, E. 1997. Plants of the northern provinces of South Africa: Keys and diagnostic characters. Strelitzia 6: 1 - 681. National Botanical Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Closely resembling the southwestern Cape W. gracilis, with which C. nutans shares nodding flowers with apically connivent anthers dehiscing through introrse, subapical pores and sometimes prickly stems, pedicels and abaxial leaf midribs but distinguished by its free-standing, mostly unbranched stems, leaves without tendril-like tips, and unmarked, white or pink to pale blue tepals. The stems, pedicels and underside of the leaf midribs may be smooth or variously armed with recurved prickles but these are more delicate, almost bristle-like and mostly < 1 mm long, and the anthers are mostly yellow, with the purple and grey banding restricted to the apical third. This contrasts with W. gracilis, which has well-branched stems, more robust prickles 1.0-1.5 mm long, the upper leaves distinctly cirrhose and drawn into coiled, tendril-like tips, white tepals marked with a purple blotch at the base, and anthers that are yellow only in the lower half. The presentation of the flowers is also subtly different in the two species. The pedicels in W. nutans are essentially suberect up to the level of insertion of the bracteole in the upper third or quarter, at which point the pedicels are sharply decurved, whereas the bracteoles in W. gracilis are mostly inserted ± midway along the pedicels, which are therefore more arcuate. The seeds of W. gracilis are also distinctive in being essentially smooth in the basal half (apart from the trichome-tufts) with a dense apical cluster of suasage-like papillae, unlike those of W. nutans, which are entirely papillate, with the apical papilla only slightly longer.
            textZh: SANBI 条目提供了 Walleria nutans J.Kirk 的鉴别特征。
