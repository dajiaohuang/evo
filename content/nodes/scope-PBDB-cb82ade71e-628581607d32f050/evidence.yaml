  claims:
    - subjectId: taxon:kretzoiarctos
      claimKind: scientific
      claimType: fossil-range
      statement: Kretzoiarctos beatrix is bounded by Spanish dental specimens including holotype P4 MNCN-CSIC NV-2-42 within an approximately 11.8–11.2 Ma sample envelope; its ailuropodine placement does not make it a direct giant-panda ancestor or global family first.
      confidence: medium
      confidenceRationale: Named dental specimens and localities are direct; topology, diet and biogeographic origin are comparative analyses.
      referenceLinks:
        - relation: supports
          referenceId: abella-2012-kretzoiarctos
          pages: Article e48985
          figure: Figures 1–4
          quoteLocator: Holotype and referred material; phylogenetic analysis
    - subjectId: taxon:kretzoiarctos
      claimKind: scientific
      claimType: taxonomy
      statement: A published fossil-plus-living ursid morphology matrix recovers Kretzoiarctos within Ailuropodinae, but internal ailuropodine clades are unresolved in its majority-rule bootstrap tree.
      confidence: medium
      confidenceRationale: The result is a named analysis with explicit weak internal resolution, not a direct-ancestor assertion.
      referenceLinks:
        - referenceId: abella-2012-kretzoiarctos
          relation: supports
          pages: Article e48985
          figure: Figure 3; Table S1
          quoteLocator: Cladistic Analysis; bootstrap analysis
    - subjectId: taxon:kretzoiarctos
      claimKind: scientific
      claimType: biogeography
      statement: Kretzoiarctos is represented in the study by Nombrevilla 2 and ACM/C6-Camí in Spain; these two Iberian localities do not demonstrate a secure centre of origin or a complete distribution.
      confidence: high
      confidenceRationale: The claim is restricted to the two explicitly stated localities.
      referenceLinks:
        - referenceId: abella-2012-kretzoiarctos
          relation: supports
          pages: Article e48985
          figure: Figure 1
          quoteLocator: Type locality; Other localities; Chronological range
    - subjectId: taxon:kretzoiarctos
      claimKind: scientific
      claimType: morphology
      statement: The study identifies left P4 NV-2-42, right M1 NV-2-40 and partial mandible IPS 46473 with associated P4 as Kretzoiarctos material.
      confidence: high
      confidenceRationale: The statement reports named dental and mandibular specimens without extrapolating their anatomy.
      referenceLinks:
        - referenceId: abella-2012-kretzoiarctos
          relation: supports
          pages: Article e48985
          figure: Figures 1–2
          quoteLocator: Holotype; Paratype; new material
    - subjectId: taxon:kretzoiarctos
      claimKind: scientific
      claimType: ecology
      statement: The paper interprets dental features as a tendency toward a more herbivorous diet, but the dental sample does not directly observe feeding, habitat, locomotion or a population-wide ecological guild.
      confidence: medium
      confidenceRationale: The diet statement is a comparative interpretation and its limits are explicit.
      referenceLinks:
        - referenceId: abella-2012-kretzoiarctos
          relation: supports
          pages: Article e48985
          figure: Figure 3
          quoteLocator: Discussion; Ailuropodini dental features
  claim-rationales.zh:
    - 该结果是具名分析且内部大熊猫亚科解析度有限，并非直接祖先断言。
    - 主张严格限于原始研究明确列出的两个西班牙化石地点，不外推分布。
    - 陈述只报告具名牙齿与下颌标本，不外推其解剖。
    - 食性陈述来自牙齿比较解释，并明确保留其不是直接观察的限制。
    - 具名牙齿标本与地点属于直接证据；拓扑、食性和生物地理起源来自比较分析。
  claim-statements.zh:
    - Kretzoiarctos beatrix 由西班牙牙齿标本约束，其中包括处于约 1180 万—1120 万年前样本区间的正模上第四前臼齿 MNCN-CSIC NV-2-42；其大熊猫亚科位置不使其成为大熊猫直接祖先或全球科级首现。
    - 已发表的化石加现生熊科形态矩阵将 Kretzoiarctos 恢复在大熊猫亚科内，但多数规则自助法树未能解析大熊猫亚科内部支系。
    - 研究中的 Kretzoiarctos 由西班牙 Nombrevilla 2 与 ACM/C6-Camí 材料代表；这两个伊比利亚地点不能证明可靠的起源中心或完整分布。
    - 研究将左 P4 NV-2-42、右 M1 NV-2-40，以及带有关联 P4 的部分下颌 IPS 46473 鉴定为 Kretzoiarctos 材料。
    - 论文将牙齿特征解释为更偏植食的趋势，但该牙齿样本并未直接观察取食、栖息地、运动或种群尺度的生态类群。
