        usage:
          title: Amphirrhox longifolia (A.St.-Hil.) Spreng., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrub or small tree up to 1.1 m tall, the trunk up to 12.5 cm in diam. Leaves with the petioles canaliculate above, up to 12 mm long or more; blade narrowly elliptic to narrowly elliptic-subobovate, acute and narrowly decurrent at the base, acuminate at the apex, remotely serrulate to serrate at the margins, 5.5-16 cm long and 1.7-6 cm broad, chartaceous, the midvein prominent and the lateral veins prominulous beneath. Inflorescences axillary and terminal, of few-fasciculate, mostly 3-flowered cymes, the peduncles up to 6 cm long. Flowers with the pedicels up to 1 cm long, articulate below the middle; sepals ovate to broadly ovate, obtuse to -I- rounded, the 2 outer ones ca 2.5-3 mm long, the 2 inner ones ca 4.5-5 mm long; petals white or creamy white, up to 2 cm long, the anterior petal oblong- obcordate and up to 6 mm wide, the other petals oblong, slightly falcate, obtuse, up to 3.5 mm wide; filaments ca 1-1.5 mm long, the dorsal appendages united into a tube ca 1/2 as long as the filaments; anthers ca 1-1.5 mm long, the connective scales oblong to linear, obtuse, ca 1/2 as long as to equalling the anthers; ovary ovoid, 3-sublobulate, ca 1-1.5 mm long, the style up to 4 mm long. Capsule ellip- soid, 3-lobate, up to 2.4 cm long, the pericarp green when fresh and muricate; seeds up to 8 mm long, the testa blackish-brown and shining.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 13915
