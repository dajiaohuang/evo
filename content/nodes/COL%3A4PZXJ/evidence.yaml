          - text: Dwarf shrub, 0.3-0.5 m tall. Leaves opposite, scarcely fused at base, linear or subspathulate-linear, obtuse, thick and fleshy, finely spotted when young, some quite glabrous. Flowerheads discoid, terminal, solitary, ± cylindrical; outer involucral bracts oblong-elliptic, rounded, with submembranous, jagged-ciliate margins, otherwise glabrous. Cypselas with silky white hairs; pappus pale yellow.
