    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte to 30 cm, with tangled, woolly roots around corm. Leaves 3-9, spreading, narrow, channelled, minutely serrated. Flower 1, stellate, chrome- to sulphur-yellow, with green and white bands beneath, centre usually dark, style less than half as long as stamens, bracts 2, filiform.
            textZh: Pauridia linearis (Andrews) Snijman & Kocyan 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13877_0
            locator: "SANBI/WFO archive Morphology row 7534; source identifier 13877.0; cited publication: Snijman, DA. 2012. Hypoxidaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 115 - 119. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Both the linear leaves, which often have widely spaced, minute, recurved teeth on the margins, and the solitary flowered inflorescence, characterized by two, filiform bracts, suggest that Pauridia linearis is sister to P. serrata. Unlike P. serrata it has larger flowers, with longer (18-32 mm versus 7-16 mm) and often much broader tepals (up to 11.0 mm versus 4.5 mm), and widely spreading stamens which occasionally curve outwards. Those of P. serrata are only slightly spreading and remain straight or slightly incurved at anthesis. In addition, the style and stigma of P. linearis are short, seldom more than half as long as the stamens, whereas in P. serrata these range most often from a little more than half to as long as the stamens. The flowers vary from cadmium orange to sulphur yellow and usually have a dark reddish brown centre, if not at the base of the tepals or filaments then at least on the style; only rarely are the flowers concolourous. These markings, associated with the hopliine beetle pollination syndrome and well-developed within several plant families along the Western Cape Atlantic Coast, are never present in P. serrata. In the past, some herbarium collections of orange-flowered plants from the Kamiesberg, Namaqualand have been referred to as Pauridia linearis. The protologue, however, clearly mentions that the flowers are green-backed, a distinctive feature of the plants from the Western Cape Atlantic coast referred to here as P. linearis. In contrast, the orange-flowered plants from Namaqualand, recognized as a subspecies of P. gracilipes, are attractively rouged on the tepal backs.
