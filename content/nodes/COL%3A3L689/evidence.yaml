          - text: The bulbs typically have thick, felt-like outer tunics and are usually the largest in the genus (up to 40 mm diam.). The mature leaves are broad (4-16 mm) and sheathed by a conspicuous reddened cataphyll during the first growth flush. The flowers are similar to those of H. stellaris but are distinguished by the relative length of the perigone tube, which never exceeds the length to which the filament tube is exserted beyond the throat.
            textZh: SANBI 条目提供了 Hessea breviflora Herb. 的鉴别特征。
