        claims:
          - text: Bulbous geophyte to 20 cm. Leaves 2(3), dry or emergent at flowering, spreading, narrowly strap-shaped, basal sheath conspicuous and red. Flowers star- to widely funnel-shaped, in a small spreading cluster, pink, stamens slightly shorter to longer than tepals.
            textZh: Hessea breviflora Herb. 的 SANBI 物种条目记录了形态特征。
