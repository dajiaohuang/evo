          - text: Die Abhängigkeit der einjährigen Sippe von den jeweiligen Lebensumständen macht sie zu einer der vielgestaltigsten Arten der Gattung. Eindeutig zu erkennen ist F. dubia jedoch durch die Aussenhülle und die sehr typischen kleinen Achänen. F. tenera ist wohl die nächst verwandte Sippe.
