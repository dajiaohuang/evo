        usage:
          title: Bidens pilosa L., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Erect, branched, annual herb to 1.5 m tall; stems angled, green, glabrate. Leaves opposite, 3 (-5) -foliolate, the leaflets to 7 cm long, ovate, apically acute, obtuse or acuminate, basally acuminate to truncate, the margins serrate, pinnately veined, reticulate beneath, puberulent on both sides, the hairs longer beneath; petiole slender, basally expanded and slightly clasping, the basal margins ciliate. Inflorescence mostly of several loosely aggregated, terminal heads; peduncle to 5 cm long, slender, erect, glabrate or puberulent, drying angled. Heads, radiate or discoid; involucre 5-8 mm high, the bracts in 2 dissimilar series, the outer series narrow, herbaceous, expanded basally and apically, only the basal expansion imbricate, 1-nerved, the apex ciliate, obtuse or rounded, the inner series ovate, indurate, obscurely or conspicuously several-nerved, the margins scarious-hyaline; receptacle flat; paleas wanting; ray florets several in 1 series or wanting, the corolla white or yellow, 7-12 mm long, the tube short, dorsiventrally flattened, ciliate on the margins, the limb ovate, sometimes broadly so, 2-notched, drying prominently 5-7 nerved, the style present or not, the ovary sterile, faintly trigonous; disc florets numerous, the corolla yellowish or greenish, 3-4 mm long, sparingly stipitate-glandular, the tube ca. 1 mm long, the limb narrowly obconical, the 5 lobes dorsally pilose, the anthers black, ca. 2 mm long, with ovate, eglandular appendages, the basal auricles indistinct, the style branches flattened, lanceolate, pilose, with a linear apicule, the style base not expanded, immersed in a 0.5 mm long, cylindrical nectary, the ovary compressed, weakly 4-angled, pilose with ascending hairs, glandular-stipitate near the apex, the pappus of two stout retrorse-strigose awns. Achene black, 15-22 mm long, linear, strongly angled, glabrous but with a few stiff, short, ascending hairs near the apex; carpopodium oblique, stramineous, puberulent; pappus of 2-3 stiff, retrorsely strigose awns (aristae ), ca. 3 mm long.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 1372
