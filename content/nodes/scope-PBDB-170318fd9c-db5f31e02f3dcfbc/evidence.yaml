  claims:
    - subjectId: taxon:amniota
      claimKind: scientific
      claimType: fossil-range
      statement: Early Tournaisian clawed tracks from the Snowy Plains Formation make a near-Devonian/Carboniferous crown-Amniota minimum plausible under the cited trackmaker interpretation; the 358.9–0 Ma route is therefore contested evidence synthesis, not an exact fossil age or observed divergence.
      confidence: contested
      confidenceRationale: Track morphology and formation age are observed, but assignment ranges from a primitive sauropsid to a trackmaker near the amniote crown node. The endpoint records that explicit inference and its uncertainty.
      referenceLinks:
        - referenceId: long-2025-amniote-tracks
          relation: supports
          pages: 1193–1200
          figure: Figures 1–4; Supplementary Information Parts 1–4
          quoteLocator: Snowy Plains Formation track description; age model; trackmaker assessment; revised timescale discussion
  claim-rationales.zh:
    - 足迹形态与地层年代可直接观察，但制造者可能是原始蜥形类，也可能接近羊膜动物冠群节点；端点保留这一明确推断及其不确定性。
  claim-statements.zh:
    - Snowy Plains 组早 Tournaisian 期的具爪足迹，在所引足迹制造者解释下，使接近泥盆纪—石炭纪界线的羊膜动物冠群最低年代成为合理假说；因此 358.9–0 Ma 路线属于有争议的证据综合，不是精确化石年龄或直接观察到的分裂。
