        usage:
          title: Aphelandra campanensis Durkee, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrub to 3.5 m tall; stem quadrangular, strigose, the lenticels corky, elliptic, ca. 1 mm long. Leaves elliptic, to 30 cm long and 12.5 mm wide, apically acumi- nate, basally attenuate, mostly glabrous to sparingly strigose above, strigose beneath, denser along veins, the margins entire or undulate; petioles to 5 cm long, strigose. Inflorescences in terminal spikes, borne singly or in clusters, quadran- gular, to 19 cm long, 1-1.5 cm wide; rachis glabrate; bracts rhombic ovate, 10-11 mm long, 7-8 mm wide, apically obtuse to acute, apiculate, glabrate and minutely roughened with strigose hairs in some, the nerves prominent except toward the tip, with 2 submarginal glandular areas at about the midpoint consisting of a compact cluster of numerous, minute, dull, brown glands making an elliptic, alveolar spot 1.5-2.0 mm long and 0.5-0.75 mm wide, the margins subhyaline, entire; bracteoles falcate lanceolate, 9-10 mm long, 2.5-3.25 mm wide, keeled, striate nerved, densely hirsute along the keel, the marginal area glabrous, sub- hyaline, sparingly papillose. Flowers with the calyx segments conspicuously longer than the bracts, 15-17 mm long, apically obtuse, apiculate, striate nerved, glabrous outside, minutely roughened toward the apex inside, the anterior seg- ments oblong-lanceolate, 4.5 mm wide, the lateral segments lanceolate, 3.5 mm wide, the posterior segment ovate, 7 mm wide; corolla orange red, bilabiate, densely papillate outside and inside, the tube to 4 cm long, 5 mm wide at the base, constricted to 3.5 mm wide just above the apex of the ovary, expanding to 11 mm wide at the throat, the upper lip erect, ca. 19 mm long, 9 mm wide, ovate, apically with 2 acuminate lobes ca. 6 mm long, the lower lip spreading at maturity, the middle lobe ovate, to 23 mm long, 11 mm wide, apically acuminate, the tip keeled, the lateral lobes triangular, the free portion 1.5 mm long, 2 mm wide, fused to the upper lip for most of their length, the tip rounded; stamens extending to tip of upper lip, the anthers 9 mm long, 1.5 mm broad, acute at both ends; style and ovary glabrous. Capsules ovate, ca. 20 mm long, 6 mm broad, the tip rounded, the surface shiny and puncticulate; seeds suborbicular, 4 mm in diameter, the surface minutely roughened.
          originalLanguage: en
          sourceField: general
