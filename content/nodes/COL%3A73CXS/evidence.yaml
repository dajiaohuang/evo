      morphology:
        status: partially-supported
        claims:
          - text: An erect, white-woolly shrub to 2.5 m, sometimes 4 m, with often reflexed, lanceolate to ovate twisted leaves 2–15 mm long and axillary tufts; discoid heads are in terminal clusters, three- to five-flowered, with erect or rarely spreading bracts, outer ones brown below and inner petaloid bracts white, sometimes brown.
