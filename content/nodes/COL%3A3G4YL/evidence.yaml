        claims:
          - text: Cormous geophyte, 120-250 mm tall, corm with gnarled, woody tunics. Leaves lanceolate to falcate, plane. Flowers few in a flexuose inclined spike, creamy pink, lower tepals with pink and white markings, lightly scented, dorsal tepal narrow and arching.
