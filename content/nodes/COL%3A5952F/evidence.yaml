    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, 100-180 mm tall, stem mostly subterranean or concealed by the bracts. Leaves lightly falcate, in a tight fan. Flowers few in a crowded spike, bilabiate, bright yellow, perianth tube 15-24 mm, lower tepals each with a large tooth-like ridge.
            textZh: Tritonia florentiae (Marloth) Goldblatt 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_14562_0
            locator: "SANBI/WFO archive Morphology row 33390; source identifier 14562.0; cited publication: Goldblatt, P; Manning, JC. 2013. Iridaceae. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 94 - 124. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: A dwarf species, Tritonia florentiae, the only acaulescent member of the genus, has a tight fan of recurved, leathery leaves and large, fragrant, bright yellow flowers with long, crest-like calluses on the lower tepals. The species exhibits some highly unusual features, presumably associated with its ecology and habit. The inflorescence is reduced to several short, one-flowered branches, a development that has evolved several times in acaulescent members of several different genera of Crocoideae, including Crocus, Duthiastrum and Syringodea. The large, inflated capsules are unique in the genus. Tritonia florentiae resembles spring-flowering T. karooica in general habit, notably the tight fan of recurved, leathery leaves, and large flowers with long, crest-like calluses on the lower tepals, but the latter has an aerial stem, cream-coloured to dull orange flowers with conspicuous dark veins and a relatively longer, sharply bent perianth, about twice as long as the tepals.
            textZh: SANBI 条目提供了 Tritonia florentiae (Marloth) Goldblatt 的鉴别特征。
