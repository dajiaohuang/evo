        usage:
          title: Ardisia tysonii Lundell, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrubs, ca. 3 m high, the branchlets short, thick, furfuraceous-lepidote with large closely appressed brown scales. Leaves small, petiolate, the petioles 6-11 mm long, canaliculate, lepidote; leaf blades rigidly coriaceous, elliptic or ovate-elliptic, 5-8.5 cm long and 2-4 cm wide, subabruptly short acuminate apically, rounded and acutish basally, lepidote and paler beneath, glabrous early above, the young leaves conspicuously black-punctate, the margin entire, the midvein elevated beneath, narrowly impressed above, the primary veins slender, evident on both surfaces. Inflorescences terminal, tripinnately panic- ulate, with stout rachis and branches, furfuraceous-lepidote, to 10 cm long. Flowers 5-merous, glomerate at the ends of short thick branches, the pedicels short, ca. 1 mm long, thicker than the calyx; sepals broadly ovate-elliptic, 2 mm long and 2.2 mm wide, asymmetrical, rounded apically, the margin uniformly ciliolate, punctate with large black glands medially, with a few orange glands bordering these; ovary ellipsoid, punctate with small black glands, the ovules numerous, pluriseriate.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 8202
