        usage:
          title: Amaranthus hybridus L., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Rather coarse often pubescent annuals to 2.5 m. high with ascending branches. Leaves pubescent or glabrous, entire to minutely crenulate, deltoid- to rhombic- ovate, apically rounded to acute, often mucronate, basally acute to rounded, 2-15 cm. long, 1-7 cm. broad; petioles 1-8 cm. long. Inflorescences of congested thyrses racemosely disposed, the terminal and axillary thyrses mostly cylindric, 6-12 mm. broad. Flowers polygamo-monoecious or monoecious; bracts and bracteoles subequal, lanceolate to ovate, 2-4 mm. long, often conspicuously longer than the flowers; sepals lanceolate to ovate or obovate, acute to acuminate, 1.5-2.5 mm. long, the midribs dark green, the margins scariose, rarely tinged with anthocyanins; stamens 5, discrete, 1-3 mm. long; ovary ovoid; styles (2-) 3, conical; stigmata (2-) 3, fimbrillate. Fruit a slightly rugose compressed ovoid utricle, circum- scissile near the middle, 2-2.5 mm. long; seeds cochleate-orbiculate, reddish brown to black, minutely reticulate, 1-1.3 mm. broad.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 356
