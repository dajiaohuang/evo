        usage:
          title: Morinda panamensis Seem., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Trees or shrubs to 25 ft tall, the branchlets 4-angled, farinose puberulent or glabrescent, the nodes well spaced. Leaves oblong, ovate oblong or oblong ro- tund, 9-20 cm long, 5-15 cm wide, deltoid or rounded at the apex, shortly acu- minate, the acumen to 1 cm long, basally cuneate, often attenuately so and equi- lateral, the costa slender above, plane, prominulous or subimmersed above, the secondary veins 6-9, arcuate, to 3(-4) cm apart, chartaceous, glabrous or farinose above, pubescent or farinose beneath, rarely totally velutinous pubescent, the hairs often restricted to the axils and costa; petioles to 2.5 cm long, occasionally absent, farinose puberulent; stipules deltoid or oblong rotund, 6-10 mm long, 6- 9 mm wide, often wider than long, the peduncles ascending, 1.5-5.5 cm long, 1.5-5.0 mm wide, glabrescent, often farinose, terminated by 3-4 equal or unequal branches, to 3 cm long, each with a subrotund capitulum, 0.5-1.0 cm wide. Flowers sessile; hypanthium subrotund, truncate, ca. 1.8 mm long, minutely pu- berulent, the calycine tube to 1 mm long, the teeth absent or reduced to points; corolla white, the tube cylindrical, 7-8 mm long, thickly petaloid, minutely pu- berulent outside, villose inside above the middle, the lobes 4, valvate, thick, triangular in cross section, narrowly oblong, 2.5-5.0 mm long, tapering narrowly toward the apex, vaguely to obviously cordate at the base; anthers narrowly oblong, ca. 2.5 mm long, obtuse, the filaments inserted near the mouth; stigmas 2, digitiform, 3.5-5.0 mm long, erect, the ovary rectangular in cross section, the wall moderately thick, the septum thin, 2-loculate, the ovules one per cell. Fruits disposed in a capitulum, to 2.5 cm in diam.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 11864
