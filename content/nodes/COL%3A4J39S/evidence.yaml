        usage:
          title: Piper auritum Kunth, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: A small, soft-wooded, commonly more or less aromatic tree, 3-6 m. tall, often occurring in clumps; flowering internodes moderately slender and long, striate, often drying black, glabrate or sometimes slightly pubescent; leaves ovate, oblong- or elliptic-ovate, 12-20 cm. wide X 20-30 cm. long, or occasionally up to 25 X 40 cm. or more, apex acute or short-acuminate, base deeply cordate with one side 1-2 cm. longer at the petiole and with the lower lobe longer, sinus rounded to the petiole, the midrib with 3 or 4 upcurved branches from below the upper third and 3 or 4 branches from the base, rather thinly short-hairy above at least along the nerves, more densely so beneath, densely white-ciliolate throughout, drying thin, translucent; petiole 4-9 plus 1-2 cm. long, more or less pubescent or glabrate, vaginate-winged to the blade; spikes creamy or light-yellow when dry, 3-5 mm. thick X 10-25 cm. long; peduncle slender, 2-8 cm. long, glabrate, often black when dry; bracts round- or triangular-subpeltate, marginally fringed; fruit small, glabrate, obpyramidal-trigonous; stigmas 3, sessile.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 10046
