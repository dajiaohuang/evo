  claims:
    - subjectId: taxon:paraceratherium
      claimKind: scientific
      claimType: topology
      statement: A 155-character analysis places the 26.5 Ma Paraceratherium linxiaense as a derived member of a monophyletic Oligocene Paraceratherium clade, with detailed within-genus relationships remaining analysis-dependent.
      confidence: high
      confidenceRationale: The primary study provides the dated specimen, matrix and single most-parsimonious tree. High confidence applies to the published analysis, while the wording retains its model dependence rather than treating the topology as observed ancestry.
      referenceLinks:
        - referenceId: deng-2021-paraceratherium
          relation: supports
          pages: 1–10
          figure: Figures 1–7; Supplementary Tables 1–6
          quoteLocator: Age and diagnosis; 155-character analysis; Oligocene Asian distribution and dispersal discussion
    - subjectId: taxon:paraceratherium
      claimKind: scientific
      claimType: taxonomy
      statement: Paraceratherium is treated as an Oligocene paraceratheriid genus; the six sampled species form a monophyletic clade in the cited 155-character analysis.
      confidence: medium
      confidenceRationale: The primary paper provides a genus diagnosis, species sample and explicit cladistic result.
      referenceLinks:
        - referenceId: deng-2021-paraceratherium
          relation: supports
          pages: 1–10
          figure: Figures 1–7; Supplementary Tables 1–6
          quoteLocator: Age and diagnosis; 155-character analysis; Oligocene Asian distribution and dispersal discussion
    - subjectId: taxon:paraceratherium
      claimKind: scientific
      claimType: fossil-range
      statement: The atlas displays the 26.5 Ma Paraceratherium linxiaense LX1808 occurrence as a point sample and does not treat it as a genus-wide first or last appearance.
      confidence: medium
      confidenceRationale: Faunal correlation and palaeomagnetic placement directly support the sampled age, while the point-range wording prevents extrapolation to global genus endpoints.
      referenceLinks:
        - referenceId: deng-2021-paraceratherium
          relation: supports
          pages: 1–10
          figure: Figures 1–7; Supplementary Tables 1–6
          quoteLocator: Abstract, Type locality and horizon, Age section and Figure 5; LX1808 placed in middle C8r at approximately 26.5 Ma
    - subjectId: taxon:paraceratherium
      claimKind: scientific
      claimType: morphology
      statement: P. linxiaense preserves a giant skull, mandible and cervical vertebrae consistent with a large body and long flexible neck; the study does not support elephant-like stubby graviportal limbs.
      confidence: medium
      confidenceRationale: The diagnosis, measurements and vertebral comparisons directly support the revised morphology and remove an unsupported locomotor analogy.
      referenceLinks:
        - referenceId: deng-2021-paraceratherium
          relation: supports
          pages: 1–10
          figure: Figures 1–7; Supplementary Tables 1–6
          quoteLocator: Age and diagnosis; 155-character analysis; Oligocene Asian distribution and dispersal discussion
    - subjectId: taxon:paraceratherium
      claimKind: scientific
      claimType: ecology
      statement: Paraceratherium is represented as a giant terrestrial herbivore associated in the cited study with Oligocene Asian woodland–grassland mosaics; high feeding reach is an anatomical inference, not observed behavior.
      confidence: medium
      confidenceRationale: Medium confidence distinguishes fossil anatomy and faunal context from inferred feeding height and does not prescribe one habitat for every species.
      referenceLinks:
        - referenceId: deng-2021-paraceratherium
          relation: supports
          pages: 1–10
          figure: Figures 1–7; Supplementary Tables 1–6
          quoteLocator: Age and diagnosis; 155-character analysis; Oligocene Asian distribution and dispersal discussion
    - subjectId: taxon:paraceratherium
      claimKind: scientific
      claimType: biogeography
      statement: The cited phylogeny and occurrence map place Paraceratherium species across the Mongolian Plateau, northwestern China, Kazakhstan and Pakistan and infer dispersal through the Tibetan region.
      confidence: medium
      confidenceRationale: The geographic records are direct, whereas routes and palaeoelevation are model-based; the statement keeps that distinction explicit.
      referenceLinks:
        - referenceId: deng-2021-paraceratherium
          relation: supports
          pages: 1–10
          figure: Figures 1–7; Supplementary Tables 1–6
          quoteLocator: Age and diagnosis; 155-character analysis; Oligocene Asian distribution and dispersal discussion
  claim-rationales.zh:
    - 主研究提供测年标本、字符矩阵和单一最简约树。高置信度适用于已发表分析；措辞仍保留模型依赖性，不把拓扑当作直接观察到的祖先关系。
    - 分类主张以所引主研究或系统综述中的明确分类与样本为界，不把导航父级写成直接祖先。
    - 动物群对比与古地磁位置直接支持该样本年龄；点范围措辞阻止将其外推为全球属级端点。
    - 形态主张只保留引文图表或诊断直接支持的骨骼、牙齿性状，并把软组织、姿势或功能解释明确标为推断。
    - 生态主张区分直接测得的磨耗或同位素信号与栖息地、行为推断，并保留物种、地点和时代边界。
    - 生物地理主张按论文实际覆盖的地点和区域表述，不把区域样本扩写为完整全球分布。
  claim-statements.zh:
    - 副巨犀属按所引系统研究采用当前分类层级；导航父级仅表示分类关联，不表示直接祖先。
    - 副巨犀属的形态档案仅记录所引研究直接描述或测量的牙齿、颅骨或肢骨性状，功能解释另行标注。
    - 副巨犀属的生态档案按取样物种、地点与方法限定食性和运动推断，不把局部结果推广为整个类群的固定生态。
    - 副巨犀属的地理档案只覆盖所引研究明确讨论的区域与地点，并非完整的全球产出分布。
    - 一项包含 155 个字符的分析将距今 2650 万年的临夏副巨犀置于渐新世单系副巨犀支系的衍生成员位置；属内更细的关系仍取决于该分析。
    - 图集将 26.5 Ma 的临夏副巨犀 LX1808 记录显示为点样本，不将其视为该属的全球首现或末现。
