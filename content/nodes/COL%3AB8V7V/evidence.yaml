  claims:
    - subjectId: taxon:scleractinia
      claimKind: scientific
      claimType: divergence-time
      statement: A four-locus relaxed clock places sampled deep scleractinian splits in the Paleozoic, substantially before their skeletal record; this posterior estimate is model-dependent and not a fossil occurrence or exact Scleractinia origin.
      confidence: medium
      confidenceRationale: The clock result is explicit, but calibration, loci, taxon sampling and posterior uncertainty require a model-bounded interpretation.
      referenceLinks:
        - referenceId: stolarski-2011-scleractinia
          relation: supports
          pages: 1–10
          figure: Figures 1–4; Additional files 1–4
          quoteLocator: Four-locus sampling, relaxed-clock calibration and deep-water lineages
    - subjectId: taxon:scleractinia
      claimKind: scientific
      claimType: fossil-range
      statement: Scleractinia is displayed at 247.2–0 Ma as Oliver’s review-bounded Middle Triassic–Holocene fossil-to-living range; it is not the Paleozoic molecular-clock estimate, a symbiosis-event window or an exact crown-origin date.
      confidence: medium
      confidenceRationale: Oliver (1996), p. 107 and the opening synthesis, directly separates the Middle Triassic–Holocene scleractinian record from Paleozoic coral groups. Medium confidence reflects named-interval conversion and review-level synthesis.
      referenceLinks:
        - relation: supports
          referenceId: oliver-1996-paleozoic-corals
          pages: 107–110
          figure: Opening range synthesis
          quoteLocator: Abstract; Middle Triassic–Holocene Scleractinia statement
        - relation: contextualizes
          referenceId: ics-2026-06
          pages: International Chronostratigraphic Chart v2026/06
          figure: Global chronostratigraphic scale
          quoteLocator: Numerical Middle Triassic boundary
  claim-rationales.zh:
    - 时钟结果明确，但校准、位点、类群取样和后验不确定性要求采用模型限定解释。
    - Oliver（1996）第 107 页及开篇综述直接把中三叠世—全新世石珊瑚记录与古生代珊瑚类群区分开。中等置信度反映命名区间换算和综述级综合。
  claim-statements.zh:
    - 四位点松弛分子钟把取样深水石珊瑚分支置于古生代，明显早于其骨骼记录；这一后验估计依赖模型，不是化石出现或石珊瑚精确起源。
    - Scleractinia 的 247.2–0 Ma 展示限定于 Oliver 综述中的中三叠世—全新世化石至现生范围；它不是古生代分子钟估计、共生事件窗口或精确冠群起源日期。
