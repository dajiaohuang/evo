    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants 250-600 mm high, solitary. Corm up to 15 mm diam.; tunics of medium-textured fibres, sometimes extending upward in a collar around base. Stem sheathed below by light brown cataphylls, simple (rarely branched in subsp. notata), enclosed by 1 or 2 (subsp. graminicola) or 3 (subsp. notata), overlapping, green, attenuate sheathing leaves 120-150 mm long. Foliage leaf usually shortly exceeding stem at flowering time, linear, channelled, 7-25 mm wide. Rhipidial spathes green entirely or with dry brown apices, inner 140-180 mm long, outer ± 2/3 as long. Flowers long-lived, pale yellow to grey conspicuously veined with mauve, especially on crests, these sometimes mauve at base, outer tepal limbs with yellow nectar guides at bases; outer tepals ovate with narrow, tapering claws, 60-75 x ± 30 mm, claws ± 2/3 as long as limbs, inner tepals lanceolate, 40-45 x ± 15 mm, erect. Filaments 8-12 mm long, united in lower half; anthers ± 13 mm long. Ovary cylindric, ± 20 mm long; style branches ± 20 mm long, crests erect, 10-15 mm long, erect. Capsules cylindric-3-lobed, 25-30 mm long. Seeds flattened, discoid.
            textZh: Moraea graminicola Oberm. 的 SANBI 物种条目记载了植株、叶片和花部形态。
            sourceIds:
              - sanbi_18638_0
            locator: Strelitzia 42; archive Morphology row 84356, source 18638.0
            placeTimeScope: Regional species account published 2020; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
          - text: Recognised by its solitary habit and relatively large flowers with the outer tepals 60-75 mm long. Populations from KwaZulu-Natal are usually only 250-400 mm high and the stem bears a single sheathing leaf but Eastern Cape populations, treated as subsp. notata, are usually taller, up to 600 mm high, with two or three sheathing leaves, and the style crests stained with mauve near the bases, thus bicoloured. Subsp. graminicola may be confused with M. unibracteata which also has a single sheathing leaf and flowers early in the season but in M. unibracteata the foliage leaf is 2-10 mm wide, the sheathing leaf is inserted close to the base of the inflorescence, leaving the lower part of the stem visible, and the flowers are smaller than those of subsp. graminicola, the lower tepals 30-45 mm long and anthers 7-9 mm long vs. ± 13 mm in M. graminicola.
            textZh: SANBI 条目提供了 Moraea graminicola Oberm. 的鉴别特征。
