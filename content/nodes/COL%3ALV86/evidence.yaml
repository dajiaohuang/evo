          publishedAt: undated
          originalSourceText: Rhizomatous herb, stems obsolete or to 35 cm tall and woody, to 5 cm diam.; rooting up to 20 cm from the base, sometimes 2- or 4-branched; bark rough, appressed retrorse pubescent, glabrescent; root fibrous, to 10 cm long, twisted, branched. Leaves pseudoverticillate at the end of the stems, 15-30, 9-26 jugate, linear in outline, subcuneate; lower leaflets ovate to subtriangular, asymmetric, 1-2.5 mm long, 1-2.5 mm wide, the middle leaflets subrectangular to subfalcate, 2.5-10 mm long, 1.5-7 mm wide, the terminal leaflets semiobovate, asymmetric, basally truncate to subhastate, 6-11 mm long, 2.5-5 mm wide, the leaflets some- times overlapping, glabrous or sparsely hirsute on one or both sides, hirsute ciliate, obtuse or subacute, the mucro sometimes violaceous, the midrib medial or emerging from nearer the posterior angle, secondary nerves ascending, curved, branched, connected to a marginal nerve; rachis 2-10 cm long, hirsute, more so at the insertion of the leaflets; petiolules 1/4 mm long, thick, fleshy; petiole 1 mm
