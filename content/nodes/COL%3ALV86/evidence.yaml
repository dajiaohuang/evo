          publishedAt: undated
          originalSourceText: long, fleshy. Inflorescences subsessile or pedunculate, shortened, glomeruliform or fusiform, only 1 flower appearing at a time; peduncle erect, 1-8 cm long, subappressed pubescent or hirsute, the apex thickened, densely pilose; bracts subulate, to 6 mm long, purplish, pubescent; bracteoles 2-7 mm long, 0.5-1.5 mm wide, triangular linear to linear, the inner bracteoles prominently keeled, the keels somewhat lengthened, ascending ciliate; exceeding or about equalling the pedicels; pedicels 1-5 mm long, articulate in the lower half, glabrous or finely pubescent. Flowers with the sepals linear, 5-7 mm long, 1-1.5 mm wide, acu- minate, 7-10-nerved, glabrous or ascending pubescent, the base densely hirsute, the apex ciliate; petals whitish to pink or lilac, the base obovate or spathulate, 1.5-1.3 times the calyx length, slightly retuse, the base clawed, white; stamens with the filaments basally enlarged, glabrous, the longer stamens 4.5-5.5 mm long, the shorter stamens 3-4 mm long; pistils micro- and macrostylous, the ovary apically pilose, the carpels 1-6-ovuled, the styles sometimes unequal, pilose be- low, the stigma small, bifid. Capsule subglobose or oblong, 2.5-4 mm long, yel- lowish to violaceous, scarious, apically pubescent, or rarely pubescent overall, exceeded 1.75-2 times by the calyx, the carpels 1-6-seeded, short pubescent within; seeds semiovoid-triquetrous, one face more or less plane with an acute margin and the opposite face convex, 1.5 mm long, acute, longitudinally tuber- culate.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 9747
