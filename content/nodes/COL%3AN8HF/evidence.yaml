        usage:
          title: Bravaisia integerrima (Spreng.) Standl., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Tree to 18 m high; branchlets quadrangular, glabrous to puberulous or tomentose on the youngest portions. Leaves ovate to ovate elliptic, to 28 cm long, 10 cm wide, apically acute or acuminate, basally acute or oblique, the margins entire to slightly undulate, subcoriaceous, the surfaces glabrous, the costa and the lateral veins slightly pilose; petioles ca. 3 cm long. Inflorescence terminal in compact leafy panicles, to 13 cm long, 25 cm wide, the peduncles quadrangular; flowers subtended by 2 oval bractlets 2 mm long, apically obtuse, ciliolate and puberulent. Flowers with the corollas white or yellow with a purple spot in the throat, 1.5-2.0 cm long, glabrous, the tube campanulate, ca. 8 mm wide at the throat, the limb ca. 2 cm across, the lobes ca. 1 cm long, 6-8 mm wide, rounded or emarginate. Capsule elliptic, flattened, 10-12 mm long, glabrous, 8-seeded.
          originalLanguage: en
          sourceField: general
