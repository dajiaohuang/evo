            locator: "SANBI/WFO archive Diagnostic row 51112; source 3093.0; publication: Wild, H. 1984. Tiliaceae, Fl. S. Africa 21(1): 1 - 44. Botanical Research Institute, Pretoria. [http://www.biodiversitylibrary.org/item/209546#page/1/mode/1up]. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: G. hornbyi falls in Burret’s Sect. Axillares and is related to G. monticola Sond. Its much smaller leaves and fruits distinguish it from this species, however, together with its characteristic bracteoles which are reminiscent, on a smaller scale, of those of G. avellana Hiern.
