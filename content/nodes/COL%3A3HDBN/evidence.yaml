    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Shrub 2-4 m tall, branching from the base; young branches with a short white to brownish tomentum. Leaf-blade 15-35 x 8-20 mm, oblong-elliptic to oblong-ovate, sparsely stellate-pubescent to glabrous and shiny above, densely whitish-tomentose below, with small tufts of brownish hairs on the rather prominent nerves, apex obtuse, base obliquely subcordate or rounded; petiole 2-3 mm long, stellate-tomentose; stipules 3-4 mm long, subulate. Inflorescence axillary; peduncles 10-15 mm long, stellate-tomentose; pedicels 2-4 from apex of peduncle, 3-5 mm long; bracts 3-4 mm long, deeply trifid or bifid, narrow; flower-buds oblong, sulcate. Sepals 9-10 mm long, linear, 3-nerved, tomentellous outside, yellow and glabrous within. Petals yellow 4-4.5 x 1.5-2 mm, oblong-obovate, shortly 2-dentate at the apex, with a nectariferous claw, circumvillous within and ledged above. Androgynophore up to 1.5 mm long, glabrous except for a villous apex. Ovary shallowly 2-lobed, villous; style about 7 mm long, glabrous; stigma-lobes 4-5, broad. Fruit globose or deeply two lobed, lobes about 4 mm in diam., yellowish when ripe, sparsely setulose-pubescent.
            sourceIds:
              - sanbi_3093_0
            locator: "SANBI/WFO archive Morphology row 48738; source 3093.0; publication: Wild, H. 1984. Tiliaceae, Fl. S. Africa 21(1): 1 - 44. Botanical Research Institute, Pretoria. [http://www.biodiversitylibrary.org/item/209546#page/1/mode/1up]. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Related to G. monticola but has smaller leaves and fruits. The narrow bracts are 2-3-fid but are shed early and so are not present in fruiting specimens.
