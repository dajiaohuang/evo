        claims:
          - text: Cormous geophyte to 15 cm. Leaf solitary, linear, channelled. Flowers stellate, tepals spreading from base, purple with diamond-shaped nectar guides, style branches narrow, crests vestigial.
            textZh: Moraea worcesterensis Goldblatt 的 SANBI 物种条目记载了植株、叶片和花部形态。
            sourceIds:
              - sanbi_13878_0
            locator: Strelitzia 29; archive Morphology row 7377, source 13878.0
            placeTimeScope: Regional species account published 2012; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
          - text: A remarkable member of subg. Vieusseuxia, Moraea worcesterensis has small, star-like, violet-purple flowers with spreading outer and inner tepals both with small yellow nectar guides at the limb bases. The style branches, held well above the tepals, are much reduced, < 1 mm wide and ± as wide as the anthers, and lack true crests. The purple filaments are united in a cylindric column but free distally and the purple anthers slightly exceed the style branches.
            textZh: SANBI 条目提供了 Moraea worcesterensis Goldblatt 的鉴别特征。
            sourceIds:
