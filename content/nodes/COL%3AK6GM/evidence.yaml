    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Subcaulescent, cormous geophyte to 15 cm, 1-3-branched. Leaves lanceolate, slightly twisted above, velvety. Flowers 5-10 in a dense spike, zygomorphic, blue-mauve with white markings, tube 12-14 mm long, inner bracts divided to base, ovary hairy.
            textZh: Babiana toximontana J.C.Manning & Goldblatt 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 6739; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Distinctive in the spreading, velvety leaves, lightly coiled at the tips, Babiana toximontana typically has short, branched stems with horizontally arching, secund spikes, and fairly truncate bracts, the inner divided to the base. The flowers are moderately sized and pale to deep blue marked with white blotches and red streaks on the lower tepals. It is evidently closely allied to B. salteri, which also has oblique, rather spreading leaves and dense, horizontal spikes and also flowers early in the season, in late June and July. Babiana salteri has broader, more widely spreading leaves that are firm-textured and never twisted or coiled at the tips, and smaller flowers (tube ± 9 mm vs. 12-14 mm long and dorsal tepal 23 mm vs. 28-30 mm long) with the lower lateral tepals mostly or entirely yellow and the upper lateral tepals narrower and recurved. The two species favour different habitats, with B. salteri restricted to quartz patches on clay soils in succulent karoo scrub, and B. toximontana favouring sandstone-derived soils in arid fynbos. Babiana salteri is known for certain only NE of Vanrhynsdorp, whereas B. toximontana occurs in several populations in the foothills and lower slopes of Gifberg and Matsikamma.
            textZh: SANBI 条目提供了 Babiana toximontana J.C.Manning & Goldblatt 的鉴别特征。
