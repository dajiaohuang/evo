  claims:
    - subjectId: event:micrina-bivalved-reconstruction
      claimKind: scientific
      claimType: topology
      statement: "Mitral and sellate Micrina sclerites can be reconstructed as a near-bilaterally symmetrical sessile bivalved organism: sellate sclerites preserve paired muscle scars, while mitral apophyses are interpreted as muscle platforms. Valve homology and stem-brachiopod placement remain hypotheses rather than preserved articulation."
      confidence: medium
      confidenceRationale: Sellate muscle scars and mitral apophyses are observed, while the muscle-platform interpretation, whole-body reconstruction, valve homology and stem position are tested comparative hypotheses.
      referenceLinks:
        - referenceId: holmer-et-al-2008-micrina
          relation: supports
          pages: 724–727
          figure: Figures 2–3
          quoteLocator: p. 726, Figure 2, sellate paired muscle scars and mitral apophyses; pp. 726–727, Figure 3, reconstruction and brachiopod comparison
  claim-rationales.zh:
    - sellate 骨片的肌痕与 mitral 突起可直接观察；肌肉平台解释、完整体制复原、壳瓣同源和干群位置是可检验的比较假说。
  claim-statements.zh:
    - Micrina 的 mitral 与 sellate 骨片可重建为近两侧对称、固着生活的双瓣生物：sellate 骨片保存成对肌痕，而 mitral 骨片的突起被解释为肌肉平台。壳瓣同源性与干群腕足动物位置仍是假说，而非直接保存的关节连接。
