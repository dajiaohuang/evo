        claims:
          - text: Similar to O. multipunctata but leaves smaller. Flower heads subsessile and solitary.
            sourceIds:
              - sanbi_14184_0
            locator: "SANBI/WFO archive Morphology row 10744; source 14184.0; publication: Manning, JC; Goldblatt, P. 2012. Asteraceae: Oedera L. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 399 - 400. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: This species is recognized on its glandular-punctate leaves and slender involucres. It is related to R. multipunctata, but it has not the capitula arranged in cymes and the leaves are much smaller. Another related species is R. foveolata, from which it differs e.g. in characters of the achenes (see key and discussion under R. foveolata). Variation. The size of the capitula varies considerably in this species. Generally the involucres are narrowly cyathiform and slender with few florets, but they may be widely campanulate with increased space for more florets. The greatest variation is in Cedarbergen and it decreases further north and south respectively. In one collection (Compton 4293) the pappus of the disc-florets consists both of scales and bristles, a condition earlier discussed under Morphological aspects.
            textZh: SANBI 条目提供了该种的鉴别特征。
            sourceIds:
