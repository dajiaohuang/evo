    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants 450-700 mm high. Corm depressed-globose, 18-25 mm diam.; tunics cartilaginous, becoming coarsely fibrous, often accumulating around base of stem in a collar of coarse fibres. Stem erect, flexed outward above sheath of penultimate leaf, inclined above, unbranched, ± 3 mm diam. at base of spike. Leaves usually 7, lower 4 or 5 ± basal, forming a lax 2-ranked fan, reaching to ± base of spike, blades narrowly lanceolate to nearly linear, (2.5-)4.0-9.0 mm wide, margins and main vein moderately or strongly thickened, cauline leaves shorter, uppermost usually entirely sheathing. Spike inclined, (6-)8- to 12-flowered; bracts pale greenish brown below and ± dry and rusty brown in distal half by anthesis, outer (25-)30-40(-70) mm long, 1.5-2.0 internodes long, inner bracts slightly shorter. Flowers usually deep pink, occasionally pale pink to nearly white, lower 3 tepals each usually with dark pink to purple median streak, unscented; perianth tube narrowly and obliquely funnel-shaped, (27-)37-50 mm long, cylindric lower part (20-)27-38 mm long, wider upper part ± 10 mm long; tepals lanceolate, unequal, dorsal largest, horizontal and hooded over stamens, 26-32 x 17-20 mm (often smaller in preserved specimens), upper laterals directed forward and curving outward in distal 1/2, 24-32 x ± 12 mm, lower 3 tepals united basally for 4-6 mm, lower lateral tepals 20-24 x 12 mm, narrowed below into claws ± 2 mm long, lower median tepal 23-26 x 12 mm. Filaments 12-16 mm long, exserted 5-8 mm from tube; anthers 8-9 mm long, lilac; pollen cream-coloured. Style arching over stamens, dividing below or up to 5 mm beyond anther apices, branches ± 6 mm long. Capsules oblong, 3-lobed and retuse apically, 12-15 mm long. Seeds discoid to angular, 2.5-3.5 x ± 2.5 mm, wing poorly and irregularly developed or vestigial.
            textZh: Gladiolus varius F.Bolus 的 SANBI 物种条目记录了形态特征。
