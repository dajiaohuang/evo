            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Recognised by the narrow, fibrous leaves up to 9 mm wide with strongly thickened margins and midrib, and the moderately large, long-tubed pink flowers with perianth tube (27-)37-50 mm long, and large, rusty brown bracts (25-)30-70 mm long. The narrow, thickened leaves distinguish the species from Gladiolus saxatilis. Shorter tubed plants may be confused with G. ferrugineus, with mostly paler pink flowers with perianth tube 12-16(-25) mm long. Hybrids between the two species are recorded from the upper slopes of Long Tom Pass.
