    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Erect shrub, up to 1.8 m high, ± fleshy; stems reddish purple. Leaves sessile, up to 60 mm long, pale green, pinnatipartite, lobes linear. Inflorescence a terminal or lateral, few-headed, loose corymb; pedicels and peduncles straw-coloured; peduncles 2- or 3-forked, up to 100 mm long; pedicels shorter. Capitula 25-30 mm in diam.; involucral bracts 5, oblong, up to 10 mm long, basally connate; rays (5) and disc yellow. Flowering time July-Jan. Pappus of straw-coloured bristles, 8 mm long. Cypselae dark, glabrous, 2 mm long.
            sourceIds:
