          publishedAt: undated
          originalSourceText: the hairs straight; petals violaceous, obovate-oblong, clawed, connate near the middle, 2-3 times the length of the sepals, the areas exposed in bud covered with white sericeous appressed hairs; stamens with linear filaments, basally broad and abruptly narrowed about the middle, the longer stamens 3.5 mm long, pubescent, the shorter stamens 2 mm long, glabrous, connate to about 2/3, the anthers ovoid; pistils macro-, meso- and microstylous, ca. 5.5 mm long, the ovary pilose at least at the apex and back of the carpels, carpels 4-8-ovuled, the styles densely pilose, the stigma small, capitate. Capsule cylindric or oblong, acute, 8-11 mm long, the calyx to ?2 of its length, densely ascending appressed pubescent overall or only at the apex of the carpels, the carpels 4-8-seeded; seeds light brownish, ovoid or ellipsoid, acute at both ends, 1-1.25 mm long, 8-9-ribbed in zig-zag, transversally striate with 4-8 deep pits.
