        usage:
          title: Oxalis articulata Savigny, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Apparently stemless herb to 40 cm; stem ligneous, rhizomatous, brown, dark, more than 15 cm long, to 2 cm diam., tortuose, bearing the scars of the bases of stipules adnate to petioles of decayed leaves; roots tuberous, subligneous, cylin- dric, knobby or articulate, dark, thick, more than 10 cm long, 25 mm diam., branched, fibrous, to 15 cm long, sometimes with a long branch bearing a tuber at its apex. Leaves 3-30-fasciculate; leaflets widely obovate subcuneate or cu- neate, 5-30 mm long, 7-45 mm wide, slightly retuse or acute, incised to 1/5 Of its length, a purplish basal callus frequently present, the pubescence straight, ap- pressed, uniform, dense on both faces or only below, or shorter and loose; orange calli abundant near the margins, unequal, rarely scattered on the rest of the surface; stipules connate to the petiole, ovate or triangular, 4-16 mm long, 2-6.5 mm wide, narrowed towards the apex, the hairs appressed ascendent, ciliate; petioles ascendent, 13-30 cm long, densely appressed pubescent to glabrate with short appressed hairs; petiolule ca. 1/2 mm long, thick, densely pilose. Inflores- cences of umbelliform simple cymes, 2-5-flowered, bifid, asymmetric, multiflow- ered with up to 20 flowers or of bifid cymes composed of umbelliform cymes; peduncles taller than the foliage (2.5-40 cm) the pubescence similar to that of the petioles; bracts 2-3 mm long; bracteole 0.5-1(-2) mm long, situated at the base of the inflorescence, oblong or linear, appressed-pilose with 1-2 orange calli at the apex; pedicels long filiform, 1-5.5 cm long, articulate near the base. Flowers with the sepals linear-elliptic to linear 2.5-6.5 mm long, 1-2 mm wide, acute, the internal sepal obtuse, often with 3-4 unequal calli, densely appressed-pubescent,
          originalLanguage: en
