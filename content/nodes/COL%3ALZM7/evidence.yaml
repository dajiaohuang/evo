          originalSourceText: Shrubs 3-6 m. tall, the younger stems and petioles densely long-hirsute; petioles very stout, 1-3 cm. long; leaf-blades coriaceous, broadly elliptic, up to 14 cm. long and 11 cm. wide, rounded at both ends, 5-nerved with an additional pair of marginal veins, glabrous above, beneath densely long-hirsute on the principal veins, less so on the veinlets, and sparsely pilose on the surface; flowers solitary or paired, sessile or subsessile; bracts connate, densely hirsute with hairs about 4 mm. long; petals pink, about 2 cm. long; anthers broadly elliptic, about 6 mm. long, the connective bearing a very minute dorsal spur.
