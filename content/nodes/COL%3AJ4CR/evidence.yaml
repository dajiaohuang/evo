      ecology:
        status: partially-supported
        claims:
          - text: Astroloba cremnophila grow on N, E, W, & S facing cliffs above the Buffels River (later becoming the Gouritz River) at an altitude of between 600 & 800 m. Its habitat consists of sunny to slightly shady exposed cliffs with mainly Gamka Thicket vegetation (Fynbos on the upper slopes). The plants grow on ledges in mineral-poor quartzitic sandstone soil (Peninsula Formation, Cape Supergroup) together with other cremnophytes such as Adromischus leucophyllus, Albuca buffelspoortensis, Aloemitriformis subsp. comptonii, Crassula orbicularis, Crassula atropurpurea, C. cultrata, C. mucosa, Cyrtanthus inaequalis, Rhadamanthus montanus, Senecio citriformis, Senecio ficoides and Trichodiadema densum.
