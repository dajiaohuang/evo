    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants slow-growing, long-lived succulent perennials forming dense clusters (branched from the base) to about 400 mm in diameter and consisting of about 12-60 heads, mainly pendent from cliff-faces. Branches 50-200 mm long. Leaves ascending erect, in 5 spirally twisted rows densely imbricate in a central rosette (35-38 mm in diameter), glaucous-green, becoming reddish-green during the dry periods, in 5 ranks, ovate- triangular, firm, 22-25 x 12-15 mm with a distinct marginiform keel; margin cartilaginous, serrulate, apex acute to acuminate, minutely denticulate-tuberculate. Adaxial surface somewhat channeled, faintly striate; abaxial surface tuberculate; tubercles greenish-white. Inflorescence a simple raceme 120-460 mm long; scape 2-2.5 mm wide at the base, with raceme in upper half to one third. Bracts membranous; lower bracts to 5 mm long, triangular acuminate, whitish-translucent; floral bracts 2.5-3 mm translucent with darker median stripe. Flowers 3-10 mm apart, sub-secundly arranged, ascending spreading. Pedicel 3 mm long. Perianth 11 x 2.5 mm; lobes fused into a tube, slightly curved, free for 1.5 mm, grey- green, with white stripes; outer lobes spreading, apices truncate to emarginate; inner lobes obtuse, curved inwards. Stamens 8-9 mm long, anthers 5 mm long. Ovary 3.5 x 1.5-2 oblong, green, styles 3 mm long, stigma minute, white, capitate. Capsule linear ovoid 7 x 3 mm. Seeds not seen.
