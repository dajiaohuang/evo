    sources:
      - id: erickson2012
        referenceId: ref-d26f7dc5-d18c-8991-a4cc-efad0f7a40f5
        fields:
          - id
          - title
          - url
          - scope
        metadataVariant: 0
        usage:
          scope:
            zh: 对研究发表时认可的 23 种现生鳄类进行的咬合力与牙压实验；83 只性成熟个体来自研究、保育和展示机构，支持表 1 的样本测量及跨种体质量比较，不代表野外捕食力、物种全域变异或现行分类概念。
            en: Bite-force and tooth-pressure experiments on the 23 living crocodilian species recognized when the study was published; 83 sexually mature individuals came from research, conservation and display institutions. Supports Table 1 measurements and cross-species body-mass comparisons, not field performance, range-wide variation or current taxonomic concepts.
      - id: taxonomy
        referenceId: ref-d9d915ca-9251-8cd0-a6d6-0b5d4b1aaf23
        fields:
          - id
          - title
          - url
          - scope
        metadataVariant: 0
        usage:
          title: Catalogue of Life COL26.8 · source 1008
          url: https://www.checklistbank.org/dataset/316115/taxon/329
          scope:
            zh: 固定版本中的接受名、等级与鳄目分类关系。data/catalogue-of-life/releases/2026-08-20/registry/hierarchy/ 中的本地日期固定层级提供阅读索引的 27 个严格接受种后代和三个科分支；快照没有现生标志。目录记录支持身份与导航，不支持生物学结论，也不表示与同名 PBDB 化石记录等同。
            en: Pinned accepted name, rank and Crocodylia classification. The dated local hierarchy under data/catalogue-of-life/releases/2026-08-20/registry/hierarchy/ supplies the 27 strict accepted-species descendants and three family branches for the reading index. The snapshot has no extant flag. Catalogue records support identity and navigation, not biological conclusions or equivalence to matching PBDB fossil names.
      - id: strickland2016
        referenceId: ref-ff6d8ebf-a14c-8743-a411-91fe18a3726b
        fields:
          - id
          - title
          - url
          - scope
        metadataVariant: 0
        usage:
          scope:
            zh: 美国密西西比州 Pearl River 与 Ross Barnett Reservoir；2012–2013 年对 17 只成年雄性进行 VHF 追踪，共分析 1,145 个定位点。
            en: Pearl River and Ross Barnett Reservoir, Mississippi, USA; VHF tracking of 17 adult males in 2012–2013, with 1,145 locations analyzed.
      - id: rossi2020
        referenceId: ref-a403063b-2367-8638-aeff-b961e00d0e8a
        fields:
          - id
          - title
          - url
          - scope
        metadataVariant: 0
        usage:
          scope:
            zh: 美洲及大安的列斯群岛的样点遗传比较；新采集来自美国、伯利兹、委内瑞拉、古巴和牙买加，另整合墨西哥、哥斯达黎加等公开序列。
            en: Population-genetic comparison across the Americas and Greater Antilles; new sampling in the United States, Belize, Venezuela, Cuba and Jamaica, plus public sequences from Mexico, Costa Rica and other localities.
      - id: murray2019
        referenceId: ref-edc101a5-b053-8d47-a843-765672dc637a
        fields:
          - id
          - title
          - url
          - scope
        metadataVariant: 0
        usage:
          scope:
            zh: 对新几内亚南北种群头骨和外部形态的比较及新种描述；支持采样群体间的形态诊断，不支持完整种群生态或全域数量推断。
            en: Comparison of cranial and external morphology among northern and southern New Guinea populations, with a new-species description; supports diagnosis of sampled groups, not complete population ecology or range-wide abundance.
      - id: balaguera2017
        referenceId: ref-6f5784a3-4751-88bf-ad41-71b50aaf7eb0
        fields:
          - id
          - title
          - url
          - scope
        metadataVariant: 0
        usage:
          scope:
            zh: 哥伦比亚与委内瑞拉奥里诺科鳄的历史资料综述和潜在栖地模型；文献检索截至 2015 年。
            en: Historical literature synthesis and potential-habitat model for Orinoco crocodiles in Colombia and Venezuela; literature search covered records through 2015.
      - id: behangana2020
        referenceId: ref-cd4b8780-bca9-8e84-a241-69f6aac3bbe4
        fields:
          - id
          - title
          - url
          - scope
        metadataVariant: 0
        usage:
          scope:
            zh: 乌干达阿尔伯特湖三角洲一处种群的逐月样线观察、季节活动和体型阶段生境比较；不支持全物种范围推断。
            en: Monthly transect observations, seasonal activity and size-class habitat comparisons for one population in the Lake Albert delta, Uganda; does not support species-wide range inference.
      - id: fukuda2019
        referenceId: ref-c8de850c-8dae-899d-ad74-4ae920ec90fa
        fields:
          - id
          - title
          - url
          - scope
        metadataVariant: 0
        usage:
          scope:
            zh: 澳大利亚北领地的卫星追踪与沿海巢样本遗传结构分析；迁放雄性样本有限。
            en: Satellite tracking and coastal nest-sample genetic analysis in Australia's Northern Territory; a small sample of translocated males.
      - id: hekkala2011
        referenceId: ref-eabb36f2-a5a4-8569-af85-6f2d7aa0a6fa
        fields:
          - id
          - title
          - url
          - scope
        metadataVariant: 0
        usage:
          scope:
            zh: 结合现生非洲鳄样本、核型和埃及木乃伊 DNA 的系统发育研究；支持隐存谱系及历史尼罗河材料的结论，不支持现代数量或完整分布估计。
            en: Phylogenetic study combining modern African crocodile samples, karyotypes and Egyptian mummy DNA; supports the cryptic-lineage and historical Nile findings, not current abundance or a complete range estimate.
      - id: ahizi2021
        referenceId: ref-671d8377-56e6-814a-a654-0c6ba7382739
        fields:
          - id
          - title
          - url
          - scope
        metadataVariant: 0
        usage:
          scope:
            zh: 科特迪瓦 38 个地点、2014–2019 年重复调查中两种鳄类的探测概率、环境和人为变量模型；统计结论限定于研究区域与调查设计。
            en: Models of detection probability and environmental and human variables for two crocodilians across 38 Côte d'Ivoire sites surveyed repeatedly in 2014–2019; statistical findings are limited to the study area and survey design.
      - id: carr2021
        referenceId: ref-ee630cce-59d4-8910-ae4b-48abd0ca5a28
        fields:
          - id
          - title
          - url
          - scope
        metadataVariant: 0
        usage:
          scope:
            zh: 比较两种现生细吻鳄的成年头骨形态与线性测量；支持颅形区分及诊断变量，不支持生态、种群数量或分布区结论。
            en: Comparison of adult cranial shape and linear measurements in the two living slender-snouted crocodiles; supports skull-shape differentiation and diagnostic variables, not ecological, population-size or range conclusions.
      - id: gvozdik2024
        referenceId: ref-46b9fd4b-23a3-82a4-a184-442810c367dd
        fields:
          - id
          - title
          - url
          - scope
        metadataVariant: 0
        usage:
          scope:
            zh: 刚果共和国西北部一处同域地点的调查和少数侏儒鳄基因组比较；支持局地同域记录与研究样本中的分化比较，作者明确指出需要更大样本。
            en: Survey and genomic comparison of a small dwarf-crocodile sample from a syntopic site in northwestern Republic of the Congo; supports the local co-occurrence record and divergence comparison in the study sample, while the authors call for larger samples.
      - id: shirley2017
        referenceId: ref-1ae1e676-970d-8cd6-af67-a01296b409b1
        fields:
          - id
          - title
          - url
          - scope
        metadataVariant: 0
        usage:
          scope:
            zh: 加蓬 Abanda 洞穴与周边森林矮鳄的食性和体况局地比较；沿用原文分类名称，不独立解决洞穴种群的谱系地位。
            en: Local comparison of diet and body condition in dwarf crocodiles from Gabon's Abanda caves and nearby forest; follows the paper's taxonomic usage and does not independently resolve the cave population's lineage status.
      - id: eaton2009
        referenceId: ref-b9a67e2c-d194-801b-a844-08e0cc7746de
        fields:
          - id
          - title
          - url
          - scope
        metadataVariant: 0
        usage:
          scope:
            zh: 对多个已知地点样本的线粒体与核基因及有限形态比较，支持三个地理谱系并定位 O. tetraspis 模式产地流域；不直接确定后来的 Abanda 洞穴采样个体归属。
            en: Mitochondrial and nuclear markers and limited morphology from multiple known localities support three geographic lineages and identify the basin of the O. tetraspis type locality; the study does not directly assign later Abanda cave samples.
