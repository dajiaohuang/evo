  claims:
    - subjectId: taxon:asteriornis
      claimKind: scientific
      claimType: fossil-range
      statement: Asteriornis is anchored by CT-imaged holotype NHMM 2013 008 from a tightly constrained latest Maastrichtian horizon in Belgium; the occurrence is not a global crown-bird FAD and its crown placement remains analysis-dependent.
      confidence: high
      confidenceRationale: The specimen and horizon are direct, while alternative phylogenetic methods place it differently. High confidence applies to occurrence, not a universal crown boundary.
      referenceLinks:
        - referenceId: field-2020-asteriornis
          relation: supports
          pages: 397–401
          figure: Figures 1–4; Extended Data Figure 7
          quoteLocator: Holotype; Geological setting; age constraint; Phylogenetic analyses
    - subjectId: taxon:asteriornis
      claimType: taxonomy
      claimKind: scientific
      statement: Field et al. named Asteriornis maastrichtensis from holotype NHMM 2013 008; parsimony placed it as sister to crown Galloanserae whereas tip-dated Bayesian analysis placed it as the stemward-most Pangalliformes member, so exact crown position remains method-dependent.
      confidence: medium
      confidenceRationale: The name, type and two reported topology results are explicit. Confidence remains medium because the analyses disagree on the exact near-galloanseran branch and do not establish direct ancestry.
      referenceLinks:
        - referenceId: field-2020-asteriornis
          relation: supports
          pages: 397–401
          figure: Figure 3; Extended Data Figure 9
          quoteLocator: Systematic palaeontology; parsimony and tip-dated Bayesian phylogenetic analyses
    - subjectId: taxon:asteriornis
      claimType: biogeography
      claimKind: scientific
      statement: NHMM 2013 008 comes from the Maastricht Formation at the CBR-Romontbos quarry in Belgium; its Northern Hemisphere occurrence challenges a Gondwanan-origin hypothesis in the cited analysis but does not identify the geographic origin of crown birds.
      confidence: high
      confidenceRationale: The quarry and formation provenance are direct records. The broader biogeographic consequence is framed only as a challenge to one hypothesis, not as proof of an alternative origin.
      referenceLinks:
        - referenceId: field-2020-asteriornis
          relation: supports
          pages: 397–401
          figure: Figure 3; Extended Data Figure 7
          quoteLocator: Geological setting and provenance; Northern Hemisphere biogeographic discussion
    - subjectId: taxon:asteriornis
      claimType: morphology
      claimKind: scientific
      statement: NHMM 2013 008 includes a nearly complete, three-dimensionally preserved skull and associated postcranial elements and exhibits a combination of galliform-like and anseriform-like cranial features in the authors' comparison.
      confidence: high
      confidenceRationale: The CT-imaged specimen, preserved elements and comparative cranial observations are documented directly. High confidence is confined to the sampled anatomy rather than its universal phylogenetic interpretation.
      referenceLinks:
        - referenceId: field-2020-asteriornis
          relation: supports
          pages: 397–401
          figure: Figures 1–2; Extended Data Figure 7
          quoteLocator: Holotype and CT description; comparative skull and quadrate morphology
    - subjectId: taxon:asteriornis
      claimType: ecology
      claimKind: scientific
      statement: The cited study estimates a mean body mass of 394 g and proposes only a possible littoral ecology from small size and depositional context; it does not resolve species-specific diet, locomotor performance or a feeding guild.
      confidence: medium
      confidenceRationale: The body mass is a skeletal-scaling model result and littoral ecology is explicitly tentative. The remaining ecological fields are withheld because the study does not directly support them.
      referenceLinks:
        - referenceId: field-2020-asteriornis
          relation: supports
          pages: 397–401
          figure: Extended Data Figure 8
          quoteLocator: Mean body-mass estimate and discussion of possible littoral ecology
  claim-rationales.zh:
    - 标本与层位是直接证据，而不同系统发育方法给出不同位置。高置信度适用于出现记录，不适用于普遍冠群边界。
    - 名称、模式标本与两项拓扑结果均有明确报告。两种分析对近鸡雁类的具体位置并不一致，且不建立直系祖先关系，因此置信度为中等。
    - 采石场和地层组来源是直接记录。更广泛的生物地理意义仅表述为对一个假说的挑战，而不是另一种起源的证明。
    - CT 成像标本、保存构件与比较头骨观察均有直接记录。高置信度只覆盖取样解剖，不延伸为普遍系统位置。
    - 体重是骨骼尺度模型结果，滨岸生态在原文中也明确只是可能性。论文未直接支持的其余生态字段保持不详。
  claim-statements.zh:
    - Asteriornis 由比利时严格约束的最晚马斯特里赫特期层位中、经 CT 成像的正模 NHMM 2013 008 锚定；该记录不是全球冠群鸟类首现，其冠群位置仍依赖分析。
