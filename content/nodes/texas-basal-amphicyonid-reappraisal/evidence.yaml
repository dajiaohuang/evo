  claims:
    - subjectId: event:texas-basal-amphicyonid-reappraisal
      claimKind: scientific
      claimType: topology
      statement: CT and renewed scoring of TMM 40209-200 and the Angelarctocyon jaw sample support reassignment of two Texas “Miacis” species to distinct genera recovered as basal amphicyonids, but geographic origin and exact branching order remain model-dependent.
      confidence: medium
      confidenceRationale: Texas “Miacis” beardog reappraisal uses explicit named specimens or disclosed datasets, but placement, function or ecology depends on a sampled matrix or comparative model and is kept separate from observation.
      referenceLinks:
        - referenceId: tomiya-tseng-2016-beardogs
          relation: supports
          pages: "160518"
          figure: Figures 1–7; Tables 1–2; Electronic supplementary material
          quoteLocator: Revised systematics; Digital reconstruction; Phylogenetic analysis
  claim-rationales.zh:
    - “得州“细齿兽”犬熊类重评”的具名标本或已公开数据集是明确的，但位置、功能或生态依赖采样矩阵或比较模型，且已与直接观察分开。
  claim-statements.zh:
    - 对 TMM 40209-200 和 Angelarctocyon 颌骨样本的 CT 与重新编码，支持把两个得克萨斯“Miacis”物种改归为两个不同属，并恢复为熊犬科基部成员；但地理起源和确切分支次序仍依赖模型。
