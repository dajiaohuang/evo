          - text: "Boophone haemanthoides differs from B. disticha in the following : The perianth tube is shorter. The perianth segments remain erect or sub-erect until they wither. The spathe valves are larger. The perianth is cream-coloured becoming reddish only with age."
            textZh: SANBI 条目提供了 Boophone haemanthoides F.M.Leight. 的鉴别特征。
