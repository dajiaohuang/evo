          title: Peperomia ciliolibractea C.DC., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: A moderate-sized, assurgent herb; stem 3-4 mm. thick, ascending to 15 cm. or more from the decumbent, rooting base, velvety pubescent; internodes scarcely 1 cm. long, nodes somewhat tumid, leaf-scars large; leaves alternate, oblong-ovate or subobovate, apex shortly sharp-acuminate, base rounded, cordulate to acute, mostly 2-5 cm. wide X 5-8 cm. long, occasionally up to 7 X 14 cm., puberulent on both sides, rather densely so along the nerves beneath, ciliolate, 9- to 11- plinerved, the uppermost lateral nerves branching off the midrib near the middle, drying membranous, translucent, reddish-glandular-dotted beneath; petiole 2-5 or sometimes up to 8 cm. long, velvety; spikes 2 mm. thick X 10-14 cm. long, closely flowered; peduncle up to 5 cm. long, velvety; bracts round-peltate, reddish- glandular-dotted, marginally more or less ciliate; fruit about 1 mm. long, sub- globose, apex pointed, slightly oblique, stigma essentially apical, basal part of the fruit yellowish, upper half reddish with reddish-glandular dots.
          originalLanguage: en
