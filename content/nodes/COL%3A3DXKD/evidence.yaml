    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Rounded, roughly hairy shrublet to 50 cm. Leaves narrowly linear, grey-hairy, often in tufts. Flower heads radiate, solitary, yellow with blue to mauve rays.
            sourceIds:
              - sanbi_14145_0
            locator: "SANBI/WFO archive Morphology row 10446; source 14145.0; publication: Manning, JC; Goldblatt, P. 2012. Asteraceae: Felicia Cass. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 375 - 378. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: F. hirsuta ist eine stark umweltgeprägte Art. Ihr Wuchs kann gedrungen kurzstrauchig bis zu hochaufgeschossenen Halbstäuchern wechseln. Letztere sind besonders durch ihre auffallenden Langtriebe gekennzeichnet. Dieser augenscheinlich standortbedingte Wechsel des Erscheinungsbildes hat zur Folge, dass habituell sehr heterogenes Material in einer Sippe vereinigt wird. Auch Blattgestalt und besonders der Sukkulenzgrad der Blätter wechseln stark. So stehen Pflanzen mit langen, schmal oblanzeolaten Blättern anderen mit kurzen, dicklichen und im Querschnitt fast runden Blättern gegenüber. Neben der Tatsache, dass recht unterschiedliche Pflanzen aus einer Kollektion existieren können, ist die Einheitlichkeit aller Formen in einigen umweltunabhängigeren Merkmalen für ihre Zusammenfassung unter einer Art verantwortlich. Wesentlich ist hierbei die Drüsenbehaarung der Köpfchenstiele, die relativ grossen Hüllschuppen, die borstige Behaarung der Blätter, die flachen schwarz-braunen Achänen und deren etwas zur Spitze hin verbreiterten Haare. Von F. hirsuta unterscheidet sich die Art durch die andere Behaarung und die wesentlich schmäleren Blätter, von F. muricata durch die meist flachen Blätter, die geringe Anzahl büscheliger Kurztriebe, die drüsigen Pedunkeln und die andersgestalteten Achänen. F. clavipilosa weicht besonders durch ihre charakteristischen Achänenhaare ab.
            textZh: SANBI 条目提供了该种的鉴别特征。
            sourceIds:
              - sanbi_3197_0
            locator: "SANBI/WFO archive Diagnostic row 71314; source 3197.0; publication: Grau, HRJ. 1973. Revision der gattung Felicia (Asteraceae). Mitt. Bot. Staatssamml. München 9: 195 - 705. [All rights reserved]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
