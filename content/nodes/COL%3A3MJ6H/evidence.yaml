    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Spiny, glabrous, succulent shrub, up to 1 m tall, stems leafless, 40-80 mm diam., greyish, with 20-22 angles, with stout spines 8-10 mm long. Flowers 1-8, in sessile, subterminal clusters, pedicels 1-2 mm long. Corolla campanulate 10-18 mm diam., inside yellow and smooth, tube 2-3 mm deep, funnel-shaped, lobes 6-8 x 4-5 mm, ovate-acute. Corona pale yellow, outer lobes deeply divided into 2, erect teeth 1-1.5 mm long, inner lobes 0.75 mm long.
            sourceIds:
              - sanbi_14722_0
            locator: "SANBI/WFO archive Morphology row 34085; source 14722.0; publication: Bruyns, PV. 2013. Apocynaceae. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 248 - 264. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: "In H. pedicellata the stems often sprawl among rocks and may even be pendulous. The spines are usually only found near the growing apex of the stem as they are weak and soon weathered off by wind-blown sand with the result that the tubercle rapidly becomes spineless. Stems which are spineless bear some resemblance to those of Larrryleachia. White & Sloane used this resemblance to suggest that this species represents an intermediate between the ‘spiny’ Trichocaulons and the ‘spineless’ species. This hypothesis is clearly wrong since in H. pedicellata both seedlings and all young, growing shoots show the spines typical of Hoodia. The flowers of H. pedicellata (and of H. mossamedensis from Angola) are remarkable for their nodding habit on the end of relatively long pedicels which keep the flowers from being distorted by pressure from the neighbouring spines and tubercles. In H. pedicellata the flowers are particularly deeply lobed and the lobes are mostly relatively narrow with the margins folded well back. On the inside they have a velvety texture caused by a covering of very fine papillae and a beautiful, dark, maroon to purple-brown colour. The flowers are variable in size and the extent to which the lobes spread out. There is hardly any tube in the centre of the corolla and the gynostegium is more or less fully exposed. The outer corona lobes spread out just above the surface of the corolla and, as in the next species, are deeply incised below the guide-rails with the lobules from adjacent lobes gathered behind the anther and the inner lobe. Hoodia pedicellata is probably most closely related to H. mossamedensis from Angola with which it shares the remarkably long pedicels. Both have a similar coronal structure to H. officinalis, H. ruschii and H. triebneri. Hoodia pedicellata differs from all of them in the stems: in the others these are erect and more persistently spiny with the tubercles laterally flattened and joined into angles, whereas in H. pedicellata the tubercles are conical and only joined together at the base and arranged (but not fused) into rows along the stem. Apart from the differences in the stems, H. mossamedensis is distinguished mainly by the differently shaped corolla lobes (more deltate than lanceolate), the deeper tube with thickened mouth which contains most of the gynostegium, the slightly larger papillae on the corolla (each with an obvious apical bristle) and the only very slightly divided, much shorter outer corona lobes. In H. pedicellata the inner corona lobes and anthers rise up much higher above the level of the outer corona lobes."
