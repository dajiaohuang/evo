            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: The long, exserted, and declined style constitutes in this plant a marked departure from the type of the genus, so far as the species are known to me or characterized in Kunth's 'Enumeratio.' Nor does Mr Baker's very recent revision of the genera of this Order refer to any such peculiarity. The fruit is as yet unknown; but in other respects the present plant so much resembles Gethyllis that I propose to place it here until the fruit shall be seen, under the section Clinostylis, as distinct from section Orthostylis, to include the species with a straight and comparatively short style.
