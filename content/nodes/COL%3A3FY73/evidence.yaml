    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Bulbous geophyte, up to ± 80 mm tall, in small clusters. Leaves 12-18, dry at flowering, spreading, ± curved towards tips, surfaces covered with parallel clusters of stiff, white, longitudinally orientated hairs, affixed to blade at middle, margin covered with clusters of transversally orientated hairs. Flower salver-shaped, pink.
            textZh: Gethyllis longistyla Bolus 的 SANBI 物种条目记录了形态特征。
