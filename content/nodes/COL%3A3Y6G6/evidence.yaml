          title: Marila domingensis Urb., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Small or medium sized tree to 7 m, younger branches puberulent or villous, becoming glabrate. Leaves 5-21 cm long, 2.5-6.8 cm wide, apically attenuate, acute or subabruptly acuminate, the acumen to 1 cm long, basally obtuse or rounded, glabrous, primary veins in 6-17 pairs, 0.6-1.5 cm apart, arcuately anas- tomosing near the margin; petioles 0.7-2 cm long, longitudinally striate, villous. Inflorescence racemose, axillary at foliated or defoliated nodes, glabrous or pu- berulent to tomentose, 1-3 flowers per cm, rachis 4.5-8.5 cm long, the slender pedicels 0.6-2 cm long, 0.5-1 mm thick at base. Flowers white; sepals 6-7 mm long, ovate, minutely puberulent on the margins or glabrous, reflexed at anthesis, erect in fruit; petals 7-8 mm long, obovate; stamens numerous, anthers ca. 1.3 mm long, appendage filiform, the filaments to 2.5 mm long; ovary ca. 3.5 mm long, style 1.5-2 mm long. Fruit an obconical, often fusiform, brown capsule 1.2- 2.5 cm long; seeds 0.5-0.8 mm long.
          originalLanguage: en
          sourceField: general
