    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Der strauchartige, astige Stengel ist nehst den kurzen, nur 2-4 Linien langen Blattstielen mit abstchenden, auf einem Knotchen sitzenden, fuchsigen Sternhaaren dicht besetzt. Die eyformigen, gesagten, oberseits meist mit einfachen, nnterseits mit sternformigen haarcn dicht hekleideten blätter sind ohne den Blattstiel 1-1 3/4 Zoll lang und am Grunde 7-12 Linien breit, mit 5 oberseits einge-druckten, unterseits hervorstehenden Nerven, von denen der mittlere eine langliche Druse tragt. Die Nebenblätter sind 2 Linien lang, gewimpert. Die aus den Achseln der oberen blätter entspringenden, einzelustehenden, einbluthigen, unmittelbar unter der Bluthe gegliederten und verdickten Bluthenstiele haben eine Lange von 1 1/4 Zoll nnd sind mit etwas absteheuden, besonders an der Spitze dichter stehenden Sternbaaren bekleidet. Das Involucrum besteht aus 12 linealisch - borstenformigen, etwas abstehenden, etwa 3 Linien langen, behaarten bilattchen, welche nur eiu Drittheil kurzer sind als der fuchsig behaarte, tief 5-theilige Keich. Die gelbeu, ausserhalb mit Sternhaaren besetzten, elliptischen Blumenblätter uberragen den Keilch um ein weniges und die mit 5 deutlich getrennten Griffeln endigeude Staubfadenrohre ist etwas langer als die BIumenblätter.
            sourceIds:
