    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, 12-35 cm, tunics woody, imbricate. Leaves only 2, basal linear, margins heavily thickened, second leaf entirely sheathing. Flowers small, white to pale blue or mauve, tepals spreading.
            textZh: Geissorhiza scillaris A.Dietr. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 6815; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: The distinctive Geissorhiza scillaris has imbricate corm tunics, small white to blue flowers, and just two foliage leaves, the lower with a long free blade and the upper sheathing the stem for most of its length. Plants usually have an inconspicuous green or transparent, sheathing bract a short distance below the spike. The blade of the lowermost leaf is terete with heavily thickened margins and main vein, thus cross-shaped in section and with 4 longitudinal grooves. Both the sheath and blade are sticky and usually have sand adhering to the surface. The star-like flowers are small, with a tube up to 1.5 mm long, spreading tepals 7-9 mm long, and usually white or pale grey-blue but some populations in the Cederberg and Cold Bokkeveld have clear blue flowers with a white centre. Geissorhiza scillaris has often been confused with G. juncea, which is broadly similar in appearance but with three foliage leaves, the lower two basal, slender and terete, and corm tunics of the concentric type.
            textZh: SANBI 条目提供了 Geissorhiza scillaris A.Dietr. 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 94703; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
