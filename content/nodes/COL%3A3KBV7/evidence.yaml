          - text: Purplish tinged annual, 150-350 mm tall, stems and branches minutely hairy. Leaves pinnatifid, 30-100 mm long, 3-9-lobed. Flowers small, white. Fruit ± orbicular to obovate, 8-10 mm across, pendulous.
