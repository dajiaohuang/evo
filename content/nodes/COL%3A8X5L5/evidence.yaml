    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Caespitose, phyllopodic perennial graminoid with flat leaves. Not viscous. Culms terete, 450-602 x 0.7-1.0 mm. Leaves basal, 2-4, flat, firm, not channelled, (11.5-)74.6-212.8(-235.0) x 0.6-1.0 mm, up to or exceeding half of culm length, apices acute, margins serrate. Sheaths open, papery, ivory in colour, not viscous. Ligule membranaceous, long,3.2-5.6 mm. Inflorescence a compact, short panicle, 15.0-28.0(-38.5) x 4.5-7.0 mm, spikes usually overlapping, not viscous, golden to straw-coloured, proximal rachis length 6.0-16.0(-20.0) mm. Proximal primary inflorescence bracts flat, apices acute to acuminate, exceeding length of inflorescence, with membranaceous extensions along margins that cover part of spikes, lowest (64.5-)67.0-91.0(-110.0) mm long. Spikes few, 2-3, congested, 7.0-14.0(-27.0) mm long. Spikelets with pedicels, prophyll bracts with raised veins, oblong to lanceolate, (4.4-)5.2-6.7(-7.2) x 1.2-2.2 mm, 3-7 spikelets/spike. Rachilla (0.8-)1.5-2.2 mm long. Glumes 3-7 per spikelet, proximal glume (2.8-)4.0-5.6(-6.2) mm long, subproximal glume 4.0-6.0(-6.8) mm long, lower firm and shorter, upper thin and papery in texture, apices acute or acuminate. Mucros difficult to distinguish from glume apices, proximal mucro (0.1-)0.4-1.7 mm long, subproximal mucro (0-)0.8-1.4(-2.4) mm long. Stamens 3(-4) per floret, anthers 4.0-4.7 mm long. Stigmas 3-branched. Perianth bristles up to 6, shorter than or as long as glumes. Nutlet [only immature observed], 3-sided, wide elliptical, (1.8-)2.6-7.2 x0.3-0.6(-0.9) mm. Nutlet beak glabrous, conical, 0.6-1.0 mm long. [Only immature nutlets from the Klipbokkop population were observed, most of which were broken during extraction due to being brittle towards the base.
            textZh: Schoenus aureus T.L.Elliott & Muasya 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_17737_0
            locator: "SANBI/WFO archive Morphology row 104818; source identifier 17737.0; cited publication: Elliott, TL; Muasya, AM. 2018. A taxonomic revision of Schoenus compar - Schoenus pictus and allies (Cyperaceae, tribe Schoeneae) with three new species described from South Africa. S. African J. Bot. 114: 303 - 315. [https://doi.org/10.1016/j.sajb.2017.11.020]. [All rights reserved]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Schoenus aureus is a robust, relatively light coloured sedge, with ivory culm bases, long membraneous ligules and golden-brown glumes. The leaves and inflorescence bracts are flat, as in S. megacarpus - a species with a much larger nutlet. The compact panicle is similar in shape to that of S. compar and S. megacarpus; however, S. compar lacks the wide marginal membraneous extensions on the inflorescence bracts. Schoenus megacarpus, on the other hand, has darker inflorescences than S. aureus and has more evident veins on the proximal primary inflorescence bracts. Mature nutlets have yet to be observed in this species.
