  claim-rationales.zh:
    - 达善沟基干兽孔类标本的分类表述只覆盖具名标本及所引主研究的分析范围；导航归属不表示直系祖先或普适系统树。
    - 达善沟基干兽孔类标本的地理字段只投影主研究记录的具体产地，不外推为全球分布、起源中心或完整扩散路径。
    - 达善沟基干兽孔类标本的生态字段区分保存事实与功能推断；未被标本直接记录的饮食、行为、栖息地或性能均明确保留不确定性。
    - 达善沟基干兽孔类标本的形态字段限定于主研究列明的具名标本和精确页码、图版或补充材料，不外推到整个支系。
    - 达善沟基干兽孔类标本的年代范围是主研究标本或地层背景的有界投影，不作为全球首现、末现、分化时间或连续谱系时长。
  claim-statements.zh:
    - IVPP V15424 确立了 Raranimus dashankouensis；在一项含 71 个性状的分析中，它被恢复在其余取样兽孔类的紧邻外侧。本资料不把它表述为直接祖先。
    - 本资料仅限于甘肃西大沟组的大山口地点，不把该地点样本外推为全球性的劳亚大陆起源结论。
    - 颅骨和牙齿形态支持捕食性食性的推断，但这件局部吻部并未直接保存栖息地、运动方式或摄食行为。
    - IVPP V15424 是一件约 100 毫米长、略受压扁的局部吻部，保存了论文矩阵所编码的颅骨和牙齿性状。
    - 2.744 亿至 2.6428 亿年前的展示区间，是对西大沟组产出的宽泛阶级换算，并非直接测年、全球首次出现、末次出现或谱系延续时间。
