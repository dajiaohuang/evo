            locator: SANBI e-Flora habitat row 27417; Strelitzia 29 (2012), printed p. 96; where listed, SANBI Red List habitat fields
            placeTimeScope: Regional southern African flora or national assessment scope; not a global ecological niche analysis.
            lifeStatus: Wild habitat evidence; cultivation is not covered.
        gaps:
