      lifeHistory:
        status: partially-supported
        claims:
          - text: Strelitzia 29 records flowering August–October. SANBI's genus account describes Trianoptiles species as annuals and amphicarpic, with bisexual aerial spikelets and female partly subterranean spikelets near the plant base; the account does not supply species-specific reproductive rates or a complete life cycle.
            textZh: 花期记录：Strelitzia 29 records flowering August–October. SANBI 属级条目称 Trianoptiles 各种均为一年生并具双型结实，具有地上两性小穗及植株基部部分地下的雌性小穗；该条目未提供种级繁殖率或完整生活史。
            sourceIds:
              - strelitzia29
              - plantzafrica
            locator: Strelitzia 29 (2012), printed p. 96; SANBI PlantZAfrica, Description and Ecology
            placeTimeScope: Regional flora account and SANBI genus-level page accessed 2026-09-23; claims retain the stated taxonomic and seasonal scope.
            lifeStatus: Wild South African flora account; cultivation is not covered.
        gaps:
          - Reproductive observations are incomplete; seed output, germination, demographic rates and full life-cycle stages have not been reviewed.
      ecology:
