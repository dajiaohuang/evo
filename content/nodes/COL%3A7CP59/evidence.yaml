      evolution:
        status: partially-supported
        claims:
          - text: Verboom's 2006 plastid phylogeny includes T. solitaria as a trnL–trnF sequence terminal inherited from Zhang et al. (2004). In the analyses, Trianoptiles and Carpha form a sister grouping to the remaining taxa in the relevant clade (bootstrap 93%, posterior probability 1.00). This is a single-locus inherited sequence and a study-tree result, not a genome-wide species history or divergence-time estimate.
            textZh: Verboom (2006) 的叶绿体系统发育分析纳入 T. solitaria 的单个 trnL–trnF 序列（引自 Zhang 等 2004），并在其采样树中得到 Trianoptiles 与 Carpha 的姐妹群关系（bootstrap 93%，posterior probability 1.00）。这是单个位点和该研究树的结果，不代表全基因组亲缘或分歧时间。
            sourceIds:
              - verboom2006
            locator: Verboom 2006, Table 2 p. 83; Figs. 1–2 pp. 85–86; results pp. 84–85
            placeTimeScope: One inherited plastid locus for T. solitaria in a 2006 multi-taxon study; no divergence date inferred.
            lifeStatus: Wild voucher-derived sequence evidence as reported by the cited study.
        gaps:
          - One inherited plastid sequence and study-tree topology do not establish a genome-wide or complete species evolutionary history.
      distribution:
        status: partially-supported
        claims:
          - text: The SANBI national assessment gives the South African range as the Cape Peninsula to Perdeberg south of Malmesbury. Strelitzia 29 lists Cold Bokkeveld Mountains, Paardeberg and Cape Flats, and separately notes Australia; the regional account does not specify the biogeographic status of that Australian record, so it is not used to infer a native or introduced range.
            textZh: 区域分布记录：The SANBI national assessment gives the South African range as the Cape Peninsula to Perdeberg south of Malmesbury. Strelitzia 29 lists Cold Bokkeveld Mountains, Paardeberg and Cape Flats, and separately notes Australia; the regional account does not specify the biogeographic status of that Australian record, so it is not used to infer a native or introduced range.
            sourceIds:
              - strelitzia29
              - sanbi-redlist
            locator: Strelitzia 29 (2012), printed p. 96; where listed, SANBI Red List distribution fields
            placeTimeScope: Regional flora and national-assessment records dated 2012 or 2013/2015; not a current global occurrence inventory.
            lifeStatus: Wild native-range evidence; the Australian mention for T. solitaria is retained as unclassified by the cited account.
        gaps:
          - Regional distribution is partial; no current global occurrence review has been completed.
      fossil:
        status: not-assessed
      conservation:
        status: partially-supported
        claims:
          - text: SANBI's national assessment assigns Endangered B1ab(i,ii,iii,iv,v), assessed 2015-05-13. The assessment reports an extent of occurrence of 400 km², area of occupancy below 230 km², four known locations, and threats including habitat degradation by invasive alien plants and eutrophication. This is a South African assessment, not a global status.
            textZh: SANBI 南非国家评估列为濒危（EN B1ab(i,ii,iii,iv,v)），评估日期为 2015-05-13；评估报告 EOO 400 km²、AOO 低于 230 km²、已知 4 个地点，并记录入侵植物导致的生境退化及富营养化等威胁。此为南非国家评估，不是全球等级。
            sourceIds:
              - sanbi-redlist
            locator: SANBI Red List, National Status and Criteria; assessment date and justification
            placeTimeScope: South African national assessment dated 2015; area and location estimates are assessment-era values.
            lifeStatus: Wild South African populations; cultivated plants are outside the assessment.
        gaps:
          - The cited assessment is regional and dated; no current global conservation assessment has been established in this dossier.
