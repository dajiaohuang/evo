        usage:
          title: Oreopanax costaricensis Marchal, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Trees to 20 m. tall, glabrous throughout, the branchlets stout, rugose. Leaves simple, elliptic or obovate-elliptic, 9-17 cm. long, 4-8 cm. broad, rounded at the apex and at the base, entire, 3- to 5-nerved from the base, the primary lateral veins few; petioles slender, 4-18 cm. long. Inflorescences paniculate, the primary peduncle obsolete, the primary rhachis to 25 cm. long, the bracts inconspicuous, the secondary peduncles 0.5-2.0 cm. long, the secondary rhachises generally to 4 cm. long, sometimes longer, the floriferous peduncles 1-3 cm. long. Staminate heads 5-7 mm. in diameter, the flowers 12-15 per head, the bracteoles ovate, about 1.5 mm. long; calyx small, the limb undulate; petals oblong, about 2 mm. long; filaments to 2 mm. long, the anthers small; styles 1 or 2. Fruits 3 or 4 per head, oblong-ovoid, to 7 mm. long, purple, surmounted by 8-10 short recurved free styles, the seeds often fewer.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 986
