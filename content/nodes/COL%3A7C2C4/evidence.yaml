          title: Teramnus volubilis Sw., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Slender twining vine; stems retrorsely pilose. Leaves pinnately trifoliolate, leaflets narrowly ovate or oblong, mostly 2.5-5 cm long, 0.5-1.5 cm wide, apically obtuse, mucronate, basally rounded, glabrate above, mostly appressed pubescent beneath; petiolules ca. 1 mm long, ascending pilose; stipels acicular, about as long as the petiolules; stipules ca. 2 mm long. Inflorescences several flowered axillary racemes, mostly 5-15 cm long; peduncles slender, pilose; bracteoles ca. 2 mm long, inserted on the pedicel just below the calyx; pedicels slender, ca. 2 mm long, minutely retrorsely pubescent. Flowers inconspicuous, white or pale violet; calyx tubular, ascending appressed pubescent, the tube ca. 2 mm long, the teeth about as long as the tube, the upper pair connate to near the top, the lower 3 teeth shorter; standard, emarginate, exserted ca. 1.5 mm from the upper calyx teeth. Fruit linear, mostly 1.5-3 cm long, ca. 2 mm wide, coiling and turning black on dehiscence; seeds ellipsoidal to subquadrate, dull olive buff, ca. 2 mm long, the hilum broadly elliptical, lateral on 1 edge.
