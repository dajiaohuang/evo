    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Bulbous geophyte to 20 cm. Leaves 4-6, dry at flowering, prostrate, elliptical, margin pink. Flowers 6-18, in a small roundish cluster, bright pink, actinomorphic, tepals evenly outspread, veins not darkly coloured, without scent, stamens centrally clustered. Capsules 3-angled, thinly ribbed, rounded apically.
            textZh: Brunsvigia elandsmontana Snijman 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13845_0
            locator: "SANBI/WFO archive Morphology row 8749; source identifier 13845.0; cited publication: Snijman, DA. 2012. Amaryllidaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 53 - 62. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Brunsvigia elandsmontana is distinguished from other species in the genus by the combination of its bright pink flowers, an actinomorphic perigone with an elongated tube, and centrally arranged filaments which are upturned towards the apex. B. elandsmontana is most like the highly ornamental B. marginata. This scarlet-flowered species, however, is characterized by a long perigone tube (5-10 mm) and well-exserted stamens (30-45 mm long), whereas in B. elandsmontana, the perigone tube reaches only 2-5 mm long and the 10-16 mm long stamens never exceed the tepals. Both species occupy fire-prone fynbos habitats but at different elevations. Brunsvigia marginata, a montane species, is found at 450-1200 m above sea level, whereas B. elandsmontana is restricted to the lowlands at altitudes of ± 100 m.
            textZh: SANBI 条目提供了 Brunsvigia elandsmontana Snijman 的鉴别特征。
