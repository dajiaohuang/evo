    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, 400-600 mm tall, with lateral flower clusters sessile. Leaves 2-4, linear, channelled, trailing above. Flowers enclosed by green to partly dry spathes, yellow, tepals forming a short tube, ovary shortly stalked, style with 6 filiform arms extending between stamens. Capsules enclosed in the spathes.
            textZh: Moraea brevituba (Goldblatt) Goldblatt 的 SANBI 物种条目记载了植株、叶片和花部形态。
            sourceIds:
              - sanbi_14562_0
            locator: Strelitzia 30; archive Morphology row 33303, source 14562.0
            placeTimeScope: Regional species account published 2013; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
          - text: The yellow flowers with a short perianth tube only 1-2 mm long distinguish Moraea brevituba from close allies in sect. Hexaglottis, particularly the widespread M. virgata, which has similar vegetative morphology but flowers with a well-developed perianth tube some 4-7 mm long, and the ovary entirely included on short pedicels 4-6 mm long. The ovary of M. brevituba is often partly exserted and the pedicels are (4-)7-10 mm long. Like other species of the section, the flowers open in the middle of the afternoon and last just a few hours.
            textZh: SANBI 条目提供了 Moraea brevituba (Goldblatt) Goldblatt 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: Strelitzia 42; archive Diagnostic row 94186, source 18638.0
            placeTimeScope: Regional species account published 2020; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
