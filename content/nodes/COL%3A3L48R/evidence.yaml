        status: partially-supported
        claims:
          - text: Stemless, cormous geophyte, 30-80 mm tall, corm globose, with overlapping tunics. Leaves falcate, glaucous. Flowers 1-3 in a congested spike, white, lightly scented, perianth tube 14-20 mm long, exceeding spreading tepals.
