            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: One of three closely allied acaulescent species of the western Karoo, Hesperantha hantamensis has white flowers with a slender perianth tube 14-20 mm long and spreading tepals 8-12 mm long. The flowers are crepuscular, opening in the late afternoon, 16:30 and strongly fragrant, closing after dark. Related H. flava has larger, yellow flowers and H. humilis even larger, pink to rose flowers with a dark throat.
