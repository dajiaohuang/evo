          - text: Easily recognised by the moderately tall stem up to 600 mm high with 2 or 3 upright branches held close to the axis and the silvery-translucent floral bracts subtending very short-tubed flowers, the tube up to 2.5 mm long with the narrow portion up to ± 1.5 mm long. Plants have up to seven leathery leaves with prominently thickened margins, main and secondary veins. Ixia rigida was until 2012 associated with I. brevifolia, but this is now understood to be a separate species. Although fairly uniform across its range populations inland and flowering three to four weeks earlier than those along the edge of the escarpment, thus in September, have slightly larger flowers and less fibrous leaves. The escarpment populations mostly have 6 or 7 leaves, typically 5-7 mm wide, tepals ± 12 x 5 mm, anthers ± 3 mm long, and style branches ± 2 mm long. The inland populations have 4 or 5 leaves, mostly 7-8 mm wide, tepals ± 14-16 x 6-8 mm, slightly longer filaments, anthers 4(5) mm long, and style branches ± 3.5 mm long. The bracts of the inland plants also stand out in their darker purple veins. Too little is known about I. rigida to assess the significance of this variation.
