        claims:
          - text: Shrub, up to 1 m high. Leaves pinnate, bipinnate or subtripinnate; leaflets ovate, oblong, entire. Umbels with many rays. Fruit obtuse at both ends. Flowers yellow.
            sourceIds:
              - sanbi_11118_0
            locator: "SANBI/WFO archive Morphology row 3060; source 11118.0; publication: Herman, PPJ; Retief, E. 1997. Plants of the northern provinces of South Africa: Keys and diagnostic characters. Strelitzia 6: 1 - 681. National Botanical Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Notobubon laevigatum, together with N. montanum and N. striatum, lacks the combination of fruit vittae characters distinctive of all the remaining Notobubon species (i.e. additional vittae below the ribs and/or broad commissural vittae). N. laevigatum is a distinctive species with entire ultimate leaflet segments that are narrowly elliptic to elliptic or very narrowly lanceolate to ovate (some ultimate leaflet segments on a plant may be two- or three-lobed). This species exhibits a wide range of variation. The plants are usually much larger shrubs (up to 1.5 m tall) than in N. montanum and N. striatum, but may remain much smaller when growing in drier habitats. It can then be distinguished from these species by the larger leaves (more than 20 mm long), the entire ultimate leaflet segments and the small, inconspicuous sepals (less than 0.2 mm long).
            textZh: SANBI 条目提供了该种的鉴别特征。
