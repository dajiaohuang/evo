  claims:
    - subjectId: event:mimolagus-holotype-glires
      claimKind: scientific
      claimType: morphology
      statement: Mimolagus aurorae holotype right M3 IVPP V20115 and referred teeth and tarsals document a large middle-Eocene mimotonid; estimated body mass and convergence on small tapiroid ecomorphology derive from astragalar regression and functional comparison, not direct ecology or ancestry.
      confidence: medium
      confidenceRationale: The named specimens, locality and dental and tarsal anatomy are directly documented; body mass, cursoriality, niche and mimotonid relationships remain comparative inferences.
      referenceLinks:
        - referenceId: fostowicz-frelik-2015-mimolagus
          relation: supports
          pages: "9394"
          figure: Figures 1–6; Supplementary Tables S1–S6
          quoteLocator: Systematic palaeontology; Holotype and referred material; Body-size analysis; Discussion
  claim-rationales.zh:
    - 具名标本、产地及牙齿和跗骨解剖有直接记录；体重、奔跑性、生态位与拟兔科关系仍是比较推断。
  claim-statements.zh:
    - Mimolagus aurorae 的正模右上第三臼齿 IVPP V20115 及归入的牙齿和跗骨记录一类大型中始新世拟兔科动物；体重与趋同小型貘类生态形态的判断来自距骨回归和功能比较，而非直接生态或祖先关系。
