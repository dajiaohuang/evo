  claims:
    - subjectId: event:ambolestes-therian-boundary
      claimKind: scientific
      claimType: topology
      statement: Near-complete holotype STM33-5 preserves ear and hyoid anatomy used in a morphology matrix that recovered Ambolestes and Sinodelphys within Eutheria, shifting the oldest sampled metatherian record to younger North American fossils; this is a dataset-dependent topology, not an observed placental–marsupial split or direct ancestor.
      confidence: medium
      confidenceRationale: Named anatomy and matrix are explicit, but the reassignment of Sinodelphys, ghost-lineage length and therian boundary depend on sampled characters and taxa.
      referenceLinks:
        - referenceId: bi-2018-ambolestes
          relation: supports
          pages: 390–395
          figure: Figures 1–5
          quoteLocator: Holotype; Description; Phylogenetic analysis; Supplementary Data
  claim-rationales.zh:
    - 具名解剖和矩阵明确，但 Sinodelphys 的重新归类、幽灵谱系长度和兽亚纲边界取决于取样性状与类群。
  claim-statements.zh:
    - 近完整正模 STM33-5 保存用于形态矩阵的耳区和舌骨解剖；该矩阵将 Ambolestes 与 Sinodelphys 恢复于真兽类，并把已取样最老后兽类记录移到较年轻的北美化石，但这是依赖数据集的拓扑，不是观察到的胎盘类—有袋类分裂或直系祖先。
