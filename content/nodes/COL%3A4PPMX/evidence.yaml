        usage:
          title: Psychotria marginata Sw., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrubs to 3 m tall, the branchlets terete, smooth, glabrous, the nodes well spaced. Leaves elliptic, oblong or obovate oblong, rarely oblong rotund, to 20 cm long, to 6.8 cm wide, rounded or deltoid at the apex, acute to attenuate acute at the base, rarely truncate, the costa plane and often grooved to prominulous above, prominulous beneath, often subplane, to 1.3 mm wide proximally, the lateral veins 9-15, arcuate, prominulous above and beneath, occasionally mi- nutely pubescent or farinose beneath, often with domatia in the axils, these often mammiform, 1 mm long, puberulent, the intervenal areas usually spreading re- ticulate below, evanescent above, papyraceous, concolorous, often drying me- tallic gray or brown; petioles to 2.3 cm long, to 0.17 cm wide, glabrous; stipules free, usually appressed, oblong, 1.2-1.6 cm long, acute or obtuse or tapering into an obtuse tip, scarious, glabrous. Inflorescences terminal, conspicuously open and spreading, solitary, paniculate, 6-15 cm long, the peduncle slender, to 8 cm long, the branches opposite, usually disposed as 3 well-spaced pairs, the lower- most to 8 cm long, strongly divergent; bracts triangularly ovate, to 1 mm long, glabrous or pubescent. Flowers with pedicels to 2 mm long, the calycine cup ca. 0.4 mm long, thickly petaloid, eglandular within, glabrous outside, the teeth al- most absent or widely triangular, unequal, ciliolate, shorter than the calycine cup; corolla yellow, yellow green, or white, the tube cylindrical, ca. 3 mm long, glabrous outside, pilose within, the lobes oblong, 0.4-1.8 mm long, glabrous or with tufts of hairs proximally; stamens 5, included, the anthers narrowly oblong, 1.0-1.2 mm long, obtuse; ovarian disc subglobose, to 0.5 mm long, the style shorter than the corolla tube, somewhat dilated above, the stigmas to 0.7 mm long. Fruits rotund, to 4 mm long, glabrous, the calycine cup usually persistent, minute, the pyrenes plane on the dorsal face, the convex face 4-5-ribbed, the albumen ruminate on the ventral face.
