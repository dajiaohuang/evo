        usage:
          title: Heteropterys laurifolia (L.) A.Juss., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Liana or climbing shrub (rarely elsewhere a small tree or shrub); young stems and petioles densely short appressed-pubescent. Leaves oblong-elliptic, acumi- nate, acute to obtuse at base, 10-17 cm long, 3.5-6(-7.5) cm wide, glabrate, sometimes with small glands near the margin at the base; petioles to 1.2 cm long, eglandular. Inflorescences paniculate, solitary, terminal or upper axillary to 12 cm long; inflorescence branches, pedicels and sepals with dense, ferruginous, T-shaped trichomes. Flowers 9-13 mm wide; sepals lanceolate to oblong, re- curved at apex, eglandular or with glands covering the lower 1/2, 2.5-4 mm long; petals yellow, clawed, 4-5 mm long, glabrous; stamens 10, 3-4 mm long, equal, enlarged and fused at base, the anthers ca. 1 mm long; styles 3, distinct, truncate at apex, its adaxial angle stigmatic, acute, the abaxial angle apiculate about equall- ing the stamens. Samaras membranaceous, ferruginous-tomentose, especially the body, 2-3 cm long, narrowly elliptic to subobovate, the dorsal margin almost straight, the ventral margin slightly undulate, narrowed near the base, with a small protrusion on the apical end near the body.
          originalLanguage: en
          sourceField: general
