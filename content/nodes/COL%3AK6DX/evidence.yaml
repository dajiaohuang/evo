        claims:
          - text: Acaulescent, cormous geophyte, 2-6 cm. Leaves lanceolate, hairy. Flowers zygomorphic, purple with white markings, tube elongate, geniculate, ovary hairy, style branches 10 mm long, inner bracts forked apically.
            textZh: Babiana geniculata G.J.Lewis 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 6703; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Low-growing and virtually acaulescent, Babiana geniculata is distinctive in its flowers with a long slender perianth tube 35-45 mm long and bent at a sharp angle just below the apex, the ovary hairy above the base, and the divergent rather than parallel filaments with the anthers held well apart from one another. The style is also unusual in dividing opposite the middle of the filaments, thus below the bases of the anthers. The style branches, the longest in the genus, 11-13 mm long, are slender and barely expanded at the tips. The flowers are adapted for pollination by long-proboscid flies. The inner bracts, forked in the upper third, are consistent with sect. Teretifolieae in which the inner bracts are usually forked only near the apex, whereas superficially similar Babiana ecklonii is a taller plant with the inner bracts divided to the base, a feature diagnostic for sect. Babiana. Babiana curviscapa from Namaqualand, also with short leaves and a decumbent spike of long-tubed flowers with the perianth tube sharply bent below the apex, has conventional arcuate and parallel stamens, a hairless ovary, and the style divides close to the anther apices into short branches, ± 4 mm long.
            textZh: SANBI 条目提供了 Babiana geniculata G.J.Lewis 的鉴别特征。
