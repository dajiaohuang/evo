        usage:
          title: Meliosma frondosa Cuatrec. & Idrobo, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Tree 8-10 m tall; branchlets longitudinally finely striate, glabrous or incon- spicuously minutely appressed-puberulous. Leaves elliptic-oblong, 4-16(-42) cm long, 2.3-6(-15) cm wide, rounded at base and apex, thick-coriaceous, the margin entire, somewhat involute, drying gray above, brown below, the midvein and secondary veins impressed above and raised below (the Panamanian collection strikingly bullate), secondary veins 8-11 on a side, tertiary venation plane above and slightly prominulous below, glabrous (a few tiny adpressed, essentially in- visible hairs along midvein of type); petiole 1-2 cm long, glabrous. Inflorescences paniculate from axils of the upper leaves, puberulous, the individual flowers ses- sile, densely congested on the ultimate branches, subtended by sepal-like brac- teoles. Flowers white, drying black; sepals, orbicular, long-ciliate, 1-2 mm long (-2.6 mm fide Cuatrecases & Idrobo), outer petals suborbicular, ca. 1 mm long (in bud); stamens 2, the anther thecae short and thick; ovary not seen. Fruit asymmetrically pryiform, 1.6-2 cm long, 1.4-1.6 cm wide.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 12446
