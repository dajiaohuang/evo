          - text: Z. odorata may be separated from Z. aethiopica, the only other species occurring in the Cape, by the comparatively narrow, undulate spathe, the considerably shorter spadix borne on a distinct stipe and the larger green fruits which bend to the ground on ripening. It also has a much shorter flowering season.
