        status: partially-supported
        claims:
          - text: Koppies are formed of large doleritic boulders which break down to form a red clay soil which retains water well in the rainy season. The plants grow in the crevices between the boulders, where the lower part of the plant at least is in cool shade. The roots are in seasonally very wet soil or sometimes in standing water.
