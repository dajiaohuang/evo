  claims:
    - subjectId: event:ust-ishim-genome-admixture-model
      claimKind: scientific
      claimType: biogeography
      statement: The directly dated Ust’-Ishim 1 femur yielded genome PRJEB6622 with long Neanderthal-derived segments; the inferred 7–13 ka pre-individual admixture interval is a recombination model, not a directly observed contact event.
      confidence: high
      confidenceRationale: High confidence reflects replicated direct dating, high-coverage sequence data and identifiable ancestry segments while retaining timing, geography and number of contacts as model-dependent.
      referenceLinks:
        - referenceId: fu-2014-ust-ishim
          relation: supports
          pages: 445–449
          figure: Figures 5–6; Supplementary Information sections 1 and 18
          quoteLocator: Direct dates, ENA accession and Neanderthal-ancestry tract analysis
  claim-rationales.zh:
    - 高置信度来自重复直接测年、高覆盖度序列和可识别的祖源片段；接触年代、地点和次数仍依赖模型。
  claim-statements.zh:
    - 直接测年的 Ust’-Ishim 1 股骨产生了含长尼安德特来源片段的基因组 PRJEB6622；推断发生在该个体之前 7,000 至 13,000 年的混合区间来自重组模型，并非直接观察到的接触事件。
