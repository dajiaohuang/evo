        claims:
          - text: Acaulescent, cormous geophyte, mostly 9-15 cm. Leaves 3-5, slightly pilose. Flowers yellow and white, tepal claws longer than limbs, fragrant.
            textZh: Moraea macronyx G.J.Lewis 的 SANBI 物种条目记载了植株、叶片和花部形态。
            sourceIds:
              - sanbi_13878_0
            locator: Strelitzia 29; archive Morphology row 7353, source 13878.0
            placeTimeScope: Regional species account published 2012; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
          - text: Allied to the well-known and widespread Moraea ciliata and occurring entirely within the range of this species, M. macronyx can be distinguished by its larger flowers with the outer tepal claws one and a half to twice as long as the limbs. The larger outer tepals are 40-60 mm long with the claws 25-40 mm long and the style branches are ± 20 mm long with crests up to 25 mm long. The outer tepals of M. ciliata are mostly 25-35 mm long with the claws 12-15 mm long, thus about half as long as the limbs, and the style branches are typically 8-15 mm long. Vegetatively M. macronyx and M. ciliata are nearly identical although the corm tunics may differ, those of M. macronyx sometimes unusual in being entire and peculiarly soft, of an almost spongy, pith-like texture. Some populations, however, have fibrous corm tunics no different from those of M. ciliata.
            textZh: SANBI 条目提供了 Moraea macronyx G.J.Lewis 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: Strelitzia 42; archive Diagnostic row 94166, source 18638.0
            placeTimeScope: Regional species account published 2020; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
