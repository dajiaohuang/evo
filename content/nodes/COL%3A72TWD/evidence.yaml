        usage:
          title: Marcgravia serrae de Roon, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Climbing epiphytic shrub or vine, the flowering branchlets quadrangular, with rows of lenticels. Leaves shortly petiolate, the petiole 2-5 mm long; blade oblanceolate-oblong, obovate-oblong, or so metim es elliptic-oblong, 3-4 times as l6ng as wide, 7-14 cm long and 2-4.5 cm wide, abruptly acuminate apically, the acumen 1-2 cm long, attenuate or acute basally, chartaceous to thinly cori- aceous, the midrib prominent beneath, the lateral veins prominent or slightly prominent on both sides of the blade, the veinlets mostly prominent; hypophyl- lous glands various, a row of minute dark glands along the margin, numerous minute dark punctiform scattered glands, and sometimes (1-)3-5 small poriform glands in an oblique row in the basal part of the blade. Inflorescences umbelli- form, with (20-)30-45 fertile flowers and 3-5 nectaries, the rachis ca. 1 cm long; nectaries urceolate, stalked, the stalk 5-8- mm long, the cup 1-2 cm long and ca. 4-5 mm in diameter, with a rudimentary bud near the apex, the orifice large, rounded, with an often revolute and apiculate rim. Flowers erect on the pedicels; the pedicels 3.5-5 cm long, to 7 cm long in fruit, lenticellate, scurfy; bracteoles ca. 1 mm long and 2-3 mm wide; sepals broadly suborbicular or reni- form, ca. 2-3 mm long and 4-5 mm wide; corolla oblong-subconical, ca. 1 cm long and 4-6 mm in diameter; stamens 18-35, the filaments flattened, unequal, 4-6 mm long in bud, the anthers 3-5 mm long and ca. 1 mm wide; ovary ca. 2-3 mm in diameter, including the short style ca. 4 mm long, 6-1 1-loculed.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 7489
