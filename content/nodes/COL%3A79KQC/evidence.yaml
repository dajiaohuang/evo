      wild: The 2024 study sampled water and Atlantic salmon epidermis at freshwater aquaculture facilities; it does not establish wild-population ecology.
      domesticated: Aquaculture-associated isolates are discussed, but domestication and captive life history of the oomycete have not been assessed.
      fossil: Fossil occurrence and geological age have not been assessed.
