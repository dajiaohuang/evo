        claims:
          - text: Herba perennis 2-6 dm alta; caules erecti vel adscendentes striati glanduloso-puberuli (exsiccati hirti) glabrescentes basi lignescentes 2-5 mm crassi simplices vel sparsim ramos laterales emittentes. Folia alterna membranacea glanduloso-puberula (exsiccata hirta) plerumque glabrescentia margine scabra remote denticulata(-dentata). dentibus calloso-mucronatis, vel pauca integerrima, inferiora conferta oblanceolata vulgo obtusa mucronata basin versus in petiolum semiamplexicaulem angustata petiolo incluso usque 10 cm longa usque 2 cm lata, cetera sessilia oblanceolata-lineari-oblonga acuta vel rarius obtusa mucronata. Capitula in apicibus caulis et ramorum solitaria pedunculata; pedunculi dense glanduloso-puberuli muricati nudi c. 1-2 dm longi. Involucri squamae c. 20 subbiseriatae lanceolatae 10-12 mm longae 2-3 mm latae acuminatae per medium dorsum virides minutissime glanduloso-puberulae margine albido-scariosae ciliatae. Flores radii involucri squamas numero aequantes; ligulae supra purpureae infra purpureae-lilacinae; staminodia 4 vulgo adsunt. Flores disci c. 50 involucro fere 2-6 mm breviores; corollae superne purpureae- lilacinae dimorphae, exteriores lobis patulis apice extus barbatis, interiores lobis inflato-cucullatis triangularibus glabris. Achaenia laevia (triangularia?).
            sourceIds:
