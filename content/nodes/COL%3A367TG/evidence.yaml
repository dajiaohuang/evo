          - text: Differs from D. caulescens by the upper surface of the ray flowers not being white but bright purple, and by the lobes of the outer disc flowers being bearded on the outside and the lobes of the inner disc flowers being inflated or cap-like. It differs from D. jucunda chiefly by the bearded corolla lobes of the outer disc flowers. D. barberae and D. jucunda seem besides to have somewhat different distribution areas.The styles of the disc flowers in D. barberae are cleft to a distance very slightly below the ring of pollen-sweeping hairs.
