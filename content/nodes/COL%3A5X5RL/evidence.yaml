        usage:
          title: Burmeistera dendrophila E.Wimm., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Epiphytic to terrestrial, suffrutescent herbs; stems 30-50 cm high, minutely puberulent throughout excepting the lower stem. Principal leaves with blades elliptic, 4-10(-14) cm long, mostly 2.5-4 times as long as wide, usually apically acuminate or acute but rarely blunt, basally cuneate-tapering, marginally re- pand-denticulate with ca. 3 inconspicuous callosities per cm, glabrous to incon- spicuously and minutely puberulent above and on the veins beneath; petioles 1-3 cm long, appressed puberulent. Flowers 4.5-5 cm long; pedicels solitary in the upper leaf axils, ascending, sparingly puberulent to glabrous, ebracteolate, 4-7 cm long; hypanthium at anthesis obconic, glabrous to sparingly and minutely ap- pressed-puberulent, basally acute to slightly rounded and usually with strongly divergent sides, (4-)6-9 mm long, 3-6 mm in diameter; calyx lobes ovate, obtuse, entire to obscurely rounded-denticulate with 2-4 teeth per side, glabrous to sparingly and inconspicuously short-pubescent, 2.5-3.5 mm long; corolla exter- nally glabrous to appressed puberulent or strigillose, light green to dark purple, the tube 12-18 mm long and 1.5-3 mm in diameter, the lobes falcately oblong to broadly ovate, acute to acuminate, the 2 upper lobes 12-18 mm long, the 3 lower lobes 7-10 mm long; filament tube exserted, 32-40 mm long, mostly glabrous al- though distally puberulous, the anthers ca. 5 mm long, externally puberulous, the 2 shorter anthers apically with a few white trichomes. Berries turbinate, ca. 12 mm high, 10 mm in diameter at apex; seeds dark brown, flattened, pitted, 0.8-1.0 mm long.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 2931
