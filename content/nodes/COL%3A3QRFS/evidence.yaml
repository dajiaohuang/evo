          title: Juanulloa mexicana (Schltdl.) Miers, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Inflorescence a contracted, subumbellate or corymbose panicle at the ends of branches; pedicels tomentose, 8-12 mm long. Flowers with the calyx 12-15 mm across at the base of the lobes, vestite outside with a yellow, orange or brownish, partly deciduous tomentum, split about halfway down into 5 ovate to oblong obes with acuminate tips and scattered hairs on the inside; corolla 3.5-4 cm long (Panama) and ca. 3 times as long as the calyx, tubular, conspicuously 5- ribbed or pleated, slightly expanded in the upper portion with a yellowish, stellate tomentum outside, glabrous within except for a villous area near the point of stamen insertion, the lobes ovate, ca. 5 mm long and glabrous within; stamens (Skutch 3841 (US), Costa Rica) on slender filaments inserted 5-8 mm above the base of the corolla tube, glabrous except for a massive basal tuft of hairs at the base, the anthers partly exserted, elongate, ca. 10 mm long, 1.5 mm thick at the broadest point, dehiscing longitudinally, basally hastate and apically with a short point, the connective dorsally marked by a dark (?purple) line; style slender, flattened, the stigma small, ellipsoid, situated at the level of the anther tips. Fruit (Allen 5519 (US), Costa Rica) a soft, conical or ovoid berry, 2 cm long, not exceeding the calyx lobes, the elongate slender style persistent; seeds large, reniform, 4-5 mm long.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 13062
          archiveSourceId: 11497530-6D07-4A6B-A11B-90A8CA3D9CFC
