        claims:
          - text: Like B. josephinae but bulb subterranean, leaves ± 18, narrower, to 7.5 vs. 20 cm wide, ± upright, flowers mostly to 20(-40), with a longer tube, 15-25 vs. to 15 mm long.
            textZh: Brunsvigia litoralis R.A.Dyer 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13845_0
            locator: "SANBI/WFO archive Morphology row 8746; source identifier 13845.0; cited publication: Snijman, DA. 2012. Amaryllidaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 53 - 62. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Previously this species has been classified under B. josephinae Ker Gawl., but it differs in its distribution in the underground bulb, in the proportions of the perianth, shorter anthers, and in its generally smaller habit and leaves with a half twist near the apex. The flowers are, however, very similar in general appearance. The name litoralis has been given because of the coastal habitat as opposed to the inland habitat of B. josephinae.
            textZh: SANBI 条目提供了 Brunsvigia litoralis R.A.Dyer 的鉴别特征。
