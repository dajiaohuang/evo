          - text: Mat-forming shrublet to 1 m diam. Leaves secund, oblong-oblanceolate, glaucous. Flower heads cup-shaped, 40-70 mm diam., involucral bracts glaucous, yellow-green, flushed red within, style 28-35 mm long.
