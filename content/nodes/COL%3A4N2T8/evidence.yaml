            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Protea laevis is related to several other dwarf, ground-dwelling proteas, all of them producing stems which spread horizontally along the soil, bearing secund leaves; that is, with leaves all deflected to one side of the stem. Distinguishing between these species is not always simple, though it is much easier in the field than from herbarium specimens alone. Certain narrow-leaved forms of P. acaulos may be confused with P. laevis. However, P. acaulos has a subterranean lignotuber producing rhizomatous stems and is therefore fire-resistant, while P. laevis has no lignotuber and is thus killed outright by fire. Broad-leaved variants of P. revoluta are also easily confused with P. laevis, but in the field they are also easily separable, as P. revoluta has persistent rhizomatous stems and P. laevis does not. Generally, however these two species are clearly separable as P. laevis has flat leaf blades while in P. revoluta the leaves have rolled margins.
