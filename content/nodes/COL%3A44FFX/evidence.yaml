        usage:
          title: Mortoniodendron hirsutum Standl., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrub 1 m. high, the hairs mostly simple, the younpg branches long-hirsute. Leaves shortly petiolate, the petiole thick, 4-5 mm. long, densely long-hirsute, the blade narrowly oblong, much asymmetric at the base, acute on one side of the midrib and rounded to subcordate on the other side, very long-acuminate at the apex, 10.5-17 cm. long and 3-4.5 cm. wide, membranous, sparsely long-hirsute along the nerves on both surfaces, 3-nerved at the base, the nervation prominent beneath. Inflorescences terminal, few-flowered, the axes long-h irsute, the fruc- tiferous pedicels ca. 12 mm. long. Flowers unknown. Capsule depressed-globose, ca. 2 cm. long and 2.5 cm. broad, shortly yellowish-tomentellous, the valves thick and ca. 12 mm. wide, 5-celled, each cell 2-seeded; seeds obtuse-angled, ca. 6 mm. in diam.
