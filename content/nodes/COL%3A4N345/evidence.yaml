            locator: "SANBI/WFO archive Morphology row 3206; source 11118.0; publication: Herman, PPJ; Retief, E. 1997. Plants of the northern provinces of South Africa: Keys and diagnostic characters. Strelitzia 6: 1 - 681. National Botanical Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: The species' most distinctive characteristic is its tendency to produce multiple flower-heads, usually tightly clustered and borne in an axillary position below the terminal flower-head on each shoot and sometimes even'on the old wood of basal branches. On opening, the bracts expand outwards to form a flattened saucer, later almost reflexing with the perianths and styles apparently everted. Open flowerheads emit an exceptionally strong, sickly-sweet, honey-like odour which is peculiarly characteristic of the species.
