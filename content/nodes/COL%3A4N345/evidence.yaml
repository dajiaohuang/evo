        claims:
          - text: Multistemmed shrub or small tree, up to 1.5 m high, tending to produce multiple flowerheads. Involucral bracts sparsely to densely sericeous with whitish to rusty brown indumentum. Perianth with limbs very densely hirsute with cream to rusty brown indumentum.
            sourceIds:
