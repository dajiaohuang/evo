          originalSourceText: venation somewhat trinervate from the basal third; petioles slender, to 8 cm long. Inflorescence corymbose-paniculate, the ultimate branches 2-7 mm long, minutely puberulous; receptacle glabrous. Heads ca. 10 mm high with 20-25 florets; the base of the involucre with 1-3 small linear-lanceolate bracts; involucral bracts ca. 23, subimbricate, in ca. 3 series, ovate to oblong with short-acute tips, the outer surface with 2-6 somewhat indistinct costae, minutely puberulous, often with glandular punctations; corolla lavender, 5-7 mm long, the upper corolla covered with many fine hairs, the lobes short, broader than long. Achenes ca. 1.5 mm long, glabrous; pappus of ca. 40 fine bristles.
