        claims:
          - text: Like M. bifida but flowers pale yellow and tepal claws forming a deep cup including the stamens, sweetly fragrant.
            textZh: Moraea fragrans Goldblatt 的 SANBI 物种条目记载了植株、叶片和花部形态。
            sourceIds:
              - sanbi_13878_0
            locator: Strelitzia 29; archive Morphology row 7397, source 13878.0
            placeTimeScope: Regional species account published 2012; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
          - text: In its vegetative form Moraea fragrans is nearly identical to M. bifida, both with a glaucous, falcate leaf with the lower half sheathing the stem almost to the base of the first branches. The flowers are, however, very different. The flowers of M. fragrans are nearly always pale yellow with darker yellow central cup and tepal claws ± 8 mm long, diverging to form a relatively wide cup that includes the stamens. The deep yellow nectar guides are edged with a band of grey-green. In M. bifida the tepal claws are short, only ± 2 mm long, erect and clasp the bulbous base of the filament column. Despite their different floral morphology, the two are likely closely related and hybrids have been recorded between them where their ranges come together. Greenhouse studies have shown the hybrids to be sterile.
            textZh: SANBI 条目提供了 Moraea fragrans Goldblatt 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: Strelitzia 42; archive Diagnostic row 94312, source 18638.0
            placeTimeScope: Regional species account published 2020; the archive excerpt does not give a dated sampling frame or population frequency.
