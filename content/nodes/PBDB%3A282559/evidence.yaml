  claims:
    - subjectId: taxon:panthera-blytheae
      claimType: taxonomy
      claimKind: scientific
      statement: The original study assigned IVPP V18788.1–3 to Panthera blytheae in a combined analysis; generic assignment and snow-leopard affinity are revisable rather than ancestral facts.
      confidence: contested
      confidenceRationale: The taxonomy field for panthera-blytheae is bounded to the named material and cited primary-study locator; that evidence type is not generalized to ancestry or a whole clade.
      referenceLinks:
        - referenceId: tseng-2014-panthera-blytheae
          relation: supports
          pages: 1774–1782; Figures 1–4; Table S1; Data S1–S3
    - subjectId: taxon:panthera-blytheae
      claimType: biogeography
      claimKind: scientific
      statement: The profiled sample is limited to the Zanda Basin and does not by itself establish an Asian origin for all pantherines.
      confidence: medium
      confidenceRationale: The biogeography field for panthera-blytheae is bounded to the named material and cited primary-study locator; that evidence type is not generalized to ancestry or a whole clade.
      referenceLinks:
