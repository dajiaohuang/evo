  claim-rationales.zh:
    - 西藏化石豹亚科（原始归属）的分类表述只覆盖具名标本及所引主研究的分析范围；导航归属不表示直系祖先或普适系统树。
    - 西藏化石豹亚科（原始归属）的地理字段只投影主研究记录的具体产地，不外推为全球分布、起源中心或完整扩散路径。
    - 西藏化石豹亚科（原始归属）的生态字段区分保存事实与功能推断；未被标本直接记录的饮食、行为、栖息地或性能均明确保留不确定性。
    - 西藏化石豹亚科（原始归属）的形态字段限定于主研究列明的具名标本和精确页码、图版或补充材料，不外推到整个支系。
    - 西藏化石豹亚科（原始归属）的年代范围是主研究标本或地层背景的有界投影，不作为全球首现、末现、分化时间或连续谱系时长。
  claim-statements.zh:
    - 原研究在综合分析中把 IVPP V18788.1–3 归为 Panthera blytheae；属级归属和雪豹亲缘关系均可修订，而非祖先事实。
    - 本资料样本仅限于札达盆地，仅凭它不能确立所有豹亚科成员均起源于亚洲。
    - 猫科牙齿支持肉食性，但局部颅骨样本没有直接保存运动方式、猎物选择或惯常环境。
    - IVPP V18788.1 是一件成年个体局部颅骨，IVPP V18788.2–3 提供分析所用的相关颌骨和前颌骨材料。
    - 595 万至 410 万年前的区间遵循原研究的地点磁性地层学，并非通用的豹亚科首次出现、物种末次出现或不变的年代模型。
