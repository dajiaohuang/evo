    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, up to 100 mm tall, stem with lateral flower clusters sessile. Leaf 1, terete, loosely spiraled or straight and falcate, erect. Flowers enclosed by firm green spathes, blue, nectar guides yellow, tepals subequal, spreading, claws short, including lower half of filament column, anthers parallel, concealing the style branches.
            textZh: Moraea herrei (L.Bolus) Goldblatt 的 SANBI 物种条目记载了植株、叶片和花部形态。
            sourceIds:
              - sanbi_14562_0
            locator: Strelitzia 30; archive Morphology row 33295, source 14562.0
            placeTimeScope: Regional species account published 2013; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
          - text: Stands out in its slender, terete leaf, often loosely spirally coiled, and in the small, violet flower with subequal tepals with spreading to reflexed limbs and short, almost vestigial style branches lacking crests. The flower is subsessile and the perianth is raised above the spathes on a sterile, tubular extension of the ovary, a structure that is paralleled in sect. Gynandriris. Moraea herrei is allied to two southern Namibian species, M. graniticola and M. rigidifolia, both of which have a shortly beaked ovary with the beak much shorter than in M. herrei. Moraea graniticola differs additionally in having a true perianth tube and a stem barely reaching above ground.
            textZh: SANBI 条目提供了 Moraea herrei (L.Bolus) Goldblatt 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: Strelitzia 42; archive Diagnostic row 94177, source 18638.0
