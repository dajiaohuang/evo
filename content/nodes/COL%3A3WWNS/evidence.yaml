    facets:
      morphology:
        status: not-assessed
      lifeHistory:
        status: not-assessed
      ecology:
        status: not-assessed
      evolution:
        status: partially-supported
        claims:
          - text: In the study's approximate Bayesian computation analysis, decline Scenario 2 was the best fit for the tentative Upper Subansiri population. The model estimated effective population size fell from approximately 50,600 macaques (95% HPD 19,600-68,300) to approximately 1,700 (95% HPD 476-4,090), about a 30-fold decline, around 3,500 years before present (95% HPD 520-13,800). This is a model-based historical effective-population estimate for one sampled population, not a census or a species-wide reconstruction; the study could not rule out unsampled migration and did not establish whether climate or human activity caused the inferred decline.
            sourceIds:
              - chakraborty2014arunachalmacaque
            locator: Results, Approximate Bayesian Computation approach (lines 243-266); Upper Subansiri sample and population definitions (lines 167-175); uncertainty on unsampled migrants (lines 225-229); causal and small-sample limitations (lines 319-327).
            placeTimeScope: Upper Subansiri, Arunachal Pradesh, northeastern India; 2014 publication. The tentative population was sampled through dried skin from old hunting trophies; 10 Upper Subansiri individuals were successfully sequenced from the original 12 samples. The estimate concerns the modeled historical effective population size, with the reported decline centered near 3,500 years before present.
            lifeStatus: Historical demographic inference from genotypes of sampled wild animals; one captive Tawang blood sample occurred in the wider study but not in this Upper Subansiri analysis.
            originalLanguage: en
          - text: The mitochondrial-DNA Bayesian skyline plot for the tentative Upper Subansiri population indicated expansion after the Last Glacial Maximum, around 15,000 years before present. This is a model-inferred trajectory for one geographically distinct population, based on 10 successfully sequenced individuals from 12 Upper Subansiri trophy-skin samples; the study could not rule out effects of local migrants. It does not estimate census size or establish a species-wide history. The same plot's small apparent reduction 5,000–7,000 years ago may fall within the credibility interval and was not treated as conclusive evidence of a demographic shift.
            textZh: 基于线粒体 DNA 的贝叶斯天际线图显示，Upper Subansiri 暂定种群在末次盛冰期之后、约 15,000 年前出现扩张。这是对一个地理上独立种群的模型推断；Upper Subansiri 的 12 份旧狩猎战利品皮样本中有 10 份成功测序，研究也无法排除局部迁入者对结果的影响。该结果不估算普查数量，也不能外推为整个物种的种群史。同一图中 5,000–7,000 年前轻微下降可能位于可信区间内，因此不能视为确定的人口变化证据。
            sourceIds:
              - chakraborty2014arunachalmacaque
            locator: Bayesian skyline plot methods and results (article lines 177-182 and 224-236); sample size and successful sequencing (lines 167-175); geographically distinct populations and unsampled-migration limitation (lines 225-229); caution about interpreting the later small reduction (lines 228-229).
            placeTimeScope: Tentative Upper Subansiri population, Arunachal Pradesh, northeastern India; mitochondrial-DNA Bayesian skyline analysis published in 2014. Ten individuals were successfully sequenced from 12 trophy-skin samples for that population.
            lifeStatus: Historical demographic inference from mtDNA of sampled wild animals whose skins came from old hunting trophies; the wider study's captive Tawang blood sample is outside this Upper Subansiri claim.
            originalLanguage: en
        gaps:
          - The reported Bayesian estimate concerns one tentative genetic population and does not measure current census size or all populations of the species.
          - Local migration between sampled populations could not be ruled out; the study did not conclusively attribute the inferred decline to climate or human activity.
          - Morphology, life history, other ecology, current range-wide distribution, fossils, conservation status, systematic evidence search, remain unassessed.
      distribution:
        status: not-assessed
      fossil:
        status: not-assessed
      conservation:
        status: not-assessed
