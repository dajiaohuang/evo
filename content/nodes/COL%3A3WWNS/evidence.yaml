      wild: The Upper Subansiri genetic samples came from dried skin preserved as old hunting trophies collected in local villages; they represent sampled wild animals, not a contemporaneous field count.
      domesticated: A captive blood sample was included for Tawang in the broader study, but captive populations were not assessed and that sample is not part of the Upper Subansiri claim.
      fossil: Fossil occurrence and geological age were not assessed.
