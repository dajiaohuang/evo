        claims:
          - text: "Geophyte, up to 0.7 m high. Leaves ± 6; present after flowering; erect; blade linear, flat, 350730 x 25 mm, turning yellow at anthesis. Flowers: in a 6- or 7-flowered umbel; pedicels up to 50 mm long, glabrous; stamen appendages absent; perianth angled downwards, zygomorphic, with tube very short, lobes linear, 50-70 x 8-12 mm, bright pink or white, midvein dark rose; Jan.-May. Fruit a subglobose, membranous capsule."
