          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: "Tree to 10 m. tall, the stems terete or slightly compressed at the nodes, young branches densely villous, mature branches glabrate with elliptic, white lenticels. Leaves ovate to ovate-lanceolate, 8-16 cm. long, 3-9 cm. broad, acuminate, obtuse or acute at the base, scabrous and hirsute above, hirsute below, serrate; petiole 1-4 cm. long. Staminate flowers: sepals 5 (-6), 1.5-2.5 mm. long, connate at the base, margin ciliate, green; stamens exserted, the filaments broadly filiform, glabrous, the anthers about 1.25 mm. long, 1 mm. broad, subversatile, the disc minute, pilose; ovary rudimentary, about 1 mm. long. Pistillate flowers: perianth as in staminate flower; staminodes 0; fruit subglobose, approximately 2 mm. in diameter, orange."
