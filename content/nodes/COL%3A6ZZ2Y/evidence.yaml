    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Bulbous geophyte, up to 200 mm tall. Leaves 2 or 3, dry at flowering, recurved, broadly strap-shaped, smooth or sparsely fringed, flaccid. Flowers in a spreading cluster, stellate, large, white with a deep pink, median stripe on each tepal.
            textZh: Strumaria karoopoortensis (D.Müll.-Doblies & U.Müll.-Doblies) Snijman 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_14528_0
            locator: "SANBI/WFO archive Morphology row 32864; source identifier 14528.0; cited publication: Snijman, DA. 2013. Amaryllidaceae. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 33 - 42. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Strumaria karoopoortensis is most closely related to S. unguiculata. Both species have the broadest leaves (up to 50 mm or more across) and the longest (10-14 mm) and broadest tepals (3.5-6.5 mm wide) of all the stellate-flowered species of Strumaria. Several differences separate S. karoopoortensis from S. unguiculata, including the yellowish inner tunics of the bulb and the flaccid leaves. Furthermore the flowers are scentless and the tepals, which are slightly undulate along the edges, lack the basal windows found in S. unguiculata and are conduplicate apically. With age the pink pigmentation of the tepals is accentuated, whereas in S. unguiculata the ageing flowers become translucent.
            textZh: SANBI 条目提供了 Strumaria karoopoortensis (D.Müll.-Doblies & U.Müll.-Doblies) Snijman 的鉴别特征。
            sourceIds:
              - sanbi_4232_0
