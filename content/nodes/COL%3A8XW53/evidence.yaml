    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Caespitose, phyllopodic perennial graminoid. Culms terete, 310-678x 0.3-0.5 mm. Leaves basal, 1-3(-6), 130-189(-273) x 0.2-1.0 mm, usually straight, proximally channelled, margin serrate above sheath. Sheaths firm, reddish-brown but paler above, longitudinally striate. Ligule usually firm but can be scarcely membranaceous, 0.2-0.8 mm long. Inflorescence a narrow pseudolateral panicle, 22-28(-47) x 3-8 mm, proximal rachis length varying in length, 7-25 mm. Proximal primary inflorescence bracts sometimes channelled proximally, apex acute to acuminate, not widened at base, (26-)37-112(-134) mm long, exceeding length of inflorescence up to several times, longitudinal veins not notable. Proximal and subproximal primary inflorescence bracts without membranaceous extensions at base. Spikes 2-4, 7.0-15.0 mm long, usually dispersed along rachis. Spikelets lanceolate, relatively short, 3.4-3.9x 0.7-1.0 mm, pedicellate, 3-6 spikelets per spike, ranging from firm to membranaceous or chaffy in texture. Proximal spikelet prophyll 1 perspikelet, with an inconspicuous vein extending to mucro, 0.4-0.9 mm long, prophyll mucro (0.8-)2.2-3.4 mm long. Rachilla 0.6-2.4(-7.2)mm long. Glumes 4-7 per spikelet, proximal glume (0.5-)1.0-1.8 mm long, subproximal glume 1.0-2.2 mm long, upper glumes longer than basal ones, lower glumes sometimes over half the length of spikelet, apex obtuse. Glume mucros absent or short, proximal mucro 0.1-1.7 mm long, subproximal mucro 0.1-1.6 mm long. Stamens 3per floret, anthers not measured. Stigmas 3-branched, vestigial stigmas of second bisexual floret not observed. Perianth bristles about half the length of nutlet. Nutlet broad elliptic, trigonous, yellowish in colour, 1.9-2.0 x 0.6-0.7 mm. Nutlet beak, 0.4-0.8 mm long, hispid.
