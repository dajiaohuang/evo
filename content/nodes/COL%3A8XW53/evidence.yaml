          - text: The lanceolate spikelets of S. quartziticus often have relatively thin, membranaceous glumes and somewhat resemble those of the more robust form of S. exilis in size and shape. However, the nutlets of the two species differ, with those of S. quartziticus being broad elliptic, while S. exilis has narrow elliptic nutlets.
