        usage:
          title: Allomarkgrafia plumeriiflora Woodson, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Lianas, glabrous, the stems terete or sometimes angular, the mature stems lenticular. Leaves oblong-elliptic, shortly acuminate to acute, sometimes mucro- nate, obtuse or slightly rounded basally, to 12 cm long and 5 cm wide, glabrous, coriaceous; petioles to ca. 1.2 cm long, stipules obsolete (?). Inflorescences racemose, the primary peduncle dichotomous or trichotomous, axillary and alter- nate, many-flowered. Flowers with the pedicels to 9 mm long; bracteoles 1, deltoid and somewhat keeled, ca. 2 mm long, regularly placed at the base of the pedi- cels, persistent, conspicuously so after the corolla and calyx are lost; calyx-lobes sub-equal, ovate and rounded, ca. 1.8-2.2 mm long, each bearing 2 groups of squamellae, alternately placed; corolla subinfundibuliform, pale yellow to white, the tube proper ca. 9-11 mm long, inflated near the base, the throat ca. 7 mm long, the lobes dolabriform, ca. 12-14 mm long; stamens ? included, the fila- ments short and pubescent, the anthers ca. 4 mm long; nectaries 5, slightly con- crescent basally and somewhat lobed apically, at least as high as the ovary, the stigma umbraculiform below and ribbed and biapiculate above. Follicles unknown.
          originalLanguage: en
          sourceField: general
