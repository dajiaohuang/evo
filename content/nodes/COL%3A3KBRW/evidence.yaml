    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Procumbent several-stemmed perennial herbs. Steins 10-15 cm high, the young parts puberulous, glabrescent. Leaves 5-9 mm long, pinnately 5-7-lobed with linear, entire lobes, probably ± fleshy, minutely puberulous, glabrescent, minutely stipulate. Inflorescence pseudo-terminal, few-flowered, the pedicels ± interpetiolar, subtended by 2 minute bracts, often overtopped by lateral flowering branches. Sepals 4.5-5 mm long, ovate-oblong to oblong-elliptic, puberulous; the outer 2 cucullate, shortly horn-tipped; the inner 2 saccate and with broad membranous margins. Petals 6-7 mm long, 2.5-3 mm broad, narrowly obovate, cuneate, very minutely puberulous at the base outside. Filaments 2.4-3 mm and 3-4 mm long, the short ones slightly thickened at the base and with a glandular area. Anthers 1-1.2 mm long. Ovary narrowly oblong-elliptic, sub-sessile, finely puberulous on the replum; style long; stigma shallowly 2-lobed; ovules 8-12. Fruits 1-1.5 cm long, 3-4 mm broad, oblong or linear-oblong, very shortly stipitate; valves 1-nerved, net-veined, bulged by the seeds; stipe and replum puberulous; tyle 2-3 mm long, stout, tapering. Seeds 2.3-2.8 x 1.5-1.7 mm, oblong-oval, sub-compressed; seed-coat minutely papillose.
