        claims:
          - text: Disturbed areas.
            textZh: 该 SANBI 区域物种条目记录的生境：Disturbed areas.
            sourceIds:
              - sanbi_13894_0
            locator: "SANBI/WFO archive Habitat row 30434; source identifier 13894.0; cited publication: Manning, JC; Goldblatt, P; Linder, HP. 2012. Poaceae: Brachypodium P.Beauv. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 205 - 205. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: "In a controlled greenhouse and Smarthouse drought experiment, the nine selected Brachypodium distachyon ecotypes retained for phenotypic analyses separated by previously screened drought-response group under a 12-day treatment targeting 0% soil water content: the tolerant group showed greater plant height and side-view projected area, and fewer grey and yellow pixels, than the susceptible group. These results describe the selected accessions under this imposed treatment, not species-wide field drought tolerance."
            textZh: 在温室与 Smarthouse 控水试验中，进入表型分析的九个 Brachypodium distachyon 选定生态型，在以土壤含水量 0% 为目标、持续 12 天的处理下，按前期筛选的干旱响应组表现出差异：耐受组的株高和侧视投影面积较大，灰色与黄色像素较少。该结果仅描述这些选定材料在此处理下的表现，不代表全物种的野外耐旱性。
            sourceIds:
              - fisher2016BrachypodiumDrought
            locator: Results, Phenotypic Analyses of 10 Selected Brachypodium Lines and Fig. 4; the article states Bd21 flowered and was excluded from further phenotypic analyses.
            placeTimeScope: National Plant Phenomics Centre, Aberystwyth University, Wales, UK; greenhouse/Smarthouse experiment before flowering. Daily imaging covered the 12-day treatment from days 34 to 45 after sowing; day/night temperatures were 22°C/20°C; the severe treatment targeted 0% soil water content.
            lifeStatus: Selected diploid inbred ecotypes grown under controlled glasshouse conditions. The experiment was not a field survey and does not directly characterize wild populations.
            originalLanguage: en
        gaps:
