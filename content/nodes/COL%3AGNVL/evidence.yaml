    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Perennial, up to 0.8 mm tall, densely tufted; culms much branched in upper nodes. Leaves linear, folded, straight, rigid, quill-like, pungent, often as long as or overtopping inflorescence; ligule a fringe of hairs. Inflorescence a panicle, contracted when young, becoming more open with age. Spikelets 25-30 mm long (including awns), 1-flowered; glumes unequal; lemma 3-awned, column present, articulation between lemma apex and column base or absent.
            textZh: Aristida dasydesmis Mez 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_14569_0
            locator: "SANBI/WFO archive Morphology row 33430; source identifier 14569.0; cited publication: Fish, L. 2013. Poaceae: Aristida. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 133 - 134. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Resembles A. junciformis subsp. junciformis and A. transvaalensis, which both have the lower glumes awned or mucronate; A. vestita, which has the lower internodes pubescent to woolly-hairy, and A. diffusa, which has flexible leaves.
