          - text: "If we compare Schoenoxiphium filiforme with Carex microglochin, bBoth species have the same habitus, the same filiform-convolute leaves, the same simple inflorescence. Both posesess utricles which become deflexedas they mature, and both have in common a morphologically very important character, namely, early deciduous female scales. Thus the only essential difference left is in the perfect formation of the partial spikelets in Schoenoxiphium filiforme: a basal fertile [female] flower and several [male] flowers, the later terminating an elongated secondary axis, whilst in Carex microglochin the ? flowers are suppressed and the secondary axis is reduced to a rudiment. In these circumstances it appears necessary to divide the genus Schoenoxiphium into two subgenera which may be characterised as follows: 'A. Galpinia Kukenthal.-Spicula unica terminalis ebracteata. Spiculae partiales demum divaricato-reflexae. Squamae caducae. B. Eu-Schoenoxiphium Kukenthal.-Spiculae plures spicatim vel paniculatim dispositae bracteatae. Spiculae partiales oblique patentes. Squamae persistentes.'"
