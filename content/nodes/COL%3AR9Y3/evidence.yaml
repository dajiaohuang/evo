        claims:
          - text: Species ab omnibus hujus generis inflorescentia ad spiculam unicam reducta et spiculis partialibus demum divaricatis vel ima decurvato-reflexa toto coelo diversa. Laxe caespitosa. Culmi plures, 15-25 cm. alti, filiformes, subincurvi, obtuse trigoni, laeves, interne vaginis aphyllis brunneis costatis et foliis paucis obsiti. Folia culmo breviora, filiformi-convoluta, marginibus apicem versus minute scabra, pallide viridia, stricta, rigida. Spicula unica terminalis (raro altera sterilis, distans, bractea brevi vaginante suffulta adest) ebracteata, florens in ambitu oblonga, fructifera ovata, 6-12 mm. longa, pauciet laxiflora. Spicula partialis terminalis ?, laterales 3-5 androsrynae (rarius abortu uniflorae ‘female'), 4-6 mm. longae, primo oblique patentes, demum divaricatae vel ima decurvato-reflexa, sessiles. Squamae lanceolatae, acuminatae, ferrugineae, e carina viridi plerumque aristulatae, demum caducae. Prophyllum squamam excedens, oblongo-ellipticum, 3 x 5 mm. longum, obtuse trigonum, pallide virens, multicostatum, glabrum, basi spongiosum, marginibus ad 2/3 vel in spiculis ‘female’ fere usque ad apicem connatis, in rostrum conspicuum ferrugineum ore albo-hyalino oblique sectum postice bifidum attenuatum. Nux oblongo-elliptica, 2 x 5 mm. longa, trigona, lateribus concavis. Styli basis conica, decidua. Stigmata 3, mediocriter longa. Rhachilla secundaria complanata, viridis, binervis, apice non auriculata, nuce brevior.
