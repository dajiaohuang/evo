            locator: "SANBI/WFO archive Morphology row 98815; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: With a filiform perianth tube and filaments inserted at the mouth of the narrow part of the perianth tube, Ixia alticola conforms closely to sect. Ixia. The pale mauve-pink flowers have a relatively long style, dividing opposite the lower third to middle of the anthers, indicating placement of I. alticola in series Longistylae. It stands out in the rather short, pale translucent bracts 4-6 mm long, tall stature (occasionally to 1 m tall) and spikes of up to 25 flowers.
