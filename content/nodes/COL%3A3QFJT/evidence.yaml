    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants 350-800(-1000) mm high. Corm ± globose, 10-15 mm diam. bearing flat, ribbon-like stolons from base; tunics of soft to medium-textured fibres. Stem simple or 1(2)-branched. Leaves 4 or 5(6), all with expanded blades, 1/2-2/3 as long as stem, narrowly sword-shaped, mostly 4-8(-11) mm wide; margins, main vein and a pair of secondary veins slightly thickened, raised, pale when dry. Spike with up to 25 flowers, branches when present fewer-flowered; bracts pale and translucent or finely brown-speckled distally, outer 4-6 mm long, with single main vein and a few secondary veins, apex of lower bracts tricuspidate, inner 2-veined and acutely 2-toothed. Flowers upright, rotate, mauve-pink with small dark blue mark near base of tepals; perianth tube 6-8 mm long, filiform; tepals connate basally for ± 1 mm, ± elliptic, 10-12 x 4-5 mm, spreading ± horizontally. Filaments erect, 3.5-4.0 mm long, flushed purple; anthers ± 3 mm long, suberect, linear; pollen yellow. Style dividing opposite lower 1/3 to middle of anthers, branches ± 3.5 mm long, flushed purple.
            textZh: Ixia alticola Goldblatt & J.C.Manning 的 SANBI 物种条目记录了形态特征。
