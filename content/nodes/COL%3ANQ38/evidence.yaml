          - text: Bulbine retinens is at once distinguished from the other dwarf, cluster-forming, cliff-dwelling Bulbine species by its erect linear leaves arising from a short neck, its ovate tubers covered with fibrous, reticulate remains of leaf bases, and its peculiar mode of seed-retention.
