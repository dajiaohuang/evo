    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants rosulate, cluster-forming, small, to 90 mm high (without inflorescence) and 90 mm in diameter, bearing 3-9 rosettes. Tubers ovate, 12-20 x 10-15 mm, covered with dry remains of amplexicaul leaf bases which weather to a fibrous network; flesh yellow. Roots grey, fleshy, terete, stubby, 1.5 mm in diameter. Leaves 5-7 in an apical rosette and forming a short neck at the base to 7 mm long, erect, soft-textured, linear and sub-terete, adaxial side becoming flat towards base, 50-80 x 5-7 mm; surface smooth, grey-green to bluish due to a dense powdery bloom, obscurely striate; apex acute, apiculate. Inflorescence to 350-490 mm long, erect, 17-35-flowered in the upper half; raceme 230-310 mm long; peduncle 2-3 mm in diameter at base, terete; bracts deltoid, acuminate 2 x 1 mm, clasping. Perianth stellate, becoming reflexed, drooping, about 15-20 mm in diameter; tepals pale orange-yellow; outer tepals elliptic, 11 x 3 mm; inner tepals ovate to ovate-elliptic, 12 x 5 mm, obtuse; pedicel 14-17 mm long. Stamens 8-10 mm long; covered in the central third by +180 cilia, these up to 1.5 mm long, glistening; anthers 0.80 mm long, pale yellow. Ovary globose, 1.5 mm in diameter; style erect, to 6 mm long. Fruit obovate, up to 6 mm x 2 mm, pendulous, orange when ripe, splitting at the carpels but retaining the seeds for 1-3 days. Seeds 10-30 per fruit, 2.2 x 1.2 x 0.9 mm, indistinctly angled, dull brownish black and finely pitted.
