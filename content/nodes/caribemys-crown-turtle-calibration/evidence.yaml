  claims:
    - subjectId: event:caribemys-crown-turtle-calibration
      claimKind: scientific
      claimType: divergence-time
      statement: Caribemys holotype MNHNCu P-3209 supports a 155.6 Ma hard minimum for crown Testudines in the cited calibration scheme, whereas the older posterior crown interval is conditional on topology, molecular data, priors and clock model.
      confidence: medium
      confidenceRationale: The fossil identity and calibration logic are explicitly justified, but minimum age is not crown origin and posterior estimates change with analytical assumptions; the paper does not resolve a Triassic versus Jurassic crown origin.
      referenceLinks:
        - referenceId: joyce-2013-turtle-calibrations
          relation: supports
          pages: 614–617, 626–629
          figure: Figures 1–2 and 5; Table 1
          quoteLocator: pp. 615–617 and 626–629, Table 1 and Figs. 1–2, 5; Testudines (Node 1), Age of the crown Testudines and Conclusions
  claim-rationales.zh:
    - 化石身份与校准逻辑得到明确论证，但最小年龄并非冠群起源，后验估计随分析假设变化；论文没有解决冠群起源于三叠纪还是侏罗纪。
  claim-statements.zh:
    - Caribemys 正模 MNHNCu P-3209 在所引校准方案中支持龟类冠群 1.556 亿年前的硬最小年龄；更老的冠群后验区间则取决于拓扑、分子数据、先验和时钟模型。
