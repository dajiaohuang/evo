          publishedAt: undated
          originalSourceText: A high shrub or small tree; branchlets densely sericeous-tomentose, ferruginous. Leaves on petioles 3-7 mm. long, thin-membranaceous, underneath pale and at first appressed-hirsute, soon glabrous except on the nerves, obovate or elliptic, abruptly acuminate and rather rotundate at the base, 8-12(-25) cm. long and 4-9 cm. broad. Inflorescences opposite the leaves or produced from the middle of the internodes below the leaves, 1- or few-flowered; pedicels 12-15 mm. long, densely ferruginous-hirsute; flower buds long-caudate from a globose base. Sepals ovate, acuminate. Outer petals up to 30 mm, long, connate up to 5 mm. above the base, the base ovate, abruptly narrowed into a linear obtuse acumen nearly 20 mm. long, rufous sericeous-tomentellous on the outside; inner petals minute, 5-7 mm. long, connate with the outer at the base. Stamens 1.2-15 mm. long, the con- nective disk narrower than the anther. Fruit subglobose, smooth, 5 cm. long or more.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 535
