          originalSourceText: glabrous, foveolate and prominently veined beneath, prominently serrate-denticulate with setiferous teeth, 5-7.5 (-11) cm. long, 2.5-3.7 (-4.7) cm. wide, petioles 3.5-10 mm. long, glabrous, stipules persistent, pinkish to greenish when fresh, linear to lanceolate or narrowly ovate with oblique base and acute apex, 7-13 mm. long, ca. 5 mm. wide. Inflorescences pedunculate, cymose, axillary and terminal. Bracts of the peduncles similar to the stipules, secondary bracts and bracteoles obovate to orbicular, obtuse to truncate. Pedicels glabrous, slender, to 1 cm. long in fruit. Staminate tepals 2, orbicular, cordate at base, 5-8 mm. long, 6-7 mm. wide. Stamens numerous, free, filaments of the outer ones shorter, connective pro- duced. Pistillate tepals 2, chiefly orbicular, 3-6 mm. long, 4.5-5 mm. wide. Styles 3, short-connate. Capsule ca. 6 mm. high, its largest wing ascending, acute to obtuse, ca. 5 mm. wide, the other two marginiform and subequal. Seeds minute, slenderly obovoid.
