        claims:
          - text: Shrub, up to 2 m high. Leaves sessile, pinnate, filiform. Heads narrowly cylindrical, 2-12-flowered, many in dense terminal compound corymbs. Flowers bright yellow.
            sourceIds:
              - sanbi_11118_0
            locator: "SANBI/WFO archive Morphology row 3087; source 11118.0; publication: Herman, PPJ; Retief, E. 1997. Plants of the northern provinces of South Africa: Keys and diagnostic characters. Strelitzia 6: 1 - 681. National Botanical Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Phymaspermum acerosum shares the narrowly lobed pinnatifid leaves, the absence of myxogenic trichomes on the cypselas and the presence of prominent resin canals in the cypsela ribs with P. pinnatifidum. It can be distinguished by its narrowly campanulate to oblong involucres and the absence of a prominent apical crown on the cypselas (only at most a thickened apical rim which can be entire to shortly dentate). Phymaspermum acerosum is also a much larger more robust shrub growing to more than 0.5 m tall with much thicker and woodier stems than the smaller P. pinnatifidum which tends to have much more slender and herbaceous stems. The previously recognised species P. villosum was at first distinguished from P. acerosum by having much broader oblong and hairy involucres. Phymaspermum acerosum was considered to only have narrowly campanulate involucres however, after many specimens were examined, P. acerosum is now considered to have involucres which vary from narrowly campanulate to broad and oblong and P. villosum is now a synonym of P. acerosum.
            textZh: SANBI 条目提供了该种的鉴别特征。
