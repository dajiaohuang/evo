        usage:
          title: Desmodium glabrum (Mill.) DC., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Herb, erect, to 2 m; stem mostly simple, striate, grooved, densely uncinulate pubescent, pilose. Leaves trifoliolate, stipulate, petiolate; stipules ovate, abruptly long attenuate, slightly auriculate at the base, striate, puberulent and pilose on abaxial surface, ciliate, usually turning dark purplish and becoming reflexed, per- sistent, to 6.5 mm long and 3 mm wide; petioles sulcate on adaxial surface, striate to ridged and grooved, densely uncinulate pubescent and somewhat pilose, to 3 cm long, leaf rachis similar, ca. 1 cm long, stipels lance attenuate or slightly broader, ca. 4 mm long; petiolules somewhat stouter than the leaf rachis, densely pilose, 1.5-2.5 mm long; leaflets slightly uncinulate puberulent especially along the midrib above, and abundantly pilose to tomentose on both the surfaces, ter- minal leaflet ovate acute, rounded to cuneate at the base, to ca. 7.5 cm long, 4.5- 4.8 cm wide, lateral leaflets similar, slightly oblique, usually rounded at base, 3.5-5 cm long, 2.5-3 cm wide. Inflorescence racemose paniculate, often much branched, rachis striate, uncinulate puberulent and with somewhat glandular tri- chomes in addition; primary bracts narrowly ovate acuminate, striate, puberulent, and ciliate, 2.5 mm long, 0.5-0.7 mm wide, each subtending a fascicle of 3 to several pedicels; secondary bracts similar, smaller, each subtending a single ped- icel, 0.8-1.3 mm long, 0.3-0.5 mm wide, all bracts early deciduous; pedicels with pubescence similar to that of rachis, 5-7 mm long; calyx puberulent throughout and moderately stiff pilose, the teeth of both lobes ciliate, the central tooth of the lower lobe 2-2.7 mm long, the lateral teeth 2-2.5 mm long, the upper bifid lobe 2-2.5 mm long; corolla with standard narrowly obovate tapering to an acute base, 2.5 mm long, 1.5 mm wide, the wings obliquely oblong, broadest at the apex and slightly auriculate at the base, unguiculate, to 2.5 mm long, 1 mm wide, keel petals scythe shaped, scarcely auriculate, narrowed to the claw, to 2.5 mm long and 0.7 mm wide. Loment almost sessile, to 3-articulate, the terminal article enlarged and flattened, essentially elliptic except for slight indentation over seed, uncinulate pubescent becoming glabrous except on suture at maturity, with re- ticulate venation prominent, subterminal articles quadrangular with alternate mar- gins folded in or back and appearing twisted, uncinulate puberulent; seed trans- versely elliptic, 2 mm long, 1 mm wide.
