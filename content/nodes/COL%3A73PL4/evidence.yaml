    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, 35-60 cm, stem flexed outward above leaf sheath. Leaf solitary, linear, channelled. Flowers salmon with a yellow centre or entirely yellow, tepal claws forming a wide, shallow cup, anthers exserted on a thick filament column.
            textZh: Moraea flaccida (Sweet) Steud. 的 SANBI 物种条目记载了植株、叶片和花部形态。
            sourceIds:
              - sanbi_13878_0
            locator: Strelitzia 29; archive Morphology row 7395, source 13878.0
            placeTimeScope: Regional species account published 2012; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
          - text: Distinguished by its robust, several- to many-branched stem and characteristic flowers with the tepal claws widely diverging to form a shallow dish including the filaments and bases of the anthers. The tepals are usually salmon-pink with a yellow cup but populations with uniformly yellow flowers are not uncommon. When dry the shape of the flowers is often lost but its large size makes identification fairly easy. The tepals, ovary, filaments, anthers, and capsules are amongst the largest in the genus. The outer tepals are usually 35-40 mm long, and the filaments are ± 8 mm long with the anthers up to 11 mm long. The ovary, initially 17-20 mm long, elongates after fertilization and the capsules may reach a length of 55 mm. The capsules are notable in having a pointed beak some 2 mm long. Earlier-flowering Moraea collina has been confused in the past with M. flaccida but is a shorter, few-branched species, the flowers with suberect tepal claws forming a narrow cup enclosing both filaments and anthers. The tepals of M. collina seldom exceed 35 mm, the filaments are 6-7 mm long, and the anthers are slightly shorter, 5?6 mm long. The ovary in M. collina is often as long as that of M. flaccida and the capsule may attain a length of over 35 mm. Capsules of M. collina, however, have a shorter, rather obtuse beak ± 1 mm long. Although M. flaccida flowers relatively late in the season, by which time M. collina is usually in fruit, their flowering times may overlap and natural hybrids have been recorded between the two species on the Cape Peninsula.
            textZh: SANBI 条目提供了 Moraea flaccida (Sweet) Steud. 的鉴别特征。
