        usage:
          scope:
            zh: 记录 MDD 当前 *C. chiropotes* 页面将 israelita 列入名称与分类注记、并说明名称关系仍未完全厘清；该页面的分布概述针对 MDD 的 *C. chiropotes* 条目，不替代固定 COL26.8 身份。
            en: Records that the current MDD *C. chiropotes* page includes israelita in its name and taxonomy notes while stating that the relationship is not fully resolved; that page's range summary applies to the MDD *C. chiropotes* entry and does not replace the fixed COL26.8 identity.
