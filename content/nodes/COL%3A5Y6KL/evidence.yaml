        usage:
          scope:
            zh: 对巴西亚马孙多地 25 件标本开展比较；这是历史分类研究，不是现代种群清查。
            en: Comparative analysis of 25 specimens from multiple Brazilian Amazon localities; a historical taxonomic study, not a modern population census.
      - id: boubli2009
        referenceId: ref-12358103-06da-81dd-a22e-6fb2891533fc
        fields:
          - id
          - title
          - url
          - scope
        metadataVariant: 1
        usage:
          scope:
            zh: 以历史出现记录和环境变量构建最大熵分布模型；是预测，不是逐点野外确认或种群评估。
            en: Uses historical occurrence records and environmental variables in a maximum-entropy distribution model; it is predictive, not point-level field confirmation or a population assessment.
      - id: carneiro2023
        referenceId: ref-34125bdd-d7b1-481e-a8ed-e937571f77c0
        fields:
          - id
          - title
          - url
          - scope
          - locator
          - accessedAt
        metadataVariant: 0
        usage:
          scope:
            zh: 对属内系统分类作多位点与物种界定分析，支持五个现存种；认为 C. israelita 是较晚异名，并建议布朗库河西、东岸种群分别使用 C. chiropotes 与 C. sagulatus。核标记的单独分析对两者的区分支持较弱。
            en: Multilocus and species-delimitation analysis of the genus supporting five living species; treats C. israelita as a junior synonym and assigns west- and east-bank populations of the Branco River to C. chiropotes and C. sagulatus, respectively. Nuclear-only analyses gave weaker support for separating the latter pair.
          locator: JATS sections 2.1, 2.2, 3; Supplementary Materials Figure S2 description.
          accessedAt: 2026-10-03
      - id: boubli2015
        referenceId: chiropotes-rio-negro-2015-riverine-surveys
        fields:
          - id
          - title
          - url
          - scope
        metadataVariant: 0
        usage:
          scope:
            zh: 支持里奥内格罗河—布朗库河区域形态调查中 20 种日行灵长类记录、以及作者将旧名 *C. israelita* 列入两河间区域组合；论文系统发育样本数与调查物种数分别报告，不作种群或行为证据。
            en: Supports the 20 morphologically identified diurnal primate records in the Rio Negro–Rio Branco survey region and the authors' placement of the older name *C. israelita* in the interfluvial assemblage; phylogenetic sample counts and survey species counts are kept separate, and it is not population or behavioral evidence.
