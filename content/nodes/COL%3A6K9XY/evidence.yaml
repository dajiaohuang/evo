        claims:
          - text: Acaulescent succulent to 1 m. Leaves distichous, lanceolate to oblong, smooth, margins crenulate. Flowers in an inclined, usually simple raceme, nodding, pink and green, inflated below.
            textZh: Gasteria brachyphylla (Salm-Dyck) van Jaarsv. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13855_0
            locator: "SANBI/WFO archive Morphology row 9069; source identifier 13855.0; cited publication: Manning, JC; Goldblatt, P. 2012. Asphodelaceae: Gasteria Duval. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 74 - 75. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: "Gasteria brachyphylla is a variable taxon with the following diagnostic characteristics: it is acaulescent with dark green, smooth and shiny, distichous leaves (margin often wavy). The typical variety brachyphylla has an acute leaf apex. It is closely related to G. disticha and G. bicolor, but G. disticha has a distincdy asperulous leaf surface and an obtuse apex. G. bicolor differs mainly in that it has a leafy stem, and leaves that are often twisted sideways and have a serrulate margin. G. brachyphylla may also be confused with G. carinata, but the latter usually has spirally arranged, keeled and tuberculate or smooth leaves; when distichous, the leaves are tuberculate. G. carinata also differs by having a larger perianth, which has a narrow-elliptic gasteriform portion."
            textZh: SANBI 条目提供了 Gasteria brachyphylla (Salm-Dyck) van Jaarsv. 的鉴别特征。
            sourceIds:
              - sanbi_8534_0
            locator: "SANBI/WFO archive Diagnostic row 78230; source identifier 8534.0; cited publication: Van Jaarsveld, EJ. 1994. Gasterias of South Africa: a new revision of a major succulent group. Fernwood Press, Cape Town. [All rights reserved]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
