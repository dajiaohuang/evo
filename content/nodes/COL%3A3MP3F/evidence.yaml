          - text: "Perennial; (0.28-)0.35-1.20(-1.50) m high; tufted. Leaf blades 25-90(-102) x 1.5-5.0(-7.0) mm; leaf sheaths lacking auricles. Flowers: spike with clusters of spikelets on reduced rachilla; 3-5 mm wide (including awns); often partly enclosed in uppermost leaf sheath; rachis readily disarticulating at maturity; lemmas sparsely to densely pubescent; awn 2.5-8.0 mm long."
