          originalSourceText: Herbaceous, 1 m. high, branching, completely glabrous except for a ring of trichomes at the apex of the petiole. Leaves transverse or oblique, ovate, cordate at base, long-acuminate, palminerved, to 11.5 cm. long, serrulate, petioles slender, to 11 cm. long, verruculose, stipules deciduous. Cymes few-flowered, regular, about equaling the leaves or shorter. Bracts deciduous, entire. Staminate tepals 4, entire, the outer suborbicular, 5 mm. long, the inner narrowly obovate, shorter.
