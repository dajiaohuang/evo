        usage:
          title: Ficus insipida Willd., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Large or small buttressed trees, 8-40 m. tall. Twigs 2-6 mm. in diameter, generally glabrous, with a thin reddish or greyish brown periderm. Stipules 30- 125 mm. long, narrowly deltoid, generally glabrous. Lamina 2-11 cm. wide X 5-25 cm. long, lanceolate to broadly elliptic, essentially glabrous, generally glossy above, sometimes slightly inequilateral; apex blunt or acute, to acuminate; base cuneate, round cuneate, rounded or emarginate; lateral veins 10-25 [-30] pairs, departing from the midrib at an angle of 400 or less; basal veins departing from the midrib at an angle from 300-600; intercostals slightly prominent. Petiole 10-65 mm. long, 1/3-1/S the length of the lamina, the epidermis not exfoliating, though frequently wrinkled. Figs 15-30 mm. in diameter, globose with or with- out a stalk above the basal bracts, 1-6 mm. long, glabrous or pubescent, borne among the leaves; color green or yellowish-green; peduncle 3-22 mm. long, thin or stout; basal bracts three, 1-3 (-5) mm. long, deltoid or semicircular; orifice flat, or somewhat crateriform or mammillate, 2-4 mm. in diameter, 1-2 mm. high.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 8070
