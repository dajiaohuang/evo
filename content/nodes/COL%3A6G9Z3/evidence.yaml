            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: In the past the name E. atrovirens (Desf.) Steud. (widespread in tropical Africa to India and Philippines) was used, but this species is not rhizomatous. Resembles E. lappula and E. hierniana, which have palea keels hairs longer than 0.3 mm; and E. chapelieri, which has palea margins not touching and spikelets reddish-brown.
