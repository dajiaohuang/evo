    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Perennial, loosely tufted and rhizomatous (rhizome short and oblique to long and branched), up to 1 m high. Leaf blades 40-250 mm long, 2-4 mm wide. Basal sheaths glabrous at base; leaves mainly cauline. Spikelets 5-20 mm long, 2.0-3.5 mm wide. Inflorescence 50-200 mm long, variable, grading from open with spreading branches to contracted with branches overlapping one another and appressed to main axis, pedicels (except terminal ones) shorter than, or as long as spikelets; spikelets dull, greyish green to dark green, frequently flushed with purple, 7-40-flowered, lemmas hardly becoming shorter towards apex, rhachilla persistent, lemmas and/or paleas breaking up from base upwards; upper glume acute; lowest lemma 1.6-2.5 mm long, acute, lateral nerves distinct; palea narrowly obovate, membranous except for keel, apex truncate to obtuse, margins nearly touching to touching along entire length, keels narrow, flat, but distinct, entire, scaberulous; anthers 3, 0.6-1.3 mm long. Caryopsis narrowly elliptic.
            textZh: Eragrostis inamoena K.Schum. 的 SANBI 物种条目记录了形态特征。
