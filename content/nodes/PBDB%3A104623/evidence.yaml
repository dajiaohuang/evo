  claims:
    - subjectId: taxon:eocursor
      claimKind: scientific
      claimType: morphology
      statement: The Eocursor holotype SAM-PK-K8025 has an elongated lower jaw with a low coronoid process and low, triangular tooth crowns in labial view; the poorly preserved front of the dentary does not establish whether a predentary was present.
      confidence: high
      confidenceRationale: The anatomical description directly reports the preserved jaw and tooth features and explicitly leaves predentary presence unresolved because of preservation.
      referenceLinks:
        - referenceId: butler-2007-eocursor
          relation: supports
          pages: "2042"
          figure: Figure 2a
          quoteLocator: "Systematic palaeontology, Description: lower jaw, dentary preservation and tooth morphology"
    - subjectId: taxon:eocursor
      claimKind: scientific
      claimType: fossil-range
      statement: Eocursor is represented by partial holotype SAM-PK-K8025 from the Lower Elliot Formation; its sampled horizon and analysis-dependent ornithischian placement do not establish a global clade first appearance or direct ancestry.
      confidence: medium
      confidenceRationale: The specimen and formation are direct, while both precise age assignment and basal placement have analytical and stratigraphic uncertainty.
      referenceLinks:
        - referenceId: butler-2007-eocursor
          relation: supports
          pages: 2041–2046
          figure: Figures 1–3; Electronic Supplementary Material
          quoteLocator: Systematic palaeontology; locality and horizon; phylogenetic analysis
  claim-rationales.zh:
    - 解剖描述直接报告了保存的下颌与牙齿特征，并因保存状况明确保留前齿骨是否存在的问题。
    - 标本和地层是直接证据，而精确年代归属与基部位置均有分析和地层不确定性。
  claim-statements.zh:
    - Eocursor 正模标本 SAM-PK-K8025 的下颌细长，冠突低矮，牙冠从唇侧看呈低矮的三角形；齿骨前端保存不佳，不能确定是否存在前齿骨。
    - 始奔龙由下埃利奥特组部分正模 SAM-PK-K8025 表示；其取样层位和分析依赖的鸟臀类位置不建立全球支系首现或直接祖先关系。
