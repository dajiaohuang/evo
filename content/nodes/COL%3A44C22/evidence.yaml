            placeTimeScope: Regional species account published 2017; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
          - text: A clump-forming species, Moraea alticola is distinguished by its habit and broad, more-or-less plane foliage leaf 14-15 mm wide, both features shared with M. spathulata. Despite its occurrence in an alpine area, at high elevations in the Drakensberg, it is easily the largest, most robust species in the genus. Although size alone makes M. alticola easy to recognise it is also distinctive in its uppermost cataphyll, which forms a well developed, pale, basket-like network well above the ground. Similar net-like cataphylls are found in some other species of subg. Grandiflorae but never as well developed. The pale, watery yellow flowers have rather narrow nectar guides on the outer tepals, unlike the large, yellow to orange nectar guides of most of the many forms of M. spathulata.
            textZh: SANBI 条目提供了 Moraea alticola Goldblatt 的鉴别特征。
