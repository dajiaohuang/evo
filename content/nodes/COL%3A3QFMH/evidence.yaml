        claims:
          - text: Cormous geophyte, 35-65 cm, stems wiry, often unbranched. Leaves linear. Flowers in congested spikes, pink, mauve or white, honey-suckle-scented, tube filiform.
            textZh: Ixia flexuosa L. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 7116; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Recognised by its small flowers, among the smallest in sect. Ixia, I. flexuosa has a perianth tube typically 5-6 mm long and tepals, mostly 10-14 mm long, thus about twice as long as the tube (occasionally perianth tube only ± 4 mm long and tepals ± 8 mm long). Coloured white to pink or light purple with fine, dark longitudinal veining on the lower half of the tepals, the flowers have a penetrating, honeysuckle-like scent. The style is relatively long, usually dividing between the base and middle of the anthers, rarely just below the anther bases. The stem may have up to four short, erect branches seldom bearing more than six flowers, whereas the main spike has up to 15 flowers. The leaves are linear to narrowly sword-shaped, mostly 2-5 mm wide and often less than a third as long as the wiry stems. Somewhat unusual in the section, the outer floral bracts usually have three prominent veins terminating in three short, sometimes acute teeth. Smaller-flowered morphs of I. polystachya are easily confused with I. flexuosa but have outer floral bracts with a single prominent central tooth and flowers almost always with a solid, darker centre. Lacking dark pigment in the centre of the flower, Ixia flexuosa fits uncomfortably in sect. Ixia, especially as the perianth tube is slightly flared near the apex for ± 1.5 mm and the flowers are conspicuously scented. Despite its predominantly filiform perianth tube, typical of sect. Ixia, I. flexuosa, most closely resembles I. orientalis (sect. Hyalis), which has a narrowly funnel-shaped perianth tube, almost filiform in the lower half. Only close examination of the outer floral bracts and filaments makes it possible to separate the two. In I. flexuosa the filaments are broadened basally, whereas I. orientalis has uniformly slender filaments decurrent on the tube and the outer floral bracts have a single central tooth, sometimes with a shorter lobe or tooth on either side of the central cusp. The style of I. flexuosa, usually reaching to between the base to middle of the anthers (rarely slightly below the anther bases), also often differs from that in I. orientalis, where the style typically divides close to the filament apices or opposite the anther bases. Ixia flexuosa is the only member of sect. Ixia known to produce nectar. It is probably most closely related to I. patens, which also has slender, wiry stems, and flowers lacking a dark central stain, but this species has larger, deep pink (to dull red) flowers that lack the dark longitudinal streaking in flowers of I. flexuosa. Floral scent in the two species appears identical, although of weaker intensity in I. patens. The flowers of I. patens lack nectar.
            textZh: SANBI 条目提供了 Ixia flexuosa L. 的鉴别特征。
