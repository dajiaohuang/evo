    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Multistemmed, densely leafy shrub, 0.25-0.5 m high. Stems unbranched; branches erect, glabrous or with few silver- villous hairs, sometimes woolly or matted; fascicles present in leaf axils. Leaves alternate, erect to spreading, 5.0-32.0 x 0.2-1.0 mm, linear, deeply pinnatifid, narrowed into petiolelike base, sometimes with secondary basal lobes, silvery- pubescent villous hairs on both surface, leathery; basal swelling present, continuous with stem ribs; lobes 7-9, 4.025.0 mm, filiform to linear, attenuating. Capitula discoid, homogamous, terminal, few- to many-headed (5-30), simple to compound corymbs, pedunculate; peduncles 4.0-35.0 mm long, glabrous to matted. Involucre 6-7 x 4-5 mm, funnelshaped to cyathiform, rarely tapering at the base; involucral bracts 3- or 4-seriate, loosely arranged, margins and apices scarious (curved shape due to thin rigid centres with resin canals), membranous apices of all bracts 0.2-2.5 mm long, glabrous to villous especially on edges, brown margins absent, median resin canals present; outer bracts triangular to lanceolate or oblong, 2.3-3.0 mm long, attenuating to rounded; middle bracts lanceolate to oblong, 2.7-3.8 mm long, attenuating to rounded; inner bracts linear to oblong, 4.3-5.0 mm long, acute rounded; inner most bracts oblong, 5.2 mm long, rounded. Receptacle convex; paleae in marginal series, linear to oblong, 3.3-5.1 mm long, rounded, rigid with scarious margins and apices, scarious apices 0.7-1.0 mm long. Disc florets 38-44, without resin canals; corolla 2.3-2.5 mm long, with only glandular trichomes, yellow; tube 1.2-1.5 mm long; limb campanulate, 1.0 mm long (excluding lobes); lobes spreading, 0.6-1.0 mm long, triangular to triangular-ovate. Anthers 2.8-3.2 mm long (including apical appendage); apical appendage lanceolate. Style 2.1-2.6 mm long (excluding branches); branches 0.5-0.7 mm long. Cypselas 3.5 x 0.7 mm, oblong to obovate, 12-ribbed, apical rim membranous, dentate, glandular trichomes absent, discontinuous resin canals in ribs present. The species is early flowering, usually in spring, between August and October, but early fires can result in even earlier flowering.
