          - text: Phymaspermum pinnatifidum is a small, spring flowering multistemmed shrublet with discoid corymbosely arranged capitula and cypselas with a prominent membranous apical crown. Together with P. acerosum it does not have myxogenic trichomes on the cypselas (the generic synapomorphy) but rather prominent resin canals in the cypsela ribs. It can be readily distinguished from P. acerosum by its earlier flowering time, smaller stature (less than 0.5 m tall) with thin herbaceous stems, the broader funnel or cupshaped involucres and the prominent membranous apical crown on the cypselas. Its small size means that it could also be confused with P. woodii but can be readily distinguished by the broader, not apically constricted involucres with loosely appressed involucral bracts, the prominent membranous apical crown on the cyselas and the absence of myxogenic trichomes.
