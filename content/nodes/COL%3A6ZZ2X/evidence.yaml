    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Bulbous geophyte, 120-150 mm tall. Leaves 2, dry at flowering, prostrate, narrowly elliptical, `hump-backed' in appearance. Flowers in a spreading cluster, stellate, pale pink with a narrow, olive green median stripe on each tepal.
            textZh: Strumaria massoniella (D.Müll.-Doblies & U.Müll.-Doblies) Snijman 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_14528_0
            locator: "SANBI/WFO archive Morphology row 32865; source identifier 14528.0; cited publication: Snijman, DA. 2013. Amaryllidaceae. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 33 - 42. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: This poorly known species is closely related to S. merxmuelleriana and S. karooica. The original diagnosis of S. massoniella stresses that leaf position and leaf covering distinguish it from its allies. The appressed leaves are stated to distinguish it from S. karooica and the ciliate leaves to separate it from S. merxmuelleriana (Miiller-Doblies 1985). Field studies have since shown that appressed leaves are characteristic of S. karooica in nature, unlike the erect leaves shown in Barker's illustration (Barker 1935), probably drawn from a bulb in cultivation. Furthermore, leaf pubescence in S. karooica has been observed to be somewhat variable. The leaves are usually glabrous with minutely scabrous margins, but occasionally the adaxial surface may be softly and sparsely pubescent, with hairs up to 3 mm long. These characters therefore do not reliably retain their diagnostic value. Thus, from current data, the only character which remains to distinguish S. massoniella is the typical arch-shaped curvature of the leaves. The flowers, which have channelled tepals, are very similar to those of S. merxmuelleriana but are unlike those of S. karooica, which has flat tepals. Strumaria massoniella inhabits a region of extremely unreliable rainfall, a factor which appears to limit flowering. The discovery of further plants during a favourable season may resolve the uncertain status of this taxon, but until such material becomes available, S. massoniella is maintained as a separate species on the basis of its uniquely shaped leaves.
            textZh: SANBI 条目提供了 Strumaria massoniella (D.Müll.-Doblies & U.Müll.-Doblies) Snijman 的鉴别特征。
