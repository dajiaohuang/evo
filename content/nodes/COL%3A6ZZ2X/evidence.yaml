            locator: "SANBI/WFO archive Diagnostic row 44954; source identifier 4232.0; cited publication: Snijman, DA. 1994. Systematics of Hessea, Strumaria and Carpolyza (Amaryllideae:Amaryllidaceae). Contr. Bolus Herb. 16: 2 - 158. [All rights reserved]"
