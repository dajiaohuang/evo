    facets:
      morphology:
        status: partially-supported
        claims:
          - text: A stoloniferous perennial herb, stem erect to ±1 m, simple below, branching above into a corymbose panicle, thinly greyish-white woolly or cobwebby, very leafy. Leaves up to 200 x 20 mm, decreasing rapidly in size upwards and passing into distant inflorescence bracts, lanceolate or linear-lanceolate, tapering at both ends, decurrent on stem in long, narrow wings, glandular above, sometimes thinly greyish-white woolly as well, thinly greyish-white woolly below. Heads homogamous, ±3 x 1 mm, very many matted together at base with whitish wool to form dense cymose-corymbose clusters up to 20 m across terminating the inflorescence branches. Involucral bracts in 2-3 series, subequal, about equalling flowers, loosely imbricate, not radiating, creamy white or very pale straw-colour, pellucid becoming opaque. Receptacle deeply honeycombed. Flowers ±8-11, dull yellow. Achenes 0.75 mm, glabrous. Pappus bristles 2 to several, tips subplumose, bases nude, not cohering.
            sourceIds:
