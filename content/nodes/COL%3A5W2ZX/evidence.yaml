          publishedAt: undated
          originalSourceText: Twining lianas, older stems ridged with cork. Leaves alternate, cordate, apex acute to acuminate, membranous, 5 to 20 cm. broad, 7 to 30 cm. long, densely pilose to velutinous becoming nearly glabrous on upper surface. Pseudostipules absent. Flowers immediately subtended by an acuminate foliaceous bracteole, borne on young stems, axillary, solitary, ca. 3 m. long, the color white blotched with purple, pilose, the utricle broadly gibbous-clavate, ca. 45 cm. long, the tube sharply reflexed on the utricle, ca. 40 cm. long, the limb obliquely salverform, terminating in a filiform extension from the medial lower edge, the odor of "old tobacco". Fruit ovate-cylindric, 10 cm. long, 4 to 6 cm. wide, dehiscing acrop- etally. Seeds numerous, horizontally compressed, 1 cm. diameter, 3 mm. thick.
