  claims:
    - subjectId: taxon:morotopithecus
      claimKind: scientific
      claimType: fossil-range
      statement: Morotopithecus is bounded by separate Moroto I and II postcranial specimens MUZM 60 and MUZM 80 in an approximately 21–20.6 Ma locality interval; they are not one skeleton, and locomotor or crown-hominoid placement remains comparative.
      confidence: medium
      confidenceRationale: Named specimens and localities are direct evidence. The statement preserves non-association and functional/topological uncertainty.
      referenceLinks:
        - relation: supports
          referenceId: maclatchy-2000-morotopithecus
          pages: 159–183
          figure: Figures 1–12
          quoteLocator: Specimen descriptions; locality context; functional comparisons
    - subjectId: taxon:morotopithecus
      claimType: taxonomy
      claimKind: scientific
      statement: MacLatchy and colleagues attribute the separately described Moroto postcranial specimens MUZM 60 and MUZM 80 to Morotopithecus bishopi for functional comparison, without making them an associated skeleton or a demonstrated direct crown-hominoid ancestor.
      confidence: medium
      confidenceRationale: The paper names and compares the specimens, while their attribution, association and higher-level evolutionary implications remain separate comparative inferences.
      referenceLinks:
        - referenceId: maclatchy-2000-morotopithecus
          relation: supports
          pages: 159–183
          figure: Figures 1–12; Tables 1–10
          quoteLocator: Specimen descriptions, attribution and functional-comparative discussion of MUZM 60 and MUZM 80
    - subjectId: taxon:morotopithecus
      claimType: biogeography
      claimKind: scientific
      statement: The profiled Morotopithecus material is bounded to Moroto I and Moroto II in Uganda's Karamoja District; the two locality records do not demonstrate a species-wide distribution or an ape dispersal route.
      confidence: high
      confidenceRationale: Named specimens and locality context are directly reported in the primary study, whereas distribution beyond those sampled localities is not observed.
      referenceLinks:
        - referenceId: maclatchy-2000-morotopithecus
          relation: supports
          pages: 159–183
          figure: Figures 1–2
          quoteLocator: Discovery and geochronology; Moroto I and Moroto II locality context for MUZM 60 and MUZM 80
    - subjectId: taxon:morotopithecus
      claimType: ecology
      claimKind: scientific
      statement: Comparative functional analysis of the separate Moroto shoulder and femoral specimens supports a mixed arboreal locomotor interpretation, while diet, habitual habitat and ecological guild are not directly observed.
      confidence: medium
      confidenceRationale: Detailed functional comparisons support the locomotor inference, but fossils do not observe behaviour, diet or a complete ecological niche and the specimens are not associated.
      referenceLinks:
        - referenceId: maclatchy-2000-morotopithecus
          relation: supports
          pages: 159–183
          figure: Figures 3–12; Tables 1–10
          quoteLocator: Shoulder and femoral functional comparisons; discussion of locomotor implications
    - subjectId: taxon:morotopithecus
      claimType: morphology
      claimKind: scientific
      statement: MUZM 60 and MUZM 80 preserve separate shoulder and femoral anatomies described and measured in the Moroto study; the material is not one complete skeleton.
      confidence: high
      confidenceRationale: The paper directly figures, measures and compares the two postcranial specimens, with the non-association limiting whole-body reconstruction.
      referenceLinks:
        - referenceId: maclatchy-2000-morotopithecus
          relation: supports
          pages: 159–183
          figure: Figures 3–12; Tables 1–10
          quoteLocator: Morphological descriptions and measurements of the separate shoulder and femoral material
  claim-rationales.zh:
    - 具名标本与地点属于直接证据；表述保留非关联性及功能、拓扑不确定性。
    - 论文对具名标本进行归属和比较，但其归属、关联关系及更高阶演化含义仍是彼此独立的比较推断。
    - 具名标本与地点背景由一手论文直接报告，而超出这些取样地点的分布并未被观察到。
    - 细致的功能比较支持运动方式推断，但化石不能直接观察行为、食性或完整生态位，且两件标本并不关联。
    - 论文直接绘图、测量并比较两件姿势骨骼标本；二者不关联限制了对完整身体的重建。
  claim-statements.zh:
    - Morotopithecus 由 Moroto I 与 II 的两件独立头后标本 MUZM 60 和 MUZM 80 约束，处于约 2100 万—2060 万年前的地点区间；它们并非同一骨架，运动方式或冠群猿类位置仍属比较推断。
    - MacLatchy 及同事将分别描述的莫罗姿势骨骼标本 MUZM 60 和 MUZM 80 归于莫罗古猿，用于功能比较；它们并非关联骨架，也未被证明是类人猿冠群的直接祖先。
    - 档案中的莫罗古猿材料限定于乌干达卡拉莫贾区的 Moroto I 和 Moroto II；这两处地点记录并不能证明物种整体分布或类人猿扩散路线。
    - 对分别出土的莫罗肩部和股骨标本所作的比较功能分析支持混合树栖运动方式解释，而食性、惯常栖息地和生态类群均未被直接观察到。
    - MUZM 60 和 MUZM 80 保存了莫罗研究中描述和测量的、彼此独立的肩部与股骨解剖结构；这些材料并非一具完整骨架。
