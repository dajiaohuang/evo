        usage:
          title: Voyria pulcherrima (Standl.) L.O.Williams, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Herb to 15 cm high; the stem erect, simple below, sparsely fastigiate-branched above, the branches terete, purplish, the stem and branches inconspicuously puberulous especially toward the apex. Scales thick, the opposite scales connate for ca. '/2 their length, rounded to obtuse apically, minutely ciliolate along the margins, to 5 mm long, much shorter than the internodes. Flowers solitary, 5- merous (sometimes 4-merous?), long-pedicellate, the pedicels slender, to 23 mm long; calyx purplish, oblong-campanulate, 5-6 mm long, the lobes broadly to very broadly ovate, + rounded apically, minutely ciliolate along the margins, to 1.3 mm long; corolla bright yellow (fide Standley), to 35 mm long, the tube gradually dilated from the base to the throat, minutely papillose within, the lobes spreading, oblong-obovate, rounded at the apex, ca. 9 mm long and 6-7 mm wide; stamens inserted ca. 1 cm above the base on the corolla tube, the filaments slender-filiform, ca. 15 mm long, minutely pilose, the anthers coherent, narrowly oblong, ca. 2 mm long with short slender appendages at the base (fide Standley); gynoecium ca. 22 mm long, the ovary sessile, oblong, obtuse at the apex, eglan- dular, ca. 6 mm long, the style slender, ca. 16 mm long, the stigma capitate, short- conical, ca. 1.5 mm broad. Capsule unknown.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 6007
