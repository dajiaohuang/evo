    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Perennial herb, geophyte, 0.50-1.35 m high, robust; corm whitish, 15-30 mm in diam. Leaves linear, acute; radical leaves 300-900 x 2.5-6.0 mm; reduced sheathing leaves 3 or 4. Flowering stems 0.40-1.35 m high. Inflorescence a raceme of spikes, with 4-8 lax branches. Bracts flecked, 10-25 x 5-8 mm, lanceolate to oblong-ovate, ± acuminate, margins white. Perianth lilac, pink or whitish, 16-34 mm long; tube 5-9 mm long; tepals 10-25 x 4.5-11.0 mm. Anthers 5-8 mm long. Flowering time July-Apr.
            textZh: Dierama igneum Klatt 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_18505_0
            locator: "SANBI/WFO archive Morphology row 90722; source identifier 18505.0; cited publication: Bredenkamp, CL; Magwaza, ZL. 2019. Iridaceae. In: CL Bredenkamp (ed.), A Flora of the Eastern Cape Province, Strelitzia 41(3): 1821 - 1882. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: A solitary or tufted species with stems 450-1350 mm tall and pendulous spikes of moderately-sized pink flowers with perianth 16-31(-34) mm long and tube 5-8(-9) mm long. Dierama pendulum has broader bracts, 8-13 mm wide and generally larger flowers with perianth tube 9-13 mm long and longer anthers 8-9 mm long. The two species co-occur at Grahamstown. Dierama igneum is also sympatric with D. pulcherrimum, which is distinguished by its mostly larger, bell-shaped perianth 35-54 mm long, and the two species appear to hybridise in the Amatole Mtns.
            textZh: SANBI 条目提供了 Dierama igneum Klatt 的鉴别特征。
