        claims:
          - text: Perennial herb, caudex thick and woody; prostrate stems up to 0.07 m long. Leaves obovate-elliptic, shortly appressed-pubescent with crisped hairs. Inflorescences 3-6-flowered in small, cymose clusters. Flowers with stout patent hairs; receptacle prominent. Sepals equal. Petals filiform. Stamens with linear-lanceolate filaments; anthers 0.25 mm in diam., quadrangular, orange. Style bilobed to bifid, with small, dot-like, often divergent stigmas. Flowering time Mar. Fruit an ellipsoid nutlet.
