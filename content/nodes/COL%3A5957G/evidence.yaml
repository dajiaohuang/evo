        claims:
          - text: Cormous geophyte, 50-100 cm. Leaves sword-shaped, 2- or 3-veined. Flowers pale yellow to cream-coloured or white, tube elongate, 30-40 mm, fragrant.
            textZh: Tritoniopsis nervosa (Baker) G.J.Lewis 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 6650; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: A very distinctive species, 500-1100 mm high, with relatively long spikes of creamy white to pale yellow flowers with a slender, subcylindric tube 30-40 mm long and relatively short tepals 9-13 mm long. The sweetly scented flowers are pollinated by sphinx moths. Unlike other species in the genus, in which the tepals start to gape several days before the flowers open fully, the tepals in Tritoniopsis nervosa remain joined at the tips until anthesis.
            textZh: SANBI 条目提供了 Tritoniopsis nervosa (Baker) G.J.Lewis 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 94342; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
