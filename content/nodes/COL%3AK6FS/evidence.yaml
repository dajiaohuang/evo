    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants up to 300 mm high, excluding longer leaves, growing in dense clumps. Stem simple or 1- or 3-branched, slightly angled. Leaves mostly 6 or 7, linear, 250-450 x 5-10 mm, exceeding stem, firm but arching toward ground, shallowly pleated to almost flat, smooth. Spike flexed outward with flowers initially in two ranks, mostly 6- to 9-flowered; bracts green below, dry and light brown toward tips, outer mostly up to 35 mm long but lowermost much longer, attenuate, inner ± 2/3 as long as outer, 2-keeled, forked apically, tips attenuate. Flowers zygomorphic, pale blue to blue-mauve, paler in throat, lower 3 tepals with central, white, lanceolate blotch and darker violet marks near base, darkly lined on abaxial side of throat, lightly sweet-scented; perianth tube funnel-shaped, 42-44 mm long, lower part cylindric, upper ± 10 mm expanded into wide throat; tepals lanceolate, unequal, dorsal ± 30 x 8 mm, lower 3 tepals united with upper laterals for ± 3 mm, arching outward, 25 x 6 mm. Stamens unilateral; filaments straight, suberect, ± 15 mm long, included in floral cup; anthers ± 5 mm long, pale mauve; pollen white. Ovary smooth; style dividing opposite or slightly beyond anther tips, branches ± 5 mm long, recurved distally.
