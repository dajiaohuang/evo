          - text: Babiana rivulicola most closely resembles a second, more widespread Namaqualand endemic, B. dregei, both species having an aerial stem, smooth leaves, stem and bracts, and flowers with a long perianth tube. The leaves of B. dregei are broadly lanceolate and rigid with sharply pungent tips and the short stem is concealed among the leaves, whereas the stem reaches up to 300 mm high in B. rivulicola and the linear leaves are longer and relatively softly textured, with acute but not pungent tips. The flowers of the two species are broadly similar, ± funnel-shaped with the lower two thirds of the perianth tube cylindric, but B. dregei has a ± cylindric perianth tube (45-)50-65(-70) mm long, curved just below the apex, unlike the shorter, funnel-shaped perianth tube of B. rivulicola, 42-44 mm long. Additional floral differences include the longer anthers, ± 8 mm long and shorter style branches, 3-4 mm long in B. dregei vs. anthers ± 5 mm long and style branches ± 5 mm long in B. rivulicola. Babiana dregei occurs on dry, stony slopes close to sites where B. rivulicola grows but is in fruit when B. rivulicola comes into flower.
