        usage:
          title: Cavendishia fusiformis Luteyn, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Epiphytic shrub; immature branches and twigs of the new growth terete, somewhat rugose, moderately hirsute or glabrate, trichomes 1-2 mm long, tan to tawny yellow. Leaves elliptic or oblong elliptic, (4.5-)9-14 cm long, (1-)2-4 (-6) cm wide, basally narrowing and obtuse, apically acuminate, grayish or brownish green above and tan beneath when dry, sparsely short pilose along the nerves above, moderately pilose or glabrate beneath with tawny yellow trichomes; 3(-5)-plinerved, the midrib weakly impressed or plane above, raised and prominent beneath, the lateral nerves weakly impressed or more commonly elevated on both the surfaces as the veinlets; petioles terete or infrequently flat- tened adaxially, rugose, 4-7 mm long, 2 mm in diameter, hirsute. Inflorescence obconic or fusiform at anthesis, ca. 20-flowered, the lowest nodes sterile, cir- cumscribed at the base by striate bracts; rachis glabrous, smooth, fusiform, 3-8 cm long, 5-6 mm in diameter medially, the nodes congested; floral bracts glabrous, striate, marginally scarious, oblong obovate, basally narrowing and rounded, apically rounded and emarginate, commonly tearing, 25-35 mm long, 13-18 mm wide, red to rose pink, with subsessile, capitate, red glands located at the base; pedicels subterete, glabrous, ca. 1 mm long, 1-1.5 mm in diameter; bracteoles oblong or oblanceolate, imbricate, basally clasping the calyx, apically rounded and shallowly emarginate, 25-30 mm long, ca. 10 mm broad, with sub- sessile, capitate, red glands as on the floral bracts. Flowers with the calyx glabrous, 11-15 mm long, the tube barrel-shaped, smooth, 2.5-4 mm long, not enlarged basally, the limb erect, spreading, submembranaceous, striate, 9-12 mm long including lobes, the lobes linear oblong, acute, 3-6 mm long, erect after anthesis, the few, stout, glandular marginal fimbriae occasionally distally fused, sinuses obtuse to broadly rounded; corolla glabrous, membranaceous basally and subcoriaceous apically, 34-35 mm long, 6-7 mm in diameter, white with green tips; stamens alternately 10-11.5 mm and 12-13.5 mm long, about 1/3 the length of the corolla, the filaments distinct or slightly coherent basally, glabrous, alternately 1-2 mm and 3.5-4.5 mm long, the long filaments conspicuously narrowed and thin distally, the anthers including the tubules alternately 8-9 mm and 9-10.5 mm long, the thecae smooth, 2.5-3 mm long, the tubules dehiscing by short, oblique pores or oval clefts 1-1.5 mm long; style 33-37 mm long. Berry not seen.
