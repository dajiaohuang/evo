    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Annual herbs, simple or much-branched below, erect or spreading-ascending, up to 25 cm high. Leaves up to 1.2 cm long and 1 cm broad, ovate-cordate or ovate, obtuse or subacute, thin, somewhat crowded near the base; the upper ones smaller and further apart. Inflorescence lax with long pedicels, few-many-flowered; bracts ovate or ovate-lanceolate, or very small and subulate, spreading or recurved. Calyx of 5 segments, each 4.5-6 mm long, 1-1.75 mm broad, linear-lanceolate to narrowly ovate-lanceolate, acuminate-mucronate, their sides membranous, opaque or hyaline, keeled or with a narrow wing up to 0.5 mm broad. Corolla yellow; tube 3.5-6 mm long; lobes 5.5-8 mm long, 2-4.5 mm broad, elliptic to oblong-elliptic, acute, obtuse, or sometimes toothed at the apex. Filaments 0.25-0.75 mm long, inserted in the corolla-sinuses; anthers 2-3 mm long, each with 3 medium-sized or small stipitate glands. Style and stigma 5-6.5 mm long with a swelling near the base; stigma clavate, 2-lobed.
