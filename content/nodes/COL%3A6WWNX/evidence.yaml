          - text: Very closely related to R. komsbergensis.
            textZh: SANBI 条目提供了 Romulea multifida M.P.de Vos 的鉴别特征。
            sourceIds:
              - sanbi_12511_0
            locator: "SANBI/WFO archive Diagnostic row 51683; source identifier 12511.0; cited publication: De Vos, MP. 1983. Syringodea, Romulea, Fl. S. Africa 7(2,2): 1 - 76. Botanical Research Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: A rare species with 2 or 3 filiform leaves and magenta flowers with yellow cup, and diagnostic style dividing well below the anthers into purple or blackish, antler-like branches that are further once or twice divided, thus with 12 or more stigmas. The species co-occurs with R. komsbergensis and may be overlooked but the latter has more numerous leaves and flowers with a characteristic brown stain at the bottom of the cup and once-forked style branches, and is ecologically separated by its preference for seepages and marshy situations.
            textZh: SANBI 条目提供了 Romulea multifida M.P.de Vos 的鉴别特征。
