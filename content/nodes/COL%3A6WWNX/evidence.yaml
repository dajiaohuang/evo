    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, 100-200 mm tall, corm round at base, with curved acuminate teeth. Leaves 2 or 3, narrowly 4-grooved. Flowers magenta with a narrow blue band and dark blotches around the yellow cup; outer bract submembranous with wide hyaline margins and tips, inner bract with wide hyaline margins; fruiting peduncles recurved and later coiled.
            textZh: Romulea multifida M.P.de Vos 的 SANBI 物种条目记录了形态特征。
            sourceIds:
