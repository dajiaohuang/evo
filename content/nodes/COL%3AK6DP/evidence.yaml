    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Stemless, cormous geophyte, up to 80 mm tall. Leaves crowded basally, abruptly truncate, pleated, sparsely to rarely densely hairy. Flowers 3 or more in a compact spike, bilabiate, purple with pale yellow nectar guides, strongly scented, perianth tube elongate-cylindrical, 18-36 mm long, slightly exceeding the hooded dorsal tepal, ovary smooth, bracts dry, submembranous, smooth, inner forked apically into slender awns.
            textZh: Babiana flabellifolia Harv. ex Klatt 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_14562_0
            locator: "SANBI/WFO archive Morphology row 33025; source identifier 14562.0; cited publication: Goldblatt, P; Manning, JC. 2013. Iridaceae. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 94 - 124. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Among the five species of Babiana with truncate, ± cuneate leaves, B. flabellifolia is distinguished by the sweetly scented flowers with subequal tepals and a perianth tube of short to moderate length, 12-36 mm long. The tube is largely or entirely included in soft-textured bracts 15-30 mm long. The flowers remain open at night and are then strongly scented of carnation. The relatively short perianth tube has comparatively thick walls in the lower half when the tube exceeds 20 mm, so that nectar is forced into the upper part of the tube where it is accessible to long-tongued solitary bees and moths, the presumed pollinators. Plants are often hairless, or sparsely hairy on the leaf margins or bracts, but the feature is variable, and some collections from near Springbok have lightly hairy leaves. The type collection of B. flabellifolia is somewhat puzzling because the leaves and bracts are conspicuously hairy. The exact origin of the type is unknown but Reverend Whitehead, who collected it, was stationed at the Anglican Mission at Modderfontein, close to Springbok and the presumption is that the type of B. flabellifolia was collected there or nearby. The long-hairy leaves and bracts of the type are not matched in any other specimen with truncate leaves and it is possible that they represent a taxon separate from the hairless or sparsely hairy plants that occur widely in southern Namaqualand as well as north of Springbok. More information on the variation in the type population and those growing nearby would be helpful in dealing more critically with the question about the status of the type of B. flabellifolia relative to other collections assigned to the species.
