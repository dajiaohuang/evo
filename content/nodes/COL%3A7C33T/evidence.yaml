    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Densely tufted perennial 900 mm high. Leaf blade 400 x 1.5 mm. Inflorescence to 170 mm long, contracted, interrupted; spikelets not distichous. Spikelet to 23 (including awns) x to 10 mm, 3-4-flowered; glume 15-20 mm long, 3-5-nerved, golden-brown; lemma 10-13 mm long, including lobes and awns which are 5.5-7.0 mm long, lobes free from central awn, upper back with 2 to 3 tufts of white hairs on either side of middle nerve, lowermost tufts on the margins; central awn to 15 mm long, sometimes strongly geniculate; anther 2.0-4.7 mm long.
