        usage:
          title: Justicia graciliflora (Standl.) D.N.Gibson, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Suffrutescent vine climbing to 10 m; stems terete, glabrous to strigulose in 2 lines. Leaves elliptic, to 11.5 cm long, 4.5 cm wide, apically acuminate to obtuse, basally attenuate, glabrous, the cystoliths prominent on both the surfaces, the margins crenulate to entire; petioles short, 3-8 mm long, glabrous. Inflores- cences in terminal and subterminal panicles, the flowers borne on dichotomously branched panicles, the peduncles puberulous; bracts oblanceolate to 7 mm long, 1 mm wide; pedicels mostly 5-10 mm long, glabrous. Flowers with calyx 5- merous, segments oblong, to 20 mm long, 3.5 mm wide, apically acute, glabrous; corolla white to pale yellow, to 6 cm long, glandular puberulous, tube to 3.5 cm long, 4.5 mm wide at base, narrowing above the ovary, expanding to 5 mm wide at the mouth, the lips to 2.5 cm long, the upper lip erect, to 8 mm wide, apically bidentate, the teeth ca. 1.5 mm long, the lower lip spreading, all the lobes oblong, the middle lobe to 6 mm wide, the lateral lobes 4.5 mm wide, all apically rounded; stamens exserted to near the apex of the upper lip, the anther cells superposed, the lower cell spurred. Capsules clavate, to 15 mm long, 5 mm broad, 4 mm thick, glabrous; seeds near spherical, 3.5 mm diameter, glabrous.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 203
