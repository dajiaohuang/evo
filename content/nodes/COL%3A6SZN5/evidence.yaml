          originalSourceText: A stout shrub with terete branches, the branchlets compressed, scarcely rusty- furfuraceous, becoming glabrate. Leaf blades sessile, broadly ovate, cordate at the rounded base, attenuate to the blunt apex, firmly coriaceous, nerves distinct but faint, about 7-12 cm. long, 4-8 cm. wide. Spikes axillary, solitary, to 8 cm. long, the peduncle 5-15 mm. long. Bractlets with free margins. Flowers or buds deep red, 2 mm. long, inserted obliquely on the glabrous rachis. Fruit ovate, 5 mm. long.
