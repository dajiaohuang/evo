        claims:
          - text: Glabrous, rhizome long, 1/8-1/6 in. thick, clothed by ovate, acute, pale ferruginous scales 1 in. long; stems solitary, 2 ft. long, trigonous, smooth; leaves usually hardly any, sometimes 2-6 in. long, in Krauss type specimen 26 in. (Krauss defines the species as leafless); umbel condensed more or less, or rays sometimes up to 7 in. long, bracts 3, shorter than the umbel, but 8 in. long in one example, spikelets numerous, up to 1 by 1/10 in., hardly compressed, 14-flowered, hard rigid; rhachilla scarious-winged; glumes ovate, obtuse, not keleed, 9-11-nerved on back, shining, pale' or brownish; nut scarcely 1/2 the length of the glume; style as long as the nut, branches 3 linea
