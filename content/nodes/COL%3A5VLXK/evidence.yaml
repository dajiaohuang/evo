        usage:
          title: Aphelandra pulcherrima (Jacq.) Kunth, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrubs or suffrutescent herbs to 5 m tall; young stems quadrangular, terete when older, glabrous to sparingly strigose, the lenticels scattered, oval, ca. 0.5 mm long, corky. Leaves elliptic to elliptic obovate, to 30 cm long and 11 cm wide, apically acuminate, basally attenuate, glabrous above, sparingly strigose to glabrous beneath, the margins shallowly crenate to slightly undulate; petioles ca. 3 cm long, pubescence as on the costa. Inflorescences terminal, quadrangular, the spikes to 20 cm long and 1 cm wide; bracts rhombic ovate, imbricate, 7-9.5 mm long, 5-6 mm wide, apically acute to acuminate, apiculate, keeled and striate nerved, minutely puberulous on the upper bracts, the lower bracts increasingly strigose mostly over the keel, ciliolate with submarginal glandular areas just below the midpoint consisting of numerous, minute (0.2 mm) often shiny brown to dark brown glands making an elliptic, alveolar spot 1.5-2.5 mm long, 0.5-1 mm wide; bracteoles falcate, keeled, to 8 mm long, 2.5 mm wide, striate nerved, finely puberulous without except for the wooly keel, glabrous within; rachis glabrous to sparingly puberulous. Flowerrs with the calyx segments conspicuously longer than the bracts, 9-11 mm long, glabrous, lanceolate, apically acute, the anterior segments 2.5 mm wide, the lateral segments 2 mm wide, the posterior segment 4.5 mm wide, all striate nerved; corolla bright red, bilabiate, papillate outside and in, the tube to ca. 5 cm long, 4 mm wide at base, constricted to ca. 2 mm just above the apex of the ovary, gradually extending to 9 mm wide at the throat, the upper lip erect, ca. 19 mm long, basally 9 mm wide, consisting of 2 acuminate lobes ca. 8.5 mm long, the lower lip spreading at maturity, with 3 lobes, the middle lobe lanceolate, ca. 24 mm long and 7 mm wide, the lateral lobes ca. 5 mm long, acute, connate to the upper lip for most of their length; stamens extending to about the length of the upper lip. Capsules oblong, obtuse, glabrous.
          originalLanguage: en
          sourceField: general
