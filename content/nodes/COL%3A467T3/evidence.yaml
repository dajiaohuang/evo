          - text: Annual, up to 300 mm tall. Leaves linear, entire. Flowers in lax racemes, calyx lobes oblong to obovate, glandular puberulent, corolla ± 10 mm long, white to lilac, upper lobes linear oblong, obtuse, with red lines at base, lower lip broadly ovate, wider than long, white with maroon base, palate scarcely raised with two white spots edged in blue, tube maroon, sac short, conical, ± 1.4 mm long, maroon. Capsule triangular, as wide as long.
