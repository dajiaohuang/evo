        usage:
          title: Oxalis barrelieri L., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Erect herb or shrub to 1 m tall, pubescent; stems green or violaceous, pu- bescence white or yellowish hirsute, in part retrorse, the apex finely pubescent; internodes to 8 cm long, sometimes almost obsolete resulting in subopposite leaves, hairs at the insertion of the petioles straight; roots fibrous, branched; petioles ascendent, to 4 cm long, canaliculate, enlarged to the base, the margin of the groove ciliate; rachis to 15 cm long pubescent; petiolule fleshy, ca. 1 mm long, pilose. Leaves with leaflets varying in shape on the same plant, suborbic- ular, oblong, ovate to elliptic, 10-55 mm long, 8-25 mm wide, obtuse, seldom acute, the base acute, roundish or subpeltate, asymmetric, discolorous, glaucous above, hairs irregularly scattered, below caducous, the margin or only the base ciliate. Inflorescences of cymes taller than the foliage loosely 1-1 1(-30)-flowered; peduncles to 6.5 cm long, pubescent, bifid with branches to 3 cm long; bracts reddish, lanceolate or triangular, acuminate, ca. 2 mm long, pilose; pedicels to 2.5 mm long, articulate near the base; bracteoles smaller, appressed to the ped- icel. Flowers with the sepals light green, sometimes red-veined, 3-3.5 mm long, 1-1.5 mm wide, linear to ovate or oblong, acute, mucronate, pubescent, the margin hyaline; petals white or yellowish at the throat and base, the limb pink, obovate-subspatulate, clawed, 7-9 mm long, 3.5 mm wide, slightly notched; long- er stamens ca. 3 mm long, pubescent or glabrous, ligulate about the middle, the shorter stamens 1.5-2 mm long, glabrous; pistil 3.5-4 mm long, the ovary ovoid, glabrous, the carpels 3-4-ovuled, the styles pubescent, the stigma widened, bifid, subcapitate, papillose. Capsule ovoid 7-9 mm long; acute, rarely oblong, gla- brous, membranous, calyx to ?2 its length, the carpels (2-)3(-4)-seeded, inside setose pubescent; seeds brownish, ovoid-compressed, apiculate, 1.5-2 mm long, 8-ribbed in zig-zag, deeply transversally striate, finely tuberculate at the inter- sections.
          originalLanguage: en
          sourceField: general
