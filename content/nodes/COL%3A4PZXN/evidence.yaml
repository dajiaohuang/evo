    facets:
      morphology:
        status: partially-supported
        claims:
          - text: A small shrub with the habit of P. inflexa; branchlets minutely whitish pubescent, becoming glabrous with age. Leaves opposite or sometimes the upper ones alternate, obovate-oblong to linear-oblong, obtuse, narrowed at the base, 0.5-1.9 cm long, 3-6.5 mm broad, flat, punctate with black dots, glabrous, setulosely ciliate. Heads many-flowered, terminal, solitary, sessile, 1.5-1.7 cm long, cylindric -campanulate. Involucral bracts 5-7-seriate, closely imbricate, oblong-orbicular, prominently saccate below the apex, with membranous margins, glabrous. Corolla 1 cm long; lobes 1.5 mm long, ovate or lanceolate, subacute. Stamens inserted about 2/3 down the tube; filaments 2.5 mm long, filiform; anthers 4 mm long, linear, subacute. Achenes 3 mm long, oblong in outline, densely appressed-villous. Pappus light straw-coloured, as long as the corolla.
            sourceIds:
              - sanbi_9858_0
            locator: "SANBI/WFO archive Morphology row 45376; source 9858.0; publication: Hutchinson, J; Phillips, EP. 1917. A revision of the genus Pteronia (Compositae). Ann. S. African Mus. 9(1): 277 - 329. [All rights reserved]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: This species is very closely allied to P. inflexa, Thunb., with which it has been associated in Herbaria. The glabrous leaf-surfaces, the more strikingly saccate involucral bracts, and its more easterly distribution seem sufficient to distinguish it.
