  claims:
    - subjectId: event:lingula-genome-biomineralization
      claimKind: scientific
      claimType: event-mechanism
      statement: The 425-Mb Lingula anatina genome, embryonic and adult transcriptomes and shell proteome identify chitin-synthase and BMP-related components alongside lineage-specific shell proteins. BMP activity at larval mantle margins suggests a shared biomineralization mechanism, but its functional role requires further testing; the shell toolkit differs from vertebrate bone.
      confidence: high
      confidenceRationale: Genome, transcriptome and proteome datasets directly support gene and protein inventories; pathway recruitment and independent biomineralization are comparative evolutionary inferences, not fossil observations.
      referenceLinks:
        - referenceId: luo-et-al-2015-lingula-genome
          relation: supports
          pages: Article 8301
          figure: Figures 1–5; Supplementary Notes and Tables
          quoteLocator: Genome sequencing and assembly; shell transcriptome and proteome; Figure 5 and BMP signalling discussion, including the need for further functional analyses
  claim-rationales.zh:
    - 基因组、转录组和蛋白组直接支持成分清单；通路征用和独立生物矿化是比较演化推断。
  claim-statements.zh:
    - 鸭嘴海豆芽的 4.25 亿碱基对基因组、胚胎和成体转录组及壳蛋白组识别出几丁质合酶、BMP 相关组分与谱系特异壳蛋白。幼体外套膜边缘的 BMP 活性提示可能共享生物矿化机制，但其功能仍需进一步检验；这套成壳组分不同于脊椎动物骨骼。
