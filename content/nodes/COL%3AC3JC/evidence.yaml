    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Apparently stemless grass aloe 0.6-1.2 m tall, solitary or in small groups. Leaves 16-20, distichous, rarely spirally twisted to rosulate in old specimens, 400-800 x 25-60 mm, distinctly keeled, V-shaped in section, bright green, undersurface white-spotted near base, margins cartilaginous, dentate. Inflorescence a conical, sublax raceme; peduncle 0.4-1 m long, with sterile bracts; bracts ovate-acuminate, 13-33 x 6-8 mm, many-nerved. Flowers salmon-pink to blood-red, 25-40 mm long; all segments free; pedicels 30-60 mm long, lengthening in fruit. Anthers not or hardly exserted. Ovary ±5 x 2 mm; style exserted 3-5 mm. Fruit 33-40 x 12-13 mm, grey.
