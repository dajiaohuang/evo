        claims:
          - text: Cormous geophyte, 12-25 cm, tunics papery. Leaves falcate, ribbed. Flowers bilabiate, dorsal tepal erect, pink to orange with black and greenish markings on lower tepals, fragrant.
            textZh: Gladiolus meliusculus (G.J.Lewis) Goldblatt & J.C.Manning 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 7253; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Recognised by the narrow, ribbed or corrugate leaves and pink to orange flowers with suberect dorsal tepal, oblanceolate lower tepals yellowish only toward the base edged with dark red, and relatively short, pubescent filaments ± 15 mm long and pubescent style. Gladiolus alatus has consistently orange flowers with narrower lower tepals yellowish for most of their length except at the extreme apices, and longer filaments 20-26 mm long.
            textZh: SANBI 条目提供了 Gladiolus meliusculus (G.J.Lewis) Goldblatt & J.C.Manning 的鉴别特征。
