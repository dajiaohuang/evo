        status: partially-supported
        claims:
          - text: Densely cushion-shaped, succulent shrub, up to 600 mm diam., 250 mm tall. Leaves terete, apically pointed, glaucous, older leaves blackish green, old leaves persisting between new ones, 50-80 x up to 10 mm, up to 10 mm thick. Flowers solitary, with white to salmon or peach-coloured petals, filamentous staminodes and stamens very numerous. Fruit 5-locular, valve wings broad, closing bodies small.
