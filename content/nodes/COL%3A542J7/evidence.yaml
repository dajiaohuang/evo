        claims:
          - text: "The SANBI e-Flora morphology field describes Syringodea bifucata M.P.de Vos: plants 60–250 mm high, with 4–8 linear-channelled leaves and pale to deep violet or sometimes white flowers with a yellow or orange throat."
            textZh: SANBI e-Flora 形态字段记载 Syringodea bifucata M.P.de Vos：株高 60–250 mm，具 4–8 枚线形槽状叶；花色由浅紫至深紫、偶为白色，喉部黄色或橙色。
