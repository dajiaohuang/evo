            placeTimeScope: SANBI e-Flora source 18638.0 in the South African flora archive; a regional descriptive field, not a global synthesis or current-population estimate.
            lifeStatus: Wild regional-flora evidence; cultivated status is not assessed.
          - text: The archive distinguishes it from Syringodea concolor by its yellow or orange throat and coarsely sculptured brown seeds, and from S. flanaganii by generally larger flowers.
