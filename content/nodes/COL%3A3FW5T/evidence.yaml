        claims:
          - text: Acaulescent perennial to 40 cm. Leaves tufted, oblanceolate-pinnatisect, lobes round and twisted, yellow-felted below, margins revolute. Flower heads radiate, scapose, cream-coloured, sometimes yellow, maroon on reverse; bracts glabrous.
            sourceIds:
              - sanbi_14149_0
            locator: "SANBI/WFO archive Morphology row 10859; source 14149.0; publication: Manning, JC; Goldblatt, P. 2012. Asteraceae: Gerbera L. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 380 - 380. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: A relatively distinctive species recognized by the pinnatifid leaves with suborbicular to quadrate lobes, often flexed upwards along the lower edges, and the glabrous involucral bracts. In all other species at least the outer bracts are partly tomentose. The dark-tipped pappus bristles are another distinctive feature of most collections not encountered elsewhere in the genus. G. linnaei hybridizes with both G. crocea and G. wrightii where they co-occur.
            textZh: SANBI 条目提供了该种的鉴别特征。
            sourceIds:
