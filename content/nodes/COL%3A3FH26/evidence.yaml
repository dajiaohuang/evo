    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte to 10 cm, tunics unknown, probably woody, imbricate, stem pubescent. Leaves ± falcate to trailing, margins and central vein winged, wing edges ciliate, Flowers white to pale pink, tepals ± 7.5 x 2.5 mm, stamens symmetrical, filaments unequal.
            textZh: Geissorhiza saxicola Goldblatt & J.C.Manning 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 6839; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Recognised by the combination of a hairy stem, leaves with the margins and central vein winged with pilose wing edges, and small, white to pink flowers with unequal filaments. Its immediate relationships are uncertain although it evidently falls in sect. Ciliatae. Pollen grains with specialised, complex apertures place the species closest to G. exilis and G. inflexa, but the filaments of both these species are equal in length. The low stature and small flowers recall G. minuta of the Gifberg and Pakhuis Mtns, but that species has a smooth stem, equal stamens, and the thickened leaf margins and central vein lack the wings with ciliate edges of G. saxicola.
            textZh: SANBI 条目提供了 Geissorhiza saxicola Goldblatt & J.C.Manning 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 94742; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
