        claims:
          - text: Annual, tufted (with numerous flowering culms or solitary culms in young plants; culms branching near base and sometimes rooting from lower nodes), up to 300 mm tall. Leaf blades 100-170 mm long, 5-8 mm wide. Spikelets 7-20 mm long, 1-3 mm wide, 2-flowered; glumes appressed to rachis, slightly gaping at maturity, concealing or partly concealing spikelets in concavities of rhachis, three-quarters of to slightly longer than spikelets; lemmas obtuse to acute, not turgid at maturity, awn absent or to 10 mm long. Mature caryopsis more than 3 times as long as wide.
