          title: Peperomia glabella (Sw.) A.Dietr., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: A black-glandular-dotted, stoloniferous-assurgent herb; stem 1-2 mm. thick, branches ascending to 15 cm. or more, glabrous except for the ciliate petioles and lines decurrent from their margins below the nodes; leaves ovate to ovate-elliptic- lanceolate, 8-13 mm. wide X 15-35 mm. long, or occasionally up to 2.5 X 6 cm., acute to acuminate at both ends or not infrequently blunt or subobtuse, palmately 3- to 5-nerved, or plinerved within the lowermost 5-7 mm., ciliated near the apex, or some leaves throughout, mostly drying dark and subopaque; petiole 5-10 mm. long, grooved above, clasping-decurrent, mostly crisp-ciliate; spikes terminal and from the upper leaf axils, slender, up to 5-8 or occasionally as much as 12 cm. or more long; peduncle 10-15 mm. long; bracts round-peltate, black- dotted; fruit globose-ovoid, apex oblique, somewhat scutelliform and scutellum commonly with a thin margin, stigma subapical.
