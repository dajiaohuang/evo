  claims:
    - subjectId: taxon:ambulocetus
      claimType: taxonomy
      claimKind: scientific
      statement: H-GSP 18507 is the holotype of Ambulocetus natans and is routed under Ambulocetidae; that placement does not identify a direct cetacean ancestor.
      confidence: medium
      confidenceRationale: The taxonomy field for ambulocetus is bounded to the named material and cited primary-study locator; that evidence type is not generalized to ancestry or a whole clade.
