  claim-rationales.zh:
    - 两栖型早期鲸的分类表述只覆盖具名标本及所引主研究的分析范围；导航归属不表示直系祖先或普适系统树。
    - 两栖型早期鲸的地理字段只投影主研究记录的具体产地，不外推为全球分布、起源中心或完整扩散路径。
    - 两栖型早期鲸的生态字段区分保存事实与功能推断；未被标本直接记录的饮食、行为、栖息地或性能均明确保留不确定性。
    - 两栖型早期鲸的形态字段限定于主研究列明的具名标本和精确页码、图版或补充材料，不外推到整个支系。
    - 两栖型早期鲸的年代范围是主研究标本或地层背景的有界投影，不作为全球首现、末现、分化时间或连续谱系时长。
  claim-statements.zh:
    - H-GSP 18507 是 Ambulocetus natans 的正模，并在导航中归入 Ambulocetidae；这一归位不能识别鲸类的直接祖先。
    - 本资料限于巴基斯坦 Kuldana 组的产出，并不意味着完整的扩散范围。
    - 粗壮的解剖构造支持两栖捕食及运动模型，但确切游泳方式、猎物和陆地运动能力并未直接观察。
    - H-GSP 18507 保存了局部颅骨、脊柱以及相当部分的前、后肢材料，记录了一套镶嵌式解剖特征。
    - 4,800 万至 4,700 万年前的区间是正模所在组级背景，并非该属的全球首次或末次出现、鲸类过渡持续时间或直接测年。
