    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Perennial herb, geophyte, 0.25-0.50 m high; stem simple, erect or slightly curved. Leaves linear, acuminate, erect, 1.5-4.0 mm wide. Bracts ± papery, golden-brown, outer tridentate, inner bidentate, pale towards base. Inflorescence a subsecund, lax spike; flowers red or pinkish scarlet, zygomorphic; perianth tube funnel-shaped; tepals subequal in length, dorsal widest, calli almost triangular. Stamens curved; anthers contiguous, curved. Style 14-18 mm long, at or above anther apex. Flowering time Jan.-Mar.
            textZh: Tritonia drakensbergensis M.P.de Vos 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_18505_0
            locator: "SANBI/WFO archive Morphology row 91080; source identifier 18505.0; cited publication: Bredenkamp, CL; Magwaza, ZL. 2019. Iridaceae. In: CL Bredenkamp (ed.), A Flora of the Eastern Cape Province, Strelitzia 41(3): 1821 - 1882. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: A slender species distinguished by its narrow, linear leaves, 1.5-3.0(-4.0) mm wide with a prominent submarginal vein, and widely funnel-shaped, red to deep pink flowers with a yellow blotch at the base of the lower tepals, these surrounding small, triangular calluses 1.0-1.5 mm high. Tritonia drakensbergensis can be confused in the dried state with narrow-leaved forms of T. disticha, which has similarly shaped and coloured flowers, also with a yellow spot at the base of the lower tepals, but that species lacks calluses (represented at most by a low, ridge-like thickening) and the leaves are narrowly lanceolate and (5-)8-12(-20) mm wide. Tritonia disticha typically occurs at lower altitudes in drier grassland on dolerite or sandstone.
            textZh: SANBI 条目提供了 Tritonia drakensbergensis M.P.de Vos 的鉴别特征。
