        claims:
          - text: Perennial holoparasitic herb; achlorophyllous, lacking leaves and roots; rhizomatous with one to several yellowish rhizomes extending deep into sand dune, numerous secondary haustoria forming from scales where host roots contact rhizome; scales ovate to oblong, 5.0-13.0 x 4.0-10.0 mm, apex acute to slightly obtuse, upper margin ciliate with short multicellular trichomes, abaxial surfaces of above-ground scales puberulent near apex, scales mostly glabrous below ground. Inflorescence a densely-flowered spike, ovate to slightly oblong, 8.3-15.4 x 3.8-6.7 cm; flowers tubular with two lateral bracteoles, subtended by a single bract on the abaxial side; floral bract 1.9-3.4 x 0.7-1.4 cm, oblong and keeled adaxially, acute to slightly obtuse, upper margins slightly scarious and entire, proximally pubescent, becoming pubescent to pilose on the distal abaxial surface and densely pubescent on the distal adaxial surface; bracteoles 2.7-3.9 x 0.2-0.5 cm, lanceolate to broadly linear, acute to acuminate, the upper half pilose. Flowers sessile to subsessile; calyx 3.8-5.1 cm, four of five sepals fused to 1/4-1/2 their length, the abaxial sepal free or connected to other sepals near calyx base, sepal lobes lanceolate to broadly linear, acute, pilose; corolla light pink, 5.6-6.2 x 1.0-1.4 cm, tubular or slightly curved, slightly inflated above constricted tube 1.1-1.8 x 0.5-0.9 cm, densely pilose with two minute lapel-like lateral lobes and a small denticle at the base of the corolla mouth, lateral lobes slightly to fully reflexed, denticle 1.7-3.3 mm, corolla mouth 1.4-2.0 cm; stamens 4, inserted in the corolla at the point of constriction, 3.4-4.2 cm, one pair slightly shorter than the other, filaments straight with slightly inflated bases, pubescent to tomentose zone at base of stamens and ringing interior surface of corolla at level of insertion, anthers 3.0-5.0 x 2.0-3.0 mm, calceiform, one-celled, small knob or spur on proximal end from vestigial theca, apical pore elongated and slightly recurved, even with corolla mouth to slightly exserted at maturity; pistil recurved ca 90° below stigma, stigma exserted, clavate to nearly capitate, slightly bilobed dorsiventrally. Fruits not seen.
            sourceIds:
              - sanbi_7757_0
            locator: "SANBI/WFO archive Morphology row 74232; source 7757.0; publication: Wolfe, AD. 2013. Hyobanche thinophila (Orobanchaceae), a new species from the Western Cape of South Africa. Phytotaxa 85(2): 56 - 60. [http://dx.doi.org/10.11646/phytotaxa.85.2.3]. [All rights reserved]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: "One to several inflorescences arise from a single rhizome that may be more than a meter in length. Hyobanche thinophila occurs in early successional sand fynbos. The host range for Hyobanche is difficult to determine based on the proximity of other plants because the rhizome system of the parasite can be quite extensive. However, host roots attached to the rhizome of the parasite were collected and their DNA extracted for a barcoding study aimed at identifying the hosts of Hyobanche thinophila (unpublished data). Three genera have thus far been identified as hosts to H. thinophila: Metalasia R. Brown and Chrysanthemoides Tournefort ex. Medikus (Asteraceae), and Passerina L. (Thymelaeaceae). The white, exserted and recurved styles of Hyobanche are the primary reason for katnaels as a common name. Wolwekos as a common name is a misnomer. Wolves are not native to South Africa; the niche of wolves is filled by the African wild dog. The origin of this common name is unknown, but may refer to the resemblance of the inflorescence to fresh scraps of carrion. Inkblom refers to the use of the plant for making ink. Hyobanche, similar to other genera in Orobanchaceae, tends to dry black after harvesting the inflorescence. Dried material is then ground into powder and added to liquid to make ink. Hyobanche thinophila is easily differentiated from H. sanguinea by dissecting the corolla to examine the interior vestiture: a ring of long multicellular hairs at the level of stamen insertion in H. thinophila vs. short glandular hairs scattered throughout the interior surface of the corolla in H. sanguinea. The shape of the inflorescence is ovate to slightly elongated in H. thinophila vs. compact to oblong in H. sanguinea. Flowers of H. thinophila are light pink, tubular and non-galeate, and slightly curved to straight vs. scarlet to deep red, galeate and strongly curved in H. sanguinea."
