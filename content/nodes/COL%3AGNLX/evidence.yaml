    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Rhizomatous perennial to 20 cm, stem flattened and 2-winged. Leaves sword-shaped, fairly soft. Flowers blue, spathes with hyaline margins. Capsules cylindric-trigonous, elongate.
            textZh: Aristea pusilla (Thunb.) Ker Gawl. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 6619; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: A dwarf plant, typically 80-120 mm high but sometimes shorter, Aristea pusilla is readily recognised by its soft-textured, sword-shaped leaves and compressed and narrowly 2-winged flowering stem, 1.5-2.0 mm wide, bearing one or more leaves along its length. The stem is often unbranched with a single terminal flower cluster but particularly robust plants may have one or two sessile lateral flower clusters. The flower clusters have at most two flowers and the lateral clusters often just a single flower. The flowers are contained within relatively long, green spathes and are ± sessile and carried on elongate ovaries above the spathes. The ovary is triangular in cross section, but mature capsules, (14-)20-25(-30) mm long.
            textZh: SANBI 条目提供了 Aristea pusilla (Thunb.) Ker Gawl. 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 94123; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
