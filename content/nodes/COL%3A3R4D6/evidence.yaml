        status: partially-supported
        claims:
          - text: Monoecious, tuberous, hairy, perennial herb, with prostrate stems, up to more than 1 m long, branched underground, without tendrils. Leaves ± entire to palmately 3-5-lobed, up to 25 mm long. Flowers arising from underground stems, male ± 25 per axil, fascicled, 5-7 mm long, green, female solitary, 10-12 mm long, yellow, with subterranean ovary. Fruit developing below ground, ± spherical, 22 mm diam., pubescent, white, turning green when exposed.
