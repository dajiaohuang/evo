          title: Crotalaria verrucosa L., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Herb or suffrutescent herb to 2 m tall, stems angled, strigulose. Leaves uni- foliolate, broadly angular ovate or rhombic, the apex rounded, the base cuneate to attenuate, 3.4-4.5 cm long, 2.2-3.0 cm broad; entire, above glabrous to sparse- ly strigulose, beneath strigulose, the veins 4-6 on each side of the midvein; petiole 2-3 mm long; stipules crescent shaped, encircling the nodes, to 1.0 cm long. Inflorescences terminal or sub-terminal racemes bearing 8-13 flowers, the bracts narrowly triangular, 2.0-2.5 mm long, persistent, the pedicels 3-5 mm long; brac- teoles narrowly triangular, to 1.1 mm long, strigulose, located at mid-pedicel. Flowers blue or white tinged with violet, 11-16 mm long; calyx 10-13 mm long, the tube campanulate, the lobes about twice as long as the tube, strigulose; corolla blue or white tinged with violet, 13-15 mm long, the standard 11-16 mm long, 12-17 mm broad, retuse, the wings 11-14 mm long, the claws 2-3 mm long, oblong lanceolate, oblique, the keel 13-16 mm long, the twisted beak prolonged; stamens dimorphic, the long anthers 2.8-3.2 mm long, the short anthers 0.6-1.0 mm long; style with a pubescent stigma, curved geniculate, 8.5-10.0 mm long. Legume inflated, 2.4-3.0 cm long, strigulose; seeds ca. 11, tan to brown, oblique cordiform, to 4.5 mm long.
          originalLanguage: en
