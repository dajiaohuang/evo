            locator: "SANBI/WFO archive Morphology row 35064; source 14904.0; publication: Snijman, DA. 2013. Malvaceae. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 416 - 420. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: This species approaches H. cuneifolia in several respects, especially in the cuneate, concolorous leaves with more or less the same pubescence. Microscopically the tomentum on both sides is made up of fringed, pitted scales. In H. cuneifolia the scales are larger than in our species. The most striking difference is in the calyx; in H. cuneifolia it is campanulate, not at all inflated, and shortly lobed, while in H. pfeilii it is, as the synonym H. patellicalyx implies, shaped like a little dish and subinflated with lobes almost as long as the disc. H. pfeilii is also close to H. desertorum but differs mainly in the larger flowers and the leaves which are more constantly obovate-cuneate, rather thick in texture and very shallowly, if at all, crenate.
            textZh: SANBI 条目提供了该种的鉴别特征。
