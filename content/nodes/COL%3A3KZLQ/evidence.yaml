        claims:
          - text: Much-branched subshrub, up to 800 mm tall, with prominent leaf scars on stems. Leaves obovate-cuneate, often broader at apex than long, entire or 3or more-lobed, covered with minute fringed pitted grey scales. Flowers few at branch tips, turned to one side, bright yellow, ca lyx dish-shaped, subinflated.
            sourceIds:
