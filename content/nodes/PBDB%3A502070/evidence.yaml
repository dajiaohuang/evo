  claim-rationales.zh:
    - Gladbachus adentatus：具名材料和已发表的系统或系统发育处理支持这一有限鉴定。置信度保持中等，因为画像不会把取样位置转化为直接祖先或普遍共识。
    - Gladbachus adentatus：一手研究直接报告了具名地点与层位。置信度为中等，因为单一研究样本不能确定缺失、特有性或全球地理范围。
    - Gladbachus adentatus：证据边界是明确的：保留沉积或解剖背景，同时不填补无依据的行为与生态位。中等置信度针对这一有限的否定性陈述，而非重建生态。
    - Gladbachus adentatus：所引图件与描述直接记录了具名解剖观察。由于保存与标本取样限制了性状完整性和变异，置信度为中等而非普遍结论。
    - Gladbachus adentatus：一手来源与具体定位符支持显示的样本区间。置信度为中等，因为该包络明确限定于标本或地点，而非全球首现或末现。
  claim-statements.zh:
    - Gladbachus adentatus 仅由受压标本 UMZC 2000.32 代表，在分析中位于软骨鱼干群而非现生冠群。
    - UMZC 2000.32 来自德国贝吉施格拉德巴赫 Unterthal 上吉维特阶 Lower Plattenkalk；该记录不定义更广延限。
    - 该石板记录了水生鱼类躯体，但未直接保存食性、捕食方式、游泳性能或栖息地偏好。
    - CT 与组织学在 UMZC 2000.32 中揭示了脑颅、颌、鳃骨架、肩带、软骨、鳞片和牙齿。
    - 显示的约 385 Ma 时间点是 UMZC 2000.32 的上吉维特阶出现记录，并非软骨鱼类全球首现。
