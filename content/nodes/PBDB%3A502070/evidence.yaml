  claims:
    - subjectId: taxon:gladbachus
      claimType: taxonomy
      claimKind: scientific
      statement: Gladbachus adentatus is represented by the single compressed specimen UMZC 2000.32 and was recovered on the chondrichthyan stem rather than within the living crown.
      confidence: medium
      confidenceRationale: "Gladbachus adentatus: Named material and a published systematic or phylogenetic treatment support this bounded identification. Confidence remains medium because the profile does not turn a sampled placement into direct ancestry or universal consensus."
      referenceLinks:
        - referenceId: coates-2018-gladbachus
          relation: supports
          pages: 1–10, especially 2–10
          figure: Figures 1–4; Supplementary Figure S1
          quoteLocator: Specimen description; CT and histology results; phylogenetic results and discussion
    - subjectId: taxon:gladbachus
      claimType: biogeography
      claimKind: scientific
      statement: UMZC 2000.32 comes from the Upper Givetian Lower Plattenkalk at Unterthal, Bergisch Gladbach, Germany; this occurrence does not define a wider range.
      confidence: medium
      confidenceRationale: "Gladbachus adentatus: The primary study reports the named locality and horizon directly. Confidence is medium because one study sample cannot establish absence, endemism or a global geographic range."
      referenceLinks:
        - referenceId: coates-2018-gladbachus
          relation: supports
          pages: 1–10, especially 2–10
          figure: Figures 1–4; Supplementary Figure S1
          quoteLocator: Specimen description; CT and histology results; phylogenetic results and discussion
    - subjectId: taxon:gladbachus
      claimType: ecology
      claimKind: scientific
      statement: The slab records an aquatic fish body but does not directly preserve diet, prey capture, swimming performance or habitat preference.
      confidence: medium
      confidenceRationale: "Gladbachus adentatus: The evidence boundary is explicit: depositional or anatomical context is retained while unsupported behaviour and niche claims are withheld. Medium confidence applies to that bounded negative statement, not to a reconstructed ecology."
