        usage:
          title: Magnolia sororum Seibert, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Tree up to 30 m. tall; indumentum rufous or tawny; branchlets densely villous-pubescent when young. Leaf-lamina elliptic or ovate-elliptic to elliptic- or ovate-oblong, cuneate to obtuse or rounded at the base, obtuse to subacute or subacuminate at the apex, up to about 20 cm. long and 10 cm. broad, coriaceous, at first pubescent above on the midrib towards the base, densely pubescent beneath; lateral nerves about 10-14 on each side of the midrib; petiole up to about 3 cm. long, at first densely villous-pubescent, sometimes glabrescent; stipules villous- pubescent outside. Flowers very fragrant; bud ellipsoid; bracts 1-4, the uppermost or single one inserted immediately below the flower, densely villous-pubescent outside; peduncle stout, about 1.5-4 cm. long, densely villous-pubescent. Tepals 9, 3-merous, white; outer 3 obovate-oblong, about 4-7 cm. long, sparingly pubescent outside at the very base; inner 6 up to about 8 cm. long, glabrous. Stamens about 13-15 mm. long. Gynoecium ellipsoid; carpels about 20-45, densely villous- pubescent. Fruit ellipsoid to ellipsoid-oblong, about 4.5-6 cm. long; fruiting carpels shortly beaked.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 7059
