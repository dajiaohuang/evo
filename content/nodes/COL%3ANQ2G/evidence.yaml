          - text: Like B. quartzicola but 130-250 mm tall, and tuber large. Leaves 6-8, withered at flowering, erect, slender, curling in upper third, clasping below into a 40-70 mm long, rough, dark neck. Flowers in 1-3, wiry racemes, greenish yellow to yellow. Capsule ovoid, ± 3 mm long.
