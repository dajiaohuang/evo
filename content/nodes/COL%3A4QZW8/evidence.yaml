    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Like Q. parviflora but stems somewhat mottled, pedicels 3-5 mm long, corolla 4-8 mm diam., inside pale green, without markings, hairs or cilia, corona pale green to white.
            sourceIds:
              - sanbi_14722_0
            locator: "SANBI/WFO archive Morphology row 34094; source 14722.0; publication: Bruyns, PV. 2013. Apocynaceae. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 248 - 264. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Specimens of Q. pallens are often scandent in bushes and the stems are then up to 300 mm long and slightly stouter. Some more exposed specimens that were found were more slender than usual and had a darker colour. Flowers are borne in small numbers, often on quite large peduncular patches. They are held facing partly upwards on fairly long pedicels. On the inside the flowers are pale green towards the tips of the lobes and become white towards the centre without any darker spots or bars. They are rather small, with spreading to reflexed and relatively narrow lobes. There are no hairs on the corolla, either inside or along the margins of the lobes. The corona is altogether nearly white and lacks any clear basal stipe. It has slender, ascending, deeply bifid outer lobes. The inner lobes are entirely without dorsal projections but mostly cover the anthers completely. The colouring, orientation and shape of the corolla as well as the pale corona with its long, deeply bifid outer lobes all suggest that the closest affinities of Q. pallens lie with Q. parviflora subsp. parviflora, in which the flowers can also be relatively small. Although the barring of purple on the flower can become quite faint in subsp. parviflora, it has never been observed to be absent and the flowers of Q. parviflora always have fine cilia along the margins of the lobes.
            textZh: SANBI 条目提供了该种的鉴别特征。
            sourceIds:
