        usage:
          title: Solanum canense Rydb., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Scandent perennial herb or vine festooning in thickets and perhaps high climbing; stems slender, angled, glabrate. Leaves 9-15-foliolate, mostly with small, rotund interstitial leaflets, the rachis arching backwards, leaflets to 6 cm long and 1-2 cm broad, narrowly elliptical or lanceolate, apically acute, basally rounded, often oblique, glabrate or with scattered small hairs on the lamina and the midveins puberulent; petiole often bearing interstitial leaflets to the base, the petiolules to 1 cm long or almost wanting. Inflorescence lateral, a few-flowered raceme 4-6 cm long; pedicels filiform, 5-8 mm long, elongating and thickening somewhat in fruit, articulating near the base, glabrous. Flowers small, calyx less than 1.5 mm long, subtruncate with dark, umbonate teeth; corolla white with a dark eye, 1-1.5 cm across, lobed to about the middle; filaments very short. Fruit globose to ellipsoid, 1.5-2 cm long, green and striped.
