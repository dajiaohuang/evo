    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants 200-400 mm long. Corm flattened on one side, with a small fan-shaped ridge. Leaves filiform, curved or suberect, 150-400 x 0.5-1.0 mm, grooves narrow. Inner bract with a green tip and sometimes with wide, white membranous margins. Flowers 22-105 mm long, golden-yellow, often orange-yellow in the lower half, outer perianth segments brownish or purplish on the backs or with reddish feathered veining. Perianth tube (13-)20-65 mm long, tubular for most of its length, widened and funnel-shaped in the upper 10 mm; segments (10-)15-45 x 5-15 mm. Filaments 5-10 mm, inserted in the upper part of the perianth tube; anthers 5-12 mm long. Style (20-)25-70 mm; stigmas below, at or sometimes above the anther tips. Capsules ellipsoid, on recurved peduncles.
            textZh: Romulea macowanii Baker 的 SANBI 物种条目记录了形态特征。
