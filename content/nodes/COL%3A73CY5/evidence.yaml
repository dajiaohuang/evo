      morphology:
        status: partially-supported
        claims:
          - text: A spreading, white-woolly shrublet to 40 cm, with lanceolate, glabrescent, slightly twisted leaves 3–10 mm long and axillary tufts; discoid heads are few and fused in terminal clusters, four- or five-flowered, with slightly spreading inner petaloid bracts, white or pinkish.
