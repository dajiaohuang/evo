    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants usually in small groups, 0.5-1 m tall excluding inflorescence. Leaves ±76 cm a rosette, erect to arcuate-incurved, 250-400 x 50-80 mm, slightly biconvex, green to purplish, lower surface often white-spotted, margins cartilaginous, dentate. Inflorescence a cylindric, sub-dense raceme; peduncle 0.7-1.6 m long; bracts narrowly deltoid-acuminate, 12-20 x 4-8 mm, many-nerved. Flowers yellow-green, 10-12 mm long, cylindric; all segments free; pedicels 12-22 mm long. Anthers exserted 2-3 mm. Ovary bright green, ±3.0 x 1.5 mm; style exserted 2-4 mm. Fruit not seen.
            textZh: Aloe chlorantha Lavranos 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_5961_0
            locator: "SANBI/WFO archive Morphology row 49034; source identifier 5961.0; cited publication: Glen, HF; Hardy, DS. 2000. Aloe. In: G Germishuizen & E du Plessis (eds), Aloaceae (first part), Fl. S. Africa 5(1,1): 1 - 167. National Botanical Institute, Pretoria. [http://www.biodiversitylibrary.org/item/209564#page/3/mode/1up]. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: The closest relative of this strange, somewhat unattractive new species appears to be Aloe broomii Schonl. In both the simple or rarely bifurcate peduncle is covered virtually from the base upwards, by numerous, large sterile bracts, which like the floral ones are very fleshy. This characteristic is encountered in other South African species of Aloe such as A. glauca, A. namibensis, A. pratensis, A. comosa etc. In Aloe broomii the thick, fleshy raceme occupies well over half the length of the inflorescence, while in A. chlorantha it barely occupies more than one third of the whole. The buds of both species are covered by the imbricate bracts, however where the open flowers of A. broomii remain hidden by the bracts, the relatively small flowers of A. chlorantha are free and nodding. Rosettes of A. chlorantha are much smaller than those of A. broomii having far fewer leaves.
            textZh: SANBI 条目提供了 Aloe chlorantha Lavranos 的鉴别特征。
