      ecology:
        status: partially-supported
        claims:
          - text: H. aristata is a constituent of Fynbos or karroid vegetation. The Little Karoo is a fertile valley, hilly and rocky with numerous shrubs and succulents; this region receives 125 to 250 mm of rain with peaks in March and November, the altitude at Barrydale is 458 m and 469 at Oudtshoorn. The area is dry and very hot during the summer months while the winters are rather cold. H. aristata occurs mostly in small colonies, distributed on hillsides, or as single plants in partial shade, usually under low scrub. H. aristata grows in a firm hard soil with pH 6.8.
