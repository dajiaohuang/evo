    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants acaulescent, with leaves in a basal rosette 4 to 9 cm diam., proliferous from the base and forming clusters. Leaves about 50, the young erect, incurved, firm, the old ascending, tips incurved, about 6 cm long, up to 15 mm broad, up to 5 mm thick, ovate-lanceolate, green or dark green; upper surface turgid in the upper part of the leaves, convex below, smooth;, not pellucid; lower surface rounded, smooth; keel 1, in the upper third of the leaf, smooth, or minutely dentate; margins acute, smooth or lightly dentate; end-awn persistent, up to 18 mm long, smooth. Inflorescence about 53 cm tall; peduncle simple, terete, about 3 mm diam., about 20 cm long, bracteate; sterile bracts membranous, ovate, acuminate, about 7 mm long, erect, keeled; raceme up to 33 cm long, lax, with about 36 spirally arranged flowers and buds, 5 to 7 open simultaneously; floral bracts membranous, 6 mm long, deltoid, keeled with broad brown veins, clasping the pedicels, (longer than the pedicels); pedicels up to 4 mm long, 2 mm diam., brown, erect; perianth white, with brown keels to the segments, up to 18 mm long, curved, compressed at base, funnel-shaped; tube more or less 5 mm across, constricted to 4 mm above; segments free to the base, limb 2 lipped; posterior segments with lobes free, recurved, spreading, with light brown veins; exterior part strongly recurved, spreading, white, with light brown veins; stamens 6 of two lengths 7 and 8 mm long, inserted within the perianth tube; ovary 1 mm long, 2 mm diam., light green; style 2 mm long, straight, capitate.
