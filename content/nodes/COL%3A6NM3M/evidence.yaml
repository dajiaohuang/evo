            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: K. ritualis has conspicuously long, narrow bracts like those of K. sarmentosa but is distinguished from the latter by its markedly serrulate leaves and longer perianth, which is 25-30 mm long, as against 20-25 mm in K. sarmentosa.
