    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants solitary or few-stemmed. Leaves at first erect later bending at the middle or semi-spreading, soft in texture, semiglaucous, 400-900 x 12-24 mm, deeply keeled; margin conspicuously and regularly serrulate. Scape sub-equal to or shorter than leaves, 400-800 mm long. Raceme rhomboid-cylindrical to ovoid, dense in lower half, often laxer towards apex, 90-140 x 40-50 mm; buds coral or salmon to dull orange-red; flowers pendulous, greenish yellow. Bracts lanceolate to linear-lanceolate, acute to acuminate, 10-12 mm long; margin usually minutely denticulate. Pedicels 1-2 mm long at flowering, increasing to 5 mm at fruiting stage. Perianth subcylindrical, 25-30 mm long; lobes ovate, 3.0-3.5 mm long, not spreading. Stamens not or scarcely exserted at anthesis. Fruit subglobose, 7-8 mm long.
            textZh: Kniphofia ritualis Codd 的 SANBI 物种条目记录了形态特征。
