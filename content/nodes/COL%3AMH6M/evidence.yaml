    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Tuberous geophyte to 50 cm. Leaves scattered, linear-lanceolate. Flowers few to many in a lax raceme, green and white, to 40 mm long, petals bilobed, lip 3-fid, spur 11-25 mm long, stigmas ± 6 mm long.
            textZh: Bonatea cassidea Sond. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13882_0
            locator: "SANBI/WFO archive Morphology row 10008; source identifier 13882.0; cited publication: Kurzweil, H. 2012. Orchidaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 177 - 197. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: B. cassidea grades in morphology from the Eastern Cape through to northern KwaZulu-Natal, with the lip median lobe and upper petal lobes changing from white to green, and the lower petal lobes and lip lateral lobes decreasing in width. B. cassidea is closely allied to B. saundersioides, which together form the B. cassidea complex. B. cassidea can be differentiated from B. saundersioides by its shorter and wider lower petal lobes, (<15 x >3 mm vs >16 x <2 mm), and its wider lip lateral lobes (<2 mm vs <2 mm). B. saundersiae was recognized as a separate species based on its reduced rostellum median lobe, markedly longer rostellum lateral lobes, and fewer, larger flowers, with more arched lateral lobes and falcate tips. Morphometric analyses places B. saundersiae within the morphological range of B. cassidea for all characters except the length of the rostellum lateral lobes (0.5-2.0 vs 4.5-6.5 for B. saundersiae). Populations classified as B. saundersiae occur in the middle of the geographic range of B. cassidea. We therefore prefer to regard B. saundersiae as representing an unusual local ecotype of B. cassidea that is restricted to the Umbilo River in KwaZulu-Natal.
