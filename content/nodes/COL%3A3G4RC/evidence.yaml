    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, 80-140 mm tall, corm tunics more-or-less woody. Leaves linear to falcate, thicker in the midline, mostly 3-5 mm wide. Flowers 5-12 in a nearly horizontal spike, salver-shaped, creamy white, with red and yellow nectar guides, perianth tube elongate-cylindrical, 35-40 mm long, dorsal tepal largest, erect or recurving, 20-22 mm long. Late Aug.-early Oct.
            textZh: Gladiolus lapeirousioides Goldblatt 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_14562_0
            locator: "SANBI/WFO archive Morphology row 30756; source identifier 14562.0; cited publication: Goldblatt, P; Manning, JC. 2013. Iridaceae. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 94 - 124. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Recognised by the horizontal spikes of long-tubed, cream-coloured flowers with narrow, spreading tepals, the lower three with small yellow and red markings near the base, the perianth tube long, straight and subcylindric, 35-40 mm long, and the filaments short, ± 8 mm long and exserted from the tube for about half their length.
            textZh: SANBI 条目提供了 Gladiolus lapeirousioides Goldblatt 的鉴别特征。
