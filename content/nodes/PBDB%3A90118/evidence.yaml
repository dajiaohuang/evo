  claims:
    - subjectId: taxon:yinlong_downsi
      claimKind: scientific
      claimType: taxonomy
      statement: Yinlong downsi is based on holotype IVPP V14530, and the study recovers the taxon as a basal ceratopsian in its sampled character matrix; that analysis is not evidence of an uncontested relationship or direct ancestry.
      confidence: medium
      confidenceRationale: "The holotype and diagnosis are directly documented, whereas its broader placement depends on character scoring, taxon sampling and analysis settings. Yinlong downsi: For the species-level page, this assessment applies to the named species and its cited diagnosis; it does not imply a broader genus sample."
      referenceLinks:
        - referenceId: xu-2006-yinlong
          relation: supports
          pages: 2135–2140
          figure: Figures 1–3; Electronic Supplementary Material
          quoteLocator: Systematic palaeontology; Phylogenetic analysis; Discussion
    - subjectId: taxon:yinlong_downsi
      claimKind: scientific
      claimType: biogeography
      statement: This profile's geographic statement is limited to Wucaiwan in the Junggar Basin, Xinjiang, China, and the upper Shishugou Formation horizon reported for IVPP V14530; it does not establish a global distribution.
      confidence: high
      confidenceRationale: "The locality and horizon are stated directly for the holotype, but one locality-level occurrence cannot establish the genus-wide distribution. Yinlong downsi: For the species-level page, this assessment covers the cited occurrence or localities only and does not estimate a complete range."
      referenceLinks:
        - referenceId: xu-2006-yinlong
          relation: supports
          pages: "2135"
          figure: Figure 1
          quoteLocator: "Systematic palaeontology: Locality and horizon"
    - subjectId: taxon:yinlong_downsi
      claimKind: scientific
      claimType: morphology
      statement: Holotype IVPP V14530 is a nearly complete skeleton missing only the distal tail; the primary description records its broad post-orbital skull region, shallow pre-orbital region and diagnostic cranial features, all limited to the named specimen.
      confidence: high
      confidenceRationale: "The holotype inventory, diagnosis and described cranial anatomy are directly reported and illustrated in the primary study. Yinlong downsi: For the species-level page, this assessment covers the characters observed in the cited specimens; unsampled variation remains outside it."
      referenceLinks:
        - referenceId: xu-2006-yinlong
          relation: supports
          pages: 2135–2137
          figure: Figures 1–2; Electronic Supplementary Figures 1–2
          quoteLocator: "Systematic palaeontology: Holotype, Diagnosis and Description"
    - subjectId: taxon:yinlong_downsi
      claimKind: scientific
      claimType: ecology
      statement: The primary description estimates the IVPP V14530 individual at about 120 cm and interprets its short forelimbs and robust hindlimbs as compatible with bipedality; diet, habitat preference, guild and observed behaviour are not directly resolved by this anatomy and matrix study.
      confidence: medium
      confidenceRationale: "Body proportions and the size estimate are reported for the holotype, while bipedality is an anatomical interpretation and the remaining ecological fields are not direct observations. Yinlong downsi: For the species-level page, this assessment covers only ecological inferences tied to the cited specimens; unmeasured fields remain unassigned."
      referenceLinks:
        - referenceId: xu-2006-yinlong
          relation: supports
          pages: 2135–2137
          figure: Figures 1–2
          quoteLocator: "Systematic palaeontology: Description; limb proportions and estimated body length"
  claim-rationales.zh:
    - 正模和诊断有直接记录，而更广泛的位置依赖性状评分、类群取样和分析设定。 Yinlong downsi：本种级页面的判断仅适用于所引材料中的该种及其描述，不表示存在更广泛的属级样本。
    - 正模的地点和层位有直接记录，但单一地点级出现不能建立完整属级分布。 Yinlong downsi：本种级页面的判断仅覆盖所引化石记录或地点，不据此估算完整分布。
    - 一手论文直接记录并图示正模清单、诊断和颅骨解剖。 Yinlong downsi：本种级页面的判断仅覆盖所引标本中观察到的性状；未取样的种内变异不在此结论内。
    - 体型估计和肢骨比例针对正模有直接记录；两足性是解剖解释，其余生态字段不是直接观察。 Yinlong downsi：本种级页面的判断仅覆盖与所引标本相关的生态推断；未测量字段继续保持未指定。
  claim-statements.zh:
    - Yinlong downsi 依据正模 IVPP V14530 建立；研究在其取样性状矩阵中将该类群恢复为基干角龙类，但这一分析不能证明无争议的亲缘关系或直系祖先关系。
    - 正模 IVPP V14530 是一具仅缺尾部远端的近完整骨骼；一手描述记录了其宽阔的眶后头骨区、低浅的眶前区和诊断性头骨特征，所有观察均限定于该具名标本。
    - 本档案的地理陈述限定于中国新疆准噶尔盆地五彩湾以及 IVPP V14530 所报道的石树沟组上部层位；它不能确立全球分布。
    - 一手描述估计 IVPP V14530 个体全长约 120 厘米，并将其较短前肢和粗壮后肢解释为与两足性相容；该解剖与矩阵研究并未直接解决食性、生境偏好、生态功能群或观察到的行为。
