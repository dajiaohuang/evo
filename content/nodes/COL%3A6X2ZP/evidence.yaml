        usage:
          title: Randia mira Dwyer, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Trees to 6 m tall, the branchlets terete, the bark thin, red, deciduous, the nodes ultimately crowded. Leaves oblong, to 28 cm long, to 12.5 cm wide, deltoid to subobtuse at the apex, cuneate and slightly inequilateral at the base, the costa subplane above, somewhat convex beneath, to 2.5 mm wide, the lateral veins ca. 15, at first departing from the costa strictly, arcuate near the margin, the sub- marginal undulate vein conspicuous and forming 5-10 smaller irregular-pinnati- form veins, coriaceous, concolorous, smooth, glabrous above, glabrate beneath, short, appressed hairs confined to the costa and nerves; petioles to 1 cm long, lignose; stipules connate, compressed-rotund, to 0.6 cm long, with a median subulate awn to 0.6 cm long, puberulent outside. Plants cauliflorous, the flowers solitary but a few scattered on a twig, presumably regularly epedicellate; brac- teoles several, imbricate at the base of the hypanthium, triangular, to 8 mm long, to 5.5 mm wide, acute, the apex rigid and thick, truncate at the base, the margins thin, the body fleshy with a few white silken hairs outside, within the hairs ap- pressed, upright, weak, glandular at base, to 1 mm long. Flowers with the hy- panthium short, to 3 mm long, puberulent, the calycine cup widely cylindrical, to 1.8 cm long, turgid, often spathaceous in the upper portion, puberulent, the teeth 5-8, subulate, shorter than the cup, arising as a longitudinal thickening of the upper portion of the cup, often disposed on 1 side of the cup, the latter carnose, glabrous, smooth, with small white glands inside, the rim produced as a petaloid margin, minutely fimbriate; corolla yellow green outside, white inside, the tube narrowly cylindrical, to 8 cm long, ca. 0.4 cm wide in the middle, dilated toward the apex, puberulent outside, drying black, the lobes 5-6, imbricate, lan- ceolate, somewhat falcate, to 7 cm long, to 1.2 cm wide, acute, yellow green outside; anthers 6, sessile, oblong, ca. 2.5 mm long, minutely apiculate, attached ca. 6.5 mm above the base of the tube; style slender, somewhat compressed, ca. 6 mm long, the hairs white, appressed, the stigmas 2, erect, scarcely wider than the style, ca. 2 mm long, obtuse, the ovary 2-celled, the wall and septum thick, the ovules numerous, attached to the septum. Fruits not seen.
