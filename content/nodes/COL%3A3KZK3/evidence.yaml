    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Suffrutex about 60 cm tall, with slender, terete, woody stem; branches terete, densely stellate-pubescent. Stipules small, about 1-3 mm long, stellate-pubescent. Leaves petiolate; blade elliptic-oblong to obovate-oblong, narrowing slightly to base, somewhat acuminate to apex or broad and rounded or subtruncate at apex, sometimes toothed in upper portion, stellate-pubescent on both surfaces, sometimes glabrescent at least in part on upper surface; petiole 2-6 mm long, stellate-pubescent. Inflorescence of 1-flowered cymes, solitary in axils of leaves; peduncle 7-14 mm long, usually persistent, stellate-pubescent, minutely bi-bracteate at apex; pedicels 2-6 mm long, pubescent with stellate or tufted hairs. Calyx about 6.5 mm long, lobed to about 1.5 mm from base, densely stellate-pubescent on outside. Petals pink to reddish, about 4 mm long, rounded at top and narrowing into a claw in lower half, blade with margins not inrolled, claw with margins inrolled and the two lobes at apex somewhat thickened. Stamens about 7 mm long; filaments hyaline, obovate, broadly acuminate at apex into the connective, bearing a few ± obscure hairs on shoulders; anthers acuminate to an acute apex, brown-pubescent along margins besides bearing a few, scattered, patent hairs, overlapping filaments at base. Ovary very shortly stipitate at the base, stellate-pubescent, without horns; styles about 9 mm long, thread-like, cohering in a straight, erect column. Capsule densely stellate-pubescent with a pair of short, blunt horns at apices of sutures.
            sourceIds:
