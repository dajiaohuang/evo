            locator: "SANBI/WFO archive Morphology row 74074; source 815.0; publication: Verdoorn, IC. 1980. Revision of Hermannia subgenus Hermannia in southern Africa. Bothalia 13(1&2): 1 - 63. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Characterized by the fairly rough stellate pubescence without obvious gland-tipped hairs, the small petals with thickened lobes at the apex of the claw, and the short blunt horns on the capsule which is stellate- pubescent. It is close to H. boraginiflora from which it differs mainly in the absence of obvious gland-tipped hairs.
