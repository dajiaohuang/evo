    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Perennial herb, geophyte, 0.15-0.40 m high; corm globose, tunics of coriaceous to almost woody layers; stem erect, slender and wiry, flexed outward. Leaves 2, basal prominent, ± 2 mm wide; sheath ribbed, slightly villous; non-flowering plants with single linear leaf, midribs and margins hyaline. Bracts grey-purple, apex brownish dry. Inflorescence a 2-5-flowered spike, inclined, lightly flexuose; flowers pale pink; throat with narrow, paired, red lines; perianth tube funnel-shaped; tepals lanceolate, equal, flared. Stamens unilateral, arcuate, exserted; anthers pale pink; pollen creamy yellow. Ovary ovoid; style arching over stamens, branches recurving, expanded in upper half. Flowering time Sept.-Jan.
            textZh: Gladiolus parvulus Schltr. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_18505_0
            locator: "SANBI/WFO archive Morphology row 90766; source identifier 18505.0; cited publication: Bredenkamp, CL; Magwaza, ZL. 2019. Iridaceae. In: CL Bredenkamp (ed.), A Flora of the Eastern Cape Province, Strelitzia 41(3): 1821 - 1882. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: A dwarf species with wiry stems and reduced foliage, the lowermost leaf sheathing the lower half of the stem with a villous, often slightly inflated sheath and vestigial blade, and the upper leaf reduced to a minute scale inserted just below the spike. The flowers are pale pink with a sub-actinomorphic perianth and short tube 5-7 mm long. Similar Gladiolus pubiger is a taller plant with two or three leaves, the upper not inserted immediately below the spike, and larger flowers with attenuate tepals and slightly longer tube, 7-8 mm long.
            textZh: SANBI 条目提供了 Gladiolus parvulus Schltr. 的鉴别特征。
