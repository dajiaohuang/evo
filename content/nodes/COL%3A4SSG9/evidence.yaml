        usage:
          title: Rhynchosia calycosa Hemsl., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Herbaceous to suffruticose vine; stems weakly angled to terete, strigose to puberulous. Leaves trifoliolate; leaflets ovate to deltoid or ovate rhomboid, 2.5- 7.0(-9.0) cm long, 1.5-5.5 cm wide, apically acute, basally cuneate to obtuse, strigose above, villous and gland dotted beneath; terminal petiolule 1.5-2.0 cm long, the lateral petiolules 0.2-0.3 cm long; petiole 2.5-4.2 cm long, villous; stipels subulate, 1.0-2.0 mm long, the stipules linear to lanceolate, 1.5-3.0 mm long, caducous. Inflorescence exceeding the leaves, 7.0-20.0 cm long; peduncles 1.0- 6.5 cm long; pedicels 1.0-2.0 mm long; bracts lanceolate, 3.0-4.0 cm long, ca- ducous. Flowers with the calyx equalling or exceeding the corolla, 7.0-11.0 mm long, the lobes 7.0-9.0 mm long, ca. 2.0 mm wide, upper lobes united halfway up; corolla yellow, 6.0-10.0 mm long, the standard obovate, auriculate, 7.0-10.0 mm long, 3.0-5.0 mm wide, the claw ca. 1.0 mm long, the wing oblong, 6.0-8.0 mm long, ca. 2.0 mm wide, the claw ca. 2.0 mm long, the keel falcate, 6.5-7.5 mm long, 1.5-2.0 mm wide, the claw ca. 1.5 mm long; stamens ca. 7.0 mm long, vexillary stamen free. Fruits ovate to oblong, 1.5-2.5 cm long, 0.5-0.8 cm wide, puberulous to strigose, gland dotted, the beak ca. 2.0 mm long; seeds 2, subor- biculate, ca. 3.5 mm long, 3.0 mm wide, black brown mottled, hilum ovate, 1.0- 1.5 mm long.
