          originalSourceText: (rarely all) their pubescence with age; corolla 6-11 mm long, the tube usually comprising 1/2-%3 the total length, the lobes oblong to ovate, 1.5-3 mm broad, entire or erose or dentate at the apex, lacking dorsal appendages; staminodes petaloid, rather narrowly ovate-lanceolate, 3-4.5 mm long, erose; stamens 2/3-3/4 as long as the staminodes; ovary densely sericeous, the style 4.5-8 mm long, glabrous except at the base, the apex often irregularly toothed or lobed. Fruit brown, mealy- roughened, ellipsoid or ovoid or subglobose, to 10 cm in diam; seeds brown, com- pressed, 16-24 mm long, the linear scar extending from near the base to beyond the middle.
