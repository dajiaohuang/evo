    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Erect shrubby herb to 70 cm tall; branches rounded, with 4 longitudinal furrows and numerous fine longitudinal ribs, not swollen at nodes; young branches pubescent to densely so (sometimes only in 2 bands). Leaves sparsely pubescent, mainly on veins; petiole 0.5-3.3 cm long, pubescent; lamina ovate to elliptic, largest 3-9.2 x 1.5-3.8 cm; apex subacute to rounded; base cuneate to truncate. Spikes solitary or also from upper leaf-pair, 2-10 cm long; peduncle up to 7 mm long; axes puberulous to pubescent and with scattered subsessile capitate glands. Bracts persistent, green or tinged purplish, elliptic to obovate, subacute to rounded, apiculate; lower 10-15 x 3-7 mm; upper puberulous and with scattered to dense subsessile to stalked capitate glands, ciliate. Flowers solitary; bracteoles 3-5 mm long. Calyx 4-6.5 mm long, puberulous, without (rarely with) subsessile capitate glands. Corolla white to mauve or pale blue; tube 8-13 mm long; lobes in lower lip 5-8 mm long, middle ± 2 mm wide; upper lip lanceolate, 2-3 mm wide at base and 1-2 mm apically; filaments 3-4 mm long; anthers 1.5-2 mm long. Capsule 3-seeded, 12-13 mm long, uniformly puberulous or sparsely so; seed ± 5 x 4 mm, tuberculate and with scattered long non-glandular hairs, rim slightly jagged near tip and near base.
            sourceIds:
              - sanbi_6771_0
            locator: "SANBI/WFO archive Morphology row 46782; source 6771.0; publication: Vollesen, KB. 1989. A revision of Megalochlamys and Ecbolium (Acanthaceae: Justicieae). Kew Bull. 44(4): 601 - 680. [All rights reserved]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: It is the only species which has a rounded stem with 4 longitudinal furrows and longitudinal ribs. The capsule is also consistently 3-seeded (one locule always developing both ovules into seeds). In relation to the rest of Ecbolium, E. flanaganii also has a rather isolated distribution only occurring in a small area around Grahamstown in South Africa.
