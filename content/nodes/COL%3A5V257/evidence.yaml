          - text: Four varieties have been recognised in West Africa; var. polycladus is said to be the variety occurring elsewhere in Africa. Although the FSA material agrees in hairiness of margins of both internode and pedicel, the presence or absence of hairs on both the pedicelled and sessile spikelets are variable. Therefore, until more work has been done the varieties are not accepted.
