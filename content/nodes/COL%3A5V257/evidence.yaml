    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Robust, tufted perennial 1 200-3600 mm high; glabrous, glaucous; basal sheaths not keeled; leaves usually cauline; culms branched above. Leaf blade to 600 x 5-20 mm, base narrow, petiole-like, reduced to midrib; ligule a fringed membrane, back without long hairs. Inflorescence of 2 racemes per spatheole; pedicel and internode ± clavate, inflated, apex lobed, both margins hairy, hairs to ±4 mm long; callus hairs protruding at internode apex. Sessile spikelet 6.0-7.5(8.5) mm long; glumes lack pits between nerves; lower glume broad, flat but with a narrow shallow to deep central groove, wingless, apex not toothed, awnless, scabrid towards apex, glabrous, shortly hairy or long hairy on margins, keels scabrid; upper glume convex, mucronate; upper lemma deeply bilobed, awn 10-32 mm long, geniculate; callus short, broad, obtuse; anthers 2.2-5.0 mm long. Pedicellate spikelet 5-8 mm long; lower glume glabrous or hairy; mucronate or awned, awn up to 4.5 mm long, appears ribbed due to many nerves equidistant from each other on back.
            textZh: Andropogon gayanus Kunth 的 SANBI 物种条目记录了形态特征。
