        usage:
          title: Utricularia praetermissa P.Taylor, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Perennial epiphytic herbs; stolons branched, filiform, radiating from the base of the inflorescence, several swollen at or near the point of origin to form ellip- soid tubers 1-2 cm long. Photosynthetic organs 2-4 from the inflorescence base, leaflike, 8-15 cm long; lamina coriaceous, multinerved, the nerves drying promi- nent on both surfaces, narrowly elliptic, the apex acute or acuminate; pseudo- petiole usually as long as or longer than the lamina. Traps borne on filiform stolon-branches, ovoid, stalked, ca. 1 mm long, the mouth basal, the upper lip with 2 subulate recurved appendages. Inflorescences to 30 cm long; peduncle 1.5-2 mm thick, 1-3-flowered; bracts linear-lanceolate, acute or acuminate, straight, 5-7 mm long, the bracteoles similar but narrower and sometimes shorter, the sterile scales on the peduncle usually ca. 4, similar to the bracts but usually smaller; pedicels erect, 2-4 times as long as bract. Flowers with the calyx lobes Utricularia praetermissa P. Taylor, sp. nov. Species affinis U. unifolia Ruiz & Pavon sed bracteis multo brevioribus et corolla calcari longiore apice deflexo satis differt. subequal, ovate, ? obtusely acuminate, 2.5-3 cm long, 1.2-1.5 cm wide; corolla white or mauve with a yellow palate, 4-5 cm long, glabrous or with a few stipitate glands, the upper lip broadly ovate to orbicular, a little shorter and wider than the upper calyx lobe, the lower lip much larger, transversely elliptic or almost orbicular, to 5 cm wide, apically retuse, the palate gibbous, prominent, the spur narrowly cylindrical, about as long as lower lip, curved upwards, abruptly terminating in an acute subulate deflexed apex. Capsules + globose, ca. 1 cm long; seeds numerous, narrowly cylindrical-fusiform, ca. 0.8 mm long.
          originalLanguage: en
