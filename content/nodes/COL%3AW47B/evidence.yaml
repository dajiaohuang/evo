        usage:
          title: Clerodendrum thomsoniae Balf., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: High-climbing herbaceous or woody vine to 7 m long, more rarely a low shrub, 2-2.5 m tall; branchlets grayish, obtusely tetragonal, slender glabrate; twigs purplish or brown, densely puberulent; leaf-scars often large and circular, borne on prominent corky sterigmata, not spinescent. Leaves opposite; thin-chartaceous or membranous, often drying dark, entire, elliptic or elliptic-ovate, 6-14.5 cm long and 317 cm wide, apically short-acuminate, basally rounded or subacute, dark- green above, lighter beneath, glabrate on both surfaces or slightly pulverulent along the larger veins; petioles 0.8-3.5 cm long, minutely purplish-puberulent. Inflorescences axillary, cymose, abundant near the apices of the twigs; cymes solitary, opposite, spreading, 5-9 cm long and 4-8.5 cm wide, loosely flowered; peduncles slender, 2.6-6.5 cm long, densely puberulent; pedicels slender, 7-16 mm long, puberulent; foliaceous bracts none; bractlets and prophylls linear, 2-11 mm long to 1 mm wide or subulate, puberulent. Flovers with the calyx pale yellowish- green changing to cream-color and then pure white, fading to yellow or pink, more or less pentagonal during anthesis, 1.8-2 cm long, puberulent, deeply 4-fid, the lobes broadly ovate, 8-10 mm wide, apically acute or short-acuminate; corolla hypocrateriform, dark-red to scarlet or crimson, the tube slender, ca. 2.5 cm long, the lobes wide-spreading or reflexed, 6-10 mm long and 3.5-4 mm wide. Fruit drupaceous, glossy-black with a brilliant red aril uniting the 4 pyrenes; fruiting calyx fading to rose-color.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 17146
