        claims:
          - text: "Annual herb, up to 0.15-0.60 m high. Stems decumbent to ascending, much branched, shortly pilose to glabrous, leafy. Leaves with blade ovate or ovate-lanceolate, 12-32 x 2.5-17.0 mm apex obtuse, base rounded, denticulate; petioles 10-13 mm long. Flowers: few to many in corymbose, oblong, or semi-umbellate racemes, 50-155 mm long, shortly pilose; pedicels up to 30 mm long; spur cylindrical, straight or curved forward, 6-8 mm long; corolla unequally 4-lobed, upper lobes 6-10 mm long, oblong, apex rounded, lower lip 6.0-8.5 mm long, rounded, emarginated, palate papillate or with small hairs, lilac-blue, purple or white; Jul., Aug. Fruit an oblong capsule, up to 10 x 8 mm, hardly narrowed near apex."
            sourceIds:
