        usage:
          title: Stevia triflora DC., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Sparingly branched rhizomatous perennial herbs; stems mostly brownish, never purple, terete, slightly striate, densely puberulous. Leaves opposite; blades ovate to narrowly ovate, 4-8 cm long and 2-5 cm wide, the base cuneate and decurrent onto petiole, the margins slightly to closely serrate or serrulate, the apex acute, the surfaces glandular punctate, the upper surface puberulous, the lower surface puberulous to tomentose on veins and areoles, the veins distinctly trinervate from near base; petioles usually 0.5 cm long, winged and sometimes distally indistinct from lamina. Inflorescence flat-topped, densely corymbose, the primary branches opposite, usually spreading at less than 450, branches densely puberulous to subtomentose, the ultimate branches 0-2 mm long. Heads ca. 6-7 mm high; involucral bracts narrowly oblong-lanceolate, 4.5-5.5 mm long and 0.7 mm wide, slightly striate, minutely glandular-punctate, scarcely scarious on margins; corolla white, ca. 4.5 mm long, glandular punctate with few short hairs on tubes and lobes, the lobes equal, ca. 1.2 mm long. Achenes 2.5-3.0 mm long, sparsely hispid; pappus a fimbrillate to subentire crown of united scales ca. 0.3 mm long, without awns.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 1597
