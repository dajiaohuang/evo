        usage:
          title: Ficus tonduzii Standl., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Large buttressed trees to about 15 m. tall. Twigs 4-7 mm. in diameter, glabrous, the epidermis frequently exfoliating, with a thick greyish brown peri- derm. Stipules 25-60 mm. long, narrowly deltoid, glabrous. Lamina 6-15 cm. wide X 12-30 cm. long, broadly ovate, elliptic or obovate; apex rounded acute, acute or very shortly and bluntly acuminate; base rounded or rounded cuneate; lateral veins sometimes very broad and conspicuous, 9-15 pairs, departing from the midrib at an angle of 100 or less; intercostals conspicuous, but not much raised; basal veins departing from the midrib at an angle of 150-300, continuous with the very conspicuous submarginal vein. Petiole 20-80 mm. long, 4-5 mm. thick, 1/2-1/6 the length of the lamina. Figs 20-35 mm. in diameter, globose, glabrous or minutely scabrid, borne among the leaves; color not noted; peduncle obsolete to 10 mm. long, sometimes with a stalk above the bracts to 5 mm. long; basal bracts 2-3 mm. long, very broadly deltoid; ostiole about 2 mm. in diameter, plane with the surface of the receptacle, or produced in a beak 5-10 mm. high.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 8079
