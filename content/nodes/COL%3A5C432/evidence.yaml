          - text: This small-flowered and rather inconspicuous species is characterized by the creamy to greenish white perianth with more or less erect segments. They have usually purple marks close to the pocket-shaped nectary, and the anthers are always small and yellow. The leaves are narrowly elongate and normally straight, and the solitary basal leaf has inrolled flat margins, which are finely scabrid with little protuberances.
