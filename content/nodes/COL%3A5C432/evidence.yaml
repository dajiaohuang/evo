    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Corm subglobose, 0.5-1.2 cm long and wide, with light to dark brown tunics produced into a thin and loose, easily disintegrating, submembranous short neck up to 4 cm long. Stem above ground 3-20 cm high, usually slender, 0-6-2 mm thick. Basal sheath membranous, apically usually truncate, shortly cuspidate or mucronate, not much dilated, few-veined. Solitary basal leaf narrowly linear, 5-28 cm long, 1-4.5 mm wide, usually erect and rather straight, sometimes flexuous, flat with inrolled scabrid margins, adaxially midveined and with faint parallel veins. Cauline leaves 2(or occasionally 1), usually erect and ± straight; lower leaf inserted about themiddle of the stem or somewhat below, 2-15 cm long, long-acuminate and seemingly subterete with inrolled margins above the broader spathaceous basal portion; upper cauline leaf inserted 0.5-4 cm below the spike, 0.-7(-10) cm long, short- or long-acuminate from the broader portion above the vaginate base. Spike 1-7-flowered, with 3-10 mm distance between the flowers. Perianth 4.5-6.5 mm long, cup-shaped-campanulate with suberect segments, greenish white to cream-coloured; perianth tube 1.5-2.5 mm long; free segments narrowly ovate-oblong-oblong-lanceolate, 3-4.5 mm long, 0.8-1.5 mm wide, slightly narrowed basally, 3-5-veined or without distinct veins, often minutely dotted all over (except nectary) with numerous rounded-oblong orange-brown (when dry) dots. Nectary a reniform or horseshoe-shaped pocket at the base of the free segment, its margin somewhat elevated and minutely papillate, bordering a double or bilobed mauve to purple (sometimes faint or absent) blotch below the middle of the segment. Filaments 1.5-2 mm long, pale. Anthers rounded-oblong, 0.5-0.7(-0.8) mm long, 0.3-0.5(-0.7) mm wide, bright yellow. Pistil oblong-elliptic, 4-6 mm long, angled, green to brown except for the light style tips; free styles conical- subulate, 1-2 mm long, apically recurved and with an adaxial elongate stigma c. 0.5 mm long.
