          originalSourceText: long, acute; corolla yellow, the tube compressed cylindrical, ca. 2 mm long, usually wider than long, petaloid, glabrous, the lobes 4, imbricate, oblong, 3.5- 5.0 mm long, ca. 4 mm wide, longer than the corolla tube, venose, glabrous within except granulose puberulent in the middle; stamens ?4, the anthers oblong, 3.0- 4.2 mm long, ca. 0.6 mm wide, basally bilobed, the filaments to 3 mm long, attached at the apex of the tube; ovarian disc platelike, the stigmas 2, clavate or rotund, ca. 1.3 mm long, the style slender, to 7 mm long, the ovary oblong, the wall thin, the ovules numerous on intrusive placentas. Fruits turbinate, 0.4-0.5 cm long, ca. 0.35 cm wide at apex, truncate, the calycine cup thickened and persistent as a rim, smooth, glabrous, 8-costate, the lateral split not extending below the terminal ringlike rim.
