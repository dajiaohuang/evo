          title: Deppea grandiflora Schltdl., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Trees 3-8 m tall, the branchlets terete, smooth, glabrous to puberulent. Leaves oblong, oblong rotund or oval, 6-17 cm long, 2.0-6.5 cm wide, deltoid at the apex, acuminate, the acumen to 1.5 cm long, acute, cuneate to acute at the base, the costa plane above, prominulous beneath, the lateral veins 8-12, arcuate, prominulous above and beneath, chartaceous, scarcely bicolorous, glabrous above except on veins, appressed villose on the veins beneath, the hairs often tufted in the vein axils; petioles to 4.5 cm long, to 0.2 cm wide, wiry, often arcuate and deflexed, densely pubescent; stipules deciduous, minute, broadly deltoid and glanduliferous (fide Standley). Inflorescences terminal or pseudo ter- minal, occasionally longer than the uppermost leaves, paniculate, the peduncles 3-4 cm long, villosulose, terminated by 3 primary branches, these to 2.5 cm long, strongly ascending, in turn branching, ultimately producing cymes. Flowers with the hypanthium oblong or turbinate, 1.6-2.0 mm long, ribbed, sparsely villose, the calyx cup scarcely measurable, the teeth reduced to 5 points, 0.2-0.6 mm
