  claims:
    - subjectId: taxon:hemichordata
      claimKind: scientific
      claimType: fossil-range
      statement: The 516–0 Ma Hemichordata route is anchored by the approximately 516 Ma Yunotubus pterobranch sample and living Rhabdopleura observations; it is a represented-lineage span, not the phylum’s origin or a global hemichordate FAD.
      confidence: medium
      confidenceRationale: Fossil morphology, locality and phylogenetic scoring are explicit for Yunotubus, and living feeding anatomy is directly observed in Rhabdopleura. The two samples support endpoints but not uninterrupted occupancy or a phylum-wide first appearance.
      referenceLinks:
        - referenceId: yang-2025-yunotubus
          relation: supports
          pages: 144:69
          figure: Figures 1–5
          quoteLocator: Geological setting; Systematic palaeontology; phylogenetic analyses
        - referenceId: halanych-1993-rhabdopleura-feeding
          relation: supports
          pages: 417–427
          figure: Figures 1–5
          quoteLocator: Video and electron-microscopy observations of living Rhabdopleura normani
  claim-rationales.zh:
    - Yunotubus 的化石形态、产地与系统评分均有明确记录，Rhabdopleura 的现生摄食解剖也来自直接观察；二者能约束路线端点，却不能证明连续占据或门级全球首现。
  claim-statements.zh:
    - 516–0 Ma 的半索动物路线由约 516 Ma 的 Yunotubus 羽鳃类样本和现生 Rhabdopleura 观察共同锚定；它是所代表谱系的证据跨度，不是该门起源或全球首现。
