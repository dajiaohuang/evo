    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Green or glaucous, in loose patches. Stems many, prostrate, herbaceous 10-20 cm long. Leaves alternate, all along the stem, crowded in the upper part with some in a terminal tuft. Leaves 3-6 mm long 1-1.5 mm wide, obovate, obtuse but abruptly mucronate or apiculate, much narrowed to the base and almost petiolate, the margins pale-coloured. Inflorescence very slender, sprawling, unbranched, 2-6 cm long, with 2-5 nodes each with few, 2-3, flowers. Bracts like leaves but narrower and more acute; stipules half as long as the bracts, narrow, acuminate. Pedicels 2 mm long. Perianth 1 mm long, the segments obtuse, incurved, green with a broad membranous margin, the midrib obtusely bulging. Stamens short, attached outside a cup-like disc. Ovary depressed; style short, 3-fid at the tip.
            sourceIds:
