        usage:
          title: Palicourea lasiorrhachis Oerst., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrubs to 3 m tall, the branchlets terete, smooth, glabrous, ultimately pilose or villosulose, contorted, angular, the pith porate. Leaves elliptic oblong to ovate oblong, 6.5-16.0 cm long, 2-6 cm wide, the costa prominulous above, prominent beneath, the lateral veins ca. 16, arcuate, with 1-2 subparallel irregular veins, evanescent toward the margin, the intervenal areas spreading reticulate, stiffly chartaceous, glabrous above, villosulose on the costa and the veins beneath; petioles to 2 cm long, to 0.1 cm wide, the stipules connate, the sheath 3-5 mm long, truncate, scarious, glabrous or with a few stiffly subulate, deciduous hairs, each part with 2 subulate awns, ca. 3 mm long. Inflorescences terminal, solitary, thrysiform paniculate, to 14 cm long, to 7 cm wide; peduncle 4-8 cm long, ca. 0.8 cm wide, webby pubescent, the hairs of varying lengths, the branches well spaced, to 3.5 cm long; bracts and bracteoles subulate. Flowers pedicellate; hy- panthium rotund to oblong, 0.3-0.8 mm long, glabrate to puberulent, granulose, the calycine cup scarcely measurable, eglandular within but with occasional sub- ulate glands at the sinuses, the lobes 5, triangular or rotund, 0.5-0.7 mm long, densely villosulose to glabrate; corolla green to yellow, the tube slender, 7-10 mm long, glabrous outside except occasionally granulose and pubescent toward the apex, densely villose within 2-3 mm above base; anthers 5, narrowly oblong, subsessile; style slender, to 4.5 mm long, the stigmas digitiform, ca. 2 mm long. Fruits not seen.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 11880
          archiveSourceId: 2B978532-9974-4419-971E-0F260FCE32B5
