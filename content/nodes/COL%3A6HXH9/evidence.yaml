          title: Ficus dendrocida Kunth, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Large spreading trees, to 30 m. tall, frequently with many air roots. Twigs 2-3 mm. in diameter, pubescent, developing a rather thick dark brown periderm. Stipules 5-8 mm. long, narrowly deltoid, appressed pubescent. Lamina 2.5-5 cm. wide X 5-8.5 cm. long, elliptic or slightly obovate, scabrid above, pubescent beneath; apex acute; base rounded; lateral veins 5-8 (-12) pairs, departing from the midrib at an angle from 300-400; basal veins departing from the midrib at an angle 3 0 -500; intercostals somewhat raised. Petiole 6-15 mm. long, 1/61/ 0 the length of the lamina. Figs 5-6 mm. in diameter, globose, pubescent or glabrescent, borne among the leaves; color not noted; peduncle obsolete; basal bracts 1-2 mm. long, connate, semicircular, pubescent; ostiole 1-2 mm. in diameter, flat.
