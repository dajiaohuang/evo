    facets:
      morphology:
        status: partially-supported
        claims:
          - text: "Perennial herb, geophyte, 0.3-0.5 m high; corm tunics of brown fibres; stem erect, simple or with 1 or 2 branches. Leaf 1, linear, canaliculate, usually dry and broken distally. Spathes herbaceous, apex dry, brown. Inflorescence with white to cream-coloured flowers; nectar guides yellow, with dark spots at edges; tepals unequal, outer 30-35 mm long, spreading horizontally, claw strongly ascending, inner 5-7 mm long, cusp-like, sometimes 3-lobed apically, acute. Stamens: filaments 7-8 mm long, united in cylindric column, free apically for ± 0.5 mm; anthers 5-6 mm long; pollen white. Ovary ± cylindric, ± 10 mm long; style branches up to 7 mm long; crests slender, up to 8 mm long. Flowering time Dec.-Mar."
            textZh: Moraea albicuspa Goldblatt 的 SANBI 物种条目记载了植株、叶片和花部形态。
            sourceIds:
              - sanbi_18505_0
            locator: Strelitzia 41(3); archive Morphology row 91021, source 18505.0
            placeTimeScope: Regional species account published 2019; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
          - text: Readily distinguished by its relatively large white to pale yellow flowers, the outer tepals with narrow, deep yellow nectar guides, and the much reduced inner tepals, hair-like cusps just 5-7 mm long, usually entire, or obscurely 3-lobed at the apex. One of the taller species of eastern southern African species of sect. Vieusseuxia, it stands up to 600 mm high.
