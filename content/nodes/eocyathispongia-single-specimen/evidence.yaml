  claims:
    - subjectId: event:eocyathispongia-single-specimen
      claimKind: scientific
      claimType: morphology
      statement: One phosphatized Eocyathispongia specimen preserves a millimetre-scale, multicellular, three-tube body with funnel and osculum-like openings interpreted as sponge-grade anatomy.
      confidence: medium
      confidenceRationale: Cellular geometry is directly imaged by SEM and tomography, but poriferan affinity rests on one specimen without spicules or an independently replicated canal system.
      referenceLinks:
        - referenceId: yin-2015-eocyathispongia
          relation: supports
          pages: E1453–E1460
          figure: Figures 1–4; Supplementary Movies
          quoteLocator: Holotype microtomography, cellular organization and explicit single-specimen caveat
  claim-rationales.zh:
    - 细胞几何由扫描电镜和断层成像直接记录，但海绵归属基于单件无骨针标本，水沟系统也未独立重复发现。
  claim-statements.zh:
    - 唯一一件磷酸盐化的 Eocyathispongia 标本保存了毫米尺度、多细胞、由三条管组成的躯体，并具漏斗状和类似出水孔的开口，被解释为海绵级构造。
