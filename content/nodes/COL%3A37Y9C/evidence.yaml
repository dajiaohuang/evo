    facets:
      morphology:
        status: partially-supported
        claims:
          - text: "A shrub or small tree up to 8 m high. Bark more or less smooth or finely longitudinally fissured, grey; twigs greyish or yellowish-grey. Young shoots and petioles evenly to sparingly yellowish-pubescent or puberulous at first, later glabrescent. Buds perulate (furnished with protective scales); perulae up to 5 mm long, broadly ovate, subscarious, closely longitudinally striate, ciliolate, persistent. Stipules up to 7 mm long, linear-lanceolate, faintly striate, sparingly fimbriate, glabrous, soon falling. Petioles 2-4 mm long. Leaf blades 3-11 x 1-4 cm, obliquely lanceolate to oblong-lanceolate, acuminate, rounded to cordate at the base, spinulose-serrate on the margins, the teeth tipped with subulate glands, thinly coriaceous, quite glabrous when mature, bright green and somewhat shiny above, dull green below, usually drying pale green; lateral nerves in 7-13 pairs, 3-4 of which are crowded at the base, usually somewhat irregularly looped well within the margin, tertiary nerves reticulate, not prominent above, fairly prominent beneath. Flowers axillary, solitary. Male flowers: pedicels 3-5 mm long, pubescent; sepals 4, 3 x 2.5-3 mm, suborbicular, pubescent and puberulous without and within, greenish; stamens 15, in 2 whorls, 2.5 mm long, anthers 1 mm long; disk 2.5 mm in diameter, margin strongly crisped-convolute, the lobes enveloping the filaments, pubescent, smooth, with 1-2 minute central conical projections. Female flowers: pedicels 0.3-1.2 cm long, sparingly pubescent; calyx lobes 4-5, reflexed then inflexed, 4 x 3 mm, accrescent to up to 7 x 5.5 mm in fruit, suborbicular-ovate, closely longitudinally striate, ciliate; disk 3 mm in diameter, accrescent to 5 mm in fruit, annular, thick, tomentose; ovary 4 x 4 mm, 2-locular, 2-lobed to subglobose, densely fulvous-tomentose; styles 2, united at the base, divaricate, 2 mm long, tubular, tomentose, persistent; stigmas 2.5 mm broad, broadly rhombic to reniform, glabrous, papillose. Fruit 1.5-1.7(2) x 1.7-2(2.5) x 0.7-1 cm, 2-lobed to subglobose, slightly laterally compressed, evenly pubescent and sparingly hirsute, bright orange-red to yellow-orange when mature; endocarp firmly corky. Seeds 1-2 per fruit, 10 x 9 x 8 mm, ellipsoid-subglobose, brownish."
