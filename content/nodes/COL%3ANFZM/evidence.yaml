          - text: The author observed that the plants flowered in March, and that it was the first scented Brunsvigia which had come under her notice. She also pointed out that the rather densely-flowered umbel of about 20 flowers had about 15 open at one time. The perianth is recorded as shell pink, with veining in a darker shade and the lower lobes diverge leaving the intermediate space entirely free for the declinate stamens and style as often ocurs in Nerine. The long filaments exserted from the perianth seem of diagnostic value.
            textZh: SANBI 条目提供了 Brunsvigia bosmaniae F.M.Leight. 的鉴别特征。
