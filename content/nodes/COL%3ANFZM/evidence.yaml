      morphology:
        status: partially-supported
        claims:
          - text: Bulbous geophyte to 20 cm. Leaves 5 or 6, dry at flowering, prostrate, oblong, margin red. Flowers ± 20, in a large roundish head, tepals broadly oblong, pink with darker veins, outer stamens ± half as long as inner, scented. Capsules sharply 3-angled, heavily ribbed.
