        claims:
          - text: Twiggy, minute-leaved shrub to 1 m, with numerous spur shoots. Leaves scale-like, closely imbricate and adpressed. Flower heads radiate, solitary at branch tips, yellow with white to pink rays.
            sourceIds:
              - sanbi_14200_0
            locator: "SANBI/WFO archive Morphology row 11386; source 14200.0; publication: Manning, JC; Goldblatt, P. 2012. Asteraceae: Phymaspermum Less. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 410 - 410. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Phymaspermum appressum is easily recognised by the prominently appressed leaves, entirely scarious involucral bracts and purplish ray florets. It can only be confused with the closely related P. oppositifolium, from which it differs in the alternate leaves, the hemispherical to cyathiform involucres, and the ovate to obovate involucral bracts.
