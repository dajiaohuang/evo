        usage:
          title: Malpighia albiflora (Cuatrec.) Cuatrec., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Erect shrub 1-2 m tall or tree to 8 m tall., young branches green or sometimes reddish, strigillose. Leaves membranaceous to subchartaceous, elliptic to elliptic- lanceolate, acuminate at apex, acute at base, (2.5-)4.5-9(-1 1) cm long, (2-)2.5- 3.5(-4.5) cm wide, upon drying appearing somewhat crinkled or puckered above; petioles slender or somewhat swollen, somewhat strigillose like the young branch- es or glabrous, 1.5-2.5(-4) mm long; stipules free, reddish, strigillose or glabrous, linear-lanceolate-, (1-)1.5(-2) mm long. Inflorescence erect, green, rarely reddish, pedunculate, 4-6-flowered umbel-like panicle (1.5-)2-3(-3.5) cm long, the com- mon peduncle minutely strigillose, 3-12(-18) mm long; flowering peduncles usu- ally glabrous, (2-)4-6(-8) mm long, bracts ca. 1.5 mm long; bracteoles ca. 1 mm long, pedicels glabrous, (7-)8-11(-12) mm long, about 2 times as long as the flowering peduncles, small T-shaped bristles at the tip, forming a collar below the sepals. Flowers ca. 1.5 cm diam.; buds 3.5-4 mm diam., unkeeled; sepals strigil- lose, glands 6, 1.5-2.5(-3) mm long, 2/33/4 as long as the sepals, posterior glands usually larger than the others; posterior petal ca. 9 mm long, lateral petals ca. 8 mm long, anterior petals ca. 6.5 mm long; androecium zygomorphic; filaments ca. 2-3 mm long, lateral filaments obviously longer and thicker than the others, curved inwards over the styles at anthesis, lateral anthers oblong, ca. 1.5 mm long, larger than the others; pollination gap ca. 1 mm long; gynoecium zygomor- phic; styles slightly uncinate at apex, lateral styles ca. 2 mm long, obviously longer and thicker than the anterior, curved inwards at anthesis, anterior style straight, thin; ovary obviously 3-lobed, carpels free at upper half. Fruit 1.5-2 cm long; carpels usually free from each other for most of their length; pyrenes oblong, (12-)15(-18) mm long, (7-)8-10(-12) mm wide, prominently winged; lateral and dorsal wings entire, sharp, (2-)3-5 mm wide, dorsal wing more prolonged at the apex than the lateral ones and free from them, all wings rounded at apex; inter- mediate wings present, short, thick tuberculate.
