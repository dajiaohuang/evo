    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants 600-1100 mm high. Corm globose to conic, 8-12 mm diam., with slender stolons with scattered scales; tunics of fine to medium fibres. Stem erect, flexed outward above sheath of fourth leaf, simple or branched. Leaves usually 5 to 7, sometimes more, lower 3 or 4 basal, usually reaching to base of spike or exceeding it, linear, (1-)2-4 mm wide, rigid, main vein thickened and raised, margins sometimes lightly thickened, cauline leaves shorter, uppermost mostly sheathing. Spike inclined, lightly flexuose, 8- to 17-flowered; bracts pale grey-green flushed pinkish, dry and pale above, outer 18-19 mm long, inner shorter to ± as long, acute or shortly notched. Flowers white or cream-coloured to pale salmon-pink, tepals with narrow, dark red, longitudinal median streak, lower tepals sometimes yellow in centre of streak, unscented; perianth tube 25-35 mm long, cylindric below for 20-30 mm, curved and weakly flared in upper 5-6 mm, much exceeding bracts; tepals all narrowed below into claws and ± spade-shaped, attenuate with twisted and undulate tail-like tips, dorsal largest, inclined over stamens, spreading distally, 25-35 x 8-11 mm, upper laterals arching outward distally, 19-25 x 4.0-4.5 mm, lower 3 tepals joined to upper laterals for 2-3 mm and together for 3-4 mm, with small thickened knobs at sinuses, free parts 15-18 x 1.5 mm, narrowed below into channelled claws 3-4 mm long, abruptly flexed downward into a narrowly lanceolate limb. Filaments 11-12 mm long, exserted 6-8 mm from tube; anthers 5.0-6.5 mm long, dull grey-purple; pollen cream-coloured. Style arching over stamens, dividing opposite upper 1/2 of anthers, branches 1.5-2.0 mm long. Capsules ovoid to ellipsoid Seeds unknown.
            textZh: Gladiolus sekukuniensis P.J.D.Winter 的 SANBI 物种条目记录了形态特征。
