      morphology:
        status: partially-supported
        claims:
          - text: Closely leafy, aromatic shrublet sometimes to 1 m, with many stems from a woody caudex. Leaves opposite and decussate, sessile, spreading-erect, loosely imbricate, linear to lanceolate, recurving towards tip. Flowers paired and aggregated in small, flat-topped corymbs, white.
            sourceIds:
              - sanbi_14402_0
            locator: "SANBI/WFO archive Morphology row 11415; source 14402.0; publication: Manning, JC; Goldblatt, P. 2012. Rutaceae: Diosma L. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 718 - 719. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Diosma oppositifolia is a distinct species being a shrub usually low with many stems arising from a persistent rootstock; with leaves either elliptic-lanceolate obtuse with a small blunt callus or linear-lanceolate acute with the apex recurved with a small sharp mucro, complicate when dry, spreading-erect, normally opposite; with flowers sessile aggregated up to 8 in pairs, with no staminodes; with anthers bearing a sessile apical gland and with seeds shining, relatively large. Diosma dichotoma, the only other species of Diosma with opposite leaves and no staminodes, is distinguished by having much smaller leaves and the anther-gland sub-stipitate. From Diosma subulata, a tall species, single-stemmed at base, with leaves either opposite or alternate, D. oppositifolia is distinguished by its many stemmed habit and lower growth.
            textZh: SANBI 条目提供了该种的鉴别特征。
