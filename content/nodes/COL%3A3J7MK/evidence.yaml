    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Bulbous geophyte, 4-15 cm. Leaves 2, dry at flowering, spreading to suberect, narrowly strap-shaped, channelled, with wavy edges, speckled near base beneath. Flowers in a small, compact head, red (rarely pink), bracts 4 or 5, blunt, red (rarely pink), waxy.
            textZh: Haemanthus crispus Snijman 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13845_0
            locator: "SANBI/WFO archive Morphology row 8785; source identifier 13845.0; cited publication: Snijman, DA. 2012. Amaryllidaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 53 - 62. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: The bulb tunics are unequal, dying down to form horizontal layers. The leaves are narrowly lorate (7-33 mm wide), canaliculate towards the base with undulate margins ranging from the length of the leaf to near the base only. The inflorescences are usually short, red or rarely pink, with narrowly obconical umbels, surrounded by 4-6, erect, obtrullate spathe valves. The flowers have very short pedicels, usually less than 5 mm. The bulb morphology of H. crispus is somewhat unusual in the genus. Unlike the majority of species from the winter rainfall region, the bulb tunics die down horizontally to form an overlapping series of layers with parallel edges. The bulbs do not have the distichous, slanting arrangement of tunics, as is found in the majority of winter rainfall species, H. pubescens, H. coccineus, H. sanguineus and their close allies. The only other species which have bulbs similar to those of H. crispus are H. barkerae and H. tristis, from the western Karoo, with which it appears to form a closely related group.
            textZh: SANBI 条目提供了 Haemanthus crispus Snijman 的鉴别特征。
