        claims:
          - text: Cormous geophyte, 5-7 cm, tunics woody, concentric. Leaves linear. Flowers mostly 1 per spike, tiny, white, tepals spreading.
            textZh: Geissorhiza nana Klatt 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 6799; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: A dwarf species, Geissorhiza nana rarely reaches up to 80 mm high and has tiny creamy white flowers with a perianth tube 1.0-2.5 mm long and spreading tepals 3-6(-8) mm long. It is closely allied to and easily confused with G. bracteata, which has somewhat larger flowers with a perianth tube 2.5-5.0 mm long and tepals 8-12 mm long, rarely smaller. Geissorhiza setacea is very similar in general appearance to G. nana but is larger in all features, having flowers with a tube ± 6 mm long and tepals mostly 8-12 mm long.
            textZh: SANBI 条目提供了 Geissorhiza nana Klatt 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 94657; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
