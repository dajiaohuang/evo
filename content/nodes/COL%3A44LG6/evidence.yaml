    facets:
      morphology:
        status: partially-supported
        claims:
          - text: "A decumbent glabrous undershrub. Stems sharply angled, almost winged. Leaves 11.0-15.0 mm long, flat, sessile or nearly so, lanceolate, with a very narrow cartilaginous margin, mucronate, often with the mucro reflexed. Flowers 5.0-6.0 mm long, pink, solitary in the leaf axils. Pedicel about as long as the flower. Bracts about 1-0 mm long, broad, very obtuse, slightly hooded, shortly ciliate. Sepals oblong, all slightly concave, obtuse, ciliate in the upper half, the inner more than half as long as the side petals. Side petals linear, obtuse, very slightly narrowed near the middle, a little longer than the carina. The claw of the carina about as long as the limb: the crest large, the width about the same as the length of the carina, the upper and lower lobes similar. Ovary glabrous, shortly bilobed at the apex. The anterior style branch hispid. Fruit and seed unknown."
            sourceIds:
