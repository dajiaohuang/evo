        usage:
          title: Saurauia seibertii Standl., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Tree to 25 m, sparingly pubescent. Leaves with the blade elliptic to obovate, the apex acute to acuminate, the base obtuse, the margins serrulate, 9-21 cm long, 3-8 cm wide, chartaceous, the secondary veins 10-18 pairs, the tertiary veins im- mersed, scarcely more prominent than the lesser reticulation, scattered-tufted to glabrous between the sparingly tufted to glabrous veins above, scattered-clustered between the abundantly to scattered heterotrichous veins beneath; petioles 2-4 cm long, 1-2 mm in diam, flattened to canaliculate above. Inflorescence 26- to 52- flowered, rarely fewer, 13-28 cm long, 6-9 cm wide, the primary peduncle 6-15 cm long, the bracts linear to triangular, 2-8 mm long, sometimes foliaceous, to 50 mm long. Flowers 15-22 mm broad, the buds to 6-7 mm in diam, the pedicels 5-20 mm long; sepals 5, 4-6 mm long, 3-6 mm wide, the inner 2 medially densely hetero- trichous, laterally densely appressed-pubescent, the imbricate sepal densely heterotrichous on the exterior half, densely appressed-pubescent on the interior half, the outer 2 densely heterotrichous, all densely appressed-pubescent within; petals 5, white, oblong to obovate, 6-9 mm long, 3-8 mm wide, obtuse to incised at the apex; stamens 39, rarely ca 25, the filaments 2.0-2.5 mm long, the anthers 2.0-2.5 mm long; ovary 5-locular, globose, 5-sulcate, glabrous, the styles obsolete to 4 mm long, the stigmas simple to capitate. Berries to 8 mm in diam, globose, 5-sulcate, glabrous.
          originalLanguage: en
          sourceField: general
