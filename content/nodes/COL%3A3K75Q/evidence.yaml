    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Dwarf shrublet branching from the base, taproot woody, deeply penetrative, stems up to 200 mm long, nude at the base and rooting there, laxly branched above, thinly white-felted, leafy throughout. Leaves mostly 5-20 x 1.5-5 mm, diminishing upwards, spathulate-oblong to oblong, apex rounded, base narrowed, half-clasping, both surfaces thickly white woolly-felted. Heads homogamous, cylindric, ±5 x 3 mm several clustered in glomerules 10-15 mm across at the branch tips, surrounded by leaves. Involucre surrounded by 2-3 reduced leaves webbed together with wool, bracts in 3-4 series, soon caducous, subequal, equalling flowers, loosely imbricate, not radiating, pale straw-coloured to light golden-brown, obtuse, apiculate, translucent, tips opaque or subopaque. Receptacle nearly smooth. Flowers 11-17. Achenes 0.75 mm long, glabrous. Pappus bristles many, delicate, scabrid, equalling corolla, bases cohering lightly by patent cilia.
            sourceIds:
