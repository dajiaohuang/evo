          originalSourceText: Vines; stems often becoming suffrutescent, glabrous. Leaves cordate-ovate to subsagittate, 5-10 cm long, acuminate apically, rounded to acuminate on the basal lobes, mucronate, glabrous to sparsely pubescent along the veins. Flowers in 1-2-flowered cymes; sepals unequal, oblong or lanceolate-oblong, 6-8 mm long, obtuse apically, glabrous to slightly pubescent; corollas yellowish to green- ish, 5-6 cm long. Fruits ovoid, apiculate, to 10 mm in diameter; seeds comose with whitish trichomes.
