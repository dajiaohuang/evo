        claims:
          - text: Plants 200-800 mm tall; leaves cauline, imbricate, lanceolate, acute, up to 150 mm long, grading into the floral bracts. Inflorescences dense, numerous-flowered; bracts somewhat longer than the ovaries. Flowers with deep red sepals, pale green petals and red lip. Median sepal spherical, 5 mm in diameter, subapiculate; spur cylindrical, arising abruptly from the rear of the galea, apex rounded, 2-3 mm long, half-ascending; lateral sepals oblong, apically rounded, shortly apiculate, c. 4 mm long, semi-erect next to the galea. Petals included in the galea, more or less lorate, falcate, curved over the anther with a basal anticous lobe flanking the stigma, c. 5 mm long. Lip ovate to obscurely 3-lobed, 3 mm long. Anther horizontal, 1 mm long; stigma subsessile, equally tripulvinate; latªeral rostellum lobes square, fused, central lobe small.
