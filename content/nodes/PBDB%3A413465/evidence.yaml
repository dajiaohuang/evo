  claims:
    - subjectId: taxon:asteriornis_maastrichtensis
      claimType: taxonomy
      claimKind: scientific
      statement: Field et al. named Asteriornis maastrichtensis from holotype NHMM 2013 008; parsimony placed it as sister to crown Galloanserae whereas tip-dated Bayesian analysis placed it as the stemward-most Pangalliformes member, so exact crown position remains method-dependent.
      confidence: medium
      confidenceRationale: "The name, type and two reported topology results are explicit. Confidence remains medium because the analyses disagree on the exact near-galloanseran branch and do not establish direct ancestry. Asteriornis maastrichtensis: For the species-level page, this assessment applies to the named species and its cited diagnosis; it does not imply a broader genus sample."
      referenceLinks:
        - referenceId: field-2020-asteriornis
          relation: supports
          pages: 397–401
          figure: Figure 3; Extended Data Figure 9
          quoteLocator: Systematic palaeontology; parsimony and tip-dated Bayesian phylogenetic analyses
    - subjectId: taxon:asteriornis_maastrichtensis
      claimType: biogeography
      claimKind: scientific
      statement: NHMM 2013 008 comes from the Maastricht Formation at the CBR-Romontbos quarry in Belgium; its Northern Hemisphere occurrence challenges a Gondwanan-origin hypothesis in the cited analysis but does not identify the geographic origin of crown birds.
      confidence: high
      confidenceRationale: "The quarry and formation provenance are direct records. The broader biogeographic consequence is framed only as a challenge to one hypothesis, not as proof of an alternative origin. Asteriornis maastrichtensis: For the species-level page, this assessment covers the cited occurrence or localities only and does not estimate a complete range."
      referenceLinks:
        - referenceId: field-2020-asteriornis
          relation: supports
          pages: 397–401
          figure: Figure 3; Extended Data Figure 7
          quoteLocator: Geological setting and provenance; Northern Hemisphere biogeographic discussion
    - subjectId: taxon:asteriornis_maastrichtensis
      claimType: morphology
      claimKind: scientific
      statement: NHMM 2013 008 includes a nearly complete, three-dimensionally preserved skull and associated postcranial elements and exhibits a combination of galliform-like and anseriform-like cranial features in the authors' comparison.
      confidence: high
      confidenceRationale: "The CT-imaged specimen, preserved elements and comparative cranial observations are documented directly. High confidence is confined to the sampled anatomy rather than its universal phylogenetic interpretation. Asteriornis maastrichtensis: For the species-level page, this assessment covers the characters observed in the cited specimens; unsampled variation remains outside it."
      referenceLinks:
        - referenceId: field-2020-asteriornis
          relation: supports
          pages: 397–401
          figure: Figures 1–2; Extended Data Figure 7
          quoteLocator: Holotype and CT description; comparative skull and quadrate morphology
    - subjectId: taxon:asteriornis_maastrichtensis
      claimType: ecology
      claimKind: scientific
      statement: The cited study estimates a mean body mass of 394 g and proposes only a possible littoral ecology from small size and depositional context; it does not resolve species-specific diet, locomotor performance or a feeding guild.
      confidence: medium
      confidenceRationale: "The body mass is a skeletal-scaling model result and littoral ecology is explicitly tentative. The remaining ecological fields are withheld because the study does not directly support them. Asteriornis maastrichtensis: For the species-level page, this assessment covers only ecological inferences tied to the cited specimens; unmeasured fields remain unassigned."
      referenceLinks:
        - referenceId: field-2020-asteriornis
          relation: supports
          pages: 397–401
          figure: Extended Data Figure 8
          quoteLocator: Mean body-mass estimate and discussion of possible littoral ecology
  claim-rationales.zh:
    - 名称、模式标本与两项拓扑结果均有明确报告。两种分析对近鸡雁类的具体位置并不一致，且不建立直系祖先关系，因此置信度为中等。 Asteriornis maastrichtensis：本种级页面的判断仅适用于所引材料中的该种及其描述，不表示存在更广泛的属级样本。
    - 采石场和地层组来源是直接记录。更广泛的生物地理意义仅表述为对一个假说的挑战，而不是另一种起源的证明。 Asteriornis maastrichtensis：本种级页面的判断仅覆盖所引化石记录或地点，不据此估算完整分布。
    - CT 成像标本、保存构件与比较头骨观察均有直接记录。高置信度只覆盖取样解剖，不延伸为普遍系统位置。 Asteriornis maastrichtensis：本种级页面的判断仅覆盖所引标本中观察到的性状；未取样的种内变异不在此结论内。
    - 体重是骨骼尺度模型结果，滨岸生态在原文中也明确只是可能性。论文未直接支持的其余生态字段保持不详。 Asteriornis maastrichtensis：本种级页面的判断仅覆盖与所引标本相关的生态推断；未测量字段继续保持未指定。
  claim-statements.zh:
    - Field 等人依据正模 NHMM 2013 008 命名 Asteriornis maastrichtensis；简约法把它置为冠群鸡雁类姐妹群，而尖端定年贝叶斯分析把它置为全鸡形类最靠干群的成员，因此其确切冠群位置仍依赖方法。
    - NHMM 2013 008 来自比利时 CBR-Romontbos 采石场的 Maastricht 组；这一北半球记录在所引分析中挑战冈瓦纳起源假说，但不能确定冠群鸟类的地理起源。
    - NHMM 2013 008 包含近完整、三维保存的头骨和相关头后骨骼，并在作者的比较中呈现鸡形类样与雁形类样头骨特征的组合。
    - 所引研究估计其平均体重为 394 克，并仅依据小体型和沉积背景提出可能的滨岸生态；它没有解决物种特异性食性、运动性能或摄食功能群。
