        claims:
          - text: "Plants with subterranean, moniliformous rhizomes; leaves thin-tissued, fully developed at anthesis, up to 700 x 60 mm; flowering stem 300-750 mm tall. Inflorescences dense as the first flowers open, later becoming lax and elongate, c. 7-25-flowered. Flowers: sepals purplish brown outside, brownish green within, petals very pale yellow, tinged with purple near the base, veins marked with numerous minute blue speckles on the inner surface, lip very pale yellow with minute dark blue speckles along the chief lateral nerves, crests bright yellow. Sepals and petals subequal, petals spreading; median sepal (20-) 26-30 (-33) mm long, narrowly lanceolate to lorate, acuminate; lateral sepals similar; petals as long as the sepals, lanceolate to narrowly ovate, acute. Lip 3-lobed, with a broadly concave sac 3 mm deep beneath the gynostemium apex, crests consisting of low, shortly pubescent ridges on the central nerves in the basal 1/3-1/4; mentum vestigial to absent; spur narrowly cylindrical, 4-5 mm long. short and broad, inner up to 600 x 55 mm; flowªering stem 300-850 mm tall. Inflorescences dense as the first flowers open, becoming lax and elonªgate, 6-18-flowered. Flowers: sepals pale purplish brown, petals pale straw-yellow with purple bases, basal third of lip dark maroon, pale yellow distally; ovary only slightly twisted. Sepals and petals spreading, subequal; median sepal (24-) 27-31 (-3 5) mm long, narrowly oblong to elliptic, acute; lateral sepals similar. Petals elliptic, as long as the median sepal, obtuse. Lip often shorter than the petals, crests consisting of 2-7 laterally sub-confluent ridges on basal third, sometimes termiªnating in a short tooth; mentum vestigial to 1 mm long; spur cylindrical, 5-6 mm long. Gynoªstemium 5-6 mm long."
