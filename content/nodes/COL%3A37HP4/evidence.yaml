    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Tree or shrub up to 11 m tall, dioecious, often armed with pubescent or glabrous spines up to 3.5 cm long; bark ashen-white with longitudinal ridges and shallow fissures; ultimate branchlets often abbreviated; young twigs pubescent. Leaves alternate; blade thin and soft, sometimes coriaceous when mature, obovate to rhomboid-elliptic, 1.5-6 cm long, 1-4 cm broad, pubescent to glabrescent, 3-veined from the base, apex acute to obtuse, or emarginate, base cuneate, margin entire to crenate; petiole 5 mm long, pubescent or sometimes glabrous. Male flowers yellow-green, in fascicles of 2-6; calyx 4-6-lobed, lobes 4 mm long, narrowly ovate, pubescent; stamens 24-48, filaments 2.5-3 mm long; nectaries densely hairy. Female flowers yellow-green, solitary or rarely in pairs; pedicels 4-7 mm long; calyx deeply 4-7-lobed; lobes 4-6 mm long, lanceolate-obovate, acute, tomentose, somewhat recurved; disc densely hairy; ovary 2 or 3-lobed, almost completely 2 or 3-locular, placentas 2 or 3, each placenta with 1 ovule; style 2-3. Fruit oblong, 1.1-1.5 cm in diam., densely and shortly hairy, orange to red when ripe. Seeds 2-3, hairy, 7 mm long, with a coffee smell.
            sourceIds:
              - sanbi_9722_0
            locator: "SANBI/WFO archive Morphology row 50558; source 9722.0; publication: Langenegger, JE. 1976. Flacourtiaceae: Dovyalis, Fl. S. Africa 22: 84 - 90. BRI, Dept. Agric. & Tech. Services, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: The species varies a great deal in its pubescence. The unarmed form with relatively glabrous leaves has in the past been separated as D. tristis, while D. zeyheri is described as being spiny and having pubescent leaves. Intermediates are, however, so common that the step taken by Wild (l.c.) to merge the two species is supported. Following Sleumer (l.c.), D. revoluta is treated here as a local form of D. zeyheri with glabrous leaves and papillose-puberulous ovaries and fruit.
