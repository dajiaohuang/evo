  claim-statements.zh:
    - 全面的比较骨骼研究抽样现生与化石弓鳍鱼科，并提出明确的系统假说。即使这部以弓鳍鱼科为核心的大型专著，也不能把其抽样记录等同于弓鳍鱼目的精确全球延限或起源。
    - 这部全面的弓鳍鱼科专著包含现生和化石成员，但不能直接验证原先 2.519 亿年前至今的整个弓鳍鱼目范围；目级显示现予暂缓。
