            locator: "SANBI/WFO archive Morphology row 32915; source identifier 14536.0; cited publication: Snijman, DA. 2013. Asphodelaceae: Bulbinella. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 53 - 54. South African National Biodiversity Institute, Pretoria. [CC BY]"
