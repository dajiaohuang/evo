            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Bulbinella caudafelis is a very variable species complex in which it is difficult to find clear-cut distinguishing characters, yet it is not easy to find reliable characters for separation into more than one distinctive taxon. The narrow inflorescence of white flowers with a pink tinge is one of the main characters on which it may be recognised in flower. The leaves always have a dilated sheath and somewhat glaucous appearance, but in some cases they are so narrow that the plants could be confused with those of B. triquetra. In fact, in a number of herbarium collections, particularly from mountainous areas, it is difficult to decide whether their affinities are most strongly with B. triquetra or with B. caudafelis. Sheath fibres also vary from straight and coarsely bristle-like to finer and somewhat reticulate. This may be a result of habitat conditions as the coarse, straight fibres are found in specimens from eastern areas of lower rainfall and clay soils. Many of these populations flower in November and December, which is later in the season than is normal. The somewhat thin-walled, pale fawn capsule and the large, dull black seeds are regarded as important diagnostic characters for the species.
