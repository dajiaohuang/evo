        claims:
          - text: Rhizomatous geophyte, up to 0.8 m tall, base densely fibrous, roots white. Leaves 5-11, linear, channelled, up to 9 mm wide, margins sometimes finely toothed. Flowers in a narrowly conical raceme, white with pink keels and buds.
            textZh: Bulbinella cauda-felis (L.f.) T.Durand & Schinz 的 SANBI 物种条目记录了形态特征。
