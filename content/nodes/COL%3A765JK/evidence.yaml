        usage:
          title: Paullinia rugosa Benth. ex Radlk., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Tendrilled lianas; stems (3-)5-ribbed, obscurely so in age and ca. 2-2.5 cm diam.; sap milky; stems, tendrils, petioles and rachises densely reddish brown hirtellous-tomentose; tendrils stout, forked; wood simple. Leaves pinnately 5-foliolate, 20-40()-60) cm long, the leaflets opposite; petioles 5-18(-30) cm long, terete; leaflets broadly elliptic to ovate or obovate, acuminate, attenuate to rounded and sometimes inequilateral at the base, 12-25(-35) cm long, 7-13 (-17) cm wide, hirtellous above on the veins, hirsute throughout beneath, espe- cially on the veins, the lateral veins ending in apiculate teeth, the reticulate veins prominulous; stipules semiorbicular, sericeous, 1-2 cm diam., with fimbriate mar- gins. Thyrses short, closely congested on slender, bracteate, spikelike inflores- cences, these simple and borne in leaf axils or on tendrils, or compound and termi- nal. Flowers white, ca. 3.5 mm long; sepals tomentulose, orbicular or ovate and short-acute; petals obovate, ca. 3 mm long, the scales ca. 2.5 mm long, with the lateral margin weakly ciliate, the deflexed appendage villous-bearded, truncate, the crest orange, weakly lobed; disc glands about as broad as long, sparsely pu- bescent, weakly concave on the outside; filaments densely wooly throughout, the pubescence partly covering the base of the anthers; ovary and outer surface of styles densely pubescent. Capsules bright red orange, suborbicular, to 1.5 cm diam., weakly beaked, stipitate, round in cross-section, densely tomentose, the stipe 3-4 mm long; seed solitary, subglobular, ca. 1 cm diam., black, covered by a thin white aril.
