            locator: "SANBI/WFO archive Morphology row 83083; source identifier 11504.0; cited publication: Reid, C; Dyer, RA. 1984. A review of the southern African species of Cyrtanthus. American Plant Life Society, La Jolla Stanford. [All rights reserved]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: This species differs from C. clavatus mainly in its spirally twisted leaves. The habitat is also somewhat drier than that of C. clavatus. The adaptive significance of twisted leaves is not known; it is certainly common in plants of arid habitats and is not always constant in those species of Liliaceae and Iridaceae which exhibit the phenomenon.
