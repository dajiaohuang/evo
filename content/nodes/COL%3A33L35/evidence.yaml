    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Bulb ovoid, 2-3.75 cm in diam., contracted into a neck 1-3 cm long, sometimes budding and growing in clumps. Leaves 2-4, contemporary with the flowers, linear, 8-14 cm long, 3-5 mm broad, spirally twisted. Peduncle arising at the side of the leaves and usually somewhat shorter than them, terete, hollow. Spathe-valves lanceolate, about 3 cm or more long. Pedicels shorter than the spathe-valves. Flowers 1-3 on a peduncle; perianth 4.5-6.5 cm long, white with brown or green stripes extending from the tube along the lobes; tube 2.5-4.5 cm long, narrow and curved at the base, dilated gradually to a throat 1-1.3 cm in diam.; lobes oblong, 1.5-2 cm long. Stamens markedly biseriate, exserted. Style exserted further than the stamens, trilobed.
            textZh: Cyrtanthus helictus Lehm. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
