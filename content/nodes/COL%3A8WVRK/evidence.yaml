    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants 80-160(-250) mm high. Corm ± globose with oblique flattened side; tunics dark brown, imbricate. Stem puberulous, simple or 1- or 2-branched. Leaves 3 or 4, rarely 5 if plants with more than a single branch, lower 2 basal, ± as long as stem, 2-4 mm wide, remaining leaves cauline, sheathing below, shorter than basal, blades 1.5-3.0 mm wide, evidently flat but margins raised and narrowly winged, main vein also raised, with margins, main and sometimes secondary vein edges ciliate. Spike 1- to 3(5)-flowered; bracts green below, dry distally, often turning brown near tips, outer subacute, margins membranous, 7-10 mm long, inner slightly shorter. Flowers actinomorphic, salver-shaped, blue, base of tepals and throat white; perianth tube cylindric, widening near throat, 6-7 mm long, shortly exceeding bracts; tepals narrowly lanceolate (sublinear), (6-)8-10 x 1-2 mm. Filaments erect, equal, 4-5 mm long; anthers 2-3 mm long, white or yellow; pollen white or yellow. Style dividing opposite middle to apex anthers, often tilted downward, branches ± 1 mm long. Capsules ovoid?, 3(4) mm long. Seeds unknown.
            textZh: Geissorhiza namaquamontana Goldblatt & J.C.Manning 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Morphology row 98509; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Like those of the other members of the Geissorhiza namaquensis group, the leaves of G. namaquamontana are narrowly sword-shaped to nearly linear, with the margins narrowly winged and ciliate and the main vein and sometimes a second pair of veins raised and similarly ciliate. There seems no difference in the leaves among the group except for overall size and number. Whereas four leaves are usual, some plants have only three leaves and one from Grootberg with multiple branches has a small fifth leaf. The point of division on the style seems to vary in G. namaquamontana, dividing opposite the middle to upper third of the anthers in the two Kamiesberg populations but opposite or shortly above the anther apices in the Grootberg plants which have white anthers and pollen. The style branches in both sets of populations are short, ± 1 mm long. A note on Helme 3310 from the Kamiesberg states that the anthers and pollen are yellow. The differences between the Kamiesberg and Grootberg plants may simply be due to genetic drift or may signal that there are two separate taxa here. Additional field work in Namaqualand is needed.
