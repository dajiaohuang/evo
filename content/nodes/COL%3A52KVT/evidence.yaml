        usage:
          title: Stigmaphyllon hypargyreum Planch. & Triana, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Vine; lower leaf surface, petioles, branches, peduncles, pedicels and sepals densely sericeous (trichomes type A). Leaves opposite, broadly ovate or oblong- ovate, acuminate or acute at apex, rounded to truncate or subcordate at base, 8- 13(-15) cm long, 5-9(-10) cm wide, glabrous except for midrib above, densely sericeous below (trichomes types A and B), mostly eglandular, entire or irregu- larly crenate, the lateral veins 7 or 8 pairs, prominently ascending, the tertiary venation weakly prominulous; petioles 1-7 cm long, with 2 sessile, lateral glands at apex. Inflorescence of terminal or axillary, simple or branched, pedunculate pseudo-umbels of 10-16 flowers; pedicels inconspicuously pedunculate, 5-8 mm long; peduncle bibracteolate, 2-4 mm long. Flowers showy; sepals oblong-ovate, villous except at apex, turned inward above, the margin ciliate; all but 1 sepal glandular, the glands 2 mm long; petals orbicular, clawed, glabrous, at least the outer margin denticulate, the 2 petals on either side of the eglandular sepal larger, to 9 mm diam., concave, yellow or with orange on center below; 3 petals reduced, orange to red, the middle one often held higher, its claws thicker, erect; stamens unequal, 6 long with anthers covered at least in part by the flap-like apices of the styles, the anthers with the connective enlarged, introrsely dehiscent; pollen tacky; styles 3, glabrous except at base, with an apical flap, that of the style opposite the eglandular sepal concave. Schizocarp of 3 samaras; samaras 2-4 mm long, pubescent on body and along thickened ventral margin of wing, the wing dorsal, 3-5 mm wide at base, enlarged to 1 cm wide at apex; body angular- tuberculate.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 7194
          archiveSourceId: 2C345B3B-3145-4BFC-82D9-EED2C3957CB4
