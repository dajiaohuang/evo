          publishedAt: undated
          originalSourceText: Herbs, erect to 60 cm, pubescent with uniseriate appressed hairs. Leaves elliptic-lanceolate, acute, entire or mostly dentate, to ca 3.8 cm long and ca 1-2.5 cm wide, pubescent on both surfaces, more so on the veins beneath. Inflorescences capitula, ca 1 cm wide, axillary, sessile to peduncles ca 1 cm long, the bracts filiform, ca 3-4 mm long. Flowers crowded, very pubescent at their bases; calyx tube ca 2-3 mm long, membranaceous, the teeth lanceolate, ca 1 mm long, the cleft between the upper teeth cut more deeply; corolla ca 1-1.5 mm long, the tube naked within, the lips ca 0.2-0.3 mm long, sparingly pubescent; stamens weakly exserted, the anthers 0.1-0.2 mm long; style shortly exserted. Nutlets (3-)4, ovate, ca 0.5 mm long, pale brown.
