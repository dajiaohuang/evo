      morphology:
        status: partially-supported
        claims:
          - text: Shrub, 0.5-2.0(-3.0) m high. Leaves entire, linear, flat, 15-90 x 0.8-3.0 mm. Involucre campanulate, brown or yellowish brown, involucral bracts connate to the middle or less. Pappus short and often sparse, 0.5-1.0(-1.5) mm long. Achenes densely sericeous. Flowers yellow; July and October to December.
            sourceIds:
