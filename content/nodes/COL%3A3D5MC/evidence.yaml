            locator: "SANBI/WFO archive Morphology row 1981; source 11118.0; publication: Herman, PPJ; Retief, E. 1997. Plants of the northern provinces of South Africa: Keys and diagnostic characters. Strelitzia 6: 1 - 681. National Botanical Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: E. brevipapposus resembles much E. tenuissimus, floribundus, arabicus, and other narrow-leaved species of the section. Some important characteristics are the campanulate involucre, the glabrous flat leaves, the short pappus, and the silky achenes. In contrast to, e.g., E. tenuissimus and floribundus, the hair covering of the achenes is not becoming mucilaginous when moistened. In the southern part of the range the species has usually rather thin involucral bracts, which are connate at base only and basally somewhat gibbous. In the northern range the involucre is firm and more connate, and the pappus is very short and sparse. Generally speaking the northern forms tend to be more variable. This holds true also for the width and length of the leaves.
