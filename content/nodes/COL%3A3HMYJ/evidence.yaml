        claims:
          - text: "An acaulescent herb with a sub-horizontal rhizome and thick, fleshy roots. Leaf-blade broadly ovate, occasionally broadly elliptic, 4-7 cm long, 3.5-6.5 cm wide, apex obtuse to round, base cordate, margins crenate, digitately nerved, discolorous, dark green and shiny above, paler below, bullate, glabrous; petiole 3-12 cm long. Flowers with pedicels 2-8 cm long. Male flowers: Sepals linear, 1.5 cm long, projecting beyond corolla, c. 2.5 mm. Corolla 1.5 cm long, 1.2 cm wide at mouth, pubescent inside in lower half; lobes ovate, 4 mm long, 3 mm wide. Glands ovate, 2 mm long, 1.5 mm wide, thick, fleshy, crearrl. Stamens with filaments 3.5 mm long, anthers 2-2.5 mm long, glandular. Female flowers: Sepals linear, c. 6 mm long, free for 2-3 mm. Corolla-tube 1.3 1.5 cm long, 1.2-1.4 cm wide at mouth; lobes transversely ovate, 1-3 mm long, 6 mm wide, erect. Glands ovate to obovate, 2.5 mm long, 2 mm wide, cream. Ovary ellipsoid, 8 mm long, 4 mm wide, brown gland-dotted; style subterete, 4-5 mm long; lobes simple, 1 mm long, spreading. Fruit triangular-ellipsoid, 1.2 cm long, 1 cm wide. Seeds ellipsoid, 3.5 mm long, 2 mm wide, minutely tuberculate, pubescent, black."
