          title: Ormosia panamensis Benth., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Tree to ca. 15 m tall; young stems yellowish or golden sericeous, glabrate. Leaves 5-9-foliolate, the rachis 9-17 cm long, sparsely pubescent, glabrate, the petiole 5-8 cm long; leaflets subcoriaceous, oblong-lanceolate, gradually long acuminate at the apex, obtuse basally, 10-15 cm long, 3-6 cm wide, glabrate above, inconspicuously golden puberulent below. Flowers lilac; calyx densely yellowish sericeous, 8-11 mm long, 5-lobed, the teeth 3-4 mm long; corolla ca. 2 cm long. Fruit dehiscent, coriaceous, yellowish sericeous, glabrate; light brown or yellowish, suborbicular when mature, flattened, ca. 4 cm in diameter, not constricted between seeds, the valves thick with an adnate margin, 5-15 mm wide; seeds 1-4, separated by septa, ca. 1.5 cm long, dark red.
