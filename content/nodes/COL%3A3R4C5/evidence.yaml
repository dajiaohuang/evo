          - text: Climbing perennial herb. Tendrils simple. Male peduncles stout. Receptacle lobes of male and female flowers ± 2-3 mm long, triangular-subulate or lanceolate. Fruit ovoid-lageniform or obpyriform, rounded at base, rostrate with conical, acute or obtuse rostrum, glabrous, red. Seeds broadly ellipsoid. Flowers greenish.
