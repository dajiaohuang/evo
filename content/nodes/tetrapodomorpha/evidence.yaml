      claimType: topology
      statement: A systematic synthesis integrates sampled Devonian tetrapodomorph fishes and early digit-bearing tetrapods into an explicit transition framework. The framework does not identify one direct ancestor, an exact Tetrapodomorpha origin, or a complete global fossil range.
      confidence: medium
      confidenceRationale: Confidence is medium because the cited systematic synthesis directly supports the bounded topology statement at the supplied locator. The confidence does not extend beyond the framework does not identify one direct ancestor, an exact Tetrapodomorpha origin, or a complete global fossil range.
      referenceLinks:
