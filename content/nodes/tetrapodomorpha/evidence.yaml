          referenceId: clack-2006-early-tetrapods
          pages: 167–189
          figure: Figures 1–11
          quoteLocator: Devonian fossil sequence; comparative anatomy; phylogenetic framework
    - subjectId: taxon:tetrapodomorpha
      claimKind: scientific
      claimType: fossil-range
      statement: Clack’s synthesis documents tetrapodomorph and early tetrapod samples across the Late Devonian, supporting a 385.3–358.86 Ma transition-study window rather than a global clade origin or duration.
      confidence: medium
      confidenceRationale: "Devonian tetrapodomorph transition study sample: the cited primary study or systematic review directly supports the stated sample, calibration or withholding boundary at the supplied locator. Confidence is medium and does not extend to a global FAD, LAD, direct ancestor or unsampled interval."
