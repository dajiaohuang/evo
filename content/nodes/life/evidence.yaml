  claims:
    - subjectId: taxon:life
      claimKind: scientific
      claimType: fossil-range
      statement: The Life navigation envelope begins at 3.7 Ga as a conservative sampled biosignature boundary supported by biogenic-graphite evidence and extends to living Earth life at 0 Ma; 3.7 Ga is a minimum age by which life is evidenced, not a precise date for abiogenesis, LUCA or the origin of every lineage.
      confidence: medium
      confidenceRationale: The primary study combines field context, carbon isotopes and graphite nanostructure to argue for biogenic carbon in 3.7 Ga Isua metasediments, while the synthesis separates the approximately 3.7 Ga biosignature boundary from a much less certain earlier habitability boundary. Metamorphism, preservation and competing abiotic interpretations limit the claim to a conservative evidence minimum.
      referenceLinks:
        - referenceId: ohtomo-2014-isua-biogenic-graphite
          relation: supports
          pages: 25–28
          figure: Figures 3–4
          quoteLocator: p. 25 abstract; carbon-isotope analyses; graphite nanostructure; p. 28 conclusion
        - referenceId: pearce-2018-origin-life-window
          relation: contextualizes
          pages: 343–364
          figure: Figure 1; Table 1
          quoteLocator: "Abstract and Introduction: habitability and biosignature boundaries; Discussion: origin interval and uncertainty"
  claim-rationales.zh:
    - 一手研究结合野外背景、碳同位素和石墨纳米结构，论证 37 亿年前 Isua 变沉积岩中的碳具有生物成因；综合研究则把约 37 亿年前的生物标志边界与更早且不确定性更大的宜居边界分开。变质作用、保存偏差和非生物替代解释使该主张只能作为保守的证据最低年龄。
  claim-statements.zh:
    - 生命导航范围从 37 亿年前开始，这是由生物成因石墨证据支持的保守采样生物标志边界，并延续到 0 Ma 的现存地球生命；37 亿年前表示已有生命证据的最低年龄，不是生命自然发生、最后普遍共同祖先或每条谱系起源的精确日期。
  ranges:
    - entityId: life
      rangeKind: global-composite
      taxonomicConcept: Life on Earth sampled biosignature-to-living navigation envelope
      geographicScope: Isua Supracrustal Belt, western Greenland; living global biosphere
      olderMa: 3700
