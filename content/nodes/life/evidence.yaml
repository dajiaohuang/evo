        note: 3.7 Ga is a conservative sampled biosignature boundary, not a measured date for abiogenesis or LUCA. The sparse, metamorphosed early rock record and alternative abiotic interpretations prevent a precise origin endpoint; 0 Ma denotes that life persists.
      evidenceBasis: Carbon-isotope, geological and graphite-nanostructure analyses of 3.7 Ga Isua metasediments support a biogenic interpretation; an interdisciplinary review separates this biosignature boundary from the earlier and less certain habitability boundary.
      confidence: medium
      claimIds:
        - claim:taxon:life:fossil-range
