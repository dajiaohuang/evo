    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Spreading or sub-erect herb. Tuber up to 0.2 m diameter, rapiform. Aerial stems up to 0.35 m long, 2 mm diameter, puberulous, branching lateral. Leaves spreading, petiolate; petiole 3 mm long, puberulous; blade 30-35 x 10 mm, obovate to elliptic, above glabrous and olive green, beneath puberulous and grey-green, secondary veins arching and 9-12 to a side, apex obtuse-mucronate, base obtuse. Inflorescences axillary, lax, 2-3-flowered, puberulous, peduncles 2 mm long, pedicels 3 mm long; bracts 1.5 mm long, narrowly triangular. Sepals 2 x 1 mm, triangular, puberulous, purplish-green, apex acute. Corolla green tinged violet, outside puberulous; tube campanulate, 2 mm long; lobes 4 x 2 mm, ovate, apex obtuse. Coronal feet free, lobes tri-partite; central segment 5 mm long, filiform with dilated base, deep violet; lateral segments 2 mm long, subulate, green. Stamens from inner base of coronal feet; filaments 1 mm long; anthers 2 mm long, narrowly ovate, whitish, full length slits, apex acute. Ovaries 1 mm long; style 1.5 mm long, terete; style-head ±1 mm long, ovoid; translators ±1.7 mm long, spoon elliptic. Gynostegium in corolla mouth. Follicles solitary, pendulous, 35 x 10 mm, stoutly keel-shaped. Seeds 7 x 4 mm, obliquely ovate, brown; coma 10-15 mm long, silvery-white.
