  claim-rationales.zh:
    - 已有大型矩阵与明确敏感性分析，但高支持度研究在不同取样和演化模型下仍相互冲突。
  claim-statements.zh:
    - 采用不同类群集、慢进化基因、异质模型和总证据的螯肢动物基因组尺度分析，恢复彼此不相容的单系或并系蛛形纲；一次或多次陆生化及寒武纪—奥陶纪时间均为模型依赖的历史复原。
