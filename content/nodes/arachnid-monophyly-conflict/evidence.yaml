  claims:
    - subjectId: event:arachnid-monophyly-conflict
      claimKind: scientific
      claimType: topology
      statement: Genomic-scale chelicerate analyses using different taxon sets, slowly evolving genes, heterogeneous models and total evidence recover mutually incompatible monophyletic or paraphyletic Arachnida; one versus multiple terrestrializations and Cambrian–Ordovician timing are model-dependent historical reconstructions.
      confidence: contested
      confidenceRationale: Large matrices and explicit sensitivity analyses are available, but well-supported studies disagree under different sampling and evolutionary models.
      referenceLinks:
        - referenceId: lozano-fernandez-2019-chelicerate-phylogenomics
          relation: supports
          pages: "2295"
          figure: Figures 1–4; Supplementary analyses
          quoteLocator: Taxon-rich matrices; Model tests; Arachnida and Acari results
