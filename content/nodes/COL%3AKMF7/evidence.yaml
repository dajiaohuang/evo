    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Herbs up to 30 cm high from a stoloniferous corm. Leaves up to 35 cm long and 6-20 mm broad, glabrous. Inflorescences many-flowered, up to 30 cm long; bracts 5 mm long; pedicels 8-15 mm long. Flowers yellow; tepals 7 mm long, 4 mm broad, the three upper with an orange spot at the base; stamens 7 mm long the two upper ascending and slightly divergent, the lower diverging strongly in the opposite direction to the style; filaments yellow; anthers elliptic, very short, orange; ovary green, 2 mm diam.; ovule 1 mm diam.; style yellow, 6-7 mm long, strongly bent sideways; stigma orange. Fruit half-ovoid, green becoming black, 4 mm diam.; seed 3 mm diam., orange.
