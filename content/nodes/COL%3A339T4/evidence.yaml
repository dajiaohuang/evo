        claims:
          - text: Herba perennis, albo-pubescens; caulis ad 60 cm altus inflorescentia inclusa, 3.5 mm diam., simplex, foliatus. Folia radicalia tempore florendia marcescentia; lamina ad 200 x 13 mm, parte inferiore petiolari c. 80 mm longa, anguste elliptica, utrinque attenuata; caulina 35-100 x 6-8 mm sursum in bracteas gradatim decrescentia, basi amplectente, apice plus minusve acuto. Inflorescentia paniculata parce ramosa; pedicelli c. 5 mm longi, ebracteati. Calyx fere ad basin 5-lobatus; lobi c. 4 x 2.5 mm, sub fructu ad 7 x 4.5 mm ampliati et valde reflexi, elliptico-oblongi, obtusi, extra dense intus tenuiter pilosi. Corollae tubus ad fornicum bases 2.5 mm longus, intus basi gibbis 10 parvis praeditus; lobi 4 x 3 mm, oblongi, apice rotundato, caerulei, glabri pilis albis externe sub apice loborum exceptis; fornices c. 0.75 x 1.5 mm, crassi, leviter bilobi, acute papillosi, orem tubi fere occludentes, caerulei. Stamina 5, inclusa; filamenta in triente superiore tubi orientia, 0.3 mm longa; antherae 1.25 mm longae, sub medio dorsifixae. Stylus fructus 7 mm longus; nuculae 9 x 7 mm, ovatae, valde compressae, immarginatae, glochidiis validis conicis approximatis, cicatrice deltoidea 5 x 3.5 mm, fascia styli cum nucula separata.
