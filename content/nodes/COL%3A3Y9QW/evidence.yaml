        usage:
          title: Marsypianthes chamaedrys (Vahl) Kuntze, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Herbs, annual, prostrate or semi-erect, to 0.7 m, glandular-viscid and often with attached grains of sand or dirt. Leaves ovate, acute, crenate-serrate, the bases obtuse, subtruncate or cordate, to 7 cm long and 2 cm wide, both surfaces sparingly villous but often viscid; petioles ca .1-2.5 cm long. Inflorescences cap- itula + loosely flowered, peduncles ca 1-2.5 -cim long, the bracts lanceolate, sometimes lanceolate-ovate, ca 8-10 mm long, fimbriolate. Flowers sessile or with pedicels to ca 2 mm long; calyx campanulate, ca 6-8 mm long at maturity, per- sistent, 10-ribbed, pubescent, membranaceous, the teeth deltoid; corolla tubular, purple, ca 7-9 mm long, bilabiate, the upper lip 2-lobed, the lower 3-lobed, the lips weakly pubescent; filaments pubescent, the anthers ca 0.5 mm long; style slender, ca 2-4 mm long, the stigma 2-lobed, the one acute. Nutlets (3-)4, ca 2 mm long, pale brown.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 6615
          archiveSourceId: 546CAB0F-FD76-46F8-B80A-6EAFD8723F08
