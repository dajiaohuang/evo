          title: Diospyros artanthifolia Mart. ex Miq., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Tree 4-15 m tall; branches long, slender, subverticillate; branchlets setulose- tomentellous. Leaves chartaceous, drying brownish black above, paler brown beneath; lamina to 11 cm long and 4 cm wide, lanceolate, broadest just abovethe base, the apex acuminate, the base cuneate, the margin revolute, the lower surface strigose-puberulous and rough to the touch, the lateral nerves in 7-10 pairs, slightly impressed above, prominent beneath, the intercostal and other nerves forming a subprominent lax reticulum beneath. Male flowers in 7-25- flowered axillary cymes; pedicels 0.1-0.4 cm long; calyx 0.3-0.4 cm long, densely strigillose outside, sparsely strigillose inside, the lobes (4-)5(-6), deltate, about as long as the tube; corolla ca. 0.6 cm long, fusiform in bud, subrotate at anthesis, glabrous outside except for the densely strigose mid-petaline lines, the tube 0.2 cm long, obconic, the lobes 5, lingulate; stamens ca. 30, 0.25-0.35 cm long, attached to the base of the corolla tube, exserted, the connective with long setae to 0.3 cm long; pistillode absent. Female flowers in ca. 5-flowered axillary cymes, pedicels to 0.5 cm long; calyx and corolla similar to those in male flowers but larger; staminodes ca. 6; ovary 0.4 cm long, 0.4 cm wide, ovoid-conoidal, the styles 4-5, 0.4 cm long, divergent, united only at the base, locules 8 or 10, uni- ovular. Fruit ca. 4 cm in diameter, subglobose, hispidulous; seeds 8 or 10 or fewer by abortion, 2 cm long, 0.9 cm wide, 0.6 cm thick, black; endosperm smooth; fruiting calyx scarcely accrescent.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 4070
