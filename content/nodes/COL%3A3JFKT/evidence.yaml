        usage:
          title: Halophila decipiens Ostenf., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Monoecious herbs, the rhizome thin, fragile, with 1 root at each node, the internodes 1-4.5 cm long, the scales transparent, obovate, keeled, 3-7 mm long, hairy on the outside, incised apically, amplexicaul basally; lateral shoots 1-10 mm long, with only 1 pair of leaves. Leaf-blades oblong-elliptic, obtuse or rounded apically, cuneate basally, the margin finely serrulate, bright green, with short rigid unicellular trichomes on one or both sides, rarely glabrous, 10-25 mm long and 3-6 mm wide, cross-veins 6-9 pairs, ascending, joining the inframarginal veins which run ca. 0.5 mm from the margin, the midrib uniting at the apex with the intramarginal nerves; petioles triquetrous, 3-15 mm long. Inflorescences with the spathe ovate, acuminate, keeled, scarious, transparent, 3-4 mm long, the margin ciliate, the keel covered with fine serrulate teeth, with or without trichomes on the outside, containing 1 staminate and 1 carpellate flower, splitting at the top as the fruit ripens; the spathal leaf enclosing the carpellate flower embracing the other spathal leaf. Staminate flowers with the pedicels 3 mm long, the tepals oblong-elliptic to ovate, obtuse, convex, 1-1.5 mm long, the anthers ca. 1 mm long, after anthesis the complete flower with its pedicel breaks off. Carpellate flowers subsessile, the ovary ovoid, 1 mm long, the hypanthium 1-2 mm long, the styles 3, 2.5 mm long. Fruits broadly ellipsoid, 2.5 mm long and 1.5 mm wide, the beak 1.5-2 mm long, the pericarp scarious, transparent; seeds ca. 30, ovoid, 0.2 mm long.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 6495
