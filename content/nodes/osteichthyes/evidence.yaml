  claim-statements.zh:
    - 约 436 Ma 早志留世地层中的 Eosteus chongqingensis 以目前报道最早的关节连接硬骨鱼出现记录锚定 436–0 Ma 路线；其干群位置依赖分析，不能当作冠群分裂或全球起源日期。
