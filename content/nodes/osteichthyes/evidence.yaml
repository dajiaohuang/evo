      statement: Eosteus chongqingensis from approximately 436 Ma early Silurian strata anchors the 436–0 Ma Osteichthyes route as the oldest reported articulated bony-fish occurrence; its stem placement is analysis-dependent and is not a crown split or global origination date.
      confidence: medium
      confidenceRationale: The 2026 primary study describes and figures the articulated specimen and supplies parsimony and Bayesian matrices. The occurrence is direct, whereas placement and implications for the actinopterygian–sarcopterygian split are analytical.
      referenceLinks:
