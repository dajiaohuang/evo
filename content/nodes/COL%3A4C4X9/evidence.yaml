        usage:
          title: Palicourea tumidonodosa Dwyer, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Trees to 5 m tall, the twigs smooth, glabrous, black when dry, the nodes crowded, turgid (persistent stipules). Leaves elliptic, 6-13 cm long, 4.5-5.5 cm wide, deltoid toward the apex, acuminate, the acumen scarcely evident, ulti- mately obtuse, acute or attenuate acute toward the base, the costa prominulous above, subprominent beneath, the lateral veins ca. 13, arcuate, not forming an undulate marginal vein, the margin thinly callose, stiffly chartaceous, discolorous, glabrous; petioles stiff, ascending, to 2 cm long, ca. 0.1 cm wide, glabrous; stip- ules perhaps connate toward the base, compressed cup shaped, turgid, ca. 0.5 cm long, subtruncate or rounded at the apex, scarious, glabrous, the margin entire or minutely retuse and ciliolate. Inflorescences terminal, solitary, paniculate, to 13 cm long, to 5 cm wide; peduncle 1.0-3.5 cm long, the branches opposite, ascending, the lowermost well spaced, to 4 cm long; bracts and bracteoles ovate triangular or oblong, to 3 mm long, acute or obtuse, glabrescent. Flowers (in bud) sessile; hypanthium inconspicuous, 0.3 mm long, the calycine cup short, 0.5 mm long, scarcely turgid, the lobes 5, oblong, 1.5 mm long, stiffly petaloid, the hairs short, ascending, white; corolla green (in bud), the tube cylindrical, puberulent outside, within with elongate, ascending hairs at base, the wall stiffly carnose, the lobes cucullate; anthers oblong, 1.3 mm long, obtuse. Fruits not seen.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 11905
          archiveSourceId: CA362ED0-0C1F-42DE-9542-C881B69B6632
