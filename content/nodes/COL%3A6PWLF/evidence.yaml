          publishedAt: undated
          originalSourceText: sistent, erect and parallel to the branchlets. Flowers (said to be white) very small, numerous in leafy, terminal, mostly pyramidal panicles 10-20 cm. long; lower (axillary) branches of the panicle widely divergent, often 6-15 cm. long, most of the flowers borne in racemoid arrangement along secondary branches in 2- to 5-flowered cymules on peduncles 2-5 mm. long; terminal flowers of the cymules often pedicellate 1-3 mm., the lateral ones usually nearly sessile; corolla none; anther-bearing stamens usually 3 (opposite 3 adjoining calyx-lobes), less than 1 mm. long, the filaments subulate, dilated at base and hirsute about the zone of insertion, the anthers about half as long as the filaments; hypanthium campanulate or turbinate, about 1.5-2 mm. long and wide in anthesis, often contracted slightly at mouth, surmounted by the 5 ovate-acute, entire calyx-lobes which are spreading at tips, about 1 mm. long and wide; receptacle thickly hairy within, with a prom- inent fringe of hairs at the somewhat thickened margin, which in addition often bears short sterile filaments alternating with the calyx-lobes, and less often bears very short vestigial filaments elsewhere; ovary sessile at the bottom of the hypan- thium, ovoid-globose, less than 1 mm. long, white-hirsute; style erect (in the flower opposite the stamens and so alternating with the stamenless calyx-lobes), about 2 mm. long, subulate, hirsute except for the slender tip 0.2-0.3 mm. long; developing ovary elongating at base and becoming stipitate at maturity. Fruit pyriform, red, thinly pubescent at least at base, about 1 cm. thick and 2 cm. long (including the attenuate base).
          originalLanguage: en
