    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Terrestrial herb, up to 0.6 m high. Spur 8-15 mm long. Anterior lobe of petal broadly lanceolate, shorter than oblong posterior lobe. Lateral sepals with a lateral apiculus. Flowers white with green-veined sepals.
            textZh: Habenaria dives Rchb.f. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_11118_0
            locator: "SANBI/WFO archive Morphology row 2162; source identifier 11118.0; cited publication: Herman, PPJ; Retief, E. 1997. Plants of the northern provinces of South Africa: Keys and diagnostic characters. Strelitzia 6: 1 - 681. National Botanical Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: The shape of the petals and lateral lip lobes in this species is somewhat variable, but the lower petal lobe is invariably shorter and usually broader than the upper, and sometimes much reduced or vestigial. Occasional abnormal flowers are produced with additional lobing of the upper petal lobe and lip midlobe. The species is related to Habenaria falcicornis but may be distinguished by the more dense inflorescence of smaller flowers with shorter spurs.
