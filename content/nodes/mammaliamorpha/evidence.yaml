      statement: Mammaliamorpha is displayed at 225–0 Ma only as the review's definition-dependent sample envelope, not an exact clade origin or direct ancestor sequence. The interval is a source-bounded sample window, not a global FAD, LAD, divergence date, continuous occupancy claim or direct-ancestor assertion.
      confidence: medium
      confidenceRationale: Mammaliamorpha uses Luo, Z.-X.; Kielan-Jaworowska, Z.; Cifelli, R.L. (2002) because the cited pages and locator expose the sampled taxon, specimen or living sequence set. Confidence is medium and applies only to Mesozoic mammaliamorph sample and living continuation represented in Luo et al.; broader endpoints remain unclaimed.
      referenceLinks:
