        usage:
          title: Malachra radiata (L.) L., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Herb or suffrutex 0.5-2.5 m tall, the stem erect, terete and branched, the in- dumentum of stem, branchlets and petioles conspicuously hispid with long, mostly simple, flavescent hairs, and also with scattered, short, stellate hairs. Leaves rather long-petiolate, the petiole terete, 2-9 cm long, the stipules subulate-filiform, arcu- ate-erect, ca 1 cm long, hispid; blade usually deeply (often nearly to the base) 3- or 5-palmatiparted, cordate or subcordate at the base, the segments narrowly oblong, often lobed or laciniate, with rounded sinuses and subacute at the apex, the margins serrate, up to 12 cm long and broad, gradually smaller toward the apex of the stem and branchlets, 3- or 5-palminerved, scabrous and appressed- hispid with simple and few-forked, stellate hairs on both sides, or glabrescent above, the venation slightly prominent beneath. Flowers in terminal heads; bracts shortly petiolate (outer ones) to almost sessile (inner ones), oblong-ovate or lanceolate, infrequently sublobate, expanded, obtuse or rounded at the base, acuminate at the apex, irregularly and coarsely serrate-dentate, the outer ones up to 4 cm long and 3 cm broad, 5- or 7-palminerved, hispid with simple or few-forked, stellate hairs on both sides, the main veins prominulous beneath; epicalyx of 9-12 bractlets, these subulate-filiform, 10-12 mm long, hispid; calyx herbaceous, lobed to about the middle, 8-10 mm long, hispid, accrescent, the lobes lanceolate-ovate and acute; petals 11-13 m long, pink; staminal tube 8-10 mm long; styles 10-12 mm long. Mericarps ca 4 mm long and 2.5-3 mm broad, glabrous; seeds ca 3 mm long.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 7309
