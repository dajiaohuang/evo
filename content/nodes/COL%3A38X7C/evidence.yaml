        usage:
          title: Elachyptera floribunda (Benth.) A.C.Sm., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Liana or slender tree with scandent branches. Leaves with the petiole 3-9 mm. long, the blade ovate-elliptic or elliptic, acute to rounded at the base, gradually short-acuminate or cuspidate at the apex, entire or crenulate-undulate at the mar- gins, 5-12 cm. long and 2-5 cm. broad, chartaceous, the costa prominent on both surfaces. Inflorescences solitary or aggregated in clusters of 2-4, 2-11 cm. long. Flowers 2-2.7 mm. in diam., often minutely cinereous-puberulus on all exterior sur- faces; sepals deltoid to semiorbicular, subentire or erosulous at the margins, 0.3-0.5 mm. long and 0.4-0.7 mm. broad, submembranous or papyraceous; petals oblong to elliptic, entire or distally erosulous, 1-1.7 mm. long and 0.6-1 mm. broad; disc undulate and slightly thickened at the margin, 0.12-0.2 mm. high; filaments of the stamens 0.3-0.4 mm. long, slightly broadened at base and apex, the anthers about 0.2 mm. long and 0.4 mm. broad; ovary 0.4-0.5 mm. in diam., the ovules 2 per cell, collateral; style 0.1-0.3 mm. long, the stigmas forming a minute, capitate shield, obtuse or faintly emarginate, often obscure. Fruits often 5-10 per inflorescence, the mericarps elliptic or slightly obovate, obtuse or rounded or faintly emarginate at the apex, 3-4.5 cm. long, 2-2.5 cm. broad and about 3 mm. thick, the pericarp thin- coriaceous, conspicuously flabellate-costate without, smooth within; seeds 2 per mericarp, the embryoniferous portion ellipsoid, the wing oblong, 4-5 mm. long and 2-3 mm. broad distally, gradually narrowed toward the base, extended distally into a narrow, thickened flange.
