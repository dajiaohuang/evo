        usage:
          title: Centrosema angustifolium (Kunth) Benth., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Slender twining vines; stems wiry, minutely pubescent with erect white hairs. Leaves pinnate trifoliolate; leaflets narrowly linear oblong, mostly 3-5 cm long, 5-9 mm wide, gradually long tapering to a blunt tip, basally rounded and minutely cordate, the costa conspicuous, lateral veins ca. 20-30 arising at right angles to the costa, anastomosing irregularly near the margin, shiny and glabrate above but with scattered minute reduced trichomes and a small tuft at the base, glabrous beneath, slightly revolute; petioles 1-1.5 mm long, drying wrinkled with a few hairs; rachis ca. 2 mm long, ridged or channelled dorsally; petioles mostly shorter than the terminal leaflet, sparingly pubescent with erect elongate hairs; stipels subulate, glabrous, exceeding the rachis; stipules narrowly deltoid, ca. 4 mm long, conspicuously striate. Inflorescence a few flowered congested raceme, only 1 flower opening at a time; peduncle slender, glabrate, 1-20 cm long; bracts spathaceous, strongly nervate, 10-15 mm long, the inner bract pointed; pedicels obscure. Flowers showy, purple, calyx cupular, 10 mm long, the sinuses rounded, the lobes deltoid, but the lowest lobe elongate, subulate, ca. 8 mm long, standard orbicular, flat, minutely emarginate, 2.5-3 cm across. Legume linear, 7-10 cm long including the acicular, 10-15 mm long beak, 3-4 mm wide, glabrous; seeds dark brown, discoid, ca. 2 mm long.
          originalLanguage: en
          sourceField: general
