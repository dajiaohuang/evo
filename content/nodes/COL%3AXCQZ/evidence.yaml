          originalSourceText: Suffrutescent herbs or small shrubs, epiphytic; stems 5-6 mm in diam., densely brown hirsute. Leaves of a pair strongly unequal, the larger leaf oblong to ob- lanceolate, 15.2-16.3 cm long and 4.4-5.4 cm wide, the apex shortly acuminate, strongly oblique at the base, serrulate, green above, pilose, the hairs transparent and reddish, 5-11 celled, red at the apex and more or less red spotted elsewhere beneath, hirsute, hairs transparent, 5-12 celled, also 2-3 celled appressed hairs; petioles 2-4 mm long, the smaller leaves ovate, 1.1-1.8 cm long and 8-10 mm wide, acuminate, strongly oblique at the base, the blades red beneath at the apex. Flowers solitary or paired in each axil; bracts 5-7 mm long, entire, acuminate, hirsute; pedicels 1.8-2.4 cm long, brown hirsute; calyx lobes lanceolate, 1.6-1.7 cm long, acuminate, 4-6 toothed, the teeth to 3 mm long, green, pale brown pilose; corollas yellow with red spots at the bases of the corolla lobes, funnelform, 3-4 cm long, ca. 4 mm in diam. above the base, becoming ca. 8 mm in diam., glabrous externally and internally, the lobes subregular, reflexed 5-6 mm long, sparsely strigose; filaments glabrous, the anthers included; ovary sparsely hirsute, the style glabrous, the stigma stomatomorphic. Fruits not seen.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 6204
          archiveSourceId: C830EB56-245C-4334-9C43-B35ED5C57651
