    facets:
      morphology:
        status: partially-supported
        claims:
          - text: "Shrubs. Branches when young woolly to densely woolly on two sides and woolly, villous or velutinous on other two sides; older branches more sparsely haired. Leaves glabrate, veins woolly to pilose, sessile or subsessile, narrowly elliptic to narrowly obovate, 90-190 x 35-68 mm; margin minutely involute. Flowers in spikes 70-170 mm long. Fertile bracts pubescent, ovate, 25-41 x 15-21 mm, with membranous margin pale and 3 mm wide. Bracteoles absent. Calyx velutinous, nerves densely velutinous, 15-25 mm long; lobes oblong to elliptic, 9-20 x 3-5 mm. Corolla pilose to velutinous, 50-58 mm long; tube 19-23 mm long; upper lip 31-34 x 10-11 mm; lower lip 28-32 x 7-9 mm. Stamens 23-30 mm long; anthers 5.5-7.0 mm long. Pistil: ovary densely strigose near apex, 3 mm long; style 47-57 mm long. Capsule sparsely sericeous to sericeous, longer than 23 mm. Seeds 4 x 3 mm."
            sourceIds:
