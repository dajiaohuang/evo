        claims:
          - text: Cormous geophyte, 2-10 cm. Leaves short, lanceolate, undulate to crisped. Flowers nodding, zygomorphic, dull greenish, filaments often with a hump-like swelling in the middle, 10-12 mm long.
            textZh: Ornithoglossum gracile B.Nord. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13859_0
            locator: "SANBI/WFO archive Morphology row 11053; source identifier 13859.0; cited publication: Manning, JC; Goldblatt, P. 2012. Colchicaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 80 - 83. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: This poorly known taxon comes closest to O. undulatum, which it resembles in the undulate leaves (although this is not a constant feature of O. undulatum), in having relatively long filaments and a laxly corymbose inflorescence, and in its flowering time. The most obvious distinguishing character is afforded by the narrow, greenish-coloured tepals. Furthermore, the flowers are borne higher above the leaves and the filaments usually have a distinct hump-like swelling below the middle.
            textZh: SANBI 条目提供了 Ornithoglossum gracile B.Nord. 的鉴别特征。
            sourceIds:
              - sanbi_4997_0
            locator: "SANBI/WFO archive Diagnostic row 58124; source identifier 4997.0; cited publication: Nordenstam, RB. 1982. A monograph of the genus Ornithoglossum (Liliaceae). Opera Bot. 64: 5 - 51. [10.1111/j.1756-1051.1983.tb01058.x]. [All rights reserved]"
