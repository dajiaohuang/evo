        claims:
          - text: Acaulescent, cormous geophyte, 2-4 cm. Leaves ovate, prostrate, margins thickened and ciliate. Flowers yellow, tepals cupped, style exceeding anthers, stigmas fringed.
            textZh: Moraea galaxia (L.f.) Goldblatt & J.C.Manning 的 SANBI 物种条目记载了植株、叶片和花部形态。
            sourceIds:
              - sanbi_13878_0
            locator: Strelitzia 29; archive Morphology row 7424, source 13878.0
            placeTimeScope: Regional species account published 2012; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
          - text: One of the most common species of subg. Galaxia, Moraea galaxia has the yellow flowers and fringed style lobes typical of ser. Galaxia and is best distinguished by the broad, ± ovate leaves prostate or nearly so and with thickened, usually densely ciliate margins. The filaments are united in a bottle-shaped column with the sessile anthers appressed to the style. Over most of its range M. galaxia is tetraploid, 2n = 36, but diploid plants, 2n = 18 occur in the southeast of its range in the Caledon District.
            textZh: SANBI 条目提供了 Moraea galaxia (L.f.) Goldblatt & J.C.Manning 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: Strelitzia 42; archive Diagnostic row 95278, source 18638.0
