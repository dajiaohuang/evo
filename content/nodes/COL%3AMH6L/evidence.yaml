          - text: Plants of B. boltonii are generally short in stature and grow in full sun or rarely in forest and thicket. This taxon is sympatric with B. antennifera and B. speciosa, and can reach comparable heights when growing in tall vegetation such as forest margins and mixed grassland. B. boltonii and its close allies (B. antennifera, B. porrecta, B. speciosa and B. volkensiana) share similar floral configuration but subtle differences in the petal- and lip-lobes, rostellum structure, and spur distinguish them. B. boltonii can be easily distinguished by its horizontally spreading lower petal lobes and descending lateral lip lobes from B. antennifera and B. volkensiana, which have forward projecting, ascending lateral lip lobes and lower petal lobes. B. porrecta is deciduous and has a smaller rostellum median lobe (2-5 mm vs 5-9 mm), with the free portion of the rostellum lateral lobes 2.0-5.5 mm (vs 2.0-' 3.5 mm) and generally > the length of the rostellum median lobe. B. speciosa has a longer clavate spur apex ((13.5-) 15.0-32.0 mm vs 7.0-14.5 mm) and wider lower petal lobes ((1.5-) 2.0-5.5 mm vs 0.5-2.0(-2.5) mm). The lower petal lobe in B. speciosa projects forward and is weakly to strongly deflexed, with descending lip lateral lobes.
