  claim-rationales.zh:
    - 中置信度表示主要的合弓类—蜥形类分裂较稳定，但若干早期羊膜动物的位置会随性状编码和系统分析而改变，单项研究不足以消除冲突。
  claim-statements.zh:
    - 早期羊膜动物的亲缘关系支持合弓类与蜥形类是不同分支，但若干古生代分类单元的位置仍依赖分析。
