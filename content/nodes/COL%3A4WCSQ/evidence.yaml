    facets:
      morphology:
        status: partially-supported
        claims:
          - text: "Shrubby, twiggy, up to c. 1 m tall, stems pubescent, hairs patent, up to 0.3-0.8 mm long, closely leafy. Leaves alternate, fascicled, primary leaves up to 8-12 x 2.3-3.5 mm, elliptic tapering to a short petiolar part, apex acute, upper margins with 1-3 pairs of tiny teeth, smaller leaves often entire, glandular-punctate, upper surface glabrous, upward-pointing hairs c. 0.15 mm long on margins, to 0.4 mm long on midline of lower surface. Inflorescences big leafy panicle, flowers eventually distant. Bract adnate to pedicel and calyx tube, part free from pedicel up to c. 3-3.5 x 0.5-1 mm, lanceolate, entire, hairy as leaves. Pedicel (lowermost) 3-4.5 mm long. Calyx 2-2.5 mm long on anticous side, two anticous lobes much broader than the posticous one, often notched, sometimes entire, thus lobes 3 or 5, keeled, minutely gland-dotted, hairs to c. 0.2 mm long on margins. Corolla tube 3.3-4 mm long, funnel-shaped, limb 4.7-5.5 mm across lateral lobes, posticous lobes 2-2.5 x 1.4-1.6 mm, anticous lobe 2.6-3 x 1.3-1.7 mm, all lobes suborbicular or broadly elliptic, pale mauve. Stamens: posticous filaments 1.2-1.8 mm long, anthers in throat; anticous filaments 2.2-2.4 mm long, anthers shortly exerted. Stigma and style c. 4-4.4 mm long, style minutely puberulous. Ovary c. 0.8 x 0.3 mm. Cocci c. 2.5 x 1 mm, slightly rugulose, light brown, the pair separating only tardily."
            sourceIds:
