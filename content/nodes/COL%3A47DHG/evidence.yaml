    facets:
      morphology:
        status: partially-supported
        claims:
          - text: A bushy herb up to 1 m tall, stems sparsely and minutely pubescent, leafy. Leaves linear or linear-lanceolate, up to 90 x 4(-9) mm, apex acute or acuminate, lower ones tapering into a petiole-like base, upper half-clasping, glabrous, or with a few marginal cilia, margins entire, or rarely somewhat toothed. Heads small (2-3 mm across), numerous, bright yellow, in compact corymbs corymbosely arranged. Involucral bracts in c. 2 series, a little shorter than the pappus, oblong-lanceolate, each with elongated median oil sacs. Achenes c. 0.75 mm long, elliptic, somewhat compressed, faint lateral and median ribs. Pappus of short scabrid bristles.
            sourceIds:
