        usage:
          title: Maytenus woodsonii Lundell, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrubs or small trees, to 5 m tall; branchlets verticillate. Leaves alternate, subverticillate at the apex of the braneblets, obovate, elliptic, apically rounded, rarely acute, basally broadly cuneate, the margins serrulate, 4-8 cm long and 1.5-4.0 cm wide, coriaceous, the primary lateral veins in 6-9 pairs, slightly ele- vated beneath, evident above. Inflorescences axillary or caulinary, fasciculate, bracteoles persistent at the base of the-pedicel, maroon, laciniate; the pedicels about 5 mm long. Flowers with the calyx deeply 5-lobed, the lobes imbricate, semiorbicular, ciliate, 1.2-1.8 mm long; petals broadly ovate or suborbicular, ca. 2.5 mm long, ciliate; disc fleshy, thick, slightly discoid; stamens 5, anthers ovoid-oblong, ca. 0.7 mm long, filaments short; pistil semi-inferior by adnation, the style obscure. Fruit a capsule, orbicular or slightly obovoid, 7 mm in diam- eter; seeds 1-3, 6 mm long and 3 mm wide, incompletely arillate.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 3181
