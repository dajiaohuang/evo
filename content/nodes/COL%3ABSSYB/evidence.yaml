        youngerMa: null
        note: The source states named chronostratigraphic bounds rather than numerical ages; the displayed numbers are conversions using ICS v2026/06 and may change with future chart revisions.
      evidenceBasis: Carter et al. explicitly state an Upper Ordovician–Upper Permian stratigraphic range for Spiriferida; this is not a direct-ancestor or continuous-occupancy claim.
      evidenceLevel: literature-synthesized
      confidence: medium
