        claims:
          - text: Perennial, dwarf shrub, up to ± 0.7 m high; erect; branches virgate, at first with a few long hairs, soon glabrous, leaf scars small. Leaves alternate, lanceolate or oblong-lanceolate, acuminate, quite glabrous, 1-nerved. Flowers few at apex of branches. Hypanthium hirsute outside, yellow; tube slightly inflated below, cylindrical above; sepals ovate, acute. Petaloid floral scales 8, lanceolate. Anthers oblong, obtuse. Ovary oblong, hairy at apex. Stigma capitate. Flowering time Aug., Jan.?.
