  claims:
    - subjectId: taxon:anthozoa
      claimKind: scientific
      claimType: topology
      statement: Phylogenomic matrices sampling major cnidarian lineages recover Anthozoa as one of the two principal cnidarian branches; this sampled topology does not specify an anthozoan ancestor or fossil first appearance.
      confidence: high
      confidenceRationale: Multiple transcriptomic matrices support the principal split, while taxon and model choices still bound internal and root-level inference.
      referenceLinks:
        - referenceId: zapata-2015-cnidaria
          relation: supports
          pages: e0139068
          quoteLocator: Figures 1–3; phylogenomic matrices and topology tests
    - subjectId: taxon:anthozoa
      claimKind: scientific
      claimType: fossil-range
      statement: "Anthozoa has no supported scalar temporal range in the cited evidence: the phylogenomic analysis tests relationships among sampled living cnidarians but does not date a crown-Anthozoa fossil boundary, so the former 540–0 Ma display is withheld."
      confidence: low
      confidenceRationale: Zapata et al. (2015) is fit for topology, not a temporal range. Low confidence records that no crown-specific fossil or calibrated boundary was located for the former Anthozoa display.
      referenceLinks:
        - relation: supports
          referenceId: zapata-2015-cnidaria
          pages: Article e0139068
          figure: Figures 1–3
          quoteLocator: Phylogenomic matrices and topology tests
  claim-rationales.zh:
    - 多个转录组矩阵支持主要分裂，但类群与模型选择仍限制内部及根部推断。
    - Zapata 等（2015）适用于拓扑关系，而不适用于时间范围。低置信度表示尚未找到能支持旧 Anthozoa 展示的冠群专属化石或校准边界。
  claim-statements.zh:
    - 覆盖主要刺胞动物支系的系统基因组矩阵把珊瑚虫纲恢复为刺胞动物两大主支之一；该取样拓扑不指定珊瑚虫祖先或化石首现。
    - 现有引证不支持 Anthozoa 的单一时间范围：系统基因组研究检验了所采样现生刺胞动物的关系，但未测定冠群珊瑚纲的化石边界，因此旧有 540–0 Ma 展示被暂缓。
  ranges:
