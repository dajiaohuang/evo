          - text: The geographic range of Pauridia verna is widely disjunct from that of its sister species P. alticola, which is found along the southwestern section of the Great Escarpment, Northern Cape and in the Cederberg and Kouebokkeveld, Western Cape. P. verna, like P. alticola, has a solitary-flowered inflorescence, distinguished by a short, entirely subterranean scape and the absence of a pedicel. Thus the flower, with its small, yellow, bowl-shaped tube and spreading, white tepals, is sessile and only the well-developed ovary beak, 20-47 mm long, holds the perigone clear of the ground, while the ovary itself remains buried until fruiting. Although remarkably similar in their floral morphology the two species are easily distinguished from each other by differences in the corms and seeds. P. verna has a fibreless corm, sometimes partially covered distally by brown papery sheaths and the seeds have a colliculate testa, unlike P. alticola in which the corm is heavily covered by fibrous tunics and the seed is densely covered by elongated trichomes.
