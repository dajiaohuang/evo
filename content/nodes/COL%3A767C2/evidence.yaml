      ecology:
        status: partially-supported
        claims:
          - text: Scattered colonies are found in small, seasonally wet, bare patches of basaltic gravel, areas fringing tarns and along marshy drainage lines in short, damp turf at elevations ranging from 2550 to 3050 meters above sea-level. This attractive plant is one of several other hardy dwarf geophytes, such as Rhodohypoxis rubella (Baker) Nel (Hypoxidaceae), Moraea alpina Goldblatt and Hesperantha crocopsis Hilliard & Burtt (both Iridaceae), that survive the extreme conditions of repeated freezing and thawing that prevail on the summit of the Drakensberg Escarpment.
