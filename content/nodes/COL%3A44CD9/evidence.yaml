    facets:
      morphology:
        status: partially-supported
        claims:
          - text: "Cormous geophyte, up to 0.7 m high. Leaf solitary; blade 4 mm wide. Flowers: borne all to one side; crests narrowly triangular, 3-4 mm long; outer segments broadly ovate, 24-28 mm long, spreading or held up to 30°; outer segment claws 7-9 mm long, inner segments erect, limb tricuspidate, with outer lobes spathulate and erect, inner lobes filiform, arching outwards; segments white, faintly tinged with mauve; Jan., Feb."
            textZh: Moraea vigilans Goldblatt & J.C.Manning 的 SANBI 物种条目记载了植株、叶片和花部形态。
            sourceIds:
              - sanbi_16273_0
            locator: Strelitzia 38; archive Morphology row 72182, source 16273.0
            placeTimeScope: Regional species account published 2017; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
          - text: Evidently closely related to the widespread M. brevistyla but the two are readily distinguished when alive. They grow within a few metres of one another on the slopes of The Sentinel where M. brevistyla grows on deeper soils on grassy slopes and M. vigilans is confined to basalt outcrops. The most striking difference between them is the broadly ovate to orbicular outer tepal limbs of M. vigilans, spreading or ascending up to 30°, whereas the narrower, oblanceolate-obovate outer tepal limbs of M. brevistyla are weakly to strongly reflexed and the limbs are usually pinched downward in the proximal third. Less apparent are the shorter outer tepal claws of M. vigilans, 7-9 mm long, and shorter filament column and style branches, the latter reaching opposite the apex of the outer tepal limb. The short, brownish crests extend upward above the base of the tepal limbs for up to 4 mm. The outer tepal claws of M. brevistyla are 9-11 mm long, the filaments and anthers are longer than those of M. vigilans (11-12 mm combined length in M. brevistyla vs. ± 8.5 mm in M. vigilans), and the style branches usually exceed the outer tepal limbs by up to 3.5 mm, while the white style crests extend upward a further 5 mm. Vegetatively the two species appear virtually identical but the stems of M. vigilans are somewhat willowy and incline toward the ground, whereas the stems of M. brevistyla are usually stiffly erect.
            textZh: SANBI 条目提供了 Moraea vigilans Goldblatt & J.C.Manning 的鉴别特征。
