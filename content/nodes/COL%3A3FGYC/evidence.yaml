    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, 12-35 cm, tunics woody, imbricate. Leaves sword-shaped to linear, margins winged and ciliate on veins and marginal wing edges. Flowers white to pale yellow.
            textZh: Geissorhiza inflexa (D.Delaroche) Ker Gawl. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 6788; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Recognised by the relatively small, creamy white flowers, often lightly flushed pink to red outside, inflexed stem, and narrowly sword-shaped leaves with raised and narrowly winged margins. The flowers have tepals mostly 10-15 mm long but exceptionally up to 18 mm in populations on the Cape Peninsula and nearby, and stamens with the anthers 4-6 mm long. The edges of the marginal wings, the main vein and sometimes secondary veins are ciliate to obviously hairy but the stem is quite smooth. Geissorhiza inflexa is closely allied to G. erosa and the two species have at times been united. The latter has larger, pink, red, purple or sometimes white flowers with tepals 18-24 x 8-10 mm, longer anthers 7-8 mm long, and usually broader leaves 5-10 mm wide.
            textZh: SANBI 条目提供了 Geissorhiza inflexa (D.Delaroche) Ker Gawl. 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 94740; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
