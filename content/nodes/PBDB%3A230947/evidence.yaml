  claims:
    - subjectId: taxon:yutyrannus_huali
      claimKind: scientific
      claimType: taxonomy
      statement: Yutyrannus huali is described from three nearly complete skeletons representing two ontogenetic stages, and its basal tyrannosauroid placement is the result of the study's sampled phylogenetic analysis rather than a direct-ancestor claim.
      confidence: medium
      confidenceRationale: "The named specimens and diagnosis are directly reported, while the wider placement depends on character coding, comparative sample and analysis settings. Yutyrannus huali: For the species-level page, this assessment applies to the named species and its cited diagnosis; it does not imply a broader genus sample."
      referenceLinks:
        - referenceId: xu-2012-yutyrannus
          relation: supports
          pages: 92–95
          figure: Figure 3; Supplementary Information
          quoteLocator: Abstract; systematic description; phylogenetic analysis
    - subjectId: taxon:yutyrannus_huali
      claimKind: scientific
      claimType: biogeography
      statement: This profile's geographic statement is limited to the Lower Cretaceous Yixian Formation of Liaoning Province, China, from which the three named Yutyrannus skeletons were reported; it does not assert a genus-wide distribution.
      confidence: high
      confidenceRationale: "The formation and provincial provenance are directly reported for the three-skeleton sample, but that sample cannot establish a complete geographic range. Yutyrannus huali: For the species-level page, this assessment covers the cited occurrence or localities only and does not estimate a complete range."
      referenceLinks:
        - referenceId: xu-2012-yutyrannus
          relation: supports
          pages: 92–95
          figure: Figures 1–2; Supplementary Information
          quoteLocator: Abstract; holotype and referred specimens; locality and horizon
    - subjectId: taxon:yutyrannus_huali
      claimKind: scientific
      claimType: morphology
      statement: The named Yutyrannus skeletons preserve a three-fingered manus, a typical theropod pes and long filamentous integumentary structures; these described structures do not directly establish their colour, complete body coverage or a single function.
      confidence: high
      confidenceRationale: "The primary study documents the named skeletons and their integumentary structures directly; the explicit limits prevent anatomical preservation from being promoted to colour or functional evidence. Yutyrannus huali: For the species-level page, this assessment covers the characters observed in the cited specimens; unsampled variation remains outside it."
      referenceLinks:
        - referenceId: xu-2012-yutyrannus
          relation: supports
          pages: 92–95
          figure: Figures 1–2; Supplementary Information
          quoteLocator: Abstract; specimen descriptions; integumentary structures
    - subjectId: taxon:yutyrannus_huali
      claimKind: scientific
      claimType: ecology
      statement: The cited study records specimen anatomy, large body size and filamentous integument but does not directly observe diet, habitat preference, locomotor behaviour, insulation, display or performance; those ecological interpretations remain unassigned here.
      confidence: medium
      confidenceRationale: "The specimens and their preserved structures are direct evidence, but ecological roles and feather functions require inferences beyond what the study directly observes. Yutyrannus huali: For the species-level page, this assessment covers only ecological inferences tied to the cited specimens; unmeasured fields remain unassigned."
      referenceLinks:
        - referenceId: xu-2012-yutyrannus
          relation: supports
          pages: 92–95
          figure: Figures 1–3; Supplementary Information
          quoteLocator: Abstract; specimen descriptions; phylogenetic analysis
  claim-rationales.zh:
    - 具名标本和诊断有直接记录，而更广泛的系统位置依赖性状编码、比较样本和分析设定。 Yutyrannus huali：本种级页面的判断仅适用于所引材料中的该种及其描述，不表示存在更广泛的属级样本。
    - 三件标本的地层和省级产地有直接记录，但该样本不能建立完整地理分布。 Yutyrannus huali：本种级页面的判断仅覆盖所引化石记录或地点，不据此估算完整分布。
    - 一手论文直接记录具名骨架及其丝状体被；明确保留其不等同于颜色、全身体被或单一功能的边界。 Yutyrannus huali：本种级页面的判断仅覆盖所引标本中观察到的性状；未取样的种内变异不在此结论内。
    - 标本和保存结构是直接证据，但生态角色与羽毛功能需要超出论文直接观察的推断。 Yutyrannus huali：本种级页面的判断仅覆盖与所引标本相关的生态推断；未测量字段继续保持未指定。
  claim-statements.zh:
    - Yutyrannus huali 依据代表两个个体发育阶段的三具近完整骨骼描述；其基干暴龙超科位置是研究所取样系统发育分析的结果，而非直系祖先主张。
    - 具名羽王龙骨骼保存三指手部、典型兽脚类足部和长丝状体被结构；这些被描述的结构不能直接确立其颜色、全身体表覆盖或单一功能。
    - 本档案的地理陈述限定于三具具名羽王龙骨骼所报道的中国辽宁下白垩统义县组；它不宣称属级完整分布。
    - 所引研究记录了标本解剖、大体型和丝状体被，但没有直接观察食性、生境偏好、运动行为、保温、展示或性能；这些生态解释在此保持未指定。
