    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants 70-110 mm high. Corm ± ovoid, ± 15 mm diam.; tunics woody, dark brown, imbricate, lower margins breaking into sections and tapering above into short points. Stem erect, simple or sometimes 1-branched, somewhat flexuose, with upper cataphyll often turning dry and brown distally. Leaves usually 4, lower 2 basal and longest, reaching to between upper 1/3 of stem and shortly above apex of spike, ± sword-shaped, 2.0-4.5 mm wide, firm, erect, main vein and margins thickened and prominent, hyaline when dry, third leaf inserted shortly above ground, largely sheathing, uppermost leaf entirely sheathing, ± bract-like, 12-32 mm long, inserted in middle to upper 1/3 of stem. Spike mostly 3- to 10-flowered, weakly flexuose; outer bract 6.5-10.0 mm long, green with red tips, inner bract slightly shorter. Flowers diurnal, rotate, white, outer tepals flushed rose-pink outside; perianth tube funnel-shaped, 8-9 mm long; tepals elliptic, spreading, 12-15 x 4.0-5.5 mm. Filaments suberect, ± 3 mm long; anthers ascending, 3-4 mm long. Style branches ± 6.5 mm long, reaching to slightly beyond anthers tips in closed flower.
            textZh: Hesperantha alborosea Hilliard & B.L.Burtt 的 SANBI 物种条目记录了形态特征。
            sourceIds:
