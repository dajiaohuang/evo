            locator: "SANBI/WFO archive Morphology row 98631; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Among the white-flowered species of the genus from eastern southern Africa, Hesperantha alborosea is recognised by its short stature, up to 110 mm high, firm to rigid leaves with thickened margins and main vein, and flowers with a relatively short perianth tube, 6-9 mm long, the tepals about 1.5x as long. It most closely resembles H. hygrophila, also with white flowers but usually without pink on the reverse of the outer tepals, tepals usually ± twice as long as the tube, and longer anthers, 5-10 mm long.
