        usage:
          title: Palicourea macrosepala K.Krause, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Trees to 5.6 m tall, the bark of the twiglets somewhat smooth, minutely pus- tulate, glabrescent. Leaves strongly ascending, oblong elliptic, 18-21 cm long, 7.5-8.0 cm wide, deltoid or acute at the apex, attenuate acute at the base, the costa plane or sulcate above, prominent beneath, angular, drying red, to 1.5 mm wide, the lateral veins 15-18, arcuate, drying red beneath, the intervenal areas spreading reticulate, the blade glabrous above, pubescent beneath, especially on the veins, the costa sparsely ciliate, the intervenal areas minutely pubescent; petioles to 3.5(-4.5) cm long, glabrescent, cracking, sometimes twisted, the blade slightly decurrent; stipules connate, intrapetiolar, the sheath appressed to the stem, cylindrical, ca. 0.7 cm long, stiffly petaloid, each part with 2 triangular, coriaceous lobes shorter than the sheath, the hairs few. Inflorescences terminal, solitary, cymose paniculate, to 23 cm long, plane, the lowermost branches op- posite, strongly ascending, to 9 cm long; bracts linear subulate, to 1 cm long, the longer ones with a median subulate process and 2 short processes. Flowers with the hypanthium compressed cylindrical, ca. 1 mm long, glabrous, the calycine cup ca. 0.8 mm long, the lobes 5, oblong, 1.5-2.0 mm long, scarcely puberulent; corolla pale purple, the tube cylindrical, uniformly wide, ca. 5 mm long, thinly carnose, glabrous within, the lobes 5, 1-3 mm long, thick, glabrous, cucullate; stamens 4-5, the anthers narrowly oblong, ca. 3 mm long, obtuse, sagittate ba- sally, the filaments ca. 0.3 mm long, attached near the mouth or at the base of the tube; ovarian disc compressed ovate rotund, ca. 0.5 mm long, the style slen- der, 3.2-4.5 mm long, the stigmas ca. 0.5 mm long. Fruits (immature) narrowly oblong, ca. 5 mm long, ca. 1.5 mm wide, obtuse, conspicuously reflexed, the calycine lobes persistent, much wider than at anthesis.
          originalLanguage: en
          sourceField: general
