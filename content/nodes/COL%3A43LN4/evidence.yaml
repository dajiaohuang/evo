    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Stems 10-35 cm tall, patent-or crispate-pilose. Leaves crowded, or less often scattered, and irregularly inserted on lower, non-flowering part of stem, verticillate at flowering nodes with internodes 8-18 mm long; leaves at flowering nodes not reduced in size. Leaf-lamina 17-45 x 1-2 mm, narrowly linear, subsessile, appressed-pilose. Flowers in fascicles of 2-6 at the distal 2-5 nodes; pedicels up to 10 mm long. Calyx segments 3-5 x 1-2 mm; dorsal surface pilose with a mixture of hyaline patent and brown appressed hairs, ventral surface with similar indumentum on the distal half. Corolla lobes 4.5-6.5 x 2.5-3.5 mm, spreading to reflexed at anthesis, green; dorsal surface pilose with a mixture of hyaline patent and brownish appressed hairs. Corona 1.5 mm high (excluding the processes), the lobes similar in shape to those of M. laeve but the 5 apical processes curving to the right (clockwise from above) and overlapping their neighbour, forming a loose wreath above the gynostegium; corona lobes white with deep green base and margins, apical processes white. Anther appendages 1 mm long, undulate; corpusculum 0.28-0.35 mm long; pollinium 0.85-1.1 mm long. Gynostegium white. Fruit unknown.
            sourceIds:
