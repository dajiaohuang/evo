        usage:
          title: Miconia goniostigma Triana, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrub 1-2 m. tall; all parts of the plant to the hypanthia more or less hirsute or hirsutulous with slender simple hairs seldom more than 1 mm. long; petioles 3-8 mm. long; leaf-blades oblong or elliptic, up to 10 cm. long, two-fifths to half as wide, short-acuminate, entire or denticulate, rounded at the base, 5-nerved or somewhat 5-pli-nerved; panicle small, sparingly branched and few-flowered; flowers 4-merous or 5-merous, sessile; hypanthium broadly cup-shaped, 2-2.5 mm. long to the torus; calyx glabrous, the tube prolonged 0.4 mm., the lobes semi- circular, 0.7 mm. long from the sinus; exterior teeth reduced to minute thicken- ings; petals subrotund, 3.5-4 mm. long; stamens isomorphic; filaments very broad, glandular on the outer face at the summit; anthers oblong, 4-celled, nearly 2 mm. long, opening by a dorso-terminal pore; connective widened toward the base and projecting as a short truncate body over the summit of the filament; ovary com- pletely inferior; stigma peltate, 2.5 mm. wide, 4 to 5-angled or lobed.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 7612
