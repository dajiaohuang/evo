  claims:
    - subjectId: event:rhyniella-springtail-material
      claimKind: scientific
      claimType: morphology
      statement: Four Rhyniella praecursor head capsules and roughly ten additional Rhynie-chert body specimens, including an abdomen with a springtail-like furcula, support collembolan affinity without establishing the origin, global first appearance or ecology of Hexapoda.
      confidence: medium
      confidenceRationale: The material and furcula are described directly, whereas absolute global priority and ecology exceed the specimen sample.
      referenceLinks:
        - referenceId: whalley-jarzembowski-1981-rhyniella
          relation: supports
          pages: "317"
          figure: Published specimen assessment
          quoteLocator: Head capsules; additional specimens; abdomen and furcula
  claim-rationales.zh:
    - 头壳、躯干和弹器材料是直接标本证据；全球最早记录、六足类起源与生态超出该样本能支持的范围。
  claim-statements.zh:
    - 四件 Rhyniella praecursor 头壳和约十件额外莱尼燧石躯体标本（包括带弹尾状弹器的腹部）支持弹尾目归属，但不能确定六足类的起源、全球首次出现或生态。
