    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Annual to 74 cm. Leaves opposite, ovate, sharply dentate, up to 4.5 cm long, short petiolate, 5-nerved, flowers in short racemes, elongating in fruit, white with yellowish orange, pubescent palate, spurs mostly 3.0-4.5 mm long.
            sourceIds:
              - sanbi_14438_0
            locator: "SANBI/WFO archive Morphology row 6241; source 14438.0; publication: Steiner, KE. 2012. Scrophulariaceae: Nemesia Vent. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 748 - 750. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: "Nemesia fourcadei is recognized by its white flowers with purple veining and a pale yellowish orange palate. It can be distinguished from the similar looking N. lucida by its larger flowers (7.6-13.2 mm vs < 7.5 mm long) with longer spurs (mostly 3.0-4.5 vs < 1.5 mm), and by its relatively broader capsules (length/width: 1.7-2.0 vs 2.4-3.5)."
            textZh: SANBI 条目提供了该种的鉴别特征。
            sourceIds:
              - sanbi_7447_0
            locator: "SANBI/WFO archive Diagnostic row 74968; source 7447.0; publication: Steiner, KE. 2010. Two new species of Nemesia (Scrophulariaceae) from the Southern Cape, South Africa. Bothalia 40(2): 161 - 166. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
