        claims:
          - text: Rhizomatous perennial to 80 cm, roots many, wiry. Leaves lanceolate to linear, usually pubescent. Flowers in a sparsely branched raceme with pubescent peduncle, often developing axillary plantlets, white.
            textZh: Trachyandra affinis Kunth 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13858_0
            locator: "SANBI/WFO archive Morphology row 8955; source identifier 13858.0; cited publication: Manning, JC; Goldblatt, P. 2012. Asphodelaceae: Trachyandra Kunth. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 78 - 80. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: As a result of injuries, usually from veld fires, the side branches of the raceme are often mutilated and remain as small bracteate buds near the base of the scape. The apical bud however, probably originally protected by the tissues of the side-branches, is stimulated to develop into a long, densely flowered, simple raceme becoming prostrate with age. Baker thought that the small bracteate buds, that is the injured, sterile side-branches, could give rise to new plants but this is a wrong interpretation.
            textZh: SANBI 条目提供了 Trachyandra affinis Kunth 的鉴别特征。
            sourceIds:
              - sanbi_3805_0
            locator: "SANBI/WFO archive Diagnostic row 84501; source identifier 3805.0; cited publication: Obermeyer, AA. 1962. A revision of the South African species of Anthericum, Chlorophytum and Trachyandra. Bothalia 7(4): 669 - 767. [CC BY]"
