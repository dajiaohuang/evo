    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Slender, scrambling, tuberous geophyte to 30 cm, with prickly stems. Leaves linear, ending in tendrils, midribs prickly beneath. Flowers axillary, nodding, white with purple centre, fragrant, anthers yellow with purple tips.
            textZh: Walleria gracilis (Salisb.) S.Carter 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13978_0
            locator: "SANBI/WFO archive Morphology row 12234; source identifier 13978.0; cited publication: Manning, JC; Goldblatt, P. 2012. Tecophilaeaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 255 - 255. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: The species closely resembles Walleria nutans from subtropical Africa but Walleria gracilis is recognized by its straggling or climbing habit, well-branched stem, more robust prickles ± 1-1.5 mm long, upper leaves drawn into coiled, tendril-like tips, and by the distinctive white flowers marked with a large purple blotch at the base of each tepal. The flowers in W. nutans are white or pink to pale blue and unmarked, the stems are free-standing and simple or rarely with a solitary branch, and either unarmed or armed with more delicate prickles, and the leaves are not cirrhose or coiled at the tips. Other differences between the two species are discussed under W. nutans. In addition, flowering in W. gracilis takes place during the winter, whereas W. nutans blooms in summer.
            textZh: SANBI 条目提供了 Walleria gracilis (Salisb.) S.Carter 的鉴别特征。
            sourceIds:
              - sanbi_7651_0
            locator: "SANBI/WFO archive Diagnostic row 47560; source identifier 7651.0; cited publication: Goldblatt, P; Manning, JC. 2012. A revision of Tecophilaeaceae subfam. Tecophilaeoideae in Africa. Bothalia 42(1): 21 - 41. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
