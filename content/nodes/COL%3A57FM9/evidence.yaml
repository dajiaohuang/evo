          title: Torenia thouarsii (Cham. & Schltdl.) Kuntze, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Ascending herb to 20 cm tall, the stems branching freely, slender, drying sulcate, sparingly glandular on emerging, soon glabrescent; roots short and fibrous. Leaves opposite, lanceolate to ovate, apically obtuse or acute, basally obtuse, rounded or truncate, the margins crenate serrate with ca. 6 teeth on each side, mostly 1.5-2.5 cm long, 8-12 mm wide, the venation pinnate with ca. 3 pairs of strongly ascending arcuate veins on each side, glabrate but ciliolate with short, white trichomes at the margins and on the main veins beneath, obscurely glandular punctate beneath; petiole 2-7 mm long, the margins ciliate, especially at the base. Inflorescence 1-3 flowers in the leaf axil, sometimes geminate or ternate; peduncles glabrate, sulcate, exceeding the petioles, 5-15 mm long, the bracts basal, linear, 1-2 mm long, ciliate. Flowers with the calyx tubular, nar- rowly ovoid or pyriform, with narrow, ciliolate wing angles, with 5 short lobes, somewhat accrescent in fruit; corolla slightly exserted from the calyx, bluish, purplish or whitish, tubular, ca. 10 mm long, 5-lobed, the lobes rotund, erose crenulate, ca. 2 mm across, bearded in the throat with stout whitish clavate hairs; stamens 4, the ventral pair inserted near the corolla mouth, the filaments genicu- late, with a sterile, linear extension from the point of insertion, ca. 1.5 mm free, the anthers somewhat reduced, the thecae separated by the connective, rotund, the dorsal pair inserted ca. 1 mm below the ventral pair, the filaments arching above the style and not geniculate, anthers 0.8 mm free, the 'thecae separated, divaricate, ca. 1.7 mm long, the connectives somewhat glandular, coherent holding the 2 anthers together; staminode inserted between and slightly above the fila- ments bearing a small globose antheroid; ovary narrowly conical, smooth, glabrous, the style straight, terete, the stigmas discoid, erose, flattened together, ca. 0.7 mm long. Capsule narrowly ovoid conical, scarcely exserted from the calyx, dehiscing septicidally to the base.
