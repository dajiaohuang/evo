        usage:
          title: Marila lactogena Cuatrec., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Tree to 1 3 m, younger branches ferrugineous-tomentose, glabrescent; twigs with sticky white latex. Leaves 14.5-40 cm long, 5-14 cm wide, oblong-elliptic to oblong-lanceolate, apically more or less abruptly acuminate, the acumen to 1 cm long, basally rounded or obtuse, sparsely puberulent above except tomentose near the midvein, beneath reddish-brown with stalked stellate trichomes and mi- nute appressed scales, primary veins 35-38 pairs, 0.5-1.1 cm apart, united into a marginal vein, petioles 2.2-3.5 cm long, ferrugineous-tomentose, grooved above. Inflorescence racemose, axillary from older defoliated nodes or terminal on young branchlets, ferrugineous-tomentose with abundant, minute stalked stel- late trichomes, 2-8 flowers per cm, rachis 15-30 cm long, pedicels 4-7 mm long. Flowers of unknown color; sepals 6-8 mm long, reflexed at anthesis, erect in fruit, mostly oblong-ovate or elliptic, rarely lanceolate, tomentose; petals not seen; stamens numerous, the anthers 0.6-1,2 mm long, the appendage tubular to somewhat rotate, minutely pitted and glandular; ovary ca. 4 mm long, style 1 mm or less long at anthesis, elongating in fruit. Fruit a linear fusiform black capsule 1.1-2 cm long; seeds ca. 1 mm long.
          originalLanguage: en
          sourceField: general
