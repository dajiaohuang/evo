        usage:
          title: Burmeistera dukei Wilbur, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Suffruticose sprawling herbs; branches puberulent. Principal leaves with blades elliptic, 4-15 cm long, 1.8-6.0 cm wide, ca. 2-3 times as long as wide, apically acute, basally cuneate, marginally shallowly and indistinctly repand with the slightly callose serrulations mostly 5-8 mm apart, glabrous on the upper sur- face, densely puberulent on the principal veins beneath; petioles 0.5-1.8 cm long, moderately to densely puberulous. Flowers 2.2-2.5 cm long; pedicels solitary in the upper leaf axils, spreading to ascendant, slender, moderately to densely pu- berulous, ebracteolate, 2.5-4 cm long; hypanthium in anthesis cylindric, spiculate to puberulous, basally acute, 4-5 mm long, 2.5-3.5 mm in diameter medially; calyx lobes oblong to lanceolate, acute to obtuse, denticulate, puberulent, 3.5-5 mm long, 2.5 mm wide; corolla moderately to densely puberulent, green, the tube 6-7 mm long and ca. 2.5 mm in diameter, the lobes linear to narrowly oblong, the up- per lobe 9-11 mm long, the lateral lobes, 6-8 mm long, the lowermost lobe about 5 mm long; filament tube glabrous or sparingly puberulent, 20-22 mm long, the anthers externally glabrous, 3-4 mm long, the lowest anther lightly pilose-fringed. Berries (immature) red.
          originalLanguage: en
          sourceField: general
