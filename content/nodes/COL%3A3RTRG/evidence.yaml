        metadataVariant: 0
        usage:
          title: Ladenbergia laurifolia Dwyer, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Trees to S m tall, the twigs terete, the bark grey when dry, lenticellate, the nodes well spaced, the scars of the pedicels oblong rotund, ca. 4 mm in diam. Leaves narrowly oblong or narrowly obovate oblong, 8-15 cm long, 3.0-4.3 cm wide, deltoid toward the apex, acuminate, the acumen triangular, to 0.6 cm long, obtuse, widely cuneate or obtuse at base, the costa prominulous above, sub- prominent beneath, dark red, the lateral veins ca. 10, subplane on both sides, arcuate, the submarginal vein undulate and inconspicuous, the margin lightly revolute; petioles lignose, rigid, glabrous, to 2 cm long; stipules deciduous. In- florescences terminal, to 11 cm long, golden puberulent, dark red when dry, the peduncle to 0.2 cm wide, the branches 3, terminating a small branch, the lateral branches shorter and with 3 secondary branches at the apex, the cymes few flowered, the middle branch similar to the lateral branches but with the cymes spreading and often on branches to 1.5 cm long; bracts oblong ovate, to 2 mm long, puberulent, the bracteoles deciduous, to 1 mm long. Flowers sessile; hy- panthium turbinate, ca. 4 mm long, densely sericeous, the calycine cup somewhat swollen, ca. 0.5 mm long, the lobes 5, widely triangular or ovate, 0.3-1.2 mm long, obtuse, carnose, glabrescent outside except at the base and the margins, red when dry, minutely punctate; corolla white, the tube narrowly hypocrateri- form, to 1 cm long, to 0.5 cm wide, densely sericeous outside, stiffly carnose, the lobes 5, oblong, to 1.2 cm long, to 0.3 mm wide, glabrous within; stamens 5, the anthers linear oblong, ca. 5 mm long, ca. 0.6 mm wide, obtuse, the filaments ca. 1 mm long, attached near the middle of the tube; ovarian disc cushion like, ca. 0.4 mm long, the style slender, ca. 1.5 cm long, the stigmas 2, linear oblong, ca. 2.2 mm long, puberulent(?), the ovules membranous, winged, plano com- pressed, oblong, ca. 0.3 mm long. Fruits not seen.
          originalLanguage: en
          sourceField: general
