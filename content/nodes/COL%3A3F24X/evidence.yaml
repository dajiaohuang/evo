          originalSourceText: Trailing or prostrate perennial vine, not rooting at the nodes; stems pubescent to tomentose with weak hairs to 1.5 mm long. Leaves pinnate trifoliolate; leaflets about equal or the lateral pair slightly shorter, symmetrical, ovate, mostly 3-6 cm long, 2-3 cm wide, apically obtuse, minutely emarginate and mucronulate, basally rounded, slightly discolorous, thin pilose with loose hairs, more so be- neath, often glabrescent above, the costa and 4 main veins on each side prominent beneath, often glabrescent above, the costa and 4 main veins on each side prom- inent beneath; petiolules ca. 2 mm long, often conspicuously 2-angled; foliar rachis 5-8 mm long; petiole mostly shorter than the leaflets; stipels glabrous, ca. 1 mm long; stipules 1-2 mm long, pilose. Racemes mostly solitary, lax, open, 5- 10 cm long, the peduncle and rachis pubescent; pedicels 1-2 mm long, 1-3 arising at a node, puberulent, the bracts ca. 1 mm long, cucullate, pubescent. Flowers 8-10 mm long, pink, mostly drying white, the calyx puberulent, deeply 4-fid, the lobes narrowly acute; corolla exserted ?2-?3 way from the calyx, the standard reflexed, glabrate, the wings about as long as the standard, broad; anthers linear, 0.6 mm long, versatile; ovary linear, tomentose, the style glabrous, the stigma minute. Legume flat, oblong, sometimes falcate, mostly 3-5 cm long, ca. 5 mm wide, the margins thick, straight or slightly undulate between the seeds when young, the persistent style forming a small beak, sessile in the calyx, softly pilose on the valves, and on the margins with minute straight whitish hairs, the valves separating and ultimately curling; seeds mostly 5-8, ovoid, oblique, 3.5-5.5 mm
