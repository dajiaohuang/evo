    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Annual; stem up to 30 cm, slender, often branched at the base. Basal leaves up to 4 cm, lanceolate, obtuse; cauline leaves ovate-lanceolate, the upper acute. Hairs on the stem patent below, appressed above; those on the pedicels often patent. Inflorescence not leafy at the base, many-flowered, lax below, dense above, pedicels shorter than calyx in fruit. Calyx up to 4.5 mm in fruit, rarely deciduous, with soft deflexed, hooked hairs. Corolla up to 4 mm; limb c. 1.3 mm in diameter, saucer-shaped, pale yellow or cream at first, becoming pink, violet or even blue; tube pale blue to dark violet. Nutlets c. 1.2 x 0.8 mm, dark brown, with a wide rim.
