        usage:
          title: Macroptilium gracile (Poepp. ex Benth.) Urb., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Perennial herb or vine, erect or sprawling; stems slender, wiry, with minute, white retrorse hairs on emerging, soon glabrous, terete; rootstock woody, en- larged. Leaves pinnate trifoliolate; leaflets linear, mostly 3-7 cm long, 2-5 mm wide, apically pointed or blunt, mucronulate, basally narrowed, truncate, rarely ovate and 7-8 mm wide, glabrous or sometimes scabrous above; petiolules in- conspicuous, ca. 1 mm long, yellowish, strigose; petioles slender, about as long as the terminal leaflet, strongly angled, minutely puberulent; stipels 0.5-1.0 mm long, scale-like; stipules subulate, pubescent, ca. 1 mm long. Inflorescences ter- minal, 20-25 cm long; peduncle slender, the nodes swollen, glandular; bracteoles and bracts subulate, ca. 1.5 mm long, ciliate; pedicels 1 mm long, ca. 2 mm long in fruit, disposed along the apex of the peduncle. Flowers red, purple or pink; calyx tubular, ca. 4 mm long, the teeth subequal, deltoid to subulate, much shorter than the tube, evenly minutely puberulent; standard 1.5 cm long, the keel spi- ralled. Legume linear, 3-5 cm long, ca. 2 mm wide; seeds (Standley & Steyer- mark) 2 mm long, shiny.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 5250
