    - subjectId: taxon:pelycosauria
      claimKind: scientific
      claimType: taxonomy
      statement: Brocklehurst and colleagues explicitly analyse “pelycosaurian-grade” synapsids as an early, non-crown sampling grade; the atlas therefore retains Pelycosauria only as a historical navigation grade, not a monophyletic ancestor taxon.
      confidence: medium
      confidenceRationale: The claim is limited to how the cited primary sampling study treats the historical grade. It does not convert diversity bins into an origin, duration or ancestor sequence.
      referenceLinks:
        - relation: supports
          referenceId: brocklehurst-2013-early-synapsids
          pages: 470–490
          quoteLocator: Abstract; Materials and methods; discussion of pelycosaurian-grade synapsids
    - subjectId: taxon:pelycosauria
      claimKind: scientific
      claimType: fossil-range
      statement: Pelycosauria is displayed at 308–260 Ma only as the review's historical pelycosaurian-grade sample, not a monophyletic taxon range. The interval is a source-bounded sample window, not a global FAD, LAD, divergence date, continuous occupancy claim or direct-ancestor assertion.
      confidence: medium
      confidenceRationale: Pelycosauria uses Brocklehurst, N.; Kammerer, C.F.; Fröbisch, J. (2013) because the cited pages and locator expose the sampled taxon, specimen or living sequence set. Confidence is medium and applies only to Early-synapsid family record sampled by Brocklehurst et al.; broader endpoints remain unclaimed.
      referenceLinks:
        - relation: supports
          referenceId: brocklehurst-2013-early-synapsids
          pages: 470–490
          quoteLocator: Abstract; Materials and methods; discussion of pelycosaurian-grade synapsids
        - relation: contextualizes
          referenceId: ics-2026-06
          pages: International Chronostratigraphic Chart v2026/06
          figure: Global chronostratigraphic scale
          quoteLocator: Numerical boundaries for named geological stages used to bound the source sample
  claim-rationales.zh:
    - 该主张仅限于所引一手取样研究如何处理这一历史等级，不把多样性分箱转换成起源时间、延续区间或祖先序列。
    - Pelycosauria 采用 Brocklehurst, N.; Kammerer, C.F.; Fröbisch, J.（2013）的论文，因为所引页码与定位符直接标示了研究采样的类群、标本或现生序列集合。中等置信度仅适用于 Early-synapsid family record sampled by Brocklehurst et al.；更宽泛端点保持未声明。
  claim-statements.zh:
    - Brocklehurst 等明确把“盘龙类级”合弓类作为早期、非冠群的取样等级来分析；因此图谱仅将 Pelycosauria 保留为历史导航等级，而不把它视为单系祖先类群。
    - Pelycosauria 仅以 308–260 Ma 展示为综述所采样的历史性“盘龙类等级”，并非单系类群范围。该区间是来源限定的样本窗口，不是全球首现、末现、分化日期、连续占据或直接祖先断言。
