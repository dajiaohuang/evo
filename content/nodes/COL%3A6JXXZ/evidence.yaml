    facets:
      morphology:
        status: partially-supported
        claims:
          - text: "Plants acaulescent, decumbent, 80-120 mm tall, up to 80-240 mm diam., solitary or proliferating from base and cluster-forming (3-5 heads). Roots succulent, 3-4 mm diam. Leaves (8-12 per rosette) rosulate, linear-lanceolate, linear or deltoid-lanceolate to 120-170 mm long, 22-38 mm broad at base, slightly falcate to falcate and ascending spreading, sometimes becoming patent; adaxial surface flat to becoming canaliculate, plane towards apex, matt dark green to greyish-green (becoming reddish during the dry season), densely white-tuberculate in obscure transverse bands; abaxial surface somewhat convex with a distinct eccentric keel, densely tuberculate, tubercles arranged in obscure transverse bands; margin denticulate, the tubercles 1-1.5 mm high, apex acute or subacute, sometimes acuminate, mucronate. Juvenile leaves distichous, lorate, patent to ascending; epidermis white-tuberculate; apex obtuse, mucronate. Inflorescence racemose, the raceme about 270 mm long, bearing 18-26 secundly arranged flowers (up to 2-6 flowers open at the same time). Perianth oblong, 35-38 mm long, stipitate for 4 mm; segments fused for margins of the inner 3 segments), sub-cylindrical, curved in the upper third (and with a slight constriction). Lower and upper half inflated to about 5-6 mm in diameter, orange-pink, upper half white with green striations; apices erect becoming erectly spreading, obtuse; margins of inner segments free and channelled for about 12 mm, diverging gradually towards apex. Stamens 28 mm long; anthers about 2 x 1 mm long, included or shortly exserted. Ovary oblong, 7 x 2.5 mm, green; style 25 mm long, stigma included or shortly exserted, curved upwards, minute. Capsule 18-30 mm long, narrow obovate, triangular in cross-section, obtuse at apex, 7-8 mm diam. Seeds 3.5-4 x 1.5-2 mm, black. Flowering time: November (late spring)."
