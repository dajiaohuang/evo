      ecology:
        status: partially-supported
        claims:
          - text: The rosettes of Gasteria barbae grow in crevices and on humus-rich ledges of mineral-poor acidic quartzitic sandstone rocks of the Table Mountain Series (Cape Supergroup) in dry Fynbos often in partial shade. Gasteria barbae has been recorded from a number of sites, always associated with steep coastal cliffs and north and north-west facing aspects. The vegetation consists of South Outeniqua Sandstone Fynbos. Adjacent and further north the habitat is fringed by dense Southern Coastal Forest. The cremnophilous habitat of Gasteria barbae is shared with associated succulent plants such as Aloe arborescens, Litanthus pusillus (Drimia uniflora), Crassula perforata, C. nudicaulis, C. rubricaulis, C. lanceolata, Curio crassulifolius (Senecio crassulaefolius) and Bulbine latifolia. Non-succulent associated plants include Erica speciosa and Polygala myrtifolia and Phylica sp.
