          - text: Differs from G. batesiana by its ascending spreading densely white-tuberculate leaves 120-170 x 22-38 mm, and denticulate margin with tubercles 1-1.5 mm. Gasteria barbae grows prolifically from the base, solitary or forming small clusters. It is at once distinguished from G. batesiana by its matt grey-green ascending, patent leaves and different flowers. The leaves of Gasteria barbae are very brittle and detached leaves are commonly found in habitat, most of which form roots and new plantlets, a vegetative propagation ‘back-up’ commonly associated with cliff-dwelling succulent plants. To the east and west of our new species, Gasteria acinacifolia, a much larger related species with smooth adult leaves and a spreading paniculate inflorescence, grows mostly associated with sandy dune vegetation. To the north, Gasteria polita, another Fynbos species, grows on steep hilly terrain bearing smooth leaves and shorter flowers.
