    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Rhizomatous perennial to 20 cm, roots slender with fusiform, apical swelling. Leaves 1 or 2, lanceolate, tough, scabrid. Flowers in an unbranched, inclined raceme on hairy pedicels, white, peduncle pubescent. Fruits densely scabridulous.
            textZh: Trachyandra montana J.C.Manning & Goldblatt 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13858_0
            locator: "SANBI/WFO archive Morphology row 8979; source identifier 13858.0; cited publication: Manning, JC; Goldblatt, P. 2012. Asphodelaceae: Trachyandra Kunth. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 78 - 80. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Closely allied to T. hirsutiflora, both characterized by unbranched, cylindrical inflorescences with densely hairy scapes lacking sterile bracts, firm-textured and striate, scabrid leaves, and pubescent capsules. Trachyandra montana is distinguished by its distinctive roots, which are initially slender and only develop fusiform tubers some distance along their length, by its two (or rarely just one) plane leaves 5-10 mm wide, surrounded at the base with chestnut brown cataphylls, its rather lax and inclined inflorescence, and its relatively small capsules 6-7 mm long. Trachyandra hirsutiflora, in contrast, has roots that taper from a swollen base, (2)3-5 linear-canaliculate leaves (1-)2-5(-8) mm in diameter surrounded at the base by translucent cataphylls, typically a dense, stiffly erect inflorescence, and characteristically large capsules (8-) 10-15 mm long.
            textZh: SANBI 条目提供了 Trachyandra montana J.C.Manning & Goldblatt 的鉴别特征。
            sourceIds:
              - sanbi_6905_0
            locator: "SANBI/WFO archive Diagnostic row 84509; source identifier 6905.0; cited publication: Manning, JC; Goldblatt, P. 2007. Asphodelaceae: Trachyandra arenicola and T.montana, two new species from South Africa. Bothalia 37(1): 26 - 31. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
