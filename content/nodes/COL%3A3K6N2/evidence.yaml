    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Mat-forming perennial herb, main stems stoloniferous, rooting and branching freely, producing numerous leaf rosettes, flowering stems decumbent then erect, 300-400 mm long, simple, silvery sericeous, appressed-leafy. Radical leaves rosetted, mostly 40-100 x 3-10 mm, linear-lanceolate, apex obtuse or subacute, base broad, clasping, upper surface with thin 'tissue-paper' indumentum, lower white silky-felted; cauline leaves much reduced, ±10-30 x 1.5-3 mm, degenerating upwards into bracts, linear or linear-lanceolate, acute to acuminate, enveloped in silky indumentum webbed to the stem, only leaf tips free. Heads homogamous, ±5 x 2 mm, many lightly webbed together in a very congested, terminal, cymose cluster ±15-25 mm across. Involucral bracts in ±3 series, loosely imbricate, outer shorter, pellucid, tips light brown, inner subequal, equalling flowers, tips very obtuse, canary-yellow, not radiating. Receptacle shortly honeycombed. Flowers 7-10. Achenes 1 mm long, glabrous. Pappus bristles many, shortly plumose in upper half, bases nude, not cohering.
            sourceIds:
