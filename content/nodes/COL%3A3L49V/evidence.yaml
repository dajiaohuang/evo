            locator: "SANBI/WFO archive Morphology row 98610; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Distinctive in the marshy habitat, unique for the genus, and also stands out in its tall stature, up to 480 mm high, the long, linear, soft-textured leaves, and the unusually lax spikes of only one to three flowers. The flowers are white with the outer tepals coloured grey-brown in the middle section and the tepals are narrowly elliptic, ± 16 x 4 mm. Flowers open after dark, 19:00 and appear unscented or at best weakly scented. The capsules are unusually large, up to 14 mm long. Hesperantha palustris is perhaps most closely related to the widespread H. cucullata, a shorter species with firm to almost leathery leaves and the outer tepals of the white flowers usually bright, glossy red outside, with the dark pigment usually covering the entire outer surface. Flowers of H. cucullata open well before sunset, mostly 16:00-16:30, and then produce a strong, sweet odour. The tepals are relatively broader than in H. palustris, usually 12-16 mm long and at least a third to nearly half as wide.
