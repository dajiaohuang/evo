    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Perennial, up to 100 mm tall; base covered in broad scales. Leaves apparently succulent, strongly sickle shaped and recurved backwards, tip rounded with a minute spine; ligule a fringe of hairs. Inflorescence a raceme, rarely a panicle. Spikelets 10-15 mm long, many-flowered; glumes longer than spikelet, rounded, flat, but 2-keeled at least below, 5-7-nerved; lemma hairy all over, plus 2 small tufts of hairs on either side of central awn and large tufts on margins; lobes awnless, rarely a tiny awn present, central awn 4-7 mm long, bent, twisted below; callus rounded to obtuse.
