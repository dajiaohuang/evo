    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Perennial rosulate herbs; flowering stems elongate, procumbent or erect with smaller more distant leaves. Leaves up to 3.5 cm long and 2.8 cm broad, suborbicular, obovate, obovate-elliptic to almost spathulate, rounded or obtuse, cuneate at the base, the upper leaves smaller, narrower and often acute. Inflorescence of few to several-flowered cymes in a rather lax corymb, or the younger ones subdense and head-like; bracts ovate or elliptic, the upper ones much reduced, thin. Calyx of 5 segments, each 4.75-8 mm long, 1.25-3 mm broad, lanceolate to narrowly ovate or obovate, acute, mucronate, the side hyaline, joined for 0.5-0.75 mm, keeled or with a thick keel-wing up to 0.5 mm broad. Corolla yellow; tube 4.5-8 mm long; lobes 4.5-12 mm long, 2.25-5 mm broad, spathulate-oblanceolate to ovate-oblong or obovate, clawed, rounded, sometimes apiculate. Filaments 0.3-1.75 mm long, inserted in or just below the corolla-sinuses; anthers 1.5-3 mm long, each with an 0.5-1 mm long pale yellow (when dry) oblong or somewhat conical apical gland and 2 small stipitate basal glands or with 2 red basal gland-dots. Style and stigma 4.5-8 mm long, without a stigmatic swelling or with a swelling below the middle; stigma capitate or clavate, 2-lobed.
            sourceIds:
