            locator: "SANBI/WFO archive Morphology row 62315; source identifier 15530.0; cited publication: Fish, L. 2015. Panicum L. In: L Fish, AC Mashau, MJ Moeaha & MT Nembudani (eds), Identification guide to the southern Africa grasses. An identification manual with keys, descriptions and distributions, Strelitzia 36: 472 - 496. South African National Biodiversity Institute, Pretoria. [CC BY]"
