        claims:
          - text: Tufted perennial (300-)600-2300 mm high, erect to geniculate, often flushed purple; basal sheaths glabrous, sometimes sparsely hispid; culm usually stout, base (2.0-)3.5-7.0 mm wide. Leaf blade 130-500 x 3-12 mm. Inflorescence 80-150 mm long. Spikelet 2.0-2.5 mm long; glumes and lower lemma apices green with purple; glumes acuminate to mucronate, recurved; lower glume up to 2/3 the spikelet length; upper glume 5-7-nerved; lower floret male, lemma 5-nerved, palea well developed; upper lemma pale, smooth and shiny.
            textZh: Panicum fluviicola Steud. 的 SANBI 物种条目记录了形态特征。
