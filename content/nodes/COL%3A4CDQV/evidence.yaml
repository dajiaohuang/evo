            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Barely distinct from P. graniflorum, which has spikelets congested on short branches, culms slender and 1-2 mm wide at the base; P. genuflexum, which has sparsely branched inflorescences with long flexuous branches; and P. dregeanum, which has basal sheaths silky pubescent.
