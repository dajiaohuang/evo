    facets:
      morphology:
        status: partially-supported
        claims:
          - text: "Plants (150-)250-500 mm high, stem simple or 1-branched, with short scale ± 1 mm long, inserted 25-40 mm below base of spike, sheathed basally by green, leathery to firm, dry cataphylls. Corm 8-10 mm diam., tunics of fine, soft fibres sometimes extending upward in a weakly developed collar. Leaves (2)3(4), lower (1)2 or 3 with linear to narrowly sword-shaped blades, ± 1/3 as long to reaching top of stem, 1.5-4.0 mm wide, upper leaf largely sheathing, with short free blade. Spike slightly flexuose, (2-)5-9(-12)-flowered; bracts membranous, becoming dry from tips, 4-5 mm long, outer 1- or 3-veined, irregularly 2-3(-5)-lobed or shortly toothed, inner often slightly longer than outer, 2-veined and 2-toothed. Flowers rotate, upright, pink to light red-purple, rose-scented; perianth tube filiform, 3-4 mm long; tepals spreading, ± ovate, mostly 12-15 xx 6-7 mm. Stamens symmetrically arranged, erect; filaments inserted at mouth of tube, filiform, 1.0-2.8 mm long; anthers oblong, 2.0-2.3 mm long, yellow, thecae acute and recurved at base, usually dehiscing longitudinally from base almost to apex. Style dividing at or up to middle of filaments, style branches 1.5-2.0 mm long, falcate, tubular with expanded ciliate, stigmatic tips, sometimes shortly forked apically. Flowering time: mostly Jul.-early Dec."
            textZh: Ixia confusa (G.J.Lewis) Goldblatt & J.C.Manning 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_15933_0
            locator: "SANBI/WFO archive Morphology row 85210; source identifier 15933.0; cited publication: Goldblatt, P; Manning, JC. 2012. Systematics of the southern African genus Ixia (Iridaceae): 4. Revision of sect. Dichone. Bothalia 42(2): 87 - 110. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Both I. micrandra and closely related I. minor (= I. micrandra var. minor G.J.Lewis) have corms with finely fibrous tunics that extend upward in a collar around the base of the stem, terete to subterete or linear leaves mostly 1.0-1.5 mm at widest, and spikes of up to 6 flowers. I. confusa has corms with similar finely fibrous tunics, sometimes without a collar of fibres around the base, but plane leaves 1.5-4.0 mm wide, and spikes with as many as 12 flowers. I. micrandra has anthers 3-4 mm long, and slender, ± straight, ascending style branches 3-4 mm long, thus quite different from the shorter anthers, ± 1.0-2.5 mm long, and falcate style branches 1.5-2.5 mm long of I. confusa. The style branches of I. confusa match those of I. minor but the terete or subterete leaf blades, flattened filaments and consistently few-flowered spikes of the latter immediately separate them. Ixia confusa may also be confused with the new I. bifolia but this species has a single, relatively broad, leathery-succulent foliage leaf and flowers with shorter filaments ± 1 mm and longer, straight style branches ± 4 mm long. Both the filaments and style branches of I. bifolia are dark pink and dry dark purple, unlike the pale filaments and style branches of I. confusa, which dry to a pale, almost colourless state. Annotations by G.J. Lewis on collections of Ixia confusa from the Swartberg indicate that at one time she considered these populations a separate species, which she intended to call I. aestivalis, in part because of their late flowering, from late October to early December. We find that collections from the Swartberg also differ in having slightly shorter filaments, 1-2 mm long, than typical I. confusa (1.5-2.8 mm long), the style sometimes dividing above the mouth of the perianth tube (opposite the middle of the filaments in Goldblatt 7962), and anther dehiscence sometimes not reaching the middle of the thecae. The plants have a small, translucent scale and prophyll on the upper part of the stem, a feature occasionally present in southern populations of I. confusa. Additional study may show that the later-flowering Swartberg populations merit separate taxonomic status but we find no consistent character differences between them. There seems no current threat to the species and we agree with Raimondo et al.'s (2009) (LT, as I. micrandra var. confusa), Least Threat conservation status.
            textZh: SANBI 条目提供了 Ixia confusa (G.J.Lewis) Goldblatt & J.C.Manning 的鉴别特征。
            sourceIds:
              - sanbi_15933_0
            locator: "SANBI/WFO archive Diagnostic row 84449; source identifier 15933.0; cited publication: Goldblatt, P; Manning, JC. 2012. Systematics of the southern African genus Ixia (Iridaceae): 4. Revision of sect. Dichone. Bothalia 42(2): 87 - 110. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Recognised by the spikes mostly with 5 to 9 small pink flowers with a perianth tube 3-4 mm long and tepals 12-15 mm long and narrow, plane leaves up to 4 mm wide. Both I. micrandra and closely related I. minor have terete to subterete or linear leaves mostly 1.0-1.5 mm at widest, and spikes of 2 to 4, rarely up to 6 flowers. Ixia micrandra has anthers 3-4 mm long, and slender, ± straight, ascending style branches 3-4 mm long, thus quite different from the shorter anthers, ± 1.0-2.5 mm long, and falcate style branches 1.5-2.5 mm long of I. confusa. The falcate style branches of I. confusa match those of I. minor but the terete or subterete leaf blades, flattened filaments and consistently few-flowered spikes of the latter immediately separate them. Leaf number is variable in I. confusa, usually three but sometimes two or four, whereas I. micrandra and I. minor always have two leaves. Ixia confusa may also be confused with I. bifolia but this species has a single, relatively broad, leathery-succulent foliage leaf and flowers with shorter filaments ± 1 mm long, and longer, straight style branches ± 4 mm long. Both the filaments and style branches of I. bifolia are dark pink and dry dark purple, unlike the pale filaments and style branches of I. confusa, which dry to a pale, almost colourless state. Populations of Ixia confusa in the Swartberg stand out in having slightly shorter filaments, 1-2 mm long, than typical I. confusa (up to 2.8 mm long), the style sometimes dividing above the mouth of the perianth tube, often opposite the middle of the filaments, and anther dehiscence sometimes not reaching the middle of the thecae. The plants have a small, translucent scale and prophyll on the upper part of the stem, a feature occasionally present in southern populations. Additional study may show that the later-flowering Swartberg populations merit separate taxonomic status.
