        claims:
          - text: Cormous geophyte, 15-25 cm. Leaves sword-shaped. Flowers almost actinomorphic, rotate, with unilateral stamens and style, orange, often with dark marks on outer tepals.
            textZh: Tritonia deusta (Aiton) Ker Gawl. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 6870; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: "Recognised by the bright orange, bowl-shaped flowers with a star-shaped yellow marking in the throat, often outlined with red. The prominent yellow throat or gullet and the lack of hyaline zones along the margins of the tepal claws separates Tritonia deusta from both orange-flowered T. crocata and pink-flowered T. squalida. It is often also smaller in stature and flower size than either of these species. Hybrids are recorded with both T. crocata and T. squalida. Tritonia deusta varies in the number, size and shape of the dark markings on the tepals: populations west of Swellendam typically lack dark markings on the outer tepals, although unmarked plants are also found further east, whereas plants east of Swellendam mostly have a prominent dark reddish black blotch at the base of the outer tepal limbs. The prominently marked forms conform to the type of the species."
            textZh: SANBI 条目提供了 Tritonia deusta (Aiton) Ker Gawl. 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 94794; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
