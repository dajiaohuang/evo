    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants leafless, climbing; stem greenish-brown, cylindrical and succulent-fleshy, up to 20 mm in diameter, with a channel on either side; vestigial leaves membranous, brown, up to 30 mm long. Inflorescences terminal or axillary, up to 200 mm long, with up to 35 flowers. Flowers white, lip white with a pink throat; ovary short and erect at first, lengthening later. Sepals and petals lanceolate-oblong, apiculate, up to 80 mm long. Lip entire, obtuse, up to 80 mm long and 45 mm broad, forming a funnel with the gynostemium, lamina with an irregular crest. Gynostemium up to 25 mm long; anther operculate; stigma in a cavity. Capsules pendulous, up to 175 mm long.
