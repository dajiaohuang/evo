  claims:
    - subjectId: event:jurassic-mammaliaform-jaw-ear-load-shift
      claimKind: scientific
      claimType: event-mechanism
      statement: Jaw and postdentary anatomy in Dianoconodon IVPP V4257 and Feredocodon IMMNH-PV01925 supports a comparative reduction of articular–quadrate load-bearing before complete middle-ear detachment, but function is inferred and the specimens are not an ancestor–descendant pair.
      confidence: medium
      confidenceRationale: The named fossils, detailed anatomy, MorphoBank matrix and archived analyses support comparison. Medium confidence separates anatomical observation from biomechanical and auditory interpretation and rejects a linear transition assembled from separate lineages and horizons.
      referenceLinks:
        - referenceId: mao-2024-jaw-middle-ear
          relation: supports
          pages: 576–581
          figure: Figures 1–4; Extended Data Figures 1–9
          quoteLocator: Cranial morphology; Jaw joint and middle ear; Discussion; Methods
  claim-rationales.zh:
    - 具名化石、详细解剖、MorphoBank 矩阵与归档分析支持比较。中等置信度把解剖观察同生物力学和听觉解释分开，并拒绝用不同时代和谱系拼成线性转型。
  claim-statements.zh:
    - Dianoconodon IVPP V4257 与 Feredocodon IMMNH-PV01925 的颌部和齿骨后区解剖支持中耳完全脱离前关节骨—方骨承重相对减弱，但功能属于推断，两件标本也不是祖先—后代配对。
