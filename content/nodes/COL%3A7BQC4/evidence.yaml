          originalSourceText: Leaves pinnate trifoliolate; leaflets ovate, mostly 4-8 mm long, 1.5-3.5 mm wide, the lateral leaflets slightly smaller, apically obtuse, mucronulate, basally obtuse, discolorous, sparingly sericeous above, densely so beneath; petiolules ca. 2 mm long, tomentose; rachis mostly 3-5 mm long, petiole mostly 2-3 cm long; stipels subulate, about as long as the petiolules; stipules narrow, sericeous, ca. 2 mm long. Inflorescences weak axillary racemes, to 15 cm long; peduncle pilose; brac- teoles 1-2 mm long, subtending the calyx; bracts 1-2 mm long, narrow; pedicels 1-2 mm long, relatively stout, mostly well spaced. Flowers small, inconspicuous, purplish or whitish; calyx sericeous, tubular, the tube ca. 2 mm long, the 5 teeth subulate, subequal, ca. 2 mm long, enclosing most of the corolla; standard ob- ovate. Legume linear, straight or slightly curved, somewhat compressed, 4-7 cm long, partitioned between the seeds sericeous to hispid 2-4 mm wide, the beak 2-3 mm long, abruptly upturned; seeds ca. 3 mm long, reddish brown, plump, rectangular, lustrous.
          originalLanguage: en
          sourceField: general
