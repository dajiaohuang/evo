    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Bulbous geophyte, 150-280 mm tall, in clumps. Leaves 2, dry at flowering, erect, lanceolate, smooth, shiny green, without markings. Flowers in a compact head, bracts red to pale carmine.
            textZh: Haemanthus graniticus Snijman 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_14528_0
            locator: "SANBI/WFO archive Morphology row 32838; source identifier 14528.0; cited publication: Snijman, DA. 2013. Amaryllidaceae. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 33 - 42. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Haemanthus graniticus is distinguished by a combination of floral and vegetative characters. The peduncle is unmarked and the umbel compact, surrounded by 6-7 erect, thin-textured, lanceolate spathe valves. The flowers and spathe valves vary from deep red to pale carmine. The leaves are erect, lanceolate, shiny green and glabrous on both surfaces; only sometimes barred with red at the base of the abaxial surface. The bulb is well-covered with brown withered tunics, while the inner tunics, which die back obliquely, turn dark pink if exposed to light. In the vegetative phase H. graniticus is particularly difficult to distinguish from H. amarylloides subsp. polyanthus since both have very similar leaves and habitat preferences. Bulbs of H. graniticus were first collected near Wildepaardehoek Pass and the Kamiesberg in the winter months of 1980. At the time, the bulbs evoked no special interest as they were presumed to belong to the species H. amarylloides subsp. polyanthus. Only on returning to the Kamiesberg in March the following year, when the bulbs were seen to have brilliant red inflorescences, did it become apparent that they belonged to a new species. Close inspection revealed H. amarylloides subsp. polyanthus growing close by; but while H. graniticus was in full bloom, the pink inflorescences of H. amarylloides subsp. polyanthus were just beginning to appear above ground, thus forming a partial barrier between the two populations.
            textZh: SANBI 条目提供了 Haemanthus graniticus Snijman 的鉴别特征。
            sourceIds:
              - sanbi_11889_0
            locator: "SANBI/WFO archive Diagnostic row 44934; source identifier 11889.0; cited publication: Snijman, DA. 1984. A revision of the genus Haemanthus L. (Amaryllidaceae), Vol. Suppl. NBG, Cape Town. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
