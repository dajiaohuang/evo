          - text: "Like Ixia micrandra, I. minor has a slender, usually unbranched stem, small corms with fine, netted tunics that extend upward in a collar around the base, and a dry, often brown, upper cataphyll. The critical differences between the two species lie in their flowers. Ixia minor has flattened, ± wedge-shaped to oblanceolate filaments abruptly narrowed and kinked at the tips, and shorter and broader anthers, often not dehiscing to the apex. The style branches are also shorter, 2-3 mm long, wider, and strongly arched whereas those of I. micrandra are more-or-less straight and (2)3-5 mm long. To these microscopic details can be added a brighter pink perianth. Flowers of I. micrandra have pale pink to purple-pink tepals, straight, filiform filaments and longer, oblong anthers dehiscing to the apex. The leaves of the two species also differ somewhat: those of I. minor are subterete to oval in section, thus when alive without margins or evident central vein, whereas I. micrandra has plane, linear leaf blades with slightly thickened margins and, when dry, a visibly raised main vein. Evidence for their separation is provided by collections of both species made in the Houw Hoek Mtns flowering on the same date and visibly different in appearance."
