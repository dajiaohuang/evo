            locator: "SANBI/WFO archive Morphology row 85212; source identifier 15933.0; cited publication: Goldblatt, P; Manning, JC. 2012. Systematics of the southern African genus Ixia (Iridaceae): 4. Revision of sect. Dichone. Bothalia 42(2): 87 - 110. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: "Ixia minor, treated as var. minor of I. micrandra by Lewis (1962) but raised here to species rank, is evidently closely allied to the more widespread I. micrandra, with which it is easily confused unless floral details are examined carefully. Both share a slender, usually unbranched stem, small corms with fine, netted tunics that extend upward in a collar around the base, and a dry, often brown, upper cataphyll. The critical differences between the two species lie in their flowers: I. minor has flattened, ± wedge-shaped to oblanceolate filaments abruptly narrowed at the tips, shorter and broader anthers, often not dehiscing to the apex and kinked at the base with the bases of the thecae turned inwards and touching, and shorter, wider, strongly arched style branches slightly compressed and narrowed at the tips. To these microscopic details can be added a deep pink to purple-pink tepals, linear filaments, longer, oblong anthers dehiscing to the apex and longer, more slender style branches, ± straight to slightly arched.Annotations by G.J. Lewis on collections of Ixia confusa from the Swartberg indicate that at one time she considered these populations a separate species, which she intended to call I. aestivalis, in part because of their late flowering, from late October to early December. We find that collections from the Swartberg also differ in having slightly shorter filaments, 1-2 mm long, than typical I. confusa (1.5-2.8 mm long), the style sometimes dividing above the mouth of the perianth tube (opposite the middle of the filaments in Goldblatt 7962), and anther dehiscence sometimes not reaching the middle of the thecae. The plants have a small, translucent scale and prophyll on the upper part of the stem, a feature occasionally present in southern populations of I. confusa. Additional study may show that the later-flowering Swartberg populations merit separate taxonomic status but we find no consistent character differences between them. There seems no current threat to the species and we agree with Raimondo et al.'s (2009) (LT, as I. micrandra var. confusa), Least Threat conservation status."
