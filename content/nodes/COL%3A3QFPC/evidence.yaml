    facets:
      morphology:
        status: partially-supported
        claims:
          - text: "Plants 200-300 mm high, stem unbranched, sheathed by membranous to dry, brown cataphylls at base. Corm 8-10 mm diam., tunics of fine fibres extending upward as a collar, often in a dense mass. Leaves 2, lower 1 ± basal, upper 1 sheathing stem in lower 1/2 to 2/3, free distally for short distance, blades ± terete or oval in section, up to 1 mm diam., main vein evident only when dry. Spike erect, straight, mostly 2-4-flowered, bracts membranous, translucent, usually flushed purple, outer 5-7 mm long, usually prominently 3-veined, shallowly 3-lobed to acutely 3-toothed, inner bract ± as long as or slightly longer than outer, 2-veined and 2-lobed or 2-toothed. Flowers rotate, bright pink to mauve pink; perianth tube filiform, 3-5 mm long, clasping style; tepals spreading, ovate-elliptic, 12-14 x 5-6 mm. Stamens symmetrically arranged, erect, filaments flattened, ± lanceolate but narrowed and kinked at tips, inserted at mouth of tube, ± white, 1.0(-1.5) mm long, anthers ovoid, ± 1.0 mm long, erect, yellow, thecae acute but abruptly incurved and touching at base, dehiscing fully by longitudinal slits, often more widely at base, yellow. Style dividing opposite base to middle of filaments, branches up to 2 mm long, involute, tubular-falcate, ± compressed, narrowed at tips, stigmatic apically, white. Flowering time: late Jul.-mid-Sept., rarely later."
            textZh: Ixia minor (G.J.Lewis) Goldblatt & J.C.Manning 的 SANBI 物种条目记录了形态特征。
            sourceIds:
