      statement: Diplodocidae is represented by Tschopp and colleagues’ specimen-level matrix and explicit criteria for revising genera and species; the operational taxonomy is analysis-dependent and not a complete fossil-range audit.
      confidence: medium
      confidenceRationale: The study scores individual specimens and states quantitative referral thresholds, but several referrals change with missing data and tree position.
      referenceLinks:
        - referenceId: tschopp-2015-diplodocidae-revision
          relation: supports
          pages: 3:e857
          figure: Figures 113 and 117–118; Appendices 1–3
          quoteLocator: Specimen-level methods; phylogenetic results; operational taxonomic criteria
    - subjectId: taxon:diplodocidae
      claimKind: scientific
      claimType: fossil-range
      statement: Diplodocidae is displayed at 168–125 Ma only as the broad stage envelope of the revision's specimen sample, not a claim of continuous occupancy or exact family endpoints. The interval is a source-bounded sample window, not a global FAD, LAD, divergence date, continuous occupancy claim or direct-ancestor assertion.
      confidence: medium
      confidenceRationale: Diplodocidae uses Tschopp, E.; Mateus, O.; Benson, R.B.J. (2015) because the cited pages and locator expose the sampled taxon, specimen or living sequence set. Confidence is medium and applies only to Diplodocid specimens included in the Tschopp et al. revision; broader endpoints remain unclaimed.
      referenceLinks:
        - relation: supports
          referenceId: tschopp-2015-diplodocidae-revision
          pages: 3:e857
          figure: Figures 113 and 117–118; Appendices 1–3
          quoteLocator: Specimen-level methods; phylogenetic results; operational taxonomic criteria
