    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Perennial herb, stock slender (±4 mm diam.), probably rhizomatous, flowering stem erect to ±750 mm, solitary or paired, simple, glandular-hairy, thinly woolly as well, leafy in lower part, becoming pedunculoid upwards. Radical leaves few, 130-250 x 25-50 mm, roughly half the length petiolar, blade broadly elliptic, apex acute, base suddenly then gradually narrowed into the petiolar part, expanded and clasping below, both surfaces glandular-pilose, lower thinly white-woolly as well, 5-nerved; cauline leaves similar, rapidly becoming smaller, narrower and sessile, and passing into a few distant, lanceolate-acuminate bracts. Heads homogamous, cylindric-campanulate, 4 x 3 mm, many in crowded clusters webbed together with wool, forming a very compact corymbose compound head. Involucral bracts in ±4 series, subequal, closely imbricate, equalling the flowers, not radiating, subpellucid, straw-coloured or pale golden-brown. Receptacle with large fimbrils exceeding the ovaries. Flowers ±9-13. Achenes not seen, ovaries glabrous. Pappus bristles many, scabrid, bases cohering by patent cilia, sometimes light fusion as well.
            sourceIds:
              - sanbi_9268_0
            locator: "SANBI/WFO archive Morphology row 48904; source 9268.0; publication: Hilliard, OM. 1983. Gnaphaliinae (first part): Facelis - Edmondia, Fl. S. Africa 33(7,2): 1 - 317. Botanical Research Institute, Department Agriculture, Pretoria. [http://www.biodiversitylibrary.org/item/209547#page/5/mode/1up]. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Easily overlooked, despite its size, because it somewhat resembles the common H. nudifolium; readily distinguished, however, by its soft-textured leaves and small heads with brownish involucral bracts.
