    facets:
      morphology:
        status: partially-supported
        claims:
          - text: "Plants several-stemmed. Leaves erect to ascending, rigid, strongly nerved, 300-700 x 8-14 mm, U-shaped in cross section (not keeled), channelled above; margin serrulate; nerves prominent on lower surface, often with scattered papillae on nerves. Scape subequal to leaves, 300-600 mm tall. Raceme subcylindrical to ovoid, dense, 80-140 x 50-60 mm; buds orange or pale orange-red to coral, becoming yellow to greenish yellow as flowers open. Bracts ovate to ovate-lanceolate, 7-10 mm long; apex rounded to acute; margin eroso-denticulate. Pedicels 1.5-3.0 mm long, elongating to 6 mm long in fruit. Perianth sub-cylindrical, 27-33 mm long; lobes ovate, 3 mm long, slightly spreading. Stamens exserted by 0-8 mm at anthesis. Fruit subglobose, 7-9 mm long. Flowering time: mid-January to early March."
            textZh: Kniphofia stricta Codd 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_6616_0
            locator: "SANBI/WFO archive Morphology row 48667; source identifier 6616.0; cited publication: Codd, LEW. 2005. Asphodelaceae (First part): Kniphofia, Fl. S. Africa 5(1,2): 1 - 94. South African National Biodiversity Institute, Pretoria. [http://www.biodiversitylibrary.org/item/209560#page/3/mode/1up]. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: The leaves of K. stricta are U-shaped in cross section, rigid, erect and strongly nervose, often with the margins tending to be inrolled. When herbarium specimens are prepared, the leaves become flattened and the characteristic shape is not always apparent. Along the nerves there are often minute papillae, making the leaf surface scabrid to the touch, which may lead to confusion with the following species, K. hirsuta, in which the leaves are hispid and V-shaped in cross section.
