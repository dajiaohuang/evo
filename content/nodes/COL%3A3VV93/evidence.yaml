          title: Loeselia glandulosa (Cav.) G.Don, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrubs, annual but often suffrutescent, to ca. 1 m high; stems pubescent. Leaves few on flowering plants, lanceolate to ovate, sharply serrate, 1-2.5 cm long and 0.8-1.2 cm wide, acute, attenuate, obtuse to truncate basally, charta- ceous, densely pubescent above, pubescent on the veins below, venation obscure above, prominent below; petioles slender, ca. 3-4 mm long including the attenuate portion, pubescent. Inflorescences thyrsiform, with verticils clustered on lateral branches. Flowers subsessile; sepals tubular, slightly irregular, lanceo- late; corolla blue to purplish, more or less salverform, ca. 8 mm long, glabrous, the free lobes subspathulate, ca. 5 mm long; stamens 5, the filaments white, ca. 6 mm long, the anthers ca. 1 mm long, versatile; ovary ovoid, glabrous, the style ca. 8 mm long, glabrous, the stigmas filiform, 0.5 mm long. Capsules not seen.
