        claims:
          - text: Bulb from about 7 to 12 cm long, 4-8 cm diam., produced into a neck about 4-9 cm long. Leaves linear, usually deeply troughed, firm, 20-50 cm long or longer, 4-14 mm broad, margin ciliate with minute teeth. Peduncle mostly underground, about 5 cm long. Spathe-valves 9-13 cm long, 0.8-1.2 cm broad at the base, narrowing gradually towards the obtuse apex, more or less erect, the basal part encasing the basal portion of the flower; bracteoles narrowly linear, 5-8 cm long. Umbel 1-2-flowered, rarely 3-flowered. Pedicels 0 or very short. Perianth funnel shaped, with the tube about 10 cm long; segments white with a pink flush, usually keeled with deep pink, 10-12 cm long, the inner about 2.5 cm broad, the outer slightly narrower, conniving to form a funnel with only the upper third spreading to slightly recurved; apical peak on the inner segments very short, about 1 mm long, on outer up to 5 mm long. Fruit beaked.
