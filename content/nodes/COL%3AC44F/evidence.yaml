    facets:
      morphology:
        status: partially-supported
        claims:
          - text: "Succulent, perennial tree; caulescent. Stems up to 5 m long, simple, rarely forked high up, erect, densely covered with persistent dried leaves. Leaves with blade narrowly ovate-ensiform, ± 1 m long; margins with stout, pungent, deltoid, reddish to brownish teeth, dull green, sometimes reddish tinged, without spots, with scattered, reddish brown, pungent spines. Flowers: inflorescence much branched, up to 1 m high, with cylindrical, rather truncate, fairly erect, dense racemes; floral bracts 4-5 mm long; stamens and stigma well exserted; perianth ± 32 mm long, slightly decurved, yellow to golden-yellow; Jul., Aug."
            textZh: Aloe spectabilis Reynolds 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_16260_0
            locator: "SANBI/WFO archive Morphology row 70675; source identifier 16260.0; cited publication: Klopper, RR; Smith, GF. 2017. Asphodelaceae. In: E Retief & NL Meyer (eds), Plants of the Free State: Inventory and identification guide, Strelitzia 38: 851 - 867. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: A. spectabilis cannot be distinguished from A. marlothii when not in flower. In inflorescence characters, however, they differ sufficiently to merit specific distinction. In A. spectabilis the racemes are erect or sub-erect, 25 cm long, and rather truncate, with the flowers evenly distributed around the axis, while in A. marlothii, racemes are almost horizontally disposed, longer and narrower, with the flowers markedly secund. Another difference is that in A. spectabilis the exserted portion of the filaments is orange, with the apices of the inner segments dull to deep glossy black; in some flowers the inner segment apices almost appear as if they had been tipped with glossy black enamel. In A. marlothii the inner segment apices, and also the exserted portion of the filaments, are light to deep purple. It is clear that A. spectabilis grades through intermediates into A. marlothii, and in several localities one finds plants showing characters of both species. There is a gradual transition from shorter erect or sub-erect racemes, to longer more horizontal racemes, but neither A. spectabilis nor A. marlothii grades through intermediates to the more southern species A. candelabrum, which has much longer erect racemes.
            textZh: SANBI 条目提供了 Aloe spectabilis Reynolds 的鉴别特征。
