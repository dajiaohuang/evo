    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants mat-forming and pendent from cliff faces with stems to 500 mm long forming loose clusters. Roots fibrous. Branches 1.8-2 mm in diameter, soft, brittle, terete, at first reddish green becoming grey-green; internodes 12-15(-30)mm apart, surface glabrous, or with scattered hairs when young. Leaves fleshy, dorsiventrally compressed, ovate, narrow ovate to linear ovate, occasionally elliptic to linear oblanceolate, slightly cymbiform and with an obscure keel, 25-35 x 7-12 mm, spreading to slightly recurved; surface shiny green occasionally hairy when young becoming glabrescent, the surface smooth green and shiny; margin entire to ciliate reddish toward apex; apex acute beset with green to reddish mucro. Flowers axillary, solitary to 20-25 mm in diameter on pedicles 8-10 mm long; petals magenta, mauve or yellow, persistent and becoming black with age. Receptacle cup-shaped 3 mm deep and 10 mm in diameter bearing two outer ovate sepals 7-8 x 4 mm and three smaller obovoid 3 x 2.5 mm with membranous margins and pointed apices, bearing scattered hairs. Petals in 2 series, outer linear lanceolate to 15 x 1.3-1.5 mm, the inner shorter and narrower 5 x 0.2 mm. Stamens in three series to 3-5 mm long at first overtopping stigmas. Filaments white to light mauve, hairy, anthers 0.7-1 mm, yellowish, ovary elevated to about 2 mm, 5-lobed. Stigmas 5, lanceolate, 2 mm long papillate; nectaries dark green 2 x 0.3 mm. Capsule top-shaped, 8-10 mm in diameter, grey, old petals persistent and becoming blackish; covering membranes lacking, valve wings present, closing bodies absent. Seed pale brown, pear-shaped 0.5 x 0.4 mm in diameter, tuberculate.
