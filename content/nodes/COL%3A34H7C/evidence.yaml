      ecology:
        status: partially-supported
        claims:
          - text: The habitat of our new species consists of narrow, shady to sunny kloofs (mainly E. S. and W. aspects) with a moderate subtropical climate. The plants grow pendent from vertical quartzitic sandstone cliffs, 400-800 m in altitude, often on ledges or crevices. The average daily maximum of 24øC has been recorded. The average daily minimum temperature for the region is 16øC. Winters are cooler but frost absent. Rainfall occurs mainly during summer but also occasionally during winter, ranging between 1000-1250 mm per annum. The habitat consists mainly of Northern Afro- temperate Forest and Pondoland-Ugu Sandstone Coastal sourveld. Associated cremnophytes include; Bulbine natalensis, Crassula orbicularis, Gasteria croucheri, Plectranthus ernstii, Cotyledon orbiculata, Crassula perforata, C. perfoliata and Aloe arborescens. The geology consists mainly of quartzitic sandstone (light-coloured and smooth-textured), Natal Formation (Cape Supergroup).
