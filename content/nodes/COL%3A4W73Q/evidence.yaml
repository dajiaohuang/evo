    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Multistemmed, wiry, rounded shrub up to 3 m high, often forming thickets. Branches grey, prominently lenticellate, branchlets chestnut-brown, glabrous. Leaves trifoliolate, petiolate; petiole semiterete, canaliculate and slightly margined above, (8-)19(-30) mm long; leaflets sessile, coriaceous, slightly discolorous, olive-green above, slightly paler below, glabrous, glutinous, hypostomatous; lamina linear, lateral leaflets often falcate, apex acute, often mucronulate; margin erose to grossly dentate, parted or divided, rarely almost entire; venation kladodromous to reticulodromous, midrib prominent above and below, lateral veins slightly prominent above, other veins obscure in mature leaflets; terminal leaflets (25-)51(-90) x (3-)6(-12) mm, lateral leaflets (15-)39(-81) x (2-)5(-7) mm. Panicles profusely multiflorous, occasionally glomerate, axillary and terminal, latter up to 100 mm long, prominently exposed. Flowers normal. Drupe circular, globoid, glabrous, shiny, light brown, relatively small, 3.3 x 3.1 - 4.5 x 4.0 mm.
            sourceIds:
              - sanbi_9808_0
            locator: "SANBI/WFO archive Morphology row 45148; source 9808.0; publication: Moffett, RO. 1993. Rhus, Fl. S. Africa 19(3,1): 1 - 123. National Botanical Institute, Pretoria. [http://www.biodiversitylibrary.org/item/209553#page/1/mode/1up]. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: The wiry branches and fairly dense foliage have led to its use as a rough broom, hence its vernacular name 'besembos'. The toothed leaflets are diagnostic and it has only been confused with Commiphora gracilifrondosa Dinter ex J.J.A. van der Walt. The latter species is, however, allopatric and apart from the generic differences, has narrower leaflets.
