    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Multistemmed, leafy shrublet, up to 0.3 m high. Stems few- branched; branches erect, sparsely hairy to silver villous or hispid; fascicles sometimes present in leaf axils. Leaves alternate, appressed to erect, 2.0-10.0 x 1.0 mm, linear to lanceolate, acute to acuminate, revolute, entire, without petiole-like base, without secondary basal lobes, glabrous to silver-villous adaxially, glabrous abaxially, fleshy to leathery; basal swelling present, continuous with stem ribs. Capitula discoid, homogamous, terminal, solitary, with 0-3 additional capitula from leaf axils below, pedunculate; peduncles 15.0-60.0 mm long, glabrous. Involucre 5.0-7.0 x 5.0-7.0 mm, hemispherical to cyathiform, rarely tapering at the base; involucral bracts 4-seri- ate, tightly arranged, margins and apices scarious, membranous apices of all bracts 0.8-1.3 mm long, glabrous, brown margins absent, median resin canals present; outer bracts deltoid to lanceolate, 2.7-3.5 mm long, acute to attenuating; middle bracts triangular ovate, 4.0-4.3 mm long, acuminate; inner bracts lanceolate, 4.6-5.2 mm long, rounded. Receptacle convex; paleae in marginal series, oblanceolate to oblong, 4.65.2 mm long, rounded, membranous with scarious margins and apices, scarious apices 0.6-1.2 mm long. Disc florets ±20, without resin canals; corolla 2.0-3.0 mm long, with only glandular trichomes, yellow; tube 1.0-1.2 mm long; limb narrowly campanulate, 1.0-1.2 mm long (excluding lobes); lobes spreading, 0.6-1.0 mm long, triangular ovate. Anthers 2.8-3.6 mm long (including apical appendage); apical appendage obovate. Style 2.4-2.8 mm long (excluding branches); branches 0.4-1.0 mm long. Cypselas 3.6 x 1.0 mm, obovate, 11-ribbed, apical rim thickened, dentate, glandular trichomes present, sparse, scattered, not mucilaginous when soaked, discontinuous resin canals in ribs absent. Flowering is from October to March.
