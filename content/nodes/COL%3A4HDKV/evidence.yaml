          - text: Phymaspermum erubescens could be confused with P. peglerae or discoid specimens of P. aciculare but can be readily distinguished by the sparse to dense silvery villous or hispid indumentum on the stems and leaves (densely bronze villous in P. peglerae and glabrous in P. aciculare), the shorter leaves, 2.0-10.0 mm long and smaller cypselas (when compared to P. peglerae) <4 mm long.
