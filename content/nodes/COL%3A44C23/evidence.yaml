    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Like M. tripetala but corm tunics pale and relatively soft, leaves plane in upper half, sometimes hairy beneath, filaments free or united less than 0.5 mm and inner tepals short, attenuate cusps.
            textZh: Moraea amabilis Diels 的 SANBI 物种条目记载了植株、叶片和花部形态。
            sourceIds:
              - sanbi_13878_0
            locator: Strelitzia 29; archive Morphology row 7426, source 13878.0
            placeTimeScope: Regional species account published 2012; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
          - text: Recognised by the virtually free filaments (united for < 0.4 mm), inner tepals reduced to hair-like cusps up 2.5 mm long, and the distinctive mode of vegetative reproduction in which the parent corm is often replaced annually by two new corms. Plants also often have a cormlet in the leaf axil and as a result form clonal colonies. This unusual characteristic is only evident if the plants are carefully extracted from the ground. The species is most likely to be confused with M. grandis, which also has nearly free filaments but is larger in all features, notably the ovary, 10-12(-15) mm vs. 6-9 mm long in M. amabilis and anthers 9-11 mm long, ± twice as long as the filaments vs. 4.5-7.0(-8.0) mm and up to half again as long as the filaments in M. amabilis. The corms of M. amabilis have pale (rarely dark) brown, coarsely fibrous tunics with prominent vertical elements in contrast to the finer tunic fibres in M. grandis. Apart from smaller flowers, M. amabilis often has white pollen in contrast to the consistently bright red-orange pollen of M. grandis. Capsules of M. amabilis, typically 11-16 mm long, contain relatively small, sharply angular seeds, ± 2 mm at longest axis, with a prominent, pale, spongy micropylar crest, whereas capsules of M. grandis are significantly larger, up to 19 mm long, with a thickened apical ridge and the large, dark brown seeds are up to 3 mm long. The velvety to pilose pubescence is universal on the leaves, stem and spathes of western Karoo populations of M. amabilis but those from the Bokkeveld Mtns, Gifberg and Cederberg-Olifants River mtns usually have glabrous leaves although there are some exceptions in the area. Only moderate confidence can be placed in the pubescence character as some other members of the M. tripetala complex occasionally have hairy leaves (notably M. mutila) although M. grandis is consistently glabrous. In the Nieuwoudtville area M. amabilis and M. grandis are sometimes difficult to distinguish, most likely due to hybridization. Plants from near Worcester included in M. amabilis have unusual, buff-yellow or dusty pink flowers and those from the Rabiesberg, not far distant, also with velvety stems and leaves, were described as having brown (we assume buff-brown) flowers.
            textZh: SANBI 条目提供了 Moraea amabilis Diels 的鉴别特征。
