    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte to 1.6 m, robust. Leaves sword-shaped. Flowers mostly pink to purple, tube elongate. Capsules obovoid.
            textZh: Watsonia knysnana L.Bolus 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 7450; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Distinguished from other species with similar long-tubed flowers by the mostly pink to purple (only rarely red) perianth, the lower part of the tube 12-20 mm long and the upper part 17-20(-24) mm long, the mostly unbranched stem, and the herbaceous bracts (12-)14-20(-24) mm long. Populations from the mountains around George, especially Ruitersberg at Robinson’s Pass, are unusual in their dry bracts, suberect tepals and shorter filaments only shortly exserted from the tube. Closely related Watsonia pillansii has consistently orange flowers with bracts (19-)23-33(-40) mm long, and a perianth tube with both the lower and upper parts 17-25 mm long, the filaments thus slightly longer, 30-40 mm long. The two species hybridise extensively along the southern Cape coast, notably near Prince Alfred’s Pass and Kareedouw Pass but also elsewhere.
            textZh: SANBI 条目提供了 Watsonia knysnana L.Bolus 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 94388; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
