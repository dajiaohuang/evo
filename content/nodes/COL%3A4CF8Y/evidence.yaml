    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Perennial, scrambling; leaves cauline; culms up to 400 mm long, branched, rooting at the nodes; nodes yellow, glabrous. Leaf blades flat, lanceolate, 20-85 x 4-9 mm, acuminate, base cordate, then narrowing at junction with sheath; cross-venation present (obvious on abaxial surface); long, rigid hairs present or absent; margins pale, densely scaberulous, often crinkled, usually with dense long hairs at base; sheaths convolute, outer margins densely hairy. Inflorescence 35-145 x 20-180 mm, delicate, open, sparsely branched, closely associated with flag leaf or well exserted; branches long, fine; spikelets solitary, pedicels (4)6-15 mm long, slightly thickened at apex. Spikelet 1.8-2.4 mm long, acute to acuminate; lower glume nearly as to longer than spikelet, 3-nerved, long-acuminate, not clasping; upper glume longer than spikelet, 7-nerved, hardly separated from lower glume; lower floret sterile, lemma 5-7-nerved; palea absent or reduced to a small scale; upper lemma shorter than lower lemma, pallid to light brown, shiny.
            textZh: Panicum silvestre Fish 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_15530_0
            locator: "SANBI/WFO archive Morphology row 62332; source identifier 15530.0; cited publication: Fish, L. 2015. Panicum L. In: L Fish, AC Mashau, MJ Moeaha & MT Nembudani (eds), Identification guide to the southern Africa grasses. An identification manual with keys, descriptions and distributions, Strelitzia 36: 472 - 496. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
