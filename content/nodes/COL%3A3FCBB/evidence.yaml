    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants acaulescent, ascending to decumbent, 125 mm tall, up to 380 mm diam., solitary or proliferating from base and cluster-forming (3-5 heads). Roots succulent, up to 2.5 mm diam. Leaves rosulate, patent spreading (at first ascending), firm, lorate-lanceolate, 165-230 mm long, 60-65 mm broad at base, slightly falcate; adaxial surface canaliculate, plane towards apex, faintly white-spotted; abaxial surface somewhat convex with a distinct eccentric keel, faintly spotted, spots arranged in obscure transverse bands; both surfaces dull green with smooth, slightly minutely asperulous epidermis; margin minutely serrulate to almost entire, apex obtuse to subacute, mucronate. Juvenile leaves distichous, lorate, patent to ascending; epidermis smooth, minutely asperulous, densely white-spotted, spots arranged in transverse bands; apex obtuse, mucronate. Inflorescence ascending to flat-topped panicle (racemose in juvenile plants). Flowers, secundly arranged and up to 6 flowers open at the same time, up to 1150 mm long, bearing up to six ascending to horizontally spreading side branches up to 750 mm long. Scape 250-330 mm long 14 mm broad at base, flattened; floral bracts 6-7 x 1.52 mm, piliferous (peduncular bracts present, slightly larger); pedicels 4 mm long, pink. Perianth 27-29 mm long, stipitate for 3-4 mm; segments fused for their greater length (accept the perianth apices and margins of the inner 3 segments), subcylindrical, curved in the middle, the lower portion of perianth slightly decurved; upper half inflated to about 7 mm in diameter, uniform dull pink, the upper half with faint green striations; apices erect becoming erectly spreading, obtuse; margins of inner segments free and channelled at base for 10-12 mm, diverging gradually towards apex. Stamens 23-25 mm long; anthers 3 x 1.5 mm long, included. Ovary 6.5 mm long, 3 mm diam., green; style 13 mm long, stigma included, curved upwards, minute. Capsule 16-25 x 7-10 mm long, narrow obovate, triangular in cross-section, obtuse at apex. Seeds oblong, 5 x 3 mm, black.
