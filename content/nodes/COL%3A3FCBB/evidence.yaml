      ecology:
        status: partially-supported
        claims:
          - text: Eastern Valley Bushveld (Sub-Escarpment Savanna Bioregion). Gasteria loedolffiae appears to be confined to Beaufort shale cliffs (Adelaide subgroup) of both the Mzimvubu and Msikaba River to the north. It has only been observed on sheer cliff faces (altitude 200-500 m). The rosettes grow in crevices often on humus-rich ledges of shale rocks in full sun or the shade of thicket consisting of Euphorbia triangularis, E. tirucallii, Ficus ingens, Portulacaria afra, Aloe rupestris, Aloe arborescens, Commiphora harveyi, Bulbine natalensis, Caputia medley-woodii, Cotyledon orbiculata, Crassula expansa subsp. fragilis, C. orbicularis, C. cordata, Gerrardanthus macrorrhizus, Albuca longibracteata, Mervilla plumbea, C. perfoliata var. perfoliata, Delosperma sp., Plectranthus montanus, P. spicatus and Huernia hystrix.
