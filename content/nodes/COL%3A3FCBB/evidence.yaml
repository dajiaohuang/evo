          - text: Gasteria loedolffiae is at once distinguished by its dark pink flowers 27-29 mm long, its matt dull-green leaf surface of spreading leaves and its juvenile leaves of which the surface is minutely asperulous. Superficially it resembles G. croucheri, the latter with much different and larger flowers. Gasteria loedolffiae belongs to section longiflorae Haw. series longifoliae Haw., which now includes five species, G. acinacifolia (J.Jacq.) Haw., G. batesiana, G. croucheri (Hook.f.) Baker, G. tukhelensis and the new species. All these species have large flowers (33-45 mm long) that are gasteriform over half of the perianth length. G. batesiana, a smaller species occurring to the north, has shorter, distinctly tuberculate, recurved leaves, smaller, curved flowers and smaller fruiting capsules. G. tukhelensis is confined to the Thukela River in KwaZulu-Natal. Gasteria croucheri occurs widespread to the south with a dull to slightly glaucous surface. In size it resembles G. loedolffiae with ascending, spreading to pendent leaves 200-360 mm long. In G. Croucheri the inflorescence is a flat-topped panicle flowering from November to February, whereas in G. loedolffiae the side branches are ascending. G. croucheri is found from Durban southwards to the Msikaba River in Eastern Cape (Transkei region). Gasteria loedolffiae grows solitary or forms clusters by offshoots of up to 5 plants.
