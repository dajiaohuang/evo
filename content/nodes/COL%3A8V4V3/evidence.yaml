    - subjectId: taxon:vertebrata
      claimKind: scientific
      claimType: fossil-range
      statement: The 520–0 Ma Vertebrata route uses a rounded Cambrian navigation ceiling, while Lower Cambrian Chengjiang Myllokunmingia and Haikouichthys material at approximately 518 Ma supplies its direct fossil anchor; neither value dates crown Vertebrata or establishes a global FAD.
      confidence: medium
      confidenceRationale: The primary description figures the named fossils and reports the morphology matrix. The 520 Ma ceiling keeps nested Cambrian routes navigable, whereas the direct fossil evidence is approximately 518 Ma; soft-tissue interpretation and basal placement remain sample- and matrix-bounded.
      referenceLinks:
        - referenceId: shu-1999-chengjiang-vertebrates
          relation: supports
          pages: 42–46
          figure: Figures 1–5
          quoteLocator: Descriptions of Myllokunmingia and Haikouichthys; phylogenetic analysis; Supplementary Information
  claim-rationales.zh:
    - 一手研究给出具名化石图版及形态矩阵。5.20 亿年上限用于容纳嵌套的寒武纪导航路线，直接化石证据则约为 5.18 亿年；软组织解释和基干位置仍受样本与矩阵约束。
  claim-statements.zh:
    - 脊椎动物 5.20 亿年至今的路线采用取整后的寒武纪导航上限，而约 5.18 亿年前的澄江 Myllokunmingia 与 Haikouichthys 材料构成直接化石锚点；两者都不等于脊椎动物冠群年代或全球首现。
