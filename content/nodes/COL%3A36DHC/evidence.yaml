        claims:
          - text: Like D. subulata but leaves alternate in mature plants, bracts and sepals long-crisped ciliate.
            sourceIds:
              - sanbi_14402_0
            locator: "SANBI/WFO archive Morphology row 11403; source 14402.0; publication: Manning, JC; Goldblatt, P. 2012. Rutaceae: Diosma L. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 718 - 719. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Diosma arenicola is a distinct species with leaves lanceolate with a straight sharp point, with margins crisped ciliate and with the midrib often sparsely pubescent; with bracteoles 4 mm long, linear, crisped ciliate and pubescent along the midrib; and with flowers crowded and sessile. It differs from D. awilana which has leaves much broader and more recurved at the apex, bracteoles much less hairy and only half as long and fruits with much longer horns. It is closest to D. subulata which however is a much more glabrous plant with bracts, bracteoles and calyx lobes short-ciliate not long crisped-ciliate and with flowers in very much reduced racemes not crowded and sessile.
            textZh: SANBI 条目提供了该种的鉴别特征。
