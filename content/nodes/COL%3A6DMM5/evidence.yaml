        usage:
          title: Drymonia stenophylla (Donn.Sm.) H.E.Moore, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Epiphytic shrubs; stems erect, 0.3-0.5 m long, strigillose only at the apex, glabrescent below. Leaves nearly equal to strongly unequal in a pair, lanceolate to elliptic, 5-13 cm long, 1.1-4.2 cm wide, subcoriaceous, the apex acuminate, the base acute to cuneate, entire, above dark green, glabrous or strigillose (Panama), below lighter green with darker veins, glabrescent. Inflorescences in the upper leaf axils of 1 or 2 flowers; peduncles lacking; bracts reduced or lacking, pedicels slender, 0.5-1.5 cm long, glabrous; calyx oblique, the lobes unequal, lanceolate to ovate, 0.8-1.7 cm long, the apex acute, entire or rarely serrulate, or with prominent vein endings, green or rarely reddish, glabrous; corolla white, the throat yellow or pink, the limb white or reddish, the tube oblique in the calyx, the spurred base slender, ca. 3 mm in diam., broader above, to 1 cm wide, 2-3 cm long, the lobes of the limb erose to shortly fimbriate; stamens included, the filaments coiling after anthesis, glabrous; anthers ob- long; disc gland single, thick, glabrous; ovary oblong, pubescent at the apex and the base of the style; stigma stomatomorphic. Capsule enclosed in persistent calyx; seeds not seen. Chromosomes n = 9 (Lee, 1962).
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 6294
