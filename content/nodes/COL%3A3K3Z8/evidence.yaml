          title: Heisteria macrophylla Oerst., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrubs to 2 m. tall, the young stems terete to somewhat angular, glabrous, olive-green. Leaves elliptic or broadly elliptic to oblanceolate, (5-) 10-37 cm. long, 3-8 cm. broad, acuminate at the apex, acumen to 8 cm. long, cuneate to obtuse at the base, chartaceous to subcoriaceous, the costa emersed above and below, the primary lateral veins numerous, arcuate-ascending; petiole 6-30 mm. long, canaliculate. Calyx crateriform, 5- or 6-toothed, glabrous; petals (4 or) 5, deltoid, about 1.75-2.0 mm. long, 1-2 mm. broad at the base, glabrous; stamens 10, the anthers 0.5 mm. long and broad, the filaments liguliform, 0.75-1.5 mm. long, 0.5 mm. broad, glabrous; pistil conical, 1 mm. long and broad, glabrous; pedicel 1.25-2.0 mm. long. Fruiting calyx as long as or longer than the drupe, 2-3 cm. in diameter, inconspicuously and shallowly 5-lobed, more or less reflexed, red; drupe ovoid or ellipsoid, 8-12 mm. long, 6-9 mm. in diameter, vertically ribbed, black; pedicel 8-12 mm. long.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 8565
