        usage:
          title: Manettia reclinata L., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Vines, the stems slender, often with longitudinal ridges, glabrate or puberu- lent. Leaves ovate oblong, 3.0-5.5 cm long, 1.0-2.5 cm wide, acute at the apex, often acuminate, the acumen to 1 cm long, basally cuneate to obtuse, slightly inequilateral, the costa plane to prominulous above, prominulous to subplane beneath, the lateral veins 6-7, arcuate, the margin often villosulose, membranous; petioles to 2 cm long, slender, ca. 0.7-1.0 mm wide, puberulent; stipules small, widely triangular, to 1 mm long, wider than long, minutely puberulent and ru- gulose. Inflorescences axillary or terminal, glabrous, 1-several flowers per axil, the peduncle, if present, short, terminated by a pair of bracteoles subtending the pedicels; pedicels capillaceous, to 3.5 cm long. Flowers with the hypanthium oblong, ca. 3 mm long, the calycine cup ca. 1 mm long, with minute oblong glands within to 0.15 mm long, the lobes (6-)8, subequal, subulate to narrowly oblong, 6-7 mm long, marginally ciliate; corolla red, scarlet, magenta, occasionally white, the tube ca. 7 mm long, basally turgid, glabrate, minutely puberulent to densely villose outside, densely villose within near the mouth and with a few hairs near the base, the lobes 4, oblong, 7-8 mm long, 3-4 mm wide, obtuse, petaloid, venose, marginally ciliate, glabrous adaxially; stamens 4, the anthers oblong, ca. 3 mm long, the filaments ca. 1 mm long, attached near the mouth; stigmas 2, linear oblong, ca. 2.5 mm long, the style ca. 11 mm long. Fruits capsular, com- pressed rotund, 0.6-0.8 cm in diam., smooth, glabrous or puberulent, each valve with 3 delicate ribs, the calycine lobes persistent, curled; seeds ca. 3 mm in diam., the wing round, the margin undulate.
          originalLanguage: en
          sourceField: general
