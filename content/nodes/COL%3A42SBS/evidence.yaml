    facets:
      morphology:
        status: not-assessed
        claims: []
        gaps:
          - The selected field-density study does not provide a diagnostic anatomical description or morphological measurements.
      lifeHistory:
        status: not-assessed
        claims: []
        gaps:
          - The selected study does not assess development, reproduction, survival, or lifespan.
      ecology:
        status: partially-supported
        claims:
          - text: During nocturnal line-transect distance-sampling surveys on Nosy Be, researchers recorded 92 visual detections of Microcebus mamiratra over 46.5 km and estimated a mean density of 125.1 individuals/km² (95% CI 65.3–239.5). Extrapolating this study-area estimate across forested areas within the species' mapped extent of occurrence on Nosy Be yielded approximately 4,700 individuals; this is a model-based island estimate, not a census or an estimate for the species' entire range.
            sourceIds:
              - martin2025
            locator: Abstract; Methods > Line transect surveys; Results > distance analyses and population extrapolation.
            placeTimeScope: Nocturnal wet-season surveys from 17 February to 4 April 2023 at 15 transects in and around Lokobe National Park on Nosy Be, north-west Madagascar. Transects sampled primary, secondary and degraded forest and plantations, inside and outside the park. Density pertains to the Nosy Be study area; the approximate 4,700 figure extrapolates the estimate across forested area within the mapped island extent of occurrence only.
            lifeStatus: Wild/free-ranging individuals detected visually during field transects. No captive or domesticated animals were included in the reported survey detections; the article does not assess fossil material.
            originalLanguage: en
        gaps:
          - This focused study supports a local density estimate and bounded island extrapolation only; broader diet, behavior, habitat-selection, interactions, seasonal variation and population trend require separate evidence.
      evolution:
        status: not-assessed
        claims: []
        gaps:
          - No phylogenetic, population-genetic, or divergence-time analysis was assessed.
      distribution:
