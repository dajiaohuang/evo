        usage:
          title: Erythrina rubrinervia Kunth, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrub or small tree, usually armed, leafy when flowering. Leaves with the terminal leaflet rhombic ovate, mostly 10-20 cm long, 5-12 cm wide, apically acuminate, basally cuneate, unarmed, the secondary veins 8-11 on each side, chartaceous, soon glabrescent, minutely reticulate waxy beneath; petiolules 8-30 cm long, often armed, soon glabrescent; petioles 4.5-10 mm long; 1-2.5 mm thick, soon glabrescent. Inflorescences with the bracts caducous, the bracteoles narrowly elliptic, ca. 1 mm long, ca. 0.3 mm wide, the pedicels 0.3-0.9 cm long, pubescent, becoming 0.9 cm long in fruit. Flowers with the calyx thin, tubular campanulate, 14-30 mm long on the lower side, 10-21 mm long on the upper side, narrowed toward the base, 4-6 mm wide at the top, the margin entire but with the lowest tooth 1.5-2 mm long, glabrescent; standard scarlet, narrowly elliptic oblanceolate, 4.5-7.5 cm long, rounded or subacute, the wing petals api- cally denticulate, mostly slightly smaller than the keel petals, the keel petals abruptly acute or acuminate, 6-12 mm long, 4-5 mm wide; stamens 4.3-6.6 cm long, free for 1-2 cm; ovary and stipe densely pubescent. Legume somewhat woody, 18-36 cm long, ca. 1.5 cm wide, constricted between the seeds, the stipe 3-5 cm long, the acumen 3-6 cm long; seeds numerous, uniformly scarlet, 10-12 mm long, 6-8.5 mm wide.
          originalLanguage: en
          sourceField: general
