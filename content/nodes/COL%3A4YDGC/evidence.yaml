        usage:
          title: Souroubea vallicola Woodson ex de Roon, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Climbing shrub or liana, often epiphytic; branchlets stout, sometimes tortuous, becoming gray with age. Leaves coriaceous, rigid, the petiole 4-10 mm long and 2-3 mm wide, canaliculate above; blade obovate, 1.5-2 times as long as wide, 6-13 cm long and 3-7 cm wide, rounded or obtuse, mucronate when young, afterwards mostly slightly retuse apically, acute or sometimes obtuse basally, the midrib flattened or slightly prominent above, prominent beneath, the lateral veins prominent beneath, the margin revolute; hypophyllous glands absent or only a few small and hardly visible ones near the margin. Inflorescences short, 15-22 flowered racemes, the rachis 4-12 cm long, ferrugineous-puberulent; nec- taries auriculate spurs, the spur clavate, 7-10 mm long, the auricles 8-12 mm long. Flowers with puberulent pedicels, 1-2 cm long; bracteoles suborbicular, 2-4 mm long and 2-4 mm wide; sepals suborbicular, 3-5 mm long and 4-6 mm wide; petals obovate-oblong, 7-10 mm long and 4-5 mm wide, connate -basally; stamens 5, the filaments flattened, 5-6 mm long, ca. 1 mm wide basally, narrowed apically, free or connate basally, the anthers ovate, 1.5-2 mm long and 1-2 mm wide; ovary pentagonal, 5-loculed, ca. 3-4 mm long and ca. 2-3 mm in diameter, the stigma large, radially lobed. Fruit unknown.
          originalLanguage: en
