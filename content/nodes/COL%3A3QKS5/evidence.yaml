        claims:
          - text: Densely leafy, glandular shrublet to 40 cm. Leaves lobed, leathery. Flowers axillary among reduced leaves, purple to mauve, rarely white, with yellow throat.
            sourceIds:
              - sanbi_14433_0
            locator: "SANBI/WFO archive Morphology row 6022; source 14433.0; publication: Manning, JC; Goldblatt, P. 2012. Scrophulariaceae: Jamesbrittenia Kuntze. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 743 - 744. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: The plant is a dwarf shrublet, the many branches densely leafy, but the terminal floriferous parts nearly nude because of the sudden gross reduction in leaf-size. The leaves are borne in closely set pseudofascicles. They are small (up to c. 11 mm long), spathulate in outline, nearly always conduplicate, the margins in the upper part deeply cut into 1-4 pairs of ± oblong lobes; only the largest lobes are occasionally toothed; the smallest leaves may be entire. The backs of the leaves are thickly beset with large glistening glands; these are absent from the upper surface, which may or may not produce scattered minute glandular hairs. Similar minute hairs are often present on the petiolar part of the leaves, but they are usually very inconspicuous. The corolla limb is usually shades of purple, blue or mauve, rarely white. The capsules have glistening glands confined or very nearly confined to the sutures, with tiny glandular hairs elsewhere, though these may disappear with age.
            textZh: SANBI 条目提供了该种的鉴别特征。
