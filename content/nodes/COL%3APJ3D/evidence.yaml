        usage:
          title: Calea prunifolia Kunth, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: A dense bushy to sprawling shrub, 1-5 m tall; stems terete to angular on younger branches, reddish brown, hirtellous to tomentose. Leaves opposite; blades elliptic to ovate, apically acute, basally short attenuate to rounded, often slightly oblique, the margins nearly entire to serrulate with the serrations callous tipped, 1.5-10.5 cm long, 1-6.8 cm wide, upper surface rugose, grey-green, shiny, hirsute to nearly glabrous, with 5 prominent veins, lower surface resin-dotted, pale green, hirsute; petioles tomentose, 0.5-1.7 cm long. Inflorescences of heads in terminal and axillary umbellate clusters; peduncles 0.5-4.0 cm long, grooved, hirsute to tomen- tose, resin-dotted. Heads discoid, campanulate, 3-10 mm wide, 6-13 mm tall; involucral bracts multiseriate, the outer bracts herbaceous, ovate-oblong to rotund, tomentose, resin-dotted, 0.6-3.6 mm long, 1-6 mm wide, the intermediate bracts ovate grading to oblong-ovate with rounded, squarrose, ciliate apices, scarious or herbaceous tipped, the inner bracts oblong, scarious, glabrous, or scattered hirtellous, 4.8-6.6 mm long, 1.4-2.3 mm wide; receptacle cylindro-conic, knobby, 1.2-2 mm tall, 0.7-1.2 mm wide; paleas scarious, golden yellow, lanceolate, with 2 small lobes, apically attenuate, the margins minutely laciniate and strongly conduplicate, clasping the achenes, 5.2-7 mm long, 0.7-1.6 mm wide; florets 10-20, the corollas yellow, glabrous, 4-6 mm long, 0.5-1.3 mm wide, the limb campanulate, the lobes 5, 0.8-1.8 mm long, the tube 1.2-2.4 mm long, flaring at the base, the anthers exserted, bright yellow, each with a narrowly ovate, acute appendage, the base sagittate, the style branches revolute, with weakly acute tips. Achenes narrowly turbinate, subterete to angular, black, antrorsely hirsute to nearly glabrous, 1.3-3 mm long, 0.3-0.8 mm wide, with a wheel-shaped annulus; carpopodium prominent; pappus of 20-25 stout attenuate bristles arising from a low crown, 3.7-6.3 mm long.
