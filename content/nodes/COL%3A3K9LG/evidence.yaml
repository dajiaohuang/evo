        usage:
          title: Helicteres baruensis Jacq., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrub or slender tree 2-4 m. high, the young branches ferruginous-tomentose. Leaves shortly petiolate, the petiole thick, up to 1.5 cm. long, ferruginous-tomen- tose, the stipules subulate and 1-1.2 cm. long, the blade ovate, cordate at the base, acuminate at the apex, 6-14 cm. long and 5-9 cm. wide, chartaceous, the margins irregularly serrate or doubly serrate, shortly tomentellous above, tomentose-arach- noid beneath, 5- to 7-nerved at the base. the nerves impressed above and prominent beneath. Inflorescences axillary or oppositifolious, 3- to 5-flowered, the peduncle thick, ca. 1 cm. long, ferruginous-tomentellous. Flowers horizontal, zygomorphous, the pedicel ca. 5 mm. long, ferruginous-tomentellous, the bracts subulate, ca. 7-8 mm. long, ferruginous-tomentellous; calvx bilabiate, ca. 3 cm. long and 1 cm. wide, the lobes triangular, acuminate, unequal and ca. 1 cm. long, ferruginous-tomen- tellous outside, tomentose-arachnoid near the top inside; petals linear, long- unguiculate, the claw provided above the base with small appendages, rounded at the apex, ca. 4 cm. long, reddish; gonophore curved, ca. 8 cm. long, whitish- pubescent-arachnoid; stamens 10, the filaments ca. 3-4 mm. long, the anthers ca. 4 mm. long; staminodes 5, ca. 3 mm. long; ovary spirally twisted, ca. 3 mm. long and 1.5-2 mm. broad, whitish-villous, the styles coherent. Fruit cylindrical, spi- rally twisted, 4-5.5 cm. long and 1 cm. broad, the follicles dorsally canaliculate, tomentose to puberulous, the accrecscent gonophore up to 10-12 cm. long; seeds flattened, ca. 2 mm. in diam.
