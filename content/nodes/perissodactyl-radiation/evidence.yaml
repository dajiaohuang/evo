  claims:
    - subjectId: event:perissodactyl-radiation
      claimKind: scientific
      claimType: biogeography
      statement: The earliest sampled perissodactyls occur during the PETM and imply rapid dispersal among northern landmasses, but sparse sampling and analysis-dependent stem placements leave the order’s place of origin unresolved.
      confidence: medium
      confidenceRationale: Tissier and Smith directly analyze 71 terminals, 102 characters and calibrated early occurrences. Medium confidence preserves their unresolved-origin conclusion and avoids turning sampled first records into origination dates.
      referenceLinks:
        - referenceId: pnas-2026-perissodactyls
          relation: supports
          pages: 1–6 of 8
          figure: Figures 1 and 3; Dataset S2
          quoteLocator: Abstract and Introduction (p. 1), stem placements (p. 4), occurrence calibration and unresolved origin (p. 6)
  claim-rationales.zh:
    - Tissier 与 Smith 直接分析了 71 个末端、102 个形态字符和校准后的早期记录。中等置信度保留了论文关于起源未决的结论，也避免把最早取样记录当作起源时间。
  claim-statements.zh:
    - 目前取样到的最早奇蹄类出现于古新世—始新世界线事件期间，提示它们在北方大陆间快速扩散；但取样稀疏且干群位置随分析而变，奇蹄目的起源地仍未解决。
