    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, 6-40 cm. Leaves sword-shaped to falcate, flat or twisted and undulate to crisped. Flowers bilabiate, scarlet-orange, occasionally yellow, lower tepals each with a large, tooth-like yellow callus.
            textZh: Tritonia securigera (Aiton) Ker Gawl. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 6863; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: "The central species in a taxonomically difficult group that is characterised by similar two-lipped, orange flowers with an obliquely funnel-shaped tube conspicuously yellow in the throat and about as long as the tepals (sometimes slightly longer), the lower tepals each with a yellow blotch near the base bearing a quadrate or axe-like callus 1-4 mm high. Within this group, Tritonia securigera is applied to plants with plane, lanceolate or linear-lanceolate leaves, usually forming an erect fan up to half as long as the stem, the main vein raised and the margins thickened and without a prominent submarginal vein. The perianth tube is usually 10-15 mm long, with the narrow basal portion 3-6 mm long. Plants from Kommadagga are variable in tube length, the tube in some individuals up to ± 20 mm long with the narrow basal portion 15 mm long. Introgression with T. chrysantha may be indicated here. Tritonia nelsonii from Gauteng, Limpopo and Northwest is usually taller with narrow, stiffly erect leaves with numerous prominent veins; T. strictifolia from interior Eastern Cape around Grahamstown, is distinguished by the prominent submarginally veined leaves; and T. laxifolia from Eastern Cape and subtropical Africa, flowers in late summer and autumn and has larger capsules 12-15 mm long closely appressed to the stem. Two other taxa are less clearly separated: T. parvula from the central and eastern Little Karoo, is a mostly smaller plant with linear leaves, mostly 1-2(-3) mm wide; and T. watermeyeri from the western Little Karroo, has more-or-less spirally twisted leaves with the margins often undulate or crisped."
            textZh: SANBI 条目提供了 Tritonia securigera (Aiton) Ker Gawl. 的鉴别特征。
