        usage:
          title: Cestrum langeanum D'Arcy, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrub 3 m tall, twigs pulverulent-tomentose with a soon-deciduous indument of sparingly branched, multicellular, distorted trichomes, young branches slender, uniformly finely striate and perhaps purplish at the nodes. Leaves mostly 15 cm long and 5 cm wide, ovate, lanceolate or elongate, apically acute or slightly acuminate, basally obtuse, chartaceous and glabrous, the upper surface shiny, beneath dull with 8-10 contrasting veins on each side of the midvein; petioles short, ca. 10 mm long, moderately stout; minor leaves wanting. Inflorescence a terminal, congested, many-flowered panicle comprising a series of panicles axillary to the terminal leaves, the ultimate leaf (bract) reduced to 5 cm long and 2 cm broad; peduncles 1.5-3 cm long, pubescent, flattened, and grooved; pedicels very short or wanting, the bracteoles narrowly lanceolate or oblong, 4-5 mm long, pubescent or not. Flowers with the calyx 3 mm long, short-tubular, angled to the costae of the lobes, pubescent outside with a shiny, glandular appearance, inside glabrous with prominent venation, the lobes 1 mm long, equal, obtuse, slightly cucullate; corolla green, 30 mm long overall, the tube ca. 25 mm long, slender, expanding around the anthers and contracting somewhat above them, glabrous inside and out, the lobes 5-6 mm long, oblong, minutely puberulent inside and out; stamens equal, the filaments glabrous, smooth, straight, adnate ca. 18 mm up the corolla tube, 3 mm free, anthers orange, broader than long, ca. 0.75 mm long, situated well within the corolla tube ca. 2 mm short of its mouth; ovary obtuse-conical, the upper 1/3 consisting of sterile, nectariferous (?) tissue, ovules ca. 4, the included stigma situated 0.2-1.0 mm above the anthers, abruptly obconical with a discoid apex. Fruit unknown.
          originalLanguage: en
          sourceField: general
