        usage:
          title: Averrhoa carambola L., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Tree to 25 m tall, 25 cm diam., abundantly branched; branches sometimes drooping; pubescence of short curved whitish to reddish ascending deciduous hairs. Leaves disposed along the branches, 3-8 jugate, the leaflets alternate or subopposite, discolorous, variable in shape, asymmetric, the upper leaflets ellip- tical or ovate, oblong, cuspidate, basally rounded or truncate, the lower leaflets smaller, 1.5-3 cm long, 1-2 cm wide, acuminate or cuspidate, the secondary nerves 4-10 pairs, the pubescence short and even beneath, the nerves pubescent above, the margin appressed ciliate; rachis to 20 cm long, rigid, pubescent; petio- lules thick, 1.5-3 mm long; petioles to 3.5 cm long, pubescent, thickened towards the base. Inflorescences axillary or cauliflorous, of pubescent and glandular cymes united into racemes and these into fascicles or pseudo-panicles; peduncle to 1 cm long; pedicels 3-4 mm long. Flowers with the sepals oblong or obovate oblong, 2.5-3.5 mm long, 1-2 mm wide, obtuse and somewhat emarginate, rarely subacute, a few hairs appressed on the central zone, the margin irregular, hyaline, finely ciliate; petals violaceous, white bordered, linear spatulate, 6.5-9 mm long, 1.5-3 mm wide, clawed, connate at the middle, seldom free, densely glandular inside; stamens enlarged toward the base, connate up to l/5, the anthers orbicular, the connective conspicuous, the longer stamens 2-2.5 mm long, fertile, the short- er stamens without anthers, seldom with rudimentary anthers (D'Arcy & D'Arcy 6799 and others), or rarely with 2 rudimentary thecas separated by a short con- nective, in macrostylous flowers the longer stamens with small glands on the upper half, in mesostylous flowers (most frequent) the short stamens very short, microstylous flowers not seen; pistils 3-4 mm long, sometimes glandular, the ovary ellipsoid, the pubescence scant, appressed, sometimes only on the back of the carpels, the carpels 3-5-ovuled, the styles short, thick, pilose, the stigma enlarged, 2-lobed. Berry greenish or yellow, ovoid or ellipsoid, asymmetric, 8- 12.5 cm long, 5-6 cm wide, the carpels uneven, angular, the base and apex 5- lobed, in transverse section 5-rayed; seeds without outer integument.
          originalLanguage: en
