            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: The species is characterized by its relatively large alternate leaves, long pedicels, narrow acute calyx lobes and short corolla tube. It is distinguished from J. bicolor, which also has alternate leaves, narrow acute calyx lobes and short corolla tube, by its habit (annual or perennial herb, not twiggy shrublet), larger (especially broader) leaves and longer pedicels (up to 7-16 mm, not 2-6 mm). Jamesbrittenia major also has large leaves and long pedicels, but the leaves are mostly opposite, the hairs on stem, leaves and calyx are longer (1-2.5 mm, not 0.5-1 mm), the corolla tube longer (15-22 mm, versus 9.5-10 mm), the limb larger (13-20 mm across the lateral lobes, not 8-9 mm) and shades of rose or violet (not white).
