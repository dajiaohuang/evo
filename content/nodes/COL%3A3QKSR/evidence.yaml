    facets:
      morphology:
        status: partially-supported
        claims:
          - text: "Herb, possibly annual, taproot woody, c. 8 mm diam. at crown, one main stem c. 350-600 mm long, sparingly branched at base and above, erect or possibly decumbent, glandular-pubescent, hairs up to 0.5-1 mm long, very delicate. Leaves opposite only at extreme base, soon alternate, more or less patent, up to 16-45 x 15-34 mm (ratio 1-1.3:1), lowermost leaves broadly elliptic, base slightly narrowed to petiolar part up to 2 mm long, most leaves broadly ovate (but narrowing upwards) base cordate, amplexicaul, apex obtuse then abruptly apiculate becoming acute upwards, margins entire or very occasionally with a tiny tooth, both surfaces glandular-pubescent, hairs up to 0.5-1 mm long. Flowers solitary in leaf axils almost from base of plant, often crowded. Pedicels up to 7-16 mm long. Calyx tube c. 0.2 mm long, lobes 5.5-7.3 x 0.7-0.8 mm, linear-lanceolate or very narrowly subspathulate, acute, glandular-pubescent, hairs up to 0.8-1 mm long. Corolla tube 9.5-10 x 2.2-2.8 mm in mouth, cylindric, scarcely broadened at apex, limb ± bilabiate, 8-9 mm across lateral lobes, posticous lobes 3-3.4 x 2.4-2.8 mm, anticous lobe 3-3.8 x 2.4-3.2 mm, + oblong-elliptic, glandular-puberulous outside, very minutely glandular around mouth on upper surface of limb, well bearded inside with clavate hairs c. 0.2 mm long where they extend onto extreme base of anticous lip, lobes white with dark red to blackish streaks at base of each lobe, throat yellow. Stamens: posticous filaments 1.8-2 mm long, anthers 1.2-1.6 mm, anticous filaments c. 0.6 mm long, anthers 1-1.3 mm, all filaments puberulous. Stigma 0.4-0.5 mm long. Style 5-7 mm. Ovary 2.2-5 x 1-1.2 mm. Capsules 5-7 x 34 mm, glandular-puberulous near apex. Seeds 0.3-0.4 x 0.2-0.25 mm. Flowers appear in winter and spring, between July and September."
            sourceIds:
