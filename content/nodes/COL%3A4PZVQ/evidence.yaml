        claims:
          - text: Rounded, densely leafy shrublet to 50 cm. Leaves 4-ranked, ovate-oblong, leathery, papillose. Flower heads discoid, narrow, in dense corymbs, yellow, 8-12 x 4-6 mm.
            sourceIds:
              - sanbi_14208_0
            locator: "SANBI/WFO archive Morphology row 10953; source 14208.0; publication: Manning, JC; Goldblatt, P. 2012. Asteraceae: Pteronia L. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 412 - 414. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: This new species of Pteronia is unique in its vegetative characters, possessing closely set, opposite and decussate leaves, which resemble some members of the tribe Diosmeae, in the Rutaceae. In inflorescence characters it resembles P. divaricate (Berg.) Less. most, where this species will key out in the last revision of Pteronia (Hutchinson & Phillips, 1917). However, besides the vegetative differences, these two species are very different in floret characters, and are not related. P. divaricate has much longer style-branches and filament collars than P. diosmifolia, the latter being 1.5-1.6 mm long in P. divaricate and only 0.47-0.57 mm long in P. diosmifolia. The corolla lobes are also longer (about 3.5 mm long) and spreading in P. divaricate, whereas they only reach 2 mm long in P. diosmifolia, and show no tendency to spread. Another conspicuous difference is the achene, being only sparsely pubescent and very glandular-papillate in P. divaricate, and very pubescent and sparsely glandular-papillate in P. diosmifolia. The shape of the achene also differs in these two species. The achene of P. divaricate is urn-shaped, being broadest very near the apex, whereas that of P. diosmifolia is vase-shaped, being broadest about two-thirds up from the base. No other species is similar to P. diosmifolia.
