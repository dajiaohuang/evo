    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Stems slender to medium, yellowish. Flowers ±2 mm long, in loose clusters, ± glandular, on short pedicels. Calyx shorter than corolla tube or ± as long, ± thickened at basal part; lobes ovate, obtuse or almost acute, often loose about corolla. Corolla campanulate; lobes erect to slightly spreading, ovate to ± triangular, acute, inflexed with cucullate tips, ± as long as, or longer than tube. Stamens slightly shorter than corolla lobes; filaments somewhat subulate, longer than or almost as long as oval anthers. Scales oblong or ovate, usually truncate or rounded at apex, not deeply fimbriate; adnate below middle. Ovary globose, somewhat depressed and slightly but distinctly attenuate into a short, thickened base; styles shorter to slightly longer than ovary, often divergent; stigmas conical or sausage-shaped to oblong, much shorter than styles. Capsule globose or depressed-globose, not circumscissile; styles divergent, intrastylar opening large. Seeds 1 or 2, black, finely tuberculate or rugose; hilum small, inconspicuous, nearly basal.
            sourceIds:
