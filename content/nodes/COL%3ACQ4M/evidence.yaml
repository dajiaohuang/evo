      method: Exact COL26.8 accepted species usage, verbatim scientific name, rank, status, source dataset and Amphibia classification verified against the pinned registry search record.
      scope: COL26.8 usage CQ4M only. The evolutionary evidence is a single laboratory genome and its associated experiments; the ecology evidence is a short VHF post-release study of 18 captive-bred axolotls at two aquatic sites in southern Mexico City. These observations do not constitute a species-wide or range-wide synthesis.
      sourceIds:
        - col
    lifeStatusScope:
      wild: The ecology study released captive-bred animals and followed them for short periods at an artificial wetland and a restored chinampa in southern Mexico City. Those post-release observations are not treated as wild-born population traits or evidence of long-term establishment. The genomic source used laboratory material.
      domesticated: Laboratory breeding is not treated as domestication; domestication history has not been assessed.
      fossil: Fossil occurrence and geological age have not been assessed.
