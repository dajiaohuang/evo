          scope: VHF telemetry study of 18 laboratory-born and captive-raised axolotls released to two aquatic sites in southern Mexico City. The claim is limited to post-release home-range estimates at these sites and study windows; it is not a range-wide ecology estimate or evidence of a self-sustaining wild population.
    facets:
      morphology:
        status: not-assessed
      lifeHistory:
        status: not-assessed
      ecology:
        status: partially-supported
        claims:
          - text: After release of 18 captive-bred axolotls into two aquatic sites in southern Mexico City, VHF telemetry produced total MCP home-range estimates averaging 2,747 m² for the eight tracked at the artificial La Cantera Oriente wetland and 382 m² for the ten tracked at a restored chinampa in Lake Xochimilco; the difference was statistically significant (p < 0.001).
            textZh: 18 只圈养繁殖的美西螈被放归到墨西哥城南部两处水域后，VHF 遥测所得总 MCP 家域估计值中，拉坎特拉东方人工湿地 8 只个体的平均值为 2,747 m²，索奇米尔科湖一处修复 chinampa（水上农田湿地）10 只个体的平均值为 382 m²；差异具有统计学显著性（p < 0.001）。
            sourceIds:
              - ramos2025axolotlmovement
            locator: Abstract; Methods, Study areas and Data collection; Results, Home range size.
            placeTimeScope: Two aquatic sites in southern Mexico City. Eight animals at La Cantera Oriente were tracked from 2017-10-27 to 2017-12-07; ten animals at a restored Lake Xochimilco chinampa were released on 2018-03-12 and monitored through 2018-04-20. VHF telemetry; sites and seasons differed.
            lifeStatus: All 18 study animals were born and raised in captivity before release into the study wetlands. The short post-release monitoring does not establish wild-born ecology, long-term establishment, or a self-sustaining population.
            originalLanguage: en
        gaps:
          - This short, small-sample post-release study does not establish range-wide habitat use, seasonal or geographic variation, a wild-born baseline, long-term survival and reproduction, or whether site differences caused the home-range contrast.
      evolution:
        status: partially-supported
        claims:
          - text: The authors reported that the assembled axolotl genome lacks Pax3, and that mutation of its Pax7 paralogue produced a phenotype similar to Pax3- or Pax7-mutant mice; the genomic sample came from one three-year-old d/d adult male.
            sourceIds:
              - nowoshilow2018
            locator: Abstract; Methods, genomic DNA preparation; Results, Reduced Pax-family complement
            placeTimeScope: A single laboratory-bred d/d male supplied genomic DNA; the 2018 article presents comparative genomic and gene-editing results, not a population survey.
            lifeStatus: The source concerns laboratory material and experimental mutants; it does not establish the frequency of these genomic traits across wild populations.
            originalLanguage: en
            textZh: 2018 年研究报告，所组装的美西螈基因组缺少 Pax3；其旁系同源基因 Pax7 发生突变后，表型与 Pax3 或 Pax7 突变小鼠相似。基因组 DNA 来自一只三岁的实验室繁殖 d/d 成年雄性。这一单个基因组和编辑实验不能说明野生种群中相关性状的频率，也不能确定变化发生的演化时间。
        gaps:
          - One genome assembly and associated experiments do not resolve genomic variation across the species, the evolutionary timing of the reported changes, or broader evolutionary history.
      distribution:
        status: not-assessed
      fossil:
        status: not-assessed
      conservation:
        status: not-assessed
