    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte with reduced leaves, 20-30 cm, tunics fibrous. Leaf produced after flowering on a separate shoot, solitary, terete and 4-grooved, thinly hairy. Flowers bilabiate, pale blue to mauve with yellow markings on lower tepals.
            textZh: Gladiolus subcaeruleus G.J.Lewis 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 7234; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: An autumn-flowering species recognised by the fibrous corm tunics forming a collar around the base of the stem, three or rarely four, ± entirely sheathing leaves on the flowering stem, and pale blue, funnel-shaped flowers with transverse yellow bands or spear-shaped markings edged with purple on the lower tepals. The solitary foliage leaf, produced from a separate bud later in the season, is terete and 4-grooved, with scattered long hairs along the edges of the grooves. Gladiolus martleyi from sandy soils has softly papery or membranous corm tunics and pink to mauve flowers with slightly shorter perianth tube, 11-12 mm long, and a glabrous foliage leaf.
            textZh: SANBI 条目提供了 Gladiolus subcaeruleus G.J.Lewis 的鉴别特征。
