    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants 40-75 cm tall. Leaves deciduous, up to 75 cm long; petiolate; petiole variable in length and proportion to leaf-blade, green or purple or striped and mottled with purple at the base, sometimes with soft hairs towards the base; blade maculate or immaculate, oblong- or triangular- to orbicular hastate, up to 40 cm long and 25 cm broad; lower lobes variable from short and rounded to long triangular with rounded apex, or strap-shaped with a blunt or acute apex. Peduncle up to 75 cm long, green or sometimes stained or mottled with purple, sometimes with soft hairs towards the base. Spathe 2.5-17 cm long, seldom without a dark purple area at the base inside, varying in colour from white through ivory, cream, straw-coloured to pale yellow and, seldom, coral pink, the colour outside greenish at the base, intensifying upwards as the spathe matures; tube sometimes open to the base, mostly variably convolute, broadening towards the apex; limb subtruncate to gradually tapering, apiculate, somewhat recurved. Spadix sessile or stipitate; ovaries not interspersed with staminodes, 3-locular with 3-4 ovules per locule. Fruits few to many, up to 2 cm in diam., green, crowded, 4-8 seeded, upper surface flattened, persistent stigma short and sunk.
            textZh: Zantedeschia albomaculata (Hook.) Baill. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_282_0
            locator: "SANBI/WFO archive Morphology row 79487; source identifier 282.0; cited publication: Letty, CL. 1973. The genus Zantedeschia. Bothalia 11(1): 5 - 26. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: "It differs from Z. aethiopica in many important respects: it is deciduous, it has no staminodes among the female organs, its fruit remains a firm berry until germination and does not turn orange-coloured and become pulpy while still on the peduncle. The present concept of Z. albomaculata is a relatively broad one and includes several forms which have in the past been upheld as distinct species. In this complex there is considerable variation in leaf shape and degree of maculation, as well as in spathe shape and colour. To some extent this variation is linked with geographical distribution and therefore three subspecies are upheld."
