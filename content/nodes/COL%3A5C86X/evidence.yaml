        status: partially-supported
        claims:
          - text: The study detected ferrichrome in Xanthoria parietina thalli and in culture of a mycobiont isolate; ferrichrome addition promoted growth of the tested Trebouxia decolorans photobiont strain. This is a strain-level experimental result and does not show that all X. parietina populations or lichen symbioses respond in the same way.
            sourceIds:
