            locator: Results on ferrichrome production and algal growth; Methods describing fungal isolate L2379 and Trebouxia decolorans strain MT603980.
            placeTimeScope: Laboratory assays reported in 2026; study thalli include Austrian field samples. The article states the fungal isolate L2379 and the Trebouxia strain were not from the same thallus; L2379 is not linked to a specific Supplementary Table S5 site/date in the audited record.
            lifeStatus: Lichen thalli and an axenically cultured single-spore mycobiont isolate were studied alongside a separately cultured photobiont strain; no domesticated or fossil material is represented.
            originalLanguage: en
        gaps:
          - One mycobiont isolate and one separately sourced photobiont strain do not establish the prevalence or magnitude of the interaction across the species or natural symbiont pairings.
          - The isolate is not linked to a unique wild collection site and date in the audited record, and the laboratory assay does not quantify field-level growth effects.
          - Morphology, life history, broader ecology, evolution, complete distribution, fossils, and conservation remain unassessed; systematic search are incomplete.
