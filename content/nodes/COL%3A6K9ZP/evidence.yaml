    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants acaulescent, decumbent to erect, 50-80 mm tall, up to 120 mm in diameter, proliferating from base to form dense clusters up to 150 mm in diameter. Roots fleshy, up to 3 mm in diameter. Leaves distichous, lorate, 35-80 mm long, 14-25 mm in diameter at base, erectly spreading, often becoming patent (apices incurved during dry season); surface minutely asperous, mottled with dark green and white spots, adaxial surface plane to convex, abaxial side convex; margin tuberculate towards obtuse or acute, mucronate apex. Juvenile leaves distichous, lorate, patent to ascending, similar in texture and colouring to adult leaves. Inflorescence a simple raceme, 120-400 mm long. Scape 3-4 mm broad and flattened at base; floral bracts 5-7 x 2-3 mm, piliferous; pedicel 3-4 mm long, pink. Perianth 15-17 mm long, stipitate for 2-3 mm, globose to globose-ovoid for about a third of perianth length, gasteriform basal portion 6-8 mm wide, pink, upper third pale pink to almost white with green striations, 4 mm in diameter; segments free, apices obtuse, erect becoming erectly spreading. Stamens 10-14 mm long; anthers 2.0-2.5 x 1 mm, included. Ovary 6-7 mm long, green; style 6 mm long; stigma included or just exerted, minute, curved upwards. Capsules 18 mm long, obtuse at apex. Seeds 3-4 x 2-3 mm, black.
