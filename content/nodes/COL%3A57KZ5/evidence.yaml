          title: Tovaria pendula Ruiz & Pav., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Erect or sprawling vinelike herbs or shrubs to 1.5 m tall (Panama), rarely trees, glabrate, fetid, sap clear; stems branching, terete but with numerous fine lines. Leaves alternate, trifoliolate, the leaflets ovate to lanceolate, to 15 cm long, 3.5 cm wide, the middle leaflet largest, apically acute or acuminate, basally obtuse, the lateral leaflets somewhat oblique, entire or minutely crenate, the costa stramineous, the lateral nerves 20-30 on each side, sometimes not distinct from the reticulate minor venation, arcuate, anastomosing near the margin, subsessile; petioles slender, erect, mostly 3-5 cm long, sometimes minutely puberulent near the base. Inflorescence an elongate, lax open terminal raceme to 20 cm long, the pedicels slender, ca. 15 mm long, subtended by linear bracts 2-8 mm long which arise slightly below the point of pedicel insertion; rachis mostly subterete, glabrous or minutely puberulent. Flowers greenish, white, or yellow, 6-8-merous, the calyx lobes lanceolate to ovate, 3-5 mm long, sometimes minutely ciliate; petals oblong or elliptical, stipitate, basally ciliate and sometimes basally pubes- cent ventrally; stamens inserted on a small dark disc which is produced into minute nectaries between the stamens, the filaments flat, broadened in the lower 1/2, pilose on the edges and dorsal side of the broadened portion, basally glabrous and sometimes differentiated, 1-1.5 mm long at the anthesis) the anthers ovoid hastate, 1-2 mm long, basifixed and subversatile, dehiscing longitudinally and partially curling, papillose or minutely pubescent, especially dorsally, apically drawn into a minute beak; ovary ovoid, 1-locular but partially separated into 6-8 chambers by the axile placentas, the ovules numerous, the style stout, the stigmas 6-8 short, dark, hornlike processes. Fruit a slimy berry ca. 1 cm across, subglobose, topped by the persistent, peglike style and the patent stigmas, stipitate on the disc; seeds minute, compressed, reniform, smooth, reddish brown, 0.8 mm across, immersed in the white-drying pulp.
