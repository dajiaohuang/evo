    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Like H. rudis but leaves oblanceolate-cuneate and calyx lobes glabrous except along margins.
            sourceIds:
              - sanbi_14353_0
            locator: "SANBI/WFO archive Morphology row 8395; source 14353.0; publication: Manning, JC; Goldblatt, P. 2012. Malvaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 613 - 621. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: The distinguishing characters are found mainly in the flowers. The parchment-like calyx is distinctly 5-angled, the angles extending from the sinuses to the base of the calyx with the portion between being concave. The calyx is broad at the base and the lobes do not spread nor reflex at any time. The shortly exserted petals are strongly twisted and lemon -yellow grading into orange-red. Characteristic too is the blade of the petal which is broadly oblong and several times longer than the basal claw.
            textZh: SANBI 条目提供了该种的鉴别特征。
            sourceIds:
