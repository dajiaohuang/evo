    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, 30-50 cm, mostly with 2 or 3 long straight branches with flowers crowded distally. Leaves sword-shaped to linear. Flowers mostly 4 to 7 in dense spikes, white to pink (purple), with yellow cup, tube funnel-shaped, 8-11 mm long, filaments usually exserted 1-2 mm, occasionally reaching top of tube.
            textZh: Ixia divaricata Goldblatt & J.C.Manning 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 7145; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Unmistakable in its unusual branching pattern; the stiff, straight lateral branches are held at angles of 30-50° to the main axis and bear mostly 3 to 5 flowers crowded in the distal half. The white or pale pink (rarely deep pink or purple) flowers are held erect, with the tepals spreading but not fully patent The immediate relationships of Ixia divaricata are most likely with I. latifolia, with which it was associated historically. Confusion with that species is due in part to some collections with a longer tube, 12-14 mm and also with relatively short, broad leaves, up to 18 mm wide (also found in I. latifolia) but fairly slender branches (characteristic of I. divaricata). These are almost certainly hybrids between the two species, which sometimes grow within sight of one another, although on different soils, I. latifolia favouring heavy clay or loam.
            textZh: SANBI 条目提供了 Ixia divaricata Goldblatt & J.C.Manning 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 95055; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
