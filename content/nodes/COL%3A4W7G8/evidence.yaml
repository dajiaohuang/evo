    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Perennial herbs with slender, creeping stems, mat-forming. Leaves suborbicular, reniform, or ovate-cordate above the abruptly narrowed petiole-like base, rarely ovate-rhomboid and gradually narrowed towards the base, obtuse to acute, the blade often broader than long. Inflorescence a terminal few-flowered cyme or flowers solitary; bracts similar to the leaves, or the upper ones much narrower. Calyx of 5 segments, each 4-6 mm long, 1-2 mm broad, lanceolate to elliptic-lanceolate to ovate, acute, usually mucronate, the sides thin with hyaline margins, joined for 0.5-1.5 mm, keeled or with a thick wing up to 0.75 mm broad. Corolla yellow; tube 5-8 mm long; lobes 4-9 mm long, 1.5-4.5 mm broad, oblanceolate-spathulate to ovate or obovate, clawed, rounded. Filaments 0.75-2 mm long, inserted in the corolla-sinuses; anthers 1.5-3.5 mm long, each with a small, round, yellow, or a fairly big, orange, apical gland. Style and stigma 4.5-7.5 mm long with stigmatic swelling below the middle; stigma capitate, 2-lobed.
            sourceIds:
