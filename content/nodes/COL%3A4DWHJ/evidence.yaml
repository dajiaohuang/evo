    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Perennial, long rhizomatous and tufted (often decumbent), up to up to 0.6 m high. Rhizome well developed, almost woody, clad in overlapping leaf sheaths. Leaf blades 60-240 mm long, 4-10 mm wide. Spikelets 2.8-3.7 mm long, 2.0-2.8 mm wide. Racemes 2 (occasionally 3), 25-130 mm long; rhachis often zigzag; spikelets glabrous, glossy, tips rounded, more than 1.5 times longer than wide and arranged in 2 rows.
            textZh: Paspalum notatum Flüggé 的 SANBI 物种条目记录了形态特征。
            sourceIds:
