      morphology:
        status: partially-supported
        claims:
          - text: Tufted perennial 300-500 mm high; stolons present; basal sheath of burnt-off leaf-bases or fibrous; leaves basal; glands absent. Leaf blade to 300 x 0.5-2.0 mm, rolled, rigid, truncate, glabrous; margins smooth; sheath mouth hairy. Inflorescence open, 60-100 x 60-90 mm, with ± 50 spikelets; pedicels not hidden by spikelets, glabrous; axils glabrous. Spikelet 6-10 mm long; glumes acute, green, glabrous; lemma 3.5 mm long, hairy all over; lateral awns 1-5 mm long, not reaching to exserted from glume apices (almost absent in Eastern Cape to well developed in KwaZulu-Natal); central awn 3-11 mm; palea hairy in upper half; anthers 3.2-4.0 mm long.
