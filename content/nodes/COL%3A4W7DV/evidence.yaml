    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Slender, annual (or biennial ?), erect or ascending herbs, simple or much-branched from the base, 5-15 cm high. Leaves up to 1 cm long and nearly as broad, ovate-orbicular to ovate-lanceolate, rounded or acute; lower leaves sometimes crowded. Inflorescence very lax, branched and pedicels long and slender, cymes few-flowered; bracts ovate to lanceolate, acuminate. Calyx of 5 segments, each 3-5 mm long, 0.5-1.25 mm broad, lanceolate, ovate-lanceolate or more or less oblong, acute or acuminate, the sides membranous, joined for 0.75-1.5 mm, margins entire or erose, keeled or very narrowly winged. Corolla yellow; tube 4.5-7 mm long; lobes 2.25-4.5 mm long, 0.75-2.5 mm broad, ovate-oblong or obovate-oblong, rounded or truncate and apiculate, or sometimes acute, entire or erose. Filaments very short, inserted 0.5-1 mm below the corolla-sinuses; anthers 0.5-1.25 mm long, each with a large, oblong, stipitate or a small, round, apical gland. Style and stigma 2.5-6 mm long, swelling rather small, usually below, but sometimes above the middle; stigma capitate or shortly clavate, 2-lobed.
