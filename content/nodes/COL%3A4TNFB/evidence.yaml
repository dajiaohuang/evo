          title: Ruellia praeclara Standl., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrub to ca. 2 m tall; stem quadrangular in younger portions, terete below, glabrous when old, glabrous to sparingly appressed pilose when young, grooved. Leaves elliptic to elliptic oblanceolate, to 30 cm long, 9 cm wide, apically acumi- nate, basally attenuate, glabrous to sparingly strigose at the costa above, ap- pressed pilose beneath, mostly at the costa and the veins, the cystoliths dense and prominent on both the surfaces, the costa and the veins raised and prominent beneath, the margins crenate to undulate; petioles to 3 cm long, glabrous to sparingly strigose; pedicels axillary, solitary; bracts linear to 3 cm long, 2 mm wide, apically acute, sparingly sericeous. Flowcers with the calyx segments linear, to 3.5 cm long, 1.5 mm wide, sericeous and with numerous shorter glandular hairs; corolla white, to 10 cm long, puberulous glandular, the tube funnelform, to 9 cm long, 3 mm broad basally, expanding to 9 mm wide at the mouth, curved to one side, the lobes orbicular, ca. 2 cm in diameter; stamens included, the filaments glabrous, the anthers 5 mm long; ovary pilose, the style hispidulous. Capsules not seen.
          originalLanguage: en
          sourceField: general
