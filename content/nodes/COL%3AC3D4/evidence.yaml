    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Arborescent succulent, up to 4 m high. Inflorescence repeatedly branched. Racemes capitate, bicoloured. Perianth up to 30 mm long, mouth upturned. Flowers orange-red to red in bud, yellow to greenish yellow at anthesis.
            textZh: Aloe angelica Pole-Evans 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_11118_0
            locator: "SANBI/WFO archive Morphology row 151; source identifier 11118.0; cited publication: Herman, PPJ; Retief, E. 1997. Plants of the northern provinces of South Africa: Keys and diagnostic characters. Strelitzia 6: 1 - 681. National Botanical Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: The capitate, bicoloured racemes of this species are unique in the section. With its tall stem and strongly recurved leaves, A. angelica may recall A. alooides when not in flower.
            textZh: SANBI 条目提供了 Aloe angelica Pole-Evans 的鉴别特征。
            sourceIds:
              - sanbi_5961_0
            locator: "SANBI/WFO archive Diagnostic row 51267; source identifier 5961.0; cited publication: Glen, HF; Hardy, DS. 2000. Aloe. In: G Germishuizen & E du Plessis (eds), Aloaceae (first part), Fl. S. Africa 5(1,1): 1 - 167. National Botanical Institute, Pretoria. [http://www.biodiversitylibrary.org/item/209564#page/3/mode/1up]. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: It is a very distinctive species with its much-branched inflorescence of bicoloured capitate racemes. Plants reach 9-12 ft. in height (sometimes more) and vary much in branching of the stem. Simple stemmed plants are usually taller and grow in denser bush, whereas branched specimens are lower and usually occur in more open positions. Usually the old dry leaf remains adhere to the stem for about half-way down.
            textZh: SANBI 条目提供了 Aloe angelica Pole-Evans 的鉴别特征。
