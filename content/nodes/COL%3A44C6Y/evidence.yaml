        claims:
          - text: Cormous geophyte, 20-45 cm, stems sticky. Leaves 2 or 3, linear, channelled and trailing or loosely coiled. Flowers tiny, yellow to brown or cream-coloured, tepal limbs often strongly reflexed.
            textZh: Moraea inconspicua Goldblatt 的 SANBI 物种条目记载了植株、叶片和花部形态。
            sourceIds:
              - sanbi_13878_0
            locator: Strelitzia 29; archive Morphology row 6929, source 13878.0
            placeTimeScope: Regional species account published 2012; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
          - text: With the smallest flowers in subg. Visciramosae, Moraea inconspicua is distinguished by its flowers with fully reflexed tepals, the outer mostly 12-18 mm long (rarely up to 25 mm), the limb at least twice as long as the claw. In addition the rhipidial spathes are short, usually less than 28 mm long and sometimes only 18 mm. Flower colour is variable, mostly yellow or partly to completely brown, but white-flowered morphs occur in the Biedouw Valley near Clanwilliam and on the Agulhas Plain near Elim, the latter with the smallest flowers recorded in the species. In Namaqualand flowers are sometimes ivory-coloured or pink, but also yellow or brown as elsewhere. The foliage leaves are usually straight and erect below but often trailing distally, and have channelled blades, but plants from Namaqualand have distinctive spirally coiled leaves with a plane surface and on this basis have been segregated as subsp. namaquensis. Populations from the northern Cederberg and Biedouw Valley have unusually large flowers for the species, the outer tepals up to 25 mm long, thus matching those of closely allied M. bituminosa. The narrow leaves, short style crests and almost fully reflexed tepal limbs conform to M. inconspicua. Superficially similar Moraea viscaria, is a white-flowered species with spreading tepals 15-23 mm long, a strong floral odour, and relatively well-developed style crests up to 6 mm long, half as long to ± as long as the style branches. Moraea saldanhensis may also be confused with M. inconspicua but has slate-blue flowers with the tepal claws as long as to slightly longer than the limbs, the latter usually reflexed to ± 45º.
            textZh: SANBI 条目提供了 Moraea inconspicua Goldblatt 的鉴别特征。
