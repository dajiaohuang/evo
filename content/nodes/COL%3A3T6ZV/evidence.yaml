      ecology:
        status: partially-supported
        claims:
          - text: The point-transect-with-lures census estimated 3,706 golden lion tamarins (95% CI 1,863–5,383) in 2014. The authors estimated approximately 59% (2,176) were from remnant wild populations, 34% (1,281) descendants of captive-born reintroduced animals, and 7% (249) descendants of translocated wild groups; these are survey-based historical estimates, not direct counts or current abundance.
            sourceIds:
              - ruizmiranda2019
            locator: Results, paragraph reporting 3,706 individuals and population origins; Table 2; Methods section Censusing GLTs throughout their geographic range
            placeTimeScope: Seven management units across golden lion tamarin range in Rio de Janeiro state, Brazil; geographic distribution sampled using playback surveys from August 2013 to January 2014; abundance estimate refers to 2014.
            lifeStatus: Wild metapopulation estimate includes remnant wild populations, descendants of captive-born reintroduced animals, and descendants of wild translocated groups; no currently captive animals are counted.
            originalLanguage: en
        gaps:
          - The estimate is specific to the 2014 survey and its seven management-unit design; it does not establish current population size or subsequent trend.
          - Other ecology, range completeness, demographic rates and independently assessed conservation status were not evaluated in this batch.
