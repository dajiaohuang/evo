    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Acaulescent, succulent herb, up to 300 mm tall. Leaves not fibrous, margins usually minutely dentate, 220-300 x 5-10 mm, in a rosette. Flowers reddish pink or rarely white.
            textZh: Aloe myriacantha (Haw.) Schult. & Schult.f. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_11118_0
            locator: "SANBI/WFO archive Morphology row 178; source identifier 11118.0; cited publication: Herman, PPJ; Retief, E. 1997. Plants of the northern provinces of South Africa: Keys and diagnostic characters. Strelitzia 6: 1 - 681. National Botanical Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: The southern African aloe most similar to A. myriacantha is A. albida. A. myriacantha is usually a much larger plant than A. albida, although small plants are found in 'hostile' habitats, such as thin soil on the edge of rock outcrops. The flowers of A. myriacantha are usually pink, although they may occasionally be very pale and appear almost white. The grey-white flowers with greenish tips characteristic of A. albida are not found in this species. Plants of A. myriacantha very rarely form clumps, unlike those of A. albida.
            textZh: SANBI 条目提供了 Aloe myriacantha (Haw.) Schult. & Schult.f. 的鉴别特征。
            sourceIds:
              - sanbi_5961_0
            locator: "SANBI/WFO archive Diagnostic row 51308; source identifier 5961.0; cited publication: Glen, HF; Hardy, DS. 2000. Aloe. In: G Germishuizen & E du Plessis (eds), Aloaceae (first part), Fl. S. Africa 5(1,1): 1 - 167. National Botanical Institute, Pretoria. [http://www.biodiversitylibrary.org/item/209564#page/3/mode/1up]. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: A. myriacantha is the largest species in this Section, and is found from near sea-level up to 2.0 ft. Solitary plants occur scattered about the veld a few yards and more apart, usually in grassy stony places, in summer rainfall areas of 25 in. and more. Its nearest ally in size is A. minima which differs in having flowers half the length, and mouth regular. In flowers, A. albida is a near ally, but is a much smaller plant with dull white flowers greenish tipped.
            textZh: SANBI 条目提供了 Aloe myriacantha (Haw.) Schult. & Schult.f. 的鉴别特征。
            sourceIds:
              - sanbi_13236_0
            locator: "SANBI/WFO archive Diagnostic row 78139; source identifier 13236.0; cited publication: Reynolds, GW. 1974. Aloes of South Africa, 3rd ed. A.A. Balkema, Cape Town. [All rights reserved]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
