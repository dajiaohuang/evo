        claims:
          - text: Blanta caespitosa humilis, 7 cm. alta. Folia fere erecta vel patenti-incurvata, in genere gracilia, lateraliter visa acuta vel acuminata, alterum paris superne leviter ampliatum, 4 mm., vel rarius ad 5 mm., diam., alterum 2-3 mm., sat aspera punctis subprominentibus, glauco-viridia, saepe fere coeru-lescentia, 3-4 cm. longa. Flores folia vix superantes vespertini nocturnique, 3 cm. diam.; receptaculum turbinatum, apice 1 cm. diam. Sepala 5, subaequilonga, ad 1.5 cm. longa, exteriora basi 6-7 mm. lata. Petala, numerosa, 3-4-seriata, adscendentia vel patentia, apice incurvata et rubra, aliter aurea, acuta sepalis parum breviora, 8-13 mm. longa, saepius ad 1 mm., rarius ad 1.5 mm., lata. Stamina mox subdiffusa, filamentis luteis, inferne albis, papillatis, ad 1 cm. longis, antheris luteis. Glandulae conspicuae crenulatae. Ovarium supra profunde concavum, in medio vero 5-lobatum, lobis brevissimis, ad se arete appressis. Stigmata gracilia, superne attenuata, setaceo-acuminata, ad 1 cm. longa.
            sourceIds:
