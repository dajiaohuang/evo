    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Suffrutex, erect, virgate, laxly branched above, ultimate branchlets ending in an inflorescence which often turns slightly aside with a younger branchlet developing below and overtopping it, sparsely pubescent with minute stellate hairs, sometimes with short, gland-tipped hairs intermingled, often also subsparsely hirsute with long, pointed, patent hairs about 1-1.5 mm long arising singly or 2 or more from a bulbous base, apparently caducous or readily broken off. Stipules acuminate to abruptly acuminate, ±5-12 mm long, base broad to subcordate sometimes very oblique and subamplexicaul, pubescence as on branchlets but sometimes denser. Leaves petiolate; blade fairly narrowly to broadly oblong, oblong-obovate or oblong-ovate, cuneate in lower third, 15-40 mm long, 7-20 mm broad, crenate except at cuneate base, 3-nerved at base, nerves impressed above, prominent beneath, subflabellately branched, upper surface finely stellate-pubescent and minutely papillose and usually sparsely to densely pilose with long, pointed hairs, undersurface usually, at least when young, whitish tomentose with fine stellate pubescence; petiole 3-15 mm long, pubescent. Inflorescence terminal, of lax, paniculate cymes; bracts 2- or 3-nate, occasionally the third a long, subulate bract, otherwise like stipules varying from ±5 mm long and acuminate from a fairly broad base, to 14 mm long and abruptly acuminate from a broad, oblique subcordate, decurrent base; peduncles and pedicels with pubescence as on branchlets. Calyx lobed to above middle, about 6 mm long, sinuses broad, texture thin, minutely stellate-pubescent, densely so at base (on cultivated plants?), sometimes long, bulbous-based hairs and short, gland-tipped hairs present. Petals about 7 mm long, narrowed about midway into a claw, blade suborbicular, claw with inrolled margins obscurely ciliate. Stamens about 4 mm long, with filaments cohering at base, hyaline, oblong-obovate, 2.5 mm long, about 1 mm broad near apex, sparsely stellate on shoulders, anthers 2 mm long, ciliate, overlapping filament at base. Ovary 5-lobed, stellate-pubescentes specially along the sutures, rays short, but with longer bristle-like hairs at apex; stipe 0.5 mm. Capsule about 6 mm long, minutely and finely stellate-pubescent between sutures, more coarsely so on sutures.
            sourceIds:
              - sanbi_815_0
            locator: "SANBI/WFO archive Morphology row 73926; source 815.0; publication: Verdoorn, IC. 1980. Revision of Hermannia subgenus Hermannia in southern Africa. Bothalia 13(1&2): 1 - 63. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: In some respects H. repetenda resembles H. multiflora but differs in the fine stellate pubescence or hispid hairs on the calyx in contrast to the dense, brownish, stellate tomentum on the calyces of H. multifiorum.
