  claims:
    - subjectId: taxon:plantae
      claimKind: scientific
      claimType: fossil-range
      statement: The Plantae root display uses the approximately 473–471 Ma Zanjón cryptospore assemblage as a sampled embryophyte-on-land anchor and extends to living representatives; it is not a first appearance for all Plantae or a crown-bryophyte record.
      confidence: high
      confidenceRationale: The dated cryptospore assemblage is directly described and illustrated, but the root entity is broader than the sampled embryophytes. The range is therefore an explicitly scoped navigation envelope rather than a total-clade origination date.
      referenceLinks:
        - referenceId: rubinstein-2010-dapingian-cryptospores
          relation: supports
          pages: 365–369
          figure: Figures 1–2; Supporting Figures S1, S3 and S4
          quoteLocator: "Summary; Results: Zanjón Formation palynological assemblage; Discussion of embryophyte affinity"
  claim-rationales.zh:
    - 有明确年代和图示的隐孢子组合直接支持有胚植物采样记录，但根实体范围更广，因此该范围只是明确限定的导航包络，不是全类群起源时间。
  claim-statements.zh:
    - 植物界根节点以约 4.73–4.71 亿年前的 Zanjón 隐孢子组合为有胚植物登陆的采样锚点，并延伸到现生代表；它不是全部植物界的首现，也不是冠群苔藓植物记录。
