        claims:
          - text: Cormous geophyte, 20-50 cm. Leaf solitary. Flowers white to cream-coloured or brownish, rarely violet, inner tepals tricuspidate with inrolled or straight, central cusp.
            textZh: Moraea unguiculata Ker Gawl. 的 SANBI 物种条目记载了植株、叶片和花部形态。
            sourceIds:
              - sanbi_13878_0
            locator: Strelitzia 29; archive Morphology row 7371, source 13878.0
            placeTimeScope: Regional species account published 2012; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
          - text: A slender plant with one of the smallest flowers in subg. Vieusseuxia, the outer tepals typically 12-18 mm long with limbs ± 8-10 mm long. Flowers are unusually varied in tepal orientation and colour. The most common morph has outer tepal limbs half reflexed and white to creamy yellow, darkly speckled near the base, but populations in the Ceres area of the Western Cape have attractive dark blue-violet tepals. A second morph, corresponding to the synonym, M. tenuis, has the outer tepal limbs fully reflexed and the tepals dull pinkish brown with pale yellow, velvety nectar guides. These morphs may represent separate taxa but so far attempts to refer all herbarium collections to one or other morph have failed owing to the presence of apparent intermediates. Plants consistently have filaments united in a slender, smooth column with only their tips free, comparatively narrow style branches, short narrow crests, and 3-lobed inner tepal limbs, the longer central lobe linear and symmetrically coiled inward. Evidently closely related, M. bellendenii and M. tricuspidata have larger flowers, also with 3-lobed inner tepals but with the central lobe asymmetrically coiled. Also easily confused with M. unguiculata, M. rivulicola has somewhat larger flowers of very similar structure but with outer tepals up to 24 mm long, unbearded tepal claws, and a larger ovary and capsule, the latter 25-32 mm long vs. 13-15 mm in M. unguiculata. The two species co-occur at some sites in Namaqualand in slightly different habitats. An odd variant of Moraea unguiculata from the Kamiesberg of central Namaqualand has linear, filiform inner tepals but otherwise seems to conform to the species. Typical M. unguiculata with 3-lobed inner tepals also occurs in the Kamiesberg.
            textZh: SANBI 条目提供了 Moraea unguiculata Ker Gawl. 的鉴别特征。
