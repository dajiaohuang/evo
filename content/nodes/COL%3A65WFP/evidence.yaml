          - text: A. monotropa, belonging to the section Saponariae, has a distinctive growth-form and the secund flowers distinguish it from all other species in this group. The flowers of A. monotropa are not unlike those of A. secundiflora Engler, from Kenya and Tanzania but the flowers have the typical constriction above the ovary which links it with the Saponariae.
