    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Acaulescent or shortly caulescent, succulent herb, up to 300 mm tall, excluding inflorescence. Stem usually procumbent. Leaves ± 20 per rosette, spreading, 340-400 x 45-60 mm. Raceme secund. Perianth mouth upturned. Flowers old rose, rarely yellow.
