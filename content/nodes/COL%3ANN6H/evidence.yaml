          title: Buddleja nitida Benth., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrub or small tree 3-10 m high; youngest branchlets with a closely appressed puberulence of minute stellate trichomes ca 0.1-0.2 mm broad, soon glabrous, the internodes 0.5-2(-3.5) cm long; older branches developing gray or grayish-brown bark. Leaves with petioles 3-22 mm long which are connected by stipular lines; blades oblong-lanceolate, 2.3-8 cm long, 0.6-2.6 cm broad, apically acute or at- tenuate, basally cuneate to rounded, subcoriaceous, densely appressed-puberulent beneath with stellate trichomes 0.1-0.2 mm broad, glabrous or with a few scattered stellate trichomes above, the midvein raised beneath, the secondaries 8-20 in num- ber, usually apparent (at least below), not arcuate, anastomosing marginally, the tertiaries usually obscure above and below. Inflorescences paniculate, 2-8 cm long, with 3 or sometimes 4 orders of branching, the ultimate units small 3-flowered dichasia which are subsessile or short-pedunculate. Flowers with pedicels 0-1 mm long; calyx funnelform or campanulate, stellate-tomentellous externally, the tube 1-2.5 mm long, the lobes deltoid, 0.5-1 mm long; corolla funnelform, stellate-tomentellous externally, internally with unbranched pitted trichomes ca 0.5 mm long randomly dispersed on the lower 2/3 of the lobes and the upper 1/3 of the tube, the tube 2.5-3 mm long, the lobes ovate, 1-2 mm long, imbricate in bud; anthers 0.7-1 mm long, the filaments becoming free from the corolla-tube near the middle or almost at the throat, the free-portion ca 0.5 mm long; ovary sub- globose to ovoid, 1-1.5 mm long, externally appressed-stellate-puberulent, the ovules oc per locule, the placenta a central column 0.7-1 mm broad often remain- ing attached basally after the seeds are shed, the style ca 1 mm long, the stigma 1 mm long, minutely retuse. Capsules narrowly ovoid or subcylindrical, 4-5.5 mm long.
