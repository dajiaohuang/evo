        usage:
          title: Trichilia tomentosa Kunth, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Tree to 15 m. tall. Lecaes to 30 cm. long, imparipinnate; leaflets 3 to 4 pairs borne oppositely on the rachis, 3-29 cm. long, 1.5-11 cm. wide, elliptical to obovate, the base subacute to cuneate, the apex acuminate obtuse to subacute, pubescent on both surfaces or pubescent along the nerves only or nearly glabrous. Inflorescences axillary, paniculate, sometimes markedly congested, 5-30 cm. long, glabrate to velu- tinous to short-tomentose. Flowers white or cream, 2-3 mm. long, 4- to 6-merous; calyx shallow, deeply deltoid-lobed, glabrate to pubescent without; petals obovate or elliptical, generally minutely velutinous without, glabrate within; stamens twice as many as the petals, united into a shallow cup at the base but free for most of their length, glabrous or glabrate without, bearing a patch of long tomentum at the apex of the filaments within, the filaments truncate or bearing 2 short apicula at either side of the anther; anthers glabrate; ovary densely long-pilose; style short; stigma sphaeroidal-capitate. Fruit to about 1.2 cm. long, generally obpyramidal and opening by 2 or 3 valves, orange-yellow or reddish, the valves densely velutinous and transversely striate; seeds usually 1 per capsule, arillate.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 7881
