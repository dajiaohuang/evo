    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Hydro- to hygrophytic perennial 300-1 800 mm high; rhizomatous; leaf sheaths with cross-veins; culms thick, spongy often decumbent and rooting at nodes or floating. Leaf blade 50-400 x 3-15 mm, conspicuously ciliate on margins. Inflorescence dense, spike-like, 40-300 mm long; pedicels smooth. Spikelet 2.5-4.1 mm long, dorsally compressed, obtuse to subacute, plump, elliptic, light green to brown; lower glume subrotund, 5-7-nerved, 1/4-1/3 spikelet length; upper glume 9-11-nerved; lower floret sterile, palea ± reduced, 1.5-1.8 mm long; upper floret 2.2-3.2 mm long, white to pale brown; anthers 0.8-1.1 mm long.
            textZh: Sacciolepis africana C.E.Hubb. & Snowden 的 SANBI 物种条目记录了形态特征。
