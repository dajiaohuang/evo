        status: partially-supported
        claims:
          - text: Perennial herb. Stems solitary to several, short. Leaves grass-like, erect, recurved at middle, 0.28-0.60 m long, 1.5-3.0 mm wide, triangular in cross section, margins and keel entire to serrulate. Inflorescence subequal to leaves, 0.3-0.6 m high, with subcylindric to ovoid, dense raceme. Flowers concolorous, coral-red, orange-red or salmon-red to yellow-orange and pendulous in bud and when mature, 24-35 mm long. Flowering time Jan.-Apr.
