        usage:
          title: Russelia equisetiformis Schltdl. & Cham., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Erect, branched, semileafless herbs to 1 m tall, the stems conspicuously 4-8 angled, the angles stramineous, glabrate, the branching often verticillate, each branch subtended by a leaf or adnate petiole. Leaves opposite or verticillate, subtending branches, oblong, elliptical or ovate, mostly less than 1 cm long, 6 mm wide, entire or-serrate, the lateral veins 2-3 on each side, glabrate with a few scattered glands and minutely tomentose at the base of the costa above; petiole short, minutely tomentose above, the lower 1/2 tightly connivent with the axillary branch, medially callose and with thickened margins. Inflorescences paired, solitary or dichasial flowers scattered through the upper part of the plant, or condensed into open cymes or panicles, the peduncles to 15 mm long, the pedicels slender,' sometimes purplish, 6-S8 mm long, each subtended by a scalelike glabrate bract. Flowers small but showy, the calyx 2-3 mm long, the 5 deltoid lobes free to near the base, imbricate, glabrous, mostly eglandular; corolla tubular, scarlet, 15-30 mm long, glabrous but glandular in the throat, the lobes short, obtuse, similar; stamens 4, inserted at the base of the corolla tube, the anther thecae ovoid or elliptical, strongly divaricate, obliquely con- nivent at the base, 0.6-1.0 mm long, all situated on the lower side at the corolla mouth; style apically curved. Capsule not seen.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 12833
