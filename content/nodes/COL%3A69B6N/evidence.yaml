            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: This very short plant with the crowded spikes at first glance reminds one of the British coastal form of C. serotina Merat, but closer examination shows that the utricles of the South African plant are about twice the size of those of C. serotina, and of the other European species of the group I would place C. monotropa nearest to C. flava L. itself. It is fascinating to speculate on how this plant, whose loneliness is indicated in its epithet, reached its high and isolated home. Its nearest relatives are in Argentina, in Tasmania, and beyond the Sahara barrier to the north. Still, C. barrosii is similarly isolated, and to a less degree the two Australasian species.
