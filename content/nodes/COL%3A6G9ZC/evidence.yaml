    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Perennial, tufted (sometimes geniculate), up to 1 m high. Leaf blades 100-250 mm long, 2-4 mm wide. Spikelets 5-12 mm long, 1.0-2.5 mm wide, with rhachilla persistent, lemmas and/or paleas breaking up from base upwards; lemma glabrous or with hairs shorter than 0.3 mm; palea keels with hairs 0.3-2.0 mm long, extending beyond lemma; anthers 3.0,8-1.2 mm long.
