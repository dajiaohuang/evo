    facets:
      morphology:
        status: not-assessed
        claims: []
        gaps:
          - The diet experiment does not assess diagnostic morphology or species-level anatomical variation.
      lifeHistory:
        status: partially-supported
        claims:
          - text: In a captive broodstock experiment, females fed a mixed-crustacean diet produced 78.1±6.5 egg clusters per kg body weight, compared with 31.1±13.3 in the mixed-fish diet group; each diet group contained four females. The broodstock originated as wild sub-adults caught in the Ionian Sea near Gallipoli, Italy, and were then kept in a recirculating aquaculture system in Cesenatico. This diet-group result describes captive reproduction, not fecundity in wild populations.
            textZh: 在一项圈养亲本实验中，混合甲壳类饲料组雌性每千克体重产卵团数为 78.1±6.5，混合鱼类饲料组为 31.1±13.3；每种饲料组均有四只雌性。亲本为从意大利加利波利附近爱奥尼亚海捕获的野生亚成体，之后在切塞纳蒂科的循环水养殖系统中饲养。该饲料组结果描述的是圈养繁殖，并非野外种群的繁殖力。
            originalLanguage: en
            sourceIds:
              - casalini2020octopus
            locator: Abstract; Results, “Regarding egg clusters”; Table 2; Methods, Animals and feeding-group design.
            placeTimeScope: Wild sub-adults were caught at the end of February in the Ionian Sea near Gallipoli, Puglia, Italy, and transferred to a recirculating aquaculture system in Cesenatico. The article does not specify the collection/trial calendar year.
            lifeStatus: Wild-caught sub-adults became captive broodstock; the reproductive outcome was measured under managed feeding in a recirculating aquaculture system.
        gaps:
          - A single captive broodstock comparison with four females per diet does not establish wild fecundity, lifetime reproductive output, natural diet effects, or geographic variation.
      ecology:
        status: not-assessed
        claims: []
        gaps:
          - Captive feeding groups do not establish natural diet, habitat use, or field ecological interactions.
      evolution:
        status: partially-supported
        claims:
          - text: In a study of 193 adult Octopus vulgaris collected by local fishers at seven Mediterranean localities and one nearby Atlantic locality, analysis of 13 microsatellite loci distinguished the Ria Formosa Atlantic sample and the Strait of Messina sample from the other sampled groups; the authors reported 23 private alleles in Ria Formosa versus 2–7 in each Mediterranean sample. This is population structure among these samples, not a species-wide phylogeny or a resolution of the debated O. vulgaris complex.
            textZh: 一项研究分析了当地渔民在地中海七个地点及附近大西洋一个地点采集的 193 只成年普通章鱼。对 13 个微卫星位点的分析显示，葡萄牙里亚福尔摩萨的大西洋样本和墨西拿海峡样本与其他受采样群体有所区分；作者报告里亚福尔摩萨样本有 23 个私有等位基因，而各地中海样本为 2–7 个。该结果描述的是这些样本之间的种群结构，不是物种范围内的系统发育结论，也没有解决 O. vulgaris 复合群的分类争议。
            sourceIds:
              - deluca2016octopuspopulation
            locator: Abstract; Materials and Methods > Sampling; Results > DNA Barcoding and Genetic diversity; Discussion; Table 1 and Fig. 2.
            placeTimeScope: Seven localities across the Mediterranean Sea and one nearby Atlantic locality (Ria Formosa, Portugal); the article gives the Spanish sample as collected during MEDITS_ES_2014 but does not report collection dates for all samples. Adults were caught near the coast by local fishers.
            lifeStatus: Wild-caught adult specimens were received as preserved or freshly dead material; no live animals were used in the study.
            originalLanguage: en
        gaps:
          - This marker and locality sample does not establish a range-wide species phylogeny, resolve the debated Octopus vulgaris complex, or infer the timing or cause of population differentiation.
      distribution:
        status: not-assessed
        claims: []
        gaps:
          - Collection near Gallipoli is not a geographic range inventory.
      fossil:
        status: not-assessed
        claims: []
        gaps:
          - The study does not assess fossil occurrences or geological age.
      conservation:
        status: not-assessed
        claims: []
        gaps:
          - The captive trial does not establish wild population trends, threats, or a conservation assessment.
