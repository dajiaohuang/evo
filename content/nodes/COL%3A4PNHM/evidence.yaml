        usage:
          title: Psychotria calophylla Standl., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Trees to 8 m tall or shrubs, the branchlets at first terete, ultimately angular, often with porous pith, minutely farinose puberulent or ferrugineous villose. Leaves oblong, oblong rotund or obovate, 13-28 cm long, 3.7-15.5 cm wide, tapering obtusely, widely cuneate or rounded at the apex, the acumen none or to 0.5 cm long, basally acute, often abruptly contracted with a spatulate appear- ance, often markedly inequilateral at the base, the costa subplane above, often grooved, prominent beneath, to 0.4 cm wide proximally, the lateral veins (11-)13- 19(-30), the lowermost subperpendicular, the upper veins often arcuate, subcor- iaceous, drying deep red brown or gray green, glabrate or mealy punctate above, beneath ferrugineous villosulose, especially on the costa and the veins; petioles stout, 1.5-4.0 cm long, to 0.35 cm wide, glabrate to pubescent, the lamina often decurrent; stipules deciduous, free, compressed rectangular, ca. 4 mm long, densely ferrugineous pubescent, coriaceous, with 2 proximate, subulate awns, to 6 mm long, ca. 2 mm wide at the base. Inflorescences terminal, solitary, thrysoid paniculate, to 15 cm long, to 15 cm wide, densely ferrugineous pubescent, sessile or with peduncles 2.5-5.5 cm long, stout, 0.3-0.4 cm wide, the branches of 2-3 well-spaced pairs, 2.5-5.5 cm apart, at least the lowermost 2 pairs opposite, arcuate or sharply ascending, the lowermost to 7 cm long, the flowers in globose fascicles, to 1.5 cm wide; bracts triangular ovate, to 2 mm long, acuminate. Flowers subsessile or sessile; hypanthium subrotund, ca. 1.8 mm long, densely ferrugineous puberulent, the calycine cup scarcely measurable, glabrous and eglandular inside, the teeth 5, triangular or widely oblong, 0.2-2.0 mm long; corolla white or greenish white, the tube cylindrical, inflated above, 3-6 mm long, minutely puberulent outside and densely villose near the mouth, the hairs to 2.2 mm long, the lobes 5, rectangular oblong, to 3 mm long, galeate and crassate; stamens 5, the anthers oblong, 1.2-1.7 mm long, the filaments ca. 1 mm long; styles short and long, 1.5-6.0 mm long, the stigmas 2, 0.65-0.8 mm long. Fruits elliptic, often falcate (by abortion of one seed?), 1.3-1.5 cm long, 0.6-0.7 cm wide, each pyrene 5-ribbed, sparsely pubescent, drying black; pedicels to 0.4 cm long.
