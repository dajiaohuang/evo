  claims:
    - subjectId: taxon:anchitherium
      claimKind: scientific
      claimType: ecology
      statement: Mesowear from 35 Anchitherium aurelianense cheek teeth at Sandelzhausen supports browse-dominated mixed feeding rather than a uniform pure-browser model.
      confidence: medium
      confidenceRationale: The primary study directly measures a named 35-tooth sample. High confidence applies to that species and locality and does not turn one German mesowear signal into a uniform global genus ecology.
      referenceLinks:
        - referenceId: kaiser-2009-anchitherium-diet
          relation: supports
          pages: 131–140
          figure: Figures 1–3; Table 1
          quoteLocator: Diagnosis and European MN3–MN9 context (pp. 131–132); 35-tooth mesowear result and discussion (pp. 133–139)
    - subjectId: taxon:anchitherium
      claimKind: scientific
      claimType: taxonomy
      statement: Anchitherium is treated as an equid genus, with the ecological evidence tied specifically to A. aurelianense at Sandelzhausen.
      confidence: medium
      confidenceRationale: The primary study identifies the type species and its local sample, avoiding a genus-wide diet claim.
      referenceLinks:
        - referenceId: kaiser-2009-anchitherium-diet
          relation: supports
          pages: 131–140
          figure: Figures 1–3; Table 1
          quoteLocator: Diagnosis and European MN3–MN9 context (pp. 131–132); 35-tooth mesowear result and discussion (pp. 133–139)
    - subjectId: taxon:anchitherium
      claimKind: scientific
      claimType: fossil-range
      statement: The atlas’s 20.4–9 Ma occurrence envelope is provisional; the cited study independently records European Anchitherium from MN3 through MN9 without claiming exact global endpoints.
      confidence: low
      confidenceRationale: High confidence applies to the published European biochronologic bracket; the global navigation envelope remains explicitly provisional.
      referenceLinks:
        - referenceId: kaiser-2009-anchitherium-diet
          relation: supports
          pages: 131–140
          figure: Figures 1–3; Table 1
          quoteLocator: Diagnosis and European MN3–MN9 context (pp. 131–132); 35-tooth mesowear result and discussion (pp. 133–139)
    - subjectId: taxon:anchitherium
      claimKind: scientific
      claimType: morphology
      statement: Anchitherium in the cited diagnosis has low-crowned lophodont cheek teeth and a tridactyl manus with reduced fifth metacarpal; “slender limbs” is not retained as a study result.
      confidence: medium
      confidenceRationale: The primary paper directly lists the dental and manus characters used here.
      referenceLinks:
        - referenceId: kaiser-2009-anchitherium-diet
          relation: supports
          pages: 131–140
          figure: Figures 1–3; Table 1
          quoteLocator: Diagnosis and European MN3–MN9 context (pp. 131–132); 35-tooth mesowear result and discussion (pp. 133–139)
    - subjectId: taxon:anchitherium
      claimKind: scientific
      claimType: biogeography
      statement: The evidence profile covers the central and western European MN3–MN9 record discussed in the primary study rather than asserting a complete North American–Eurasian genus distribution.
      confidence: medium
      confidenceRationale: The narrowed geography matches the paper’s actual regional scope.
      referenceLinks:
        - referenceId: kaiser-2009-anchitherium-diet
          relation: supports
          pages: 131–140
          figure: Figures 1–3; Table 1
          quoteLocator: Diagnosis and European MN3–MN9 context (pp. 131–132); 35-tooth mesowear result and discussion (pp. 133–139)
  claim-rationales.zh:
    - 主研究直接测量了一个具名的 35 枚牙齿样本。高置信度适用于该物种与地点，不把一个德国地点的中观磨耗信号变成全球统一的属级生态。
    - 分类主张以所引主研究或系统综述中的明确分类与样本为界，不把导航父级写成直接祖先。
    - 化石范围主张把论文直接约束的区域或样本年代与图集的临时导航端点分开，端点不被当作精确起源或灭绝时刻。
    - 形态主张只保留引文图表或诊断直接支持的骨骼、牙齿性状，并把软组织、姿势或功能解释明确标为推断。
    - 生物地理主张按论文实际覆盖的地点和区域表述，不把区域样本扩写为完整全球分布。
  claim-statements.zh:
    - 安琪马属按所引系统研究采用当前分类层级；导航父级仅表示分类关联，不表示直接祖先。
    - 安琪马属的图集数值范围仍是临时导航包络；主研究只独立约束其明确讨论的区域或样本年代，端点不是精确起源或灭绝时刻。
    - 安琪马属的形态档案仅记录所引研究直接描述或测量的牙齿、颅骨或肢骨性状，功能解释另行标注。
    - 安琪马属的地理档案只覆盖所引研究明确讨论的区域与地点，并非完整的全球产出分布。
    - Sandelzhausen 的 35 枚奥尔良安琪马颊齿中观磨耗支持以浏览为主的混合取食，而不是统一的纯浏览者模型。
