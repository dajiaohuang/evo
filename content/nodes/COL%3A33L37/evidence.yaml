            locator: "SANBI/WFO archive Diagnostic row 71416; source identifier 11504.0; cited publication: Reid, C; Dyer, RA. 1984. A review of the southern African species of Cyrtanthus. American Plant Life Society, La Jolla Stanford. [All rights reserved]"
