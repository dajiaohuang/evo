    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Bulbous herb, up to 450 mm tall. Leaves 2 or 3, contemporary with the flowers, 25-40 mm broad, 500-600 mm long. Perianth 35-45 mm long, lobes 10-15 mm long. Flowers orange-red to dark red.
            textZh: Cyrtanthus huttonii Baker 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_11118_0
            locator: "SANBI/WFO archive Morphology row 1603; source identifier 11118.0; cited publication: Herman, PPJ; Retief, E. 1997. Plants of the northern provinces of South Africa: Keys and diagnostic characters. Strelitzia 6: 1 - 681. National Botanical Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Although obviously belonging to the C. macowanii group, the exact relationship between these two taxa is at present uncertain. Although only the northern population was sampled, Ising (1970) places this species in a separate group from that of C. obrienii, C. rotundilobus and C. epiphyticus on the basis of chromosome morphology.
            textZh: SANBI 条目提供了 Cyrtanthus huttonii Baker 的鉴别特征。
            sourceIds:
