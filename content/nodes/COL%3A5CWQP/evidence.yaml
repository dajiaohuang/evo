        usage:
          title: Zanthoxylum setulosum P.Wilson, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Trees, 3-20 m high; trunks usually armed with numerous vertically flattened prickles, the branchlets hispidulous, becoming glabrate, usually armed with small sharp prickles. Leaves odd- or rarely even-pinnate, usually conspicuously yel- lowish pubescent, especially below, 25-68 cm long; petiole and rachis sometimes armed with scattered yellowish prickles, more or less canaliculate above, his- pidulous and strigillose; leaflets 15-27, subopposite, elliptic to lanceolate or rarely ovate or obovate, acute and long acuminate apically, inequilateral and more or less acute basally, the margins crenulate and revolute, the blade pellucid punctate throughout, subcoriaceous, strigose above, the midvein hispidulous, paler and hispidulous beneath, especially on the veins, rarely with a few yellowish prickles on the midvein beneath, 3.0-13.5 cm long, 18-57 mm wide, the laterals more or less subsessile, the terminals petiolulate. Staminate panicles axillary and subterminal, congested, to 7 cm long, the branches hispidulous to villose. Stami- nate flowers yellow, the pedicels less than 1 mm long; calyx 5-lobed, less than 1 mm high, the lobes rounded, pubescent; petals 5, elliptic, 1.5-2.0 mm long; stamens 5, exserted, ca. 3 mm long; ovary 1-4-lobed, rudimentary, the styles 1-4. Carpellate panicles axillary, few- to many-branched, 3.5-16.0 cm long, the branches hispidulous to villose to almost glabrate, several often clustered together subapically on a branch to form a compact globose mass. Carpellate flowers with the pedicels less than 1 mm long; calyx 5-lobed, less than 1 mm high; lobes triangular, acute, pubescent; carpels 5, free. Follicles 1-4(-5), globose, brown, roughened with black or brownish punctations, glabrous, ca. 3 mm in diameter; seeds globose, dark brown to black, lustrous, minutely pitted, 2.5 mm in diameter.
