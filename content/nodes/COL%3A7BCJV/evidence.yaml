          originalSourceText: Shrub or small tree, often twisted, to 4 m tall and 5 cm d.b.h., the bark smooth, pale gray; wood whitish, soft; twigs terete, lepidote, the nodes without interpetiolar glandular fields or pseudostipules. Leaves simple or 3-foliolate; the leaflets narrowly elliptic or oblong, acute, cuneate to subsessile, the terminal leaflet 10-19 cm long and 2.1-5.6 cm wide, lateral leaflets when present 5-19 cm long and 1.1-5.1 cm wide, subcoriaceous, densely lepidote beneath, less so above, gray-green when dry, the terminal petiolule 1-3.5 cm long, lateral petiolules when present 0.2-1.5 cm long, the petiole 2.3-10 cm long, lepidote. Inflorescence a 2-5-flowered terminal cyme on a reduced branch usually in a dichotomy of the branches, the pedicels and peduncle lepidote. Flowers with the calyx irregularly bilabiate or 3-labiate, cupular, 10-20 mm long and 4-10 mm wide, lepidote; corolla white with yellow throat ridges, tubular- infundibuliform, 5-7 cm long and 0.9-1.5 cm wide at the mouth, the tube 2.8-5.8 cm long, the lobes 0.8-1.8 cm long, glabrous outside, inside pubescent on throat ridges and at the level of stamen insertion, sparsely so on lobes and in sinuses; stamens didynamous, the anther thecae divaricate, 3 mm long, the longer filaments 1.8-2.6 cm, shorter filaments 1.4-1.9 cm long, the staminode 5-7 mm long, inserted 4-6 mm from base of corolla, pistil 2.9-3.1 cm long, the ovary linear-conical, 4.5-5 mm long and 1 mm wide, densely glandular-
