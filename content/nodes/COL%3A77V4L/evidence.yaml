    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants epiphytic or epilithic, to 400 mm tall; pseudobulbs ovoid, clustered, 20-30 x 6-15 mm; leaves 2-6, deciduous, often dried at anthesis, falcate, linear, acute, thin, flat or conduplicate, 55-150 x 5-7 mm. Inflorescences dry at flowering, branched; peduncles covered in dry, acute sheaths, pubescent; branches erect, 10 mm long, most flowers borne in the terminal segment; bracts ovate, acute, 1.5-2 mm long. Flowers rarely fully open, pale lilac, lip with a central yellow streak. Sepals subequal, apiculate; median sepal lorate-triangular, 8-11 x 2.2-3 mm; laterals scarcely oblique, narrowly lanceolate, acute, curved, 7-11 x 3-4 mm. Petals narrowly oblanceolate, obtuse, 7-10 x 2.5-3 mm. Lip ovate, obscurely 3-lobed, sinuses obscure, 6.5-9 x 4.5-6 mm, disc ecallose or with a small central ridge; midlobe suborbicular, apiculate, deflexed; side lobes rounded, porrect; mentum obscure, 1.8-3 mm long. Gynostemium 3-5 mm tall.
