        usage:
          title: Schoepfia schreberi J.F.Gmel., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Unarmed glabrous shrubs or trees, reportedly root parasites. Leaves alternate, entire, coriaceous. Inflorescences few-flowered racemes generally fasciculate in the leaf axils, with or without basal perular bracts and the flowers subtended by a cupule composed of 2 bracteoles and 1 bract or subtended by a single bract. Flowers bisexual, small. Calyx extremely small, cyathiform or crateriform, margin subentire. Petals 3-6, united into a tubular-campanulate corolla, often pubescent within, the lobes valvate, reflexed, white, yellow or red. Stamens 3-6, in one whorl, as many as the petals, antipetalous, adnate to the corolla, the anthers oval, dehiscing longitudinally, sessile or short-filamented. Ovary half-immersed, the ovules pen- dulous, lacking integument, the style thin, the stigma 2- or 3-lobed. Spurious fruit with the drupe enclosed in the adnate, accrescent calyx, eccentrically annulate at the apex; seed with the small embryo at the tip of the endosperm.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 8566
          archiveSourceId: 00F5D9CD-F2EF-41BE-B056-4314A3FDF350
