            lifeStatus: The text does not identify the described plant material as wild, cultivated, domesticated, or escaped; no life status is inferred.
          - text: Shrubs or trees to 8 m. tall, the young branches slender, angular, olive-green to white. Leaves ovate to lanceolate, 4-8 cm. long, 1.5-3.5 cm. broad, acute- acuminate to acuminate at the apex, cuneate-attenuate or obtuse at the base, the costa emersed above and below, the primary lateral veins 5-6 pairs, rather con- spicuous; petiole to 5 mm. long. Inflorescences 1- to few-flowered, fasciculate, the peduncle to 5 mm. long, the flowers subtended by a cupule composed of 2 bracteoles and 1 bract, the cupule 1-3 mm. in diameter, 3-toothed, ciliate. Calyx cyathiform, about 1 mm. long, subentire, glabrous; corolla tube 2.0-2.5 mm. long, 1.5-2.5 mm. broad at the orifice, glabrous, red, the lobes 4 or 5, deltoid, 1.0-1.5 mm. long and broad, glabrous without and minutely puberulent within except for a cluster of villous hairs at the point of staminal insertion; stamens 4 or 5, inserted at the orifice of the corolla tube, the anthers 0.5-0.75 mm. long and broad, exserted, subsessile; ovary half-inferior, globose, densely papillate, the style 0.5 mm. long, the stigma bifid, included. Spurious fruit ellipsoid, 10-13 mm. long, 7-8 mm. in diameter, glabrous.
