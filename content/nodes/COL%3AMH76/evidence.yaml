    facets:
      morphology:
        status: partially-supported
        claims:
          - text: A fairly robust, leafy herb, up to 0.65 m high. Leaves withered at flowering time in midwinter, narrowly oblong, up to 110 mm long. Spur swollen towards apex, 30-35 mm long. Flowers green and white.
            textZh: Bonatea porrecta (Bolus) Summerh. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_11118_0
            locator: "SANBI/WFO archive Morphology row 536; source identifier 11118.0; cited publication: Herman, PPJ; Retief, E. 1997. Plants of the northern provinces of South Africa: Keys and diagnostic characters. Strelitzia 6: 1 - 681. National Botanical Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: B. porrecta was found to be embedded within the B. speciosa complex (traditionally comprising Bonatea antennifera Rolfe, B. boltonii and B. speciosa). B. porrecta is sympatric with all three taxa but differs in having the leaves withered at flowering time. B. porrecta resembles B. boltonii in flower size, the horizontally spreading lower petal lobes, and spur morphology (both species average 35 mm for total spur length and 11 mm for the clavate apex). The rostellum in B. porrecta is however diminutive (2-5 mm vs 5-9 mm), with the free portion of the rostellum lateral lobes 2.0-5.5 mm (vs 2.0-3.5 mm for B. boltonii) and generally >/= the length of the rostellum median lobe. The stigmatic processes are also predominantly clavate for B. porrecta and spathulate for B. boltonii. B. porrecta can also be confused with B. saundersioides, which has a similar perianth and may also have the leaves dry at flowering. It differs in the erect (vs sub-erect) dorsal sepal, straight spur with a clavate apex 1/4-1/3 of spur length (vs curved spur with clavate apex 1/2-2/3 of spur length). In addition, the rostellum lateral lobes of B. saundersioides are shorter than the median rostellum lobe.
            textZh: SANBI 条目提供了 Bonatea porrecta (Bolus) Summerh. 的鉴别特征。
            sourceIds:
              - sanbi_6866_0
            locator: "SANBI/WFO archive Diagnostic row 76901; source identifier 6866.0; cited publication: Ponsie, ME; Edwards, TJ; Johnson, SD. 2007. A taxonomic revision of Bonatea Willd. (Orchidaceae: Orchidoideae: Habenariinae). S. African J. Bot. 73: 1 - 21. [Copyright held by the South African Association of Botanists (2007); http://www.sciencedirect.com/science/journal/02546299]. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
