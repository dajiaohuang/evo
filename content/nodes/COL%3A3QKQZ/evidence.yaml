    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Suffrutex, up to 2 m tall, erect or straggling. Leaves elliptic to obovate, 10-40 x 5-14 mm, tapering into a petiolar part, margins serrate, glandular-hispid on both surfaces. Corolla limb thick-textured. Flowers with corolla lobes greenish to dull yellow, orange-brown, maroon and dark brown, always with a paler cream to greenish yellow margin.
            sourceIds:
              - sanbi_11118_0
            locator: "SANBI/WFO archive Morphology row 2464; source 11118.0; publication: Herman, PPJ; Retief, E. 1997. Plants of the northern provinces of South Africa: Keys and diagnostic characters. Strelitzia 6: 1 - 681. National Botanical Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: The characteristic features of the species are its elliptic to obovate, serrate, leaves, glandular-hispid on both surfaces, and the thick-textured corolla limb, shades of orange-brown to dark brown above, with thin-textured pale margins. The flowers are remarkably similar to those of J. burkeana, whose area lies mostly west of that of J. accrescens, but where they are sympatric, in the Zoutpansberg, at Makapan near Potgietersrust, and near Ohrigstadt, they hybridize. Normally, the species are easily distinguished by differences in the shape and indumentum of the leaves; also, in J. accrescens, there are almost always glistening glands on the upper surface of the corolla limb around the sinuses (J. burkeana rarely has glistening glands on the upper surface of the limb, and then they are along the upper margins). The putative hybrids have leaves more or less intermediate between those of the two species (± shape of those of J. accrescens, but margins more boldly and irregularly toothed, upper surface with few hairs), and there may or may not be glistening glands around the sinuses of the corolla limb.
