    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Perennial, rhizomatous (rhizomes stout, sometimes shortly creeping), up to 1 m high. Leaf blades 50-100 mm long, 6-12 mm wide. Basal sheaths very densely hairy, old sheaths splitting into fibres. Spikelets 3-5 mm long. Racemes 5-20, 30-100 mm long; spikelets lanceolate; lower glume 5-nerved; upper lemma with mucro 0.3-0.5 mm long.
            textZh: Urochloa oligotricha (Fig. & De Not.) Henrard 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_11118_0
            locator: "SANBI/WFO archive Morphology row 1014; source identifier 11118.0; cited publication: Herman, PPJ; Retief, E. 1997. Plants of the northern provinces of South Africa: Keys and diagnostic characters. Strelitzia 6: 1 - 681. National Botanical Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Distinguished from U. mosambicensis and U. stolonifera by the 5-nerved lower glume, lanceolate spikelet and fibrous old leaf sheath, however, intermediates with U. mosambicensis are present; closely resembles the annual U. brachyura.
