          pages: "2215787"
          figure: Figures 1–6
          quoteLocator: Tentacular reinterpretation and limits on functional inference
    - subjectId: taxon:xianguangia
      claimType: morphology
      claimKind: scientific
      statement: The expanded Xianguangia sample preserves a tentacle-bearing crown and central column-like region in the published reconstruction, but the column’s identity is revised as tentacular anatomy in later primary work.
      confidence: contested
      confidenceRationale: Eighty-five new specimens plus type material constrain repeated gross structures, while the independent reanalysis changes the interpretation of the central region and its functional meaning.
      referenceLinks:
        - referenceId: ou-2017-xianguangia
