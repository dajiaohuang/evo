  claims:
    - subjectId: taxon:xianguangia
      claimKind: scientific
      claimType: topology
      statement: Xianguangia reconstruction is based on 85 new specimens plus type material, yet column, tentacle and phylum-level interpretations remain disputed; the Chengjiang sample is not a cnidarian global first appearance.
      confidence: contested
      confidenceRationale: Expanded material constrains gross anatomy, while competing anatomical readings prevent a definitive stem-cnidarian or range claim.
      referenceLinks:
        - referenceId: ou-2017-xianguangia
          relation: supports
          pages: 8835–8840
          figure: Figures 1–4; Supplementary Figures
          quoteLocator: 85 new specimens, synonymy, reconstruction and phylogenetic analysis
        - referenceId: zhao-2023-xianguangia
          relation: contradicts
          pages: "2215787"
          figure: Figures 1–6
          quoteLocator: Figure 4 and Supplementary Figure S1; main Bayesian stem-ctenophore result and alternative-coding sensitivity analyses
    - subjectId: taxon:xianguangia
      claimKind: scientific
      claimType: fossil-range
      statement: Xianguangia is displayed at 518–518 Ma only as the age-bounded Chengjiang specimen sample assessed by competing body-plan interpretations; it is not a crown-anthozoan FAD, direct ancestor or global genus duration.
      confidence: contested
      confidenceRationale: Ou et al. (2017) and Zhao et al. (2023) examine the same taxon with materially different column and affinity interpretations. Contested confidence applies to the bounded occurrence, not either higher-level placement.
      referenceLinks:
        - relation: supports
          referenceId: ou-2017-xianguangia
          pages: 114:8835–8840
          figure: Figures 1–4; Supplementary Figures
          quoteLocator: Specimens, reconstruction and phylogenetic analysis
        - relation: contradicts
          referenceId: zhao-2023-xianguangia
          pages: Article 2215787
          figure: Figures 1–6
          quoteLocator: Figure 4 and Supplementary Figure S1; main Bayesian stem-ctenophore result and alternative-coding sensitivity analyses
    - subjectId: taxon:xianguangia
      claimType: taxonomy
      claimKind: scientific
      statement: "Xianguangia sinica has competing phylogenetic placements: Ou et al. recover a stem-cnidarian body plan, whereas Zhao et al. recover Xianguangia, Daihua and Dinomischus as Dinomischidae on the ctenophore stem in their main Bayesian analysis, with a polytomy under alternative coding; neither placement is treated as definitive here."
      confidence: contested
      confidenceRationale: The taxon and expanded specimen sample are directly documented, but the column interpretation and matrix placement differ between primary studies, preventing a definitive cnidarian assignment.
      referenceLinks:
        - referenceId: ou-2017-xianguangia
          relation: supports
          pages: 8835–8840
          figure: Figures 1–4; Supplementary Figures
          quoteLocator: 85 new specimens, synonymy, reconstruction and phylogenetic analysis
        - referenceId: zhao-2023-xianguangia
          relation: contextualizes
          pages: "2215787"
          figure: Figures 1–6
          quoteLocator: Figure 4 and Supplementary Figure S1; main Bayesian stem-ctenophore result and alternative-coding sensitivity analyses
    - subjectId: taxon:xianguangia
      claimType: biogeography
      claimKind: scientific
      statement: The profiled Xianguangia material is from the Chengjiang biota of Yunnan, China; this exceptional deposit records the sampled occurrence and does not establish a complete distribution or geographic origin.
      confidence: high
      confidenceRationale: The primary study identifies the Chengjiang material and locality. High confidence is limited to the sampled deposit and does not infer absence from other regions.
      referenceLinks:
        - referenceId: ou-2017-xianguangia
          relation: supports
          pages: 8835–8840
          figure: Figures 1–2; Supplementary Figures
          quoteLocator: Chengjiang biota material, locality and specimen sample
    - subjectId: taxon:xianguangia
      claimType: ecology
      claimKind: scientific
      statement: The Xianguangia reconstruction infers suspension feeding from its tentaculate body plan in a marine Chengjiang setting, while attachment, movement and population-wide ecology are not directly observed.
      confidence: medium
      confidenceRationale: The primary reconstruction links tentacles and suspension feeding, but those functions and any sessile habit remain anatomical inferences bounded to the sampled fossils.
      referenceLinks:
        - referenceId: ou-2017-xianguangia
          relation: supports
          pages: 8835–8840
