  claims:
    - subjectId: taxon:yinlong
      claimKind: scientific
      claimType: fossil-range
      statement: Yinlong is anchored by nearly complete holotype IVPP V14530 from the Late Jurassic Shishugou Formation; this specimen-level occurrence is not a global ceratopsian first appearance or a direct ancestor.
      confidence: high
      confidenceRationale: The holotype and formation are directly documented. High confidence applies to that sample, while basal placement remains a matrix result.
      referenceLinks:
        - referenceId: xu-2006-yinlong
          relation: supports
          pages: 2135–2140
          figure: Figures 1–3; Electronic Supplementary Material
          quoteLocator: Systematic palaeontology; locality and horizon; specimen description
    - subjectId: taxon:yinlong
      claimKind: scientific
      claimType: taxonomy
      statement: Yinlong downsi is based on holotype IVPP V14530, and the study recovers the taxon as a basal ceratopsian in its sampled character matrix; that analysis is not evidence of an uncontested relationship or direct ancestry.
      confidence: medium
      confidenceRationale: The holotype and diagnosis are directly documented, whereas its broader placement depends on character scoring, taxon sampling and analysis settings.
      referenceLinks:
        - referenceId: xu-2006-yinlong
          relation: supports
          pages: 2135–2140
          figure: Figures 1–3; Electronic Supplementary Material
          quoteLocator: Systematic palaeontology; Phylogenetic analysis; Discussion
    - subjectId: taxon:yinlong
      claimKind: scientific
      claimType: morphology
      statement: Holotype IVPP V14530 is a nearly complete skeleton missing only the distal tail; the primary description records its broad post-orbital skull region, shallow pre-orbital region and diagnostic cranial features, all limited to the named specimen.
      confidence: high
      confidenceRationale: The holotype inventory, diagnosis and described cranial anatomy are directly reported and illustrated in the primary study.
      referenceLinks:
        - referenceId: xu-2006-yinlong
          relation: supports
          pages: 2135–2137
          figure: Figures 1–2; Electronic Supplementary Figures 1–2
          quoteLocator: "Systematic palaeontology: Holotype, Diagnosis and Description"
    - subjectId: taxon:yinlong
      claimKind: scientific
      claimType: biogeography
      statement: This profile's geographic statement is limited to Wucaiwan in the Junggar Basin, Xinjiang, China, and the upper Shishugou Formation horizon reported for IVPP V14530; it does not establish a global distribution.
      confidence: high
      confidenceRationale: The locality and horizon are stated directly for the holotype, but one locality-level occurrence cannot establish the genus-wide distribution.
      referenceLinks:
        - referenceId: xu-2006-yinlong
          relation: supports
          pages: "2135"
          figure: Figure 1
          quoteLocator: "Systematic palaeontology: Locality and horizon"
    - subjectId: taxon:yinlong
      claimKind: scientific
      claimType: ecology
      statement: The primary description estimates the IVPP V14530 individual at about 120 cm and interprets its short forelimbs and robust hindlimbs as compatible with bipedality; diet, habitat preference, guild and observed behaviour are not directly resolved by this anatomy and matrix study.
      confidence: medium
      confidenceRationale: Body proportions and the size estimate are reported for the holotype, while bipedality is an anatomical interpretation and the remaining ecological fields are not direct observations.
      referenceLinks:
        - referenceId: xu-2006-yinlong
          relation: supports
          pages: 2135–2137
          figure: Figures 1–2
          quoteLocator: "Systematic palaeontology: Description; limb proportions and estimated body length"
  claim-rationales.zh:
    - 正模与地层有直接记录。高置信度适用于该样本，基部位置仍属于矩阵结果。
    - 正模和诊断有直接记录，而更广泛的位置依赖性状评分、类群取样和分析设定。
    - 一手论文直接记录并图示正模清单、诊断和颅骨解剖。
    - 正模的地点和层位有直接记录，但单一地点级出现不能建立完整属级分布。
    - 体型估计和肢骨比例针对正模有直接记录；两足性是解剖解释，其余生态字段不是直接观察。
  claim-statements.zh:
    - 隐龙由晚侏罗世石树沟组近完整正模 IVPP V14530 锚定；这一标本级记录不是全球角龙类首现或直接祖先。
