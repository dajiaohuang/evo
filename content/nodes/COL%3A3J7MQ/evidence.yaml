          - text: Perennial geophyte, 50-350 mm high. Leaves emerging at flowering, ± spreading, rarely prostrate, ± elliptic, 13-150 mm wide, ± hairy, rarely only fringed. Flowers many, in a ± loose cluster, surrounding bracts pale pink; perianth 7-25 mm long, pale to rose-pink, rarely whitish; stamens at least as long as perianth. Flowering time Nov.-Feb.
