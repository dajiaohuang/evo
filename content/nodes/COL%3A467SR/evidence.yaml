        claims:
          - text: An erect herb, annual, nearly glabrous below, somewhat pilose above, minutely glandular, somewhat shining, slender, simple or branched at or near the base, 4-12 in. high; stem tetragonous, furrowed, leafy about the base, naked or sparingly leafy above; basal branches opposite, spreading, prostrate or ascending, tetragonous, moderately leafy; upper internodes exceeding the leaves; radical leaves rosulate, narrowly elliptical or oblanceolate, obtuse at the apex, tapering to the base, membranous, entire, repand, denticulate or few-toothed, pale green or subglaucous beneath, 1/4-1 1/5 in. long, 1/10-2/5 in. broad; petioles ranging up to 1/4 in. long; cauline leaves similar or narrower, opposite, sessile or shortly petiolate, ranging up to 1 2/5 in. long; flowers racemose, several or rather numerous, 3/8-7/16 in. long and broad; racemes terminal, comparatively dense at the corymbose top, lax below, mostly 1-2 in. long; pedicels slender, spreading or erect-patent, alternate, singly arising from the axils of the small narrowly linear bracts, thinly glandular-pilose, 1/5-2/3 in. long; calyx-segments lanceolate-oval or oval-oblong, obtuse, weakly trinerved, minutely glandular, spreading, subequal, 1/16-1/8 in. long; corolla pale blue with an orange-coloured throat; upper lip 1/5-1/4 in. long, obtusely 4-lobed, lobes ovate or oblong; lower lip quadrate-oblong, shortly excised at the apex, about 1/4 in. long by 5/16 in. broad; throat minutely puberulous within; palate shortly bearded; spur cylindric-conical, obtuse, 1/5-2/7 in. long, nearly straight or incurved about the terminal third; stamens 4; anthers glabrous; filaments minutely glandular-puberulous; capsules oblong, glabrous, excised at the apex, nearly rounded at the base, nearly 1/4 in. long; valves with their outer top corners diverging and apiculate.
