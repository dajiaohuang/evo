        usage:
          title: Tribulus terrestris L., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Prostrate annual; herbage whitish-pubescent, especially young shoots, becom- ing glabrate on older parts; stems more or less hirsute and sericeous, to 1 m long. Leaves 2-4.5 cm long, ca 1 cm wide; leaflets 4-6(-8) pairs, subsessile, ovate to elliptic, inequilateral, unequal, acute or obtuse, middle pairs largest, densely ap- pressed silky-pubescent giving younger parts a silvery appearance, becoming glab iate, largest 4-1 1 mm long, 2-4 mm wide; stipules subulate to falcate, pu- bescent, 1-5 mm long, to 1 mm wide. Buds ovoid-, obtuse, 2-3 mm long. Flowers 5-10 mm in diam; peduncles shorter to longer than shortest pair of leaves, hirsute and strigose, bent but little thickened distally in fruit, 2-7 mm long in flower, 5-15 mm long in fruit; sepals ovate-lanceolate, acute, hirsute, the margins scarious, minutely ciliate, 2-4 mm long, 1.5-2 mm wide; petals yellow, oblong, 2.5-5 mm long, 1-3 mm wide; outer nectaries more or less bilobed, yellowish; stamens with filaments subulate, 2-3 mm long, the anthers cordate, versatile, 1 mm long; inner whorl of nectaries triangular, yellow, free; ovary hirsute with stiff upward-spread- ing bulbous-based trichomes, 1-5 mm high, the style 1-1.5 mm long, the stigma globose, slightly asymmetrical, ca 1 mm in diam. Fruit 10-1 5 mm in diam ex- cluding spines, 4-12 mm high; mericarps dorsally crested and tuberculate, bearing 2 conical spreading dorsal spines 3-7 mm long and 2 smaller spines near base directed downward or latter absent, hispid and densely sericeous to strigose or almost glabrate, gray to green, sometimes 1 or more aborting.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 14022
