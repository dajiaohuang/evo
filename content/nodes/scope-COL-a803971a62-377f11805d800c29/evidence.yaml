          scope:
            en: The v2026/06 chart supplies numerical boundaries for the named Cambrian interval. It bounds the cited shell sample under its qualified Botomian correlations; it does not turn that regional sample into a global first or last appearance.
            zh: v2026/06 年代地层表为所用寒武纪时段提供数值界线。它依据带有限定语的 Botomian 对比界定所引贝壳样本的年代范围，并不会将区域样本转化为全球首现或末现。
  claims:
    - subjectId: taxon:pojetaia
      claimKind: scientific
      claimType: morphology
      statement: Pojetaia runnegari shell sections preserve laminar inner fabric comparable to foliated aragonite, while undisputed nacre and broader evolutionary precursors remain interpretive.
      confidence: medium
      confidenceRationale: The named shell material supports morphology directly, while diagenesis and comparative homology bound the inference.
      referenceLinks:
        - referenceId: vendrasco-et-al-2011-pojetaia
          relation: supports
          pages: 825–850
          figure: Figures 1–12; Tables 1–2
          quoteLocator: Pojetaia material; shell microstructure; discussion of foliated aragonite and nacre
    - subjectId: taxon:pojetaia
      claimKind: scientific
      claimType: fossil-range
      statement: More than fifty Pojetaia specimens from probably Botomian Ajax Limestone and lowermost Botomian Erkeket Formation units support a Cambrian Stage 4 sample envelope of 514.5–506.5 Ma; this is not an exhaustive global genus FAD or LAD.
      confidence: medium
      confidenceRationale: The paper directly documents the shell material and qualified regional correlations. Medium confidence is limited to the conservative Stage 4 envelope because one correlation is explicitly probable.
      referenceLinks:
        - relation: supports
          referenceId: vendrasco-et-al-2011-pojetaia
          pages: 825–850
          figure: Plate 1
          quoteLocator: pp. 826–829, Materials and methods; more than 50 UNEL 1872 specimens; Botomian unit correlations
        - relation: contextualizes
          referenceId: ics-2026-06
          pages: International Chronostratigraphic Chart v2026/06
          figure: Global chronostratigraphic scale
          quoteLocator: Numerical boundaries for the named stages and periods used to bound the source sample
    - subjectId: taxon:pojetaia
      claimKind: scientific
      claimType: taxonomy
      statement: Vendrasco et al. treat the studied shell material as Pojetaia runnegari; the profile retains that species-level identification while keeping bivalve-wide evolutionary placement conditional.
      confidence: medium
      confidenceRationale: The named shell material and systematic assignment are reported in the primary study, while higher placement and evolutionary implications are comparative.
      referenceLinks:
        - referenceId: vendrasco-et-al-2011-pojetaia
          relation: supports
          pages: 825–850
          figure: Figures 1–12; Tables 1–2
          quoteLocator: Systematic palaeontology and description of Pojetaia runnegari shell material
    - subjectId: taxon:pojetaia
      claimKind: scientific
      claimType: biogeography
      statement: The documented Pojetaia runnegari shell sample is bounded to the Ajax Limestone and Erkeket Formation of South Australia; these localities do not establish the complete geographic distribution of the genus.
      confidence: medium
      confidenceRationale: The named formations and regional setting are reported for the studied material, whereas a complete distribution would require additional occurrences.
      referenceLinks:
        - referenceId: vendrasco-et-al-2011-pojetaia
          relation: supports
          pages: 826–829
          figure: Figure 1; Plate 1
          quoteLocator: Locality and stratigraphic context for Pojetaia material; Ajax Limestone and Erkeket Formation
    - subjectId: taxon:pojetaia
      claimKind: scientific
      claimType: ecology
      statement: Pojetaia shell sections document mineralized shell microstructure but do not directly preserve feeding, locomotion, body size or ecological guild; any shallow-marine setting is limited to the sampled formations.
      confidence: medium
      confidenceRationale: The primary paper describes shell material and its depositional units, but isolated shell sections do not directly resolve organismal behaviour or ecology.
      referenceLinks:
        - referenceId: vendrasco-et-al-2011-pojetaia
          relation: supports
          pages: 825–850
          figure: Figures 1–12
          quoteLocator: Shell-material description and discussion; no direct feeding or locomotion evidence
  claim-rationales.zh:
    - 具名贝壳材料直接支持形态观察，但成岩作用和比较同源性限制了推断。
    - 论文直接记录壳体材料及带限定语的区域对比。由于其中一项对比明确为“可能”，中等置信度仅适用于保守的第 4 期包络。
    - 具名贝壳材料及其系统分类由主论文报告；更高阶位置和演化含义属于比较推断。
    - 论文直接报告取样地层和区域环境；完整地理分布需要更多产出，不能由这些地点外推。
    - 主论文描述贝壳材料和沉积地层，但孤立贝壳切片不能直接解析个体行为或生态，因此保持有界表述。
  claim-statements.zh:
    - Pojetaia runnegari 贝壳切片保存可与叶片状霰石比较的层状内织构，而无争议珍珠层及更广演化前体仍属解释。
    - 来自“可能为 Botomian”的 Ajax 石灰岩与最下部 Botomian Erkeket 组的 50 余件 Pojetaia 标本，支持 5.145–5.065 亿年前的寒武纪第 4 期样本包络；这不是该属穷尽性的全球首现或末现。
    - Vendrasco 等将所研究的贝壳材料归入 Pojetaia runnegari；本档案保留该物种级鉴定，同时将双壳纲范围的演化位置保持为有条件的比较结论。
    - 有文献记录的 Pojetaia runnegari 贝壳样本限定于南澳大利亚的 Ajax 石灰岩和 Erkeket 组；这些地点不能确立该属的完整地理分布。
    - Pojetaia 贝壳切片记录了矿化贝壳的微结构，但没有直接保存摄食、运动、体型或生态类群；任何浅海环境判断都限定于取样地层。
