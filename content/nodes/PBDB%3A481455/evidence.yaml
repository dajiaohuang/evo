  claims:
    - subjectId: taxon:pseudopholidoctenus-germanicus
      claimType: taxonomy
      claimKind: scientific
      statement: Pseudopholidoctenus germanicus is a named stem teleosteomorph established from the Rüdersdorf type material, including holotype MB.f.18641 and paratypes MB.f.19904–19906.
      confidence: medium
      confidenceRationale: The primary description provides a new genus and species diagnosis, type material and comparison with other stem teleosts. Confidence remains medium because the profile preserves the source's stem placement and does not infer direct ancestry or universal consensus.
      referenceLinks:
        - referenceId: arratia-schultze-2024-triassic-teleosteomorphs
          relation: supports
          pages: 31–37
          figure: Figures 2–6; Table 1
          quoteLocator: Systematic palaeontology; diagnosis; type material; phylogenetic and taxonomic comparisons
    - subjectId: taxon:pseudopholidoctenus-germanicus
      claimType: biogeography
      claimKind: scientific
      statement: The Pseudopholidoctenus germanicus material comes from the Rüdersdorf opencast mine in the Central European (Germanic) Basin, Germany; this locality does not establish a global distribution.
      confidence: medium
      confidenceRationale: The primary study gives the mine, regional basin and German locality directly. Confidence is medium because a single fossil locality cannot establish absence, endemism or a global geographic range.
      referenceLinks:
        - referenceId: arratia-schultze-2024-triassic-teleosteomorphs
          relation: supports
          pages: 29–30, 32
          figure: Scheme 1; Figure 2
          quoteLocator: Geological site; stratigraphy; provenience
    - subjectId: taxon:pseudopholidoctenus-germanicus
      claimType: ecology
      claimKind: scientific
      statement: The cited description records an aquatic fish from a marine restricted-basin setting, but it does not establish a species-specific diet, locomotor performance or trophic guild for Pseudopholidoctenus germanicus.
      confidence: medium
      confidenceRationale: The source discusses the marine setting and compares jaw and body form, while explicitly limiting feeding inferences across early teleosteomorphs. Medium confidence applies to this bounded evidence statement, not to a reconstructed ecology.
      referenceLinks:
        - referenceId: arratia-schultze-2024-triassic-teleosteomorphs
          relation: supports
          pages: 35–37, 47–49
          figure: Figures 2, 4–6; Table 1
          quoteLocator: Description; size and body shape; buccal morphology and feeding; marine versus freshwater environments
    - subjectId: taxon:pseudopholidoctenus-germanicus
      claimType: morphology
      claimKind: scientific
      statement: Pseudopholidoctenus germanicus has a fused, ornamented skull roof, large square-like scutes before the epaxial caudal lobe, fewer than 18 principal caudal rays and no hypaxial procurrent rays in the diagnosis.
      confidence: medium
      confidenceRationale: The diagnosis and Figures 2–6 directly document the named skeletal, scale and fin characters. Confidence is medium because the material is incomplete and the diagnosis concerns a limited type sample rather than population-wide variation.
      referenceLinks:
        - referenceId: arratia-schultze-2024-triassic-teleosteomorphs
          relation: supports
          pages: 31–37
          figure: Figures 2–6; Table 1
          quoteLocator: Diagnosis; skull roof; caudal fin; squamation and type description
    - subjectId: taxon:pseudopholidoctenus-germanicus
      claimType: fossil-range
      claimKind: scientific
      statement: The displayed approximately 244 Ma point bounds the lower Anisian Rüdersdorf sample of Pseudopholidoctenus germanicus and is not a global teleosteomorph or teleost first appearance.
      confidence: medium
      confidenceRationale: The primary paper places the named material in the lower Middle Triassic, lower Anisian middle Muschelkalk at about 244 Ma. Confidence is medium because this is a single locality sample, not a global first or last appearance.
      referenceLinks:
        - referenceId: arratia-schultze-2024-triassic-teleosteomorphs
          relation: supports
          pages: 30, 35, 50–51
          figure: Scheme 1; Figures 2–6
          quoteLocator: Stratigraphy; type material and age; age and oldest teleosteomorphs
  claim-rationales.zh:
    - Pseudopholidoctenus germanicus：一手描述提供新属新种诊断、模式材料及与真骨鱼总群干群成员的比较。置信度为中等，保留来源的干群位置，不推断直系祖先或普遍共识。
    - Pseudopholidoctenus germanicus：研究直接给出 Rüdersdorf 露天矿及中欧（Germanic）盆地背景。单一化石地点不能确立缺失、特有性或全球地理范围。
    - Pseudopholidoctenus germanicus：论文记录受限海相盆地环境并比较体形与颌部，但没有给出该物种的实测食性、运动性能或营养级群；生态字段保持有界。
    - Pseudopholidoctenus germanicus：诊断及图 2–6 直接记录头盖、盾鳞与尾鳍性状。由于模式材料存在缺失且样本有限，置信度为中等而非种群普遍结论。
    - Pseudopholidoctenus germanicus：一手论文把模式材料置于约 244 Ma 的 Rüdersdorf 下安尼期中部 Muschelkalk。置信度为中等，因为该点是单地点样本而非全球首现或末现。
  claim-statements.zh:
    - Pseudopholidoctenus germanicus 是依据 Rüdersdorf 模式材料建立的具名真骨鱼总群干群成员，包括正模 MB.f.18641 与副模 MB.f.19904–19906。
    - Pseudopholidoctenus germanicus 材料来自德国中欧（Germanic）盆地的 Rüdersdorf 露天矿；该地点不能确立全球分布。
    - 所引描述记录了一种来自受限海相盆地环境的水生鱼，但没有确立 Pseudopholidoctenus germanicus 的物种特异性食性、运动性能或营养级群。
    - Pseudopholidoctenus germanicus 的诊断包括融合且具饰纹的头盖、位于尾鳍上轴叶之前的大型近方形盾鳞、少于 18 条主要尾鳍条，以及无下轴向前行鳍条。
    - 显示的约 244 Ma 点界定了 Pseudopholidoctenus germanicus 在 Rüdersdorf 下安尼期的取样，不是全球真骨鱼总群或真骨鱼首现。
