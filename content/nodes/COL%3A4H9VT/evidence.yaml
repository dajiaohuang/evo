    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Hairy annual to 25 cm. Leaves oblanceolate, slightly toothed. Flowers few to several in crowded heads arranged in corymbs, mauve or rarely white.
            sourceIds:
              - sanbi_14441_0
            locator: "SANBI/WFO archive Morphology row 5917; source 14441.0; publication: Manning, JC; Goldblatt, P. 2012. Scrophulariaceae: Phyllopodium Benth. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 750 - 752. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: "Typical P. cephalophorum is a more hoary-looking plant than typical P. phyllopodioides because of a somewhat denser indumentum almost impossible to define, axillary leaf tufts are well developed (absent or weakly developed in P. phyllopodioides) and the heads are mostly larger (7-13 mm in diameter versus 4-6(-7) mm). But the most useful character on which to separate the two species is the shape and indumentum of the bracts: typically ovate-lanceolate in P. cephalophorum, the back glabrous to puberulous towards the tip, becoming shaggy in the lower half; in P. phyllopodioides typically oblong to narrowly elliptic, puberulous on the backs, long hairs confined to the margins. Over the whole of its range it is sympatric with the somewhat atypical form of P. cephalophorum with patent indumentum as well as with typical P. cephalophorum around Piquetberg and Saldanha Bay. Where the two species are sympatric, the heads of P. cephalophorum tend to be smaller than those in plants outside the range of P. phyllopodioides and the bracts may be less hairy than usual. Some specimens are difficult to place and it is not impossible that the two species influence each other where they are sympatric; they flower at the same time and, from meagre collectors's notes, appear to occupy similar habitats."
