            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: The new species is no doubt close to W. angustifolia, but differs, inter alia, in leaf-shape. Instead of being flat with inrolled margins, the basalleaf is thickish and sometimes almost semiterete with a concave upper surface, i.e. more or less reniform in transect. The cauline leaves are also more or less semiterete above the broader basal portion. The spike is few-flowered with somewhat larger flowers than in W. angustifolia and with more spreading segments. The perianth is almost pure white without nectar blotches. The anthers are purplish red to brown and somewhat larger than the yellow anthers of W. angustifolia. Finally, the pistil is more oblong with less recurved and more slender styles with smaller stigmas.
