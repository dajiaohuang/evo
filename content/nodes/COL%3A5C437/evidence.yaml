      morphology:
        status: partially-supported
        claims:
          - text: Corm ovoid or globose, c. 1-1.5 cm long and 0.7-1 cm wide, with brown tunics produced into a rather thin and loose neck 1-3 cm long. Stem above ground 3-5(-6) cm long. Basal sheath membranous, apically dilated and with a shortly ovate 5-10-veined usually mucronate tip. Basal leaf solitary, erect, linear-filiform, 4-10 cm long, 1-2 mm wide, tapering to an acuminate apex, almost semiterete and shallowly channelled adaxially (± reniform in transect), with rounded-obtuse not manifestly inrolled margins, glabrous and smooth. Cauline leaves 1 or 2, suberect, glabrous; uppermost leaf inserted c. 0.5 cm below the lowermost flower, above the vaginate base boat-shaped and 2-3 mm wide, then rather abruptly acuminate with a semiterete shallowly channelled narrow lamina, becoming terete towards the apex, 1-3 cm long, shorter than the spike; lower cauline leaf long-acuminate from a sheathing base and overtopping the spike, 3-5 cm long, semiterete, shallowly channelled adaxially. Spike 1-3(-4)-flowered, with 5-7 mm distance between the flowers. Perianth 6-8 mm long, white, without distinct dots or marks, at most somewhat yellowish above the nectary; perianth tube 1.5-2.3 mm long; free segments erecto-patent, narrowly ovate-oblong or oblong-lanceolate, 4.5-6 mm long, 1-1.5 mm wide, distinctly 3-5-veined, obtuse. Nectary a longitudinal groove near the base of the free segment, bordered by two subparallel round-backed ridges almost contiguous apically. Filaments subulate, 2.2-5 mm long, light-coloured, inserted at the base of the free segment. Anthers oblong, 0.8-1 mm long, 0.4-0.5 mm wide, red or brown. Pistil elliptic-oblong, 5-7 mm long; free styles suberect, subulate, slender, c. 2 mm long, with subcapitate stigmas.
            textZh: Wurmbea burttii B.Nord. 的 SANBI 物种条目记录了形态特征。
