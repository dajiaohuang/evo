        claims:
          - text: Humile, ut videtur, glabrum epapillosum; rami decumbentes, 11-14 cm. longi, 2 mm. diam., internodiis 1-1.5 cm. longis; ramuli floriferi saepe dense 4-6-foliati; folia saepius patentia, carnosa levissimaque, ovata acuta, obtuse carinata, supra leviter concava, viridia, ad 1.5 cm. longa, medio ad 1 cm. lata diametroque 4 mm.; flores diurni 3-nati. laterales tardissime evoluti, 1.2 cm. diam., fere sessiles vel pedunculis fructiferis interdum demum ad 7 mm. longis; receptaculum crateriforme, apice 5 mm. diam.; sepala 5, inaequilonga, 2 longiora crassa, ad 4 mm. longa, cetera membranaceo-marginata, ad 2.5 mm. longa; petala 2-seriata, obtusa vel acuta, roseo-purpurea, 4-7 mm. longa, 1 mm. lata; staminodia staminibus ad 3 mm. longis aequilonga; filamenta basi vel medio papillata, antheris luteis; glandulae inconspicuae; ovarium supra leviter elevatum, lobis rotundatis; stigmata 5, e basi crassa caudato-acuminata, stamina exteriora aequantia, 2.5 mm. longa; capsulae 3-4 mm. diam.
