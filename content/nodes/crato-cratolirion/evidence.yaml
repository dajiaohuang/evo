  claims:
    - subjectId: event:crato-cratolirion
      claimKind: scientific
      claimType: fossil-range
      statement: Cratolirion bognerianum from the approximately 115 Ma Crato Formation is anatomically preserved from roots to reproductive organs and was recovered as a crown monocot; it is a specimen-scoped occurrence, not the origin of monocots or an uncontested living-family assignment.
      confidence: medium
      confidenceRationale: Whole-plant preservation and anatomical imaging connect vegetative and reproductive characters in the same fossil, supporting a crown-monocot interpretation. Medium confidence keeps the approximate formation age and phylogenetic analysis visible and rejects popularized claims that the fossil is literally a modern lily or the first monocot.
      referenceLinks:
        - relation: supports
          referenceId: coiffard-2019-cratolirion
          pages: 691–696
          figure: Figures 1–3
          quoteLocator: Abstract; fossil description, anatomy and phylogenetic analysis
  claim-rationales.zh:
    - 整株保存与解剖成像把同一化石的营养和生殖性状关联起来，支持单子叶植物冠群解释。中等置信度保留地层约数和系统分析边界，并拒绝把化石通俗化为现代百合或最早单子叶植物。
  claim-statements.zh:
    - 约 115 Ma 克拉图组的 Cratolirion bognerianum 从根至生殖器官均有解剖保存，并在分析中被恢复为单子叶植物冠群成员；这是标本限定的出现记录，不是单子叶植物起源年代，也不是无争议的现生科归属。
