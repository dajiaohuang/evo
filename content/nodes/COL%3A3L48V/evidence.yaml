    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Perennial herb, geophyte, 0.25-0.60 m high; corm turbinate, tunics concentric, base truncate, lacerate, cormlets often produced in axils of lower leaves; stem simple, weak. Leaves 5(6), slightly falcate, acute to subobtuse, lowermost basal, others inserted on stem, uppermost reduced to sheathing bracts. Bracts 20-40 mm long. Inflorescence a 2-7-flowered spike, ± straight; flowers bright pink; perianth tube dilated in throat; tepals subequal, elliptic, obtuse to subacute. Stamens exserted; filaments 6.0-7.5 mm long; anthers 7.5-10.0 mm long. Flowering time Jan.-June. Capsule 13-20 x 4-5 mm.
            textZh: Hesperantha huttonii (Baker) Hilliard & B.L.Burtt 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_18505_0
            locator: "SANBI/WFO archive Morphology row 91002; source identifier 18505.0; cited publication: Bredenkamp, CL; Magwaza, ZL. 2019. Iridaceae. In: CL Bredenkamp (ed.), A Flora of the Eastern Cape Province, Strelitzia 41(3): 1821 - 1882. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Readily recognised by the pale pink flowers with an elongate perianth tube, typically 30-39 mm long, and large yellow anthers, 7-10 mm long. Plants have fairly broad, flaccid, drooping leaves, a suberect to drooping stem, and usually a cormlet in the axils of the lower leaves. The seeds of H. huttonii are distinctive, mostly 2.5-3.5 x ± 1.25 mm wide, with membranous wings at either end, the wings each ± half as long as the seed body which is up to 1.5 mm long. Plants from coastal northern Eastern Cape province, some 250 km to the east of the main range, best match the species, but one of the collections from there appears to lack axillary cormlets and has a perianth tube 23 mm long, while another collection has flowers with a tube only 15-17 mm long. The coastal plants are provisionally included in H. huttonii until more information becomes available.
            textZh: SANBI 条目提供了 Hesperantha huttonii (Baker) Hilliard & B.L.Burtt 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 94867; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
