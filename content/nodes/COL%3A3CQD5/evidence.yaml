        claims:
          - text: Dioecious, dwarf succulent with subterranean, main stem and rosette of slender branches just below ground; branches small, to 15 cm long, globose to cylindrical, obscurely 6-8-angled, 12-25 mm diam. Leaves 1-5 x 1 mm, deciduous. Cyathia solitary, 3-4 mm diam., glands entire, green to reddish brown.
