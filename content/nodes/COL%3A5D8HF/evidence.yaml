        claims:
          - text: Submerged, mat-forming marine perennial to 12 cm. Leaves 2-4 in fascicles, linear. Flowers inconspicuous.
            textZh: Zostera capensis Setch. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13982_0
            locator: "SANBI/WFO archive Morphology row 12232; source identifier 13982.0; cited publication: Manning, JC; Goldblatt, P. 2012. Zosteraceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 256 - 256. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: The species is closely related to the European Z. noltii Hornem. and could perhaps be considered a southern population as suggested by Dandy. The two taxa are however completely isolated. The African plants appear to be larger, the leaf apex is asymmetrical, the retinacula are broader and the testa of the nut is distinctly striate. Z. nana Roth is an illegitimate name for Z. noltii Hornem.
            textZh: SANBI 条目提供了 Zostera capensis Setch. 的鉴别特征。
