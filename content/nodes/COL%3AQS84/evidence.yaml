        usage:
          title: Capraria peruviana Benth., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrub to 2 m tall, the branches slender, puberulent, ridged below the nodes with concaulescent leaf tissue. Leaves alternate, lanceolate, apically acute, basally narrowed, denticulate in the upper 1/2, to 7 cm long, 10 mm wide; midvein prom- inent, the lateral venation obscure; petiole not evident. Inflorescence of 1-4 flowers in the axils of the leaves, numerous, the pedicels slender, puberulent, ca. 10 mm long. Flowers with the calyx of 5 equal lobes free nearly to the base, narrowly deltoid, ca. 3 mm long, glabrate; corolla white, rotate, ca. 4 mm long, the lobes acute, exceeding the tube, the tube shorter than the calyx lobes, glabrous outside, glabrate within; stamens 5, the filaments glabrous, unequal, 2 short, ca. 1 mm long, inserted near the top of the tube, 2 ca. 2 mm long inserted at the base of the tube; anthers versatile, 1 mm long, the thecae basally divaricate; ovary obtuse conical, the style 2 mm long, apically compressed, the stigma linear, following the style margins, ca. 1 mm long. Capsule 4-5 mm long, broadly ellipsoidal, glandular punctate, much exceeding the calyx lobes, the seeds yellow, ca. 0.4 mm long, reticulate.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 12925
          archiveSourceId: 31E06F90-6BA7-42CA-89EC-E4FAAAED20E9
