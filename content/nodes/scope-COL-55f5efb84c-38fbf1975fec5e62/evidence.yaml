    facets:
      morphology:
        status: partially-supported
        claims:
          - text: The authors describe TPL 6 as a partial left frontal bone with a modest superciliary arch and no supraorbital torus, and TPL 7 as a proximal left tibial fragment with a fused tibial tuberosity. Taphonomic alteration precluded accurate osteometric analysis of TPL 7. These are descriptions of two fossil specimens, not a species-wide morphology profile.
            textZh: 作者将 TPL 6 描述为左侧额骨残片，具有较弱的眉弓且没有眶上圆枕；将 TPL 7 描述为近端左胫骨碎片，其胫骨粗隆已经融合。埋藏改造使 TPL 7 无法进行准确的骨测量分析。这些描述仅针对两件化石标本，不代表全物种形态概况。
            sourceIds:
              - freidline2023
            locator: Results—Morphological description of Tam Pà Ling 6 and 7; Figs. 1–2
            placeTimeScope: TPL cave, Huà Pan Province, northern Laos; the paper describes the two fossil specimens from the late Pleistocene cave sequence. Site chronology is modeled from sediments and associated dating evidence, not directly from these anatomical observations.
            lifeStatus: Fossil human remains attributed by the authors to Homo sapiens; the article does not assess a living population.
            originalLanguage: en
        gaps:
          - Morphology evidence is limited to a partial frontal bone and a tibial fragment from one locality; it does not describe variation across populations, ages or anatomical systems.
      lifeHistory:
        status: not-assessed
        gaps:
          - No life-cycle, reproductive, growth, survival or longevity evidence was assessed.
      ecology:
        status: partially-supported
        claims:
          - text: Stable-isotope analysis of collagen from 10 human remains, interpreted with 52 animal remains at Ilsenhöhle in Ranis, indicated a homogeneous dietary signal based on large terrestrial mammals in a cold steppe–tundra setting. This claim applies to the sampled early Homo sapiens and this cave assemblage; it does not describe the diet of Homo sapiens generally.
            textZh: 对 Ilsenhöhle 的 10 份人类遗骸胶原蛋白进行稳定同位素分析，并结合 52 份动物遗骸，研究指出当地早期 Homo sapiens 的饮食信号较为同质，主要来自大型陆生哺乳动物，环境为寒冷草原／苔原。此主张仅适用于该洞穴考古组合及被采样个体，不代表 Homo sapiens 的普遍饮食。
            sourceIds:
              - smith2024ranis
            locator: Abstract; Main, Ranis and LRJ layers 9–8; stable-isotope summary for 52 animal and 10 human remains
            placeTimeScope: Ilsenhöhle at Ranis, Thuringia, central Germany. The sampled human remains are associated with LRJ layers 9–8 dated respectively to 47,500–45,770 and 46,820–43,260 calibrated years BP; these are archaeological layer ages, not direct dates on every human specimen.
            lifeStatus: Ancient human remains attributed to Homo sapiens in an archaeological cave context; this does not describe living, wild or captive populations.
            originalLanguage: en
        gaps:
          - This isotope inference concerns 10 human remains at one cave and does not establish a general Homo sapiens diet, habitat profile or range-wide ecological pattern.
          - The article reports fluctuating human presence, sparse human butchery traces and substantial cave-bear and hyena input to the cave assemblage; isotope results alone do not show that every indicated animal taxon was hunted or consumed at the site.
      evolution:
        status: partially-supported
        claims:
          - text: In the study comparison, the authors report that ancient southern African individuals dated to more than 1,400 calibrated years before present fell outside the range of genetic variation in their modern-day human comparison sample and carried many variants they classify as Homo sapiens-specific. This describes the study samples and operational variant set, not a separate taxonomic unit or all human populations.
            sourceIds:
              - jakobsson2025
            locator: Abstract; Results, Unique ancient southern African ancestry
            placeTimeScope: Twenty-eight ancient southern African individuals dated 10,200-150 calibrated years before present, compared with the modern and ancient reference samples specified by the study; this is not a species-wide survey.
            lifeStatus: Ancient human individuals in the study sample; no claim is made about all contemporary Homo sapiens.
            originalLanguage: en
        gaps:
          - Population-genomic findings are limited to sampled individuals and comparison groups; no complete species evolutionary history or current population review was undertaken.
      distribution:
        status: partially-supported
        claims:
          - text: The study sampled ancient individuals from archaeological sites south of the Limpopo River across southern and central South Africa. These are sample localities and do not delimit the current range of Homo sapiens.
            sourceIds:
              - jakobsson2025
            locator: Main, sampling description; Figure 1
            placeTimeScope: Twenty-eight Holocene individuals dated 10,200-150 calibrated years before present from sampled South African sites in the study.
            lifeStatus: Ancient archaeological human remains; no inference about present-day range is made.
            originalLanguage: en
        gaps:
          - No current or historical global range inventory was conducted; study localities are not a distribution boundary.
      fossil:
        status: partially-supported
        claims:
          - text: The study assigns the TPL 6 frontal bone and TPL 7 tibial fragment from Tam Pà Ling cave, northern Laos, to Homo sapiens. Its abstract reports presence by 70 ± 3 ka for TPL 6 and an extension to 77 ± 9 ka for TPL 7; these are site-context chronology estimates based on modeled sediment ages and associated dating, not direct dates on the hominin fragments. The authors note that TPL 7 may be older than the modeled estimate because the deepest sediment sample was collected 30 cm higher.
            textZh: 该研究将来自老挝北部 Tam Pà Ling 洞穴的 TPL 6 额骨和 TPL 7 胫骨碎片归为 Homo sapiens。论文摘要报告，TPL 6 将该地人类出现时间确定到距今 70 ± 3 千年，TPL 7 则将记录延伸至 77 ± 9 千年；这些是基于沉积物年龄模型及相关测年证据的地点年代估计，并非直接测得人类化石本身的年龄。作者指出，由于最深处沉积物样本采集位置高出 30 厘米，TPL 7 的年代可能早于模型估计。
            sourceIds:
              - freidline2023
            locator: Abstract; Results—Context and dating, especially the modeled TPL sequence and TPL 7 stratigraphic position; Fig. 5
            placeTimeScope: One fossil locality, Tam Pà Ling cave, northern Laos. The paper's 2-sigma site model places human material within a sequence extending approximately 77 ± 9 to 39 ± 9 ka; TPL 7 may predate the modeled oldest estimate. These are contextual depositional ages, not direct fossil dates.
            lifeStatus: Fossil human remains attributed to Homo sapiens; this claim does not describe living, wild or captive populations.
            originalLanguage: en
        gaps:
          - One cave sequence does not establish a global Homo sapiens fossil range or first/last occurrence. TPL 7 may be older than the modeled site estimate, and no systematic fossil-record review was completed.
      conservation:
        status: not-assessed
        gaps:
          - No conservation assessment, population trend or risk category was reviewed.
