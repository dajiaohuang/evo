        claims:
          - text: Rounded, grey-woolly shrublet to 20 cm. Leaves oblanceolate-spathulate, grey-woolly. Flower heads disciform, 1-few at tips of branchlets, subglobose, golden-brown, ± 5-7 x 5-8 mm, involucral bracts concave, inner tipped white and minutely spreading, florets 60-120, ovary glabrous or papillate-hairy.
