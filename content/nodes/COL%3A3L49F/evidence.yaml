    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Stemless, cormous geophyte, 80-120 mm tall, corm with a flat base, with spiny margins. Leaves sword-shaped. Flowers 1 or 2 per spike, white with dark markings at base of tepals, perianth tube elongate, 30-45 mm long, tepals spreading, open in the day, unscented. July-early Aug.
            textZh: Hesperantha luticola Goldblatt 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_14562_0
            locator: "SANBI/WFO archive Morphology row 33242; source identifier 14562.0; cited publication: Goldblatt, P; Manning, JC. 2013. Iridaceae. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 94 - 124. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Hesperantha luticola stands out in sect. Hesperantha as one of only two acaulescent species of the section. The white flowers have large purple blotches at the bases of the outer tepals and a remarkably long perianth tube, mostly 30-45 mm long. The tube has thick walls that tightly clasp the style so that nectar is forced into the top of the tube where it is accessible to insect visitors with short mouth parts. The corm, with short, radiating spines most closely resembles the corms of H. latifolia and H. pauciflora and it seems reasonable to infer that these are the closest relatives of H. luticola.
            textZh: SANBI 条目提供了 Hesperantha luticola Goldblatt 的鉴别特征。
