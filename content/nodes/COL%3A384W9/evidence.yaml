            locator: "SANBI/WFO archive Morphology row 1782; source 11118.0; publication: Herman, PPJ; Retief, E. 1997. Plants of the northern provinces of South Africa: Keys and diagnostic characters. Strelitzia 6: 1 - 681. National Botanical Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Plants of Baynesia are mostly small and consist of a cluster of erect stems. The four-angled, greenish stems are comparatively soft and have a rugulose surface that is also covered with fine papillae. Each of the obscure tubercles bears a leaf which soon falls off. Stipular denticles are very intermittently present and there is often only one per tubercle, while most tubercles have none at all. Flowers are borne in small clusters around the tips of the stems on new growth. They are small and nodding and emit a faint but still detectable, excrement-like odour for a short while after opening. Inside they are deep maroon on the lobes changing to cream in the tube. The tube is more or less hemispherical and the lobes are erect around its mouth. Each lobe has its margins quite well folded back and there is a peculiar ridge of papillae running along either side of the innermost surface from the mouth of the tube towards its apex. This makes the lobe appear to be crested on the inside and this crest is somewhat emphasised by the strongly recurved apices of the lobes. The particularly small corona is very slightly raised above the base of the tube. The minute spreading outer lobes are transparent except for a dark maroon patch under the guide-rails, and the inner corona is cream but slightly more intense than the cream of the tube. It is a remarkable fact that the tiny flowers of Baynesia lophophora are readily pollinated where I have them growing on a bedroom windowsill in Cape Town. This happens despite the fact that their natural habitat is more than 2000 km away and it serves to demonstrate once again that many of these plants are not adapted to very localised pollinators.
