        claims:
          - text: Dwarf succulent decumbent perennial herb. Corolla glabrous or minutely puberulous or papillate on annulus, lobes not replicate, ciliate or glabrous. Flowers dull green outside, rich purplish chocolate inside; corona chocolate-red, inner coronal lobes dull orange-red.
            sourceIds:
