    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Spreading, erect or subscandent herb or soft shrub, 0.6-1.2 m tall. Leaves petiolate, opposite or sometimes ternate; blade grey-green, ovate-lanceolate to ovate-elliptic, 35-65(-75) x 18-25 mm, sparingly pubescent to fairly densely appressed tomentose, apex acute, base cuneate, margin crenate-dentate; petiole 3-8 mm long. Inflorescence consisting of rather lax panicles or racemes; verticils 2-4-flowered, 3-5 mm apart; bracts minute, linear-lanceolate, 1.5-2 mm long; pedicels slender, 2.5-4 mm long, articulate at the top. Calyx subequally 5-toothed, 4-4.5 mm long at flowering; teeth narrow, 1-1.5 mm long; tube cylindric, becoming globose and fleshy in fruit. Corolla bilabiate, white or cream, 6-7 mm long; tube straight, subcylindric; upper lip short, erect, 1 mm long, 3-lobed; lower lip patent, 1.5 mm long. Stamens didynamous, only the lower fertile, declinate, attached near the throat, exserted by 3-5 mm; the upper pair minute, attached in the throat, included. Disc produced on one or two sides, one lobe often exceeding the overy. Style exserted, shortly 2-lobed. Fruit subglobose, berry-like, 4-5 mm in diam., orange-coloured, usually enclosing 2 or 3 nutlets; nutlets ellipsoid-orbicular, compressed, 2 x 1.5 mm.
            sourceIds:
