  claims:
    - subjectId: taxon:eudicotyledones
      claimKind: scientific
      claimType: topology
      statement: An 83-plastid-gene analysis resolves several early eudicot branches in its sampled taxa; this organellar topology is not a global eudicot first appearance or a direct ancestor sequence.
      confidence: high
      confidenceRationale: Large plastid character sampling supports the reported nodes, while taxon sampling and organellar inheritance bound broader evolutionary history.
      referenceLinks:
        - referenceId: moore-2010-eudicot-plastids
          relation: supports
          pages: 4623–4628
          quoteLocator: Figures 1–2; 83-gene phylogenetic analyses
    - subjectId: taxon:eudicotyledones
      claimKind: scientific
      claimType: taxonomy
      statement: Leefructus mirus is diagnosed as a basal eudicot from the Early Cretaceous Yixian Formation, while a separate 83-plastid-gene analysis resolves selected living early eudicot branches; neither result is a literal ancestor sequence.
      confidence: medium
      confidenceRationale: The fossil diagnosis and sampled organellar topology are independently documented, but their different evidence scopes do not fix a complete eudicot phylogeny or crown age.
      referenceLinks:
        - referenceId: sun-2011-leefructus
          relation: supports
          pages: 471:625–628
          figure: Figures 1–5
          quoteLocator: Abstract and Leefructus diagnosis
        - referenceId: moore-2010-eudicot-plastids
          relation: supports
          pages: 107:4623–4628
          figure: Figures 1–2
          quoteLocator: 83-gene phylogenetic analyses
    - subjectId: taxon:eudicotyledones
      claimKind: scientific
      claimType: biogeography
      statement: The fossil locality represented in this profile is the Daxinfangzi bed of the Yixian Formation in northeastern China; one dated locality does not establish a eudicot origin centre or global distribution.
      confidence: high
      confidenceRationale: The primary description provides the locality and dated bed envelope directly. The narrow claim makes no extrapolation from that locality to class-wide biogeography.
      referenceLinks:
        - referenceId: sun-2011-leefructus
          relation: supports
          pages: 471:625–628
          figure: Figure 1
          quoteLocator: Locality, stratigraphic setting and radiometric dates
    - subjectId: taxon:eudicotyledones
      claimKind: scientific
      claimType: ecology
      statement: Leefructus preserves vegetative and reproductive plant material, supporting only a bounded primary-producer context for the sampled fossil; its habitat and any class-wide eudicot ecology remain unresolved.
      confidence: low
      confidenceRationale: The material establishes the identity and morphology of the sampled fossil but does not directly measure habitat, physiology or class-wide ecological roles.
      referenceLinks:
        - referenceId: sun-2011-leefructus
          relation: supports
          pages: 471:625–628
          quoteLocator: Fossil description and systematic discussion
    - subjectId: taxon:eudicotyledones
      claimKind: scientific
      claimType: morphology
      statement: Leefructus mirus from the Yixian Formation has deeply three-lobed leaves grouped at nodes and an axillary reproductive axis ending in five narrow, partly united carpels. These are features of the described fossil, not a universal eudicot body plan.
      confidence: high
      confidenceRationale: The named fossil and its diagnostic structures are directly described and illustrated, while extension to all eudicots would exceed the specimen and analysis scope.
      referenceLinks:
        - referenceId: sun-2011-leefructus
          relation: supports
          pages: 471:625–628
          figure: Figures 1–5
          quoteLocator: Fossil description and comparative diagnosis
    - subjectId: taxon:eudicotyledones
      claimKind: scientific
      claimType: fossil-range
      statement: "Eudicotyledones is displayed at 125.8–0 Ma only as a radiometrically bounded Leefructus-sample-to-living navigation anthology: the fossil supports basal-eudicot presence but does not establish the exact global FAD, crown divergence or continuous occupancy."
      confidence: high
      confidenceRationale: Sun et al. (2011) directly diagnose Leefructus and bound its fossil bed with multiple radiometric dates at 122.6–125.8 Ma. High confidence applies to that specimen and bed envelope plus living continuation, not an exact eudicot origin.
      referenceLinks:
        - relation: supports
          referenceId: sun-2011-leefructus
          pages: 471:625–628
          figure: Figures 1–5
          quoteLocator: Abstract; 122.6–125.8 Ma bed dates and Leefructus diagnosis
  claim-rationales.zh:
    - 大量质体性状支持所报告节点，但类群取样和细胞器遗传限制了更广的演化历史推断。
    - Sun 等（2011）直接鉴定 Leefructus，并用多组放射性测年把化石层限定为 122.6–125.8 Ma。高置信度仅适用于该标本、地层包络与现生延续，不代表精确真双子叶起源。
    - Leefructus 的化石诊断与现生类群的质体系统树各自有直接证据，但二者证据范围不同，不能固定完整真双子叶系统树或冠群年龄。
    - 原始描述直接给出义县组大新房子层的地点与年代；本声明不把一个地点外推为真双子叶植物起源中心或全球分布。
    - 化石材料可支持所采样植物的初级生产者背景，却不能直接测量生境、生理或整个类群的生态角色，因此保留为低置信度。
    - 具名化石及其诊断性营养和生殖结构有直接描述和图示；中生代单一标本不能代表全部真双子叶植物体制。
  claim-statements.zh:
    - 早白垩世义县组的 Leefructus mirus 被鉴定为基部真双子叶植物；另一项独立的 83 个质体基因分析解析了所选现生早分化真双子叶植物分支。两项结果都不等于实际的祖先序列。
    - 本档案代表的化石产地是中国东北义县组的 Daxinfangzi 层位；一个已测年的地点不能确定真双子叶植物的起源中心或全球分布。
    - Leefructus 保存了植物营养与生殖材料，仅支持将所采样化石置于有限的初级生产者背景中；其生境及全纲层面的真双子叶植物生态仍未确定。
    - 义县组的 Leefructus mirus 具有在节处成簇的深三裂叶，以及末端带有五枚狭长、部分联合心皮的腋生生殖轴。这些是所描述化石的特征，而非真双子叶植物的通用体制。
    - 83 个质体基因的分析解析了取样类群中的若干早期真双子叶分支；这一细胞器拓扑不是全球真双子叶植物首现，也不是直接祖先序列。
    - Eudicotyledones 的 125.8–0 Ma 仅作为“放射性测年限定的 Leefructus 样本—现生类群”导航汇编：该化石支持基部真双子叶植物存在，但不能确立精确全球首现、冠群分化或连续占据。
