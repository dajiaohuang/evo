      distribution:
        status: partially-supported
        claims:
          - text: Acoustic surveys at six sites in Kachin State and three in Shan State, Myanmar, recorded 23 gibbon groups in Kachin and 21 in Shan; genetic identification from skin and saliva samples matched Hoolock tianxing at 99.54–100% identity. These detections confirm occurrence at surveyed localities and are not a range-wide population estimate.
            locator: Abstract; Methods, site selection and survey methods; Results, Population Surveys; Discussion; Fig. 2.
            placeTimeScope: Field surveys in Kachin and Shan States, Myanmar, December 2021 through March 2023. Kayah and Kayin sites were inaccessible, so the sampled sites do not represent a complete range-wide survey.
            lifeStatus: Free-ranging gibbons were acoustically detected and identified using non-invasive field samples; no captive animals were used for these detections.
            sourceIds:
              - aung2024
            originalLanguage: en
        gaps:
          - Presence is confirmed only at the surveyed localities; inaccessible areas and unsurveyed habitat prevent treating these counts as a complete range or population estimate.
      fossil:
