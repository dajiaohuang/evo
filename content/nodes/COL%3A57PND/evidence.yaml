        claims:
          - text: Rhizomatous perennial to 1 m, roots many, thickened. Leaves few, lanceolate and falcate, leathery. Flowers in a slender, sparsely branched raceme, imbricate, white, bracts hairy.
            textZh: Trachyandra arenicola J.C.Manning & Goldblatt 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13858_0
            locator: "SANBI/WFO archive Morphology row 8978; source identifier 13858.0; cited publication: Manning, JC; Goldblatt, P. 2012. Asphodelaceae: Trachyandra Kunth. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 78 - 80. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Trachyandra arenicola is distinguished from T. falcata by its more slender stature, laxer inflorescences with ± concolorous bracts, and especially by lacking the amplexicaul peduncular bract diagnostic of T. falcata. The latter is an altogether more robust species with a dense inflorescence, characteristically with the outer half of the bracts suffused dark brown. In addition, the roots of T falcata are far more numerous, slender, and not swollen. The two species are ecologically distinct, with T. falcata favouring stony, often granitic slopes, and T. arenicola restricted to sandy flats. From T. ciliata it is immediately separable by its erect, not trailing or creeping inflorescences (although the older inflorescences tend to topple over and become decumbent in fruit), its erect, not pendent fruits, and by the shorter bracts,7-9 mm long vs 10-16 mm.
            textZh: SANBI 条目提供了 Trachyandra arenicola J.C.Manning & Goldblatt 的鉴别特征。
            sourceIds:
              - sanbi_6905_0
            locator: "SANBI/WFO archive Diagnostic row 84510; source identifier 6905.0; cited publication: Manning, JC; Goldblatt, P. 2007. Asphodelaceae: Trachyandra arenicola and T.montana, two new species from South Africa. Bothalia 37(1): 26 - 31. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
