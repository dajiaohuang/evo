        claims:
          - text: Annual herb, 0.06-0.50 m high. Leaves in a basal rosette, linear, 120 x 8 mm, densely villous, amplexicaul. Inflorescences in spikes up to 180 mm long; scapes many per rosette, up to 300 mm long; bracts villous, apex acute. Calyx lobes narrowly elliptic, ± 2 x 1 mm, subacute. Corolla lobes broadly deltoid, ± 2 x 1.7 mm, acute. Flowering time Dec. Fruit an ellipsoid capsule, ± 3 x 2 mm. Seeds boat-shaped, 2-4 per capsule, greenish brown, 1.9 x 1 mm, hilum scar in ventral depression almost as long as seed.
