    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants 150-200(-300) mm high. Corm obliquely bell-shaped, 6-8 mm diam.; tunics ± woody, dark grey, fragmenting from lower margins into tile-like segments. Stem smooth, unbranched. Leaves several, dry at flowering time, linear, mostly 10-60 x 1.0-1.5 mm, uppermost 2 or 3 leaves sheathing for entire length. Spike 2- to 4(-7)-flowered, flexuose; bracts dry and brown at flowering, outer mostly 12-15 mm long with margins united near base for 1-2 mm sheathing spike axis, inner forked apically. Flowers diurnal, pink with white throat, unscented, anthers yellow, prominently displayed; perianth tube cylindric, slightly expanded at apex, 13-16 mm long, distal half exserted from bracts; tepals subequal, spreading, elliptic, ± 12 x 4-5 mm, outer slightly larger than inner. Filaments erect, 2.5 mm long, exserted ± 1 mm from tube; anthers ± 5 mm long, yellow, remaining coherent around style; pollen yellow. Style exserted, enclosed by stamens, dividing just below anther apices, branches ± 5 mm long, remaining erect, slightly twisted and often interlaced. Capsules subcylindric, 7-8 mm long. Seeds angular, ± 0.7 x 0.4 mm, with membranous raphal ridge expanded into a wing at micropylar end.
            textZh: Hesperantha kiaratayloriae Goldblatt & J.C.Manning 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Morphology row 98675; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Unique in the genus, Hesperantha kiaratayloriae has the style extending well beyond the mouth of the perianth tube and overtopping the anthers, these also unusual in being parallel and contiguous. The stamens thus enclose the style, which divides immediately below the anther tips into upright, loosely twisted branches sometimes interlaced around one another. The margins of the floral bracts are united basally for up to 2 mm, and the bell-shaped corm with a flat base place the species in sect. Radiatae. Also unusual in the section for the pink flowers and leaves dry at flowering, H. kiaratayloriae mostly closely resembles H. muirii, which also has twisted style branches and relatively short leaf blades but larger, white or rarely pale pink flowers with the style dividing at the mouth of the perianth tube.
