          publishedAt: undated
          originalSourceText: Shrub to 3 m. tall, the younger branches glabrous, or rarely with a few setae at the nodes; petioles slender, 1-3 cm. long, usually setose near the summit on the upper side; leaf-blades firm in texture, oblong, varying toward ovate or obovate, up to 15 cm. long, two-fifths to half as wide, acute or abruptly acuminate, con- spicuously ciliate and commonly serrulate, glabrous, 3-nerved; panicle pyramidal, divaricately branched; flowers sessile and secund; hypanthium globose or urceolate, 2-2.5 mm. long; calyx-tube short, erect, truncate; petals about 3 mm. long; stamens isomorphic; anthers stoutly oblong, 1.5 mm. long, 2-celled, the connective simple.
