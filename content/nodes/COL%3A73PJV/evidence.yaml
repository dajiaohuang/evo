    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, 30-40 cm, stems sticky. Leaves solitary, linear, channelled and trailing. Flowers pale yellow, style branches filiform, undivided, extending between the anther bases.
            textZh: Moraea simplex Goldblatt & J.C.Manning 的 SANBI 物种条目记载了植株、叶片和花部形态。
            sourceIds:
              - sanbi_13878_0
            locator: Strelitzia 29; archive Morphology row 7429, source 13878.0
            placeTimeScope: Regional species account published 2012; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
          - text: The growth habit, corm tunics, characteristic branching with sticky internodes, and the free but parallel and coherent filaments all place Moraea simplex firmly in subg. Visciramosae but its simple filiform, apically stigmatic style branches extending outward between the top of the filaments, and short, suberect tepals claws ± 2 mm long are unique in the subgenus and remarkable in Moraea, in which just two species of subg. Polyanthes have similar style branches. Vegetatively, M. simplex may be mistaken for the common and widespread M. inconspicua in both habit and the short rhipidial spathes, but the flowers of M. inconspicua, although small, conform to the conventional type in the genus in their flattened style branches bearing paired erect, style crests.
            textZh: SANBI 条目提供了 Moraea simplex Goldblatt & J.C.Manning 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: Strelitzia 42; archive Diagnostic row 95248, source 18638.0
            placeTimeScope: Regional species account published 2020; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
