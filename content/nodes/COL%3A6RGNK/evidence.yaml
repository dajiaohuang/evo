          title: Miconia costaricensis Cogn., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrub to 4 m. tall, the stems, petioles, leaves, inflorescence, and hypanthia densely hirsute with simple red-purple bristles up to 3 mm. long; petioles 5-20 mm. long; leaf-blades ovate-lanceolate to oblong-elliptic, up to 15 cm. long, two- fifths to half as wide, acuminate, obscurely denticulate or crenulate, obtuse to rounded at base, 5-pli-nerved or sometimes merely 5-nerved; panicles 2-5 cm. long, congested; hypanthium cup-shaped, about 2.5 mm. long to the torus; calyx- tube prolonged about 0.5 mm.; calyx-lobes depressed-triangular, about 0.5 mm. long from the sinus; exterior teeth stoutly subulate, hirsute, about 2 mm. long; petals pink, about 3 mm. long; stamens isomorphic; anthers oblong, blunt, 4-celled; stigma truncate.
