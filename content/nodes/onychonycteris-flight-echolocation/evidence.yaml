  claims:
    - subjectId: event:onychonycteris-flight-echolocation
      claimKind: scientific
      claimType: morphology
      statement: Onychonycteris finneyi holotype ROM 55351A preserves a nearly complete skeleton with wing proportions compatible with powered flight and a relatively small cochlea interpreted as lacking specialized laryngeal echolocation; neither behaviour was observed and the specimen is not a direct ancestor of living bats.
      confidence: medium
      confidenceRationale: The skeleton and measurements are direct evidence, whereas flight performance, echolocation capacity and stem placement rely on functional proxies and a morphology matrix.
      referenceLinks:
        - referenceId: simmons-2008-onychonycteris
          relation: supports
          pages: 818–821
          figure: Figures 1–4; Supplementary Figures 1–10; Tables 1–3
          quoteLocator: Holotype; Comparative cochlear dimensions; Limb proportions; Phylogenetic analysis
  claim-rationales.zh:
    - 骨架和测量是直接证据；飞行性能、回声定位能力与干群位置依赖功能代理和形态矩阵。
  claim-statements.zh:
    - Onychonycteris finneyi 正模 ROM 55351A 保存近完整骨架，翼部比例符合动力飞行，而相对较小的耳蜗被解释为缺少特化喉源回声定位；两种行为均未被观察，标本也不是现生蝙蝠的直系祖先。
