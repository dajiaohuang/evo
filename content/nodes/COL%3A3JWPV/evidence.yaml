    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants acaulescent, with leaves in a basal rosette which is about 2 to 6 mm diam., proliferous from the base and forming small clusters. Leaves 12 to 40, the young ascending, slightly recurved, the old ascending, long-tapering, often recurved, up to 100 mm long, up to 14 mm broad near the base, up to 3.5 mm thick, lanceolate, acuminate, gradually narrowed from the base to the tip, dark dull green or brownish-green; upper surface concave below, convex to flat towards the tip, smooth, with 1 to 2 raised concolorous lines, and 5 to 7 indistinct longitudinal lines; keel 1, obliquely positioned in the upper half of the leaves, obtuse below, somewhat acute above, with numerous minute more-or-less scattered whitish teeth; margins acute to somewhat blunt, sparsely and irregularly toothed from the tip to near the base; end-awn 2 to 3 mm long, naked, white. Inflorescence about 20 cm tall; peduncle simple, terete, about 2 mm diam., 12 cm long, bracteate; sterile bracts membranous, abruptly long acuminate, 5 to 8 mm long, erect, keeled; raceme about 8 cm long, lax with 6 to 10 spirally arranged flowers and buds, 1 to 2 open at a time; floral bracts membranous, 4 to 5 mm long, deltoid, acuminate, keeled with fine light brown veins, clasping the pedicels, (longer than the pedicels); pedicels up to 3 mm long, 1 mm diam., light greenish-brown, erect; perianth dull pinkish-white, with reddish-brown keels to the segments, 14 mm long, compressed at base, funnel-shaped, tube more or less 3 mm across, constricted to 2.25 mm above, curved; segments free to the base, limb 2 lipped; posterior part with lobes free, much recurved, little spreading, pinkish-white with fine reddish-brown veins; exterior part much recurved, little spreading, pinkish-white, with fine pale green veins, outer segments replicate; stamens 6 of two lengths 4 and 5 mm long inserted within the perianth tube; ovary 3 mm long, 1.25 mm diam., yellow-green; style 0.5 mm long, white, curved, capitate.
            textZh: Haworthia angustifolia Haw. 的 SANBI 物种条目记录了形态特征。
