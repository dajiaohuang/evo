      lifeHistory:
        status: not-assessed
      ecology:
        status: partially-supported
        claims:
          - text: The species occurs in a variable rainfall area where the annual rainfall varies from about 300 to 700 mm, occurring mainly in summer. High temperatures are registered during the summer months, especially December to February, but the winters are cold, often with snow on the higher peaks of the surrounding mountains, to which the species has adapted itself. The plants grow mainly between rocks or in rock crevices, and occur in Karroid vegetation or in open grasslands. H. angustifolia prefers a firm hard soil with pH 7.
