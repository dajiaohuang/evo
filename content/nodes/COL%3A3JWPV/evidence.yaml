            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: H. angustifolia is characterised by its sparsely dentate, narrow lanceolate leaves. It shows affinities with two species, H. monticola and H. floribunda. From H. monticola it differs by the sparse and shorter marginal teeth, longer and more tapering leaf-tips, and from H. floribunda by its toothed margins, sharp pointed leaf-tips, longer inflorescence, and by the large clumps which it soon forms.
