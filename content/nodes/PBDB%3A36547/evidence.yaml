  claims:
    - subjectId: taxon:chaohusaurus
      claimKind: scientific
      claimType: fossil-range
      statement: Chaohusaurus is anchored by maternal specimen AGM I-1 from the Procolumbites Zone at Majiashan; the locality record does not establish a global genus range, an exact first appearance or ancestral status.
      confidence: high
      confidenceRationale: Specimen association and geological setting are directly documented. The claim deliberately omits genus-wide endpoints and reproductive-behavior extrapolation.
      referenceLinks:
        - referenceId: motani-2014-chaohusaurus-viviparity
          relation: supports
          pages: 9(2):e88640
          figure: Figure 1; Supplementary geological information
          quoteLocator: Geological setting; specimen description; Results
    - subjectId: taxon:chaohusaurus
      claimKind: scientific
      claimType: taxonomy
      statement: Chaohusaurus is assigned to the Early Triassic ichthyopterygians in Motani et al.'s study using delayed ossification of carpals and tarsals, dental morphology, vertebral count and hypophalangeal flippers; species-level taxonomy may require revision as more specimens are prepared.
      confidence: high
      confidenceRationale: The paper states the diagnostic character combination and assignment procedure directly; the species-level caveat is retained rather than treating the genus assignment as an immutable taxonomy.
      referenceLinks:
        - referenceId: motani-2014-chaohusaurus-viviparity
          relation: supports
          pages: e88640, Materials and Methods—Taxonomy
          figure: Figures 1–4; Supplementary Figures S1–S3
          quoteLocator: Chaohusaurus assignment; delayed ossification, dental morphology, vertebral count and hypophalangeal flippers
    - subjectId: taxon:chaohusaurus
      claimKind: scientific
      claimType: biogeography
      statement: The profiled Chaohusaurus record is limited to south Majiashan Quarry at Chaohu, Anhui, China, where the Spathian Nanlinghu Formation is exposed; this named collection does not establish a complete geographic distribution.
      confidence: high
      confidenceRationale: The primary paper names the quarry, region and exposed formation in its specimen methods. The claim is explicitly a locality boundary and does not infer a global range from one collection.
      referenceLinks:
        - referenceId: motani-2014-chaohusaurus-viviparity
          relation: supports
          pages: e88640, Materials and Methods—Specimens
          figure: Figure 1; Supplementary Figure S1
          quoteLocator: south Majiashan fossil quarry; Chaohu, Anhui, China; Spathian Nanlinghu Formation
    - subjectId: taxon:chaohusaurus
      claimKind: scientific
      claimType: morphology
      statement: Maternal specimen AGM I-1 preserves an articulated Chaohusaurus skeleton with two embryos in the body and a neonate adjacent to the pelvis, while the genus assignment uses its documented dental, vertebral and flipper characters.
      confidence: high
      confidenceRationale: The specimen association and preserved elements are illustrated and described in the results. High confidence is restricted to the named slab and diagnostic character set, not to a universal body plan.
      referenceLinks:
        - referenceId: motani-2014-chaohusaurus-viviparity
          relation: supports
          pages: e88640, Results—Maternal specimen and Embryonic identification
          figure: Figures 2–4; Supplementary Figures S2–S3
          quoteLocator: AGM I-1 maternal skeleton; two embryos; adjacent neonate; articulated anatomy
    - subjectId: taxon:chaohusaurus
      claimKind: scientific
      claimType: ecology
      statement: AGM I-1 directly documents pregnancy in an Early Triassic ichthyosauromorph; the head-first embryo orientation and a proposed terrestrial origin of viviparity are comparative interpretations, not directly observed behaviour or an ancestral state for all ichthyosaurs.
      confidence: medium
      confidenceRationale: Embryo association is direct specimen evidence, whereas delivery posture and reproductive-history conclusions depend on orientation, phylogeny and comparative reasoning; the claim keeps those evidence levels separate.
      referenceLinks:
        - referenceId: motani-2014-chaohusaurus-viviparity
          relation: supports
          pages: e88640, Results; Discussion—Evolution of reproductive strategy
          figure: Figures 2–4
          quoteLocator: AGM I-1 embryos and neonate; embryo orientation; reproductive-history interpretation
  claim-rationales.zh:
    - 标本关联与地质背景有直接记录。主张刻意不外推属级端点和繁殖行为。
    - 一手研究直接列出 Chaohusaurus 的诊断性状与归属方法；种级修订可能性被保留，不把属级归属变成不可变分类。
    - 正模研究明确给出马家山采石场、巢湖安徽和南陵湖组；该主张严格限定为地点边界，不从一次采集推断全球分布。
    - AGM I-1 的母体、两个胚胎和相邻新生个体在图版及结果中直接描述；高置信度仅适用于具名石板和性状组合。
    - 胚胎关联是直接标本证据，而分娩朝向和胎生历史依赖比较解释；主张明确区分观察与推断的证据层级。
  claim-statements.zh:
    - 巢湖龙由马家山 Procolumbites 带的母体标本 AGM I-1 锚定；该地点记录不建立全球属级范围、精确首现或祖先地位。
    - Motani 等依据腕骨和跗骨相对掌骨、跖骨及趾骨的延迟骨化、牙齿形态、椎骨数和下指骨鳍肢，将 Chaohusaurus 归入早三叠世鱼龙纲类群；随着更多标本制备，种级分类或需修订。
    - 本档案中的 Chaohusaurus 记录限定于中国安徽巢湖南陵湖以南马家山采石场，该处出露斯帕斯期南陵湖组；这一具名采集不能确立完整地理分布。
    - 母体标本 AGM I-1 保存关节相连的 Chaohusaurus 骨骼、体内两个胚胎和骨盆旁一个新生个体；属级归属依据论文记录的牙齿、椎骨和鳍肢性状。
    - AGM I-1 直接记录早三叠世鱼龙形类的妊娠；胚胎头先朝向及胎生陆生起源的提出属于比较解释，并非直接观察到的行为或所有鱼龙的祖先状态。
