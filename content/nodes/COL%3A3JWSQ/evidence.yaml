            locator: "SANBI/WFO archive Diagnostic row 66121; source identifier 15993.0; cited publication: Brown, JR. 1941. Notes on Haworthias. Cact. Succ. J. (Los Angeles) 13(5): 75 - 75. [All rights reserved]"
