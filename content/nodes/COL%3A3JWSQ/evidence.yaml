        claims:
          - text: Acaulescent succulent with solitary rosettes to 10 cm diam. Leaves grey-green, abruptly recurved, often scabrid to papillate, flat above, obtuse. Flowers white.
            textZh: Haworthia pygmaea Poelln. 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13856_0
            locator: "SANBI/WFO archive Morphology row 9097; source identifier 13856.0; cited publication: Bayer, B. 2012. Asphodelaceae: Haworthia Duval. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 75 - 77. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: This neat little Haworthia is near H. asperula Haw. from which it differs in its much smaller size and the fewer lines on the leaf faces. The lines on the leaf faces are somewhat obscure and usually are 3 in number, the middle line being the longest with a shorter line on either side. It gives rise to offsets from the base very slowly and after a great many years forms a cluster.
            textZh: SANBI 条目提供了 Haworthia pygmaea Poelln. 的鉴别特征。
            sourceIds:
