    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, 250-500 mm tall, often branched, lateral flower clusters sessile. Leaf 1, terete, often dry at flowering. Flowers enclosed in dry spathes, blue-mauve, tepals subequal, claws short, forming a shallow cup, limbs spreading, style branches reduced, hidden by the anthers.
            textZh: Moraea pseudospicata Goldblatt 的 SANBI 物种条目记载了植株、叶片和花部形态。
            sourceIds:
              - sanbi_14562_0
            locator: Strelitzia 30; archive Morphology row 33350, source 14562.0
            placeTimeScope: Regional species account published 2013; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
          - text: Resembling the more common and widespread Moraea crispa in both flower structure and general aspect, M. pseudospicata has pale blue-mauve flowers with subequal tepals with short erect claws that form a short, narrow cup including the lower part of the filament column. The anthers are nearly erect and so concealing the narrow and short style branches, whereas in M. crispa the anthers and style branches diverge, exposing the style branches. Moraea pseudospicata differs also in its taller stature, up to 400 mm high, sessile lateral inflorescences with dry, chaffy sheathing leaves and rhipidial spathes, and in its globose capsules with almost membranous walls, apparently dehiscing irregularly rather than along the locule sutures. Flowering middle to late summer in an area of summer drought, the leaves are usually dry and broken at flowering time.
            textZh: SANBI 条目提供了 Moraea pseudospicata Goldblatt 的鉴别特征。
