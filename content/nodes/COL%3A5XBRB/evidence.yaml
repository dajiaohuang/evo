    facets:
      morphology:
        status: not-assessed
        gaps:
          - No morphology evidence was assessed in this batch.
      lifeHistory:
        status: not-assessed
        gaps:
          - Reproduction, development, lifespan and other life-history traits have not been assessed.
      ecology:
        status: partially-supported
        claims:
          - text: At Mt. Bontoc, five tarsiers were opportunistically observed in August 2021 and six were recorded during January–February 2022 (two direct sightings and four camera-trap records); the authors could not confirm that the records represented distinct individuals, and they stated that population viability was unknown.
            sourceIds:
              - torrefiel2023
            locator: Results, Tarsier sightings; Discussion, Tarsiers in Mt. Bontoc, Hindang
            placeTimeScope: Mt. Bontoc forest fragment, Hindang, Leyte, Philippines; opportunistic records in August 2021 and targeted camera trapping/field visits in January–February 2022 after Typhoon Rai (Odette) in December 2021.
            lifeStatus: Free-ranging tarsiers recorded by direct observation and camera traps; the number of unique individuals was not confirmed. No captive or domesticated individuals were included.
            originalLanguage: en
          - text: At five plots around confirmed tarsier sightings in Mt. Bontoc, researchers measured 612 stems; the samples had mean diameter at breast height of 2.5 cm and mean height of 5.0 m. The authors described the site as regenerating secondary forest over limestone.
            sourceIds:
              - torrefiel2023
            locator: Materials and methods, Tarsier Documentation and Habitat Survey; Results, Habitat Characteristics and Table 1
            placeTimeScope: Five 5-m-radius plots around sighting trees/saplings in Mt. Bontoc, Hindang, Leyte; vegetation was surveyed in the study period reported for 2021–2022.
            lifeStatus: Habitat measurements were made at locations where free-ranging tarsiers were confirmed; measurements do not represent all habitats used by the species.
            originalLanguage: en
        gaps:
          - This is a localized survey from one forest fragment; it does not establish species-wide habitat use or a complete geographic range.
          - The study did not estimate population size or viability, and the observed records may not represent distinct individuals.
          - Reproduction, morphology, evolution, fossil evidence and independent conservation assessments were not assessed in this batch.
      evolution:
        status: not-assessed
        gaps:
          - No phylogenetic or evolutionary evidence was assessed.
      distribution:
        status: not-assessed
        gaps:
          - A species-wide distribution inventory was not assessed; observations at Mt. Bontoc do not define the species range.
      fossil:
        status: not-assessed
        gaps:
          - No fossil evidence or geological age was assessed.
      conservation:
        status: not-assessed
        gaps:
          - No threat status, trend or range-wide conservation assessment was assessed.
