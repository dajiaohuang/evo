        usage:
          title: Hybanthus thiemei (Donn.Sm.) C.V.Morton, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Herb, perennial, usually erect, up to 18 cm high, simple or sparsely branched, the stems puberulous, the hairs simple and curved upwards. Leaves alternate, the petioles slender, up to 6 mm long (up to 3 cm long in collections from Honduras), densely puberulous with the hairs curved upwards, the stipules subulate, ca 2 mm long, puberulous, persistent, blade ovate, attenuate-cuneate at the base, obtuse at the apex, serrulate-crenulate at the margins, up to 4.7 cm long and 2.3 cm wide, membranous, sparsely pilose especially on the lower surface, the hairs ? straight but curved upwards along the midvein. Flowers axillary, solitary, the pedicels filiform, elongated, articulate close to the apex, up to 3 cm long, puberulous with the hairs curved upwards; sepals ovate or triangular-ovate, acute, 3-4 mm long and 1-1.8 mm wide, puberulous outside; petals white; anterior petal up to 11 mm long, the claw gibbous-saccate, the blade broadly elliptic-ovate, rounded at the apex, ca 6 mm long and 5 mm wide, minutely puberulous along the veins; lateral petals oblique-oblong, ca 4.5 mm long and 1.5 mm wide; posterior petals oblong- obovate, ca 2.5 mm long and 1 mm wide; filaments ca 0.5 mm long, united into a low ring, the 2 anterior ones calcarate dorsally, the spur curved and ca 0.5 mm long; anthers ca 1 mm long, the 2 anterior ones dorsally pilose, the connective appendages broad, rounded at the apex and ca 0.5 mm long; ovary globose, ca 1 mm long, glabrous, the style ca 1.5 mm long, thickened toward the unciform apex. Capsule ellipsoid, mucronate, ca 4 mm long, glabrous, the seeds pyriform, ca 1.5 mm long, the testa minutely alveolate.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 13927
