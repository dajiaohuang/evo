    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plant robust up to 70 cm tall. Leaves petiolate. petiole up to 30 cm long; blades thickish textured up to 30 cm long, up to 20 cm broad, ovate-cordate to ovate-orbicular-cordate with apiculate apex, immaculate. Spathes vary in size up to 15 cm long. 12 cm broad, ivory to cream coloured with purple area at base inside. Berries medium sized about 1 cm diam., numerous, 3 locular, 2 to 3-ovuled. It flowers from October to March with the peak in November.
