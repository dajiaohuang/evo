    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants shortly stoloniferous, forming tight tufts ±50 mm in diameter, with 4-7 aerial groups of leaves. Roots yellow, originating from around base of growing point, up to 150 mm long, ±5 mm wide, tapering towards tips. Leaves 3-6 at each growing point, in general upright, 470-630 x 4-7 mm, gradually tapering to a point at apex, channelled above and keeled below, V-shaped in cross section at midway, with angles of V greater than 90°, soft, green to glaucous green, margins with fine bead-like outgrowths in upper third, smooth on lower part and on keel; up to 4 dried leaves present at each growing point; basal leaf remains sometimes present as filiform fibres up to 60 mm long. Scape upright, usually overtopping or subequal to leaves, 450-600 x 3-5 mm, pinkish or brownish green with usually a single, sterile bract below inflorescence and a coma of white bracts at apex. Inflorescence ovoid to rhomboid at mid-flowering stage, 45-50 x 38-46 mm; buds bases and lower half yellowish green, whitish green, green, greenish orange, reddish brown, yellowish brown, pinkish brown, pinkish white, pinkish purple or greenish brown; upper half in general white, in very young stage buds directed upwards, with maturity directed almost at right angles to axis and finally directed to base during pre-anthesis, anthesis and post anthesis periods, mature flowers white. Bracts ovate, somewhat boat-shaped, 5.0-6.5 x 3.5-4.5 mm, white, translucent, with central brown nerve terminating about one-third before apex, each margin with 3 or 4 large teeth with acute apices, apex acute or slightly obtuse. Pedicels 2.0-2.5 x ±0.5 mm, increasing up to 3.5-4.0 x 1.0-1.5 mm at fruiting. Perianth funnel-shaped, slightly curved, 20-23 mm long, ±2 mm wide from base to ± midway, then broadening to ±7 mm at mouth; lobes spreading almost at right angles to tube, ±3 x 3.5 mm, outer lobe tapering gradually to obtuse apex, inner lobe with apex rounded or emarginate. Stamens of two lengths, longer series opposite inner perianth lobes, exserted by 7.5-10.0 mm, shorter series opposite outer perianth lobes, exserted by 3.5-5.0 mm; filament ±0.35 mm diam.; anthers ±1.5 x 0.7 mm; in senescent flowers all filaments withdrawn with anthers located at mouth of perianth tube. Ovary ovoid, 2.5-3.0 x 1.5-2.0 mm; style 27-32 x 0.4 mm at stigma receptivity exserted by 8-10 mm, tapering very gradually toward apex; stigma small, papillate. Capsule broadly ovoid, 6-7 x 5-6 mm, directed upwards, dehiscence loculicidal; seeds 4-7 per capsule, brownish black, deltoid, margin rarely with narrow wing.
