    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Much-branched, fairly dense and rounded, erect or ascending, dwarf shrub or shrublet, 2-6 dm high, glabrous except for leaf-axils; young branches leafy towards the tips, lower down clothed with imbricated leaf-bases, eventually quite denuded and marked with leaf-scars; cortex grey-black. Leaves closely set, erecto-patent-spreading or sometimes reflexed before withering, linear, 5-20 mm long, 0.6-1.5 mm wide, entire or (2-)3(-4)-lobed from or above the middle, distinctly tapering below the middle to a subfiliform, semiterete portion above the base, otherwise flattened, coriaceous, bright or pure green, distinctly midveined with a ± prominent rib, obtuse, bluntly apiculate; leaf-base dilated, half-clasping, thickish and keeled in the middle, membranous towards the margins, cobwebby in the axil, glabrescent, after withering persistent (at least for one season) as a triangular, acute-acuminate scale. Capitula terminal, solitary, sessile or nearly so (peduncle rarely up to 5 mm long). Involucre a narrowly campanulate or almost cylindrical cup, 5-9 mm high, 3-6 mm wide, leathery, distinctly veined. Involucral bracts 8-12, uniseriate, connate to 2/3-4/5, distinctly (1-)3-5(-6)-veined; the free lobes deltoid-narrowly triangular-ovate, (1-)1.5-3 mm long, (0.6-)1-2 mm wide, acute or subacute, puberulous-tipped. Receptacle somewhat convex, distinctly alveolate. Ray-florets 6-10, yellow. Tube 2-4 mm long, subcylindrical, somewhat flattened. Lamina (narrowly) elliptic-oblong-oblong-oblanceo-late, 7-12 mm long, 2.5-4 mm wide, 4(-6)-veined. Style ± flattened; style branches 0.7-1.2 mm long, obtuse. Disc-florets c. 8-15. Corolla 4.5-6 mm long. Tube 2-3 mm long, narrowly cylindrical. Limb campanulate, 2.5-3 mm long; lobes narrowly ovate-lanceolate, 1-1.5 mm long, with subcucullate and minutely papillate tips. Anthers c. 2 mm long inch the narrowly oblong-ovate, acute appendage. Style terete or flattened with somewhat swollen base; stylophore short and often indistinct; style branches 0.5-0.8 mm long, with slightly convex tips. Pappus bristles numerous-copious, 1.5-2 mm long, white, ± erect, some sometimes shorter and reflexed. Achenes (narrowly) oblong-obovate, 3-4 mm long, 1-1.7 mm wide, often somewhat compressed or subtrigonous, glabrous, shiny brown or yellowish brown, with 7-10 low ribs.
