        claims:
          - text: There is no pubescence, no appendage to the stamen filaments and the flower scape is round or very nearly so. This species is immediately identified by the very short flower segments, up to 2 cm, which are narrow, only about 2 mm and very, very crisped for their entire length. The scape runs from 30 cm up to 45 cm in length. The leaves, like those of N. alta are deeply channelled and very pointed.
