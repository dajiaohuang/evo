        usage:
          title: Cissus microcarpa Vahl, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Vine, usually woody, the stems terete, sulcate, unwinged, lenticels sparse and inconspicuous, glabrous except for occasional appressed pilose hairs on the younger stems, the nodes swollen; stipules broadly ovate to subrotund, subpersistent, 3-4 mm long, the apex acute to obtuse, glabrescent. Leaves 3-foliolate, the petiole 1.5-6 cm long, striate, glabrous or occasionally appressed-pilose on the juvenile forms, the lateral veins conspicuous beneath, chartaceous to subcoriaceous, mucronate- serrate; terminal leaflet 3-10 cm long, 1.4-6 cm broad, broadly elliptic, elliptic, ovate-elliptic, cuneate at the base, petiolule 0.5-2 cm long, acuminate at the apex, mucronate, the lateral veins 5-6 pairs; lateral leaflets 3-8 cm long, 0.6-5 cm broad, obliquely elliptic or ovate to rhombic, obliquely rounded at the base, acute to shortly acuminate at the apex, mucronate, the lateral veins 3-5 pairs. Inflorescences cymose-umbellate and appearing corymbiform, the peduncles 0.6-1.8 cm long, glabrous or with a few scattered hairs. Flowers appearing red or reddish-orange, the pedicel 1-4 mm long, glabrous to sparsely pilose; calyx cupular, the lobes indiscernible; corolla ca 1 mm long, the lobes ovate to ovate-triangular, acute at the apex, pistil 1-1.5 mm long. Berries green, turbinate to spherical (?), ca 6-8 mm in diam, usually 1-seeded, the seeds pyriform, 4-6 mm long.
          originalLanguage: en
          sourceField: general
