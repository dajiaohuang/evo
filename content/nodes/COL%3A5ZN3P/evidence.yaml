        claims:
          - text: At Kalinzu Forest, the study followed one habituated family group for 4,308 hours between November 2013 and April 2016. The observed group devoted 87.0% of feeding time to young leaves, 9.8% to fruits, and smaller proportions to flowers, bark, soil, and unspecified foods. In fine-grained analyses of selected leaf items, crude protein content, digestibility, and toughness were associated with dietary choices; the evaluated factors did not explain whether specific leaf items were consumed at the broader eaten-versus-not-eaten level. These findings are limited to this group, site, methods, and study period.
