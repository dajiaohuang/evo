    facets:
      morphology:
        status: partially-supported
        claims:
          - text: A twiner or sometimes a rambling shrub, usually monoecious; stems rugose with circular whitish lenticels. Leaf-lamina 5-14 x 4-11 cm, ovate, broadly-ovate or subcircular, rounded or subacute and mucronulate at the apex, margin doubly dentate with gland-like and hairy teeth, cordate or subcordate at base, hispid on both sides, basal nerves 5-7, palmate; petiole 2.5-5 cm long. Male flowers* numerous, subsessile in supra-axillary rather loose spikes up to 16 cm long with peduncles up to 3 cm long; rhachis bracteolate. Female flowers (rarely bisexual) solitary near the leaf-axil*, with pedicels 1-2 mm long or subsessile. Mature fruits not seen. *In some specimens the 1-2 lower flowers (bisexual or female?) of the “male” inflorescence may develop fruits (only seen immature).
            sourceIds:
