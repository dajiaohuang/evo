    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Stemless grass aloe 150-300 mm tall, solitary, with leaf bases forming a bulbous swelling; roots fleshy. Leaves 15-30 cm a rosette, 100-200 x 3-5 mm, dark green, canaliculate, lower surface with pale spots near base, margins cartilaginous, minutely dentate. Inflorescence a simple, very dense raceme; peduncle ±150 mm tall, with few sterile bracts; bracts deltoid-cirrhous, 12-20 x 3-6 mm, 5-nerved. Flowers sessile, grass-green, unscented, 10-15 mm long, throat slightly narrowed, mouth irregular; segments with white margins, free to base. Anthers exserted up to 1 mm. Ovary ±3.0 x 1.5 mm, bright green; style not exserted. Fruit ochre-brown. Seeds tetrahedral, black.
