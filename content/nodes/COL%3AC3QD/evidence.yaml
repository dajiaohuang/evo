          - text: The form of the bulbous swelling at the leaf bases suggests that this plant is intermediate between A. albida and A. myriacantha on the one hand, and A. kniphofioides and A. modesta, on the other. Differences between this species and A. knip-hofioides and A. modesta are discussed under A. kniphofioides. Differences between A. inconspicua and the species most similar to it, A. albida, are discussed under that species.
