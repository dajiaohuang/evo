      ecology:
        status: partially-supported
        claims:
          - text: A. inconspicua inhabits an area of dry, low-altitude, thorny, open woodland which is hot in summer, but can become very cold in winter. The plants are extremely well-camouflaged at all phases of their life cycle by the green colour of both leaves and flowers, and the fact that they are rarely if ever as tall as the grasses on the woodland floor. A. inconspicua grows in a yellow, clayey soil which is almost as hard as concrete when dry.
            textZh: 该 SANBI 区域物种条目记录的生境：A. inconspicua inhabits an area of dry, low-altitude, thorny, open woodland which is hot in summer, but can become very cold in winter. The plants are extremely well-camouflaged at all phases of their life cycle by the green colour of both leaves and flowers, and the fact that they are rarely if ever as tall as the grasses on the woodland floor. A. inconspicua grows in a yellow, clayey soil which is almost as hard as concrete when dry.
