    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Mat-forming perennial, rhizomatous (rhizome long, creeping and profusely branched), up to 450 mm tall. Leaf blades 10-30 mm long, 2-3 mm wide, margins not ciliate. Spikelets 1.5-2.0 mm long. Panicle whorled; lower glume a third the spikelet length; upper glume as long as spikelet.
            textZh: Sporobolus ludwigii Hochst. 的 SANBI 物种条目记录了形态特征。
