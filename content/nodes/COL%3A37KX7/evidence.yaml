        status: partially-supported
        claims:
          - text: Caules ad 60 cm alti, glabri, divaricatim ramosi ramis patentibus; caudex ad 15 mm diam., horizontaliter paulosnfe-terrae superficie dispositus, fusco-brunneus, basibus caulium delapsorum asper. Folia pro parte maxima radicalia, petiolis ad 150 mm longis suffulta; lamina peltata, ambitu orbicularis, c. 70-140 mm diam., ad 2-4 mm e basi in segmenta 7 divisa, segmentis iterum fere ad costam pinnatim dissecta pinnis ambitu anguste oblongis marginibus grosse et irregulariter et acute dentatis; costae et nervae supra pilis crassis minimis indutae, subtus glabrae. Umbellae pedunculis 15-55 mm longis suffultae; bracteae c. 5, usque ad 5 mm longae, lineari-lanceolatae, acuminatae, ad basin liberae; umbella terminalis hermaphrodita, anthesi 70-110 mm diam., laterales plerumque masculinae minores. Umbellulae plerumque 5-7, in umbella terminali saepe floribus solitariis etiam adsentibus, obconicae, c.l5 mm diam.; bracteolae 3-5, ad 3 mm longae, lineari-lanceolatae, ad basin liberae vel partim connatae; pedicelli 6-10 mm longae. Calyx lobis minus quam 0.25 mm longis, deltoideis. Petala c. 1.25 mm longa, cremea, parte inferiore late elliptica, apice acuminato inflexo libero. Stamina 5, filamentis c. 2 mm longis. Ovarium c. 1 x 1 mm, campanulatum. Stylopodium conicum; styli c. 0-5 mm, angulo semirecto divergentes. Mericarpia c. 3 x 1-5 mm.
