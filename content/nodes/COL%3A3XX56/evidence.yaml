      morphology:
        status: partially-supported
        claims:
          - text: Glandular-hairy annual to 30 cm. Leaves coarsely toothed. Flowers in racemes, bilabiate, tube short and inflated above, lobes very narrow, ochre to brown.
            sourceIds:
              - sanbi_14436_0
            locator: "SANBI/WFO archive Morphology row 6037; source 14436.0; publication: Manning, JC; Goldblatt, P. 2012. Scrophulariaceae: Manulea L. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 745 - 747. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: "Manulea cheiranthus is very variable in aspect; not only do single-stemmed seedlings a few centimetres tall look very different from robust well branched plants, but there is also considerable variation in the inflorescence (which ranges from simple racemes to lax or very congested thyrses), and in the size of the corolla limb, this dictated by the shape of the corolla lobes, which may be subulate or acute. But the species is easily recognized by certain salient features: hairs at base of stem gland-tipped, up to 0.3-0.4 mm long, soon replaced upwards by balloon-tipped hairs with an extraordinarily large apical cell (c. 0.1 mm in diameter or even larger, and present also on pedicels, calyx, and outside of corolla); leaves very coarsely toothed, straggling upwards and passing into leaf-like bracts in all but the smallest plants; corolla lobes subulate to acute, shades of yellow, orange and reddish-brown; posticous filaments bearded."
