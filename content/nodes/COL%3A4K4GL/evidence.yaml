    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Herb or soft shrub up to 1.5 m tall, erect, branched; roots tuberous; stems ascending, shortly and densely pubescent. Leaves petiolate; blade ovate-orbicular, 50-100 x 50-90 mm, densely tomentose, under-surface reticulate-veined with whitish gland-dots, apex obtuse, base cordate, margin crenate-dentate; petiole 40-70 mm long. Inflorescence usually with 1 or 2 pairs of branches near the base, racemes up to 200 mm long; flowers in sessile 3-5-flowered cymes forming 6-10-flowered verticils 10-25 mm apart. Calyx 6-7 mm long in fruiting stage, purple-tinged, glandular-hispid. Corolla mauve, not speckled, villous and dotted with white gland-dots on the back, 10-12 mm long; tube deflexed, expanding and spurred near the base, narrowing slightly towards the throat; upper lip 5-6 mm long; lower lip boat-shaped, 5-7 mm long, later deflexed. Stamens free, 2-3 mm long.
            sourceIds:
              - sanbi_15375_0
            locator: "SANBI/WFO archive Morphology row 45134; source 15375.0; publication: Codd, LEW. 1985. Lamiaceae: 23. Plectranthus. In: OA Leistner (ed.), Fl. S. Africa 28(4): 137 - 172. Botanical Research Institute, Department of Agriculture and Water Supply, Pretoria. [http://www.biodiversitylibrary.org/item/209555#page/9/mode/1up]. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: The species was first collected by Mr H. B. Nicholson in 1971 and 1972. The corolla resembles that of P. fruticosus in colour but lacks the purple spots on the upper lip. From P. fruticosus and P. graliatus it differs in the villous, gland-dotted corolla and the cordate-based leaves, distinctly tomentose on the under-surface with colourless gland-dots.
            textZh: SANBI 条目提供了该种的鉴别特征。
