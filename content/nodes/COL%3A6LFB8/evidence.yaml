    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Rosette to 60 mm diameter, caulescent, proliferating. Leaves many, arrangement occasionally trifarious, usually five-farious, to 50 x 18 mm, spreading, smooth, rigid, sharp-pointed, green in shade, darkening and reddening in sunlight. Inflorescence simple, to 300 mm. Flowers tepals fused, tube straight, inner lower tepals revolute.
            textZh: Haworthiopsis pungens (M.B.Bayer) Boatwr. & J.C.Manning 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_10811_0
            locator: "SANBI/WFO archive Morphology row 64969; source identifier 10811.0; cited publication: Bayer, MB. 1999. Haworthia revisited: a revision of the genus. Umdaus Press, Hatfield. [All rights reserved]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: The plants form clusters of stems which are less upright than for H. viscosa, up to 0.5 m in diameter. The lower leaves are mostly dead and the plants partly covered by the eroding conglomerate. The colouration is striking although from a distance the plants show up as conspicuous black bushes on the bare hot rocky slope. H. pungens cannot be confused with H. viscosa at all as the leaves are much more rigid and entirely smooth.
            textZh: SANBI 条目提供了 Haworthiopsis pungens (M.B.Bayer) Boatwr. & J.C.Manning 的鉴别特征。
