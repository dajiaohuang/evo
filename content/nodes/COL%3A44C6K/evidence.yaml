    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants ± 50-150 mm high. Corm ± globose, 7-10 mm diam.; tunics of pale brown, netted fibres. Stem consisting of 2 aerial internodes, simple or 1-branched from aerial node, solitary sheathing leaf green with dry, brown apices, 9-15 mm long, sometimes reaching almost to base of inflorescence, with cataphylls forming collar around base. Foliage leaves 2, subequal, inserted at base, suberect, exceeding stem, blades narrow, apparently terete with narrow adaxial groove, ± 1 mm diam. when opened flat, distal half of blade loosely coiled to almost straight in shade. Rhipidial spathes green with dry brown, acute tips, inner 16-25 mm long, outer entirely sheathing, ± half as long. Flowers long-lived, largely white, speckled outside with brown spots, outer tepal limbs spreading, with large yellow nectar guide at bases and brown inner tepals, with light, fruity scent; tepals unequal, outer ± 16-18 mm long, limb ± broadly obovate-orbicular, 10 x 10 mm, claws suberect, ± 7 mm long, inner 8-9 mm long, limbs much reduced, ± 4 mm long, ± deltoid to obscurely 3-lobed with longer central lobe curving inward. Filaments ± 4.5 mm long, united in lower 3 mm in a cylindric column enclosing style, free and diverging above; anthers ± 3 mm long, pale mauve; pollen white. Ovary ellipsoid, ± 5 mm long; style branches 4.5-5.0 mm long, suberect, crests erect, ± 5 mm long. Capsules ± ellipsoid, 7-8 x 5 mm. Seeds unknown.
            textZh: Moraea helicoidea Goldblatt & J.C.Manning 的 SANBI 物种条目记载了植株、叶片和花部形态。
            sourceIds:
              - sanbi_18638_0
            locator: Strelitzia 42; archive Morphology row 84368, source 18638.0
            placeTimeScope: Regional species account published 2020; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
          - text: Immediately distinguished in subg. Vieusseuxia by the presence of two subequal foliage leaves inserted near the base and loosely coiled in corkscrew fashion. More than one foliage leaf is rare in the subgenus and consistent only in M. fergusoniae, which has three to six foliage leaves, the blades channelled, shorter than the stem and 3-10 mm wide, slightly twisted and with undulate, minutely ciliate margins. Moraea tripetala subsp. violacea sometimes has two foliage leaves but very different flowers with inner tepals represented by minute cusps. Flowers of M. helicoidea are predominantly white with outer tepals bearing large, deep yellow nectar guides at the limb bases and with small dark spots on the reverse. The brown inner tepals have reduced, 3-lobed limbs, common in the subgenus, and are comparable in shape to those of M. fergusoniae which has either pale blue or white flowers. Branching in M. fergusoniae is usually basal whereas branches in M. helicoidea, when present, are cauline, borne at the first aerial node.
