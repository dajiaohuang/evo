        claims:
          - text: Similar to O. capensis but leaves broadly lanceolate to ovate.
            sourceIds:
              - sanbi_14184_0
            locator: "SANBI/WFO archive Morphology row 10740; source 14184.0; publication: Manning, JC; Goldblatt, P. 2012. Asteraceae: Oedera L. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 399 - 400. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Flower head composed of individual capitula in secondary arrangement, up to 37 mm diam. Midrib of leaves and bracts prominent Margins of leafy involucral bracts with regularly spaced stiff hairs, usually also on the leaves Bracts mostly lanceolate (narrow or broad) with a distinct 'petiole' Can be mistaken for O. capensis, which has longer, spreading leaves with minutely toothed margins and sprouts after fire. Often growing on the same slopes as O. capensis, but usually associated with rocky outcrops, has broader more rounded leaves but an identical flower structure. Ray florets of O. imbricata are more yellow than those of O. capensis in fresh specimens.
