            locator: "SANBI/WFO archive Morphology row 34223; source 14754.0; publication: Manning, JC. 2013. Asteraceae: Euryops. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 288 - 290. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: E. namibensis is closely allied to E. subcarnosus, differing by the more flattened and fleshy leaves with broader lobes, and the presence of at least some pinnately lobed leaves. Furthermore, the leaf tips are more obtuse and less distinctly apiculate, and the cortex of the stout main branches is ash-grey and sulcate. Further details, like differences in epidermis cells, are discussed in Nordenstam 1966, but it should be pointed out, that the characters listed for subcarnosus hold true mainly for the S. W. African material of ssp. vulgaris. When in full flower E. namibensis is a quite conspicuous plant with a multitude of bright yellow flowerheads. In some localities it grows together with E. subcarnosus ssp. vulgaris but without intermediates.
