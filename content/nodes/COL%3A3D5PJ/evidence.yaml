    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Shrub, up to 1 m tall, woolly in leaf axils. Leaves crowded at branch tips and on short-shoots, linear-oblanceolate and mostly trifid or pinnatifid, 5-25 mm long. Flowerheads numerous, solitary in upper axils on peduncles 20-60(-100) mm long, radiate, yellow; involucre hemispherical, 7-12 mm diam., bracts 7-14, connate at base only. Cypselas densely hairy.
            sourceIds:
