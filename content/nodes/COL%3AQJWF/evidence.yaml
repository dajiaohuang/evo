          title: Canavalia oxyphylla Standl. & L.O.Williams, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Vine twining on shrubs and high climbing; stems glabrate. Leaves pinnate trifoliolate, leaflets mostly 10-12 cm long, 5-7 cm wide, ovate, apically acumi- nate, chartaceous, sparingly pubescent on both sides; petiolules 4-6 mm long. Inflorescences axillary, mostly 10-18 cm long; bracteoles obtuse or deltoid, 1- 1.5 mm long; pedicels 1-1.5 mm long. Flowers white, pink or lavender; calyx 10- 14 mm long, often drying mottled, tubular campanulate, the upper lip short, forming a distinct umbo, the lower teeth membranaceous, the lowest acute, 1.75- 2 mm long, exceeding the obtuse lateral teeth; standard ca. 4 cm long. Legume oblong, the apical beak short, the basal stipe terete, stout, 1.5-2 cm long, woody, glabrescent, each valve with sutural ridges and 1 additional ridge situated more than 7 mm from the suture and hence often appearing medial on the valve; seeds compressed ovoid, ca. 17 mm long, tan colored, the hilum forming half the cir- cumference.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 4772
