        usage:
          title: Stylosanthes viscosa (L.) Sw., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Herbs, stems ascending and spreading or prostrate and matted, much branched, to 1 m long, densely pubescent with viscid trichomes. Leaflets lan- ceolate to elliptic, to 15 mm long, 4 mm wide, acute to obtuse, the abaxial surface punctate, reddish, hispidulous, 2-4 pairs of conspicuous nerves; petioles 2.5-5.0 mm long, hispidulous, viscid, the rachis 1-2 mm long; stipular sheath 3.5-5.5 mm long, 3-5 nerved, the teeth subulate, hispidulous, viscid. Inflorescence spicate, 2-5 flowered; outer bracts usually trifoliolate, the inner bracts unifoliolate, the sheath equaling or slightly exceeding the teeth, hispidulous, viscid, 5-7 nerved; outer bracteole 1, 2.5-3.0 mm long, the apex ciliate; axis rudiment none; inner bracteole 1, 2.5-3.0 mm long, the apex ciliate. Flowers yellow, calyx tube 3-7 mm long, glabrous to puberulent; standard suborbiculate, 4-7 mm long, the wings 4-5 mm long, auriculate, spurred within at the base, the keel petals 3-4 mm long, falcate. Fruit a loment, 2-4 mm long, ca. 2 mm wide, the distal articulation fertile, reticulate nerved, puberulent, beak ca. 1.5 mm long, strongly uncinate to coiled.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 4676
