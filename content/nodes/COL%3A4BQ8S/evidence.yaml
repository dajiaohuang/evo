    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Perennial herb, 220-500 mm tall. Leaf margins flat. Corolla lobes reflexed, spreading. Corona lobes with a pair of prominent keels at base, always as broad as or broader than high, apex of corona lobes prolonged into linear appendage-like point. Flowers light green or greenish white, outer surface often lightly spotted with dull purple-brown flecks; corona light dull green.
            sourceIds:
              - sanbi_11118_0
            locator: "SANBI/WFO archive Morphology row 2920; source 11118.0; publication: Herman, PPJ; Retief, E. 1997. Plants of the northern provinces of South Africa: Keys and diagnostic characters. Strelitzia 6: 1 - 681. National Botanical Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Pachycarpus appendiculatus is closely allied to P. reflectens, which occurs in Transkei and the eastern Cape. In Natal, Swaziland and the eastern Transvaal this species is easily distinguished from P. reflectens by its ovate, elliptic or oblong leaves (not linear-lanceolate to lanceolate or narrowly ovate), reflexed-spreading corolla lobes (not reflexed straight back), the lanceolate, elliptic or suborbicular coronal blade, usually with an appendiculate apex (not orbicular, broadly ovate or broadly elliptic, the apex obtuse or obtusely apiculate, or sharply cuspidate with a linear obtuse apex) and by the coronal keels which are always as broad as, or broader than they are high (not always higher than broad). However, difficulty may arise where the two species are sympatric; then the leaves of certain specimens of P. appendiculatus are lanceolate or narrowly ovate like those of P. reflectens.
            textZh: SANBI 条目提供了该种的鉴别特征。
