          originalSourceText: velutinous to tomentose with long stalked stellae, appearing ochraceous when dry; petiole 1-6 cm long. Inflorescence several- to many-flowered, the peduncle velutinous, branched near the base or higher up, the racemes to 5 cm long with a conspicuous cicatrix from fallen flowers; pedicels 8-10 mm long, tightly pubescent with porrect stellae which have small but erect and conspicuous mid- points, elongating to 1.5-2 cm long and becoming apically stout in fruit. Flowers small; calyx 3-4 mm long, subtruncate, the lobes appearing as small umbos, splitting on corolla egress to near the base; corolla white, 10-12 mm across, lobed % the way down; anthers 3 mm long, stout but tapering at the tip, opening by medium size pores; style pubescent near the base. Fruit globose, 10-15 cm across, often drying very wrinkled.
