    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Bulbous geophyte to 30 cm. Leaves 1-5, usually dry at flowering, linear. Flowers 1-4, suberect, narrowly funnel-shaped, somewhat bilabiate, cream-coloured, with pale apricot or pink on tube and keels of segments, stamens well-exserted, with filaments apricot-coloured and decurrent into throat.
            textZh: Cyrtanthus leptosiphon Snijman 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13845_0
            locator: "SANBI/WFO archive Morphology row 8810; source identifier 13845.0; cited publication: Snijman, DA. 2012. Amaryllidaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 53 - 62. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Cyrtanthus leptosiphon is similar to two other Cape species, C. leucanthus Schltr. and C. ochroleucus (Herb.) Burch. ex Steud. (sensu Dyer and Reid & Dyer, non Batten & Bokelmann). All three species have narrow (less than 5 mm wide), hysteranthous leaves and long (50-93 mm), narrow-tubed, cream-coloured or yellowish flowers (sometimes flushed with pink), in which the tepals are longer than 7.5 mm and slightly spreading. Within this group C. leptosiphon is easily distinguished by its short pedicels (3-5 mm long) and weakly bilabiate flowers. Furthermore, the tepals are prominently ribbed with 3-5 veins and the style is minutely 3-lobed. In contrast, C. leucanthus, an endemic of the coastal fynbos between Rooiels and the Potberg, has sweet-smelling, cream-coloured flowers in which the tepals are broad (7-13 mm), many-nerved (7 or more), and regularly overlapping. C. ochroleucus, a more easterly species, found in neutral sands in the Langeberg and the coastal forelands near Albertinia, has dull-smelling, brownish or greenish yellow flowers with narrow (3-5 mm) tepals, each with 3-5 veins. Unlike the tepal veins of C. leptosiphon and C. ochroleucus, those of C. leucanthus curve outwards to the tepal margins.
            textZh: SANBI 条目提供了 Cyrtanthus leptosiphon Snijman 的鉴别特征。
