        usage:
          title: Jatropha curcas L., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrub or small tree ca (1-) 2-5 m high; branches and mature foliage glabrous. Leaves with petioles (3-)9-15 cm long; stipules nearly obsolete, not evident on mature leaves; blades ovate, unlobed or coarsely (3-)5-7-lobed (lobes extending less than halfway to midrib), palmatinerved with mostly 7 nerves and deeply or broadly cordate at base, mostly 10-25 cm long, 9-15 cm broad, sparsely puberulent when young but soon glabrescent. Dichasia terminal on branches, bisexual or often unisexual; axes tomentulose, glabrescent, becoming ca 10-25 cm long; peduncles mostly 4-10 cm long; lower bracts narrowly lanceolate, 2-15 mm long, entire (not glandular). Staminate flowers with puberulent pedicels, ca 1-5 mm long, articu- lated below the flowers; calyx-lobes 5, elliptic, blunt, entire (not glandular), scarcely imbricate, ca 2.8-3.5 mm long; petals obovate, greenish or yellowish-white, adaxially hirsute, ca 5-6 mm long; disc-segments 5, ellipsoid, erect, massive, ca 1 mm high; stamens (8-) 10, the filaments 2.2-3.7 mm long, connate below the middle, the anthers elliptic, 1-1.6 mm long; pistillode absent. Pistillate flowers with pedicels 5-9 mm long, up to 10-13 mm long in fruit, glabrous; calyx-lobes 5, oblong to lanceolate, foliaceous, obtuse or subacute at tip, entire, becoming ca 7-9 mm long; petals similar to the staminate; ovary glabrous, the styles slender, ca 1.5 mm long, connate in lower half, dilated into massive stigmata. Capsules ellipsoidal, ca 3 cm long and 2 cm broad, more or less fleshy, at length drying and dehiscent; seeds blackish, encrustate-striate, 15-22 mm long, distinctly beaked beyond the hilum, the caruncle appressed to the beak, not massive, deeply lobed, ca 2 mm long and 3.5 mm broad.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 4288
