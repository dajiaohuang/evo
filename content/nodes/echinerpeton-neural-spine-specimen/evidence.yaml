  claims:
    - subjectId: event:echinerpeton-neural-spine-specimen
      claimKind: scientific
      claimType: morphology
      statement: Referred specimen ROM VP 83326 documents a hyper-elongated neural spine in Echinerpeton intermedium from the Sydney Mines Formation, but incomplete preservation does not resolve the animal's full outline, spine ratio or sail function.
      confidence: medium
      confidenceRationale: The bone is described, figured and compared directly with paratype RM 10057 and the type series. Medium confidence preserves uncertainty in referral, incompleteness, reconstructed proportions and untested biological function.
      referenceLinks:
        - referenceId: mann-reisz-2020-echinerpeton-spine
          relation: supports
          figure: Figure 1
          quoteLocator: Materials and Methods; Locality and Horizon; Comparative Anatomy; Discussion
  claim-rationales.zh:
    - 论文描述并图示了该骨骼，也将其与副模标本 RM 10057 及模式系列直接比较。中等置信度保留归入鉴定、保存不完整、比例复原和未经检验的生物学功能等不确定性。
  claim-statements.zh:
    - 归入标本 ROM VP 83326 记录了悉尼矿组 Echinerpeton intermedium 的超长神经棘，但保存不完整，不能确定动物整体轮廓、神经棘比例或帆状结构功能。
