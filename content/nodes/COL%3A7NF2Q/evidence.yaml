          locator: "Nature 453:1064–1071 (2008), published article: Genome sequence; Results sections “Intron evolution,” “Amphioxus–vertebrate synteny,” and “Timing of events on the vertebrate stem”; Methods Summary: deuterostome relationships and intron evolution."
