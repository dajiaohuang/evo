    limitations:
      en: These studies do not represent every cephalochordate species or establish clade-wide habitat, distribution, or life history. The 2007 expression study does not name its amphioxus species in the Methods passage read. The 17 linkage groups and vertebrate duplication history are comparative reconstructions, not direct ancestral samples.
      zh: 这些研究不代表所有头索动物物种，也不能确定整个类群的栖地、分布或生活史。所读 2007 年基因表达研究方法部分未注明文昌鱼物种。17 个连锁群与脊椎动物复制历史是比较重建，并非直接取得的祖先样本。
