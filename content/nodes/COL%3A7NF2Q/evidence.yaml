          scope:
            en: Amphioxus embryos and larvae from a 12-hour early neurula through a 2.5-day feeding larva with two to three gill slits; the species is not named in the Methods passage read.
            zh: 文昌鱼胚胎与幼体，范围从 12 小时早期神经胚到 2.5 日龄、具有两到三个鳃裂的摄食幼体；所读方法部分未注明物种。
          locator: "PLoS ONE 2(8):e787 (2007), published article: Results “Expression of amphioxus orthologs...” and “Expression of amphioxus fibrillar collagen...,” Figures 3–4; Discussion on co-option and limits of expression evidence; Methods, in situ hybridization and larval stage range."
          version: Published PLoS ONE article; selected Results, Figures 3–4, Discussion, and Methods passages read.
