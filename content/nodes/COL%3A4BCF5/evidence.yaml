        claims:
          - text: Shrub or small tree, (1)3-12 m high. Leaves large, up to 0.3 x 0.15 m, petiolate; domatia as hairy tufts in nerve axils. Stipules green, ovate, deciduous. Flowers in dense, axillary panicles. Calyx 5-lobed; lobes linear; tube campanulate. Corolla 5-lobed, white, glabrous; lobes narrowly elliptic, acuminate, contorted; tube long, narrowly cylindric, hairy within. Stamens 5, arising in corolla mouth, usually exserted; anthers linear, sessile, with curved apiculus. Disc annular. Style filiform, exserted; stigma fusiform. Flowering time Nov.-Feb. Fruit baccate, ellipsoid, many-seeded. Seeds somewhat compressed, striate.
            sourceIds:
