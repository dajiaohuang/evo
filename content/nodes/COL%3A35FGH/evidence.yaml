          title: Diastema racemiferum Benth., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Small herbs; stems erect, 2-25 cm tall, glabrous to sparsely covered with white hairs, the internodes often reddish. Leaves sometimes appearing crowded at the apex of the stem; blades lanceolate to ovate, elliptic, or oblong, membranous, trans- lucent when dry, 1.5-13.5 cm long, 0.9-6.4 cm wide, the apex obtuse or acute, the base sometimes oblique, rounded to acute, the margin various, crenate, den- tate, serrate to biserrate, above medium green, sparsely pilose to glabrescent, beneath lighter green to whitish, sparsely pubescent at least on the veins, to gla- brous; petioles 0.5-6.5 cm long, green or reddish, glabrate. Inflorescences nu- merous, one to an axil and terminal or only terminal, erect, racemose, 3-15 cm long; peduncles usually elongate but often equalling the petiole of the subtend- ing leaf, green or reddish, glabrate bracts and bracteoles clasping the pedicels, lanceolate or ovate, ca. 5 mm long and 2 mm wide; pedicels slender, usually shorter than the peduncles. Flowers several per inflorescence; floral tube shal- lowly funnelform at anthesis, ca. 1 mm long, ca. 2 mm wide, elongating in fruit, green, glabrescent; calyx lobes linear lanceolate, 2-4 mm long, rarely more, ca. 1 mm wide, acute, glabrate or sparsely strigose; corolla tube slender, 1.0-1.8 cm long, ca. 3 mm wide just above the base, broadening to ca. 6 mm wide below limb, white or yellow, especially near the base outside, inside yellowish, occa- sionally with a few purple spots near the limb, or lavender or pinkish with a white limb, nearly glabrous to sparsely pilose near the limb, the lobes rounded, 2-3 mm long; stamens 4, didynamous, included; disc glands 5, often equalling the ovary, linear clavate; ovary apex sparsely pilose to glabrescent, the style equalling the length of the stamens, glabrous or puberulent. Capsule obovoid, 2-valved; seeds rhomboid to fusiform, dark reddish brown, striate.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 6252
          archiveSourceId: 1B0C141E-682A-46BF-B87C-09E32FBF3479
          archiveSourceIds:
