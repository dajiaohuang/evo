  claims:
    - subjectId: event:dmanisi-skull-five-variation
      claimKind: scientific
      claimType: morphology
      statement: D4500 and D2600 form one approximately 1.8 Ma adult skull that expands observed Dmanisi craniofacial variation; it does not by itself collapse named early Homo taxa into one lineage.
      confidence: high
      confidenceRationale: High confidence applies to specimen association, anatomy and site context; the species-level interpretation of variation remains model- and comparison-dependent.
