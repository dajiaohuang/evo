          - text: Shrublet, with branched stem, up to 200 mm tall, covered with hard, glossy, pale yellowish or ivory, scale-like leaf bases (resembling a maize-cob). Leaves tufted, oblanceolate, narrowed to a petiole-like base, 35-90 x 4-15 mm, entire or irregularly toothed, leathery. Flowerheads on one or more, branched peduncles up to 200 mm long, radiate, yellow; involucre campanulate, ± 5 mm diam., bracts ± 8, ± 3 x 1 mm.
