    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, 15-30 cm, tunics soft. Leaves linear. Flowers dark pink, zygomorphic, with declinate stamens and style.
            textZh: Geissorhiza uliginosa Goldblatt & J.C.Manning 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 6830; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Distinguished by the branched stems, each branch bearing just a single flower, a small corm with soft corm tunics and plane, trailing leaves. The pink flowers are zygomorphic and have a short perianth tube 9-13 mm long and subequal tepals 20-22 mm long. The single-flowered branches and unilateral declinate stamens recall G. fourcadei, but this has a longer perianth tube, (8-)17-20 mm long, xeromorphic, terete, 4-grooved leaves and larger corms with persistent firm-papery corm tunics.
            textZh: SANBI 条目提供了 Geissorhiza uliginosa Goldblatt & J.C.Manning 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 94649; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
