        claims:
          - text: Much-branched, prostrate annual, stems 150-500 mm long, covered with stellate and simple hairs. Leaves alternate below, with upper ones in whorls, narrowly elliptic to ovate, ± fleshy, without stipules. Flowers 1 or 3-8 axillary cymes, sepals with acute mucronate tips, yellowish to whitish green on inside, inner 3 with membranous edges, stamens 10-20 or more.
