    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Dwarf shrubs, erect, up to 0.7 m tall by 1m diameter. Branches straight, articulated, cortex green and succulent. Internodes cylindrical, epidermal cells xeromorphic, in surface view brick-shaped in longitudinal rows, in cross-section epidermal cells barely distinguishable from the inner green cortex as a thin white layer. Leaves obtusely trigonous, free (not joined) with overlapping leaf bases when young, deciduous. Inflorescences in few-or many-flowered dichasia. Flowers 10-15 mm diam. Calyx 4-lobed, lobes shortly connate and erect during anthesis. Corolla petaloid staminodes ('petals') white, free, filamentous staminodes absent. Ovary semi-inferior, seeds numerous, axile placentation. Fruit 4 locules, 3-5 mm diam., valve wings inflexed over expanded valves, expanding keels connate in pairs, with seed bags. Seeds D-shaped, cream or light brown.
            sourceIds:
              - sanbi_3482_0
            locator: "SANBI/WFO archive Morphology row 104699; source 3482.0; publication: Pierce, SM; Gerbaulet, M. 1997. Brownanthus Schwantes (Mesembryanthemoideae, Aizoaceae): Two new species and a new combination from the Richtersveld and southwestern Namibia. Aloe 34(1-2): 42 - 44. [All rights reserved]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Brownanthus pseudoschlichtianus is similar to B. arenosus, with seed bags and 4-locular capsules (though B. arenosus mainly has 5). It differs in habit in having tangled branches while B. arenosus is a more erect, straight-branched shrub. Further-more, the stems of B. pseudoschlichtianus have internode surface cells which are brick-shaped (not isodiametric or equal-sided as in B. arenosus) and which in cross-section appear as a very thin white layer (not conspicuously thick). Further, the base of leaf pairs are connate or joined while in B. pseudoschlichtianus, the leaf bases are not connate, but overlap slightly.
