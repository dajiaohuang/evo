          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Trees to 30 m. tall. Twigs stout, glabrous, with a thick brown periderm. Stipules about 10 mm. long, deltoid. Lamina 4-7 cm. wide X 8-15 cm. long, oblanceolate or broadly obovate, glabrous; apex rounded or obtuse; base cuneate or broadly cuneate; lateral veins 8-12, departing from the midrib at an angle of 20?- 300; basal veins departing from the midrib at an angle of 500-600; intercostals not prominent. Petiole 10-20 mm. long, 1/8 the length of the lamina. Figs 8-10 mm. in diameter, globose, glabrous, borne among the leaves; color unknown; peduncle obsolete; basal bracts broadly rounded, deltoid, about as long as the receptacle.
