        usage:
          title: Melampodium paniculatum Gardner, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Annual herbs, 17-50 cm tall; stems erect, 1-3 mm diam., hispid and stipitate- glandular with hairs 0.1-1 mm long. Leaves ovate-rhombic (younger leaves approaching lanceolate), 1.4-5.5 cm long, 0.5-3.5 cm wide, acute to acuminate, the base attenuate, sometimes dilated almost to subauriculate, both surfaces strigose with hairs 0.3-1 mm long, the margin entire to irregularly serrate-crenate; sessile or with petioles to 5 mm long. Inflorescence of solitary heads; peduncles 1.4-4.2 cm long. Heads radiate, 2.2-4 mm tall, 3-5 mm across; outer involucre cupulate, 4-7.5 mm diam., the bracts 3, separate, ovate, 1.8-4 mm long, 1-3 mm wide, acute-acuminate, the abaxial surface strigose and stipitate-glandular with hairs 0.1-0.8 mm long, the margin herbaceous; paleas elliptical, 1.3 mm long, 0.7 mm wide, apically yellow-orange, the margin laciniate, the midrib weak, glabrous; ray florets 3-6, the ligules yellow, ovate, 1-2 mm long, 1-2 mm wide; disc florets 1O-15, the corollas yellow, 1.1 mm diam., the throat and tube each 0.8 mm long. Fruits 2-2.8 mm long, the sides with longitudinal ribs and striations. Chromosome numbers n= 18 and 27.
          originalLanguage: en
          sourceField: general
