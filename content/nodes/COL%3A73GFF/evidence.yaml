          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Small tree, up to 10 m. tall, the younger stems, petioles, lower leaf-surface, panicle, and hypanthia thinly stellate-tomentose; petioles about 1 cm. long; leaf- blades lanceolate, as much as 17 cm. long but usually much shorter, about two- fifths as wide, acuminate, remotely denticulate, more or less ciliate, acute at the base, 5-pli-nerved, glabrous above; panicles relatively few-flowered, 3-8 cm. long, divaricately branched; flowers 6-merous, sessile at the end of the branchlets; hypanthium broadly campanulate, about 3.5 mm. long (measured on the axis); calyx-tube flaring, about 2 mm. long, truncate or undulate, stellate within and without; exterior teeth minute, conic; petals white, about 10 mm. long, broadly obovate; stamens isomorphic; anthers oblong, blunt, 4-celled, 4.5-5 mm. long, opening by one minute terminal pore; connective simple; ovary 5-celled; style elongate; stigma capitate.
