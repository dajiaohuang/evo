        usage:
          title: Mollinedia costaricensis Donn.Sm., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Dioecious shrubs or small trees to 7 m. high, the branchlets pubescent with grayish hairs. Leaves pergameneous, appressed-strigillose, especially below, rarely glabrescent, narrowly to broadly ovate or obovate, apically obtuse to shortly acumi- nate, basally acute to rounded, 8-18 cm. long, 4-9 cm. broad, subentire or with up to 25 minute irregular teeth on either side, the secondary veins 5-11 on either side, arcuately anastomosing 3-8 mm. from the margin; petioles 5-16 mm. long, drying rufous, puberulent. Staminate inflorescences 1-6 in 3- to 5-flowered cymes in each axil, the bracteate peduncles and pedicels with yellowish puberulence; peduncles 1-20 mm. long, the pedicels 2-5 mm. long. Flowers campanulate, 6-8 mm. in diameter at anthesis; tepals 4, exteriorly with a yellowish puberulence, the inner 2 with an apical laciniate appendage; stamens 16-34, ca. 1 mm. long, the anthers hippocrepiform. Carpellate flowers mostly solitary or paired in the axils, the bracteate peduncles 5-20 mm. long, the bracteolate pedicels to as much as 6 cm. long; flowers turbinate, 2-4 mm. in diameter, the tepals ca. 2 mm. long, caducous, the numerous carpels ellipsoid, with a grayish or yellowish pubescence. Fruiting receptacles discoid, repand, densely strigillose on both surfaces, 10-15 cm. broad; fruits ellipsoid, numerous, brown, corrugated, usually puberulent, 8-13 mm. long, 5-8 mm. broad, the seeds slightly smaller.
