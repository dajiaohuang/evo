    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants 100-250 mm high. Corm conic, 7-9 mm diam.; tunics unknown. Stem usually inclined to sprawling, unbranched. Leaves 4, occasionally 5, lower 3 or 4 ± basal, with fairly soft-textured blades trailing distally, ± linear, 2-4 mm wide, main vein slightly raised, uppermost leaf cauline, largely to entirely sheathing. Spike mostly 2- or 3(4)-flowered; bracts green, soft-textured, outer 20-28 mm long, inner slightly shorter. Flowers mauve-pink, pale yellow in tube; perianth tube (13-)20-35 mm long, cylindric, curved toward apex, expanded near mouth; tepals spreading, 20-25 x 7-8 mm, subobtuse. Filaments ascending, (4-)5-8 mm long; anthers diverging, 7-10 mm long, yellow; pollen yellow. Style branches laxly spreading, 12-15(-20) mm long, exceeding anthers in closed flower. Capsules narrowly ovoid, 15-20 mm long, Seeds unknown.
            textZh: Hesperantha brevicaulis (Baker) G.J.Lewis 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Morphology row 98649; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: One of several long-tubed, pink-flowered species of Hesperantha in eastern southern Africa, H. brevicaulis is distinguished by the soft-textured, trailing leaves, and short, usually trailing stem, 100-250 mm long. The comparatively large flowers typically have a perianth tube 18-35 mm long and tepals 20-25 mm long, the open flower thus 40-50 mm diam. The flowers are adapted for pollination by long-proboscid flies. Plants from the Wolkberg and Serala in Limpopo apparently represent this species but flower earlier in the season, beginning to bloom as early as the middle of February. They also have flowers with a somewhat shorter perianth tube, 13-16 mm long. These shorter-tubed plants are provisionally included in H. brevicaulis. Plants from Serala, south of the Wolkberg, also differ from populations to the south in having anthers 5.0-6.5 mm long vs. 7-10 mm elsewhere. Also puzzling are plants from Mt Prospect near Lydenburg, collected in early flower in mid-February. They have long-tubed mauve flowers with a tube 30-32 mm long, tepals ± 18 mm long, short filaments about 3 mm long, and anthers 6 mm long. The four leaves have well-developed blades and there is no sign of a largely sheathing upper leaf. The plants have blades with a firm texture, an apparently drooping flowering stem, and a spike of five flowers. The plant thus fits poorly in Hesperantha brevicaulis because of the firm leaves, absence of a sheathing upper leaf, spike with more than four flowers, short filaments, and relatively short anthers. Additional material of this plant is needed.
