        usage:
          title: Galipea trifoliata Aubl., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Trees to 6 m high; branches terete, irregularly sulcate, brown to reddish brown, glabrescent, conspicuously lenticellate, the lenticels light tan. Leaves trifoliolate, petiolate, the petiole terete, canaliculate adaxially, 2.0-4.8 cm long, glandular dotted with tiny resinous glands and with scattered villous trichomes adaxially, especially on the ridges of the petiole; terminal leaflet elliptic, 7.5-13.8 cm long, 1.8-3.5 cm wide; lateral leaflets ovate to elliptic, asymmetrical near the base, long acuminate and emarginate at the apex, 3.5-11.5 cm long, 1.4-3.8 cm wide, glandular dotted above and beneath, chartaceous to membranous, the lateral veins 6 to 9 pairs, moderately ascending and weakly anastomosing, con- spicuous, glabrate. Inflorescences terminal and axillary; corymbs loose, few- flowered, peduncles erect to suberect, glabrous, 1.5-2.2 cm long. Flowers (not seen in Panamanian material) white; calyx campanulate, glandular punctate, 3.2- 4.0 mm long, the lobes ovate, the apex acute, 2.5-3.0 mm long, corolla 1.3-1.6 cm long, the tube slightly flaring, slender, straight in bud, 9-11 mm long, the lobes im- bricate, oblong to narrowly obovate, the apex obtuse, spreading, 4-5 mm long; stamens 5-7, included, inserted about midway on the corolla tube, the filaments 3-4 mm long, fertile anthers 2, 5-6 mm long, basifixed, longitudinally dehiscent; staminodes 5, free, linear; ovary 5-carpellate, the style cylindrical, 1.8-2.0 cm long, the stigma 5-lobed but often appearing as 1, 1.0-1.5 mm long. Capsules of 5 carpels united only at the base, each carpel oblong to subtriangular; endo- carp cartilagenous, bivalvate, 1-seeded; seeds oblong, slightly compressed.
          originalLanguage: en
          sourceField: general
