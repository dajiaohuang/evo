    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Twiggy, spinescent shrublet, 0.3-0.6 m tall. Leaves alternate on flowering and short-shoots, 4-15 mm long, concave, silver- or green-felted. Flowerheads solitary on short-shoots on peduncles 1-11 mm long, disciform, 4 mm long, yellow; involucral bracts 4 or 5, appressed silky; marginal paleae free, silky.
            sourceIds:
              - sanbi_14753_0
            locator: "SANBI/WFO archive Morphology row 34209; source 14753.0; publication: Manning, JC. 2013. Asteraceae: Eriocephalus. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 286 - 288. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: During good rainy seasons E. ambiguus tends to form long, drooping shoots without spines and with long leaves similar to those of E. luederitzianus instead of the typical spinescent habit with rigid branches and very short leaves. This variation of E. ambiguus can easily cause confusion with E. luederitzianus, but as these two species are allopatric, all material can be separated on distribution alone.
