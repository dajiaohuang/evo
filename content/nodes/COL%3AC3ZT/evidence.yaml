    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants usually solitary, stemless or with short procumbent stem, 600-900 mm tall excluding inflorescence. Leaves many, arcuate-erect, 400-650 x 85-120 mm, very shallowly channelled, glaucous to dull green, lower surface with few prickles in apical median line. Inflorescence of erect, very dense, cylindric-conical racemes, 2-6-branched, 1-1.3 m tall; bracts ovate-acute, 10-15 x 5-7 mm, many-nerved, reflexed. Flowers red above, lemon below, cylindric, arcuate-decurved, 32-50 mm long; mouth downturned; outer segments connate for 20-30 mm, inner segments free but dorsally adnate to outer in lower half; pedicels 2-3 mm long. Anthers exserted 2-10 mm. Ovary 5.0-9.0 x 1.5-4.0 mm, olive-green; style exserted 8-12 mm. Fruit ±25 x 14 mm.
            textZh: Aloe reitzii Reynolds 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_5961_0
            locator: "SANBI/WFO archive Morphology row 49087; source identifier 5961.0; cited publication: Glen, HF; Hardy, DS. 2000. Aloe. In: G Germishuizen & E du Plessis (eds), Aloaceae (first part), Fl. S. Africa 5(1,1): 1 - 167. National Botanical Institute, Pretoria. [http://www.biodiversitylibrary.org/item/209564#page/3/mode/1up]. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Differences between this species and A. petricola are discussed under that species. The inflorescence of A. reitzii tends to be more freely branched than that of A. gerstneri, and the pedicels are shorter. A. reitzii shares with A. aculeata the character of flower colour being different on the upper and lower parts of the same flower.
            textZh: SANBI 条目提供了 Aloe reitzii Reynolds 的鉴别特征。
            sourceIds:
              - sanbi_5961_0
            locator: "SANBI/WFO archive Diagnostic row 51319; source identifier 5961.0; cited publication: Glen, HF; Hardy, DS. 2000. Aloe. In: G Germishuizen & E du Plessis (eds), Aloaceae (first part), Fl. S. Africa 5(1,1): 1 - 167. National Botanical Institute, Pretoria. [http://www.biodiversitylibrary.org/item/209564#page/3/mode/1up]. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: In general habit of growth, rosettes, leaves and inflorescences, A. reitzii very closely resembles plants of A. gerstneri Reynolds, but it differs considerably from its allies with its curved flowers 50 mm in length. A. reitzii is also allied to A. petricola Pole Evans, but the latter has more spreading, straighter leaves, and smaller differently shaped flowers. Another ally, A. aculeata Pole Evans, differs in having very aculeate leaves, and very different flowers. These two species flower during June-July, while A. reitzii and A. gerstneri flower in February-March. In very young plants of A. reitzii the leaves are often copiously spiny on both surfaces, but with age these spines disappear, except sometimes for a few dorsally in median line near apex. In mature specimens rosettes reach 3 ft. in diameter; the leaf sap dries brownish, while the flowers secrete a copious supply of clear nectar. A character worthy of mention is that the flowers are bright scarlet above, turning yellow to lemon on the underside.
