        usage:
          title: Chimarrhis latifolia Standl., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Trees to 25 m tall, the wood yellow, the -buttresses high, the ultimate branch- lets angular, smooth, glabrous; nodes well spaced, the stipular scars ringlike, often drying black, the leaf scars +0.-5 cm.-in diam. Leaves widely elliptic to elliptic oblong, 10-20 cm long, 6-11 cm wide, rounded at the apex, short acu- minate, the acumen widely triangular, ca. 0.5 cm long, obtuse, basally cuneate to abruptly attenuate acute, the costa prominulous above, prominent beneath, ca. 0.2 cm wide, rubescent, -the lateral veins ca. 10, arcuate, conspicuous above and beneath, uniting to form an undulate submarginal vein, to 0.3 cm from the margin, stiffly papyraceous to thin coriaceous, discolorous, drying dark chocolate above, liver colored beneath, someWhat lustrous, glabrescent; petioles to 4 cm long, angular, twisted, glabrous; stipules deciduous, ovate, 2-3 cm long, acute, thin coriaceous, rubescent. Inflorescences axillary, paniculate, to 12 cm long, to 11 cm wide, the peduncle to 6 cm long, the branches disposed in a fan, to 3 cm long, 'the branchlets in a fan, the corymbs densely flowered. Flowers short ped- icellate to subsessile; hypanthium turbinate,-ca. 2 mm long, glabrous, rubescent, the calycine cup to 0.8 mm long, somewhat expanded, stiffly petaloid, glabrous, teeth absent; corolla white, the tubbe compressed cylindrical, ca. 2 mm long, stiffly petaloid, rubescent, glabrous outside, white pubescent within above attachment of the filaments, the lobes 5, oblong, longer than the corolla tube, obtuse, pu- berulent within; stamens 5, the anthers ovate oblong, ca. 1 mm long, versatile, the filaments to 4 mm long, tapering to apex- ca. 0.35 mm wide in middle, bearded adaxially along lower 2/3, attached near the corolla mouth; style to 3.5 mm long, basally narrow, expanded above, the stigmatic lobes oblong rotund, ca. 1 mm in diam., crassate. Fruits capsular, bivalvular, to 5 mm long, the outer part forming a skirt-like structure enclosing the valves, striate, -glabrescent.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 11145
