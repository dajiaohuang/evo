          title: Doliocarpus dentatus (Aubl.) Standl., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Liana or scandent shrub. Leaves with the blade elliptic, the apex acuminate to rounded, the base obtuse, the margins entire to dentate, 8-20 cm long, 3-7 cm wide, chartaceous to subcoriaceous, glabrous to slightly pubescent with simple hairs along--the veins beneath, the secondary veins 6-13; petioles 5-15 mm long, narrowly alate. Inflorescence cauliflorous or axillary, glomerulate. Flowers 5-8 mm broad, the pedicels 5-10 mm long at anthesis, to 20-25 mm long in fruit; sepals 3-5, obovate, 2-4 mm long, 2-3 mm wide, glabrous to slightly pubescent within, slightly pubescent without; petals 2-4, white, spatulate to obovate, 4-5 mm long, 2-4 mm wide; stamens 30-45, deciduous, the filaments filiform, 4-5 mm long, the thecae 0.5 mm long, nearly parallel; carpels 1, glabrous, globose, the style terete, 1.0-1.5 mm long, the stigma peltate. Fruit indehiscent, glabrous, globose.
