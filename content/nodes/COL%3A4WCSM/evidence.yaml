    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Herb, up to 400 mm tall. Stems pubescent. Leaves lanceolate or oblong-lanceolate. Heads sessile, dense, not solitary, terminal and lateral at summit of branches. Flowers white or brick-pink.
            sourceIds:
              - sanbi_11118_0
            locator: "SANBI/WFO archive Morphology row 3450; source 11118.0; publication: Herman, PPJ; Retief, E. 1997. Plants of the northern provinces of South Africa: Keys and diagnostic characters. Strelitzia 6: 1 - 681. National Botanical Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: "Among its close allies, the distinguishing features of S. atherstonei are its stems clad in simple acute patent hairs often underlain by minute glandular ones, short hairy fascicled leaves in which only the midrib is clearly visible, bracts scarcely longer than the calyx, calyx 2-3 mm long. In his key to the species of Selago, Rolfe (1901) distinguished S. muddiiirom S. atherstonei by 'heads solitary' versus 'heads not solitary'. The solitude of the heads depends on the age of the stem carrying the inflorescence: in young stems such as those sprouting anew from the caudex, heads are initially solitary, but subsequent branching eventually produces loosely panicled heads. Only S. procera has stems with patent hairs like those of S. atherstonei. It is easily distinguished by its much larger primary leaves with the 3-5 main veins clearly visible, its large profusely branched panicle, at least the lowermost bracts in each raceme far exceeding the calyx, and often longer calyx (3-4.4 mm). The area of S. atherstonei lies wholly within that of S. procera. Selago atherstonei is very closely allied to S. lydenburgensis with which it may hybridize."
            textZh: SANBI 条目提供了该种的鉴别特征。
            sourceIds:
              - sanbi_10810_0
            locator: "SANBI/WFO archive Diagnostic row 46627; source 10810.0; publication: Hilliard, OM. 1999. The Tribe Selagineae (Scrophulariaceae). Royal Botanic Garden, Edinburgh. [All rights reserved]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
