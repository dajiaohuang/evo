        usage:
          title: Hampea appendiculata (Donn.Sm.) Standl., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrub or medium-sized tree up to 15 m. tall, the young branches covered with a short tomentum of ferruginous or ochraceous, tufted hairs. Leaves with tufted hairs, the petiole slender, 1.2-11 cm. long, shortly tomentellous; blade ovate to broadly ovate, sometimes more or less elliptic, truncate to subcordate or sometimes obtuse and auriculate-appendaged at the base, the appendages rounded and ca. 1-4 mm. long, acuminate to caudate-acuminate at the apex, 9-21 cm. long and 6-16 cm. wide, the margins entire or somewhat undulate, sparsely and shortly puberulous above especially when young, generally shortly tomentellous beneath, 5- to 7- palminerved, the nerves prominent beneath. Flowers solitary or fasciculate, either hermaphrodite or staminate, the pedicel of the staminate flowers 0.5-1.5 cm. long, that of the hermaphrodite ones usually longer and to 2-5 cm. long, slender, covered with a short tomentum of tufted hairs; bracteoles liguliform, 0.3-2 cm. long and ca. 1 mm. wide, tomentellous; calyx cupuliform-campanulate, irregularly 3- to 4- lobate, 7-9 mm. long and 9-12 mm. wide, covered with a short tomentum of tufted hairs without, glabrous within; petals 16-18 mm. long, white, creamy white or yellow, the corolla-tube ca. 3-4 mm. long and glabrous, the lobes obliquely and in- aequilaterally elliptic, unguiculate, emarginate and unilaterally apiculate at the apex, 13-14 mm. long and ca. 8 mm. wide, tomentellous outside, glabrous or nearly so and glandular-dotted within; stamens more numerous in the staminate flowers than in the hermaphrodite ones, about 22-40, the staminal column ca. 3-4 mm. long, barbate at the apex, not hollow in the staminate flowers, the filaments slender, unequal, 8-10 mm. long and glabrous; ovary more or less oblong, ca. 2 mm. long and 1.25 mm. in diam., densely papillate; style filiform; stigma slightly 3-divided. Capsule subligneous, very shortly stipitate, ellipsoid, 3-angular, subapiculate to rounded at the apex, 1.7-2.5 cm. long and 1.1-1.2 cm. in diam., covered with a short tomentum of tufted hairs outside, glabrous within except along the hispid sutures; seeds 1 or 2 in each cell, ellipsoid, 7-10 mm. long and 4.5-6 mm. wide, the testa blackish-browvn with paler nerves, the aril caplike, covering less than half of the seed.
