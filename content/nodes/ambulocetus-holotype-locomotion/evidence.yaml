        - referenceId: thewissen-1994-ambulocetus
          relation: supports
          pages: 210–212
          figure: Figures 1–3
          quoteLocator: Description; Locomotor interpretation
  claim-rationales.zh:
    - 具名骨架直接保存相关椎骨与肢体形态，但划水方式和陆地步态由比较力学及不完整材料复原。
  claim-statements.zh:
    - 陆行鲸正模 H-GSP 18507 保存具有两栖运动镶嵌的部分骨架；水獭式游泳和海狮式陆地移动属于功能假说，而非保存下来的行为。
