  claims:
    - subjectId: event:ambulocetus-holotype-locomotion
      claimKind: scientific
      claimType: event-mechanism
      statement: Ambulocetus holotype H-GSP 18507 preserves a partial skeleton with an amphibious locomotor mosaic; otter-like swimming and sea-lion-like movement on land are functional hypotheses rather than preserved behaviour.
      confidence: medium
      confidenceRationale: The named skeleton directly preserves relevant vertebral and limb anatomy, but stroke pattern and terrestrial gait are reconstructed from comparative mechanics and incomplete material.
