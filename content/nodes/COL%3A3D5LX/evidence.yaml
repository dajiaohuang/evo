    facets:
      morphology:
        status: partially-supported
        claims:
          - text: An erect, much-branched, dense and rounded shrub, up to 1 m high, glabrous in all external parts. Stems repeatedly 2-3-forked. Branchlets closely leafy at the tips, lower down nude and marked with leaf-scars, blackish. Leaves suberect-erecto-patent, becoming reflexed before withering, linear, 1-3 cm long, 2-4 mm wide, flattened, coriaceous; adaxial side flat or canaliculate with involute margins, glaucous and whitish-striate (somewhat sulcate when dry); abaxial side convex, green or slightly glaucous, with 1-3 conspicuous, often dark veins; apex bluntly 3-toothed, teeth c. 1-2 mm long and 1 mm wide or smaller; leaf-base dilated, half-clasping. Peduncles lateral in the uppermost leaf-axils, solitary or 2-3 together on the same branchlet, 1-4 cm long, c. 0.5-0.8 mm thick, terete, ± striate, with 2 lateral, subulate-filiform, 2-3 mm long, reduced leaves in the axil. Involucre widely campanulate or hemispherical, 11-16 mm in diam. Involucral bracts 8-11, uniseriate or subuniseriate, connate to 1/3 or almost to the middle, 5-9 mm long; the free lobes broadly-narrowly ovate(-oblong), 2.5-6 mm long, 2-4.5 mm wide, obtuse-acute, distinctly 3-9-nerved, puberulous-tipped. Receptacle convex-hemispherical, distinctly alveolate. Ray-florets 8-13, yellow. Tube 1-1.3 mm long, cylindrical. Lamina elliptic or oblong-narrowly elliptic-oblong, 8-10 mm long, 3-4 mm wide, 4-veined. Style terete with swollen base; style branches flattened, 0.5-0.8 mm long, obtuse. Disc-florets c. 30-60. Corolla 3.5-4.0 mm long. Tube 1.2-1.5 mm long, cylindrical. Limb campanulate, 2-2.5 mm long; lobes ovate-narrowly triangular, 0.6-0.9 mm long. Anthers 1.2-1.4 mm long inch the narrowly ovate subacute appendage. Style ± flattened with swollen base; stylophore short but distinct; style branches 0.5-0.7 mm long. Pappus bristles numerous-copious, 1-2 mm long, densely barbellate, white, ± erect. Achenes oblanceolate, 4-4.5 mm long, 1-1.5 mm wide, shortly white-villous with appressed-erecto-patent hairs (mucilaginous when soaked), with 5-10 low but distinct longitudinal ribs, light or greenish brown below the indumentum.
            sourceIds:
