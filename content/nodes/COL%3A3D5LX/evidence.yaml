          - text: E. acraeus is a very characteristic species, easily recognized, i.a., on the apically toothed leaves and the involute leaf-margins. The possibly closest relative is E. brownei from East Tropical Africa, which differs in having entire leaves with serrulate margins and pubescent peduncles. Even before it was described the species was successfully grown in England (under the name of E. evansii) and proved perfectly hardy in the open.
