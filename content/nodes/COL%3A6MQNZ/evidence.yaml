        claims:
          - text: Robust perennial, rhizomatous, up to 2 m high. Leaf blades up to 600 mm long, up to 8 mm wide. Spikelets (sessile) 5.5-6.0 mm long (yellowish, glabrous to shortly white hairy, callus linear, pungent, 1-2 mm long). Raceme pairs with 2-6 awns, 25-40 mm long; raceme bases terete, unequal, upper raceme base 1.5-2.5 mm long, homogamous spikelets 0 or 1 pair at base of upper racemes.
