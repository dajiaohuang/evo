        usage:
          title: Inga portobellensis Beurl., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Tree more or less glabrous throughout, the young branchlets with elongate lenticels. Leaves large, bijugate; petiole usually 2-3 cm. long, winged (the wing narrowing baseward and the petiole subterete basally); rachis usually 6-8 cm. long, spatulate-winged like the petiole, bearing at insertion of the pairs of leaflets an elevated, cupuliform gland, bearing apically in young leaves a (deciduous) mucro- nate appendage as much as 15 mm. long; leaflets 2 pairs, obovate-oblong, 20-30 cm. long, 10-13 cm. wide in apical pair (basal pair only half as long), obtuse basally, abruptly acuminate apically, darker above than below, glabrous except occasionally puberulent on the costa; stipules ovate-subfalcate, about 16 mm. long, subpersistent. Inflorescence of solitary, axillary, pedunculate heads (or very condensed spikes); peduncle 3-8? cm. long, glabrous; bracts of head ovate or lanceolate, 7-8 mm. long, late-caducous. Flowers short to moderately pedicellate, large and showy; calyx tubular-funnelform, about 25 mm. long, striate, glabrous except pubescent on tips of the lobes; corolla tubular, almost 4 cm. long, glabrous except canescent- pubescent on the lobes; stamens as much as 7-8 cm. long, the staminal tube well- exserted; ovary glabrous. Legume flat, about 16 cm. long and 2.5 cm. wide, arcuate, ligneous, thickened on the margins.
          originalLanguage: en
          sourceField: general
