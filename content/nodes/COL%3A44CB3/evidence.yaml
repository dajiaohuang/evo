            locator: Strelitzia 42; archive Morphology row 99002, source 18638.0
            placeTimeScope: Regional species account published 2020; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
          - text: Moraea saldanhensis has relatively small, slate-blue flowers, the outer tepals ± 18 mm long with spreading and ultimately half reflexed limbs ± 8 mm long thus shorter than the claws ± 10 mm long. It is most easily confused with M. inconspicua which has similarly small flowers (outer tepals 12-18 mm long), usually yellow to brown, occasionally white to cream-coloured, but the tepal limbs are almost always fully reflexed and somewhat to twice as long as the upright claws. Moraea saldanhensis also has a slightly longer filament column, ± 6.5 mm long (vs 3.5-6.0 mm in southern populations of M. inconspicua), orange-red pollen and the ovary is included whereas in M. inconspicua the ovary is usually exserted and the pollen is typically yellow, although populations with red pollen are known, notably among the Namaqualand populations, segregated as subsp. namaquensis.
