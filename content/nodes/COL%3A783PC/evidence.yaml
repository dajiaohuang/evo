        usage:
          title: Plukenetia volubilis L., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Liana; twigs minutely appressed-pubescent, glabrescent. Leaves membranous; petioles mostly 3-8 cm long; stipules brownish, glabrous, ovate-lanceolate, 1-1.5 mm long; blades ovate, ca 7-13 cm long, 5-12 cm broad, glabrate and shining above, glabrate or sparsely hirsutulous and paler beneath, ventrally with 2 promi- nent ellipsoidal shining marginal glands (ca 1.5-2 mm long) near the base, major veins at base of blade 3, the remainder of blade pinnately veined (3 or 4 major laterals on either side), the veinlet reticulum conspicuous, the base truncate to subcordate, the margins finely to rather coarsely denticulate, the apex abruptly caudate-acuminate. Inflorescences axillary, , ca 3-8 cm long at anthesis, becom- ing up to 15-20 cm long in fruit; y flowers solitary at lowermost nodes, c3 flowers in clusters at distal nodes. Staminate flowers with pedicels ca 1-1.5 mm long; calyx-segments generally 4, lanceolate, acute, 1.8-2.5 mm long; receptacle conical, 0.7-1.5 mm high; disc obsolete; stamens 19-24, inserted spirally on the receptacle, the filaments 0.3-0.6 mm long, the anther-sacs bipartite, the locules discrete (hence anthers 4-partite), 0.3-0.4 mm long, the connective apex blunt and glandular. Pistillate flowers with pedicels becoming 10-15 mm long; calyx-lobes oblong- lanceolate, 1.8-2 mm long, 0.9-1 mm broad; ovary of 4 glabrous carinate carpels, the stylar column 11-25 mm long, slender, the stigmas thick, bilobed. Capsules deeply 4-lobed, oblate, up to ca 2 cm high, 3.5 cm broad, the cocci thick and rigid; seeds lenticular with thinner margins, reticulate-venose, brownish-mottled, 15-17 mm broad.
