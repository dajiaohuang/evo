    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Slender, terrestrial herb, up to 340 mm tall. Leaves narrowly elliptic, acute, up to 140 x 25 mm. Dorsal sepal 9-13 mm long. Side lobes of lip linear, 30 mm long. Flowers white and green.
            textZh: Bonatea saundersioides (Kraenzl. & Schltr.) Cortesi 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_11118_0
            locator: "SANBI/WFO archive Morphology row 538; source identifier 11118.0; cited publication: Herman, PPJ; Retief, E. 1997. Plants of the northern provinces of South Africa: Keys and diagnostic characters. Strelitzia 6: 1 - 681. National Botanical Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: B. saundersioides is found in shady habitats within riverine forest and savannah of the northeasterly parts of South Africa. It is closely allied to B. cassidea, both species sharing intermediately basal lower leaves, desiccated floral bracts at flowering, narrowly-cucullate median rostellum lobes, and curved spurs where the clavate apex comprises 1/2-2/3 of the total spur length. B. saundersioides has longer and narrower lower petal lobes ((13-) 16-24 x 0.5-2.0(-3.0) mm) than B. cassidea (8-15 (-19) x (1.5-)3.0-8.0 mm). This species also has narrower lip lateral lobes (0.5-2.0 mm vs (1.5)2.0-6.5 mm). Colour variation occurs in the perianth of B. saundersioides with either green or white lip lateral lobes.
            textZh: SANBI 条目提供了 Bonatea saundersioides (Kraenzl. & Schltr.) Cortesi 的鉴别特征。
            sourceIds:
              - sanbi_6866_0
            locator: "SANBI/WFO archive Diagnostic row 76903; source identifier 6866.0; cited publication: Ponsie, ME; Edwards, TJ; Johnson, SD. 2007. A taxonomic revision of Bonatea Willd. (Orchidaceae: Orchidoideae: Habenariinae). S. African J. Bot. 73: 1 - 21. [Copyright held by the South African Association of Botanists (2007); http://www.sciencedirect.com/science/journal/02546299]. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
