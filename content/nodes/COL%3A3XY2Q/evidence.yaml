        usage:
          title: Mappia racemosa Jacq., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Large shrubs or small trees to 11 m tall; branches glabrous. Leaves with peti- oles 12-25 mm long, slightly strigose in the sulca, becoming glabrate; blades lanceolate, oblanceolate or oblong, 10-19 cm long, 3-5 cm broad, the apex acumi- nate or rounded, the base acute to cuneate, glabrous, thin coriaceous, the veins 7-9 pairs, diverging obliquely, scarcely arcuate except near the margin, the axil- lary domatia sometimes with pubescence. Inflorescences with peduncles 1-1.5 times the petiole, densely pilose to glabrate, few to many flowered. Flowers with calyx 1.5-2 mm diam., 5-toothed, sparsely strigose with hairs clustered at the teeth; petals cream colored, lanceolate to oblong, 3.4-5 mm long, 0.9-1.1 mm wide, densely strigose to glabrate outside, abundantly pilose to hirsute inside, the pubescence aggregated in the lower third, the apex inflexed, glabrous; stamens 2.54.5 mm long; disc fleshy, hirsute on the edge and within, lobed, 0.2-0.3 mm high; pistil 2-3 mm long at anthesis, densely hirsute to glabrate, the style short, glabrous, the stigma capitate, occasionally bilobed. Fruits ellipsoidal, 1.4-1.6 cm long, 0.9-1.1 cm wide, tapering to the base or rounded, the apex umbonate, the mesocarp fleshy or fibrous, the putamen smooth to slightly rugose; seed 1, the endosperm apparently oily.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 6505
