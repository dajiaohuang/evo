        claims:
          - text: Delicate, rhizomatous geophyte, up to 250 mm tall with a short, sparsely fibrous neck. Leaves 10-20, fine and filiform, smooth, emerging at flowering. Flowers in a broadly cylindrical raceme, yellow.
            textZh: Bulbinella nana P.L.Perry 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_14536_0
            locator: "SANBI/WFO archive Morphology row 32910; source identifier 14536.0; cited publication: Snijman, DA. 2013. Asphodelaceae: Bulbinella. In: DA Snijman (ed.), Plants of the Greater Cape Floristic Region 2: The Extra Cape flora, Strelitzia 30: 53 - 54. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: This is the smallest of the Bulbinella species, forming dainty, delicate-looking plants. It has close affinities with B. gracilis, which occurs in a similar area, but is separated from that species by the more numerous and very fine filiform leaves compared with the more succulent ones of B. gracilis. It also has more prominent basal sheath fibres and distinct veining in the cataphylls which is not so obvious in B. gracilis. The plants from Ratelpoort were at first thought to be a dwarfed form of B. divaginata as the fusiform roots and numerous filiform leaves are closer to that species. A few seeds formed in cultivation were markedly similar to the distinctive seeds of B. divaginata. However, seeing collections of the three species in flower together, it was noticed that B. nana had the patent pedicels of B. gracilis after the flowers had faded.
            textZh: SANBI 条目提供了 Bulbinella nana P.L.Perry 的鉴别特征。
            sourceIds:
              - sanbi_5933_0
            locator: "SANBI/WFO archive Diagnostic row 84534; source identifier 5933.0; cited publication: Perry, PL. 1999. Bulbinella in South Africa. Strelitzia 8: 1 - 78. National Botanical Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
