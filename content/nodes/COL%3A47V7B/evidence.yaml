    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Slender to robust, few-branched shrub to 2.5 m. Leaves bipinnate, discolorous, glaucous below, leaflets rhomboid to obovate, toothed, sometimes 3-lobed. Flowers yellow, in large, orbicular, compound umbels, > 30 rays. Fruit elliptic to rotund, mericarps dorsally compressed, dorsally slightly ribbed, marginally narrowly winged, homomorphic, vittae present, with additional rib vittae, rib oil ducts inconspicuous.
            sourceIds:
              - sanbi_14097_0
            locator: "SANBI/WFO archive Morphology row 9299; source 14097.0; publication: Magee, AR; Manning, JC; van Wyk, B-E; Tilney, PM. 2012. Apiaceae: Notobubon Magee. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 329 - 330. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: This species is superficially similar to N. galbaniopse, from which it is readily distinguished by the shortly pedunculate inflorescence with at most two small secondary umbels, the very large and multiradiate primary umbel and the homomorphic fruit. It can often be distinguished from N. galbaniopse also by the regularly toothed leaflets and the lamina which is never revolute along the margins. Hybrids between this species and N. ferulaceum [Marloth 7687 (PRE), Winter 103 ( JRAU)], around Camps Bay, as well as N. capense [Esterhuysen 27652 (BOL),McDonald 839 (NBG), Magee et al. 48 ( JRAU)], around Jonkershoek and Worcester, have been recorded (Magee et al. unpublished data).
            textZh: SANBI 条目提供了该种的鉴别特征。
            sourceIds:
              - sanbi_7160_0
            locator: "SANBI/WFO archive Diagnostic row 84472; source 7160.0; publication: Magee, AR; Van Wyk, B-E; Tilney, PM. 2009. A taxonomic revision of the woody South African genus Notobubon (Apiaceae: Apioideae). Syst. Bot. 34(1): 220 - 242. [All rights reserved]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
