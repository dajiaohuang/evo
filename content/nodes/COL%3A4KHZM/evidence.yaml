        usage:
          title: Pluchea odorata (L.) Cass., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Erect, aromatic herb to 1 m tall; twigs puberulent or cinereous with fine, weak, ascending or spreading hairs, drying faintly many-angled, sometimes reddish. Leaves ovate, elliptic or lanceolate, mostly 5-8 cm long, 1.5-3 cm wide, apically acute, mucronulate, basally obtuse, acute or acuminate, often oblique, the margins serrate to subentire, 4-6 veins on each side of the prominent midvein, evenly pubescent above and beneath with short, erect, weak hairs and glandular punctae; petioles mostly 3-5 mm long but sometimes wanting. Inflorescence an open panicle of slightly congested, several-headed paniculate clusters, without well differentiated bracts and sometimes with linear, 4-8 mm long bracteoles. Heads globose-campanulate, disciform; involucral bracts numerous in several unequal series, indurated, dorsally pubescent, the inner series lanceolate, acute; ray florets purplish, numerous, ca. 5 mm long, the corolla capillary, apically 2-3-dentate, the lobes dorsally papillose, the style slender, papillose, branches basally globose, the ovary cylindrical, pubescent with ascending hairs, copiously glandular; disc florets several, purplish, ca. 5 mm long, the corolla tubular, expanding upwards, glabrous, the lobes dorsally glandular, the anthers ca. 2 mm long, the appendages acute, the basal tails slender, coherent, the style branches slender, pilose, free only at the tips, the style base little expanded, the ovary rudimentary, sterile. Achenes reddish brown, the body ca. 1 mm long, with glandular, prominently stramineous ribs, pubescent; pappus of numerous, basally united setose bristles in one series.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 1637
