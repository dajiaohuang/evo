        claims:
          - text: Perennial herb. Leaves 500-900 mm long, rarely broader than 10 mm, margin smooth in lower part. Inflorescence dense. Peduncle up to 0.9 m high. Flowers cream or ivory to cream-yellow or orange-yellow.
            textZh: Kniphofia coralligemma E.A.Bruce 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_11118_0
            locator: "SANBI/WFO archive Morphology row 2537; source identifier 11118.0; cited publication: Herman, PPJ; Retief, E. 1997. Plants of the northern provinces of South Africa: Keys and diagnostic characters. Strelitzia 6: 1 - 681. National Botanical Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: "Flower colour varies according to the three localities indicated above: (a) in the typical form, known from only a small area on the western extremity of the Waterberg (Kransberg), the buds are coral-pink shading to creamy white or ivory as the flowers mature; (b) on the highest point of the Blouberg, the plants tend to be smaller with orange-yellow buds, becoming pale yellow in open flowers; (c) in the Soutpansberg to Wolkberg area, the plants tend to be more robust than the typical form, with orange-scarlet buds changing to orange-yellow towards the base of the raceme, bearing a superficial resemblance to K. linearifolia, but differing in the narrower leaves and lanceolate-acuminate bracts."
            textZh: SANBI 条目提供了 Kniphofia coralligemma E.A.Bruce 的鉴别特征。
            sourceIds:
