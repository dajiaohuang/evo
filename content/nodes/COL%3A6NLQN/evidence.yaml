            locator: "SANBI/WFO archive Diagnostic row 51583; source identifier 6616.0; cited publication: Codd, LEW. 2005. Asphodelaceae (First part): Kniphofia, Fl. S. Africa 5(1,2): 1 - 94. South African National Biodiversity Institute, Pretoria. [http://www.biodiversitylibrary.org/item/209560#page/3/mode/1up]. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
