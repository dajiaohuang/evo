        usage:
          title: Baltimora recta L., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Herb, to 3 m tall; stems glabrate at base, moderately to markedly strigose toward apex with hairs 0.3 mm long. Leaves broadly to narrowly ovate, 2.5-15 cm long, 1.5-12 cm broad, basally truncate to shortly attenuate, both surfaces weakly to moderately strigose with hairs 0.1-0.3 mm long; petioles 0.8-7 cm long, 0.2-1 mm diam. Inflorescence with heads in racemes or more often in large panicles; peduncles 8-33 mm long, 0.3-0.7 mm diam., strigose with hairs 0.3 mm long. Heads radiate, 7-22 mm across, 5-8 mm tall; involucral bracts 3-6, 3.5-6 mm long, 1.7-2.2 mm wide, the apical margin ciliate with hairs 0.3 mm long, the outer bracts weakly strigose abaxially with hairs 0.3 mm long; receptacle 1 mm diam.; paleas 3.5-4.2 mm long, 0.6-0.8 mm wide; ray florets 3-8, the ligules 3.8-5.5 mm long, 1.2-3.1 mm wide, the tube 1.2 mm long; disc florets 16 or more, the corolla throat 1 mm long, 0.7 mm diam. with lobes 0.5 mm long, the tube 1 mm long, 0.2 mm diam., the anthers 1.7 mm long with truncate appendages, the style 1 mm long, the stigma 1.2-2.2 mm long, the ovary 2.2-4 mm long. Achenes 2.4-3.2 mm long, 1.6-1.9 mm diam., truncate and puberulent; pappus a small crown or cup of tissue. Chromosome number n = 15.
          originalLanguage: en
          sourceField: general
