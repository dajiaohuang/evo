          publishedAt: undated
          originalSourceText: Slender shrubs 1.0-4.5 m. high; young twigs densely and minutely pubescent, densely foliate, the internodes 1.0-2.5 cm. long. Leaves more or less distichous, almost sessile. oblong to oblanceolate, acute at the base, obtusely acuminate at the apex, 4-6 cm. long, 1-2 cm. wide, membranous, glabrous except on midrib and margin, densely glandular-punctate, the midrib flat or slightly elevated above, prominulous beneath, the principal lateral nerves several but distant, diverging at an angle of about 60? with the midrib, delicate, the marginal nerve very close to the margin, the reticulation obscure throughout. Flowers minute, glomerate, few, axillary and lateral. Sepals nearly 1 mm. long. Petals obovate, 2 mm. long. Ovary glabrous, 2-celled, the cells 4- to 6-ovulate. Berry subglobose, sessile, 5-7 mm. long, red, crowned by the persistent sepals.
