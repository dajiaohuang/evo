        usage:
          title: Lundia corymbifera (Vahl) Sandwith, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Liana to 2.5 cm in diameter; stems with 4 phloem arms in cross section; branchlets terete, drying longitudinally striate, simple puberulous, the nodes with interpetiolar glandular fields; pseudostipules inconspicuous, blunt-conical. Leaves 3-foliolate or 2-foliolate with a tendril or tendril scar; leaflets ovate to elliptic- obovate, acute to acuminate, the base truncate, 6.5-11.5 cm long and 3.3-7.6 cm wide, membranaceous, palmately veined basally, the secondary veins 4-6 on a side, short puberulous at least on main veins above and below and in axils of the lateral nerves beneath, sometimes also with scattered trichomes over the surface, usually more or less lepidote, some plate-shaped glands near the midvein be- neath, lepidote glandular basally, drying dark green to brown above, grayish green beneath, never with a macroscopically conspicuous white fringe when young although microscopically ciliate; tendril simple 4-14 cm long; petiolules 1.2-3.2 cm long, petiole 3.2-5.3 cm long, conspicuously simple puberulous. In- florescence a contracted axillary or terminal panicle, the branches strongly simple puberulous. Flowers with the calyx in bud terminating in 5 elongate, fused teeth which form an apical point, calypterate with the apical third dehiscent, thus cupular and evenly truncate in mature bud or flower, 3-6 mm long and 4-5 mm wide, puberulous with 1-3-celled simple trichomes; corolla white with the 2 throat ridges yellow, tubular-infundibuliform, 2.5-4.3 cm long and 0.8-1.3 cm wide at the mouth, the tube 1.8-2.8 cm long, the lobes 0.4-1.2 cm long, densely simple puberulous outside, the lobes ciliate margined, glandular-lepidote and puberulous with simple trichomes, the throat mostly glabrous inside, short-puber- ulous with gland-tipped trichomes at and below the level of stamen insertion; stamens didynamous, the anther thecae divergent to divaricate, 2-3 mm long, the longer filaments 1.3-1.6 cm long, the shorter filaments 0.8-1.2 cm long, the staminode 2-3 mm long, inserted 3-7 mm from base of corolla tube; pistil 1.5-2.4 cm long, the style glabrous except for short appressed trichomes near the base, the ovary tapered cylindric, 2-3 mm long and 1-1.5 mm wide, densely sericeous, the ovules 4-seriate in each locule; disc inconspicuous, 0.5 mm long and 1.5 mm wide. Capsule linear, more or less compressed, velvety pubescent, 29-60 cm long and 1.5-1.9 cm wide, both median nerve and margins distinctly raised; seeds thin, bialate, 1.0-1.3 cm long and 3.4-3.9 cm wide, wings hyaline at the tips, brown at the base, poorly demarcated.
