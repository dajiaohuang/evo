          originalSourceText: Twining vine or shrub to 10 m long or more, trailing at ground level or festoon- ing on shrubs or small trees; stems terete, sometimes reddish on one side, loosely to densely pubescent with slender and stout simple hairs to 1 mm long, some hairs gland-tipped, the glands mostly transparent but drying reddish-brown, the hairs on the young parts retrorse. Leaves opposite, not connate, entire (lobed on juvenile plants), ovate, oblong, or elliptical, mostly widest at the middle or below, apically acuminate, acute or obtuse, often mucronulate, basally rounded, truncate
