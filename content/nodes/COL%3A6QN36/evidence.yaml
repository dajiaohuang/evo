        usage:
          title: Lonicera japonica Thunb., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: or obtuse, often slightly oblique, mostly 4-7 cm long, ca. half as wide, glabrate to pilose with stout, simple, mostly eglandular hairs, the hairs with expanded bases above, the margin ciliate, the veins ca. 4 on each side of the midvein, the minor venation reticulate, conspicuous beneath, often obscure above; petiole 3-10 mm long, pilose, lenticular in cross section; small but well developed shoot buds evident in the leaf axils. Inflorescences numerous, axillary, appearing near the ends of the branches, pedunculate solitary pairs (dichasia) of closely positioned flowers subtended by pairs of foliaceous bracts; peduncles 1-2 cm long, not much altering in fruit, slightly compressed dorsally, pilose with short and long simple hairs, many hairs glandular; bracts variable in size, mostly 2-3 cm long and resembling the leaves; bractlets obtuse, about half to as long as the ovaries (ca. 1 mm), conspicuously ciliate with stout, 1 mm long hairs, sometimes hairy dor- sally; pedicels wanting. Flowers white fading yellowish, fragrant; ctlyx tube enclosing the ovary, the lobes ca. 1 mm long, lanceolate-deltoid, prominently ciliate, glabrous dorsally and ventrally; corolla 4-5 cm long, strongly 2-lipped, the tube ca. 2 cm long, slender, straight and broadening slightly upward, not saccate or ventricose, pubescent outside and in, with a yellow, gland-dotted, nectary extending along the inside of the tube from the base to about halfway up and situated along the junction of one of the sutures of the lower lip, the limb equalling or slightly exceeding the tube, the upper lip 4-lobed about halfway down, the lower lip distinct from the base of the limb; stamens sub-equal, the filaments white, glabrous, straight, tapering slightly near the apex, the upper 3 inserted at a slightly higher level than the dorsal 2, the anthers dorsifixed at ca. the middle, ca. 4 mm long, elongate, straight in bud but soon recurving at the ends into a 'U' shape; ovary 1.5-2 mm long, 3-loculed, the ovules 2-3 per locule, the style glabrous, the stigma green, discoid, not evidently lobed. Fruit5 a black, juicy, shiney berry crowned by the persistent calyx.
          originalLanguage: en
          sourceField: general
