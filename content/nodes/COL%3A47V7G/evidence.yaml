    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Robust, stiffly leafy shrub to 2 m. Leaves bipinnate, leaflets reduced to spine-tipped pinnules, terete. Flowers yellow, in slightly orbicular, compound umbels, < 26 rays. Fruit broadly elliptic, mericarps dorsally compressed, dorsally slightly ribbed, marginally narrowly winged, homomorphic, vittae present, with additional rib vittae, rib oil ducts inconspicuous.
