        claims:
          - text: "Perennial herb or suffrutex, up to 0.3 m high. Stems erect, decumbent, much branched, hairy in upper parts. Leaves with blade narrowly ovate to ovate, 10-32 x 4-16 mm, apex obtuse or acute, apiculate, base shortly narrowed or wedge-shaped, variously toothed, but upper ones ± entire; petioles 7-24 mm long. Flowers: in upper leaf axils and in terminal racemes; spur widely conical, ending with short narrow section, 3 x 3 mm, at 90° angle to pedicel; corolla ± 10 mm long, sparsely pilose, upper lobes ± 6 mm long, rounded, lower lip ± 6.4 mm long, whitish; Mar. Fruit an ovate or somewhat urceolate capsule, up to 9.0 x 7.5 mm, apex truncate, level to somewhat oblique, not horned."
            sourceIds:
