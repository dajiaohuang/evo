    - subjectId: event:nectocaris-soft-body-cephalopod-test
      claimKind: scientific
      claimType: topology
      statement: Ninety newly prepared Nectocaris specimens reveal paired eyes, two tentacles, lateral fins and a ventral funnel-like structure that support a cephalopod interpretation in the cited study, but absent diagnostic shell, siphuncle, beak and radula evidence leaves that placement contested.
      confidence: low
      confidenceRationale: The expanded sample strongly supports the described soft anatomy, but cephalopod affinity has unusual character combinations and lacks several diagnostic structures, so the claim is explicitly topology-limited.
      referenceLinks:
        - referenceId: smith-caron-2010-nectocaris
          relation: supports
          pages: 469–472
          figure: Figures 1–4; Supplementary Information
          quoteLocator: New material; reconstruction; cephalopod comparison
  claim-rationales.zh:
    - 扩大的样本可靠记录软组织解剖，但异常性状组合及关键诊断结构缺失使头足类归属保持低置信度。
  claim-statements.zh:
    - 九十件新制备的 Nectocaris 标本显示成对眼、两条触手、侧鳍和腹侧漏斗状构造，支持所引研究的头足类解释；但缺少诊断性的壳、体管、喙和齿舌证据，使这一归属仍有争议。
