          attribution: "Lampert KP, Heermann L, Storm S, Hirsch PE, Cerwenka AF, Heubel K, et al. (2024). Round gobies (Neogobius melanostomus) in the River Rhine: Population genetic support for invasion via two different routes. PLOS ONE 19(9):e0310692. https://doi.org/10.1371/journal.pone.0310692. Findings paraphrased."
    facets:
      morphology:
        status: not-assessed
      lifeHistory:
        status: not-assessed
      ecology:
        status: partially-supported
        claims:
          - text: Annual July angling surveys near Rees on the Lower Rhine from 2010 through 2020 collected 2,905 gobiids, of which 93.5% were Neogobius melanostomus. This is a site- and method-bounded proportion of goby catches, not a species-wide abundance or population estimate.
            sourceIds:
              - lampert2024
            locator: Methods, Field sampling; Results, first paragraph and Fig. 2 caption.
            placeTimeScope: A groin field near Rees, Lower Rhine, Germany, sampled annually in July from 2010 to 2020. The result applies to the reported angling catches at that site and time; the article was published 2024-09-19.
            lifeStatus: Free-living fish caught in the field. The article states that captured gobiids were euthanized; no captive or domesticated fish support the claim.
            originalLanguage: en
        gaps:
          - A catch proportion from one Lower Rhine site and a particular angling protocol does not estimate species-wide abundance or distribution.
          - Seasonal, habitat, and gear differences beyond the reported surveys remain unassessed.
      evolution:
        status: partially-supported
        claims:
          - text: The study compared mitochondrial control-region sequences from 286 fish sampled at four European sites and reported three d-loop haplotypes. Rhine samples contained all three; the sampled Danube fish had haplotype A, while the sampled Trave fish had haplotypes B and C. The authors interpreted this pattern as support for two invasion routes into the Rhine. It is a bounded historical population inference from one mitochondrial region, not a species-wide phylogeny.
            sourceIds:
              - lampert2024
            locator: Abstract; Methods, Molecular analyses; Results, haplotype counts and Fig. 3; Discussion, interpretation and remaining invasion-history uncertainty.
            placeTimeScope: Samples represent Rees in the Lower Rhine, Basel in the Upper Rhine, Deggendorf and Passau in the Danube, and the Trave near the Baltic Sea. Lower Rhine abundance sampling ran annually in July from 2010 to 2020; collection dates for the comparative genetic samples are not specified in the cited main-text methods and remain unknown.
            lifeStatus: Wild-caught European river fish. The source states that collected gobiids were euthanized; no captive or domesticated samples support the claim.
            originalLanguage: en
        gaps:
          - The inference uses a single mitochondrial control region and a limited set of European populations; nuclear and broader genomic evidence are not assessed here.
          - The authors state that their data do not resolve the number or timing of invasion waves from either direction.
      distribution:
        status: not-assessed
      fossil:
        status: not-assessed
      conservation:
        status: not-assessed
