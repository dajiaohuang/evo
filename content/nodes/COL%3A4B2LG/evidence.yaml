        claims:
          - text: Glabrous, fleshy, perennial herb, up to 200 mm high, tuberous-rooted; stems simple or branched. Leaves sessile, ± entire to pinnatifid, lobes ± 3 on each side, up to 60 mm long, base petiolate, axils woolly. Capitula campanulate, 15 mm in diam., yellow; peduncles up to 60 mm long; pedicels up to 50 mm long; involucral bracts ovate-oblong, subacute, basally connate, 10 mm long. Flowering time June-Aug. Pappus of yellowish, silky hairs, 20 mm long. Cypselae hirsute, yellowish, 6 mm long.
