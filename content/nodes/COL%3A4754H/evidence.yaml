        claims:
          - text: Bulbous geophyte, 25-35 cm. Leaves 3, emergent at flowering, suberect, narrowly strap-shaped. Flowers 1-4, trumpet-shaped, tepals 9-10 mm wide, almost flat, pale pink with dark keels.
