            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: It is immediately identified by the shape of the flower, the perianth which has the segments almost regularly spread, i.e. nearly actinomorphic (in some the lower pair are very slightly more widely divided than the others and in some a single segment lies immediately below the filaments and the adjacent pair may be slightly more widely separated) and it is far more funnel-form than in other members of this group with the segments overlapping for 2/3 to 3/4 of their length.
