    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Like M. fistulosa but shorter, up to 150 mm tall, leaf channelled, trailing, with prominent, thick white margins, and flowers smaller, tepals 9-13 mm long.
            textZh: Moraea marginata J.C.Manning & Goldblatt 的 SANBI 物种条目记载了植株、叶片和花部形态。
            sourceIds:
              - sanbi_14562_0
            locator: Strelitzia 30; archive Morphology row 33301, source 14562.0
            placeTimeScope: Regional species account published 2013; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
          - text: Recognised by the combination of stellate, blue-violet flowers with subequal tepals, free stamens and undivided, filiform style branches, Moraea marginata also has a solitary, linear, channelled leaf with conspicuous, maroon margins that are very conspicuously thickened when dry. As with related M. fistulosa and M. monticola, the style branches are filiform, undivided and extend between the stamens. The leaves of M. marginata are dry and withered at flowering, and the attractive, blue-violet flowers, 20-25 mm in diam., open in early summer in the late afternoon for just a couple of hours, withering near sunset, a phenology shared with several other species of the M. crispa alliance.
            textZh: SANBI 条目提供了 Moraea marginata J.C.Manning & Goldblatt 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: Strelitzia 42; archive Diagnostic row 94216, source 18638.0
            placeTimeScope: Regional species account published 2020; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
