        usage:
          title: Cavendishia gentryi Luteyn, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Epiphytic shrub, mature branches terete, smooth, glabrate, brown; immature branches and twigs of the new growth terete, smooth, reddish brown, densely pilose with white hairs to 4 mm long. Leaves elliptic to ovate elliptic, 8-13 cm long, 3.5-5.5 cm wide, basally rounded, apically abruptly acuminate, brownish green when dry, densely pilose beneath with hairs to 2 mm long, scattered pilose above; 3(-5)-plinerved, the midrib, the lateral nerves and the primary veins impressed and conspicuous above, elevated beneath, the veinlets slightly elevated above, obscure beneath; petioles terete, rugose, 5 mm long, 2 mm diameter, densely pilose with tan hairs to 3 mm long. Inflorescence short race- mose, 6-flowered; rachis terete, striate, densely pilose, ca. 2.5 cm long; floral bracts lanceolate, long acuminate, 16-23 mm long, 4-6 mm wide, densely pilose marginally, scattered pilose on the lamina, trichomes to 2 mm long; pedicels swollen distally, striate, densely pilose, 8-12 mm long; bracteoles not seen. Flowers with the calyx densely pilose, 13-13.5 mm long, pink, the tube spherical, 3.5-4.5 mm long and broad, not expanded, the limb short cylindric or some- what spreading, 9-9.5 mm long including the lobes, the lobes linear lanceolate, acute, 8 mm long, ca. 2 mm broad at the base, erect after anthesis, margin- ally with 3-4 gland-tipped fimbriae on each side, sinuses acute; corolla (past anthesis) cylindric, ca. 20 mm long, scattered pilose with the hairs denser at the lobe tips; stamens ca. 16 mm long, the filaments alternately ca. 1 mm and 3 mm long, the anthers including tubules alternately ca. 15 mm and 13 mm long, the thecae 3-4 mm long; style ca. 21 mm long. Berry not seen.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 4140
