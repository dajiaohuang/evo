    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants erect, 150-250 mm tall; leaves distant, not petiolate, blade of the lower patent, cordate, broadly elliptic, very obtuse, apiculate, 30-50 x 25-35 mm, upper rather reduced, often only present as a sheath. Inflorescences laxly 2-4-flowered, 30-50 mm long; bracts narrowly lanceolate, shorter than the ovary. Flowers to 20 mm in diameter, white. Sepals unequal, margins finely dentate; median lorate, united with the claws of the petals; laterals quadrate-rhomboid, 6 mm long. Petals spathulate, erect with the blades often curved forwards, claws 4-5 mm long and largely fused, blades fan-shaped, concave with a callus near the base, margins finely fimbriate. Lip transversely elliptic, finely and irregularly fimbriate, 7 x 12 mm. Gynostemium short; anther thecae diverging towards the base, 2.5 mm long.
