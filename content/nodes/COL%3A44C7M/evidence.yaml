    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Cormous geophyte, 20-35 cm. Leaf solitary, linear, channelled. Flowers pale pink with a bright yellow mark on each outer tepal, inner tepals trifid with a long, incurving, central cusp.
            textZh: Moraea lilacina Goldblatt & J.C.Manning 的 SANBI 物种条目记载了植株、叶片和花部形态。
            sourceIds:
              - sanbi_13878_0
            locator: Strelitzia 29; archive Morphology row 7428, source 13878.0
            placeTimeScope: Regional species account published 2012; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
          - text: Recognised by the pink to lilac flowers with outer tepals 27-30 mm long, and 3-lobed inner tepals 16-18 mm long. The inner tepals have a narrow, channelled claw but the 3-lobed limb consists of an erect central cusp ± 9 mm long and shorter rounded lateral lobes. The filaments are 7-8 mm long with a papillate or smooth column, The species is clearly allied to the widespread southern African winter-rainfall M. unguiculata, a remarkably variable species, both as regards perianth colour and size, but its critical features are inner tepals 10-12 mm long and trilobed with the central cusp linear and coiled inward, filaments usually 3-5 mm long with the column lightly to densely papillate, and the outer tepals are typically 12-16 mm long, rarely up to 24 mm long in northern Namaqualand populations. The stems in M. unguiculata are almost always branched unless depauperate due to environmental conditions but typically unbranched in M. lilacina. The outer tepals of M. unguiculata may be white to cream-coloured, brown, violet, or even dull yellow and usually have a contrasting mark at the base of the limb, and the style branches are narrow and spreading as in M. lilacina, but with erect crests 2.0-4.0(-5.5) mm long vs. 5-8 mm in M. lilacina.
            textZh: SANBI 条目提供了 Moraea lilacina Goldblatt & J.C.Manning 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: Strelitzia 42; archive Diagnostic row 94247, source 18638.0
            placeTimeScope: Regional species account published 2020; the archive excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora treatment; the cited excerpt does not independently resolve wild, cultivated, or naturalised status for each observation.
