        usage:
          title: Xylosma flexuosa (Kunth) Hemsl., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrub or small tree, 2-12 m high, the trunk to 10-12.5 cm in diam, armed or not, the spines on the trunk often branched, the spines on the branches simple, the branchlets inconspicuously puberulous to glabrous. Leaves short-petiolate, the petiole to 5(-7) mm long; blade polymorphic, glabrous, commonly elliptic to broadly elliptic, infrequently ovate (or even narrowly ovate), acute at the base, obtuse to acute at the apex, seldom obtusely acuminate, distinctly glandular- crenate-serrate along the margins, to 6(-8) cm long and 4.5 cm wide, rigid- chartaceous, ? lustrous and with the network of the veins conspicuous on the upper surface, rather dull and with the costa prominent below, the network of the veins less conspicuous on the lower surface. Flowers in fascicles or contracted racemes, dioecious, greenish to yellowish, the pedicels to 5 mm long, minutely puberulous or glabrous, bracteate at the base; sepals 4 or usually 5, broadly ovate or deltoid, acute, ca 1.5-2 mm long, spreading in c flowers, ciliolate along the margins, usually minutely puberulous on both sides; stamens ca 16-20, the filaments to 2.5 mm long, glabrous; ovary oblong-ovoid, glabrous, the placentas 2-3, each one 2-ovulate. Bacca subglobo!se, 5-6 mm in diam, at first green, turning bright red at maturity, surmounted by the persistent, 2-3-lobed style, the fruiting pedicel elongated and to 8 mm long, usually distinctly articulate ca 2 mm above the base; seeds 4-6, angulate-ovoid, to 4 mm long, the testa reddish-brown, glabrous.
          originalLanguage: en
          sourceField: general
