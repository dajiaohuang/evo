          publishedAt: undated
          originalSourceText: Glabrous shrub 1-3 m. tall; petioles stout, 1-3 cm. long; leaf-blades red-purple beneath, narrowly oblong to lanceolate, 12-25 cm. long, a fourth to a third as wide, acuminate, entire but ciliate, acute at the base, 3-nerved with a conspicuous pair of submarginal nerves; panicle small, 5-10 cm. long, sparingly branched; flowers sessile, secund, subtended by triangular bracts about 1 mm. long; hypan- thium subglobose, 2-2.5 mm. long at anthesis; calyx-tube very short, truncate or nearly so around the summit; petals white to pink, oblong-obovatlong, oblique; stamens isomorphic; anthers slenderly oblong, 1.7 mm. long, 2-celled; connective simple; ovary almost completely inferior, 5-celled; style stout, 2.5 mm. long, abruptly bent near the summit; stigma punctiform.
