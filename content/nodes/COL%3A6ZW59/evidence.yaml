        usage:
          title: Stizophyllum riparium (Kunth) Sandwith, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Liana to at least 5 cm in diameter, the bark smooth, vertically striate; stem subtetragonal with hollow center and 4 phloem arms in cross section; branchlets terete, hollow, longitudinally striate, densely short-puberulent, the nodes with- out interpetiolar glandular fields, often with lines connecting opposite petioles; pseudostipules strap-shaped, caducous. Leaves 3-foliolate or 2-foliolate with tendril or tendril scar; leaflets ovate or obovate to oblong-elliptic, acute to acuminate, truncate to subcordate, 2.9-20 cm long and 1.9-12.5 cm wide, mem- branaceous, often serrate when young, palmately nerved at the base, the secondary veins (3-)4-6 on a side, regularly sunken-lepidote beneath, hence pellucid-punctate at least when mature, puberulous on the nerves with short simple trichomes especially beneath, drying olive to brownish with the veins tannish beneath; tendril simple or rarely bifid with second arm minute, 7-15 cm long; terminal petiolules 3.2-7.2 cm long, lateral petiolules 0.7-4.0 cm long, petiole 2.0-11.0 cm long, short-puberulous. Inflorescence a few-flowered axillary raceme, the narrowly bracteate rachis and pedicels puberulous. Flowers with inconspicuous sweet odor, calyx infundibuliform, irregularly 5-lobed to bilabiate, 5-12 mm long and 4-10 mm wide, densely puberulous, glandular on the lobes; corolla uniformly white to cream, tubular, 3.2-5.0 cm long and 0.7-1.3 cm wide at the mouth, the tube 3.4-4.1 cm long, the lobes 0.5-0.8 cm long, puberulous 9utside with moniliform, glandular-lepidote, and simple trichomes, pubescent inside with moniliform trichomes on the lobes and with gland-tipped trichomes at the level of stamen insertion; stamens didynamous, the anther thecae divari- cate, sometimes slightly pubescent, 2-2.5 mm long, the longer filaments 1.5-1.8 cm long, shorter filaments 1.1-1.2 cm long, the staminode 3-5 mm long, inserted 10-12 mm from base of corolla tube; pistil 2.7-3.1 cm long, the ovary linear, tetragonal, 3.5-4 mm long and 1 mm wide, glandular-lepidote, the ovules 2- seriate in each locule; disc short-cupular, 1 mm long and 2.5-3 mm wide. Cap- sule linear, tapering toward the ends, not flattened, 24-45 cm long and 0.5-0.7 cm wide, the surface longitudinally finely striate, short-puberulous; calyx usually caducous; seeds 0.4-0.5 cm long and 1.3-2.4 cm wide, the wings membranaceous, brown, weakly demarcated.
