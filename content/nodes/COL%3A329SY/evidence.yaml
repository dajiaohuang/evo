    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Perennial dioecious creeper. Stems annual, branched, rather stout, angular-sulcate, minutely and sparsely hirsute when young, later becoming scabrid to subglabrous, geniculate and rooting at the nodes, up to 3 m long and 0. 5 cm in diam., internodes up to 20 cm long. Roots fibrous, 50-60 cm long, towards the base dilated to form cylindric, fusiform or sausage-shaped tuberous portions 5-20 cm long and 2-3 cm in diam., which are covered with a thin light-brown bark and contain a fleshy-spongy soft white tissue inside. Leaves somewhat greyish-green, rather rigid, secund, in outline ovate or ovate-oblong, deeply palmately 3-7-fid, on both sides at first finely setose-hispidulous, ultimately scabrid, 5-15 cm long and 3-9 cm wide; the lobes oblong to linear, acute, subacute or subapiculate, coarsely dentate to somewhat pinnatilobed; petioles rather stout, sulcate, at first finely aculeate-setose, ultimately scabrid, 1-5 cm long. Tendrils stoutish, rather short, distinctly thickened towards the base, minutely aculeate-setose, glabrescent, turning scabrid. Male flowers solitary or occasionally fasciculate, on slender, shortly setose-hispid pedicels 1-2 cm long; receptacle narrowly ampanulate, densely setose, about 7 mm long; sepals linear-subulate, setose, about 5 mm long; corolla yellow, 6-7 mm long. Female flowers solitary on pedicels 4-6 mm long and 1.5 mm thick; sepals and corolla as in the male flower, but larger, 7-9 mm and 9-15 mm respectively; ovary ellipsoid or somewhat ovoid, densely setose. Fruit ellipsoid or oblong, aculeate, variegated by irregularly bordered brownish-purple longitudinal bands on a greenish-white background, 3-5.5 cm long and 2-3 cm in diam., spines soft and rather thick, laterally compressed, somewhat uncinate, obtuse to subacute, finely mucronate, about 5 mm long. Seeds white, ovate-elliptic, 6-7 mm long, 3-4 mm wide and 1.5-2 mm thick.
            sourceIds:
