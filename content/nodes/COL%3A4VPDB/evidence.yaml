    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Erect shrub to 2 m tall (rarely straggling); young branches finely puberulous to pubescent. Leaves slightly anisophyllous, subglabrous to pubescent-ciliate along midrib and sometimes also larger veins beneath, subglabrous to puberulous along midrib above or sparsely puberulous to pubescent all over; petiole up to 9 mm long; lamina ovate to elliptic, largest 1.5-4.5 x 0.7-2 cm; apex broadly rounded; base attenuate to cuneate; margin entire. Flowers strongly scented, axillary, supported by ordinary leaves, widely scattered or 2-5 clustered near tip of branches; pedicels up to 1.5 mm long, puberulous, winged. Bracteoles 5-9 mm long, dark brown (yellowish brown towards margins), not glossy, oblong or broadly so, truncate with small central tooth or subacute, sparsely puberulous to pubescent (rarely densely so), margins not scarious, not frayed. Sepals subequal, 7-11 mm long, oblong, broadly rounded and apiculate, coloured as bracteoles, glabrous to puberulous or pubescent and finely ciliate. Corolla limb white (rarely with a pink tinge) with red or purple lines into throat; tube 5-7 mm long, band of hairs immediately below insertion of stamens and spreading into tube; limb 13-20 mm long, deflexed; lobes 5-6 mm long. Filaments 9-10 mm long, glabrous; anthers 2-3 mm long, glabrous or shortly bearded near middle, without basal tuft of hairs but sometimes hairy near tip. Capsule 15-17 mm long; seed c. 6 x 4 mm, with low ridges but no pectinate scales.
