  claims:
    - subjectId: event:fukangichthys-crown-actinopterygian-recalibration
      claimKind: scientific
      claimType: topology
      statement: A 2017 CT-based analysis recovered scanilepiforms including Fukangichthys as stem polypterids, shifting many Palaeozoic ray-fins onto the actinopterygian stem and moving the study's crown minimum about 45 million years younger; this topology-dependent recalibration is not the crown's birth time.
      confidence: medium
      confidenceRationale: The specimens, CT anatomy, phylogenetic matrices and revised calibrations are published with stability analyses. Medium confidence retains sensitivity to character and taxon sampling, distinguishes the 2017 placement from the 2014 neopterygian hypothesis, and avoids converting a fossil minimum into an origin time.
      referenceLinks:
        - relation: supports
          referenceId: giles-2017-ray-fin-timescale
          pages: 265–268
          figure: Figures 1–3
          quoteLocator: Main text; Methods; Supplementary Data
        - relation: contextualizes
          referenceId: xu-2014-fukangichthys-revision
          pages: 747–759
          quoteLocator: Abstract; Results of phylogenetic analysis
  claim-rationales.zh:
    - 标本、CT 解剖、系统矩阵和修订后的校准均已发表，并附稳定性分析。中等置信度保留性状和分类取样敏感性，区分 2017 年位置与 2014 年新鳍鱼位置假说，也避免把化石最小校准换写成起源时间。
  claim-statements.zh:
    - 2017 年一项基于 CT 的分析将包括 Fukangichthys 在内的 Scanilepiformes 恢复为多鳍鱼类干群，使许多古生代辐鳍鱼移至辐鳍鱼干群，并把该研究中的冠群最小校准向年轻方向移动约 4500 万年；这种依赖拓扑的重校准不是冠群诞生时间。
