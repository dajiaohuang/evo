          - text: Morphologically similar to S. candidum, but differs from this species by having lateral sepals that overlap with the outside surface of the labellum and project at a ninety-degree angle from the median sepal instead of projecting from the same plane, and lateral sepals and petals that are approximately equal in size instead of smaller lateral petals than lateral sepals, and a median sepal that is narrower and longer than the lateral sepals instead of more or less similarly-sized.
