      morphology:
        status: partially-supported
        claims:
          - text: "Terrestrial herbaceous plants with erect stems. Stem: above-ground portion excluding inflorescence 80-135 mm tall, 3.4-6.0 mm in diameter at base, vinaceous. Leaves 2, borne close to ground, frequently wilted at anthesis, 21-38 x 20-36 mm, broadly ovate, obtuse, entire, with prominent striation on underside, glabrous, pale yellowish-green to green; transition between leaves and cauline leaf sheaths abrupt. Leaf sheaths 3-4, leaving a portion of stem exposed, 22-43 x 11-23 mm, amplexicaul cupuliform, sometimes filled with water, obtuse to attenuate, apex sometimes reflexed, yellowish-pale green with maroon spots, especially dense at base. Inflorescence 42-119 mm long, 27.3-34.5 mm wide, densely congested with 6-20 flowers; bracts reflexed or partly reflexed at anthesis, 13.5-24.0 mm x 6.7-13.4 mm, lanceolate, acute to attenuate, glabrous, entire to undulate, green with maroon spots, especially around the margins and apex, and more pronounced on abaxial side. Flowers non-resupinate, white, spur tips and base of sepals and lateral petals green; sweetly scented. Ovary 5.4-7.5 mm x 3.7-5.0 mm, longitudinally ridged, minutely papillate on ridges, maroon, standing away at an acute angle from rachis. Labellum galeate, globose, with a prominent dorsal ridge, margins crisped, reflexed from apex to 90° down on each side for 0.9-1.5 mm, side of labellum forming a loose tube with sepals and lateral petals, base of labellum glabrous to sparsely papillate inside; galea aperture 3.8-4.3 mm wide and 4.1-5.7 mm tall, forward facing. Spurs 17.4-18.2 mm long, parallel to ovary. Sepals and median petals fused for 2.9-3.7 mm. Free part of lateral sepals lanceolate, acute, entire, projecting forward for 4/5 of their length, then abruptly reflexed, 9.0-10.7 mm x 4.1-4.9 mm. Free part of median sepal oblong, acute, entire to undulate, projecting forward for 4/5 of its length, then abruptly reflexed or only weakly projecting downward, 9.0-9.2 mm x 2.3-3.3 mm. Free part of lateral petals oblanceolate, obtuse, crisped, concealed by lateral sepals for about half of their width, projecting forward for 4/5 of their length, then abruptly reflexed, 9.2 mm x 2.9-4.4 mm. Gynostemium filling back of galea. Column part slightly curved away from rachis, 5.4-6.8 mm x 1.0-1.1 mm, white. Stigma projecting slightly away from rachis, obovate, emarginate, 2.1-2.4 mm x 1.7-2.2 mm. Rostellum very weakly triangular, 1.6 mm x 1.5-1.8 mm; viscidia terminal, circular, plate like. Anther reflexed and aligned with column, 1.4-1.8 mm x 1.9-2.1 mm, connective broadly retuse, not extending beyond individual anther thecae. Lateral anther appendages placed at anther base, 0.7-1.2 mm in diameter."
