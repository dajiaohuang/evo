        usage:
          title: Malvastrum americanum (L.) Torr., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Herb or suffrutex, perennial, the stem commonly branched above, up to 3 m high, stellate-tomentellous to stellate-puberulus. Leaves usually long-petiolate, the petiole up to 4 cm long, stellate-tomentellous to stellate-puberulus, the stipules subulate, 4-6 mm long; blade ovate, truncate, rounded or cuneate at the base, ob- tuse to acute at the apex, serrate at the margin, 2-7 cm long and 1.5-4.5 cm wide, stellate-puberulus on both sides, the indumentum however denser on the lower surface, the nervation prominent beneath. Flowers in dense, terminal spikes. these up to 14 cm long, the individual flowers sessile or nearly so; epicalyx bractlets nar- rowly ovate, acute or acuminate, 5-9 mm long and 1-1.3 mm broad, hispid; calyx campanulate, lobed to below the middle, 5-8 mm long, hispid, the lobes ovate, acuminate; petals 7-9 mm long and 3-4 mm wide, the claw barbate; androecium 3-5 mm long, the staminal tube stellate-pilose; styles 5-6 mm long, connate in the lower half. Mericarps 10-15, incurved-rostrate at the apex, 1.5-2 mm long and 0.8-1 mm thick, hispid toward the apex; seeds 1.2-1.5 mm long.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 7316
