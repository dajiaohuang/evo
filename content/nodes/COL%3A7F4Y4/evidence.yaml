          title: Utricularia subulata L., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Annual or perhaps perennial terrestrial herbs; stolons capillary, subterranean, bearing a photosynthetic organ and traps. Photosynthetic organs narrowly linear, 1-nerved, sometimes numerous and conspicuous but often ? decayed at anthesis, to 20 mm long and 0.5 mm wide. Traps obliquely ovoid, stalked, 0.2-0.5 mm long, the mouth lateral, the upper lip with 2 subulate sparsely branched ap- pendages. Inf lorescences to 25 cm long; peduncle capillary, 1-25-flowered; bracts peltate, orbicular to elliptic, the sterile scales numerous on the peduncle below the raceme; pedicels ascending, 2-10 mm long. Flowers with the calyx lobes + ovate, subequal; corolla yellow, usually 6-10 mm long but much reduced in cleistogamous flowers, the upper lip broadly ovate, entire, the lower lip deeply 3-lobed, the palate conspicuously bigibbous, the spur subulate, obtuse, descend- ing, about as long as the lower lip. Capsules globose, ca. 1.5 mm long, dehiscing by an abaxial ovate pore; seeds ovoid, ca. 0.25 mm long with ca. 15 longitudinal striations.
          originalLanguage: en
          sourceField: general
