      claimKind: scientific
      claimType: event-mechanism
      statement: ESEM and micro-CT observations of Triarthrus eatoni and Olenoides serratus document filament geometry and body-wall attachment consistent with a respiratory upper branch; gas exchange, flow and evolutionary homology remain functional hypotheses rather than direct physiological measurements.
      confidence: medium
      confidenceRationale: Preserved filaments and articulation are direct, whereas respiratory performance and homology rely on comparison with living arthropods.
