    - 保存的鳃丝与连接方式属于直接证据，而呼吸表现和同源关系依赖与现生节肢动物比较。
  claim-statements.zh:
    - 对 Triarthrus eatoni 与 Olenoides serratus 的 ESEM 和显微 CT 观察记录了符合呼吸上肢支的鳃丝几何与体壁连接；气体交换、流动和演化同源关系仍是功能假说，而非直接生理测量。
