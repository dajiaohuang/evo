        usage:
          title: Burmeistera vulgaris E.Wimm., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Terrestrial or rarely epiphytic suffrutescent herbs or bushy shrublets; stems hollow, glabrous, 1-3(-4.5) m tall. Principal leaves with blades usually elliptic, 5-15 cm long, (1.5-)2.5-4.8 cm wide, mostly 2.5-5 times as long as wide, apically abruptly narrowed to a broad acuminate tip, basally rounded to gradually taper- ing, marginally sinuate with low teeth and 3-5 callosities per cm, glabrous above and beneath except for the often minutely scaberulous-puberulent veins; petioles slender, glabrous to inconspicuously puberulous, 1.3-2.0(-3.0) cm long. Flow- ers 4.5-5 cm long; pedicels solitary in the upper leaf axils, appressed to wide- spreading, occasionally flexuous, glabrous, ebracteolate, 7-10(-17) cm long; hypanthium in anthesis cylindric or slightly narrowed apically and basally rounded to subacute, 8-12 mm long, 4-5 mm in diameter, ca. 1.5-2 times as long as wide; calyx lobes extremely variable, narrowly triangular, blunt, apically rounded or subacute, prominently crenate, callose-denticulate to almost entire, ascendant to spreading, 4.5-12 mm long, often foliaceous and then broadly elliptic to ob- long, coarsely toothed and (15-)20-28 mm long and 3-7 mm wide; corolla gla- brous, pale green, the tube 12-16 mm long, basally somewhat inflated, the, lobes oblong-falcate, the 2 upper lobes 10-18(-23) mm long, the lateral lobes 9-12 mm long, the lowest lobe 5-10 mm long; filament tube 26-32 mm long, distally glabrous to sparingly and inconspicuously puberulent, glabrous beneath, basally distinct but united to the corolla tube, the longer anthers 8-9 mm long, the shorter anthers ca. 5 mm long, all anthers glabrous except sometimes for a few, soft, white apical hairs. Berries much inflated, (2.0-)2.5-4.0 cm in diameter, 2.5-5.0 cm long; seeds linear-fusiform, 0.6-0.8 mm long, light brown with darker tips, mi- nutely foveate-reticulate.
