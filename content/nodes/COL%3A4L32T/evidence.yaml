    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Glandular-hairy annual to 28 cm. Leaves narrow and mostly toothed. Flowers in corymbosely arranged heads, cream-coloured to yellow, darker around throat, salver-shaped, tube hairy, 8-14 mm long.
            sourceIds:
              - sanbi_14442_0
            locator: "SANBI/WFO archive Morphology row 5891; source 14442.0; publication: Manning, JC; Goldblatt, P. 2012. Scrophulariaceae: Polycarena Benth. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 752 - 752. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Polycarena capensis is characterized by its corymbose branching, marked leafiness and heads of yellow flowers (cream on the Cape Peninsula and nearby) marked in the corolla mouth with a deep yellow or orange star and there well bearded. Only P. lilacina resembles P. capensis in habit, but its mauve flowers serve as an easy distinguishing character; the significant differences between the two species. Polycarena subtilis resembles P. capensis in the colour and markings of the corolla, but differs in its divaricate branching in floral detail. Polycarena batteniana (white flowers), P. gilioides (white, cream, pink or purple flowers) and P. gracilis (white or cream and possibly yellow flowers) all differ from P. capensis in their divaricate branching as well as in floral details other than colour.
            textZh: SANBI 条目提供了该种的鉴别特征。
            sourceIds:
