          title: Piper sperdinum C.DC., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: A low shrub; flowering internodes relatively short, densely villous with a mix- ture of scattered hairs up to 2 mm. or more long; leaves inequilaterally elliptic or subovate, the midrib much nearer one side, apex sharp and long-acuminate, base strongly inequilateral with one side 1-3 mm. shorter at the petiole and rounded- cordulate, the longer side auriculate, the lobe 1-2 cm. long and covering the petiole, 6-9 or 10 cm. wide X 15-24 cm. long, pinnately nerved from below the middle, the nerves mostly 4-5 on each side, prominent beneath and with rather prominent cross-connecting-anastomosing nervules, submarginally loop-connected, glabrous above except for a few hairs on the midrib near the base, pubescent beneath with the nerves densely so with an intermixture of spreading long hairs, margin not ciliate, obscurely glandular-dotted, drying rather papery, translucent; petiole about 3-5 plus 1-3 mm. long, densely hairy, vaginate at the base; spikes about 3 mm. thick X 6-7 cm. long, with a slender, bearded, aristate tip up to 1 cm. long; peduncle up to 2 cm. long, densely pubescent; bracts truncately triangular-sub- peltate, with usually 2-4 rather prominent dorsal setae, or glabrous, the pedicel margins setose; rachis ridges fimbriate; fruit obpyriform-trigonous, granular- papillate, stigmas slender, sessile.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 10288
