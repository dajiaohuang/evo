    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Minutely glandular-hairy annual to 12 cm. Leaves crowded basally, rounded and mostly entire. Flowers in racemes, bilabiate, tube short and inflated above, lobes very narrow, yellow to brown or maroon.
            sourceIds:
              - sanbi_14436_0
            locator: "SANBI/WFO archive Morphology row 6058; source 14436.0; publication: Manning, JC; Goldblatt, P. 2012. Scrophulariaceae: Manulea L. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 745 - 747. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Manulea pusilla is characterized by its simple stems running up into racemes, stems, calyx and outside of corolla tube clad in a mixture of gland-tipped and balloon-tipped hairs but the latter usually the most conspicuous and the apical cell small (c. 0.05 mm diam.), and leaf margins mostly entire or very obscurely serrate; if distinctly serrate, then teeth small. In contrast, M. cheiranthus (with which M. pusilla is often confused) frequently has the stem well-branched, the leaves are coarsely toothed or almost lobed, the flowers in cymules (they may be solitary in seedlings), and the balloon-tipped hairs have a remarkably large apical cell (c. 0.1 mm in diam.); balloon-tipped hairs are usually scarce on the lower part of the stem, where the hairs are gland-tipped and up to 0.3-0.4 mm long. The area of M. pusilla lies mainly north and east of that of M. cheiranthus; but the two species may meet in the vicinity of Robertson, with consequent hybridization.
            textZh: SANBI 条目提供了该种的鉴别特征。
            sourceIds:
