        claims:
          - text: Cormous geophyte, 35-50 cm, tunics woody. Leaves linear with raised margins. Flowers long-tubed, white with red markings on lower tepals, bracts ridged.
            textZh: Gladiolus debilis Sims 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_13878_0
            locator: "SANBI/WFO archive Morphology row 7195; source identifier 13878.0; cited publication: Manning, JC; Goldblatt, P. 2012. Iridaceae. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 119 - 176. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Recognised by the mostly four (rarely three) linear leaves with lightly thickened midrib and margins, striate or ribbed bracts, and white flowers marked with red on the lower tepals and often flushed pinkish on the reverse, with a cylindric perianth tube (10-)15-22 mm long expanded only near the top. The markings on the lower tepals include chevrons, diamonds or streaks and lines in regular patterns, and the base of the throat is also marked with a ring of red. Populations from the Hottentots Holland Mtns have the smallest flowers, with the lower tepal marking reduced to a small red diamond; plants on the Cape Peninsula have flowers marked with V-shaped chevrons; and those from Hermanus to Bredasdorp are marked with paired spots and streaks. Gladiolus variegatus from limestone hills on the Agulhas Peninsula has mostly three leaves, smooth bracts, and unevenly spotted lower tepals.
            textZh: SANBI 条目提供了 Gladiolus debilis Sims 的鉴别特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Diagnostic row 94587; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
