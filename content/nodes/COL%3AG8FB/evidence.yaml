        metadataVariant: 0
        usage:
          title: Archibaccharis irazuensis S.F.Blake, Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrub or woody herb to 2 m tall; stems smooth or striate, puberulent with weak, spreading, brownish, granular hairs, sometimes glabrescent. Leaves to 9 cm long, narrow, elliptic, ovate or lanceolate, basally rounded or narrowed, apically acuminate, the margins denticulate with toothlike, callose mucros, with 6 or more ascending pinnate veins on each side of the midvein, reticulate beneath, pubescent on both sides, more so beneath; petioles short or wanting. Inflorescence a flat or rounded terminal panicle to 10 cm across; peduncles and pedicels tomentose; bracts resembling small leaves, the bracteoles scalelike, 3-4 mm long. Heads disciform; involueral bracts imbricate in several unequal series, indurate, stramineous, the innermost narrowly lanceolate, 3-4 mm long, the outer series shorter, broader, and dorsally pubescent, the midvein prominent, the apices erose; outer florets 4-5 mm long, the corolla capillary, 1.5-3 mm long, apically erose or truncate, manifestly pubescent, the style exserted for less than 1/3 its length, its branches linear, somewhat flattened, dorsally papillose, not exceeding the pappus; inner florets 4-5 mm long, the corolla 3-S mm long, the tube pubescent upwards, the limb basally pubescent, lobed halfway down or less, the lobes obtuse, marginally thickened, glabrous or slightly glandular at the tips, the anthers ca. 1.2 mm long, basally auricled, the appendages narrow, the style branches flattened- fusiform, dorsally papillose-pilose, the ovary shrivelled, the pappus apically expanded. Achene flattened, 3-angled, pubescent; pappus of fine strigose bristles in one series.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 1689
          archiveSourceId: EE613792-5D94-4698-9B85-E5C66C69C99D
