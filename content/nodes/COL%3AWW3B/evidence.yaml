          originalSourceText: Shrubs or trees to 20 ft tall, the twiglets subangular, glabrous, the nodes well spaced. Leaves oblong or obovate elliptic, 7.5-8.5 cm wide, short acuminate at the apex, rounded at the base, the lateral veins ca. 12, coriaceous, glabrous; petioles to 2 cm long, stiff. Flowers not seen. Fruits oblong subrotund, to 2.0- 2.5 cm long at maturity (fide Standley & Steyermark), lightly grooved.
