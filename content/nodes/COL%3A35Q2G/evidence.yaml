        claims:
          - text: Sprawling, shortly hairy shrublet to 50 cm. Leaves opposite, ovate. Flowers in axillary cymes, magenta; floral bracts small and sepal-like. Capsules not dehiscing elastically.
            sourceIds:
              - sanbi_13987_0
            locator: "SANBI/WFO archive Morphology row 12136; source 13987.0; publication: Manning, JC; Goldblatt, P. 2012. Acanthaceae: Dicliptera Juss. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 258 - 258. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: "P. cernua is closely allied to P. decorticans as discussed under the latter. P. cernua can be separated from P. paniculata by the larger flowers; from P. transvaalensis by the shorter, narrower tertiary bracts and from P. cliffordii and P. gillilandiorum by the lack of curved eglandular trichomes between the ridges on the stem. Conservation status: P. cernua is widespread and common where it occurs; it is neither rare nor threatened."
