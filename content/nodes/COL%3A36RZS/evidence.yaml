    facets:
      morphology:
        status: partially-supported
        claims:
          - text: "Plants slender, (200-) 300-400 (-450) mm tall; sterile shoots slender, leaves usually 2, very narrowly oblanceolate to elliptic, acute, rarely petiolate, conduplicate; fertile shoots: cauline leaves usually 7, imbricate, grading into the floral bracts. Inflorescences sublax, 12-35-flowered; bracts lanceolate. Flowers facing horizontally, purple-pink, lateral sepals with a darker spot basally. Median sepal usually angled forwards, galea 6-7 x4 x 6.5-7.5 mm deep; spur narrowly cylindrical, more or less decurved, 7.5-8 mm long; lateral sepals oblong to elliptic, apiculi small, 6-7 x 3-4 mm. Petals obliquely ovate, acute, included in the galea and curved to form 2 passages to the spur,5 x 2.5-3.5 mm. Lip narrowly oblanceolate to spathulate, 4.2-4.5 mm long. Anther horizontal; stigma stipitate; lateral rostellum lobes parallel."
