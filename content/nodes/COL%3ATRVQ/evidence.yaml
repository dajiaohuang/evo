        usage:
          title: Cheiloclinium cognatum (Miers) A.C.Sm., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrub or slender tree up to 12 m. high, the branches often scandent. Leaves with the blade oblong or elliptic-oblong or ovate-oblong, obtuse or subacute at the base, acuminate at the apex, narrowly revolute and subentire or crenate at the margins, 8-20 cm. long and 2.5-8 cm. broad, chartaceous, the costa prominent on both sides. Inflorescences short-pedunculate, thyrsoid, 2-10 cm. long. Flowers congested in ultimate dichotomies or paired at the end of ultimate branchlets, the pedicel stout, very short and usually less than 1 mm. long; sepals broadly deltoid- ovate or semiorbicular, obtuse at the apex, entire or faintly erosulous at the mar- gins, 0.7-1.3 mm. long; petals 5, suberect, oblong or obovate-oblong, rounded at the apex, entire at the margins, 1.5-2.6 mm. long, subcarnose or subcoriaceous, opaque or obscurely lineolate; lips of the disc 0.3-0.4 mm. high; filaments of the stamens ligulate, 0.4-0.7 mm. long, the anthers about 0.2 mm. long and 0.3 mm. broad; ovary 1-1.3 mm. in diam., the ovules 2 per cell and collateral, the stigmas linear and obtuse. Fruits spherical or oblong-ellipsoid, up to 3.5 cm. long and 3 cm. broad, the pericarp 1-2 mm. thick, obscurely rugulose, often lenticellate; seeds few, 4-6, often superposed in pairs, ovate, up to 15 mm. long.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 6464
