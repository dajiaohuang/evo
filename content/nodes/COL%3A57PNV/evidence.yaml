        claims:
          - text: Rhizomatous perennial, up to 0.5 m tall, roots few, short and tuberous. Leaves up to 10, filiform, occasionally wavy, smooth or rarely sparsely hairy, surrounded at base by a hard, brown neck occasionally extended into a transversely striped sheath. Flowers white, spotted yellow at base, in a slender, widely spreading, few-branched raceme with minute bracts. Capsule ovoid, 5 mm long, held erect on pedicels < 10 mm long.
