    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants 300-450 mm high. Corm ± globose, ± 10 mm diam.; tunics dark brown, concentric, splitting into elliptic sections tapering into short cusps above. Stem often curving downward, simple or 1- or 2-branched from near base, sheathed below by pale, membranous cataphyll. Leaves 4, lower 2 basal, upper 2 cauline, uppermost reduced, usually entirely sheathing; blades of lower leaves reaching to between middle of stem and apex of spike, 2-5 mm wide, fairly soft-textured, main vein and margins raised. Spike (2-)5- to 14-flowered; bracts green, outer 12-25 mm long, inner ± half as long. Flowers diurnal, white or mauve; perianth tube 6-8 mm long, cylindric, wider toward mouth; tepals subequal, elliptic, 14-21 x 4-6 mm, spreading. Filaments suberect, 2-3 mm long; anthers 6.0-7.5 mm long, ?white; pollen ?white. Style branches ± 9 mm long, reaching to ± apex of anthers in closed flower. Capsules ellipsoid-oblong, 5-8 mm long. Seeds ± light brown, ovoid, with loose testa, with persistent, slender funicle.
            textZh: Hesperantha gracilis Baker 的 SANBI 物种条目记录了形态特征。
