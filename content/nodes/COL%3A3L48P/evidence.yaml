            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: A fairly slender plant, Hesperantha gracilis is recognised by the trailing stem, soft-textured, ± trailing leaves, and relatively large white to mauve flowers, with tepals 14-21 mm long and two to three times as long as the perianth tube, 6-8 mm long. Hesperantha gracilis may be most closely related to H. leucantha of interior eastern southern Africa, which has erect stems and pale pink to mauve or lilac flowers with a longer perianth tube mostly 9-16 mm long.
