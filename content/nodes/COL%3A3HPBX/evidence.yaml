        claims:
          - text: Shrub, up to 2 m high. Leaves ovate, dentate, glandular and pubescent, shortly petiolate. Inflorescence corymbose, heads with 3 flowers. Inner pappus bristles barbellate. Achenes glandular and pilose. Flowers mauve.
            sourceIds:
