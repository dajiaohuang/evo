            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Diagnosed by its 3-flowered capitula and ovate, coarsely serrate leaves with medifixed hairs. This species is superficially very similar to Gymnanthemum amygdalinum, but the latter has narrowly ovate to lanceolate leaves with sub-entire to serrulate-crispulate margins and a foliar indumentum of short-spurred hairs, and 5-flowered capitula.
