    facets:
      morphology:
        status: partially-supported
        claims:
          - text: A low, multiple-stemmed shrub 50 cm-1 m tall, very rarely to 1.5 m tall; up to 1 m in diam., rounded with numerous simple, erect stems arising from a large persistent rootstock. Stems simple, only very rarely branched, stout, 5-10 mm in diam., covered with thick reddish bark; glabrous. Leaves oblong, elliptic, oblanceolate to broadly oblanceolate, 8-14 cm long, 2.5-4.5 cm wide, acute to obtuse, minutely petiolate; heavily coriaceous, margins horny; glaucescent. Inflorescence usually solitary and terminal but occasionally several axillary inflorescences are produced; oval in bud, becoming shallowly crateriform on opening, 4-6 cm in diam.; usually sessile but occasionally stipitate. Involucral bracts 5-6 seriate; outer series very broadly ovate-obtuse, 0.7-1.0 cm long, 1.0-1.5 cm wide, glabrous but margins occasionally ciliate; inner series oblong to broadly oblong, 3-4 cm long, 0.7-1.5 cm wide, apices concave and rounded. Involucral receptacle prominent, conic acute, 1.5-2 cm wide, 1-1.5 cm high. Perianth 4-4.5 cm long; limbs slender, acuminate, 1-1.2 cm long, glabrous but apices usually crinite; claws filiform, margins strongly undulate, pubescent on inner surface otherwise glabrous, tube region 1 cm long, glabrous within. Style 4.5-6 cm long, tapering terminally, glabrous. Pollen presenter filiform, acute, 8-10 mm long. Ovary 3 mm long, covered with long straight tawny trichomes. Hypogynous scales lanceolate acute, 1 mm long, hyaline. The flowering time is dependent upon the frequency of burning and the elevation but can be expected to take place at the end of the summer growth flush between January and March.
