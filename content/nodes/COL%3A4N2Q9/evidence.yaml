      ecology:
        status: partially-supported
        claims:
          - text: The typical habitat of P. dracomontana is subalpine Themeda grassland between 1600 and 2200 m. Within this belt the species is wholly confined to a basalt substratum although occasionally it is found on shallow soils overlying the Cave Sandstone. Protea caffra occupies the adjacent but lower zone of Cave Sandstone. The ecotone between the Cave Sandstone and basalt is fairly sharp, both species being mutually exclusive. However, putative hybrids between these two species have been observed along the ecotone. These plants have the low, multiple-stemmed growth habit of P. dracomontana but tend to have branched rather than simple stems as in P. caffra.
