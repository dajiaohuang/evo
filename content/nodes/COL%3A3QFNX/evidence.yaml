    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Plants 300-400 mm high, sometimes with a single, slender branch. Corm 12-17 mm diam.; tunics of fine, soft, netted fibres. Leaves linear, fibrotic, 1.2-2.0 mm wide (possibly up to 2.5 mm when alive), when dry veins prominent and main vein hyaline and strongly raised. Spike mostly 8- to 12-flowered, slightly flexuose; bracts translucent-opaque, outer 5.5-7.0 mm long, with a single prominent median vein, apex acute, inner slightly shorter, forked apically, apices acute, light brown. Flowers ± rotate, deep mauve-pink or white, dark blue-purple in centre; perianth tube 5-8 mm long; tepals ovate, 16-18 x 8-15 mm, inner smaller than outer. Filaments 4-6 mm long; anthers (6-)7-8 mm long, dark purple; pollen evidently yellow. Style dark purple, dividing 5-7 mm opposite lower to middle 1/3 of anthers.
            textZh: Ixia longistylis (M.P.de Vos) Goldblatt & J.C.Manning 的 SANBI 物种条目记录了形态特征。
            sourceIds:
              - sanbi_18638_0
            locator: "SANBI/WFO archive Morphology row 98823; source identifier 18638.0; cited publication: Goldblatt, P; Manning, JC. 2020. Iridaceae of southern Africa. Strelitzia 42: 1 - 1159. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year is preserved in the cited reference and archive locator. The excerpt does not give a dated sampling frame or population frequency.
            lifeStatus: Regional flora account; native, naturalised, cultivated, or domesticated status is not inferred beyond explicit statements in the cited source.
          - text: Distinguished from I. polystachya first by the long style, dividing opposite the lower third of the anthers, and the particularly long, erect anthers, (6-)7-8 mm long. Another important character is the particularly narrow leaves up to 1.5 mm wide, when dry with unusually prominent veins. Ixia polystachya is very different and may not even be closely allied to I. longistylis. It has broader leaves, sometimes up to 8 mm wide, the stems are often branched and the flowers typically have shorter anthers, mostly 4-6 mm long, usually spreading ± horizontally when flowers are fully open and the style typically divides opposite the base or sometimes the middle of the filaments. Flowers of I. longistylis are deep mauve-pink (or sometimes white) with a dark purple centre, a colour rare but not unknown in I. polystachya. Ixia longistylis may be most closely allied to broad-leaved I. mostertii, which has similar, relatively large flowers with long, ascending anthers up to 9 mm long and a style dividing opposite or above the bases of the anthers.
            textZh: SANBI 条目提供了 Ixia longistylis (M.P.de Vos) Goldblatt & J.C.Manning 的鉴别特征。
