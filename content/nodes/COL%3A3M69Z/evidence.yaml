        usage:
          title: Hoffmannia pittieri Standl., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Shrubs to 8 m tall, the stouter branches smooth, drying tan, terete, glabrous, the pith porate. Leaves elliptic or obovate elliptic, 9-35 cm long, 8-12 cm wide, 2.5-3 times longer than wide, acute to cuneate, rarely subrotund at the apex, short acuminate, the acumen to 2 cm long, basally acute to attenuate acute, the costa prominulous above, prominulous to prominent beneath, often ligneous, to 2.5 mm wide, the lateral veins (11-)15-20, widely arcuate, 1(-2.2) cm apart, with 1-2 conspicuous irregular veins between each pair of lateral veins, chartaceous, usually slightly discolorous, usually drying tan or brown, glabrous; petioles 5.5- 7 cm long, 1.5-3 mm wide; stipules not seen. Inflorescences in the uppermost axils, spreading, 3-9 cm long, the primary peduncle compressed as a nodal pad, or elongate, the fasciculate branches 1-4, the flowers usually spreading. Flowers with the pedicels to 15 mm long, stiff, glabrous; hypanthium carnose, ribbed, puberulent to glabrous, the calycine teeth 4, triangular, 0.6-2 mm long; corolla yellow to greenish white, to 13.5 mm long, subcarnose, glabrous to sparsely puberulent, the lobes 4(-5), 2.3-4.3 mm long, 1.7-3 mm wide; stamens 4, the anthers 2.3-4.5 mm long, the connective not produced at apex or base, the fila- ments to 1.8 mm long; ovary 2-4-loculate, the style to 11 mm long, the stigmas usually ball shaped, 1.2-1.8 mm long, wider than the style, each stigma ovate oblong to cordate. Fruits subrotund; calycine lobes persistent, to 6.5 mm long, glabrous, drying red brown, scarcely ribbed; seeds brown, foveolate.
          originalLanguage: en
          sourceField: general
          sourceRowNumber: 11798
