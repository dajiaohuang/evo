    facets:
      morphology:
        status: partially-supported
        claims:
          - text: Densely silvery silky, ± thorny, rigid shrublet to 45 cm. Leaves opposite and imbricate, linear. Flower heads radiate, large, few in terminal clusters, purplish with white rays.
            sourceIds:
              - sanbi_14143_0
            locator: "SANBI/WFO archive Morphology row 10708; source 14143.0; publication: Manning, JC; Goldblatt, P; Beyers, JBP. 2012. Asteraceae: Eriocephalus L. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 372 - 372. South African National Biodiversity Institute, Pretoria. [CC BY]"
            placeTimeScope: Regional species account; publication year appears in the cited reference. The excerpt gives no dated sampling frame or population frequency.
            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: Closely related to E. africanus and E. eximius. Differs from E. africanus by its larger leaves, larger capitula with large conspicuous ray florets and its much-branched rigid habit. It differs from E. eximius by its pedunculate capitula.
            textZh: SANBI 条目提供了该种的鉴别特征。
            sourceIds:
