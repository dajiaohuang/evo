      statement: Phylogenomic sampling and fossil-calibrated clocks infer rapid diversification among three sampled Gondwanan frog clades near the K–Pg boundary. The modeled diversification interval is not the fossil first appearance or exact origin of Anura as a whole.
      confidence: medium
      confidenceRationale: Confidence is medium because the cited primary study directly supports the bounded divergence time statement at the supplied locator. The confidence does not extend beyond the modeled diversification interval is not the fossil first appearance or exact origin of Anura as a whole.
      referenceLinks:
        - relation: supports
          referenceId: feng-2017-frog-phylogenomics
          pages: E5864–E5870
          figure: Figures 1–4; supplementary calibrations
          quoteLocator: Phylogenomic sampling; clock models; diversification analyses
    - subjectId: taxon:anura
      claimKind: scientific
      claimType: divergence-time
      statement: The fossil-calibrated phylogeny inferred rapid diversification of three sampled Gondwanan frog clades near 66 Ma, supporting a 66 Ma–present model window for those lineages, not an Anura fossil FAD.
      confidence: medium
      confidenceRationale: "Three sampled Gondwanan frog crown lineages: the cited primary study or systematic review directly supports the stated sample, calibration or withholding boundary at the supplied locator. Confidence is medium and does not extend to a global FAD, LAD, direct ancestor or unsampled interval."
      referenceLinks:
        - relation: supports
          referenceId: feng-2017-frog-phylogenomics
          pages: E5864–E5870
          figure: Figures 1–4; supplementary calibrations
          quoteLocator: K–Pg diversification estimates for the three sampled Gondwanan clades
