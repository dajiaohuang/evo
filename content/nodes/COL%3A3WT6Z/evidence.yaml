            locator: "SANBI/WFO archive Morphology row 5923; source 14435.0; publication: Manning, JC; Goldblatt, P. 2012. Scrophulariaceae: Lyperia Benth. In: J Manning & P Goldblatt (eds), Plants of the Greater Cape Floristic Region 1: The Core Cape flora, Strelitzia 29: 744 - 745. South African National Biodiversity Institute, Pretoria. [CC BY]"
