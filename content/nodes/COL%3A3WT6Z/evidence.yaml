            lifeStatus: Regional flora account; wild, naturalised, cultivated, and domesticated status are not inferred beyond explicit source statements.
          - text: "The species is closely allied to L. tenuiflora, but it is a more robust plant, mostly broader in the leaf than L. tenuiflora (ratio of length: breadth c.2-3: 1 versus 4-5: 1) with longer pedicels (lowermost c. 18-23 mm, not 4-11 mm), and larger, hairier ovaries and capsules. The corolla limb is white (shades of pink and mauve in L. tenuiflora) and the colour-patterning around the mouth more pronounced."
