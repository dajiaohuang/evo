        claims:
          - text: "Plants slender, c. 500 mm tall; sterile shoots slender, basal sheaths usually 2, outer hyaline, inner green apically, leaves 2-4, erect, usually condupli-cate; fertile shoots: cauline leaves 6-15, imbricate, basal sheaths hyaline, apical leaves grading into the floral bracts. Inflorescences semi-dense, 10-20-flowered; bracts membranous, c. 30 mm long, apices usually reflexed. Flowers spreading, facing down at 45°, c. 20 mm in diameter, pink or white with green lip; scentless. Median sepal erect, galea 11-13 x c. 7.5 x c. 5 mm deep, upper margin incurved; spur horizontal, cylindrical, slender, apically somewhat swollen, 30-40 mm long; lateral sepals patent, concave, oblong, 11-13 x 6-8 mm, lower margin often somewhat serrate. Petals erect, twisted to face forwards, closing the spur entrance, narrowly lanceolate, with a tooth in the rear margin, apex cucullate, c. 10 x 3.6 mm. Lip half-pendent, lorate to narrowly elliptic, margins of apical 2h often serrate, c. 10 x 2-5 mm. Anther c. 4 mm long; stigma stipitate, equally tripulvinate; lateral rostellum lobes usually divergent."
