  claim-rationales.zh:
    - 多马尔食肉形类的分类表述只覆盖具名标本及所引主研究的分析范围；导航归属不表示直系祖先或普适系统树。
    - 多马尔食肉形类的地理字段只投影主研究记录的具体产地，不外推为全球分布、起源中心或完整扩散路径。
    - 多马尔食肉形类的生态字段区分保存事实与功能推断；未被标本直接记录的饮食、行为、栖息地或性能均明确保留不确定性。
    - 多马尔食肉形类的形态字段限定于主研究列明的具名标本和精确页码、图版或补充材料，不外推到整个支系。
    - 多马尔食肉形类的年代范围是主研究标本或地层背景的有界投影，不作为全球首现、末现、分化时间或连续谱系时长。
  claim-statements.zh:
    - Dormaal 样本支持 Dormaalocyon latouri 及其在已发表矩阵中的基部食肉形类位置；本资料不把它提升为食肉目冠群成员或直接祖先。
    - 本资料仅限于比利时 Dormaal 地点，不能确定早期食肉形类的完整分布。
    - 牙齿和跗骨解剖支持小型食肉动物及具树栖能力的推断，但食性和惯常运动方式未被直接观察。
    - IRSNB M2095–M2099 记录牙列，IRSNB M2107–M2109 记录所编目样本中的距骨和一件跟骨。
    - 5,600 万至 5,580 万年前的区间是有边界的 Dormaal 样本背景，并非食肉目冠群首次出现、该属末次出现或谱系延续时间。
