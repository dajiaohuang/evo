        usage:
          title: Stemodia verticillata (Mill.) Hassl., Flora of Panama (general field)
          url: https://files.worldfloraonline.org/files/MBG/Flora_Of_Panama/Flora_Of_Panama.zip
          version: WFO MBG DwC-A archive retrieved 2026-09-08
          publishedAt: undated
          originalSourceText: Erect or sprawling diminutive herbs to 15 cm tall, the stems slender, freely branching, drying angled, pilose with weak translucent hairs. Leaves opposite or ternate, broadly ovate, mostly 10-15 mm long, 8-12 mm wide, apically rounded or obtuse, basally cuneate to truncate, the margins conspicuously serrate with 7-9 teeth on each side, the teeth often double, the venation pinnate with ca. 4 lateral veins on each side, sparingly pilose on both sides, soon glabrescent above, not noticeably punctate or glandular; petioles about ? as long as the leaves, slender but broadening upwards, pilose above, pubescent beneath. Inflorescences solitary in the leaf axils, often geminate or ternate, the pedicels short, ca. 1 mm long, drying angled, ebracteate. Flowers with the calyx 5-lobed to near the base, the lobes alike, linear, separate, costate, hyaline margined, 3 mm long, glandular pilose, corolla blue or purplish with a white eye, tubular, 5 mm long, 2-lipped, the upper lip truncate, apically sinuate or emarginate, saccate, puberulent out- side, the inside bearded at the throat with stout, whitish clavate, unicellular hairs, the lower lip 3-lobed, the lobes truncate, glabrate, the tube white with dark lines, ciliate on the angles, slightly curved, otherwise glabrate outside, the inside generally pubescent on the dorsal side and near the bottom with long slender unicellular hairs; stamens 4 in 2 pairs, the ventral pair inserted ca. 1 mm above the bottom of the corolla tube, free ca. 2 mm, glabrous, the thecae reduced, ca. 0.15 mm long, parallel, separated by the somewhat enlarged connective, the dorsal pair inserted slightly unequally slightly above the ventral pair, 1 mm free, the thecae strongly divaricate, separated by the enlarged connective, 0.3 mm long, a short staminode inserted at the base of the tube between the 2 dorsal anthers; ovary glabrous, smooth, narrowly ovoid conical, compressed, the style stout, short, 1.0-1.5 mm long, basally expanded, the stigma compressed obtuse with conspicuous lateral appendages, ultimately recurving. Fruit a globose capsule ca. 1.25 mm across, dehiscing loculicidally and septicidally as far down as the septum (ca. ?/2 way down), the style persistent on 1 valve, the placenta ellipsoidal, ca. 1 mm long, extending little more than ?/2 the length of the capsule, punctate, the septum thickening, indurate below, the lower ?/2 persistent with the placenta and the lower ?/2 of the capsule, above narrow, and not persisting after dehis- cence; seeds oblong to pyriform, 0.5 mm long, brownish yellow, longitudinally ca. 8 sulcate, the surface minutely rugose.
