      ecology:
        status: partially-supported
        claims:
          - text: In this experiment, wild males showed similar phonotaxis responses to calls from wild and captive conspecifics, while Chester Zoo males responded more strongly to calls from their separately housed Chester Zoo conspecific group.
            sourceIds:
              - passos2017
            locator: Abstract, paragraphs 1–3; Methods, Study sites
            placeTimeScope: Sampled wild calls at Mangabe, Madagascar, and captive calls at Mitsinjo, Madagascar, and Chester Zoo, United Kingdom; the paper was published in 2017.
            lifeStatus: The study directly compared wild and captive male frogs; reported responses apply to the sampled animals and test conditions.
            originalLanguage: en
            textZh: 2017 年实验比较野生和圈养雄性 Mantella aurantiaca 的趋声反应。野生雄性对野生与圈养同种鸣声的反应相近，而英国切斯特动物园的雄性对本园另行饲养的同种群体鸣声反应更强。野外鸣声来自马达加斯加 Mangabe，圈养鸣声来自马达加斯加 Mitsinjo 和切斯特动物园；结果仅对应所采样个体及实验条件。
          - text: Across ten forested sites near known breeding ponds in the Mangabe-Ranomena-Sahasarotra protected area of eastern Madagascar, Mantella aurantiaca detections in 1 m² quadrats were associated with leaf-litter cover, tree-root counts, and surface temperature. The fitted mixed model reported positive coefficients for litter cover and root count and a negative coefficient for surface temperature; the article's adjacent prose describes detections as lower in the densest-root plots and reports a mean of 1.73 roots in occupied quadrats. Because the root-count summaries differ by level of comparison within this study, this record does not infer one monotonic root preference. The authors also caution that counts could vary with survey-day activity and are not a direct estimate of abundance.
            sourceIds:
              - edwards2019mantellamicrohabitat
            locator: Results and Table 2; Discussion on between-site counts and survey-day conditions.
            placeTimeScope: The survey covered ten forested sites in the Mangabe-Ranomena-Sahasarotra protected area near Moramanga, eastern Madagascar; each contained or bordered known breeding ponds. The article states that nine sites were surveyed from 28 November to 12 December 2014 and the tenth in March 2014. Surveys made one visit per site between 07:00 and 14:00; quadrats were placed along transects around breeding pools.
            lifeStatus: Wild field observations at forest sites near breeding ponds; detections and modeled associations apply to these sampled sites, quadrats, and visits.
            originalLanguage: en
            textZh: 在马达加斯加东部 Mangabe-Ranomena-Sahasarotra 保护区、靠近已知繁殖池的十处林地，1 m² 样方中的 Mantella aurantiaca 检出与落叶覆盖、树根数量及表面温度相关。混合模型中落叶覆盖和根数的系数为正、表面温度系数为负；相邻正文却将最密集根系样地的检出描述为较少，并报告有蛙样方平均有 1.73 条根。由于同一研究不同层次的根数比较不一致，本页不推断单调的根系偏好。九处样地在 2014 年 11 月 28 日至 12 月 12 日调查，第十处在同年 3 月调查；每处仅在 07:00–14:00 访问一次。作者提醒，计数会随调查日活动变化，不能直接视为丰度估计。
        gaps:
          - This playback experiment does not establish responses across all wild populations, life stages or field settings, and it does not measure reintroduction success.
          - Ten local sites and single visits do not establish habitat use across the species' range, seasons, life stages, or populations; detection counts are not population abundance estimates.
          - The paper reports different root-count directions across its fitted model, within-site prose, and denser-root cross-site discussion; no single monotonic root preference is inferred.
          - The study does not assess diet, reproduction, long-term habitat change, current distribution, or conservation trend.
      evolution:
        status: not-assessed
      distribution:
        status: not-assessed
      fossil:
